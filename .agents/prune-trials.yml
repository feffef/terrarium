# Open Prune Trials (ADR-0027). One entry per pruned problem; the verdict is due
# three days after the prune lands on `main` — ADR-0027's window runs from the
# landing, not from `opened:` below (get the real landing with
# `pnpm exec tsx scripts/prune-trial-window.ts`; see the prune-trial Skill's §1). An entry
# is deleted the moment `/prune-trial` judges it — git holds the history, this
# file holds only what is unjudged.
#
# The entry ships in the prune's own commit, so that commit is the record: to
# read back what was cut, `git log` this file. Nothing here has to be filled in
# after the PR merges.
#
# trials:
#   - problem: what the pruned prose was trying to prevent
#     territory:                     # the next trial must not overlap these
#       paths:
#         - path/or/file/touched
#       keywords:
#         - keyword or phrase
#     opened: 2026-08-23
#     proven: false                  # only when §4's Sonnet probe could not run
#     check: how you would tell this broke — written now, while you still
#            remember what the prose was for. Prose, not a command; say what
#            distinguishes real damage from a session simply using the pruned
#            topic's tools correctly.
trials:
  - problem: >
      `docs/adr/0009-session-logs-commit-directly-to-main.md` is by far the
      largest ADR (was 584 lines, ~2.7x the next-largest) — every session is
      instructed to read all ADRs before planning/structural work, so its size
      is a standing context tax. Several of its dated amendment sections carried
      investigation-narrative and stale-todo prose alongside their operative
      `**Decision.**`/`**Consequences.**` content: a "Why revisit"/"What the web
      harness actually does (measured, CLI 2.1.201)" pair of paragraphs
      re-deriving why `SessionEnd` alone doesn't work; a "Not yet built
      (follow-up gated PR)" checklist for work the very next section ("Landing
      mechanism as shipped") confirms already shipped; and three "**The
      problem.**"/"**The gap.**"-labeled incident narrations (the close-session
      front-door amendment, the truncation-sweep amendment, the `session`
      reclassification amendment) that told the same fact in twice the words
      the operative Decision/Consequences text next to them needed. Compressed
      each to its load-bearing fact plus its issue/PR pointer, touched no
      `**Decision.**`/`**Consequences.**` block anywhere (ADR-0018's bound:
      that text is never rewritten), deleted the now-stale "Not yet built" list
      outright (its own next section states it shipped), and fixed the one
      cross-reference that pointed at it. Net -27 lines (584 → 557, one file).
    territory:
      paths:
        - "docs/adr/0009-session-logs-commit-directly-to-main.md: the 'Why revisit'/'What the web harness actually does' paragraphs, the 'Not yet built' list, and the 'The problem'/'The gap' narrations in the close-session, truncation-sweep, and session-reclassification amendments"
      keywords:
        - Why revisit
        - measured, CLI 2.1.201
        - Not yet built
        - landedBy
        - reclassified as derived
    opened: 2026-09-16
    proven: true
    check: >
      Damage is a session that, needing to explain or act on the session-log
      mechanism, reads the compressed prose and either can't answer why the
      derived/authored field split exists (the self-reported fields were
      unreliable even though the transcript already had the facts), doesn't
      know that `SessionEnd` alone is insufficient (can't distinguish a freeze
      from a true end, can't block/prompt, isn't in the transcript) and so
      mis-diagnoses a missing log as a `SessionEnd`-only problem instead of
      checking the `Stop`-hook-first fallback chain and a log's own `landedBy`
      field, or treats the deleted "Not yet built" list as still describing
      unshipped work. NOT damage: a session that reads the operative
      Decision/Consequences text for the current mechanism instead of the
      trimmed narrative preamble (the intended design), or one that never
      needs this ADR this run. A Sonnet probe given only the compressed
      ADR-0009 text correctly explained why session-log fields split into
      derived-from-transcript vs. agent-authored, correctly named the
      `Stop`-hook-first / `SessionEnd`-fallback / `SessionStart`-resume-fallback
      chain (not "SessionEnd" alone) as what lands a log and `landedBy` as how
      to tell which one fired, correctly said a general reminder/block `Stop`
      hook was rejected as untested runtime behaviour rather than never
      considered, and correctly resolved a `session`-field disagreement in
      favor of the mechanical trace over the agent-typed value.
  - problem: >
      `docs/agents/github-integration.md` carried two rules with more prose than
      they now need. "Bare angle brackets vanish from a rendered title or body"
      narrated the #779 incident and a failed single-backtick-wrap attempt in
      full, even though `scripts/github-provenance-guard.ts` (issue #886) now
      denies the write before it posts — the same
      narrated-incident-a-guard-has-since-made-redundant shape already pruned
      from CLAUDE.md, ADR-0004, and ADR-0017. "`issue_write update` overwrites
      the description — it is not a comment" was a standalone 12-line section
      restating, almost word for word, what the mapping-table bullet three
      paragraphs above it already said in one line — the doc's own text
      admitted as much ("this callout exists because that placement wasn't
      visible enough to catch the mistake in practice"), the self-documented
      criterion-1 shape, though no guard covers this one. Compressed the first
      to the rule plus the guard pointer; folded the second's warning (issue
      #723) into the mapping-table bullet itself as the single home, deleting
      the standalone section rather than keeping two copies of the same rule
      in one file. A background search across the rest of the corpus (all
      `docs/agents/*.md`, the 14 repo-authored Skills, every ADR's amendment
      blocks) found nothing closer to the usual ~100-line target — the four
      prior trials already cleared the larger built-guard/incident-narration
      backlog. Net -15 lines, one file.
    territory:
      paths:
        - "docs/agents/github-integration.md: the \"Bare angle brackets vanish\" section and the \"issue_write update overwrites the description\" section (folded into the mapping-table bullet)"
      keywords:
        - bare angle brackets
        - issue_write update
        - overwrites the description
        - bareAngleBracketSpan
    opened: 2026-09-17
    proven: true
    check: >
      Damage is a session that, needing to comment on an issue without erasing
      its description, reads the compressed mapping-table bullet and either
      can't find the warning about `issue_write`'s `update`+`body` combination
      (so overwrites a description the way issue #723 did), or, needing to
      know what happens to a bare `<...>` placeholder in a GitHub body, reads
      the compressed angle-brackets section and either doesn't know to wrap it
      in a fenced code block or wrongly believes nothing catches it before
      posting. NOT damage: a session that correctly names `add_issue_comment`
      over `issue_write update` for a follow-up note, or correctly says the
      angle-bracket guard (`github-provenance-guard.ts`, issue #886) catches
      the write before it posts — the intended design — or one that never
      needs either rule this run. A Sonnet probe given only the compressed
      file text correctly named `add_issue_comment` (not `issue_write update`
      with a `body`) as the safe way to comment, correctly cited issue #723
      for why the latter is dangerous, correctly said a bare `<component-name>`
      placeholder is silently stripped as HTML and must go in a fenced code
      block (a single backtick wrap doesn't hold), and correctly identified
      that `scripts/github-provenance-guard.ts` (issue #886) enforces the
      angle-bracket rule mechanically rather than leaving it to memory.
  - problem: >
      `.agents/skills/dispatch-subagents/SKILL.md`'s two most narrative bullets
      told their incidents play-by-play rather than stating the rule plus
      evidence. The artifact-naming bullet ("Name every artifact the subagent
      writes uniquely to that subagent") walked through issue #847 in full
      ("Two agents hit this independently in one dispatch, and the orchestrator
      published a wrong root-cause diagnosis built on the clobbered output
      before the second report surfaced the real mechanism") and issue #1191
      as a second, separately-narrated recurrence, even though the rule itself
      (unique paths, including for redirected gate/test output) was already
      stated plainly right above the story. The scratch-paste bullet similarly
      narrated its own fix history ("the first fix only replaced retyping with
      read-then-paste, leaving the copy step") instead of just citing both
      issues. Neither bullet is criterion-1 bait — no built guard covers either
      rule (`docs/agents/guards.md` and the rulebook-migration-table's Built
      roster have nothing for DS-06/naming or the scratch-paste rule), so this
      is a criterion-2 (prose mass) prune: the rule and its concrete example
      stay, only the blow-by-blow of what went wrong when it happened is cut,
      folded to a trailing issue-number citation same as this file's other
      bullets. A background search across the rest of the in-scope corpus
      (all `docs/agents/*.md`, every ADR's explanatory prose, all 14
      repo-authored Skills) found no criterion-1 candidate clearing ~30 lines —
      this repo's docs are already unusually compressed, almost every other
      issue citation already a single trailing pointer, not a narrative. Net -7
      lines, one file (`.agents/skills/dispatch-subagents/SKILL.md`).
    territory:
      paths:
        - "`.agents/skills/dispatch-subagents/SKILL.md`: the \"Name every artifact the subagent writes uniquely to that subagent\" bullet and the \"Never paste a scratch/draft file's content into a review-subagent's prompt\" bullet (§3)"
      keywords:
        - name every artifact
        - uniquely to that subagent
        - gate.log
        - clobbered output
        - never paste a scratch
        - markdown links
    opened: 2026-09-18
    proven: true
    check: >
      Damage is a session dispatching subagents that, needing to know why
      artifact names must be unique or why a draft shouldn't be pasted
      verbatim, reads the compressed bullets and either doesn't realize
      redirected gate/test output needs a unique path too (not just files the
      subagent explicitly writes), doesn't know a naming collision fails
      *silently* (no error, just a wrong log quoted as the subagent's own) and
      so trusts a suspicious-looking clean result without checking for
      cross-contamination, or pastes a draft's content into a review-subagent's
      prompt by hand instead of naming the path and having it `Read` the file
      itself. NOT damage: a session that already names artifacts uniquely and
      never pastes draft content (the intended design — the incident detail
      was color, not the operative instruction), or one that never dispatches
      subagents this run. A Sonnet probe given only the compressed text
      correctly said every subagent artifact — including redirected
      `pnpm gate:scoped`/test output, even inside an isolated worktree — needs
      a path unique to that subagent, correctly said the failure mode is a
      silent collision (a well-formed log from the wrong run, not an error),
      and correctly said a review-subagent should be pointed at a file path to
      `Read` itself rather than having its content pasted into the prompt.
