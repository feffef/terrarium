# Open Prune Trials (ADR-0027). One entry per pruned problem. The window runs
# from when the prune lands on `main`, not from `opened:`;
# `pnpm exec tsx .agents/skills/prune-trial/scripts/find-trial-window.ts`
# gives it. An entry is deleted the moment `/prune-trial` judges it — git holds the history, this
# file holds only what is unjudged.
#
# The entry ships in the prune's own commit, so that commit is the record: to
# read back what was cut, `git log` this file. Nothing here has to be filled in
# after the PR merges.
#
# trials:
#   - problem: what the pruned prose was trying to prevent
#     territory:                     # the next trial must not overlap these
#       paths:
#         - path/or/file/touched
#       keywords:
#         - keyword or phrase
#     opened: 2026-08-23
#     proven: false                  # only when §4's Sonnet probe could not run
#     check: how you would tell this broke — written now, while you still
#            remember what the prose was for. Prose, not a command; say what
#            distinguishes real damage from a session simply using the pruned
#            topic's tools correctly.
trials:
  - problem: >
      The gate-run edit and git-chaining restatements in `pr-workflow.md`
      "Review before opening the PR" and `git-conventions.md` "Keep git apart
      from steps that can fail" (-2 net, from `git diff --numstat`: 8 added, 10
      deleted; this entry not counted): "edit nothing until it ends (it aborts if
      HEAD or the tree changes)" cut to "edit nothing while it runs" (the probe
      found the bare cut left it unsaid), the abort clause dropped since
      `gate-edit-guard.ts` denies the edit
      and `gate.ts` `stepAbort` aborts; the two chaining bullets tightened, every
      rule kept. Chosen after the search subagent covered CLAUDE.md,
      `docs/agents/`, rules, `guards.md`, 143 ledger files and git-log counts (not
      the tracker, which `gh` blocked, nor Skills): `edit-during-gate-run` (33
      occurrences; PRs #2314, #2450) failed as prose and the guard (#3046, #3233)
      holds it. Runners-up: CLAUDE.md "Docs you must read first" (hint-only; the
      owner accepts late reads, #2066) and `guards.md` roster. Same run judged and
      deleted the `frictions-to-fixes` trial (landed 0d4501da):
      `frictions-to-fixes-skill-gaps` 4.7% -> 2.9% (9/190 -> 2/69),
      `frictions-to-fixes-briefs-mismatch` 4.7% -> 2.9% (9/190 -> 2/69); only
      minor Frictions, the repeated one being step 5.4's simple-change test on a
      script-written ledger diff; no issue.
    territory:
      paths:
        - "docs/agents/pr-workflow.md: 'Review before opening the PR'"
        - "docs/agents/git-conventions.md: 'Keep git apart from steps that can fail'"
      keywords:
        - edit nothing while it runs
        - own Bash call
    opened: 2026-11-15
    proven: true
    check: >
      Damage is a major or blocker Friction where a session edited or committed
      during `gate:scoped`, or chained a push or commit to a gate run, and lost
      work or pushed an unreviewed head, because a cut line no longer said so.
      Compare `edit-during-gate-run` and `push-chained-to-gate-run` shares with
      `friction-rates.ts`; a clear rise is also damage. NOT damage: those entries
      at their standing rates, or a guard denial followed by a retry.
  - problem: >
      The owner-facing UI "ask first, confirm the sample" rule in CLAUDE.md "Ask
      before building" and `.claude/rules/ui-verification.md` (-1 net on two
      files, from `git diff --numstat` against the parent: 9 added, 10 deleted;
      this entry not counted): the bullet's "Owner-facing UI:" pointer and its
      separate "Clarify all user-facing UI with extra care" sentence merged into
      one sentence; the rule's second paragraph tightened; every rule kept.
      Chosen after the search subagent covered CLAUDE.md, `.claude/rules/`,
      `docs/agents/` (word counts; `guards.md`), 148 ledger files (heads of 8
      read) and one page of 100 of 1072 closed issues plus the 14 open ones (not
      older closed issues, not session logs, not guard-script headers):
      `built-before-owner-decided-ui` (8 occurrences; #3026, #3076, open #3297;
      PRs #3032, #3094, #3107, #3305) failed as prose and nothing wired holds it,
      so the cut is deliberately small and does not touch #3305's wording of the
      rule. Runners-up: `subagent-brief-defects` (guard holds placeholders only;
      its Skill home sits in an open trial), `governing-doc-read-after-draft`
      (31 words) and `frictions-to-fixes` §2 (#3326). No trial was judgeable: all
      three open ones are inside their windows.
    territory:
      paths:
        - "CLAUDE.md: 'Ask before building' bullet"
        - ".claude/rules/ui-verification.md: 'Before you build owner-facing UI'"
      keywords:
        - Ask before building
        - owner confirms each screenshot
    opened: 2026-11-16
    proven: true
    check: >
      Damage is a major or blocker Friction where a session built owner-facing UI
      without agreeing a sample, or opened a PR before the owner confirmed its
      screenshots, because a cut line no longer said so. Compare the
      `built-before-owner-decided-ui` share with `friction-rates.ts`; a clear
      rise is also damage. NOT damage: that entry at its standing rate, or
      occurrences from before the landing.
  - problem: >
      The two-depth read rule in `glassbox-curate` "How a run goes" ("Know the
      guide before you change it", 270 words cut to about 85, plus two back-
      references trimmed; -5 net, from `git diff --numstat`: 10 added, 15
      deleted; this entry not counted): the incident prose and restatements went; every
      rule kept (read the guide index and every Subject page in full before
      editing, #2943, #2927). Chosen after the search subagent covered CLAUDE.md,
      `docs/agents/` (12 files), `.claude/rules/` and Skill `#NNN` counts, 154
      ledger files (about 20 read) and 1103 issue titles (not bodies, not
      session logs): `glassbox-curate-read-first-skipped` (13 occurrences; #2987,
      #3226 not planned; PRs #2929, #2944, #3001) failed as prose and nothing
      wired checks it (`orient.ts` only records `pagesRead`). The Read bullet and
      the read-first list sit in an open trial's territory or were left alone.
      Runners-up: CLAUDE.md "Docs you must read first" (hint-only by owner
      choice, PR #2066) and the ADR-0004 rule (`merge-pr.ts` holds part). Same
      run judged and deleted two trials: the checkout-moving rule (landed
      a91e1ea1): `worktree-subagent-moves-branch` 1.5% -> 0.0% (3/206 -> 0/50),
      no issue; and the read-first lines (landed 7b365ef1):
      `dispatch-read-guard-deny` 22.1% -> 44.1% (49/222 -> 15/34), all nit or
      minor, issue #3425.
    territory:
      paths:
        - ".agents/skills/glassbox-curate/SKILL.md: 'How a run goes' opening paragraph and Orient/Read back-references"
      keywords:
        - Read before you edit
        - two depths
    opened: 2026-11-17
    proven: true
    check: >
      Damage is a major or blocker Friction where a glassbox-curate run edited
      a page without reading the index or its Subject's pages in full, and
      repeated or cut a sibling's teaching because the cut text no longer said
      so. Compare the `glassbox-curate-read-first-skipped` share with
      `friction-rates.ts`; a clear rise is also damage. NOT damage: that entry
      at its standing rate (13 occurrences before this).
