# Open Prune Trials (ADR-0027). One entry per pruned problem; the verdict is due
# three days after the prune lands on `main` — ADR-0027's window runs from the
# landing, not from `opened:` below. An entry is deleted the moment `/prune-trial`
# judges it — git holds the history, this file holds only what is unjudged.
#
# The entry ships in the prune's own commit, so that commit is the record: to
# read back what was cut, `git log` this file. Nothing here has to be filled in
# after the PR merges.
#
# trials:
#   - problem: what the pruned prose was trying to prevent
#     territory:                     # the next trial must not overlap these
#       paths:
#         - path/or/file/touched
#       keywords:
#         - keyword or phrase
#     opened: 2026-08-23
#     proven: false                  # only when §4's Sonnet probe could not run
#     check: how you would tell this broke — written now, while you still
#            remember what the prose was for. Prose, not a command; say what
#            distinguishes real damage from a session simply using the pruned
#            topic's tools correctly.
trials:
  - problem: >
      Two CLAUDE.md bullets (17 lines) narrated the pkill-teardown regression's
      internal mechanism at length — a separate "two failure modes" breakdown for
      chained kills, and the exit-code-144 arithmetic spelled out in full — where
      one merged bullet says the same rule (never hand-roll a `pkill` teardown,
      never chain a process-kill before steps that must run) with the same
      load-bearing why (self-match risk; other agents' servers in a shared
      container; a chained kill drops trailing steps silently) in about half the
      space, pointing at the issue chain instead of re-deriving it.
    territory:
      paths:
        - "CLAUDE.md: the pkill/process-teardown bullet"
      keywords:
        - pkill
        - preview.ts
        - process-killing teardown
        - SIGTERM
        - exit code 144
    opened: 2026-08-26
    check: >
      Damage is a session that hand-rolls a `pkill -f` teardown and corrupts
      another agent's server or its own chain (the failure the surviving text
      still names as the reason not to), or that chains a process-kill with
      `&&`/`;` and doesn't notice a step after it silently never ran, or that
      sees a killed process report exit 144 and misreads it as a fresh failure
      instead of the expected result of a successful kill.
      NOT damage: a session using `scripts/preview.ts` correctly; a session that
      hits exit 144 and correctly reads it as the kill having worked (that's the
      surviving text doing its job); a session citing the merged bullet instead
      of the old two.
  - problem: >
      ADR-0009's own amendment history was stated 2-3 times over: a compressed
      blurb for each amendment in a top-of-file blockquote index, the same fact
      restated in full at that amendment's own section below, and — for the
      external-session delivery mechanism — a third time in
      docs/agents/guest-contributions.md. The top index was also already stale
      (missing 3 of the doc's amendment sections), so keeping it accurate would
      have meant growing it, not just restating it. Compressed the top index to
      two load-bearing pointers (the ADR-0018/ADR-0025 path/schema renames a
      reader needs before the rest of the doc makes sense) plus one generic
      "see the dated sections below" line, and compressed the Delivery
      paragraph to a pointer at guest-contributions.md's already-authoritative
      house rules. Decision/Consequences text untouched throughout (ADR-0018).
    territory:
      paths:
        - "docs/adr/0009-session-logs-commit-directly-to-main.md: the top amendment-index blockquotes (lines 6-53 pre-prune) and the Delivery paragraph"
      keywords:
        - amendment index
        - session log delivery
        - external session
        - guest-contributions.md
        - "ADR-0009"
    opened: 2026-08-28
    check: >
      Damage is a session that, needing a specific amendment's actual decision
      (e.g. the exact Stop/SessionEnd landing mechanism, or how an external
      session's log gets delivered), stops at the compressed top index or the
      shortened Delivery paragraph and acts on a wrong or incomplete answer
      instead of opening the section/doc the surviving text points to — or a
      session that cannot locate the right section at all because the index no
      longer names it. A Sonnet probe given only the current file answered both
      "where does an external contributor's session log land, and why" and
      "where do I find the exact current landing mechanism" correctly, citing
      the specific downstream section/doc rather than the compressed index.
      NOT damage: a session reading past the compressed index into the actual
      section before asserting a mechanism detail (that's the intended
      single-home behavior working).
