# Open Prune Trials (ADR-0027). One entry per pruned problem; the verdict is due
# three days after the prune lands on `main` — ADR-0027's window runs from the
# landing, not from `opened:` below (get the real landing with
# `tsx scripts/prune-trial-window.ts`; see the prune-trial Skill's §1). An entry
# is deleted the moment `/prune-trial` judges it — git holds the history, this
# file holds only what is unjudged.
#
# The entry ships in the prune's own commit, so that commit is the record: to
# read back what was cut, `git log` this file. Nothing here has to be filled in
# after the PR merges.
#
# trials:
#   - problem: what the pruned prose was trying to prevent
#     territory:                     # the next trial must not overlap these
#       paths:
#         - path/or/file/touched
#       keywords:
#         - keyword or phrase
#     opened: 2026-08-23
#     proven: false                  # only when §4's Sonnet probe could not run
#     check: how you would tell this broke — written now, while you still
#            remember what the prose was for. Prose, not a command; say what
#            distinguishes real damage from a session simply using the pruned
#            topic's tools correctly.
trials:
  - problem: >
      CLAUDE.md's Ground rules bullet on external pack Skills, and
      `frictions-to-fixes/SKILL.md`'s §2 screening step, each independently
      re-derived the same already-mechanized rule: don't edit an external
      pack Skill's `SKILL.md` (`skills-lock.json`-keyed), because a re-install
      clobbers the edit and `pnpm verify:skills-lock` (part of `pnpm gate`,
      ADR-0015's 2026-07-11 amendment) already gate-enforces it. CLAUDE.md's
      bullet additionally previewed the mechanism's internals ("what it pins,
      and the `--write` re-pin step after a legitimate pack install") that
      ADR-0015's own amendment text already states in full — a pointer
      duplicating its referent's content, not just naming it. Compressed
      CLAUDE.md's bullet to the rule, the one-line why, the two places to put
      an improvement instead (upstream; the Skill Inventory entry), and a
      bare pointer to ADR-0015 for the mechanism. Compressed
      `frictions-to-fixes/SKILL.md`'s screening step to keep its own
      locally-relevant reasoning (the gate would reject the edit anyway, so
      screening it out here just avoids a wasted round-trip) while dropping
      its restatement of the "why" and the `skills-lock.json` definition,
      which CLAUDE.md already states and this step already cites by name.
      Net -7 lines across the two files.
    territory:
      paths:
        - "CLAUDE.md: the \"Skills … off limits to edit\" bullet (Ground rules)"
        - ".agents/skills/frictions-to-fixes/SKILL.md: \"§2. Screen against fixes already shipped\", the external-pack-Skill paragraph"
      keywords:
        - skills-lock.json
        - external pack Skill
        - verify:skills-lock
        - pack Skill's SKILL.md
    opened: 2026-09-04
    proven: true
    check: >
      Damage is a session that, needing the actual reason a pack Skill edit is
      off limits or what `verify:skills-lock` actually pins, stops at either
      compressed text and guesses wrong instead of opening ADR-0015 — or a
      session that attempts to edit a pack Skill's `SKILL.md` because the
      compressed bullet reads as less binding than the old one, or because
      `frictions-to-fixes`'s trimmed screening step no longer names
      `skills-lock.json` explicitly and the session can't recognize a
      candidate as pack-owned. NOT damage: a session opening ADR-0015 before
      asserting the mechanism's exact pinning/re-pin behaviour (the intended
      single-home behaviour working), or a session hitting `pnpm
      verify:skills-lock`'s own gate failure and fixing it from the failure
      message rather than the doc. A Sonnet probe given only the compressed
      text correctly derived that an external pack Skill's `SKILL.md` must
      never be edited, that a genuine improvement goes upstream instead, that
      a repo-specific note belongs in the Skill Inventory entry, and that the
      gate (`verify:skills-lock`) would reject the edit regardless of the
      screening step.
  - problem: >
      Two Built-mechanism rows (`docs/research/rulebook-migration-table.md`'s
      CS-01 and LS-03) each carried prose narrating internal mechanism detail
      past what compliance needs. `close-session/SKILL.md`'s "dispatched
      worktree-isolated impl agents must NOT self-invoke this Skill" paragraph
      named the internal helper (`isLinkedWorktree()`), cited "issue #449 Gap
      4" for when the guard was added, then continued into a second, only
      loosely-related explanation of how the orphan check (issue #931)
      tolerates a footer id with no matching log yet — none of which changes
      what the agent should do (don't self-invoke; the guard already refuses
      the call loudly). `log-session/SKILL.md`'s "Recovering the id" section
      similarly over-explained `session-end.ts`'s id-resolution internals
      (which env var, the `cse_…` → `session_…` transform, the transcript
      fallback) in the paragraph stating the field is a fallback, not the
      source of truth — the preceding paragraph already tells the agent how
      to type the id correctly by hand. Compressed both to state the rule and
      point at the mechanism, dropping the internal function/variable names
      and the loosely-related orphan-check tangent. Net -11 lines across the
      two files.
    territory:
      paths:
        - ".agents/skills/close-session/SKILL.md: the \"Dispatched worktree-isolated impl agents\" paragraph"
        - ".agents/skills/log-session/SKILL.md: \"Recovering the id\" section, the \"fallback, not the source of truth\" paragraph"
      keywords:
        - isLinkedWorktree
        - allow-worktree
        - session-end.ts
        - CLAUDE_CODE_REMOTE_SESSION_ID
        - Recovering the id
    opened: 2026-09-02
    proven: true
    check: >
      Damage is a dispatched worktree-isolated impl agent that self-invokes
      close-session anyway because the compressed paragraph reads as less
      binding than the old one, or a session that — hitting the guard's
      refusal — can't tell from the compressed text who *is* responsible for
      the log and gives up instead of leaving it to the orchestrator; or a
      session authoring the log's `session:` field that, needing the actual
      id-recovery mechanism (which env var, the transform, the fallback
      order), can't reconstruct it from the compressed text and either
      guesses wrong or asserts a wrong mechanism claim. NOT damage: a
      dispatched impl agent correctly not invoking close-session and leaving
      the log to the orchestrator (the intended behavior working), or a
      session typing the `session:` field from the still-intact "Recovering
      the id" first paragraph and trusting session-end.ts's stitch to correct
      it if wrong. A Sonnet probe given only the compressed text correctly
      derived that a dispatched impl agent must not self-invoke the Skill,
      that the orchestrator is the sole log author, and that a wrong typed
      `session:` value is silently corrected rather than fatal.
  - problem: >
      `.agents/skills/blog-post/SKILL.md`'s "A0. Rotation gate" section told the
      agent to run `scripts/blog-rotation.ts` (which prints `{ last, starved,
      eligible }` directly) and then spent ~30 lines re-deriving the exact same
      algorithm in prose anyway — the `last`/`recent-four` extraction, the two
      numbered rules, and the three-branch `eligible` derivation with its
      fewer-than-four-posts edge case — even though the section's own text
      already said "`scripts/blog-rotation.ts` implements the rules below
      verbatim." The script's own doc comment on `eligiblePersonas()`
      (`scripts/blog-rotation.ts` lines 36-51) already states the identical
      rule numbering, so the prose was a pure restatement of code the doc told
      you to run instead of read. Compressed A0 to: run the script, use its
      `eligible` field as given, and — for a given Persona outside that set —
      flag it but still ship it (the one disposition rule that isn't in the
      script, since the script has no concept of "given"). Deleted the manual
      last/recent-four walkthrough and the eligible-set case analysis entirely.
    territory:
      paths:
        - ".agents/skills/blog-post/SKILL.md: \"A0. Rotation gate\" section (under \"A. Candidate selection\")"
        - "scripts/blog-rotation.ts: eligiblePersonas() (the now-sole home of the algorithm)"
      keywords:
        - blog-rotation.ts
        - eligiblePersonas
        - rotation gate
        - recent-four
        - starved
    opened: 2026-09-01
    proven: true
    check: >
      Damage is a session running blog-post that, needing the actual rotation
      algorithm (e.g. to sanity-check the script's output, or because the
      script errored and it must reason about eligibility by hand), can't
      reconstruct the rule from the compressed pointer and either guesses wrong
      or gives up — or a session that reads the compressed A0 section and
      concludes it no longer needs to run the script at all (treating the
      pointer as optional rather than the actual mechanism). NOT damage: a
      session running `scripts/blog-rotation.ts` and using its `eligible` field
      directly (the intended single-home behavior working), or one that opens
      the script's own doc comment when it needs the algorithm's reasoning
      rather than just its output. A Sonnet probe given only the compressed A0
      text correctly ran the script, used `eligible` as its answer, and
      correctly derived — from the surviving text alone — that a given Persona
      outside the eligible set is flagged but still shipped, never refused or
      silently accepted.
  - problem: >
      CLAUDE.md's GitHub-provenance bullet (Working Conventions) narrated the
      commit-trailer guard's incident count and the github-provenance-guard's
      registry/fail-closed mechanics inline, even though `docs/agents/guards.md`
      already documents both guards' rule, registry, and fail-closed convention
      as the single mechanism record (guards.md's roster table and "Conventions
      every guard follows" section), and ADR-0017's 2026-08-01 amendment already
      says the guard's own deny message — not a doc — is the format's teaching
      surface. Compressed the bullet's second half to state both are
      `PreToolUse`-guarded and fail closed, pointing at `guards.md` for the
      roster, and dropped the retold incident count (issue #921) and mechanism
      internals (registry name, exact deny-message behaviour) that guards.md
      already owns. The header-format rule and example stay in CLAUDE.md
      untouched — ADR-0017 explicitly names CLAUDE.md's Working Conventions as
      that rule's home.
    territory:
      paths:
        - "CLAUDE.md: the GitHub-provenance bullet (Working Conventions), the two paragraphs after the header example"
      keywords:
        - github-provenance-guard.ts
        - commit-trailer-guard.ts
        - provenance header
        - ADR-0017
        - guards.md
    opened: 2026-08-31
    check: >
      Damage is a session that, needing the guard's actual behaviour (which
      surfaces it covers, what "fails closed" means operationally, where to
      register a newly-found provenance-carrying surface), stops at the
      compressed pointer and guesses instead of opening `docs/agents/guards.md`
      — or a session that hand-writes the commit trailer or skips the GitHub
      header because the compressed bullet reads as less binding than the old
      inline mechanism description. NOT damage: a session opening `guards.md`
      before asserting a guard's exact behaviour (the intended single-home
      behavior working), or a session relying on a guard's own deny message to
      fix a rejected call in the moment (ADR-0017's documented teaching surface
      doing its job).
  - problem: >
      CLAUDE.md's Working Conventions carried two bullets (the deferred-tool
      `ToolSearch` rule and the `ScheduleWakeup` `/loop`-only rule) that
      restated detail their own fail-closed `PreToolUse` guards already teach
      live when they fire. `loop-only-tool-guard.ts`'s own doc comment on its
      `instead` field says its per-situation alternatives list is "quoted
      verbatim in the deny message, which is the rule's whole teaching surface
      for an agent that has opened no doc" — exactly the "what to do instead,
      by situation" list and the "not a harmless no-op" consequence narration
      CLAUDE.md restated inline (verified live: this session's own
      `ScheduleWakeup` call outside `/loop` was denied with that identical
      alternatives list). `deferred-tool-guard.ts` similarly denies a call
      whose arguments match a known foreign-tool signature (e.g. `Agent`'s
      `prompt`/`subagent_type` borrowed for `TaskCreate`) with a corrective
      message naming the mistake — so CLAUDE.md's specific worked example and
      "`TaskCreate` and `Monitor`... recorded repeat offenders" aside were
      narrating the exact case the guard now catches and names itself.
      Compressed both bullets to the bare rule, the guard's existence, and the
      pointer — dropping the restated alternatives list, the "not a harmless
      no-op" elaboration, and the specific incident/example naming. The core
      imperative in each ("load the schema first"; "`ScheduleWakeup` only
      inside `/loop`") is untouched, since `deferred-tool-guard.ts` fails
      *open* on unregistered confusion shapes — the general instruction still
      carries real, guard-independent weight there, unlike the illustrative
      detail cut. Net -10 lines.
    territory:
      paths:
        - "CLAUDE.md: the deferred-tool `ToolSearch` bullet and the `ScheduleWakeup` bullet (Working Conventions)"
      keywords:
        - ToolSearch
        - deferred tool
        - deferred-tool-guard.ts
        - ScheduleWakeup
        - loop-only-tool-guard.ts
    opened: 2026-09-03
    proven: true
    check: >
      Damage is a session that, needing the actual alternative to
      `ScheduleWakeup` for a wait/poll situation, or the actual reason a
      guessed deferred-tool shape is risky, stops at the compressed bullet and
      guesses wrong instead of either opening `docs/agents/guards.md` or
      simply attempting the call and reading the guard's own deny message —
      or a session that, having been denied, still "works around" the guard
      because the compressed CLAUDE.md text reads as weaker guidance than the
      guard's own refusal. NOT damage: a session that gets denied and follows
      the deny message's own named alternative (the intended
      teach-at-the-moment-of-failure design working, per
      `loop-only-tool-guard.ts`'s own doc comment), or a session that opens
      `docs/agents/guards.md` before asserting a guard's exact behaviour. A
      Sonnet probe given only the compressed text correctly derived that
      `ScheduleWakeup` is `/loop`-only (with `stop: true` exempt everywhere)
      and that any deferred tool needs `ToolSearch` before its first call,
      trusting the guard to catch and correct a live mistake rather than
      needing the full worked example in advance.
