# Open Prune Trials (ADR-0027). One entry per pruned problem; the verdict is due
# three days after the prune lands on `main` — ADR-0027's window runs from the
# landing, not from `opened:` below (get the real landing with
# `pnpm exec tsx scripts/prune-trial-window.ts`; see the prune-trial Skill's §1). An entry
# is deleted the moment `/prune-trial` judges it — git holds the history, this
# file holds only what is unjudged.
#
# The entry ships in the prune's own commit, so that commit is the record: to
# read back what was cut, `git log` this file. Nothing here has to be filled in
# after the PR merges.
#
# trials:
#   - problem: what the pruned prose was trying to prevent
#     territory:                     # the next trial must not overlap these
#       paths:
#         - path/or/file/touched
#       keywords:
#         - keyword or phrase
#     opened: 2026-08-23
#     proven: false                  # only when §4's Sonnet probe could not run
#     check: how you would tell this broke — written now, while you still
#            remember what the prose was for. Prose, not a command; say what
#            distinguishes real damage from a session simply using the pruned
#            topic's tools correctly.
trials:
  - problem: >
      The closure-invocation rule — self-judge closure and invoke
      `close-session` yourself, including at PR-open, and a dispatched
      worktree-isolated impl agent must never self-invoke it — already failed
      as pure prose once: issue #397 (an orphaned session that never logged
      at all) and issue #483 (a "manual-nudge-closure" trend of two more
      sessions deferring self-judged closure until a human prompted it) both
      predate PR #411, which redesigned the mechanism in direct response
      (split closure into `close-session` at PR-open plus a final
      `log-session`, and introduced the `HUMAN-PROMPTED-CLOSURE` friction
      keyword as the self-report signal). rulebook-migration-table.md's
      CM-41/CM-50 rows confirm current status: only post-hoc detection exists
      (`audit-skills`' closure-nudge signals) — "the refusal shape doesn't
      exist (there is no 'session is ending' tool call to deny)" — so that
      part of the rule still needs its own prose and was left untouched.
      But the *worktree-isolation* sub-rule (CS-01, "a dispatched
      worktree-isolated impl agent must not self-invoke close-session") is
      fully guard-enforced today (H refusal): `log-session.ts --author`
      refuses to run from inside a linked git worktree unless
      `--allow-worktree` is passed, and the refusal message itself explains
      why and names the escape hatch — confirmed by reading
      `scripts/log-session.ts`'s `fail(...)` call directly. Despite that,
      this sub-rule was independently restated in full across four places —
      CLAUDE.md's "Opening the PR is also a closure point" Ground-rules
      bullet, CLAUDE.md's "Logging your session" section, `dispatch-subagents/
      SKILL.md`, and `close-session/SKILL.md` itself — the same "guard's own
      deny message is the rule's teaching surface" pattern already applied to
      the ADR-0017 provenance guard by an earlier trial. Single-homed:
      CLAUDE.md's Ground-rules bullet now points at "Logging your session"
      instead of restating re-invocation-safety and the worktree exception a
      second time; "Logging your session" absorbs the PR-open example as the
      one place stating self-judge-closure; `dispatch-subagents/SKILL.md` and
      `close-session/SKILL.md` trim their worktree-exception prose to a
      pointer plus the guard fact. Left the "three conditions for done" and
      the `HUMAN-PROMPTED-CLOSURE` paragraph in `close-session/SKILL.md`
      untouched — those are the actual self-report mechanism (CM-41/CM-50
      have no hard refusal yet), not restated incident history, so cutting
      them would remove the only signal that exists. Grepped the corpus for
      the cut phrasing ("for why and its mechanical enforcement", "for why,
      and its"): no other inbound references. Net -10 lines across three
      files (CLAUDE.md, `.agents/skills/close-session/SKILL.md`,
      `.agents/skills/dispatch-subagents/SKILL.md`) — smaller than the
      ~100-line target because the retirable mass here was genuinely this
      size once the operative CM-41/CM-50 instructions were correctly left
      standing.
    territory:
      paths:
        - "CLAUDE.md: the \"Opening the PR is also a closure point\" bullet and the \"Logging your session\" section"
        - ".agents/skills/close-session/SKILL.md: the worktree-isolation-exception paragraph"
        - ".agents/skills/dispatch-subagents/SKILL.md: the worktree-isolation-exception bullet"
      keywords:
        - self-judge closure
        - worktree-isolated impl agent must not self-invoke
        - HUMAN-PROMPTED-CLOSURE
        - issue #397
        - issue #483
        - issue #411
    opened: 2026-09-28
    proven: true
    check: >
      Damage is a session that needs one of the cut restatements — the
      worktree-isolation exception's "why" spelled out a second or third
      time, or the re-invocation-safety note duplicated in the Ground-rules
      bullet — and can't get the same outcome from the single remaining home
      or from the guard's own refusal message when it actually fires. NOT
      damage: a session correctly self-judging closure at PR-open without
      being prompted, correctly not self-invoking `close-session` from a
      dispatched worktree-isolated agent (whether because it read the
      surviving pointer or because `log-session.ts --author` refused and
      explained why), or a session that still needs to self-report a
      `HUMAN-PROMPTED-CLOSURE` friction — that instruction was not touched.
      A Sonnet probe given only the pruned text in all three files correctly
      reconstructed: self-judge closure applies at every closure point
      including PR-open; a dispatched worktree-isolated impl agent must not
      self-invoke `close-session`/`log-session`; and that this is
      guard-enforced by `log-session.ts --author`'s refusal from a linked
      worktree — so no hook ships with this prune.
  - problem: >
      `docs/adr/0017-provenance-footer-on-agent-authored-content.md`'s
      amendment blockquote opened with its own incident-history narration —
      "Amended repeatedly, 2026-07-13 through 2026-08-01 (issues #346, #710,
      #723, #737, #784) — the mechanism narrowed each time prose alone didn't
      hold; four prose-only passes across #723 didn't stop the recurrence, so
      enforcement is now the rule's only agent-facing home." This self-flags
      as criterion 1 as directly as any candidate in the corpus: five
      successive prose-only amendments across five issues, by the text's own
      account, failed to hold before enforcement was finally mechanized. That
      enforcement is fully built and wired today —
      `scripts/github-provenance-guard.ts` for GitHub bodies (including the
      angle-bracket sub-case) and `.githooks/commit-msg` →
      `scripts/provenance-footer.ts` / `scripts/commit-trailer-guard.sh` for
      commits, both confirmed live in `docs/agents/guards.md`'s roster and
      recorded `Built` in `docs/research/rulebook-migration-table.md`'s
      CM-43/CM-44 rows — so the narration was pure incident-history restating
      what the issue tracker and this file's own git history already hold,
      not the operative rule. It also duplicated a fact CLAUDE.md's Working
      Conventions bullet already states independently ("the guard's own deny
      message — not this doc — is the rule's teaching surface"), so keeping
      it here was restatement, not the only copy. Cut the narration to a bare
      dates-plus-issues pointer ("git history on this file holds the
      narrative") plus the one live fact worth keeping in this file too (the
      guard, not this prose, is the agent-facing home) — never to a ruleless
      line with no forwarding address. Left the rest of the amendment block
      (header/trailer shapes, the guard's actual behaviour, the bot-identity
      deferral) untouched — still-needed operative reference, not prunable
      mass. Grepped the corpus for the deleted phrases ("four prose-only
      passes", "mechanism narrowed each time", "intermediate attempts"): one
      hit, an archived session log quoting the old text verbatim — the
      record, not instructions, left alone. Net -2 lines, one file — smaller
      than most prior trials' mass because this same file had already been
      through one earlier `/prune-trial` cut (a *different*, 2026-07-20
      amendment of this ADR, per `rulebook-migration-table.md`'s "provenance
      6/20" row), so the corpus here was already thin. A dispatched
      full-corpus search (instruction corpus +
      `docs/research/rulebook-migration-table.md` + the issue tracker) ranked
      three runner-ups below this one: ADR-0004's 2026-07-10 amendment note
      (same shape, already terse and already resolved by a "single-home,
      don't re-enumerate" convention); CM-29's identifier-prediction rule
      (#387/#605/#628/#723 — genuinely still partially unmechanized, but
      bundled in the same CLAUDE.md paragraph as CM-32's "count over a set"
      bullet, already closed `wontfix` as a considered judgment-keep —
      touching the paragraph risked relitigating that closed territory);
      GI-01's angle-bracket bullet (issue #886 — good shape, but the doc
      prose is already two lean sentences, little left to cut).
    territory:
      paths:
        - "`docs/adr/0017-provenance-footer-on-agent-authored-content.md`: the amendment blockquote's opening incident-history sentence"
      keywords:
        - Amended repeatedly
        - four prose-only passes
        - didn't stop the recurrence
        - issues #346, #710, #723, #737, #784
    opened: 2026-09-25
    proven: true
    check: >
      Damage is a session that needs to know *why* the ADR-0017 footer rule
      is enforced by a guard rather than left to memory — e.g. justifying to
      itself or a reviewer why hand-writing the footer still gets blocked
      even after reading the ADR, or needing the amendment history to
      understand the current shape — and can't get it from the compressed
      pointer, the guard's own deny message, or git history on the file. NOT
      damage: a session that simply follows the current footer/trailer shape
      correctly, or gets blocked and self-corrects via the guard's deny
      message, without ever needing the pruned narrative — the overwhelming
      common case, and the one this rule is actually for. A Sonnet probe
      given only the compressed text still correctly identified that
      enforcement lives in the guard rather than the prose, and that the
      issue tracker and this file's git history hold the amendment history if
      ever needed.
  - problem: >
      No problem cleared the ~100-line bar this run. A full-corpus search for
      already-failed prose surfaced only territory prior trials already
      validated holding — CLAUDE.md's pkill bullet (held 2026-08-31, commit
      5906fe37) and the "Don't state anything as settled" bullet (held
      2026-08-28, commit b10e2760; its count clause separately closed
      wontfix, issue #933) — so re-pruning either would relitigate a settled
      verdict, not test a fresh one. Manual review of every other sizable
      untrialed doc (ADR-0009, ADR-0025, tenant-layers/verifying-ui-changes/
      mdc-when-to-use.md, atlas-specimen/SKILL.md, audit-skills/SKILL.md)
      found dense, non-redundant reference or decision content — no
      criterion-2 target either, confirmed by an empty issue search on each.
      Per the 2026-09-25 owner direction (commit 54d3e1b4): when nothing
      clears the bar, rewrite one whole file in simpler words instead of
      ending the run. Picked `docs/agents/domain.md` (70 lines, untrialed, no
      inbound section citations, unlike `tenant-layers.md`'s cited §1).
      Shortened every paragraph; cut four restatements (the seeding note's
      redundant customization list, a re-explanation of CLAUDE.md's own
      single-home rule, a CONTEXT-MAP.md example unrelated to domain.md's own
      content, the `/domain-modeling` Skill's reach-Skills aside). Kept every
      rule and worked example: the reading order, all three ADR-0021
      divergences, the file-structure divergence, glossary vocabulary, the
      rule of two with both its examples, ADR-conflict flagging, and the
      ADR-0006 proposal check (issue #573). Net: 671 → 578 words (-14%); raw
      line count rises slightly because the original wrote whole paragraphs
      as one unwrapped source line and this rewrite wraps at ~80 columns like
      the rest of the repo — word count is what actually shrank. Grepped for
      inbound references: only whole-file pointers (CLAUDE.md, ADR-0026,
      `setup-matt-pocock-skills/SKILL.md`, two spec fixtures), none
      section-scoped, so nothing broke.
    territory:
      paths:
        - "docs/agents/domain.md (whole-file language simplification)"
      keywords:
        - rule of two
        - domain-modeling Skill's generic templates
        - ADR-0021
    opened: 2026-09-26
    proven: true
    check: >
      Damage is a session that needs a cut aside — the single-home-rule
      restatement, the CONTEXT-MAP example, or the Skill's reach-Skills list —
      and can't get the same outcome from the surviving text or from
      CLAUDE.md/CONTEXT-MAP.md directly. NOT damage: a session correctly
      following the reading order, the ADR-0021 divergences, the rule of two,
      ADR-conflict flagging, or the ADR-0006 proposal check from the
      rewritten text. A Sonnet probe given only the rewritten file (verified
      at the correct commit after an initial stale-worktree false start)
      correctly named the reading order, all three divergences, the rule of
      two's threshold with both worked examples, and the ADR-0006 check with
      issue #573 — so no hook ships with this rewrite.
  - problem: >
      No problem cleared the bar this run either. A full-corpus search (two
      dispatched passes) for already-failed prose surfaced only territory
      already settled: issue #1293's CLAUDE.md `run_in_background: true`-
      from-the-outset bullet looked live at first (two recurrences cited) but
      turned out to already be pruned to its goal-shaped minimum on
      2026-09-22 and already validated holding by a 2026-09-26 verdict —
      #1293 itself was still open only because that verdict's "then close
      this issue" follow-through was never done; closed it now, no new
      trial needed. Every other open-issue candidate the searches surfaced
      (GI-01, IT-07/08, BP-05, CM-41) was already resolved by a prior trial
      or a since-built mechanism, confirmed by reading the actual ledger
      commits, not just titles. Per the 2026-09-25 owner direction, rewrote a
      whole untrialed file in plainer words instead of ending the run:
      `docs/agents/git-conventions.md` (1129 words, dense but confirmed by
      `rulebook-migration-table.md`'s GC-01..15 rows to carry zero recorded
      incidents on any of its rules — a language-only target, not a
      criterion-1 one). Tightened every section's wording and cut restated
      framing (e.g. "This is the same 'check first, don't silence' discipline
      as the branch-rename-chaining and pkill-chaining footguns above,
      generalized" folded into one sentence); kept every rule, every issue
      citation, and the two worked examples (the `specimen.value?.slug`
      rename, the shallow-merge-base revert-branch case) verbatim in
      substance. Verified two inbound references before cutting anything —
      `scripts/gate.ts` and `scripts/git-helpers.ts` both cite this file by
      name as the canonical explanation of why a shallow clone is unsafe to
      read history from (an archived session log records a near-miss where
      an earlier `/prune-trial` almost gutted this exact section) — kept the
      under-report/revert-branch substance intact, compressed only the
      wording around it. Net: 1129 → 971 words (-14%), 140 → 124 lines.
      Grepped the corpus for the renamed section headings and cut phrases:
      no inbound references found.
    territory:
      paths:
        - "docs/agents/git-conventions.md (whole-file language simplification)"
      keywords:
        - shallow merge-base can under-report
        - specimen.value?.slug
        - never chain a push right after starting a backgrounded check
    opened: 2026-09-27
    proven: true
    check: >
      Damage is a session that needs one of the cut framing asides — the
      explicit "same discipline as the pkill-chaining footgun" cross-
      reference, or any other restated justification — and can't get the
      same operative rule from the rewritten text. NOT damage: a session
      correctly fetching before trusting history, scoping a pickaxe search to
      `origin/main`, treating a clean merge as unproven on a restructured
      file, refusing to trust a shallow checkout's history, using `-F` for a
      backtick-bearing commit message, not `&&`-chaining a branch
      rename/backgrounded check into what follows it, checking `git status`
      before a destructive command, or reading `git log origin/main..HEAD`
      before acting on a Stop-hook "Unverified" flag — all from the rewritten
      text alone. A Sonnet probe given only the rewritten file correctly
      reconstructed every one of those rules, including the specific remedy
      commands (`git fetch --unshallow`, `git rev-parse --verify <branch>`,
      `git add -A` after a stash-pop-around-a-rename) and every cited issue
      number — so no hook ships with this rewrite.
