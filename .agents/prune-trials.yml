# Open Prune Trials (ADR-0027). One entry per pruned problem. The window runs
# from when the prune lands on `main`, not from `opened:`;
# `pnpm exec tsx .agents/skills/prune-trial/scripts/find-trial-window.ts`
# gives it. An entry is deleted the moment `/prune-trial` judges it — git holds the history, this
# file holds only what is unjudged.
#
# The entry ships in the prune's own commit, so that commit is the record: to
# read back what was cut, `git log` this file. Nothing here has to be filled in
# after the PR merges.
#
# trials:
#   - problem: what the pruned prose was trying to prevent
#     territory:                     # the next trial must not overlap these
#       paths:
#         - path/or/file/touched
#       keywords:
#         - keyword or phrase
#     opened: 2026-08-23
#     proven: false                  # only when §4's Sonnet probe could not run
#     check: how you would tell this broke — written now, while you still
#            remember what the prose was for. Prose, not a command; say what
#            distinguishes real damage from a session simply using the pruned
#            topic's tools correctly.
trials:
  - problem: >
      CLAUDE.md "Docs you must read first" git bullet cut (-1 net, from
      `git diff --numstat`: 2 added, 3 deleted; this entry not counted): the
      list of mutating commands (commit, fetch, pull, rebase, amend, reset)
      dropped, since the rule is already "beyond the read-only ones"; the
      trigger string `read-first-hint.ts` quotes stays. Chosen after the search
      subagent covered the instruction corpus, guard headers and the tracker:
      the read-first block failed as prose (#1754, #1819, #2066, #2475, #2543;
      ledger `binding-docs-skipped`), and the hints cover only git, GitHub,
      issue writes and screenshots. Little text to cut. Left alone: the "Every
      subagent brief" bullet and "Verify before you state" (open
      dispatch-subagents trial), "Question the premise" (owner-approved wording),
      the foreground-gate bullet (already trialled, #2426 closed). Same run
      judged and deleted the `pr-workflow.md` review-before-push trial (landed
      67c211d6): 36 sessions started since, no major or blocker Friction traces
      to it; rates flat (prepush-gate-review-skipped 10.7% -> 10.3%); the one
      rise, edit-during-gate-run 12.6% -> 17.2% (5 of 29 sessions), is edits
      made while a gate ran, which the cut text did not touch, so no issue.
    territory:
      paths:
        - "CLAUDE.md: 'Docs you must read first', the git bullet"
      keywords:
        - Before your first git command
    opened: 2026-11-03
    proven: true
    check: >
      Damage is a major or blocker Friction where a session ran a mutating git
      command (commit, rebase, reset...) without reading git-conventions.md
      and the missing command list would have prevented it. NOT damage: a late
      read the hint already counts as accepted (`binding-docs-skipped`).
  - problem: >
      Backgrounding prose in the guard comments and `dispatch-subagents` §3
      (-21 net, from `git diff --numstat` against the parent: 9 added, 30
      deleted in `subagent-background-guard.ts`, `double-background-guard.ts`
      and the SKILL's foreground bullet; this entry not counted): doc comments
      restating what the code or deny message already says ("never throws",
      "always exits 0", the signal-by-signal recap) cut; the foreground bullet
      now says a guard denies a subagent's background run. Chosen after the
      search subagent covered the instruction corpus, guard headers and the
      tracker: backgrounding failed as prose (#694, #814, #964, #1208; #2310
      and #2426 closed not planned; ledger `double-background` 23 occurrences)
      and three wired guards now hold it, so it is the safest prune on the
      board. Little text left to cut: the deny messages and CLAUDE.md's
      run-in-background bullet stay. Runners-up: read-first docs (git bullet
      is an open trial), close-session closure, code-review before first push
      (trialled, #2748 closed not planned). Same run judged and deleted the
      `git-conventions.md` no-chaining trial (landed ba5ae39d): 41 sessions
      since, one nit-level chain with no push; rates push-chained-to-gate-run
      3.3% -> 2.9%, chained-git-step-fails-silently 2.7% -> 0.0%.
    territory:
      paths:
        - "scripts/hooks/subagent-background-guard.ts and double-background-guard.ts: doc comments"
        - ".agents/skills/dispatch-subagents/SKILL.md: the foreground bullet in §3 'Stranding'"
      keywords:
        - run every check in the foreground
    opened: 2026-11-04
    proven: true
    check: >
      Damage is a major or blocker Friction where a dispatched subagent
      backgrounded a command or stalled waiting, or a session misread a
      double-backgrounded command as finished, and the cut wording would have
      prevented it. NOT damage: the nit-level `double-background` hits the
      guard denies and the session fixes at once, which is its standing rate.
  - problem: >
      The gate-freeze prose in `pr-workflow.md` "Review before opening the PR"
      (-1 net, from `git diff --numstat`: 15 added, 16 deleted; this entry not
      counted): "last on the final head and edit nothing until it ends" now
      names the reason ("the gate aborts if HEAD or the tree changes"); the
      "run it first for any other change" clause and some wrapping cut. Chosen
      after the search subagent covered the instruction corpus, guard headers
      and the tracker: the freeze failed as prose (ledger `edit-during-gate-run`,
      24 occurrences, 6 fixes; #2579 closed not planned) and
      `scripts/gate/gate.ts` now aborts a run whose HEAD or tree changed
      (`stepAbort`), so it is the safest prune on the board. Little text to cut.
      Runners-up: first-push `code-review` (`prepush-gate-review-skipped`; no
      guard, #2748 closed not planned) and CLAUDE.md's run-in-background bullet
      (low mass). Same run judged and deleted the `dispatch-subagents`
      "candidate material" trial (landed 8b32b026): 44 sessions ended since, no
      major or blocker Friction traces to it; relayed-subagent-claims 12.8% ->
      14.3% (19/148 -> 5/35), counts-not-tallied 8.8% -> 5.7%. The one moderate
      hit (adopted a reviewer's lint claim, gate red) was a code claim, not cut
      prose, and CLAUDE.md "Verify before you state" still covered it; no issue.
    territory:
      paths:
        - "docs/agents/pr-workflow.md: 'Review before opening the PR'"
      keywords:
        - edit nothing
    opened: 2026-11-05
    proven: true
    check: >
      Damage is a major or blocker Friction where a session edited during
      `gate:scoped` or pushed a head the gate never covered, and the dropped
      sentence would have prevented it. NOT damage: the nit/minor
      `edit-during-gate-run` hits that the gate's own abort catches, its
      standing rate (compare its share of sessions with `friction-rates.ts`).
