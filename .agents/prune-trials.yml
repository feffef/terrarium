# Open Prune Trials (ADR-0027). One entry per pruned problem; the verdict is due
# three days after the prune lands on `main` — ADR-0027's window runs from the
# landing, not from `opened:` below. An entry is deleted the moment `/prune-trial`
# judges it — git holds the history, this file holds only what is unjudged.
#
# The entry ships in the prune's own commit, so that commit is the record: to
# read back what was cut, `git log` this file. Nothing here has to be filled in
# after the PR merges.
#
# trials:
#   - problem: what the pruned prose was trying to prevent
#     territory: [paths, keywords]   # the next trial must not overlap these
#     opened: 2026-08-23
#     proven: false                  # only when §4's Sonnet probe could not run
#     check: how you would tell this broke — written now, while you still
#            remember what the prose was for. Prose, not a command; say what
#            distinguishes real damage from a session simply using the pruned
#            topic's tools correctly.
trials:
  - problem: >
      Four documents (~354 lines) explaining three `PreToolUse` guards that
      already enforce their rules mechanically, plus CLAUDE.md bullets retelling
      each guard's incident history. The same design conventions — fail-closed,
      matcher-scoping, how to extend, "does PreToolUse fire here" — were stated
      three times over. Consolidated into one `docs/agents/guards.md` index; each
      rule stays in CLAUDE.md as a goal-shaped line, each guard's rationale stays
      in its own script header.
    territory:
      - docs/agents/guards.md
      - docs/agents/{deferred-tool,loop-only-tool,subagent-background}-guard.md (deleted)
      - docs/research/deferred-tool-guard-hook-viability.md (deleted)
      - CLAUDE.md: the ToolSearch, ScheduleWakeup and subagent-background bullets
      - keywords: PreToolUse, deferred tool, ToolSearch, ScheduleWakeup, /loop,
        run_in_background, fail-closed, guard registry, matcher
    opened: 2026-08-23
    check: >
      Damage is a session that cannot act on what the prose used to spell out:
      guessing a deferred tool's argument shape instead of loading it via
      ToolSearch; reaching for ScheduleWakeup as a wait/poll outside /loop, or
      not finding send_later as the alternative; a dispatched subagent
      backgrounding a command and stalling; or a maintainer extending a guard
      who has to re-derive the matcher-scoping or fail-closed conventions, or
      asks where a guard's design rationale went.
      NOT damage, though each trips a keyword grep: a guard firing and the
      session correctly following its deny message (that is the mechanism
      working); a session citing docs/agents/guards.md; a session discussing
      these tools correctly. Read every hit in full before counting it.
  - problem: >
      pr-workflow.md narrated a full investigation of a multi-issue PR silently
      leaving all-but-the-first `Closes #N` issue open (PR #955 vs #985, ruled-out
      causes, the GitHub-pipeline theory) behind a fix that's already built:
      `scripts/merge-pr.ts` self-heals it post-merge, comma-joined or
      one-per-line alike. issue-tracker.md separately restated the comma-join
      symptom as if nothing covered it. Trimmed both to the operative rule plus
      a pointer to the self-heal and issue #983.
    territory:
      - docs/agents/pr-workflow.md: the Closes-keyword self-heal paragraph
      - docs/agents/issue-tracker.md: the comma-join bullet (now a pointer)
      - keywords: Closes #N, Fixes #N, closing keyword, merge-pr.ts self-heal,
        #983, #955, #985
    opened: 2026-08-24
    proven: true
    check: >
      Damage is a PR merged through `merge-pr.ts` that still leaves a named
      issue open with nobody catching it, or a session that — after reading
      only the surviving text — doesn't fall back to a manual `issue_read`
      check when it lands a PR through some other path (hand-rolled
      `merge_pull_request`, the web UI). A Sonnet probe given only the
      surviving text answered both branches correctly (self-heal covers the
      `merge-pr.ts` path, manual verification needed on any other path).
      NOT damage: a session trusting `merge-pr.ts`'s self-heal and not
      manually re-verifying every closed issue (that's the mechanism working);
      a session citing pr-workflow.md's pointer instead of the old narrative.
  - problem: >
      Four CLAUDE.md bullets (49 lines) restated the same "verify before you
      assert" duty four times over — an identifier, a subagent/doc/self claim,
      an out-of-band claim, and a set-count — each with its own worked example
      and issue citation. Collapsed into one bullet stating the shared rule
      once ("Don't state anything as settled unless you verified it fresh,
      this turn, against a primary source"), covering all four cases in one
      pass, with a compact incident-history pointer instead of four narrated
      incidents.
    territory:
      - CLAUDE.md: the identifier/claim/out-of-band/count-verification bullet
        (now one bullet beginning "Don't state anything as settled")
      - keywords: locally observable primary source, reconstruct an
        identifier, confirmed out-of-band, count is not a fact, verify before
        asserting
    opened: 2026-08-25
    proven: true
    check: >
      Damage is a session that ships an unverified identifier, claim, hearsay
      confirmation, or grepped count because the merged bullet no longer
      spells out a case the old four-bullet version named explicitly — e.g.
      citing a script's behavior without reading it, asserting a causal root
      cause from code inspection alone, trusting another session's "a human
      confirmed this" without asking, or reporting a grep-derived count as
      settled fact. A Sonnet probe given only the surviving bullet answered
      all four of those situations correctly (resolve the identifier fresh;
      trace/execute before asserting the cause; confirm with the human before
      acting on hearsay; label the grep count heuristic or verify each hit).
      NOT damage: a session performing the same verification under the new
      wording, or citing the merged bullet instead of the old four.
