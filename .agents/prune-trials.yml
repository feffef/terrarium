# Open Prune Trials (ADR-0027). One entry per pruned problem; the verdict is due
# three days after the prune lands on `main` — ADR-0027's window runs from the
# landing, not from `opened:` below (get the real landing with
# `pnpm exec tsx scripts/prune-trial-window.ts`; see the prune-trial Skill's §1). An entry
# is deleted the moment `/prune-trial` judges it — git holds the history, this
# file holds only what is unjudged.
#
# The entry ships in the prune's own commit, so that commit is the record: to
# read back what was cut, `git log` this file. Nothing here has to be filled in
# after the PR merges.
#
# trials:
#   - problem: what the pruned prose was trying to prevent
#     territory:                     # the next trial must not overlap these
#       paths:
#         - path/or/file/touched
#       keywords:
#         - keyword or phrase
#     opened: 2026-08-23
#     proven: false                  # only when §4's Sonnet probe could not run
#     check: how you would tell this broke — written now, while you still
#            remember what the prose was for. Prose, not a command; say what
#            distinguishes real damage from a session simply using the pruned
#            topic's tools correctly.
trials:
  - problem: >
      `.agents/skills/dispatch-subagents/SKILL.md`'s "Run verification... in the
      foreground and wait" bullet (§3) spent about half its ten lines restating
      what `scripts/subagent-background-guard.ts`'s own deny message
      (`formatGuardMessage()`) already says verbatim when it fires: that no
      wake mechanism resumes a stopped subagent, that the guard denies
      backgrounding outright with no bypass, and the foreground/split/
      `preview.ts` alternatives — the same
      narrated-mechanism-a-guard-already-teaches-live shape already pruned
      elsewhere (CLAUDE.md's Built-guard bullets, ADR-0017). The residual is
      NOT covered by the guard's deny message and stayed: naming a log-file
      completion marker as the concrete way to confirm a still-running check
      finished, that `Monitor` is guard-denied too (issue #995) so it isn't a
      valid substitute, and resuming a stalled subagent via `SendMessage` with
      the log's actual tail pasted in (issue #602). Verified the guard's
      current deny text line-by-line against the doc bullet before cutting —
      only the duplicated half went. Grepped for inbound references to the cut
      wording first (none, one unrelated similarly-worded CLAUDE.md bullet
      about `Monitor`-on-Bash left untouched, own separate rule/territory). A
      dispatched full-corpus search (rulebook-migration-table.md, guards.md's
      built roster cross-referenced against every doc citing each guard, the
      tracker for repeated-failure rules) found this the only candidate close
      to criterion 1 — this repo's docs are already unusually compressed after
      five prior trials; nothing else cleared even this modest bar. Net -3
      lines, one file.
    territory:
      paths:
        - "`.agents/skills/dispatch-subagents/SKILL.md`: the \"Run verification (`pnpm gate:scoped`...) in the foreground and wait\" bullet (§3)"
      keywords:
        - Run verification
        - subagent background guard
        - log-file completion marker
        - completion signal
        - log's actual tail
    opened: 2026-09-20
    proven: true
    check: >
      Damage is a session dispatching subagents that, needing to know how to
      handle a verification check that might outrun one foreground call, reads
      the compressed bullet and either doesn't know a log-file marker (not
      `Monitor`) is the way to confirm completion, tries `Monitor` anyway
      believing it's a valid wait mechanism for a subagent (it's guard-denied,
      issue #995), or resumes a stalled subagent with a bare `SendMessage`
      instead of pasting the log's actual tail — guessing at where the check
      landed instead of grounding the resume in real output. NOT damage: a
      session that gets denied by the guard on an attempted background/
      `Monitor` call and follows the guard's own deny message (the intended
      teach-at-the-moment-of-failure design — the "why" and "foreground/split/
      preview.ts" detail live there now, not in this doc), or one that never
      dispatches subagents this run. A Sonnet probe given only the compressed
      bullet correctly said the guard denies backgrounding `pnpm gate:scoped`
      outright with no way for the subagent to background-and-check-later,
      correctly named a log-file marker (not `Monitor`, which it explicitly
      said is NOT a valid way to wait) as the completion signal, and correctly
      said a stalled subagent is resumed via `SendMessage` with the log's
      actual tail pasted in so the resume is grounded in real output rather
      than guessed.
  - problem: >
      CLAUDE.md's "Start a command expected to run long... with
      `run_in_background: true` from the outset" bullet (Working conventions,
      added by PR #1282, merged 2026-09-20) already failed twice in the two
      days since it landed — issue #1293 documents both recurrences
      (`session_01HbkYXnpBCjE5XwVW2oe3ee`, `session_017p22GBvyCixua5EXU8Ynad`),
      one with `docsRead` confirming the bullet was actually opened that
      session and the foreground-timeout auto-background happened anyway. The
      issue concludes a wording pass doesn't fix this ("the prose was read and
      the failure happened anyway") and recommends a mechanical `PreToolUse`
      guard, flagged for a human since `frictions-to-fixes/SKILL.md` §3 bars
      dispatching a guard-touching fix unattended — so this is criterion 1
      (prose that already failed) with nothing built yet to hold the
      behaviour: the riskiest shape per this Skill's own framing, but the
      prose is already failing at full length, so shrinking it to the goal
      costs nothing further. Cut the trailing why-clause (already
      re-explained the tail-piping guard's mechanism, itself stated two
      bullets above) to a bare issue pointer; kept the what/where (the
      `run_in_background: true`-from-the-outset instruction and the
      scratchpad-logging destination) since the probe (below) still needed
      them literally. Grepped the corpus for other copies of this wording —
      none; only CLAUDE.md states it. Net -2 lines, one file. Small mass, but
      the only criterion-1 candidate found in a background full-corpus survey
      (CLAUDE.md, docs/agents/*.md, docs/adr/* prose, all 14 repo-authored
      Skills); two runner-ups (`docs/agents/pr-workflow.md`'s verdict-before-
      merge steps, issue #1276; `blog-post/SKILL.md`'s causal-attribution
      bullet, issue #1168) were both rejected as mostly load-bearing
      reference material with less prunable mass. Building the guard #1293
      recommends is out of scope for this trial (Bounds: "changing what runs
      unattended is not a prune — escalate that"); #1293 already tracks it.
    territory:
      paths:
        - "CLAUDE.md: the \"Start a command expected to run long... with `run_in_background: true` from the outset\" bullet (Working conventions)"
      keywords:
        - run_in_background: true` from the outset
        - known-long command
        - auto-background at the 2-minute timeout
        - issue #1293
    opened: 2026-09-22
    proven: true
    check: >
      Damage is a session running a command it should already expect to run
      long (the full gate, `gate:scoped`, a build, `test:e2e`) that reads the
      compressed bullet and either runs it in the foreground anyway without
      `run_in_background: true`, or reaches for a hand-rolled `nohup … &`
      instead of the tool's own flag, and gets a silently-wrong status when
      the 2-minute default timeout auto-backgrounds it. NOT damage: a session
      that already starts such a command backgrounded from the outset (the
      intended behaviour), one that never runs a long command this run, or a
      recurrence identical in shape to the two #1293 already cites (that
      issue's open guard recommendation is the tracked response to those, not
      a new finding for this trial). A Sonnet probe given only the compressed
      bullet correctly said to pass `run_in_background: true` on the Bash-like
      call from the start rather than defaulting to foreground, correctly
      named the danger as a silently wrong status (not just slower turnaround)
      from the 2-minute auto-background, correctly said to log to the
      scratchpad directory, and correctly said the flag has to be set before
      starting the command, not added after — a command already running in
      the foreground can't be reclassified as backgrounded once launched.
