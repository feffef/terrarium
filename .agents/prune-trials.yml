# Open Prune Trials (ADR-0027). One entry per pruned problem; the verdict is due
# three days after the prune lands on `main` — ADR-0027's window runs from the
# landing, not from `opened:` below (get the real landing with
# `pnpm exec tsx scripts/prune-trial-window.ts`; see the prune-trial Skill's §1). An entry
# is deleted the moment `/prune-trial` judges it — git holds the history, this
# file holds only what is unjudged.
#
# The entry ships in the prune's own commit, so that commit is the record: to
# read back what was cut, `git log` this file. Nothing here has to be filled in
# after the PR merges.
#
# trials:
#   - problem: what the pruned prose was trying to prevent
#     territory:                     # the next trial must not overlap these
#       paths:
#         - path/or/file/touched
#       keywords:
#         - keyword or phrase
#     opened: 2026-08-23
#     proven: false                  # only when §4's Sonnet probe could not run
#     check: how you would tell this broke — written now, while you still
#            remember what the prose was for. Prose, not a command; say what
#            distinguishes real damage from a session simply using the pruned
#            topic's tools correctly.
trials:
  - problem: >
      `docs/adr/0003-agent-operating-model-and-governance.md`'s "Auto-merge
      exemption ledger" section carried 12 dated amendment blockquotes (~120
      lines) layered on top of a 6-row table that is itself the current,
      load-bearing fact — the classic "narrowed repeatedly" shape this Skill's
      §2 flags. Several amendments were pure narration of a ledger-row addition
      the table's own `date` column already states (the 2026-07-09 audit-docs
      grant, the 2026-07-09 audit-skills grant, the 2026-07-12 blog-post grant,
      the 2026-07-25 digest archive-sweep-scope note — each just re-said "row
      X was added/scoped on date Y", already visible in the table). One
      amendment (2026-07-06, "digest auto-merges via `enable_pr_auto_merge`")
      was flatly **superseded by a later amendment in the same file**
      (2026-07-30: that mechanism is wrong, `merge-pr.ts`/`pr-workflow.md` is
      now the sole path) — textbook prose that already failed, self-documented
      in its own corpus. Compressed to: the table (untouched — it is the single
      home for scope), the one amendment CLAUDE.md's Ground-rules bullet
      explicitly points to for "the full rule and rationale" (2026-07-07,
      PR auto-open — kept, lightly trimmed of restated rationale already
      implicit in its own text), a single consolidated note carrying the three
      facts the table doesn't hold (remit-vs-Skill, review-agent's live form,
      `kind` is descriptive not a merge permission) plus a pointer to
      `pr-workflow.md` for mechanics, and the three amendments that still state
      a real, non-tabular policy addition (ADR-0020 Trusted green-light,
      ADR-0022 auto-triage's one relaxation, ADR-0027 prune-trial's Human-only
      reach) — each trimmed to its rule + pointer, since the cited ADR is each
      one's own single home. Decision and Consequences untouched, per
      ADR-0027's bound. Net -74 lines (214 → 140, one file).
    territory:
      paths:
        - "docs/adr/0003-agent-operating-model-and-governance.md: the \"Auto-merge exemption ledger\" section's amendment blockquotes"
      keywords:
        - auto-merge exemption ledger
        - chartered job
        - remit
        - review-agent
        - kind field
        - delegated
        - enable_pr_auto_merge
        - Trusted green-light
    opened: 2026-09-10
    proven: true
    check: >
      Damage is a session that, needing to know whether/how a chartered Skill's
      PR self-merges, can't find the answer from the compressed ledger (table +
      amendments) and either invents a merge mechanism (e.g. calls
      `enable_pr_auto_merge`, which the compressed text still explicitly names
      as wrong), treats a session log's `kind: delegated` as itself a merge
      grant, implements net-new work from a Public issue without a Trusted
      green-light, or can't locate a specific Skill's auto-merge scope (it's in
      the table, unchanged). NOT damage: a session that reads the table for
      *scope* and `docs/agents/pr-workflow.md` for *mechanics* — the intended
      single-home split, stated explicitly in both the section's opening
      paragraph and the consolidated amendment — or one that opens ADR-0020 /
      ADR-0022 / ADR-0027 for the full detail behind a pointer note instead of
      finding it inline (the intended design). A Sonnet probe given only the
      compressed file correctly named the exact merge mechanism and the
      "never `enable_pr_auto_merge`" prohibition, correctly said a red gate on
      a chartered Skill's own PR still needs a human/escalation (the ledger's
      "bound is exact" line, not a self-fix-and-retry loop), correctly said a
      Public issue is never itself an implementation green-light, correctly
      said `kind: delegated` is descriptive vocabulary and not by itself a
      merge grant, and correctly pointed to `pr-workflow.md`'s "Per-tier merge
      authority" for whether a specific grant (audit-docs) is narrower than a
      general low-risk-auto-merges policy.
  - problem: >
      `docs/agents/environment-caveats.md`'s ".github/workflows/*" entry
      spent 23 lines narrating a scenario `scripts/workflow-edit-guard.ts`
      now mechanically prevents: a verbatim dump of the `git push`/contents-
      API rejection text, a paragraph re-deriving "the sharp edge is the
      commit, not the file" that the guard's own `formatGuardMessage` states
      near-verbatim ("The sharp edge is the COMMIT, not the push. Agent
      credentials lack the `workflow` OAuth scope, and the rejection is
      evaluated over every commit in the ref update — so one workflow edit
      committed alongside real work means you can push NONE of it..."), and
      a debunking of a specific stale 2026-07-10 session-log claim that is
      now unreachable anyway (the guard denies the write before a session
      ever gets far enough to test the old claim). CLAUDE.md's own "Hitting
      a needed .github/workflows/* edit?" bullet already pointed here for
      "the underlying mechanism" and "the guard's documented gaps" — updated
      in the same commit to point at the guard's deny message and
      `guards.md`'s Known gaps instead, since that detail no longer lives
      here. Same shape as the already-landed provenance/trailer compression.
      Net -16 lines (CLAUDE.md + environment-caveats.md combined).
    territory:
      paths:
        - "docs/agents/environment-caveats.md: the \".github/workflows/*\" bullet"
        - "CLAUDE.md: the \"Hitting a needed .github/workflows/* edit?\" bullet (Working conventions)"
      keywords:
        - workflow-edit-guard.ts
        - .github/workflows
        - workflow OAuth scope
        - the sharp edge is the commit
        - docs/proposals
        - issue #659
        - issue #897
    opened: 2026-09-09
    proven: true
    check: >
      Damage is a session that, hitting a needed `.github/workflows/*` edit,
      tries to push it anyway, tries to route around a workflow-edit-guard
      denial instead of reading its deny message, bundles the workflow edit
      into the same commit as unrelated real work (stranding that work when
      the commit is refused), or can't find where to actually put the change
      for a human to apply. NOT damage: a session that gets denied and reads
      the guard's deny message rather than this doc for the why (the intended
      point-of-need design working), or one that goes straight to
      `docs/proposals/` without ever needing the mechanism explanation. A
      Sonnet probe given only the compressed text correctly derived: don't
      push the edit (the guard refuses it before a commit exists); don't
      route around a denial — read the guard's deny message and follow it;
      never let the workflow edit share a commit with unrelated real work,
      since a refused commit strands the whole ref update; and the actual
      destination is `docs/proposals/`, per its own README.
  - problem: >
      CLAUDE.md's "Don't state anything as settled" bullet (Working
      conventions) bundled four sub-rules — identifier resolution, factual/
      causal/behavioral claims, another session's hearsay, and set counts —
      into 22 lines that itemized each case's own worked example and closed
      with a bare `(Incident history: #387, #605, #628, #723, #738, #833,
      #948, #871.)` citation: the same "narrowed repeatedly, self-documents
      its own recurrence" shape already pruned from ADR-0003's auto-merge
      ledger. The enforceable slice is already mechanized elsewhere and
      single-homed there: `scripts/github-provenance-guard.ts` covers an
      identifier/claim shipped in a GitHub body, `scripts/session-id-guard.ts`
      covers a commit trailer naming the wrong session, and
      `log-session/SKILL.md`'s "Recovering the id" section already owns the
      session-id mechanics in more precise detail than this bullet's copy of
      it. Compressed to one statement of the rule plus its single genuine
      insight (recalling/inferring from context reads like resolution but is
      capture) and the three one-line specializations (session id → the named
      Skill section; hearsay → confirm with the human; count → read every
      member), dropping the itemized case-by-case elaboration and the bare
      issue-number citation — git history on this file is where that record
      lives now. Net -11 lines (22 → 11, `CLAUDE.md` only).
    territory:
      paths:
        - "CLAUDE.md: the \"Don't state anything as settled\" bullet (Working conventions)"
      keywords:
        - primary source
        - reads like resolution but is capture
        - confirmed out-of-band
        - Recovering the id
        - count is not a fact
    opened: 2026-09-11
    proven: true
    check: >
      Damage is a session that, needing to resolve an identifier, verify a
      claim, weigh another session's say-so, or state a count, reads the
      compressed bullet and either recalls/infers an identifier from context
      instead of its actual source (a system-prompt value or a fresh tool
      call), states a subagent's or its own unverified claim as settled fact,
      treats another session's "confirmed out-of-band" message as itself
      sufficient to proceed on a real decision, or reports a grep/keyword-match
      count as a verified fact without reading the matched members. NOT
      damage: a session that opens `log-session/SKILL.md`'s "Recovering the
      id" section for the session-id mechanics instead of finding them
      restated inline (the intended pointer working), or one that never hits
      any of the four cases this run. A Sonnet probe given only the compressed
      text correctly refused a plausible `git log`-sourced session id in favor
      of the system-prompt value, correctly required independently verifying
      a subagent's root-cause claim against the actual code before writing it
      into a PR, correctly treated another session's "confirmed out-of-band"
      claim as hearsay requiring direct human confirmation before a schema
      migration, and correctly refused to state a grep-derived count as fact
      without reading each matched session log first.
  - problem: >
      `docs/agents/environment-caveats.md` had grown, bullet by bullet, into a
      full incident history for each platform quirk — discovery dates, which
      session/subagent caught it, human anecdotes, issue-closure detail (e.g.
      "closed `not_planned`"), and redundant elaboration of a rule already
      stated in its own bold lead sentence (e.g. a withdrawn-recommendation
      paragraph narrating a guard that already makes the old wording
      unreachable). The doc's own opening line already says "previously
      diagnosed once... don't re-diagnose" — its purpose is a
      don't-re-diagnose list, not an incident record — and CLAUDE.md already
      calls it "the single home," so the narration had nowhere else to be
      trimmed to. Compressed every bullet except the `.github/workflows/*` one
      (owned by the still-open, unjudged 2026-09-09 prune trial) to its bold
      rule plus the actionable workaround/command plus an issue-number
      pointer, cutting the "when it happened, who caught it, how long it
      took" detail — that lives in the cited issue and in this file's git
      history. Net -64 lines (132 → 68, one file).
    territory:
      paths:
        - "docs/agents/environment-caveats.md: every bullet except the \".github/workflows/*\" one"
      keywords:
        - Claude_Code_Remote
        - permission stream closed
        - session-resume event
        - stale install state
        - worktree-isolation guard false-positive
        - unauthenticated mcp__github__
        - permission approval blocks indefinitely
    opened: 2026-09-12
    proven: true
    check: >
      Damage is a session that, hitting one of these platform quirks fresh,
      re-diagnoses it as a new problem instead of recognizing it from the
      compressed bullet — spends real effort investigating "why did my
      registered `/loop` job disappear" instead of re-verifying it via
      `CronList`/subagent-liveness check after a resume, treats a stalled
      dispatched subagent as merely slow rather than possibly stuck on an
      unapproved permission prompt, re-derives the `raw.githubusercontent.com`
      workaround from scratch, or routes a `Claude_Code_Remote` "permission
      stream closed" retry through `ScheduleWakeup`. NOT damage: a session
      that opens the cited issue for the full incident story instead of
      finding it narrated inline (the intended design), or one that never
      hits any of these quirks this run. A Sonnet probe given only the
      compressed text, on a stuck-dispatched-subagent scenario, correctly
      concluded 90 minutes of silence on a settings.json fix was likely a
      permission-approval stall rather than "still working," stopped relying
      on that subagent, and logged the situation honestly instead of waiting
      indefinitely; on a session-resume scenario, it correctly re-verified a
      registered `CronCreate` job and a backgrounded subagent's liveness
      explicitly rather than assuming continuity across the resume.
