# Open Prune Trials (ADR-0027). One entry per pruned problem. The window runs
# from when the prune lands on `main`, not from `opened:`;
# `pnpm exec tsx .agents/skills/prune-trial/scripts/find-trial-window.ts`
# gives it. An entry is deleted the moment `/prune-trial` judges it — git holds the history, this
# file holds only what is unjudged.
#
# The entry ships in the prune's own commit, so that commit is the record: to
# read back what was cut, `git log` this file. Nothing here has to be filled in
# after the PR merges.
#
# trials:
#   - problem: what the pruned prose was trying to prevent
#     territory:                     # the next trial must not overlap these
#       paths:
#         - path/or/file/touched
#       keywords:
#         - keyword or phrase
#     opened: 2026-08-23
#     proven: false                  # only when §4's Sonnet probe could not run
#     check: how you would tell this broke — written now, while you still
#            remember what the prose was for. Prose, not a command; say what
#            distinguishes real damage from a session simply using the pruned
#            topic's tools correctly.
trials:
  - problem: >
      `dispatch-subagents` §3 "Write the brief" cut to the rule per line, most
      incident histories dropped to a few issue pointers, and one line added
      (create each agent's artifact folder first) (-10 net, 84 lines in,
      74 out). Chosen after the search subagent
      covered the instruction corpus, guard headers and the tracker: the brief
      checklist failed as prose (#2312, after #2150; #1480, #1585, #1586) and
      nothing checks a brief mechanically. Runners-up: pre-push review in
      `pr-workflow.md` (#2311, partly held by merge-pr.ts), stored-field shape
      rule (#2264), CLAUDE.md read-first triggers (#1754). Judged and deleted
      the Read-tool trial (landed 3a6075ae, judgeable from 2026-10-19T20:03Z per
      the window script): only two unrelated major Frictions (stale TMPDIR,
      screenshot loop). The mass here was small.
    territory:
      paths:
        - ".agents/skills/dispatch-subagents/SKILL.md: §3 (Write the brief)"
      keywords:
        - subagent brief
        - stranded
    opened: 2026-10-20
    proven: true
    check: >
      Damage is a major or blocker Friction where a subagent went wrong
      (clobbered a checkout, collided on an artifact name, ran stale, merged,
      or exceeded a "simple" fix) because the brief lacked a line the old §3
      carried. NOT damage: a brief defect the removed text would not have
      caught, or a guard denying and the agent fixing itself.
  - problem: >
      `frictions-to-fixes` SKILL.md rewritten plainly at a Trusted user's request
      (1936 words to about 1730; 213 lines to 250, the extra lines being per-step
      headings): an overview of the run's three PR kinds, then each step as a
      goal paragraph, numbered instructions with their script and subagent calls,
      a done-when line, and an edge-case list. Every rule kept: the regression
      and issue caps of three and their exemptions, never-dispatch surfaces, the
      ledger PR every run, review comment before merge, the escalation ledger
      entry, the closing status-only PR. Cut: the when-to-run line, the
      merge-by-judgement restatement, and a few short why-clauses (why a drop
      needs no PR, why guards need a human session, "git keeps them").
      Section numbers §1 to §8 kept, since
      `guest-build` cites §6 and §7. The briefs are unchanged. Later, at the
      same user's request, §4–§5 and the design brief gained a third outcome
      (no change: drop the fix and note the dropped solution in the entry's
      new `notes`); that is added behaviour, not restored text.
    territory:
      paths:
        - ".agents/skills/frictions-to-fixes/SKILL.md (all of it)"
      keywords:
        - ledger PR
        - closing ledger PR
    opened: 2026-10-20
    check: >
      Damage is a major or blocker Friction in a frictions-to-fixes run that the
      old text would have prevented: the ledger PR not opened, a regression
      dispatched, more than three capped issues filed, a fix PR merged with no
      review comment, an escalated PR without its own `fixes` entry, or the
      closing ledger PR skipped or wrong. NOT damage: a run that hits a survey
      or design brief problem (the briefs did not change), or a friction the
      old text did not cover either.
  - problem: >
      `audit-docs` SKILL.md rewritten plainly and then pruned, both at a Trusted
      user's request (PRs #2331 and this one): 2058 words to about 1630, 249
      lines to 230. Shape as `frictions-to-fixes` (#2330): an overview of the
      run's two PRs, a "What you may edit" reference (the tiers), then each
      step as a goal paragraph, instructions, a done-when line and edge cases.
      Cut because something else enforces it: the open-trial check (the
      ADR-0027 rule loads with this Skill), the Pack-generic detail
      (`verify:skills-lock`), the leaf-agent rule (spawn depth 1), the issue's
      provenance header (the provenance guard), the gate-scope notes (the gate
      picks its scope). Cut as no-ops or impossible: the branch step, globbing
      and classifying every surface, "audit the source not the render",
      "isolation logic" in the escalation list, the day-of-year family
      fallback, the "Command-only" note. Simplified: the checkers' six
      per-lens sources to one rule (every rule, condition, exception and why
      kept), Agent B no longer runs `audit-skills.ts` for read counts (they
      could only corroborate), one "don't regress" example instead of three,
      the duplicate-issue lookup to "search open issues first", no reuse of an
      earlier escalation PR, and the Pack-generic "note it in a Live doc"
      (ADR-0015 puts such notes in the Inventory entry). Tier, lens and family names unchanged, since
      `frictions-to-fixes`' briefs, `prune-trial` and the commit-subject
      rotation use them. `audit-skills.ts`' docstring no longer names
      audit-docs as a reader.
    territory:
      paths:
        - ".agents/skills/audit-docs/SKILL.md (all of it)"
      keywords:
        - concision family
        - escalation PR
    opened: 2026-10-20
    check: >
      Damage is a major or blocker Friction in an audit-docs run that the old text
      would have prevented: a Historical or Pack-generic file edited, an ADR edit
      or route-changing page move self-merged instead of escalated, a fix applied
      without a checker's CONFIRMED, the wrong concision family picked, text in an
      open trial's territory reworded, a "don't regress" reason cut, a
      duplicate issue filed, or a Single-home finding missed that a read count
      would have surfaced. NOT damage: a reviewer or checker finding that is
      simply wrong, a branch clash over the escalation PR, or a second
      escalation PR beside an open one.
  - problem: >
      `docs/agents/github-integration.md` "Overflow and precision traps" search
      bullets tightened to the goal (-4 net): the `fields`
      rule now lives in `github-search-fields-guard.ts`' deny message, which the
      doc only points to. Chosen after the search subagent covered the
      instruction corpus, guard headers and the tracker: the rule failed as prose
      (#1860, again #2210; #1860 read in full) and the guard holds it. Runners-up:
      Stop-hook inherited-commits advice in `git-conventions.md` (#2233, nothing
      in the repo enforces it), "Verify before you state" in CLAUDE.md (#2341, too
      fresh). Same run judged and deleted the close-session, background-guard and
      provenance-guard trials: only nit/minor Frictions (#2363's close-session
      recurrences trace to the read-first hint being deferred, not to cut text).
      The mass here was small.
    territory:
      paths:
        - "docs/agents/github-integration.md: the 'Overflow and precision traps' search bullets"
      keywords:
        - search_issues fields
        - search_pull_requests
    opened: 2026-10-21
    proven: true
    check: >
      Damage is a major or blocker Friction where a session flooded its context
      with a search or list result, or asserted "nothing exists" from an empty
      search, and the cut text would have prevented it. NOT damage: the fields
      guard denying and the session fixing itself from its message.
  - problem: >
      `docs/agents/pr-workflow.md` plainly reworded (-3 net: 118 lines to 115;
      the pre-push review section's "simple change" bar is reworded, with one
      added line (count, don't judge); the integration-PR, recipe steps 2-3, closing-keyword, "Who merges" and
      "Closing a scheduled run's PR" prose shortened, every rule kept.
      The Glass Box page's excerpt is pinned to its own `revision`, so it is
      untouched. Chosen after the search
      subagent covered the instruction corpus and the tracker: the pre-push
      gate/review rule failed as prose repeatedly (#2311, #2354, #2397; #2397
      read in full) and no guard holds it (#2397 left the guard question open;
      ADR-0004's summary rule, untouched, still carries the rule). Runners-up:
      Stop-hook inherited-commit advice (#2233, owner accepted the cost),
      CLAUDE.md read-first triggers (#1754, partly held by read-first-hint.ts).
      The mass here was small; no trial was judgeable this run (all five landed
      under three days ago, per the window script).
    territory:
      paths:
        - "docs/agents/pr-workflow.md (all of it)"
      keywords:
        - Review before the first push
        - simple change
    opened: 2026-10-22
    proven: true
    check: >
      Damage is a major or blocker Friction where a session skipped `code-review`
      or `gate:scoped` before a first push, judged a non-simple change simple,
      merged without a verdict, or mishandled a closing keyword, and the old
      wording would have prevented it. NOT damage: the nit-level chaining or
      Stop-hook slips #2397 already records, which this prune did not touch.
  - problem: >
      Long-command backgrounding cut to one home (-2 net): CLAUDE.md's
      Self-verification bullet tightened (4 lines to 3, rule and 600s why kept),
      and `blog-post` §10's restatement ("`run_in_background: true`, logging to
      the scratchpad") dropped. Chosen, at a Trusted user's pick, after the
      search subagent covered the instruction corpus, guard headers and the
      tracker: the rule failed as prose three times (#1293, #2265, #2426; all
      three read in full by the subagent, #2426 by me) and nothing holds it for
      the main session (`double-background-guard` and
      `subagent-background-guard` cover adjacent cases). #2426 already proposes
      the guard. Runners-up: close-session duplicates (#2424, #2209; partly held
      by read-first-hint), a plain rewrite of `git-conventions.md`. Same run
      judged and deleted the deferred-tool-guard trial (landed d895e7ec,
      judgeable from 2026-10-22T15:31Z per the window script): 57 sessions, only
      nit deferred-tool Frictions (Monitor called unloaded, self-corrected), no
      regression issue. The mass here was small.
    territory:
      paths:
        - "CLAUDE.md: the Self-verification 'Run anything that can take over 2 minutes' bullet"
        - ".agents/skills/blog-post/SKILL.md: §10 (Gate)"
      keywords:
        - run_in_background
        - foreground-gate
    opened: 2026-10-23
    check: >
      Damage is a major or blocker Friction where a session ran a long command
      (gate:scoped, a build, e2e) in the foreground and lost it to the 600s cap,
      or started it with a shell `&` it then could not wait on, and the cut
      wording (or blog-post's restatement) would have prevented it. NOT damage:
      the nit/minor slips #2426 already records at the old wording's rate, or a
      guard denying and the session fixing itself.
