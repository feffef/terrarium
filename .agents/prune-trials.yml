# Open Prune Trials (ADR-0027). One entry per pruned problem. The window runs
# from when the prune lands on `main`, not from `opened:`;
# `pnpm exec tsx .agents/skills/prune-trial/scripts/find-trial-window.ts`
# gives it. An entry is deleted the moment `/prune-trial` judges it — git holds the history, this
# file holds only what is unjudged.
#
# The entry ships in the prune's own commit, so that commit is the record: to
# read back what was cut, `git log` this file. Nothing here has to be filled in
# after the PR merges.
#
# trials:
#   - problem: what the pruned prose was trying to prevent
#     territory:                     # the next trial must not overlap these
#       paths:
#         - path/or/file/touched
#       keywords:
#         - keyword or phrase
#     opened: 2026-08-23
#     proven: false                  # only when §4's Sonnet probe could not run
#     check: how you would tell this broke — written now, while you still
#            remember what the prose was for. Prose, not a command; say what
#            distinguishes real damage from a session simply using the pruned
#            topic's tools correctly.
trials:
  - problem: >
      `frictions-to-fixes` survey brief (`survey-brief.md`) restated its helpers'
      output and each rule several times (-797 words: 2612 -> 1815 by `wc -w`;
      line delta in the PR title): the helper-flag walkthroughs, the §2
      step-5 and edge-case restatements and the §6 sub-lists went; every
      command, label, ranking rule and report part kept; rules restored after
      review: `accepted` ceilings, the on-trial blocker line, partial-fit
      appends. Chosen after a search
      subagent this run read the ledger `fixes:` lists of 155 entries, CLAUDE.md,
      `.claude/rules`, `docs/agents/guards.md`, this file, the 2 open issues and
      the 100 most recently updated closed ones (not session logs, not older
      closed issues). `frictions-to-fixes-briefs-mismatch` (10 fixes, each
      patching one more brief contradiction) failed as prose; nothing enforces
      brief correctness. Runner-up: clear-backlog §3 "Build and review"
      (1179 words, hand-edited by #3589 on 2026-11-22). Same run judged and
      deleted the dispatch-subagents §3 trial (landed 8b73b145): it holds.
      `subagent-brief-defects` 6.4% -> 16.7% (14/218 -> 6/36), but 3 of the 6
      after hits trace to `clear-backlog-build.js` `rules()`
      telling builders to run e2e in the background, which the guard refuses; the
      cut kept the foreground line, and the other hits are a brief a session
      wrote itself, so no issue.
    territory:
      paths:
        - ".agents/skills/frictions-to-fixes/survey-brief.md"
      keywords:
        - survey-brief
        - print-ledger-occurrence
    opened: 2026-11-23
    proven: true
    check: >
      Damage is a major or blocker Friction where a survey agent skipped a step
      the cut text carried (a stale `tracked` status left, a fix not recorded,
      a never-fixed label with no tracker check, a missing report part) and the
      main session had to catch it. Compare the shares of
      `frictions-to-fixes-briefs-mismatch` and `survey-label-and-ledger-errors`
      with `friction-rates.ts`; a clear rise is also damage. NOT damage: a
      survey agent hitting a script refusal the brief still names.
