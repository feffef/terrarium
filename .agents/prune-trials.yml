# Open Prune Trials (ADR-0027). One entry per pruned problem. The window runs
# from when the prune lands on `main`, not from `opened:`;
# `pnpm exec tsx .agents/skills/prune-trial/scripts/find-trial-window.ts`
# gives it. An entry is deleted the moment `/prune-trial` judges it — git holds the history, this
# file holds only what is unjudged.
#
# The entry ships in the prune's own commit, so that commit is the record: to
# read back what was cut, `git log` this file. Nothing here has to be filled in
# after the PR merges.
#
# trials:
#   - problem: what the pruned prose was trying to prevent
#     territory:                     # the next trial must not overlap these
#       paths:
#         - path/or/file/touched
#       keywords:
#         - keyword or phrase
#     opened: 2026-08-23
#     proven: false                  # only when §4's Sonnet probe could not run
#     check: how you would tell this broke — written now, while you still
#            remember what the prose was for. Prose, not a command; say what
#            distinguishes real damage from a session simply using the pruned
#            topic's tools correctly.
trials:
  - problem: >
      `dispatch-subagents` §3 "Write the brief" trimmed (-7 net, from `git
      diff --numstat`: 39 added, 46 deleted; this entry not counted): the
      justification clauses, the restated guard behaviour (what the background
      guards deny) and doubled sentences dropped; every brief rule kept in one
      goal-shaped line, the three sub-headings kept so inbound "Scope and
      trust" pointers resolve. Chosen after the search subagent covered the
      instruction corpus, guard headers and the tracker: the brief-writing
      rules failed as prose (#2312, then #2610, which says the earlier fixes
      #2150, #2318 and #2324 did not retire the cause); no guard checks brief
      contents. Runner-up: `pr-workflow.md` "Review before the first push"
      (#2472, #2474). Same run judged and deleted the `frictions-to-fixes`
      briefs trial (landed 7231f728) and the `log-session` "When to invoke"
      trial (landed 147e2bf4): 59 and 38 sessions since, no major or blocker
      Friction traces to either; the closure misses since are the answer-only
      and PR-open ones the check excludes. Rates after vs before: closure
      entries 0/38 against 2/196 and 3/196, `close-session-bypassed-by-hand-log`
      1/38 against 3/196; `frictions-to-fixes-briefs-mismatch` 3/50 against
      9/184 and `frictions-to-fixes-skill-gaps` 4/50 against 10/184, one or
      two sessions of difference, not a clear rise.
    territory:
      paths:
        - ".agents/skills/dispatch-subagents/SKILL.md: §3 'Write the brief'"
      keywords:
        - dispatch-subagents §3
    opened: 2026-10-29
    proven: true
    check: >
      Damage is a major or blocker Friction where a subagent brief lacked
      something the cut text said (a pinned SHA, `git -C`, the foreground-check
      marker, the size ceiling, no `merge-pr.ts` call, the agent-count and
      gate-slot limits) and the agent went wrong
      for it: stale checkout, stranded or unreviewed work, a merge by an impl
      agent. NOT damage: a brief gap the old text had too.
  - problem: >
      `blog-post` step 9 and the "Re-derive every claim" citation bullet
      plainly reworded (-3 net, from `git diff --numstat`: 27 added, 30
      deleted; this entry not counted): clauses folded, every rule kept
      and one rationale clause cut ("often in agent voice"). Chosen after the search subagent covered the instruction
      corpus, guard headers and the tracker: the fact-check and
      causal-attribution prose failed repeatedly (#1168, then #2425 after
      #2336 and #2378) and `merge-pr.ts` `factCheckedBlobRefusal` now holds the
      blob check. Runners-up: CLAUDE.md "Verify before you state" and "Question
      the premise" (owner-approved wording, no guard), the `close-session`
      invocation restatements. Little text to cut. Same run judged and deleted
      the `environment-caveats.md` reword trial (landed f28f11c1): 47 sessions
      since, no major or blocker Friction traces to it. `harness-proxy-blocks`
      rose from 4/177 to 4/41 of sessions, but the reword changed none of the
      blocked-host lines; the hits are Glass Box fetches of hosts (vuejs.org,
      nitro.build) the file never named, tracked in #2695.
    territory:
      paths:
        - ".agents/skills/blog-post/SKILL.md: step 9 and the 'Re-derive every claim' bullet"
      keywords:
        - Re-derive every claim
        - Fact-checked
    opened: 2026-10-30
    proven: true
    check: >
      Damage is a major or blocker Friction where a blog post shipped a wrong
      or unverified factual or causal claim, or a changed post went out
      without a re-check, and the cut wording would have prevented it. NOT
      damage: `merge-pr.ts` refusing a post whose blob does not match, or a
      checker row of `wrong` that the session then fixed.
  - problem: >
      Incident narration in the `loop-only-tool-guard.ts` and
      `skill-inline-guard.ts` headers and one inline comment cut to the rule
      plus the issue pointers (-12 net, from `git diff --numstat`: 9 added, 21
      deleted; this entry not counted). Chosen after the search subagent covered
      the instruction corpus, guard headers and the tracker (7 issues read in
      full): both rules failed as prose (#814 after #241 and #425; #1018 after
      #999) and wired PreToolUse guards hold them; their CLAUDE.md and doc homes
      are already gone, so only these comments remained. Runners-up, each with
      the same shape but more tangled: `github-provenance-guard.ts` (largest
      mass, ADR-0017 tie), the two background guards (`dispatch-subagents`
      trial territory), `dispatch-read-guard.ts` (CLAUDE.md line on trial
      nearby). Code and deny messages are unchanged. Little text to cut. Same
      run judged and deleted the "Verify before you state" and
      `github-integration.md` trials (landed 10f009ac and ce66e262): 48
      sessions since, no major or blocker Friction, no regression issue.
    territory:
      paths:
        - "scripts/hooks/loop-only-tool-guard.ts: header and the `exempt` comment"
        - "scripts/hooks/skill-inline-guard.ts: header"
      keywords:
        - ScheduleWakeup
        - Skill-inline guard
    opened: 2026-10-28
    proven: true
    check: >
      Damage is a major or blocker Friction where a session misused
      `ScheduleWakeup` outside `/loop` or called `Skill` on an inlined Skill
      and the guard did not stop it because a comment was cut. NOT damage: a
      guard denying the call and the session following its message.
