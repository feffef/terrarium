# Open Prune Trials (ADR-0027). One entry per pruned problem; the verdict is due
# three days after the prune lands on `main` — ADR-0027's window runs from the
# landing, not from `opened:` below (get the real landing with
# `pnpm exec tsx scripts/prune-trial-window.ts`; see the prune-trial Skill's §1). An entry
# is deleted the moment `/prune-trial` judges it — git holds the history, this
# file holds only what is unjudged.
#
# The entry ships in the prune's own commit, so that commit is the record: to
# read back what was cut, `git log` this file. Nothing here has to be filled in
# after the PR merges.
#
# trials:
#   - problem: what the pruned prose was trying to prevent
#     territory:                     # the next trial must not overlap these
#       paths:
#         - path/or/file/touched
#       keywords:
#         - keyword or phrase
#     opened: 2026-08-23
#     proven: false                  # only when §4's Sonnet probe could not run
#     check: how you would tell this broke — written now, while you still
#            remember what the prose was for. Prose, not a command; say what
#            distinguishes real damage from a session simply using the pruned
#            topic's tools correctly.
trials:
  - problem: >
      The backgrounding / pipe-to-tail cluster. Three CLAUDE.md bullets (no
      trailing `&` on a `run_in_background` call; a subagent never backgrounds
      or uses `Monitor`; no trailing `tail`/`head`/`echo` pipe) each failed as
      prose first — #873 (two prose fixes "did not hold", per
      `scripts/tail-pipe-guard.ts`'s header), #1208 (two recurrences, per
      `double-background-guard.ts`), #694/#995 — and are now held by
      `tail-pipe-guard.ts`, `double-background-guard.ts` and
      `subagent-background-guard.ts`, whose deny messages name the fix. Merged
      the three into one goal-shaped bullet (kept the `> log 2>&1` hint and
      the guards.md pointer) and trimmed the dispatch-subagents verification
      bullet to the rule, the log-marker signal and the `SendMessage` resume.
      The search subagent covered the instruction corpus, the rulebook table
      (excluded list included), guards.md and the guard script headers; it
      could not read issue threads (GraphQL 403), so issue evidence is from
      the guard headers. Net about -11 lines; the mass here was small.
    territory:
      paths:
        - "CLAUDE.md: the three backgrounding / trailing-`&` / tail-pipe bullets"
        - ".agents/skills/dispatch-subagents/SKILL.md: the \"Run verification ... in the foreground\" bullet"
      keywords:
        - trailing shell `&`
        - double-background
        - trailing `tail`
    opened: 2026-10-01
    proven: true
    check: >
      Damage is a `tail-pipe-guard`, `double-background-guard` or
      `subagent-background-guard` denial (or a log line showing the shape got
      through) for a session that didn't know the rule and whose deny message
      didn't fix it in one retry, or a subagent whose backgrounded command
      stranded work. NOT damage: a guard denial the session fixed from the
      deny message.
  - problem: >
      The ADR-0017 provenance rule (GitHub-body header, commit trailer) failed
      as prose repeatedly — ADR-0017's old amendment banner lists #346, #710,
      #723, #737, #784; rulebook rows CM-43 (#387/#605/#628/#723) and CM-44
      (#921) are marked Built — and is now held by `github-provenance-guard.ts`,
      `commit-trailer-guard.ts` and `.githooks/commit-msg`, whose deny messages
      name the fix. Yet the ADR still carried a stale Decision ("convention
      only, not gate-enforced") beside its own amendment, and CLAUDE.md and
      git-conventions.md restated the guard mechanics. Rewrote ADR-0017 whole
      (decision unchanged: provenance on every agent-authored external
      interaction, header on GitHub bodies, trailer on commits, bot identity
      deferred), folded the amendments in, and trimmed the CLAUDE.md bullet and
      the git-conventions commit-hygiene bullet to the rule plus a pointer. The
      search subagent covered the instruction corpus, guards.md, the rulebook
      table (excluded list included) and guard script headers; it could not
      read issue threads, so issue evidence is from those headers and rows.
      Code comments in `scripts/*provenance*` still cite "ADR-0017's 2026-08-01
      amendment" by name; left as is. Net about -90 lines.
    territory:
      paths:
        - "docs/adr/0017-provenance-footer-on-agent-authored-content.md (whole-file rewrite)"
        - "CLAUDE.md: the \"Open every GitHub body\" bullet"
        - "docs/agents/git-conventions.md: the commit-hygiene `commit-msg` backstop sentence"
      keywords:
        - ADR-0017 provenance header
        - commit-msg backstop
        - hand-write the commit trailer
    opened: 2026-10-02
    proven: false
    check: >
      Damage is a session that writes a GitHub body without the header, or a
      commit with a hand-typed or missing trailer, and the guard's deny message
      did not fix it in one retry; or a session misreading the rewritten ADR
      (e.g. believing the footer is convention-only). NOT damage: a guard
      denial the session fixed from the deny message.
  - problem: >
      The workflow-file edit rule (rulebook CM-24/EC-07, Built). It failed as
      prose first: #897 (read this run) — the caveat was already in
      environment-caveats.md via #876 and a session still stranded a branch —
      and is now held by `workflow-edit-guard.ts`, whose deny message names the
      fix. Trimmed the CLAUDE.md bullet to the rule plus pointers, the
      environment-caveats bullet to the goal, guards.md's known-gap bullet to
      a pointer at the script header, and the proposals README intro. The
      search subagent covered guards.md, the rulebook table's Built rows, the
      ScheduleWakeup, deferred-tool and workflow-edit rule homes, and #897 and
      #814; it did not read the other cited issues. Candidates ScheduleWakeup
      (less mass) and the ToolSearch rule (weaker guard) were left. Net about
      -12 lines; the mass here was small.
    territory:
      paths:
        - "CLAUDE.md: the `.github/workflows/*` edit bullet"
        - "docs/agents/environment-caveats.md: the workflow-write bullet"
        - "docs/agents/guards.md: the workflow-edit-guard Bash-arm bullet"
        - "docs/proposals/README.md: the Purpose paragraph"
      keywords:
        - workflow-edit-guard
        - workflow OAuth scope
        - docs/proposals
    opened: 2026-10-03
    proven: true
    check: >
      Damage is a session that writes a `.github/workflows/*` file or strands
      commits behind a rejected push, or that has to ask how to hand off a
      workflow change, and the guard's deny message did not fix it in one
      retry. NOT damage: a guard denial the session fixed from the deny message.
  - problem: >
      The PR-landing recipe's verdict and merge-path narrative
      (`docs/agents/pr-workflow.md` steps 3-5). It failed as prose: #301 then
      #853 (APPROVE-event verdict), #1276 (verdict skipped twice, #1113/#1115 and
      PR #1274), #385 (`enable_pr_auto_merge` misleading errors) — read this run
      by the search subagent. `scripts/merge-pr.ts` now refuses without a
      session verdict (`hasVerdictFromSession`) and refuses fork and Public PRs;
      the never-APPROVE and never-`enable_pr_auto_merge` rules have no guard, so
      both stay as short lines. Folded the `merge-pr.ts` narrative, the APPROVE
      explanation and the auto-merge rationale into steps 4-5. The closing-keyword
      paragraph was left alone (it overlaps the just-judged issue-tracker trial's
      keywords). The search subagent covered the instruction corpus, the
      rulebook table (excluded list included), guards.md, guard headers and the
      tracker; ScheduleWakeup (#814) and the Agent background flag (#835) were
      runners-up with less mass. Net about -24 lines; mass was small.
    territory:
      paths:
        - "docs/agents/pr-workflow.md: recipe steps 3-5 (the merge-pr.ts, verdict and enable_pr_auto_merge prose)"
      keywords:
        - post the verdict
        - APPROVE-event
        - enable_pr_auto_merge
        - sole merge path
    opened: 2026-10-04
    proven: false
    check: >
      Damage is a session that posts an APPROVE-event verdict, calls
      `enable_pr_auto_merge`, or merges without a verdict and the `merge-pr.ts`
      refusal did not fix it in one retry. NOT damage: a `merge-pr.ts` refusal
      the session fixed from its message.
