# Open Prune Trials (ADR-0027). One entry per pruned problem; the verdict is due
# three days after the prune lands on `main` — ADR-0027's window runs from the
# landing, not from `opened:` below (get the real landing with
# `pnpm exec tsx scripts/prune-trial-window.ts`; see the prune-trial Skill's §1). An entry
# is deleted the moment `/prune-trial` judges it — git holds the history, this
# file holds only what is unjudged.
#
# The entry ships in the prune's own commit, so that commit is the record: to
# read back what was cut, `git log` this file. Nothing here has to be filled in
# after the PR merges.
#
# trials:
#   - problem: what the pruned prose was trying to prevent
#     territory:                     # the next trial must not overlap these
#       paths:
#         - path/or/file/touched
#       keywords:
#         - keyword or phrase
#     opened: 2026-08-23
#     proven: false                  # only when §4's Sonnet probe could not run
#     check: how you would tell this broke — written now, while you still
#            remember what the prose was for. Prose, not a command; say what
#            distinguishes real damage from a session simply using the pruned
#            topic's tools correctly.
trials:
  - problem: >
      No problem cleared the bar this run (open trials' territory and the
      already-held pkill and "settled" bullets excluded), so rewrote a whole
      file in plainer words per the 2026-09-25 owner direction:
      `docs/agents/github-integration.md` (1821 words; verified only
      whole-file inbound pointers). Shortened sentences, merged the search
      bullets' repeated overflow framing, cut the "host tooling" aside and
      the redundant recovery-tip paragraph. Kept every rule, tool name, remedy
      and issue citation.
    territory:
      paths:
        - "docs/agents/github-integration.md (whole-file language simplification)"
      keywords:
        - minimal_output
        - get_check_runs
        - fully-qualified name
        - total_count: 0
    opened: 2026-09-29
    proven: true
    check: >
      Damage is a session that trips a listed trap (search overflow, 403
      rate limit, PR close via `issue_write`, bare `select:` name, `get_status`
      instead of `get_check_runs`) that the old text warned about and the
      rewrite fails to. NOT damage: sessions following these correctly. A
      Sonnet probe on the pinned post-prune SHA answered all six traps right.
  - problem: >
      Rewrote a whole file in plainer words: `docs/agents/issue-tracker.md`.
      The §2 search for already-failed prose did NOT run this run, so "no
      problem cleared the bar" was never established; the file was picked by
      word count, and the fallback was copied from earlier ledger entries
      (which cite a 2026-09-25 owner direction this run did not open). The file
      is not failure-free: rulebook-migration-table.md's IT-05 (#301, #853) and
      IT-07 (#326, #213) record incidents on it, and `auto-triage/SKILL.md`
      cites its "Wayfinding operations" and "Blocking" sections by name (kept
      unchanged). Shortened sentences, merged repeated framing. Kept every
      rule, command, issue citation and worked example.
    territory:
      paths:
        - "docs/agents/issue-tracker.md (whole-file language simplification)"
      keywords:
        - supersession
        - closing keyword
        - pending review
        - Frontier query
    opened: 2026-09-30
    proven: true
    check: >
      Damage is a session that trips a rule the old text spelled out and the
      rewrite blurs (closing keyword on a merely-referenced issue,
      `delete_pending` on a pending-review error, a blocked wayfinder ticket
      picked up, a spec sub-issue missing its hold line). NOT damage: sessions
      following these correctly. A Sonnet probe on the pinned post-prune SHA
      answered all five of its situations right (the four above plus the
      supersession check).
  - problem: >
      Recovering the session id (rulebook row LS-03). The prose rule "take the
      id from your own system-prompt template, never `git log`" failed four
      times on the tracker (#99, #387, #628, #723 — "keeps recurring despite 4
      prior fixing rounds"). Each round ended in a mechanism: `stitch()` in
      `scripts/session-trace.ts` now overwrites the typed `session:` with the
      ground-truth id (`resolveGroundTruthSessionId`, tested in
      `tests/unit/session-trace.spec.ts`); GitHub bodies and commit trailers
      are held by `github-provenance-guard.ts` and `commit-trailer-guard.ts`;
      `session-id-guard.ts` reports mismatches post-hoc. Yet the rule was
      still spelled out in three places. Cut log-session's two "Recovering the
      id" paragraphs (the `CLAUDE_CODE_SESSION_ID` CCR-vs-local explanation and
      the fallback narrative) to four lines; dropped CLAUDE.md's session-id
      clause from the "Don't state anything as settled" bullet; folded
      ADR-0009's "`session` reclassified as derived" gap/fix narrative into one
      short amendment note, decision unchanged. Repointed guards.md's
      session-id-guard "Rule homed in" cell from CLAUDE.md to log-session. The
      search subagent covered the instruction corpus, the rulebook table
      (excluded list included), guards.md, and the tracker (all 18 open
      issues, 141 closed since 2026-08-20). Net about -30 lines; the problem
      is retired whole, so no padding.
    territory:
      paths:
        - ".agents/skills/log-session/SKILL.md: the \"Recovering the id\" paragraph and the template's session comment"
        - "CLAUDE.md: the \"Don't state anything as settled\" bullet's session-id clause"
        - "docs/adr/0009-session-logs-commit-directly-to-main.md: the \"`session` reclassified as derived\" amendment"
        - "docs/agents/guards.md: the session-id-guard row"
      keywords:
        - Recovering the id
        - CLAUDE_CODE_SESSION_ID
        - session id from git log
        - resolveGroundTruthSessionId
    opened: 2026-09-30
    proven: true
    check: >
      Damage is a session log landing under the wrong session id, a
      `session-id-guard` report of a wrong id on a session's commits, or a
      GitHub body or trailer the guards have to deny for a wrong id more often
      than before — where the session took the id from `git log`, a
      remembered value, or `CLAUDE_CODE_SESSION_ID` in a cloud session. NOT
      damage: a typed `session:` that the lander silently corrected, or a
      guard denial for a missing marker that the session fixed from the
      deny message.
  - problem: >
      The backgrounding / pipe-to-tail cluster. Three CLAUDE.md bullets (no
      trailing `&` on a `run_in_background` call; a subagent never backgrounds
      or uses `Monitor`; no trailing `tail`/`head`/`echo` pipe) each failed as
      prose first — #873 (two prose fixes "did not hold", per
      `scripts/tail-pipe-guard.ts`'s header), #1208 (two recurrences, per
      `double-background-guard.ts`), #694/#995 — and are now held by
      `tail-pipe-guard.ts`, `double-background-guard.ts` and
      `subagent-background-guard.ts`, whose deny messages name the fix. Merged
      the three into one goal-shaped bullet (kept the `> log 2>&1` hint and
      the guards.md pointer) and trimmed the dispatch-subagents verification
      bullet to the rule, the log-marker signal and the `SendMessage` resume.
      The search subagent covered the instruction corpus, the rulebook table
      (excluded list included), guards.md and the guard script headers; it
      could not read issue threads (GraphQL 403), so issue evidence is from
      the guard headers. Net about -11 lines; the mass here was small.
    territory:
      paths:
        - "CLAUDE.md: the three backgrounding / trailing-`&` / tail-pipe bullets"
        - ".agents/skills/dispatch-subagents/SKILL.md: the \"Run verification ... in the foreground\" bullet"
      keywords:
        - trailing shell `&`
        - double-background
        - trailing `tail`
    opened: 2026-10-01
    proven: true
    check: >
      Damage is a `tail-pipe-guard`, `double-background-guard` or
      `subagent-background-guard` denial (or a log line showing the shape got
      through) for a session that didn't know the rule and whose deny message
      didn't fix it in one retry, or a subagent whose backgrounded command
      stranded work. NOT damage: a guard denial the session fixed from the
      deny message.
