# Open Prune Trials (ADR-0027). One entry per pruned problem. The window runs
# from when the prune lands on `main`, not from `opened:`;
# `pnpm exec tsx .agents/skills/prune-trial/scripts/find-trial-window.ts`
# gives it. An entry is deleted the moment `/prune-trial` judges it — git holds the history, this
# file holds only what is unjudged.
#
# The entry ships in the prune's own commit, so that commit is the record: to
# read back what was cut, `git log` this file. Nothing here has to be filled in
# after the PR merges.
#
# trials:
#   - problem: what the pruned prose was trying to prevent
#     territory:                     # the next trial must not overlap these
#       paths:
#         - path/or/file/touched
#       keywords:
#         - keyword or phrase
#     opened: 2026-08-23
#     proven: false                  # only when §4's Sonnet probe could not run
#     check: how you would tell this broke — written now, while you still
#            remember what the prose was for. Prose, not a command; say what
#            distinguishes real damage from a session simply using the pruned
#            topic's tools correctly.
trials:
  - problem: >
      `dispatch-subagents` §3's bullet "A subagent's prose is candidate
      material" cut (-2 net, from `git diff --numstat`: 0 added, 2 deleted; this
      entry not counted): it restated CLAUDE.md "Verify before you state", which
      already names a subagent's report and stays the one home; the brief clause
      in CLAUDE.md that asks a subagent for sources stays. Chosen after the
      search subagent covered the instruction corpus, guard headers and the
      tracker: the verify rule failed as prose (relayed-subagent-claims: #2336,
      #2378, #2485, #2511, #2515, #2670, #2736 fixes; #2556, #2657, #2723, #2751
      regressions; counts-not-tallied #2522, #2659) and no hook checks counts or
      ids stated in chat. Runners-up: CLAUDE.md "Question the premise" (#2195,
      #2332, #2520; no guard, owner-approved wording), the foreground-gate bullet
      in "Self-verification". Little text to cut.
    territory:
      paths:
        - ".agents/skills/dispatch-subagents/SKILL.md: the 'candidate material' bullet in §3 'Scope and trust'"
      keywords:
        - candidate material
    opened: 2026-11-02
    proven: true
    check: >
      Damage is a major or blocker Friction where a session relayed a
      subagent's wrong id, count or attribution as fact and CLAUDE.md "Verify
      before you state" alone would not have prevented it. NOT damage: a minor
      or nit relay slip the reviewer caught, which is the standing
      relayed-subagent-claims rate; compare that entry's share of sessions with
      `friction-rates.ts`.
  - problem: >
      `pr-workflow.md` "Review before the first push" and its three restatements
      (recipe steps 1 and 4, "Closing a scheduled run's PR" step 1) plainly
      reworded (-4 net, from `git diff --numstat`: 19 added, 23 deleted; this
      entry not counted): exemption and simple-change lists folded into
      one-sentence rules, "not the whole branch", "fails on our own PRs" and the
      duplicated review-kinds list in step 4 cut; every rule kept. Chosen after
      the search subagent covered the instruction corpus, guard headers and the
      tracker: the review-before-push rule failed as prose and was narrowed three
      times (#2311 after #1852 and #1853; #2397 after #2359; #2472, whose text
      says "a prose rule with no guard"), and no hook checks it. Runners-up:
      `git-conventions.md` "Don't chain git" (#2397), CLAUDE.md "Verify before
      you state" (#2341, already cut back once). Pointers in `dispatch-subagents`
      (open trial territory), `frictions-to-fixes`, `clear-backlog` and
      `blog-post` untouched. Little text to cut. No open trial was judgeable
      this run (`find-trial-window.ts`: all three before their floor).
    territory:
      paths:
        - "docs/agents/pr-workflow.md: 'Review before the first push', recipe steps 1 and 4, 'Closing a scheduled run's PR' step 1"
      keywords:
        - simple change
        - Review before the first push
    opened: 2026-10-31
    proven: true
    check: >
      Damage is a major or blocker Friction where a first push skipped
      `code-review`, or a non-simple diff got a self-read, or a stale verdict
      SHA was posted, and the cut wording would have prevented it. NOT damage:
      the same skip the old text allowed (#2472-style miscounts), or `merge-pr.ts`
      refusing a verdict whose SHA does not match.
  - problem: >
      `git-conventions.md` "Don't chain git past a step that can fail silently"
      cut to two goal-shaped bullets (-2 net, from `git diff --numstat`: 7 added,
      9 deleted; this entry not counted): the incident aside ("Pushes went out
      while the gate was red") and doubled clauses dropped; every rule kept.
      Chosen after the search subagent covered the instruction corpus, guard
      headers and the tracker: the no-chaining rule failed as prose (#2752 after
      #2407 and #2359; #2397) and no guard holds it. Runner-up with more mass:
      CLAUDE.md "Docs you must read first" (owner-accepted late reads, #2066;
      `read-first-hint.ts` quotes its trigger strings). Little text to cut. Same
      run judged and deleted the `dispatch-subagents` §3 trial (landed 961aff2d)
      and the guard-header trial (landed 04b5e066): 29 and 42 sessions since, no
      major or blocker Friction traces to either; no on-trial ledger entry named
      their territory, so judged on severity alone.
    territory:
      paths:
        - "docs/agents/git-conventions.md: 'Don't chain git past a step that can fail silently'"
      keywords:
        - Don't chain git
        - same Bash command as a gate
    opened: 2026-11-01
    proven: true
    check: >
      Damage is a major or blocker Friction where a push or commit ran in the
      same command as a gate run, or a chained step failed silently and the
      session went on, and the cut wording would have prevented it. NOT damage:
      the nit-level chains #2752 already counts.
