# Open Prune Trials (ADR-0027). One entry per pruned problem; the verdict is due
# three days after the prune lands on `main` — ADR-0027's window runs from the
# landing, not from `opened:` below (get the real landing with
# `tsx scripts/prune-trial-window.ts`; see the prune-trial Skill's §1). An entry
# is deleted the moment `/prune-trial` judges it — git holds the history, this
# file holds only what is unjudged.
#
# The entry ships in the prune's own commit, so that commit is the record: to
# read back what was cut, `git log` this file. Nothing here has to be filled in
# after the PR merges.
#
# trials:
#   - problem: what the pruned prose was trying to prevent
#     territory:                     # the next trial must not overlap these
#       paths:
#         - path/or/file/touched
#       keywords:
#         - keyword or phrase
#     opened: 2026-08-23
#     proven: false                  # only when §4's Sonnet probe could not run
#     check: how you would tell this broke — written now, while you still
#            remember what the prose was for. Prose, not a command; say what
#            distinguishes real damage from a session simply using the pruned
#            topic's tools correctly.
trials:
  - problem: >
      CLAUDE.md's Working conventions bullet on the GitHub provenance header
      and commit trailer (backing CM-43/CM-44 in
      `docs/research/rulebook-migration-table.md`) spelled out, in prose, the
      exact detail ADR-0017's own 2026-08-01 amendment already says belongs
      elsewhere: a worked placeholder-id example ("the id above is a
      placeholder, never a real one — copying a real, id-shaped string from
      context is the actual failure mode"), the model-name/session-url
      resolution instruction, and the commit-trailer hand-write warning — all
      of which `scripts/github-provenance-guard.ts`'s and
      `scripts/commit-trailer-guard.ts`'s own deny messages already state
      near-verbatim (verified by reading both scripts' `formatGuardMessage`-
      style output: the provenance guard's message names the exact marker to
      paste and warns "never predict or reconstruct a session id from
      memory"; the trailer guard's message tells the agent to omit the
      trailer entirely and let the hook land it). ADR-0017 itself documents
      this design choice explicitly: "That message — not a doc — is the
      rule's teaching surface, because every recorded recurrence happened to
      a session that had prose available and did not apply it." Compressed
      CLAUDE.md's bullet to the rule (open with the header; never hand-write
      the trailer), the harness-footer carve-out, the guard's existence and
      fail-closed posture, and a pointer to `docs/agents/guards.md` — same
      shape as the already-landed `ToolSearch`/`ScheduleWakeup` and
      tail-pipe-guard compressions. Net -12 lines.
    territory:
      paths:
        - "CLAUDE.md: the \"Open every GitHub body\" bullet (Working conventions)"
      keywords:
        - provenance header
        - session_EXAMPLE_NOT_A_REAL_ID
        - commit trailer
        - github-provenance-guard.ts
        - commit-trailer-guard.ts
    opened: 2026-09-06
    proven: true
    check: >
      Damage is a session that, opening a GitHub body or committing, can't
      produce a plausible first line / trailer decision from the compressed
      bullet alone and either invents a session id from memory, hand-writes
      the trailer anyway, or edits/duplicates the harness's own footer — or a
      session that, hit by the guard's deny message, ignores it and keeps
      guessing instead of reading and following it. NOT damage: a session
      that gets denied and pastes the guard's own named marker verbatim (the
      intended teach-at-the-moment-of-failure design working, per ADR-0017's
      2026-08-01 amendment), or one that never needed the guard because it
      already wrote the header correctly from the compressed rule. A Sonnet
      probe given only the compressed text correctly derived that the
      concrete marker text comes from the guard's deny message rather than
      being invented, that the harness's own footer must be left untouched,
      that a commit trailer must never be hand-written, and that a deny
      message — not some other doc — is what to read and follow when one of
      these is blocked.
  - problem: >
      CLAUDE.md's Working conventions carried a three-step branch-off
      checklist — scan the task instructions for a caller-pinned designated
      branch, `git fetch origin main`, then branch off `origin/main` — and
      `blog-post`, `digest`, `audit-skills` and `audit-docs` each opened with
      a "Branch off `origin/main`" step pointing at it. That instruction was
      the cause of the failure it warned about (#666, #625, #684): the harness
      already checks the pinned branch out at session start, so a session left
      alone keeps it, and six recorded sessions left it only because the text
      told them to cut a new branch off `origin/main`. Pruned to one sentence
      — work on the branch your session started on; if that is `main`, cut one
      off `origin/main` first, any name — and reduced each Skill's step to a
      pointer at it. Net -24 lines across the five files.
    territory:
      paths:
        - "CLAUDE.md: the branch-off bullet (Working conventions)"
        - ".agents/skills/blog-post/SKILL.md: \"§2. Get on a working branch\""
        - ".agents/skills/digest/SKILL.md: \"§1. Get on a working branch\""
        - ".agents/skills/audit-skills/SKILL.md: \"§1. Get on a working branch\""
        - ".agents/skills/audit-docs/SKILL.md: \"§1. Get on a working branch\""
      keywords:
        - branch off origin/main
        - caller-pinned branch
        - designated branch
        - branch-off checklist
        - git fetch origin main
    opened: 2026-09-05
    proven: false
    check: >
      Damage is a session that starts on a pinned `claude/*` branch and still
      creates a differently named branch for its work, or a session that
      starts on `main` and commits or pushes there instead of cutting a branch
      first. NOT damage: a session that stays on its starting branch without
      fetching (there is nothing to branch off), a subagent creating its own
      worktree branch (the sanctioned isolation path), or a session cutting a
      branch off `origin/main` because it genuinely started on `main`.
      `proven: false` — this prune shipped from a dispatched review subagent
      with no subagent tool of its own, so §4's Sonnet probe could not be run.
  - problem: >
      CLAUDE.md's Ground rules bullet on external pack Skills, and
      `frictions-to-fixes/SKILL.md`'s §2 screening step, each independently
      re-derived the same already-mechanized rule: don't edit an external
      pack Skill's `SKILL.md` (`skills-lock.json`-keyed), because a re-install
      clobbers the edit and `pnpm verify:skills-lock` (part of `pnpm gate`,
      ADR-0015's 2026-07-11 amendment) already gate-enforces it. CLAUDE.md's
      bullet additionally previewed the mechanism's internals ("what it pins,
      and the `--write` re-pin step after a legitimate pack install") that
      ADR-0015's own amendment text already states in full — a pointer
      duplicating its referent's content, not just naming it. Compressed
      CLAUDE.md's bullet to the rule, the one-line why, the two places to put
      an improvement instead (upstream; the Skill Inventory entry), and a
      bare pointer to ADR-0015 for the mechanism. Compressed
      `frictions-to-fixes/SKILL.md`'s screening step to keep its own
      locally-relevant reasoning (the gate would reject the edit anyway, so
      screening it out here just avoids a wasted round-trip) while dropping
      its restatement of the "why" and the `skills-lock.json` definition,
      which CLAUDE.md already states and this step already cites by name.
      Net -7 lines across the two files.
    territory:
      paths:
        - "CLAUDE.md: the \"Skills … off limits to edit\" bullet (Ground rules)"
        - ".agents/skills/frictions-to-fixes/SKILL.md: \"§2. Screen against fixes already shipped\", the external-pack-Skill paragraph"
      keywords:
        - skills-lock.json
        - external pack Skill
        - verify:skills-lock
        - pack Skill's SKILL.md
    opened: 2026-09-04
    proven: true
    check: >
      Damage is a session that, needing the actual reason a pack Skill edit is
      off limits or what `verify:skills-lock` actually pins, stops at either
      compressed text and guesses wrong instead of opening ADR-0015 — or a
      session that attempts to edit a pack Skill's `SKILL.md` because the
      compressed bullet reads as less binding than the old one, or because
      `frictions-to-fixes`'s trimmed screening step no longer names
      `skills-lock.json` explicitly and the session can't recognize a
      candidate as pack-owned. NOT damage: a session opening ADR-0015 before
      asserting the mechanism's exact pinning/re-pin behaviour (the intended
      single-home behaviour working), or a session hitting `pnpm
      verify:skills-lock`'s own gate failure and fixing it from the failure
      message rather than the doc. A Sonnet probe given only the compressed
      text correctly derived that an external pack Skill's `SKILL.md` must
      never be edited, that a genuine improvement goes upstream instead, that
      a repo-specific note belongs in the Skill Inventory entry, and that the
      gate (`verify:skills-lock`) would reject the edit regardless of the
      screening step.
  - problem: >
      CLAUDE.md's Working conventions bullet on piping a backgrounded or
      long-running command through a trailing `tail`/`head`/`echo` fully
      re-derived, in eleven lines of prose, an explanation now made redundant
      by `scripts/tail-pipe-guard.ts` (issue #873; two earlier prose fixes,
      #384 and #812, hadn't held) — a fail-closed `PreToolUse` guard that ships
      on this branch but wasn't reflected as built in
      `docs/research/rulebook-migration-table.md`'s CM-38 row. The guard's own
      `formatGuardMessage()` states, almost verbatim, the same "loses its real
      exit status and can truncate its output... redirect to a file instead
      (`cmd > log 2>&1`), check `$?` directly, then read the file" the bullet
      spelled out at length, and `docs/agents/guards.md`'s roster row already
      documents the guard's exact scope (backgrounded-or-known-long-runner
      only; an ordinary short pipe is untouched). Compressed the bullet to the
      rule, the one-line why, the fix, and a pointer to the guard + its issue —
      same shape as the already-landed `ToolSearch`/`ScheduleWakeup` compression
      (CLAUDE.md, ADR-0027 prune history), which proved a guard's own deny
      message can carry the worked-example detail instead of the doc. Net -5
      lines.
    territory:
      paths:
        - "CLAUDE.md: the \"Never pipe a backgrounded or long-running command\" bullet (Working conventions)"
      keywords:
        - tail-pipe-guard.ts
        - trailing tail
        - trailing head
        - pipe into
        - exit status
    opened: 2026-09-05
    proven: true
    check: >
      Damage is a session that, needing the actual reason a trailing
      `tail`/`head`/`echo` pipe is risky or the actual redirect fix, stops at
      the compressed bullet and guesses wrong instead of opening
      `docs/agents/guards.md` or simply attempting the call and reading the
      guard's own deny message — or a session that loses a real failure's exit
      status through a shape the guard's known fail-open gaps miss (a
      long-runner reached only through a variable, a wrapper script, or
      `xargs`; a trailing stage other than `tail`/`head`/`echo`) because the
      compressed bullet no longer spells out the general redirect-and-check-$?
      habit. NOT damage: a session that gets denied and follows the guard's
      own named fix (the intended teach-at-the-moment-of-failure design
      working), or one that redirects to a file and checks `$?` from the
      surviving one-sentence rule without ever needing the guard to fire. A
      Sonnet probe given only the compressed text correctly derived that a
      backgrounded or long-running command must never pipe into a trailing
      `tail`/`head`/`echo`, and that the fix is redirecting to a file and
      checking `$?` directly rather than trusting the pipeline's own exit
      status.
  - problem: >
      `docs/agents/git-conventions.md`'s "If a checkout is still shallow"
      section carried 45 lines explaining a scenario the repo already prevents
      mechanically: `scripts/unshallow-on-start.ts` (a `SessionStart` hook)
      unshallows before a session's first turn, so the section's entire
      audience is the narrow leftover case where that fetch itself failed
      (offline, no network). Within that already-narrow case, the section then
      spent two more paragraphs re-deriving, from first principles, exactly
      what `scripts/gate.ts`'s own code comment states and cites by name
      ("Why classifying off a shallow clone is unsafe at all:
      docs/agents/git-conventions.md, and #849") — the grafted-parentless-
      boundary mechanics, a worked revert-branch example of how a shallow
      `merge-base` diff can silently under-report rather than over-report, and
      a restatement of `changedPaths()`/`changedPathsBetween()`'s asymmetric
      repair-vs-refuse behaviour that the script's own comments already carry
      next to the code. Compressed to the rule (don't trust history off a
      still-shallow clone; a shallow `merge-base` can under-report, not just
      over-report, so unshallow and verify before any history-based
      conclusion), the one-line why, the fix (`git fetch --unshallow`), and a
      pointer to `scripts/gate.ts` + issue #849 +
      `tests/unit/gate-shallow-base.spec.ts` for the mechanics — same shape as
      the already-landed `ToolSearch`/`ScheduleWakeup` and tail-pipe-guard
      compressions, applied here to a hook instead of a `PreToolUse` guard.
      Net -30 lines.
    territory:
      paths:
        - "docs/agents/git-conventions.md: \"If a checkout is still shallow\" section, including the \"A shallow `merge-base` can be wrong\" subsection"
      keywords:
        - shallow checkout
        - unshallow-on-start.ts
        - merge-base can be wrong
        - grafted parentless
        - under-report
        - gate-shallow-base.spec.ts
    opened: 2026-09-07
    proven: true
    check: >
      Damage is a session that, having actually hit a still-shallow clone (the
      unshallow hook's fetch failed) and needing to know what that silently
      gets wrong, stops at the compressed section and either trusts a
      merge-base-derived diff/history conclusion anyway or can't recall that
      the failure mode is under-reporting (not just over-reporting, which
      would read as the safer direction). NOT damage: a session that runs
      `git fetch --unshallow` and re-verifies before trusting history off a
      shallow clone, without ever needing the worked revert-branch mechanics
      (the intended point-of-need pointer working), or a session that never
      meets a shallow clone at all because the `SessionStart` hook did its
      job. A Sonnet probe given only the compressed text correctly derived
      that a still-shallow clone must never be trusted for a history-based
      conclusion, that the fix is `git fetch --unshallow` before proceeding,
      and that a shallow `merge-base` diff's failure mode is silently
      under-reporting changes rather than only over-reporting them.
