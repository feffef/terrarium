# Open Prune Trials (ADR-0027). One entry per pruned problem. The window runs
# from when the prune lands on `main`, not from `opened:`;
# `pnpm exec tsx .agents/skills/prune-trial/scripts/find-trial-window.ts`
# gives it. An entry is deleted the moment `/prune-trial` judges it — git holds the history, this
# file holds only what is unjudged.
#
# The entry ships in the prune's own commit, so that commit is the record: to
# read back what was cut, `git log` this file. Nothing here has to be filled in
# after the PR merges.
#
# trials:
#   - problem: what the pruned prose was trying to prevent
#     territory:                     # the next trial must not overlap these
#       paths:
#         - path/or/file/touched
#       keywords:
#         - keyword or phrase
#     opened: 2026-08-23
#     proven: false                  # only when §4's Sonnet probe could not run
#     check: how you would tell this broke — written now, while you still
#            remember what the prose was for. Prose, not a command; say what
#            distinguishes real damage from a session simply using the pruned
#            topic's tools correctly.
trials:
  - problem: >
      The `frictions-to-fixes` SKILL.md procedure (-113 net, from
      `git diff --numstat`: 110 added, 223 deleted; this entry not counted):
      rewritten goal-first, keeping the §1-§8 numbers other Skills cite; the
      per-step "Done when", "Edge cases" and "Instructions" scaffolding folded into
      prose, repeated restatements of the briefs and ledger commands cut; every
      rule kept (regression cap, 3-issue cap, Human-only and guard surfaces, doc
      batching, two gates at once, review comment before merge, escalation,
      closing ledger PR). Briefs untouched. Chosen after the search subagent
      covered CLAUDE.md, `docs/agents/`, rules, Skills and the 125 ledger files
      plus the tracker (not guard records or workflows): ledger
      `frictions-to-fixes-skill-gaps` (11 occurrences; #2333, #2545, #2724, #2960)
      and `frictions-to-fixes-briefs-mismatch` (12; #2436, #2725, #2877) failed as
      prose, 92 commits narrowed the file, nothing wired holds the steps.
      Runners-up: dispatch-subagents §3 (already cut once, #3123) and
      close-session/log-session (small, log-session.ts refuses a hand log).
      No open trial was judgeable this run (`find-trial-window.ts`: all three
      before `judgeable from:`).
    territory:
      paths:
        - ".agents/skills/frictions-to-fixes/SKILL.md"
      keywords:
        - frictions-to-fixes
        - ledger PR
    opened: 2026-11-12
    proven: true
    check: >
      Damage is a major or blocker Friction where a `frictions-to-fixes` run
      skipped a rule the old text had (opened no ledger PR, picked a regression,
      filed over the cap, dispatched a Human-only or guard fix, merged without a
      posted review, skipped the closing ledger PR) or could not follow a step.
      Compare `frictions-to-fixes-skill-gaps` and
      `frictions-to-fixes-briefs-mismatch` shares with `friction-rates.ts`; a
      clear rise is also damage. NOT damage: those entries at their standing
      rates.
  - problem: >
      The checkout-moving rule in `dispatch-subagents` §3 "Git and checkout" (-1
      net, from `git diff --numstat`: 5 added, 6 deleted; this entry not
      counted): three bullets that each said a review or read-only agent must not
      move a checkout merged into one goal-first bullet; every rule kept.
      Chosen after the search subagent covered the ledger (133 files), guards.md,
      hook headers and the first page of open issues (not session logs, not the
      whole tracker): `worktree-subagent-moves-branch`
      (5 occurrences, #2874) failed as prose and was narrowed in #2856 and #2888;
      nothing wired holds it, so the cut is deliberately small. Runners-up:
      CLAUDE.md dispatch-read bullet (`dispatch-read-guard.ts` already holds it)
      and `glassbox-curate` "Read first, in full" (33 words, #3226). Same run
      judged and deleted two trials: the review-then-gate rule (landed 298c69af):
      `prepush-gate-review-skipped` 10.3% -> 7.3% (14/136 -> 7/96),
      `edit-during-gate-run` 10.3% -> 16.7% (14/136 -> 16/96), the rise traced to
      the guard gap #3250 closed, comment on #3233; and the git chaining rules
      (landed fe75f908): `push-chained-to-gate-run` 3.9% -> 6.5% (6/155 -> 5/77),
      `chained-git-step-fails-silently` 3.2% -> 2.6% (5/155 -> 2/77), no major or
      blocker Friction; no issue.
    territory:
      paths:
        - ".agents/skills/dispatch-subagents/SKILL.md: §3 'Git and checkout'"
      keywords:
        - never moves a checkout
        - detached worktree
    opened: 2026-11-13
    proven: true
    check: >
      Damage is a major or blocker Friction where a review or read-only subagent
      ran `checkout`, `switch` or `reset` in the lead's checkout, or an impl
      agent's branch collided with the lead's, because a cut line no longer said
      so. Compare `worktree-subagent-moves-branch` share with `friction-rates.ts`;
      a clear rise is also damage. NOT damage: that entry at its standing rate.
  - problem: >
      The "read `dispatch-subagents` first" lines in four Skills (-5 net, from
      `git diff --numstat`: 2 added, 7 deleted; this entry not counted): the
      "Read first" line in `blog-post` §6 and `visitor-loop` §2, the "(the
      Workflow guard asks for it)" read in `clear-backlog`, and the
      `dispatch-subagents` entry in `glassbox-curate`'s read-first list.
      `dispatch-read-guard.ts` denies a main-session dispatch until the Skill is
      read and names it, so the lines only restated it; CLAUDE.md's trigger stays,
      since the guard's message cites it. Chosen after the search subagent covered
      CLAUDE.md, GLOSSARY.md, `docs/agents/`, rules, Skills, hook headers, the
      ledger and the tracker (guard mechanism records read by the subagent only
      in part): `dispatch-read-guard-deny` (62 occurrences; fixes #2768, #3136,
      #3196 each added a read-first line) failed as prose and the guard holds it.
      Runners-up: `edit-during-gate-run` (guard 3 days old, about 20 words) and
      CLAUDE.md "Docs you must read first" (hint-only, so unsafe). Same run
      judged and deleted the blocked-hosts trial (landed ddb21638):
      `harness-proxy-blocks` 4.0% -> 3.9% (7/175 -> 3/76); the post-landing
      Frictions are nit or minor and none concern a blocked host; no issue.
    territory:
      paths:
        - ".agents/skills/blog-post/SKILL.md: §6 'Read first' line"
        - ".agents/skills/visitor-loop/SKILL.md: §2 'Read first' line"
        - ".agents/skills/clear-backlog/SKILL.md: the dispatch-subagents read"
        - ".agents/skills/glassbox-curate/SKILL.md: read-first list"
      keywords:
        - dispatch-read guard
        - Read first dispatch-subagents
    opened: 2026-11-14
    proven: true
    check: >
      Damage is a major or blocker Friction where a session dispatched a brief
      from one of these four Skills and broke a `dispatch-subagents` rule (stranded
      work, a moved checkout, an unfilled brief) because it never read the Skill.
      Compare `dispatch-read-guard-deny` share with `friction-rates.ts`; a clear
      rise is also damage. NOT damage: one guard denial followed by a read, the
      standing cost the owner accepted (#2580).
