# Open Prune Trials (ADR-0027). One entry per pruned problem. The window runs
# from when the prune lands on `main`, not from `opened:`;
# `pnpm exec tsx scripts/prune-trial-window.ts` gives it. An entry
# is deleted the moment `/prune-trial` judges it — git holds the history, this
# file holds only what is unjudged.
#
# The entry ships in the prune's own commit, so that commit is the record: to
# read back what was cut, `git log` this file. Nothing here has to be filled in
# after the PR merges.
#
# trials:
#   - problem: what the pruned prose was trying to prevent
#     territory:                     # the next trial must not overlap these
#       paths:
#         - path/or/file/touched
#       keywords:
#         - keyword or phrase
#     opened: 2026-08-23
#     proven: false                  # only when §4's Sonnet probe could not run
#     check: how you would tell this broke — written now, while you still
#            remember what the prose was for. Prose, not a command; say what
#            distinguishes real damage from a session simply using the pruned
#            topic's tools correctly.
trials:
  - problem: >
      `docs/agents/guards.md` (102 lines rewritten to 88, every rule and every
      section name other files cite kept): the conventions' incident stories
      (the 26-test miss, the hot-path cost) cut to the rule plus a clause, the
      intro and probe notes tightened, "Known gaps" cut to the two shared gaps
      and a pointer to each script header, where the per-guard ones live. The
      guard behaviours it legislates failed as prose (#873, #886, #1223, #1208;
      read via the search subagent's report, not re-read in full) and are held by
      the guards' own code, `tests/unit/guards-wiring.spec.ts` and
      `guard-wrap.sh`. The search subagent (this run) covered the instruction
      corpus, the rulebook table (excluded list included), guards.md, the
      tracker and github-integration.md. Its top candidate, the Built rows of
      the rulebook table's §5, was skipped: it shares a file with an open
      trial, and §8's row counts are computed from those rows. Net about -14
      lines; the mass here was small. The same run judged and deleted the
      git-conventions trial: only nit/minor Frictions (fetch-order slips), no
      regression issue. Issue #1712 (a wrong sentence in that file) is a
      pre-existing flaw, not damage.
    territory:
      paths:
        - "docs/agents/guards.md (all of it)"
      keywords:
        - Conventions every guard follows
        - Probed live, and still unknown
        - Known gaps
    opened: 2026-10-11
    proven: true
    check: >
      Damage is a major or blocker Friction where a session changes or adds a
      guard without the registry row, matcher line, unit test or live probe,
      dispatches an unattended session to change a guard or hook wiring, or
      routes around a deny message, and a line the old file carried would have
      prevented it. NOT damage: a guard denying and the session fixing itself
      from the message, or reading a script header instead of this page.
  - problem: >
      The landing recipe in `docs/agents/pr-workflow.md` (the recipe steps and the
      closing-keyword, restart-branch, follow-up-push and reply-before-resolve
      paragraphs, about 24 lines cut; steps keep their numbers because
      `merge-pr.ts`, issue-tracker.md and github-integration.md cite them). It
      failed as prose: #853 and #1276 (both read in full; #1276 says the verdict
      line was read and skipped) and is now held by `scripts/merge-pr.ts`
      (verdict, fork/Public refusal, closing-keyword reconcile). Nothing yet denies
      an APPROVE review or `enable_pr_auto_merge`, so those two rules stay. The
      hand-poll fallback for a missing script was cut. The search subagent covered
      the instruction corpus, the rulebook table, guards.md, guard headers and
      the tracker; runners-up: provenance-header restatements across ~10 Skills
      (thin per file) and guards.md conventions (weak on "failed"). The same run
      judged two trials. CLAUDE.md: one major (a recommendation given without
      reading the binding ADRs, since the trigger said "plan"), so the trigger
      now reads "plan or recommend". dispatch-subagents: only nit/minor, holds.
    territory:
      paths:
        - "docs/agents/pr-workflow.md: 'The recipe' section and the paragraphs after it down to the title/description sync paragraph"
      keywords:
        - Land through `scripts/merge-pr.ts`
        - closing keyword
        - send_later check-ins
    opened: 2026-10-10
    proven: true
    check: >
      Damage is a major or blocker Friction where a session merges without a
      posted verdict, approves a PR, arms auto-merge, closes a tracking issue
      by a stray closing keyword, or merges a PR whose cited ADR went stale,
      and a line the old recipe carried would have prevented it. NOT damage:
      merge-pr.ts refusing and the session fixing itself from the message.
  - problem: >
      `blog-post` step 12 (the reply decision), `.agents/skills/blog-post/SKILL.md`:
      38 lines cut to 23, every rule kept, the "skipped five times" history cut to
      a pointer to #1626. The rule failed as prose: skipped in 4 live runs, narrowed
      to "owed" (PR #1602), skipped a fifth time (#1626, read in full via the
      search subagent's report of it). No guard or test holds it. No trial was
      judgeable this run (all three land inside their window). The search
      subagent covered the instruction corpus, the tracker (#1626, #1610, #1859,
      #1785 read) and guard records; runners-up: close-session-at-PR-open (held
      now by the read-first hint, #1868) and foreground gate:scoped (3 lines).
      Net about -15 lines; the mass here was small.
    territory:
      paths:
        - ".agents/skills/blog-post/SKILL.md: step 12 only"
      keywords:
        - Decide on a reply
        - reply decision
    opened: 2026-10-13
    proven: true
    check: >
      Damage is a major or blocker Friction where a blog-post run merged its post
      and ended without a reader-dispatched reply decision, or shipped a reply
      without the second reader, and a line the old step carried would have
      prevented it. NOT damage: a reader's "none" with a comment on the first PR.
