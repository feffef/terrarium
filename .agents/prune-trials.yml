# Open Prune Trials (ADR-0027). One entry per pruned problem. The window runs
# from when the prune lands on `main`, not from `opened:`;
# `pnpm exec tsx scripts/prune-trial-window.ts` gives it. An entry
# is deleted the moment `/prune-trial` judges it — git holds the history, this
# file holds only what is unjudged.
#
# The entry ships in the prune's own commit, so that commit is the record: to
# read back what was cut, `git log` this file. Nothing here has to be filled in
# after the PR merges.
#
# trials:
#   - problem: what the pruned prose was trying to prevent
#     territory:                     # the next trial must not overlap these
#       paths:
#         - path/or/file/touched
#       keywords:
#         - keyword or phrase
#     opened: 2026-08-23
#     proven: false                  # only when §4's Sonnet probe could not run
#     check: how you would tell this broke — written now, while you still
#            remember what the prose was for. Prose, not a command; say what
#            distinguishes real damage from a session simply using the pruned
#            topic's tools correctly.
trials:
  - problem: >
      `close-session` SKILL.md rewritten plainly, 60 lines to 46 (-14): the
      three logging conditions and the PR-open sequence cut to one goal-shaped
      paragraph and a numbered list, every rule kept (re-read, log, re-invoke,
      HUMAN-PROMPTED-CLOSURE, no worktree self-invoke). The rule failed as prose:
      skipped after PR #1821 (#1859) and after the hint of PR #1868 (#2023, both
      read in full via the search subagent). `read-first-hint.ts` now holds the
      PR-open invocation, not the re-invocation. The subagent covered the
      instruction corpus (not the Journal) and the tracker; runners-up: the
      read-first triggers in CLAUDE.md (#1754, held by the same hint) and the
      restart-after-merge paragraph in pr-workflow.md (held by
      `stale-info-hint.ts`). The mass here was small. No trial was judgeable.
    territory:
      paths:
        - ".agents/skills/close-session/SKILL.md (all of it)"
        - ".agents/skills/blog-post/SKILL.md: the `Done when` line near the end"
      keywords:
        - HUMAN-PROMPTED-CLOSURE
        - logging duty
    opened: 2026-10-15
    proven: true
    check: >
      Damage is a major or blocker Friction where a session ended with its log
      missing or left at `in-review` after the work landed, or reran close-session
      without the always-loaded re-read, and a line the old Skill carried would have
      prevented it. NOT damage: the read-first hint firing, or a session that
      logs `HUMAN-PROMPTED-CLOSURE` correctly.
  - problem: >
      `docs/agents/github-integration.md` rewritten plainly, 190 lines to 159
      (-31): the overflow and precision traps merged and shortened (the
      `fields`-on-search rule is held by `github-search-fields-guard.ts`, which
      failed as prose in #1860, read via the search subagent's report), the
      script escapes cut to a line each, the 503 and angle-bracket notes
      tightened. Section names the guard message and other docs cite are kept.
      The search subagent covered the instruction corpus, guard headers and the
      tracker; runners-up: provenance-header restatements across ~10 Skills (thin
      per file) and deferred-tool resolution (host behaviour, not prunable). Same
      run judged and deleted two trials (guards.md; the pr-workflow recipe): only
      nit/minor Frictions, no regression issue. The mass here was small.
    territory:
      paths:
        - "docs/agents/github-integration.md (all of it)"
      keywords:
        - Overflow and precision traps
        - Script escapes
        - Write traps
    opened: 2026-10-14
    proven: true
    check: >
      Damage is a major or blocker Friction where a session overflowed its
      context on a GitHub list/search/log call, hit a 403 search rate limit
      repeatedly, or missed a real issue by trusting a zero-hit search, and a
      line the old page carried would have prevented it. NOT damage: the
      fields guard denying and the session fixing itself from the message.
  - problem: >
      `docs/agents/pr-workflow.md` rewritten plainly, 116 lines to 104 (-12): the
      self-merge discipline (verdict comment, `Reviewed: <sha>`, no auto-merge,
      closing keywords) cut to the rule and a pointer to `merge-pr.ts`, which now
      holds it mechanically; issue histories cut. Step numbers and section names
      kept (cited elsewhere). The rule failed as prose: #1113 then #1276 (read in
      full via the search subagent), fixed by the `merge-pr.ts` check (#1311).
      The subagent covered the instruction corpus, guard headers and the tracker;
      runners-up: provenance-header restatements (about half is skill-specific),
      backgrounding rules (about 8 lines). `merge-pr.ts` itself is Human-only, so
      its header was left. Same run judged and deleted the `blog-post` step 12
      trial (landed 6a8a02ca, judgeable from 2026-10-16T12:30Z per the window script): only
      nit/minor Frictions, no regression issue. Sonnet probe read SHA a5eaf65b. The mass
      here was small; no criterion-1 candidate cleared the bar for a larger cut.
    territory:
      paths:
        - "docs/agents/pr-workflow.md (all of it)"
      keywords:
        - Reviewed:
        - enable_pr_auto_merge
        - closing keyword
    opened: 2026-10-16
    proven: true
    check: >
      Damage is a major or blocker Friction where a session merged without a
      verdict naming the head, called `enable_pr_auto_merge`, closed an issue its
      PR only related to, or skipped the pre-push review, and a line the old page
      carried would have prevented it. NOT damage: `merge-pr.ts` refusing and the
      session fixing itself from its message.
