# Open Prune Trials (ADR-0027). One entry per pruned problem. The window runs
# from when the prune lands on `main`, not from `opened:`;
# `pnpm exec tsx .agents/skills/prune-trial/scripts/find-trial-window.ts`
# gives it. An entry is deleted the moment `/prune-trial` judges it — git holds the history, this
# file holds only what is unjudged.
#
# The entry ships in the prune's own commit, so that commit is the record: to
# read back what was cut, `git log` this file. Nothing here has to be filled in
# after the PR merges.
#
# trials:
#   - problem: what the pruned prose was trying to prevent
#     territory:                     # the next trial must not overlap these
#       paths:
#         - path/or/file/touched
#       keywords:
#         - keyword or phrase
#     opened: 2026-08-23
#     proven: false                  # only when §4's Sonnet probe could not run
#     check: how you would tell this broke — written now, while you still
#            remember what the prose was for. Prose, not a command; say what
#            distinguishes real damage from a session simply using the pruned
#            topic's tools correctly.
trials:
  - problem: >
      `docs/agents/pr-workflow.md` plainly reworded (-2 net: 118 lines to 116;
      the pre-push review section's "simple change" bar is reworded, with one
      added line (count, don't judge); the integration-PR, recipe steps 2-3, closing-keyword, "Who merges" and
      "Closing a scheduled run's PR" prose shortened, every rule kept.
      The Glass Box page's excerpt is pinned to its own `revision`, so it is
      untouched. Chosen after the search
      subagent covered the instruction corpus and the tracker: the pre-push
      gate/review rule failed as prose repeatedly (#2311, #2354, #2397; #2397
      read in full) and no guard holds it (#2397 left the guard question open;
      ADR-0004's summary rule, untouched, still carries the rule). Runners-up:
      Stop-hook inherited-commit advice (#2233, owner accepted the cost),
      CLAUDE.md read-first triggers (#1754, partly held by read-first-hint.ts).
      The mass here was small; no trial was judgeable this run (all five landed
      under three days ago, per the window script).
    territory:
      paths:
        - "docs/agents/pr-workflow.md (all of it)"
      keywords:
        - Review before the first push
        - simple change
    opened: 2026-10-22
    proven: true
    check: >
      Damage is a major or blocker Friction where a session skipped `code-review`
      or `gate:scoped` before a first push, judged a non-simple change simple,
      merged without a verdict, or mishandled a closing keyword, and the old
      wording would have prevented it. NOT damage: the nit-level chaining or
      Stop-hook slips #2397 already records, which this prune did not touch.
  - problem: >
      Long-command backgrounding cut to one home (-2 net): CLAUDE.md's
      Self-verification bullet tightened (4 lines to 3, rule and 600s why kept),
      and `blog-post` §10's restatement ("`run_in_background: true`, logging to
      the scratchpad") dropped. Chosen, at a Trusted user's pick, after the
      search subagent covered the instruction corpus, guard headers and the
      tracker: the rule failed as prose three times (#1293, #2265, #2426; all
      three read in full by the subagent, #2426 by me) and nothing holds it for
      the main session (`double-background-guard` and
      `subagent-background-guard` cover adjacent cases). #2426 already proposes
      the guard. Runners-up: close-session duplicates (#2424, #2209; partly held
      by read-first-hint), a plain rewrite of `git-conventions.md`. Same run
      judged and deleted the deferred-tool-guard trial (landed d895e7ec,
      judgeable from 2026-10-22T15:31Z per the window script): 57 sessions, only
      nit deferred-tool Frictions (Monitor called unloaded, self-corrected), no
      regression issue. The mass here was small.
    territory:
      paths:
        - "CLAUDE.md: the Self-verification 'Run anything that can take over 2 minutes' bullet"
        - ".agents/skills/blog-post/SKILL.md: §10 (Gate)"
      keywords:
        - run_in_background
        - foreground-gate
    opened: 2026-10-23
    check: >
      Damage is a major or blocker Friction where a session ran a long command
      (gate:scoped, a build, e2e) in the foreground and lost it to the 600s cap,
      or started it with a shell `&` it then could not wait on, and the cut
      wording (or blog-post's restatement) would have prevented it. NOT damage:
      the nit/minor slips #2426 already records at the old wording's rate, or a
      guard denying and the session fixing itself.
  - problem: >
      Workflow-write ban (cloud session cannot write `.github/workflows/*`) cut
      to its one home each (-27 net): the `workflow-edit-guard.ts` header
      (40 lines to 20) keeps purpose, usage and the fail-open list but drops the
      mechanic retelling and incident asides; the `.sh` pre-filter comment and
      the `environment-caveats.md` bullet are shortened (recovery recipe, proposals
      pointer and issue pointers kept). Chosen after the search subagent covered
      the instruction corpus, guard headers and the tracker (it ran list and REST
      reads of issues 1247-2439, about 60 bodies): the ban failed as prose (#897,
      again #1955) and the wired guard (unit-tested) holds it. Larger candidates
      were read-first triggers (about 69 lines; #1754, #1819, #2146; the owner
      accepted late reads, nothing denies) and provenance header (about 37 lines).
      Judged and deleted the dispatch-subagents §3 trial (landed 81bc1915,
      judgeable from 2026-10-23T12:28Z per the window script): 47 sessions, no
      major or blocker Friction traces to it (a shared-checkout `git checkout`
      by a triage agent, g9zpjr, was minor; the foreground-gate clash with
      CLAUDE.md was a nit, already #2426).
    territory:
      paths:
        - "scripts/hooks/workflow-edit-guard.ts and .sh: header comments"
        - "docs/agents/environment-caveats.md: the `.github/workflows/*` bullet"
      keywords:
        - workflow scope
        - workflow-edit-guard
    opened: 2026-10-23
    check: >
      Damage is a major or blocker Friction where a cloud session committed a
      change to `.github/workflows/*` (or stranded commits behind a rejected
      push) and could not recover or knew no recovery because the cut text was
      gone. NOT damage: the guard denying a write and the session moving the
      edit to `docs/proposals/`, or a local session pushing a workflow file.
  - problem: >
      `git-conventions.md` "When the Stop hook flags unpushed or inherited
      commits" reworded to the goal (-4 net: 15 lines to 11, from
      `git diff --numstat`): the two rules kept (fix only commits this session
      made, check `git log origin/main..HEAD`; push the branch when that list is
      empty), the narration dropped. Chosen after the search subagent covered
      the instruction corpus, guard headers and the tracker: the advice failed
      as prose (#2233, read in full: four docs fixes did not stop the nag, then
      the owner accepted the cost) and nothing in the repo holds it, since the
      nag comes from a harness script (#2233's triage). Runners-up: "Verify
      before you state" family (five homes, #2476, #2435; nothing holds it, so
      the riskiest), CLAUDE.md read-first triggers (31 lines; partly held by
      `read-first-hint.ts`), `close-session` restatements (one-liners that
      carry step detail). Same run judged and deleted the audit-docs and
      github-integration search-bullets trials (landed e07c4a65 and ad00ba7d):
      59 sessions since e07c4a65, no major or blocker Friction traces to either
      (the one major is a close-session slip, #2418).
    territory:
      paths:
        - "docs/agents/git-conventions.md: the Stop-hook section"
      keywords:
        - inherited commits
        - reset-author
    opened: 2026-10-24
    proven: true
    check: >
      Damage is a major or blocker Friction where a session rebased or rewrote
      public history (a commit outside `git log origin/main..HEAD`), or pushed
      `main` or forced a push, to quiet the Stop hook, and the cut wording would
      have prevented it. NOT damage: the nag itself, or a session declining it
      (#2233 accepted that cost).
  - problem: >
      "Verify before you state" family cut to one home (-4 net in the prune
      files, from `git diff --numstat`; this entry not counted): CLAUDE.md's
      bullet rewritten plainly (3 lines to 3; now names subagent reports and
      says to count every item, never from memory or a summary). Restatements
      dropped: `dispatch-subagents` §3's "A subagent's prose is candidate
      material" bullet, `audit-skills`' "hearsay until you have verified it
      (CLAUDE.md)" lead-in (its check-each-finding step kept), `clear-backlog`
      §3's "past runs relayed subagent claims unchecked" aside, and the
      `clear-backlog-build` Standards reviewer's uncited-count check (#2378).
      Picked by the owner in the #2522 grilling (option 2: test whether the
      prose does anything); the prose failed after #2336, #2378 and #2483, all
      recurrences nit or minor (ledger `counts-not-tallied`). Kept as
      step-specific nudges: `clear-backlog` §2's verify-each-pick line,
      `auto-triage`'s per-issue verify brief, the `clear-backlog-explore`
      sideFinding `source` field (#2435), `blog-post`'s citing-facts reference,
      `visitor-loop` §3, `digest`'s fact-check tally, and
      `github-integration.md`'s "A search result is not proof". No trial was
      judgeable this run (earliest floor 2026-10-26T10:18Z, per the window
      script).
    territory:
      paths:
        - "CLAUDE.md: the Working conventions 'Verify before you state' bullet"
        - ".agents/skills/dispatch-subagents/SKILL.md: §3 (Write the brief), its last bullets"
        - ".agents/skills/audit-skills/SKILL.md: the paragraph after the subagent dispatch"
        - ".agents/skills/clear-backlog/SKILL.md: §3's `ready-to-push` bullet"
        - ".claude/workflows/clear-backlog-build.js: reviewPrompt's Standards axis text"
      keywords:
        - Verify before you state
        - count is a fact
        - candidate material
        - hearsay
    opened: 2026-10-25
    proven: true
    check: >
      Damage is a major or blocker Friction where a session stated an unchecked
      count, id, cause or another agent's claim, that statement changed an
      outcome (a wrong merge, a wrong issue state, a misled owner acting on
      it), and the cut text would have prevented it. NOT damage: nit or minor
      miscounts caught by the agent or a reviewer, which is the cost #2522
      already records.
