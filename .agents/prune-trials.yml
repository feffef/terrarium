# Open Prune Trials (ADR-0027). One entry per pruned problem; the verdict is due
# three days after the prune lands on `main` — ADR-0027's window runs from the
# landing, not from `opened:` below (get the real landing with
# `pnpm exec tsx scripts/prune-trial-window.ts`; see the prune-trial Skill's §1). An entry
# is deleted the moment `/prune-trial` judges it — git holds the history, this
# file holds only what is unjudged.
#
# The entry ships in the prune's own commit, so that commit is the record: to
# read back what was cut, `git log` this file. Nothing here has to be filled in
# after the PR merges.
#
# trials:
#   - problem: what the pruned prose was trying to prevent
#     territory:                     # the next trial must not overlap these
#       paths:
#         - path/or/file/touched
#       keywords:
#         - keyword or phrase
#     opened: 2026-08-23
#     proven: false                  # only when §4's Sonnet probe could not run
#     check: how you would tell this broke — written now, while you still
#            remember what the prose was for. Prose, not a command; say what
#            distinguishes real damage from a session simply using the pruned
#            topic's tools correctly.
trials:
  - problem: >
      `docs/agents/pr-workflow.md`'s step 5 ("Before calling `merge-pr.ts`:
      step 4's verdict comment must already be posted") already failed twice:
      first as issue #1113, fixed by PR #1115 (merged 2026-09-03) which pulled
      the ordering requirement into an explicit bolded precondition — then
      regressed 15 days later as issue #1276 (filed 2026-09-19, still open),
      where a session's own `docsRead` confirms it opened this exact doc that
      session and still called `merge-pr.ts` on PR #1274 before posting the
      verdict, merging before the session caught it. #1276 explicitly declines
      a second doc-only wording pass ("not recommended given it already didn't
      hold once") and instead flags a mechanical pre-merge check in
      `merge-pr.ts` for human review — so, like the currently-open
      run_in_background trial, this is criterion 1 with nothing built yet to
      hold the behaviour (`merge-pr.ts` has no review/comment check today,
      confirmed by reading the script). Distinguished this from the closely
      related, and explicitly declined, CLAUDE.md "count over a set" bullet
      (issue #933): that one was deliberately closed `wontfix` after a
      dedicated research pass (`rulebook-migration-table.md`'s CM-32 row)
      classified it "judgment-keep" and said re-narrowing the wording is the
      wrong move — a considered, final verdict this Skill shouldn't relitigate.
      #1276 carries no such closure; it's an open, unresolved flag, and the cut
      here is compression (removing a redundant restatement), not the kind of
      additional-warning wording pass #1276 argues against. Only the bolded
      rule's trailing clause was restatement — "if step 4 hasn't run yet, the
      merge happens with nothing posted" says nothing the bold sentence
      doesn't already say — so kept the actual rule and the one piece of new
      mechanism info (merges immediately on green, no wait), cut the
      restatement, added an #1276 pointer in its place. Grepped the corpus for
      other homes (frictions-to-fixes, issue-tracker.md, digest/audit-docs/
      audit-skills/blog-post SKILL.md) — all point at step 4 or the general
      recipe, none restate step 5's content, nothing else to touch. Net -1
      line, one file — this corpus is thin after six prior trials; a dispatched
      full-corpus search's other two candidates (the CLAUDE.md count bullet,
      ruled out above; `blog-post/SKILL.md`'s causal-attribution rules, issue
      #1168) were both already-tight text with a human-flagged mechanism
      question, not prunable mass. Probed the compressed bullet alone on a
      fresh Sonnet subagent before shipping: given only the surviving text plus
      a one-line paraphrase of step 4's content, it correctly said to post the
      verdict comment before calling `merge-pr.ts`, correctly said the PR
      merges with no verdict trace if called first, and correctly said nothing
      today enforces the ordering mechanically.
    territory:
      paths:
        - "`docs/agents/pr-workflow.md`: step 5's \"Before calling `merge-pr.ts`: step 4's verdict comment must already be posted\" bullet"
      keywords:
        - verdict comment must already be posted
        - merge-pr.ts merges immediately on green
        - issue #1276
    opened: 2026-09-23
    proven: true
    check: >
      Damage is a session that lands a gated PR through this recipe and calls
      `merge-pr.ts` to merge it before step 4's verdict comment/review is
      already posted on the PR — the merge going through with no review trace.
      NOT damage: a session that already posts the verdict before merging (the
      intended, and only, order — nothing mechanically enforces it either way),
      one that never lands a PR through this recipe this run, or a recurrence
      identical in shape to the one #1276 already names (that issue's open
      mechanical-check recommendation is the tracked response, not new evidence
      for this trial). A Sonnet probe given only the compressed bullet (plus a
      one-line paraphrase of step 4, since step 5 refers to it) correctly named
      posting the verdict comment as the required next action before calling
      `merge-pr.ts`, correctly said the PR merges with nothing posted if called
      out of order, and correctly said no mechanical check exists today — the
      ordering rests entirely on the agent following the bolded sentence.
  - problem: >
      CLAUDE.md's "Start a command expected to run long... with
      `run_in_background: true` from the outset" bullet (Working conventions,
      added by PR #1282, merged 2026-09-20) already failed twice in the two
      days since it landed — issue #1293 documents both recurrences
      (`session_01HbkYXnpBCjE5XwVW2oe3ee`, `session_017p22GBvyCixua5EXU8Ynad`),
      one with `docsRead` confirming the bullet was actually opened that
      session and the foreground-timeout auto-background happened anyway. The
      issue concludes a wording pass doesn't fix this ("the prose was read and
      the failure happened anyway") and recommends a mechanical `PreToolUse`
      guard, flagged for a human since `frictions-to-fixes/SKILL.md` §3 bars
      dispatching a guard-touching fix unattended — so this is criterion 1
      (prose that already failed) with nothing built yet to hold the
      behaviour: the riskiest shape per this Skill's own framing, but the
      prose is already failing at full length, so shrinking it to the goal
      costs nothing further. Cut the trailing why-clause (already
      re-explained the tail-piping guard's mechanism, itself stated two
      bullets above) to a bare issue pointer; kept the what/where (the
      `run_in_background: true`-from-the-outset instruction and the
      scratchpad-logging destination) since the probe (below) still needed
      them literally. Grepped the corpus for other copies of this wording —
      none; only CLAUDE.md states it. Net -2 lines, one file. Small mass, but
      the only criterion-1 candidate found in a background full-corpus survey
      (CLAUDE.md, docs/agents/*.md, docs/adr/* prose, all 14 repo-authored
      Skills); two runner-ups (`docs/agents/pr-workflow.md`'s verdict-before-
      merge steps, issue #1276; `blog-post/SKILL.md`'s causal-attribution
      bullet, issue #1168) were both rejected as mostly load-bearing
      reference material with less prunable mass. Building the guard #1293
      recommends is out of scope for this trial (Bounds: "changing what runs
      unattended is not a prune — escalate that"); #1293 already tracks it.
    territory:
      paths:
        - "CLAUDE.md: the \"Start a command expected to run long... with `run_in_background: true` from the outset\" bullet (Working conventions)"
      keywords:
        - run_in_background: true` from the outset
        - known-long command
        - auto-background at the 2-minute timeout
        - issue #1293
    opened: 2026-09-22
    proven: true
    check: >
      Damage is a session running a command it should already expect to run
      long (the full gate, `gate:scoped`, a build, `test:e2e`) that reads the
      compressed bullet and either runs it in the foreground anyway without
      `run_in_background: true`, or reaches for a hand-rolled `nohup … &`
      instead of the tool's own flag, and gets a silently-wrong status when
      the 2-minute default timeout auto-backgrounds it. NOT damage: a session
      that already starts such a command backgrounded from the outset (the
      intended behaviour), one that never runs a long command this run, or a
      recurrence identical in shape to the two #1293 already cites (that
      issue's open guard recommendation is the tracked response to those, not
      a new finding for this trial). A Sonnet probe given only the compressed
      bullet correctly said to pass `run_in_background: true` on the Bash-like
      call from the start rather than defaulting to foreground, correctly
      named the danger as a silently wrong status (not just slower turnaround)
      from the 2-minute auto-background, correctly said to log to the
      scratchpad directory, and correctly said the flag has to be set before
      starting the command, not added after — a command already running in
      the foreground can't be reclassified as backgrounded once launched.
  - problem: >
      CLAUDE.md's "Dispatching a subagent is a procedure, not a tool call —
      invoke the `dispatch-subagents` Skill before spawning one" bullet
      (Working conventions) already failed as issue #1248: a session read the
      Skill's text (its log lists `dispatch-subagents/SKILL.md` under
      `docsReadViaShell`) and still dispatched without invoking it — criterion
      1, prose read and not followed. Nothing was damaged: that run used
      `isolation: "worktree"`, merged both PRs and cleaned up. The harmful
      outcomes of skipping the Skill are already partly held by
      `agent-background-flag-guard.ts` and `subagent-background-guard.ts`, and
      the Skill's own description triggers on "about to spawn one". Cut the
      ~8-line bullet (a restated list of the Skill's contents plus a "paid for
      by a session that lost work" justification) to one goal line — don't
      strand work or race a shared checkout; the Skill is how; the read-only
      exemption (#1226) kept — with an #1248 pointer. No guard built
      (#1248's triage brief; rulebook-migration-table CM-42 wants warn-only
      if ever). Grepped the corpus for the cut wording: no inbound references.
      Net -5 lines, one file. The §4 Sonnet probe could not run — the
      dispatched implementing agent had no subagent tool.
    territory:
      paths:
        - "CLAUDE.md: the \"A subagent that touches git or needs a worktree must not strand work or race a shared checkout\" bullet (Working conventions)"
      keywords:
        - procedure, not a tool call
        - invoke the `dispatch-subagents` Skill before spawning
        - strand work or race a shared checkout
        - issue #1248
    opened: 2026-09-24
    proven: false
    check: >
      Damage is a git-touching subagent dispatch that strands uncommitted work
      (the subagent stops without committing/pushing and the work is lost or
      has to be recovered by hand), races a shared checkout (parallel agents
      editing one working tree without `isolation: 'worktree'`, clobbering or
      mixing each other's changes), or loses a stopped subagent's work (no
      resume, no recovery). NOT damage: a session that skips invoking the
      `dispatch-subagents` Skill but dispatches correctly anyway — worktree
      isolation, commit-before-stop, work landed (the #1248 case itself); a
      read-only dispatch made directly; or a background/Monitor misuse the
      existing guards already deny. Count only harm, not the missed Skill call.
