# Open Prune Trials (ADR-0027). One entry per pruned problem. The window runs
# from when the prune lands on `main`, not from `opened:`;
# `pnpm exec tsx .agents/skills/prune-trial/scripts/find-trial-window.ts`
# gives it. An entry is deleted the moment `/prune-trial` judges it — git holds the history, this
# file holds only what is unjudged.
#
# The entry ships in the prune's own commit, so that commit is the record: to
# read back what was cut, `git log` this file. Nothing here has to be filled in
# after the PR merges.
#
# trials:
#   - problem: what the pruned prose was trying to prevent
#     territory:                     # the next trial must not overlap these
#       paths:
#         - path/or/file/touched
#       keywords:
#         - keyword or phrase
#     opened: 2026-08-23
#     proven: false                  # only when §4's Sonnet probe could not run
#     check: how you would tell this broke — written now, while you still
#            remember what the prose was for. Prose, not a command; say what
#            distinguishes real damage from a session simply using the pruned
#            topic's tools correctly.
trials:
  - problem: >
      The three `frictions-to-fixes` agent briefs rewritten plainly at a
      Trusted user's request, in the SKILL.md's per-step shape (+452 −219
      lines across the three briefs, from `git diff --numstat`; words 2758 to
      3133, the growth being headings and done-when sections): an opening
      paragraph naming the role, its inputs and what it may change, then each
      step as a goal paragraph, numbered instructions, a done-when section and
      an edge-case list, then the report. Every rule kept: survey-only and
      design-only limits, occurrences through print-ledger-occurrence.ts and
      ledger-set.ts, the new-entry bar, the fixes and status rules, the
      screen order (not ours, on trial, tracker and main), the four labels,
      the ranking rules, the six report parts; the doc-read and read-count
      checks, the off-limits surfaces and the risk questions; the gate floor
      and the no-merge rule. Fixed in the same pass: design-brief's dangling
      opening after `{PICKS}` and its session-log path, the pointer to
      `audit-docs` "house rules" (no such section; now "What you may edit"
      and the six lenses), and the survey's candidate set (every entry
      `--candidates` lists, not only those that gained occurrences). SKILL.md
      changes two lines: what "verbatim" means for a brief handed by path, and
      the same `audit-docs` pointer. Cut at the owner's request: the stale
      `docsReadViaShell` caveat (its logs are past the horizon), a schema
      check `ledger-set.ts` already enforces, and the `foldSubagentTrace`
      incident example behind the mechanism-bug rule. Survey §2 step 1 is
      the one command `print-ledger-occurrence.ts --append <entry> <session>
      <index>…`, which files each block under its entry itself (through
      `ledger-set.ts`'s `setEntry`), so no printed output is split across
      `ledger-set.ts` calls by hand; the step's rules are unchanged.
      Changed mid-trial at a Trusted user's request (2026-10-28): survey §2
      gained matching on the harm and on a cause's routing, the
      `summary`/`cause` rewrite on append and on recording a fix, the edge
      case for a Friction a fix produced, and the matching `ref` wording; a
      Friction about those additions is not this trial's damage.
    territory:
      paths:
        - ".agents/skills/frictions-to-fixes/survey-brief.md (all of it)"
        - ".agents/skills/frictions-to-fixes/design-brief.md (all of it)"
        - ".agents/skills/frictions-to-fixes/impl-brief.md (all of it)"
      keywords:
        - survey-brief
        - design-brief
        - impl-brief
    opened: 2026-10-25
    check: >
      Damage is a major or blocker Friction in a frictions-to-fixes run, logged
      by the main session or one of its agents, that the old brief text would
      have prevented: a survey agent that hand-edits ledger YAML, retypes an
      occurrence, files an issue or pushes, or labels a fixed cause
      never-fixed; a design agent that skips the doc-read or read-count check
      or designs onto an off-limits surface; an impl agent that merges, pushes
      or substitutes a bare tsc for the gate. NOT damage: a Friction about
      SKILL.md or a script (neither is in this trial), or a brief gap the old
      text had too.
  - problem: >
      `log-session` "When to invoke" cut to the goal (-8 net, from
      `git diff --numstat`: 11 added, 19 deleted; this entry not counted): the
      restatements of when to close (the "closure point" paragraph, the
      Session-closure definition) dropped; the pointer to `close-session`, the
      update-only use and all five `status` values kept. Chosen after the
      search subagent covered the instruction corpus, guard headers and the
      tracker: the close-session rule failed as prose repeatedly (#2209, read
      in full by the subagent, after #1801, #1821, #1868) and only a hint holds
      the PR-open half; nothing holds the answer-only half. So the cut is only
      restatements: CLAUDE.md, `close-session`, the step-specific invocations in
      other Skills, `read-first-hint.ts` and `pr-workflow.md` (on trial) are
      untouched. Runners-up: the dispatch-subagents read-first trigger (#2543;
      a wired guard holds it, but the prose left is one line the guard's deny
      message quotes), the worktree and SHA bullets of `dispatch-subagents`
      (#1420, #1944; already one goal-shaped line each, nothing holds them).
      Same run judged and deleted the long-command backgrounding trial (landed
      a738a6a8) and the workflow-write ban trial (landed b93f2d0c), both
      judgeable per the window script: 53 and 51 sessions since, no major or
      blocker Friction traces to either (the one moderate, overlapping backgrounded
      gate runs after an early "completed" notice, 9Cee99, is not a lost-to-600s case), and no
      regression issue.
    territory:
      paths:
        - ".agents/skills/log-session/SKILL.md: the 'When to invoke' section"
      keywords:
        - closure point
        - Session closure
    opened: 2026-10-26
    proven: true
    check: >
      Damage is a major or blocker Friction where a session opened a PR or ended
      work without invoking `close-session`, or logged a wrong `status`, and the
      cut `log-session` wording would have prevented it. NOT damage: the
      answer-only or PR-open misses #2209 already records, which the cut did not
      change (CLAUDE.md and `close-session` still carry the rule).
  - problem: >
      `docs/agents/environment-caveats.md` plainly reworded (-1 net, from
      `git diff --numstat`: 63 added, 64 deleted; words 943 to 938; this entry
      not counted): shorter sentences, plainer verbs, every caveat, recovery
      step and issue pointer kept. No problem cleared the bar this run: the
      search subagent covered the instruction corpus, guard headers and the
      tracker (53 "Regression" issues paged, cited ones read in full). Its
      candidates were each 3-10 lines, already one goal-shaped line, or
      unprunable (CLAUDE.md's dispatch trigger, ADR-0017's summary rule, the
      dispatch-subagents foreground line, and CLAUDE.md's long-command line,
      which no guard holds). Same run judged and deleted the pr-workflow
      rewrite (landed 65ed0fe5) and the Stop-hook section trial (landed
      94514199): 49 sessions since 65ed0fe5, no major or blocker Friction
      traces to either; the pr-workflow ones are minor simple-change-bar
      complaints, and regression #2472 predates the cut.
    territory:
      paths:
        - "docs/agents/environment-caveats.md (all of it)"
      keywords:
        - permission stream closed
        - stale TMPDIR
        - workflow OAuth scope
    opened: 2026-10-27
    proven: true
    check: >
      Damage is a major or blocker Friction where a session misread an
      environment caveat and the old wording would have prevented it: it added a
      dead `permissions.allow` entry, retried a blocked host, stranded commits by
      pushing a workflow edit, or lost work to a post-resume vanish. NOT damage: a
      session simply hitting a caveat the file already names.
  - problem: >
      Incident narration in the `loop-only-tool-guard.ts` and
      `skill-inline-guard.ts` headers and one inline comment cut to the rule
      plus the issue pointers (-12 net, from `git diff --numstat`: 9 added, 21
      deleted; this entry not counted). Chosen after the search subagent covered
      the instruction corpus, guard headers and the tracker (7 issues read in
      full): both rules failed as prose (#814 after #241 and #425; #1018 after
      #999) and wired PreToolUse guards hold them; their CLAUDE.md and doc homes
      are already gone, so only these comments remained. Runners-up, each with
      the same shape but more tangled: `github-provenance-guard.ts` (largest
      mass, ADR-0017 tie), the two background guards (`dispatch-subagents`
      trial territory), `dispatch-read-guard.ts` (CLAUDE.md line on trial
      nearby). Code and deny messages are unchanged. The mass was small. Same
      run judged and deleted the "Verify before you state" and
      `github-integration.md` trials (landed 10f009ac and ce66e262): 48
      sessions since, no major or blocker Friction, no regression issue.
    territory:
      paths:
        - "scripts/hooks/loop-only-tool-guard.ts: header and the `exempt` comment"
        - "scripts/hooks/skill-inline-guard.ts: header"
      keywords:
        - ScheduleWakeup
        - Skill-inline guard
    opened: 2026-10-28
    proven: true
    check: >
      Damage is a major or blocker Friction where a session misused
      `ScheduleWakeup` outside `/loop` or called `Skill` on an inlined Skill
      and the guard did not stop it because a comment was cut. NOT damage: a
      guard denying the call and the session following its message.
