# Open Prune Trials (ADR-0027). One entry per pruned problem. The window runs
# from when the prune lands on `main`, not from `opened:`;
# `pnpm exec tsx .agents/skills/prune-trial/scripts/find-trial-window.ts`
# gives it. An entry is deleted the moment `/prune-trial` judges it — git holds the history, this
# file holds only what is unjudged.
#
# The entry ships in the prune's own commit, so that commit is the record: to
# read back what was cut, `git log` this file. Nothing here has to be filled in
# after the PR merges.
#
# trials:
#   - problem: what the pruned prose was trying to prevent
#     territory:                     # the next trial must not overlap these
#       paths:
#         - path/or/file/touched
#       keywords:
#         - keyword or phrase
#     opened: 2026-08-23
#     proven: false                  # only when §4's Sonnet probe could not run
#     check: how you would tell this broke — written now, while you still
#            remember what the prose was for. Prose, not a command; say what
#            distinguishes real damage from a session simply using the pruned
#            topic's tools correctly.
trials:
  - problem: >
      Subagent-brief mistakes in `dispatch-subagents` §3 "Write the brief" (-3
      net, from `git diff --numstat` against the parent: 22 added, 25 deleted;
      this entry not counted): the "since worktrees sometimes start stale",
      the ADR-0016 incident aside and similar justifications went;
      every rule kept. Chosen after the search subagent covered CLAUDE.md,
      GLOSSARY.md, `docs/agents/`, `.claude/rules/`, every Skill SKILL.md, the
      ledger (not read in full) and the 100 most recent closed issues plus open
      ones (not older closed issues, not session logs). `subagent-brief-defects`
      (18 occurrences; 8 fixes; open #3227) failed as prose; `dispatch-read-guard`
      holds placeholders only. Runners-up, too small to cut: the tenant-glossary
      rule (31 words, `tenant-glossary-guard.ts` holds it) and "edit nothing
      while the gate runs" (13 words, `gate-edit-guard.ts` holds it). Same run
      judged and deleted two trials, both holding: the owner-facing UI rule
      (landed 38874c4d): `built-before-owner-decided-ui` 3.7% -> 4.3% (8/216 ->
      2/47), the two after hits nit and minor, no issue; and the glassbox-curate
      read rule (landed 11bd1415): `glassbox-curate-read-first-skipped` 6.1% ->
      0.0% (14/231 -> 0/32).
    territory:
      paths:
        - ".agents/skills/dispatch-subagents/SKILL.md: '3. Write the brief'"
      keywords:
        - Write the brief
        - Never move a checkout
    opened: 2026-11-20
    proven: true
    check: >
      Damage is a major or blocker Friction where a brief omitted a line the cut
      text carried (a pinned SHA, a foreground-checks ask, the no-checkout rule)
      and a run was wasted or a checkout moved. Compare the
      `subagent-brief-defects` share with `friction-rates.ts`; a clear rise is
      also damage. NOT damage: that entry at its standing rate (18 occurrences
      before this) or placeholder denials the guard already handles.
  - problem: >
      `harvest` steps 1 and 3 restated what its helper prints (-6 net, from
      `git diff --numstat` against the parent: 9 added, 15 deleted; this entry
      not counted): the ranking aside, the tracker-list reuse and the hit-cap and
      ranking description of `harvest evidence` went; every rule and check kept.
      Chosen after a search subagent this run covered open issues (2), the 100
      most recent closed, 152 ledger files (9 read) and CLAUDE.md, `docs/agents/`
      and four Skills for word counts (not session logs, not older closed
      issues, not the other Skills). `harvest-first-pass-shallow` (fixes #3106,
      #3137, #3417) failed as prose; `harvest.ts` holds the
      `stopped:` line, `check-clusters`, `check-body` and `check-posted`.
      Runners-up: glassbox-curate steps 8 and "Pick the mode" and clear-backlog
      §3 step 4, both edited by hand the same day (so left alone), and the
      environment-caveats proxy bullet (small, held by `network-start.ts`).
      Same run judged and deleted the pr-workflow trial (landed f0ee3c1c7):
      `prepush-gate-review-skipped` 11.6% -> 0.0% (26/225 -> 0/33); the
      Frictions after it (Own-read line refused on a 26-file diff, minor) trace
      to bars the cut kept or to step 3, which it did not touch.
    territory:
      paths:
        - ".agents/skills/harvest/SKILL.md: steps 1 and 3"
      keywords:
        - harvest evidence
        - harvest check-clusters
    opened: 2026-11-22
    proven: true
    check: >
      Damage is a major or blocker Friction where a harvest run read a stale
      tracker list, skipped a cluster the cut text carried or filed a Seedling
      missing a check, because a cut phrase no longer said so. Compare the
      `harvest-first-pass-shallow` share with `friction-rates.ts`; a clear rise
      is also damage. NOT damage: that entry at its standing rate or a run that
      reads a `harvest evidence` block correctly and still finds a cluster open.
