# Open Prune Trials (ADR-0027). One entry per pruned problem; the verdict is due
# three days after the prune lands on `main` — ADR-0027's window runs from the
# landing, not from `opened:` below (get the real landing with
# `pnpm exec tsx scripts/prune-trial-window.ts`; see the prune-trial Skill's §1). An entry
# is deleted the moment `/prune-trial` judges it — git holds the history, this
# file holds only what is unjudged.
#
# The entry ships in the prune's own commit, so that commit is the record: to
# read back what was cut, `git log` this file. Nothing here has to be filled in
# after the PR merges.
#
# trials:
#   - problem: what the pruned prose was trying to prevent
#     territory:                     # the next trial must not overlap these
#       paths:
#         - path/or/file/touched
#       keywords:
#         - keyword or phrase
#     opened: 2026-08-23
#     proven: false                  # only when §4's Sonnet probe could not run
#     check: how you would tell this broke — written now, while you still
#            remember what the prose was for. Prose, not a command; say what
#            distinguishes real damage from a session simply using the pruned
#            topic's tools correctly.
trials:
  - problem: >
      CLAUDE.md's Working conventions bullet on the GitHub provenance header
      and commit trailer (backing CM-43/CM-44 in
      `docs/research/rulebook-migration-table.md`) spelled out, in prose, the
      exact detail ADR-0017's own 2026-08-01 amendment already says belongs
      elsewhere: a worked placeholder-id example ("the id above is a
      placeholder, never a real one — copying a real, id-shaped string from
      context is the actual failure mode"), the model-name/session-url
      resolution instruction, and the commit-trailer hand-write warning — all
      of which `scripts/github-provenance-guard.ts`'s and
      `scripts/commit-trailer-guard.ts`'s own deny messages already state
      near-verbatim (verified by reading both scripts' `formatGuardMessage`-
      style output: the provenance guard's message names the exact marker to
      paste and warns "never predict or reconstruct a session id from
      memory"; the trailer guard's message tells the agent to omit the
      trailer entirely and let the hook land it). ADR-0017 itself documents
      this design choice explicitly: "That message — not a doc — is the
      rule's teaching surface, because every recorded recurrence happened to
      a session that had prose available and did not apply it." Compressed
      CLAUDE.md's bullet to the rule (open with the header; never hand-write
      the trailer), the harness-footer carve-out, the guard's existence and
      fail-closed posture, and a pointer to `docs/agents/guards.md` — same
      shape as the already-landed `ToolSearch`/`ScheduleWakeup` and
      tail-pipe-guard compressions. Net -12 lines.
    territory:
      paths:
        - "CLAUDE.md: the \"Open every GitHub body\" bullet (Working conventions)"
      keywords:
        - provenance header
        - session_EXAMPLE_NOT_A_REAL_ID
        - commit trailer
        - github-provenance-guard.ts
        - commit-trailer-guard.ts
    opened: 2026-09-06
    proven: true
    check: >
      Damage is a session that, opening a GitHub body or committing, can't
      produce a plausible first line / trailer decision from the compressed
      bullet alone and either invents a session id from memory, hand-writes
      the trailer anyway, or edits/duplicates the harness's own footer — or a
      session that, hit by the guard's deny message, ignores it and keeps
      guessing instead of reading and following it. NOT damage: a session
      that gets denied and pastes the guard's own named marker verbatim (the
      intended teach-at-the-moment-of-failure design working, per ADR-0017's
      2026-08-01 amendment), or one that never needed the guard because it
      already wrote the header correctly from the compressed rule. A Sonnet
      probe given only the compressed text correctly derived that the
      concrete marker text comes from the guard's deny message rather than
      being invented, that the harness's own footer must be left untouched,
      that a commit trailer must never be hand-written, and that a deny
      message — not some other doc — is what to read and follow when one of
      these is blocked.
  - problem: >
      `docs/agents/git-conventions.md`'s "If a checkout is still shallow"
      section carried 45 lines explaining a scenario the repo already prevents
      mechanically: `scripts/unshallow-on-start.ts` (a `SessionStart` hook)
      unshallows before a session's first turn, so the section's entire
      audience is the narrow leftover case where that fetch itself failed
      (offline, no network). Within that already-narrow case, the section then
      spent two more paragraphs re-deriving, from first principles, exactly
      what `scripts/gate.ts`'s own code comment states and cites by name
      ("Why classifying off a shallow clone is unsafe at all:
      docs/agents/git-conventions.md, and #849") — the grafted-parentless-
      boundary mechanics, a worked revert-branch example of how a shallow
      `merge-base` diff can silently under-report rather than over-report, and
      a restatement of `changedPaths()`/`changedPathsBetween()`'s asymmetric
      repair-vs-refuse behaviour that the script's own comments already carry
      next to the code. Compressed to the rule (don't trust history off a
      still-shallow clone; a shallow `merge-base` can under-report, not just
      over-report, so unshallow and verify before any history-based
      conclusion), the one-line why, the fix (`git fetch --unshallow`), and a
      pointer to `scripts/gate.ts` + issue #849 +
      `tests/unit/gate-shallow-base.spec.ts` for the mechanics — same shape as
      the already-landed `ToolSearch`/`ScheduleWakeup` and tail-pipe-guard
      compressions, applied here to a hook instead of a `PreToolUse` guard.
      Net -30 lines.
    territory:
      paths:
        - "docs/agents/git-conventions.md: \"If a checkout is still shallow\" section, including the \"A shallow `merge-base` can be wrong\" subsection"
      keywords:
        - shallow checkout
        - unshallow-on-start.ts
        - merge-base can be wrong
        - grafted parentless
        - under-report
        - gate-shallow-base.spec.ts
    opened: 2026-09-07
    proven: true
    check: >
      Damage is a session that, having actually hit a still-shallow clone (the
      unshallow hook's fetch failed) and needing to know what that silently
      gets wrong, stops at the compressed section and either trusts a
      merge-base-derived diff/history conclusion anyway or can't recall that
      the failure mode is under-reporting (not just over-reporting, which
      would read as the safer direction). NOT damage: a session that runs
      `git fetch --unshallow` and re-verifies before trusting history off a
      shallow clone, without ever needing the worked revert-branch mechanics
      (the intended point-of-need pointer working), or a session that never
      meets a shallow clone at all because the `SessionStart` hook did its
      job. A Sonnet probe given only the compressed text correctly derived
      that a still-shallow clone must never be trusted for a history-based
      conclusion, that the fix is `git fetch --unshallow` before proceeding,
      and that a shallow `merge-base` diff's failure mode is silently
      under-reporting changes rather than only over-reporting them.
  - problem: >
      CLAUDE.md restated session-logging mechanics that `close-session/SKILL.md`
      and `log-session/SKILL.md` already own in full, in two separate spots: the
      "Opening the PR is the first session log" bullet (Working conventions) and
      the whole "Logging your session" section. Both re-explained detail already
      stated, near-verbatim, by the two Skills themselves — the mechanical vs.
      interpretive field split and the `Stop`-hook commit timing (verified against
      `log-session/SKILL.md`'s own opening paragraphs, which state both in more
      precise detail than CLAUDE.md's copy), the worktree-isolated-agent exception
      and its mechanical enforcement (verified against `close-session/SKILL.md`'s
      own closing paragraph, which states it identically), why re-invoking
      self-heals, and the "self-judge closure, don't wait for a human prompt"
      framing repeated a second time. `docs/agents/pr-workflow.md` carries none of
      this (grepped, no hits), so the duplication was entirely CLAUDE.md
      restating its own two Skills. Compressed both spots to the rule each
      exists to state — open the PR, invoke `close-session`, re-invoking is safe,
      a worktree-isolated impl agent must not self-invoke — with the mechanism
      detail pointed at the Skills that already own it precisely. Net -22 lines.
    territory:
      paths:
        - "CLAUDE.md: the \"Opening the PR is the first session log\" bullet (Working conventions)"
        - "CLAUDE.md: the \"Logging your session\" section"
      keywords:
        - session log
        - close-session
        - log-session
        - mechanical trace
        - interpretive half
        - re-invoking is safe
        - worktree-isolated impl agent
    opened: 2026-09-08
    proven: true
    check: >
      Damage is a session that, having just opened a gated PR, doesn't invoke
      `close-session` at all because the compressed bullet no longer spells out
      why that moment matters, or a session that treats a second `close-session`
      call after more work as unsafe/redundant instead of the expected pattern,
      or — the sharpest failure — a dispatched worktree-isolated impl agent that
      self-invokes `close-session` anyway because the compressed text no longer
      states the consequence (clobbering the orchestrator's shared log) and so
      reads the prohibition as optional. NOT damage: a session that opens
      `close-session/SKILL.md` or `log-session/SKILL.md` before asserting the
      exact mechanical/interpretive split or `Stop`-hook timing (the intended
      single-home behaviour working), or one that never needed the pointer
      because it already knew the mechanics. A Sonnet probe given only the
      compressed text correctly derived that opening a gated PR is when to
      invoke `close-session`, that re-invoking after more commits is the
      expected safe pattern rather than something to avoid, and that a
      worktree-isolated impl agent must never self-invoke it — deferring only
      the *why* and the alternative mechanism to the named Skill files, which is
      the intended point-of-need design, not a gap.
  - problem: >
      `docs/agents/environment-caveats.md`'s ".github/workflows/*" entry
      spent 23 lines narrating a scenario `scripts/workflow-edit-guard.ts`
      now mechanically prevents: a verbatim dump of the `git push`/contents-
      API rejection text, a paragraph re-deriving "the sharp edge is the
      commit, not the file" that the guard's own `formatGuardMessage` states
      near-verbatim ("The sharp edge is the COMMIT, not the push. Agent
      credentials lack the `workflow` OAuth scope, and the rejection is
      evaluated over every commit in the ref update — so one workflow edit
      committed alongside real work means you can push NONE of it..."), and
      a debunking of a specific stale 2026-07-10 session-log claim that is
      now unreachable anyway (the guard denies the write before a session
      ever gets far enough to test the old claim). CLAUDE.md's own "Hitting
      a needed .github/workflows/* edit?" bullet already pointed here for
      "the underlying mechanism" and "the guard's documented gaps" — updated
      in the same commit to point at the guard's deny message and
      `guards.md`'s Known gaps instead, since that detail no longer lives
      here. Same shape as the already-landed provenance/trailer compression.
      Net -16 lines (CLAUDE.md + environment-caveats.md combined).
    territory:
      paths:
        - "docs/agents/environment-caveats.md: the \".github/workflows/*\" bullet"
        - "CLAUDE.md: the \"Hitting a needed .github/workflows/* edit?\" bullet (Working conventions)"
      keywords:
        - workflow-edit-guard.ts
        - .github/workflows
        - workflow OAuth scope
        - the sharp edge is the commit
        - docs/proposals
        - issue #659
        - issue #897
    opened: 2026-09-09
    proven: true
    check: >
      Damage is a session that, hitting a needed `.github/workflows/*` edit,
      tries to push it anyway, tries to route around a workflow-edit-guard
      denial instead of reading its deny message, bundles the workflow edit
      into the same commit as unrelated real work (stranding that work when
      the commit is refused), or can't find where to actually put the change
      for a human to apply. NOT damage: a session that gets denied and reads
      the guard's deny message rather than this doc for the why (the intended
      point-of-need design working), or one that goes straight to
      `docs/proposals/` without ever needing the mechanism explanation. A
      Sonnet probe given only the compressed text correctly derived: don't
      push the edit (the guard refuses it before a commit exists); don't
      route around a denial — read the guard's deny message and follow it;
      never let the workflow edit share a commit with unrelated real work,
      since a refused commit strands the whole ref update; and the actual
      destination is `docs/proposals/`, per its own README.
