# Open Prune Trials (ADR-0027). One entry per pruned problem; the verdict is due
# three days after the prune lands on `main` — ADR-0027's window runs from the
# landing, not from `opened:` below (get the real landing with
# `pnpm exec tsx scripts/prune-trial-window.ts`; see the prune-trial Skill's §1). An entry
# is deleted the moment `/prune-trial` judges it — git holds the history, this
# file holds only what is unjudged.
#
# The entry ships in the prune's own commit, so that commit is the record: to
# read back what was cut, `git log` this file. Nothing here has to be filled in
# after the PR merges.
#
# trials:
#   - problem: what the pruned prose was trying to prevent
#     territory:                     # the next trial must not overlap these
#       paths:
#         - path/or/file/touched
#       keywords:
#         - keyword or phrase
#     opened: 2026-08-23
#     proven: false                  # only when §4's Sonnet probe could not run
#     check: how you would tell this broke — written now, while you still
#            remember what the prose was for. Prose, not a command; say what
#            distinguishes real damage from a session simply using the pruned
#            topic's tools correctly.
trials:
  - problem: >
      CLAUDE.md's "Don't state anything as settled" bullet (Working
      conventions) bundled four sub-rules — identifier resolution, factual/
      causal/behavioral claims, another session's hearsay, and set counts —
      into 22 lines that itemized each case's own worked example and closed
      with a bare `(Incident history: #387, #605, #628, #723, #738, #833,
      #948, #871.)` citation: the same "narrowed repeatedly, self-documents
      its own recurrence" shape already pruned from ADR-0003's auto-merge
      ledger. The enforceable slice is already mechanized elsewhere and
      single-homed there: `scripts/github-provenance-guard.ts` covers an
      identifier/claim shipped in a GitHub body, `scripts/session-id-guard.ts`
      covers a commit trailer naming the wrong session, and
      `log-session/SKILL.md`'s "Recovering the id" section already owns the
      session-id mechanics in more precise detail than this bullet's copy of
      it. Compressed to one statement of the rule plus its single genuine
      insight (recalling/inferring from context reads like resolution but is
      capture) and the three one-line specializations (session id → the named
      Skill section; hearsay → confirm with the human; count → read every
      member), dropping the itemized case-by-case elaboration and the bare
      issue-number citation — git history on this file is where that record
      lives now. Net -11 lines (22 → 11, `CLAUDE.md` only).
    territory:
      paths:
        - "CLAUDE.md: the \"Don't state anything as settled\" bullet (Working conventions)"
      keywords:
        - primary source
        - reads like resolution but is capture
        - confirmed out-of-band
        - Recovering the id
        - count is not a fact
    opened: 2026-09-11
    proven: true
    check: >
      Damage is a session that, needing to resolve an identifier, verify a
      claim, weigh another session's say-so, or state a count, reads the
      compressed bullet and either recalls/infers an identifier from context
      instead of its actual source (a system-prompt value or a fresh tool
      call), states a subagent's or its own unverified claim as settled fact,
      treats another session's "confirmed out-of-band" message as itself
      sufficient to proceed on a real decision, or reports a grep/keyword-match
      count as a verified fact without reading the matched members. NOT
      damage: a session that opens `log-session/SKILL.md`'s "Recovering the
      id" section for the session-id mechanics instead of finding them
      restated inline (the intended pointer working), or one that never hits
      any of the four cases this run. A Sonnet probe given only the compressed
      text correctly refused a plausible `git log`-sourced session id in favor
      of the system-prompt value, correctly required independently verifying
      a subagent's root-cause claim against the actual code before writing it
      into a PR, correctly treated another session's "confirmed out-of-band"
      claim as hearsay requiring direct human confirmation before a schema
      migration, and correctly refused to state a grep-derived count as fact
      without reading each matched session log first.
  - problem: >
      `docs/agents/environment-caveats.md` had grown, bullet by bullet, into a
      full incident history for each platform quirk — discovery dates, which
      session/subagent caught it, human anecdotes, issue-closure detail (e.g.
      "closed `not_planned`"), and redundant elaboration of a rule already
      stated in its own bold lead sentence (e.g. a withdrawn-recommendation
      paragraph narrating a guard that already makes the old wording
      unreachable). The doc's own opening line already says "previously
      diagnosed once... don't re-diagnose" — its purpose is a
      don't-re-diagnose list, not an incident record — and CLAUDE.md already
      calls it "the single home," so the narration had nowhere else to be
      trimmed to. Compressed every bullet except the `.github/workflows/*` one
      (owned by the still-open, unjudged 2026-09-09 prune trial) to its bold
      rule plus the actionable workaround/command plus an issue-number
      pointer, cutting the "when it happened, who caught it, how long it
      took" detail — that lives in the cited issue and in this file's git
      history. Net -64 lines (132 → 68, one file).
    territory:
      paths:
        - "docs/agents/environment-caveats.md: every bullet except the \".github/workflows/*\" one"
      keywords:
        - Claude_Code_Remote
        - permission stream closed
        - session-resume event
        - stale install state
        - worktree-isolation guard false-positive
        - unauthenticated mcp__github__
        - permission approval blocks indefinitely
    opened: 2026-09-12
    proven: true
    check: >
      Damage is a session that, hitting one of these platform quirks fresh,
      re-diagnoses it as a new problem instead of recognizing it from the
      compressed bullet — spends real effort investigating "why did my
      registered `/loop` job disappear" instead of re-verifying it via
      `CronList`/subagent-liveness check after a resume, treats a stalled
      dispatched subagent as merely slow rather than possibly stuck on an
      unapproved permission prompt, re-derives the `raw.githubusercontent.com`
      workaround from scratch, or routes a `Claude_Code_Remote` "permission
      stream closed" retry through `ScheduleWakeup`. NOT damage: a session
      that opens the cited issue for the full incident story instead of
      finding it narrated inline (the intended design), or one that never
      hits any of these quirks this run. A Sonnet probe given only the
      compressed text, on a stuck-dispatched-subagent scenario, correctly
      concluded 90 minutes of silence on a settings.json fix was likely a
      permission-approval stall rather than "still working," stopped relying
      on that subagent, and logged the situation honestly instead of waiting
      indefinitely; on a session-resume scenario, it correctly re-verified a
      registered `CronCreate` job and a backgrounded subagent's liveness
      explicitly rather than assuming continuity across the resume.
  - problem: >
      `docs/adr/0004-objective-safety-gate.md` had three amendment blocks doing
      the ADR-0003-ledger thing: hand-copying the human-only-surface file list
      (2026-07-10), then an amendment that existed *only* to catch that copy
      back up after ADR-0025 added three files (2026-07-22), then a third
      amendment (2026-09-03) whose entire content was "stop doing this, point
      to CLAUDE.md's Ground rules instead" — the exact self-documented-failure
      shape this Skill's §2 flags, and CLAUDE.md's Ground rules already *is*
      the single home (it says so itself: "The pinned seven above are the
      manifest-expansion/routing/catalog family"). Compressed the 2026-07-10
      amendment to keep its one genuine fact (the Decision's "generator"
      terminology is stale, per ADR-0013/ADR-0014) and drop the copied list;
      trimmed 2026-07-22 to state only its own addition (three files, per
      ADR-0025) instead of re-quoting the whole list to update it; deleted
      2026-09-03 entirely, folding its "don't re-enumerate" instruction into
      the 2026-07-10 amendment as the natural place for it. Decision and
      Consequences untouched, per ADR-0027's bound. Net -18 lines (194 → 176,
      one file).
    territory:
      paths:
        - "docs/adr/0004-objective-safety-gate.md: the 2026-07-10, 2026-07-22, and 2026-09-03 amendment blocks"
      keywords:
        - human-only surface
        - generator terminology
        - shared/expand.ts
        - shared/kinds.ts
        - modules/catalog.ts
        - app/composables/catalog.ts
        - re-enumerate
    opened: 2026-09-13
    proven: true
    check: >
      Damage is a session that, needing the current human-only-surface file
      list, reads ADR-0004's compressed amendments and either can't find it
      (fails to follow the pointer to CLAUDE.md's Ground rules), treats the
      now-shorter ADR-0004 text as itself authoritative and stale-copies it
      into a fourth amendment (repeating exactly the failure this prune
      fixes), or misses that `shared/kinds.ts`/`modules/catalog.ts`/
      `app/composables/catalog.ts` are part of the human-only family because
      the 2026-07-22 amendment no longer re-quotes the whole list next to
      them. NOT damage: a session that opens CLAUDE.md's Ground rules for the
      current complete list instead of finding it inline in the ADR (the
      intended single-home design), or one that never needs this list this
      run. A Sonnet probe given only the compressed ADR-0004 text correctly
      named CLAUDE.md's Ground rules as the current authoritative list rather
      than treating the ADR's own (now-partial) amendment text as complete,
      correctly identified that the "generator" terminology in the Decision
      section below is historical framing rather than a live mechanism, and
      correctly refused to add a fourth list-restating amendment when asked
      to record a new human-only file, instead extending CLAUDE.md's Ground
      rules directly.
  - problem: >
      `docs/adr/0017-provenance-footer-on-agent-authored-content.md` carried
      ~155 lines of dated amendment blockquotes (2026-07-13 through
      2026-08-01, issues #346/#710/#723/#737/#784) narrating, step by step,
      how the provenance-marker rule evolved and where prose enforcement kept
      failing — the last amendment's own text names the failure explicitly
      ("#723 tracked five recurrences that four prose passes did not stop")
      and records that it deleted a sibling doc (`docs/agents/provenance.md`)
      for the same reason, concluding "that message [the guard's deny
      message] — not a doc — is the rule's teaching surface." Textbook
      prose-that-already-failed, self-documented in its own corpus, the same
      shape already pruned from ADR-0003 and ADR-0004. The final,
      currently-operative state (header vs. trailer, which surface uses
      which, fail-closed enforcement, legacy-trailer read-only recognition)
      is restated in full by the *last* two amendments alone and is also
      already single-homed in CLAUDE.md's Working Conventions and
      `docs/agents/guards.md`'s guard-roster row — the intermediate five
      amendments add only investigatory narrative (why each prior format
      lost, what was considered and rejected, an open question about hook
      injection) that git history preserves without needing to stay inline.
      Compressed the whole amendment block to one statement of the "prose
      kept failing" lesson plus the current state (header format + example,
      commit trailer format, which surface uses which, fail-closed
      enforcement, legacy-trailer reading permanence, bot identity deferred)
      and pointers to CLAUDE.md/guards.md/git-conventions.md/
      github-integration.md. Decision and Consequences untouched, per
      ADR-0027's bound (they still read as the original 2026-07-07 "convention
      only, not gate-enforced" text — superseded by the amendment above them,
      exactly as ADR-0003/0004's Decision/Consequences also stay
      superseded-but-unedited). Also fixed a now-stale line-number citation in
      `docs/research/rulebook-migration-table.md` that quoted this ADR's
      old line 19. Net -112 lines (267 → 155, the ADR) plus a one-line
      citation fix elsewhere.
    territory:
      paths:
        - "docs/adr/0017-provenance-footer-on-agent-authored-content.md: the amendment blockquotes above \"## Context\""
      keywords:
        - provenance header
        - provenance footer
        - github-provenance-guard
        - Co-Authored-By
        - Claude-Session
        - fail-closed
        - legacy trailer
        - session URL
    opened: 2026-09-14
    proven: true
    check: >
      Damage is a session that, needing to know what provenance marker a
      GitHub body or a commit/MCP-write needs, reads the compressed amendment
      and either posts a two-line trailer on a GitHub comment/PR/issue body
      (the guard would block it, but the session shouldn't have tried),
      posts no marker at all on an MCP-API commit tool
      (`create_or_update_file`/`push_files`) thinking only interactive
      commits need one, imitates an old pre-2026-08-01 comment's legacy
      two-line trailer shape on a *new* post, or treats the Decision
      section's "convention only, not gate-enforced" as still true and skips
      the marker expecting it to quietly slip through. NOT damage: a session
      that opens CLAUDE.md's Working Conventions or `docs/agents/guards.md`
      for the operative rule instead of finding every nuance narrated inline
      (the intended design), or one that never needs this ADR this run. A
      Sonnet probe given only the compressed text correctly named the
      one-line header (not the two-line trailer) for a PR comment, correctly
      said `create_or_update_file`/`push_files` need the two-line trailer
      (grouped with commits, not GitHub bodies), correctly refused to treat
      an old comment's legacy two-line trailer as a template to imitate on a
      new post while still accepting it as valid historical evidence, and
      correctly said a marker-less PR body is actively blocked by the guard
      rather than a quiet convention-only gap.
