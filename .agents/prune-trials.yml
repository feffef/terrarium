# Open Prune Trials (ADR-0027). One entry per pruned problem. The window runs
# from when the prune lands on `main`, not from `opened:`;
# `pnpm exec tsx .agents/skills/prune-trial/scripts/find-trial-window.ts`
# gives it. An entry is deleted the moment `/prune-trial` judges it — git holds the history, this
# file holds only what is unjudged.
#
# The entry ships in the prune's own commit, so that commit is the record: to
# read back what was cut, `git log` this file. Nothing here has to be filled in
# after the PR merges.
#
# trials:
#   - problem: what the pruned prose was trying to prevent
#     territory:                     # the next trial must not overlap these
#       paths:
#         - path/or/file/touched
#       keywords:
#         - keyword or phrase
#     opened: 2026-08-23
#     proven: false                  # only when §4's Sonnet probe could not run
#     check: how you would tell this broke — written now, while you still
#            remember what the prose was for. Prose, not a command; say what
#            distinguishes real damage from a session simply using the pruned
#            topic's tools correctly.
trials:
  - problem: >
      The `close-session` invocation restated in six Skills and
      `pr-workflow.md` (-19 net, from `git diff --numstat` against the parent:
      7 added, 26 deleted; this entry not counted): the end-of-Skill "invoke
      close-session" steps and clauses in `digest`, `visitor-loop`,
      `glassbox-update`, `frictions-to-fixes`,
      `clear-backlog` and `blog-post` (its step 13), and step 4 plus the last
      line of "Closing a scheduled run's PR", cut; CLAUDE.md's bullet is the one
      home and now says a session with no PR invokes it once at its end. Chosen
      after the search subagent covered the instruction corpus, guard headers,
      the tracker and the ledger: the rule failed as prose (#2209, #2363,
      #2424, #2772; ledger `close-session-bypassed-by-hand-log`) and
      `read-first-hint.ts` now hints after a PR opens or merges. Kept: the
      deltas (`clear-backlog`'s `ruleVerdicts` merge, `audit-skills`,
      `glassbox-update`'s nothing-changed case, `dependabot-sweep`). Runners-up:
      the dispatch-subagents read (a deny guard holds it, little prose) and the
      CLAUDE.md read-first triggers (owner-accepted, #2066). Same run judged and
      deleted the backgrounding-prose trial (landed de9a393f): 42 sessions
      since, no major or blocker Friction traces to it; double-background 11.8%
      -> 19.4% (17/144 -> 6/31), owner-accepted nits whose deny message is
      unchanged (#2310); no issue.
    territory:
      paths:
        - "CLAUDE.md: the close-session bullet"
        - "docs/agents/pr-workflow.md: 'Closing a scheduled run's PR' (step 4 and the last line)"
        - ".agents/skills/{digest,visitor-loop,glassbox-update,frictions-to-fixes,clear-backlog,blog-post}/SKILL.md: close-session steps"
      keywords:
        - close-session
    opened: 2026-11-07
    proven: true
    check: >
      Damage is a major or blocker Friction where a scheduled run ended with no
      session log or a stale `in-review` log because no instruction told it to
      invoke `close-session`, and a cut line would have prevented it. NOT
      damage: `close-session-bypassed-by-hand-log` at its standing rate (the
      read-first hint catches it; compare shares with `friction-rates.ts`).
      Owner's condition (PR #2939): revert the cut if the share of sessions
      that fail to log at a closure point rises even a little, whatever the
      severity; compare `close-session-bypassed-by-hand-log` and
      `closure-not-invoked-on-answers` with `friction-rates.ts`.
  - problem: >
      The `dispatch-subagents` Skill's §2-§3 (-4 net, from `git diff --numstat`:
      40 added, 44 deleted; this entry not counted): the worktree, stranding and
      scope bullets merged and reworded, the git-hygiene restatements and the
      separate pre-dispatch checklist folded into one lead-in; every rule kept.
      Chosen after the search subagent covered the instruction corpus, guard
      headers, the tracker and the ledger: the "read the Skill before a brief"
      rule failed as prose (#2475, #2543; ledger `dispatch-read-guard-deny`, 48
      occurrences) and `scripts/hooks/dispatch-read-guard.ts` now denies the
      dispatch until it is read, so the Skill text is what remains to tighten.
      Little text to cut. Runners-up: CLAUDE.md "Verify before you state"
      (already cut to one home, PR #2537) and the git-conventions no-chaining
      rule (pruned once, #2762). Same run judged and deleted the gate-freeze
      trial (landed a516ce3c): 50 sessions ended since, no major or blocker
      Friction traces to it; edit-during-gate-run 13.0% -> 7.5% (18/138 -> 3/40),
      push-chained-to-gate-run 4.3% -> 2.5%; no issue.
    territory:
      paths:
        - ".agents/skills/dispatch-subagents/SKILL.md: sections 2 and 3"
      keywords:
        - isolation
        - stranded
    opened: 2026-11-08
    proven: true
    check: >
      Damage is a major or blocker Friction where a dispatched subagent's work
      was lost, stranded or run on the wrong checkout, or a review agent
      moved a checkout, and a cut line would have prevented it. NOT damage:
      `dispatch-read-guard-deny` at its standing rate (the guard's own deny).
  - problem: >
      The review-then-gate rule before a PR opens (-2 net, from
      `git diff --numstat`: 8 added, 10 deleted; this entry not counted):
      `pr-workflow.md` "Review before opening the PR" reworded to state the goal
      first, recipe step 1 and "Closing a scheduled run's PR" step 1 cut to
      pointers at it (their restated gate command and "done when" dropped),
      `audit-docs` §Gate's restated sequence cut to the pointer; every rule kept.
      Chosen after the search subagent covered CLAUDE.md, `docs/agents/`, rules,
      Skills, workflows, guard headers and the 126 ledger files (not the
      tracker): `prepush-gate-review-skipped` (20 occurrences; #2472, #2748
      closed not planned) and `edit-during-gate-run` (22; #2579) failed as prose
      and were narrowed repeatedly; nothing holds the first-push review, so the
      cut is deliberately small and keeps every rule. Runners-up: CLAUDE.md
      read-first triggers (hints wired, owner-accepted #2066) and the stop-hook
      nag text (harness-side, #2233). No open trial was judgeable this run
      (`find-trial-window.ts`: all three before `judgeable from:`).
    territory:
      paths:
        - "docs/agents/pr-workflow.md: 'Review before opening the PR', recipe step 1, 'Closing a scheduled run's PR' step 1"
        - ".agents/skills/audit-docs/SKILL.md: Gate section"
      keywords:
        - gate:scoped
        - code-review before the PR
    opened: 2026-11-09
    proven: true
    check: >
      Damage is a major or blocker Friction where a PR opened without
      `code-review` or without `gate:scoped` on its final head, or a session
      edited during a gate run, because a cut line no longer said so. Compare
      `prepush-gate-review-skipped` and `edit-during-gate-run` shares with
      `friction-rates.ts`. NOT damage: those entries at their standing rates.
  - problem: >
      The git-conventions.md chaining rules (+3 net, from
      `git diff --numstat`: 12 added, 9 deleted; this entry not counted):
      "Don't chain git past a step that can fail silently" reworded to the goal
      (a failed step never lets a later git command run on the wrong state)
      plus two bullets; every rule kept, widened to add and amend, and the
      `tail` exit-code trap added. Chosen after the search subagent covered
      CLAUDE.md, `docs/agents/`, rules, Skills, guard headers, the tracker and
      the ledger: the rule failed as prose twice (#2359, #2407, both doc-only
      narrowings; ledger `push-chained-to-gate-run`, 7 occurrences, #2752 open;
      `chained-git-step-fails-silently`, 4 occurrences) and nothing wired holds
      it, so the cut is deliberately small. Runners-up: CLAUDE.md "Question the
      premise" (63 words; owner closed #2997 with no change) and "One home per
      fact" (#2753, #3025). Same run judged and deleted the provenance-guard
      comments trial (landed e21985af): 74 sessions ended since, no major or
      blocker Friction traces to it, the guard file is unchanged, and
      `session-id-hand-typed` 9/121 -> 5/63 (7.4% -> 7.9%); no issue.
    territory:
      paths:
        - "docs/agents/git-conventions.md: 'Keep git apart from steps that can fail'"
      keywords:
        - chained git
        - gate exit status
    opened: 2026-11-10
    proven: true
    check: >
      Damage is a major or blocker Friction where a push or commit ran on a
      wrong or failed state because the cut wording no longer said so. Compare
      `push-chained-to-gate-run` and `chained-git-step-fails-silently` shares
      with `friction-rates.ts`; a clear rise in either is also damage. NOT
      damage: those entries at their standing rates (nits already recur).
