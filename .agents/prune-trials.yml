# Open Prune Trials (ADR-0027). One entry per pruned problem. The window runs
# from when the prune lands on `main`, not from `opened:`;
# `pnpm exec tsx .agents/skills/prune-trial/scripts/find-trial-window.ts`
# gives it. An entry is deleted the moment `/prune-trial` judges it — git holds the history, this
# file holds only what is unjudged.
#
# The entry ships in the prune's own commit, so that commit is the record: to
# read back what was cut, `git log` this file. Nothing here has to be filled in
# after the PR merges.
#
# trials:
#   - problem: what the pruned prose was trying to prevent
#     territory:                     # the next trial must not overlap these
#       paths:
#         - path/or/file/touched
#       keywords:
#         - keyword or phrase
#     opened: 2026-08-23
#     proven: false                  # only when §4's Sonnet probe could not run
#     check: how you would tell this broke — written now, while you still
#            remember what the prose was for. Prose, not a command; say what
#            distinguishes real damage from a session simply using the pruned
#            topic's tools correctly.
trials:
  - problem: >
      `docs/agents/verifying-ui-changes.md` plainly rewritten (-438 words: 1550 ->
      1112 by `wc -w`; -42 lines by `git diff --numstat`, 101 added, 143 deleted):
      session-id citations, repeated justifications and the capture-tooling
      restatements went; every rule, command, sharp edge and CSS edge kept, and
      the heading "The sharp edges" with its two subsections stays (cited by
      `tests/README.md`). Chosen after a search subagent this run searched the
      ledger `fixes:` lists, the tracker's "Regression" issues and `git log`
      for rules that failed as prose; its pick: `claim-of-fix-not-rendered` (2
      fixes, PRs #2614 and #3031, each added a paragraph to this doc) and
      `preview-dev-server-stale-or-unhydrated` (3 fixes, PRs #3096, #3254,
      #3456; counts read from the ledger files this run). No open trial covers
      the doc (`trial-territory.ts` run this run).
    territory:
      paths:
        - "docs/agents/verifying-ui-changes.md"
      keywords:
        - verifying-ui-changes
        - scrollWidth
        - computed colour
    opened: 2026-11-26
    proven: true
    check: >
      Damage is a major or blocker Friction where a session reported a UI change
      working without the check the cut text carried (SSR HTML grep instead of the
      rendered DOM, a colour or fit fix confirmed only by screenshot, a `--dev`
      shot trusted for diagnosis, a "pre-existing" e2e failure from a filtered
      run). Compare the shares of `claim-of-fix-not-rendered` and
      `preview-dev-server-stale-or-unhydrated` with `friction-rates.ts`; a clear
      rise is also damage. NOT damage: a session following the doc correctly and
      still hitting a Chromium quirk the doc names.
  - problem: >
      `docs/agents/pr-workflow.md` plainly condensed (-109 words: 1321 -> 1212 by
      `wc -w`; line delta in the PR title): issue-number citations, the gate-skip
      path list, the recipe step 3 and 5 justifications and repeated reminders
      went; every step, its numbering, the simple-change test and every heading
      kept (Skills and scripts cite them by name). Chosen after a search subagent
      this run read the ledger `fixes:` lists of all 139 entries and searched the
      tracker (one `search/issues` query); `prepush-gate-review-skipped` (9 fixes,
      #1852 .. #3491, several narrowing this same section) and 5 closed
      "Regression: prepush-gate-review-skipped recurs" issues (#2311, #2354,
      #2397, #2472, #3407; titles read, bodies not). `merge-pr.ts`
      (`simpleChangeRefusal`, `verdictRefusal`) already enforces the simple-change
      bars and the review proof. Not searched: `guards.md`, `.agents/skills/**`.
    territory:
      paths:
        - "docs/agents/pr-workflow.md"
      keywords:
        - simple change
        - Own-read
        - verdict-line
    opened: 2026-11-27
    proven: true
    check: >
      Damage is a major or blocker Friction where a session opened a PR without
      the review or gate the cut text carried, posted no verdict, or merged
      around a `merge-pr.ts` refusal it should have foreseen from the doc.
      Compare the shares of `prepush-gate-review-skipped` and
      `merge-pr-own-read-refusal` with `friction-rates.ts`; a clear rise is also
      damage. NOT damage: a refusal `merge-pr.ts` raises on a diff that fails
      the simple-change test the doc still states.
  - problem: >
      `.agents/skills/dispatch-subagents/SKILL.md` plainly condensed (-31 words:
      1129 -> 1098 by `wc -w`; -5 lines by `git diff --numstat`, 37 added, 42
      deleted): restatements merged (impl-agent bans, collision and resume
      sections), every rule, section number and heading kept (Skills cite
      `dispatch-subagents` §3 and "Scope and trust"). Small because an earlier
      trial (PR #2324, judged 2026-11-23) already cut this text. Chosen after a
      search subagent this run searched ledger `fixes:` lists and 'Regression'
      issue titles (not read: bodies, `guards.md` beyond its roster); it ranked
      the subagent-brief rules by largest prose mass among those with failures.
      Its counts are unverified here, so none are cited. `trial-territory.ts` run
      this run on the file path: no overlap. Sonnet probe pinned to 10841085bebc
      passed; three original clauses were restored verbatim after it (96bdcd8).
    territory:
      paths:
        - ".agents/skills/dispatch-subagents/SKILL.md"
      keywords:
        - dispatch-subagents
        - subagent brief
    opened: 2026-11-28
    proven: true
    check: >
      Damage is a major or blocker Friction where a brief omitted a line the cut
      text carried (SHA pin, worktree isolation, commit-before-stop, foreground
      checks, the Scope and trust rules). Compare the shares of
      `subagent-brief-defects` and `subagent-brief-omits-verdict-ask` with
      `friction-rates.ts`; a clear rise is damage. NOT damage: an unfilled
      placeholder the guard denies.
