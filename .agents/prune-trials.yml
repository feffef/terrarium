# Open Prune Trials (ADR-0027). One entry per pruned problem; the verdict is due
# three days after the prune lands on `main` — ADR-0027's window runs from the
# landing, not from `opened:` below (get the real landing with
# `pnpm exec tsx scripts/prune-trial-window.ts`; see the prune-trial Skill's §1). An entry
# is deleted the moment `/prune-trial` judges it — git holds the history, this
# file holds only what is unjudged.
#
# The entry ships in the prune's own commit, so that commit is the record: to
# read back what was cut, `git log` this file. Nothing here has to be filled in
# after the PR merges.
#
# trials:
#   - problem: what the pruned prose was trying to prevent
#     territory:                     # the next trial must not overlap these
#       paths:
#         - path/or/file/touched
#       keywords:
#         - keyword or phrase
#     opened: 2026-08-23
#     proven: false                  # only when §4's Sonnet probe could not run
#     check: how you would tell this broke — written now, while you still
#            remember what the prose was for. Prose, not a command; say what
#            distinguishes real damage from a session simply using the pruned
#            topic's tools correctly.
trials:
  - problem: >
      Four of CLAUDE.md's Working-conventions footgun bullets (ScheduleWakeup,
      double-backgrounding, tail/head-piping, dispatched-subagent
      backgrounding) each restated a fail-closed `PreToolUse` guard's own
      rationale and mechanics in full, even though `docs/agents/guards.md`'s
      own lead sentence already says "If a guard just denied your call, its
      deny message is the instruction" — the same "narrated incident that a
      built mechanism has since made redundant" shape flagged as
      `prune-trial`'s criterion-1 bait in
      `docs/research/rulebook-migration-table.md`'s CM-27/28/37/38 rows (all
      four "Built", i.e. Cost: 0). The provenance-header bullet two entries
      below already modeled the compressed shape ("the guard's own deny
      message — not this doc — is the rule's teaching surface"); these four
      hadn't caught up to it. Compressed each to the bold rule statement plus
      a one-clause reason a reader can't get from the deny message alone
      (ScheduleWakeup: `stop: true`'s exemption; double-backgrounding: what
      "completed" stops meaning; tail-piping: wrong-status-not-truncation;
      subagent-backgrounding: no wake mechanism resumes a stopped subagent)
      plus the `docs/agents/guards.md` + issue-number pointer, dropping the
      restated deny-message content and (for double-backgrounding) the
      mechanism-internals explanation of *why* the guard denies it — agents
      calling the tool this way no longer reach that code path to need it.
      Left the pkill bullet and the git-mechanics pointer bullet untouched:
      pkill has no guard (the prose + `scripts/preview.ts` substitute is the
      only enforcement), and the git-mechanics bullet is already a bare
      pointer. Net -10 lines (`CLAUDE.md` only).
    territory:
      paths:
        - "CLAUDE.md: the ScheduleWakeup, double-backgrounding, tail/head-piping, and dispatched-subagent-backgrounding bullets (Working conventions)"
      keywords:
        - backgrounds the inner shell
        - no wake mechanism ever resumes
        - names the fix
        - deny message is the instruction
    opened: 2026-09-15
    proven: true
    check: >
      Damage is a session that, needing to know *why* one of these four
      footguns matters or what to do instead, reads the compressed bullet and
      either can't find the pointer to `docs/agents/guards.md`/the guard's
      deny message (so gives up rather than following it), or — for
      double-backgrounding specifically — still doesn't know what alternative
      to reach for (`Monitor`/`ps` plus a completion marker) because that
      survived the trim. NOT damage: a session that is simply denied by the
      guard and follows the deny message's own fix without needing the
      now-shorter CLAUDE.md bullet at all (the intended design — the doc is a
      secondary explanation, the guard is primary), or one that never hits any
      of these four shapes this run. A Sonnet probe given only the compressed
      text correctly named `Monitor`/`ps` plus a log completion marker as the
      alternative to a stacked `&`, correctly said `stop: true` is the one
      `ScheduleWakeup` call allowed outside a `/loop` session, correctly
      recommended redirecting a long-running command's output to a file
      instead of piping through `tail`, and correctly explained that a
      dispatched subagent can't background a Bash command because nothing
      would ever wake it back up.
  - problem: >
      `docs/adr/0017-provenance-footer-on-agent-authored-content.md` carried
      ~155 lines of dated amendment blockquotes (2026-07-13 through
      2026-08-01, issues #346/#710/#723/#737/#784) narrating, step by step,
      how the provenance-marker rule evolved and where prose enforcement kept
      failing — the last amendment's own text names the failure explicitly
      ("#723 tracked five recurrences that four prose passes did not stop")
      and records that it deleted a sibling doc (`docs/agents/provenance.md`)
      for the same reason, concluding "that message [the guard's deny
      message] — not a doc — is the rule's teaching surface." Textbook
      prose-that-already-failed, self-documented in its own corpus, the same
      shape already pruned from ADR-0003 and ADR-0004. The final,
      currently-operative state (header vs. trailer, which surface uses
      which, fail-closed enforcement, legacy-trailer read-only recognition)
      is restated in full by the *last* two amendments alone and is also
      already single-homed in CLAUDE.md's Working Conventions and
      `docs/agents/guards.md`'s guard-roster row — the intermediate five
      amendments add only investigatory narrative (why each prior format
      lost, what was considered and rejected, an open question about hook
      injection) that git history preserves without needing to stay inline.
      Compressed the whole amendment block to one statement of the "prose
      kept failing" lesson plus the current state (header format + example,
      commit trailer format, which surface uses which, fail-closed
      enforcement, legacy-trailer reading permanence, bot identity deferred)
      and pointers to CLAUDE.md/guards.md/git-conventions.md/
      github-integration.md. Decision and Consequences untouched, per
      ADR-0027's bound (they still read as the original 2026-07-07 "convention
      only, not gate-enforced" text — superseded by the amendment above them,
      exactly as ADR-0003/0004's Decision/Consequences also stay
      superseded-but-unedited). Also fixed a now-stale line-number citation in
      `docs/research/rulebook-migration-table.md` that quoted this ADR's
      old line 19. Net -112 lines (267 → 155, the ADR) plus a one-line
      citation fix elsewhere.
    territory:
      paths:
        - "docs/adr/0017-provenance-footer-on-agent-authored-content.md: the amendment blockquotes above \"## Context\""
      keywords:
        - provenance header
        - provenance footer
        - github-provenance-guard
        - Co-Authored-By
        - Claude-Session
        - fail-closed
        - legacy trailer
        - session URL
    opened: 2026-09-14
    proven: true
    check: >
      Damage is a session that, needing to know what provenance marker a
      GitHub body or a commit/MCP-write needs, reads the compressed amendment
      and either posts a two-line trailer on a GitHub comment/PR/issue body
      (the guard would block it, but the session shouldn't have tried),
      posts no marker at all on an MCP-API commit tool
      (`create_or_update_file`/`push_files`) thinking only interactive
      commits need one, imitates an old pre-2026-08-01 comment's legacy
      two-line trailer shape on a *new* post, or treats the Decision
      section's "convention only, not gate-enforced" as still true and skips
      the marker expecting it to quietly slip through. NOT damage: a session
      that opens CLAUDE.md's Working Conventions or `docs/agents/guards.md`
      for the operative rule instead of finding every nuance narrated inline
      (the intended design), or one that never needs this ADR this run. A
      Sonnet probe given only the compressed text correctly named the
      one-line header (not the two-line trailer) for a PR comment, correctly
      said `create_or_update_file`/`push_files` need the two-line trailer
      (grouped with commits, not GitHub bodies), correctly refused to treat
      an old comment's legacy two-line trailer as a template to imitate on a
      new post while still accepting it as valid historical evidence, and
      correctly said a marker-less PR body is actively blocked by the guard
      rather than a quiet convention-only gap.
  - problem: >
      `docs/adr/0009-session-logs-commit-directly-to-main.md` is by far the
      largest ADR (was 584 lines, ~2.7x the next-largest) — every session is
      instructed to read all ADRs before planning/structural work, so its size
      is a standing context tax. Several of its dated amendment sections carried
      investigation-narrative and stale-todo prose alongside their operative
      `**Decision.**`/`**Consequences.**` content: a "Why revisit"/"What the web
      harness actually does (measured, CLI 2.1.201)" pair of paragraphs
      re-deriving why `SessionEnd` alone doesn't work; a "Not yet built
      (follow-up gated PR)" checklist for work the very next section ("Landing
      mechanism as shipped") confirms already shipped; and three "**The
      problem.**"/"**The gap.**"-labeled incident narrations (the close-session
      front-door amendment, the truncation-sweep amendment, the `session`
      reclassification amendment) that told the same fact in twice the words
      the operative Decision/Consequences text next to them needed. Compressed
      each to its load-bearing fact plus its issue/PR pointer, touched no
      `**Decision.**`/`**Consequences.**` block anywhere (ADR-0018's bound:
      that text is never rewritten), deleted the now-stale "Not yet built" list
      outright (its own next section states it shipped), and fixed the one
      cross-reference that pointed at it. Net -27 lines (584 → 557, one file).
    territory:
      paths:
        - "docs/adr/0009-session-logs-commit-directly-to-main.md: the 'Why revisit'/'What the web harness actually does' paragraphs, the 'Not yet built' list, and the 'The problem'/'The gap' narrations in the close-session, truncation-sweep, and session-reclassification amendments"
      keywords:
        - Why revisit
        - measured, CLI 2.1.201
        - Not yet built
        - landedBy
        - reclassified as derived
    opened: 2026-09-16
    proven: true
    check: >
      Damage is a session that, needing to explain or act on the session-log
      mechanism, reads the compressed prose and either can't answer why the
      derived/authored field split exists (the self-reported fields were
      unreliable even though the transcript already had the facts), doesn't
      know that `SessionEnd` alone is insufficient (can't distinguish a freeze
      from a true end, can't block/prompt, isn't in the transcript) and so
      mis-diagnoses a missing log as a `SessionEnd`-only problem instead of
      checking the `Stop`-hook-first fallback chain and a log's own `landedBy`
      field, or treats the deleted "Not yet built" list as still describing
      unshipped work. NOT damage: a session that reads the operative
      Decision/Consequences text for the current mechanism instead of the
      trimmed narrative preamble (the intended design), or one that never
      needs this ADR this run. A Sonnet probe given only the compressed
      ADR-0009 text correctly explained why session-log fields split into
      derived-from-transcript vs. agent-authored, correctly named the
      `Stop`-hook-first / `SessionEnd`-fallback / `SessionStart`-resume-fallback
      chain (not "SessionEnd" alone) as what lands a log and `landedBy` as how
      to tell which one fired, correctly said a general reminder/block `Stop`
      hook was rejected as untested runtime behaviour rather than never
      considered, and correctly resolved a `session`-field disagreement in
      favor of the mechanical trace over the agent-typed value.
