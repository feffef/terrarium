steps:
  - id: promote-mdc-components
    kind: promote
    pages:
      - nuxt-content/05.mdc-components
    raised:
      - 2026-11-01
    status: taken
    gist: MDC components, and when not to use them; all three raters ranked it.
    decided: 2026-11-02
  - id: promote-prose-overrides
    kind: promote
    pages:
      - nuxt-content/06.prose-overrides
    raised:
      - 2026-11-02
    status: taken
    gist: Overriding Nuxt Content's prose components at the Platform root; all three raters ranked it.
    decided: 2026-11-02
  - id: split-planning-with-the-pack
    kind: split
    pages:
      - skill-pack/02.planning-with-the-pack
    raised:
      - 2026-11-02
    status: taken
    gist: Split wayfinder into its own Lesson; grilling, to-spec and to-tickets stay; all three raters raised it.
    decided: 2026-11-02
  - id: move-vue-components-into-css-custom-properties
    kind: move
    pages:
      - nuxt-vue/05.vue-components
    raised:
      - 2026-11-02
    status: taken
    gist: Move ProgressBar's --n/--i custom-property explanation and its Why bullet to CSS custom properties; two raters raised it.
    into: nuxt-vue/07.css-custom-properties
    decided: 2026-11-02
  - id: section-timestamps-stored-as-strings-into-schema-validation
    kind: section
    pages:
      - verification/07.timestamps-stored-as-strings
    into: verification/06.schema-validation
    raised:
      - 2026-11-02
    status: dropped
    gist: One refined-string helper whose concept is a .refine and whose premise (schema becomes column types) is taught on Zod refinements and Content validation.
    decided: 2026-11-02
  - id: section-invariant-tests-into-unit-and-e2e-tests
    kind: section
    pages:
      - verification/09.invariant-tests
    into: verification/04.unit-and-e2e-tests
    raised:
      - 2026-11-02
    status: dropped
    gist: One Blog test; Testing already says a unit test can hold a content rule and carries the same Tenant-tests Why.
    decided: 2026-11-02
  - id: section-out-of-scope-records-into-work-queue
    kind: section
    pages:
      - terrarium-practice/06.out-of-scope-records
    into: git-github/06.work-queue
    raised:
      - 2026-11-02
    status: dropped
    gist: A rejected-idea record is one triage-Skill folder; the sweep and wontfix flow already live on Issue triage labels.
    decided: 2026-11-02
  - id: section-planning-with-the-pack-into-skill-packs
    kind: section
    pages:
      - skill-pack/02.planning-with-the-pack
    into: skill-pack/01.skill-packs
    raised:
      - 2026-11-02
    status: dropped
    gist: Keep only Terrarium's wayfinder-on-GitHub mapping and the ready-for-agent rule; the seven-Skill tour is upstream and Skill Inventory content.
    decided: 2026-11-02
  - id: move-mcp-servers-cloud-sessions-into-permissions
    kind: move
    pages:
      - claude-code/08.mcp-servers
      - claude-code/11.cloud-sessions
    into: claude-code/12.permissions
    raised:
      - 2026-11-02
    status: taken
    gist: Give the allow list, the untrusted-workspace rule and the cloud-ignores-allow rule one home on Permissions, with the duplicate settings.json excerpt cut from MCP servers.
    decided: 2026-11-02
  - id: move-gate-into-composite-actions
    kind: move
    pages:
      - verification/01.gate
    into: git-github/03.composite-actions
    raised:
      - 2026-11-02
    status: taken
    gist: The 'agents cannot push workflow files, so move steps into an action' story is told on both; keep it on Composite actions.
    decided: 2026-11-02
  - id: move-git-worktrees-into-session-logs
    kind: move
    pages:
      - git-github/02.git-worktrees
    into: terrarium-practice/04.session-logs
    raised:
      - 2026-11-02
    status: taken
    gist: The log-session.ts refusal to write from a linked worktree (isLinkedWorktree excerpt) is a log-script fact; Session logs does not mention it.
    decided: 2026-11-02
  - id: move-layers-into-auto-imports
    kind: move
    pages:
      - nuxt-vue/01.layers
    into: nuxt-vue/04.auto-imports
    raised:
      - 2026-11-02
    status: taken
    gist: Layers restates the shared auto-import namespace and silent name clash that Auto-imports owns; leave a link.
    decided: 2026-11-02
  - id: move-query-collection-into-file-routing
    kind: move
    pages:
      - nuxt-content/04.query-collection
    into: nuxt-vue/02.file-routing
    raised:
      - 2026-11-02
    status: taken
    gist: The literal-Tenant-name typing rule and the resolver/key-lookup recap belong to useSpace on File routing; link instead of restating.
    decided: 2026-11-02
  - id: promote-mdc-components-into-mdc-components
    kind: promote
    pages:
      - drafts/nuxt-content/05.mdc-components
    into: nuxt-content/05.mdc-components
    raised:
      - 2026-11-02
    status: dropped
    gist: The guide's own pages are written in MDC (::lessons, ::excerpt, :term, :file); no guide Lesson teaches it, and the Nuxt Content numbering skips 05.
    decided: 2026-11-02
  - id: promote-prose-overrides-into-prose-overrides
    kind: promote
    pages:
      - drafts/nuxt-content/06.prose-overrides
    into: nuxt-content/06.prose-overrides
    raised:
      - 2026-11-02
    status: dropped
    gist: Mermaid pre-rendering relies on the ProsePre override that this draft teaches; promoting it gives the Mermaid page a Lesson to link, and fills the numbering gap.
    decided: 2026-11-02
  - id: promote-a-bug-report-becomes-work-into-a-bug-report-becomes-work
    kind: promote
    pages:
      - drafts/walkthroughs/a-bug-report-becomes-work
    into: walkthroughs/a-bug-report-becomes-work
    raised:
      - 2026-11-02
    status: taken
    gist: The Public-author path (sweep reads who wrote it, person approves, session builds, person merges) is told by no guide Walkthrough, and the guide has no Walkthrough on the request-in direction.
    decided: 2026-11-02
