<title>Tinkerfund Identity Studies</title>
<!--
  PROTOTYPE, throwaway. Wayfinder ticket "Tinkerfund: visual identity" (feffef/terrarium#1362).
  Round 2: A (Commerce) and C (Lab) kept as reference ends, with three blends between them —
  D Commerce + spec, E Instrument, F Datasheet — plus G, the pick (E with F's index table on Home),
  each on a rough Home and Campaign page,
  switchable from the floating bar (or ← / →). Round 1 (with B Editorial) is v1-abc.html. Fonts load from Google Fonts here only because this
  file is a standalone preview; every face is OFL and would be committed as woff2 in the real layer.
  Illustrations are placeholders: art direction is the "illustration style" ticket.
-->
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Schibsted+Grotesk:wght@400;500;700;800&family=JetBrains+Mono:wght@400;500;600&family=Archivo:wdth,wght@62..125,400..800&family=IBM+Plex+Mono:wght@400;500;600&family=Instrument+Sans:wdth,wght@75..100,400..700&family=Martian+Mono:wdth,wght@75..112.5,400..600&display=swap">
<style>
:root{
  --bg:#F6F7F9;--surface:#fff;--ink:#0F1729;--muted:#56607A;--line:#E1E5EE;--accent:#2346D8;--accent-ink:#fff;
  --accent-soft:#E6EBFD;--link:#2346D8;--good:#117A4B;--warn:#A85B00;--bad:#B42318;--grid:#EEF1F5;--mark:#FFD60A;
  --radius:12px;--shadow:none;--dur:180ms;--ease:ease;
  --font-display:system-ui,sans-serif;--font-body:system-ui,sans-serif;--font-mono:ui-monospace,monospace;
}
@media (prefers-reduced-motion: reduce){ body{ --dur:1ms !important } }
*{box-sizing:border-box}
html{scroll-behavior:smooth}
@media (prefers-reduced-motion: reduce){ html{scroll-behavior:auto} }
body{background:var(--bg);color:var(--ink);font-family:var(--font-body);font-size:16px;line-height:1.5;
  padding:0 0 136px;-webkit-font-smoothing:antialiased;transition:background-color var(--dur) var(--ease),color var(--dur) var(--ease)}
button,input,select{font:inherit;color:inherit}
a{color:var(--link)}
:focus-visible{outline:2px solid var(--link);outline-offset:2px}
h1,h2,h3{text-wrap:balance;margin:0}
p{margin:0}
.wrap{max-width:1180px;margin:0 auto;padding-inline:16px}
@media (min-width:720px){.wrap{padding-inline:28px}}
.sr{position:absolute;width:1px;height:1px;overflow:hidden;clip:rect(0 0 0 0)}
.num{font-variant-numeric:tabular-nums}
svg.art{display:block;width:100%;height:100%}
svg.art .s{fill:none;stroke:var(--art-ink,var(--ink));stroke-width:3;stroke-linecap:round;stroke-linejoin:round}
svg.art .f{fill:var(--art-fill,var(--surface));stroke:var(--art-ink,var(--ink));stroke-width:3;stroke-linejoin:round}
svg.art .a{fill:var(--art-accent,var(--accent));stroke:var(--art-ink,var(--ink));stroke-width:3}
svg.art .al{fill:none;stroke:var(--art-accent,var(--accent));stroke-width:3;stroke-linecap:round;stroke-linejoin:round}

/* ---------- demo bar (sitewide in every variant) ---------- */
.demo{font-size:13px;border-bottom:1px solid var(--line);background:var(--surface);color:var(--muted)}
.demo .wrap{display:flex;gap:12px;align-items:center;justify-content:space-between;padding-block:6px;flex-wrap:wrap}
.demo button{background:none;border:0;color:var(--link);text-decoration:underline;cursor:pointer;padding:2px 0}

/* ---------- the pledge dialog (shared, styled by tokens) ---------- */
dialog.pledge{border:1px solid var(--line);background:var(--surface);color:var(--ink);border-radius:var(--radius);
  box-shadow:var(--shadow);padding:0;width:min(460px,calc(100% - 32px));
  opacity:1;transform:none;transition:opacity var(--dur) var(--ease),transform var(--dur) var(--ease),overlay var(--dur) allow-discrete,display var(--dur) allow-discrete}
@starting-style{dialog.pledge[open]{opacity:0;transform:translateY(12px)}}
dialog.pledge:not([open]){opacity:0;transform:translateY(12px)}
dialog.pledge::backdrop{background:rgb(0 0 0 / .45);transition:background-color var(--dur) var(--ease),overlay var(--dur) allow-discrete,display var(--dur) allow-discrete}
@starting-style{dialog.pledge[open]::backdrop{background:rgb(0 0 0 / 0)}}
.pledge form{display:grid;gap:16px;padding:20px}
.pledge h2{font-family:var(--font-display);font-size:20px}
.pledge fieldset{border:0;padding:0;margin:0;display:grid;gap:8px}
.pledge legend{font-size:13px;color:var(--muted);margin-bottom:6px}
.pledge label.opt{display:flex;gap:10px;align-items:center;justify-content:space-between;border:1px solid var(--line);border-radius:calc(var(--radius) * .6);padding:10px 12px;cursor:pointer}
.pledge label.opt:has(input:checked){border-color:var(--link);background:var(--accent-soft)}
.pledge label.opt:has(input:disabled){opacity:.55;cursor:not-allowed}
.pledge label.opt span:first-of-type{flex:1}
.pledge .row{display:flex;gap:12px;align-items:center;justify-content:space-between}
.pledge select{border:1px solid var(--line);background:var(--bg);border-radius:calc(var(--radius) * .5);padding:8px}
.pledge .total{font-size:18px;font-weight:700;font-variant-numeric:tabular-nums}
.pledge .actions{display:flex;gap:10px;justify-content:flex-end}
.btn{display:inline-flex;align-items:center;justify-content:center;gap:8px;border:1px solid transparent;cursor:pointer;
  padding:11px 18px;font-weight:600;text-decoration:none;border-radius:calc(var(--radius) * .6);
  transition:transform var(--dur) var(--ease),background-color var(--dur) var(--ease),box-shadow var(--dur) var(--ease)}
.btn.primary{background:var(--accent);color:var(--accent-ink)}
.btn.ghost{background:transparent;border-color:var(--line);color:var(--ink)}
.btn:disabled{opacity:.5;cursor:not-allowed}
.toast{position:fixed;inset:auto auto 96px 50%;translate:-50% 0;margin:0;border:1px solid var(--line);background:var(--ink);color:var(--bg);
  padding:10px 16px;border-radius:calc(var(--radius) * .6);font-weight:600;
  opacity:1;transition:opacity var(--dur) var(--ease),translate var(--dur) var(--ease),overlay var(--dur) allow-discrete,display var(--dur) allow-discrete}
@starting-style{.toast:popover-open{opacity:0;translate:-50% 8px}}
.toast:not(:popover-open){opacity:0;translate:-50% 8px}

/* ---------- prototype switcher (deliberately not part of any design) ---------- */
.sw{position:fixed;left:50%;bottom:calc(12px + env(safe-area-inset-bottom, 0px));translate:-50% 0;z-index:50;
  display:flex;flex-wrap:wrap;align-items:center;justify-content:center;gap:6px;max-width:calc(100% - 24px);
  background:#111;color:#f4f4f4;border:1px solid #333;border-radius:14px;padding:6px 8px;
  font:500 13px/1.2 ui-monospace,SFMono-Regular,Menlo,monospace;box-shadow:0 8px 30px rgb(0 0 0 / .35)}
.sw button{background:#262626;color:#f4f4f4;border:1px solid #3a3a3a;border-radius:8px;padding:6px 9px;cursor:pointer;font:inherit}
.sw button[aria-pressed="true"]{background:#f4f4f4;color:#111}
.sw .lbl{min-width:13ch;text-align:center;padding-inline:4px}
.sw .grp{display:flex;gap:4px}
#tokens{margin:0;inset:auto auto 84px 50%;translate:-50% 0;width:min(520px,calc(100% - 24px));max-height:60vh;overflow:auto;
  background:#111;color:#f4f4f4;border:1px solid #333;border-radius:14px;padding:16px;font:13px/1.45 ui-monospace,SFMono-Regular,Menlo,monospace}
#tokens h3{font-size:14px;margin:0 0 8px}
#tokens dl{display:grid;grid-template-columns:max-content 1fr;gap:6px 14px;margin:0}
#tokens dt{color:#9a9a9a}
#tokens dd{margin:0}
#tokens .sws{display:flex;flex-wrap:wrap;gap:6px}
#tokens .swt{display:inline-flex;align-items:center;gap:6px}
#tokens .swt i{width:14px;height:14px;border-radius:3px;border:1px solid #555;display:inline-block}

/* =====================================================================
   A · COMMERCE — crisp, cobalt, dense cards, quick motion
   ===================================================================== */
.vA .promo,.vD .promo{background:var(--accent);color:var(--accent-ink);font-size:14px;text-align:center;padding:8px 16px}
.vA .promo b,.vD .promo b{letter-spacing:.06em}
.a-head{position:sticky;top:env(safe-area-inset-top, 0px);z-index:10;background:color-mix(in srgb,var(--surface) 88%,transparent);backdrop-filter:blur(10px);border-bottom:1px solid var(--line)}
.a-head .wrap{display:flex;align-items:center;gap:20px;padding-block:12px;flex-wrap:wrap}
.a-logo{display:inline-flex;align-items:center;gap:8px;font:800 22px/1 var(--font-display);letter-spacing:-.03em;color:var(--ink);text-decoration:none}
.a-logo svg{width:24px;height:24px}
.a-nav{display:flex;gap:18px;font-weight:500;font-size:15px}
.a-nav a{color:var(--ink);text-decoration:none}
.a-nav a:hover{color:var(--link)}
.a-search{flex:1;min-width:180px;display:flex;align-items:center;gap:8px;background:var(--bg);border:1px solid var(--line);border-radius:999px;padding:8px 14px;color:var(--muted)}
.a-search input{border:0;background:none;outline:none;width:100%}
.a-cart{display:inline-flex;align-items:center;gap:8px;background:var(--ink);color:var(--bg);border:0;border-radius:999px;padding:9px 14px;font-weight:600;cursor:pointer}
.a-cart span{background:var(--accent);color:var(--accent-ink);border-radius:999px;min-width:22px;padding:0 6px;font-size:13px;line-height:22px;text-align:center}
@media (max-width:719px){.a-nav{order:3;width:100%;overflow-x:auto}.a-search{order:4;flex-basis:100%}}
.a-feature{display:grid;gap:24px;align-items:center;margin-block:28px;background:var(--surface);border:1px solid var(--line);border-radius:calc(var(--radius) * 1.5);padding:16px;box-shadow:var(--shadow)}
@media (min-width:820px){.a-feature{grid-template-columns:1.1fr 1fr;padding:24px}}
.a-feature .artbox{aspect-ratio:4/3;background:var(--accent-soft);border-radius:var(--radius);padding:8%;max-width:100%}
.a-eyebrow{display:inline-flex;align-items:center;gap:6px;font-size:13px;font-weight:700;color:var(--warn);text-transform:uppercase;letter-spacing:.06em}
.a-eyebrow::before{content:"";width:8px;height:8px;border-radius:50%;background:currentColor;animation:a-pulse 1.6s var(--ease) infinite}
@keyframes a-pulse{50%{opacity:.25}}
@media (prefers-reduced-motion: reduce){.a-eyebrow::before{animation:none}}
.a-feature h1{font:800 clamp(28px,4vw,44px)/1.05 var(--font-display);letter-spacing:-.03em;margin-top:8px}
.a-feature .tag{color:var(--muted);font-size:18px;margin-top:8px}
.a-stats{display:flex;flex-wrap:wrap;gap:6px 22px;margin-top:18px}
.a-stats div{display:grid}
.a-stats b{font:800 22px/1.1 var(--font-display);font-variant-numeric:tabular-nums}
.a-stats span{color:var(--muted);font-size:13px}
.a-bar{height:8px;border-radius:999px;background:var(--line);overflow:hidden;margin-top:14px}
.a-bar i{display:block;height:100%;border-radius:inherit;background:var(--accent);transform-origin:left;animation:a-fill calc(var(--dur) * 4) var(--ease) both}
.a-bar.over i{background:var(--good)}
@keyframes a-fill{from{transform:scaleX(.02)}}
.a-cta{display:flex;gap:10px;flex-wrap:wrap;margin-top:20px}
.vA .btn.primary:hover{transform:translateY(-1px);box-shadow:0 6px 16px -6px var(--accent)}
.vA .btn:active{transform:scale(.97)}
.a-filters{display:flex;gap:8px;align-items:center;flex-wrap:wrap;margin-bottom:16px}
.a-filters h2{font:800 22px/1 var(--font-display);letter-spacing:-.02em;margin-right:auto}
.a-chip{border:1px solid var(--line);background:var(--surface);border-radius:999px;padding:6px 14px;font-size:14px;font-weight:500;cursor:pointer}
.a-chip[aria-pressed="true"]{background:var(--ink);color:var(--bg);border-color:var(--ink)}
.a-grid{display:grid;gap:16px;grid-template-columns:repeat(auto-fill,minmax(min(100%,300px),1fr))}
.a-card{background:var(--surface);border:1px solid var(--line);border-radius:var(--radius);overflow:hidden;cursor:pointer;display:flex;flex-direction:column;
  box-shadow:var(--shadow);transition:transform var(--dur) var(--ease),box-shadow var(--dur) var(--ease)}
.a-card:hover{transform:translateY(-3px);box-shadow:0 14px 30px -16px rgb(15 23 41 / .35)}
.a-card .artbox{position:relative;aspect-ratio:4/3;background:var(--accent-soft);padding:10%;max-width:100%}
.a-card .body{padding:14px 16px 16px;display:grid;gap:6px}
.a-card .meta{font-size:13px;color:var(--muted)}
.a-card h3{font:700 18px/1.2 var(--font-display);letter-spacing:-.01em}
.a-card .foot{display:flex;justify-content:space-between;font-size:14px;margin-top:4px}
.a-card .foot b{font-variant-numeric:tabular-nums}
.a-badge{position:absolute;top:10px;left:10px;font-size:12px;font-weight:700;padding:3px 8px;border-radius:6px;background:var(--surface);color:var(--ink);border:1px solid var(--line)}
.a-badge.live{color:var(--good)}.a-badge.soon{color:var(--warn)}.a-badge.unfunded{color:var(--bad)}
.a-badge.deal{left:auto;right:10px;background:var(--bad);color:#fff;border-color:transparent}
.a-crumbs{font-size:14px;color:var(--muted);margin-block:18px}
.a-crumbs a{color:var(--muted)}
.a-pdp{display:grid;gap:24px;align-items:start}
@media (min-width:900px){.a-pdp{grid-template-columns:1.25fr 1fr;gap:36px}}
.a-gallery{display:grid;gap:10px}
.a-gallery .main{aspect-ratio:4/3;background:var(--accent-soft);border-radius:var(--radius);padding:10%;max-width:100%}
.a-thumbs{display:grid;grid-template-columns:repeat(4,1fr);gap:10px}
.a-thumbs button{aspect-ratio:1;background:var(--accent-soft);border:2px solid transparent;border-radius:calc(var(--radius) * .7);padding:12%;cursor:pointer}
.a-thumbs button[aria-pressed="true"]{border-color:var(--link)}
.a-panel{background:var(--surface);border:1px solid var(--line);border-radius:calc(var(--radius) * 1.3);padding:20px;box-shadow:var(--shadow);display:grid;gap:14px}
@media (min-width:900px){.a-panel{position:sticky;top:84px}}
.a-panel h1{font:800 clamp(26px,3vw,34px)/1.1 var(--font-display);letter-spacing:-.03em}
.a-panel .tag{color:var(--muted)}
.a-inv{display:flex;gap:10px;align-items:center;font-size:14px}
.a-inv i{width:32px;height:32px;border-radius:50%;background:var(--accent-soft);color:var(--link);display:grid;place-items:center;font-style:normal;font-weight:700;font-size:13px}
.a-raised b{font:800 32px/1 var(--font-display);font-variant-numeric:tabular-nums;letter-spacing:-.02em}
.a-raised span{color:var(--muted);font-size:14px;display:block;margin-top:4px}
.a-trio{display:grid;grid-template-columns:repeat(3,1fr);border-block:1px solid var(--line);padding-block:12px}
.a-trio div{display:grid}
.a-trio b{font:700 18px/1.2 var(--font-display);font-variant-numeric:tabular-nums}
.a-trio span{font-size:12px;color:var(--muted)}
.a-swatches{display:flex;gap:8px;align-items:center;font-size:14px}
.a-swatches button{width:28px;height:28px;border-radius:50%;border:2px solid var(--surface);outline:1px solid var(--line);cursor:pointer}
.a-swatches button[aria-pressed="true"]{outline:2px solid var(--link)}
.a-ship{font-size:13px;color:var(--muted)}
.a-tabs{position:sticky;top:calc(env(safe-area-inset-top, 0px) + 62px);z-index:5;background:var(--bg);border-bottom:1px solid var(--line);margin-top:40px;display:flex;gap:4px;overflow-x:auto}
.a-tabs a{padding:12px 14px;color:var(--muted);text-decoration:none;font-weight:600;white-space:nowrap;border-bottom:2px solid transparent}
.a-tabs a.on{color:var(--ink);border-color:var(--accent)}
.a-tabs small{background:var(--line);border-radius:999px;padding:1px 7px;margin-left:4px;font-size:12px;color:var(--ink)}
.a-sec{display:grid;gap:14px;padding-block:28px;max-width:720px}
.a-sec h2{font:800 22px/1.2 var(--font-display);letter-spacing:-.02em}
.a-sec p{color:var(--ink)}
.a-goals{display:grid;gap:10px;list-style:none;padding:0;margin:0}
.a-goals li{display:grid;grid-template-columns:auto 1fr auto;gap:12px;align-items:center;background:var(--surface);border:1px solid var(--line);border-radius:var(--radius);padding:12px 14px}
.a-goals .tick{width:26px;height:26px;border-radius:50%;display:grid;place-items:center;background:var(--good);color:#fff;font-size:14px}
.a-goals .tick.no{background:var(--line);color:var(--muted)}
.a-goals b{font-variant-numeric:tabular-nums}

/* =====================================================================
   C · LAB — spec sheet, condensed grotesk + mono, grid paper, marker yellow, stepped motion
   ===================================================================== */
.vC,.vF{--grid-bg:linear-gradient(var(--grid) 1px,transparent 1px) 0 0/16px 16px,linear-gradient(90deg,var(--grid) 1px,transparent 1px) 0 0/16px 16px}
.vC .demo{font-family:var(--font-mono);font-size:12px;text-transform:uppercase;letter-spacing:.04em}
.c-head{border-bottom:2px solid var(--ink);background:var(--surface)}
.c-head .wrap{display:flex;align-items:center;gap:16px;padding-block:10px;flex-wrap:wrap}
.c-logo{display:inline-flex;align-items:center;gap:10px;color:var(--ink);text-decoration:none}
.c-logo svg{width:26px;height:26px}
.c-logo b{font:800 26px/1 var(--font-display);font-stretch:70%;letter-spacing:.02em;text-transform:uppercase}
.c-logo small{font:500 10px/1.2 var(--font-mono);color:var(--muted);letter-spacing:.06em;border-left:1px solid var(--line);padding-left:10px}
.c-nav{display:flex;gap:0;margin-left:auto;font:500 12px/1 var(--font-mono);text-transform:uppercase;letter-spacing:.06em;flex-wrap:wrap}
.c-nav a,.c-nav button{color:var(--ink);text-decoration:none;border:1px solid var(--line);margin-left:-1px;padding:9px 12px;background:var(--surface);cursor:pointer;font:inherit;letter-spacing:inherit;text-transform:inherit}
.c-nav a:hover,.c-nav button:hover{background:var(--accent);color:var(--accent-ink)}
.c-nav .cnt{background:var(--ink);color:var(--surface);padding:1px 5px;margin-left:6px}
.c-label{font:500 11px/1.2 var(--font-mono);text-transform:uppercase;letter-spacing:.08em;color:var(--muted)}
.c-hero{display:grid;border:1px solid var(--ink);margin-block:28px;background:var(--surface)}
@media (min-width:860px){.c-hero{grid-template-columns:1.2fr 1fr}}
.c-fig{position:relative;background:var(--grid-bg);padding:44px 40px 36px;min-height:260px;border-bottom:1px solid var(--ink)}
@media (min-width:860px){.c-fig{border-bottom:0;border-right:1px solid var(--ink)}}
.c-fig .cap{position:absolute;left:10px;top:8px}
.c-fig .dim{position:absolute;font:500 11px/1 var(--font-mono);color:var(--link)}
.c-fig svg.art{--art-accent:var(--link);max-height:300px}
.c-read{padding:20px;display:grid;gap:14px;align-content:start}
.c-id{font:600 13px/1 var(--font-mono);background:var(--accent);color:var(--accent-ink);display:inline-block;padding:4px 8px;justify-self:start}
.c-read h1,.c-title h1{font:800 clamp(30px,4.4vw,52px)/.95 var(--font-display);font-stretch:68%;text-transform:uppercase;letter-spacing:.005em}
.c-read .tag,.c-title .tag{color:var(--muted);font-size:15px}
.c-kv{display:grid;grid-template-columns:auto 1fr;border-top:1px solid var(--line);font:500 13px/1.2 var(--font-mono)}
.c-kv dt,.c-kv dd{margin:0;padding:8px 0;border-bottom:1px solid var(--line)}
.c-kv dt{color:var(--muted);text-transform:uppercase;letter-spacing:.06em;padding-right:16px}
.c-kv dd{text-align:right;font-variant-numeric:tabular-nums}
.c-seg{display:grid;grid-template-columns:repeat(25,1fr);gap:2px;height:14px}
.c-seg i{background:var(--line)}
.c-seg i.on{background:var(--ink);animation:c-on calc(var(--dur) * 2) steps(1,end) both}
.c-seg i.over{background:var(--good)}
@keyframes c-on{from{background:var(--line)}}
.c-big{font:600 clamp(40px,6vw,64px)/1 var(--font-mono);font-variant-numeric:tabular-nums;letter-spacing:-.03em}
.c-clock{font:600 20px/1 var(--font-mono);font-variant-numeric:tabular-nums}
.vC .btn{border-radius:0;font-family:var(--font-mono);text-transform:uppercase;letter-spacing:.06em;font-size:13px;border:1px solid var(--ink);transition:none}
.vC .btn.primary{box-shadow:4px 4px 0 var(--ink)}
.vC .btn.primary:hover{translate:-1px -1px;box-shadow:5px 5px 0 var(--ink)}
.vC .btn.primary:active{translate:3px 3px;box-shadow:1px 1px 0 var(--ink)}
.vC .btn.ghost{border-color:var(--ink)}
.c-bar{display:flex;align-items:center;gap:0;flex-wrap:wrap;border:1px solid var(--ink);margin-bottom:-1px;background:var(--surface)}
.c-bar h2{font:800 20px/1 var(--font-display);font-stretch:70%;text-transform:uppercase;padding:12px 14px;margin-right:auto}
.c-bar button{border:0;border-left:1px solid var(--line);background:none;padding:12px 14px;font:500 12px/1 var(--font-mono);text-transform:uppercase;letter-spacing:.06em;cursor:pointer}
.c-bar button[aria-pressed="true"]{background:var(--ink);color:var(--surface)}
.c-tablewrap{overflow-x:auto;border:1px solid var(--ink);background:var(--surface)}
.c-table{width:100%;border-collapse:collapse;font:500 13px/1.3 var(--font-mono);min-width:640px}

/* token CSS generated from the same object the Tokens panel reads, so the two can't disagree */
(function(){
  const decl = o => Object.entries(o).map(([k,v])=>`--${k}:${v};`).join('');
  let css='';
  for (const [k,v] of Object.entries(VARIANTS)){
    css+=`body.v${k}{${decl(v.light)}}`;
    css+=`@media (prefers-color-scheme: dark){:root:not([data-theme="light"]) body.v${k}{${decl(v.dark)}color-scheme:dark}}`;
    css+=`:root[data-theme="dark"] body.v${k}{${decl(v.dark)}color-scheme:dark}`;
  }
  const s=document.createElement('style'); s.textContent=css; document.head.appendChild(s);
})();

function stateOf(c){
  if (c.state==='live') return c.soon ? ['soon','Ending soon'] : ['live','Live'];
  return {upcoming:['upcoming','Upcoming'], funded:['funded','Funded'], unfunded:['unfunded','Unfunded']}[c.state];

function cta(c, cls='btn primary'){
  if (c.state==='live') return `<button class="${cls}" data-pledge="${c.id}">Back this campaign</button>`;

  if (c.state==='funded') return `<button class="${cls}" disabled>Funding ended · Funded</button>`;
  return `<button class="${cls}" disabled>Didn’t reach its goal</button>`;
}

const R = {A, D, E, G, F:C, C};
const ORDER = ['A','D','E','G','F','C'];
const app = document.getElementById('app');
const reduce = matchMedia('(prefers-reduced-motion: reduce)');

function paint(){
  document.body.className = 'v'+state.variant + (state.variant==='G' ? ' vE' : '');
  document.documentElement.dataset.variant = state.variant;
  app.innerHTML = R[state.variant][state.page]();
  document.getElementById('sw-label').textContent = `${state.variant} · ${VARIANTS[state.variant].name}`;
  document.getElementById('sw-home').setAttribute('aria-pressed', state.page==='home');
  document.getElementById('sw-campaign').setAttribute('aria-pressed', state.page==='campaign');
  renderTokens();
  try { history.replaceState(null,'','#'+state.variant.toLowerCase()+'-'+state.page); } catch(e){}
}
function go(mut, scroll=true){
  const run = () => { mut(); paint(); if (scroll) window.scrollTo({top:0,behavior:'instant'}); };
  if (document.startViewTransition && !reduce.matches) document.startViewTransition(run); else run();
}
function renderTokens(){
  const v = VARIANTS[state.variant], cs = getComputedStyle(document.body);
  const keys = ['bg','surface','ink','muted','line','accent','accent-soft','link','good','warn','bad','mark'];
  document.getElementById('tokens').innerHTML = `<h3>${state.variant} · ${v.name}</h3><p style="margin:0 0 12px;color:#bdbdbd">${v.note}</p>
    <dl><dt>Type</dt><dd>${v.fonts}</dd><dt>Colour</dt><dd class="sws">${keys.map(k=>`<span class="swt"><i style="background:${cs.getPropertyValue('--'+k).trim()}"></i>${k} ${cs.getPropertyValue('--'+k).trim()}</span>`).join('')}</dd>
    <dt>Radius</dt><dd>${v.radius}</dd><dt>Elevation</dt><dd>${v.elevation}</dd><dt>Motion</dt><dd>${v.motion}</dd><dt>Theme</dt><dd>Showing the ${document.body.matches(':root[data-theme="dark"] body') || (matchMedia('(prefers-color-scheme: dark)').matches && document.documentElement.dataset.theme!=='light') ? 'dark' : 'light'} palette.</dd></dl>`;
}

/* ---------- pledge dialog (simulated; nothing is stored) ---------- */
const dlg = document.getElementById('pledge'), form = document.getElementById('pledge-form');
function openPledge(id){
  const c = byId(id), d = detail(c);
  form.innerHTML = `<h2 id="pledge-title">Back ${esc(c.title)}</h2>
    <fieldset><legend>Reward</legend>${d.rewards.map((r,i)=>`<label class="opt"><input type="radio" name="reward" value="${r.price}" ${r.out?'disabled':''} ${(!r.out && i===d.rewards.findIndex(x=>!x.out))?'checked':''}><span>${r.name}${r.out?' · sold out':''}</span><span class="num">${fmt(r.price)}</span></label>`).join('')}</fieldset>
    ${d.colours?`<div class="row"><label for="pl-colour">Colour</label><select id="pl-colour">${d.colours.map(([n],i)=>`<option ${i===state.colour?'selected':''}>${n}</option>`).join('')}</select></div>`:''}
    ${d.addons.length?`<fieldset><legend>Add-ons</legend>${d.addons.map(a=>`<label class="opt"><input type="checkbox" name="addon" value="${a.price}"><span>${a.name}</span><span class="num">+${fmt(a.price)}</span></label>`).join('')}</fieldset>`:''}
    <div class="row"><span>Total, before shipping</span><span class="total" id="pl-total"></span></div>
    <div class="actions"><button class="btn ghost" value="cancel" formnovalidate>Cancel</button><button class="btn primary" value="add">Add to cart</button></div>`;
  updateTotal(); dlg.showModal();
}
function updateTotal(){
  const r = form.querySelector('input[name=reward]:checked'); let t = r ? +r.value : 0;
  form.querySelectorAll('input[name=addon]:checked').forEach(a=>t+=+a.value);
  const el = document.getElementById('pl-total'); if (el) el.textContent = fmt(t);
}
form.addEventListener('change', updateTotal);
dlg.addEventListener('close', ()=>{ if (dlg.returnValue==='add'){ state.cart++; document.querySelectorAll('[data-cartcount]').forEach(e=>e.textContent=state.cart); toast('Added to cart'); } });
let toastTimer; function toast(msg){ const t=document.getElementById('toast'); t.textContent=msg; try{t.showPopover();}catch(e){} clearTimeout(toastTimer); toastTimer=setTimeout(()=>{try{t.hidePopover();}catch(e){}},2400); }

/* ---------- events ---------- */
document.addEventListener('click', e=>{
  const t = e.target.closest('[data-go],[data-open],[data-filter],[data-pledge],[data-notify],[data-reset],[data-thumb],[data-colour],[data-step],[data-page]');
  if (!t) return;
  if (t.matches('a')) e.preventDefault();
  if (t.dataset.pledge) return openPledge(t.dataset.pledge);
  if (t.dataset.notify) return toast('We’ll remind you when it launches');
  if (t.hasAttribute('data-reset')) { state.cart=0; state.colour=0; state.thumb=0; document.querySelectorAll('[data-cartcount]').forEach(x=>x.textContent=0); return toast('Demo reset'); }
  if (t.dataset.thumb) { state.thumb=+t.dataset.thumb; return paint(); }
  if (t.dataset.colour) { state.colour=+t.dataset.colour; return paint(); }
  if (t.dataset.step) { const o=t.parentElement.querySelector('output'); o.textContent=Math.max(0,Math.min(2,+o.textContent+ +t.dataset.step)); return; }
  if (t.dataset.page) return go(()=>{state.page=t.dataset.page;});
  if (t.dataset.filter) return go(()=>{state.filter=t.dataset.filter; state.page='home';}, state.page!=='home');
  if (t.dataset.open) return go(()=>{state.cur=t.dataset.open; state.page='campaign'; state.thumb=0;});
  if (t.dataset.go) return go(()=>{state.page='home';});
});
document.addEventListener('keydown', e=>{
  if (e.key==='Enter' && e.target.matches('[data-open][tabindex]')) { e.target.click(); return; }
  if (e.target.closest('input,textarea,select,[contenteditable]') || dlg.open) return;
  if (e.key==='ArrowRight'||e.key==='ArrowLeft'){ const i=ORDER.indexOf(state.variant), n=ORDER[(i+(e.key==='ArrowRight'?1:ORDER.length-1))%ORDER.length]; go(()=>{state.variant=n;}, false); }
});
document.getElementById('sw-prev').onclick = ()=>go(()=>{state.variant=ORDER[(ORDER.indexOf(state.variant)+ORDER.length-1)%ORDER.length];}, false);
document.getElementById('sw-next').onclick = ()=>go(()=>{state.variant=ORDER[(ORDER.indexOf(state.variant)+1)%ORDER.length];}, false);
const THEMES = ['system','light','dark'];
document.getElementById('sw-theme').onclick = e=>{
  const cur = document.documentElement.dataset.theme || 'system', next = THEMES[(THEMES.indexOf(cur)+1)%3];
  if (next==='system') delete document.documentElement.dataset.theme; else document.documentElement.dataset.theme = next;
  e.currentTarget.textContent = 'Theme: '+next; renderTokens();
};

/* stepped countdown for the Ending-soon Campaign (Lab variant) */
let secs = 36*3600;
setInterval(()=>{ secs=Math.max(0,secs-1); const h=String(Math.floor(secs/3600)).padStart(2,'0'), m=String(Math.floor(secs%3600/60)).padStart(2,'0'), s=String(secs%60).padStart(2,'0');
  document.querySelectorAll('[data-countdown]').forEach(el=>el.textContent=`${h}:${m}:${s}`); }, 1000);

/* boot from a bare #a-home / #c-campaign token */
(function(){ const m = (location.hash||'').match(/^#([adegfc])-(home|campaign)$/); if (m){ state.variant=m[1].toUpperCase(); state.page=m[2]; }
  const t = document.documentElement.dataset.theme; if (t) document.getElementById('sw-theme').textContent='Theme: '+t; paint(); })();
</script>
