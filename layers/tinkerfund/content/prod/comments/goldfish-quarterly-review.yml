    text: Does the objective reset if the fish is moved to a bigger tank mid-quarter?
    replies:
      - author: Clara Whitcombe
        posted: -18d
        text: No. Objectives hold for the whole quarter regardless of tank size. A larger tank tends to raise laps on its own.
        inventor: true
