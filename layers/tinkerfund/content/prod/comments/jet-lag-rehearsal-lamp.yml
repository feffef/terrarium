campaign: jet-lag-rehearsal-lamp
comments:
  - author: Oliver T.
    posted: -27d
    text: Does it work if I am flying to a city in my own time zone?
    replies:
      - author: Lucía Ferrer
        posted: -27d
        text: Yes. There is nothing to rehearse, so the lamp stays as it is. It is still a good reading lamp.
        inventor: true
  - author: Keiko M.
    posted: -25d
    text: Backed the Return set. I would rather be tired in the hotel than on the plane.
  - author: Sanjay P.
    posted: -21d
    text: What happens if my flight is delayed by a day?
    replies:
      - author: Lucía Ferrer
        posted: -20d
        text: Move the departure date on the dial. The lamp holds the current offset for one extra night and continues.
        inventor: true
  - author: Birgit H.
    posted: -16d
    text: Slate is the right colour for a lamp that makes you tired.
  - author: Marcus W.
    posted: -12d
    text: My partner is not travelling. Will the lamp affect them?
    replies:
      - author: Lucía Ferrer
        posted: -11d
        text: It will. Several testers rehearsed as a couple for this reason. The Return set does not include a second partner.
        inventor: true
  - author: Anneke V.
    posted: -7d
    text: Fourteen nights unlocked. Sydney in March, here I come, slowly.
  - author: Dario F.
    posted: -30h
    text: Can I use it to rehearse daylight saving time?
    replies:
      - author: Lucía Ferrer
        posted: -26h
        text: Yes. Choose your own city and the date the clocks change. One hour takes one night.
        inventor: true
  - author: Hana S.
    posted: -8h
    text: Backed with a day to spare. I leave for Lima on the ninth and have started going to bed at midnight in advance.
