campaign: backup-suitcase
updates:
  - title: Funded in four days
    published: -14d
    body: |-
      We reached €35,000 on day four. Thank you. Tooling for both shells is
      already cut from the same mould family, scaled down for the inner case, so
      production of the pair starts together.
  - title: Signal orange unlocked
    published: -10d
    body: |-
      Passing €40,000 unlocked a third shell colour. Signal orange is now
      available on the Backup Suitcase Reward, for both the outer and inner
      case. An existing Pledge can switch colour until the Campaign ends.

      The next stretch goal is a zip divider inside the inner case, sized for
      one pair of shoes.
  - title: Shoe divider unlocked
    published: -4d
    body: |-
      Passing €50,000 unlocked the zip divider. It ships sewn into every inner
      case, sole down, from the first production run. No colour or size choice
      is needed; it fits the one case it was measured for.
