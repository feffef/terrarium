campaign: solo-pea-rest
updates:
  - title: A note on pea sizes
    published: -45d
    body: |-
      Several Backers have asked whether frozen peas fit. They do. A frozen pea is
      slightly smaller than a fresh one and seats a little lower in the dimple.
      This has been tested and is acceptable.
  - title: The Campaign has ended
    published: -27d
    body: |-
      The Solo Pea Rest reached 18% of its goal. It will not be made this time,
      and nobody will be charged.

      Thank you to the 151 Backers who saw what we saw. The moulds are in storage.
