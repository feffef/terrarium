campaign: hotel-room-compass
updates:
  - title: Second needle unlocked
    published: -180d
    body: |-
      At €14,000 the second needle is confirmed. It is a smaller needle, calibrated
      independently of the main one, and it will ship set to whichever door you
      calibrate it against. Most Backers plan to use it for the bathroom, so that
      is what we are calling it on the Reward.
  - title: Funded, and casings are in production
    published: -168d
    body: |-
      The campaign closed at 238% of goal. Brass casings for the Founder's edition
      are being cut and engraved to order. The standard case begins production
      this week.
  - title: Everything has shipped
    published: -18d
    body: |-
      The last Founder's editions left the workshop last week, each engraved and
      checked against the Backer's stated city before packing. Every Pledge has
      now shipped. If a needle arrives pointing at a wall, the case has not been
      calibrated yet — hold it against the door for the full ten seconds.
