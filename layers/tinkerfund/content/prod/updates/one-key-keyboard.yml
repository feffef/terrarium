campaign: one-key-keyboard
updates:
  - title: The Early Bird is gone
    published: -27d
    body: |-
      All forty Early Bird keyboards were claimed in the first morning. The
      regular Reward is the same keyboard with the same key, and a choice of
      switch.
  - title: Switch testing is complete
    published: -12d
    body: |-
      Both switches passed 80 million presses on the test rig. The tactile switch
      has a small bump at the actuation point. The linear one does not. Both press
      Enter.
  - title: The final days
    published: -1d
    body: |-
      We are at 92% with two and a half days to go. If you have been meaning to back
      the One-Key Keyboard, this is the moment. If you already have, a second
      keyboard makes a considerate gift.
