campaign: occupied-sign-for-litter-boxes
updates:
  - title: Multilingual edition unlocked
    published: -134d
    body: |-
      Funding passed the level needed to add the multilingual panel as a second
      edition alongside English. It cycles OCCUPIED and VACANT through six
      languages on its own timer, unrelated to the cat.
  - title: Panels shipping
    published: -102d
    body: |-
      The first batch of hoods has passed inspection and is now going out,
      English editions first, multilingual close behind. Clip and adhesive
      fittings are packed together so the choice can still be made on arrival.
  - title: All Pledges shipped
    published: -80d
    body: |-
      The last multilingual panels left the workshop this week. Every Pledge
      has now shipped. If a sign has not arrived, or a cat has not yet
      acknowledged it, reply here.
