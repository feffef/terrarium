campaign: meal-invites-for-cats
updates:
  - title: Funded on day nine
    published: -6d
    body: |-
      We reached the goal nine days in. Thank you. The first stretch goal, a
      second reminder five minutes before the meal, is next.
  - title: The second reminder is unlocked
    published: -3d
    body: |-
      Passing €17,000 unlocked a second reminder, five minutes before the meal, on
      top of the fifteen-minute one. Existing Pledges receive it automatically;
      nothing to change.

      The next stretch goal gives each cat on a shared feeder its own calendar.
      The prototype household has two cats and one feeder, which is the problem
      this solves.
  - title: On the prototype cat
    published: -1d
    body: |-
      Several backers have asked about the prototype cat's zero acceptances over
      412 meals. We have reviewed the invitation copy and found nothing wrong
      with it. The feeder continues to dispense on schedule either way.
