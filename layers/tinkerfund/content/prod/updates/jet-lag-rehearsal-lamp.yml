campaign: jet-lag-rehearsal-lamp
updates:
  - title: Funded in four days
    published: -24d
    body: |-
      We passed €24,000 on day four. Thank you. The steel bases are being
      turned by the workshop in Valencia that repaired the tower clock the
      lamp was first built for.

      The next stretch goal, at €30,000, adds a second shade colour.
  - title: Slate unlocked
    published: -15d
    body: |-
      Passing €30,000 unlocked a slate shade. It is available now on the
      Early-bird and standard lamp Rewards. An existing Pledge can switch shade
      until the Campaign ends.
  - title: Fourteen nights
    published: -6d
    body: |-
      Passing €36,000 extended the rehearsal to 14 nights. Journeys across
      more than seven time zones can now be rehearsed in full, one hour a
      night, instead of being rounded to seven.

      The Campaign ends in eight days. The last stretch goal, at €45,000, is
      a padded case for the lamp.
