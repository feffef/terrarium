campaign: pausable-hourglass
updates:
  - title: The first week
    published: -41d
    body: |-
      The first week closed at 41% of the goal. The 10-minute glass is the
      most chosen duration, and walnut leads oak by about two to one.

      Several Backers asked how long a glass can stay paused. The test glass
      is still closed, now at 1,400 hours, and still has not passed a grain.
  - title: On the 60-minute glass
    published: -27d
    body: |-
      The 60-minute stretch goal needs a second blowing mould and a frame 38
      cm tall. Trials show the valve holds the larger column of sand as well
      as the small one. It will be offered only if the Campaign passes
      €20,000.
  - title: The Campaign has ended
    published: -17d
    body: |-
      The Pausable Hourglass closed at 94% of its goal, short of what the
      first glass run needed.

      192 Backers pledged €15,040. Nobody has been charged. The moulds are
      kept, and the Campaign may return with a smaller first run.
