campaign: counterclockwise-mug
updates:
  - title: Funded in nineteen hours
    published: -11d
    body: |-
      We reached the goal on the first day. Thank you. The first stretch goal, a
      saucer that also turns, is next. The saucer turns counterclockwise, to match.
  - title: Porcelain white is unlocked
    published: -4d
    body: |-
      Passing €24,000 unlocked a third colour. Porcelain white is now available on
      the One mug and Two mugs Rewards; you can switch an existing Pledge to it
      until the Campaign ends.

      The next stretch goal is a matching teaspoon. It does not stir. It is for
      ceremonial use.
