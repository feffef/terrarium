campaign: goldfish-quarterly-review
updates:
  - title: Funded on day six
    published: -14d
    body: |-
      We reached the goal six days in. Thank you. The annual summary stretch
      goal, comparing all four quarters on one page, is next.
  - title: The annual summary is unlocked
    published: -10d
    body: |-
      Passing €15,000 unlocked the annual summary, a single page comparing all
      four quarters once a year has completed. Existing Pledges receive it
      automatically; nothing to change.
  - title: On the prototype fish's second quarter
    published: -3d
    body: |-
      Several backers have asked about the prototype fish closing its second
      quarter at 94% of its lap objective. We have reviewed the objective and
      left it unchanged, so the trend line stays comparable across quarters.
