campaign: pocket-sundial-with-snooze
updates:
  - title: A short delay with the brass
    published: -80d
    body: |-
      The first batch of brass cases came back from the foundry a little too thick,
      and the covers did not close fully. A snooze that lets the sun through is not
      a snooze. The cases are being re-cut, which moves shipping back by about four
      weeks.
  - title: Cases pass inspection
    published: -58d
    body: |-
      The re-cut cases close cleanly. Each sundial is now being set and checked by
      hand at its Backer’s latitude, which is slower than we planned but produces
      sundials that are correct.
  - title: Everything has shipped
    published: -21d
    body: |-
      The last Founder’s editions left the workshop this week. Every Pledge has
      now shipped. If yours has not arrived within two weeks, reply here and we
      will look into it, after nine minutes.
