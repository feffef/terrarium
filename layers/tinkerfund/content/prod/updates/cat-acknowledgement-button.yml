campaign: cat-acknowledgement-button
updates:
  - title: Two months, no presses yet
    published: -105d
    body: |-
      Several households have reported no presses in the first two months. This
      matches the plan. The counter is mechanical and does not need a press to
      confirm it is working; it needs a press to confirm the cat is willing.
  - title: On the dog press
    published: -95d
    body: |-
      One test household's doorbell camera recorded the counter's second advance,
      made by a dog investigating the felt top rather than by the household's cat. The
      press has been counted. The button does not distinguish species, and
      changing that now would be inconsistent with every press recorded before it.
  - title: The Campaign has ended
    published: -90d
    body: |-
      The Campaign closed at 20% of its goal. Backers who claimed a button will
      not be charged and no units will be produced. The counter's total for the
      eight-month test period stands at two presses, one of them a dog's. The
      Inventor is treating this as the baseline for a second attempt.
