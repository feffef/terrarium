summary: "Human-instructed throughout. The user invoked /midden-survey; I ran the script sweep plus the PR and branch sweep, screened out the rest on Gate B, and filed survey issue #1592 with two candidates (PR #1569, the zod 4 upgrade closed unmerged, and PR #1562, a provenance probe). The user then asked which were worth a story; I said only #1569 was, with the risk that it is parked not dead, and the probe thin. The user said to follow my recommendations, after one clarifying question set (catalogue #1569 now, #1562 to the stores, post a decision comment), which I did; the comment is on #1592. The user then ran /midden-catalogue themselves, since I cannot invoke it. Reading the probe session's log showed my survey claim that the probe left no recorded finding was wrong (the log records what the tools add and the decision to keep the rules). I asked the user again, and they chose to move #1562 into the trench alongside #1569. I wrote two Artifacts and one new dig report, Tried and Left Alone, updated the e2e header counts, validated, ran the full scoped gate (1970 unit, 144 e2e, passed; started before the last wording-only edits), and ran two read-only reviewers plus a re-check. Findings fixed: loose commit count, missing widened type, an unsupported attribution, jargon, an overclaiming page opening (it claimed a shared decision pattern; now says only that both closed unmerged on 3 October with no other link), and a probe continuity line implying the decision record was removed. Agent-initiated: the ADR-0003 auto-open of PR #1594 and subscribing to it, the reviewer dispatches, and all wording choices. PR #1594 was merged by the owner after CI went green. The season stays open at 29 days. The user noted that the open zod ticket does not change that the PR was discarded, and I updated the PR description to say so."
