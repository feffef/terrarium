frictions:
  - description: My survey said the probe PR left no recorded finding, but its session log recorded one; I had not read the session logs at survey time, so placement had to be reopened with the user after they had decided.
    solution: midden-survey step 3 should say to read the session log of each PR candidate before judging significance or suggesting a placement.
    severity: moderate
  - description: The Skill tool refused midden-catalogue (disable-model-invocation) even after the user green-lit it in words, so the user had to retype it as a slash command.
    solution: midden-survey's closing line should tell the user to run /midden-catalogue and note the model cannot, so an approval in chat is not mistaken for a start.
    severity: minor
  - description: The probe session's log says its removal was reverted and the branch left net-zero, but the remote branch still carries the removal (13 files, 1422 deletions); the log contradicts the primary source.
    solution: midden-catalogue step 2 already says primary sources win; a reminder that session logs can be wrong about git state would help.
    severity: minor
  - description: Agent calls with run_in_background false were denied twice by the background-flag guard; I passed it out of habit.
    solution: None needed beyond the guard; omit the flag.
    severity: nit
  - description: The session worker restarted mid-run, after the survey but before cataloguing; I had to re-establish state from git and the session logs.
    solution: None for the repo; the committed branch state and survey issue made recovery cheap.
    severity: nit
