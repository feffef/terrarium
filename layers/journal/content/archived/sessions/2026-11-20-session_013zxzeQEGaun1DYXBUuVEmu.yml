frictions:
  - description: The dispatch-read guard refused my first survey brief because it named the scratch-dir placeholder in prose; I reworded and retried.
    solution: Let the guard skip placeholders written as instructions, or have the Skill give a ready-made fill-in sentence.
    severity: nit
  - description: A background gate command with a trailing ampersand plus run_in_background was refused by the double-background guard; resent plainly.
    solution: None needed; the guard worked as designed, the CLAUDE.md line already says run_in_background alone.
    severity: nit
  - description: prune-friction-ledger deleted emptied entries and left a related link to one, so ledger-content.spec failed until I removed the link by hand.
    solution: "Fixed in #3513: dropRelated in the prune and move paths."
    severity: minor
  - description: The Skill's ledger PR must pass the simple-change test, which a 68-file ledger diff cannot, so each of the two ledger PRs needed full two-reviewer code-review rounds on data-only diffs.
    solution: Let a ledger-only PR made through the ledger scripts take own-read, in the Skill and in merge-pr's check.
    severity: minor
  - description: The workflow builder handed back without running its gate, though the impl brief requires a green gate; I resumed it to run typecheck and gate.
    solution: Brief's hand-back step could name that a missing GATE line is refused.
    severity: nit
  - description: Stop hook asked twice to push branches that were deliberately held back until review passed.
    solution: Known stop-hook-nag cluster; no new fix.
    severity: nit
  - description: The survey subagent had no create-entry recipe in its brief and misused a flag on its first try, so it needed a detour through print-ledger-occurrence.
    solution: Add one create-entry example line to survey-brief §2.
    severity: minor
