frictions:
  - description: The harness pins one session branch (claude/visitor-loop-tj0sub), but the visitor-loop Skill names two per-PR branches (…-fixes-<date>, …-feature-<date>). The two instructions conflict.
    solution: Used the pinned branch for the fix PR, then restarted it from origin/main after the merge for the feature PR. The Skill could say 'reuse your session branch, restarted after the fix PR merges' instead of naming branches.
    severity: minor
  - description: I invoked close-session only after both PRs merged, not at the first PR-open as CLAUDE.md asks. I deferred it to avoid logging twice during a multi-PR run.
    solution: Invoke at the first PR-open next time; re-logging is cheap and self-heals.
    severity: minor
  - description: "An ad-hoc Playwright probe in the scratchpad failed twice: a .ts file rejects top-level await (cjs transform), and a bare 'playwright-core' import doesn't resolve outside the repo tree."
    solution: Name it .mts and import playwright-core by absolute node_modules path. scripts/screenshot.ts or a repo-local probe helper that takes a script would avoid this.
    severity: minor
  - description: The first commit hand-wrote the Co-Authored-By/Claude-Session trailer because a system-reminder told me to; the commit-trailer guard denied it. One command was also blocked by the tail-pipe guard.
    solution: Both guards worked as designed; I retried without the trailer and with a log redirect.
    severity: nit
  - description: My first feature build put the random-specimen link below the wing directory (below the fold, muted, failing AA contrast), and its e2e test would pass even if the click handler never ran. /code-review caught all of it.
    solution: Before building, check that a 'make X easier to find' feature lands above the fold. Test that the behaviour changed, not just that the page loads.
    severity: minor
