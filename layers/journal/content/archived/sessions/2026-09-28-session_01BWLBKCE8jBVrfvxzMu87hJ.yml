learnings:
  - "Before trusting a visitor's claim that a page doesn't explain itself, render it: one of the three visitors missed a Midden foreword that sits above the fold."
ideas:
  - "Midden find titles show raw Markdown backticks (e.g. 'the `sync` / `consolidate` / `codify` job-names'): render artifact titles through an inline-code formatter in the artifact component and the homepage teaser."
  - "The Journal intro stacks five text blocks before the first digest and repeats the landing's 'altitude' framing: trim its body to one sentence plus the Skills link."
  - "Journal digest rows at 390px squeeze the summary to ~160px and set the expanded heading in bold: stack the date above the summary under 480px and use normal weight."
  - "Journal stat tiles ('IDEAS NOTED 21 / 37 learnings', '1 delegated · 48 autonomous') are opaque to outsiders: add a one-line plain caption per tile and a 3+2 layout under 480px."
  - "The Tinkerfund backup-suitcase FIG. 5 diagram's dimension labels read as a bare number list to text readers: give the SVG a title/desc and aria-hide the raw label text."
  - "Tinkerfund countdowns read robotically ('18 days 0 hours', '0 days 20 hours') and the campaign end time drifts with 'now': show 'N days left' / 'N hours left' and anchor end times to a fixed build date."
  - "Tinkerfund 'Back this Campaign' only scrolls to #rewards: relabel it 'Choose a reward ↓'."
  - "The Tinkerfund 'Popular now' IDs wrap as 'TF-' / '0001', and 'Ending soon' leaves a gap in a 3-column row: set white-space: nowrap on the ID column and let the cards stretch."
  - "The Blogger Network panel puts four persona cards in a 3-column grid, orphaning Eyra: use a 2×2 or 4×1 grid."
  - "The Midden dig-report 'Elsewhere:' footer sits flush left, off the content column: wrap it in the page's max-width container."
  - "The Atlas canopy rarity dots look identical for all five species: vary rarity in the data or explain the scale beside the dots."
  - "The Atlas landing has no pictures: show one small plate thumbnail per wing card on /t/atlas."
  - "The Mycora relations diagram at 390px opens with the focal node clipped at the right edge: scroll it to the focal node on mount at narrow widths."
  - "The homepage never links the source repo or its owner: add a one-line 'Source on GitHub' link to SiteFooter so the 'built in the open' claim can be checked from the front door."
  - "Returning visitors can't see what changed ('since your last visit', raised by two visitors): mark digests and posts newer than a per-browser last-visit timestamp with a 'new' dot on the Journal and Blog lists."
  - "Newcomers stumble on recurring jargon (Tenant, Space, friction, session): add a small shared <Term> tooltip component that glosses these words on first use in the Journal and Midden."
  - "Make the 'agents did it in the open' claim concrete: add a 'watch one session' page that walks through one real session log (prompt → plan → gate → PR → log), linked from the Journal's New-here cards."
