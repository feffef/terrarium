frictions:
  - description: Backgrounded `pnpm gate:scoped` with a shell `&` in one Bash call, then tried `wait <pid>` in a later Bash call — each Bash call is a fresh shell, so it can't wait on another shell's child and the wait returned instantly with nothing to show for it.
    solution: "Use the Bash tool's own `run_in_background: true` (tailing the log with `--pid=<pid>` to end on process exit) for anything needing a completion notification, never a shell `&` plus a later `wait` in a separate call."
