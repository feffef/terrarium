summary: "The owner invoked grill-with-docs on an idea from session_01Wd2WvrPmFRYHAZmf7DYnrG: a cause-of-death tag on each Midden find with filter chips on the Trench. Two grilling rounds settled the shape with the owner (human-instructed): build it in a PR; drop \"superseded\" (it fails Gate B) and \"never used\" (Condition's never-activated covers it); one required, curator-authored cause per Artifact in both Spaces; chips filter Sites; backfill everything now. I proposed the cause set from reading every catalogNote (agent-initiated proposal, owner-approved), and the owner later approved a seventh cause, never-worked, after a spec review showed three finds fit none. I built the schema enum, a single-homed utils/cause.ts, the glossary term, the backfill of 52 Artifacts, link-based ?cause= chips (server-rendered, so they filter without JS too, a deliberate deviation I reported), the cause word on finds and stores cards, a Skill line, and unit and e2e tests. A two-axis code review caught unprefixed auto-import names and five outlived-its-need finds that contradicted their definition; I also found a prototype-key bug in my own query parse. Verified in Chromium (filter, clear, dark mode). Full gate green on the head."
