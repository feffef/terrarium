frictions:
  - description: "Filed the first batch of 6 GitHub issues with a fabricated Claude-Session footer — copied a session id from the survey subagent's returned report instead of resolving this session's own ground truth. github-footer-guard.ts (issue #628) blocked all 6 calls before anything posted, so nothing bad landed, but all 6 issues would have carried a wrong footer at once had the guard not existed."
    solution: Resolve this session's own id fresh from the system-prompt commit-footer template at the moment of writing it, every time — never reuse an id seen elsewhere in context (a subagent's report, another issue's text), even under batch-authoring time pressure with many near-identical calls in flight.
    severity: major
  - description: Called TaskCreate with a JSON array under the `content` parameter (the tool actually takes one subject/description per call) without loading its schema via ToolSearch first, producing one malformed task and several "Task not found" errors on later TaskUpdate calls — the exact deferred-tool-guard failure mode CLAUDE.md names TaskCreate as an example of, hit anyway this same session.
    solution: ToolSearch a deferred tool's schema before its very first call, with no exception for a tool whose name looks self-evident.
    severity: moderate
  - description: Misused ScheduleWakeup (built for /loop dynamic-pacing) to schedule a fallback wakeup while waiting on a background survey subagent during this scheduled-Routine run, then had to immediately call it again with stop:true to cancel.
    solution: Background Agent-tool completions already deliver a task-notification automatically; no ScheduleWakeup is needed to wait on one outside of /loop's own dynamic-pacing mode.
    severity: nit
  - description: Didn't invoke close-session at each PR's open (in-review), as the Skill prescribes — invoked it once at the very end after all three PRs had already merged. No practical cost this run (all three merged within the same session with no real waiting), but it deviates from the prescribed per-PR-open sequencing.
    solution: Invoke close-session immediately once a dispatched PR opens, even when a merge is expected to follow quickly, rather than batching the log to the very end of the run.
    severity: minor
