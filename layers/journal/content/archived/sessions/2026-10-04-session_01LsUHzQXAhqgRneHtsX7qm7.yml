frictions:
  - description: Edit tool failed twice on an em-dash/line-wrap mismatch between what Read displayed and the file's actual bytes, when appending to existing Inventory .yml files
    solution: Use a shorter, boundary-safe anchor (the last line, via cat -A to check exact bytes) rather than copying multi-line Read output verbatim when the text contains non-ASCII punctuation
    severity: nit
  - description: gate:scoped failed once because the new wizard.yml Inventory entry (an external pack Skill) lacked its required installedSha256 pin — I didn't know this field existed until verify:skills-lock's error named it
    solution: When adding an Inventory entry for an external/pack Skill, check an existing external entry's schema (installedSha256) before writing a new one, or just run verify:skills-lock --write proactively
    severity: minor
  - description: The Skill's step-2 instructions direct one subagent per behaviourChecks Skill (12), but the dispatch-subagents brief alone listed ~78 windowSessionsNotUsing sessions to screen for missed invocations — a large, token-heavy single dispatch
    solution: Consider letting a modelInvoked Skill's missed-invocation half pre-filter by goal keyword before handing the subagent the list, to shrink the brief for high-base-rate Skills like dispatch-subagents
    severity: nit
