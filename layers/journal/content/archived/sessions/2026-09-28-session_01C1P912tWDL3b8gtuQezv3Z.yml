  - description: "Spec issue #1375 had no convention for an active (non-held) spec: unlabeled specs resurface every sweep, labeling contradicts issue-tracker.md Specs"
    solution: "Settle active-spec labeling in docs/agents/issue-tracker.md, or have auto-triage skip issues titled Spec:"
    severity: minor
  - description: "#1451 subagent posted its comment without the harness footer and edited it in place; #1451 also skipped the open-duplicate search"
    solution: Brief subagents with a pasteable full comment skeleton and an explicit duplicate-search step
    severity: nit
  - description: "SHELL-READ-DETECTION false positive: command `cd /home/user/terrarium/.claude/skills/triage && cat SKILL.md AGENT-BRIEF.md; cat /home/user/terrarium/docs/agents/triage-labels.md` (subagent Triage issue #1455) credited nonexistent path .claude/skills/triage/docs/agents/triage-labels.md; expected docs/agents/triage-labels.md"
    solution: Shell-read detector should not rebase an absolute path onto the preceding cd directory
    severity: moderate
  - description: "Grilling question numbering drifted: user's '9 a' answered Q10's option, costing a clarification round-trip"
    solution: "Give every question in a round letter options, or ask the user to answer as 'Qn: choice'"
    severity: nit
  - description: Native-dependency POST via curl failed first with no Content-Type header; the proxy demands application/json
    solution: Note the Content-Type requirement next to issue-tracker.md's Blocking recipe or in github-integration.md's gh-less fallback
    severity: nit
  - description: Every impl agent hit the worktree-isolation guard refusing chained git commands or heredocs; each rediscovered splitting them
    solution: Say in dispatch-subagents' brief checklist to issue git commands one per Bash call in worktrees, or have the guard's deny message say so
    severity: minor
  - description: check:worktrees flags every local-only impl branch as unpushed even when already merged into the pushed orchestrator branch
    solution: Have check-worktrees treat a branch contained in any pushed ref as rescued
    severity: minor
  - description: "My filter for the latest Agent Brief dropped #1446 because its body mentioned ready-for-human in its opening; caught by a (none found) count"
    solution: Select the last Agent Brief comment by position, not by body text
    severity: nit
