    solution: Redirect to a file first; never chain commit and gate in one backgrounded line.
    severity: nit
  - description: First Copy code version put aria-live on the button itself and left every button named just Copy code; the standards review caught it, and my e2e locator broke when the label changed.
    solution: Use a separate role=status span and a per-Deal accessible name from the start; hold locators by something that survives the state change.
    severity: minor
