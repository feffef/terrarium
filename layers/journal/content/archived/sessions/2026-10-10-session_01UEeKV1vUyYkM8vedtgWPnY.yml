  - description: Read only the head of tenant-layers.md, github-integration.md and CONTEXT.md, skipped verifying-ui-changes.md and the ADR grep for touched files, though CLAUDE.md says read in full.
    solution: A scheduled run should read the triggered docs in full before editing; the Skill could list the required reads in step 4.
