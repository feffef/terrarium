outcome: "PR #2673 merged by the owner: prune-trial verdicts now file an issue for moderate damage or a rising Friction rate"
summary: "The owner asked me to read issue #2672 and propose a change to the prune-trial Skill. I asked four questions first. The owner chose: a branch and PR after a subagent's design review; Friction Ledger entries picked at verdict time; no fixed threshold (the script shows rates and the session judges); scope covers the SKILL.md, a rates script, and ADR-0027 with its summary rule. All of that was human-instructed. The details below were my calls or came from the subagents' reviews. The design review found that my first window design was wrong. Its after-window ended at the last ledger commit, but non-survey PRs also edit the ledger, so unsurveyed sessions would have counted as misses. Its equal-length before-window was noisy and could reach past the 14-day ledger horizon. Both windows now count only what the ledger can see. The review also flagged that §3's hook issue would double up with the new issue. code-review then found that a non-survey ledger merge could still move the cutoff past a survey whose PR hadn't merged. The cutoff now comes from the newest survey whose own PR merged a ledger change. Rerunning the script on the #2537 trial gives relayed-subagent-claims 11/182 (6.0%) before and 8/52 (15.4%) after, so it would have flagged the verdict #2641 passed. The gate was green; the owner merged it, as required for Human-only ADR files."
