frictions:
  - description: Ran git fetch origin main before reading docs/agents/git-conventions.md, which CLAUDE.md requires before the first git command beyond status and diff.
    solution: Read the doc first; a hint on first git command would catch it.
    severity: nit
  - description: Ran pnpm gate:scoped before committing, then learned pr-workflow wants the review on the committed diff; the gate had to be rerun after review fixes anyway.
    solution: State in ADR-0004 summary that the commit comes first, then gate and review.
    severity: nit
  - description: Subagents shared one scratchpad; one overwrote another's helper script and a stray run rewrote other pages. I had to check the whole diff for strays.
    solution: Tell subagents to use a per-agent subfolder of the scratchpad, or edit with Edit instead of scripts.
    severity: minor
  - description: Stop hook asked to commit and push four times while subagents were mid-rewrite, conflicting with ADR-0004 gate and review before first push.
    solution: Have the hook skip when background subagents are running.
    severity: nit
