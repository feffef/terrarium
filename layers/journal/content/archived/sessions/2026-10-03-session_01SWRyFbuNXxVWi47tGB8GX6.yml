outcome: Output-matching derivation of docsReadViaShell implemented and merged (PR 1553), after the research note (PR 1546)
summary: "The user asked for a scan of all SHELL-READ-DETECTION frictions and an honest answer to whether the shell-read detector can be fixed shape by shape or whether parsing commands is a dead end. I extracted all 39 frictions from 42 session logs, grouped them into about ten command shapes, and checked each against the live code and the GitHub issues: most are fixed, three are open (issues 1482 and 1542 plus an unfiled empty-output cat false positive), and two findings were new. First, the committed docsReadViaShell comes from extractTrace, which gets neither the glob resolver nor the cd handling the --author advisory has, so the fixes for issues 1246 and 1454 never reached the Journal. Second, the cd fix runs after the instruction-doc shape test, so a bare relative filename after cd is dropped before the prefix is applied. I offered three directions and the user chose to prototype the alternative: index each instruction doc's distinctive lines and credit a doc when they appear in a Bash tool_result, independent of the command. The prototype replayed one verbatim command per friction shape plus ten decoys and scored the landed scan, the advisory scan, and the matcher. The matcher with a path-prefix signal passed 39 of 40, the advisory 33, the landed scan 24, and no decoy credited any doc. A live check over this session's own transcript agreed. The residual miss is a read from git history whose lines no longer exist in the checkout. Human-instructed: the scan, the assessment, and the choice to prototype. Agent-initiated: committing the prototype then reverting it so the note can cite the commit (ADR-0026's precedent), the research note, issue 1545 proposing adoption, and the PR, which the repo's rules open automatically. The implementation itself is net-new and waits on a human green-light. The user then asked for a two-axis code review of the branch; it found claims in the note the committed prototype could not reproduce (a stale table row, an off-by-one case count, a wrong failure cell) and a missing friction-to-case mapping. On the user's instruction those fixes went out as one further commit, CI went green on it, and the owner merged the PR. The owner then green-lit issue 1545 with /implement. Two decisions were put to them first: the index reads the working tree at derivation time (not a pinned start commit), and the four test seams. Built red-to-green at those seams: a pure matcher in shell-reads.ts, an injected index through extractTrace and foldSubagentTrace, an advisory that credits from the matcher and explains from the parser, and a loader smoke test. A second two-axis review on that commit found real defects (parser near-miss noise on credited commands, a missed grep context prefix, a lint-shaped line fooling the path-prefix signal, the advisory indexing from cwd instead of the repo root) and standards debt (a stale header, the rationale restated at three sites, the 30-char limit copied into the ADR and the Skill, an ADR misquote); all applied in one fix commit. The full gate passed on both commits; PR 1553 opened, human-only to merge. The user then asked for a second two-axis review with Sonnet. Its Spec replay found a false-positive class my corpus had no decoy for: uniqueness was checked only against the docs and two sinks, so a code line a doc quotes credited the doc when an agent read that code (57 of 1862 tracked non-doc files). Fixed in a third commit by making every non-doc file in the checkout a sink, plus the smaller findings (CLI root, Skill wording, ADR pointer to LINE_PREFIXES, a fixture that inferred output from command text). Full gate green on each of the three commits; the owner merged PR 1553."
