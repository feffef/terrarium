frictions:
  - description: Called `mcp__github__issue_write` three times wrapping title/body/labels in a nonexistent top-level `fields` object, guessed from a similarly-shaped tool, instead of loading its real schema via ToolSearch first — all three failed the same ADR-0017 guard check (no valid `body` ever reached it). Only checked the real schema after the third failure.
    solution: ToolSearch a specific deferred tool before its first call every time, even when a same-family tool (issue_read) was already loaded this session — CLAUDE.md already states this rule explicitly.
    severity: moderate
  - description: Called ScheduleWakeup to wait on 10 parallel dispatched subagents; blocked immediately by the /loop-only guard, since subagents self-notify on completion and this wasn't a /loop session.
    solution: End the turn instead of scheduling a wakeup when waiting on dispatched Agent-tool subagents.
    severity: nit
  - description: "Combined `run_in_background: true` with a shell-level `nohup ... &` when starting the gate run; blocked by the double-background guard."
    solution: Use run_in_background alone with a plain foreground command, never both.
    severity: nit
