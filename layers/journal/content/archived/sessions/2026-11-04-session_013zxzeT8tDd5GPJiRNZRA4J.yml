goal: "Improve the Glass Box guide: one glassbox-improve run"
status: completed
outcome: "Run merged in one PR: 12 false claims fixed, 30 edits merged, 8 structural steps taken."
summary: "The one human prompt was the kickoff, the `/glassbox-improve` Skill; everything else (which items and steps to skip or take, the churn filters, filing issue #2848, opening PR #2847) was agent-initiated within that Skill's Remit and ADR-0003's PR rule, with no further human approval. The run read all 66 guide pages with 11 raters (A, B and nine claim-check shards), tallied 72 items and 22 steps, and had 17 researchers confirm them. I filtered 9 items and 3 steps as undoing recent runs or already subsumed, and the researchers refused the step to fold Invariant tests into Testing, which an earlier run had already dropped. 16 opus writers in worktrees then fixed 48 items and took 8 steps (fold of Out-of-scope records into Work queue; three moves of duplicated reasoning to one home; a new Session transcripts Lesson; two drafts promoted; the Routines draft cut). All 30 gated pages beat their old versions with blind judges (a pass rate that deserves suspicion), and Blocking hooks won Reasoning against CLAUDE.md and Path-specific rules. Code-review found one real defect (the Layers excerpt), fixed in one round. Surprises: the tally re-raised steps grades.yml already held as dropped, crashed on a step without a gist, and the lesson-step writer brief never said to write the Lesson, so I resumed that writer. A reviewer subagent silently detached the primary checkout, so my fix-round merges and the record commits sat on a detached HEAD and the PR branch stayed stale until check:worktrees flagged it; I fast-forwarded the branch and pushed. CI's gate went green on the final head (the first green signals named the stale head, which I did not trust); I posted the verdict and merge-pr.ts merged PR 2847 as 5839152 after checking that main had moved by one session log only. Still open for a person: three proposed DECISIONS.md lines, and issue #2848 for the Skill's script problems."
prs:
