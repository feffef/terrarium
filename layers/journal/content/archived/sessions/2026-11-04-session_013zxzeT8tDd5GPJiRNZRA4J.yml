gitBranch: claude/quirky-turing-fjidl1
entrypoint: remote
cliVersion: 2.1.318
learnings:
  - "git push origin <branch> pushes the local branch ref, not HEAD: on a detached HEAD it silently publishes an old ref and shows no error."
  - A subagent's git checkout in the primary checkout moves the whole session's HEAD; git symbolic-ref HEAD tells at once.
ideas:
  - "Make the blind gate harder to pass: 30 of 30 wins this run and the first v3 review (issue 2792) will ask if judges rubber-stamp. Add a control (the old page with only the false claim fixed) and a second judge on every deficit edit, so a pass means the extra material earned it."
  - "Add DECISIONS.md lines for the three steps dropped as undoing recent work: Prose overrides stays its own Lesson, the timestamp refinement stays on Content validation, and the resolver's testability stays on Multi-tenant isolation."
  - "Promote the draft A newcomer's first hour next run: rater B graded it B on Placement and Relevance, and its only promotion blockers are a stale pin, a 150-character description and a missing publishedAt."
  - Let grades.ts briefs detect a page two writers will edit (a step writer's trim of a page that a Subject writer owns) and give both to one writer, so the merge needs no hand-resolved conflicts.
landedBy: Stop
