frictions:
  - description: A read-only code-review subagent ran git checkout --detach HEAD in the shared checkout; my later merges and record commits landed on a detached HEAD while pushes updated only the stale branch.
    solution: "Brief read-only agents to run no checkout, switch or reset in the shared tree; run git status -sb before each push (git-conventions: check the step landed)."
    severity: moderate
  - description: "Skipped dispatch-subagents section 4: sixteen writers edited overlapping pages in parallel, giving four merge conflicts (04.hooks, a promoted Walkthrough, the Routines draft, Path-specific rules) I resolved by hand."
    solution: Have grades.ts briefs merge writers that touch the same page (a step's trims versus a Subject writer's items) or serialize them.
    severity: minor
  - description: The lesson-step writer brief names the new Lesson in its task line but lists only old-page items, so the writer fixed those and never wrote the Lesson; I had to resume it.
    solution: For a lesson step, put 'write this new page' and its path first in the brief (filed in issue 2848).
    severity: moderate
  - description: grades.ts tally listed two steps as pending that grades.yml already held as dropped, and a cut step without a gist crashed its summary with a TypeError.
    solution: Print a step's earlier decision beside any re-raise, and require a gist in reportProblems (filed in issue 2848).
    severity: minor
  - description: Rater B graded four draft pages the plan never listed, so tally refused the report; I deleted those lines from the saved hand-back to get it through.
    solution: Let tally accept draft pages from rater B, or tell rater B not to grade drafts.
    severity: nit
  - description: Did not create per-agent scratchpad subfolders first (dispatch-subagents section 3); several writers dropped logs flat in improve/, two of them both called install.log.
    solution: Have the writer brief generator create the named subfolder before the agent starts.
    severity: nit
  - description: Gate, rater and researcher briefs asked for per-doc verdicts and sourced counts but my 38 judge prompts did not (CLAUDE.md subagent-brief rule), so the judges report no rule verdicts.
    solution: Add the verdict and source-your-counts lines to the judge wrapper prompt, or to the judge brief template.
    severity: nit
  - description: The system prompt bars model names in commits while the attribution reminder requires a Co-Authored-By model line; two writers amended the hook's line to a different model.
    solution: One instruction should settle whether the trailer names a model, and the commit-msg hook should own it.
    severity: nit
  - description: Pushed the run branch only when the Stop hook reported 35 unpushed commits, not early and often as ADR-0003 asks.
    solution: Push the run branch right after step 1's branch cut and after each merge round.
    severity: nit
  - description: Docs hosts (nuxt.com, vuejs.org, docs.github.com, content.nuxt.com) returned 403 through the proxy, so a dozen raters, researchers and writers each rebuilt a raw GitHub fallback.
    solution: Name the raw.githubusercontent.com source paths in the rater, researcher and writer briefs, or allow the docs hosts.
    severity: minor
  - description: About a hundred long subagent hand-backs arrived in my context, each re-read to decide the next step; the skill saves them to files but still wants me to read them.
    solution: Have each hand-back end in a short machine-readable verdict block and give the lead only that, with the full text read from the saved file when needed.
    severity: minor
  - description: "SHELL-READ-DETECTION: .agents/skills/glassbox-improve/researcher-brief.md was credited from shell output, but the session marked it (not read)"
    solution: Check the transcript for which command (or subagent) read it; only if none did, tighten scripts/session/shell-reads.ts
    severity: moderate
  - description: "SHELL-READ-DETECTION: .agents/skills/glassbox-improve/writer-brief.md was credited from shell output, but the session marked it (not read)"
    solution: Check the transcript for which command (or subagent) read it; only if none did, tighten scripts/session/shell-reads.ts
    severity: moderate
