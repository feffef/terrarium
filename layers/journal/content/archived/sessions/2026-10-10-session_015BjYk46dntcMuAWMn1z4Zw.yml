frictions:
  - description: Skipped CLAUDE.md's session-start reads of CONTEXT-MAP.md and CONTEXT.md in the main session; only the subagents read CONTEXT.md.
    solution: Read both before the first answer. A SessionStart rule without paths that names them would make it automatic.
    severity: minor
  - description: Read the ADRs with a Bash `cat` loop, against CLAUDE.md's 'Read files with the Read tool'; the output overflowed to files I then had to Read anyway.
    solution: Use the Read tool per file, or allow_large on a concatenated file, from the start.
    severity: nit
  - description: Ran `git rev-parse` and `git rev-list --count` to judge history depth before reading git-conventions.md, as CLAUDE.md requires for git log-style conclusions.
    solution: Read git-conventions.md before any git command beyond status and diff, including depth checks.
    severity: nit
  - description: Ran `pnpm gate:scoped` in the foreground despite CLAUDE.md's rule to background commands that can take over 2 minutes.
    solution: Start the gate with run_in_background and redirect it to a log; it took about 3 minutes.
    severity: minor
  - description: Headless `claude -p` test runs inherited CLAUDE_CODE_SESSION_ID and wrote their tool calls into this session's transcript, so the trace shows a scratch file and tests that weren't this session's work.
    solution: Run headless probes with `env -u CLAUDE_CODE_SESSION_ID -u CLAUDE_CODE_REMOTE_SESSION_ID`. Worth a line in environment-caveats.md.
    severity: moderate
  - description: First batch of headless test runs merged stderr into the JSON output, so parsing failed; they had still run, which doubled the transcript pollution.
    solution: Send stderr to /dev/null when parsing `--output-format json`; check one run before launching a batch.
    severity: minor
  - description: Hit the 20-concurrent-subagent limit when launching a docs-check agent next to 20 summary agents.
    solution: Leave one slot free when a side question may need an agent; dispatch-subagents already states the limit.
    severity: nit
  - description: Sent the simple, positive wording rule to 20 agents mid-run, after some had drafted; the voice still differed between reports and needed a manual pass.
    solution: "Settle wording conventions before a fan-out (dispatch-subagents step 1: lock the shared axis first)."
    severity: minor
  - description: "Doc contradiction: CLAUDE.md cites ADR-0027 for 'cut before you add', ADR-0018 for the root nuxt.config.ts being human-only, and ADR-0004 for the missing workflow scope; the agents found none holds that decision."
    solution: Fix the citations in CLAUDE.md (ADR-0026 for the workflow scope; ADR-0004/0025 for nuxt.config.ts).
    severity: minor
  - description: "Doc contradiction: the ADR-0003 ledger and pr-workflow.md describe the dependabot auto-merge row as live, but proposal 1633 has not been applied."
    solution: Mark the ledger row as pending until a human applies docs/proposals/1633-dependabot-automerge.md.
    severity: minor
  - description: Committed the new validator before typechecking it; gate:scoped then failed on strict index-access errors, caught before pushing.
    solution: Run `pnpm typecheck` (or tsc on the file) before the first commit of a new script.
    severity: minor
  - description: Nearly shipped a stitch that writes a new schema field; this session's log would have landed on main and failed main's strict schema for every PR until merge.
    solution: Make the lander validate against origin/main's session schema too, or document an expand-then-write order for schema fields in ADR-0009's evolution policy.
    severity: major
  - description: skill-rules-hint.ts reused readHookPayload, which rejects payloads without a tool, so the slash-command path silently did nothing; unit tests missed it because they test pure functions.
    solution: Live-test hooks in a fresh headless session before calling them done; name the tool-only limit in guard-io.ts's readHookPayload doc.
    severity: minor
  - description: "Building a hook-only headless test took four tries: --setting-sources user drops project Skills, user-only Skills reject the Skill tool, and a symlinked scripts/ breaks runIfMain."
    solution: A short recipe for isolated hook tests in environment-caveats.md (copied scripts/, shared/ symlink, only the hook under test in settings).
    severity: minor
  - description: Piped vitest into tail and was blocked by the tail-pipe guard.
    solution: Redirect to a log file and check the exit code, as the guard says.
    severity: nit
  - description: "Doc contradiction: ADR-0022's rule and auto-triage SKILL.md say a human merges sweep PRs, while CLAUDE.md now says agents merge their own PRs outside ADR-0004's exceptions."
    solution: Owner decides; then fix ADR-0022's rule (its single home) and auto-triage line 78.
    severity: minor
  - description: "'Implement the logging' was ambiguous after a resume; I asked, got no preference, and chose the hook-injected-rules gap myself."
    solution: State the open follow-ups by name when reporting done, so a short follow-up prompt maps to one of them.
    severity: nit
