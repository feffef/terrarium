learnings:
  - Hook output (SessionStart stdout, additionalContext) is capped at 10,000 characters; anything longer becomes a file path plus a 2,000-character preview.
  - Path-scoped `.claude/rules/` load after the triggering tool result, so for a new file the rule arrives only after the Write.
  - "`@` imports in a path-scoped rule are not expanded when it loads, but the imported file loads at session start regardless of paths."
  - "This session's rulesLoaded lists zz-rule-probe.md and zz-import-probe.md: temporary rule files from the loading tests, not real rules."
