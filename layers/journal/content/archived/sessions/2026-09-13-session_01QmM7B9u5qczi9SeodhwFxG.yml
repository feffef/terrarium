frictions:
  - description: A dispatched review subagent relayed another session's self-diagnosis as established fact, asserting a live bug my own reproduction had already ruled out.
    solution: Falsified it against primary sources before acting. Territory of the open prune trial on CLAUDE.md's "Don't state anything as settled" bullet (opened 2026-09-11) — the compressed bullet held for me but not for the subagent, which is evidence for judging that trial.
    severity: minor
  - description: 'Twice I stated something as settled without verifying it: an unverified count ("six false reports") in committed prose, and three ADR filenames invented from their titles — the latter written INTO the friction that was itself about unverified claims.'
    solution: Both caught before landing (the count pre-commit, the paths by `ls docs/adr/` before the log landed); the scratch had to be deleted and re-authored, since merging cannot reword a friction. Same territory as the trial named above — and the second instance shows the rule failing at exactly the moment the author believes they are applying it.
    severity: minor
  - description: "Issue #864 carries ready-for-agent while also carrying wayfinder:grilling, which ADR-0022 defines as HITL and routes to ready-for-human. The two labels contradict."
    solution: Skipped it and flagged it rather than implementing an HITL ticket AFK. A later sweep should re-triage it to ready-for-human, or a human should confirm the grant was deliberate.
    severity: minor
  - description: "SHELL-READ-DETECTION, direction MISS. `sed -n 1,200p docs/adr/0022-*.md` streamed that ADR's full contents into the session, but it was rejected as \"not a literal path: glob or variable\". Same for `sed -n 1,60p docs/adr/0017-*.md` and `grep -n \"shell-read\" -i docs/adr/0009-*.md`. Expected paths: docs/adr/0022-autonomous-triage-sweep.md, docs/adr/0017-provenance-footer-on-agent-authored-content.md, docs/adr/0009-session-logs-commit-directly-to-main.md."
    solution: "Likely by design rather than an extractor bug: `scanShellReads` is a pure function over transcript records with no filesystem access (ADR-0009), so it cannot know what a glob expanded to, and deliberately reports these as near-misses instead. A fix would need the shell's own expansion — e.g. crediting a single-file `docs/adr/NNNN-*.md` prefix glob when exactly one committed path matches. Recording per the report's floor rule; the `docs/adr/NNNN-*.md` shape is common enough in this repo to be worth a decision."
    severity: moderate
  - description: "The Edit tool could not match an old_string containing a literal `\0` escape sequence in the source; two attempts failed before falling back to a python rewrite."
    solution: For a line carrying a backslash escape, verify the exact bytes first (`cat -A`) and use a scripted replacement rather than retyping the escape into the tool call.
    severity: nit
  - description: Piped `pnpm gate:scoped --dry` into `tail` and the tail-pipe guard denied it, costing a round trip.
    solution: The guard's deny message named the fix exactly (redirect to a file, check `$?`, read the file); no doc change needed — the mechanism worked as designed.
    severity: nit
