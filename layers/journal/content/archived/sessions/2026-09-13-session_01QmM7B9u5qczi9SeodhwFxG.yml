learnings:
  - "`bashCommandsOf` extracts only a Bash tool_use's `input.command` — tool OUTPUT is never scanned, so a path appearing only in a command's output (e.g. git merge's \"Auto-merging <path>\") can never be credited to docsReadViaShell. This single fact falsifies two sessions' self-diagnoses on #1206."
  - A `wayfinder:grilling` ticket can still carry `ready-for-agent`; the label pair is not mutually exclusive in practice, so an implement step must read the ticket type, not just the state label.
ideas:
  - "Give the shell-read advisory a `--explain <path>` mode that prints the exact command and record set (own transcript vs. which subagent) that credited a given path. Every recurring SHELL-READ-DETECTION friction on #1206 came from a session guessing at provenance it could not see; three separate sessions, plus a review subagent, each published a wrong mechanism from recollection. Provenance-on-demand turns that guess into a lookup and would retire the whole friction class, not just the parent-only wording this PR fixed."
