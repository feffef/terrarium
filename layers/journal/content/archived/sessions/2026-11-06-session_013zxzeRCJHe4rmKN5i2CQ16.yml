learnings:
  - scripts/ui/preview.ts shot does not scroll to a route anchor, despite its usage text; take a full-page shot and crop.
  - A resumed worktree agent keeps its branch and scratchpad; its later hand-backs arrive as new messages and still need to be verified against git.
  - "A negated closing keyword such as 'does not close #N' still closes the issue on merge; write 'relates to #N' alone."
  - "A resumed worktree agent works from the new message alone: spell out the check it must pass (the awk width check) in the message, not only the goal."
