frictions:
  - description: First Workflow call was blocked by the dispatch-read guard because I had not read dispatch-subagents before writing a subagent brief, as CLAUDE.md requires.
    solution: Read .agents/skills/dispatch-subagents/SKILL.md right after loading clear-backlog; the clear-backlog Skill could name it in §1.
    severity: nit
  - description: Builder claimed the SKILL.md line was already rewrapped; both round-2 reviewers found it still about 120 columns, costing an extra fix and re-check cycle.
    solution: Builder wrap check should print the measured columns in its reply, so the claim is checkable.
    severity: minor
  - description: The SubagentStart rule-use hook made all four reviewers run echo twice and judge steered or backed with no evidence; unrelated to the review task.
    solution: Ask once, after the work, in the rule-use hook under scripts/hooks/ (exact file unverified).
    severity: minor
