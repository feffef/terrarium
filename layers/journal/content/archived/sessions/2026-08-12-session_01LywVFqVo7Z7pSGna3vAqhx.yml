frictions:
  - description: Hand-typed a guessed Claude-Session id in the commit trailer instead of leaving it to the commit-msg hook — captured a real, id-shaped string from a git log entry seen earlier in context (a different session's log commit) rather than resolving my own. The hook silently overwrote it with the correct id, so no lasting harm, but this is exactly the capture failure mode CLAUDE.md's identifier-guarding rule warns about.
    solution: Never hand-author the Co-Authored-By/Claude-Session trailer on a commit in this repo at all — CLAUDE.md already says the harness template and .githooks/commit-msg land it automatically; the PR-body provenance header is the only place a session needs to self-resolve the id.
    severity: minor
  - description: "pnpm gate:scoped's first run failed typecheck on layers/commits/app/components/content/LatestCommit.vue with the exact same symptom already diagnosed and closed as a stale-sandbox false alarm in issue #923 (not a real break in main). This is the second time this exact failure mode has cost an /audit-docs session real time (a full clean reinstall + re-run) with no durable record anywhere an agent would see it before hitting it again."
    solution: "Add a short entry to docs/agents/environment-caveats.md (the single-homed list of platform-level quirks) documenting this specific failure signature and the rm -rf node_modules .nuxt && pnpm install --frozen-lockfile fix, cross-referencing issue #923, so the next session that hits it recognizes it immediately instead of re-diagnosing or re-filing."
    severity: moderate
