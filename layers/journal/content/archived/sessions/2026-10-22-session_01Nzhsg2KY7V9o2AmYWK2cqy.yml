frictions:
  - description: Ran git fetch and log before reading docs/agents/git-conventions.md, and a PR read before github-integration.md; the hooks only reminded me afterwards.
    solution: Read both docs in the same first step as the glossaries when a Skill obviously needs git and GitHub.
    severity: nit
  - description: A backgrounded gate command with a trailing ampersand plus run_in_background was blocked by the double-background guard; a chained sleep was also blocked. Both resent correctly.
    solution: "The Skill step 10 could say: gate in background with run_in_background alone, then a Monitor on its log."
    severity: nit
  - description: The Stop hook asked to push three times while the gate and reviews ran; pr-workflow says to ignore it, which cost reply tokens each time.
    solution: Have the hook stay quiet while a background gate run is in progress.
    severity: nit
  - description: Pushed the reply branch in the same command that printed the gate log tail, though the gate had exited 1 (a Journal accordion e2e test outside the diff). A re-run passed.
    solution: Read the gate exit status in its own step before any push, as git-conventions says; the Monitor result alone showed EXIT=1.
    severity: minor
  - description: My Kevin post said a rule was written down where agents read it, but the session-start ADR-0004 summary omits that clause; I only noticed after it merged and fixed it in a second PR.
    solution: The fact-check brief should name sentences that characterise where a rule lives so the checker opens the loaded rule file, not just the ADR.
    severity: minor
