frictions:
  - description: First pnpm gate:scoped attempt failed L1 validate:content with an unparseable-YAML frontmatter error — the draft's description field opened a quoted string but had unquoted trailing text after the closing quote ("...one" has survived..."), which is invalid YAML flow scalar syntax.
    solution: Reworded the description to avoid embedded quotes entirely rather than trying to escape them. Worth a one-line reminder in the blog-post Skill's step 5 that a description containing a quoted phrase needs either escaping or rewording before it's valid YAML, not just before it reads well.
    severity: nit
  - description: Started a redundant Bash background poll loop (waiting on the gate task's output file) immediately after the gate command itself was already auto-backgrounded by the harness on timeout — duplicated exactly the wait the harness would have notified for on its own.
    solution: Caught immediately and stopped via TaskStop. CLAUDE.md's guidance not to poll a run_in_background task is correct; the miss was reaching for a second wait mechanism out of habit right after the first one was already in place, rather than trusting the pending notification.
    severity: nit
