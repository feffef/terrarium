summary: "The owner ran /wayfinder on the Glass Box map to work this HITL grilling ticket. I claimed it, read the four earlier resolutions, checked the global ProsePre and the Blog's hand-pinned links, then grilled the owner in three rounds. The owner decided every point: keep the Shiki setup already on with no config change; an inline `:source[path]` component pinned to the page's revision; excerpts copied into a `::excerpt{path}` block (owner chose this over extending the global ProsePre) and tested word for word at revision; fences outside it are unchecked examples; optional line ranges. The owner asked for an experiment before allowing line anchors; on my own initiative I ran it (shifting ranges in shared/expand.ts through git diff -U0 hunks), which showed ranges can be moved mechanically and edited ranges flagged, so line anchors were allowed with glassbox-update maintaining them. I posted the resolution comment, closed the ticket and added a Decisions-so-far line and fog notes to the map, as the wayfinder Skill directs. No code or branch changes."
