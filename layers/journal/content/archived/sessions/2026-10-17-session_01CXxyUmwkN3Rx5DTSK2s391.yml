summary: "Scheduled visitor-loop run, focus glassbox (entry /t/glassbox/guide); nothing in it was human-instructed, all of it came from the Skill's schedule. Served a production build and sent three blind visitors (sonnet, fable, opus). Nine consensus findings; \"Start here\" (all three) was dropped on the owner's #2171/#2176 ruling and the empty Subject-card space on #2100's deliberate equal heights. The owner-corrections script gave 25 candidates; two became decisions.md lines (#2176 no Start here, #2178 compact term chips). The fit check refined several fixes: the code-scroll fade already existed, so I only widened it, and Source pointing at main is deliberate. Fix PR #2225 merged after gate:scoped and code-review with no important finding; the refiner's fallback for browsers without animation-timeline was not built because CSS cannot tell an overflowing block from a short one. The feature, a Try-it-in-your-project page derived from each Lesson's section, went in as #2226 after both review axes found a payload leak (toc) and a drafts-landing spacing change, both fixed before the push. No out-of-remit finding survived, so no issue was filed; single-visitor findings are in ideas."
