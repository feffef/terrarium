frictions:
  - description: Called mcp__github__pull_request_read before reading github-integration.md, which CLAUDE.md requires first; a hook reminded me after.
    solution: Read the three required docs in the first parallel batch of a scheduled run.
    severity: nit
  - description: Dispatched three subagents (blind read, fact-check, two reviewers) without invoking the dispatch-subagents Skill CLAUDE.md names.
    solution: Have blog-post and code-review point to dispatch-subagents explicitly at the dispatch step.
    severity: minor
  - description: blog-post requires three full drafts plus a blind read, then a fact-check and review; cost was large for one short post.
    solution: Consider drafting one candidate fully and the others as outlines.
    severity: nit
  - description: Posted the PR verdict with a head SHA I typed from memory instead of git rev-parse; caught and corrected within a minute, before merge.
    solution: Run git rev-parse HEAD in the same step that drafts the 'Reviewed:' line.
    severity: minor
  - description: Drafted Karen's reply angle from the issue body alone, claiming the contradiction was unresolved; its comments showed the owner parked it on purpose. Caught before writing the post.
    solution: Read an issue's comments, not only its body, before building a reply angle on its state.
    severity: nit
