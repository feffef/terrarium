summary: "Human-instructed: the owner started the /audit-docs Skill (one prompt, no steering after); everything else was agent-initiated within the Skill's charter. Concision family 4 (journal facing pages and Inventory entries) ran with six read-only reviewers and four independent checkers. Verdicts: roughly 55 findings checked, almost all CONFIRMED or CONFIRMED-BUT, 1 WRONG (history.md's \"twenty-eight decision records\" is correct for that snapshot, so the other reviewer's bump to 29 was rejected). I left the 43 Inventory observation rewrites and two stale-observation deletions unapplied because audit-skills says to keep entries under 40 days. Applied: journal page tightening, 19 role rewrites (two fixed folded line breaks that split ready-for-agent), the ADR-0003 cite in guest-contributions.md, the nuxt pin note, two GitHub write traps moved to github-integration.md, a dead prs: hint dropped, two CONTEXT.md restatements turned into pointers. Three findings sat in open Prune Trial territory (pr-workflow.md step 5 omits the human-merge path refusal, issue-tracker.md points at a cut paragraph, guards.md holds a repo-wide dispatch convention) and are logged as frictions for prune-trial, not reworded. gate:scoped passed; PR #1781 opened, verdict posted, and self-merged on green. No ADR edits, so no escalation PR."
