frictions:
  - description: Ran gate:scoped in the foreground (about 3 minutes) though CLAUDE.md says to background any command that can exceed 2 minutes.
    solution: Start the gate with run_in_background and redirect output to a file, as CLAUDE.md says.
    severity: nit
  - description: Read .agents/prune-trials.yml and the audit-skills SKILL with sed/grep in Bash instead of the Read tool, against CLAUDE.md's Read-tool rule.
    solution: Use Read for each file; the Bash hint fired after the fact.
    severity: nit
  - description: The Skill says to save each reviewer reply verbatim by copying, but I had each agent write its own reply to the scratchpad, since copying means retyping through my context.
    solution: Reword the Skill step to let reviewers write their own final reply to a named scratchpad path.
    severity: nit
  - description: Reviewer line ranges were often off by one (included the YAML header or one extra line); checkers had to correct them.
    solution: Have reviewer briefs say 'body lines only, verify with sed -n before reporting' or have the Skill ask for ranges the checker re-derives.
    severity: nit
  - description: "PRUNE-TRIAL: pr-workflow.md recipe step 5 omits that merge-pr.ts also refuses a PR touching a Human-only path (humanMergeRefusal); left unreworded as the trial stands."
    solution: prune-trial should judge whether step 5 needs one clause naming the refusal.
    severity: nit
  - description: "PRUNE-TRIAL: issue-tracker.md says the multi-issue Closes failure mode is in pr-workflow.md's merge recipe, but the pruned recipe no longer describes it."
    solution: "prune-trial should judge: restore a clause in the recipe or drop the pointer."
    severity: minor
  - description: "PRUNE-TRIAL: guards.md holds the repo-wide convention 'never dispatch an unattended session to change a guard', cited from environment-caveats.md and frictions-to-fixes."
    solution: After the guards.md trial is judged, consider moving it to dispatch-subagents or CLAUDE.md.
    severity: nit
  - description: "SHELL-READ-DETECTION false positive: .agents/skills/audit-docs/SKILL.md was credited from shell output, but the session marked it (not read)"
    solution: Find the crediting command in the transcript and tighten scripts/shell-reads.ts
    severity: moderate
