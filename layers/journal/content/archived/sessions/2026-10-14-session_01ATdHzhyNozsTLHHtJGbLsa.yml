frictions:
  - description: clear-backlog plus auto-triage let triage agents label wayfinder tickets (1967 got ready-for-agent); the owner wants wayfinder ignored entirely.
    solution: PR 1977 makes clear-backlog §1 leave out wayfinder:* issues.
    severity: moderate
  - description: Read docs with cat/sed in Bash rather than the Read tool, against CLAUDE.md; rules may not have loaded for those reads.
    solution: Use Read for docs; Bash only for script output.
    severity: minor
  - description: Labelled and closed issues (1954, 1955, 1959, 1967, 1968) without reading issue-tracker.md and triage-labels.md first, as CLAUDE.md requires.
    solution: Read them before the first label write; the clear-backlog Skill could name them at §2.
    severity: minor
  - description: Dispatched build workflows that touch git without reading the dispatch-subagents Skill first (CLAUDE.md trigger).
    solution: The workflows encode the dispatch rules, so the trigger could exempt saved clear-backlog workflows.
    severity: nit
  - description: Building on the session branch made the worktree use a local branch named worktree-wf_..., so it needed a refspec push to reach claude/upbeat-albattani-2ryjxo.
    solution: clear-backlog-build could detect a branch already checked out and push HEAD to the named branch itself.
    severity: nit
  - description: The build result has no gatePassed field (undefined) for any branch, so I relied on CI gate.
    solution: Have the build workflow return gatePassed from its final round.
    severity: minor
  - description: Workflow output nests results as a JSON string under result, so my first parse printed nothing useful and needed a second pass.
    solution: Document the output shape in the clear-backlog Skill or return a flat object.
    severity: nit
  - description: Main dropped subagentVerdicts mid-run (c82a0ac19); my session-start copy of log-session still asked for it, so the first final log was held.
    solution: Re-fetch main before closing a long session (main already updated clear-backlog to match).
    severity: minor
