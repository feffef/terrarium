summary: "The owner invoked /clear-backlog (human-instructed). I resolved the sweep set: 11 eligible issues plus the ready-for-agent #1844. clear-backlog-explore triaged them all. #1844 is time-gated until 2026-10-15 and #1966 was claimed mid-run. Six issues came back build. #1967 has a comment as its output, not a PR, so it was not built. I built #1958, #1960, #1961, #1962 and #1963 while grilling the owner on four questions. Owner answers (human-instructed): #1959 change ADR-0025 to name the home page as the exception; #1955 document the recipe only; close #1954; #1968 the owner handles in another session; wayfinder tickets should be ignored by clear-backlog. Acting on that last answer, I reset the labels triage had added on #1967 and #1968, and built a one-sentence Skill edit (owner-directed). Merged: 1975 (ADR-0025/0016 home-page exception; the owner merged it), 1976 (environment-caveats recipe for undoing a committed workflow edit), 1977 (clear-backlog skips wayfinder:* issues), 1978 (five Journal explainer facts), 1979 (two stale comments), 1980 (palimpsest note: ADRs are rewritten in place). The owner then merged 1981 (gate step renamed to L0/L3 unit tests) and 1982 (two dead allow entries dropped from settings.json), both Human-only. Judgement calls left open: wording and line-wrap nits listed in each PR, and the 1976 recipe is untested with a real push."
