frictions:
  - description: Waiting on long backgrounded builds/gates/CI runs required dozens of no-op Bash "true" calls per wait, since a real sleep is blocked and Monitor's own notification didn't fire until the underlying background Bash call completed — burned a large share of this session's turns on pure waiting rather than work.
    solution: Prefer a single Monitor watch with a tight completion-only filter over re-polling with repeated no-op Bash calls; consider a longer allowed single-wait primitive for "just tell me when this backgrounded command finishes" without intermediate no-ops.
    severity: moderate
  - description: The local `main` branch ref was days stale relative to `origin/main` in this ephemeral session; running `check-conflicting-issues.ts main <branch>` against it returned a near-whole-repo diff instead of the real one.
    solution: Always diff gated-PR tooling (check-conflicting-issues.ts, manual `git diff`/`git log` sanity checks) against `origin/main`, never the local `main` ref, in this repo.
    severity: minor
  - description: An ad-hoc playwright-core verification script placed under the session scratchpad directory (outside the repo tree) failed to resolve the `playwright-core` module via `pnpm exec tsx` until `NODE_PATH` was set explicitly to the repo's `node_modules`.
    solution: Document (`docs/agents/verifying-ui-changes.md`) that a scratch-dir probe script needs `NODE_PATH=<repo>/node_modules` when run with `pnpm exec tsx` from outside the repo tree.
    severity: nit
  - description: Fat-fingered one digit of a long scratch-dir UUID path segment in a backgrounded redirect target, silently discarding that gate run's output and costing one wasted verification cycle before the typo was caught.
    solution: Reuse a shell variable for a long repeated scratch-dir path instead of retyping the full UUID each time.
    severity: nit
