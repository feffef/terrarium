frictions:
  - description: "The first full `pnpm gate:scoped` run on the fix branch caught a real regression: the issue-#768 hit-test guard in layers/journal/tests/e2e/journal.e2e.ts iterates every session card via querySelectorAll, including ones my new default-collapse (v-show) now hides, and hit-tested their zero-size rects."
    solution: Skipped a card with offsetParent === null in that one test, then reran the full gate to confirm green. A UI change touching default visibility of an existing e2e-covered list should prompt a check for hit-testing/querySelectorAll assumptions over that list before the first gate run, not after.
    severity: minor
  - description: This session's harness-assigned branch (a generic "develop on branch claude/adoring-galileo-eu6h9w" instruction) conflicted with visitor-loop/SKILL.md's own dated-branch convention (claude/visitor-loop-fixes-<date> / -feature-<date>, cut fresh from origin/main each run).
    solution: Followed the skill's own convention (CLAUDE.md's repo-instructions- override rule, and the dated branch naming is load-bearing for the chartered self-merge tier). Worth a standing rule if a dated-branch chartered Skill runs again under a harness that pre-assigns a session branch.
    severity: minor
