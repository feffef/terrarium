frictions:
  - description: A triage subagent ran git checkout origin/main -- in the shared checkout, detaching HEAD briefly; it restored the branch itself.
    solution: Triage agents in clear-backlog-explore should read from git show origin/main:path, never checkout, in the shared checkout
    severity: minor
  - description: read-first-hint repeated github-integration.md and git-conventions.md pointers on every call in five workflow subagents, even after they had read the doc
    solution: Check subagent transcript resolution and Bash-read detection in read-first-hint.ts (raised as Q13)
    severity: minor
  - description: I read git-conventions.md and github-integration.md after my first git log/fetch call, not before, as the hook pointed out
    solution: Read both at session start alongside the glossaries when a Skill will drive git and GitHub
    severity: nit
  - description: "Read only the first 80 lines of dispatch-subagents SKILL.md before writing the #2137 review brief, though CLAUDE.md says read the doc in full"
    solution: Read trigger docs with one Read call and no head/sed limit
    severity: nit
  - description: 'I proposed an extra "already loaded, do not re-read" CLAUDE.md note for #2437; the owner rejected it as redundant, since the import block names its file'
    solution: "Before adding a note, ask whether what the agent already sees makes it obvious (ADR-0027: cut before adding)"
    severity: nit
  - description: "I counted #2286 and #2137 as always-eligible unlabelled issues, but both are on-hold specs whose last comment was an agent's, so auto-triage's on-hold exception would have skipped them; the owner confirmed the set anyway"
    solution: Apply auto-triage's on-hold-spec exception when resolving the set; a helper printing eligibility per issue would make it mechanical (#2435's counts-from-wrong-filter cluster)
    severity: minor
  - description: "Wrote #2454's verdict Reviewed: SHA from a guessed expansion of the short hash instead of reading the head; caught right after and edited the comment before merging"
    solution: Read the PR head SHA (gh api pulls/N --jq .head.sha) before writing a verdict
    severity: minor
  - description: My log-merge helper reset ruleVerdicts and docsRead on each pass, so earlier verdicts were only kept by log-session's own list union
    solution: Merge into the existing lists; better, a log-session --merge-verdicts flag that takes run-summary --verdicts output
    severity: nit
