learnings:
  - Skill descriptions live in the re-sent system prompt; CLAUDE.md arrives as a conversation-injected system-reminder, so they differ in durability under compaction
  - github-footer-guard.ts's bodyField was designed for exactly the uncovered create_or_update_file/push_files case — both tools take `message`, verified via ToolSearch
  - A repo can grow a missing doc as fragments inside two neighbouring docs; the fragments are the signal the home is absent
ideas:
  - Add a PreToolUse Bash guard for the shell footguns (pkill self-match, trailing & with run_in_background, tail-piping a command whose exit status matters). The repo has three precedents where prose failed and a hook fixed it; these rules must fire mid-command, where no doc pointer and no Skill trigger can reach them.
