frictions:
  - description: My doc-vs-Skill analysis compared context cost but ignored that Skill descriptions sit in the system prompt while CLAUDE.md is conversation-injected and compactable.
    solution: Treat durability as a separate axis from cost when siting agent-facing guidance; the user had to supply it. Recorded in the follow-up issue.
    severity: minor
  - description: First seam split git rules from GitHub gotchas, running straight through the provenance-footer rule, whose coverage map spans both and has one surface in neither.
    solution: Split on subject, not tooling; extract provenance as its own home. Test a proposed seam against the rules that straddle it before recommending it.
    severity: minor
  - description: "Cited issue #605 as evidence for that git/GitHub seam when it actually records the failure caused by treating the two surfaces separately."
    solution: Re-read a cited issue's actual failure mode before using it as supporting evidence; it cut against the argument it was offered for.
    severity: minor
  - description: Drafted an environment-caveat bullet into git-conventions.md, widening the agreed three-group scope the user had set for attributable changes.
    solution: Caught and reverted to a pointer. When a scope is set for attribution, cross-group coupling gets a reference, never a copied bullet.
    severity: nit
  - description: Local gate went red on a pre-existing journal accordion e2e failure unrelated to this markdown-only diff; I began diagnosing before the user said another agent owned it.
    solution: Check whether a failing test is already owned or fails on the base branch before investigating, especially when the diff cannot plausibly reach it.
    severity: minor
  - description: A single oversized session log on main reds the journal accordion e2e, blocking every open PR; the stopgap trim regrew the moment its own session re-logged.
    solution: "Tracked as #768 with a narrowed threshold (7021 PASS, 8368 FAIL, 11.3KB FAIL). Trimming is not durable; the card or the test needs to tolerate a large document."
    severity: major
  - description: The accordion trim commit round-tripped the YAML through a serializer, rewriting startedAt/endedAt from Z form to +00:00 and swapping a red e2e for a red validate:content.
    solution: "Edit session-log prose in place rather than re-serializing the document; utcTimestamp requires the Z form. Reported on #768."
    severity: moderate
  - description: Misread a CI failure as a CI-vs-local gate divergence before recalling that GitHub tests refs/pull/N/merge against the current base, not the pushed head.
    solution: Check gate.yml and the run's actual base before concluding CI and local run different steps; the base had moved between my push and the run.
    severity: minor
  - description: The background-task completion notification reported "exit code 0" for all three gate runs that actually exited 1 — the wrapper's trailing echo became the pipeline exit status.
    solution: Recurred three times this session. Always emit and grep an explicit exit marker; never trust the notification's reported code for a wrapped command.
    severity: minor
