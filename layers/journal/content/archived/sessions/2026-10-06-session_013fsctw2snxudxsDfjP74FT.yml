frictions:
  - description: Piped scripts/audit-skills.ts's JSON output through `tee | head -200` to preview it; `head` exiting early sent SIGPIPE upstream and silently truncated the saved file to ~888 lines, producing an unterminated JSON parse error on first read.
    solution: Redirect the primary command straight to a file (`cmd > out.json 2>stderr.log`) and read the file separately, never pipe a JSON-producing command through `head`/`tail` for a preview — exactly the tail-pipe guard's own rationale, just hit before the guard could catch a non-Bash-tool preview step.
    severity: minor
  - description: Two Edit calls (on digest.yml and visitor-loop.yml) failed with 'String to replace not found' even though a subsequent `tail`/`cat` of the file showed the exact string present — likely a stale in-memory file snapshot after several other Edits landed in the same batch.
    solution: Retried the same Edit immediately after and it succeeded; no code fix needed, just a reminder that a batch of parallel Edits to different files is safe, but don't assume a prior Read's snapshot is still authoritative without re-checking if an edit unexpectedly fails.
    severity: nit
