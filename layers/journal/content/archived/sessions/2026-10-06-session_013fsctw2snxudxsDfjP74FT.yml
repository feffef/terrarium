learnings:
  - The /loop-only ScheduleWakeup guard correctly fires for a plain scheduled task (not a /loop session) even when multiple long-running background subagents are in flight — the right call is to just end the turn and let task-notifications drive the next turn, never schedule a self-wakeup outside /loop.
  - CI's issue_comment webhook for the gate-green check references the refs/pull/N/merge SHA, not the PR branch head SHA — a mismatch there is expected, not a sign something else pushed to the branch (CLAUDE.md's own noted divergence source).
