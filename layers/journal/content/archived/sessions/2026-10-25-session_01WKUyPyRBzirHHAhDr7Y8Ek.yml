frictions:
  - description: "Review before first push: the follow-up commit (6 lines, 4 files) exceeded the 2-file simple-change bar, yet I only read my own diff instead of rerunning code-review."
    solution: Rerun code-review on a follow-up diff past the bar, or let the bar count review-fix commits that only apply a review's own findings.
    severity: minor
  - description: check-states.ts printed '0 claim(s) on 0 number(s)' for bodies naming several PRs and issues, so its pass said little about whether it checked anything.
    solution: Have it list the numbers it scanned, or say when no state wording was found.
    severity: nit
  - description: Wrote the observation script to .throwaway/ before the directory existed, so the heredoc failed and I had to retry.
    solution: Have the throwaway-script instruction in CLAUDE.md say to mkdir it first.
    severity: nit
  - description: Hand-authored the completed log with log-session --author right after the merge, before invoking close-session; the script warned and I then invoked it.
    solution: Have the merge-pr.ts output remind the caller to invoke close-session, matching the existing warning in log-session.
    severity: nit
  - description: "Late look-back: review-fix wording nits (same-day note references, truncated ids) were findable by re-reading my own notes before the first push."
    solution: Re-read each appended note once for full ids and unambiguous dates before committing.
    severity: nit
