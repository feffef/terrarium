frictions:
  - description: Broke CLAUDE.md 'Before your first git command' by running fetch and rebase before reading git-conventions.md; harmless here, branch had no commits.
    solution: The read-first hint fired after the call; read git-conventions.md before any state-changing git command.
    severity: minor
  - description: "Broke pr-workflow order: started gate:scoped before committing, then committed mid-run, so the gate aborted and had to rerun."
    solution: Commit, review, then start the gate last and edit nothing until it ends.
    severity: minor
  - description: "Drafted three overview claims from the old brief, not the repo: rules all path-scoped, Routine as a session, dependabot-sweep PR-triggered."
    solution: Check each claim in a reused doc against its source file before writing; code review caught all three.
    severity: minor
  - description: Found late that the Glass Box glossary named the Subject directory and Subject URLs redirected to landing cards.
    solution: Grep a page's glossary product decisions and route redirects before removing a landing section.
    severity: nit
  - description: The first overview kept Part 1's infrastructure-first order and omitted why Terrarium exists; only the owner's request for a second critical review surfaced it.
    solution: Before shipping a page for two audiences, review it against each reader's first question; the code-review spec axis checked facts, not fit.
    severity: moderate
