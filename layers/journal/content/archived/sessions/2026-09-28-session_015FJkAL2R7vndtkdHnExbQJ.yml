  - description: Three visitors independently proposed a "Start here"/real-vs-fiction onramp for the homepage, a recurring visitor-loop idea, but the homepage hero is off-limits per an owner ruling (#1416) that forecloses a competing orientation strip there. Building it required finding a different host page (the Journal's existing onramp system) rather than the obvious homepage location, and building it there surfaced a pre-existing cross-file fact inconsistency (five vs six vs seven sites) that a homepage-hosted version likely would not have touched at all.
