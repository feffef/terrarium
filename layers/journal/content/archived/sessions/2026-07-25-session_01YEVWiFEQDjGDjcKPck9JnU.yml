learnings:
  - The regressionChecks before/after brackets are calendar-adjacent (5 sessions before/after the edit commit by count), not filtered to sessions that actually invoked the edited Skill — for a low-frequency Skill (blog-post, digest, atlas-specimen) this often means neither bracket contains a real invocation, so the Phase A screen needs a manual look at the Skill's actual nearest usedIn sessions rather than trusting the mechanical bracket alone.
