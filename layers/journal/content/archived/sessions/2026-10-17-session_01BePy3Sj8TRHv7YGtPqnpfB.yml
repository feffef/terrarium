summary: "The owner typed /glassbook-update, which doesn't exist. I asked whether they meant glassbox-update rather than guess, and they ran /glassbox-update. Everything after that is the Skill's own steps, run on the owner's instruction. The report flagged six guide pages, all pinned to d6efb618. Reading every commit to 8ac5621f showed one real drift: #2204 replaced scripts/hooks/guard-wrap.sh with \"onFailure\": \"block\" on each guard's hook entry, so the Hooks Lesson's \"Broken guards refuse\" bullet cited a deleted file. I rewrote that bullet and tightened the matching watch-for line. My first rewrite broke the bullet's 65-word cap, and I trimmed it. The other five flagged pages still hold. The draft guards page still excerpts guard-wrap.sh, but drafts are outside this run's default Space, so the PR names it and leaves it. The gate is green and I shot the Hooks page in all four views. A code-review run after the push (two agents) caught one more error: \"each guard's hook sets onFailure\" ignored deferred-tool-guard, which fails open on purpose. I fixed it to \"every guard's hook but one\", posted the verdict and merged on green CI."
