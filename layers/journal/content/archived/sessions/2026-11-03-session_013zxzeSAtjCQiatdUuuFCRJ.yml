learnings:
  - Sonnet blind judges finish in about 15 seconds, so waves of 18 to 20 judges clear within a minute or two; the limit is my own turn count, not their speed.
  - save-handback.ts takes several agent-id and file pairs in one call, which cut the hand-back saves to one command per wave.
ideas:
  - "Make the glassbox-improve judge step one workflow script in .claude/workflows/: read every judges/*.md brief, dispatch sonnet judges 20 at a time, save the replies, run grades.ts votes and loop until nothing is owed. It removes about 90 hand calls per run and is the fix issue 2805 asks for."
  - "Proposed DECISIONS lines: Keep Prose overrides as its own Lesson, moving it into MDC components undoes the 2026-11-02 promotion; Pruning instructions keeps the find-trial-window.ts Excerpt because .agents/prune-trials.yml shows only comments; Session logs keeps the isLinkedWorktree Excerpt that last run's move added."
  - Five drafts are still waiting after this run (planning-a-big-change, a-newcomers-first-hour, reading-across-tenants, routines, session-log-lands-on-main); next run could promote the one that raters rank highest.
  - Add a tokens field per dispatched agent to run.yml, filled by the lead from each completion notice, and have record print the share per step, so the next retro reads cost per step from one table instead of adding up notices by hand.
landedBy: Stop
