    solution: Followed CLAUDE.md's single-home branch-off checklist and the Skill's explicit 'independent of any work branch' instruction — created a fresh branch off origin/main for the post PR rather than reusing the harness-pinned one. Worth a sentence in the Skill or CLAUDE.md noting this precedence explicitly, since it isn't obvious which instruction should win at a glance.
