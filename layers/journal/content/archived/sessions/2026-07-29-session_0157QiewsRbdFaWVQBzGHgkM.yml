  - description: A draft claimed the Midden Tenant was created 'this week' based on the first commit touching layers/midden in this session's pre-cloned repo — which turned out to be the shallow clone's grafted, parent-less boundary commit (2026-07-26), not the Tenant's real scaffold date (2026-07-16, found only after git fetch --unshallow).
    solution: CLAUDE.md's shallow-clone caution (check git rev-parse --is-shallow-repository before any history-completeness claim) is exactly right and caught this before it reached the reviewer or shipped — logging as a friction because the near-miss is a good example of why that rule earns its place, not because the rule needs changing.
    severity: minor
