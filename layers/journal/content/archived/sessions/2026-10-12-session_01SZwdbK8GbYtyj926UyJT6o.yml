ideas:
  - "Give auto-triage a 'deferral check' mode: for an issue whose latest owner comment names a revisit condition (an upstream release, a date, another issue closing), a cheap script checks just that condition and only escalates to a full triage subagent when it flips, cutting full-sweep cost by most of the ready-for-human backlog."
