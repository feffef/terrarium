frictions:
  - description: "Opened PR #1827 about 15 minutes before invoking close-session; CLAUDE.md and ADR-0009 say invoke it when you open a PR"
    solution: Invoke close-session right after the first PR opens in a multi-PR run; re-invoking is cheap
    severity: minor
  - description: Dispatched 14 triage agents on a shallow clone (107 commits); git-conventions says unshallow before trusting history, and two agents reported truncated git log results
    solution: Check git rev-parse --is-shallow-repository before any history-dependent dispatch; clear-backlog/auto-triage could say so; the SessionStart hook errored (tsx not found) which likely skipped unshallow-on-start
    severity: moderate
  - description: "Read CONTEXT-MAP.md via a chained Bash cat at session start instead of the Read tool (CLAUDE.md: read files with Read)"
    solution: Use Read for any doc read, even in a first orientation command
    severity: nit
  - description: clear-backlog full-sweep re-triage spent roughly 70-100k tokens per issue on 10 owner-deferred issues to conclude no change
    solution: "clear-backlog: for an issue whose last owner comment is a deferral with a revisit condition, check only that condition"
    severity: moderate
  - description: "clear-backlog gives no wave rule that respects the 2-Heavy-gate cap; a literal wave of 3 build agents can reproduce the #1800 OOM"
    solution: Say waves are limited by concurrent Heavy gates, not agent count (moot once PR 1828 lands)
    severity: minor
  - description: clear-backlog §2 Done and §5 report format have no outcome for settled-but-parked issues or issues ending with no PR (10 of 14 here)
    solution: "Add a 'stays parked/deferred by answer' outcome and a 'no PR: why' report line"
    severity: minor
  - description: clear-backlog §1 design subagent overlaps auto-triage's per-issue subagent; unclear if one or two agents
    solution: Say the triage subagent returns the design recommendation for non-ready issues
    severity: minor
  - description: log-session --author second pass rejected a partial YAML (only new docsRead/ruleVerdicts) though the Skill says list only new or changed entries
    solution: Say in log-session step 3 that goal/status/outcome/summary/frictions are still required on every pass
    severity: nit
