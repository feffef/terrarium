frictions:
  - description: Forgot the ADR-0017 provenance header on the first mcp__github__issue_write call for all 5 filed issues; the PreToolUse guard blocked every one, needing a uniform retry with the header added.
    solution: Include the "🤖 [<model>](session URL)" header as the first line on every GitHub post by default, not just after the guard fires.
    severity: nit
  - description: "Filed issue #917 partly on the survey subagent's unverified claim that github-integration.md \"already documents the adjacent trap\" about refs/pull/N/merge - the doc-fix impl agent later found that note actually lives in root CLAUDE.md, not that file. Didn't affect the fix's correctness but violated the \"verify a subagent-derived claim before asserting it\" rule."
    solution: Grep the target file directly for a subagent's specific "doc already says X" claim before citing it in a filed issue, not just before implementing the fix.
    severity: minor
  - description: "The dispatched hard-fix agent for #921 (isolated worktree, claude/commit-trailer-guard) died without ever committing, stranding two untracked draft files, sometime during a multi-day gap between dispatch and this session's resume. Meanwhile a separate auto-triage session independently picked up and merged a fix for the same issue (PR #946) before I could recover or resume mine."
    solution: pnpm check:worktrees caught the stranded worktree correctly and it was safe to discard since the issue was already closed elsewhere - but a long gap between dispatching a subagent and the orchestrator's next resume risks exactly this kind of wasted/duplicated effort when other sessions can independently pick up the same open issue. No clean fix identified beyond resuming dispatched agents promptly when possible.
    severity: minor
  - description: The survey subagent's report was flagged by the harness as containing an "instruction-shaped pattern" (settings-json) — turned out benign, just the report's own text describing a recommended fix that touches .claude/settings.json.
    solution: No action needed this time; noting only because it cost a moment to confirm it was a false positive rather than an actual injection attempt.
