frictions:
  - description: Ran scripts/github/list-open-issues.ts (a gh-backed GitHub read) before reading github-integration.md, which CLAUDE.md requires before the first GitHub operation.
    solution: Have the clear-backlog Skill §1 point to github-integration.md next to its auto-triage step-1 pointer.
    severity: nit
  - description: Gave recommended picks in the grilling round without invoking adr-check, which CLAUDE.md requires before any recommendation; I relied on the triage agents' ADR reads.
    solution: "clear-backlog §2 could say whether triage agents' adr-check covers the orchestrator's picks (see #2342)."
    severity: minor
  - description: Throwaway peek script passed a full repos/owner/repo path to getJson, which already prefixes it, so it 404ed once.
    solution: Read a github-client helper's signature before calling it.
    severity: nit
  - description: The build agent's worktree guard refused every command naming the branch git-conventions-foreground-gate-chain because it contains 'git', so the commit sat on the worktree branch and I pushed it under another name.
    solution: Narrow the guard's match so that a branch name containing the word git is not treated as a git command.
    severity: minor
  - description: My first verdict comment on PR 2360 named the oldest commit as Reviewed, because I took the build output's commit list order for newest-first; corrected by an edit.
    solution: Take the Reviewed sha from git rev-parse HEAD in the worktree, never from the workflow's commits list.
    severity: nit
