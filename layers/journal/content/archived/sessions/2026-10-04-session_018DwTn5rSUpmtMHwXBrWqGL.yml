frictions:
  - description: Drafted a link with a made-up commit SHA in a candidate post; caught on my own re-read before anything shipped, but only because I re-read.
    solution: Never type a SHA; always paste from git rev-parse output. blog-post's citation reference could say so next to the 40-char rule.
    severity: moderate
  - description: Step 4's same-Persona overlap skim missed Kevin's 2026-09-18 post on the same gate fence; found only after the blind read and fact-check, forcing a rewrite and an unchecked-by-subagent edit.
    solution: Grep the Persona's posts for the topic's key terms (file names, PR numbers) at step 4, not just skim titles; step 6 then checks a real overlap.
    severity: minor
  - description: The harness attribution reminder told me to hand-write commit trailers; the commit-trailer guard denied the whole chained git add and commit and I had to rerun.
    solution: The harness template and the repo guard disagree; drop the trailer instruction from the reminder for this repo, or the guard should allow what the reminder emits.
    severity: minor
  - description: Agent call with run_in_background false was denied by the guard because the flag is a no-op; the blind-read dispatch cost a retry. The blog-post Skill says to wait, which invites that flag.
    solution: Reword step 6 to say dispatch and wait for the completion notification; no flag.
    severity: nit
  - description: Stop hook asked twice to commit untracked files while the post was still awaiting fact-check and the gate, so committing then would have been premature.
    solution: Let the stop-hook git check skip when a background command is still running, or accept it as noise.
    severity: nit
  - description: Karen reply draft pinned a blob link to the merge commit, after the file was deleted, and misquoted a line by dropping an ellipsis; both caught only by the fact-check.
    solution: Pin a deleted file's link to the last commit that carried it (git log --diff-filter=D parent), and copy quotes from git show output.
    severity: minor
