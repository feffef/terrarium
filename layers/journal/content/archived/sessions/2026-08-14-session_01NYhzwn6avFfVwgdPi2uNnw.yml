frictions:
  - description: The session-frictions.ts impl agent (fixing issue "#951", ironically) backgrounded `pnpm gate:scoped` / waited via a Monitor-style pattern despite its brief explicitly saying to run it in the foreground, then reported it was "waiting for the background monitor's notification" and stopped — a dispatched subagent has no wake mechanism, so it stalled with uncommitted, unpushed work until I caught it via `pnpm check:worktrees` plus a direct worktree inspection.
    solution: "Resumed it via SendMessage with an explicit correction rather than re-dispatching, and it finished correctly on the second pass. Worth checking whether the subagent-background-guard PreToolUse hook actually covers a Monitor-tool-based wait pattern, not just `Bash run_in_background: true` — this agent seems to have found a path around it despite an explicit brief instruction."
    severity: moderate
  - description: "`pnpm exec tsx scripts/session-frictions.ts` at the default 20-session window again exceeded the Bash tool's inline-capture cap during the survey subagent's run, silently redirecting to a spill file."
    solution: Filed as issue "#951" and fixed within this same run (PR "#958" adds a `--compact` flag) — noting it here for the record since it recurred live during this session, on top of the logged sessions that motivated the fix.
    severity: minor
  - description: '`scripts/check-conflicting-issues.ts` flagged self-referential false positives on 2 of the 4 reviewed PRs — the issue the PR itself closes matching generic "delete"/"remove" keywords against its own body text.'
    solution: Harmless (advisory-only, easy to eyeball and dismiss), but the script could exclude the issue(s) the PR's body already says it Closes from its own conflict scan to cut this recurring noise.
    severity: nit
  - description: Confirming each survey candidate's fixed/drop status required manually grepping ~7 separate docs plus several `git log -S` calls — the survey subagent's own reported friction, carried over from a prior session's already-dropped nit (non-trivial fix, correctly left unaddressed).
    solution: No action taken this run (correctly dropped per the skill's own low-severity/non-trivial-fix rule) — logged again only because it recurred, in case the recurrence count itself becomes worth acting on.
    severity: nit
