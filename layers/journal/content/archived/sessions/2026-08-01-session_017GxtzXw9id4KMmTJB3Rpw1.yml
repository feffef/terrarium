frictions:
  - description: Ran `git reset --hard origin/main` to align the pre-existing branch before checking `git status` first, against CLAUDE.md's explicit pre-reset-hard checklist.
    solution: Run `git status` before any `git reset --hard` unconditionally, even when the branch looks freshly checked out. (Turned out benign here — no uncommitted work existed — but the sequencing was wrong.)
    severity: nit
  - description: Piped a long-running `pnpm gate:scoped` through `| tail -100`, which CLAUDE.md explicitly warns against since it loses the real command's exit status behind tail's.
    solution: Redirect long-running/state-changing commands to a file and check `$?` directly instead of piping through tail/head, per CLAUDE.md's own git-conventions guidance. (No actual harm — the background-task notification separately reported the true exit code — but the practice itself was the violation.)
    severity: nit
  - description: "Passed `run_in_background: false` to the Agent tool for all 4 lens-review agents and the fact-checker expecting synchronous foreground execution, but they all launched as background async agents anyway."
    solution: Treat Agent tool calls as background-by-default regardless of run_in_background, and plan for waiting on task-notifications rather than expecting inline results.
    severity: nit
