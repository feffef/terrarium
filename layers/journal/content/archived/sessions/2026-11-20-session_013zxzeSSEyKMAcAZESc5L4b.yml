goal: Rewrite the glassbox-curate Skill as a loop and an instruction session
status: completed
outcome: "PR #3537 merged by the owner; #3507 closed; #3530 closed as superseded"
summary: "Human-instructed throughout. The owner first asked me to read PR #3530, issue #3507, the tickets it links, the related friction clusters and the glassbox-curate Inventory observations. Then, at the owner's direction, I had one Sonnet agent analyse 14 days of curate sessions and their costs, and another blind-read the Skill on main. The analysis found 46 sessions; 11 of the 13 scheduled ones stopped after one PR. The blind read found that \"ends\", \"lands\" and \"improvise\" invite early stops and skipped steps. The owner then asked for a full rewrite with two modes. We settled it in a grilling of 27 numbered questions (Q1-Q27), and every design decision in the PR is the owner's answer to one of them: no argument means a loop over the memory page until the context is full; an argument means research, grilling, then building the outline unattended. Two more decisions came from the owner directly. The Scout moves to glassbox-update, and gaps rank second in the pick order. The details I chose myself: the shared \"Merging your PRs\" step, keeping one file instead of a reference.md split (the owner left that call to me), and the follow-on edits to the glossary, the lesson Skill, the diagram spec and the Inventory entries. The draft went through two blind reads, two full Standards and Spec code-review rounds and a Sonnet dry run of both modes on the real memory page. The owner swapped that dry run in for a third code-review round. Each pass found real contradictions: rule 5 forbade edits rule 6 expects; Instruction mode had no branch step and waited after each PR; the stop could leave PRs unmerged; a memory page merge could bring a solved item back. The owner also corrected two premises of mine. Only one session runs at a time, so a later focus needs no open-PR refresh. And a context compaction means the window is full, so it is a stop. gate:scoped and CI passed on b82d62f27, and the owner merged the PR, which closed #3507."
