frictions:
  - description: My first rewrite of glassbox-curate held real contradictions (rule 5 vs rule 6, Instruction mode without a branch step, unmerged PRs at a stop) that took five review passes to clear.
    solution: Run one blind dry run of a rewritten Skill on real state before the first code-review; it found in one pass what reviews found over several.
    severity: moderate
  - description: I assumed several curate sessions could run at once and added a per-focus open-PR refresh; the owner had to correct the premise.
    solution: "Ask how many sessions run concurrently before designing coordination between them (CLAUDE.md: question the premise)."
    severity: minor
  - description: I treated a context compaction as not a stop; the owner pointed out it means the window is full, so the first stop rule was wrong.
    solution: Check what a harness event means for the limit being set before writing a rule around it.
    severity: minor
  - description: I started gate:scoped twice and had to stop it both times because the owner's next edit came in mid-run.
    solution: In an interactive design session, ask whether more edits are coming before starting a long gate.
    severity: nit
  - description: Cancelling the safety-net check-in after the merge was denied by the auto-mode classifier, so it fires once on a merged PR.
    solution: Allow delete_trigger for a session's own send_later check-ins, or have the check-in stop itself when its PR is merged.
    severity: nit
