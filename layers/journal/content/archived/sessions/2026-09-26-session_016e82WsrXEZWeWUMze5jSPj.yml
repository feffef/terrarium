learnings:
  - sessionStorage is shared across every Tenant and Space (one origin), and Nuxt keeps its chunk-reload guard there, so a per-Tenant Reset must remove only its own keys, never call clear().
  - "A layers/<tenant>/package.json cannot scope a dependency to one Tenant here: no pnpm workspace, and even with one the module installs app-wide."
ideas:
  - "Add scripts/wayfinder-frontier.ts: given a map issue, list open sub-issues, parse each 'Blocked by:' line, and print the claimable frontier, since the MCP surface lacks native issue dependencies and every wayfinder session recomputes this by hand."
