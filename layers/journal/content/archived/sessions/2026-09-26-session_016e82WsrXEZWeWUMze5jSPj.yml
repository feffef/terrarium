frictions:
  - description: Ticket brief for the browser-state research cited ADR-0019's patched client DB loading as live; the ADR is Superseded (2026-07-16).
    solution: Check an ADR's Status line before citing it in a dispatch brief or ticket body.
    severity: minor
  - description: Research-branch commits by worktree subagents landed without the provenance trailer; the commit-msg hook fails open when the fresh worktree has no node_modules.
    solution: Have dispatch briefs run pnpm install before committing, or make the hook fall back to a dependency-free path.
    severity: minor
  - description: get_sub_issues on the map returned ~94K chars (full bodies) and overflowed to a file just to confirm 12 child numbers.
    solution: Verify sub-issue linkage via the parent's sub_issues_summary count, or a minimal-output query.
    severity: minor
  - description: Native issue dependencies have no MCP tool, so wayfinder blocking fell back to Blocked-by body lines; the frontier isn't visible in GitHub's UI.
    solution: Documented gap in github-integration.md; a small script parsing Blocked-by lines could compute the frontier.
    severity: nit
  - description: Research agents found nuxt.com, MDN, playwright.dev and reka-ui.com blocked by the proxy, not only JS CDNs; they fell back to GitHub source repos.
    solution: Record doc-site blocking and the raw.githubusercontent.com fallback in docs/agents/environment-caveats.md if absent.
    severity: minor
