frictions:
  - description: "agent-background-flag-guard denied my first Agent dispatch for passing run_in_background: false; one retry (now fixed by #1735)"
    solution: "Merged in #1735"
    severity: minor
  - description: "CLAUDE.md ADR trigger: I wrote re-triage verdicts and implementation briefs without reading the binding ADRs (0017, 0022, 0028, 0004) in full myself, and briefed guard changes before reading guards.md; the owner had to ask whether any ADRs were read"
    solution: Read binding ADRs and guards.md before writing any brief that edits their territory; require full ADR reads in every Explore brief
    severity: moderate
  - description: "My #868 resolution and #1730 brief called the Journal leak test ADR-0004 L2; it is L3 (isolation invariant). A reviewer caught it, costing one fix round and a correction comment"
    solution: Verify level/term definitions against the ADR before stating them in a brief
    severity: minor
  - description: My first deep-dive briefs checked only current code; the owner had to interrupt and ask for git history and session-log evidence, which overturned several triage conclusions
    solution: Re-triage investigation briefs should always require git history plus session-log occurrence counts
    severity: minor
  - description: Auto-mode classifier denied the guards-cluster dispatch twice as Self-Modification, even after the owner approved in chat; it ran only after the owner left auto mode
    solution: For guard or hook changes, ask the owner to leave auto mode before dispatching, instead of discovering the denial
    severity: moderate
  - description: I ran three full gates in parallel against dispatch-subagents' limit of two; three gate runs died with exit 137 and had to be rerun
    solution: "Stagger heavy-gate agents strictly: at most two at a time, including review-fix rounds"
    severity: minor
  - description: Three impl subagents ended without delivering a report (SubagentHandback refused outside auto mode), needing a SendMessage nudge each
    solution: Brief impl agents to end with a plain-text final report, not only SubagentHandback
    severity: minor
  - description: Agents shared the scratchpad, and one agent's commit-message files were overwritten by another session (caught, no damage)
    solution: dispatch-subagents already says to name artifacts uniquely; my briefs should name a per-agent scratch subdirectory
    severity: nit
