  - Session-log occurrence counts repeatedly differed from the counts quoted in issues (17 vs 7, 63 vs 25, 23 vs 13); recount before weighing any fix
  - Two-axis review found substantive defects in every multi-file PR, even after green gates, and PR descriptions went stale after nearly every fix round
ideas:
