learnings:
  - The owner-corrections script matches visitor-loop PRs only by a claude/visitor-loop-* branch name, so any run landing on the harness-pinned branch is invisible to its rework scan.
ideas:
  - Give midden-catalogue an Inventory entry (platform-operation, specialist) so the Inventory covers every on-disk own Skill; audit-skills only adds entries for Skills seen in use, so an unused sibling of midden-survey stays uncatalogued.
  - Make blog-post step 8 unambiguous, either owed (reader pass always runs, "none" is logged) or genuinely optional (drop its Done-when), because three of four runs skipped it while its Done-when reads as an obligation.
  - Teach scripts/owner-corrections.ts to recognise a visitor-loop PR by its session-log or PR-body provenance as well as its branch name, so a run landing on the harness-pinned branch still has its rework scan.
