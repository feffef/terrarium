frictions:
  - description: Agent calls were blocked by the dispatch-read guard, so the three visitor dispatches had to be repeated unchanged after reading the Skill.
    solution: Have visitor-loop step 2 name dispatch-subagents as a read-first, or let the guard accept the Skill's own briefs.
    severity: nit
  - description: search_issues was blocked by the fields guard five times in one parallel batch because I omitted fields.
    solution: visitor-loop step 3 could say to use list-open-issues.ts plus git log --grep rather than search_issues.
    severity: nit
  - description: A foreground sleep chain to wait for the build was blocked, costing a retry.
    solution: Start builds with run_in_background and wait with an until-loop from the first call.
    severity: nit
  - description: owner-corrections.ts listed seven candidates, all file-overlap reworks of unrelated Blog, Glass Box and Midden PRs; each still needed a tally line.
    solution: Ignore a rework candidate whose overlap is only a glossary or a path outside the run's focus Tenant, unless it names the visitor-loop PR.
    severity: nit
  - description: PR 2595's label check failed on a GitHub 504 before any logic ran; diagnosing it meant slicing a 57KB one-line job log.
    solution: Have the failure wake name the HTTP status, or let get_job_logs return only the last error line.
    severity: nit
