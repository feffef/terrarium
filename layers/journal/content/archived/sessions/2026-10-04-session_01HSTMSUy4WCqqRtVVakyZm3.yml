learnings:
  - A PR's recorded base at open time can postdate the branch's real fork point; `git merge-base --is-ancestor <fix> <first-branch-commit>` is the test of what a run actually saw.
  - "In this repo own Skills change almost daily: all twelve behaviour-checked Skills had landings during their runs in one 7-day window, so 'Skills rarely change' does not hold here."
ideas:
  - Have scripts/audit-skills.ts print `startedAt` per window session so a grader never has to open a log just to bracket a run against a Skill change; one field, no new git call.
  - Exclude per-run data files (visitor-loop's decisions.md) from a Skill's `changes` in scripts/audit-skills.ts, e.g. via a small per-Skill ignore list, so the stderr warning only fires for text or script changes.
