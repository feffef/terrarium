summary: "Human-instructed throughout. The owner asked for a Sonnet research agent on issue #1515 first, then a plain-language discussion. The research showed the issue's 2026-10-04 reopen rests on a wrong premise: the audit-skills sweep blamed the 2026-10-03 visitor-loop run (started 16:48Z) for ignoring PR #1570, which merged to main at 17:17Z; the run's branch base carries the old Skill text and no owner-corrections script. I re-verified that timing in git myself before relying on it. Same grading error that closed #1479 wontfix the day before. Offered three options; the owner chose to fix the grader, after a second Explore agent on the audit-skills instructions, session logs and git history. First I built a scorecard change (per-Skill SKILL.md landing times plus startedAt per session); the owner interrupted asking for one cheap git log instead, so I reverted it and shipped a prose-only step-2 edit (commit a0a3a816, PR #1591). On the PR the owner then asked for the check to live in the script after all: the scorecard now does one first-parent git log over .agents/skills and scripts, each Skill row carries `changes` since its earliest windowed run started, sessions carry `startedAt`, and the CLI warns per behaviour-checked Skill. Step 2's prose reads the field. A live run showed all twelve behaviour-checked Skills changed during their runs this window, so the warning is a nudge, not a signal. On the owner's ask I also posted the timing correction on #1515 (left open pending #1570's first live run) and corrected the visitor-loop Inventory role text and 2026-10-04 observation. Full gate passed locally and in CI; PR description and a reply on the review comment updated; the owner merged #1591 at 08:38Z. Open: #1578 (the same bullet's \"search open issues first\" half) is untriaged; decisions.md changes make visitor-loop's `changes` often non-empty, a follow-up if noisy."
