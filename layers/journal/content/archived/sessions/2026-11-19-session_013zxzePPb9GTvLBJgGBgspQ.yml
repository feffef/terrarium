frictions:
  - description: Edited clear-backlog, issue-tracker and domain.md before reading the ADRs those files' rules point to; a hook then demanded the read after each edit.
    solution: Read the governing ADRs before editing, or surface the rule when the checker's fix list names the file.
    severity: nit
  - description: Checkers found 17 of 26 reviewer findings WRONG, so most reviewer tokens bought nothing.
    solution: Tell reviewers to quote the whole rule list of a rewrite and to skip ADR-vs-code tensions that need an owner decision.
    severity: minor
  - description: Mistyped this session's id in a draft commit message file; caught when rewriting it from get_session before committing.
    solution: Copy the id from the commit template once into a scratch note and reuse it.
    severity: nit
  - description: audit-docs requires two PRs but the session instructions name one development branch; I cut a second branch for the escalation PR.
    solution: Say in audit-docs and the system prompt that the escalation PR gets its own branch.
    severity: minor
