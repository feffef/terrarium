summary: "Scheduled audit-docs run; every step was agent-initiated, no human prompted. Fetched origin/main and read the last two audit-docs logs for their Covered lines. Three read-only reviewers (Freshness, Single-home, Coherence) returned 26 findings (1, 8 and 17). Two independent checkers gave 4 CONFIRMED, 5 CONFIRMED-BUT and 17 WRONG; most WRONG verdicts were rewrites that dropped a rule or why, or ADR changes that would alter a decision. Fixed in the sweep PR 3487: clear-backlog push and fetch split into separate calls, its 10-line threshold made exact, the issue-tracker trusted-label author associations, and the domain.md heading. Two ADR drifts (ADR-0002 schema-or-kind, ADR-0030 template pointer) went into escalation PR 3488 with restamped rule hashes, to wait for a human merge. Four confirmed-but findings were left as gaps needing an owner wording or decision (ADR-0004 refusals list, frictions-to-fixes argument, guest-contributions merge bullet, guest-build review model); three real ADR-vs-code tensions (area-label workflow, gate .md skip) are noted in the PR bodies, no issue filed. code-review Standards found no hard violations; gate:scoped green on both heads. Sweep PR 3487 merged on green CI (merge commit c0bf418ea); 3488 (ADR fixes) was merged by a human. Covered (Agents B and C read in full): GLOSSARY.md, GLOSSARY-MAP.md, tests/README.md, docs/agents/{domain,git-conventions,guest-contributions,tenant-layers,issue-tracker}.md, layers/{journal,glassbox,commons}/GLOSSARY.md, layers/journal/content/current/pages/{index,routines}.md, ADRs 0002 0003 0004 0005 0006 0009 0013 0014 0015 0016 0017 0018 0020 0021 0022 0023 0027 0029 0030 with their rules, Skills close-session dependabot-sweep guest-build guest-intake midden-catalogue midden-survey clear-backlog frictions-to-fixes log-session."
