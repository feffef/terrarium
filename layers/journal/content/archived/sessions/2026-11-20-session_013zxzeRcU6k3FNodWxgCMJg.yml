frictions:
  - description: Ran git log before reading docs/agents/git-conventions.md, which CLAUDE.md requires first; the PostToolUse hook flagged it and I read it afterwards. The log only showed a commit hash.
    solution: Allow a single read-only git log -1 before the doc, or make the hint a PreToolUse block.
    severity: nit
  - description: "harvest evidence printed 3,625 lines for nine groups: each group's tracker block was about 260 issues because broad keywords match nearly every issue. I abandoned reading it whole and used targeted greps."
    solution: "Rank hits by distinct keywords matched and cap the list (filed as #3529)."
    severity: moderate
  - description: My first harvest-checks.md draft cited list-merges-since output I had not run for the first cluster; I only noticed when writing the Seedling and ran it, then softened the claim.
    solution: Write each evidence line right after the command that produced it, not in one pass at the end.
    severity: minor
  - description: Step 4 asks to read each source log whole; I read one log's authored half and the others' summaries only. I also stopped clustering at 12 of up to 30, so dropped-cluster checks are thin.
    solution: The harvest Skill could print each source log's authored fields in one command, so reading them whole is cheap.
    severity: moderate
  - description: Posted the first Seedling pass without a body check for angle brackets until check-body rejected a bare date placeholder; repaired before posting.
    solution: None needed; check-body worked as designed.
    severity: nit
