frictions:
  - description: Chained validate, commit and gate with && after a grep that matched nothing, then started a second gate while the first still ran; both shared a log and build, giving a false EXIT 1.
    solution: Run the gate alone with its own log file; never chain it after a grep. A pushed-gate note about shared builds in the dispatch docs would help.
    severity: minor
  - description: A Monitor whose until-loop used pgrep -f gate matched its own command line and would never end.
    solution: Wait on the gate's background-task notification instead of polling for process names.
    severity: nit
  - description: Called search_issues and ran git fetch/log before reading github-integration.md and git-conventions.md, which CLAUDE.md requires first; hooks reminded me afterwards.
    solution: Read both docs at the first GitHub or git step of a scheduled audit.
    severity: nit
  - description: Escalated findings mostly rest on subagent reports I spot-checked rather than re-derived; only the audit-docs guard conflict was verified from source.
    solution: The Skill could say how many findings to re-verify per issue filed.
    severity: minor
