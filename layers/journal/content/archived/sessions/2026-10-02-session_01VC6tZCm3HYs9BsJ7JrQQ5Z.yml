frictions:
  - description: Session rate limit (HTTP 429, resets hourly) killed the slice-D review agent mid-run and restarted the worker; resumed via SendMessage after the reset
    solution: Nothing in-repo; resuming the same agent id (not re-dispatching) preserved its scratch work. Worth noting in environment-caveats that a 429 can abort a subagent silently
    severity: moderate
  - description: Review subagents were refused the Write tool for findings-*.md in the scratchpad ('Subagents should return findings as text') and the subagent Bash guard blocked heredocs containing '&', so four of eight reports came back only as text for the orchestrator to re-save
    solution: Either let a subagent write to the orchestrator's scratchpad, or document that review briefs must ask for the report as the final text and the orchestrator saves it
    severity: minor
  - description: The explore brief had several wrong leads (tinkerfund F2 leads 2, 4, 6, 7; dialog mount sites counted 14, actually 16; blog/marquee 'near-clone' overstated); reviewers had to disprove them
    solution: Explore-agent briefs are leads, not facts; the review-rules file already said so and that framing is what kept the wrong leads from becoming wrong findings
    severity: minor
  - description: The Stop hook pressed to commit and push a half-applied working tree right after the user had explicitly paused the apply phase
    solution: The hook cannot know about a user pause; I reported the state and waited. A hook that only nags on a turn that ends without an open user question would avoid the contradiction
    severity: minor
  - description: A one-line comment edit I allowed one agent to make in another agent's file (midden find.ts) caused the only merge conflict between the six branches
    solution: Keep file ownership strict in parallel impl briefs even for comment-only edits
    severity: nit
  - description: A reviewer's suggested one-liner (readonly(markList) for a Ref) failed typecheck; the impl agent correctly fell back to the existing computed
    solution: Granting impl agents explicit authority to refuse a listed item worked as intended
    severity: nit
  - description: "SHELL-READ-DETECTION miss: a subagent's glob loop `for f in docs/adr/0001* docs/adr/0006* docs/adr/0021* docs/adr/0028*; do echo \"=== $f\"; cat \"$f\"; done` was rejected as 'not a reader command', so docs/adr/0001-single-container-baked-multitenancy.md is uncredited (0006/0021/0028 were credited by other commands); a sibling loop with `cat docs/adr/$f-*.md` WAS counted"
    solution: Teach the detector that a `for ... in <globs>; do cat "$f"` loop reads each glob's expansion, as it already does for the `$f-*.md` form
    severity: moderate
  - description: My first review-fix commit added 'factual correction' banners to ADR-0014/0025, but ADR-0018 says a pure factual correction is an in-place edit with no banner; the second review caught it
    solution: Read ADR-0018's editing section before touching any ADR, even for a one-line fact; the amendment-banner habit from other ADRs is for decision changes only
    severity: minor
