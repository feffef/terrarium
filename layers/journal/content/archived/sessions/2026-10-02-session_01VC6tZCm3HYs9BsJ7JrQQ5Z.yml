learnings:
  - For @nuxt/content generated item types, a schema with .default([]) fields matches z.input<> not z.infer<>; the journal and midden type mirrors only became deletable once that was verified with a scratch tsc run
  - Nuxt auto-imports export a layer's util/composable TYPES as ambient globals too, so relative import type lines of them are pure noise (42 across tinkerfund and midden)
  - Playwright waitForURL globs match the full URL, so they cannot replace an expect.poll on pathname-only or search-only conditions
ideas:
  - "File the unapplied proposal-tier findings as issues: fold modules/routing.ts and modules/catalog.ts into one derived-data module (ADR-0025 already sanctions it, -70 lines, and it stops the manifests being jiti-loaded a third time per build); delete the generic catch-all's non-pages collection dump, unreachable since every Tenant ships its own [space]/index.vue (ADR-0016 Consequences would need a one-line note)"
  - "Add a unit test that BIOMES (atlas) slug list equals Object.keys(routingMap.atlas), the way blog now derives PERSONA_SLUGS from the routing map: today a Space added to the manifest without a BIOMES entry silently vanishes from the atlas front door and the home page"
