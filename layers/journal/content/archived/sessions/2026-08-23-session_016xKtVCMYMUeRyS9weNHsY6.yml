learnings:
  - "Reading-based review and execution-based review find disjoint defect classes here: five audits found propagation gaps and contradictions; three dry runs found a targeting rule that authorised the wrong deletion, a verdict window measured from the wrong event, and a merge tier that would have merged guard code. None of the three was visible to a reader."
  - A Skill written to shrink prose grew 94 to 154 lines under three rounds of execution feedback — every line paid for by an observed failure. Accretion is not caused by carelessness; it is what happens when each fix is locally justified.
  - Two independent context-free audits of the same diff, same brief, found disjoint defect sets — the second caught the more dangerous one. For a change granting an autonomous Skill new authority, one audit pass is not enough.
  - A trial protocol can detect damage from a removed rule but never from a removed capability — nothing fails when a Skill stops running, so silence reads as success.
ideas:
  - "A PreToolUse or CI check that flags a PR re-adding prose on a topic with an open entry in .agents/prune-trials.yml. The CLAUDE.md note asking sessions not to re-legislate a pruned topic is itself prose, in a repo whose own regression issues (#772, #1018) show prose rules of exactly that shape don't hold — so the coordination rule that makes trials work is the least defended part of the design."
