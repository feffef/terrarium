learnings:
  - Routine run records are capped at 30 per Routine (RUNS_KEPT), so the oldest and often most expensive rows are dropped and trends cover only the survivors.
  - Routine cost tracks cache-read tokens, not wall-clock time; a 6.6 hour audit-docs run cost only $12.
  - A platform-wide cost step on one date across all Routines points to a model or environment change; check the sessions' models field before attributing it to a Skill edit.
  - A page component can provide data with provide/inject so MDC blocks, which take only a Routine name as a prop, can read one shared collection load and one shared metric state.
ideas:
  - Have the weekly explanation routine for the Routine costs page also re-check that every Routine in the collection has a chart block in routines.md, and file or fix the gap, so a new Routine never silently misses a chart.
