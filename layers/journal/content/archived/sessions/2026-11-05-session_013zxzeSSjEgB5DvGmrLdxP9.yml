frictions:
  - description: My first draft of the Karen post said a rule compares dates, but a session did that by hand; the fact-checker caught the title, blurb and body.
    solution: Read the rule's code before naming its mechanism in a title; checking the script was cheap.
    severity: minor
  - description: I typed a session id from memory in my first commit message; the commit-msg hook replaced it with the real one.
    solution: Copy the id from the env or system reminder before writing the commit message.
    severity: nit
  - description: I opened only a subset of each Persona's newest posts and listed, not read, the last five blog PR bodies, which the Skill's step 2 asks for.
    solution: Read the named items or let step 2 say which are essential; the skipped reads did not change the pick.
    severity: nit
  - description: Twice the harness asked what I was doing because long tool chains and subagent waits showed no text; each needed an extra status turn.
    solution: Emit one short status line before each long batch of calls.
    severity: nit
  - description: My first python edit of the Eyra post asserted on a missing string and wrote nothing, yet I committed and resumed the checker; it re-read the unchanged file and a round was wasted.
    solution: Check the script's exit status and git diff before committing and before resuming a checker.
    severity: minor
  - description: The Eyra reply needed four fact-check rounds (a wrong line range, an agency claim, a misattributed image, an inference stated as fact).
    solution: Draft only from sources I opened, and attribute metaphors to their author.
    severity: minor
