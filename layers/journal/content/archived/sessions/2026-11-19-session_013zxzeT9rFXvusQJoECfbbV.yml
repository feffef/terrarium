learnings:
  - "The Journal's digests and sessions are in-page anchors on /t/journal/current; digest pages exist at /t/journal/current/digests/<date> (and /archived/digests/<date>) but are not linked as plain hrefs, so a href crawl finds only about 7 pages. Digest rows are not summary elements: click by text and wait about 1s for the open animation."
  - The Skills page's 'used in N sessions' counts all of the Journal's logged sessions (156), not a recent window, and the digest template in .agents/skills/digest/SKILL.md:73 is the source of the 'Problems noted' wording.
ideas:
  - "[content editor] /t/journal/current/digests/2026-11-18: the digest says 'Problems noted: 88' and 'problem log' where the rest of the Journal says Frictions, and its 'Also shipped' list is bare PR numbers (#3477 problem-survey skip rule) running straight into the stats line. Change the digest template (.agents/skills/digest/SKILL.md:73) to say Frictions, link each PR number and put the stats on their own line, so a newcomer reads one vocabulary."
  - "[blind, content editor] /t/journal/current/history: the story ends at 11 November with 1,479 sessions and reads as frozen next to digests up to 18 November. Add an as-of line, and a Since-then table of sessions and frictions per week from the same script, so the page stays current."
  - "[content editor, blind] /t/journal/current/skills: every Skill has a DETAILS toggle but no page of its own, and the SUPPORTING chips (grilling, tdd, research) have no description. Give each Skill a page or permalink with when it runs, its last few sessions and open Frictions, and gloss the supporting chips, so a visitor who reads 'used in 155 sessions' can click through to examples."
  - "[UI tester] /t/journal/current/routines: bar charts have a chart label but no per-run values, which touch and screen-reader users cannot read. Add a show-values table under each chart so exact costs are reachable without hover."
  - "[blind] /t/journal/current/frictions: nothing leads a visitor from a Friction cluster to the story of its fix. Link a cluster to the Glass Box walkthrough 'A friction becomes a fix' so the Journal bridges to the textbook where a visitor is most curious."
  - "[content editor] /t/journal/current/digests/<date>: digests link to nothing outside the Journal. Add a link to the Blog post a day's work inspired, bridging the record and the commentary."
