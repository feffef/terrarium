frictions:
  - description: Ran git fetch origin main before reading docs/agents/git-conventions.md; the hook told me to read it afterwards. The fetch was harmless.
    solution: List fetch among the read-only commands in CLAUDE.md's git trigger, or let the visitor-loop Skill say its fetch needs no prior read.
    severity: nit
  - description: "Read docs/agents/triage-labels.md only after filing issue #3498; the hook reminded me after the write. The labels were right."
    solution: visitor-loop step 4 should name triage-labels.md beside issue-tracker.md so it is read before filing.
    severity: nit
  - description: The context file's pages section gave the Journal's routes, but both informed visitors still crawled only 7 pages because digests and sessions open as in-page anchors; each wrote extra scripts.
    solution: In .agents/skills/visitor-loop/SKILL.md step 2, have the context file mark which routes are reachable only by anchor or typed URL, and let the brief say what to do when a Space has fewer than 10 pages.
    severity: minor
  - description: visitor-brief.md says one 390px screenshot of each kind of page without naming the kinds; the UI tester took 10 and viewed 4, the editor took none.
    solution: In .agents/skills/visitor-loop/visitor-brief.md, list the page kinds (landing, ledger, chart page, digest) or cap screenshots.
    severity: nit
  - description: Two visitor claims were false (routines bars lacking aria; skills 0 sessions read as a 7-day window) and passed to me unchecked; only my own source and DOM checks caught them.
    solution: Ask visitors in visitor-brief.md to quote the element or text that backs each accessibility or count claim.
    severity: minor
