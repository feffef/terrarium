summary: "Scheduled visitor-loop run, no human prompt. Focus: journal (entry /t/journal/current; row 2 of the rotation for 2026-11-19). Built origin/main (1ed36208), served a production preview, wrote a context file and sent a blind first-time visitor, an informed content editor and an informed UI tester (all sonnet). Yield: blind 8 findings and 3 ideas, editor 10 findings and 3 ideas, UI tester 6 findings and 3 ideas. After checking each against source and the rendered page, 1 bug group survived (Friction Ledger: 75.6x23.2px select, 34x14 and 54x14px PR links at 390px, hover-only strips with no aria; issue #3498). Dropped as not reproduced: routines charts lacking aria (each svg has role=img and a label), skills \"0 sessions\" read as a 7-day window (the page counts all 156 logged sessions), no next digest link (11-18 is the latest digest), the /skills/close-session 404 (no such route), history page stale (a dated story whose landing blurb says up to mid-November, so not false). Dropped as already logged: jargon legend, skip link, frictions intro, routines window, KPI tile wrap, ideas page filter. The \"Problems noted\" wording comes from the digest Skill template (SKILL.md:73), so it is an idea, not a bug. Filter misses: two visitor claims (aria on bars, 7-day window) were wrong and caught only by my checks. Retros: all three said the Journal has only about 7 to 10 routes, below the brief's 10 to 20 pages, and that digests and sessions open as in-page anchors; each asked for a line in the context file saying which routes are anchor-only or typed-URL. The blind visitor also wanted a \"fewer than 10 pages: follow outbound links\" line in visitor-brief.md; the UI tester wanted the brief to say which page kinds get a 390px screenshot. Everything here was agent-initiated by the schedule; no human instruction."
