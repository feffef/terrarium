frictions:
  - description: Ran my first git command before reading git-conventions.md; the PostToolUse hint arrived only after it, though the call was read-only.
    solution: Fire the git-conventions hint before the first state-changing git command, not after any git call.
    severity: nit
  - description: Typed a wrong session id in the commit trailer; the commit-msg hook replaced it with the correct one.
    solution: Let the hook add the trailer instead of hand-typing it.
    severity: nit
  - description: The audit-skills Skill asks for a subagent per Skill (14) plus a usage agent; reports repeated the same hook-hint and unrelated-rule noise, so reading them cost many tokens.
    solution: Have the brief ask checkers to omit rule and doc verdicts that read "no" and to cap the report.
    severity: minor
  - description: Edited the authored log to completed and ran --author before re-invoking close-session after the merge; it refused, costing one retry.
    solution: Re-invoke close-session first whenever merge-pr.ts prints merged, as the hook says.
    severity: nit
