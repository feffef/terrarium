frictions:
  - description: Reflexively called ScheduleWakeup (built for /loop dynamic-pacing mode) while waiting on a background dispatch agent in this plain scheduled Routine session, immediately after the tool's own description says it's for /loop. Caught before it fired anything wrong and cancelled it.
    solution: Background Agent/task-notification completion already wakes the session automatically; a scheduled-Routine session waiting on a background agent needs no explicit wakeup mechanism at all. Reread the tool description's first sentence before reaching for it out of habit.
    severity: nit
  - description: pull_request_review_write(event=APPROVE) fails with "Can not approve your own pull request" when the reviewing session's GitHub token is the same account that opened the PR (the repo owner's account, since both the impl-agent's PR and this session's review post under the same identity) - true for every frictions-to-fixes reviewer-agent run, not just this one. docs/agents/pr-workflow.md's step 4 doesn't warn about this; had to fall back to event=COMMENT to record the verdict.
    solution: Add a note to pr-workflow.md's step 4 (or the reviewer-agent tier entry) that a self-authored PR under the same account can't be formally APPROVEd - use event=COMMENT (or add_issue_comment) for the verdict instead, and don't treat the APPROVE error as a real blocker.
    severity: minor
  - description: "The survey subagent's own friction, relayed here per the Skill's instruction: its first session-frictions.ts call was piped through `| head -500`, which is the exact anti-pattern CLAUDE.md already warns against, and it truncated the persisted output mid-JSON-object. Re-ran with a plain redirect and no data was lost, but it's a repeat of a documented mistake."
    solution: No new fix needed - CLAUDE.md already states the rule (never pipe a long-running/large command through a trailing command). This is a single-session lapse in following it, not a doc gap; logged for the recurrence count only.
    severity: nit
