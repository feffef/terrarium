frictions:
  - description: Ran git status, the digest list and gather before reading git-conventions.md as CLAUDE.md orders; a hook pointed to it afterwards. All were read-only.
    solution: Allow the read-only first commands the doc already names, or make the hook fire before them.
    severity: nit
  - description: The Stop hook asked five times to push while review and the gate were pending, against ADR-0004's hold-the-push rule; I declined each time.
    solution: Have the Stop hook skip when a branch has not yet passed review and gate.
    severity: minor
  - description: My first draft called the Glass Box run an overnight-style and then scheduled pass, inferred from titles, not session kind; the fact-check caught it.
    solution: Check run kind in the session log before describing how a run started.
    severity: minor
  - description: Draft said eight guide pages reworded, copied from the session outcome; the diff showed seven with non-pin changes, so the fact-check made me drop the number.
    solution: Verify counts from a session outcome against the diff before writing them.
    severity: minor
  - description: I omitted PR 2836 from Also shipped because its session said left open; git showed it merged.
    solution: Cross-check the gather PR list against merge commits, not session outcomes.
    severity: nit
  - description: After the merge I authored a completed log before re-invoking close-session, which log-session refused; one wasted call.
    solution: Have the merge-pr.ts output remind to run close-session before authoring.
    severity: nit
