learnings:
  - esbuild's keepNames (tsx's default) injects a `__name` helper, so a function passed to Playwright's page.evaluate throws in the browser; pass the body as a string instead.
  - A style injected with page.addStyleTag needs !important to beat a Vue SFC's scoped rule, which carries a [data-v-…] attribute selector on top of the same classes.
ideas:
  - "Add scripts/probe.ts next to screenshot.ts: take a route, an optional CSS override, and a JS expression, and print the evaluated result as JSON. Every layout-debugging session so far has hand-rolled this and deleted it; a committed version would also be the natural place to encode the string-not-function page.evaluate rule so nobody rediscovers __name."
  - "Teach the gate (or a validate:content check) to flag an e2e assertion whose threshold is derived from live content volume. Both #760 and #906 were the same defect class — a content-dependent quantity frozen into a test as an invariant — and each cost a red gate on an unrelated content PR before anyone noticed."
