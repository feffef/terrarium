frictions:
  - description: "A re-run of an old workflow run on PR #905 reported red AFTER the fix merged, because re-running re-checks-out the merge commit from the original run's base."
    solution: Never read a re-run as testing current main — check the run id and the test count against the post-fix expectation. Only a branch update recomputes refs/pull/N/merge. Worth adding to docs/agents/github-integration.md next to the existing "CI tests refs/pull/N/merge, not the branch" note.
    severity: major
  - description: An ad-hoc Playwright probe compiled by tsx threw "__name is not defined" inside page.evaluate — esbuild's keepNames injects a helper the browser lacks.
    solution: Pass the evaluate body as a string instead of a function. Worth a line in docs/agents/verifying-ui-changes.md, which covers ad-hoc probes but does not mention this (grepped — no hit for __name, keepNames, or evaluate).
    severity: moderate
  - description: Measuring computed geometry on a route needed a throwaway probe written into the repo root, because a scratchpad file cannot resolve playwright-core.
    solution: A scripts/probe.ts alongside screenshot.ts, taking a route plus an expression to evaluate, would have made this a one-liner and left nothing to clean up.
    severity: minor
  - description: 'Issue #906 offered three options but its framing ("the invariant has regressed again") pointed at restoring it, which measurement showed was never viable.'
    solution: Measure the live page before accepting an issue's causal framing — the report was right about the symptom and wrong about the invariant ever holding.
    severity: nit
