summary: "The user asked to fix issue #906 — a `ready-for-human` bug where the journal dashboard's \"Sparks drives the digests+Sparks band height\" e2e guard failed, blocking routine `/digest` self-merges. That ask was the green light for the design call #906 and #760 both left open. Measuring the live page showed the guard asserted a property of the day's content as a layout invariant: one spark item wraps to 254.8px in the narrow column and the feed is windowed to 3 days, so Sparks swings from ~90px to thousands while digests sits at ~1040px — the driver is near a daily coin flip, and both #597 and #760 had pinned opposite sides of it. Fixed by decoupling rather than restoring: the sibling-collapse pin guard is now width-parameterized and runs at 900px and 1280px, the desktop run bounding Sparks so digests necessarily drives, plus a third assertion keeping that fixture honest. index.vue's three comments now describe both regimes as correct. All agent-initiated within the user's ask. After the merge, on two further user asks, unblocked the PR queue: rebased #905, #910, #911, #912 onto the fixed main — all four now green."
