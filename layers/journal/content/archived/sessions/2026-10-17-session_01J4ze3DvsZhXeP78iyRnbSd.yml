frictions:
  - description: Ran git branch --show-current before reading git-conventions.md, though CLAUDE.md allows only status and diff first; the hook then reminded me.
    solution: Use git status alone, which already prints the branch.
    severity: nit
  - description: Survey brief says --unledgered drops carried frictions, yet 7 blocks for sessions already in a cluster reappeared and only surfaced at validate time (survey agent's friction).
    solution: Have the brief say to skip a session already present in the target cluster, or filter by session in the script.
    severity: minor
  - description: Skill §5 puts the ledger PR before dispatch, but its gate:scoped, code-review and the regression-issue count rules left unclear whether a data-only diff needs the full code-review run.
    solution: State in §5 that a ledger-only diff is reviewed by the main session's own read, per the pr-workflow skip rule.
    severity: nit
  - description: A cd into an impl agent's worktree left my shell there; the next merge-pr and ledger edits ran in the wrong checkout until the harness noted it.
    solution: Use absolute paths or git -C instead of cd when inspecting a worktree.
    severity: nit
