frictions:
  - description: visitor-brief.md says follow links across 10-20 pages, contradicting an owner focus of exactly five pages; had to override it via the NOTE slot
    solution: Let visitor-brief.md's page-count and roaming sentences yield to the focus note when a Skill argument narrows the scope
    severity: minor
  - description: visitor-loop names its branches claude/visitor-loop-fixes-<date>, but the cloud harness pins one designated session branch and forbids others without permission
    solution: Say in visitor-loop SKILL.md that a harness-designated branch wins for the fix PR; the feature PR then needs owner OK for a second branch
    severity: minor
  - description: "History table fix took three build cycles: the in-browser trial swapped header text, so I missed that 'Sessions/week' cannot wrap, then desktop overflowed after renaming headers"
    solution: Trial a layout fix with the exact content you will ship, at both 390 and 1280, before editing
    severity: minor
  - description: gate:scoped e2e failed because journal.e2e.ts asserts the exact string class="jd", so adding a modifier class broke two tests
    solution: Assert the themed wrapper with a class-token match rather than an exact attribute string
    severity: minor
  - description: A playwright probe in the scratchpad could not import playwright-core (resolution is relative to the script dir, outside the repo); needed an absolute node_modules path
    solution: Note in verifying-ui-changes.md that scratch probes must import playwright-core by absolute repo path or live under the repo
    severity: nit
  - description: One probe run reported 0 rendered width for all desktop diagrams; a re-run showed correct widths, so a measurement can silently read before layout settles
    solution: Wait for networkidle or the diagram's layout before measuring
    severity: nit
  - description: The sonnet visitor reported that Twelve Stories links none of its posts, but all twelve titles are links; a blind finding that would have been a wrong fix without verification
    solution: Keep verifying every finding against the rendered DOM, as the Skill requires
    severity: nit
  - description: "PR #1563 was merged by the owner about six minutes after opening, before the review verdict comment the recipe requires was posted; the verdict landed after the merge"
    solution: Run /code-review before opening the PR (or open as draft) so the verdict is on the PR by the time a human might merge it
    severity: minor
