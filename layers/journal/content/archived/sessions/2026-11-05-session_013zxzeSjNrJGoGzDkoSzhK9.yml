frictions:
  - description: Started pnpm gate:scoped before code-review finished, then edited files, so that gate run was wasted. pr-workflow says review first, gate last, edit nothing during it.
    solution: Run the gate only after review fixes are committed, as the PR workflow says.
    severity: minor
  - description: Adopted a subagent reviewer's claim that the generic comma was unneeded in a .vue arrow function without checking it; the next gate went red at lint.
    solution: Run lint or typecheck on the reviewer's suggested edit before accepting it, as CLAUDE.md asks for any subagent claim.
    severity: moderate
  - description: Removed decodeURIComponent on route.hash assuming vue-router decodes it; unchecked, and no test covers deep links.
    solution: Check the router's behaviour, or add a deep-link e2e test.
    severity: minor
  - description: A Bash call with run_in_background and a trailing & was blocked by the double-background guard.
    solution: Pass run_in_background alone with a plain foreground command.
    severity: nit
  - description: Took no screenshot of the rendered page; the UI was checked only through the e2e test and counts from SSR HTML.
    solution: Run scripts/ui/preview.ts shot on the built page before the PR.
    severity: minor
  - description: Realised only after CI went green that the deep-link auto-expand was untested behaviour (an ADR-0004 human-merge condition); needed another test, gate run and CI cycle.
    solution: When adding behaviour, ask at build time which part no test observes and cover it before the first gate run.
    severity: minor
