learnings:
  - In this repo's ADR convention, "Decision and Consequences are never rewritten" (ADR-0018) applies per-block, not just to an ADR's original top-level sections — a later dated amendment's own "**Decision.**"/ "**Consequences.**"-headed prose is equally off-limits to a prune; only the narrative/investigative prose around those blocks (a "why revisit", "the problem", "the gap" preamble) is prunable.
