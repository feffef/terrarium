learnings:
  - A dispatched subagent's PreToolUse payload carries agent_id/agent_type; its env and transcript_path are the parent's — payload fields are the only subagent discriminator.
  - Hook scripts are re-read from disk per invocation even though hook CONFIG loads at session start, so a temporary edit to an installed guard script is a live, reversible instrument.
ideas:
  - Teach check:worktrees to also warn when a linked worktree's branch has a gate log ending mid-run (marker-file convention), giving orchestrators a cheap post-hoc stall signal to complement the new call-time guard.
