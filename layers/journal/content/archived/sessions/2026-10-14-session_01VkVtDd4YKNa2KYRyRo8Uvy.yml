summary: "The owner asked (via /wayfinder) to work the HITL grilling ticket \"Glass Box: content model and navigation\" on the Glass Box map. I claimed it, read the three earlier resolutions, checked the Platform facts that bind it (only `pages` is routed, a page reads only its own Space per ADR-0006, the root page per ADR-0016, payload navigation per ADR-0028), then grilled the owner over three rounds. The owner decided every point: one Space `guide` with subjects as folders (overriding their earlier lean towards one Space per subject, because Walkthroughs cross subjects), one subject per tool (10 subjects), Claude Code and the Skill pack kept separate, `walkthroughs/` folder, no type or subject fields, numeric filename prefixes for order, a reference rather than a course, a landing page with Start here plus a subject directory, Lessons listing the Walkthroughs that link to them (derived server-side in useAsyncData, no new endpoint, which I verified when the owner asked), and sidebar, TOC placement and prev/next reach handed to the Claude Design pass. Walkthrough count is provisionally 11. Agent-initiated parts: the recommendations themselves and the map's new fog line for Glass Box's own glossary. No code, branch commits or PR."
