summary: "The owner launched /wayfinder on map 1965 to work the HITL prototype ticket on what a Glass Box Lesson and Walkthrough look like (human-instructed). I claimed it, asked three upfront questions (examples, skip-ahead, length), then drafted two real Lessons in opposite orders (concept first vs Terrarium first) and one Walkthrough, checking each claim against the repo (validate-content.ts, ADR-0029, the Friction Ledger, issues 241 and 814). The owner chose concept first, accepted the sections and the Walkthrough, and called the frontmatter overengineered: we cut it to title and description (built into Nuxt Content pages) and deferred the rest to the content-model and accuracy tickets. Drafts live on the throwaway branch prototype/glassbox-page-shapes, never merged and with no PR, per the prototype and wayfinder Skills. Agent-initiated: the choice of a Terrarium-first alternative to compare against, and closing the ticket and editing the map once all four questions were answered. Research tickets 1966 and 1967 were left alone as instructed."
