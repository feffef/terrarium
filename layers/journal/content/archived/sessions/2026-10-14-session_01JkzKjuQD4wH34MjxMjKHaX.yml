  - description: Made my first GitHub calls before reading github-integration.md (CLAUDE.md read-first); get_sub_issues overflowed exactly as that doc warns.
    solution: Read the doc before the first mcp__github__ call; a guard or hint at the first GitHub call would catch it earlier than the PostToolUse reminder.
