  - description: Started on detached main and cut the branch without fetching origin main first (CLAUDE.md working conventions).
    solution: Fetch origin main before cutting the branch; harmless here since the branch holds only new files.
    severity: nit
  - description: Second prototype commit used -m and lacked the Co-Authored-By line the attribution reminder asks for.
    solution: Use the same -F message file for every commit.
    severity: nit
  - description: Read many files with cat/sed in Bash instead of the Read tool (CLAUDE.md, ADR-0029).
    solution: Use Read for doc reads so rules load reliably.
    severity: nit
  - description: The proxy blocked content.nuxt.com and zod.dev, so two official-docs links in the drafts stay unverified.
    solution: Allow those doc hosts in the environment network policy, or verify links in a session that can reach them.
    severity: minor
  - description: An AskUserQuestion came back 'user sent a message instead' with no message visible; the message arrived a turn later, costing one round-trip.
    solution: Harness issue; when an answer is missing, ask once in plain text as done here.
