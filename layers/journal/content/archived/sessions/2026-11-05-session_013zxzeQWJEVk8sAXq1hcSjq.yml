learnings:
  - A transcript's assistant records repeat per content block with one message id; the last record per id holds the final usage, so dedupe by id keeping the last.
  - The harness gate (gate:scoped) aborts if HEAD or the tree changes during its run, so a local commit mid-run costs a full re-run.
  - get_session returns cumulative cache_read, cache_write, input and output tokens plus cost_usd, with no 5-minute versus 1-hour write split, so rates cannot be fitted from it alone.
ideas:
  - Store the lead-session transcript path and a cost-state sample in the glassbox-improve scratch at the first record, so price calibration against costUSD can run in the next run instead of being a manual check.
  - Add usage and cost_usd to list_sessions rows, so cost calibration and run comparisons need one call instead of one get_session per session.
