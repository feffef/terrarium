outcome: "PR 2868 merged by the owner: cap of 8 per run and cost split anchored to costUsd; untested on a real run"
summary: "Human-instructed: the owner asked to implement issue 2850 (per-phase cost in runs.yml) and, in parallel, to limit the cost of each run by limiting the changes done per session. The owner's preference was to be asked first, so I asked: the cap counts pages per run, is enforced in grades.ts, ships in the same PR, and I should research before proposing numbers. The owner interrupted me to say only v3 runs count as evidence, chose 8 (I proposed 12) with false claims counting and coming first and steps inside the same budget, approved opening the PR, asked what calibrating the prices needs, told me to fit the prices from recent sessions, then chose option 1 (anchor the split to costUsd) and told me to build it. The owner merged the PR; I did not, because I recommended a human merge (record's wiring is unobserved by any test). Agent-initiated: the shape of costBreakdown and the phase-mark names, the dispatch-name convention in SKILL.md, putting steps right after false claims in the cap order, keeping raw token counts next to the anchored dollars, and the review fixes. The first version priced tokens with list prices from the claude-api Skill; a comparison with get_session cost_usd on ten sessions showed those prices 1.0x to 1.6x too high and a fit of the rates unstable, so I rebuilt it: tokens by class, estimated % shares by relative weight, and usd only as share times the recorded costUsd. I had called the counts exact and then checked them against get_session (cache read -2%, write +2%, output +14%, input differs), so the claim was removed. Two code-review rounds found a real bug (the lead curve counted from the transcript start), a NaN --cost and leftover wording, all fixed. Still open: nothing has run on a real glassbox run, the lead-versus-agents split depends on uncalibrated weights, and issue 2850 stays open since the PR only relates to it."
