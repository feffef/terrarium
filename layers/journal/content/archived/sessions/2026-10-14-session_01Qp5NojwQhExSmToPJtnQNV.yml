summary: "Human-instructed: the owner invoked /wayfinder on the Glass Box map to work the ticket \"Glass Box: write the spec\" from the resolution comments of seven closed tickets, settling conflicts with them first. I read all seven resolutions, checked what a new Tenant touches (the Tinkerfund skeleton commit, tenant-layers rule, Human-only list) and asked the owner two rounds of questions. One real defect surfaced while checking: #1971's inline `:source` would never reach a component, because `source` is a native HTML tag and MDC's renderer skips component lookup for HTML tags; the owner chose `:file`. The owner then changed the deliverable: instead of build-ready sub-issues, an intermediate spec to import into Claude Design (issue #1985, a design brief plus a build frame with draft stories and human-merge marks), a soft launch with no Platform links, and #1966's six seeds. Agent-initiated within that direction: the two new map tickets (Claude Design pass #1986, write the build spec #1987, blocked by #1986), the map's Decisions/Not-yet-specified/Out-of-scope edits, and not making the spec a map sub-issue (it would pollute the frontier query). No code, no PR."
