frictions:
  - description: Standards review caught a real regression in PR 1717 (half-failed install then lockfile revert skips reinstall) that the spec review and the impl agent both missed
    solution: For untested shell/runtime fixes, brief the impl agent to trace failure-then-revert sequences by hand before opening the PR
    severity: minor
  - description: Agent Briefs from triage invited fragile shapes (restating pending status in an ADR, correcting a hard-coded count) that review then simplified away, costing a fix cycle each
    solution: Triage briefs should prefer pointing at an existing home over restating a fact; add that as a line in the triage AGENT-BRIEF principles
    severity: minor
  - description: Fresh agent worktrees lack node_modules, so the first gate run in several agents failed with tsx not found before pnpm install
    solution: State pnpm install as an unconditional first step in impl briefs, not 'if missing'
    severity: nit
  - description: The ADR-0003 dependabot claim also lives in .github/dependabot.yml's header comment ('auto-merged'), left stale because the brief put the config out of scope
    solution: File a follow-up to fix the dependabot.yml comment once PR 1713 lands
    severity: nit
  - description: "check-triage-drift.ts flagged #1693 as drift because its ready-for-human comment says the issue 'can move to ready-for-agent' once a design is picked"
    solution: Have the drift phrase matcher ignore conditional/future phrasings, or teach triage comments to avoid label names in conditional sentences
    severity: minor
  - description: Subagents hit 403s on gh GraphQL and the search API during redundancy checks and fell back to REST listings, so open-issue duplicate searches were weaker
    solution: Already documented in github-integration.md; brief subagents to use list-open-issues.ts plus local grep up front
    severity: nit
  - description: Local checkout was behind origin/main; one subagent noticed and used git show origin/main, others may have read stale files
    solution: Have auto-triage fetch origin main once before dispatch and tell subagents to verify against origin/main
    severity: minor
  - description: My git-conventions.md read was cut off by a head -200 pipe before subagents ran git log/show (CLAUDE.md read-before-git rule); harmless here as all git use was read-only
    solution: Read required docs with the Read tool, not a truncated cat chain
    severity: nit
  - description: PR 1714 hit a merge conflict after an audit-docs concision sweep rewrote the same Skill while it waited for review
    solution: Resolved by a merge commit re-applying the intent on main's text; parallel Skill-touching PRs should expect this and keep diffs minimal
    severity: nit
