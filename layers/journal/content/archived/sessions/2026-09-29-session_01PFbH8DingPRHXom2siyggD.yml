summary: "The session opened with a bare \"Ok\", so I asked what to do. The user then invoked /tinkerfund-campaign twice. Both times, following their preference to be asked first, I surveyed the catalog with crowd.mjs and asked them to choose the invention, state and Inventor. For TF-0024 they picked the Passport Presence Monitor (Live, just funded, reuse an Inventor); I chose Priya Raman. PR 1491 was merged by a human. For TF-0025 the user rejected my first four invention ideas with \"Try harder\". The second set, each with a sample line of page copy, landed: they chose the Jet Lag Rehearsal Lamp, ending soon and already funded (a state the catalog lacked), by an existing Inventor. I picked Lucía Ferrer, a clockmaker. I extended the Home e2e assertion on purpose to expect the Lamp in Ending soon, after checking that Home's Ending soon section has no cap. Each time a Fable subagent in a worktree drew the figures; I reviewed its sheets before merging, and corrected one caption that named the wrong shade. Both runs passed the full gate and I checked screenshots in both themes. PR 1496 opened automatically per ADR-0003, and a human merged it."
