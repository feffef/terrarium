frictions:
  - description: Read several Skill and rule files with cat in Bash instead of the Read tool, against CLAUDE.md's Read-tool rule
    solution: Use Read for instruction files; shell only for listings
    severity: nit
  - description: dispatch-subagents says impl agents can't run code-review (no nested subagents), but the user brief said each implementer runs it; orchestrator ran it instead
    solution: Have implement/SKILL.md or dispatch-subagents name this split explicitly
    severity: nit
  - description: First plan landed stories on main per the kickoff; the user then redirected to an integration branch, a costless change only because no PR had opened yet
    solution: For a multi-story spec with Human-only stories, propose an integration branch up front
    severity: minor
  - description: Writers twice reported the integration branch 'up to date' from a stale origin ref; a bare git fetch in a linked worktree updated only FETCH_HEAD
    solution: In dispatch briefs, fetch with an explicit refspec and check rev-parse, or have the orchestrator verify merge-base ancestry before opening each PR
    severity: moderate
  - description: Parallel content PRs conflicted repeatedly on shared Where next lists and Opening a page chips; keeping both sides re-grew lists past the cap
    solution: Cap Where next and stop chips in the contract from the start (now done), and merge content PRs serially
    severity: moderate
  - description: merge-pr.ts refused PR 2047 because I had not posted a verdict comment yet
    solution: Post the verdict when opening the PR, as pr-workflow step 4 says
    severity: nit
  - description: A usage-limit stop killed five running subagents mid-task; each had to be resumed by message after the reset
    solution: None needed beyond resuming by SendMessage; work was banked in commits
    severity: minor
  - description: Content PRs got a content review by subagent instead of the code-review Skill before their first push
    solution: Have pr-workflow name content review as the review for content-only Glass Box PRs, or run code-review too
    severity: minor
  - description: Read scratch logs and review briefs with cat/tail/head in Bash rather than the Read tool
    solution: Use Read for any file whose content matters
    severity: nit
  - description: Did not collect rule and doc verdicts from the roughly 40 subagents; their rules show as unknown in this log
    solution: Ask each writer for verdicts in its hand-back template so no extra round trip is needed
    severity: minor
