outcome: "Measured imports.scan:false (626 typecheck errors, 163 names, 100 files) and filed issue #1580 with a draft ADR-0029"
summary: "Human-instructed throughout. The owner first asked whether the \"42 redundant relative import type lines across tinkerfund and midden\" were already addressed: PR #1539 (merged today) removed them, and 13 ambient-type import lines remain in tinkerfund's composables/utils (verified against .nuxt/types/imports.d.ts). The owner then asked whether auto-import is helpful at all, since they find it confusing. I laid out pros and cons and, on request, explored `imports: { scan: false }`. I confirmed the option in @nuxt/schema 4.5.2, applied it locally, and ran `pnpm typecheck`: 626 errors in 105 files, 163 distinct names in 356 file-name pairs, Tinkerfund the bulk. A cross-layer check found no Tenant-to-Tenant use, only Platform homepage to Tenants and Tenants to Platform (useSpace, queryPages). I reverted the config change, so nothing was committed. Asked for my opinion, I recommended doing it, gated by an ADR first. At the owner's explicit request I opened issue #1580 holding the numbers and a draft ADR-0029 (Proposed). It keeps framework, module and component auto-imports. No PR: the migration waits on human green-light, and the root nuxt.config.ts is human-only."
