frictions:
  - description: "Used yaml's parseDocument(...).toString({lineWidth: 0}) to append new observation entries to 10 existing Skill Inventory YAML files. This collapsed every pre-existing multi-line block-scalar note onto one line, producing a ~2900-line unrelated reformatting diff across all 10 files instead of the intended ~10-line additions. Caught before committing by running `git diff --stat` as a sanity check, not by any guard. Reverted all 10 files with `git checkout --` and redid the same appends with plain-text Edit calls matching the files' existing ~79-column wrap style, which worked cleanly."
    solution: For an existing file with human-style prose wrapping, append via plain-text Edit matching the surrounding wrap width instead of parse-and-restringify with the yaml package.
    severity: minor
  - description: "First attempt to background `pnpm gate:scoped` chained `mkdir -p ... && nohup pnpm gate:scoped ... &` inside one Bash call with run_in_background:true. The double-background guard (issue #1208) correctly refused it, and its \"nothing in this call ran\" meant the mkdir never executed either, so the immediate retry's log redirect failed once more before I ran mkdir on its own first."
    solution: Run mkdir -p as its own call before a backgrounded command that redirects into a new directory.
    severity: nit
