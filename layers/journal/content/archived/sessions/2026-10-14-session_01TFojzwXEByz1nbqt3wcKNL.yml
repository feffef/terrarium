outcome: "Audited 12 own Skills, filed 4 issues, merged Inventory PR #1916"
summary: "Fully agent-initiated: a scheduled Routine fired /audit-skills with no human prompt. Ran scripts/audit-skills.ts for the 7-day scorecard, then dispatched one read-only Sonnet subagent per Skill in behaviourChecks (12, all in parallel) to check for silent failures and, for the 3 model-invoked Skills (close-session, dispatch-subagents, log-session), missed invocations. Independently re-verified each report's central claims against git/GitHub before using it, per CLAUDE.md's \"verify before you state.\" Four findings cleared step 4's significant/repeated bar and were filed as needs-triage issues after confirming none duplicated an open issue: #1912 (visitor-loop's owner-corrections.ts --check regex credits only the first #N per line, so a batched one-liner silently passes the mechanical gate — independently reproduced the regex behaviour against two real PR bodies before filing), #1913 (audit-docs' fact-check checklist has no \"ADR decision preserved\" check — a Decisions-tier rewording that reversed ADR-0004's decision passed 3 checkers and a two-axis review, caught only by the human-merge backstop), #1914 (audit-docs' concision-family rotation is keyed to the calendar date, so same-day reruns re-audit the family just tightened — a 3rd recurrence, never escalated before), #1915 (skillsUsed doesn't credit a Skill invoked internally by another Skill, so window_not_used has shown false missed-invocation candidates that ~8 of the last 9 daily audits independently rediscovered with no fix and no single home recording it). Every other verified finding, including two historical clear-backlog silent failures already caught and fixed, was recorded as a dated Inventory observation. Step 3 closure completeness: orphan scan clean, no new orphans, the window's one humanPromptedClosure already recorded 2026-10-13, no manually-rescued closures. Opened PR #1916 (Inventory-YAML-only), invoked close-session at PR-open, then ran /code-review (late — see friction below): both axes independently found 5 of the 12 new observation entries cited only session ids an earlier remaining entry in the same file already cited, against audit-skills' own append rule; fixed each by adding the specific new session id it was missing, re-validated, pushed, posted the verdict, and merged on green."
prs:
