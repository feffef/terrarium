    solution: Redirect a large script's output straight to a file (not through tee/head) when the output is known to be large.
    severity: minor
  - description: Read .githooks/commit-msg with Bash cat, and .agents/skills/dispatch-subagents/SKILL.md with Bash sed, instead of the Read tool (CLAUDE.md); the commit-msg read also loaded an irrelevant adr-0004-human-merge.md reminder since I only inspected, never edited, that file.
