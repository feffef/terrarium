frictions:
  - description: Checkers cannot see my context, so I retyped about 12k tokens of reviewer findings into scratchpad pool files before they could be verified.
    solution: Have reviewers write findings to a scratchpad file themselves (numbered, with exact replacement text) so checkers can read them directly.
    severity: moderate
  - description: Reviewer line spans often included heading or blank lines, or started mid-line; checkers had to correct about a dozen ranges, and my first apply script mis-wrapped nested blockquote text.
    solution: Ask reviewers for exact start and end lines of the body only and to flag mid-line starts; verify the diff for markdown structure after any scripted edit.
    severity: minor
  - description: I wrote an unverified verdict count (75, then 42 rewrites) into the first PR body and corrected it minutes later after counting the checker results.
    solution: "Count verdicts from the checker reports before drafting the PR body (CLAUDE.md: a count is a fact only after reading every item)."
    severity: nit
  - description: The Stop hook demanded a push while the gate was still running; CLAUDE.md says to wait, so I had to hold the push against the hook's reminder.
    solution: "Known: the hook cannot see a running gate (CLAUDE.md Self-verification). No change needed."
    severity: nit
  - description: audit-docs and other Skills still cite CLAUDE.md's 'branch-off rule' and 'index', which a recent CLAUDE.md trial removed, so the dropped pointers broke several referrers.
    solution: When a prune trial rewrites CLAUDE.md, grep removed section names across Skills and docs in the same PR; this run fixed the ones outside trial territory.
    severity: minor
