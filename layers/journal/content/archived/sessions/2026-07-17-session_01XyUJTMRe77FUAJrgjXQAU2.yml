frictions:
  - description: "A dispatched Sonnet impl agent (gate.ts fix, issue #544) stopped its turn twice while waiting on its own internally-started background gate run, returning control without a live background child the orchestrator could track, instead of properly blocking on its own task notification."
    solution: "Resumed it via SendMessage each time (per CLAUDE.md's worktree-resume rule — coincidentally the exact fix this run shipped in #543/#546) and told it to wait properly. Worth a note in impl-agent briefs: when starting a long background command inside your own turn, block on its own notification rather than ending the turn speculatively."
    severity: minor
  - description: That same agent ultimately died entirely (external abort, not caught by the SendMessage resumes) leaving its correct, tested fix uncommitted in its worktree — the orchestrator only found this out because a human, resuming the dormant session, pointed out the agent was no longer running.
    solution: Confirms CLAUDE.md's existing guard ("check each returned worktree for uncommitted work before treating the subagent as done") is necessary — but here the orchestrator had no live signal at all that the agent had died during the dormancy gap, only the human's prompt surfaced it. No new fix identified beyond the existing guard; logging for recurrence signal.
    severity: major
  - description: "Session resumed after a multi-day dormancy gap (origin/main advanced ~674 commits) without the orchestrator proactively re-checking whether already-dispatched, still-open work items had been independently resolved in the interim — only discovered issue #544 was already closed by chasing the dead agent's merge conflict, not by checking first."
    solution: "On resuming a long-dormant session with dispatched-but-unconfirmed work, fetch origin/main and re-check each relevant issue/PR's tracker state before resuming/rescuing that work — would have surfaced #544's closure immediately instead of via a git conflict."
    severity: minor
  - description: "One impl agent (audit-skills.ts fix, #545) hit the already-known provenance-footer auto-injection gap on its initial `git commit -m` (footer didn't land, had to amend it in) — the survey subagent had already found this tracked at #346."
    solution: "Already tracked at #346 (regression, ready-for-human); no new action, logging for recurrence signal."
    severity: nit
  - description: "A fresh worktree-isolated agent's `pnpm typecheck`/`pnpm gate:scoped` failed with `nuxt: not found` until it ran `pnpm install` first — worktree provisioning doesn't pre-install node_modules."
    solution: Worth adding a `pnpm install` step to worktree-isolated impl-agent briefs before the typecheck/gate steps, to save the round-trip.
    severity: nit
