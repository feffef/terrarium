summary: "The owner invoked wayfinder on the Glass Box map to work the HITL grilling ticket \"Glass Box: keeping pages accurate, and who writes them\" (human-instructed). I claimed it, read the four earlier resolutions, checked repo facts (the Blog's pinned-link test, the out-of-scope doc-invariants record, audit-docs' families, CI's full-history checkout, the default merge method) and ran three rounds of questions. The owner overturned two of my recommendations: links pin to one per-page `revision` commit, not `main` (Glass Box is a textbook, and the pin makes stale pages detectable); and a dedicated writing Skill from the start (two: lesson and walkthrough) instead of ordinary sessions. They then asked whether frontmatter adds value, which exposed that my proposed `files`/`docs` fields duplicated the body; frontmatter ended as title, description, revision. Also decided: a layer test checking paths and ADRs at `revision`, and a scheduled self-merging `glassbox-update` Skill (script pass plus concept pass) that replaces audit-docs coverage. The owner confirmed the summary; I posted the resolution, closed the ticket, updated the map, and left a note on the showing-code ticket (agent-initiated follow-through the wayfinder Skill requires). No code or PR."
