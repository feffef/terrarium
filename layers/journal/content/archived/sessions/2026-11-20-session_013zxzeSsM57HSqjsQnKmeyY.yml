learnings:
  - On Midden Trench the active cause chip is a NuxtLink with aria-current, not matched by a[href*=cause=] selectors; verify filter state by screenshot or [aria-current], per TrenchLanding.vue:165.
  - ?cause=<unknown> on /t/midden/trench silently shows all 16 sites with no chip active and no notice (middenCauseFromQuery ignores bad values).
ideas:
  - "[blind visitor, content editor] /t/midden/trench/the-thirty-day-exception and /the-buried: 'Tenant' appears (4 and 13 times) with no gloss, and the Midden home never says it. Gloss it once on first use ('one of the Platform's small sites') or add a line to the home intro; first-time visitors can then read the best stories without knowing the Platform's vocabulary."
  - "[content editor, blind visitor] /t/midden/stores: season shelves read 'sterile' with the definition only in a small footer line. Rename to 'none in store' or define it in the intro; the strip then stops reading as noise."
  - "[content editor, UI tester] /t/midden: the 'Latest finds' strip shows three finds from one report, all 'Intact · in Short Lives · assessed 12 Nov 2026'. Cap it at one per report, or show each find's cause of death, so the strip shows range."
  - "[UI tester] /t/midden/trench?cause=bogus: an unknown cause silently shows all 16 sites with no chip active. Show a one-line notice 'No cause called bogus; showing all 16 sites' (or redirect) so a stale or mistyped link doesn't mislead."
  - "[content editor] /t/midden/trench/stood-down: the blurb says 'removed between 9 and 11 October' while the cards show 'assessed 10 Oct 2026 – 12 Nov 2026'. Say 'removed 9–11 Oct; graded 10 Oct–12 Nov' so a reader knows which date is the removal."
  - "[content editor] /t/midden/trench/the-buried: 'reachable from no ref; the trench floor is the squash itself' is git jargon after the plain-words pass (#3290). Reword to 'reachable from no branch or tag; the bottom of this dig is the single squashed commit itself'."
  - "[content editor] /t/midden/trench card for short-lives: 'Three finds … two Atlas pages … two sets of agent instructions' lists four things for three finds (the Atlas pair is one find). Reword so the count matches, e.g. 'a pair of Atlas pages (two days) and two sets of agent instructions'."
  - "[blind visitor] /t/midden/trench: 16 reports listed by season name only. A timeline strip with one dot per find, coloured by condition grade, would show when the abandoning happened at a glance; visitors get the shape of the story before reading."
