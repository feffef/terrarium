summary: "All human-instructed. (1) Removed the platform-op pill from SkillInventory.vue. (2) The owner asked why frequently used pack Skills show as supporting; I explained CONTEXT.md's conditional-essentialness definition, then on the owner's call re-read the session logs: code-review caught real defects in 6 sessions and skipping it cost a major friction, so it went essential; grill-with-docs (owner-invoked in 8) went essential; grilling, first promoted, was reverted to supporting once the logs showed all 8 grill-with-docs sessions also logged it as the engine. (3) The owner asked how audit-skills should read logs smarter; I diagnosed four causes (pack Skills never get logs read, frictions naming a Skill are ignored, composite and human-invoked use are indistinguishable, stale role text is never rechecked) and, on the owner's green light, added mentionedIn/humanInvokedIn to scripts/audit-skills.ts (unit-tested) and rewrote step 5 of the audit-skills Skill. A 30-day dry run gave the expected signals, with generic names like research over-matching, so the Skill says to read, not count."
