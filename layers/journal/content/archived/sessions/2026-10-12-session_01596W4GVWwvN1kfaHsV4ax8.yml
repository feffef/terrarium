frictions:
  - description: "Subagent for #1797 could not find closed issues with gh api, so its redundancy check on closed issues was incomplete."
    solution: Document a working REST recipe for listing closed issues in github-integration.md or add a script.
    severity: minor
  - description: "I relayed subagent claims (for example the #1818 cause) without re-checking them against the source myself."
    solution: Spot-check one claim per hand-back, or have briefs require cited lines.
    severity: nit
  - description: I did not read the dispatch-subagents Skill before dispatching; the subagents touched no git, so no harm came of it.
    solution: CLAUDE.md trigger says git or worktree only; fine as written.
    severity: nit
  - description: The skill's overlap check against older open ready-for-agent issues was left undone and is reported as unchecked.
    solution: Have the sweep script list ready-for-agent issue files, or make the subagent brief request overlap checks.
    severity: minor
  - description: A git commit ran in the wrong worktree after the primary directory switched under me; it failed harmlessly.
    solution: Use git -C with an absolute worktree path, never cd, when several worktrees are active.
    severity: minor
  - description: I typed a wrong link in the docs PR footer (claude.ai/code instead of the session URL).
    solution: Reuse one prepared footer string for every PR body.
    severity: nit
  - description: Impl subagents could not run the brief's 50-run load check; the guard blocked backgrounding and xargs -P.
    solution: State in briefs which acceptance checks are infeasible in the container, or give a sanctioned way to load the CPU.
    severity: minor
  - description: My own regex hoist left the docblock above the wrong declaration; I caught it by grepping the file before committing.
    solution: Re-read the edited hunk after moving a declaration.
    severity: nit
