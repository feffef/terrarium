summary: "The user ran frictions-to-fixes. A survey subagent read the 44 sessions of the window and returned a ranked report and a ledger patch. Agent-initiated, per the Skill: picking one simple doc fix (a brief re-read line in dispatch-subagents), dispatching a Sonnet agent for the grouped doc PR with the ledger edit, and opening the two PRs. Human-instructed: the user answered two questions (file only the top 3 regressions; file both hard issues, so issues 2144 to 2148 went up) and then asked for the Skill to cap regression issues at three per run, ranked by severity, occurrence and proof of regression, as a separate PR (2149). The doc and ledger PR is 2150. The survey patch listed some sessions twice in a cluster, which the schema forbids; the impl agent dropped 23 duplicate occurrences (keeping the first, highest severity), and the counts quoted in my regression issues were the pre-dedupe ones, corrected by comment. Both PRs merged after green CI; PR 2150 is recorded in the ledger as the subagent-brief-defects fix. The five issues stay open for the owner. The owner then pointed out the Skill usually runs unattended, so I removed the user alert wording (PR 2151, human-instructed) and commented on issue 2137 how the cap and alert changes affect next week's verification."
