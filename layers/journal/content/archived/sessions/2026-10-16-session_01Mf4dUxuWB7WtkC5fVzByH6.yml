frictions:
  - description: Quoted survey regression counts (28, 20, 10) in three issues before the ledger patch was applied; the schema-deduped counts were 26, 19, 6, so issues needed correction comments.
    solution: File regression issues after the ledger edit is applied, or have the Skill say to quote counts from --summary run on the patched ledger.
    severity: minor
  - description: The survey subagent's ledger patch listed sessions twice in clusters, failing validate-content; the impl agent dropped 23 occurrences and one distinct description was lost.
    solution: Have the survey brief require the patch to pass validate:content, merging repeat sessions into one occurrence.
    severity: moderate
  - description: The ledger patch is a YAML list but each ledger file is one mapping, so the impl agent had to write a splitter script.
    solution: Say in the Skill that the patch is one entry per file, or provide a script that applies it.
    severity: nit
  - description: I forgot the CLAUDE.md verdict request in the two code-review spec briefs for the first PR and used wording from memory in the second; no verdicts came back from them.
    solution: Put the verdict line into the code-review Skill's sub-agent briefs, or a shared brief snippet.
    severity: nit
  - description: The Skill says every regression gets an issue; 13 clusters regressed, so I had to ask the user how many to file.
    solution: Cap regression issues per run (now PR 2149).
    severity: minor
  - description: The Stop hook asked to push unpushed commits twice before the ADR-0004 gate and code-review were done.
    solution: None needed; the rule said to wait, and I did.
    severity: nit
