outcome: Rules load in worktrees from the main checkout's copies; one small Bash-hint gap found; report sent to the parent session
summary: "Spun off by session_01XJ9iR9EbRT2iV7afhytND8 at the owner's request, which made it investigate-only and allowed no code changes. Live tests: a manual worktree under .claude/worktrees read from the main cwd, and two fresh subagents. One ran with Agent isolation (cwd = the worktree), the other used the main cwd with worktree paths. All three loaded the matching rules. The labels showed that the harness maps worktree files to the MAIN checkout's .claude/rules. A plain nested dir with the same path suffix loaded nothing, so the match is anchored and aware of worktrees. EnterWorktree and Workflow agents are untested. A dry-run of bash-rules-hint found a gap: with cwd = main, a piped read of a worktree file gets no hint. So the #1896 empty humanOnly list most likely came from the agent's judgement or the self-classifying brief, not a missed rule, unless the agent edited the rule files only through Bash. Proposed fix: derive humanOnly from git diff in clear-backlog-build, and optionally strip the worktree prefix in bash-rules-hint. The report went to the parent session; nothing was posted on GitHub. All the work was agent-run under the parent session's delegated brief."
