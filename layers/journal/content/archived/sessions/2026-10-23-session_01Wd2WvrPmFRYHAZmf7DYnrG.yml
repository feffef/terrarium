frictions:
  - description: Picked the by-season browser feature without reading the Midden's git history; the refiner then found the owner had removed the same legend, costing a round trip.
    solution: Before choosing a feature, grep git log and decisions for the thing the idea would rebuild; the Skill could tell step 3 to check `git log -S` on the area.
    severity: minor
  - description: Called mcp__github__search_issues without `fields`; the guard blocked it, and the required GitHub doc was read only afterwards.
    solution: Read docs/agents/github-integration.md before the first GitHub call, as CLAUDE.md says.
    severity: nit
  - description: The Stop hook twice asked me to push while gate:scoped was still running, against ADR-0004's gate-before-first-push rule.
    solution: The hook could stay quiet while a gate log is open; I ignored it and pushed after the gate was green.
    severity: nit
  - description: Preview start printed PID on the third-last line; my `tail -3` dropped it and the first stop call failed, leaving a server up until I read the log.
    solution: preview.ts could print PID last, or accept stop without an argument for the newest server.
    severity: nit
