  - description: "Decided picks and recommended drops without invoking the adr-check Skill, though CLAUDE.md requires it before any recommendation and frictions-to-fixes sections 3-5 mandate decisions (issue #2342)."
    solution: "Resolve #2342: either let frictions-to-fixes call adr-check in section 3 or exempt it in CLAUDE.md."
    severity: minor
  - description: Section 2 says to file the top three regressions by severity, count and proof together, but gives no rule for severity before versus after the fix, so my pick of the third was a judgement call.
    solution: Say to rank by the highest severity since the latest fix PR, as the summary shows it.
    severity: nit
  - description: Filed three regression issues without the scoped closed-issue search the survey brief asks for; I relied on the open-issue list and the survey's check.
    solution: Have the survey return a closed-issue check result per regression so the main session need not repeat it.
    severity: nit
  - description: Survey subagent hit extract-frictions --unledgered keeping a session's other frictions, so it appended duplicates to 7 clusters and caught them only with its own uniqueness check.
    solution: Make print-ledger-occurrence.ts refuse a session already in the target cluster.
    severity: minor
