learnings:
  - Nuxt Content 3 stores a zod .datetime() field as a zone-less DATETIME string ('2026-06-01 12:00:00'); Date.parse reads that as local time
  - Setting process.env.TZ at runtime in Node changes Date's local-zone interpretation in the same process, so a unit test can force a non-UTC zone
ideas:
  - "Run the gate's e2e step in CI under a non-UTC TZ (e.g. Pacific/Chatham, offset +12:45) so zone bugs like #2175 fail in CI instead of only on contributors' machines"
