goal: Fix tinkerfund e2e tests that fail outside UTC
status: completed
outcome: "Fixed tinkerfund's pinned clock reading as local time; PR #2181 merged by the owner"
summary: "The user asked me to read issue #2175 and find a solution in a worktree, then said \"yes do it all\" to gate, review, PR and merge. I cut a fresh worktree off origin/main, reproduced both failures with TZ=Europe/Berlin, and read the rendered time elements: qa's pinned now came out as 10:00Z instead of 12:00Z. Cause: Nuxt Content stores a z.string().datetime() field as a zone-less DATETIME string, and tinkerfundNow's Date.parse read it as local time, so it is an app bug (also hitting browsers outside UTC on client navigation). The fix reads a zone-less value as UTC, plus a unit test that forces a non-UTC TZ so UTC-only CI would catch a regression. The Spec reviewer proposed the better-altitude fix of switching shop.now to the shared utcTimestamp; I tried it, and pnpm build failed because Nuxt's Vite builder externalizes shared/ in the server bundle and the config loader can't resolve the #shared alias, while layers/tinkerfund/schemas.ts is loaded both ways. I went back to the reader fix and recorded the dropped alternative in the PR. gate:scoped is green and the full e2e suite passed 141/141 under Berlin time. scripts/merge-pr.ts refused my verdict because the worktree's copy predated the commit that accepts a local session's raw-UUID header; I rebased and re-ran the gate, then paused when the user asked for the root-cause fix. I laid out three options (keep the reader fix, a local regex schema, or make shared/ importable from layer schemas), and the user had already merged the PR themselves. The rebased branch was never pushed. The schema-level fix is still open."
