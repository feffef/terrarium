summary: "The owner asked whether #2577's claim that the harness only allows pushes to the session branch is true. I checked the cited sessions' logs and their PRs' head branches: session_013QKXoGLaEHEJanyw5TrPqj pushed four non-session branches (PRs 2512-2515) after the owner allowed separate branches, so the limit is the system prompt's instruction, not an enforced block. The other cited session hit git's one-branch-per-worktree rule, which clear-backlog §4 already handles with HEAD:branch. On the owner's explicit ask (human-instructed) I posted a correction comment on #2577; finding 2 left untouched. The owner then corrected me: my comment implied the owner must be asked before using separate branches, but the repo's written instructions already grant that permission. I edited the comment to say so (human-instructed). No code changed, no PR."
