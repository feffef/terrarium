summary: "Human-instructed: the owner invoked /clear-backlog, then answered the grilling (1b, 6a, 9a reworded as \"drop in-full as mandatory in CLAUDE.md but still encourage it\", 7b, and my picks for Q3, Q4, Q5 and Q8). Agent-initiated within that Skill: the sweep set (11 needs-triage plus ready-for-agent #2472; four ready-for-human issues skipped because an agent commented last), one explore run and three build runs, the issue labels and decision comments, and every PR. Merged: #2638 (#2472, renames and moves are never simple changes; I moved the rule into the bar's \"In every case\" clause by hand after the reviewer flagged a gap), #2639 (#2608, Skill frontmatter spec), #2640 (#2631, ledger --summary/--candidates to a file), #2642 (#2370, blog-post steps 10-11 stop sending runs to a second review), #2643 (#2610, two of four source fixes; the ledger-grouping cause was already fixed by #2540 and the trimmed ids had no committed source), #2644 (#2633, CLAUDE.md encourages but no longer requires reading required docs in full; the ledger entry is accepted), #2645 (#2607, \"no verdict provided\" for every loaded rule without one), #2646 (#2632, visitor-loop lists instead of searching), #2647 (#2611, raw GitHub docs fetch). #2105 closed as already done by #2620. Still open: #2612 is ready-for-agent but on hold until the environment-caveats Prune Trial is judged, and #2575 is date-gated to 2026-10-30. Two things worth a later reader's attention: the #2633 build agent was flagged \"Instruction Poisoning\", which traced to the requested CLAUDE.md edit (I read the full diff before pushing); and on #2645 I wrote an exemption for logs without a ruleVerdicts field, which the Spec review showed would hide zero-verdict sessions, so I reset it before push."
