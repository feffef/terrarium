frictions:
  - description: "Declared a repo-wide \"main's typecheck is broken\" finding, filed a public issue (#923) and sent the user a proactive push notification about it, based on a local repro that only used `git stash` to revert tracked-file changes — which does not reset `node_modules`/`.nuxt`. The local sandbox's node_modules was apparently left inconsistent by an earlier non-frozen `pnpm install` in this same session, and both the \"before\" and \"after\" repro runs shared that same contaminated install, so they agreed with each other but not with reality. PR #924's own CI run came back green on typecheck, which prompted a proper re-check: `rm -rf node_modules .nuxt && pnpm install --frozen-lockfile` (matching CI's install exactly) passes typecheck cleanly. Caught and corrected within the same session (closed #923 with an explanation, corrected the PR verdict comment, merged once gate was genuinely confirmed green) but a false public issue and an inaccurate user notification both went out before the correction."
    solution: "When a local repro of a build/type/test failure is meant to establish \"this is broken on main, unrelated to my change,\" reset the full install state (`rm -rf node_modules .nuxt && pnpm install --frozen-lockfile`), not just tracked files via `git stash` — mirror CI's actual install path before trusting a same-sandbox repro, especially before filing a public issue or notifying a human based on it. This is a sharper form of CLAUDE.md's existing verify-before-asserting-a-causal-claim rule: the primary source that would have caught this (a truly clean install) was one command away and wasn't run before the claim shipped externally."
    severity: major
  - description: S4's Duplication finding named three research docs restating the docs.github.com-403 caveat, but one of the three (nuxt-content-review-grounding.md) turned out on fact-check to describe a different pair of domains (content.nuxt.com/nuxt.com) — the lens agent's own scope note had already flagged this as its weakest finding.
    solution: Independent fact-check step caught it before any fix was applied; no action needed beyond leaving that one file alone.
    severity: nit
