learnings:
  - Docker Compose's default project name (absent an explicit name:/COMPOSE_PROJECT_NAME override) is the basename of the directory containing the compose file, not the repo name or any other convention — this determines default container/volume names and is easy to get wrong when the compose file lives in a subdirectory (deploy/) rather than the repo root.
  - "`git stash` only reverts tracked-file changes — it does not reset node_modules, .nuxt, or any other gitignored build/install state, so a 'stash and re-run to isolate the cause' repro can silently share a contaminated dependency install between the 'before' and 'after' runs and agree with itself while disagreeing with a truly clean environment (like CI's)."
