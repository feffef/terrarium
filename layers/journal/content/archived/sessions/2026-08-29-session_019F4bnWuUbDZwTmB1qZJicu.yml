    solution: "Re-read #1076's diff, ported only its 11-line schema addition (shared/schemas/session.ts) into this PR, verified pnpm gate:scoped green locally, pushed, and corrected both the PR body and a stale PR comment that still said \"not ported here\" (the sync-the-description rule applies to a comment's factual claims too, not just the top-level body)."
    severity: minor
