learnings:
  - Three models agreed on top and bottom tiers but each found a different factual error; the union of verified errors is the main value of running three
  - Parallel page agents should hand back join edits instead of editing shared pages; one later pass applies them without conflicts
ideas:
  - Teach scripts/git/check-worktrees.ts to excuse a worktree whose commits are on origin/main by patch-id (git cherry), so orchestrators that cherry-pick agent work don't hit a false FAIL and hand-verify every worktree
