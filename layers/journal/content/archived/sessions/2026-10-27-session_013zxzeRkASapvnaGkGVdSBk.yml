frictions:
  - description: Ran git rev-parse HEAD before reading docs/agents/git-conventions.md, which CLAUDE.md asks for before git beyond status/diff
    solution: Harmless read-only command; the hint fired after. Read the doc first or treat rev-parse as exempt like status
    severity: nit
  - description: Sonnet reviewer skipped git-conventions.md after its git hint fired; reviewers also re-derived the same ~30 file checks three times
    solution: For multi-model comparisons, accept the duplicated verification as the cost of independence
    severity: nit
  - description: The new operating-model Lesson repeated the 'new dependency is unenforced' error the same batch was fixing; it took a review round to catch
    solution: Put verified corrections from the triggering review into every parallel page agent's brief, not only the fixer's
    severity: moderate
  - description: Two promotion agents each edited the other's draft link before moving it; cherry-picks conflicted on both moved drafts
    solution: Tell promotion agents not to touch another promoted draft; repoint links in the join pass
    severity: minor
  - description: Second-round review follow-up (11 files, 20 lines) got my own read, not code-review, though pr-workflow.md asks code-review for a follow-up over the simple-change size
    solution: Run code-review on the follow-up diff, or have the fix agent stay within the simple-change limit
    severity: minor
  - description: Briefed Lesson titles without the 'field name, not ours' rule up front; two promoted pages kept project jargon titles until the user flagged it
    solution: Quote EVERY-PAGE.md's title rule in briefs and check titles against the tool's own docs before integrating
    severity: minor
  - description: "Subscribed to PR #2599 in the same call batch as creating the PR, guessing its number; the real PR was #2600, so one wrong subscribe had to be undone"
    solution: Subscribe only after create_pull_request returns the PR number
    severity: nit
  - description: First push of the restarted branch failed with --force-with-lease stale info because the merged branch was deleted on the remote
    solution: Push a restarted branch plainly, as pr-workflow.md says for a branch restarted after its merge
    severity: nit
  - description: check:worktrees failed on every agent worktree because their work landed as cherry-picks, so their HEADs are not ancestors of main; I had to verify each by commit subject before removing
    solution: Merge agent branches into the integration branch instead of cherry-picking, or have check-worktrees excuse a HEAD whose patch-id is on main
    severity: minor
