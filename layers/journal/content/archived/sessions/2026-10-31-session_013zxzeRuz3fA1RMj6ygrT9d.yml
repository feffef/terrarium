frictions:
  - description: Agent call was blocked by the dispatch-read guard because I had not read dispatch-subagents before writing the visitor briefs; three briefs had to be resent.
    solution: Have the visitor-loop Skill name dispatch-subagents in step 2.
    severity: minor
  - description: I edited code before writing the tally and running the refiner, then committed fix and feature together and had to split them.
    solution: "Follow the Skill order: tally, refine, then edit; one commit per PR."
    severity: minor
  - description: gate:scoped failed twice (e2e assertion used a Playwright matcher the suite lacks; Popular order assertion broke under the cap) because I did not grep the tests first.
    solution: Grep tests for the behaviour before changing it, and run typecheck on test edits.
    severity: minor
  - description: First subscribe_pr_activity call used the mcp__github__ prefix; the tool is mcp__claude-code-remote__subscribe_pr_activity.
    solution: Say the right prefix in the github-integration doc or the Skill.
    severity: nit
  - description: Stop hook asked to push after every turn while the gate and review were pending; ADR-0004 correctly overrode it, but each prompt cost a turn.
    solution: Have the stop hook stay quiet while a gate or review is running in the background.
    severity: nit
  - description: I wrote five Updates with an invented figure (214 uses) and winks before reading each Campaign page in full; code-review caught it, costing a rewrite and a second gate run.
    solution: Read the Campaign page and the Voice section of tinkerfund-campaign before drafting content, as for any new Update.
    severity: minor
  - description: After the fix PR merged, the Stop hook counted main's merge and log commits as 3 unpushed and kept asking for a push on the re-cut branch.
    solution: Have the stop hook compare against origin/main when the remote branch was deleted by a merge.
    severity: nit
