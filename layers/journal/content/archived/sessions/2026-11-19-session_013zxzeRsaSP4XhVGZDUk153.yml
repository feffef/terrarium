learnings:
  - Subagent logs of the same Skill disagree on what was visible (gh pr view is blocked, gh api REST works), so a finding verified through git alone should say so.
ideas:
  - "dispatch-subagents / audit-skills: add the read-first dispatch-subagents line to audit-skills, frictions-to-fixes, glassbox-update, digest and prune-trial. The guard denied the first dispatch in 10 of 25 logged runs, and the five Skills the 11-18 restore skipped account for most of them."
  - "log-session: set the answered flag in transcript-trace.ts only when every main-session rule load has a reported entry. 11 of 41 logs say answered while rules were unrated, harvest 3 of 3."
  - "harvest: make check-body reject an Unbuilt line whose search printed nothing unless it also names a file and a control search that matches. #3464 claimed a missing feature that was built."
  - "audit-skills: let the scorecard mark a Skill whose runs, changes and observations repeat the last check, so its agent can be skipped. The run spent about 1.7M subagent tokens, mostly re-confirming known repeats."
landedBy: Stop
