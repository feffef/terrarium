frictions:
  - description: Survey subagent's ledger directory read overflowed (38KB) and the compact friction extract is still 135KB, so it hand-built a digest.
    solution: Give session-frictions.ts a ledger summary mode or a smaller default window output.
    severity: nit
  - description: Subagent hand-back text arrived both as a message and a task notification, and the first report was long enough to need careful re-reading before dispatch.
    solution: Have the survey brief cap the report length and ask for ledger edits as a file path rather than inline text.
    severity: nit
  - description: Impl agent exceeded the ~60-line ceiling (about 130 changed lines) because the ledger occurrences I specified were three YAML lines each; I had set the ceiling without counting them.
    solution: State the size ceiling excluding mechanical ledger occurrence lines, or let the agent append occurrences by script.
    severity: nit
  - description: "SHELL-READ-DETECTION false positive: .agents/skills/auto-triage/SKILL.md was credited from shell output, but the session marked it (not read)"
    solution: Find the crediting command in the transcript and tighten scripts/shell-reads.ts
    severity: moderate
