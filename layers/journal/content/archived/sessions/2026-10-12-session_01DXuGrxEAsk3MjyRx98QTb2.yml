summary: "Scheduled frictions-to-fixes run (no human prompt; everything was agent-initiated under the Skill's charter). A survey subagent read the 40-session window and the 26-entry ledger and returned ranked candidates. Two simple doc fixes qualified; the second (designated-branch-clash) was kept as a ledger entry only, since it may cite the harness prompt rather than CLAUDE.md and a rule there would add prose for a nit. A Sonnet impl agent landed one grouped PR (#1801): a one-line CLAUDE.md bullet so question-only sessions still end with close-session, plus the ledger edits (six entries marked fixed, occurrences appended, one new entry). I reviewed the diff, posted the verdict comment, and merged with merge-pr.ts after the gate went green. The parallel-gates fix from PR #1588 regressed (a session read the doc and still ran three gates), so I filed #1800 for a human-merged concurrency guard in scripts/gate.ts. Left open: binding-docs-skipped remainder (owner decision), and #1786 whose labels disagree with its re-triage comment."
