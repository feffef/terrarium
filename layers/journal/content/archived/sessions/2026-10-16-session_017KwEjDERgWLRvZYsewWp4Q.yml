  - description: Recommended a fix in chat without first grepping docs/adr for ADRs that bind git-conventions.md, as CLAUDE.md asks before recommending a change.
    solution: Run grep -l on the target path before the first recommendation; ADR-0004 and ADR-0003 turned out to be the relevant ones and were already loaded.
    severity: nit
  - description: The first draft said 'push the branch' without stating that a push sends every local commit; the user had to stop the gate run to ask whether local work would go out.
    solution: When advising a push, state up front which commits it sends and the check that bounds them.
    severity: minor
  - description: The Stop hook asked to push my own ungated doc commit while the user had asked me to wait.
    solution: Known harness-side stop-hook-nag; held the push until gate and review passed.
    severity: nit
