goal: Stop the Stop hook's push nag for commits inherited from main
status: completed
outcome: "git-conventions now says to push a branch whose only unpushed commits are on main; PR #2188 merged by the user"
summary: "The user asked, in chat, whether there was an easy way around the harness Stop hook asking to push commits that are already on main (the session log picked up when a branch is brought level with main). I read the harness script and the stop-hook-nag ledger cluster: the hook counts origin/<branch>..HEAD, and the advice merged earlier today (#2123) told agents \"no push is needed\", which keeps the nag going every turn. I proposed changing that line to \"push the branch\"; the user chose that option (human-instructed) and asked that the doc make clear only the session's branch is pushed, never main. They paused me mid-run to confirm no local work would go out, then green-lit tightening the wording and pushing. Review findings (say \"never main\" and \"never forced\", narrow \"the hook stops\" to that nag, say no PR follows, rename the section heading) were agent-applied. The user merged it. After a /retro the user asked for a watch-list issue (#2190, needs-triage) covering misreadings to catch, the ledger fix entry, and the retro's review-cost and Spec-check ideas."
