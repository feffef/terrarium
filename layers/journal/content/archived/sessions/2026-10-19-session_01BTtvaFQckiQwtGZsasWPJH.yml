frictions:
  - description: Echoed a prefix of GH_TOKEN in a Bash command while checking the gh setup; the auto-mode classifier denied it as credential materialization.
    solution: Never print any part of a token; check gh with which gh or a harmless gh api call.
    severity: minor
  - description: "The first validate:content in a fresh worktree failed with tsx not found: the worktree had no node_modules, which dispatch-subagents warns about."
    solution: Run pnpm install in a new worktree before any pnpm exec; a worktree helper could do it.
    severity: nit
  - description: "The first #2233 commit used Closes, which would have closed the issue as completed instead of not planned, and its ref claimed the issue was already closed; the Spec review caught both."
    solution: Use a closing keyword only when completed is the right reason; otherwise close by hand.
    severity: nit
  - description: "gate:scoped ran on the pre-amend #2233 commit; the amend changed only one YAML string, and I re-ran only validate:content on it."
    solution: Amend before starting the gate, or re-run gate:scoped after any amend; CI's gate decides anyway.
    severity: nit
  - description: "I missed relabelling owner-approved issues ready-for-agent after the grilling; merge-pr.ts refused #2281 and #2282 until I fixed the labels."
    solution: clear-backlog section 2 already says to set the implied label; the build workflow could check every branch issue is ready-for-agent.
    severity: minor
  - description: "The build workflow hit its 3-round review cap on #1889 and #2146 with one small finding each, which I fixed by hand and re-gated."
    solution: Works as the Skill describes; no change needed.
    severity: nit
  - description: The first adr-check build kept CLAUDE.md's ADR grep, which misses path searches and over-matches broad terms; the owner caught it before merge.
    solution: Test a lookup method on real cases before encoding it in a Skill.
    severity: minor
  - description: "The Stop hook asked twice to push while the #2146 gate was still running; I declined per the ADR-0004 rule."
    solution: Accepted cost (stop-hook-nag, PR 2278).
    severity: nit
  - description: "pr-workflow.md lines 82-83 still say merge-pr.ts refuses Dependabot PRs, false since #2283; ADR-0027 forbids rewording text in an open prune trial's territory, even a fact a merged PR made false."
    solution: Let a change correct a fact in trial territory when a merged PR made it false, logging a Friction; or fix this line with the trial owner's OK.
    severity: moderate
  - description: Nothing checks that owner-approved issues are relabelled ready-for-agent before clear-backlog-build runs; merge-pr.ts caught it only after two PRs were built and gated.
    solution: clear-backlog-build.js checks each branch issue's ready-for-agent label first and returns needs-owner when it is missing.
    severity: minor
  - description: Both clear-backlog workflows return 57-88 KB that the tool result truncates; I hand-wrote node -e parsers three times, for triage results, build statuses and the log's merged verdicts, and shell quoting broke one.
    solution: A clear-backlog run-summary.ts with --triage, --build and --verdicts modes that the Skill names in sections 1, 3 and 4.
    severity: minor
  - description: Whether path-scoped rules in .claude/rules support @imports, and whether they load lazily, is undocumented; the owner asked and I could not test it in-session.
    solution: A research run in a fresh session with the InstructionsLoaded hook, recorded in docs/research/.
    severity: nit
  - description: Each GitHub subscription or PR event arrived wrapped in about 5k tokens of identical harness instructions; with five PRs it was the run's largest repeated cost.
    solution: "Harness-side: send the handling instructions once per session, not per event."
    severity: minor
