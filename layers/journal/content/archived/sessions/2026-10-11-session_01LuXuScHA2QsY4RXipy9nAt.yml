summary: "The user ran /frictions-to-fixes once (the kickoff); everything after was agent-initiated within that Skill's charter. A survey subagent read the 34-session window against the Friction Ledger and the tracker and returned a ranked report. No candidate was both simple and safe-surface, so no Sonnet code fix was dispatched. I checked the survey's top claim against the source before acting: it said PR 1775 rewrote scripts/shell-reads.ts, but git log shows that file last changed in the 1723 fix, so the shell-read false positives are a regression of PR 1725, not of 1775; I filed that as a ready-for-human regression issue and said the crediting command is still unknown. Two surface-blocked candidates also got ready-for-human issues (new session-log fields failing main's strict schema; a guard for foreground gate runs, recommended as do-nothing until the tail-pipe guard question is settled). One Sonnet agent in a worktree applied the ledger edit (appended occurrences, four new entries, reopened parallel-gates-exhaust-memory); I reviewed the diff, fixed a wrong issue number I had put in my own brief, and merged it through merge-pr.ts. Left open: the three issues, plus closure-not-invoked-on-answers, which is ledger-tracked but has no cheap fix."
