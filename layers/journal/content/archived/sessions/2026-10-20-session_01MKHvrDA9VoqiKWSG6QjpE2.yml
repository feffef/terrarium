frictions:
  - description: "Hand-parsed both workflow outputs (explore, build) with ad-hoc node -e scripts, the exact pain #2334 reports."
    solution: "#2334's run-summary.ts, being built in this run."
    severity: minor
  - description: "My #2329 build brief copied the triage agent's replacement example without checking the pages; review found it already closes 10 of 15 specimens, so I cut it by hand."
    solution: When a brief proposes example wording to stop repetition, grep the content for it first.
    severity: minor
  - description: "The #2340 build agent did not read the issue its brief told it to read and relayed only the four listed edits; I had to check the seven items myself."
    solution: clear-backlog-build could have the Spec reviewer always read the issue body (it may already); keep verifying ready-to-push claims.
    severity: nit
  - description: Two triage agents repeated the issue's wrong claim that the frictions-to-fixes briefs are in the prune trial, and one wrongly called tenant.config.ts Human-only; caught on verification.
    solution: Triage briefs could tell agents to check trial territory and the Human-only list rather than relay the issue's constraint lines.
    severity: nit
  - description: Ran git rev-parse and git fetch before reading git-conventions.md (CLAUDE.md read-first trigger); the late read showed the calls were right.
    solution: None needed; hook caught it.
    severity: nit
  - description: Push notification said 5 questions but the round had 6 (the last was 'accept the rest').
    solution: Count the accept-the-rest line or not, consistently.
    severity: nit
  - description: "Amended a merge commit by mistake on the #2344 branch (git commit --amend after git merge), so I had to squash the unpushed branch with reset --soft."
    solution: Check git log -1 before amending after a merge.
    severity: minor
  - description: run-summary.ts --verdicts merges one run at a time, so merging three runs' verdicts for this log still needed a hand-written script.
    solution: "Let --verdicts accept several .output paths (left open on #2350)."
    severity: minor
