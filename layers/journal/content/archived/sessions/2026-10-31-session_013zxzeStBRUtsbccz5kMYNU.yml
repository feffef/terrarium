learnings:
  - "The harness Stop hook flags an unpushed branch while its own gate is still running; under ADR-0004 that flag is to be ignored until the gate passes, and a Stop-hook design for #2721 would have nagged the same way"
ideas:
  - clear-backlog could carry each question's options as structured data through follow-up rounds, so a reply like 'Agree' or '7b' after a flip is checked against the open set and an ambiguous reply triggers one clarifying line before any build launches; this session stopped two builds on flipped answers
landedBy: Stop
