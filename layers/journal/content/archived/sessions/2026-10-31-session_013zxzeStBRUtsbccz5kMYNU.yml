frictions:
  - description: Workflow call blocked by the dispatch-read guard; I had not read dispatch-subagents before launching clear-backlog-explore, though nothing in it changed the call
    solution: clear-backlog could name the dispatch-subagents read before §1's workflow call, or the guard could exempt saved workflows that brief their own agents
    severity: nit
  - description: Double-background guard blocked a combined two-gate Bash call using & plus run_in_background; resent as two calls
    solution: Run one background gate per call, as the guard says
    severity: nit
  - description: "clear-backlog-build hit its 3-round review cap on a prose-only #2725 branch, leaving one finding to fix by hand"
    solution: Brief scope lines should match the done-when line; the brief named only some §3.3 calls while done-when covered all
    severity: minor
  - description: "Started #2721's build on an ambiguous 'Agree' and later flip-flopped on Q7 answers, stopping two build runs mid-flight"
    solution: When an answer changes a pick under build, confirm the full option before relaunching; ask the clarifying question first, per the owner's stated preference
    severity: minor
  - description: "Posted two PR verdicts with a wrong Reviewed SHA (a short SHA on #2734, the non-head commit on #2737) and had to edit them"
    solution: Paste the Reviewed SHA from git rev-parse HEAD in the worktree, as pr-workflow step 4 says, instead of from a commit list
    severity: nit
  - description: run-summary.ts --verdicts emitted subagent rule paths that log-session --author refused (absolute paths and one comma-joined list), so I had to normalise them by hand
    solution: run-summary.ts --verdicts should normalise each verdict path to repo-relative and drop or split joined paths before printing
    severity: minor
  - description: Hand-edited a Friction Ledger entry although survey-brief.md says every ledger edit goes through ledger-set.ts; the Spec review caught it before push
    solution: Grep frictions-to-fixes for the ledger edit path before touching layers/journal/content/current/frictions/
    severity: nit
