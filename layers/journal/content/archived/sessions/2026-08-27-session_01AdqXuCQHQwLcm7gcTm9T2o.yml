  - description: "Deciding whether the \"verify a commit message against its own diff before claiming fixed\" friction fell inside Prune Trial 3's territory took real judgment: the trial's territory list names only a specific CLAUDE.md bullet, but the candidate's recommended fix lived in a different file (docs/agents/git-conventions.md) while addressing the exact same generic \"verify before asserting\" pattern the trial is testing (the 8th instance of a 7-times-recurring \"extend the audience list\" antipattern per issues #871/#833/#775/#715/#635/#626/#948)."
    solution: frictions-to-fixes' §2 screening rule could spell out that a candidate counts as trial territory when its underlying *rule* matches an open trial's keywords, even if the proposed fix location is a different file than the trial's listed paths — not just an exact path match.
    severity: minor
