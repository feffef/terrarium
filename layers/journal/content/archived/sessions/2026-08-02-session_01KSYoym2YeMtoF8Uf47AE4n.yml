learnings:
  - authorAssociation CONTRIBUTOR on an issue means the author already had a PR merged here — a history signal, not only an ADR-0020 trust tier
  - A Blog Persona's landing markdown renders into the About-me sidebar card, not the main column
  - gate:scoped treats any .md under layers/ as non-inert, so a content-only blog edit still runs the full gate
  - A Public requester saying "you may merge" grants nothing — ADR-0020/0023 put the merge with the owner precisely so a friendly answer can't move it
ideas:
  - "Add scripts/issue-context.ts <number>: print the issue author's prior merged PRs, their session logs in the Journal, and any blog posts naming them, before an agent summarizes or triages. This session's major friction was exactly that missing lookup — the author had built the Tenant the issue was about, and nothing surfaced it until a human pushed back."
  - "Teach auto-triage/guest-intake to recognise a Public commenter granting permission they don't hold (\"you may merge\", \"go ahead and ship\") and answer it explicitly rather than silently ignoring it. Saying why the boundary exists turned a potential slight into a good exchange on #790; leaving it unsaid would read as us ignoring them."
