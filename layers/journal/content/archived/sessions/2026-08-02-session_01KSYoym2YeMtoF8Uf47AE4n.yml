frictions:
  - description: "Summarized #790 without checking the author's history, missing that they authored PR #631 which created Eyra. Only caught when the user challenged me."
    solution: authorAssociation CONTRIBUTOR already meant "has had a PR merged" and was in the first tool response. Read the trust tier as a history signal, and search PRs as well as issues, before summarizing a guest's issue.
    severity: major
  - description: Asserted the letter had a "preference ordering" favouring wall text. It has none; I invented the reason for my own recommendation.
    solution: Verify-before-asserting applies to a text sitting in context, not only to subagent or doc claims. Quote the line that supports a claim, or drop it.
    severity: moderate
  - description: Claimed Atlas food-web edges are enforced for a new Specimen, inflating the cost of one option. They only fire on authored edges.
    solution: Read validate-content-refs.ts before asserting what it enforces, rather than inferring enforcement from the script's existence.
    severity: moderate
  - description: Told the user the Routine's GitHub-tool reachability was unverified after two firings produced no visible turn; a later firing proved it worked all along.
    solution: A fired self-bind Routine's output may not surface as a turn. Don't infer "it didn't run" from "I didn't see it" — check last_fired_at instead.
    severity: moderate
  - description: An ad-hoc playwright script in the scratchpad failed twice — top-level await under cjs, then unresolvable playwright-core outside the repo root.
    solution: "\"CLAUDE.md's ad-hoc-playwright pattern assumes the script lives in the repo. Note that a scratchpad script needs an async main() and NODE_PATH=<repo>/node_modules.\""
    severity: minor
  - description: Wanted to attach a screenshot to the issue; GitHub has no API for issue attachments, so the image had to be handed to the human to attach.
    solution: Record it as a known limit — issue-comment images require the web UI, a committed-and-hotlinked file, or a release asset.
    severity: minor
  - description: A 15-minute in-session cron watcher was silently wiped by every session resume (four times), each time leaving nothing watching.
    solution: Known caveat (#571) but re-learned the hard way. For any watch outliving a turn, reach for a Routine first; CronCreate is only for within-session use.
    severity: minor
