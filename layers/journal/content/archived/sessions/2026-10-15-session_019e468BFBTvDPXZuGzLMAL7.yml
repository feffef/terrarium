frictions:
  - description: Read docs/agents/git-conventions.md only after my first git fetch and log commands; the hook reminded me afterwards.
    solution: Nothing changed in the doc; the rule needs a trigger before the first git command, which the harness cannot give.
    severity: nit
  - description: Read files with cat/sed through Bash several times instead of the Read tool, contrary to CLAUDE.md.
    solution: A guard on Bash cat of repo files would remind earlier.
    severity: nit
  - description: visitor-loop Skill changed on main mid-run (#2087/#2088, glassbox focus, new refiner step), so my stale copy gave the wrong focus and skipped a step; I recovered by running the refiner late.
    solution: Have the Skill's step 1 re-read SKILL.md after fetching origin/main, or pin the date range.
    severity: moderate
  - description: owner-corrections.ts returned 26 file-overlap candidates; the check needs one tally line each, costing a long boilerplate list in the PR body.
    solution: Let --check accept one grouped line for pure file-overlap candidates with no review or comment.
    severity: minor
  - description: Combined run_in_background with a trailing & and the double-background guard rejected the whole command.
    solution: None needed; the guard worked as designed.
    severity: nit
  - description: Did not open the full ADR-0004, ADR-0003 or ADR-0017 though their summaries said to read them if relevant.
    solution: Summaries were enough for this change; none cost anything.
    severity: nit
