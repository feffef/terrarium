goal: Cluster the Friction Ledger by harm, not by slip
status: completed
outcome: "PR #2630 merged: a new survey rule, a re-clustered ledger and two ledger script fixes"
summary: "Human-instructed throughout. The Trusted user asked me to check the Friction Ledger for clusters that count a working fix's guard firing as a regression, and for cluster text that never generalised. I found examples of both (github-search-overflow, bare-cd-moves-session-cwd, survey-output-overflow) and asked how to proceed. The user chose to re-cluster existing data, use `ref`, rewrite text directly, and override the open Prune Trial on survey-brief.md. My first rule split on \"different friction\" while keeping same-slip cases, which both reviewers flagged as inconsistent. The user then set the rule: a Friction is its harm, so a fix-caught slip with a new harm (retry, false positive, no cost) gets its own entry. At the user's request I fanned out four read-only audit agents over the 134 entries, verified every proposed move against the stored texts myself, and asked about three judgement calls (apply all; split zero-cost shell reads; leave strays). About 60 occurrences moved through --move. 9 new entries exist, about 30 entries got rewritten text, and the occurrence count is unchanged at 951. The user then approved three more brief rules (match on harm, follow a cause's routing, rewrite a cause when recording a fix). After two review rounds and a green gate, I merged PR #2630 myself under ADR-0004 (no Human-only file). ledger-set.ts gained in-place summary/cause/surface edits; --move's flow-style bug was found and fixed by me along the way."
