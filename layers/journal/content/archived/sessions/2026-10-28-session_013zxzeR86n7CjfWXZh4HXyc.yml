learnings:
  - prune-friction-ledger.ts --move deletes an emptied source entry with its fixes, so a full split drops the original's fix history; its ref has to carry what it covered.
ideas:
  - Add a ledger lint that flags an entry whose cause says 'no hint' or 'nothing hooks it' while its fixes list a PR that added one, so stale causes surface on every gate run instead of in a manual audit.
