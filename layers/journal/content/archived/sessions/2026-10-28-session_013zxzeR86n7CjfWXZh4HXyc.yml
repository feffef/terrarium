frictions:
  - description: Started pnpm gate:scoped and then committed while it ran, so it aborted; pr-workflow says commit and review first, gate last.
    solution: Commit and review before starting the gate, as pr-workflow.md orders it.
    severity: minor
  - description: "prune-friction-ledger.ts --move into an entry ledger-set --create had just written (occurrences: []) kept flow style, putting all ten blocks on one line."
    solution: "Fixed in PR #2630: --move sets the target list to block style, with a test."
    severity: minor
  - description: ledger-set.ts could set summary and cause only on --create, so the rewrite-on-append rule had no tool; the script needed a change first.
    solution: "Fixed in PR #2630: --summary, --cause and --surface now edit an existing entry."
    severity: minor
  - description: Ran my redescribe script twice; its first block rewrote relayed-subagent-claims' fixes with summaries I had retyped instead of copying, so I restored them from git.
    solution: Copy fix summaries from the file programmatically, never retype them, and make one-shot scripts refuse a second run.
    severity: minor
  - description: My first split rule (split only a different friction, keep a fix-caught slip) let me split one cluster and keep two of the same shape; both reviewers flagged it and the user had to settle it.
    solution: Ask the deciding question with a worked pair of examples before applying a rule to data.
    severity: moderate
  - description: The rubric change reached audit agent B after it finished, so it reported once under the old rule and ran again under the new one.
    solution: Settle the rubric with the user before dispatching audit agents (dispatch-subagents §1).
    severity: minor
  - description: An audit agent quoted 'the hint loaded the rules anyway' from occurrences whose description lacks it; the text sat in their solution field, so I re-checked every quote.
    solution: Have audit briefs name which field a quote comes from.
    severity: nit
  - description: The Stop hook asked to push about eight times while reviews, audits and the gate were still running; each needed a reply.
    solution: Harness-side hook, already tracked as stop-hook-nag (accepted).
    severity: nit
  - description: My first scan printed every post-fix occurrence across the ledger (102 KB), which overflowed to a file and needed a second, filtered grep.
    solution: Filter by keyword in the first scan, or hand a full-ledger read to subagents from the start.
    severity: nit
