frictions:
  - description: The home-folder Stop hook asked me to push 3 unpushed commits while the gate had just started; ADR-0004 required holding the push, so I declined.
    solution: This PR lets agents push early; the hook is harness-owned and cannot be changed from the repo.
    severity: nit
  - description: The harness-tag-stop hook blocked my reply because I quoted the harness-only tag while describing the script; I had never dispatched a subagent.
    solution: Have the hook ignore tags inside quotes or code spans, or only count them at a line start; or describe the tag in words.
    severity: minor
  - description: I first looked for the push nag in the repo settings, then guessed it came from the harness, until the owner said it was in the home folder.
    solution: Read the stop-hook-nag ledger entry first (it names stop-hook-git-check.sh), or check ~/.claude/launcher-settings.json when a repo grep finds no such hook.
    severity: minor
  - description: Bash kept a changed directory, so a counting script found zero session logs and a reference grep covered only the ledger folder; both reruns cost calls.
    solution: Use absolute paths in every command instead of relying on cd.
    severity: nit
  - description: My first ADR-0003 edit failed because I typed the old text from memory with wrong line wrapping instead of copying it from the Read output.
    solution: Copy old_string from the file read output.
    severity: nit
  - description: The ADR read hint made me read ADRs 0005, 0015, 0022 and 0012 in full after one-phrase Skill cross-reference repoints; none applied, about 4000 tokens.
    solution: Let adr-read-hint skip an edit that only changes a quoted cross-reference, or limit it to ADRs relevant to the edited lines.
    severity: minor
  - description: I put the claim that frictions-to-fixes and guest-build say unpushed in the PR body from the Spec reviewer's report before checking; a grep afterwards confirmed it.
    solution: Grep each cited line before writing it into a PR body, as CLAUDE.md says.
    severity: nit
  - description: The code-review smell baseline is code-oriented, so most of it did not fit a prose-only diff and the Standards reviewer had to say so.
    solution: Let code-review mark which baseline smells apply to prose, such as duplicated statements of one fact.
    severity: nit
