goal: Let agents push early and open the PR only after review and gate
status: completed
outcome: "PR 2828 merged: agents may push early, and the PR opens only after review and gate"
summary: "The owner first asked why repo rules hold the first push until review and gate when a hook says to push. I answered from ADR-0004 and the hooks, then followed the owner through a series of show-me requests (stale-push-hint, the Stop hooks, the home-folder stop-hook-git-check.sh, the reply-reminder script, harness-tag-stop) that corrected my first guess that the nag came from the repo. The owner then asked whether any strong reason keeps the rule and proposed pushing early with PRs only after review and gate. I found the coupling is ADR-0003 opening the PR at the first push, not the push itself: gate.yml runs only on pull_request and on pushes to main. The owner then directed, in their own words, to read the session logs first, also check the Friction Ledger, check what needs updating, open a PR in this session, use no wip branches and keep the existing branching conventions; that is the approval to build. The logs show 46 Frictions naming the Stop hook, in 44 of 105 logs, and the stop-hook-nag ledger entry reserves this exact change for the owner once the pr-workflow.md trial was judged (it was, on 2026-10-27). I rewrote ADR-0003 and ADR-0004 in place, their summary rules, pr-workflow.md, the Stop-hook section of git-conventions.md and four Skill cross-references. Agent-initiated: the exact wording, leaving the pinned Glass Box pages and the Skill-maintained ledger entry unedited, the follow-up commits that answered the Standards and Spec reviews, and holding the push until the gate was green per the rule still in force. Review dropped a rejected-alternative bullet that was the overtaken old rule (ADR-0030) and surfaced that a session stopping before review now leaves a pushed branch with no PR, which ADR-0003 Consequences now states. CI was green and the PR drew no review comments; the owner merged it on 2026-11-04 at 00:42 UTC. Still open: the Glass Box pages disagree with main until their own Skills re-pin them."
