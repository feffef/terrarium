outcome: 23 build-ready stories filed under the Glass Box spec; building may start
summary: "The owner started this session with /wayfinder and asked for the ticket \"Glass Box: write the build spec\" (#1987) to be worked with them. Mid-session they asked for two more things: a second exploration agent to read every ticket's output, and a read of all ADRs. I claimed the ticket and read all 30 ADRs. Two agents ran: one answered the codebase questions with file:line evidence, the other read every map ticket, comment and the prototype branch for anything the spec had dropped. Then I put the open questions to the owner one at a time, and they decided: Subjects from a map in layer code; plain :file and ::excerpt names; ADRs and glossaries linked via :file and Journal pages via site links; prev/next through Lessons only; a render font exported per layer (rewrites ADR-0024); the landing page carries revision; search out of scope; building may start. Several decisions were the owner's own redirections rather than picks among my options: revisionDate as frontmatter, not read at build time; glossary terms that expand inline, with Glass Box's own definitions in a terms Collection; content creation as its own stories, one per Subject; and relaxing the stop rule to any link per stop, so the Start here Walkthrough can ship with the seeds. The codebase settled the rest, and I stated those as defaults: content path under guide/pages, two-digit prefixes because stems sort as text, the layer test inside pnpm test, and a fix for the smoke helper's prefix handling. I filed 23 sub-issues of #1985 (#1988-#2010) with ready-for-agent and native blocked-by edges. Two are marked human merge: the drift rule (#1995) and the per-Tenant Mermaid font (#1996). I rewrote the spec body (on-hold line lifted, Part 3 added), resolved and closed #1987, closed the stale design ticket #1974 as a duplicate of #1986, and added the map pointer. Nothing was built."
