frictions:
  - description: "The issue #628 github-footer guard blocked an issue_write whose footer was correct — it matched a Claude-Session: line quoted inside the body as evidence about another session."
    solution: Scope the guard's check to the trailing footer block (or the last such line) rather than any occurrence anywhere in the body; quoting another session's trailer as evidence is a legitimate thing an issue body needs to do. Worked around by rephrasing the evidence line.
    severity: minor
  - description: Wrote a full problem/decision/consequences ADR amendment for a one-entry repair. Human review cut it to two sentences; the bulk restated the issue and the section above it.
    solution: Default to the smallest note that records the decision, and check whether each paragraph single-homes something new before writing it — CLAUDE.md's single-home rule applies to new ADR prose, not just to reconciling existing docs. The repo's ADR template (Context/Decision/Consequences) invites full structure even where a sentence would do.
    severity: minor
