outcome: "Repair merged as PR #689; issue #688 filed"
summary: "Human asked whether the session that opened PR #680 left traces in the logs. It did — but a scheduled /digest Routine had fired twice in that one session, and the second pass's authored half had wholesale replaced the first's, leaving a log claiming prs: [] beside a cumulative trace still carrying merge_pull_request and PR #680's branch. Human then instructed both follow-ups explicitly: file the issue (#688) and combine the two runs into one log. Agent-initiated on top of that ask: the ADR-0009 note, since the repair otherwise silently violates the append-only rule that ADR's own truncation-sweep section warns against reusing; and the gated PR (#689), opened automatically per ADR-0003. Human reviewed and called the amendment excessive; cut it from ~55 lines to two sentences. Escalated rather than self-merged — docs/adr/ is human-only under ADR-0004 — and the human merged it green."
