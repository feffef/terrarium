learnings:
  - ADR-0009's "a later extract is a superset of an earlier one" guarantee holds only for the derived half. writeScratch() plainly overwrites the authored scratch, and stitch() takes goal/outcome/summary/prs/frictions from it verbatim — so the two halves of one log have opposite overwrite semantics, and nothing reconciles them.
  - "A clobbered session log is self-diagnosing: because the trace half stays cumulative, the surviving entry contradicts itself (prs: [] beside a merge_pull_request tool count) rather than just looking thin."
ideas:
  - "Add a session-log self-consistency check to validate-content-refs.ts — cross-check each log's authored half against its own derived trace and fail on contradictions: prs empty while toolCounts has create_pull_request/merge_pull_request, or a summary claiming \"no files changed\" while filesEdited is non-empty. That single rule would have caught this clobber at the gate the moment it landed, instead of it sitting on main until someone happened to ask about PR #680 — and it generalizes to any future mechanism that lets the two halves drift apart."
