frictions:
  - description: Mistakenly called ScheduleWakeup (a /loop dynamic-mode tool) while waiting on parallel background review agents, in a plain scheduled (non-/loop) session — wrong tool for this context.
    solution: Caught it before it could fire and cancelled with stop:true. Background Agent-tool completions already self-notify the session, so no wakeup/polling tool was needed at all here — worth a CLAUDE.md/doc callout if this mistake recurs across scheduled Skill runs.
    severity: nit
  - description: pnpm gate:scoped's first run failed with a 120000ms hook timeout in the L2 smoke Nuxt/Playwright browser setup, on a diff that only touched Markdown files.
    solution: Retried once — passed clean (78/78) on the second run, confirming environmental flakiness rather than a regression from the doc edits.
    severity: minor
  - description: Two dispatched reviewer subagents' returned findings quoted CLAUDE.md prose about `permissions.allow`, which tripped the harness's instruction-pattern detector and wrapped their output in a neutralization notice.
    solution: Verified the flagged text was genuinely just quoted CLAUDE.md content, not a prompt-injection attempt, before proceeding. No repo-side fix needed — noting it in case the pattern recurs on future audit-docs runs, since it could mask a real finding under repeated false positives.
    severity: nit
