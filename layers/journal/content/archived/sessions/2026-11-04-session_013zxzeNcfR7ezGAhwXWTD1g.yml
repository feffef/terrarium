frictions:
  - description: I made my first mcp__github__ calls before reading docs/agents/github-integration.md, which CLAUDE.md requires first; a hook flagged it afterward.
    solution: Read the doc in the first batch alongside the git-conventions read, as CLAUDE.md orders.
    severity: nit
  - description: A bash cd into layers/blog/content shifted the working directory twice, which I only noticed from environment notices.
    solution: Use absolute paths and avoid cd in compound commands.
    severity: nit
  - description: Pushes to origin failed twice with remote rejected and Internal Server Error; my retry loop also only tried once because break followed a pipe to tail.
    solution: Check git push's own exit status in the loop (set -o pipefail) and retry with backoff.
    severity: nit
  - description: I drafted a Karen reply claiming the Glass Box textbook still taught the old rule without reading what the textbook update commit had changed; the blind reader picked it, and my later check showed the premise false.
    solution: Open the cited commit's diff before drafting a receipt-style claim from one stale-looking line.
    severity: minor
  - description: I named the pingback stub after my own post's title instead of the target's slug; the spec reviewer caught it before the PR opened.
    solution: Copy the stub filename pattern from the skill reference with the target slug filled in.
    severity: nit
