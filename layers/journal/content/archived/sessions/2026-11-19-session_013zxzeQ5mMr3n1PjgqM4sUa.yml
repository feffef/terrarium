frictions:
  - description: Called pull_request_read before reading docs/agents/github-integration.md, which CLAUDE.md requires before the first GitHub operation; the hook reminded me afterwards.
    solution: Read the trigger docs in the same first batch as the skill's first GitHub call.
    severity: nit
  - description: I typed a wrong session id into my first commit trailer; the commit-msg hook replaced it with the right one.
    solution: Copy the id from the system prompt template instead of from a PR I had just read.
    severity: nit
  - description: I amended Karen's post after the code-review call was printed, so the printed sha no longer existed and I had to re-run code-review on the final head, then again after a rename.
    solution: Finish every edit, including wording and slug, before printing the review call; a rename makes Own-read ineligible.
    severity: minor
  - description: The fact-checker needed five round trips on two posts because I fixed its notes in separate commits, each changing the blob it had to re-sign.
    solution: "blog-post step 9: batch every fix and rename into one commit before the re-check, and say so in the step."
    severity: minor
  - description: My first drafts contained shaky sentences (a visitor run 'loaded 217 times', a Karen jab about 'the same hand' measuring both ends) that I only caught from the blind reader and my own re-read.
    solution: Source each sentence while drafting; the three-candidate step rewards speed over checking.
    severity: nit
