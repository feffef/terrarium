frictions:
  - description: Survey subagent called mcp__github__search_issues directly without first running ToolSearch to load its schema — the second consecutive frictions-to-fixes cycle where the survey step made this exact CLAUDE.md-documented mistake.
    solution: Make the survey subagent's brief in SKILL.md §1 explicitly name ToolSearch as its first action, rather than relying on the generic CLAUDE.md rule alone, which hasn't stuck across two consecutive cycles at this one call site.
    severity: moderate
  - description: mcp__github__search_issues rate-limited on 3 of 6 parallel calls during the survey ("Retry after ~10-11s").
    solution: Single sleep+retry resolved it with no data loss (~15s total wait); not itself worth a dedicated fix, just worth tracking if it recurs.
    severity: minor
  - description: "The #704 impl agent made its code fix correctly, then backgrounded `pnpm gate:scoped` and stopped its own turn expecting an automatic wake that never arrives for a subagent's own backgrounded shell command — leaving the fix uncommitted and the agent silently stalled until I inspected its worktree directly and resumed it via SendMessage with explicit foreground-run instructions."
    solution: 'Make the impl-agent dispatch template in SKILL.md §5 explicit that gate/test commands must run synchronously in the foreground, not backgrounded-and-waited — the existing CLAUDE.md guidance on this (issue #602) is written for orchestrator-authored dispatch briefs that explicitly background something, but this recurred inside a plain, unremarkable "run pnpm gate:scoped" instruction with no backgrounding language at all.'
    severity: major
  - description: Cd-ing into a dispatched subagent's worktree to inspect its git status left my shell's cwd there across a later Stop-hook check, producing a misleading "uncommitted changes" flag that actually belonged to the in-progress subagent, not this session's own repo state — the exact pitfall CLAUDE.md already documents.
    solution: Already documented and already followed (cd back to repo root, re-check) — recorded here only as a reminder the pitfall is easy to hit even knowing about it going in; no new fix needed.
    severity: nit
  - description: The step-1 survey subagent flagged that a growing number of already-fixed/duplicate frictions-to-fixes issues in the tracker slows down screening each cycle, with no concrete single-file fix proposed.
    solution: Not actioned this cycle — worth watching; may warrant a periodic tracker-cleanup pass if it keeps growing.
    severity: nit
