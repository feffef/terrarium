frictions:
  - description: "Dispatched impl agent for #855 used Monitor to watch its own backgrounded pnpm gate:scoped run, then ended its turn expecting Monitor's notification to wake it back up -- a stopped subagent isn't resumed by Monitor, only by an orchestrator SendMessage. Needed two resumes before it ran the gate as a single foregrounded call with a long explicit timeout and finished."
    solution: Sharpen dispatch-subagents's "run verification in the foreground and wait" bullet to explicitly warn against a dispatched subagent backgrounding its own verification command and using Monitor/"wait for it" phrasing to end its turn -- it silently strands the agent rather than erroring visibly.
    severity: moderate
  - description: The frictions-to-fixes survey subagent piped scripts/session-frictions.ts through head -c 100000, the same pipe-a-long-command-through-a-trailing-command anti-pattern CLAUDE.md already warns against. No truncation happened this time, but it was luck.
    solution: Redirect to a file and read that instead of piping through head.
    severity: minor
  - description: scripts/merged-since.ts prints a git fetch progress banner to stdout before its JSON array, breaking naive JSON.parse on stdout; the survey subagent had to fall back to grep instead of structured parsing.
    solution: Route the fetch banner to stderr (or suppress it) so stdout stays clean JSON.
    severity: nit
