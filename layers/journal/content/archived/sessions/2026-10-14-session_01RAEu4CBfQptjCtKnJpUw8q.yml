summary: Scheduled /prune-trial run, so everything was agent-initiated under the Skill's charter. The window script showed the guards.md and pr-workflow recipe trials judgeable. Frictions since landing were only nit/minor for both (the majors in the window belonged to clear-backlog), and no regression issue exists, so both were deleted. A search subagent looked for prose that already failed; the best candidate was the overflow traps in github-integration.md (the search fields rule failed as prose in 1860 and is now held by a guard). I rewrote that file plainly, cut about 31 lines (small mass, noted in the ledger), and kept the heading the guard message cites. A Sonnet probe pinned to the post-prune SHA answered five cases correctly. Standards and Spec review found one lost clause (search scoping), restored, and an off-by-one in the ledger line counts, fixed. Gate green, PR 1936 opened and merged.
