learnings:
  - grades.ts record keeps a deleted page's grades entry until the next run's plan reports it as gone (inferred from the plan's stale line and a grep, not from reading record's code)
  - grades.ts gate writes briefs only for pages whose items are marked edited or whose steps are taken (inferred from getting 2 briefs, then 7 once f1 to f6 were marked)
ideas:
  - "Size the glassbox-improve reading plan to workPerRun: this run read 68 pages with 11 raters to take 8 items. Pick pages by recent change and findings per page so rating cost tracks the work taken, and cut per-run spend"
  - Add a DECISIONS line for churn on promoted pages, for example whether a page promoted within 5 runs may be folded into another. The Prose overrides step was dropped on 11-04, taken on 11-05, and undid a 11-02 promotion
  - "Make the next glassbox-improve reading plan read from the new backlog: low-graded and backlog pages, the A holders and rematch pages, and a rotation sized for a full pass every 6 runs, while keeping the claim check on pages whose text or cited files changed. Claims were found on pages read the day before, so test it against the false-claim finds of the next three runs before narrowing further"
