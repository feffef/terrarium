frictions:
  - description: The table fix took four build/probe rounds. Each column-width guess needed a full ~2-minute pnpm build before the DOM could be measured.
    solution: Measure per-column widths in the first probe, and test the tightest viewport (360px) from the start, not just 390px.
    severity: minor
  - description: The Stop hook demanded a commit/push each time the turn ended mid-build, which fragmented one fix into five commits.
    solution: Commit once when evidence is complete. Squash-merge hides the fragments, but a single-commit run is what pr-workflow asks for.
    severity: nit
  - description: The visitor-brief says to send it verbatim, but a scoped run ('tinkerfund only') has to edit its start instruction. The Skill has no scoped-run provision.
    solution: Asked the owner and edited only the brief's first paragraph. If scoped runs recur, visitor-loop could name how a scope rides into the brief.
    severity: nit
  - description: I chained a push after a background gate with ';' instead of making it depend on the result. So a090bf6a was pushed while the local gate was red (one Journal accordion e2e test outside the diff; CI then passed it).
    solution: Gate the push on the exit code (grep GATE_EXIT=0 && git push), as I did afterwards. Never chain a state-changing push after a check with ';'.
    severity: moderate
  - description: The local gate failed journal.e2e.ts:373 (accordion aria-expanded poll) once, on a diff that doesn't touch the Journal. It passed in two earlier runs and in CI. No tracking issue exists.
    solution: "If it recurs, file it as an intermittent e2e issue, as #750 was for scroll anchoring, with the poll timeout and container load noted."
    severity: minor
  - description: The Stop hook demanded a commit/push each time a turn ended mid-build, which fragmented one fix into six commits and nagged repeatedly while I held pushes for a gate.
    solution: Commit once when evidence is complete. The hook could recognise a running gate:scoped as a reason to wait.
    severity: nit
  - description: The visitor brief says to send it verbatim, but a scoped run ('tinkerfund only') has to edit its start instruction. The Skill has no scoped-run provision.
    solution: Asked the owner and edited only the brief's first paragraph. If scoped runs recur, visitor-loop could name how a scope rides into the brief.
    severity: nit
  - description: The chosen feature was built on the Updates Collection's name before I checked that validate-content-refs forbids Updates on an Upcoming Campaign. I found out only while implementing.
    solution: At tally time, check a feature against the Tenant's content validators before choosing it.
    severity: nit
