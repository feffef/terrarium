frictions:
  - description: The skill's tier rules (Live/Historical/Pack-generic/excluded file lists) exist only as prose in SKILL.md, so each of the 4 parallel lens agents needed the full classification re-typed into its dispatch prompt by hand.
    solution: A small machine-readable tier manifest (or a shared helper script) the orchestrator could compute once and hand to every dispatched agent would cut duplicated prompt text and reduce the chance of a copy-paste tier mismatch between agents.
    severity: nit
  - description: Skill text names only Atlas as excluded 'fictional Tenant content'; Marquee/Midden/Commons content pages aren't explicitly bucketed, so I had to infer from each Tenant's own CONTEXT.md wording (e.g. Marquee's 'same as the Atlas's fiction') that they're excluded too.
    solution: "Have the skill explicitly enumerate which Tenants' content pages are excluded (or state the general test: any Tenant content page that isn't the platform-facing CONTEXT.md/journal-facing-pages is out of scope), rather than one example."
    severity: nit
