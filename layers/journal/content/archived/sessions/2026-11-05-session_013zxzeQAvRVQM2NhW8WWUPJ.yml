frictions:
  - description: Chained git commit, push and gate:scoped in one background command, against git-conventions. Gate was green, but a failed step could have hidden behind the chain.
    solution: Run the push in its own call after reading the gate's exit status.
    severity: minor
  - description: Read git-conventions.md and github-integration.md only after my first git and GitHub commands, because the hook hint arrived afterwards.
    solution: Read both docs before the first command, as CLAUDE.md says.
    severity: nit
  - description: Wrote the wrong session id in the first commit message; the commit-msg hook replaced it with the right trailer, so nothing landed wrong.
    solution: Copy the id from the system prompt template instead of the scorecard.
    severity: nit
  - description: A subagent's 'no main-session gap' claim for ruleVerdicts went into an Inventory note unchecked; the Spec review caught it as wrong and I corrected it.
    solution: Check each subagent count against the log before writing it into a note.
    severity: minor
