summary: 'The user asked to update the Matt Pocock skills. Per their preference I asked scope, method and conflict-handling questions first; they chose all skills, the npx skills CLI, and stop-and-report on conflicts. The CLI refreshed the pinned pack skills. Upstream renamed CONTEXT.md to GLOSSARY.md; I first told the user only domain-modeling was affected, which was wrong (nine other pack skills also carried it), costing extra decision rounds. The user chose "rename repo-wide" and I did it as a path-only swap across about 90 live files (code regexes, tests, rules, docs, ADRs with re-stamped rules), leaving historical logs and published prose alone. On request I surveyed the 14 new upstream skills, read retro and chief-of-staff for ideas worth adopting, and installed implement-spec. The user rejected one review dispatch and told me not to review pack skill content, so the review excluded pack files; it found a stale palimpsest reference, fixed. On user instruction I also made ADR-0021 and its callers say glossary instead of context and retitled the map. The owner enabled auto-merge and PR 1956 merged after CI went green. Everything was human-instructed except excluding historical logs and published prose from the rename, which I decided. Open: two retro ideas (check-not-rule for mechanical frictions; coding standards enforced at review) were reported, not filed.'
