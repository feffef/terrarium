  - description: I told the user only domain-modeling changed after diffing one skill; nine other pack skills also carried the rename, costing two extra decision rounds.
    solution: Grep the whole skills diff for renamed terms before reporting scope.
    severity: moderate
  - description: Stop hook asked four times to commit and push while a conflict decision and review were pending; ADR-0004 and pr-workflow require review before the first push.
    solution: Let the hook defer when a stop-and-report question or code-review is pending.
    severity: minor
  - description: I read green merge-ref gate comments as per-commit results, so I misstated which commits had passed CI until I checked the head.
    solution: Poll get_check_runs on the head SHA; the gate comment names the merge ref, not the branch commit.
    severity: nit
