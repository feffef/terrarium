learnings:
  - "Filtering a read-trace by file extension is the wrong axis: a sampled pass found non-Markdown reads carrying the strongest signal in the corpus (a workflow file that settled an audit's central finding, a manifest holding a schema enum), while every zero-signal entry was harness scratch. Presence of an authored reason discriminates far better than the extension does."
  - A dispatched subagent's transcript is its own jsonl at <transcript-dir>/<session-uuid>/subagents/agent-<id>.jsonl, with a .meta.json sibling carrying agentType and spawnDepth. The parent transcript holds no sidechain records at all, so the extractor's undercount was total, not partial.
  - Across the 43 current session logs, 4 of 14 docs/agents files were opened by no session at all, while pr-workflow.md was opened 17 times. Read-rate varies far more than doc quality does.
ideas:
  - Print the full-install-reset command in scripts/gate.ts's failure output whenever a local typecheck or build step fails. This session's own major friction was a rule sitting in a doc the session had no reason to open, which is exactly the discoverability failure PR 944 teaches frictions-to-fixes to detect. Fixing it in the gate's own output closes the loop on the instance that motivated the PR.
  - "Add a standing zero-read report to audit-docs: every Live doc with 0 reads across the window, printed each run. The data now exists as docReadCounts, and a doc nobody opens is the cheapest possible drift signal to collect."
