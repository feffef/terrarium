name: transform-untested-on-real-data
summary: >-
  Agents wrote a regex or heuristic without first running it on the real data, and review found it misfired.
cause: >-
  A text transform, regex or detection heuristic is written from an assumed input shape and committed before it is run against the real files or historical data it will process; a reviewer then finds the cases it breaks. Signals: "regex written without checking the real data", "heuristic misfired on N claims", a reviewer catching a pattern's misses.
surface: safe
status: open
notes: |-
  2026-10-23 design: a general run-it-on-real-data rule dropped: the three transforms differ in kind, code-review caught two before push, and Verify before you state already covers the third.
occurrences:
  - session: session_01Vg1qDutnhKVav7JDNUdr8J
    date: "2026-10-26"
    severity: moderate
    description: "Commit detection took three review rounds: two regex fixes still backtracked exponentially, then the tokenizer was quadratic on unquoted escapes, before an escape-aware tokenizer held."
    solution: "For hook input parsing, start with a tokenizer whose alternatives start with distinct characters, and time adversarial runs before the first review."
  - session: session_013zxzeQaeB8hhL2FFfcQhv7
    date: "2026-11-08"
    severity: moderate
    description: "Trial of the split index used filler text, which fit one Read; real code-dense teaches hit Read's 25,000-token cap, found only in review"
    solution: "Size files meant for Read in tokens with real content, about 2.5 bytes per token for code names; orient now splits parts under 40 KB"
