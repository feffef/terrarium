name: tail-pipe-guard
summary: >-
  A safety check blocked whole commands that ended by trimming their output.
cause: >-
  The tail-pipe guard denies a whole chained command for a trailing pipe into tail or head; most sessions hit it on their first verification command.
surface: guard-or-hook
status: open
ref: "issues #873, #1769; PR #1793 (guard removed)"
fixes:
  - pr: 1793
    date: "2026-10-11"
    summary: "Removed the check that blocked whole commands for ending in a pipe to tail or head."
