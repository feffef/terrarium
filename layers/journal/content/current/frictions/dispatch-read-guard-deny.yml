    severity: nit
    description: "Wrote the blind-reader brief and called Agent before reading dispatch-subagents, so the dispatch-read guard denied the call, though CLAUDE.md says read it before writing a brief."
    solution: "Read dispatch-subagents at the first sign of a subagent step; the guard caught it at the cost of one retry."
