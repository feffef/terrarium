name: dispatch-read-guard-deny
surface: guard-or-hook
summary: Agents called a subagent or workflow before reading the dispatch-subagents Skill, so a safety check refused the call and they had to retry.
cause: "PR #2550's guard denies the first Agent, Workflow or SendMessage call until the dispatch-subagents Skill is read; agents reach the dispatch first (often a Skill's saved workflow such as clear-backlog-explore, or the visitor dispatches) and resend after reading. Signals: 'dispatch-read guard blocked', 'blocked ... until I read dispatch-subagents', a dispatch repeated unchanged."
status: open
ref: "Comes from PR #2550, the fix for briefs written without the Skill. Issue #2580 closed not planned on 2026-10-27: the owner accepts the one-retry cost; saved workflows stay unexempted, since clear-backlog-build takes orchestrator-written briefs."
related:
  - entry: placeholder-guard-denies-quoted-placeholder
    rule: The guard denied a prompt that only quoted a placeholder token.
notes: |-
  2026-11-04 reopened: fix #2768 (2026-11-02) merged after the owner accepted it on 2026-10-27.
  2026-11-18 owner decision (#3425): the prune trial of 2026-11-14 (184c36f06) cut the read-first lines of #2768, #3136 and #3196, and the denial share rose from 22.3% to 43.1%; one short line, "Read the `dispatch-subagents` Skill before your first dispatch.", is restored in visitor-loop, blog-post, clear-backlog and glassbox-curate.
fixes:
  - pr: 2768
    date: "2026-11-02"
    summary: "visitor-loop and blog-post now say to read dispatch-subagents before their first brief, so the guard does not block it."
  - pr: 3136
    date: "2026-11-12"
    summary: "glassbox-curate Read first names the dispatch-subagents Skill, since the guard blocked the Scout's first Agent call."
  - pr: 3196
    date: "2026-11-12"
    summary: "clear-backlog SKILL.md says to read dispatch-subagents first."
