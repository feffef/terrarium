    severity: nit
    description: "Wrote the blind-reader brief and called Agent before reading dispatch-subagents, so the dispatch-read guard denied the call, though CLAUDE.md says read it before writing a brief."
    solution: "Read dispatch-subagents at the first sign of a subagent step; the guard caught it at the cost of one retry."
  - session: session_01C8G2W6ZfQN7WE4UNUi2GzA
    date: "2026-10-26"
    severity: minor
    description: "Dispatched the three visitor agents before reading dispatch-subagents SKILL.md; the dispatch-read guard blocked all three calls, costing a round trip."
    solution: "Read the Skill before writing any subagent brief; visitor-loop step 2 could name it."
