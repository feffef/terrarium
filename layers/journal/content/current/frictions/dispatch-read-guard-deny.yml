name: dispatch-read-guard-deny
surface: guard-or-hook
summary: Agents called a subagent or workflow before reading the dispatch-subagents Skill, so a safety check refused the call and they had to retry.
cause: "PR #2550's guard denies the first Agent, Workflow or SendMessage call until the dispatch-subagents Skill is read; agents reach the dispatch first (often a Skill's saved workflow such as clear-backlog-explore, or the visitor dispatches) and resend after reading. Signals: 'dispatch-read guard blocked', 'blocked ... until I read dispatch-subagents', a dispatch repeated unchanged."
status: accepted
ref: "Comes from PR #2550, the fix for dispatch-subagents-skill-unread (briefs written without the Skill). Issue #2580 closed not planned on 2026-10-27: the owner accepts the one-retry cost; saved workflows stay unexempted, since clear-backlog-build takes orchestrator-written briefs."
occurrences:
  - session: session_01Cb8ETAZztznLYx6CC7MKyE
    date: "2026-10-26"
    severity: nit
    description: "Workflow call for clear-backlog-explore was blocked by the dispatch-read guard because I had not read dispatch-subagents first (CLAUDE.md trigger)."
    solution: "clear-backlog SKILL.md §1 could say to read dispatch-subagents before the first Workflow call, or the guard could exempt saved workflows that brief their own agents."
  - session: session_01NHL7eNYVjV814TB7bS83kv
