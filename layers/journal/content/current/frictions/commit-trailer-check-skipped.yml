name: commit-trailer-check-skipped
summary: The ADR-0017 commit trailer is checked on the first commit but not on later ones.
cause: "ADR-0017 and git-conventions.md ask for a check that the commit trailer landed after every commit; sessions check the first commit and skip the follow-ups. Signals: 'did not check that the commit trailer landed', 'checked the ADR-0017 commit trailer on the first commit only'."
surface: safe
status: open
occurrences:
  - session: session_013zxzeQESWGW1qj9P1Egphc
    date: "2026-11-15"
    severity: nit
    description: "Did not check that the commit trailer landed on my third commit, which ADR-0017 asks for; the first two were checked and my message carried the trailer."
    solution: "Have the commit-msg hook or a Stop check report a missing Claude-Session trailer."
  - session: session_013zxzeP4NViUQL8i9LwF7Nj
    date: "2026-11-16"
    severity: nit
    description: "Checked the ADR-0017 commit trailer on the first commit only, not on the two follow-up commits, though git-conventions asks for the check after each."
    solution: "Have the commit-msg hook print a one-line trailer confirmation so each commit shows it landed."
