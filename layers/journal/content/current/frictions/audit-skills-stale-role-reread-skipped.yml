    date: "2026-11-19"
    severity: minor
    description: "Step 5 says reread SKILL.md and rewrite gist or role when changes lists an edit; I did not reread any, though 13 Skills changed in the window."
    solution: "The scorecard could print a stale-role flag per Skill whose SKILL.md changed after the entry's date."
  - session: session_013zxzeQAV89N7K2uJN1FbsR
    date: "2026-11-20"
    severity: moderate
    description: "Step 5 says to reread SKILL.md and rewrite stale role or gist when changes lists an edit; I reread only blog-post's and left 13 other changed Skills unchecked, the same gap the 11-19 run disclosed."
    solution: "The scorecard should flag per Skill when SKILL.md changed after the entry date, so the check is a list to clear."
