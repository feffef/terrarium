name: ledger-yaml-hand-edit-errors
summary: >-
  Hand edits to the Journal's YAML data files (this ledger, prune trials, Skill Inventory) broke their format.
cause: >-
  Ledger, prune-trials and Skill Inventory YAML are patched by string replacement or hand-typed: unquoted dates, hashes or colons, a hyphen-split folded scalar, a replaced ref or a match inside a comment broke the file (gate or repair needed), or, with no helper that writes into a named entry, the survey scripts its own splitter to place print-ledger-occurrence.ts blocks. A session repeated in one entry belongs to survey-appends-duplicate-sessions.
surface: safe
status: open
fixes:
  - pr: 2154
    date: "2026-10-16"
    summary: "The survey commits its own ledger changes, built with ledger-occurrence.ts, instead of handing an impl agent a patch."
  - pr: 2297
    date: "2026-10-19"
    summary: "The gate now fails a prune-trial whose territory paths or keywords are not strings, such as an unquoted entry YAML reads as a mapping."
  - pr: 2336
    date: "2026-10-20"
    summary: "Quoted the note values in atlas-specimen's YAML examples so a copied note with a colon parses."
  - pr: 2457
    date: "2026-10-23"
    summary: "ledger-set.ts sets status, ref and fixes and appends occurrences, and refuses a result the ledger schema rejects."
  - pr: 2540
    date: "2026-10-25"
    summary: "print-ledger-occurrence.ts --append files each occurrence block under its named entry, so no hand-made splitter is needed."
  - pr: 2567
    date: "2026-10-26"
    summary: "ledger-set.ts gained --note, --clear-ref and --create so entries need no hand edits."
occurrences:
  - session: session_0147UencKKZS3WLHvsbgywp7
    date: "2026-10-15"
    severity: nit
    description: "Inserted the ledger entry by string-replacing the first 'trials:' which sits in the comment example; YAML broke and gate:scoped failed."
    solution: "Anchor on the line '^trials:' when editing prune-trials.yml; or the file header could say where entries go."
  - session: session_01LpcCJWRYb5grgQe3wBGEwb
    date: "2026-10-15"
    severity: minor
    description: "Docs impl agent's first pass at applying the YAML ledger patch unquoted dates and replaced a full ref; it had to repair both"
    solution: "Ship the ledger patch as a small apply script, or have the survey write per-file edits"
  - session: session_011JKK8rrCwea3xSmL4kw6si
    date: "2026-10-14"
    severity: minor
    description: "The doc agent truncated a ledger cause at an unquoted hash and left new dates unquoted; the Standards review caught both."
    solution: "Have the patch writer quote causes and dates so applying it is a copy."
  - session: session_019xiqcwnB2itTcdugr6EFZL
    date: "2026-10-20"
    severity: minor
    description: "Used yaml's parseDocument(...).toString({lineWidth: 0}) to append new observation entries to 10 existing Skill Inventory YAML files. This collapsed every pre-existing multi-line block-scalar note onto one line, producing a ~2900-line unrelated reformatting diff across all 10 files instead of the intended ~10-line additions. Caught before committing by running `git diff --stat` as a sanity check, not by any guard. Reverted all 10 files with `git checkout --` and redid the same appends with plain-text Edit calls matching the files' existing ~79-column wrap style, which worked cleanly."
    solution: "For an existing file with human-style prose wrapping, append via plain-text Edit matching the surrounding wrap width instead of parse-and-restringify with the yaml package."
  - session: session_0115DiEWEHCxV2UhwYf636YG
    date: "2026-10-20"
    severity: minor
    description: "New observation YAML with colons in unquoted notes failed validate-content-schema in gate:scoped, costing a full gate cycle."
    solution: "atlas-specimen §5 example should say to quote notes that contain colons."
  - session: session_01FTPnEsW1XNhaqYFdxaE24v
    date: "2026-10-20"
    severity: minor
    description: "The audit-docs log-session pass failed silently on an unquoted # because I grepped its output for one phrase; caught only on the next pass."
    solution: "Read the whole --author output, or check its exit code, instead of grepping for one expected line."
  - session: session_01VH74k3Z27QtjR19XNC76qm
    date: "2026-10-20"
    severity: minor
    description: "prune-friction-ledger.ts --summary compares dates as strings, hiding same-day post-fix sessions; the survey agent counted them by hand. Same cause as open issue #2333, and one subagent hit three ledger YAML edit hazards (blank line, quoting)."
    solution: "Compare session start time with the fix merged_at, as issue #2333 proposes."
  - session: session_01SaChfBZfspYfAm5F7ArCfK
    date: "2026-10-21"
    severity: nit
    description: "A word split across a line-wrapped hyphen in visitor-loop.yml's new note (\"Previously-\" / \"escalated\") failed validate-content-schema on the first gate:scoped run, costing one full gate cycle (~2 minutes) before the real failure was caught and fixed."
    solution: "After writing any new folded-scalar note by hand, grep the diff for lines ending in a hyphen before running the gate, not after."
  - session: session_01CfTFFQrkwq1eUsDy61AJzz
    date: "2026-10-23"
    severity: minor
    description: "print-ledger-occurrence.ts prints blocks without cluster labels, so the survey agent wrote a splitter to place 45 blocks."
    solution: "Add a --cluster flag or labelled output to the script."
  - session: session_015rVYXi9nGNG7zeGoi2R9ha
    date: "2026-10-24"
    severity: nit
    description: "Brief cannot set ledger notes through ledger-set.ts, so recording a dropped design needed a hand edit of the YAML."
    solution: "Add a --note flag to ledger-set.ts."
  - session: session_019jfJv6yLmcLUAJiTTomyeu
    date: "2026-10-25"
    severity: minor
    description: "ledger-set.ts has no flag for entry notes, so the two design-drop notes had to be hand-edited into the YAML despite the 'never by hand' rule."
    solution: "Add a --note flag to ledger-set.ts, or say hand-editing notes is allowed."
  - session: session_017vrdmQQwC4obwbJS9G5Dyg
    date: "2026-10-25"
    severity: minor
    description: "ledger-set.ts has no flag for entry notes, so the five drop notes needed a throwaway yaml script despite the 'never by hand' rule."
    solution: "Add a --note flag to ledger-set.ts, or say in the Skill that notes may be scripted."
  - session: session_01PdrNTJLJJMKBGGZfsAhL6w
    date: "2026-10-25"
    severity: nit
    description: "Patching the authored log YAML with sed and string replace failed twice: yaml.stringify rewraps folded strings, so later replaces missed and one sed left a stray line."
    solution: "Edit the authored YAML through parse/stringify only, or give log-session a --set field=value option."
  - session: session_01S9UeKa9mCWdPVBjAezCSaL
    date: "2026-10-25"
    severity: minor
    description: "ledger-set.ts has no notes flag, so I appended the two drop notes to the entry files by editing the YAML directly, against the never-by-hand rule."
    solution: "Add a --note flag to ledger-set.ts (the ledger-yaml-hand-edit-errors cluster, regression of 2457)."
  - session: session_01TaUpbA3idjNZSgGpNjXj8S
    date: "2026-10-26"
    severity: nit
    description: "I wrote a folded YAML note that ended a line in a hyphen; validate:content rejected it as a split word."
    solution: "Have the note-appending step run validate:content right after writing, or wrap without breaking hyphenated words."
  - session: session_01CpD4piFGbFhvGG5KWdtsCG
    date: "2026-10-26"
    severity: nit
    description: "ledger-set.ts cannot set a ref empty or add notes; the survey agent reported its resets left ref empty strings, and the brief does not say if that is acceptable."
    solution: "Add a clear-ref flag, or say in survey-brief.md step 5 what to do."
  - session: session_019g1t4RX7PcR54io7GRdxXK
    date: "2026-10-27"
    severity: nit
    description: "textwrap split hyphenated words in appended observations, so validate:content failed on four files and I rejoined them by hand."
    solution: "Wrap with break_on_hyphens=False, or give audit-skills a script that appends observations."
