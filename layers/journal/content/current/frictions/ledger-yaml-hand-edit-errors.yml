name: ledger-yaml-hand-edit-errors
summary: >-
  Hand or scripted edits to YAML data files (the Friction Ledger, prune trials, Skill Inventory, authored session logs, Tenant content) broke their format, or a missing helper flag forced a hand edit.
cause: >-
  YAML data is patched by string replacement, sed, a re-wrapping serializer or by hand: unquoted dates, hashes or colons, a hyphen-split folded scalar, a replaced ref, a match inside a comment, or a parse-and-restringify that rewraps every prose field broke the file or bloated the diff (gate cycle or repair needed). Where a helper lacked a flag or no helper placed blocks under a named entry, the agent hand-edited or scripted its own splitter; since PR #2630 ledger-set.ts sets summary, cause and surface on an existing entry and --move writes block style, and since PR #3513 prune-friction-ledger.ts removes related links to the entries it deletes. Signals: validate-content-schema failure on a YAML file, 'split word', 'unquoted', 'no flag for', a several-thousand-line reformatting diff, a dangling related link after a prune.
surface: safe
status: open
related:
  - entry: scripted-text-replace-edits
    rule: A scripted replace broke a file that is not a YAML data file.
  - entry: ledger-append-refuses-held-session
    rule: print-ledger-occurrence --append refused a whole call over one held session.
fixes:
  - pr: 2154
    date: "2026-10-16"
    summary: "The survey commits its own ledger changes, built with ledger-occurrence.ts, instead of handing an impl agent a patch."
  - pr: 2297
    date: "2026-10-19"
    summary: "The gate now fails a prune-trial whose territory paths or keywords are not strings, such as an unquoted entry YAML reads as a mapping."
  - pr: 2336
    date: "2026-10-20"
    summary: "Quoted the note values in atlas-specimen's YAML examples so a copied note with a colon parses."
  - pr: 2457
    date: "2026-10-23"
    summary: "ledger-set.ts sets status, ref and fixes and appends occurrences, and refuses a result the ledger schema rejects."
  - pr: 2540
    date: "2026-10-25"
    summary: "print-ledger-occurrence.ts --append files each occurrence block under its named entry, so no hand-made splitter is needed."
  - pr: 2567
    date: "2026-10-26"
    summary: "ledger-set.ts gained --note, --clear-ref and --create so entries need no hand edits."
  - pr: 2630
    date: "2026-10-28"
    summary: "ledger-set.ts sets summary, cause and surface on an existing entry; prune-friction-ledger.ts --move writes block style into an entry created with empty occurrences."
  - pr: 3513
    date: "2026-11-20"
    summary: "prune-friction-ledger.ts drops related links that name an entry it deletes, so a prune or move no longer leaves a dangling link for ledger-content.spec to fail on."
occurrences:
  - session: session_013zxzeS6AE1WUN124PHnm4b
    date: "2026-11-13"
    severity: minor
    description: "My run entry's changes text had colons followed by spaces or line ends, which YAML read as mappings; the workshop page returned a 500 and validate-content failed until I reworded it."
    solution: "The orientation skeleton or glassbox-curate should say a changes entry is one plain string and must not hold a colon plus space."
  - session: session_013zxzeP4m4R15EP9UBBmzfR
    date: "2026-11-14"
    severity: nit
    description: "Two YAML edits (term definitions, run entry) failed validation because an unquoted colon starts a mapping; found only by running validate:content."
    solution: "Glass Box term and run-entry docs could say to quote any scalar holding a colon."
  - session: session_013zxzePak78Sud7pyRQMjeV
    date: "2026-11-15"
    severity: minor
    description: "A colon-space inside an unquoted run-entry YAML item broke validate:content; glassbox unit tests passed, so the gate was the first to see it."
    solution: "Have workshop.spec.ts parse run entries, or tell the Skill to quote each changes item."
  - session: session_013zxzePMRv24VHZ1q24seyG
    date: "2026-11-17"
    severity: minor
    description: "The run entry skeleton printed by orient.ts starts with changes: [] and says nothing about quoting; my unquoted changes lines held a colon, parsed as maps and failed validate-content in the first full gate run, costing a wasted gate run of about three minutes."
    solution: "Make orient.ts print the changes lines quoted in its skeleton, or say so in glassbox-curate's Run entry step."
  - session: session_013zxzeQyUcqMctvqKtP4sHL
    date: "2026-11-20"
    severity: nit
    description: "The run-entry changes field is YAML, and an unquoted colon followed by a space in a changes line failed validation until I quoted it."
    solution: "Show the quoted form in the orientation skeleton for changes entries."
  - session: session_013zxzeQEGaun1DYXBUuVEmu
    date: "2026-11-20"
    severity: minor
    description: "prune-friction-ledger deleted emptied entries and left a related link to one, so ledger-content.spec failed until I removed the link by hand."
    solution: "Fixed in #3513: dropRelated in the prune and move paths."
  - session: session_013zxzeS6gys4MPSEMWnZd1m
    date: "2026-11-23"
    severity: minor
    description: "A run entry's changes line held a colon followed by a space, so validate:content failed; it happened twice, once after I had already committed."
    solution: "The Skill's State section says to quote such a line, but orient.ts's skeleton could warn, or validate:content could name the colon."
  - session: session_013zxzeR2f7URRYrx7PdwVDH
    date: "2026-11-25"
    severity: minor
    description: "My first apply script re-serialized every Inventory yml (1815 deleted lines) because the yaml library reflowed old block notes; I redid it as a text append."
    solution: "audit-skills could ship a small append-observation script so each run does not hand-roll one."
