name: ledger-yaml-hand-edit-errors
summary: >-
  Hand or scripted edits to YAML data files (the Friction Ledger, prune trials, Skill Inventory, authored session logs, Tenant content) broke their format, or a missing helper flag forced a hand edit.
cause: >-
  YAML data is patched by string replacement, sed, a re-wrapping serializer or by hand: unquoted dates, hashes or colons, a hyphen-split folded scalar, a replaced ref, a match inside a comment, or a parse-and-restringify that rewraps every prose field broke the file or bloated the diff (gate cycle or repair needed). Where a helper lacked a flag or no helper placed blocks under a named entry, the agent hand-edited or scripted its own splitter; since PR #2630 ledger-set.ts sets summary, cause and surface on an existing entry and --move writes block style. A session repeated in one entry belongs to survey-appends-duplicate-sessions. Signals: validate-content-schema failure on a YAML file, 'split word', 'unquoted', 'no flag for', a several-thousand-line reformatting diff.
surface: safe
status: open
fixes:
  - pr: 2154
    date: "2026-10-16"
    summary: "The survey commits its own ledger changes, built with ledger-occurrence.ts, instead of handing an impl agent a patch."
  - pr: 2297
    date: "2026-10-19"
    summary: "The gate now fails a prune-trial whose territory paths or keywords are not strings, such as an unquoted entry YAML reads as a mapping."
  - pr: 2336
    date: "2026-10-20"
    summary: "Quoted the note values in atlas-specimen's YAML examples so a copied note with a colon parses."
  - pr: 2457
    date: "2026-10-23"
    summary: "ledger-set.ts sets status, ref and fixes and appends occurrences, and refuses a result the ledger schema rejects."
  - pr: 2540
    date: "2026-10-25"
    summary: "print-ledger-occurrence.ts --append files each occurrence block under its named entry, so no hand-made splitter is needed."
  - pr: 2567
    date: "2026-10-26"
    summary: "ledger-set.ts gained --note, --clear-ref and --create so entries need no hand edits."
  - pr: 2630
    date: "2026-10-28"
    summary: "ledger-set.ts sets summary, cause and surface on an existing entry; prune-friction-ledger.ts --move writes block style into an entry created with empty occurrences."
occurrences:
