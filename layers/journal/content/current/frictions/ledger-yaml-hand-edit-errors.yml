name: ledger-yaml-hand-edit-errors
summary: >-
  Hand edits to this ledger's data files by text replacement broke their format.
cause: >-
  Ledger and prune-trials YAML are patched by string replacement (or a survey patch that repeats a session); unquoted dates, replaced refs or a match inside a comment broke the file (gate or repair needed).
surface: safe
status: open
fixes:
  - pr: 2154
    date: "2026-10-16"
    summary: "The survey commits its own ledger changes, built with ledger-occurrence.ts, instead of handing an impl agent a patch."
occurrences:
  - session: session_0147UencKKZS3WLHvsbgywp7
    date: "2026-10-15"
    severity: nit
    description: "Inserted the ledger entry by string-replacing the first 'trials:' which sits in the comment example; YAML broke and gate:scoped failed."
    solution: "Anchor on the line '^trials:' when editing prune-trials.yml; or the file header could say where entries go."
  - session: session_01LpcCJWRYb5grgQe3wBGEwb
    date: "2026-10-15"
    severity: minor
    description: "Docs impl agent's first pass at applying the YAML ledger patch unquoted dates and replaced a full ref; it had to repair both"
    solution: "Ship the ledger patch as a small apply script, or have the survey write per-file edits"
  - session: session_011JKK8rrCwea3xSmL4kw6si
    date: "2026-10-14"
    severity: minor
    description: "The doc agent truncated a ledger cause at an unquoted hash and left new dates unquoted; the Standards review caught both."
    solution: "Have the patch writer quote causes and dates so applying it is a copy."
  - session: session_01Mf4dUxuWB7WtkC5fVzByH6
    date: "2026-10-16"
    severity: moderate
    description: "The survey subagent's ledger patch listed sessions twice in clusters, failing validate-content; the impl agent dropped 23 occurrences and one distinct description was lost."
    solution: "Have the survey brief require the patch to pass validate:content, merging repeat sessions into one occurrence."
