name: agent-background-flag-guard
summary: >-
  A safety check blocked agents for spelling out a setting that was already the default, when starting a helper agent.
cause: >-
  Skills implied a synchronous Agent dispatch, sessions passed run_in_background: false, and the guard denied the no-op flag.
surface: guard-or-hook
status: fixed
fixedOn: "2026-10-10"
ref: "issues #835, #1651; commit b02ca418"
