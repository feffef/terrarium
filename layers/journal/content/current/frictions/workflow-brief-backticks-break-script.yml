    severity: nit
    description: "Put backticks inside the template-literal brief in clear-backlog-explore.js, which broke the file's syntax until node --check showed it; fixed before any run."
    solution: "Avoid backticks in text inside a JS template literal, or check the script compiles after each brief edit."
