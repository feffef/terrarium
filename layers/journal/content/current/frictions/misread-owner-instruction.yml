name: misread-owner-instruction
summary: >-
  An agent guessed what the owner meant by a short or ambiguous instruction instead of asking, and the work took a detour until the owner corrected it.
cause: >-
  An ambiguous owner instruction or reference (a session type, "link the concepts", the period's focus) is resolved by the agent's first guess, not one clarifying question; the owner then reframes or corrects it, sometimes twice. An irreversible step taken on a bare "Yes" that answered two questions at once counts too. Signals: "meant", "had to reframe", "two more owner prompts", "detour until corrected", a merge on an answer to a combined question.
surface: safe
status: open
notes: |-
  2026-10-20 design: a pr-workflow.md step-4 sentence (do not merge while a question you asked the owner about this PR is unanswered) dropped: one occurrence of that boundary; revisit on a fourth.
  2026-10-23 design: the pr-workflow.md step-4 sentence dropped again: 01DtK8w6 (moved here by the re-cluster, dated 2026-10-12) is a bare Yes to two combined questions, a different boundary (ask a merge as its own question), and no occurrence is new; pr-workflow.md is in the open Prune Trial (PR #2412), revisit when it is judged.
  2026-10-25 design: no change: the five occurrences are five different boundaries (a session type, "link the concepts", "last N days", a bare Yes to two questions, a lens name), nothing new unites them, pr-workflow.md is in the open Prune Trial (PR #2412), and CLAUDE.md "Ask before building" already says to ask; revisit when a fourth shares one boundary.
occurrences:
  - session: session_01VW5yg4NTMt1JBnXCcrhjw9
    date: "2026-10-25"
    severity: moderate
    description: "I took 'coherence lens' literally and spent ~270k subagent tokens on it; the user meant concision"
    solution: "When a user's lens name doesn't match their stated symptom (churn), ask which one first"
  - session: session_013zxzeStBRUtsbccz5kMYNU
    date: "2026-10-31"
    severity: minor
    description: "Started #2721's build on an ambiguous 'Agree' and later flip-flopped on Q7 answers, stopping two build runs mid-flight"
    solution: "When an answer changes a pick under build, confirm the full option before relaunching; ask the clarifying question first, per the owner's stated preference"
  - session: session_013zxzeR4cgWA8MkV51fqC4t
    date: "2026-11-03"
    severity: nit
    description: "Owner's '2 checked the parked ones' was ambiguous; I proceeded on one reading instead of asking, and stated it"
    solution: "Fine here since blocked-check is cheap; for costlier readings, ask"
  - session: session_013zxzeSbd2LJtWWawqrWBJD
    date: "2026-11-05"
    severity: minor
    description: "I closed #2852 as not planned on my own reading of the owner's accept answer, without asking about the Friction entry; the owner then asked, I edited, and they said leave it."
    solution: "When an accept answer implies a ledger change, ask in the grilling whether to update the entry as well as close."
  - session: session_013zxzeQUzcNjB7oD8ukBLGp
    date: "2026-11-06"
    severity: minor
    description: "Filtered the 'so'-clause page-check warnings out of the orientation script without being asked, against the owner's 'dump everything, trim later'; the Spec review caught it"
    solution: "Implement exactly the asked scope; propose an extra filter instead of building it"
  - session: session_013zxzeQWJUyfuXJgdfypeuc
    date: "2026-11-07"
    severity: minor
    description: "My first guide-pages proposal cut the first paragraph, which the owner calls essential; I had weighted run reports over the design intent"
    solution: "Ask the owner which part of a section serves which decision before proposing cuts to it"
