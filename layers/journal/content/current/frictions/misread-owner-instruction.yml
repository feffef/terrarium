name: misread-owner-instruction
summary: >-
  An agent guessed what the owner meant by a short or ambiguous instruction instead of asking, and the work took a detour until the owner corrected it.
cause: >-
  An ambiguous owner instruction or reference (a session type, "link the concepts", the period's focus) is resolved by the agent's first guess, not one clarifying question; the owner then reframes or corrects it, sometimes twice. An irreversible step taken on a bare "Yes" that answered two questions at once counts too. Signals: "meant", "had to reframe", "two more owner prompts", "detour until corrected", a merge on an answer to a combined question.
surface: safe
status: open
related:
  - entry: pr-asked-before-opening
    rule: The session asked the owner whether to open the PR, though ADR-0003 says to open it.
notes: |-
  2026-10-20 design: a pr-workflow.md step-4 sentence (do not merge while a question you asked the owner about this PR is unanswered) dropped: one occurrence of that boundary; revisit on a fourth.
  2026-10-23 design: the pr-workflow.md step-4 sentence dropped again: 01DtK8w6 (moved here by the re-cluster, dated 2026-10-12) is a bare Yes to two combined questions, a different boundary (ask a merge as its own question), and no occurrence is new; pr-workflow.md is in the open Prune Trial (PR #2412), revisit when it is judged.
  2026-10-25 design: no change: the five occurrences are five different boundaries (a session type, "link the concepts", "last N days", a bare Yes to two questions, a lens name), nothing new unites them, pr-workflow.md is in the open Prune Trial (PR #2412), and CLAUDE.md "Ask before building" already says to ask; revisit when a fourth shares one boundary.
  2026-11-09 design: a CLAUDE.md clause (state each option's full effect in the owner's terms) dropped: the two newest occurrences share one boundary (option wording diverges from intent), only two, not the four the 2026-10-25 note set; the owner corrected both in-session; revisit at a third on that boundary.
  2026-11-11 design: no change: the new NhTeF occurrence (relaunched a build on a guess of a correction's scope) is a different mechanism from the 2026-11-09 option-wording pair, so no third occurrence shares that boundary; each was corrected in-session at minor severity; pr-workflow.md is in an open Prune Trial. dropped: a CLAUDE.md clause to restate a corrected scope and wait for a yes. Revisit when a third shares one boundary.
fixes:
  - pr: 3365
    date: "2026-11-16"
    summary: "CLAUDE.md 'Ask before building': an unanswered, option-less or deferred reply is not a yes; ask again or hold the step."
occurrences:
  - session: session_013zxzeQ4cuLLoFfdaf5sE2d
    date: "2026-11-13"
    severity: moderate
    description: "Took 'read them all' literally and read 22 lessons (about 30k words) into the main context before the owner redirected me to explore agents."
    solution: "Size the reading first and propose delegation when it exceeds a few thousand words, before starting."
  - session: session_013zxzeS6AE1WUN124PHnm4b
    date: "2026-11-13"
    severity: moderate
    description: "I misread the owner's 'one page edit that needs the full checks' as a Markdown guide page, though I had flagged that lint and the type check would have nothing to flag; the page had to be rewritten around a code change."
    solution: "When an option's cost is that a check has nothing to do, ask whether a different example teaches more before building."
  - session: session_013zxzeP357BagrJREfWSJ6U
    date: "2026-11-13"
    severity: moderate
    description: "Asked to save one file and renumber the notes, I went on towards review, push and a PR; the owner interrupted twice, once mid-push, and narrowed the task to the README fix."
    solution: "After the owner's first interrupt, stop at the asked step and name the next ones instead of following the Stop hook's push request."
  - session: session_013zxzePoeF13AApZUpBRv9p
    date: "2026-11-13"
    severity: nit
    description: "Picked which digest run was meant without asking, despite the user's ask-questions-first preference; the user did not object, but the choice was an assumption."
    solution: "Ask which run when several match, or state the assumption before reading logs."
  - session: session_013zxzeP5Vhec86YSiybqM8g
    date: "2026-11-13"
    severity: minor
    description: "The owner answered most grilling questions but not Q4 (scope) and Q12 (accept the rest); I proceeded on my recommended picks, a guess the owner never confirmed."
    solution: "Ask only the unanswered questions again, or state plainly that silence is read as a yes, before relying on it."
  - session: session_013zxzeP4NViUQL8i9LwF7Nj
    date: "2026-11-16"
    severity: nit
    description: "Guessed the meaning of the owner's 'or keep the arrow' and edited the page, against their ask-first preference; their next message corrected it, which wasted one edit and a started screenshot run."
    solution: "When a short mid-turn message has two plausible readings, ask the one-line question before editing."
  - session: session_013zxzeSgAcwDrJXAMFAC4Qf
    date: "2026-11-17"
    severity: minor
    description: "Treated the owner's answers on symmetry, display and migration as agreement on the related field's shape, which I had written in prose and never asked about directly."
    solution: "Ask a new stored field's shape as its own question with options, as data-shapes.md says, and hold the build until answered."
  - session: session_013zxzePptQQ7GBhnq1eKsbV
    date: "2026-11-18"
    severity: nit
    description: "Owner's \"everything else waits\" answer to Q10 was ambiguous; I read it as not building the Blog fix and did not re-ask."
    solution: "Phrase a go/hold question so each option names the issue it holds."
  - session: session_013zxzeSSEyKMAcAZESc5L4b
    date: "2026-11-20"
    severity: minor
    description: "I treated a context compaction as not a stop; the owner pointed out it means the window is full, so the first stop rule was wrong."
    solution: "Check what a harness event means for the limit being set before writing a rule around it."
  - session: session_013zxzeT6Ss7hjULbaTx2PS2
    date: "2026-11-23"
    severity: minor
    description: "Owner's #3626 reply 'include the total number of ideas' changed the look, so I built a second sample, then the owner replied 'Just write ideas in b of C sessions' and I guessed it meant dropping the total without asking."
    solution: "When an answer to a look question could be read two ways, ask the one-line question before building a second sample."
  - session: session_013zxzeNZgq56jQ3U7rZbQkk
    date: "2026-11-26"
    severity: minor
    description: "The owner's single reply 'Sounds good' covered two questions; I took it as a yes to the PR and left the length unchanged, rather than asking again."
    solution: "Re-ask the unanswered question (lengthen the body?) before treating the reply as settled."
