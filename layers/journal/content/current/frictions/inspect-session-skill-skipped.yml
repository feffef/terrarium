name: inspect-session-skill-skipped
summary: Agents inspected another session through its log files or by guesswork without invoking the inspect-session Skill, and stated a wrong or unverified answer.
cause: "CLAUDE.md orders the inspect-session Skill before any list_events/get_event read, and before reading a session's API cost and token usage (get_session). A session reads Journal logs or audit-skills output first (QrhK: told the user cost was not recorded when get_session had it), or skips the Skill when a Skill step asks to verify regression reports (TLLY). PR #2812 (2026-11-03) made CLAUDE.md and the Skill's description name the cost and token usage. Signals: 'before invoking inspect-session', 'skipped inspect-session', a claim about another session's cost or events that get_session or list_events later contradicts."
surface: safe
status: open
fixes:
  - pr: 2812
    date: "2026-11-03"
    summary: "CLAUDE.md and the inspect-session Skill description now say the Skill also extracts a session's API cost and token usage (get_session)."
occurrences:
  - session: session_013zxzeQrhKwVsWaJZV8Bs7y
    date: "2026-11-03"
    severity: major
    description: "Read journal logs and audit-skills.ts about other sessions before invoking inspect-session, then told the user cost was not recorded; it was in get_session."
    solution: "Invoke inspect-session first (CLAUDE.md: before inspecting another session); this PR makes cost lookup a stated trigger."
  - session: session_013zxzeTLLY3FmiXzuBKgc2o
    date: "2026-11-01"
    severity: minor
    description: "Skipped inspect-session for the three regression reports (#2751, #2752, #2753) that clear-backlog §2 asks to verify; checked ledger counts and trials only and marked session details unverified."
    solution: "Run inspect-session on one cited session per regression report before grilling, or have the explore workflow do it."
  - session: session_013zxzeSdKDZBdqz6vRp3xW1
    date: "2026-11-12"
    severity: nit
    description: "Wrote 'unreported' as the cost in a PR body while get_session already gave cost_usd; corrected it after rereading the skill."
    solution: "Read get_session before writing the PR body, as Land says."
