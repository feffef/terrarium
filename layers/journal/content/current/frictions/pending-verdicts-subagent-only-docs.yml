name: pending-verdicts-subagent-only-docs
surface: safe
summary: The session-closing verdict list asked for a verdict on dozens of docs that only helper agents had read, which cost a long pass for little guidance.
cause: "log-session --pending lists every rule and doc any subagent loaded or grepped, including evidence-gathering reads at a pinned commit, so the lead writes verdicts it cannot judge as guidance. Signals: 'pending report lists 20 subagent-only rules and docs', 'asked for verdicts on 27 docs that only subagents grepped'. Since PR #3010 (2026-11-10) rule use is captured out of band and --pending verdicts are being replaced."
status: open
notes: |-
  2026-11-08 design: no change dropped: nit, and log-session --pending already prints that the list is a reminder and an omitted entry shows 'no verdict provided'
fixes:
  - pr: 3010
    date: "2026-11-10"
    summary: "Replaced rule and doc verdicts with out-of-band rule-use capture (rule-load ledger and subagent helped.sh note)."
occurrences:
  - session: session_013zxzePZAMHv4JxrNhCtzMg
    date: "2026-11-06"
    severity: nit
    description: "Subagent reports each listed docs verdicts for rules I then had to relay; pending report lists 20 subagent-only rules and docs."
    solution: "Have the brief ask for verdicts in a structured one-line-per-rule form."
  - session: session_013zxzeShUkKqUQT1kYCw5UK
    date: "2026-11-07"
    severity: nit
    description: "log-session --pending asked for verdicts on 27 docs that only subagents grepped or git-showed at a pinned commit, which was evidence-gathering rather than guidance, and cost a long YAML pass."
    solution: "Leave reads of pinned-commit content (git show <sha>:path) out of the pending list, or accept one bulk verdict for claim-check reads."
