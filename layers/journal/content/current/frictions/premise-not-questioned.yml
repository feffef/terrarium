name: premise-not-questioned
summary: >-
  Agents built or hardened a change without first asking whether it should exist at all.
cause: >-
  An agent implements or hardens a solution before asking whether the change should exist or how big it should be; the triage-brief shape was fixed 2026-10-06 (auto-triage SKILL line 57), later cases differ.
surface: safe
status: open
ref: "PR #1821 (adds the rule)"
fixes:
  - pr: 1821
    date: "2026-10-12"
    summary: "Added a working rule to ask whether a change should exist and how big, before building it."
  - pr: 2206
    date: "2026-10-17"
    summary: "The premise rule now fires when a change is recommended, implemented or hardened, and drops any part with no reason from the current goal."
occurrences:
  - session: session_01VaPP7iMRxMvKvX8KQh1qeY
    date: "2026-10-09"
    severity: moderate
    description: "I spent two fix-and-review rounds hardening session-id-guard's ownership parsing before checking whether the guard caught anything at all; the Journal showed its three findings ever were all false positives, so the right fix was deletion. The user had to prompt the step back."
    solution: "Before fixing a recurring false positive in a guard, count its true positives in the Journal first; a guard with none and a stronger point-of-action cover is a deletion candidate (CLAUDE.md: cut before you add)."
  - session: session_01CasnQoauTyLNUxd74agJsP
    date: "2026-10-11"
    severity: moderate
    description: "Five fix rounds on one PR: directory matching and simple-read silence were my design additions beyond the issues, and the late pre-filter optimization caused the only major flaw."
    solution: "Split such work into three PRs, keep the hook to file paths first, and add optimizations only after observed noise."
  - session: session_01VkVtDd4YKNa2KYRyRo8Uvy
    date: "2026-10-14"
    severity: minor
    description: "Round 1 offered #1966's subject merges as a recommendation without a rationale of my own; the owner asked why, and the honest answer was that the merges only existed to limit Space count."
    solution: "Re-derive inherited recommendations against the current premise before offering them."
  - session: session_018wtKTCgkvJwgb3gS8o8JKA
    date: "2026-10-14"
    severity: minor
    description: "Proposed files/docs frontmatter that duplicated the body; the owner had to question it before I saw the one-home violation"
    solution: "Check every proposed field against one-home-per-fact before recommending it"
  - session: session_01CzkKVxSTE7a4amfXnxrvF9
    date: "2026-10-16"
    severity: minor
    description: "Added two CLAUDE.md lines for the 0020/0027 split that the owner had not asked for; the owner interrupted and I reverted them"
    solution: "When a split implies a CLAUDE.md change, ask before editing CLAUDE.md, since it loads in every session"
