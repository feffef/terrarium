name: premise-not-questioned
summary: >-
  Agents built or hardened a change without first asking whether it should exist at all.
cause: >-
  An agent implements or hardens a solution before asking whether the change should exist or how big it should be; the triage-brief shape was fixed 2026-10-06 (auto-triage SKILL line 57); the glassbox-curate memory-lead case (2026-11-07) was fixed by #2973 with a Skill-local check; later cases differ.
surface: safe
status: accepted
acceptedSeverity: moderate
related:
  - entry: proposal-duplicates-existing-decision
    rule: A candidate duplicated an existing feature, issue or recorded decision.
notes: |-
  2026-11-10 survey: issue #2997 closed not planned 2026-11-09 (owner decision in clear-backlog grilling): close with no change; one occurrence, CLAUDE.md 'Question the premise' already covers it and earlier added rules did not stop the cluster.
fixes:
  - pr: 1821
    date: "2026-10-12"
    summary: "Added a working rule to ask whether a change should exist and how big, before building it."
  - pr: 2206
    date: "2026-10-17"
    summary: "The premise rule now fires when a change is recommended, implemented or hardened, and drops any part with no reason from the current goal."
  - pr: 2535
    date: "2026-10-25"
    summary: "Added a general 'Question the premise' bullet to CLAUDE.md's Working conventions, in the wording the owner approved."
  - pr: 2863
    date: "2026-11-05"
    summary: "CLAUDE.md Ask before building: clarify all user-facing UI with extra care, settling in the first round what each displayed value (label, hover, metric) follows (closes #2853)."
  - pr: 2973
    date: "2026-11-08"
    summary: "glassbox-curate SKILL.md: before taking any lead from the memory page, check it still stands and that no earlier step (settled titles, a pending Subject move) should come first (closes #2958)."
occurrences:
  - session: session_013zxzeTDG9WP45rYE5hRMpG
    date: "2026-11-06"
    severity: minor
    description: "Proposed a claim check on cited-file changes without first reading glassbox-update, which already does it daily; the owner had to point out the overlap"
    solution: "Before proposing a change to one Glass Box Skill, read the sibling Skills that touch the same pages"
  - session: session_013zxzeRCCqrxVitqSaxJa4K
    date: "2026-11-07"
    severity: moderate
    description: "Planned and costed a 12-file rename, grepping every link, before checking whether titles were settled; the owner's question about a title consolidation redirected the run."
    solution: "The memory page's good next focus should say titles are not yet reviewed, or the rename lead should wait until they are."
  - session: session_013zxzeRL5rU5zS3WRCkH3TE
    date: "2026-11-08"
    severity: moderate
    description: "Briefed the build with an unrequested same-length-or-shorter ceiling from ADR-0027 (an add, not a fix), so it cut the overview examples; the owner had to ask why and a restore PR followed."
    solution: "Brief only the constraints the issue or owner stated; ask before trading existing text for new text, and apply ADR-0027 only when an instruction caused a problem."
  - session: session_013zxzeQaeB8hhL2FFfcQhv7
    date: "2026-11-08"
    severity: minor
    description: "I kept the 400 teaches cap after the index split made it unneeded, then proposed recording the cut names in memory, which costs the same context"
    solution: "Apply CLAUDE.md's Question the premise when a constraint's reason goes away: the split index removed the cap's job, so drop the cap"
  - session: session_013zxzeNeWJTvqXPTEeR63qC
    date: "2026-11-11"
    severity: moderate
    description: "Wrote the first Skill inventory Lesson from the schema and audit-skills alone, without tracing who reads the inventory; the owner found the concept weak and I redid it."
    solution: "Before a Lesson on Terrarium data, grep for every consumer of that data, as glassbox-lesson's read-the-source step intends, then write the concept."
  - session: e5f88467-c386-4b88-8c16-b9786c748d41
    date: "2026-11-13"
    severity: moderate
    description: "Broke CLAUDE.md 'Question the premise': applied and backfilled under the inherited Seedling/map exclusions and the narrow platform path list without giving each a reason; the owner caught all three by asking"
    solution: "Before backfilling under a rule, run it on two real issues and ask what an unlabelled result means for the label's reader (visitor-loop)"
  - session: session_013zxzeNiyBNZD3Zn5dUm9Bq
    date: "2026-11-13"
    severity: minor
    description: "For the context file's raw-JSON ideas I first committed a hand-conversion stopgap; the owner had to ask why before I proposed the plain-text ideas.ts list command."
    solution: "When a report shows a tool's output format is the problem, propose fixing the tool before telling each run to reformat by hand."
  - session: session_013zxzePH9gQTPAHjR7vCj71
    date: "2026-11-15"
    severity: minor
    description: "Proposed and then built a survey follow-up whose benefit I could not state when asked; the premise check CLAUDE.md asks for came only after the gate and review."
    solution: "Before offering a follow-up, name the reader it helps and what decision changes; drop it if none."
  - session: session_013zxzeNd9wP36dUYyykDdBv
    date: "2026-11-18"
    severity: minor
    description: "I copied the owner's pick 'set the status to fixed' and the ledger fix without checking them against the schema (no fixed value; fixes takes a PR number), so the builder, both reviewers and I each spent a step on it."
    solution: "Before dispatch, check a brief's literal values (status words, PR numbers) against the schema, as the briefs' own 'verify claims' rule asks."
  - session: session_013zxzeTKSiBSmkCLfn4BYL6
    date: "2026-11-20"
    severity: moderate
    description: "The owner judged my #3530 Skill rewording unhelpful; explore had said stopping after one PR and skipping steps are separate failures that wording may not fix, yet I built the wording change as picked."
    solution: "When explore says an option may not fix the cause, ask for a dedicated session or a cause check first, as option d suggested, before building the wording."
  - session: session_013zxzeSSEyKMAcAZESc5L4b
    date: "2026-11-20"
    severity: minor
    description: "I assumed several curate sessions could run at once and added a per-focus open-PR refresh; the owner had to correct the premise."
    solution: "Ask how many sessions run concurrently before designing coordination between them (CLAUDE.md: question the premise)."
