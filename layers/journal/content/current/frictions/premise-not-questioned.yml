name: premise-not-questioned
summary: >-
  Agents built or hardened a change without first asking whether it should exist at all.
cause: >-
  An agent implements or hardens a solution before asking whether the change should exist or how big it should be; the triage-brief shape was fixed 2026-10-06 (auto-triage SKILL line 57); the glassbox-curate memory-lead case (2026-11-07) was fixed by #2973 with a Skill-local check; later cases differ.
surface: safe
status: tracked
ref: "issue #2997"
fixes:
  - pr: 1821
    date: "2026-10-12"
    summary: "Added a working rule to ask whether a change should exist and how big, before building it."
  - pr: 2206
    date: "2026-10-17"
    summary: "The premise rule now fires when a change is recommended, implemented or hardened, and drops any part with no reason from the current goal."
  - pr: 2535
    date: "2026-10-25"
    summary: "Added a general 'Question the premise' bullet to CLAUDE.md's Working conventions, in the wording the owner approved."
  - pr: 2863
    date: "2026-11-05"
    summary: "CLAUDE.md Ask before building: clarify all user-facing UI with extra care, settling in the first round what each displayed value (label, hover, metric) follows (closes #2853)."
  - pr: 2973
    date: "2026-11-08"
    summary: "glassbox-curate SKILL.md: before taking any lead from the memory page, check it still stands and that no earlier step (settled titles, a pending Subject move) should come first (closes #2958)."
occurrences:
  - session: session_013zxzeQ8EBq9v7NXqWmAFRF
    date: "2026-10-27"
    severity: minor
    description: "I designed the running out-of-remit issue without checking that the Friction Ledger already clusters run problems; run 1's finding landed in both, and the owner had to point it out."
    solution: "Before adding a place to record findings, check what the Ledger and session-log fields already capture."
  - session: session_013zxzeSAtjCQiatdUuuFCRJ
    date: "2026-11-03"
    severity: minor
    description: "My own recommendation to run the A election on rematches only would have made a first A impossible; I caught it before building by checking the rule and asked the owner."
    solution: "Run a recommendation on two concrete cases before giving it (CLAUDE.md, Question the premise); the A rule needs a first win."
  - session: session_013zxzePH6icDjygJ7mcE1s7
    date: "2026-11-04"
    severity: moderate
    description: "I assumed the hover label should always show cost; the user wanted the selected metric. A premise check on the first ask would have caught it."
    solution: "Ask in the first round whether the label follows the metric switch or is fixed to cost."
  - session: session_013zxzeTDG9WP45rYE5hRMpG
    date: "2026-11-06"
    severity: minor
    description: "Proposed a claim check on cited-file changes without first reading glassbox-update, which already does it daily; the owner had to point out the overlap"
    solution: "Before proposing a change to one Glass Box Skill, read the sibling Skills that touch the same pages"
  - session: session_013zxzeRCCqrxVitqSaxJa4K
    date: "2026-11-07"
    severity: moderate
    description: "Planned and costed a 12-file rename, grepping every link, before checking whether titles were settled; the owner's question about a title consolidation redirected the run."
    solution: "The memory page's good next focus should say titles are not yet reviewed, or the rename lead should wait until they are."
  - session: session_013zxzeRL5rU5zS3WRCkH3TE
    date: "2026-11-08"
    severity: moderate
    description: "Briefed the build with an unrequested same-length-or-shorter ceiling from ADR-0027 (an add, not a fix), so it cut the overview examples; the owner had to ask why and a restore PR followed."
    solution: "Brief only the constraints the issue or owner stated; ask before trading existing text for new text, and apply ADR-0027 only when an instruction caused a problem."
