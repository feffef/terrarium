name: premise-not-questioned
summary: >-
  Agents built or hardened a change without first asking whether it should exist at all.
cause: >-
  An agent implements or hardens a solution before asking whether the change should exist or how big it should be; the triage-brief shape was fixed 2026-10-06 (auto-triage SKILL line 57), later cases differ.
surface: safe
status: open
ref: "issue #2520 closed by PR #2535"
fixes:
  - pr: 1821
    date: "2026-10-12"
    summary: "Added a working rule to ask whether a change should exist and how big, before building it."
  - pr: 2206
    date: "2026-10-17"
    summary: "The premise rule now fires when a change is recommended, implemented or hardened, and drops any part with no reason from the current goal."
  - pr: 2535
    date: "2026-10-25"
    summary: "Added a general 'Question the premise' bullet to CLAUDE.md's Working conventions, in the wording the owner approved."
occurrences:
  - session: session_012f7o6FcYxq1MWxvsdgKS6m
    date: "2026-10-20"
    severity: moderate
    description: "I recommended and built #2319's prose-only review skip without weighing that review catches errors in instructions; the owner reversed it the same day, costing a revert and a second ADR PR."
    solution: "When a change removes a review step, ask what kinds of defect that step catches in the files it would skip before recommending it."
  - session: session_01Wd2WvrPmFRYHAZmf7DYnrG
    date: "2026-10-23"
    severity: minor
    description: "Picked the by-season browser feature without reading the Midden's git history; the refiner then found the owner had removed the same legend, costing a round trip."
    solution: "Before choosing a feature, grep git log and decisions for the thing the idea would rebuild; the Skill could tell step 3 to check `git log -S` on the area."
  - session: session_013zxzeQ8EBq9v7NXqWmAFRF
    date: "2026-10-27"
    severity: minor
    description: "I designed the running out-of-remit issue without checking that the Friction Ledger already clusters run problems; run 1's finding landed in both, and the owner had to point it out."
    solution: "Before adding a place to record findings, check what the Ledger and session-log fields already capture."
