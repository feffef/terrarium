name: reviewer-quotes-lose-line-breaks
surface: safe
summary: Doc reviewers' quoted sentences did not match the file's line breaks, so exact-text edits failed and had to be redone.
cause: "Since PR #1821, audit-docs and other doc reviewer subagents quote the sentence instead of citing lines, but they flatten or rewrap multi-line text, so an Edit or scripted replace on the quote fails and a checker must re-find the real text. Signals: 'flat sentences', 'differed in line wrapping', 'exact-string edits failed'."
status: open
ref: "Comes from PR #1821, the fix for the former reviewer-line-ranges-off cluster (reviewers citing wrong line numbers)."
fixes:
  - pr: 1957
    date: "2026-10-14"
    summary: "Doc-audit reviewers now keep line breaks when quoting a sentence, so exact-text edits no longer fail."
occurrences:
  - session: session_01Hw8mVJmgWejGc6YWi8ngnm
    date: "2026-10-23"
    severity: nit
    description: "A reviewer's quote of blog-post differed in line wrapping from the file, so the scripted edit failed once and needed a re-view."
    solution: "Tell reviewers to copy quotes from the file with line breaks verbatim, or have checkers return grep-verified text."
