name: github-search-overflow
summary: >-
  GitHub searches returned so much text that they flooded the agent's working memory.
cause: >-
  mcp__github__search_issues and search_pull_requests return full bodies unless `fields` omits them, so a broad or early query floods context; github-integration.md documents it, but sessions hit it before reading the doc or anyway.
surface: guard-or-hook
status: fixed
fixedOn: "2026-10-13"
ref: "issue #1860; PR #1869 (merged 2026-10-13T06:11Z, github-search-fields-guard denies a search without fields)"
fixes:
  - pr: 1869
    date: "2026-10-13"
    summary: "Added a guard that blocks GitHub search calls that do not limit which fields come back."
occurrences:
  - session: session_01RGKoFL9ZKfvji8zENgRVBT
    date: "2026-10-07"
    severity: nit
    description: "A search_pull_requests call with 60 results returned 246k characters and had to be re-parsed from a saved file, wasting a turn"
    solution: "blog-post step 2 could say to pass perPage 10 or use list_pull_requests with fields to read merged PR titles"
  - session: session_01WFq4ZnYVWTyGHAAxqo5wKb
    date: "2026-10-10"
    severity: minor
    description: "Called mcp__github__search_pull_requests before reading docs/agents/github-integration.md; the unscoped search returned six full PR bodies (~15k tokens), the overflow trap that doc warns about."
    solution: "Read github-integration.md before the first mcp__github call, and pass fields omitting body to search_pull_requests."
  - session: session_0147GPfMLJfFV6JbmC4HZGHb
    date: "2026-10-12"
    severity: minor
    description: "First search_issues call returned ~10 full issue bodies, flooding context."
    solution: "Pass fields without body, as github-integration.md says; read it before the first call."
  - session: session_01BkB4AFUGkEudyf13aa44Wy
    date: "2026-10-12"
    severity: minor
    description: "A broad search_issues query returned huge issue bodies (Tinkerfund spec), flooding context."
    solution: "Use minimal_output or narrower queries for duplicate searches."
  - session: session_01RAEu4CBfQptjCtKnJpUw8q
    date: "2026-10-14"
    severity: nit
    description: "Ran git fetch and merge-base before reading git-conventions.md, and a GitHub search before github-integration.md; the search was also denied for missing fields."
    solution: "Read the trigger docs first; the search guard message was clear."
