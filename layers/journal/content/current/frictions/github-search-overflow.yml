name: github-search-overflow
summary: >-
  GitHub searches returned so much text that they flooded the agent's working memory.
cause: >-
  mcp__github__search_issues and search_pull_requests return full bodies unless `fields` omits them, so a broad or early query floods context. The guard now denies a search without `fields`; what remains is a Skill step that needs PR bodies and points to no cheap path.
surface: guard-or-hook
status: open
ref: "issue #2210 closed by PR #2216; issue #1860; PR #1869 (merged 2026-10-13T06:11Z, github-search-fields-guard denies a search without fields)"
fixes:
  - pr: 1869
    date: "2026-10-13"
    summary: "Added a guard that blocks GitHub search calls that do not limit which fields come back."
  - pr: 2216
    date: "2026-10-17"
    summary: "blog-post step 2 now finds the last blog PRs from a titles-only listing instead of a body search."
occurrences:
  - session: session_01RGKoFL9ZKfvji8zENgRVBT
    date: "2026-10-07"
    severity: nit
    description: "A search_pull_requests call with 60 results returned 246k characters and had to be re-parsed from a saved file, wasting a turn"
    solution: "blog-post step 2 could say to pass perPage 10 or use list_pull_requests with fields to read merged PR titles"
  - session: session_01WFq4ZnYVWTyGHAAxqo5wKb
    date: "2026-10-10"
    severity: minor
    description: "Called mcp__github__search_pull_requests before reading docs/agents/github-integration.md; the unscoped search returned six full PR bodies (~15k tokens), the overflow trap that doc warns about."
    solution: "Read github-integration.md before the first mcp__github call, and pass fields omitting body to search_pull_requests."
  - session: session_0147GPfMLJfFV6JbmC4HZGHb
    date: "2026-10-12"
    severity: minor
    description: "First search_issues call returned ~10 full issue bodies, flooding context."
    solution: "Pass fields without body, as github-integration.md says; read it before the first call."
  - session: session_01BkB4AFUGkEudyf13aa44Wy
    date: "2026-10-12"
    severity: minor
    description: "A broad search_issues query returned huge issue bodies (Tinkerfund spec), flooding context."
    solution: "Use minimal_output or narrower queries for duplicate searches."
  - session: session_01N9bwDKW51kMS6WJvK2nfSU
    date: "2026-10-16"
    severity: minor
    description: "search_pull_requests asking for body returned about eight full PR bodies (visitor-loop tallies), flooding context before I read the overflow advice."
    solution: "Use scripts/recent-prs.ts or list_pull_requests with fields that omit body for the last blog PRs, as the blog-post step could say."
  - session: session_016Nsq9SWL64V4RqDJPQYodp
    date: "2026-10-19"
    severity: nit
    description: "Called search_issues without fields and the guard denied it; one wasted call."
    solution: "Mention the fields requirement in the prune-trial Skill's tracker step."
  - session: session_01RZ2pN3CEsoJyKxUWC2RFW5
    date: "2026-10-20"
    severity: minor
    description: "The blog-post step 2 hunt for stories reads dozens of PR bodies and logs; the Skill gives no cheap way to find the windowed finished stories."
    solution: "A script printing merged PRs in the window with their issue links and any revert or follow-up pairs."
