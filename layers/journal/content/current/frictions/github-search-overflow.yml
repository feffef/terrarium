name: github-search-overflow
summary: >-
  GitHub searches returned so much text that they flooded the agent's working memory.
cause: >-
  mcp__github__search_issues and search_pull_requests return full bodies unless `fields` omits them, so a broad or early query floods context. The guard now denies a search without `fields`. Signals: a search_issues or search_pull_requests result of many full bodies, a guard deny for a missing `fields`.
surface: guard-or-hook
status: open
ref: "Its Prune Trial (PR #2375) was judged by PR #2493 and left prune-trials.yml; no open trial, issue or PR tracks it. Earlier: issue #1860; PR #1869 (github-search-fields-guard)."
fixes:
  - pr: 1869
    date: "2026-10-13"
    summary: "Added a guard that blocks GitHub search calls that do not limit which fields come back."
  - pr: 2375
    date: "2026-10-21"
    summary: "Tightened the search bullets in github-integration.md to the goal (-4 lines), leaving the fields rule to the search guard's deny message (a Prune Trial)."
occurrences:
  - session: session_0147GPfMLJfFV6JbmC4HZGHb
    date: "2026-10-12"
    severity: minor
    description: "First search_issues call returned ~10 full issue bodies, flooding context."
    solution: "Pass fields without body, as github-integration.md says; read it before the first call."
  - session: session_01BkB4AFUGkEudyf13aa44Wy
    date: "2026-10-12"
    severity: minor
    description: "A broad search_issues query returned huge issue bodies (Tinkerfund spec), flooding context."
    solution: "Use minimal_output or narrower queries for duplicate searches."
  - session: session_016Nsq9SWL64V4RqDJPQYodp
    date: "2026-10-19"
    severity: nit
    description: "Called search_issues without fields and the guard denied it; one wasted call."
    solution: "Mention the fields requirement in the prune-trial Skill's tracker step."
  - session: session_01Wd2WvrPmFRYHAZmf7DYnrG
    date: "2026-10-23"
    severity: nit
    description: "Called mcp__github__search_issues without `fields`; the guard blocked it, and the required GitHub doc was read only afterwards."
    solution: "Read docs/agents/github-integration.md before the first GitHub call, as CLAUDE.md says."
  - session: session_013SbWSgqz4tjVcTMz9vF1mu
    date: "2026-10-24"
    severity: nit
    description: "Called search_issues without `fields`, blocked by the GitHub search-fields guard (#1860); retried immediately with fields"
    solution: "Pass `fields` on every search_issues/search_pull_requests call from the start, per github-integration.md's own warning"
