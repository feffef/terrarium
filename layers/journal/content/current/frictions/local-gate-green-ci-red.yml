name: local-gate-green-ci-red
summary: >-
  Checks passed on the agent's machine but failed on GitHub, because GitHub tested them against a newer main.
cause: >-
  CI tests the merge ref against the current main with its own git version; the local gate tests the branch as cut with the container git and may skip Heavy as Inert, so a local green still fails in CI.
surface: safe
status: open
ref: "issue #2138 closed not planned on 2026-10-19: the owner chose to do nothing for now and to build merge-ref gating in gate.ts if a third base-drift case lands."
fixes:
  - pr: 1483
    date: "2026-09-29"
    summary: "Documented that the container's git version can differ from CI's and affect test fixtures."
  - pr: 1824
    date: "2026-10-12"
    summary: "Fixed two flaky tests (worktree check timing and a checkout test) that passed locally but failed in CI."
occurrences:
  - session: session_01VPNHf6qDdJPXX23GghKs74
    date: "2026-10-16"
    severity: major
    description: "gate:scoped passed on the Glass Box branch but CI failed: main gained a Nitro lesson whose 'Nitro' link text failed the new link-text check"
    solution: "clear-backlog could fetch and merge origin/main into a branch just before push, so a new check meets the latest content"
