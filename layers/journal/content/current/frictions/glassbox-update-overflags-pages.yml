name: glassbox-update-overflags-pages
summary: "The glassbox-update script flags most guide pages whenever a directory they cite changes, so reviewers sweep pages that need no edit."
cause: ".agents/skills/glassbox-update/scripts/glassbox-update.ts matches a page whose cited path ends in \"/\" against any changed file under it (line ~77), and pins pages with changed paths but no edited range. Signals: \"directory-level paths\", \"flagged pages look done before they are reviewed\". Since PR #3092 (2026-11-11) a page whose changed paths are all covered by shifted ranges gets no reader unless it is in the rotation."
surface: safe
status: open
ref: "issue #2193 closed by PR #2207"
related:
  - entry: glassbox-update-edited-range-pages-left-stale
    rule: A page with an edited range was left unpinned and unreported.
notes: |-
  2026-10-23 survey: issue #2097 (have the report carry each page's cited-file diffs) was closed not planned on 2026-10-16; 01Aji3mg asks for the same after PR #2207.
fixes:
  - pr: 2207
    date: "2026-10-17"
    summary: "A cited directory now flags a page only when its listing changes between the page's pinned revision and main."
  - pr: 3092
    date: "2026-11-11"
    summary: "glassbox-update.ts reports needsReader per page; SKILL.md step 5 sends no claim-check reader to a flagged page whose changed paths are all covered by shifted ranges, except the rotation page."
  - pr: 3303
    date: "2026-11-14"
    summary: "glassbox-update step 4 re-checks a flagged page as a whole only for needsReader true, prose-only flags and rotation pages; other flagged pages get a quick look."
occurrences:
  - session: session_013zxzeNbirdJSVYjNLe6nsJ
    date: "2026-11-12"
    severity: moderate
    description: "Skill step 4 asks for a whole-page re-check of all 53 flagged pages with no scoping, so the run cost seven subagents for mostly pin-only pages."
    solution: "Scope the whole-page re-check to pages whose cited files changed meaningfully (needsReader), as step 5 already does."
  - session: session_013zxzePP7cbXFfoqEXbKwKW
    date: "2026-11-12"
    severity: nit
    description: "The Skill says re-check each flagged page as a whole, but 11 re-pin-only pages were checked through scoped reader reports only, not read whole by me."
    solution: "Say in step 4 that a flagged page with no changed claim needs only the scoped reader, or require a whole read."
  - session: session_013zxzePSF8TMPrem83fkCmA
    date: "2026-11-13"
    severity: minor
    description: "The skill's one-line instruction implies about 50 page checks; it took seven agents and many turns, with a pilot rule slowing the fan-out."
    solution: "State in the Skill that an all-pages-flagged run is expected and give a ready batch script."
  - session: session_013zxzeRb6jw4zGjcwT5aQnQ
    date: "2026-11-22"
    severity: minor
    description: "Subagent report sat unusably long; checking 32 pages needed five agents and ~8 hand-backs to read."
    solution: "Have the script emit per-page claim-check briefs and ask subagents to return only falseClaims."
