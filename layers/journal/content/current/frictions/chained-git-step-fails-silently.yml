name: chained-git-step-fails-silently
summary: >-
  A failed git add or commit inside a chained command meant the commit never happened, and the agent reviewed or gated the wrong state.
cause: >-
  A git add with an ignored pathspec, or a commit given both -m and -F, errors; `&&` skips the commit (or the commit fails unseen) and the session carries on, reading an older HEAD or running the gate on an uncommitted tree. git-conventions.md covers only a branch rename or create chained with the commit. Signals: 'git add' error, 'HEAD stayed on an old commit', 'git log -1 showed an older commit', 'both -m and -F'.
surface: safe
status: open
fixes:
  - pr: 2525
    date: "2026-10-25"
    summary: "Its git-conventions section now also covers a git add of an ignored path and a commit given both -m and -F, and says to read git log -1 before the gate."
occurrences:
  - session: session_013zxzeSRDhsoSRs2a2bGVgW
    date: "2026-10-31"
    severity: nit
    description: "A chained Python edit failed on an assertion but the following git add and commit still ran, committing the unedited Digest; I amended afterward."
    solution: "Never put a commit after a step that can fail in the same call; check exit status first, as git-conventions already says."
  - session: session_013zxzeNezKVRxRiZLs4z9n4
    date: "2026-11-04"
    severity: nit
    description: "I passed both -m and -F to git commit, which git rejects; the failed commit left the branch unchanged and I redid it."
    solution: "Use only -F for commit messages, as git-conventions says."
  - session: session_013zxzeR6WXvZ48FrLjwtn9b
    date: "2026-11-08"
    severity: nit
    description: "A chained gate command used a remote-tracking ref that did not exist after the branch restart and exited 128 before the gate ran; I had to rerun it."
    solution: "Run the gate as its own command and check refs in a separate step, as git-conventions says."
  - session: session_013zxzeQWJUyfuXJgdfypeuc
    date: "2026-11-07"
    severity: nit
    description: "The denied command also held the commit-message heredoc, so the message file never existed and the commit failed once more"
    solution: "Write the message file with the Write tool in its own step before committing"
  - session: session_013zxzeS3L4n7Fke1jtRbDTc
    date: "2026-11-10"
    severity: nit
    description: "Chained git add -A and git commit in one call, against the very rule I was pruning; I checked the commit landed."
    solution: "Run add and commit as separate calls, as the pruned section says."
  - session: session_013zxzeR7qQ3HKogNsnf5Zm8
    date: "2026-11-11"
    severity: nit
    description: "I chained git add, a heredoc and git commit in one Bash call, against git-conventions one-state-changing-command-per-call; no harm."
    solution: "Run add, commit and push each in their own Bash call and check each landed."
  - session: session_013zxzeNhTtnWyYs2Mh6hn26
    date: "2026-11-12"
    severity: nit
    description: "I ran git add and git commit together with printf in one Bash call several times, against git-conventions.md's rule of one state-changing git command per call."
    solution: "Read the rule again before the first commit, or commit through a small helper script that checks each step."
  - session: session_013zxzeQ9FTpQjBywTHWkdXF
    date: "2026-11-13"
    severity: nit
    description: "I chained a git log check and a git push in one Bash call, against git-conventions' rule that a state-changing git command runs alone; the push then failed and its exit code was read through a pipe."
    solution: "Run the push in its own call, as the doc says."
