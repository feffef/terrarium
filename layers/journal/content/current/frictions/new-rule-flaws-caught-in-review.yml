name: new-rule-flaws-caught-in-review
surface: safe
summary: A rule or selection step drafted for a Skill or the ledger had a logic flaw that only later reviewers caught, costing extra rounds.
cause: "The author drafts a new ordering, splitting or selection rule without trying it on the cases it must handle (a ranking direction, two clusters of the same shape); reviewers or the owner find the flaw after the draft. Signals: 'first draft', 'reviewers flagged', 'would have raised the best pages', 'the user had to settle it'.\" Since PR #2810 (2026-11-03) CLAUDE.md Question the premise also asks for two concrete cases across consecutive runs when a rule rotates or carries state."
status: open
fixes:
  - pr: 2697
    date: "2026-10-30"
    summary: "CLAUDE.md asks to run a new ordering, split or selection rule on two concrete cases before showing it"
  - pr: 2810
    date: "2026-11-03"
    summary: "CLAUDE.md Question the premise: a new ordering, split or selection rule is also run across consecutive runs if it rotates or carries state."
occurrences:
  - session: session_013zxzeRkQabGaMQ8gphe4Ra
    date: "2026-11-02"
    severity: moderate
    description: "Didn't see until the Spec review that the K=3 rotation made two consecutive A wins impossible on 4 of 5 lenses; needed a third design round with the user"
    solution: "Before showing a selection rule, run it on two concrete cases across runs (CLAUDE.md Question the premise), including how rules interact over time"
  - session: session_013zxzeRYFqNFGvBn4FsDkTk
    date: "2026-11-09"
    severity: minor
    description: "First Scout draft contradicted itself (never wait vs wait now) and had Scout re-run orient.ts, which rewrites the index files; only code-review caught it."
    solution: "Before committing a new instruction, run its steps on a concrete run, as CLAUDE.md's question-the-premise rule says."
  - session: session_013zxzeNd2Ethpd3anqbmpkr
    date: "2026-11-09"
    severity: minor
    description: "My capture-design draft broke its own no-trigger-change constraint by editing the hint hooks and understated cost by ignoring cache re-reads; the Fable reviewer caught both before anything was built."
    solution: "Check a draft against its own stated constraints, and price a forced extra turn as a context re-read, before sending it for review."
  - session: session_013zxzeNhTeF9B47tZ5Egyhx
    date: "2026-11-11"
    severity: minor
    description: "Picked a diff-based gate check for #3047 without running it on the three recorded occurrences; it catches 1 of 3 and audit-docs already covers it. The owner's question exposed this, costing one round."
    solution: "Run a proposed check on the issue's own concrete cases before presenting it as a pick."
  - session: session_013zxzeQQzVdav2Lzx9D5WBr
    date: "2026-11-11"
    severity: minor
    description: "My triage-change proposal hid the builder's decisions in triage.md, which the orchestrator may not read, so it could not tell which reviewers to resume; two reviewers caught it."
    solution: "When an orchestrator may read only replies, check every decision it must make has its input in a reply."
