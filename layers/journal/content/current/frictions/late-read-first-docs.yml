name: late-read-first-docs
summary: >-
  Agents read a doc CLAUDE.md names before a git, GitHub, triage, dispatch or screenshot step only after taking that step.
cause: >-
  CLAUDE.md's read-first triggers are prose, and the hint (#1793) fires only after the first git or GitHub call (PostToolUse). The owner accepted these late reads as a cost in PR #2066 instead of a deny guard (#1819 closed, not refiled): the hint now says a late read that clears the call is not a Friction. Signals: a late or skipped read of git-conventions.md, github-integration.md, pr-workflow.md, issue-tracker.md, triage-labels.md, the dispatch-subagents Skill or verifying-ui-changes.md.
surface: guard-or-hook
status: accepted
ref: "PR #2066 (merged): the owner accepts late reads; split from binding-docs-skipped for #2146"
fixes:
  - pr: 1793
    date: "2026-10-11"
    summary: "Added a hint pointing to the git and GitHub docs at a session's first matching call."
  - pr: 2066
    date: "2026-10-15"
    summary: "Hint now says a late read that clears the call is not a Friction."
