name: summary-from-narrow-evidence-span
summary: >-
  Agents wrote a summary from only the latest slice of the evidence and had to redo it over the whole span.
cause: >-
  A summary of a Skill's history is drawn from its latest notes only, because the request's wording ("last week's runs") invited a short window and the span was never asked; it is redone over the whole history.
surface: safe
status: tracked
ref: "#3363"
occurrences:
  - session: session_013zxzePNLUgD6AbfEmXykEJ
    date: "2026-11-15"
    severity: moderate
    description: "My first backfill lines drew only on each Skill's latest notes, so the owner had to ask for an overall verdict and I redid all 17 lines in a second PR."
    solution: "Read a Skill's whole observation history before summarising it; the owner's wording \"last week's runs\" invited a short window, so ask what span the summary covers."
