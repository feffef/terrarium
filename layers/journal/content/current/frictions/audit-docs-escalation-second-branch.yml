name: audit-docs-escalation-second-branch
summary: >-
  The doc-audit Skill asks for a separate escalation pull request, but the session may push only one branch.
cause: >-
  audit-docs step 8 wants the ADR escalation as its own PR, while the harness lets a session push only its designated branch, so the session defers the edit or pushes a second branch on the Skill's authority. Signals: audit-docs step 8, an '-adr' branch, 'may push only its own branch'.
surface: safe
status: open
notes: |-
  2026-10-20 design: a repo doc granting pushes to other branches dropped: the harness pins one pushable branch and a repo doc cannot grant that; issue-tracker.md already says to flag it upfront and ask.
fixes: []
occurrences:
