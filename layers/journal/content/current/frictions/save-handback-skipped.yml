name: save-handback-skipped
surface: safe
summary: Agents skipped save-handback.ts for subagent replies and worked from the messages in context.
cause: "dispatch-subagents section 3 asks to keep each subagent's final reply with save-handback.ts; orchestrators skip it for all replies, and a resumed agent's first report is lost since it keeps only the latest. Signals: 'save-handback.ts', 'kept none of the hand-backs'."
status: open
related:
  - entry: subagent-brief-omits-verdict-ask
    rule: The brief omitted a line CLAUDE.md asks every brief to carry.
notes: |-
  2026-11-15 survey: issue #3295 closed completed 2026-11-14 (PR #3304, recorded in fixes); status reset from tracked. Session_013zxzeRbcVWW7Upv1bSok39 (2026-11-13) lost two first reports because save-handback.ts keeps only a resumed agent's latest reply.
fixes:
  - pr: 3304
    date: "2026-11-14"
    summary: "dispatch-subagents saves a hand-back with save-handback.ts only when the reply must outlive the context."
occurrences:
  - session: session_013zxzeQE5BDH58h5e21zafo
    date: "2026-11-15"
    severity: minor
    description: "I saved two reviewer replies as hand-condensed summaries instead of with save-handback.ts, so the pool is not verbatim as the Skill requires."
    solution: "Run save-handback.ts for every reply; the brief's step 4 already says so, I skipped it for speed."
  - session: session_013zxzeSUNxM2snCnM3Wwi6o
    date: "2026-11-26"
    severity: nit
    description: "Saved Agent A and B replies to the pool as hand-typed summaries instead of save-handback.ts verbatim, against the Skill; re-saved with the script."
    solution: "State the exact save-handback command in the Skill's step 4 as a copyable line."
