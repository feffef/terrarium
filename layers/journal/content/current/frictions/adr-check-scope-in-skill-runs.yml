name: adr-check-scope-in-skill-runs
summary: >-
  Sessions running a Skill made the decisions it asks for without the ADR check CLAUDE.md requires, because nothing says whether that check applies there.
cause: >-
  CLAUDE.md requires adr-check before any recommendation, but Skills that mandate decisions (frictions-to-fixes picks, clear-backlog grilling picks, audit-docs and audit-skills judgement calls, scheduled sweeps) neither name it nor are exempted, and they do not say whether a triage or design agent's adr-check run covers the orchestrator. Signals: "frictions-to-fixes mandates decisions", "relied on the triage agents' adr-check", "scheduled-sweep adr-check silent-skip", issue #2342.
surface: safe
status: open
ref: "issue #2342 closed not planned 2026-10-23 (adr-check and its CLAUDE.md line are gone, PR #2431); issue #2286 closed completed."
fixes:
  - pr: 2431
    date: "2026-10-23"
    summary: "Retired the adr-check Skill and its CLAUDE.md trigger; a new PostToolUse hook (adr-read-hint.ts) now names, once per agent, each ADR an Edit or Write touches by its rule paths or by number and that the agent has not read in full."
occurrences:
  - session: session_01JkRFBik4MUWwZcP45q7egk
    date: "2026-10-22"
    severity: minor
    description: "CLAUDE.md demands adr-check before any recommendation, but frictions-to-fixes mandates dispatch/drop decisions without a step for it; I decided picks without running adr-check."
    solution: "Let frictions-to-fixes name adr-check in the decide step or exempt its decisions in CLAUDE.md (issue #2342 already tracks this)."
  - session: session_017W9GmXqDiiuDeZGmNDJLcL
    date: "2026-10-23"
    severity: minor
    description: "Did not invoke the adr-check Skill before recommending fixes/wording and a label change in GitHub comments on #2370, #2105 and #2286 - the same scheduled-sweep adr-check silent-skip pattern this run's own adr-check behaviour check found and escalated (as a 5th instance) for 5 other sessions."
    solution: "Scheduled Skill runs that end up making small judgment calls (a proposed fix framing, a label) should treat that as recommending a change and run adr-check, or CLAUDE.md's trigger should name an explicit exemption for judgment calls a Skill's own numbered steps already walk through."
  - session: session_01CfTFFQrkwq1eUsDy61AJzz
    date: "2026-10-23"
    severity: minor
    description: "Decided which fixes to drop or file without invoking adr-check, though CLAUDE.md asks for it before any recommendation; the frictions-to-fixes Skill has no step for it."
    solution: "Add an adr-check step to the Skill's §5, or drop the CLAUDE.md trigger for scheduled sweeps."
  - session: session_01Hw8mVJmgWejGc6YWi8ngnm
    date: "2026-10-23"
    severity: nit
    description: "Skipped the adr-check Skill and the full ADR-0030 read before editing two ADRs; the edits were only pointer fixes, so no impact."
    solution: "Say in CLAUDE.md or audit-docs that a pointer-only ADR fix needs neither."
