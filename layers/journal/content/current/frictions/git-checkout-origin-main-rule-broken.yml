name: git-checkout-origin-main-rule-broken
summary: >-
  Agents ran a git checkout form that the git conventions forbid, though they had read them.
cause: >-
  git-conventions.md says never `git checkout <ref> -- <path>` or `git checkout origin/main` (stages it, detaches HEAD); sessions that had opened the doc still ran them. Signals: `git checkout origin/main --`, detached HEAD in the main checkout.
surface: guard-or-hook
status: open
ref: "Prose exists (git-conventions.md, 2026-09-30); only a guard would add enforcement, and guards are Human-only."
occurrences:
  - session: session_015dUGRadEQP1bvv6KytKLXT
    date: "2026-10-14"
    severity: nit
    description: "I ran git checkout origin/main -- with no path, which detached HEAD in the main checkout, against git-conventions; I restored the branch right away"
    solution: "Read files from main with git show origin/main:path, as git-conventions says"
  - session: session_01G6m9SbDppX4TE87Mp3m5Dk
    date: "2026-10-14"
    severity: nit
    description: "Restored those logs with 'git checkout origin/main -- <path>', which git-conventions.md says never to use (it stages); staging was intended but the rule was broken"
    solution: "Use git restore --source=origin/main --staged --worktree, or follow the doc"
