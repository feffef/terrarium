name: claim-of-fix-not-rendered
surface: safe
summary: A fix or screenshot was reported as working, but the page actually rendered wrong, and no test or look caught it until later.
cause: "An agent or impl subagent claims a visual fix works from code or its own screenshots without checking the computed styles or the real render, so the bug survives until a reviewer or the owner finds it. Signals: 'reported as green', 'never rendered', 'no test or screenshot covered it', dark-mode or theme tokens, CSS variables bound on :root."
status: tracked
ref: "dispatched 2026-10-28: reword the computed-style bullet in docs/agents/verifying-ui-changes.md"
