name: claim-of-fix-not-rendered
surface: safe
summary: A fix or screenshot was reported as working, but the page actually rendered wrong, and no test or look caught it until later.
cause: "An agent or impl subagent claims a visual fix works from code or its own screenshot without checking the computed styles or the wide-font width (PR #2614: colours and schemes; PR #3031: fixed-width text that fits only in the narrow Linux fallback fonts), so the bug survives until a reviewer or the owner finds it. Signals: 'reported as green', 'no test or screenshot covered it', dark-mode or theme tokens, CSS variables bound on :root, a tile that overflows at the real font."
status: on-trial
ref: "Prune Trial opened 2026-11-26 (.agents/prune-trials.yml): territory docs/agents/verifying-ui-changes.md"
related:
  - entry: visual-work-published-unseen
    rule: The change was never rendered or screenshot before it shipped.
  - entry: preview-dev-server-stale-or-unhydrated
    rule: The dev server served old code, so the screenshot or probe was misleading.
fixes:
  - pr: 2614
    date: "2026-10-28"
    summary: "verifying-ui-changes.md: a screenshot can't confirm a colour, tint or scheme fix; read the computed colour and pin it with an e2e assert."
  - pr: 3031
    date: "2026-11-10"
    summary: "verifying-ui-changes.md: a Linux screenshot can't confirm fixed-width text fits; force a wider font and compare scrollWidth with clientWidth."
occurrences:
  - session: session_013zxzePXpUx7WY6K2uHsxKz
    date: "2026-11-12"
    severity: nit
    description: "Skipped the wide-font width check from verifying-ui-changes.md for the new buttons and section lines; the button label wrapping on a phone was caught only by eye."
    solution: "Add a scrollWidth versus clientWidth check with DejaVu fonts to the UI review step, or an e2e assert for primary tile buttons."
  - session: session_013zxzeTKSiBSmkCLfn4BYL6
    date: "2026-11-20"
    severity: nit
    description: "My Q7 text promised no visible layout shift, but my own after-sample shifted the next line about 8px; I only saw it when I viewed the screenshots."
    solution: "Measure the position of the next element in the sample before writing a no-shift promise into a question."
