name: claim-of-fix-not-rendered
surface: safe
summary: A fix or screenshot was reported as working, but the page actually rendered wrong, and no test or look caught it until later.
cause: "An agent or impl subagent claims a visual fix works from code or its own screenshots without checking the computed styles or the real render (PR #2614: colours and schemes; PR #3031: fixed-width text that fits only in the narrow Linux fallback fonts), so the bug survives until a reviewer or the owner finds it. Signals: 'reported as green', 'never rendered', 'no test or screenshot covered it', dark-mode or theme tokens, CSS variables bound on :root, a tile that overflows at the real font."
status: open
fixes:
  - pr: 2614
    date: "2026-10-28"
    summary: "verifying-ui-changes.md: a screenshot can't confirm a colour, tint or scheme fix; read the computed colour and pin it with an e2e assert."
  - pr: 3031
    date: "2026-11-10"
    summary: "verifying-ui-changes.md: a Linux screenshot can't confirm fixed-width text fits; force a wider font and compare scrollWidth with clientWidth."
occurrences:
  - session: session_013zxzeRB6ciegpxcRDfedSF
    date: "2026-11-09"
    severity: minor
    description: "CLAUDE.md says to read the UI verification doc before claiming a UI change works; I never rendered the page, relying on e2e passing."
    solution: "Read docs/agents/verifying-ui-changes.md and screenshot the tile before closing."
  - session: session_013zxzeR2kKbsT81QWkXUrvK
    date: "2026-11-09"
    severity: moderate
    description: "Checked tile text fit only with this Linux build's narrow fallback fonts; on macOS it wrapped, which took a follow-up PR"
    solution: "When text must fit a fixed width, check it with a wider font forced (DejaVu Serif and Sans Mono) before calling the layout done"
  - session: session_013zxzePXpUx7WY6K2uHsxKz
    date: "2026-11-12"
    severity: nit
    description: "Skipped the wide-font width check from verifying-ui-changes.md for the new buttons and section lines; the button label wrapping on a phone was caught only by eye."
    solution: "Add a scrollWidth versus clientWidth check with DejaVu fonts to the UI review step, or an e2e assert for primary tile buttons."
