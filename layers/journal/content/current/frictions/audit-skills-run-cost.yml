name: audit-skills-run-cost
surface: safe
summary: The audit-skills per-Skill behaviour checks spend about 1.7M tokens on short replies that mostly repeat known findings.
cause: "audit-skills dispatches one subagent per Skill (15-17 per run, about 1.7M tokens; since PR #3377 each reads the last 3 days and reports a repeat in one line, but the count is unchanged, and a 2026-11-17 run still cost about 1.7M). Signals: '16 per-Skill checks', '17 subagent reports for a mostly-repeat result', 'most reports re-confirmed known repeats'."
status: open
related:
  - entry: clear-backlog-retro-fanout-cost
    rule: The same cost shape from a clear-backlog retro, not an audit-skills run.
  - entry: glassbox-curate-run-cost
    rule: The fan-out belongs to a glassbox-curate run.
  - entry: subagent-fanout-before-probe
    rule: Many agents were dispatched over transcripts before one was probed.
  - entry: blog-post-behaviour-fanout-cost
    rule: The same audit-skills fan-out cost, plus a skipped role/gist read.
fixes:
  - pr: 3377
    date: "2026-11-16"
    summary: "Each behaviour-check subagent reads the last 3 days of runs in full plus earlier observations to a budget, and reports a known repeat in one line; which Skills are checked is unchanged."
occurrences:
  - session: session_013zxzeS7ZJqB5FMcd5d5fza
    date: "2026-11-15"
    severity: minor
    description: "Subagent reports from 16 per-Skill checks cost about 1.7M subagent tokens and mostly re-confirmed known repeats; I verified only the two I escalated."
    solution: "Have the scorecard flag Skills whose logs show no new friction so those checks can be skipped or run at lower breadth."
  - session: session_013zxzePnUYHpbwDsDER2swv
    date: "2026-11-16"
    severity: minor
    description: "Heavy run: 17 subagent reports for a mostly-repeat result; several claims (non-user counts, session ids) were unverifiable from my side and had to be reworded."
    solution: "Have subagents return only deltas against the earlier observations, with counts checked against the data file."
  - session: session_013zxzeTBn6kP1nZ2KA22n9i
    date: "2026-11-17"
    severity: minor
    description: "The 16 behaviour subagents plus usage lookup and two review agents cost roughly 1.7M subagent tokens, and most reports re-confirmed known repeats."
    solution: "Skip a Skill's check when its data file lists no runs and nothing changed; skip re-reading runs already audited clean."
  - session: session_013zxzeQty154cpRRShQjRhX
    date: "2026-11-18"
    severity: minor
    description: "Sixteen near-identical behaviour subagents cost roughly 1.6M tokens; most found only repeats of known observations for Skills with clean runs."
    solution: "Have the scorecard print each Skill's last observation date so unchanged, clean Skills are skipped or batched."
  - session: session_013zxzeRsaSP4XhVGZDUk153
    date: "2026-11-19"
    severity: minor
    description: "The 15 behaviour subagents each read a 9 to 50 KB data file and logs; the run spent about 1.7M subagent tokens, the same cost earlier runs recorded."
    solution: "Skip a Skill's agent when its runs, changes and observations repeat the last check (see idea)."
