name: pr-subscribe-reminded-by-stop-hook
surface: guard-or-hook
summary: A session opened a PR without subscribing and the Stop hook for it reminded the session, costing a prompt.
cause: "Comes from pr-opened-without-subscribe and PR #2972 (Stop hook that prompts for subscribe_pr_activity): the hook now catches the slip (signal: 'the Stop hook had to prompt me'), so the original harm (PR left unwatched) is not recurring; the original entry keeps the unwatched-PR occurrences."
status: open
ref: "pr-opened-without-subscribe, fix PR #2972"
occurrences:
  - session: session_013zxzeRYFqNFGvBn4FsDkTk
    date: "2026-11-09"
    severity: minor
    description: "Opened the PR and ran close-session without calling subscribe_pr_activity; the Stop hook had to prompt me (ADR-0003)."
    solution: "Subscribe in the same step as opening the PR, before close-session."
  - session: session_013zxzeSB2Asdc9k89JQywv9
    date: "2026-11-10"
    severity: nit
    description: "Stop hooks demanded subscribe_pr_activity after I opened the test PR, though the task said not to subscribe."
    solution: "Let the hook skip PRs whose title carries a test marker, or let a session mark a PR as not to watch."
  - session: session_013zxzeP1EixGDy96kmktFi2
    date: "2026-11-12"
    severity: minor
    description: "Opened the PR and ended the turn without subscribing to its activity; the Stop hook had to remind me, though the ADR-0003 rule says to subscribe after opening."
    solution: "Treat subscribe_pr_activity as part of opening the PR, in the same turn, before asking the user anything about watching it."
  - session: session_013zxzeSkGfgujTxwvEaiFTh
    date: "2026-11-12"
    severity: nit
    description: "I opened the PR and told the owner I had not subscribed, following the system prompt's 'ask first' line over ADR-0003, until the Stop hook flagged it."
    solution: "Subscribe in the same turn as opening the PR, as ADR-0003 says; the rule already overrides the generic prompt."
