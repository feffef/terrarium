name: pr-subscribe-reminded-by-stop-hook
surface: guard-or-hook
summary: A session opened a PR without subscribing and the Stop hook for it reminded the session, costing a prompt.
cause: "Comes from pr-opened-without-subscribe and PR #2972 (Stop hook that prompts for subscribe_pr_activity): the hook now catches the slip (signal: 'the Stop hook had to prompt me'), so the original harm (PR left unwatched) is not recurring; the original entry keeps the unwatched-PR occurrences."
status: open
ref: "pr-opened-without-subscribe, fix PR #2972"
occurrences:
  - session: session_013zxzeS6AE1WUN124PHnm4b
    date: "2026-11-13"
    severity: nit
    description: "I opened the PR without calling subscribe_pr_activity, which ADR-0003 requires; the Stop hook had to remind me."
    solution: "Subscribe in the same step as opening the PR; the create-PR hint could name it."
  - session: session_013zxzePBiGUC5ThCkjDhzN7
    date: "2026-11-19"
    severity: nit
    description: "After opening the PR I asked the owner whether to subscribe to its activity (the system prompt says ask); ADR-0003 says subscribe without asking, and the Stop hook had to prompt me."
    solution: "Subscribe straight after opening the PR; ADR-0003 overrides the system prompt's ask-first."
  - session: session_013zxzeSqAbnHFPu1QTXgBfS
    date: "2026-11-22"
    severity: minor
    description: "I opened the first PRs and moved on without calling subscribe_pr_activity; the Stop hook had to ask for it. I subscribed to all five PRs afterwards."
    solution: "clear-backlog section 4 could name the subscribe step beside opening the PR, since ADR-0003 says it only in prose."
  - session: session_013zxzeT6Ss7hjULbaTx2PS2
    date: "2026-11-23"
    severity: minor
    description: "I opened three PRs and ended the turn without subscribe_pr_activity or close-session; the Stop hook flagged the subscription and I invoked close-session only after the merges."
    solution: "clear-backlog section 4 should list subscribe and the PR-open close-session as steps right after the PRs are opened."
