name: survey-label-and-ledger-errors
surface: safe
summary: A frictions-to-fixes survey left wrong labels or unfinished ledger work that the design or main session had to catch.
cause: "The survey subagent mislabels a candidate or leaves ledger work undone (a never-fixed label for a cause later commits fixed, a stored 'One occurrence.' cause, no cause rewrite after recorded fixes, a status set after a later fix merged), and the next agent finds it by checking. Signals: 'survey report labelled', 'the design agent found it', 'left work the ledger review had to catch'."
status: open
related:
  - entry: frictions-to-fixes-briefs-mismatch
    rule: The survey brief itself is wrong or out of date.
fixes:
  - pr: 3365
    date: "2026-11-16"
    summary: "survey-brief §3: check direct commits on a named doc path before never-fixed; confirm only likely picks."
occurrences:
  - session: session_013zxzeRLqFejsZTowNzt1Lt
    date: "2026-11-15"
    severity: minor
    description: "Survey report labelled glassbox-page-conventions-found-late never-fixed though later commits had fixed it; the design agent found it, costing one extra check and a dropped design."
    solution: "Survey brief step 3 should check git log on the doc's own territory since the earliest session before labelling never-fixed."
  - session: session_013zxzeSZQpKBLnM3DK1cPRQ
    date: "2026-11-17"
    severity: minor
    description: "The survey labelled verdict-line-asserts-unchecked-review never-fixed though open issue #3395 covered it; I found it only by reading the open-issue titles myself."
    solution: "Survey brief should match each new entry's session against open issue bodies, not only titles and a keyword scan."
  - session: session_013zxzeQLrTRb5hCDjSRuQHb
    date: "2026-11-21"
    severity: minor
    description: "The design agent's pick 1 showed the survey ledger entry named the wrong Skill (audit-skills, not blog-post); the survey had flagged it unverified and the brief has no step for a mislabelled entry."
    solution: "Survey brief: when a Friction's named home cannot be found in source, check the session's trigger before opening an entry."
  - session: session_013zxzeQTiD2k55P7AkEWYBY
    date: "2026-11-23"
    severity: minor
    description: "A prune-friction-ledger --move of a cluster's only occurrence silently deleted the entry with its fixes and notes; the survey agent had to restore it from git."
    solution: "Have --move refuse or warn when the source entry would end empty."
  - session: session_013zxzeRF9wSXqBPZvCnNxKb
    date: "2026-11-27"
    severity: nit
    description: "The survey agent's commit message miscounted its appends (68 and 44 against 65 and 39 plus 3 new entries), and the Standards reviewer wrongly reported an unchanged status; I verified both against the diff."
    solution: "Have the survey cite counts from git diff, not from its own tally."
