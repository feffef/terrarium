name: github-body-unchecked-value
summary: >-
  Agents put an unchecked path, commit or phrase into a GitHub post and had to edit it afterwards.
cause: >-
  An issue, PR or comment body cites a path, commit, branch or footer link from memory or an earlier transcript, or is sent without a re-read, instead of being checked against the file tree, git log or the literal reminder text when posting. Signals: 'guessed spec path', 'cited a commit ... a review round had rewritten', a duplicated path segment in a footer link, a garbled phrase edited after filing.
surface: safe
status: open
notes: |-
  2026-10-23 design: a rule or guard on checking body values dropped: each of the four slips was fixed at once, Verify before you state already covers checking a value against its source, and none involves verdict SHAs or merge-pr.ts (the note copied from verdict-comment-hand-typed at the split did not apply).
fixes: []
occurrences:
  - session: session_013zxzeQiYSGT82pZgGnxSVx
    date: "2026-10-31"
    severity: minor
    description: "PR body first claimed pr-workflow.md was a Human-only path without checking the rule's paths; my earlier grep printed nothing and I misread it."
    solution: "Read the paths list before stating a merge requirement; corrected the PR body."
  - session: session_013zxzeR4cgWA8MkV51fqC4t
    date: "2026-11-03"
    severity: nit
    description: "First PR #2809 body had a garbled size line, fixed with update_pull_request"
    solution: "Reread the PR body before creating"
  - session: session_013zxzeS7NuFmaoXJkxVfNby
    date: "2026-11-05"
    severity: minor
    description: "Filed regression issue #2853 with quotes and session ids written from memory (garbled suffixes); I had to rewrite it, despite 'Verify before you state'."
    solution: "Print the occurrence text with print-ledger-occurrence.ts and paste it, rather than retyping."
