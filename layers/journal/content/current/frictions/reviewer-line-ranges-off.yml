name: reviewer-line-ranges-off
summary: >-
  Doc reviewers cited slightly wrong line numbers, so a second pass had to correct them.
cause: >-
  audit-docs reviewer subagents cite finding line ranges that are off by one or cover partial sentences, so the checkers must correct them in a second pass.
surface: safe
status: open
ref: "PR #1957 (merged 2026-10-14T18:12Z), after commit a4802cf0c; regression flagged in issue #2024"
fixes:
  - pr: 1821
    date: "2026-10-12"
    summary: "Doc-audit reviewers now quote the exact sentence instead of citing a line range."
  - pr: 1957
    date: "2026-10-14"
    summary: "Doc-audit reviewers now keep line breaks when quoting a sentence, so exact-text edits no longer fail."
occurrences:
  - session: session_01YVCyXmxSSDQ6csSBVJ554H
    date: "2026-10-11"
    severity: nit
    description: "Reviewer line ranges were often off by one (included the YAML header or one extra line); checkers had to correct them."
    solution: "Have reviewer briefs say 'body lines only, verify with sed -n before reporting' or have the Skill ask for ranges the checker re-derives."
  - session: session_01Dz52W6wWZWUgKwPtdxabzJ
    date: "2026-10-12"
    severity: minor
    description: "Reviewer line ranges were off in about a third of the findings (partial sentences, wrong end line); checkers caught them, but it cost a second pass."
    solution: "Ask reviewers to print the exact lines they would replace and verify the range with a sed echo before reporting."
  - session: session_01M9Ryb84DYs5HxKy2Z3cpA2
    date: "2026-10-14"
    severity: minor
    description: "Reviewers quoted multi-line text as flat sentences, so exact-string edits failed and a checker had to re-derive each wrapped quote."
    solution: "Tell reviewers to quote with the file's own line breaks, or give a grep-able anchor."
