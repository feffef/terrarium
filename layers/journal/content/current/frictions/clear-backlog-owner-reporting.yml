name: clear-backlog-owner-reporting
summary: >-
  The backlog Skill did not say what a run tells the owner in chat, notifications and the session log, so questions got buried or a log left out what changed.
cause: >-
  The clear-backlog Skill left the run's reporting to the owner unspecified: chat carried status narration around the owner's questions, the grilling step had no rule for zero questions, and the session log had no line per branch naming what it changed. Signals: owner questions buried in status turns, a notification or grilling step with nothing to ask, a log summary the owner has to ask about.
surface: safe
status: open
ref: "Issue #1878 (one log summary line per branch)."
fixes:
  - pr: 1852
    date: "2026-10-12"
    summary: "clear-backlog now reviews before opening PRs, has agents build everything, and keeps chat quiet."
  - pr: 1880
    date: "2026-10-13"
    summary: "The session log now gets one summary line per merged or opened branch."
  - pr: 1882
    date: "2026-10-13"
    summary: "Doc fixes from the frictions review, including skipping the grilling when there is nothing to ask."
occurrences:
  - session: session_017NBxJhtBSd9AoCwTzsg6pM
    date: "2026-10-12"
    severity: major
    description: "Questions for the owner were buried among a stream of status updates; owner had to dig, questions get overlooked and answers misread."
    solution: "clear-backlog: while waiting on the owner, the chat carries only the open questions; no progress narration; acknowledge events silently."
  - session: session_013FXrBeYrgCUvFvJjysR7yM
    date: "2026-10-13"
    severity: nit
    description: "The workflow's §2 grilling step had zero questions, but the Skill doesn't say to skip the push notification and grilling in that case; I skipped them by judgement."
    solution: "Add to clear-backlog §2: with no grill results, skip the notification and go straight to §3."
  - session: session_016gu9e44jjfAEFMo3CBxzUQ
    date: "2026-10-13"
    severity: moderate
    description: "My first session log summarized the build as 'the session-trace fix' and left out what it changed, although the workflow returned every decision. The owner had to ask for it."
    solution: "clear-backlog §4 or log-session should require one line per merged branch naming what it changed, since the digest reads the log rather than the PR."
