name: journal-content-breaks-main
summary: >-
  A session log or archive sweep broke a test, turning every open change red, and the archived dashboard's size broke the smoke test.
cause: >-
  Session logs and Digests land on main without a gate (ADR-0009), and the retention sweep moves logs to archived, while e2e and unit tests read specific logs' text or current paths, so the sweep or one log turns the gate red for the Digest PR and others. PR #2620 caps the dashboard at 1000 sessions and reads the smoke test's HTML in Node, which retires the archived page's size (10 MB) as a cause. Signals: a gate red after an archive sweep, a test reading content/current/sessions by path, an assertion on a log's wording, 'Request content was evicted from inspector cache'.
surface: safe
status: open
ref: "issue #2105 closed 2026-10-28 with label wontfix and no PR; PR #2620 (merged 2026-10-28) capped the archived dashboard at 1000 sessions."
fixes:
  - pr: 2108
    date: "2026-10-16"
    summary: "Removed a browser-test assertion that an archived session log's wording could turn red."
  - pr: 2394
    date: "2026-10-22"
    summary: "A unit test that read a session log by its current path now reads the archived copy, so the retention sweep no longer turns the gate red."
  - pr: 2620
    date: "2026-10-28"
    summary: "The Journal dashboard loads only the newest 1000 sessions and the smoke test fetches server HTML in Node, so the archived page no longer outgrows Chrome's response-body buffer."
occurrences:
  - session: session_01F3a2MbH4xUH7J7Y1hLg2TX
    date: "2026-10-16"
    severity: moderate
    description: "Archive sweep moves a session quoting 'live snapshot' into archived, breaking a fragile Journal e2e test and turning the gate red for the Digest PR."
    solution: "Make the archived-dashboard test assert on the rendered badge element, not raw page text; or have the sweep run gate checks."
  - session: session_013Wjv51Wj4dYhJXpTgvxCN4
    date: "2026-10-16"
    severity: minor
    description: "The digest run's PR description diagnosed the failure but did not notice that main had already fixed it, so the PR sat red for hours."
    solution: "Have the digest Skill fetch main and re-check a red gate against it before leaving a PR for a human."
  - session: session_01T4UbBvJmjSunCwb3cUN68Q
    date: "2026-10-22"
    severity: moderate
    description: "Archive sweep moved a session log that a unit test reads by its current path, so the gate failed; the Skill's allowed diff cannot include the fix."
    solution: "Make the test not depend on a log that ages out (fixture copy), or have the sweep skip it."
  - session: session_013zxzePhRwXqYLtsycYUhqv
    date: "2026-10-28"
    severity: moderate
    description: "Archive sweep makes the archived-page e2e test fail deterministically (body evicted from inspector cache); cost two gate runs and a baseline build to diagnose."
    solution: "Fix expectServerRendered in tests/support/e2e.ts to read the body before hydration, then run the sweep."
  - session: session_013zxzeQxsePnJds2jEpgirL
    date: "2026-10-28"
    severity: minor
    description: "The archived dashboard silently outgrew Chrome's 10 MB body buffer; nothing warned until the digest run's gate failed twice."
    solution: "The new cap and Node-side refetch; a page-size budget check in e2e could flag growth earlier."
