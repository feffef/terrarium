name: close-session-bypassed-by-hand-log
summary: >-
  An agent wrote or updated its session log by hand instead of running the closing Skill, so the Skill's steps were skipped and the user could have to ask for a proper close.
cause: >-
  A session that has the close-session or log-session text in context authors the log directly instead of invoking the Skill, skipping its steps such as the rule re-read. log-session refuses only a completed log after a merge (PR #2536), so a log written by hand at a PR open or a first merge still gets through; a refused completed log belongs in log-session-refuses-hand-closed-log. Signals: HUMAN-PROMPTED-CLOSURE, 'authored the log directly', 'updated the log with log-session directly', 'having edited a Skill is not having run it'.
surface: safe
status: open
ref: "issue #2521 closed by PR #2536"
fixes: [ { pr: 2452, date: "2026-10-23", summary: "log-session --author now warns when a completed log follows a merge with no close-session call." }, { pr: 2536, date: "2026-10-25", summary: "log-session --author now refuses a completed log after a merge with no close-session call, and writes no scratch." } ]
occurrences:
  - session: session_01EjH3TbrydEY2sArBMYE5Gy
    date: "2026-10-22"
    severity: major
    description: "HUMAN-PROMPTED-CLOSURE: after PR #2418 merged I authored the completed log directly instead of invoking close-session (ADR-0009 rule), skipping step 1's rule re-read; the user had to ask for a proper close"
    solution: "Invoke the close-session Skill at every merge, even when its text is in context from editing it; having edited a Skill is not having run it"
  - session: session_01PdrNTJLJJMKBGGZfsAhL6w
    date: "2026-10-25"
    severity: nit
    description: "After the first merges (PRs 2532-2534) I updated the log with log-session directly instead of re-invoking close-session, which the ADR-0009 rule asks for at a merge."
    solution: "Re-invoke close-session at every merge, not log-session; PR #2536 now refuses only the completed case."
  - session: session_01Cb8ETAZztznLYx6CC7MKyE
    date: "2026-10-26"
    severity: nit
    description: "After PRs #2564-#2568 opened I re-authored the log with log-session directly instead of re-invoking close-session as the PR-open hook asked; the log stayed current, but the close-session checklist was skipped for those PRs."
    solution: "Re-invoke close-session on each PR-open hook hint, even when the log was just authored."
  - session: session_013zxzeTK9c2HVcabwCx3b18
    date: "2026-10-28"
    severity: nit
    description: "After opening PRs 2642-2647 I re-authored the log with log-session directly instead of invoking close-session, against the CLAUDE.md rule to invoke close-session before a PR-opening turn ends."
    solution: "Follow the PR-open hook literally and invoke close-session, which then calls log-session."
