name: close-session-bypassed-by-hand-log
summary: >-
  An agent wrote its session log by hand instead of running the closing Skill, so the user had to ask for a proper close.
cause: >-
  A session that has the close-session or log-session text in context (for example from editing it) authors the log directly instead of invoking the Skill, skipping its steps such as the rule re-read. Signals: HUMAN-PROMPTED-CLOSURE after a merge, 'authored the completed log directly', 'having edited a Skill is not having run it'.
surface: safe
status: open
ref: "issue #2424 closed by PR #2452 (a warning, never a block)"
fixes: [ { pr: 2452, date: "2026-10-23", summary: "log-session --author now warns when a completed log follows a merge with no close-session call." } ]
occurrences:
  - session: session_01EjH3TbrydEY2sArBMYE5Gy
    date: "2026-10-22"
    severity: major
    description: "HUMAN-PROMPTED-CLOSURE: after PR #2418 merged I authored the completed log directly instead of invoking close-session (ADR-0009 rule), skipping step 1's rule re-read; the user had to ask for a proper close"
    solution: "Invoke the close-session Skill at every merge, even when its text is in context from editing it; having edited a Skill is not having run it"
  - session: session_01JJcYmSGnRbUcVyvdPbkGs9
    date: "2026-10-24"
    severity: nit
    description: "Ran log-session --author for the completed log before re-invoking close-session after the merge; the script warned and I corrected it."
    solution: "After merge, invoke close-session first, then author the log."
  - session: session_011Rbnf9T9YqNztEcWNXsHsF
    date: "2026-10-25"
    severity: nit
    description: "Hand-authored the completed log before invoking close-session after the merge; log-session.ts warned and I invoked close-session next."
    solution: "Invoke close-session first after a merge, then author."
  - session: session_019jfJv6yLmcLUAJiTTomyeu
    date: "2026-10-25"
    severity: nit
    description: "I hand-wrote the completed log with log-session --author after the merges, before invoking close-session; the warning fired and I invoked it afterwards."
    solution: "After the last merge invoke close-session first; the Skill's closing section could say so for scheduled runs."
  - session: session_01PGQQj6iUaMYCkphVjFEsBP
    date: "2026-10-25"
    severity: nit
    description: "Set the log to completed by editing the scratch by hand right after the merge, before invoking close-session; the script warned against it."
    solution: "After merging, invoke close-session first and let it drive the final log."
