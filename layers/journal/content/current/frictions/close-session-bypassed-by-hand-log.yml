name: close-session-bypassed-by-hand-log
summary: >-
  An agent wrote or updated its session log by hand instead of running the closing Skill, so the Skill's steps were skipped and the user could have to ask for a proper close.
cause: >-
  A session that has the close-session or log-session text in context authors the log directly instead of invoking the Skill, skipping its steps such as the rule re-read. log-session refuses only a completed log after a merge (PR #2536); since PR #2707 its text no longer invites a direct call and log-session.ts --pending lists awaiting verdicts; since PR #2798 (2026-11-02) a hint after a successful merge-pr.ts run names close-session (a piped run can still miss it), yet session QDfN (2026-11-06) ignored three such hints after its merges and the owner had to prompt the log. A log written by hand at a PR open or a first merge can still get through; a refused completed log that cost only a call belongs in log-session-refuses-hand-closed-log. Signals: HUMAN-PROMPTED-CLOSURE, 'authored the log directly', 'updated the log with log-session directly', 'ignored three hook hints', 'having edited a Skill is not having run it'. Since PR #2937 (2026-11-07) a Stop hook (merge-close-stop.ts) blocks the end of a turn once after a merge without close-session.
surface: safe
status: open
fixes:
  - { pr: 2452, date: "2026-10-23", summary: "log-session --author now warns when a completed log follows a merge with no close-session call." }
  - { pr: 2536, date: "2026-10-25", summary: "log-session --author now refuses a completed log after a merge with no close-session call, and writes no scratch." }
  - pr: 2707
    date: "2026-10-30"
    summary: "Removes log-session's invitation to be called directly (close-session is the sole entry) and adds log-session.ts --pending, which reports rules and docs awaiting a verdict before the first --author pass."
  - pr: 2798
    date: "2026-11-02"
    summary: "read-first-hint.ts now hints close-session after a successful merge-pr.ts run, unless close-session already ran after that merge."
  - pr: 2937
    date: "2026-11-07"
    summary: "Closes #2913: merge-close-stop.ts, a Stop hook, blocks the end of a turn once when this session merged a PR and close-session has not run since."
occurrences:
  - session: session_013zxzeTK9c2HVcabwCx3b18
    date: "2026-10-28"
    severity: nit
    description: "After opening PRs 2642-2647 I re-authored the log with log-session directly instead of invoking close-session, against the CLAUDE.md rule to invoke close-session before a PR-opening turn ends."
    solution: "Follow the PR-open hook literally and invoke close-session, which then calls log-session."
  - session: session_013zxzeSgD6cuF2mawqY6jWM
    date: "2026-10-29"
    severity: minor
    description: "After PRs #2667-#2670 opened I updated the log by calling log-session directly instead of re-invoking close-session (CLAUDE.md), the very pattern #2654 is about"
    solution: "Re-invoke close-session at each PR open; #2654's cut, once its trial is judged, removes the text that invites the direct call"
  - session: session_013zxzeRkv6UCWJtPmJ68h32
    date: "2026-11-01"
    severity: major
    description: "HUMAN-PROMPTED-CLOSURE: after PR #2750 merged I did not re-invoke close-session; my --author was refused and I had piped its output through grep, then told the user the log was authored. The user asked."
    solution: "Re-invoke close-session right after merge-pr.ts, and read --author's full output and confirm the scratch status before reporting."
  - session: session_013zxzeQDfNNTXpQYQtt9saY
    date: "2026-11-06"
    severity: major
    description: "HUMAN-PROMPTED-CLOSURE: after the merges I ignored three hook hints to re-invoke close-session (ADR-0009) and sent a completed log that was refused; the owner had to prompt me to log again."
    solution: "Re-invoke close-session right after each merge-pr.ts run, as the hook hint says, then author and read the full output."
  - session: session_013zxzeS6uNt5yvnz5LyUCCe
    date: "2026-11-11"
    severity: nit
    description: "After PR 3108 merged I refreshed the log by running log-session.ts --author by hand instead of invoking close-session; the Stop hook flagged it."
    solution: "Invoke close-session whenever a PR merges, as its Skill says, before touching the scratch."
