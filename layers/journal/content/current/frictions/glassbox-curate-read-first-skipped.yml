name: glassbox-curate-read-first-skipped
surface: safe
summary: Glass Box curate runs edited or dispatched before reading the Skill's required first reads (glossary, QUALITY.md, the Subject's pages), and the Spec reviewer found the gap.
cause: "The glassbox-curate Skill lists the Glass Box GLOSSARY, QUALITY.md (Lenses) and the Subject's pages to read first; runs skip or truncate them, leave pagesRead short, and a reviewer names the unread pages. Signals: 'never opened QUALITY.md', 'pagesRead was short', 'skipped the curate Read step', 'short of the Skill's read-the-Subject step'. Since PRs #2929 and #2944 (2026-11-07) the Skill reads the Subject first, in full, with orient.ts --subject printing its pages and the pagesRead lines. Since PR #3001 (2026-11-09) SKILL.md states the Subject read as a Done-when."
status: accepted
acceptedSeverity: minor
related:
  - entry: governing-doc-read-after-draft
    rule: The doc governs text just drafted and is not on the Skill's read-first list.
  - entry: glassbox-curate-steps-skipped
    rule: The skipped steps are the build, check or loop steps, not the required first reads.
notes: |-
  2026-11-14 survey: issue #3226 closed not planned 2026-11-13: owner decision (clear-backlog): leave the Skill as is; one post-#3001 skip, caught by the Spec review; no mechanical pagesRead check. Reopen on another skip with a single-Subject focus.
fixes:
  - pr: 2929
    date: "2026-11-07"
    summary: "glassbox-curate and glassbox-update read the Subject first, wait for updates, own the merge."
  - pr: 2944
    date: "2026-11-07"
    summary: "glassbox-curate gets 'Know the guide before you change it' and orient.ts --subject, which prints a chosen Subject's pages in full with the pagesRead lines."
  - pr: 3001
    date: "2026-11-09"
    summary: "glassbox-curate SKILL.md states the Subject read as a Done-when (every Subject page read in full, plus outside pages a change would edit) and drops the removal-only exemption."
occurrences:
  - session: session_013zxzeRxyNcwt53TXLHjTsg
    date: "2026-11-13"
    severity: minor
    description: "The Skill asks for every Subject page in full, but with the budget I read only the pages I edited; the run entry states it."
    solution: "Let the Skill say which pages count as the Subject when the focus is a topic list, not a Subject."
  - session: session_013zxzeSYMKya1mzpFJhAcSk
    date: "2026-11-13"
    severity: minor
    description: "Skill said to read the Subject in full before editing; I edited after grepping most pages, and review caught it, forcing a late full read."
    solution: "Read the Subject's pages in full right after the orientation, before any edit."
  - session: session_013zxzeS6AE1WUN124PHnm4b
    date: "2026-11-13"
    severity: minor
    description: "glassbox-curate asks for a Scout, fresh readers, a claim checker and a full read of every linked page; with an interactive ask I skipped most of that and read only three pages, so the review had to flag it."
    solution: "Say in the Skill which steps an interactive, chips-and-terms-only run may skip, so the choice is not an improvised deviation."
  - session: session_013zxzePak78Sud7pyRQMjeV
    date: "2026-11-15"
    severity: minor
    description: "The Skill wants every page the review names read in full before landing; I read only the inventory lines of four overlapping pages, to save budget."
    solution: "Say in Land whether a grep of the overlap is enough when the added claim is narrow."
  - session: session_013zxzePMRv24VHZ1q24seyG
    date: "2026-11-17"
    severity: nit
    description: "Land says to read every guide page the Spec reviewer names as missing from pagesRead; I skipped the nine linked lessons because the diff changes only diagram labels."
    solution: "Say in glassbox-curate that a diagram-only change needs only the page's own stops read."
  - session: session_013zxzeQyUcqMctvqKtP4sHL
    date: "2026-11-20"
    severity: nit
    description: "The Skill says to read every outside page a change would overlap in full; I read only the smoke-test lines of Testing and File routing."
    solution: "State whether a one-clause cut needs the sibling pages read whole, or give a cheaper check."
  - session: session_013zxzeRZYEUqDMuAoUesKV7
    date: "2026-11-25"
    severity: minor
    description: "Spec review found I swapped two Where next rows without reading those pages whole and skipped a walkthrough chip until reviewed; the Skill's step 3 reading rule for outside pages is easy to under-do."
    solution: "Have step 3 list linked outside pages with a checkbox before writing, and the writer brief name walkthroughs that describe the mechanism."
