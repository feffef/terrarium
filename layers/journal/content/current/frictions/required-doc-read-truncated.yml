name: required-doc-read-truncated
summary: >-
  Agents read a required doc through a shell pipe whose output was cut, so part of it went unread.
cause: >-
  A required doc (GLOSSARY, git-conventions, github-integration, issue-tracker, triage-labels, guards, …) was read through a cat, head or sed chain, often several docs in one call, and the output hit the tool's size cap or a head -N limit, so the rest was never seen; the truncation is easy to miss. Signals: "truncated at 30KB", "output went to a file", "head -300 cut it", "read only its first 2KB".
surface: safe
status: accepted
ref: "#2633: the owner accepted partial reads of required docs on 2026-10-28 (clear-backlog session_013zxzeTK9c2HVcabwCx3b18); an agent that has read enough to judge relevance may decide."
fixes:
  - pr: 2448
    date: "2026-10-23"
    summary: "CLAUDE.md's read-first intro says one Read call per doc, since a shell read can be cut short."
  - pr: 2644
    date: "2026-10-28"
    summary: "CLAUDE.md says to read a required doc whole if you can, no longer in one Read call: partial reads are encouraged against, not required."
occurrences:
  - session: session_012Yzae3uty5Jj8ZPug9zpjr
    date: "2026-10-23"
    severity: nit
    description: "Read only the first 80 lines of dispatch-subagents SKILL.md before writing the #2137 review brief, though CLAUDE.md says read the doc in full"
    solution: "Read trigger docs with one Read call and no head/sed limit"
  - session: session_01Vg1qDutnhKVav7JDNUdr8J
    date: "2026-10-26"
    severity: minor
    description: "Read github-integration.md with cat | head -80 and dispatch-subagents SKILL.md with head -150, against CLAUDE.md's one-Read-call-per-doc rule; parts may have been cut."
    solution: "Read trigger docs with the Read tool, unlimited, at the first GitHub call; nothing I needed was in the cut part this time."
  - session: session_013zxzeQ97mDYdTytqEL7wD6
    date: "2026-10-27"
    severity: nit
    description: "Bundled the Lessons with cat; one output was persisted to a file and a later Read truncated, costing two extra reads"
    solution: "Read large page sets in chunks under ~35k tokens per call from the start"
  - session: session_013zxzeTDG9WP45rYE5hRMpG
    date: "2026-11-06"
    severity: minor
    description: "Read docs/agents/github-integration.md with head -80, against CLAUDE.md's read-it-whole rule; a later write trap could have been missed"
    solution: "Read trigger docs whole with the Read tool; it costs a few hundred tokens"
