name: required-doc-read-truncated
summary: >-
  Agents read a required doc through a shell pipe whose output was cut, so part of it went unread.
cause: >-
  A required doc (GLOSSARY, git-conventions, github-integration, issue-tracker, triage-labels, guards, …) was read through a cat, head or sed chain, often several docs in one call, and the output hit the tool's size cap or a head -N limit, so the rest was never seen; the truncation is easy to miss. Signals: "truncated at 30KB", "output went to a file", "head -300 cut it", "read only its first 2KB".
surface: safe
status: accepted
ref: "#2633: the owner accepted partial reads of required docs on 2026-10-28 (clear-backlog session_013zxzeTK9c2HVcabwCx3b18); an agent that has read enough to judge relevance may decide."
fixes:
  - pr: 2448
    date: "2026-10-23"
    summary: "CLAUDE.md's read-first intro says one Read call per doc, since a shell read can be cut short."
  - pr: 2644
    date: "2026-10-28"
    summary: "CLAUDE.md says to read a required doc whole if you can, no longer in one Read call: partial reads are encouraged against, not required."
occurrences:
  - session: session_013zxzeTDG9WP45rYE5hRMpG
    date: "2026-11-06"
    severity: minor
    description: "Read docs/agents/github-integration.md with head -80, against CLAUDE.md's read-it-whole rule; a later write trap could have been missed"
    solution: "Read trigger docs whole with the Read tool; it costs a few hundred tokens"
  - session: session_013zxzeRCCqrxVitqSaxJa4K
    date: "2026-11-07"
    severity: minor
    description: "My reviewer briefs said read each page in full, but several reviewers read through cut or head filters and truncated long lines, so some keeps rest on ledes and headings."
    solution: "State in the brief that page text must not be filtered or cut, and ask each reviewer to name any page it read only in part."
  - session: session_013zxzeRL5rU5zS3WRCkH3TE
    date: "2026-11-08"
    severity: nit
    description: "Labelled 2975 after only grepping issue-tracker.md; the hook asked for the whole doc, which I read afterwards and which held the supersession and trial checks I then ran."
    solution: "Read issue-tracker.md whole before the first label call, as CLAUDE.md says; the late read cost nothing here."
  - session: session_013zxzeRVjHExXhciv5BwiTB
    date: "2026-11-11"
    severity: nit
    description: "Relabelled issues #3068-#3076 after only a partial read of triage-labels.md and issue-tracker.md; the full read came later, when filing #3084."
    solution: "Read both docs whole before the first label write, as CLAUDE.md says."
  - session: fd29c728-8222-4915-94ab-25776442397b
    date: "2026-11-10"
    severity: nit
    description: "Before commenting on and closing #3029 I only grepped issue-tracker.md and triage-labels.md instead of reading them whole, as CLAUDE.md asks before triage."
    solution: "Read both docs in full before closing an issue; here the grep happened to cover the closing rules."
