name: required-doc-read-truncated
summary: >-
  Agents read a doc they must read in full through a shell pipe whose output was cut, so part of it went unread.
cause: >-
  A required doc (GLOSSARY, git-conventions, github-integration, issue-tracker, triage-labels, guards, …) was read through a cat, head or sed chain, often several docs in one call, and the output hit the tool's size cap or a head -N limit, so the rest was never seen; the truncation is easy to miss. Signals: "truncated at 30KB", "output went to a file", "head -300 cut it", "read only its first 2KB". The fix is to read each required doc in full with the Read tool, one call each.
surface: safe
status: tracked
ref: "issue #2437 (glossary imports, plus a one-Read-call-per-doc clause in CLAUDE.md's read-first intro)"
