name: designated-branch-clash
summary: >-
  The rule to stay on one git branch clashed with tasks that need another branch or several pull requests.
cause: >-
  CLAUDE.md's "Stay on the branch your session started on" and the session's designated-branch instruction collide with tasks that need a PR's branch, several independent PRs or a worktree, so the session asks or breaks the rule. Signals: 'designated branch', 'against stay on the branch', a new branch cut and undone.
surface: safe
status: open
related:
  - entry: git-checkout-misused-to-read-or-switch
    rule: git checkout or switch was used to read a file or move branches, and discarded work.
notes: |-
  2026-10-20 design: a repo doc granting pushes to other branches dropped: the harness pins one pushable branch and a repo doc cannot grant that; issue-tracker.md already says to flag it upfront and ask.
fixes: []
occurrences:
  - session: session_013zxzePBxPjfMQRm8C4FwqZ
    date: "2026-11-18"
    severity: nit
    description: "The system prompt limits pushes to the session branch while clear-backlog section 4 pushes each branch under its own name; I had to ask the owner (Q10) before landing anything."
    solution: "Let /clear-backlog count as the owner's permission to push its branch names, or state the exception in the cloud-session notes."
  - session: session_013zxzePPb9GTvLBJgGBgspQ
    date: "2026-11-19"
    severity: minor
    description: "audit-docs requires two PRs but the session instructions name one development branch; I cut a second branch for the escalation PR."
    solution: "Say in audit-docs and the system prompt that the escalation PR gets its own branch."
  - session: session_013zxzeNfqQhFTf6j6WBEjgF
    date: "2026-11-22"
    severity: minor
    description: "The system prompt names a harness branch to develop on while glassbox-curate says never use the harness-assigned branch; I followed the Skill."
    solution: "State once, in the scheduled routine's prompt or the Skill, which of the two wins for curate runs."
  - session: session_013zxzeQU1aX4cz6nKeBuxbP
    date: "2026-11-25"
    severity: nit
    description: "Escalation PR needed its own branch but the session branch had already merged; the system prompt forbids other branches, so I restarted the merged branch name from main."
    solution: "Say in audit-docs section 6 which branch name the escalation PR uses."
