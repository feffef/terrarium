name: designated-branch-clash
summary: >-
  The rule to stay on one git branch clashed with tasks that need another branch or several pull requests.
cause: >-
  CLAUDE.md's "Stay on the branch your session started on" and the session's designated-branch instruction collide with tasks that need a PR's branch, several independent PRs or a worktree, so the session asks or breaks the rule. Signals: 'designated branch', 'against stay on the branch', a new branch cut and undone.
surface: safe
status: open
notes: |-
  2026-10-20 design: a repo doc granting pushes to other branches dropped: the harness pins one pushable branch and a repo doc cannot grant that; issue-tracker.md already says to flag it upfront and ask.
fixes: []
occurrences:
  - session: session_013zxzeSKLjL9xzvaR2kQ4po
    date: "2026-11-04"
    severity: minor
    description: "System prompt says push only to the designated branch and open no PR unless asked, while clear-backlog and ADR-0003 say to push per-issue branches and open PRs; I followed the Skill."
    solution: "State in the clear-backlog Skill that invoking it authorises pushing its named branches and opening PRs despite a session branch pin."
  - session: session_013zxzeScSe7rW5BumGHCxoJ
    date: "2026-11-11"
    severity: nit
    description: "Cut a local branch for the post, then had to delete it and return to the session branch, against the start-on-your-branch rule."
    solution: "The blog-post step 7 wording 'cut a working branch' reads against CLAUDE.md; say 'stay on the session branch'."
