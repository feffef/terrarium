name: designated-branch-clash
summary: >-
  The rule to stay on one git branch clashed with tasks that need another branch or several pull requests.
cause: >-
  CLAUDE.md's "Stay on the branch your session started on" and the session's designated-branch instruction collide with tasks that need a PR's branch, several independent PRs or a worktree, so the session asks or breaks the rule. Signals: 'designated branch', 'against stay on the branch', a new branch cut and undone.
surface: safe
status: open
notes: |-
  2026-10-20 design: a repo doc granting pushes to other branches dropped: the harness pins one pushable branch and a repo doc cannot grant that; issue-tracker.md already says to flag it upfront and ask.
fixes: []
occurrences:
  - session: session_01ERZa4fUGxpF81MeLhZMkSB
    date: "2026-10-14"
    severity: minor
    description: "Impl agent proposed a Skill sentence authorising a second pushed branch against the harness rule; auto mode flagged its report as instruction poisoning."
    solution: "Keep authority changes human-decided; the designated-branch conflict needs an owner decision."
  - session: 1c810a28-81d4-417d-ac20-af374c985683
    date: "2026-10-16"
    severity: nit
    description: "Cut a new branch in a worktree instead of staying on the session's start branch claude/2174-local-workflow-edits"
    solution: "Justified: the user asked for a worktree and the start branch was unrelated work; CLAUDE.md could name the worktree case"
  - session: session_013QKXoGLaEHEJanyw5TrPqj
    date: "2026-10-25"
    severity: minor
    description: "clear-backlog §4 says push each branch from its worktree, while the harness restricts pushes to the session branch. I pushed the worktree HEAD to the session branch instead of its own name."
    solution: "clear-backlog §4 could say what to do with a one-branch run in a cloud session that has a designated branch."
  - session: session_01BgQzSd9CmFPiugdXAQh6HW
    date: "2026-10-26"
    severity: nit
    description: "Worked on a local branch audit-docs/2026-10-26 and pushed it to the designated session branch rather than staying on it."
    solution: "Rename the session branch instead of cutting a second one."
