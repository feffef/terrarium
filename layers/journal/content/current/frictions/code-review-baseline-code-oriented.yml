name: code-review-baseline-code-oriented
summary: The code-review Skill's Standards brief and smell baseline assume code, so a reviewer of a Markdown or prose diff had to ignore most of it or the session wrote its own prompts.
cause: "The installed code-review Skill (ADR-0015: never edited) ships a code-oriented smell baseline; for a prose-only or Markdown diff the Standards reviewer reports it mostly does not apply, or the session writes its own subagent prompts instead. Signals: 'smell baseline', 'code-oriented', 'prose-only diff', 'wrote my own subagent prompts'. A fix in the Skill's SKILL.md is not ours to make; a repo-specific note belongs in its Inventory entry."
surface: safe
status: open
occurrences:
  - session: session_013zxzeRYFqNFGvBn4FsDkTk
    date: "2026-11-09"
    severity: nit
    description: "code-review has the baseline of code smells pasted in full for a prose-only Skill diff; the Standards agent reported none applied."
    solution: "Have code-review skip the smell baseline when the diff holds no code."
  - session: session_013zxzePVqgGH7hbNFvSCqQR
    date: "2026-11-21"
    severity: nit
    description: "Retro: the reviewer smell baseline (code-review SKILL.md) gives nothing on prose-only diffs; the standards actually used were CLAUDE.md Keep it short and One home per fact plus ADR-0027."
    solution: "reviewPrompt(): for diffs touching only .md or Skill prose, point to those prose standards instead of the smell list."
