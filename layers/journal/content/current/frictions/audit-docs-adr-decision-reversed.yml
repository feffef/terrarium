name: audit-docs-adr-decision-reversed
summary: >-
  A rewrite of a decision record quietly reversed the decision, and only the owner noticed.
cause: audit-docs' checkers have no explicit check that an ADR rewording preserves the decision, so a rewrite that reverses it can pass; the owner caught it in review.
surface: safe
status: fixed
fixedOn: "2026-10-14"
ref: "issue #1913 closed by PR #1932 (merged 2026-10-14T07:57Z)"
fixes:
  - pr: 1932
    date: "2026-10-14"
    summary: "Audit fact-check now states what an ADR allows and forbids, and flags rewrites that change it."
occurrences:
  - session: session_01QvnVVurQdA4cvYSZToBvud
    date: "2026-10-13"
    severity: moderate
    description: "Escalation PR first rewrote ADR-0004's minor/patch clause to 'not by itself an exception', changing what the ADR decided; the owner caught it in review (agents are meant to merge such bumps)"
    solution: "When an ADR contradicts its own Human-only list, keep the decision and name the conflict (or ask the owner) rather than pick the side the code enforces; audit-docs already says never change what an ADR decided"
