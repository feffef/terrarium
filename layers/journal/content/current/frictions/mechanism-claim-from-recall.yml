name: mechanism-claim-from-recall
summary: >-
  Agents or their reviewer helpers described how a script, guard, rule or the code behaves from memory, or claimed "only", "every" or "nothing" without checking the whole set.
cause: >-
  How a script, guard, rule, harness setting, data format or the code's current state behaves is written from recall instead of read from its source, or a scope claim (only, every, nothing, never) is made after checking one item of the set; this includes a reviewer or rater subagent's own finding. A reviewer, the owner or a later check finds it false. glassbox-improve's lead now proposes only facts found in the source (PR #2626). Signals: a claim about what merge-pr.ts, a guard, an ADR rule or a config does; "only X changed"; a reviewer finding a check proved false.
surface: safe
status: accepted
acceptedSeverity: moderate
ref: "Issue #2876: the owner accepted the cost again on 2026-11-06 after #2626 did not hold; no general check exists. The one checkable class (a price or figure entering a data file) is filed for a narrow check."
related:
  - entry: relayed-subagent-claims
    rule: A helper's or another session's claim was passed on unchecked.
  - entry: diagnosis-from-partial-evidence
    rule: A cause or attribution was settled from one test or a commit list.
notes: |-
  2026-11-04 reopened: fix #2626 (2026-10-28) merged after the owner accepted it on 2026-10-25.
fixes:
  - pr: 2336
    date: "2026-10-20"
    summary: "CLAUDE.md \"Verify before you state\" now names subagent reports, script behaviour from recall, \"only\"/\"every\"/\"nothing\" claims and one-test causes; \"One home per fact\" says to grep for other statements when changing one."
  - pr: 2378
    date: "2026-10-21"
    summary: "Restored the shorter \"Verify before you state\" bullet in CLAUDE.md, and the Standards reviewer in clear-backlog-build now flags a count or subagent claim that cites no source."
  - pr: 2453
    date: "2026-10-23"
    summary: "blog-post takes rule-location claims from the loaded rule file, not only the ADR, and re-checks edits made after the report."
  - pr: 2626
    date: "2026-10-28"
    summary: "glassbox-improve's lead proposes only facts and wording found in the source (an absence claim most of all), and its researcher checks an absence claim against every code location."
