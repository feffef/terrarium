name: mechanism-claim-from-recall
summary: >-
  Agents or their reviewer helpers described how a script, guard, rule or the code behaves from memory, or claimed "only", "every" or "nothing" without checking the whole set.
cause: >-
  How a script, guard, rule, harness setting, data format or the code's current state behaves is written from recall instead of read from its source, or a scope claim (only, every, nothing, never) is made after checking one item of the set; this includes a reviewer or rater subagent's own finding. A reviewer, the owner or a later check finds it false. glassbox-improve's lead now proposes only facts found in the source (PR #2626). A helper's claim the main agent passed on unchecked belongs in relayed-subagent-claims. Signals: a claim about what merge-pr.ts, a guard, an ADR rule or a config does; "only X changed"; a reviewer finding a check proved false.
surface: safe
status: accepted
ref: "issue #2504 closed not planned on 2026-10-25: the owner accepts the cost. Three prose fixes (#2336, #2378, #2453) didn't hold; in the latest moderate case the false claims were caught before the push; a line per Skill would repeat CLAUDE.md's Verify before you state."
fixes:
  - pr: 2336
    date: "2026-10-20"
    summary: "CLAUDE.md \"Verify before you state\" now names subagent reports, script behaviour from recall, \"only\"/\"every\"/\"nothing\" claims and one-test causes; \"One home per fact\" says to grep for other statements when changing one."
  - pr: 2378
    date: "2026-10-21"
    summary: "Restored the shorter \"Verify before you state\" bullet in CLAUDE.md, and the Standards reviewer in clear-backlog-build now flags a count or subagent claim that cites no source."
  - pr: 2453
    date: "2026-10-23"
    summary: "blog-post takes rule-location claims from the loaded rule file, not only the ADR, and re-checks edits made after the report."
  - pr: 2626
    date: "2026-10-28"
    summary: "glassbox-improve's lead proposes only facts and wording found in the source (an absence claim most of all), and its researcher checks an absence claim against every code location."
