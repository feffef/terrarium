name: shared-scratchpad-collisions
summary: "Parallel subagents share one scratchpad, so one overwrites or runs another agent's helper files."
cause: "Dispatched agents write helper scripts and drafts to the same scratchpad directory; a stale or foreign script runs or is overwritten. Signals: \"shared the scratchpad\", \"stale helper\", \"overwrote another's helper script\"."
surface: safe
status: open
fixes:
  - pr: 2197
    date: "2026-10-17"
    summary: "Subagent briefs now ask each agent to keep scratch files in its own scratchpad subfolder."
  - pr: 2389
    date: "2026-10-21"
    summary: "CLAUDE.md and the inspect-session briefs now say a subagent writes every file it creates, scripts included, in its own folder."
occurrences:
  - session: session_013zxzeT8tDd5GPJiRNZRA4J
    date: "2026-11-04"
    severity: nit
    description: "Did not create per-agent scratchpad subfolders first (dispatch-subagents section 3); several writers dropped logs flat in improve/, two of them both called install.log."
    solution: "Have the writer brief generator create the named subfolder before the agent starts."
  - session: session_013zxzeSvCUWdcpBdHi4sdX2
    date: "2026-11-13"
    severity: nit
    description: "Second review round reused the first round's agent scratch folder names, against the one-folder-per-agent rule; no collision resulted."
    solution: "Name a fresh scratch folder per dispatched agent."
  - session: session_013zxzeQ4cuLLoFfdaf5sE2d
    date: "2026-11-13"
    severity: nit
    description: "A usage-analysis agent ran rule-use-report.ts, which writes its report to /tmp outside the agent's scratchpad subfolder."
    solution: "Give rule-use-report.ts an --out option, or have it print to stdout."
