name: edit-leaves-contradicting-sibling
summary: >-
  An edit to a doc, Skill or rule left other statements or references that contradicted it or pointed at removed text, caught only by review.
cause: >-
  After adding, changing, moving or cutting a section, rule, field or test, the author did not grep the same file and its consumers (docs, Skills, scripts, tests, typechecked callers, code comments, cross-references) for statements it overrides or references it breaks. Signals: a leftover line contradicting a new section, a dangling section reference, callers pointing at a removed section, a required field breaking another spec's typecheck, a test assertion built on a matcher or order the suite lacks; caught by code-review or the gate.
surface: safe
status: accepted
notes: |-
  2026-11-11 survey: issue #3047 closed not planned 2026-11-11: the owner leaves the Friction logged as accepted noise; a diff-based gate check would have caught 1 of 3 recent occurrences and audit-docs already greps the nouns the last 48 hours removed. Reopen if it turns moderate or recurs at a higher rate.
  2026-11-13 survey: gzxT (2026-11-12, moderate: row text changed with only unit tests run, an e2e assertion on the old text failed the gate) and sxKz (minor) appended; the 2026-11-11 note's reopen condition (turns moderate) is met, left accepted for the owner to decide.
fixes:
  - pr: 2336
    date: "2026-10-20"
    summary: "CLAUDE.md \"Verify before you state\" now names subagent reports, script behaviour from recall, \"only\"/\"every\"/\"nothing\" claims and one-test causes; \"One home per fact\" says to grep for other statements when changing one."
  - pr: 2766
    date: "2026-11-01"
    summary: "CLAUDE.md Self-verification: after changing a type or a test, run pnpm typecheck and the touched spec before gate:scoped."
occurrences:
  - session: session_013zxzeP5MnAU2v4XFBZHSdY
    date: "2026-10-30"
    severity: minor
    description: "Adding a required DigSeason field broke a typecheck in find.spec.ts that I did not grep for; first gate run failed after about 10 minutes."
    solution: "Grep consumers of a changed type before the gate, as CLAUDE.md says for facts."
  - session: session_013zxzeRuz3fA1RMj6ygrT9d
    date: "2026-10-31"
    severity: minor
    description: "gate:scoped failed twice (e2e assertion used a Playwright matcher the suite lacks; Popular order assertion broke under the cap) because I did not grep the tests first."
    solution: "Grep tests for the behaviour before changing it, and run typecheck on test edits."
  - session: session_013zxzeSvdGhiM7SLEUgzvmF
    date: "2026-11-01"
    severity: minor
    description: "The planning writer linked a work-queue anchor that the git-github writer removed in the same run; only code-review found it."
    solution: "Add to writer-brief: link a section of a page another writer edits this run without an anchor, or ask the coordinator."
  - session: session_013zxzeRwjiiLkjj6sQ3u49g
    date: "2026-11-07"
    severity: minor
    description: "Did not rekey grades.yml and update.yml page stems after moving pages; their owners' files, so left stale."
    solution: "Have the Skills tolerate moved stems or give the move a rekey step."
  - session: session_013zxzeRB6ciegpxcRDfedSF
    date: "2026-11-09"
    severity: minor
    description: "Changed a fact but grepped only code for its other statements, so the stale line in layers/glassbox/GLOSSARY.md surfaced only in code review."
    solution: "Grep the Tenant glossary and docs for the old fact in the same edit, as CLAUDE.md One home per fact says."
  - session: session_013zxzeRumtXDY7MVhKUgVT7
    date: "2026-11-09"
    severity: moderate
    description: "My first pass missed six Skill briefs that also asked for verdict tables, and several parser cases; the design author's review and later review rounds caught them, costing five review rounds."
    solution: "Before removing a flow, git grep for every phrasing of the ask (\"why it loaded\", \"yes/partly/no\"), and probe a shell-command parser with adversarial inputs before the first review."
  - session: session_013zxzePXpUx7WY6K2uHsxKz
    date: "2026-11-12"
    severity: minor
    description: "Found stale references (page title, comments, two smoke tests, glossary entry, dead wide/.wip code) only in a final pass, not in the same edit as each change (CLAUDE.md one home per fact)."
    solution: "Grep a changed string's other statements and the tests that count tiles right after each structural or copy edit."
  - session: session_013zxzeSLxxdLwoN9gcngzxT
    date: "2026-11-12"
    severity: moderate
    description: "Changed Where next and Lessons already read row text and ran only unit tests; an e2e assertion on the old text failed in the gate, costing a second full gate run."
    solution: "Grep tests/e2e for the changed text and run the touched e2e before the gate, per One home per fact."
  - session: session_013zxzeNiyBNZD3Zn5dUm9Bq
    date: "2026-11-13"
    severity: minor
    description: "The first retro-step commit invoked close-session in both step 4 and step 5, contradicting the #3244 timing I had just written; review caught it."
    solution: "When a Skill step and its standing issue state the same order, write the order once in the issue and check the Skill against it before committing."
  - session: session_013zxzeR9vRBRGWAa4ScJTRD
    date: "2026-11-13"
    severity: minor
    description: "First edit left stale 'standalone' and 'two earlier drafts' wording that both reviewers caught; needed a second commit."
    solution: "After removing a reference, grep the README and sibling docs for other statements of the same fact before committing."
  - session: session_013zxzeS7WM4TBNbgtufBjAT
    date: "2026-11-12"
    severity: minor
    description: "Rewrote the Skill's loop text four times; each pass fixed only the sentences I thought of, and the person's follow-ups found the leftover one-focus-per-run wording and an if-a-focus-remains stop that contradicted their budget-only answer."
    solution: "When changing a rule, re-read the whole Skill and grep its other statements in the same edit (CLAUDE.md, one home per fact), and check the new text against the person's earlier answers."
