name: github-search-fields-guard-deny
summary: Agents called GitHub search without limiting the returned fields, so a guard refused the call and they had to retry.
cause: "github-search-fields-guard.ts denies mcp__github__search_issues or search_pull_requests without `fields`; agents omit it, mostly before reading github-integration.md, and resend. Signals: a guard deny for a missing `fields`, 'blocked by the fields guard', a retried search."
surface: guard-or-hook
status: open
ref: "Comes from PR #1869's fix for search results flooding context (the former github-search-overflow cluster). Its Prune Trial (PR #2538) was judged and deleted by the 2026-10-28 prune run (PR #2641)."
notes: |-
  2026-10-29 design: per-Skill 'pass fields' lines dropped: the guard already names the fix and every session recovered in one retry; a rule cannot order a step before the read that loads it (ADR-0029)
occurrences:
  - session: session_013zxzeQUV6c2tzkFzv3WgiY
    date: "2026-10-29"
    severity: nit
    description: "My first GitHub call (search_pull_requests without fields) was blocked by the fields guard because I had not yet read docs/agents/github-integration.md as CLAUDE.md requires before any GitHub operation."
    solution: "Read the doc before the first mcp__github__ call; the guard message itself pointed to it."
