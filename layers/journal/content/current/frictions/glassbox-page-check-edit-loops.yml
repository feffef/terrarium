name: glassbox-page-check-edit-loops
summary: >-
  Glass Box page checks (the 65-word Why-bullet cap, link text that must equal the Lesson title) failed after edits, so agents learned the limits by repeated test runs and review rounds.
cause: >-
  Layer page checks reject a Why bullet over 65 words and a link whose text differs from the target Lesson's title; edits and renames break them and trimming to fit drops a bullet's reason. Signals: 'page-checks', '65-word cap', 'link text', 'renamed a Lesson', 'Where next'.
surface: safe
status: open
related:
  - entry: glassbox-page-conventions-found-late
    rule: A convention no Skill step states was learned from a failing test, a reviewer or the owner.
notes: |-
  2026-10-25 design: moving the page checks into validate:content, or a doc line on the 65-word cap, dropped: both sessions read EVERY-PAGE.md, which points to the cap's one home (#2114); the failure messages already name the limit; a gate-wiring change (Human-only) costs more than the two test runs it saves.
  2026-11-04 design: no change dropped: the page spec is the check working as designed, the writer-brief rule SAtj asked for landed in ec77d4bad, and the ADR-chip case was an installed code-review reviewer's proposal.
occurrences:
  - session: session_013zxzeSoqEeWqPDrCqDCcJn
    date: "2026-11-16"
    severity: nit
    description: "Glossing ADR pushed the Why bullet over its word cap; found only by running the page test, then fixed by trimming other words."
    solution: "Say in the Skill's Fix step that a bullet near 65 words has no room for a gloss."
  - session: session_013zxzePMRv24VHZ1q24seyG
    date: "2026-11-17"
    severity: nit
    description: "After the claim-check fixes I reworded a Why bullet and the page test failed on its word cap twice before I cut enough words; the cap is only visible in the test output."
    solution: "Fine as designed; a writer brief could name the 65-word Why bullet cap, which I had left out of the follow-up edit."
  - session: session_013zxzeT3ZUhBeG84jQUD1Hw
    date: "2026-11-21"
    severity: minor
    description: "The glassbox builder found the link-text-equals-page-title rule only through glassbox-pages.spec.ts, which validate:content does not run, and found the chip cap in page-checks.ts after four greps."
    solution: "Brief and fast checks for glassbox content edits should run layers/glassbox/tests/unit and name page-checks.ts:55."
