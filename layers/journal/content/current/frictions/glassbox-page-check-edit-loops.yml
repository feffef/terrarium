name: glassbox-page-check-edit-loops
summary: >-
  Glass Box page checks (the 65-word Why-bullet cap, link text that must equal the Lesson title) failed after edits, so agents learned the limits by repeated test runs and review rounds.
cause: >-
  Layer page checks reject a Why bullet over 65 words and a link whose text differs from the target Lesson's title; edits and renames break them, trimming to fit drops a bullet's reason, and parallel agents collide on the same Where next lists. Signals: 'page-checks', '65-word cap', 'link text', 'renamed a Lesson', 'Where next'.
surface: safe
status: open
notes: |-
  2026-10-25 design: moving the page checks into validate:content, or a doc line on the 65-word cap, dropped: both sessions read EVERY-PAGE.md, which points to the cap's one home (#2114); the failure messages already name the limit; a gate-wiring change (Human-only) costs more than the two test runs it saves.
occurrences:
  - session: session_01SNKBDEtR5UiaMXBdxvHuuE
    date: "2026-10-23"
    severity: nit
    description: "Three Why bullets went over page-checks' 65-word cap after my edits, which cost two test round trips."
    solution: "Count words when lengthening a Why bullet; EVERY-PAGE.md could state the cap next to the contract."
  - session: session_015bAGZEdCYZMYbsoFckSH59
    date: "2026-10-24"
    severity: minor
    description: "Word-cap trims to fit the 65-word Why-bullet limit repeatedly dropped a bullet's reason (Merge gate's 'fails safer'), needing two more review rounds to restore it."
    solution: "When a bullet hits the cap, cut a different clause than its reason, and re-read the bullet's logic before committing."
  - session: session_01Hpd1KMhzJC2NxHSxp7erFi
    date: "2026-10-25"
    severity: minor
    description: "Found only after announcing the plan that moving the gate Lesson out of terrarium-practice/ breaks the Full reference exemption in page-checks.ts"
    solution: "grep page-checks.ts for folder-specific rules before proposing a Glass Box folder move"
  - session: session_013zxzeQ5JaiqQgggGaNSagD
    date: "2026-10-29"
    severity: minor
    description: "The promoted draft failed the page spec on first run: description over 120 characters, bullets over 65 words, and link text not equal to a title, found only by running the tests."
    solution: "The writer brief could list the caps (description 120, bullet 65 words, link text equals title) so a promotion fixes them before the Check."
  - session: session_013zxzeRYnqNveUu5w9oJd9q
    date: "2026-10-30"
    severity: nit
    description: "My new sentence about the because check itself contained the word and failed the page test, costing one rerun."
    solution: "Run the glassbox page test after each prose edit."
