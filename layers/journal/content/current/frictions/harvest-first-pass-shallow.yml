name: harvest-first-pass-shallow
surface: safe
summary: A first harvest run stopped after a few clusters, or skipped a step of its Skill, so the owner had to challenge it before a real pass.
cause: "The harvest Skill's steps are read and then compressed: the list is read in part, a learning is judged by the idea test, or the list-merges step is skipped, so a run files nothing or records no per-cluster result. PR #3106 made step 1 read the list whole and step 3 name the failed test; PR #3137 made the per-cluster record and the source read checked. The stop is a free-text stopped: line that any reason satisfies; step 2 used to put every product cluster before the first workflow one, so an early stop never checked a workflow cluster (#3680). PR #3707 (2026-11-26) dropped that ordering and its check so a stop covers both kinds. Signals: 'first pass stopped after about ten clusters', 'filed nothing', 'skipped the Skill's list-merges-since step', 'head -300'."
status: open
related:
  - entry: harvest-list-read-cost
    rule: The harm is the token cost of reading the whole list.
  - entry: harvest-step-4-unstated-cases
    rule: Step 4 did not say how a mixed cluster counts for its cap.
fixes:
  - pr: 3106
    date: "2026-11-11"
    summary: "harvest step 3 judges a learning by its doc home, a dropped cluster names the failed test and the summary counts clusters, step 1 reads the list whole from a file, step 4 names the triage docs."
  - pr: 3137
    date: "2026-11-12"
    summary: "harvest checks a per-cluster record and the source read, and limits the simplify test to Platform machinery."
  - pr: 3417
    date: "2026-11-17"
    summary: "harvest check-clusters fails unless the cluster checks file carries a stopped: reason line before the first cluster; step 2 tells the run to write it."
  - pr: 3565
    date: "2026-11-21"
    summary: "harvest block prints each source session's authored fields to stderr, and SKILL.md step 4 reads that print instead of the whole source logs."
  - pr: 3707
    date: "2026-11-26"
    summary: "Harvest step 2 drops the product-before-workflow ordering and the workflowSeen check, so a mid-way stop covers both kinds; the 3-workflow cap and a non-empty stopped: line stay."
occurrences:
  - session: session_013zxzeP4WS4kX4LSBrVszT6
    date: "2026-11-12"
    severity: moderate
    description: "Filed three Seedlings without reading their source session logs whole (step 4) or the Glass Box glossary; one body misdescribed the 2026-11-09 session until the owner asked and I corrected it."
    solution: "Read each source log and the Tenant glossary before writing the body, as step 4 and the tenant-glossary rule say."
  - session: session_013zxzeNYPwVfq4WoT28Nfuu
    date: "2026-11-18"
    severity: minor
    description: "Did not read every source log whole before filing as step 4 requires; relied on the block summaries."
    solution: "Budget the reads per Seedling before choosing the count."
  - session: session_013zxzeNr2qY7wyodkaD7vXX
    date: "2026-11-19"
    severity: minor
    description: "The Skill gives no rule for stopping early on budget; I stopped with the quota unfilled and wrote an ad hoc stopped line in the checks file."
    solution: "Say in step 2 what to write when the run stops for cost, or make evidence cheap enough that it never happens."
  - session: session_013zxzeRcU6k3FNodWxgCMJg
    date: "2026-11-20"
    severity: moderate
    description: "Step 4 asks to read each source log whole; I read one log's authored half and the others' summaries only. I also stopped clustering at 12 of up to 30, so dropped-cluster checks are thin."
    solution: "The harvest Skill could print each source log's authored fields in one command, so reading them whole is cheap."
  - session: session_013zxzePSaj6hZQUzYVaqg4f
    date: "2026-11-25"
    severity: moderate
    description: "Stopped after eight product clusters and checked no workflow cluster or learning, so the quota was not filled; the same slip harvest-first-pass-shallow records."
    solution: "Cap the evidence read, then check at least one workflow cluster before stopping."
