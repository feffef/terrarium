name: push-chained-to-gate-run
summary: >-
  Agents put a push or commit in the same command as a check run, so a failed check could still be pushed.
cause: >-
  git-conventions.md forbids a push or other state-changing git later in the same Bash command as a gate or test run, and says to read the exit status in its own step; sessions chain git commit, --amend or git push with gate:scoped or with reading the gate log, or read the exit code of a backgrounded command that ends in tail as the gate's own, so a red gate reaches CI or reads as green. Signals: GATE_EXIT or EXIT=1 printed by the command that pushed, 'in the same command as git commit --amend', 'chained', the exit code of tail taken for the gate's.
surface: guard-or-hook
status: accepted
acceptedSeverity: minor
ref: "Issue #2752 closed not planned on 2026-11-14: the owner accepts the nit-level cost. The prune trial on git-conventions.md was judged and deleted on 2026-11-13: no major or blocker Friction."
related:
  - entry: chained-git-step-fails-silently
    rule: A failed git step inside a chained command was missed.
  - entry: edit-during-gate-run
    rule: Files were edited or committed while gate:scoped ran.
fixes:
  - pr: 2359
    date: "2026-10-21"
    summary: "git-conventions.md's rule against chaining a push after a gate run now covers foreground runs too, and says to read the exit status in a separate step first (doc only; no guard or hook)."
  - pr: 2407
    date: "2026-10-22"
    summary: "git-conventions.md's chaining rule now forbids a push or other state-changing git only when it comes later in the same command as a gate or test run."
occurrences:
  - session: session_013zxzeSYMKya1mzpFJhAcSk
    date: "2026-11-13"
    severity: nit
    description: "Committed and started the gate in one Bash command, against git-conventions; the commit landed, so no harm."
    solution: "Run the commit alone, check it, then start the gate."
  - session: session_013zxzePBHiX6mZNUjPTWpWc
    date: "2026-11-14"
    severity: nit
    description: "Pushed the branch and started gate:scoped in one Bash call, against git-conventions' rule to keep git apart from gate runs; nothing broke."
    solution: "Push in its own call, then start the gate."
  - session: session_013zxzeRDWicEfcb8rCWFepr
    date: "2026-11-14"
    severity: nit
    description: "Ran a git push in the same Bash command as the backgrounded gate run, against git-conventions' rule to keep git apart from gate steps."
    solution: "Push in its own call after reading the gate's own exit status."
  - session: session_013zxzeT6JgNuWiqXaqyMFpF
    date: "2026-11-14"
    severity: minor
    description: "Ran git fetch and a chained git log in the same Bash command as the gate run, before reading git-conventions.md."
    solution: "Run each git command in its own call and read the gate's exit status in a separate step."
  - session: session_013zxzeP4NViUQL8i9LwF7Nj
    date: "2026-11-16"
    severity: nit
    description: "Pushed the follow-up commit while its gate:scoped run was still going, after a Stop hook asked; pr-workflow says to push a head only after the gate passed. CI ran in parallel and nothing broke."
    solution: "Have the Stop hook skip its push request while a background gate or e2e run is still active."
