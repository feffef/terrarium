name: double-background
summary: >-
  Agents told a command to run in the background twice over, and a safety check blocked it.
cause: >-
  Sessions combine run_in_background: true with a trailing & or nohup, and the double-background guard denies it.
surface: guard-or-hook
status: accepted
ref: "issue #2310 closed not planned on 2026-10-20: the owner accepts the cost. Every slip was a deliberate background attempt that cost one retry, and a trailing-only rewrite would miss a mid-command &."
fixes:
  - pr: 2172
    date: "2026-10-16"
    summary: "The double-background guard's deny message now says the whole call was denied and nothing in it ran."
occurrences:
  - session: session_01KRLFYUD31NaEVTs4Qs1Tzj
    date: "2026-10-10"
    severity: nit
    description: "Stacked run_in_background true with a trailing ampersand; double-background-guard denied it, costing one retry."
    solution: "Use one background mechanism only."
  - session: session_01Tjsmye34hk57NtioyWQG4h
    date: "2026-10-11"
    severity: nit
    description: "Combined run_in_background with a trailing & in one command; the double-background guard blocked it and the edit in the same command did not run."
    solution: "Keep edits and the backgrounded gate in separate calls, as the guard says."
