name: harness-proxy-blocks
summary: >-
  The hosting environment's network proxy blocked sites and downloads the work needed, with no way to override it in the session.
cause: >-
  The cloud agent proxy or its DNS refuses a host (github.com/user-attachments, content.nuxt.com, zod.dev, nitro.build, nuxt.com, docs.github.com, the deployed site) with a 403 or connection failure and no in-session override; the fix is to list the host and its workaround in environment-caveats.md, and since PR #2647 the Glass Box page guide fetches blocked GitHub docs from raw.githubusercontent.com. Signals: proxy 403, curl 000, a DNS failure from WebFetch. The deployed site and its logs stay unreachable from a cloud session, a known limit. Other auto-mode classifier denials (a deleted pushed branch, a review subagent's script) with no shared fix also stay here. Since PR #2811 (2026-11-03) the orchestrator, not the subagent, pushes every reviewed branch, so a classifier denial no longer strands an agent's branch. PR #2974 (2026-11-08) scoped the blocked-host list in environment-caveats.md to the Default environment and PR #2976 added a SessionStart hook that reports which hosts the proxy lets through.
surface: outside
status: open
ref: "issue #3298 (closed 2026-11-14 after the fixes below)"
related:
  - entry: harness-classifier-denials
    rule: The auto-mode classifier denied an amend, force-with-lease or git reset --hard.
  - entry: sandboxed-ssh-hang
    rule: An ssh from the sandboxed Bash tool hung until timeout.
notes: |-
  2026-11-14: regression after #2976 filed as issue #3298. The owner closed #3298 as completed after PR #3093 and the Unrestricted-environment change for the network Routines (glassbox-curate, glassbox-update, dependabot-sweep; owner, 2026-11-12, issue #3124; no PR, so it is not in `fixes`). The two gh --paginate 403 reports did not reproduce. Reopen on a new occurrence after 2026-11-12T18:40Z.
fixes:
  - pr: 2030
    date: "2026-10-15"
    summary: "Documented more blocked hosts and not to retry them, and that a skipped question is not a failure."
  - pr: 2119
    date: "2026-10-16"
    summary: "verifying-ui-changes.md now says the deployed site is blocked in cloud sessions (plus a preview.ts review verb)."
  - pr: 2647
    date: "2026-10-28"
    summary: "Glass Box EVERY-PAGE.md falls back to fetching raw.githubusercontent.com/github/docs when docs.github.com is blocked, instead of sparse-cloning github/docs."
  - pr: 2811
    date: "2026-11-03"
    summary: "dispatch-subagents: impl agents hand back an unpushed branch and the orchestrator pushes every reviewed branch, so a classifier-denied subagent push cannot strand it."
  - pr: 2974
    date: "2026-11-08"
    summary: "environment-caveats.md scopes the blocked-host list to the Default environment, adds git-scm.com and says the blocked set varies by environment."
  - pr: 2976
    date: "2026-11-08"
    summary: "SessionStart hook network-start.ts probes 8 hosts through the proxy and reports which are reachable."
  - pr: 3093
    date: "2026-11-11"
    summary: "The site footer shows the deployed build's commit and time, so a session can tell what is deployed when the site is unreachable."
occurrences:
  - session: session_013zxzeR6YXBiMLnmDFQpBs9
    date: "2026-11-10"
    severity: moderate
    description: "Cloud sessions cannot reach the deployed site or its container logs, so the cause on the server stays unconfirmed."
    solution: "Expose the deployed build's commit (for example a /version endpoint or footer) so a session can compare it with main"
  - session: session_013zxzePP7cbXFfoqEXbKwKW
    date: "2026-11-12"
    severity: minor
    description: "Docs hosts (nuxt.com, vuejs.org, nitro docs) were blocked, so each reader spent many calls on raw GitHub fallbacks, and some docs-only claims stayed unverified."
    solution: "Add nuxt.com and vuejs.org to the environment's allowed hosts, or list the npm docs packages in writing-pages.md's fallback."
  - session: session_013zxzeQTY3RfDbuhXBkvo8B
    date: "2026-11-12"
    severity: nit
    description: "A gh api search call used a since filter and --paginate and the proxy answered 403 for numeric repo paths, so the listing had to be redone with other calls."
    solution: "Say in github-integration.md that a paginated gh api issues call can 403 through the proxy and list_issues with since is the way."
  - session: session_013zxzeSkGfgujTxwvEaiFTh
    date: "2026-11-12"
    severity: minor
    description: "gh api --paginate fails in this cloud proxy (numeric-ID repository paths blocked); I paged by hand with a page parameter."
    solution: "Have midden-survey say to page closed PRs manually in cloud sessions, with a loop that stops at the window start."
  - session: session_013zxzePAAjqaHMt85Ee6cxA
    date: "2026-11-15"
    severity: minor
    description: "The criterion-1 search subagent could not read the tracker because gh GraphQL is blocked, so the failed-prose search was partial."
    solution: "Give the search brief the REST route (gh api search/issues) and the list_issues MCP tool explicitly."
  - session: session_013zxzeSgAcwDrJXAMFAC4Qf
    date: "2026-11-17"
    severity: nit
    description: "Tried three ways to delete the stale remote branch (git twice, then the REST API); the proxy refused all of them, costing three calls before I reported it blocked."
    solution: "Say in environment-caveats.md that this proxy permits no branch deletion, so a session asks the owner at once."
  - session: session_013zxzeP8WnVqEqkerjzNSdX
    date: "2026-11-21"
    severity: minor
    description: "gh api could not read the nuxt/content release notes (repo outside the session's GitHub scope), so the changelog check relied on the PR's commit list."
    solution: "Let the sweep fetch upstream release notes through a scope-exempt read, or have the PR body carry them."
