name: harness-proxy-blocks
summary: >-
  The hosting environment's network proxy blocked sites and downloads the work needed, with no way to override it in the session.
cause: >-
  The cloud agent proxy or its DNS refuses a host (github.com/user-attachments, content.nuxt.com, zod.dev, nitro.build, nuxt.com, docs.github.com, the deployed site) with a 403 or connection failure and no in-session override; the fix is to list the host and its workaround in environment-caveats.md, and since PR #2647 the Glass Box page guide fetches blocked GitHub docs from raw.githubusercontent.com. Signals: proxy 403, curl 000, a DNS failure from WebFetch. The deployed site and its logs stay unreachable from a cloud session, a known limit. Other auto-mode classifier denials (a deleted pushed branch, a review subagent's script) with no shared fix also stay here; amend, force-with-lease and `git reset --hard` denials are harness-classifier-denials; CI job logs are ci-job-logs-unreachable, Self-Modification denials auto-mode-self-modification-denials. Since PR #2811 (2026-11-03) the orchestrator, not the subagent, pushes every reviewed branch, so a classifier denial no longer strands an agent's branch. PR #2974 (2026-11-08) scoped the blocked-host list in environment-caveats.md to the Default environment and PR #2976 added a SessionStart hook that reports which hosts the proxy lets through.
surface: outside
status: open
fixes:
  - pr: 2030
    date: "2026-10-15"
    summary: "Documented more blocked hosts and not to retry them, and that a skipped question is not a failure."
  - pr: 2119
    date: "2026-10-16"
    summary: "verifying-ui-changes.md now says the deployed site is blocked in cloud sessions (plus a preview.ts review verb)."
  - pr: 2647
    date: "2026-10-28"
    summary: "Glass Box EVERY-PAGE.md falls back to fetching raw.githubusercontent.com/github/docs when docs.github.com is blocked, instead of sparse-cloning github/docs."
  - pr: 2811
    date: "2026-11-03"
    summary: "dispatch-subagents: impl agents hand back an unpushed branch and the orchestrator pushes every reviewed branch, so a classifier-denied subagent push cannot strand it."
  - pr: 2974
    date: "2026-11-08"
    summary: "environment-caveats.md scopes the blocked-host list to the Default environment, adds git-scm.com and says the blocked set varies by environment."
  - pr: 2976
    date: "2026-11-08"
    summary: "SessionStart hook network-start.ts probes 8 hosts through the proxy and reports which are reachable."
occurrences:
  - session: session_013zxzeT84bc5MXpkCAApyxA
    date: "2026-10-29"
    severity: moderate
    description: "The auto-mode classifier denied the Glass Box subagent's git push with no reason, after the brief and Journal agents had pushed the same way; the branch is stranded until the owner answers"
    solution: "Have the orchestrator, not the subagent, push reviewed branches, so one permission context covers every push"
  - session: session_013zxzeRoWcNj4VhbkkjybNG
    date: "2026-10-29"
    severity: nit
    description: "vuejs.org and nuxt.com were blocked, so each official-docs URL needed a fallback to raw.githubusercontent.com source and could not be fetched live."
    solution: "Name raw.githubusercontent.com docs sources in EVERY-PAGE's blocked-network fallback so every writer and rater starts there."
  - session: session_013zxzeRnPtjPsVQM71SzX63
    date: "2026-10-29"
    severity: minor
    description: "Survey subagent: print-ledger-occurrence --append aborts the whole call on one held session, forcing grep pre-checks; gh api --paginate failed through the proxy."
    solution: "Let --append skip held sessions and report them; note the proxy pagination workaround in github-integration.md."
  - session: session_013zxzeSkTLmRxa2PWgt3kPw
    date: "2026-11-02"
    severity: minor
    description: "Official-docs URLs content.nuxt.com, v3.zod.dev, vitest.dev and docs.github.com were blocked by the proxy; the queryCollection Full reference stays unverified over the network"
    solution: "Allow those hosts in the environment's network policy, or fetch docs sources the way EVERY-PAGE describes"
  - session: session_013zxzeQH3GSc8uMpvhebnFr
    date: "2026-11-03"
    severity: minor
    description: "Official docs sites (nuxt.com, vuejs.org, docs.github.com and others) were unreachable for raters and writers, so many docs claims were checked only against installed packages; some rater claims stayed unverified."
    solution: "Allow the docs hosts in the environment's network policy, or add a docs-source fallback list to EVERY-PAGE for the common ones."
  - session: session_013zxzeT8tDd5GPJiRNZRA4J
    date: "2026-11-04"
    severity: minor
    description: "Docs hosts (nuxt.com, vuejs.org, docs.github.com, content.nuxt.com) returned 403 through the proxy, so a dozen raters, researchers and writers each rebuilt a raw GitHub fallback."
    solution: "Name the raw.githubusercontent.com source paths in the rater, researcher and writer briefs, or allow the docs hosts."
  - session: session_013zxzeNeTKPqiQ1jj1FgYXh
    date: "2026-11-06"
    severity: nit
    description: "git-scm.com returned 403, so the writer and checker verified git claims from the docs source on GitHub, and the mode 100644 meaning stayed unsourced."
    solution: "Allow git-scm.com in the environment, or have EVERY-PAGE name the raw git/git docs path as a standard fallback."
  - session: session_013zxzeRGhhzxkXgfdpEX9js
    date: "2026-11-07"
    severity: minor
    description: "MDN, w3.org, vuejs.org and playwright.dev did not resolve, and EVERY-PAGE.md's raw-GitHub fallback list omits MDN and W3C, so each writer rediscovered the paths."
    solution: "Add the mdn/content and w3c/using-aria raw paths to the fallback sentence, or allow the four hosts in the environment."
  - session: session_013zxzeQyhG5Jn9REJydTepm
    date: "2026-11-07"
    severity: minor
    description: "gh api for upstream release notes returned 403 (repo not attached), so I relied on the notes pasted in the Dependabot PR body."
    solution: "Sweep Skill could say the PR body notes are the expected source."
  - session: session_013zxzeR6YXBiMLnmDFQpBs9
    date: "2026-11-10"
    severity: moderate
    description: "Cloud sessions cannot reach the deployed site or its container logs, so the cause on the server stays unconfirmed."
    solution: "Expose the deployed build's commit (for example a /version endpoint or footer) so a session can compare it with main"
  - session: session_013zxzePP7cbXFfoqEXbKwKW
    date: "2026-11-12"
    severity: minor
    description: "Docs hosts (nuxt.com, vuejs.org, nitro docs) were blocked, so each reader spent many calls on raw GitHub fallbacks, and some docs-only claims stayed unverified."
    solution: "Add nuxt.com and vuejs.org to the environment's allowed hosts, or list the npm docs packages in writing-pages.md's fallback."
  - session: session_013zxzeQTY3RfDbuhXBkvo8B
    date: "2026-11-12"
    severity: nit
    description: "A gh api search call used a since filter and --paginate and the proxy answered 403 for numeric repo paths, so the listing had to be redone with other calls."
    solution: "Say in github-integration.md that a paginated gh api issues call can 403 through the proxy and list_issues with since is the way."
  - session: session_013zxzeSkGfgujTxwvEaiFTh
    date: "2026-11-12"
    severity: minor
    description: "gh api --paginate fails in this cloud proxy (numeric-ID repository paths blocked); I paged by hand with a page parameter."
    solution: "Have midden-survey say to page closed PRs manually in cloud sessions, with a loop that stops at the window start."
