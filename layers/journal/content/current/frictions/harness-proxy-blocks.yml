name: harness-proxy-blocks
summary: >-
  The hosting environment's network proxy blocked sites and downloads the work needed, with no way to override it in the session.
cause: >-
  The cloud agent proxy or its DNS refuses a host (github.com/user-attachments, content.nuxt.com, zod.dev, nitro.build, nuxt.com, docs.github.com, the deployed site) with a 403 or connection failure and no in-session override; the fix is to list the host and its workaround in environment-caveats.md, and since PR #2647 the Glass Box page guide fetches blocked GitHub docs from raw.githubusercontent.com. Signals: proxy 403, curl 000, a DNS failure from WebFetch. Auto-mode classifier denials (a deleted pushed branch, a review subagent's script, a force-with-lease push) with no shared fix also stay here; CI job logs are ci-job-logs-unreachable, Self-Modification denials auto-mode-self-modification-denials.
surface: outside
status: open
fixes:
  - pr: 2030
    date: "2026-10-15"
    summary: "Documented more blocked hosts and not to retry them, and that a skipped question is not a failure."
  - pr: 2119
    date: "2026-10-16"
    summary: "verifying-ui-changes.md now says the deployed site is blocked in cloud sessions (plus a preview.ts review verb)."
  - pr: 2647
    date: "2026-10-28"
    summary: "Glass Box EVERY-PAGE.md falls back to fetching raw.githubusercontent.com/github/docs when docs.github.com is blocked, instead of sparse-cloning github/docs."
occurrences:
  - session: session_01KVh6e6JUAssZvPRbuN5YDr
    date: "2026-10-15"
    severity: minor
    description: "Dispatched the first subagent for the public URL before reading verifying-ui-changes.md and before checking network reach, so it failed with a 403 and cost a round trip."
    solution: "Run curl on the target URL before briefing a screenshot agent."
  - session: session_01NFv67izdzVGrFHb2EVwZJ2
    date: "2026-10-16"
    severity: minor
    description: "nitro.build, v2.nitro.build and nuxt.com were unreachable (DNS fail via WebFetch, curl 000), so docs URLs could not be fetched directly"
    solution: "EVERY-PAGE.md's fallback worked: sparse clone of nitrojs/nitro v2 docs, npm pack @nuxt/docs, web search for exact URLs"
  - session: session_01CtktRkpbF4wQ3TTQVYUqLz
    date: "2026-10-17"
    severity: nit
    description: "The Spec review subagent was denied running glassbox-update.ts by the auto-mode classifier, so it could not confirm step 4's done check itself"
    solution: "Paste the done-check output into review briefs; I had already run it"
  - session: session_01TJH95qkztCQJ8PF6G6pvqs
    date: "2026-10-18"
    severity: nit
    description: "Deleting the redundant prototype/2231-accordion-pin-wait branch I had just pushed was blocked by the auto-mode classifier, so it stays on origin."
    solution: "Don't push a prototype/ copy before the owner names the branch; ask the owner to delete it."
  - session: session_015P9szA8dP4wxv4wiXkZcRZ
    date: "2026-10-24"
    severity: minor
    description: "docs.github.com is blocked by the proxy (WebFetch DNS fail, curl 403), so a GitHub docs claim could not be verified and was dropped."
    solution: "EVERY-PAGE's fallback (sparse clone of github/docs) costs more than one sentence; allowlisting docs.github.com would help Glass Box work."
  - session: session_01Hpd1KMhzJC2NxHSxp7erFi
    date: "2026-10-25"
    severity: minor
    description: "docs.github.com returns 403 through the proxy and github/docs is out of repo scope, so verifying the Full reference URL took a web search detour"
    solution: "EVERY-PAGE.md could name web search as the fallback for docs.github.com URLs"
  - session: session_013zxzeQmVnqMqDkRgFRWx5T
    date: "2026-10-28"
    severity: nit
    description: "A force-with-lease push of the restarted session branch was denied by the auto-mode classifier. The remote branch had been deleted on merge, so a plain push worked; one wasted call."
    solution: "The restart-after-merge recipe in the system prompt should say to try a plain push first, since the remote branch is deleted on merge."
