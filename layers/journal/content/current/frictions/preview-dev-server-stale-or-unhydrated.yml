    severity: moderate
    description: "Restarted the dev server about a dozen times, 1-2 minutes each, for single tweaks instead of keeping one running; HMR lag also gave stale screenshots I misread twice."
    solution: "Start one preview server per UI task, wait for HMR (poll the rendered text) and reshoot, restarting only after a config change."
  - session: session_013zxzeSLrkzfApGBDhjgFqB
    date: "2026-11-12"
    severity: minor
    description: "First dev-preview screenshots caught the Nuxt loading screen on a cold --dev start; three retries before a warm server gave a real shot."
    solution: "Start the dev server, curl until 200, then shoot; verifying-ui-changes.md says cold dev compiles on demand."
