name: preview-dev-server-stale-or-unhydrated
surface: safe
summary: A UI check against the nuxt dev server showed old code, old CSS or no hydrated page, so a screenshot or DOM probe misled or timed out and was redone.
cause: "The long-lived dev server (preview.ts start --dev or a cold shot --dev) misses edits to utils or CSS, serves a stale content database after a fast-forward, times out on a cold start, or never hydrates in headless Chromium, so a screenshot or probe reflects old or unhydrated code. Signals: 'stale CSS', 'did not reload', 'content database was stale', 'never hydrated', 'timed out three times', 'probe ran before hydration'. Since PR #3096 (2026-11-11) verifying-ui-changes.md says to build first when a --dev shot looks stale or unhydrated. Since PR #3456 (2026-11-18) the dev server no longer applies the 60-second page cache, which served old HTML after an edit."
status: on-trial
ref: "Prune Trial opened 2026-11-26 (.agents/prune-trials.yml): territory docs/agents/verifying-ui-changes.md"
related:
  - entry: claim-of-fix-not-rendered
    rule: A visual fix was reported working without a real render or the wide-font check.
  - entry: preview-shot-cannot-clip-or-seed
    rule: preview.ts shot cannot clip one element or seed page state.
fixes:
  - pr: 3096
    date: "2026-11-11"
    summary: "verifying-ui-changes.md says --dev can serve stale utils or CSS, time out cold or never hydrate in headless Chromium, so build first; screenshot --wait-for re-scrolls to the anchor."
  - pr: 3254
    date: "2026-11-13"
    summary: "preview.ts --dev readiness needs a 200 page that is not the Nuxt loading screen (120 s); screenshot.ts waits until hydration ends; verifying-ui-changes.md holds the dev-server advice once."
  - pr: 3456
    date: "2026-11-18"
    summary: "nuxt.config.ts turns off the two Platform page-cache rules in dev, so a dev preview no longer serves 60-second-old HTML."
occurrences:
  - session: session_013zxzeTChey8pdC2fuTTH7i
    date: "2026-11-16"
    severity: nit
    description: "Dev server returned 500 after git stash and pop under it; restarting it cost two retries."
    solution: "docs/agents/verifying-ui-changes.md: restart the dev server after stashing or restoring files under it."
  - session: session_013zxzeRCPF7mHwN6aT8t7RQ
    date: "2026-11-16"
    severity: minor
    description: "The dev preview kept serving the old Journal Markdown after I edited it, so the first screenshot showed the old text. I found it by probing the DOM and restarted the server, about four extra calls."
    solution: "Add to verifying-ui-changes.md: restart the dev server after editing a content file, since it serves cached content."
