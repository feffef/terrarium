name: scripted-text-replace-edits
summary: >-
  Agents edited files with a Python replace or regex instead of the Edit tool, and a greedy pattern once deleted the rest of a file.
cause: >-
  A small text change is made with a `python` string or `re.sub` replace in Bash instead of Read plus Edit (CLAUDE.md's Read-tool rule); a DOTALL pattern over a stylesheet ate the rest of it, and the same habit lands silently when the pattern is right. Signals: "python replace", "re.sub", "DOTALL", file contents missing after a scripted edit.
surface: safe
status: open
related:
  - entry: ledger-yaml-hand-edit-errors
    rule: A hand or scripted edit broke a YAML data file (ledger, trials, inventory, run entries, content).
notes: |-
  2026-10-21 design: a guard on Bash python replaces dropped: it is Human-only, would flag legitimate migration scripts, and every slip was caught or restored.
  2026-11-10 design: a CLAUDE.md line or Bash guard dropped again: 3 new occurrences, none above minor, all caught by diff or restored from git; the guard is Human-only. The cause's 'Read-tool rule' pointer was not found in CLAUDE.md.
  2026-11-13 design: run-entry writer script or Skill line dropped: only 2 of the 4 new occurrences hit run-entry YAML (both nits, caught in-run), the wrapping is the session's own and no script owns the entry.
  2026-11-14 design: no change: a guard or prose line dropped: every slip was caught by an assertion, diff or git, a guard is Human-only and would flag legitimate migration scripts. Cause text cites a CLAUDE.md Read-tool rule that is not in CLAUDE.md.
occurrences:
  - session: session_013zxzeS36fzX6FB2vAr7yRR
    date: "2026-11-09"
    severity: nit
    description: "A python string replace cut a Vue template at the first closing tag and left a broken fragment in WorkshopRuns.vue; I read the diff and repaired it."
    solution: "Rewrite whole component templates with the Write tool instead of slicing by string index."
  - session: session_013zxzeR2kKbsT81QWkXUrvK
    date: "2026-11-09"
    severity: minor
    description: "A Python reorder script sliced the page template with indexes computed after an earlier move, duplicating a block"
    solution: "Move template blocks with explicit Edit calls, or recompute indexes after each move; caught by counting sections"
  - session: session_013zxzeRumtXDY7MVhKUgVT7
    date: "2026-11-09"
    severity: minor
    description: "I wiped tests/unit/rule-use.spec.ts with a Python open-for-write that read the same file afterwards; restored it from git, but it cost a redo of that file's edits."
    solution: "Read a file into a variable before opening it for write; prefer the Edit tool for in-place changes."
  - session: session_013zxzeRxuQbrK3YcdGVkpU4
    date: "2026-11-12"
    severity: nit
    description: "Ran a Python replace script that asserted on a string I had retyped wrongly, costing a retry; the wording differed in case from the file."
    solution: "Use Edit with exact text instead of a retyped Python replace."
  - session: session_013zxzeQQzVdav2Lzx9D5WBr
    date: "2026-11-11"
    severity: nit
    description: "A python string-replace script failed on a slice boundary (substring not found), and save-handback failed once because its output folder didn't exist."
    solution: "Edit with the Edit tool for multi-hunk changes; mkdir -p the scratch subfolder before save-handback."
  - session: session_013zxzeS6w7fCCAw12ds3rtt
    date: "2026-11-11"
    severity: nit
    description: "A global sed rename also changed an unrelated use of the imported type, which I only spotted from the file-changed notice and then fixed."
    solution: "Use targeted Edits for renames in a file that imports a same-named type."
  - session: session_013zxzePDpmX3Lq9AEQGGTTW
    date: "2026-11-12"
    severity: nit
    description: "A Python str.replace on a wrapped YAML line silently did nothing, so run-entry sentences were missing until a later assert failed."
    solution: "Assert each replacement in the same script, as I did later, or edit with Edit."
  - session: session_013zxzeSdKDZBdqz6vRp3xW1
    date: "2026-11-12"
    severity: nit
    description: "A foreground sleep was blocked, and a python replace silently never matched because the run-entry YAML is line-wrapped."
    solution: "Wait with the completion notification; match wrapped text by line or regex."
  - session: session_013zxzeT2YDMzAWKoi2AC98c
    date: "2026-11-12"
    severity: minor
    description: "My multi-edit Python helper wrote each file as it went and then failed an assertion, so two edits applied only in part (a test and the memory note), costing extra fix commits and a re-run."
    solution: "Check every replacement before writing any file, or use the Edit tool per change."
  - session: session_013zxzeRbcVWW7Upv1bSok39
    date: "2026-11-13"
    severity: minor
    description: "A bulk regex rename turned Terrarium evidence (Frictions, visitor-loop) into the new template terms; caught on a re-read and restored by hand"
    solution: "Scope term renames to requirement statements and list each hit before replacing"
  - session: e5f88467-c386-4b88-8c16-b9786c748d41
    date: "2026-11-13"
    severity: nit
    description: "My mutation check of the new test first edited nothing: sed's pattern missed a list item that ends a line, so the test passed and I had to retry"
    solution: "Check git diff --stat after a mutation, before reading the test result"
  - session: session_013zxzeQ65iPt7YSAHWJBs1q
    date: "2026-11-15"
    severity: nit
    description: "A scripted text edit after the worker restart removed a paragraph break; I saw it only when I printed the file."
    solution: "Print the edited lines right after any scripted rewrite before committing."
  - session: session_013zxzeSgAcwDrJXAMFAC4Qf
    date: "2026-11-17"
    severity: nit
    description: "Edited the brief, scripts and tests with Python replace scripts in Bash, not Read plus Edit; one left an unwrapped line that a reviewer flagged."
    solution: "Use Read then Edit for each text change, and keep scripted writes for data files a helper tool covers."
  - session: session_013zxzePBiGUC5ThCkjDhzN7
    date: "2026-11-19"
    severity: nit
    description: "Edited with a python replace script; the first pass left a garbled step 9 sentence that I caught on my own read and fixed in a second script."
    solution: "Use the Edit tool for multi-hunk prose changes and re-read each replaced paragraph."
