name: scripted-text-replace-edits
summary: >-
  Agents edited files with a Python replace or regex instead of the Edit tool, and a greedy pattern once deleted the rest of a file.
cause: >-
  A small text change is made with a `python` string or `re.sub` replace in Bash instead of Read plus Edit (CLAUDE.md's Read-tool rule); a DOTALL pattern over a stylesheet ate the rest of it, and the same habit lands silently when the pattern is right. Signals: "python replace", "re.sub", "DOTALL", file contents missing after a scripted edit.
surface: safe
status: open
notes: |-
  2026-10-21 design: a guard on Bash python replaces dropped: it is Human-only, would flag legitimate migration scripts, and every slip was caught or restored.
  2026-11-10 design: a CLAUDE.md line or Bash guard dropped again: 3 new occurrences, none above minor, all caught by diff or restored from git; the guard is Human-only. The cause's 'Read-tool rule' pointer was not found in CLAUDE.md.
occurrences:
  - session: session_013zxzeSaEvHWNU8EdNqcqGG
    date: "2026-11-02"
    severity: minor
    description: "Round-tripping 11 Inventory files through the yaml package reformatted about 2,600 lines; I reverted and redid the edit as a text splice."
    solution: "audit-skills step 5 could name a script that appends an observation without reparsing the file."
  - session: session_013zxzeSSjEgB5DvGmrLdxP9
    date: "2026-11-05"
    severity: minor
    description: "My first python edit of the Eyra post asserted on a missing string and wrote nothing, yet I committed and resumed the checker; it re-read the unchanged file and a round was wasted."
    solution: "Check the script's exit status and git diff before committing and before resuming a checker."
  - session: session_013zxzeSxfK7X25LqaANsqoE
    date: "2026-11-07"
    severity: minor
    description: "A scripted Python edit of the Digest garbled the summary and duplicated a PR link, needing a second fix pass."
    solution: "Rewrite the affected lines directly with Edit instead of chained string replaces."
  - session: session_013zxzeQWJUyfuXJgdfypeuc
    date: "2026-11-07"
    severity: nit
    description: "A scripted SKILL.md edit failed on a mismatched old string and had to be resent in full, since the script aborted before writing"
    solution: "Grep the exact lines first, or use the Edit tool per hunk so one mismatch does not void the batch"
  - session: session_013zxzePc3zKAyZGZfucZa9y
    date: "2026-11-07"
    severity: nit
    description: "A python edit script with a garbled replacement raised a SyntaxError and wrote nothing, costing a round trip"
    solution: "Write small edits as plain exact-string replacements"
  - session: session_013zxzeS36fzX6FB2vAr7yRR
    date: "2026-11-09"
    severity: nit
    description: "A python string replace cut a Vue template at the first closing tag and left a broken fragment in WorkshopRuns.vue; I read the diff and repaired it."
    solution: "Rewrite whole component templates with the Write tool instead of slicing by string index."
  - session: session_013zxzeR2kKbsT81QWkXUrvK
    date: "2026-11-09"
    severity: minor
    description: "A Python reorder script sliced the page template with indexes computed after an earlier move, duplicating a block"
    solution: "Move template blocks with explicit Edit calls, or recompute indexes after each move; caught by counting sections"
  - session: session_013zxzeRumtXDY7MVhKUgVT7
    date: "2026-11-09"
    severity: minor
    description: "I wiped tests/unit/rule-use.spec.ts with a Python open-for-write that read the same file afterwards; restored it from git, but it cost a redo of that file's edits."
    solution: "Read a file into a variable before opening it for write; prefer the Edit tool for in-place changes."
  - session: session_013zxzeRxuQbrK3YcdGVkpU4
    date: "2026-11-12"
    severity: nit
    description: "Ran a Python replace script that asserted on a string I had retyped wrongly, costing a retry; the wording differed in case from the file."
    solution: "Use Edit with exact text instead of a retyped Python replace."
  - session: session_013zxzeQQzVdav2Lzx9D5WBr
    date: "2026-11-11"
    severity: nit
    description: "A python string-replace script failed on a slice boundary (substring not found), and save-handback failed once because its output folder didn't exist."
    solution: "Edit with the Edit tool for multi-hunk changes; mkdir -p the scratch subfolder before save-handback."
