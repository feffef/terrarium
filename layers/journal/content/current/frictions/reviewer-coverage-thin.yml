name: reviewer-coverage-thin
summary: A reviewer subagent could not read all the docs or pages it was given, so its coverage was thin and cost a resume or went unread.
cause: "A reviewer or audit subagent is handed more files than it can read (the whole docs set, Skills, journal pages, glossaries); it reports partial coverage or has to be resumed, doubling its cost. Signals: 'covered only a fraction', 'reviewers reported thin coverage', 'had to be resumed', 'unread'."
surface: safe
status: open
fixes:
  - pr: 2734
    date: "2026-10-31"
    summary: "audit-docs rotates coverage: reviewers B and C skip areas the last two runs' Covered line names, end replies with unread Live files, and are never resumed."
occurrences:
  - session: session_013zxzeQRndZ5iHweDq8ceMP
    date: "2026-11-11"
    severity: minor
    description: "The explore agent read summaries and traces of only 1 of 57 logs though I asked for full reads; I had to disclose that gap in my reply."
    solution: "Brief should say a partial read is not acceptable, or split the logs across several agents."
  - session: session_013zxzeNq8X5Pc3Xwjpv6Wxe
    date: "2026-11-12"
    severity: minor
    description: "Reviewer agents B and C read only about eight docs/agents files; most Live files went unread, so coverage is thin."
    solution: "Split each lens over narrower file sets so each agent can finish."
