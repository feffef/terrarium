    solution: "PR #1591 fixes the grader; the #1515 comment and Inventory entry still need a correction, left to the owner's call."
  - session: session_01Jej4qtE56V9dtLCNobJ39K
    date: "2026-10-06"
    severity: moderate
    description: "A checker confirmed a doc 'fix' from a tool's own description (list_triggers lacks last_fired_at) without calling the tool; real output has the field, so the original doc was right. Owner chose to defer a Skill rule."
