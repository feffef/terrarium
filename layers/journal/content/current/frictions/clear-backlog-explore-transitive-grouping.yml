name: clear-backlog-explore-transitive-grouping
summary: >-
  The backlog Skill's explore step put issues on one branch on file overlaps that did not mean they should share a branch.
cause: >-
  The clear-backlog explore grouping (clear-backlog-explore.js, run-summary.ts) puts issues on one branch that should not share one: before PR #2158 by union-find chaining through other issues' files; since, by a direct overlap on a file one result lists only as background, or by grouping a build-ready issue with one sent to grilling. Signals: 'chained', 'grouping bundled', 'listed ... only as background', a ready build held up by a grill issue, regroup by hand.
surface: safe
status: open
ref: "Issue #2147 closed by PR #2158 (merged 2026-10-16); no test exercises the grouping."
fixes:
  - pr: 2158
    date: "2026-10-16"
    summary: "Replaced union-find grouping with a greedy pass: an issue joins a group only if it directly overlaps every member."
occurrences:
  - session: session_01VPNHf6qDdJPXX23GghKs74
    date: "2026-10-16"
    severity: nit
    description: "Explore's proposed grouping bundled #2112/#2113 with the Glass Box issues though they share no file with them"
    solution: "Have the explore grouping union only issues that share a file, not chain through unrelated shared files"
  - session: session_013QKXoGLaEHEJanyw5TrPqj
    date: "2026-10-25"
    severity: minor
    description: "run-summary's grouping put #2499 (build) with #2503 (grill) because #2503 listed flatten.ts only as background. Following it would have held up a ready build."
    solution: "run-summary.ts could group only issues with the same outcome, or ignore files a grill result lists as background."
