    severity: minor
    description: "Chose the work-queue draft without checking its title against EVERY-PAGE's title rule; two raters then flagged five words, costing a retitle round and link-text edits on five pages."
    solution: "Have step 3 check a candidate draft's title against the rule before it is chosen, or add the word count to page-checks (issue 2651)."
