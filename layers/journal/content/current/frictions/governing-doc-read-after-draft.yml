name: governing-doc-read-after-draft
summary: >-
  A doc that governs what an agent writes or explains (a Tenant's glossary or content, the Platform overview) is read only after the agent drafted or added text it governs.
cause: >-
  A doc that governs new text (a Tenant Skill's voice or title rule, the Tenant's own GLOSSARY.md or ADR, docs/agents/domain.md for a glossary term, the Glass Box overview CLAUDE.md names before explaining the Platform) is read after the agent drafted or added the text, or not at all, and a reviewer, a hint or the rule's late load finds the miss. Signals: 'without first reading', 'plain-words voice rule', 'domain.md', a Tenant GLOSSARY.md read after the draft, a reviewer correcting wording or a term the doc already settles, 'explained X without reading the overview'.
surface: safe
status: open
related:
  - entry: adr-read-after-edit
    rule: The post-edit hook named a governing ADR after the first edit and the late read changed nothing.
  - entry: late-read-first-docs
    rule: The doc is git, GitHub, issue or screenshot guidance and the hint fired after the call.
  - entry: constraint-unread-before-build
    rule: The unread doc was a rule or ADR the design or build went against, not drafted text.
  - entry: glassbox-curate-read-first-skipped
    rule: The glassbox-curate Skill's own first reads (glossary, QUALITY.md, the Subject's pages) were skipped.
notes: |-
  2026-11-19 survey: issue #3234 closed completed 2026-11-18 by merged PR #3476 (fix already recorded, merged_at 2026-11-18T23:01:30Z); status reset from tracked. Two window occurrences came after it (PpCy: the guard denied the first Write, one retry; RsaS 2026-11-19 00:45Z: Inventory edits under layers/journal without the glossary read, not blocked).
