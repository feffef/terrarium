name: governing-doc-read-after-draft
summary: >-
  A doc that governs a Tenant's content or glossary is read only after the agent drafted or added text it governs.
cause: >-
  A doc that governs new text (a Tenant Skill's voice or title rule, the Tenant's own GLOSSARY.md or ADR, docs/agents/domain.md for a glossary term) is read after the agent drafted or added the text, or not at all, and a reviewer, a hint or the rule's late load finds the miss. Signals: 'without first reading', 'plain-words voice rule', 'domain.md', a Tenant GLOSSARY.md read after the draft, a reviewer correcting wording or a term the doc already settles.
surface: safe
status: open
ref: "Issue #2505 closed by PR #2514."
fixes:
  - pr: 2469
    date: "2026-10-23"
    summary: "The glossary-term read-first moves into a path-scoped rule that loads on GLOSSARY.md files and the domain-modeling Skill."
  - pr: 2514
    date: "2026-10-25"
    summary: "Added a What lives where section to the Glass Box glossary that points to the Skills holding its writing rules."
  - pr: 2667
    date: "2026-10-29"
    summary: "The tenant-glossary rule says a Tenant's terms apply to everything written under its layer, code comments included."
occurrences:
  - session: session_01CMjFaMZxZgD7oTzNXmWwzv
    date: "2026-10-23"
    severity: minor
    description: "Added a glossary term without reading docs/agents/domain.md first, as CLAUDE.md requires."
    solution: "Read it when the domain-modeling Skill loads; the Skill could name it."
  - session: session_01RbgM2L9pxGwnDWbc3Aw6Vq
    date: "2026-10-23"
    severity: minor
    description: "Proposed dek and body wording naming the season without first reading midden-catalogue's plain-words voice rule; review caught it and cost a fourth question round."
    solution: "Read the Tenant's curatorial voice rules before proposing exact prose for its pages."
