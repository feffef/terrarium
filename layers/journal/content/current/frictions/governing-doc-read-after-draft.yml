    date: "2026-10-24"
    severity: moderate
    description: "Asked the owner to pick a title style before reading EVERY-PAGE's title rule; the picked titles broke it and needed a second owner decision and retitle round."
    solution: "Read the Tenant's writing Skill (glassbox-lesson/EVERY-PAGE.md) before asking a design question it already settles; the Tenant glossary could point to it."
  - session: session_013zxzeQV6Jcqg4jYk2tkwBq
    date: "2026-10-27"
    severity: nit
    description: "I read layers/blog/GLOSSARY.md and ADR-0012 only after hooks asked, after the post was written."
    solution: "Read the Tenant glossary at step 1, before drafting."
  - session: session_013zxzePnX2He1hvzhQj7LrJ
    date: "2026-10-27"
    severity: nit
    description: "Did not read layers/tinkerfund/GLOSSARY.md as the tenant-glossary rule asks before working on a Tenant."
