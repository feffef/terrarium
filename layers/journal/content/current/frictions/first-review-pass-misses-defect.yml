name: first-review-pass-misses-defect
surface: safe
summary: A build's first Standards and Spec review let a defect through that the session or a later review found.
cause: "The Standards and Spec review of a clear-backlog-build branch passes a defect (a regex that rejects ordinary prose; a real gap in a rule's coverage flagged only as a judgement call) and the main session finds it reading the diff, or a later review round does. Signals: 'review passed', 'I caught it reading the diff', 'flagged as a mere judgement call', a fix round after the build reported ready."
status: open
notes: |-
  2026-10-29 design: one line in clear-backlog-build's review brief for a gap against a 'never' clause dropped: two unrelated minors, both caught by the main session before the push; revisit if a defect reaches CI
  2026-11-03 design: no change: the newest miss came from the installed code-review Skill (ADR-0015, uneditable); the one editable surface, clear-backlog-build reviewPrompt, was not implicated since 2026-10-28; dropped: revisit if a defect reaches CI or recurs in a build workflow
occurrences:
  - session: session_013zxzeQTGBbhXQGepc3y2z8
    date: "2026-10-27"
    severity: minor
    description: "clear-backlog-build's Standards and Spec review passed a #2582 regex that rejected prose like session_id; I caught it reading the diff before the push"
    solution: "The build brief should ask for a negative test on look-alike text whenever a change adds a validation regex"
  - session: session_013zxzeTK9c2HVcabwCx3b18
    date: "2026-10-28"
    severity: minor
    description: "The build reviewer flagged as a mere judgement call a real gap where the #2472 rule covered only one clause of the bar, which I fixed by hand."
    solution: "The build workflow's review should treat a gap against the brief's 'never' wording as a finding, not a judgement call."
  - session: session_013zxzeTGYbEWeFyEywFafxw
    date: "2026-10-28"
    severity: minor
    description: "A first-round Zod fix ('type and schema overlap on one rule') was false and passed code-review; only the last re-grade caught it"
    solution: "Have the review's Spec agent re-check every sentence a fix round rewrote against its source, not only the targeted deficit"
  - session: session_013zxzeQ8EBq9v7NXqWmAFRF
    date: "2026-10-27"
    severity: minor
    description: "The Skill took three review rounds after the Fable pass (Standards+Spec, then two follow-ups), each finding real gaps in how an unattended run ends (refusing writers, empty runs, dropped false claims)."
    solution: "For an unattended Skill, write each step's failure exits (refuse, empty, stall) before review, not after."
  - session: session_013zxzeRkQabGaMQ8gphe4Ra
    date: "2026-11-02"
    severity: moderate
    description: "My two-axis code-review missed bugs the owner's reviewer found: vote-array holes deciding a gate early, and a split without into escaping the churn guard"
    solution: "Give the Spec and Standards reviewers concrete adversarial inputs to try (out-of-order verdicts, missing optional fields) for each counting rule, not just the spec text"
