name: late-formatting-fix-reruns-gate
surface: safe
summary: A late line-length or wording fix needed its own commit and a full gate run.
cause: "A fix to line wrapping or phrasing is made piecemeal after the first commit (a missed long line, a one-phrase reword), so each costs another commit and full gate:scoped. Signals: '80-column', 'whitespace-only', 'second commit and gate run'."
status: open
notes: |-
  2026-11-08 design: a gate line-length check dropped: it needs a Human-only file (scripts/gate/gate.ts) to enforce an 80-column convention nobody has written down, for one nit and one minor that each cost a gate rerun.
fixes:
  - pr: 3196
    date: "2026-11-12"
    summary: "clear-backlog-build: wrap width is the builder's check (a length check before committing), not a review finding."
occurrences:
  - session: session_013zxzeRCJHe4rmKN5i2CQ16
    date: "2026-11-06"
    severity: nit
    description: "An 80-column re-wrap needed two commits because the agent missed one long line, and each commit meant another full gate run."
    solution: "Give the agent the awk check up front and ask it to run it before committing."
  - session: session_013zxzeQwU4eYGrEvV8x42ts
    date: "2026-11-08"
    severity: minor
    description: "My hand fix of the glassbox-update step 4 line left another over-long line, so I needed a second edit, commit and a full gate:scoped re-run for a whitespace-only change."
    solution: "Check the rewrapped paragraph's line lengths (awk) before running the gate."
  - session: session_013zxzeRumtXDY7MVhKUgVT7
    date: "2026-11-09"
    severity: minor
    description: "The first gate:scoped run failed at lint on an unused import I left after removing authored docsRead; I had run typecheck and specs but not eslint before the multi-minute gate."
    solution: "Run eslint on touched files alongside typecheck before gate:scoped when removing code; CLAUDE.md's pre-gate step names only typecheck and the spec."
  - session: session_013zxzeR3mLZWKT2R7LWmtqf
    date: "2026-11-12"
    severity: minor
    description: "Two Standards re-checks and a builder fix ping-ponged on line-wrap nits, because each rewrap moved the overrun to the next line."
    solution: "Have the builder run awk length>80 on touched lines before the first commit; the builder rules() could say so."
