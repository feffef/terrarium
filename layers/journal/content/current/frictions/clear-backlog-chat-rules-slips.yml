name: clear-backlog-chat-rules-slips
surface: safe
summary: Clear-backlog orchestrators wrote status lines or vague pointers to open questions in chat, against the Skill's own chat rules.
cause: "clear-backlog SKILL.md says to write only questions, needs and the report in chat; sessions write short status lines while agents run and later refer to open questions without repeating them in full. Signals: 'wrote several short status lines while agents ran', 'against clear-backlog's chat rules', 'said the questions were open without repeating them'."
status: open
occurrences:
  - session: session_013zxzeNWbHYVE9UDhB1zNHD
    date: "2026-11-12"
    severity: nit
    description: "Wrote several short status lines while agents ran, and later messages said the questions were open without repeating them in full, against clear-backlog's chat rules."
    solution: "Keep silent while agents work; paste every unanswered Q in full each time I write."
  - session: session_013zxzeT5pQrVtuNLAzUQRaP
    date: "2026-11-14"
    severity: nit
    description: "I wrote short status lines between steps while agents worked, though clear-backlog says to write only questions, needs and the report."
    solution: "Stay silent between tool calls unless a question or needs-owner item exists."
