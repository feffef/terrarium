name: closure-not-invoked-at-pr-open
summary: >-
  Agents opened a pull request without writing their session log, so it stayed stale or the user had to ask for it.
cause: >-
  CLAUDE.md and ADR-0009 say to invoke close-session before the turn that opens a PR ends; sessions defer it to the end of a multi-PR run or offer it afterwards, even when the create_pull_request hint reminds them. Signals: 'opened PR #N ... before invoking close-session', 'deferred both to the end', HUMAN-PROMPTED-CLOSURE after a PR.
surface: safe
status: open
ref: "PR #2217 fixed the PR-open half of issue #2209; PR #1821 (regressed); issue #1859 closed by PR #1868 (merged 2026-10-13T06:11Z, read-first-hint reminds close-session after a PR opens)"
fixes:
  - pr: 1821
    date: "2026-10-12"
    summary: "Doc fix so close-session is also invoked when a PR is opened."
  - pr: 1868
    date: "2026-10-13"
    summary: "The read-first hint now reminds the session to run close-session after it opens a PR."
  - pr: 2217
    date: "2026-10-17"
    summary: "The read-first hint now looks only at the transcript after the latest PR creation, so it reminds about close-session on every PR."
  - pr: 2381
    date: "2026-10-21"
    summary: "CLAUDE.md, pr-workflow.md step 4 and clear-backlog now say to invoke close-session before the turn that opens a PR ends, and the read-first hint says \"before this turn ends\"; the answer-only case stays out of scope."
occurrences:
  - session: session_01Ai3w5epHj4PWgBC8XSoEwz
    date: "2026-10-18"
    severity: minor
    description: "Did not invoke close-session at each PR open as CLAUDE.md says; the create_pull_request hook reminded me and I deferred both to the end."
    solution: "Invoke it right after create_pull_request, before posting the verdict."
