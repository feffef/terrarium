name: pack-skill-install-pitfalls
summary: >-
  No doc explains how to add an outside Skill, and the install tool put it in the wrong place.
cause: >-
  No doc covers adding a pack Skill; the skills CLI installed under .claude/skills (needs move plus link) and skills-lock computedHash is not the on-disk installedSha256.
surface: safe
status: open
notes: |-
  2026-10-21 design: a pack-install doc dropped: installs are rare, and validate-skills-lock.ts already explains the hash pin and prints the --write fix.
occurrences:
  - session: session_01Lwanyry6GWtqHYoMAgGGLa
    date: "2026-10-15"
    severity: minor
    description: "The skills CLI installed retro under .claude/skills instead of .agents/skills with a link, so I had to move it and recreate the symlink by hand."
    solution: "Document the CLI install-then-move step in a Skill or docs/agents note, or wrap it in a script."
  - session: session_01Q4KbJ3FxhATe3QXaMbo1AM
    date: "2026-10-16"
    severity: minor
    description: "Pinned retro.yml's installedSha256 to skills-lock.json's computedHash instead of the actual on-disk SKILL.md sha256, wasting one full gate run before verify-skills-lock caught the drift."
    solution: "scripts/verify-skills-lock.ts's own header comment already explains why the lock's computedHash can't be reused (it hashes upstream source, not the installed file) — read that comment before guessing a pin value, or just run pnpm verify:skills-lock --write instead of hand-computing it."
