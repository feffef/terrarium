name: clear-backlog-review-round-low-yield
surface: safe
summary: The first review round of clear-backlog branches mostly re-found nits, or its Spec reviewer repeated the Standards findings, at a large subagent cost.
cause: "Each branch gets a Standards and a Spec reviewer in round one by rule; the gate and unit specs caught the real failures, and the reviewers raised nits or each other's findings. Signals: 'round-1 reviews re-found only nits', 'Spec findings duplicated Standards', 'same as Standards'."
status: open
related:
  - entry: followup-review-overcost
    rule: That entry is a review that cost far more than it found on a tiny first push or small follow-up; here a normal first round on larger branches found little.
notes: |-
  2026-11-23 design: widen small bar / narrow Spec prompt / drop round-1 Spec axis dropped: two sessions with mixed evidence (round 1 found real defects on four branches in NisE); a review-cost policy call for the owner, not a deletion
occurrences:
  - session: session_013zxzeT3ZUhBeG84jQUD1Hw
    date: "2026-11-21"
    severity: moderate
    description: "Round-1 reviews re-found only nits on five of six branches (only discover's added real missing tests); builders and reviewers both say so, while the gate and a unit spec caught the two real failures. The reviews plus later rounds cost many subagent tokens."
    solution: "Let a CSS-only or wording-only diff with recorded measurements take one merged Standards and Spec reviewer (widen the small bar in pr-workflow.md and clear-backlog), an owner decision."
  - session: session_013zxzeNisEDZyrmPg2jhA5G
    date: "2026-11-22"
    severity: minor
    description: "Retro (Spec reviewer): 4 of 5 round-1 Spec findings on the guard branch duplicated Standards findings (triage.md 'same as Standards #N'). Counter-evidence: round 2 on the guard found a defect only Standards saw, and round 2 on glassbox an owner-call only Spec saw."
    solution: "reviewPrompt() could keep Spec to brief fit (picks, never-clauses) and leave code shape and schema to Standards; weigh against the unique catches before cutting."
  - session: session_013zxzeRQRYWw3yLJzSdaozk
    date: "2026-11-24"
    severity: nit
    description: "Retro verdict on review value: the Standards re-check caught a real defect (loop cap relied on an unconfirmed field) and the Spec round caught a missing test; the small-diff watchFor branch's review found only nits."
    solution: "Keep the review rounds; no cut is supported by evidence from this run."
  - session: session_013zxzeSBTTxHztyPoJeEwAj
    date: "2026-11-24"
    severity: nit
    description: "Retro (Standards and builder, unverified): all four round-1 reviews found only nits and no defects on diffs of 5 to about 40 lines; the re-check round added little. Evidence is one run of four small branches."
    solution: "Keep the review; consider marking diffs under about 50 lines small by default. One run is too little evidence to cut a step."
  - session: session_013zxzePxkwAcvTVUDd7sToK
    date: "2026-11-25"
    severity: nit
    description: "Retro (Standards reviewer): round 2, triggered by the over-10-lines fix rule, found only wording leftovers, while the check on the Glass Box revert caught the one real issue."
    solution: "Keep the size rule but let the re-check of a revert or pin conflict count as the second look; one data point, so frictions-to-fixes should wait for more."
  - session: session_013zxzeQLTeC8GETW73Aho8C
    date: "2026-11-26"
    severity: nit
    description: "Review value across the run: the Standards and Spec rounds each caught one real defect on the harvest and rules branches (a false ledger cause, stale clauses); the Both round on the small branch only re-found a nit."
    solution: "Keep the Standards plus Spec pair for branches above the simple-change bar; the Both round is the cheap path for small ones."
