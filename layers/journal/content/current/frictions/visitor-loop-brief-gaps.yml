name: visitor-loop-brief-gaps
surface: safe
summary: The visitor-loop brief left out details its visitors needed, so they wandered or tripped.
cause: "The visitor brief and its context file leak hints to the blind visitor (repo root, other visitors), omit that screenshots need absolute output paths, give no reason for 'do not change directory', name the wrong chromium helper or say to follow links that open in place. Signals: visitor-loop, visitor brief, blind visitor, screenshots in the repo root, ERR_PNPM_RECURSIVE_EXEC_NO_PACKAGE."
status: open
related:
  - entry: subagent-brief-defects
    rule: The brief carried a wrong path or value, or an unfilled placeholder.
fixes:
  - pr: 3249
    date: "2026-11-13"
    summary: "visitor brief: scripts run without changing directory with absolute output paths in the visitor's scratch folder; context file gains a pages section."
  - pr: 3263
    date: "2026-11-13"
    summary: "visitor brief says why not to cd (pnpm fails elsewhere) and to open Chromium with launchChromium(); the server stops after the rendered-page checks; the context file lists merged PRs, not every commit."
occurrences:
  - session: session_013zxzeNiyBNZD3Zn5dUm9Bq
    date: "2026-11-13"
    severity: moderate
    description: "First brief rewrite still leaked repo-root and other-visitor hints to the blind visitor; two extra review rounds and commits to remove them."
    solution: "When a brief serves both blind and informed agents, write the blind variant first and grep it for repo, git and peer mentions before committing."
  - session: session_013zxzeQpVcWQaKyrR36MwpN
    date: "2026-11-13"
    severity: minor
    description: "Visitor brief says to run from the working directory but never says to use absolute output paths; the blind visitor's screenshots landed in the repo root and tripped the Stop hook"
    solution: "Add to visitor-brief.md: run tsx from the repo root and write every output as an absolute path in the scratch folder"
  - session: session_013zxzeRifuq1jTn2WseeBhP
    date: "2026-11-13"
    severity: minor
    description: "The brief's 'without changing directory' rule has no reason, so two visitors hit ERR_PNPM_RECURSIVE_EXEC_NO_PACKAGE after a cd; the brief also names resolveChromiumPath where launchChromium adds the sandbox flags."
    solution: "In visitor-brief.md say pnpm needs the repo as cwd, and point to launchChromium."
  - session: session_013zxzeQsCq5g9jeQpmsULPZ
    date: "2026-11-16"
    severity: minor
    description: "Visitors' retros say the brief gives no page-spread guidance for a one-page focus (homepage) or a single big section; the blind crawl spent 16 pages in the Blog."
    solution: "visitor-brief.md: cap pages per section and say whether a single-page focus needs browser visits or only status checks."
  - session: session_013zxzeSLYR7qbBXfqwKYbcc
    date: "2026-11-18"
    severity: nit
    description: "The context file listed 222 URLs while the brief asks for 10 to 20 pages; two visitors said they picked pages blind."
    solution: "Have step 2 add a short sample of URLs to the context file, or say to sample from the list."
  - session: session_013zxzeT9rFXvusQJoECfbbV
    date: "2026-11-19"
    severity: minor
    description: "The context file's pages section gave the Journal's routes, but both informed visitors still crawled only 7 pages because digests and sessions open as in-page anchors; each wrote extra scripts."
    solution: "In .agents/skills/visitor-loop/SKILL.md step 2, have the context file mark which routes are reachable only by anchor or typed URL, and let the brief say what to do when a Space has fewer than 10 pages."
  - session: session_013zxzeSsM57HSqjsQnKmeyY
    date: "2026-11-20"
    severity: minor
    description: "The context file has no recipe: I hand-built it, listing /t/midden/trench twice and omitting query-string and 404 URLs, which the UI tester had to find by guessing."
    solution: "Add a short generator script under .agents/skills/visitor-loop/scripts/ that writes the four context sections, deduplicated, with each Space's filter URLs and a 404 URL."
  - session: session_013zxzeStkfKoZxBQUkQd9pd
    date: "2026-11-21"
    severity: nit
    description: "Context file did not say /t/tinkerfund aliases /prod or that /qa is a component-gallery fixture, so the editor found it by comparing byte counts."
    solution: "In .claude/skills/visitor-loop/SKILL.md step 2, have the context file's pages section note aliases and QA fixture Spaces."
  - session: session_013zxzePNKjPWkVNAkzZbSVC
    date: "2026-11-22"
    severity: minor
    description: "The context file's ideas-already-logged list held two items already shipped, so the editor re-checked them; the visitor brief gives no way to tell shipped from open."
    solution: "ideas.ts list (.agents/skills/visitor-loop/scripts/ideas.ts) should mark ideas whose page changed after the idea's date."
