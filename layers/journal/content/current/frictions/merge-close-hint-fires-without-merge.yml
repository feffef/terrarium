name: merge-close-hint-fires-without-merge
surface: guard-or-hook
summary: A hook told the session a PR had merged and to close the session when no PR had merged yet, or the session had none.
cause: "A 'PR merged: invoke close-session' prompt arrives when no PR of the session merged. Before PR #2890 (2026-11-06), read-first-hint.ts (PostToolUse) pushed MERGE_CLOSE_SESSION_HINT for any main-session Bash command naming merge-pr.ts; it now needs the run's stdout to report merged true. The Stop hook merge-close-stop.ts (PR #2937, 2026-11-07) still has the old test: it blocks on trace.mergedWithoutClose, which scripts/session/transcript-trace.ts sets for any Bash command whose text includes scripts/github/merge-pr.ts, so it fires while merge-pr.ts only polls CI in the background, or in a session that opened and merged no PR. Signals: 'PR merged' hint, 'the Stop hook said a PR merged', 'still open and waiting on CI', 'this session opened none', 'merge-pr.ts failed with 503', 'had to check origin/main'."
status: open
related:
  - entry: close-session-reminded-by-stop-hook
    rule: The Stop hook correctly flagged a merge the session had not closed over.
fixes:
  - pr: 2890
    date: "2026-11-06"
    summary: "read-first-hint.ts counts a main-session merge-pr.ts run for the close-session hint only when its stdout reports \"merged\": true."
  - pr: 3412
    date: "2026-11-17"
    summary: "Stop hook counts a merge only when merge-pr.ts's own result reports merged: true"
occurrences:
  - session: session_013zxzeQDRyvj3Vc8GUWHvBv
    date: "2026-11-14"
    severity: minor
    description: "The Stop hook said a PR merged and demanded close-session while merge-pr.ts was still polling CI; nothing had merged."
    solution: "Fire the merge hint only after a merged PR is observed."
  - session: session_013zxzeRLqFejsZTowNzt1Lt
    date: "2026-11-15"
    severity: minor
    description: "Stop hook twice demanded close-session claiming a PR merged while merge-pr.ts was still polling CI, and again after one PR merged with the other and the closing PR unfinished."
    solution: "Fire the hint only after merge-pr.ts reports merged, and only when no run work remains."
  - session: session_013zxzeTChey8pdC2fuTTH7i
    date: "2026-11-16"
    severity: nit
    description: "Stop hook said a PR merged and demanded close-session, though this session opened and merged none; cost an extra closure pass."
    solution: "Have the hook check the session's own PRs, not any merge event, before demanding close-session."
  - session: session_013zxzeNzhyuFe3JhwD9usjS
    date: "2026-11-16"
    severity: minor
    description: "Stop hook repeatedly said a PR merged and demanded close-session while no PR existed yet and subagents were still running, costing several turns of redundant status replies."
    solution: "Gate the merge-close Stop hook on a PR this session actually opened or merged."
  - session: session_013zxzeQgh4aLo2xMP4FzXZJ
    date: "2026-11-17"
    severity: minor
    description: "The Stop hook said a PR merged and close-session had not run, twice, when no PR had merged in this session."
    solution: "Fix A makes the Stop hook count a merge only when merge-pr.ts reports merged."
  - session: session_013zxzePjedjMk4SeDKFvzPt
    date: "2026-11-17"
    severity: minor
    description: "The Stop hook said a PR merged and demanded close-session twice, and a PostToolUse hint did too, when this session had merged nothing; I had only run commands naming merge-pr.ts."
    solution: "Fix 3412 landed hours earlier; check whether it covers the PostToolUse hint and the Stop hook for commands that only grep or log the script name."
  - session: session_013zxzeNx4V4gWZvzs8HQ3sZ
    date: "2026-11-18"
    severity: minor
    description: "The merge-close Stop hook said a PR merged and close-session had not run, though this session had merged nothing."
    solution: "Already fixed for the trace by #3412; the hook still fired here, so check whether Stop reads a stale trace or another path."
