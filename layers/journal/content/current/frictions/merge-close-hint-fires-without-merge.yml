name: merge-close-hint-fires-without-merge
surface: guard-or-hook
summary: The post-merge close-session hint said the PR was merged after a merge-pr.ts command that had not merged it, so the session had to check the PR state.
cause: "Before PR #2890 (2026-11-06), read-first-hint.ts (PostToolUse) pushed MERGE_CLOSE_SESSION_HINT ('PR merged: invoke close-session') for any main-session Bash command naming merge-pr.ts; it now needs the run's stdout to report merged true. A hint after a run that did not merge, or a merge whose output was piped or cut, would be new. Signals: 'PR merged' hint, 'merge-pr.ts failed with 503', 'only named merge-pr.ts', 'had to check origin/main'. The Stop hook merge-close-stop.ts (PR #2937, 2026-11-07) produced the same message for PR 2946 while merge-pr.ts was only waiting on the gate in the background."
status: open
fixes:
  - pr: 2890
    date: "2026-11-06"
    summary: "read-first-hint.ts counts a main-session merge-pr.ts run for the close-session hint only when its stdout reports \"merged\": true."
occurrences:
  - session: session_013zxzeSbd2LJtWWawqrWBJD
    date: "2026-11-05"
    severity: nit
    description: "The PostToolUse hook said \"PR merged\" after two merge-pr.ts runs that failed with a GitHub 503; I had to check origin/main to learn the PR was not merged."
    solution: "Make the hook fire only when merge-pr.ts prints merged: true, or word it as \"if merged\"."
  - session: session_013zxzeTJp1jinYqgNJRczgA
    date: "2026-11-05"
    severity: nit
    description: "A hook hint said the PR was merged after commands that only named merge-pr.ts, before any merge; I had to check the PR state to avoid logging completed early"
    solution: "Make the merged hint fire on the merge-pr.ts JSON result with merged true, not on the command text"
  - session: session_013zxzeShUkKqUQT1kYCw5UK
    date: "2026-11-07"
    severity: minor
    description: "merge-close-stop.ts blocked the stop saying a PR merged while PR 2946 was still open and merge-pr.ts was only waiting on the gate in the background."
    solution: "Make closureRefusal count a merge only on merge-pr.ts output with merged true; add a transcript test with the command started and no result."
  - session: session_013zxzeS3L4tvAUKm5q3d9qD
    date: "2026-11-08"
    severity: minor
    description: "merge-close-stop blocked the stop twice saying a PR merged while #2963 was still open and merge-pr.ts was only waiting on CI."
    solution: "Fire the hook only once the PR is merged, not when merge-pr.ts starts (ledger entry merge-close-hint-fires-without-merge)."
  - session: session_013zxzeQhMWFqY3DzWrbVdEs
    date: "2026-11-08"
    severity: minor
    description: "Stop hook said a PR merged and demanded close-session three times while merge-pr.ts was still polling CI and the PR was open; cost extra checks."
    solution: "Fire the merged-PR check only after the PR state is merged, not when merge-pr.ts starts."
  - session: session_013zxzeQN4dgz9seaMtnRf7u
    date: "2026-11-10"
    severity: minor
    description: "The Stop hook claimed a PR merged and close-session had not run, though this session merged nothing; it made me close early."
    solution: "Have the merge-close hook match only a merge-pr.ts run in this session, not merge text in tool output."
  - session: session_013zxzeRpiY8hmJh8z3HELvr
    date: "2026-11-11"
    severity: nit
    description: "Stop hook said a PR merged and demanded close-session while merge-pr.ts for #3051 was still waiting on CI; PR was open."
    solution: "Have the Stop hook confirm the merge (PR state or merge-pr.ts exit) before claiming one."
  - session: session_013zxzeR9nyx91atfAKEs7c3
    date: "2026-11-11"
    severity: minor
    description: "Stop hook demanded close-session claiming a PR merged, while this run opened none, forcing an early log mid-run."
    solution: "Make the merged-PR check ignore sessions that opened no PR."
  - session: session_013zxzeSPxncNsUJXwnc2DvG
    date: "2026-11-11"
    severity: nit
    description: "The Stop hook claimed a PR had merged and demanded close-session, though no PR had merged or opened this run."
    solution: "Make the merge-close hint check the session's own PRs before firing."
