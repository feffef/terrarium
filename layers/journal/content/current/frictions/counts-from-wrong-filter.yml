name: counts-from-wrong-filter
summary: >-
  Agents quoted counts from a script, window or eligibility filter that was wrong, and had to correct them.
cause: >-
  A number is taken from a throwaway script, a measurement window or an eligibility set whose filter was not checked against its source (a dropped outlier, a window start not taken from the issue, an eligibility rule not applied), so the count is wrong even though it was computed. Signals: "throwaway script", "window", "would skip", "eligible".
surface: safe
status: open
ref: "issue #2435 (split from counts-not-tallied)"
notes: |-
  2026-10-24 design: a CLAUDE.md or doc line dropped: CLAUDE.md already says a count is a fact only after you read every item, it was in context for all 5, and the five causes (eligibility rule, outlier drop, window start, ls headers) share no mechanism a helper could check.
fixes: []
occurrences:
  - session: session_013zxzeRynjgY3G22uZYaKCk
    date: "2026-11-02"
    severity: nit
    description: "extract-frictions counted 28 sessions in the window but friction-rates counted 20; I could not reconcile them and said so in #2784."
    solution: "Have friction-rates print how it picks the sessions it counts."
  - session: session_013zxzeQNXfvE3ck6tjqWpYK
    date: "2026-11-04"
    severity: minor
    description: "Built the first list of six reopen candidates from the first git -S date for status accepted, which missed relayed-subagent-claims' re-acceptance, so I corrected to five."
    solution: "Read each entry's ref and its latest status commit, not the first, before reporting acceptance dates."
  - session: session_013zxzeSbd2LJtWWawqrWBJD
    date: "2026-11-05"
    severity: nit
    description: "My quick check of the Friction files' occurrence counts was a sloppy grep that returned meaningless numbers; I left the issues' counts marked unverified instead of recounting."
    solution: "Count with a short script over the occurrences list, or say unverified up front rather than running a grep that cannot count."
  - session: session_013zxzeTDG9WP45rYE5hRMpG
    date: "2026-11-06"
    severity: nit
    description: "Page count from ls (66) did not match runs.yml pagesRead (68); left unexplained, so I wrote 'every page' without a verified total"
    solution: "Count guide pages with the same function grades.ts uses before comparing"
  - session: session_013zxzePVGCU1ARYitEsVKoy
    date: "2026-11-06"
    severity: nit
    description: "Stated the 21-occurrence count only after checking; my grep of the ledger gave 38 date-like lines, so the figure stayed unverified and I said so."
    solution: "Ledger tooling should print occurrence counts since a given fix, so a grill question can cite one verified number."
  - session: session_013zxzeRCCqrxVitqSaxJa4K
    date: "2026-11-07"
    severity: minor
    description: "No orient output shows which guide file names differ from their titles or how many links use each old address, so I wrote a throwaway bash loop and hand-counted, which led to the wrong counts."
    solution: "Add a section to glassbox-curate orient.ts listing pages whose file name shares no word with the title, with their inbound link counts; a Skill change that waits for the owner's merge."
  - session: session_013zxzeQaeB8hhL2FFfcQhv7
    date: "2026-11-08"
    severity: minor
    description: "My diff filter grep '^[-+][^-+]' dropped changed bullet lines, which start '- **', so I briefly misjudged two findings as old text"
    solution: "Filter diffs with '^[-+]' and exclude only the '---'/'+++' headers; caught by re-grepping before acting"
  - session: session_013zxzeNd2Ethpd3anqbmpkr
    date: "2026-11-09"
    severity: nit
    description: "Keyed sessions by a 10-character id prefix; three of 390 collided and skewed the edit-versus-read table until I reran on full ids. Caught before publishing."
    solution: "Key by full session id and assert uniqueness in throwaway aggregation scripts."
  - session: session_013zxzeRvdzBc3xXGo24TkVf
    date: "2026-11-12"
    severity: nit
    description: "First count of sessions that used inspect-session (6) came from current logs only; the archive held many more, and I corrected it only after counting both folders."
    solution: "Count every log folder (current and archived) before stating how many sessions did something."
  - session: session_013zxzeSkGfgujTxwvEaiFTh
    date: "2026-11-12"
    severity: moderate
    description: "My first manual PR page loop stopped at 8 pages and silently missed PRs 1827-1830 and 1804; I caught it only by spot-checking a branch's PR."
    solution: "Have midden-survey give one tested command that pages until created_at falls before the window."
