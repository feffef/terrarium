name: audit-skills-output-overflow
summary: >-
  The skill-audit script printed so much that the survey agent could not read its output in one go.
cause: >-
  scripts/session/audit-skills.ts prints its whole report (56-478 KB) to stdout when run bare, overflowing the tool result, so the survey subagent persists it and re-runs a narrow extraction. Signals: audit-skills.ts, output persisted to a file, "printed about N KB".
surface: safe
status: open
ref: "audit-skills output redirect in frictions-to-fixes §4, 2026-10-16"
fixes:
  - pr: 2109
    date: "2026-10-16"
    summary: "The survey instructions now say to save the large skill-audit output to a file and read only one part."
  - pr: 2733
    date: "2026-10-31"
    summary: "Redirected the design brief's audit-skills output to a file with a narrow extraction."
occurrences:
  - session: session_013zxzeSiq7TZmfmF5D5Rbwt
    date: "2026-10-31"
    severity: nit
    description: "Design brief wants only docReadCounts, but audit-skills.ts prints 40 KB JSON with no filter flag; the agent wrote a snippet. It also lacks a check for a fix that landed after the session."
    solution: "Add a docReadCounts-only option to audit-skills.ts, and a git-log check step in design-brief.md."
  - session: session_013zxzeNdAgdKF5tpWTQLowx
    date: "2026-11-13"
    severity: minor
    description: "Design subagent: design-brief section 3 says to read only docReadCounts, but printing the audit-skills JSON put 75 KB (a 160-entry window array) into its context first."
    solution: "Give the one-liner that prints only docReadCounts in the brief."
