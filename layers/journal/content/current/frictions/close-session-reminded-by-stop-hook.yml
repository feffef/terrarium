name: close-session-reminded-by-stop-hook
summary: A session merged a PR and went on without invoking close-session again, and the Stop hook for it reminded the session, costing a prompt.
cause: "Comes from close-session-bypassed-by-hand-log and PR #2937 (the Stop hook merge-close-stop.ts, which blocks the end of a turn once after a merge without close-session): the hook now catches the slip, so the original harm (the owner having to ask for the log) is not recurring here; that entry keeps the hand-written-log occurrences. Signals: 'the Stop hook had to remind me', 'did not re-invoke close-session until the Stop hook flagged it', 'prompted by the Stop hook after the first merge'."
surface: guard-or-hook
status: open
ref: "close-session-bypassed-by-hand-log, fix PR #2937"
related:
  - entry: close-session-bypassed-by-hand-log
    rule: The owner had to ask for the log, or the session wrote it by hand.
  - entry: merge-close-hint-fires-without-merge
    rule: A hook said a PR merged when it had not, or the session merged none.
occurrences:
  - session: session_013zxzeQQP2yCoP7hw7GD1Gx
    date: "2026-11-22"
    severity: nit
    description: "Stop hook demanded close-session after the first merge while the closing ledger PR still waited on its gate, so I had to log mid-flow."
    solution: "Nothing to change; re-invocation is safe and this log is replaced at the end."
  - session: session_013zxzeTKxE9MSXFCu6Nqhr9
    date: "2026-11-25"
    severity: nit
    description: "Merged PR 3672 and carried on to the reply without re-running close-session; the Stop hook had to remind me."
    solution: "Re-invoke close-session at each merge, as CLAUDE.md says, before the next step."
  - session: session_013zxzeQLTeC8GETW73Aho8C
    date: "2026-11-26"
    severity: nit
    description: "After a merge I re-authored the log with log-session directly instead of invoking close-session, so the Stop hook blocked the turn end twice."
    solution: "Say in the merge step of pr-workflow that close-session, not log-session, is the re-invoke after a merge."
