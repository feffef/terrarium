name: usage-limit-429
summary: >-
  Hitting the usage limit stopped helper agents mid-run until the limit reset.
cause: >-
  A session usage limit (HTTP 429) kills parallel subagents mid-run; work resumes only after the hourly reset.
surface: outside
status: open
occurrences:
  - session: session_01VC6tZCm3HYs9BsJ7JrQQ5Z
    date: "2026-10-02"
    severity: moderate
    description: "Session rate limit (HTTP 429, resets hourly) killed the slice-D review agent mid-run and restarted the worker; resumed via SendMessage after the reset"
    solution: "Nothing in-repo; resuming the same agent id (not re-dispatching) preserved its scratch work. Worth noting in environment-caveats that a 429 can abort a subagent silently"
