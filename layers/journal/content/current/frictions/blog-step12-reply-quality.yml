name: blog-step12-reply-quality
summary: >-
  The blog Skill's step for writing a reply post often produced a weak reply or none at all.
cause: >-
  blog-post step 12's reader judges sketches against a novelty bar, so a weak reply ships or both finalists fail fact-check and the run ends with no reply.
surface: safe
status: fixed
fixedOn: "2026-10-11"
ref: "issue #1773; PRs #1756, #1788"
fixes:
  - pr: 1756
    date: "2026-10-11"
    summary: "Blog-post step 12 now fact-checks reply drafts, closing the gap where bad claims surfaced late."
  - pr: 1788
    date: "2026-10-11"
    summary: "Blog-post replies now ship only if a cold reader calls the finished reply clearly worth reading."
occurrences:
  - session: session_01YSGRZcurrkv9WYqPfnRH2t
    date: "2026-10-10"
    severity: moderate
    description: "The reader judged step-12 replies from scratch drafts whose premises were not verified. Both finalists failed fact-check after about 4 extra subagent rounds, and the run ended with no reply."
    solution: "Before sending reply drafts to the reader, check each draft's one load-bearing claim against its primary source. The Skill exempts reply drafts from full citation-checking, and that let both premises through."
  - session: session_0177ZCpnHq4Sw5wicAEmriDh
    date: "2026-10-11"
    severity: moderate
    description: "Shipped a Karen reply the owner found uninteresting and hard to understand; step 12's reader judged only sketches on novelty and I should have accepted none."
    solution: "Issue 1773 - default step 12 to none, have the reader judge the finished draft for interest and clarity, cut an unverifiable thesis."
