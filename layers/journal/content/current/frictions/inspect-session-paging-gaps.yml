name: inspect-session-paging-gaps
surface: safe
summary: The inspect-session Skill's paging recipe stopped short of the events it was sent for, or lost pages, so reads needed resumes or refetches.
cause: "inspect-session's partial read (page cap, newest-first walk) and full-read fetchers (cursor ranges, spill files) hit the page limit before the target events, mistake a bad server page for a cursor loop, leave an inline page unsaved, or overwrite same-named spill files. Signals: 'hit its page limit', 'never reached the session start', 'cursor loop', 'same tool-results file name', 'inline page unsaved'."
status: open
ref: "Comes from the fixes PR #2304, #2305 and #2307 for list-events-transcript-overflow (a raw transcript read flooding context)."
fixes:
  - pr: 2463
    date: "2026-10-23"
    summary: "inspect-session says the tool-results spill cut-off is likely counted in tokens, so no character count predicts it."
  - pr: 2566
    date: "2026-10-26"
    summary: "inspect-session briefs save every fetched list_events page under Out with a unique name."
  - pr: 2666
    date: "2026-10-29"
    summary: "inspect-session estimates the pages from the session's duration before choosing a read, and a partial read never stops because paging is slow."
occurrences:
  - session: session_01MwrXDH7XwMNUofgz3HvQ5N
    date: "2026-10-19"
    severity: minor
    description: "A Haiku chain link reported a deterministic cursor loop; it was one wrong page from the server, which cost a verification round."
    solution: "The transcript Skill should check each first_id is new and retry once; fetchers should report, not diagnose."
  - session: session_01PWZU3TqUdSp6uD1KaoQXit
    date: "2026-10-23"
    severity: minor
    description: "Two inspect-session partial reads hit their page limit before the session start (about a minute of events per page), needing resumes; 019CbZiW never reached it after 20 pages."
    solution: "inspect-session could estimate pages from get_session duration and say so, or offer a start-first cursor walk for questions about a session's opening."
  - session: session_01VW5yg4NTMt1JBnXCcrhjw9
    date: "2026-10-25"
    severity: minor
    description: "The 10-24 partial read hit its 25-page limit before reaching Agent D's hand-back; it answered from the checker's re-listing"
    solution: "For an audit run, page limit ~40, or search for the reviewer dispatch first"
  - session: session_019nDDDS9GsXdTKWK44j18fT
    date: "2026-10-24"
    severity: nit
    description: "The first inspection subagent left the oldest inline page unsaved, so its coverage never reached the session start (that page held no relevant events)."
    solution: "The inspect-session brief could say that an inline first page must still be written to Out before Flatten runs."
  - session: session_01Ru6jnZ4cFTdf41ZWLonsTv
    date: "2026-10-24"
    severity: nit
    description: "Range-3 fetch agent saw two spilled pages get the same tool-results file name, one overwriting the other, and had to refetch."
    solution: "Fetch brief could say: after each call, copy the spill file into Out under a page-numbered name before the next call."
  - session: session_013zxzeQ8EBq9v7NXqWmAFRF
    date: "2026-10-27"
    severity: minor
    description: "The inspect-session agent for the 97-minute multi-model session stopped after 34 of 184 pages, judging paging too slow, despite page limit 9999; it needed a resume."
    solution: "inspect-session's full-read route (parallel range fetch) fits sessions over about 25 pages; I should have estimated the page count from duration and used it."
