name: findings-retyped-by-hand
summary: >-
  Helper agents could not always hand back their findings directly, so the main agent copied them out by hand.
cause: >-
  Subagents cannot always write their findings where the parent can read them (harness refusals, non-extractable output), so the parent transcribes them by hand.
surface: safe
status: open
ref: "issues #2028, #2011 closed by PR #2060 (merged 2026-10-15T11:42Z: subagents give verdicts in the final reply; audit-docs pools findings from hand-backs); earlier PRs #1699, #1768"
fixes:
  - pr: 1699
    date: "2026-10-09"
    summary: "Documented that audit-docs reviewers write their findings to files, alongside naming the probe tools."
  - pr: 1768
    date: "2026-10-11"
    summary: "Audit-docs reviewers now return their findings in their reply and the lead saves them."
  - pr: 2060
    date: "2026-10-15"
    summary: "Every helper agent is asked for its verdicts in its final reply; audit-docs pools findings from hand-backs."
occurrences:
  - session: session_01GxJXNFxh3SQh8q1nkReAxJ
    date: "2026-10-04"
    severity: moderate
    description: "Three of five second-pass subagent reports were not extractable from their output files, so I retyped 85 per-post labels by hand into a script; a transcription slip would silently mis-tag posts."
    solution: "Have classification subagents write their JSON lines to a scratchpad file (or return them in the final assistant message) so results can be parsed instead of retyped."
  - session: session_017tt8CbwHqFWqw7PJZ7u7AL
    date: "2026-10-08"
    severity: moderate
    description: "Checkers cannot see my context, so I retyped about 12k tokens of reviewer findings into scratchpad pool files before they could be verified."
    solution: "Have reviewers write findings to a scratchpad file themselves (numbered, with exact replacement text) so checkers can read them directly."
  - session: session_01GbMt1vGTDZpQxZ3h4pNsF8
    date: "2026-10-11"
    severity: moderate
    description: "Three of six reviewer subagents could not write their findings file (harness refused), so I transcribed findings into scratchpad files by hand and had to chase C2 a second time."
    solution: "Tell reviewers up front to return findings as text, and let the orchestrator write the files."
  - session: session_01UZ53YdNvwr2RN4WgF5EjEZ
    date: "2026-10-13"
    severity: minor
    description: "Subagent reports arrive as large pasted text with ledger YAML I then had to re-type into a spec file for the impl agent."
    solution: "Ask the survey subagent to write the ledger changes to a scratchpad file the impl agent can Read."
  - session: session_01WUDXJjhrM6uHf9Sjjvw2N9
    date: "2026-10-13"
    severity: minor
    description: "A subagent asked to save its report to a file was stopped mid-write by a safety filter; another was refused writing a summary file"
    solution: "Extract handback text from the agent transcript with a script, as done here"
  - session: session_01G6m9SbDppX4TE87Mp3m5Dk
    date: "2026-10-14"
    severity: minor
    description: "Subagent hand-backs arrive only as a SubagentHandback tool call, so saving each reply verbatim (step 3) needed a JSONL extraction script"
    solution: "audit-docs step 3 could name how to save a hand-back verbatim, or the harness could expose the hand-back text as a file"
  - session: session_011HBcCLzMW7CshmqnHLnegb
    date: "2026-10-15"
    severity: minor
    description: "Subagent reports arrived as messages, not files, so 'save verbatim, never retype' was met only by having agents write their own reply files."
    solution: "audit-docs step 3 could say agents write their reply to a named scratchpad file."
  - session: session_01DNheR1Cpt9b6vFsmGdzvxq
    date: "2026-10-16"
    severity: minor
    description: "Subagents could not write result files, so I retyped three large JSON hand-backs into scratch files to merge them; slow and error-prone."
    solution: "Have a brief ask for the result in a fixed schema and let a script ingest a subagent's final message, or allow subagents scratch writes."
  - session: session_01XxPqcyjVxcgmHTidWtoF1g
    date: "2026-10-16"
    severity: moderate
    description: "audit-docs says pool findings by copying files, but subagents cannot Write report files; two reviewers first claimed files they never wrote."
    solution: "State in audit-docs that reviewers and checkers return findings as text and the pool is built from their replies."
