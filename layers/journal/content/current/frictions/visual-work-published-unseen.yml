name: visual-work-published-unseen
summary: >-
  Diagrams, illustrations and layouts shipped, or nearly did, without the visual check they needed: the Skill's screenshot step, or a human's look before publishing.
cause: >-
  Visual work ships after at most the agent's own screenshot check, or with that check skipped or not yet back, and the human first sees it once published. Signals: 'screenshot step skipped', 'pushed before the screenshot-review agent returned', a self-merged illustration, unreadable at 390px, the owner judging a published visual poor.
surface: safe
status: open
fixes:
  - pr: 1821
    date: "2026-10-12"
    summary: "Added a rule: show a rough draft of diagrams and layouts for reaction before polishing; passing checks is not enough."
  - pr: 2107
    date: "2026-10-16"
    summary: "The read-first hint now points to verifying-ui-changes.md when a session takes a screenshot."
  - pr: 2563
    date: "2026-10-26"
    summary: "Glass Box pages are screenshotted only when layout, a feature or a diagram changed; glassbox-update points to EVERY-PAGE.md's Check."
occurrences:
  - session: session_013zxzeSjNrJGoGzDkoSzhK9
    date: "2026-11-05"
    severity: minor
    description: "Took no screenshot of the rendered page; the UI was checked only through the e2e test and counts from SSR HTML."
    solution: "Run scripts/ui/preview.ts shot on the built page before the PR."
  - session: session_013zxzeSU9KQDVW6b2DUYQt4
    date: "2026-11-12"
    severity: nit
    description: "Agreed no UI sample and took no screenshot, against the ui-verification rule; the change only alters a link target, verified by DOM click."
    solution: "For a link-only change, say so in the PR; otherwise show a sample first."
  - session: session_013zxzeS57UamaBVVLjwvKFq
    date: "2026-11-12"
    severity: minor
    description: "Did not render or screenshot the homepage change, nor get owner confirmation, despite the ui-verification rule."
    solution: "Run scripts/ui/preview.ts shot on the home page and show it before calling it done."
