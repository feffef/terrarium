name: visual-work-published-unseen
summary: >-
  Diagrams and layouts went live before a human looked at them, and the human found them poor.
cause: >-
  Diagrams, illustrations and layouts ship after the agent's own screenshot check; the human first sees the result after it is published and judges it poor.
surface: safe
status: open
ref: "the 2026-10-16 run also added a read-first-hint entry for screenshots"
fixes:
  - pr: 1821
    date: "2026-10-12"
    summary: "Added a rule: show a rough draft of diagrams and layouts for reaction before polishing; passing checks is not enough."
  - pr: 2107
    date: "2026-10-16"
    summary: "The read-first hint now points to verifying-ui-changes.md when a session takes a screenshot."
occurrences:
  - session: 1f97b613-f529-4487-a7e9-1115a44b84c7
    date: "2026-10-08"
    severity: major
    description: "Three review rounds optimised the two briefs locally (terms, tables, completeness) but never questioned their framing. The diagrams built from them missed the most basic fact (everything lives in one repo and becomes a database at build time) and over-weighted build internals; only the maintainer's verdict on the rendered diagrams exposed it"
    solution: "For overview docs, start by grilling the maintainer on the framing (zones, audience, what one picture must show) before any review rounds polish the details"
  - session: 355d2d64-55fc-4515-81c1-e831f8b84601
    date: "2026-10-08"
    severity: major
    description: "User judged both published diagrams not to work well; I published after one self-check each and never showed a draft or layout sketch before building"
    solution: "For a diagram from a brief, share a rough layout or a first draft for a quick reaction before polishing and publishing; record the user's reasons in the briefs"
  - session: 49f1fea0-270e-4851-9cc7-3dbf8cc8609a
    date: "2026-10-08"
    severity: major
    description: "User judged both delivered diagrams not to work well for several reasons, despite every Archify gate passing and my own screenshot review; reasons not yet stated."
    solution: "Before rendering, agree with the user on the reader, the one question each diagram answers, and the scope per view; treat passing gates as necessary, not sufficient."
  - session: session_01E2zbWEQmuUrEhWvbzNpBba
    date: "2026-10-15"
    severity: moderate
    description: "First diagram version was committed unreadable at 390px and factually wrong about one shared database; I checked only a 1000px screenshot and skipped docs/agents/verifying-ui-changes.md before screenshotting."
    solution: "Read verifying-ui-changes.md and EVERY-PAGE.md's diagram bar before drawing, and screenshot at 390px."
  - session: session_013LwpcexAe7t3Qck4CKtj9Y
    date: "2026-10-15"
    severity: minor
    description: "My first feature, a landing diagram, was dropped late because owner decisions in old issues rejected it, and I rewrote the flowchart twice for the 390px width."
    solution: "Have visitor-loop step 3 grep the design resolutions on the focus Tenant before choosing a feature."
  - session: session_01CtktRkpbF4wQ3TTQVYUqLz
    date: "2026-10-17"
    severity: minor
    description: "I pushed and opened the PR before the screenshot-review agent returned, so the PR's screenshot line claims shots taken, not reviewed"
    solution: "Wait for the shot review before pushing, or start it right after the build, in parallel with gate:scoped earlier"
  - session: session_01G2d5G6TrdoTQYQr7S2Eu7o
    date: "2026-10-22"
    severity: nit
    description: "Screenshot step skipped for the changed session-logs page, a deviation from the Skill's Check step."
    solution: "Skill could say when a one-sentence wording edit needs no shot."
