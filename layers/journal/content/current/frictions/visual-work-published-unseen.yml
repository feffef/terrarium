name: visual-work-published-unseen
summary: >-
  Diagrams, illustrations and layouts shipped, or nearly did, without the visual check they needed: the Skill's screenshot step, or a human's look before publishing.
cause: >-
  Visual work ships after at most the agent's own screenshot check, or with that check skipped or not yet back, and the human first sees it once published. Signals: 'screenshot step skipped', 'pushed before the screenshot-review agent returned', a self-merged illustration, unreadable at 390px, the owner judging a published visual poor.
surface: safe
status: open
fixes:
  - pr: 1821
    date: "2026-10-12"
    summary: "Added a rule: show a rough draft of diagrams and layouts for reaction before polishing; passing checks is not enough."
  - pr: 2107
    date: "2026-10-16"
    summary: "The read-first hint now points to verifying-ui-changes.md when a session takes a screenshot."
  - pr: 2563
    date: "2026-10-26"
    summary: "Glass Box pages are screenshotted only when layout, a feature or a diagram changed; glassbox-update points to EVERY-PAGE.md's Check."
occurrences:
  - session: session_01CtktRkpbF4wQ3TTQVYUqLz
    date: "2026-10-17"
    severity: minor
    description: "I pushed and opened the PR before the screenshot-review agent returned, so the PR's screenshot line claims shots taken, not reviewed"
    solution: "Wait for the shot review before pushing, or start it right after the build, in parallel with gate:scoped earlier"
  - session: session_01G2d5G6TrdoTQYQr7S2Eu7o
    date: "2026-10-22"
    severity: nit
    description: "Screenshot step skipped for the changed session-logs page, a deviation from the Skill's Check step."
    solution: "Skill could say when a one-sentence wording edit needs no shot."
  - session: session_01PGQQj6iUaMYCkphVjFEsBP
    date: "2026-10-25"
    severity: minor
    description: "Skipped Skill step 5 (build and preview screenshots for pages whose teaching changed) to save time; the PR says so, but the visual check was not done."
    solution: "Either shoot the few changed-teaching pages or make the Skill say screenshots are optional for drafts."
  - session: session_013zxzePY9L4aufht9ct94ec
    date: "2026-10-27"
    severity: minor
    description: "I told the user I would self-merge once green before checking verifying-ui-changes, which requires a human's eye on an illustration from a brief; caught it before merging."
    solution: "The ui-verification rule summary could state the human-eye requirement for illustrations, not only point to the doc."
