  The backlog Skill's sweep left out issues whose fix changes a guard or hook wiring, though the owner wanted them handled.
cause: >-
  clear-backlog section 1 left out issues whose fix changes a guard or hook wiring by default, though a human merge already controls those files. Signals: the owner asks to include a hook-wiring issue, a run asking whether to include one. Wayfinder issues belong in clear-backlog-sweep-took-wayfinder.
