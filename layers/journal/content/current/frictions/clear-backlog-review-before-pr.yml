name: clear-backlog-review-before-pr
summary: >-
  The backlog Skill let the orchestrator build and open PRs before a full review, so unreviewed PRs reached the owner.
cause: >-
  The first clear-backlog Skill had a few-line inline-review exception, no rule that review comes before the PR opens, and optional dispatching, so the orchestrator built changes itself and opened PRs before code-review ran. Signals: a PR opened before code-review, the orchestrator committing builds in its own checkout.
surface: safe
