name: list-events-transcript-overflow
summary: >-
  Reading another session's transcript with list_events floods or stalls the agent when that session holds many screenshots.
cause: >-
  The claude-code-remote list_events tool returns every event including base64 images, so a screenshot-heavy session is about 14 MB per page and paging it is slow; github-integration.md calls it token-heavy but gives no safe recipe. Signals: list_events, get_session, 'MB per page', a subagent skipping a long transcript.
surface: safe
status: tracked
ref: "issue #2557"
fixes:
  - pr: 2235
    date: "2026-10-18"
    summary: "The transcript section of github-integration.md now says to read the log first, save list_events pages and drop image blocks, and budget subagents."
  - pr: 2304
    date: "2026-10-19"
    summary: "Added the inspect-session Skill with flatten and search scripts for reading another session's events without loading them."
  - pr: 2305
    date: "2026-10-19"
    summary: "Added a full-read recipe: parallel Haiku fetchers over cursor ranges, merged by flatten."
  - pr: 2307
    date: "2026-10-19"
    summary: "inspect-session takes bare page names, does a partial read for short sessions and has a replies selector."
  - pr: 2463
    date: "2026-10-23"
    summary: "inspect-session says the tool-results spill cut-off is likely counted in tokens, so no character count predicts it."
occurrences:
  - session: session_01GVmwHZQthucdGcVwe3HAUL
    date: "2026-10-17"
    severity: moderate
    description: "list_events on a screenshot-heavy session returned 14MB per page (base64 images), forcing file dumps and a custom parser"
    solution: "list_events could offer a flag to strip image content from tool results"
  - session: session_018pjaBqTXahmE3DFhAbkide
    date: "2026-10-16"
    severity: nit
    description: "One session-reading subagent skipped a 3.6 h transcript because paging list_events was too slow, so one occurrence came from its log only."
    solution: "list_events with kinds filtering still pages the whole transcript; a search-by-tool filter would help for long sessions."
  - session: session_01GfmoxeLwrvC7CARuaBAXfB
    date: "2026-10-18"
    severity: nit
    description: "A subagent could not reach the screenshot phase of the stuck session through list_events, so image handling as the cause stayed unconfirmed after a full run."
    solution: "The transcript recipe could say pages span only minutes and to expect the log, not the transcript, to hold late phases."
  - session: session_01Bopw6N86uYzPzfaRpVqzhU
    date: "2026-10-19"
    severity: minor
    description: "Transcript-reading subagent printed whole list_events pages inline despite instructions to save them (the tool returns pages into context), costing ~390k subagent tokens and still not reaching the survey's commands."
    solution: "Document in github-integration.md that list_events cannot be redirected; tell briefs to use kinds [assistant] from the start and cap pages."
  - session: session_01Pc15CVrLGyHXgoygsRHLbB
    date: "2026-10-19"
    severity: minor
    description: "An ad-hoc python analysis of saved list_events pages printed a whole hand-back body, about 20k characters, into the main context"
    solution: "Truncate every printed field from the first run; the new Flatten plus grep -oE now does this by default"
  - session: session_01MwrXDH7XwMNUofgz3HvQ5N
    date: "2026-10-19"
    severity: minor
    description: "A Haiku chain link reported a deterministic cursor loop; it was one wrong page from the server, which cost a verification round."
    solution: "The transcript Skill should check each first_id is new and retry once; fetchers should report, not diagnose."
  - session: session_01PWZU3TqUdSp6uD1KaoQXit
    date: "2026-10-23"
    severity: minor
    description: "Two inspect-session partial reads hit their page limit before the session start (about a minute of events per page), needing resumes; 019CbZiW never reached it after 20 pages."
    solution: "inspect-session could estimate pages from get_session duration and say so, or offer a start-first cursor walk for questions about a session's opening."
  - session: session_01VW5yg4NTMt1JBnXCcrhjw9
    date: "2026-10-25"
    severity: minor
    description: "The 10-24 partial read hit its 25-page limit before reaching Agent D's hand-back; it answered from the checker's re-listing"
    solution: "For an audit run, page limit ~40, or search for the reviewer dispatch first"
  - session: session_019nDDDS9GsXdTKWK44j18fT
    date: "2026-10-24"
    severity: nit
    description: "The first inspection subagent left the oldest inline page unsaved, so its coverage never reached the session start (that page held no relevant events)."
    solution: "The inspect-session brief could say that an inline first page must still be written to Out before Flatten runs."
  - session: session_01Ru6jnZ4cFTdf41ZWLonsTv
    date: "2026-10-24"
    severity: nit
    description: "Range-3 fetch agent saw two spilled pages get the same tool-results file name, one overwriting the other, and had to refetch."
    solution: "Fetch brief could say: after each call, copy the spill file into Out under a page-numbered name before the next call."
