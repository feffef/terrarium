name: list-events-transcript-overflow
summary: >-
  Reading another session's transcript with list_events floods or stalls the agent when that session holds many screenshots.
cause: >-
  The claude-code-remote list_events tool returns every event including base64 images (about 14 MB per page for a screenshot-heavy session) into context, so reading another session's transcript raw, or printing saved pages or fields unbounded, floods context or is too slow to page; github-integration.md and the inspect-session Skill hold the recipe. Gaps in that recipe belong in inspect-session-paging-gaps. Signals: list_events, get_session, 'MB per page', pages printed inline, a subagent skipping a long transcript.
surface: safe
status: open
fixes:
  - pr: 2235
    date: "2026-10-18"
    summary: "The transcript section of github-integration.md now says to read the log first, save list_events pages and drop image blocks, and budget subagents."
  - pr: 2304
    date: "2026-10-19"
    summary: "Added the inspect-session Skill with flatten and search scripts for reading another session's events without loading them."
  - pr: 2305
    date: "2026-10-19"
    summary: "Added a full-read recipe: parallel Haiku fetchers over cursor ranges, merged by flatten."
  - pr: 2307
    date: "2026-10-19"
    summary: "inspect-session takes bare page names, does a partial read for short sessions and has a replies selector."
occurrences:
  - session: session_01GVmwHZQthucdGcVwe3HAUL
    date: "2026-10-17"
    severity: moderate
    description: "list_events on a screenshot-heavy session returned 14MB per page (base64 images), forcing file dumps and a custom parser"
    solution: "list_events could offer a flag to strip image content from tool results"
  - session: session_01GfmoxeLwrvC7CARuaBAXfB
    date: "2026-10-18"
    severity: nit
    description: "A subagent could not reach the screenshot phase of the stuck session through list_events, so image handling as the cause stayed unconfirmed after a full run."
    solution: "The transcript recipe could say pages span only minutes and to expect the log, not the transcript, to hold late phases."
  - session: session_01Bopw6N86uYzPzfaRpVqzhU
    date: "2026-10-19"
    severity: minor
    description: "Transcript-reading subagent printed whole list_events pages inline despite instructions to save them (the tool returns pages into context), costing ~390k subagent tokens and still not reaching the survey's commands."
    solution: "Document in github-integration.md that list_events cannot be redirected; tell briefs to use kinds [assistant] from the start and cap pages."
  - session: session_01Pc15CVrLGyHXgoygsRHLbB
    date: "2026-10-19"
    severity: minor
    description: "An ad-hoc python analysis of saved list_events pages printed a whole hand-back body, about 20k characters, into the main context"
    solution: "Truncate every printed field from the first run; the new Flatten plus grep -oE now does this by default"
