name: frictions-to-fixes-skill-gaps
summary: "The frictions-to-fixes SKILL.md leaves recurring situations unspecified, so the run asks the owner or improvises."
cause: "SKILL.md (not the survey or design briefs or the scripts) leaves some recurring situations unspecified: what a skipped cluster needs recorded, how a ledger ref names a PR that does not exist yet, or that the owner's start approves the run's picks; the user is asked or the run improvises. Regression counting, an existing open issue and severity ranking are specified now (#2149, #2197, #2548, #2970). PR #2735 (2026-10-31) moved a not-planned close to accepted and made since count in-horizon occurrences. Brief defects belong to frictions-to-fixes-briefs-mismatch, --summary date counting to ledger-summary-same-day-counting, repeated sessions to survey-appends-duplicate-sessions. Signals: 'the Skill says ... but not what to do', 'had to ask the user how many'."
surface: safe
status: open
fixes:
  - pr: 2149
    date: "2026-10-16"
    summary: "Capped regression issues at three per run (the Skill asked for one per regression)."
  - pr: 2197
    date: "2026-10-17"
    summary: "The Skill says a regression that already has an open issue needs none and does not count toward the three."
  - pr: 2345
    date: "2026-10-20"
    summary: "Added a no-change outcome to the design step and a notes field in the ledger, so a run that finds nothing worth fixing has an outcome."
  - pr: 2548
    date: "2026-10-25"
    summary: "SKILL.md §2 ranks regressions in one sentence: only still-recurring entries not accepted, on-trial or tracked, by highest severity since the latest fix."
  - pr: 2735
    date: "2026-10-31"
    summary: "describeEntry counts since from in-horizon occurrences only; survey-brief section 5 sends an issue closed not planned to accepted."
  - pr: 2970
    date: "2026-11-08"
    summary: "SKILL.md §2 files regression issues only for still-recurring entries at moderate or worse (top three of those); the ledger PR gets the simple-change review."
occurrences:
  - session: session_013zxzeSiq7TZmfmF5D5Rbwt
    date: "2026-10-31"
    severity: minor
    description: "Skill's top-three regression rule ranks by severity, which put owner-decided or superseded entries first; I skipped them by judgement, as four earlier runs did."
    solution: "Fix the rule in SKILL.md §2 (filed as #2724): skip owner-closed-not-planned entries and those with no occurrence in the horizon, tie-break by recurrence."
  - session: session_013zxzeQqRBLg9tUfsbNCCz8
    date: "2026-11-02"
    severity: minor
    description: "The third regression issue had no good candidate: the remaining moderate regressions were owner-decided or superseded, yet the Skill says to file the top three anyway."
    solution: "Let the Skill skip a regression whose use case was removed or whose half the owner chose to keep."
  - session: session_013zxzeSrSkYPpnoS2ag6EbC
    date: "2026-11-03"
    severity: minor
    description: "The Skill ranks regressions by highest severity since the fix but gives no tie-break; four were moderate with one occurrence each, and I picked the third by horizon count."
    solution: "Say how to break ties, or allow fewer than three when the remaining candidates are superseded or server faults."
  - session: session_013zxzeNezKVRxRiZLs4z9n4
    date: "2026-11-04"
    severity: nit
    description: "The skill's regression rule files an issue for minor and nit recurrences too; I filed three issues for sub-moderate regressions where earlier fixes had mostly dropped designs."
    solution: "Rank regressions by cost since the fix, not only by severity, so repeat nits do not take the three slots."
  - session: session_013zxzeQDfNNTXpQYQtt9saY
    date: "2026-11-06"
    severity: nit
    description: "The Skill's closing PR reuses the session branch, but the first ledger PR had merged; the force-push I tried was denied, so I restarted the branch from main and pushed plainly."
    solution: "Say in frictions-to-fixes section 8 to restart the merged branch from origin/main and push without force."
  - session: session_013zxzeSRr9pF9MCBQDGAN5L
    date: "2026-11-07"
    severity: minor
    description: "Skill section 5 step 4 says review the diff yourself, while pr-workflow.md says a Skill meaning change needs code-review; two review subagents were spent on a 5-line prose edit."
    solution: "Let the frictions-to-fixes Skill name which rule wins for a dispatched fix of a few lines."
  - session: session_013zxzeS3L4tvAUKm5q3d9qD
    date: "2026-11-08"
    severity: minor
    description: "The Skill says to file regression issues for the top three by severity, but almost all 42 still-recurring entries are minor or nit and several were owner-accepted, so the third pick was a judgement call."
    solution: "Restrict regression issues to moderate and above, as issue #2960 proposes."
  - session: session_013zxzeRSjTLQV8K5UzQtX95
    date: "2026-11-08"
    severity: minor
    description: "SKILL.md §5 step 4 says to review the ledger PR by the simple-change test, but the ledger diff (25 files, 238 lines) fails that test, so I ran code-review with two subagents."
    solution: "Say in §5 that a ledger PR is exempt from code-review, or that it is reviewed by the ledger content test and gate only."
  - session: session_013zxzeNjRy7tpoybG6YTUM6
    date: "2026-11-09"
    severity: nit
    description: "Skill §2 says top-three regression issues 'since the latest fix', but subagent-brief-defects' own note calls its occurrences separate strays; I filed anyway, as the rule says."
    solution: "Let the Skill skip a cluster whose newest note says its occurrences need separate fixes."
  - session: session_013zxzeP3xBUNvHd5kGFihuo
    date: "2026-11-12"
    severity: minor
    description: "Survey-brief says a tracked entry must point at something open, but SKILL §5 says a dispatched fix gets no ref until §8; the Standards reviewer flagged the empty ref."
    solution: "Say in survey-brief §2 that an entry tracked for a dispatched fix has no ref until the closing PR."
  - session: session_013zxzeNdAgdKF5tpWTQLowx
    date: "2026-11-13"
    severity: minor
    description: "SKILL section 2's top-three regression rule picked harness-proxy-blocks, whose regression issue for the same fix closed the day before with nothing moderate since; the Skill gives no rule, so I skipped it by judgement."
    solution: "Count severity since the latest closed regression issue, not only since the latest fix. SKILL.md is in an open Prune Trial, so not changed."
