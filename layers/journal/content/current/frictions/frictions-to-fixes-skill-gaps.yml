name: frictions-to-fixes-skill-gaps
summary: "The frictions-to-fixes SKILL.md leaves recurring situations unspecified, so the run asks the owner or improvises."
cause: "SKILL.md (not the survey or design briefs or the scripts) does not say how many regressions get issues, what to do when one already has an open issue, how to rank by severity, that a skipped cluster needs a recorded reason, how a ledger ref names a PR that does not exist yet, or that the owner's start approves the run's picks; the user is asked or the run improvises. Brief defects belong to frictions-to-fixes-briefs-mismatch, --summary date counting to ledger-summary-same-day-counting, repeated sessions to survey-appends-duplicate-sessions. Signals: \"the Skill says ... but not what to do\", \"had to ask the user how many\"."
surface: safe
status: open
ref: ""
fixes:
  - pr: 2149
    date: "2026-10-16"
    summary: "Capped regression issues at three per run (the Skill asked for one per regression)."
  - pr: 2197
    date: "2026-10-17"
    summary: "The Skill says a regression that already has an open issue needs none and does not count toward the three."
  - pr: 2345
    date: "2026-10-20"
    summary: "Added a no-change outcome to the design step and a notes field in the ledger, so a run that finds nothing worth fixing has an outcome."
  - pr: 2548
    date: "2026-10-25"
    summary: "SKILL.md §2 ranks regressions in one sentence: only still-recurring entries not accepted, on-trial or tracked, by highest severity since the latest fix."
occurrences:
  - session: session_01Mf4dUxuWB7WtkC5fVzByH6
    date: "2026-10-16"
    severity: minor
    description: "The Skill says every regression gets an issue; 13 clusters regressed, so I had to ask the user how many to file."
    solution: "Cap regression issues per run (now PR 2149)."
  - session: session_018sAirSgDY1Nv82JVogjcyR
    date: "2026-10-16"
    severity: minor
    description: "The Skill says the top three regressions get distinct issues but not what to do when each already has an open issue from an earlier run; I judged it covered and filed none."
    solution: "State in section 2 that a regression with an open issue needs none."
  - session: session_01XUuxhnMc7t2zXaH9ebtxKZ
    date: "2026-10-16"
    severity: nit
    description: "Ledger refs for the three tracked entries could not name this run's PR, because it did not exist when the ledger was edited."
    solution: "Let a ledger ref hold a branch name now, and have the next run record the PR number in fixes, as the Skill already says."
  - session: session_018pjaBqTXahmE3DFhAbkide
    date: "2026-10-16"
    severity: minor
    description: "frictions-to-fixes runs left an 11-occurrence cluster open with no recorded reason, so the owner had to ask why."
    solution: "Have the ledger PR description name each high-occurrence open cluster it skipped and why."
  - session: session_014tr6vJyNXmekdFQtYrEVWT
    date: "2026-10-21"
    severity: nit
    description: "Section 2 says to file the top three regressions by severity, count and proof together, but gives no rule for severity before versus after the fix, so my pick of the third was a judgement call."
    solution: "Say to rank by the highest severity since the latest fix PR, as the summary shows it."
  - session: session_01WU8rXHT5rKQKDYbYqCv7Sd
    date: "2026-10-21"
    severity: nit
    description: "Ran the Skill with its autonomous decisions and built without the grilling the owner's preference for questions-first suggests; no question was asked."
    solution: "Say in the Skill that the owner's start is the approval for picks, so no question is expected."
  - session: session_01CfTFFQrkwq1eUsDy61AJzz
    date: "2026-10-23"
    severity: nit
    description: "SKILL.md §2 ranks regressions to file by severity, count and recurrence together without saying whether entries already tracked by an open issue or on trial count; I chose by judgement."
    solution: "State that regressions with an open issue, a trial or an owner decision are skipped before ranking."
  - session: session_01E3XmTJcpKMZstW7MHL2eks
    date: "2026-10-23"
    severity: minor
    description: "Re-clustering reached misread-owner-instruction's 'revisit on a fourth' threshold with no new occurrence, and gave worktree-guard-blocks-compound-bash PR #1825 as a fix though #1825 introduced the guard, so it reads as a regression."
    solution: "When a re-cluster moves fix PRs or occurrences, add a dated note on each entry whose counts or fix state changed without new evidence."
  - session: session_015rVYXi9nGNG7zeGoi2R9ha
    date: "2026-10-24"
    severity: minor
    description: "The skill says to open three regression issues by severity, but the two highest-severity candidates (major, moderate) were not real regressions and needed checking against ledger dates by hand."
    solution: "Have the survey report mark whether the recurrence post-dates the issue's closure."
  - session: session_01S9UeKa9mCWdPVBjAezCSaL
    date: "2026-10-25"
    severity: nit
    description: "SKILL.md §2 says top three regressions by severity and count but not to skip trial, accepted, tracked or owner-closed ones first; I chose by judgement."
    solution: "State the skip rule in section 2 (filed as issue 2545)."
  - session: session_013zxzeRNBrVkwWy4fcM4Pxa
    date: "2026-10-27"
    severity: minor
    description: "The Skill has no tie-break for the top-three regression issues when many entries share minor severity since the fix; I chose by recurrence myself."
    solution: "Say in frictions-to-fixes §2 to break ties by occurrences since the fix."
  - session: session_019jfJv6yLmcLUAJiTTomyeu
    date: "2026-10-25"
    severity: nit
    description: "Skill says to Read design-brief and impl-brief verbatim into each subagent prompt, yet passing the brief file path worked and was cheaper; the 'verbatim' wording is ambiguous."
    solution: "State in the Skill whether handing the brief by path satisfies 'verbatim'."
  - session: session_013zxzeQvE9RNYoZRiZEEKBG
    date: "2026-10-28"
    severity: minor
    description: "Skill says file regression issues for the top three by severity, but the top two were an owner-decided entry and a stale-session false alarm; I had to deviate and pick by recurrence."
    solution: "Say in §2 to skip entries whose issue the owner closed not planned or whose fix is recorded as holding, and how to break minor-severity ties."
  - session: session_013zxzeQmVnqMqDkRgFRWx5T
    date: "2026-10-28"
    severity: minor
    description: "The Skill's top-three regression rule picked two phantom regressions (occurrences dated before their own closing verdicts) and a family already covered by open #2472; I deviated and took the next eligible entries."
    solution: "Have the survey exclude entries whose post-fix occurrences predate the closing issue, or whose family has an open regression issue, before ranking."
  - session: session_013zxzeRnPtjPsVQM71SzX63
    date: "2026-10-29"
    severity: minor
    description: "The Skill's top-three regression rule ranks by severity, which picked two phantom regressions (an owner-declined case and a stale-session false alarm); I skipped them by judgement."
    solution: "Have the survey exclude regressions whose ref says closed not planned or false alarm before ranking the top three."
  - session: session_013zxzePnfDGz3F3p9spej9f
    date: "2026-10-30"
    severity: minor
    description: "frictions-to-fixes step 2 ranks regressions by highest severity since the fix, which put local-gate-green-ci-red first although the owner closed that issue not planned; the Skill has no rule for it."
    solution: "Skip an entry whose ref records an owner decision not to fix, and list it in the PR description."
