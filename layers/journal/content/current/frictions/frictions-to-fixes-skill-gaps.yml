name: frictions-to-fixes-skill-gaps
summary: "The frictions-to-fixes SKILL.md leaves recurring situations unspecified, so the run asks the owner or improvises."
cause: "SKILL.md (not the survey or design briefs or the scripts) leaves some recurring situations unspecified: what a skipped cluster needs recorded, how a ledger ref names a PR that does not exist yet, or that the owner's start approves the run's picks; the user is asked or the run improvises. Regression counting, an existing open issue and severity ranking are specified now (#2149, #2197, #2548, #2970). PR #2735 (2026-10-31) moved a not-planned close to accepted and made since count in-horizon occurrences. Signals: 'the Skill says ... but not what to do', 'had to ask the user how many'."
surface: safe
status: accepted
acceptedSeverity: minor
related:
  - entry: frictions-to-fixes-briefs-mismatch
    rule: The defect is in survey-brief.md or design-brief.md.
notes: |-
  2026-11-17 design: no change: 5 of the 8 since #2970 are the 5.4 simple-change test gap, tracked by #3397; the other 3 are one-offs.
  2026-11-18 issue #3397 (5.4 simple-change test cannot pass for script-written ledger diffs) closed not planned by the owner on 2026-11-17; accepted at minor, not re-proposed.
fixes:
  - pr: 2149
    date: "2026-10-16"
    summary: "Capped regression issues at three per run (the Skill asked for one per regression)."
  - pr: 2197
    date: "2026-10-17"
    summary: "The Skill says a regression that already has an open issue needs none and does not count toward the three."
  - pr: 2345
    date: "2026-10-20"
    summary: "Added a no-change outcome to the design step and a notes field in the ledger, so a run that finds nothing worth fixing has an outcome."
  - pr: 2548
    date: "2026-10-25"
    summary: "SKILL.md §2 ranks regressions in one sentence: only still-recurring entries not accepted, on-trial or tracked, by highest severity since the latest fix."
  - pr: 2735
    date: "2026-10-31"
    summary: "describeEntry counts since from in-horizon occurrences only; survey-brief section 5 sends an issue closed not planned to accepted."
  - pr: 2970
    date: "2026-11-08"
    summary: "SKILL.md §2 files regression issues only for still-recurring entries at moderate or worse (top three of those); the ledger PR gets the simple-change review."
occurrences:
