name: frictions-to-fixes-skill-gaps
summary: "The frictions-to-fixes Skill leaves recurring situations unspecified, so the run asks the owner or improvises."
cause: "SKILL.md does not say what to do when each top regression already has an open issue, that the ledger PR may open before design, or how a ledger ref names a PR that does not exist yet; the user is asked or the run improvises. Signals: \"the Skill says ... but not what to do\", \"had to ask the user how many\"."
surface: safe
status: open
fixes:
  - pr: 2149
    date: "2026-10-16"
    summary: "Capped regression issues at three per run (the Skill asked for one per regression)."
  - pr: 2197
    date: "2026-10-17"
    summary: "The Skill says a regression that already has an open issue needs none and does not count toward the three."
  - pr: 2213
    date: "2026-10-17"
    summary: "The survey brief says --unledgered drops each carried friction verbatim, so a session already in the target cluster must be skipped by hand."
occurrences:
  - session: session_01Mf4dUxuWB7WtkC5fVzByH6
    date: "2026-10-16"
    severity: minor
    description: "The Skill says every regression gets an issue; 13 clusters regressed, so I had to ask the user how many to file."
    solution: "Cap regression issues per run (now PR 2149)."
  - session: session_018sAirSgDY1Nv82JVogjcyR
    date: "2026-10-16"
    severity: minor
    description: "The Skill says the top three regressions get distinct issues but not what to do when each already has an open issue from an earlier run; I judged it covered and filed none."
    solution: "State in section 2 that a regression with an open issue needs none."
  - session: session_01XUuxhnMc7t2zXaH9ebtxKZ
    date: "2026-10-16"
    severity: nit
    description: "Ledger refs for the three tracked entries could not name this run's PR, because it did not exist when the ledger was edited."
    solution: "Let a ledger ref hold a branch name now, and have the next run record the PR number in fixes, as the Skill already says."
  - session: session_018pjaBqTXahmE3DFhAbkide
    date: "2026-10-16"
    severity: minor
    description: "frictions-to-fixes runs left an 11-occurrence cluster open with no recorded reason, so the owner had to ask why."
    solution: "Have the ledger PR description name each high-occurrence open cluster it skipped and why."
  - session: session_01J4ze3DvsZhXeP78iyRnbSd
    date: "2026-10-17"
    severity: minor
    description: "Survey brief says --unledgered drops carried frictions, yet 7 blocks for sessions already in a cluster reappeared and only surfaced at validate time (survey agent's friction)."
    solution: "Have the brief say to skip a session already present in the target cluster, or filter by session in the script."
  - session: session_01Sc82qSCs4NVP3igf9SaGXM
    date: "2026-10-17"
    severity: minor
    description: "The survey subagent reported that the brief gives no cheap way to find merged PRs missing from the ledger and no helper to append occurrences, so it did both by hand."
    solution: "Add a script that lists merged PRs absent from every ledger fixes entry, and one that appends print-ledger-occurrence output."
  - session: session_0135hcUf12mVM8dEZfDRAkUb
    date: "2026-10-18"
    severity: minor
    description: "design-brief.md opens with a dangling fragment after {PICKS} and its session-log glob matches nothing; the design agent lost rounds on both."
    solution: "Rewrite the brief's first lines and give the real glob (*session_<id>*.yml)."
  - session: session_01Wv24DMMmjdNR6a23HtkZ8i
    date: "2026-10-19"
    severity: minor
    description: "survey-brief says to append every friction but --unledgered drops sessions, and --summary counts regressions by date, so same-day post-fix sessions were missed and needed hand checking."
    solution: "Count regressions by session start in --summary; name a per-cluster dedupe step in the brief."
