name: frictions-to-fixes-skill-gaps
summary: "The frictions-to-fixes SKILL.md leaves recurring situations unspecified, so the run asks the owner or improvises."
cause: "SKILL.md (not the survey or design briefs or the scripts) does not say how many regressions get issues, what to do when one already has an open issue, how to rank by severity (the top-three rule puts owner-decided or superseded entries first, so runs skip them by judgement), that a skipped cluster needs a recorded reason, how a ledger ref names a PR that does not exist yet, or that the owner's start approves the run's picks; the user is asked or the run improvises. PR #2735 (2026-10-31) moved a not-planned close to accepted and made since count in-horizon occurrences. Brief defects belong to frictions-to-fixes-briefs-mismatch, --summary date counting to ledger-summary-same-day-counting, repeated sessions to survey-appends-duplicate-sessions. Signals: 'the Skill says ... but not what to do', 'had to ask the user how many'."
surface: safe
status: open
fixes:
  - pr: 2149
    date: "2026-10-16"
    summary: "Capped regression issues at three per run (the Skill asked for one per regression)."
  - pr: 2197
    date: "2026-10-17"
    summary: "The Skill says a regression that already has an open issue needs none and does not count toward the three."
  - pr: 2345
    date: "2026-10-20"
    summary: "Added a no-change outcome to the design step and a notes field in the ledger, so a run that finds nothing worth fixing has an outcome."
  - pr: 2548
    date: "2026-10-25"
    summary: "SKILL.md §2 ranks regressions in one sentence: only still-recurring entries not accepted, on-trial or tracked, by highest severity since the latest fix."
  - pr: 2735
    date: "2026-10-31"
    summary: "describeEntry counts since from in-horizon occurrences only; survey-brief section 5 sends an issue closed not planned to accepted."
