    date: "2026-10-10"
    severity: minor
    description: "Posted a PR verdict comment with approximate verdict counts (about 33 confirmed) without tallying, breaking verify-before-you-state; needed a correcting comment."
    solution: "Tally from the verdict files before writing any count."
