name: counts-not-tallied
summary: >-
  Agents stated counts in PR bodies, issues, chat, briefs and notifications without counting, and had to correct them.
cause: >-
  A number (verdict counts, line totals, items in a list, running agents) is written from an estimate, memory or a report not yet final, in a GitHub body, a chat reply, a subagent brief or a notification, instead of being tallied from every item. Signals: "about N", a corrected count, "without counting", "without tallying", "from memory". Counts a script or filter got wrong are in counts-from-wrong-filter.
surface: safe
status: accepted
ref: "Issue #2659 closed not planned on 2026-10-29: the owner accepts the cost. 4 minor or nit recurrences since 2026-10-25, each self-caught. Prune Trial opened 2026-10-25 by PR #2537 was judged and deleted by the 2026-10-28 prune run (PR #2641): no major or blocker Friction in 48 sessions. Issue #2522 closed by PR #2537."
fixes:
  - pr: 2336
    date: "2026-10-20"
    summary: "CLAUDE.md \"Verify before you state\" now names subagent reports, script behaviour from recall, \"only\"/\"every\"/\"nothing\" claims and one-test causes; \"One home per fact\" says to grep for other statements when changing one."
  - pr: 2378
    date: "2026-10-21"
    summary: "Restored the shorter \"Verify before you state\" bullet in CLAUDE.md, and the Standards reviewer in clear-backlog-build now flags a count or subagent claim that cites no source."
  - pr: 2483
    date: "2026-10-24"
    summary: "Made prune-trial take the line delta from git diff --numstat against the cut's parent, and corrected the pr-workflow.md trial's delta to -2."
  - pr: 2537
    date: "2026-10-25"
    summary: "Cut the Verify-before-you-state family to one plain home in CLAUDE.md and dropped its restatements in four Skills and the build reviewer."
occurrences:
