name: counts-not-tallied
summary: >-
  Agents stated counts in PR bodies, issues, chat, briefs and notifications without counting, and had to correct them.
cause: >-
  A number (verdict counts, line totals, items in a list, running agents) is written from an estimate, memory or a report not yet final, in a GitHub body, a chat reply, a subagent brief or a notification, instead of being tallied from every item. Signals: "about N", a corrected count, "without counting", "without tallying", "from memory". Counts a script or filter got wrong are in counts-from-wrong-filter.
surface: safe
status: accepted
ref: "Issue #2659 closed not planned on 2026-10-29: the owner accepts the cost. 4 minor or nit recurrences since 2026-10-25, each self-caught. Prune Trial opened 2026-10-25 by PR #2537 was judged and deleted by the 2026-10-28 prune run (PR #2641): no major or blocker Friction in 48 sessions. Issue #2522 closed by PR #2537."
fixes:
  - pr: 2336
    date: "2026-10-20"
    summary: "CLAUDE.md \"Verify before you state\" now names subagent reports, script behaviour from recall, \"only\"/\"every\"/\"nothing\" claims and one-test causes; \"One home per fact\" says to grep for other statements when changing one."
  - pr: 2378
    date: "2026-10-21"
    summary: "Restored the shorter \"Verify before you state\" bullet in CLAUDE.md, and the Standards reviewer in clear-backlog-build now flags a count or subagent claim that cites no source."
  - pr: 2483
    date: "2026-10-24"
    summary: "Made prune-trial take the line delta from git diff --numstat against the cut's parent, and corrected the pr-workflow.md trial's delta to -2."
  - pr: 2537
    date: "2026-10-25"
    summary: "Cut the Verify-before-you-state family to one plain home in CLAUDE.md and dropped its restatements in four Skills and the build reviewer."
occurrences:
  - session: session_01FDWjoePShpq7fov1iKn4GB
    date: "2026-10-25"
    severity: minor
    description: "First Digest draft overstated a session's fabricated-report count and glossed three re-cuts as two-idea splits; fact-check caught both."
    solution: "Quote the session's own wording or the source count instead of paraphrasing from gather output"
  - session: session_01PGQQj6iUaMYCkphVjFEsBP
    date: "2026-10-25"
    severity: nit
    description: "Told the user three agents were still running when four were, a miscount from memory instead of the launch list."
    solution: "Count from the launch calls before stating a number."
  - session: session_01Vg1qDutnhKVav7JDNUdr8J
    date: "2026-10-26"
    severity: nit
    description: "Told the user '31 misses' in a progress note from an eyeballed list; the scripted count is 30. Broke CLAUDE.md's verify-before-you-state; caught before the report."
    solution: "Print the count from the script before stating any number, even in an interim update."
  - session: session_013zxzeQV6Jcqg4jYk2tkwBq
    date: "2026-10-27"
    severity: minor
    description: "I wrote an uncounted claim tally (54) into the PR body, then recounted the fact-check rows (49) and corrected it."
    solution: "Count rows before writing the tally."
  - session: session_013zxzePJnRATi9QoJAjCxgq
    date: "2026-10-27"
    severity: nit
    description: "The ledger numbers (66/67) were stale after review-fix edits and had to be recomputed and re-committed."
    solution: "Compute numstat and the ledger entry only after the review fixes land."
  - session: session_013zxzeR94ZpyH5mhKXDH22Y
    date: "2026-10-28"
    severity: nit
    description: "First PR body miscounted fact-check verdicts; I caught it and corrected the body before CI."
    solution: "Tally verdicts from the checker reply before writing the body."
  - session: session_013zxzeSgD6cuF2mawqY6jWM
    date: "2026-10-29"
    severity: moderate
    description: "The Q2/Q3 picks to accept two Friction clusters rested on 'every recurrence is minor' without a per-session rate; the owner's question exposed a doubled rate for one"
    solution: "Triage briefs for regression issues should compare per-session rates before and after the fix, not severities alone"
  - session: session_013zxzeNqa4MUJF5DT5wQ1zf
    date: "2026-11-01"
    severity: nit
    description: "First PR body claimed 33 claims checked and 3 fixed without counting the report; I counted 32 rows and 1 wrong and edited the body."
    solution: "Count the fact-check rows before writing the tally."
  - session: session_013zxzeQFGrFi821yVm6n746
    date: "2026-11-01"
    severity: minor
    description: "I wrote fact-check tallies (28 claims, 7 fixed; 53 claims, 12 fixed) into both PR bodies without counting them, breaching Verify before you state; caught when opening the second PR and corrected."
    solution: "Have blog-post step 9 say to count the checker's rows (wc on the returned table) before writing the tally, or drop the number."
  - session: session_013zxzeQZYwzDuf4JEncnqAa
    date: "2026-11-02"
    severity: minor
    description: "Broke CLAUDE.md 'Verify before you state': I forwarded an Excerpt trim without counting; it would still render 18 lines and drop a named line"
    solution: "Count rendered lines against the cited file before sending a trim; the writer caught it"
  - session: session_013zxzeSAtjCQiatdUuuFCRJ
    date: "2026-11-03"
    severity: minor
    description: "I wrote 'Six more steps were dropped' in the PR body from memory; run.yml counted seven. I caught it at the close-session check and corrected the body."
    solution: "Count from run.yml before writing any figure into a PR body, as Verify before you state says."
  - session: session_013zxzeShUkKqUQT1kYCw5UK
    date: "2026-11-07"
    severity: nit
    description: "Stated 'pins of 70 guide pages' in the review brief from memory; the diff changed 72 pages (73 files with update.yml)."
    solution: "Count with git diff --name-only before putting a number in a brief or PR text; I kept the PR body free of the count."
  - session: session_013zxzeRCCqrxVitqSaxJa4K
    date: "2026-11-07"
    severity: minor
    description: "Verify before you state broken: I told the user 52 titles were kept (the seven reports covered 62) and drafted memory-page counts (12 names sharing no words, about 60 links) that were wrong."
    solution: "Count with a command before writing any number; really 8 file names share no word with their title, 4 share one, and 186 guide links use the 12 old addresses. The code-review agents caught the memory-page ones."
  - session: session_013zxzeRGhhzxkXgfdpEX9js
    date: "2026-11-07"
    severity: minor
    description: "Changing counts in prose (Three Tenants, five patterns, a 50% value) slipped past the writers, the page checks and the Standards reviewer, and I caught most by reading."
    solution: "Add a page-checks warning for number words or digits before plural nouns in In Terrarium, next to the so warning."
  - session: session_013zxzeQhMWFqY3DzWrbVdEs
    date: "2026-11-08"
    severity: nit
    description: "The checker's summary preamble said five CONFIRMED-BUT but listed four; I had to recount the verdicts myself from the body."
    solution: "Ask checkers to end with a verdict-count line derived from their own list."
  - session: session_013zxzeRWFHU5d6sAXJTbbP7
    date: "2026-11-08"
    severity: minor
    description: "Stated the guide-page list had 73 lines, and about 30 ADR rules, from memory; actual list had 72 lines. Counted only when asked to file the issue."
    solution: "Count with wc or grep -c before stating any number, as CLAUDE.md Verify before you state requires."
  - session: session_013zxzeSKTBjSfYnUxNHTJw1
    date: "2026-11-09"
    severity: moderate
    description: "My PR body and first log said about 45 pages and five checkers and 16 changed pages; the run entry lists 40 pages, I dispatched six checkers and 17 files changed. I found it only when the owner asked; CLAUDE.md says count every item."
    solution: "The curate Skill's Land step should say to take page and checker counts from the run entry and git diff --name-only before writing the PR body."
