name: counts-not-tallied
summary: >-
  Agents stated counts in PR bodies, issues, chat, briefs and notifications without counting, and had to correct them.
cause: >-
  A number (verdict counts, line totals, items in a list, running agents) is written from an estimate, memory or a report not yet final, in a GitHub body, a chat reply, a subagent brief or a notification, instead of being tallied from every item. Signals: "about N", a corrected count, "without counting", "without tallying", "from memory". Counts a script or filter got wrong are in counts-from-wrong-filter.
surface: safe
status: on-trial
ref: "Prune Trial opened 2026-10-25 by PR #2537 (territory: CLAUDE.md 'Verify before you state' bullet, dispatch-subagents §3 last bullets, audit-skills subagent paragraph, clear-backlog §3 ready-to-push bullet, clear-backlog-build.js reviewPrompt Standards text; keywords 'Verify before you state', 'count is a fact', 'candidate material', 'hearsay'). Issue #2522 closed by PR #2537."
fixes:
  - pr: 2336
    date: "2026-10-20"
    summary: "CLAUDE.md \"Verify before you state\" now names subagent reports, script behaviour from recall, \"only\"/\"every\"/\"nothing\" claims and one-test causes; \"One home per fact\" says to grep for other statements when changing one."
  - pr: 2378
    date: "2026-10-21"
    summary: "Restored the shorter \"Verify before you state\" bullet in CLAUDE.md, and the Standards reviewer in clear-backlog-build now flags a count or subagent claim that cites no source."
  - pr: 2483
    date: "2026-10-24"
    summary: "Made prune-trial take the line delta from git diff --numstat against the cut's parent, and corrected the pr-workflow.md trial's delta to -2."
  - pr: 2537
    date: "2026-10-25"
    summary: "Cut the Verify-before-you-state family to one plain home in CLAUDE.md and dropped its restatements in four Skills and the build reviewer."
occurrences:
  - session: session_01Mf4dUxuWB7WtkC5fVzByH6
    date: "2026-10-16"
    severity: minor
    description: "Quoted survey regression counts (28, 20, 10) in three issues before the ledger patch was applied; the schema-deduped counts were 26, 19, 6, so issues needed correction comments."
    solution: "File regression issues after the ledger edit is applied, or have the Skill say to quote counts from --summary run on the patched ledger."
  - session: session_016zEtXv32CmX793LgZvt7Hm
    date: "2026-10-20"
    severity: nit
    description: "My first ledger draft gave section line counts taken from diff hunks, not read from the file; both reviewers caught it."
    solution: "Count with the file in hand before writing a number."
  - session: session_01MKHvrDA9VoqiKWSG6QjpE2
    date: "2026-10-20"
    severity: nit
    description: "Push notification said 5 questions but the round had 6 (the last was 'accept the rest')."
    solution: "Count the accept-the-rest line or not, consistently."
  - session: session_01HcMFbKDTkG7hs2VhByAs4b
    date: "2026-10-21"
    severity: nit
    description: "First PR body miscounted the checker verdicts; I recounted from the ID list and corrected it before the verdict comment."
    solution: "Tally verdicts from a written list while the checkers' replies are in hand."
  - session: session_01Tqm1brfa296Tbs9QnB7rCG
    date: "2026-10-23"
    severity: minor
    description: "Wrote '-3 net' in the ledger entry without counting; the Spec reviewer found the true delta was -2."
    solution: "Take the line delta from git diff --stat before writing it, per CLAUDE.md 'Verify before you state'."
  - session: session_015P9szA8dP4wxv4wiXkZcRZ
    date: "2026-10-24"
    severity: minor
    description: "Told the owner the guide had 25 Lessons before counting; it has 20 (I had counted Walkthroughs and the index). Breaks CLAUDE.md's verify-before-you-state."
    solution: "Count from the file list (excluding walkthroughs/ and index.md) before stating a number."
  - session: session_01BjA9rHbNdMX5KiK49Cee99
    date: "2026-10-24"
    severity: nit
    description: "I told the review agent there were 30 draft Lessons from eyeballing a wc listing; there are 31. The agent corrected it."
    solution: "Count with a command (ls | wc -l) before putting a count in a brief, per CLAUDE.md 'Verify before you state'."
  - session: session_01FDWjoePShpq7fov1iKn4GB
    date: "2026-10-25"
    severity: minor
    description: "First Digest draft overstated a session's fabricated-report count and glossed three re-cuts as two-idea splits; fact-check caught both."
    solution: "Quote the session's own wording or the source count instead of paraphrasing from gather output"
  - session: session_015bAGZEdCYZMYbsoFckSH59
    date: "2026-10-24"
    severity: nit
    description: "Wrote 'Six renames' in the PR body while listing eight titles."
    solution: "Count the list before writing a number; fix the description in the next push."
  - session: session_01PGQQj6iUaMYCkphVjFEsBP
    date: "2026-10-25"
    severity: nit
    description: "Told the user three agents were still running when four were, a miscount from memory instead of the launch list."
    solution: "Count from the launch calls before stating a number."
  - session: session_01Vg1qDutnhKVav7JDNUdr8J
    date: "2026-10-26"
    severity: nit
    description: "Told the user '31 misses' in a progress note from an eyeballed list; the scripted count is 30. Broke CLAUDE.md's verify-before-you-state; caught before the report."
    solution: "Print the count from the script before stating any number, even in an interim update."
  - session: session_013zxzeQV6Jcqg4jYk2tkwBq
    date: "2026-10-27"
    severity: minor
    description: "I wrote an uncounted claim tally (54) into the PR body, then recounted the fact-check rows (49) and corrected it."
    solution: "Count rows before writing the tally."
  - session: session_013zxzePJnRATi9QoJAjCxgq
    date: "2026-10-27"
    severity: nit
    description: "The ledger numbers (66/67) were stale after review-fix edits and had to be recomputed and re-committed."
    solution: "Compute numstat and the ledger entry only after the review fixes land."
  - session: session_013zxzeR94ZpyH5mhKXDH22Y
    date: "2026-10-28"
    severity: nit
    description: "First PR body miscounted fact-check verdicts; I caught it and corrected the body before CI."
    solution: "Tally verdicts from the checker reply before writing the body."
