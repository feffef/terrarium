name: counts-not-tallied
summary: >-
  Agents stated counts in PR bodies, issues, chat, briefs and notifications without counting, and had to correct them.
cause: >-
  A number (verdict counts, line totals, items in a list, running agents) is written from an estimate, memory or a report not yet final, in a GitHub body, a chat reply, a subagent brief or a notification, instead of being tallied from every item. Signals: "about N", a corrected count, "without counting", "without tallying", "from memory".
surface: safe
status: accepted
acceptedSeverity: moderate
ref: "Issue #2659 closed not planned on 2026-10-29: the owner accepts the cost. 4 minor or nit recurrences since 2026-10-25, each self-caught. Prune Trial opened 2026-10-25 by PR #2537 was judged and deleted by the 2026-10-28 prune run (PR #2641): no major or blocker Friction in 48 sessions. Issue #2522 closed by PR #2537."
related:
  - entry: counts-from-wrong-filter
    rule: A script, window or eligibility filter computed the count and the filter was wrong.
  - entry: github-body-unchecked-value
    rule: A path, commit, branch or phrase in a GitHub post came from memory.
fixes:
  - pr: 2336
    date: "2026-10-20"
    summary: "CLAUDE.md \"Verify before you state\" now names subagent reports, script behaviour from recall, \"only\"/\"every\"/\"nothing\" claims and one-test causes; \"One home per fact\" says to grep for other statements when changing one."
  - pr: 2378
    date: "2026-10-21"
    summary: "Restored the shorter \"Verify before you state\" bullet in CLAUDE.md, and the Standards reviewer in clear-backlog-build now flags a count or subagent claim that cites no source."
  - pr: 2483
    date: "2026-10-24"
    summary: "Made prune-trial take the line delta from git diff --numstat against the cut's parent, and corrected the pr-workflow.md trial's delta to -2."
  - pr: 2537
    date: "2026-10-25"
    summary: "Cut the Verify-before-you-state family to one plain home in CLAUDE.md and dropped its restatements in four Skills and the build reviewer."
occurrences:
  - session: session_013zxzePiaeVXJsUcoKh7LFv
    date: "2026-11-13"
    severity: nit
    description: "The retro theme counts in the #3143 report (10 of 15 and so on) were tallied by reading the replies, not by a command, against CLAUDE.md's count-every-item rule."
    solution: "Paste the 15 replies into a file and grep each theme so the counts name their command."
  - session: session_013zxzeQ9FTpQjBywTHWkdXF
    date: "2026-11-13"
    severity: nit
    description: "I told a reviewer that four of five duplicated facts were trimmed when the diff trimmed three; I stated the count from memory instead of counting it."
    solution: "Count from the diff before stating a number in a brief, as 'Verify before you state' asks."
  - session: session_013zxzePBHiX6mZNUjPTWpWc
    date: "2026-11-14"
    severity: minor
    description: "My first verdict comment on PR 3301 gave a tally (17 findings, 5 applied) not counted against the verdict files; corrected in a later comment and the PR body."
    solution: "Count verdicts from the saved files before writing the verdict."
  - session: session_013zxzeT5pQrVtuNLAzUQRaP
    date: "2026-11-14"
    severity: minor
    description: "I set small:true on the glassbox branch without counting its diff; it was 11 lines, over the 10-line bar, so a full extra review round ran for nits only."
    solution: "Count the diff in the worktree before setting small (git diff --shortstat) instead of judging from the brief."
  - session: session_013zxzeQE5BDH58h5e21zafo
    date: "2026-11-15"
    severity: minor
    description: "I first posted wrong finding counts (10 findings, 1 CONFIRMED) in the PR body and verdict comment, counted from memory; I recounted and corrected both."
    solution: "Count verdicts from the checker's table before writing the body (CLAUDE.md Verify before you state)."
  - session: session_013zxzePH9gQTPAHjR7vCj71
    date: "2026-11-15"
    severity: minor
    description: "Posted the issue 3017 comments with miscounts and one wrong claim about which agents said what, and fixed them by editing the comments three times."
    solution: "Recompute every count from the log with a command, and re-read each claim against the replies, before posting."
  - session: session_013zxzePNLUgD6AbfEmXykEJ
    date: "2026-11-15"
    severity: nit
    description: "I told the owner 26 Skills had observations; the actual count was 23. Corrected the next message."
    solution: "Count with a script before stating a number, as CLAUDE.md says."
  - session: session_013zxzeQESWGW1qj9P1Egphc
    date: "2026-11-15"
    severity: minor
    description: "I tallied and relayed about fifteen sets of self-reported counts by hand; each was marked unverified, but one figure (sessions with a passing backed) was wrong and had to be corrected."
    solution: "Have sessions post structured counts and sum them with a script, not by hand in the reply."
  - session: session_013zxzeSgAcwDrJXAMFAC4Qf
    date: "2026-11-17"
    severity: nit
    description: "Briefed the first reviewers with 'about 130 of the 143 changed files are data' without counting; the file list I printed gave 135, and I never verified either."
    solution: "Count with git diff --name-only and a filter before stating a number in a brief, or leave the number out."
  - session: session_013zxzeQgh4aLo2xMP4FzXZJ
    date: "2026-11-17"
    severity: nit
    description: "My first ledger PR verdict stated 44 changed files without counting; the real count was 35 and I had to edit the comment."
    solution: "Count with git diff --no-renames --name-only before stating a number."
  - session: session_013zxzeSARDGdXM7Hqe83quy
    date: "2026-11-21"
    severity: nit
    description: "check-clusters rejected my session counts twice because I counted entries, not distinct sessions."
    solution: "Have the helper print the expected count in its error."
  - session: session_013zxzeQemDnZfmHdeYUmhur
    date: "2026-11-23"
    severity: nit
    description: "I wrote 'five nits fixed' in PR #3615's body from memory; the triage lines show four fixed and one skipped. Corrected by a PR edit."
    solution: "Count from triage.md before writing the PR body, as CLAUDE.md says (verify before you state)."
  - session: session_013zxzePQedy4SaB83pQYkET
    date: "2026-11-26"
    severity: nit
    description: "The role trim to 50 words needed a follow-up commit because I counted words wrongly; the follow-up fit the two-file simple-change bar only after reverting a third edit."
    solution: "Count words with a script (yaml load plus split) when trimming a role."
  - session: session_013zxzeQivG2v72EMRPiQ5aR
    date: "2026-11-27"
    severity: nit
    description: "A subagent's trial-entry word count (1,112) was copied into the Digest; the fact-check caught that a later commit made it 1,120. I should have run wc on the merged file."
    solution: "Take counts from the merged file, not a PR's own notes."
  - session: session_013zxzeR9wuoRUezpWhAdNaL
    date: "2026-11-27"
    severity: nit
    description: "My first run-entry counts (44 files) and its 'no text change' claim were wrong; I wrote them before counting with git diff."
    solution: "Count with git diff --name-status before writing numbers into a run entry, as CLAUDE.md's verify-before-you-state says."
  - session: session_013zxzePtpYfD71WKEC9Henf
    date: "2026-11-28"
    severity: nit
    description: "Copied 'five pushes' from session friction text into the Digest; the fact-check found six red runs. Caught before landing."
    solution: "Verify a count against CI runs, not a session log's wording."
