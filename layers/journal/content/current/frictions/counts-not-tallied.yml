name: counts-not-tallied
summary: >-
  Agents posted counts in PR bodies and issues without counting, and had to correct them.
cause: >-
  A number (verdict counts, line totals, regression counts) goes into a GitHub body as an estimate or from a report not yet final, instead of being tallied by hand from every item. Signals: "about N", a PR body count corrected by an edit, "without tallying", "without counting". Counts a script or filter got wrong are in counts-from-wrong-filter.
surface: safe
status: open
ref: "Issue #2471 closed completed 2026-10-24. Issue #2435 closed 2026-10-23 by PR #2454, a ledger-only split."
fixes:
  - pr: 2336
    date: "2026-10-20"
    summary: "CLAUDE.md \"Verify before you state\" now names subagent reports, script behaviour from recall, \"only\"/\"every\"/\"nothing\" claims and one-test causes; \"One home per fact\" says to grep for other statements when changing one."
  - pr: 2378
    date: "2026-10-21"
    summary: "Restored the shorter \"Verify before you state\" bullet in CLAUDE.md, and the Standards reviewer in clear-backlog-build now flags a count or subagent claim that cites no source."
  - pr: 2483
    date: "2026-10-24"
    summary: "Made prune-trial take the line delta from git diff --numstat against the cut's parent, and corrected the pr-workflow.md trial's delta to -2."
occurrences:
