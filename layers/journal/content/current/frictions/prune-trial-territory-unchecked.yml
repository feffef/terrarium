name: prune-trial-territory-unchecked
summary: Agents state or ignore what an open Prune Trial covers without reading the trial ledger, so a wrong claim reaches a PR or a build starts inside a trial.
cause: >-
  A triage agent's claim about a trial's territory (close-session in a trial that was judged and deleted; the frictions-to-fixes briefs in a trial that covers only SKILL.md) is relayed or acted on without opening .agents/prune-trials.yml on origin/main, and a build is launched before the territory is checked. Signals: "prune trial", "open trial", "territory", "needed an owner question afterwards".
surface: safe
status: open
notes: |-
  2026-10-22 design: one sentence in clear-backlog-explore.js brief() to quote the trial territory line dropped: adr-check already lists open trials, the failure is orchestrators skipping adr-check (covered by binding-docs-skipped), and the one wrong triage claim was caught; revisit on a second wrong trial claim from a triage agent
fixes:
  - pr: 2572
    date: "2026-10-26"
    summary: "audit-docs step 1 tells reviewer agents to skip text under an open Prune Trial (partial)."
  - pr: 3199
    date: "2026-11-12"
    summary: "New trial-territory.ts prints each open Prune Trial that covers given paths or words."
occurrences:
  - session: session_013zxzeNrvAWHmAPYsSy8u7x
    date: "2026-11-12"
    severity: minor
    description: "Read only the first 40 lines of the prune trials file, so missed that an open trial covers environment-caveats.md; found it when I grepped for it before filing."
    solution: "Grep the trials file for the target doc before drafting, as ADR-0027 asks."
