name: prune-trial-territory-unchecked
summary: Agents state or ignore what an open Prune Trial covers without reading the trial ledger, so a wrong claim reaches a PR or a build starts inside a trial.
cause: >-
  A triage agent's claim about a trial's territory (close-session in a trial that was judged and deleted; the frictions-to-fixes briefs in a trial that covers only SKILL.md) is relayed or acted on without opening .agents/prune-trials.yml on origin/main, and a build is launched before the territory is checked. Signals: "prune trial", "open trial", "territory", "needed an owner question afterwards".
surface: safe
status: open
notes: |-
  2026-10-22 design: one sentence in clear-backlog-explore.js brief() to quote the trial territory line dropped: adr-check already lists open trials, the failure is orchestrators skipping adr-check (covered by binding-docs-skipped), and the one wrong triage claim was caught; revisit on a second wrong trial claim from a triage agent
fixes:
  - pr: 2572
    date: "2026-10-26"
    summary: "audit-docs step 1 tells reviewer agents to skip text under an open Prune Trial (partial)."
occurrences:
  - session: session_01C32ny8wWXkJLgyHd9wiD1J
    date: "2026-10-21"
    severity: minor
    description: "A triage agent claimed close-session/SKILL.md sits in an open prune trial; .agents/prune-trials.yml shows that trial was judged and deleted."
    solution: "The explore workflow's triage brief could ask agents to quote the matching territory line from prune-trials.yml on origin/main."
  - session: session_013n8e5pQ7h9GevyhHvtm4c3
    date: "2026-10-21"
    severity: minor
    description: "Launched the #2388 rename build before checking prune-trials.yml; dispatch-subagents section 3 was in an open trial and needed an owner question afterwards"
    solution: "Check .agents/prune-trials.yml territories before filing a wording-change issue, as adr-check would have"
  - session: session_01BgQzSd9CmFPiugdXAQh6HW
    date: "2026-10-26"
    severity: minor
    description: "Reviewers were not told about open Prune Trials, so 3 of 5 rejected findings targeted text ADR-0027 bars changing."
    solution: "Add one line to the audit-docs reviewer instructions: skip text covered by .agents/prune-trials.yml."
  - session: session_013zxzeSgD6cuF2mawqY6jWM
    date: "2026-10-29"
    severity: minor
    description: "I chose pick (d) for #2654 without checking .agents/prune-trials.yml; an open trial keeps exactly that text, so the owner must be asked again"
    solution: "Before proposing a pick that edits an instruction, check prune-trials.yml territory (issue-tracker.md supersession check)"
  - session: session_013zxzeQmVnqMqDkRgFRWx5T
    date: "2026-10-28"
    severity: minor
    description: "The design subagent reported that survey-brief.md is not under an open Prune Trial; prune-trials.yml lists it as territory. I caught it by grepping before dispatching, so no harm."
    solution: "The design brief should tell the agent to quote the matching territory path for every doc it would change, as the survey brief does."
  - session: session_013zxzeS5X2KXN7xVdXxNmdN
    date: "2026-10-30"
    severity: minor
    description: "Did not check .agents/prune-trials.yml territory before dispatching reviewers; the checker had to catch the environment-caveats finding as trial-covered."
    solution: "Tell the audit-docs reviewers the trial territory paths directly, not just 'skip text covered by an open trial'."
