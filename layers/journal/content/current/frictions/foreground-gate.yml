name: foreground-gate
summary: >-
  Agents waited on the full three-minute check run instead of running it in the background.
cause: >-
  Sessions run pnpm gate:scoped (about 3 minutes) in the foreground although CLAUDE.md says to background commands over 2 minutes; only a guard would reach them.
surface: guard-or-hook
status: accepted
ref: "issue #2426 closed not planned on 2026-10-26: the owner accepts the cost. The backgrounding Prune Trial (verdict f89929a37) found no major or blocker damage over 53 sessions, so no guard gets built."
fixes:
  - pr: 1790
    date: "2026-10-11"
    summary: "Rewrote the rule so a long command may run in the foreground if given a long enough timeout."
  - pr: 2271
    date: "2026-10-19"
    summary: "CLAUDE.md now says to start any command over 2 minutes with run_in_background and a redirected log, dropping the foreground-with-timeout option."
  - pr: 2443
    date: "2026-10-23"
    summary: "Cut long-command backgrounding to one home: CLAUDE.md's Self-verification bullet tightened and blog-post §10's restatement dropped."
occurrences:
  - session: session_01AdUi9nKLGKyPFfBe4HYvqG
    date: "2026-10-14"
    severity: nit
    description: "I chained preview stop with several long commands in one call; it exceeded the 2-minute limit and was moved to the background."
    solution: "Run stop alone; the tool output of stop is tiny and fast."
  - session: session_01TANViXz17btvY9rH87SHcB
    date: "2026-10-18"
    severity: moderate
    description: "Ran pnpm gate:scoped with a 600s timeout equal to the tool limit; it expired mid-e2e and wasted about ten minutes before a background rerun."
    solution: "Start the gate with run_in_background from the first call, as CLAUDE.md's Self-verification section says."
  - session: session_01Pzj23dzUMace5jwZCvxmx7
    date: "2026-10-19"
    severity: nit
    description: "Ran the full vitest suite in the foreground (about 3 minutes) instead of run_in_background as CLAUDE.md requires; it fit under the 600s cap."
    solution: "Start the full suite with run_in_background and a redirected output file from the first call."
  - session: session_01EjH3TbrydEY2sArBMYE5Gy
    date: "2026-10-22"
    severity: minor
    description: "Broke CLAUDE.md's Self-verification rule: started one gate:scoped with shell & instead of run_in_background, and ran the next in the foreground with a 600s timeout"
    solution: "Start every gate:scoped with run_in_background true and output redirected to a file, as CLAUDE.md says"
