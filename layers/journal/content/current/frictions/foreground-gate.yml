name: foreground-gate
summary: >-
  Agents ran long commands (the gate, the full test suite) in the foreground or with a shell &, instead of with the background option.
cause: >-
  Sessions run commands over 2 minutes (pnpm gate:scoped, the full vitest suite, chains of long commands) in the foreground with a long timeout, or background them with a shell & instead of run_in_background, although CLAUDE.md says to use run_in_background and a log; only a guard would reach them. Signals: a foreground gate or vitest run, a 600s timeout expiring, a shell-& gate start.
surface: guard-or-hook
status: accepted
ref: "issue #2426 closed not planned on 2026-10-26: the owner accepts the cost. The backgrounding Prune Trial (verdict f89929a37) found no major or blocker damage over 53 sessions, so no guard gets built."
fixes:
  - pr: 1790
    date: "2026-10-11"
    summary: "Rewrote the rule so a long command may run in the foreground if given a long enough timeout."
  - pr: 2271
    date: "2026-10-19"
    summary: "CLAUDE.md now says to start any command over 2 minutes with run_in_background and a redirected log, dropping the foreground-with-timeout option."
  - pr: 2443
    date: "2026-10-23"
    summary: "Cut long-command backgrounding to one home: CLAUDE.md's Self-verification bullet tightened and blog-post §10's restatement dropped."
occurrences:
  - session: session_013zxzeP5MnAU2v4XFBZHSdY
    date: "2026-10-30"
    severity: minor
    description: "Foreground merge-pr.ts hit the 600s tool limit while polling a slow CI gate; I had to relaunch it in the background."
    solution: "Run merge-pr.ts with run_in_background from the start, as CLAUDE.md says for long commands."
  - session: session_013zxzeTEBhUnvwNNBASiFDg
    date: "2026-11-11"
    severity: nit
    description: "CLAUDE.md says run anything over 2 minutes with run_in_background; I ran the research branch's gate:scoped in the foreground, though it finished."
    solution: "Default every gate:scoped call to a background log."
  - session: session_013zxzePXpUx7WY6K2uHsxKz
    date: "2026-11-12"
    severity: minor
    description: "Ran a server start plus wait loop in the foreground past the 590s limit while typecheck ran alongside; it was moved to background and left a dev server running (CLAUDE.md self-verification: run long jobs in background)."
    solution: "Start the server with run_in_background and a log file, never alongside typecheck, and stop it by pid when done."
