name: foreground-gate
summary: >-
  Agents waited on the full three-minute check run instead of running it in the background.
cause: >-
  Sessions run pnpm gate:scoped (about 3 minutes) in the foreground although CLAUDE.md says to background commands over 2 minutes; only a guard would reach them.
surface: guard-or-hook
status: open
ref: "issue #1785; PR #1790"
fixes:
  - pr: 1790
    date: "2026-10-11"
    summary: "Rewrote the rule so a long command may run in the foreground if given a long enough timeout."
occurrences:
  - session: session_015BjYk46dntcMuAWMn1z4Zw
    date: "2026-10-10"
    severity: minor
    description: "Ran `pnpm gate:scoped` in the foreground despite CLAUDE.md's rule to background commands that can take over 2 minutes."
    solution: "Start the gate with run_in_background and redirect it to a log; it took about 3 minutes."
  - session: session_013GkBtC56M36dmz5AtEb1Hp
    date: "2026-10-11"
    severity: nit
    description: "Ran gate:scoped in the foreground (about 3 minutes) instead of in the background as CLAUDE.md requires for long commands."
    solution: "Start the gate with run_in_background and redirect output to a file."
  - session: session_01WuJh8gfMFWfS5bWEJcdScC
    date: "2026-10-11"
    severity: nit
    description: "Ran pnpm gate:scoped in the foreground (about 156s) instead of with run_in_background and an output file as CLAUDE.md says for commands over 2 minutes."
    solution: "Start the gate in the background with output redirected to a file."
  - session: session_01YVCyXmxSSDQ6csSBVJ554H
    date: "2026-10-11"
    severity: nit
    description: "Ran gate:scoped in the foreground (about 3 minutes) though CLAUDE.md says to background any command that can exceed 2 minutes."
    solution: "Start the gate with run_in_background and redirect output to a file, as CLAUDE.md says."
  - session: session_01AdUi9nKLGKyPFfBe4HYvqG
    date: "2026-10-14"
    severity: nit
    description: "I chained preview stop with several long commands in one call; it exceeded the 2-minute limit and was moved to the background."
    solution: "Run stop alone; the tool output of stop is tiny and fast."
  - session: session_01TANViXz17btvY9rH87SHcB
    date: "2026-10-18"
    severity: moderate
    description: "Ran pnpm gate:scoped with a 600s timeout equal to the tool limit; it expired mid-e2e and wasted about ten minutes before a background rerun."
    solution: "Start the gate with run_in_background from the first call, as CLAUDE.md's Self-verification section says."
