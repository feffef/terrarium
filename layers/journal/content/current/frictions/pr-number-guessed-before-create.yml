name: pr-number-guessed-before-create
summary: >-
  A session wrote an expected next PR number (into a subscription or a ledger fixes row) before the PR existed, and another PR took it first.
cause: >-
  The session predicts the next PR number: it calls subscribe_pr_activity in the same turn as create_pull_request, or writes a fixes row's pr field before the PR is opened, and the guess is off by one or two when another PR lands first, costing a resubscribe or extra commits and gate runs. Signals: 'guessing the next number', 'unsubscribe and resubscribe', 'predicted PR numbers twice'.
surface: safe
status: open
fixes: []
notes: |-
  2026-10-23 design: a subscribe-after-create sentence or guard dropped: the only home is ADR-0003 (Human-only, an ADR summary cannot add to its ADR) or a guard that cannot tell a guess from a real number, and a wrong guess costs one resubscribe.
occurrences:
  - session: session_013zxzePVGCU1ARYitEsVKoy
    date: "2026-11-06"
    severity: minor
    description: "Predicted PR numbers twice for the ledger fixes row of #2878 (2888, then 2891); other PRs took both, costing two extra commits and a rerun of the gate."
    solution: "Open the PR first, then add its number in a follow-up commit; or have the build workflow leave the row out and let the orchestrator write it."
  - session: session_013zxzeSy38XR1wPjCGFUExY
    date: "2026-11-07"
    severity: nit
    description: "Two build agents wrote guessed PR numbers into ledger entries before any PR existed, costing a follow-up commit and push."
    solution: "Brief builders to leave the PR number out and put the real one in after opening the PR."
  - session: session_013zxzeRL5rU5zS3WRCkH3TE
    date: "2026-11-08"
    severity: nit
    description: "Issued create_pull_request and subscribe_pr_activity in one call with a guessed PR number 2981; it matched, but the subscription depended on the create result."
    solution: "Wait for the create result before subscribing."
  - session: session_013zxzeRSMtPAREKXCce9GT6
    date: "2026-11-09"
    severity: minor
    description: "Subscribed to PR activity on a guessed PR number (1) before any PR existed, then had to unsubscribe and ignore a stale wake event."
    solution: "Subscribe only with the number returned by create_pull_request; the PR-open hint could say so."
  - session: session_013zxzeS6AE1WUN124PHnm4b
    date: "2026-11-13"
    severity: nit
    description: "I subscribed to a guessed PR number in the same parallel call that created the PR, so I briefly watched someone else's PR 3261 until I noticed and corrected it."
    solution: "Subscribe only after the create call returns the PR number."
  - session: session_013zxzeQ9FTpQjBywTHWkdXF
    date: "2026-11-13"
    severity: minor
    description: "subscribe_pr_activity failed twice with 'Failed to subscribe to PR activity' right after the PR opened, so the PR-open step is not done yet; a first call also went out with pull number 0 because I sent it in the same block as the create call."
    solution: "Retry later in the session and poll check runs meanwhile; never send a call that depends on another call's result in the same block."
