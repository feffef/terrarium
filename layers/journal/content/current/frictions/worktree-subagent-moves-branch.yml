name: worktree-subagent-moves-branch
summary: >-
  A helper agent switched the branch the main agent was using, so the main copy showed phantom changes.
cause: >-
  An impl agent in a worktree checks out or pushes the branch the primary checkout has checked out, so the primary tree shows phantom reverse changes.
surface: safe
status: open
occurrences:
  - session: session_01TiCx5GDdDdFGwCEs6xxr89
    date: "2026-10-03"
    severity: moderate
    description: "An impl agent's `git checkout -B <session-branch>` in its worktree moved the branch my primary checkout had checked out, leaving my tree looking like a reversed diff of its commits"
    solution: "Detach the orchestrator checkout before dispatching agents that push the same branch; worth a line in dispatch-subagents for single-branch serial integration"
  - session: session_01Dz52W6wWZWUgKwPtdxabzJ
    date: "2026-10-12"
    severity: nit
    description: "A reviewer subagent ran git checkout --detach origin/main by mistake and switched back; no harm, but it touched the shared checkout."
    solution: "Tell read-only reviewer briefs not to run any state-changing git command."
