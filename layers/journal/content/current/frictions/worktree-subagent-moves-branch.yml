name: worktree-subagent-moves-branch
summary: >-
  A helper agent or workflow switched the branch the main agent was using, so the main copy showed phantom changes or a detached HEAD.
cause: >-
  A read-only reviewer (the code-review Skill's, Freshness) or a build workflow leaves the primary checkout on a detached HEAD, so later merges and record commits land detached and pushes update only the stale branch (2026-11-04); an impl agent that checks out or pushes the primary checkout's branch makes phantom reverse changes. PRs #2856 and #2888 (2026-11-06) tell review and read-only agents in dispatch-subagents §3 to use git show or git diff and never check out outside their isolation worktree; a reviewer briefed by the installed code-review Skill never sees that text. Signals: 'detached HEAD', 'left the checkout detached at origin/main', 'check:worktrees reported', phantom reverse changes.
surface: safe
status: open
ref: "#2874"
notes: |-
  2026-10-27 design: guard or brief prose against git checkout in a read-only subagent dropped: the brief was already read-only, code-review is a pack Skill, a guard would touch Human-only hooks for a nit with nothing lost
  2026-11-01 design: no change: three occurrences by three different actors (a pack Skill's reviewer, the build workflow, the Freshness reviewer); check:worktrees flags each at once and one git switch fixes it; dispatch-subagents §3 is in an open Prune Trial's territory and a guard would be Human-only
  2026-11-05 design: reword dispatch-subagents §2 so a review agent checks a SHA out detached only in its own worktree; dispatched this run
  2026-11-06 survey: TJp1jinY (11-05, after PR #2856) shows a Standards reviewer running git checkout --detach in the lead checkout because the brief only said read-only; issue #2874 tracks it.
fixes:
  - pr: 2856
    date: "2026-11-05"
    summary: "A review agent reads a PR commit with git show or detaches it only in its isolation worktree, never in the dispatcher checkout (dispatch-subagents §3)."
  - pr: 2888
    date: "2026-11-06"
    summary: "dispatch-subagents §3: a read-only or review agent outside its own isolation worktree reads with git show or git diff, never checkout, switch or reset, and its brief says so."
occurrences:
  - session: session_013zxzeRYbgUKxiRJrndpHae
    date: "2026-10-31"
    severity: minor
    description: "The Freshness reviewer left the checkout detached at origin/main, so I had to switch back to the session branch."
    solution: "Tell read-only reviewers not to change the checkout."
  - session: session_013zxzeT8tDd5GPJiRNZRA4J
    date: "2026-11-04"
    severity: moderate
    description: "A read-only code-review subagent ran git checkout --detach HEAD in the shared checkout; my later merges and record commits landed on a detached HEAD while pushes updated only the stale branch."
    solution: "Brief read-only agents to run no checkout, switch or reset in the shared tree; run git status -sb before each push (git-conventions: check the step landed)."
  - session: session_013zxzeTJp1jinYqgNJRczgA
    date: "2026-11-05"
    severity: minor
    description: "The Standards reviewer ran git checkout --detach in my checkout because my brief only said read-only; dispatch-subagents section 3 says review agents never use the lead's checkout"
    solution: "Add 'read commits with git show only; never check out or switch branches' to every review and research brief"
  - session: session_013zxzeSB2Asdc9k89JQywv9
    date: "2026-11-10"
    severity: minor
    description: "Impl agent ran checkout -B on the branch my main checkout held, moving the shared ref and leaving a stale staged revert in my checkout."
    solution: "dispatch-subagents should say an impl agent never reuses the orchestrator's branch name; give it its own branch."
