name: placeholder-guard-denies-quoted-placeholder
summary: The guard against unfilled brief placeholders denied a dispatch whose prompt only named the placeholder while explaining it, costing a retry.
cause: "Comes from subagent-brief-defects and PR #3064: dispatch-read-guard.ts denies an Agent prompt or SendMessage message matching /@@\\w+@@|{UPPER_CASE}/ (scripts/hooks/dispatch-read-guard.ts:39), so an orchestrator's wrapper text that quotes the brief's literal scratch-dir placeholder to say how to fill it is denied as unfilled. Signals: 'my own wrapper text contained the literal placeholder', 'mentioned the literal curly-braced scratch placeholder while explaining it', a retry with the prompt reworded."
surface: guard-or-hook
status: open
ref: "subagent-brief-defects, fix PR #3064"
related:
  - entry: subagent-brief-defects
    rule: The brief held a real unfilled placeholder, wrong path or wrong value.
  - entry: dispatch-read-guard-deny
    rule: The guard denied the first dispatch until the Skill was read.
occurrences:
  - session: session_013zxzeSPxncNsUJXwnc2DvG
    date: "2026-11-11"
    severity: nit
    description: "The dispatch-read guard blocked my first survey brief because my own wrapper text contained the literal placeholder, costing one retry and a filled copy of the brief."
    solution: "Have the Skill say to write the filled brief to a scratchpad file and hand that path, since pasting verbatim trips the guard."
  - session: session_013zxzeP3xBUNvHd5kGFihuo
    date: "2026-11-12"
    severity: nit
    description: "The retry was denied again because my own prompt mentioned the literal curly-braced scratch placeholder while explaining it; I reworded it."
    solution: "The guard could ignore a placeholder named inside backticks, or the briefs could say to hand them by path without naming it."
  - session: session_013zxzeNdAgdKF5tpWTQLowx
    date: "2026-11-13"
    severity: nit
    description: "The dispatch-read guard blocked my first survey dispatch because my wrapper text quoted the brief's literal placeholder to say how it was filled."
    solution: "Known entry placeholder-guard-denies-quoted-placeholder; I reworded to 'the braces around SCRATCH_DIR'."
  - session: session_013zxzeNiyBNZD3Zn5dUm9Bq
    date: "2026-11-13"
    severity: nit
    description: "The dispatch-read guard blocked a review brief that quoted the literal placeholder name from the brief under review."
    solution: "Refer to placeholders by description in briefs; the guard is working as designed."
  - session: session_013zxzeQDRyvj3Vc8GUWHvBv
    date: "2026-11-14"
    severity: nit
    description: "A literal braces placeholder in my own extra asks made the dispatch-read guard deny the survey agent's brief; I reworded and retried."
    solution: "The guard could ignore text that names the placeholder inside a sentence."
  - session: session_013zxzeSyRCdzfotAbmBuiPp
    date: "2026-11-16"
    severity: minor
    description: "The dispatch-read guard denied my first survey Agent call until I read dispatch-subagents; a second call was denied because my brief text held the literal placeholder token, though I had filled the value."
    solution: "Have the guard test for an unfilled value, not the literal token, or name this in the Skill's dispatch lines."
