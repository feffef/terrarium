name: git-test-output-noise
summary: Test and gate output printed alarming git messages that were harmless, making it hard to confirm success.
cause: "Gate and test runs print 'fatal: expected acknowledgments' / no-such-ref push-negotiation lines from git fixtures; the logs look like failures."
surface: safe
status: open
ref: Two nits; drop at the next horizon prune unless it recurs.
occurrences:
  - session: session_01RAEu4CBfQptjCtKnJpUw8q
    date: "2026-10-14"
    severity: nit
    description: "Gate ran as a long background job while review agents ran; its log held many push-negotiation warnings that made it hard to confirm success quickly."
    solution: "Check the exit= line only."
  - session: session_019ZQjo7wiuxrS9KLEG2GiTU
    date: "2026-10-15"
    severity: nit
    description: "Test runs print noisy 'fatal: expected acknowledgments' and 'no-such-ref' git lines that look like failures."
    solution: "Silence or document these fixture-git messages in the test support."
  - session: session_01MeatWCLdQDV2rWVNHumqX7
    date: "2026-10-19"
    severity: minor
    description: "gate:scoped output is dominated by 'fatal: not a git repository' lines from tests, which briefly looked like a gate failure before the run ended."
    solution: "Silence git stderr in the tests that run git in temp folders, or have gate.ts filter that line."
