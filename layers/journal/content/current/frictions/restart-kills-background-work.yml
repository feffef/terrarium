name: restart-kills-background-work
summary: A container or worker restart silently killed running workflows and gate runs, and the main agent only found out later.
cause: "Container/worker restart kills background workflows and gate runs (exit 137). Signals: 'container restart killed', 'exit 137', 'args.session required'."
surface: outside
status: accepted
ref: "issue #2773 closed on 2026-11-02: the owner accepts the cost. The liveness instruction already exists at clear-backlog SKILL.md §3 since PR #2140, and a restart is an infrastructure event the repo cannot prevent."
fixes:
  - pr: 2140
    date: "2026-10-16"
    summary: "clear-backlog §3 now says a restart kills running workflows and a resumeFromRunId resume must pass the original args."
occurrences:
  - session: session_013zxzeTLLY3FmiXzuBKgc2o
    date: "2026-11-01"
    severity: moderate
    description: "A session restart at about 23:20 killed the first clear-backlog-build run mid-fix; I noticed only when the second run finished and its output file was empty, then resumed it."
    solution: "Check each running workflow's journal mtime right after a resume hook fires, as clear-backlog §3 says."
  - session: session_013zxzeSbd2LJtWWawqrWBJD
    date: "2026-11-05"
    severity: moderate
    description: "A container restart killed both build workflows and the opus agent; I twice said they were probably running until the owner asked if they were stuck, costing about an hour."
    solution: "After any gap, compare journal mtimes and process start times before reporting a background run as live; the clear-backlog Skill already says to check the journal's mtime."
  - session: session_013zxzePjZg6AdV34z87Eu3Z
    date: "2026-11-13"
    severity: nit
    description: "The worker restarted at session start; I had to re-derive from git and the empty scratchpad that no step had run."
    solution: "Nothing lost this time; a progress marker in the scratchpad after each audit-docs step would make a restart cheap."
  - session: session_013zxzeSNs4gkwrpqc36B7yP
    date: "2026-11-13"
    severity: minor
    description: "The worker restarted mid-run and my earlier context was gone, so I re-derived trial state from the repo and spent extra reads."
    solution: "Nothing in the repo; the scheduler resumed correctly."
