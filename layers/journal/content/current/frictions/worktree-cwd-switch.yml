name: worktree-cwd-switch
summary: "A session's working directory moved into a worktree it dispatched without the session cd-ing there, so session closure refused to run."
cause: "When an impl agent works in a linked worktree, the harness can move the orchestrator's primary working directory into that worktree (and back), and log-session/close-session refuse to author from a linked worktree. Signals: 'the impl agent's worktree became my cwd', 'refuses from a linked worktree', a directory switch the session did not make. A session's own bare cd belongs in bare-cd-moves-session-cwd."
surface: safe
status: open
fixes:
  - pr: 2198
    date: "2026-10-17"
    summary: "log-session worktree refusal now says to cd back when the directory only drifted into an agent worktree."
occurrences:
  - session: session_01GLWVkt3R3EnHJj5XpQEJQt
    date: "2026-10-15"
    severity: nit
    description: "log-session and close-session refuse from a linked worktree; after the impl agent's worktree became my cwd I had to cd back to the main checkout."
    solution: "Say in dispatch-subagents §5 to cd back before close-session."
  - session: session_018sAirSgDY1Nv82JVogjcyR
    date: "2026-10-16"
    severity: minor
    description: "The primary working directory switched to the impl agent's worktree and back mid-run, while log-session refuses to author from a linked worktree; I had to track where each command ran."
    solution: "Have dispatch-subagents tell the orchestrator to use absolute paths and re-check pwd after a worktree agent returns."
  - session: session_01E3XmTJcpKMZstW7MHL2eks
    date: "2026-10-23"
    severity: nit
    description: "After the impl agent's hand-back the harness moved my working directory into its worktree, the worktree-cwd-switch cluster again; I kept to absolute paths."
    solution: "Accepted harness behaviour; absolute paths."
