name: worktree-cwd-switch
summary: "A session's working directory moves into a worktree it dispatched, so session closure refuses and later commands run in the wrong place."
cause: "Entering an impl agent's or probe's worktree (cd, or the harness moving the primary directory) makes log-session/close-session refuse from a linked worktree and leaves the shell in a deleted directory after removal. Signals: 'cd back to the main checkout', 'refuses from a linked worktree', 'deleted directory'."
surface: safe
status: open
fixes:
  - pr: 2198
    date: "2026-10-17"
    summary: "log-session worktree refusal now says to cd back when the directory only drifted into an agent worktree."
occurrences:
  - session: session_01GLWVkt3R3EnHJj5XpQEJQt
    date: "2026-10-15"
    severity: nit
    description: "log-session and close-session refuse from a linked worktree; after the impl agent's worktree became my cwd I had to cd back to the main checkout."
    solution: "Say in dispatch-subagents §5 to cd back before close-session."
  - session: session_018sAirSgDY1Nv82JVogjcyR
    date: "2026-10-16"
    severity: minor
    description: "The primary working directory switched to the impl agent's worktree and back mid-run, while log-session refuses to author from a linked worktree; I had to track where each command ran."
    solution: "Have dispatch-subagents tell the orchestrator to use absolute paths and re-check pwd after a worktree agent returns."
  - session: session_01CzkKVxSTE7a4amfXnxrvF9
    date: "2026-10-16"
    severity: nit
    description: "cd'd into the probe's worktree to check it, which moved the session's working directory there; removing the worktree then left the shell in a deleted directory"
    solution: "Inspect a subagent worktree with git -C <path>, never cd, as dispatch-subagents section 5 hints"
  - session: session_01J4ze3DvsZhXeP78iyRnbSd
    date: "2026-10-17"
    severity: nit
    description: "A cd into an impl agent's worktree left my shell there; the next merge-pr and ledger edits ran in the wrong checkout until the harness noted it."
    solution: "Use absolute paths or git -C instead of cd when inspecting a worktree."
  - session: session_01Sc82qSCs4NVP3igf9SaGXM
    date: "2026-10-17"
    severity: nit
    description: "A subagent's cd and the shell's directory changes left the working directory in the frictions folder and a worktree, so later relative commands could have hit the wrong tree."
    solution: "Use absolute paths or cd to the repo root at the start of each command."
  - session: session_019Ws4gsdRWPiAvCXBi55qac
    date: "2026-10-18"
    severity: nit
    description: "A cd into .agents/skills moved the primary working dir, so a following relative path (docs/adr/0022) failed to resolve."
    solution: "Use absolute paths or a subshell; do not cd in Bash."
