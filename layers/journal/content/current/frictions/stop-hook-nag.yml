name: stop-hook-nag
summary: >-
  An end-of-turn reminder told agents to commit and push while checks were still running.
cause: >-
  The Stop hook demands commit and push on every turn while a gate, build or fact-check subagent is still running, against ADR-0004's push-after-gate rule. Since PR #2828 (2026-11-04) ADR-0003 and ADR-0004 let agents push their branch early and often (a push opens nothing) and open the PR only after code-review and the gate, so a pushed commit on the Stop hook's ask no longer breaks a rule.
surface: outside
status: open
ref: "issue #2233: the owner accepts the cost, since the nag comes from the harness-side stop-hook-git-check.sh (issue #1653) and repo rules already say to decline it. Not for a survey to re-propose: the owner alone may revisit pushing the branch early and opening the PR after review, once the pr-workflow.md prune trial is judged"
notes: |-
  2026-11-04 reopened: fix #2828 (2026-11-04) merged after the owner accepted it on 2026-10-19; ref's condition (pr-workflow.md prune trial judged) is the owner's call to confirm.
fixes:
  - pr: 1588
    date: "2026-10-04"
    summary: "Documented that the end-of-turn commit reminder cannot see running checks: commit work in progress, never push unverified work."
  - pr: 1612
    date: "2026-10-05"
    summary: "Moved the end-of-turn reminder caveat into the main project instructions so more sessions read it."
  - pr: 2828
    date: "2026-11-04"
    summary: "ADR-0003/0004 and pr-workflow.md: agents may push early and often, the PR opens only after review and the gate; git-conventions says to push when the Stop hook asks."
