name: stop-hook-nag
summary: >-
  An end-of-turn reminder told agents to commit and push while checks were still running.
cause: >-
  The Stop hook demands commit and push on every turn while a gate, build or fact-check subagent is still running, against ADR-0004's push-after-gate rule.
surface: outside
status: tracked
ref: "issue #2233 (regression of PR #2188); issue #1653 (closed not-planned 2026-10-10: harness-side stop-hook-git-check.sh); PRs #1588, #1612 (caveat docs)"
fixes:
  - pr: 1588
    date: "2026-10-04"
    summary: "Documented that the end-of-turn commit reminder cannot see running checks: commit work in progress, never push unverified work."
  - pr: 1612
    date: "2026-10-05"
    summary: "Moved the end-of-turn reminder caveat into the main project instructions so more sessions read it."
  - pr: 2123
    date: "2026-10-16"
    summary: "git-conventions now says no push is needed when the Stop hook counts main's commits and origin/main..HEAD is empty."
  - pr: 2188
    date: "2026-10-16"
    summary: "git-conventions.md now says to push a branch whose only unpushed commits are main's, ending the per-turn Stop hook nag."
