name: adr-check-output-oversized
summary: The adr-check Skill prints far more than a task needs (every ADR summary, the trial ledger and full ADRs), which costs 10k tokens or more per run.
cause: >-
  adr-check prints every ADR summary (about 24 KB) plus open Prune Trial territories whatever the task, then asks for the full text of each related ADR; PR #2287 cut the trial part only. Signals: "adr-check printed every ADR summary", "one adr-check run cost about 13k tokens", a pick or chat review where only a few ADRs applied.
surface: safe
status: open
ref: "PR #2431 retired adr-check, so its output is gone; issue #2286 (the adr-check review) is still open."
fixes:
  - pr: 2287
    date: "2026-10-19"
    summary: "adr-check now prints only each open Prune Trial's territory instead of the whole trial ledger."
  - pr: 2431
    date: "2026-10-23"
    summary: "Retired the adr-check Skill and its CLAUDE.md trigger; a new PostToolUse hook (adr-read-hint.ts) now names, once per agent, each ADR an Edit or Write touches by its rule paths or by number and that the agent has not read in full."
occurrences:
  - session: session_01AwaGncaYJFWdJnc6yqDoTS
    date: "2026-10-19"
    severity: minor
    description: "One adr-check run for a chat review cost about 13k tokens: 6k summaries, 3k trial ledger, 4k full ADRs."
    solution: "PR 2287 cuts the ledger part; a lighter path for chat opinions is still open."
  - session: session_01WU8rXHT5rKQKDYbYqCv7Sd
    date: "2026-10-21"
    severity: minor
    description: "adr-check printed every ADR summary (24KB) for a pick step where only ADR-0003/0004/0005/0027 and trial territories applied."
    solution: "Let binding.ts take a topic filter, or print only summaries whose paths match."
  - session: session_012rLVzSFUzNKnypyiRd1X2X
    date: "2026-10-22"
    severity: minor
    description: "adr-check's relevant-adrs.ts printed all 30 ADR summaries (about 6k tokens), including the always-loaded ones, for a 30-line display change"
    solution: "Skip the always-loaded rules (no paths) and print one line per ADR, so the agent opens only the summaries that bear on the change"
  - session: session_01EjH3TbrydEY2sArBMYE5Gy
    date: "2026-10-22"
    severity: nit
    description: "Look-back: adr-check's relevant-adrs.ts printed every ADR summary; I cut it with head -150 and needed a second call to see ADRs 21-30 and the prune trials"
    solution: "Read the script's output whole the first time, or have it print prune trials first since they are short and decisive"
  - session: session_016THR5o2Wcj8DYR6voyvXnu
    date: "2026-10-22"
    severity: nit
    description: "adr-check script printed every ADR summary and truncated at 150 lines; most were irrelevant to a glossary edit."
    solution: "Let relevant-adrs.ts take a topic filter, or print only titles first."
