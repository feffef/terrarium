name: harvest-list-read-cost
summary: A harvest run read its whole list of ideas and learnings, 60,000 to 90,000 tokens over several reads, and then checked only a small part of it.
cause: "Comes from harvest-first-pass-shallow and PR #3106: the harvest Skill has the run read the whole list (270 to 577 lines) before it stops at a capped number of clusters, and many entries are old ideas for a removed Skill (glassbox-improve). The harm is read cost, not a shallow pass. Since PR #3454 (2026-11-18) step 1 reads the list in pages with a last-entry count check; the read is still whole, so cost remains. Signals: 'whole read of 577 lines took about 90,000 tokens', 'read the whole 561-line harvest list', 'then checked only 17 clusters', many hand-run searches per cluster."
surface: safe
status: open
ref: "harvest-first-pass-shallow, fix PR #3106"
related:
  - entry: harvest-first-pass-shallow
    rule: The harm is a shallow pass or a skipped step, not the read cost.
notes: |-
  2026-11-13 survey: Seedling #3191 (cheaper whole read and file-based merge check) closed not planned 2026-11-12; #3178 closed by PR #3182.
fixes:
  - pr: 3195
    date: "2026-11-12"
    summary: "harvest reads the session logs of the last 7 days instead of 28, shortening the list a run reads whole."
  - pr: 3454
    date: "2026-11-18"
    summary: "harvest SKILL.md step 1 reads the list in pages of about 150 lines and checks the last entry's number against the count extract printed; no entry text shortened."
