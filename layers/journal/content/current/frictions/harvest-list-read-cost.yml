name: harvest-list-read-cost
summary: A harvest run read its whole list of ideas and learnings, 60,000 to 90,000 tokens over several reads, and then checked only a small part of it.
cause: "Comes from harvest-first-pass-shallow and PR #3106: the harvest Skill has the run read the whole list (270 to 577 lines) before it stops at a capped number of clusters, and many entries are old ideas for a removed Skill (glassbox-improve). The harm is read cost, not a shallow pass. Since PR #3454 (2026-11-18) step 1 reads the list in pages with a last-entry count check, since PR #3470 a harvest evidence command replaced per-cluster hand searches, since PR #3505 it read a saved issue list, and PR #3532 (2026-11-20) ranked and capped each group's tracker block at 10 hits; the list read was still whole. PR #3707 (2026-11-26) replaced keyword evidence with a harvest digest of about 181 KB read whole; its read cost is unmeasured on a scheduled run. Signals: 'whole read of 577 lines took about 90,000 tokens', 'read the whole 561-line harvest list', 'then checked only 17 clusters', many hand-run searches per cluster, 'each harvest evidence call took about 33 s', '5,215 lines', '3,625 lines for nine groups'."
surface: safe
status: open
related:
  - entry: harvest-first-pass-shallow
    rule: The harm is a shallow pass or a skipped step, not the read cost.
  - entry: glassbox-curate-orientation-read-cost
    rule: The opening reads of a glassbox-curate run (guide index, Subject pages) cost 90-120 KB before a focus is chosen.
notes: |-
  2026-11-13 survey: Seedling #3191 (cheaper whole read and file-based merge check) closed not planned 2026-11-12; #3178 closed by PR #3182.
  2026-11-19 survey: the PBxP-era occurrence (NYPw, 2026-11-18) is per-cluster search cost; PR #3470 (merged 2026-11-18T21:05Z, after that session) added 'harvest evidence' for it, so no regression issue filed.
fixes:
  - pr: 3195
    date: "2026-11-12"
    summary: "harvest reads the session logs of the last 7 days instead of 28, shortening the list a run reads whole."
  - pr: 3454
    date: "2026-11-18"
    summary: "harvest SKILL.md step 1 reads the list in pages of about 150 lines and checks the last entry's number against the count extract printed; no entry text shortened."
  - pr: 3470
    date: "2026-11-18"
    summary: "harvest gains a read-only evidence command that prints a cluster's matches from owner rulings, tracker issues and ledger summaries, replacing hand-run search recipes in step 3."
  - pr: 3505
    date: "2026-11-20"
    summary: "harvest extract saves the tracker listing next to its output for evidence to read, and evidence takes several keyword groups in one call, removing a repeated roughly 34 s re-list per call."
  - pr: 3532
    date: "2026-11-20"
    summary: "harvest evidence ranks tracker issues per keyword group by distinct keywords matched and prints the top 10 with an omitted count, keeping 5 from the newest 100 issues (closes #3529)."
  - pr: 3572
    date: "2026-11-21"
    summary: "harvest evidence reserves 5 of its 10 tracker hits for the newest 100 issues and prints every issue a keyword names by number."
  - pr: 3707
    date: "2026-11-26"
    summary: "A harvest digest command replaces keyword evidence, the cut tracker and the recency quota; it prints rulings, every issue with state and every ledger summary to read whole."
