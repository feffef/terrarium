name: stale-fact-under-prune-trial
summary: >-
  A doc kept stating a fact a merged PR had made false, because an open Prune Trial covered its text.
cause: "ADR-0027 forbids rewording text inside an open trial's territory, so a PR that changes behaviour leaves that doc false: docs/agents/pr-workflow.md lines 82-83 still say merge-pr.ts refuses Dependabot PRs after PR #2283. The pr-workflow.md trial was judged and deleted on 2026-10-19, yet the lines are unchanged on main (checked 2026-10-20). Signals: a PR body saying a doc 'is under the open prune trial, so it wasn't reworded'."
surface: safe
status: open
