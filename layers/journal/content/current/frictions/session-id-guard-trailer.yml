    severity: blocker
    description: "issue #387: Claude-Session trailer mismatch on this session's own commit(s): session-id-guard: fabricated or mismatched Claude-Session trailer(s) on this session's own commit(s) (issue #387 — CLAUDE.md: never predict/reconstruct a session id): 32ef9ef556f3: Claude-Session trailer says session_016RHjBGGBWx1EUSJbEjRR15, expected session_01NRVHQoPm4cP1F7iVUvh9rJ 55ecc4279d50: Claude-Session trailer says session_016RHjBGGBWx1EUSJbEjRR15, expected session_01NRVHQoPm4cP1F7iVUvh9rJ 0b5e1ea6bcf3: Claude-Session trailer says session_016RHjBGGBWx1EUSJbEjRR15, expected session_01NRVHQoPm4cP1F7iVUvh9rJ"
    solution: "Investigate the offending commit(s): CLAUDE.md forbids predicting/reconstructing a session id (never copy one seen elsewhere in context) — resolve the real id from $CLAUDE_CODE_REMOTE_SESSION_ID or the transcript at the moment of writing, and escalate per issue #387 if the divergence is unexplained."
