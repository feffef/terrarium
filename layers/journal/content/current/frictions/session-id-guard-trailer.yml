name: session-id-guard-trailer
summary: >-
  A safety check blamed the current session for commits made before it started.
cause: >-
  session-id-guard judged inherited or pre-session commits as this session's and raised a blocker on a trailer it had no business checking.
surface: guard-or-hook
status: open
ref: "issues #387, #1611, #1698; PR #1708"
fixes:
  - pr: 1708
    date: "2026-10-09"
    summary: "Removed the end-of-session check that wrongly blamed the session for commits it did not make."
