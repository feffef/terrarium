name: subagent-brief-defects
summary: >-
  Briefs for helper agents carried a wrong path, value or unfilled placeholder that the orchestrator wrote from memory, which cost a wasted run or a review catch.
cause: >-
  Orchestrators write briefs from memory instead of copying from the source, and send them without re-reading: an unfilled {PAGES} placeholder, paths relative to a Skill folder or missing the Collection folder, a status value, ADR level or scope claim restated wrongly. The agent runs on the bad brief before anyone notices. PR #2643 fixed two sources (the inspect-session Selector placeholder, layer-relative paths in the Glass Box GLOSSARY) and added no general rule. Signals: 'brief', 'placeholder', 'path did not exist', a value in a brief that differs from its source. A brief that relays another agent's unchecked claim belongs in relayed-subagent-claims; a missing CLAUDE.md brief line in subagent-brief-omits-verdict-ask.
surface: safe
status: open
fixes:
  - pr: 2150
    date: "2026-10-16"
    summary: dispatch-subagents §3 now says to re-read a brief before dispatch (placeholders filled, paths existing, values copied from source).
  - pr: 2318
    date: "2026-10-20"
    summary: "The frictions-to-fixes impl brief now names a scratch folder to write to, and audit-skills asks for session ids instead of a count."
  - pr: 2324
    date: "2026-10-20"
    summary: "dispatch-subagents section 3 (Write the brief) cut to the rule per line, with one line added to create each agent artifact folder first (a Prune Trial)."
  - pr: 2643
    date: "2026-10-28"
    summary: "The inspect-session brief template's Selector placeholder shows a two-argument example matching the script's parser; three layer-relative paths in the Glass Box GLOSSARY became repo-relative."
notes: |-
  2026-10-23 re-cluster: 01Fay2Gi (a check grepping failure-only output), 013RCsUF (dated content not excluded), 011RZgGT (explore triage schema lacks the ADR-0004 exception), 011xvPjJ (audit-skills ids, PR 2318), 01XWMuHG (auth research boundary), 01WxHaU2 (workflow agent asked to dispatch), 0135hcUf and 01VH74k3 (frictions-to-fixes Skill briefs) each need their own fix; left here as single low-severity strays.
occurrences:
  - session: session_01Fay2GiWTwxDKnnqS9DznHk
    date: "2026-10-16"
    severity: minor
    description: "My brief's check grepped vitest's default output, which lists only failures, so several agents saw nothing for a passing page."
    solution: "Brief agents to use --reporter=verbose when grepping per-page results."
  - session: session_013RCsUF234qAGu3CJr3v2on
    date: "2026-10-16"
    severity: minor
    description: "My #2186 brief did not exclude dated content, so the agent rewrote three dated blog posts to new paths; a review caught it and they were reverted."
    solution: "Every move/rename brief lists dated content (journal, blog, pinned Glass Box pages, docs/research) as untouchable; done from #2187 on."
  - session: session_011RZgGTE5Mh25D2ZNoKqfAM
    date: "2026-10-16"
    severity: minor
    description: "The explore triage brief for #2147 stated the fix may be agent-merged because the file is not Human-only, missing ADR-0004's untested-behaviour exception; I caught it only at close-session."
    solution: "Have clear-backlog-explore's triage schema ask which ADR-0004 exception applies, not just whether a path is Human-only."
  - session: session_011xvPjJVknZzx45v7NjhebT
    date: "2026-10-19"
    severity: minor
    description: "The 12 behaviour-check subagent briefs didn't ask each subagent to name a specific new session/PR/issue id directly in its summary prose (vs. a parenthetical count like '7/7 sessions') - two of the 12 Inventory entries I drafted from their reports were bare re-confirmations with no visible new citation, caught only by the Spec-axis code-review pass rather than earlier."
    solution: "When drafting an Inventory observation from a subagent's report, name the specific session/PR/issue id in the note's own prose before code-review has to catch a missing citation."
  - session: session_01XWMuHGcaNTvRPHfYb9T7z2
    date: "2026-10-19"
    severity: minor
    description: "The sources research brief told the subagent to inspect MCP config and env var names; it drifted into probing how the CLI's worker credential is sourced until the classifier blocked it"
    solution: "Research briefs that touch auth should say: never investigate credential sourcing; report the endpoint and stop"
  - session: session_01WxHaU21bCG18GRezDo4Yfe
    date: "2026-10-19"
    severity: nit
    description: "The #2262 triage brief told the builder to dispatch a probe subagent, which a workflow agent may not be able to do; I ran the probe myself"
    solution: "clear-backlog-explore triage could note when a fact needs the orchestrator to gather it"
  - session: session_01E3XmTJcpKMZstW7MHL2eks
    date: "2026-10-23"
    severity: nit
    description: "My consolidation brief listed session ids partly as suffixes (ki1C5ArD, NqN7), copied from slice reports; the agent had to add suffix matching to find them."
    solution: "Give full session ids in briefs; slice agents should report full ids, not trimmed ones."
  - session: session_01SNKBDEtR5UiaMXBdxvHuuE
    date: "2026-10-23"
    severity: nit
    description: "My subagent brief named app/utils/lesson.ts; the file lives at layers/glassbox/app/utils/lesson.ts. The glossary's path is layer-relative, and I copied it without checking."
    solution: "Check that every path in a brief exists, as dispatch-subagents §3 already says; the glossary could write the path repo-relative."
  - session: session_016edAfTmLE1szSBGNZTorPH
    date: "2026-10-25"
    severity: nit
    description: "My first survey-brief draft told the agent to print all occurrence pairs in one call and pipe them into one entry's ledger-set.ts call, which cannot route blocks to several entries; the probe and the Spec review caught it."
    solution: "Fixed in the second commit: one print, one --occurrences file per entry. A print-ledger-occurrence flag that groups output by entry would remove the split."
  - session: session_01VfbgTTxASAKYdiziaLGuXM
    date: "2026-10-25"
    severity: nit
    description: "Inspect-session brief used a single-string selector; search.ts wants tool and regex as separate args, so the subagent first got usage only."
    solution: "Show the selector split in the inspect-session brief template, e.g. tool Bash 'regex'."
  - session: session_013zxzeRkASapvnaGkGVdSBk
    date: "2026-10-27"
    severity: minor
    description: "Briefed Lesson titles without the 'field name, not ours' rule up front; two promoted pages kept project jargon titles until the user flagged it"
    solution: "Quote EVERY-PAGE.md's title rule in briefs and check titles against the tool's own docs before integrating"
  - session: session_013zxzePtKmw2meUvnUBaNQh
    date: "2026-10-27"
    severity: nit
    description: "Standards reviewer flagged missing screenshots I had already taken, because its follow-up brief didn't say so"
    solution: "Name the checks already done, with their outputs, in a follow-up review brief"
