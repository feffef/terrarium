name: subagent-brief-defects
summary: >-
  Briefs for helper agents carried a wrong path, value or unfilled placeholder that the orchestrator wrote from memory, which cost a wasted run or a review catch.
cause: >-
  Orchestrators write briefs from memory instead of copying from the source, and send them without re-reading: an unfilled {PAGES} placeholder, paths relative to a Skill folder or missing the Collection folder, a status value, ADR level or scope claim restated wrongly. The agent runs on the bad brief before anyone notices. PR #2643 fixed two sources (the inspect-session Selector placeholder, layer-relative paths in the Glass Box GLOSSARY) and added no general rule. Signals: 'brief', 'placeholder', 'path did not exist', a value in a brief that differs from its source. A brief that relays another agent's unchecked claim belongs in relayed-subagent-claims; a missing CLAUDE.md brief line in subagent-brief-omits-verdict-ask.
surface: safe
status: open
fixes:
  - pr: 2150
    date: "2026-10-16"
    summary: dispatch-subagents §3 now says to re-read a brief before dispatch (placeholders filled, paths existing, values copied from source).
  - pr: 2318
    date: "2026-10-20"
    summary: "The frictions-to-fixes impl brief now names a scratch folder to write to, and audit-skills asks for session ids instead of a count."
  - pr: 2324
    date: "2026-10-20"
    summary: "dispatch-subagents section 3 (Write the brief) cut to the rule per line, with one line added to create each agent artifact folder first (a Prune Trial)."
  - pr: 2643
    date: "2026-10-28"
    summary: "The inspect-session brief template's Selector placeholder shows a two-argument example matching the script's parser; three layer-relative paths in the Glass Box GLOSSARY became repo-relative."
notes: |-
  2026-10-23 re-cluster: 01Fay2Gi (a check grepping failure-only output), 013RCsUF (dated content not excluded), 011RZgGT (explore triage schema lacks the ADR-0004 exception), 011xvPjJ (audit-skills ids, PR 2318), 01XWMuHG (auth research boundary), 01WxHaU2 (workflow agent asked to dispatch), 0135hcUf and 01VH74k3 (frictions-to-fixes Skill briefs) each need their own fix; left here as single low-severity strays.
occurrences:
  - session: session_016edAfTmLE1szSBGNZTorPH
    date: "2026-10-25"
    severity: nit
    description: "My first survey-brief draft told the agent to print all occurrence pairs in one call and pipe them into one entry's ledger-set.ts call, which cannot route blocks to several entries; the probe and the Spec review caught it."
    solution: "Fixed in the second commit: one print, one --occurrences file per entry. A print-ledger-occurrence flag that groups output by entry would remove the split."
  - session: session_01VfbgTTxASAKYdiziaLGuXM
    date: "2026-10-25"
    severity: nit
    description: "Inspect-session brief used a single-string selector; search.ts wants tool and regex as separate args, so the subagent first got usage only."
    solution: "Show the selector split in the inspect-session brief template, e.g. tool Bash 'regex'."
  - session: session_013zxzeRkASapvnaGkGVdSBk
    date: "2026-10-27"
    severity: minor
    description: "Briefed Lesson titles without the 'field name, not ours' rule up front; two promoted pages kept project jargon titles until the user flagged it"
    solution: "Quote EVERY-PAGE.md's title rule in briefs and check titles against the tool's own docs before integrating"
  - session: session_013zxzePtKmw2meUvnUBaNQh
    date: "2026-10-27"
    severity: nit
    description: "Standards reviewer flagged missing screenshots I had already taken, because its follow-up brief didn't say so"
    solution: "Name the checks already done, with their outputs, in a follow-up review brief"
  - session: session_013zxzeSAtjCQiatdUuuFCRJ
    date: "2026-11-03"
    severity: nit
    description: "The researcher brief I filled in kept the placeholder phrase listed in the run notes below, which named a list that did not exist; I patched it with sed."
    solution: "Fill briefs from one script that asserts no placeholder text is left, and keep the run notes out of the brief."
  - session: session_013zxzeRCJHe4rmKN5i2CQ16
    date: "2026-11-06"
    severity: minor
    description: "The curate Skill's first draft missed five design items; the brief pointed at the design issue but the agent worked from my summary, costing three review-and-gate rounds."
    solution: "In a brief for a Skill built from a design issue, list each required behaviour from the design, or tell the agent to read the numbered steps in full before drafting."
  - session: session_013zxzeSZva1TWwL6nLdEnUa
    date: "2026-11-08"
    severity: minor
    description: "Dispatched five claim-check subagents with the literal placeholder @@GROUP@@ in place of the page list; all five stopped immediately and needed resuming."
    solution: "The dispatch-subagents brief checklist already says re-read the brief for unfilled {…}; inline the list when building the brief and grep for placeholders before sending."
  - session: session_013zxzeRCCqrxVitqSaxJa4K
    date: "2026-11-07"
    severity: minor
    description: "Dispatched eight reviewers asking for one title proposal each, then resumed all eight to ask for ranked alternatives, so every reviewer read its pages and reported twice."
    solution: "Settle the number of proposals per page before dispatch (dispatch-subagents section 1, lock the shared design axis); skipped because the run began autonomous and ran no grilling."
  - session: session_013zxzeQaeB8hhL2FFfcQhv7
    date: "2026-11-08"
    severity: moderate
    description: "Fanned out six writer subagents on an untried brief; its grep filter was wrong and its loose licence gave 29 uneven extra lead-in rewrites"
    solution: "Pilot a fan-out brief on one agent or a cold reviewer first; dispatch-subagents could say so for any brief sent to more than two agents"
