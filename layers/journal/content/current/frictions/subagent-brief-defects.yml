name: subagent-brief-defects
summary: >-
  Briefs for helper agents carried a wrong path, value or unfilled placeholder that the orchestrator wrote from memory, which cost a wasted run or a review catch.
cause: >-
  Orchestrators write briefs from memory instead of copying from the source, and send them without re-reading: an unfilled {PAGES} placeholder, paths relative to a Skill folder or missing the Collection folder, a status value, ADR level or scope claim restated wrongly. The agent runs on the bad brief before anyone notices. PR #2643 fixed two sources (the inspect-session Selector placeholder, layer-relative paths in the Glass Box GLOSSARY) and added no general rule. PR #3064 (2026-11-11) makes dispatch-read-guard.ts deny an Agent prompt or SendMessage message that still holds an unfilled @@NAME@@ or {UPPER_CASE} placeholder (a Workflow script is not inspected), and PR #3063 (2026-11-11) has clear-backlog-explore's brief name the sources its triage agents must learn (ledger, Skill Inventory, open prune trials, older file history). Signals: 'brief', 'placeholder', 'path did not exist', a value in a brief that differs from its source. A brief that relays another agent's unchecked claim belongs in relayed-subagent-claims; a missing CLAUDE.md brief line in subagent-brief-omits-verdict-ask.
surface: safe
status: tracked
ref: "issue #3227"
fixes:
