name: subagent-brief-defects
summary: >-
  Briefs for helper agents carried a wrong path, value or unfilled placeholder that the orchestrator wrote from memory, which cost a wasted run or a review catch.
cause: >-
  Orchestrators write briefs from memory instead of copying from the source, and send them without re-reading: an unfilled {PAGES} placeholder, paths relative to a Skill folder or missing the Collection folder, a status value, ADR level or scope claim restated wrongly. The agent runs on the bad brief before anyone notices. PR #2643 fixed two sources (the inspect-session Selector placeholder, layer-relative paths in the Glass Box GLOSSARY) and added no general rule. PR #3064 (2026-11-11) makes dispatch-read-guard.ts deny an Agent prompt or SendMessage message that still holds an unfilled @@NAME@@ or {UPPER_CASE} placeholder (a Workflow script is not inspected), and since PR #3250 (2026-11-13) also a bare all-caps NAME_PLACEHOLDER token; PR #3063 (2026-11-11) has clear-backlog-explore's brief name the sources its triage agents must learn (ledger, Skill Inventory, open prune trials, older file history). Signals: 'brief', 'placeholder', 'path did not exist', a value in a brief that differs from its source, a builder told no path for a script.
surface: safe
status: open
related:
  - entry: placeholder-guard-denies-quoted-placeholder
    rule: The guard denied a prompt that only quoted the placeholder token while explaining it.
  - entry: relayed-subagent-claims
    rule: The brief relays another agent's unchecked claim.
  - entry: subagent-brief-omits-verdict-ask
    rule: The brief lacks a line CLAUDE.md asks every brief to carry.
  - entry: visitor-loop-brief-gaps
    rule: The visitor brief left out details its visitors needed.
  - entry: reviewer-return-channel-mixed
    rule: The brief named two different return channels for the same agent.
  - entry: tdd-seam-confirmation-for-builders
    rule: The tdd Skill asks the builder for a user-confirmed seam it cannot ask for.
fixes:
  - pr: 2150
    date: "2026-10-16"
    summary: dispatch-subagents §3 now says to re-read a brief before dispatch (placeholders filled, paths existing, values copied from source).
  - pr: 2318
    date: "2026-10-20"
    summary: "The frictions-to-fixes impl brief now names a scratch folder to write to, and audit-skills asks for session ids instead of a count."
  - pr: 2324
    date: "2026-10-20"
    summary: "dispatch-subagents section 3 (Write the brief) cut to the rule per line, with one line added to create each agent artifact folder first (a Prune Trial)."
  - pr: 2643
    date: "2026-10-28"
    summary: "The inspect-session brief template's Selector placeholder shows a two-argument example matching the script's parser; three layer-relative paths in the Glass Box GLOSSARY became repo-relative."
  - pr: 3064
    date: "2026-11-11"
    summary: "dispatch-read-guard.ts denies a dispatched prompt or message holding an unfilled placeholder; dispatch-subagents gains a pilot-first line."
  - pr: 3063
    date: "2026-11-11"
    summary: "clear-backlog-explore brief names the sources triage agents learn from (ledger, Skill Inventory, open prune trials, file history)."
  - pr: 3134
    date: "2026-11-12"
    summary: "clear-backlog section 3: a brief's file list never names an installed Skill."
  - pr: 3250
    date: "2026-11-13"
    summary: "dispatch-read-guard.ts also denies a bare all-caps token ending in _PLACEHOLDER (multi-word names too) in an Agent prompt or SendMessage message; a ${X_PLACEHOLDER} template literal stays allowed."
notes: |-
  2026-10-23 re-cluster: 01Fay2Gi (a check grepping failure-only output), 013RCsUF (dated content not excluded), 011RZgGT (explore triage schema lacks the ADR-0004 exception), 011xvPjJ (audit-skills ids, PR 2318), 01XWMuHG (auth research boundary), 01WxHaU2 (workflow agent asked to dispatch), 0135hcUf and 01VH74k3 (frictions-to-fixes Skill briefs) each need their own fix; left here as single low-severity strays.
  2026-11-13 survey: Le6nsJ (2026-11-12) dispatched PAGES_PLACEHOLDER and FULL_PLACEHOLDER unfilled; the #3064 guard pattern (@@NAME@@ or braces) does not match that form. Issue #3227 (audit-skills, opened 2026-11-13) tracks unfilled placeholders.
  2026-11-23 prune trial (dispatch-subagents §3 cut) judged: it holds; the post-cut rise (6/36 vs 14/218) traces to clear-backlog-build.js rules(), not the cut text
