name: subagent-brief-defects
summary: >-
  Briefs for helper agents carried a wrong path, value, check or unfilled placeholder, which cost a wasted run or a review catch.
cause: >-
  Orchestrators write briefs from memory: an unfilled {PAGES} placeholder, paths relative to a Skill folder or missing the Collection folder, a status value restated wrongly, a check grepping output that lists only failures. The agent runs on the bad brief before anyone notices. Signals: "brief", "placeholder", "path did not exist".
surface: safe
status: open
fixes:
  - pr: 2150
    date: "2026-10-16"
    summary: dispatch-subagents §3 now says to re-read a brief before dispatch (placeholders filled, paths existing, values copied from source).
occurrences:
  - session: session_011JKK8rrCwea3xSmL4kw6si
    date: "2026-10-14"
    severity: nit
    description: "My brief gave the doc agent a wrong fixedOn and ref for reviewer-line-ranges-off, against the survey patch; code-review caught it before the push."
    solution: "Point the brief at the patch for every status field instead of restating values from memory."
  - session: session_01G6m9SbDppX4TE87Mp3m5Dk
    date: "2026-10-14"
    severity: nit
    description: "Reviewer briefs named sibling paths relative to the Skill folder; agents reported the repo-root path didn't exist"
    solution: "Write full repo-relative paths in briefs"
  - session: session_01Dcufz27EyPsKy6sYafpKRg
    date: "2026-10-14"
    severity: nit
    description: "The brief gave the content path without the Collection folder (content/guide/<subject>), which would have put the stories' files in the wrong place"
    solution: "Fixed in the stories; spec writers should derive paths from shared/expand.ts"
  - session: session_01C8c4U7TDuWnJwenPUWYxrP
    date: "2026-10-15"
    severity: minor
    description: "Launched the first subagent with an unfilled {PAGES} placeholder in its brief, wasting a run until I re-sent the page list."
    solution: "Build briefs from a script or re-read the prompt for placeholders before dispatching."
  - session: session_01Fay2GiWTwxDKnnqS9DznHk
    date: "2026-10-16"
    severity: minor
    description: "My brief's check grepped vitest's default output, which lists only failures, so several agents saw nothing for a passing page."
    solution: "Brief agents to use --reporter=verbose when grepping per-page results."
  - session: session_013RCsUF234qAGu3CJr3v2on
    date: "2026-10-16"
    severity: minor
    description: "My #2186 brief did not exclude dated content, so the agent rewrote three dated blog posts to new paths; a review caught it and they were reverted."
    solution: "Every move/rename brief lists dated content (journal, blog, pinned Glass Box pages, docs/research) as untouchable; done from #2187 on."
  - session: session_011RZgGTE5Mh25D2ZNoKqfAM
    date: "2026-10-16"
    severity: minor
    description: "The explore triage brief for #2147 stated the fix may be agent-merged because the file is not Human-only, missing ADR-0004's untested-behaviour exception; I caught it only at close-session."
    solution: "Have clear-backlog-explore's triage schema ask which ADR-0004 exception applies, not just whether a path is Human-only."
  - session: session_011xvPjJVknZzx45v7NjhebT
    date: "2026-10-19"
    severity: minor
    description: "The 12 behaviour-check subagent briefs didn't ask each subagent to name a specific new session/PR/issue id directly in its summary prose (vs. a parenthetical count like '7/7 sessions') - two of the 12 Inventory entries I drafted from their reports were bare re-confirmations with no visible new citation, caught only by the Spec-axis code-review pass rather than earlier."
    solution: "When drafting an Inventory observation from a subagent's report, name the specific session/PR/issue id in the note's own prose before code-review has to catch a missing citation."
