name: blog-post-skill-steps-skipped
surface: safe
summary: A blog-post run skipped a Skill step (the reaction step, the read of other Personas' newest posts) on a scope limit it invented, and the owner had to ask why.
cause: "blog-post SKILL.md steps 2 and 12 are skipped on the agent's own reading of the ask ('the owner asked for one post'), noted in the PR body or log but never put to the owner, so the owner finds the gap afterwards. Signals: 'skipped blog-post step 12', 'a scope limit I invented', 'grepping post names instead of reading the newest posts'."
status: open
fixes:
  - pr: 3329
    date: "2026-11-15"
    summary: "blog-post Steps now say run every step, skip only when the owner names it, ask if unsure"
occurrences:
  - session: session_013zxzeQnCCyBdXZDEv9qTNh
    date: "2026-11-14"
    severity: moderate
    description: "I skipped blog-post step 12 on a scope limit I invented ('the owner asked for one post'), put it in the PR body and log, and the owner had to ask why there was no reaction."
    solution: "Run step 12 on every merged post unless the owner says otherwise in their words; never state an owner limit they did not give."
  - session: session_013zxzeQTse2DhxedTzE2wcE
    date: "2026-11-14"
    severity: nit
    description: "merge-pr.ts refused PR 3312 until I posted a verdict comment; the blog-post Skill's step 11 says to follow pr-workflow from step 2 but I skipped step 4's verdict."
    solution: "The blog-post Skill's step 11 should name the verdict comment explicitly."
  - session: session_013zxzeQ65iPt7YSAHWJBs1q
    date: "2026-11-15"
    severity: minor
    description: "I ran the fact-check before code-review, against the Skill's order (commit, review, then fact-check); review then changed the post, so the checker ran twice more."
    solution: "Follow step 9's order: code-review first, then dispatch the fact-checker on the reviewed text."
  - session: session_013zxzePjedjMk4SeDKFvzPt
    date: "2026-11-17"
    severity: minor
    description: "Blog-post step 2 asks for the newest three posts of all four Personas and the last five blog( PR bodies; I listed filenames and read only David's three posts."
    solution: "Give the step a script that prints those posts and PR bodies in one call, so skipping the read costs more than doing it."
