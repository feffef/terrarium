name: rewrite-draft-keeps-old-framing
surface: safe
summary: A rewrite of an existing guide or README kept the old structure and content instead of asking what its reader needs, and only a second review or the owner found the gap.
cause: "A rewrite agent starts from the old text's order and lists (Part 1's infrastructure-first order, a Contributing list) and does not ask who reads the result and what they must be able to do. The first draft omits the reader's need (why Terrarium exists; whether an outsider can act on a list) until the owner or a second critical review raises it. Signals: 'kept the old', 'omitted why', 'owner had to point out', rewrite of README or Glass Box overview."
status: open
occurrences:
  - session: session_013zxzeRNoKQn8q3NtVRPDyk
    date: "2026-11-02"
    severity: moderate
    description: "The first overview kept Part 1's infrastructure-first order and omitted why Terrarium exists; only the owner's request for a second critical review surfaced it."
    solution: "Before shipping a page for two audiences, review it against each reader's first question; the code-review spec axis checked facts, not fit."
  - session: session_013zxzeQCoXnRxbyzhHyy3M1
    date: "2026-11-02"
    severity: minor
    description: "I kept the Contributing list from the old README without asking whether an outsider could act on it; the owner had to point out it was arbitrary"
    solution: "Apply CLAUDE.md 'question the premise' to inherited sections too: give each link a reason for the stated audience"
