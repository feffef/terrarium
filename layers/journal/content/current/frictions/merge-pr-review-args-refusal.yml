name: merge-pr-review-args-refusal
surface: guard-or-hook
summary: A code-review call made with hand-written args (no sha, or a sha that does not match the reviewed head) was refused at merge or needed a repeat review, each costing an extra review pass.
cause: "merge-pr.ts accepts a verdict only when the code-review call's args name the reviewed head sha (review-proof.ts looks for a 7-40 hex sha); a session that called code-review with bare origin/main or hand-written args was refused at merge and had to re-run review. Since PR #3591 a guard denies a call with no sha at all (see review-call-sha-guard-denial), so what remains is hand-written args whose sha does not match the head. Signals: 'merge-pr.ts refused', 'head sha', 'printed args', 'hand-written args'."
status: open
related:
  - entry: verdict-line-asserts-unchecked-review
    rule: The verdict claimed a review that never ran and merge-pr.ts accepted it; here merge-pr.ts refused and the cost was a retry.
  - entry: merge-pr-review-args-amend-after-printing
    rule: That entry is a review call whose sha went stale after an amend or rename; here the args named no sha at all.
  - entry: merge-pr-own-read-refusal
    rule: That entry is a verdict's Own-read line refused on a diff that was not simple; here the review call's args named no sha.
  - entry: review-call-sha-guard-denial
    rule: That entry is the guard's own denial of a bare-args call, one retry; here the bare args reached a review, or a hand-written sha did not match the head, and the cost was a repeat review or a refused merge.
notes: |-
  2026-11-22 ref moved from 'verdict-line-asserts-unchecked-review, fix PR #3416' (a guard refusal, not a regression of that entry) to the tracking issue #3580
  2026-11-22 split by cause: the amend-after-printing and Own-read-refusal occurrences moved to merge-pr-review-args-amend-after-printing and merge-pr-own-read-refusal; this entry keeps the bare-args slip; the 2026-11-20 Own-read design note moved with its occurrence
  2026-11-23 survey: PR #3591 merged 2026-11-22T12:10Z; status reset from tracked (issue #3580 closed). RQQo's guard denial moved to review-call-sha-guard-denial; Sxk2 (hand-written args, 2026-11-22T23:09Z, after the fix) stays here.
fixes:
  - pr: 3591
    date: "2026-11-22"
    summary: "Adds a PreToolUse guard that denies a code-review Skill call whose args hold no head sha and names verdict-line.ts --review-call; it checks only that a sha is present."
