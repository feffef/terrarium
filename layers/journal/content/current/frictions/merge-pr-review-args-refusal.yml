    date: "2026-11-20"
    severity: minor
    description: "The first merge-pr.ts run was refused: my code-review call had args 'origin/main' only; the printed call includes a '(reviewing head <sha>)' part I read as commentary."
    solution: "Paste the printed call whole; have verdict-line print the args alone on their own line so nothing looks optional."
