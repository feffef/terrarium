name: merge-pr-review-args-refusal
surface: guard-or-hook
summary: merge-pr.ts refused a verdict because the code-review call's args carried no head sha (bare origin/main), and each refusal cost an extra review pass.
cause: "merge-pr.ts accepts a verdict only when the code-review call's args name the reviewed head sha (review-proof.ts looks for a 7-40 hex sha); a session that called code-review with bare origin/main or hand-written args was refused at merge and had to re-run review. Signals: 'merge-pr.ts refused', 'head sha', 'printed args'."
status: tracked
ref: "#3580"
related:
  - entry: verdict-line-asserts-unchecked-review
    rule: The verdict claimed a review that never ran and merge-pr.ts accepted it; here merge-pr.ts refused and the cost was a retry.
  - entry: merge-pr-review-args-amend-after-printing
    rule: That entry is a review call whose sha went stale after an amend or rename; here the args named no sha at all.
  - entry: merge-pr-own-read-refusal
    rule: That entry is a verdict's Own-read line refused on a diff that was not simple; here the review call's args named no sha.
notes: |-
  2026-11-22 ref moved from 'verdict-line-asserts-unchecked-review, fix PR #3416' (a guard refusal, not a regression of that entry) to the tracking issue #3580
  2026-11-22 split by cause: the amend-after-printing and Own-read-refusal occurrences moved to merge-pr-review-args-amend-after-printing and merge-pr-own-read-refusal; this entry keeps the bare-args slip; the 2026-11-20 Own-read design note moved with its occurrence
