name: constraint-unread-before-build
surface: safe
summary: A design or build went against a rule or check that governs it, because the agent leaned on precedent or advice instead of reading the rule, and review found it.
cause: "An agent specs, designs or builds a page or feature without reading the governing rule or the full ADR first (ADR-0006: a page reads only its own Space; page-checks.ts: no guide links outside the guide; ADR-0003's per-row bounds), relying on a precedent (the Journal), another session's advice or an ADR summary; a reviewer or the check finds it after the work is built. PR #2980 (CLAUDE.md, 2026-11-08) now says to read the full ADR of each decision a plan touches before planning or designing, and the overview bullet applies to explaining the Platform. Signals: 'although ADR-0006 says', 'page-checks.ts forbids', 'leaned on the Journal', 'explained X without reading the overview'."
status: open
notes: |-
  2026-11-07 design: no change: RCJH read ADR-0006 and built the cross-Space read anyway (judgement against a rule in front of it); QUzc's page-check miss is caught mechanically by the gate. dropped: more prose would not change it; revisit on a third occurrence.
fixes:
  - pr: 2980
    date: "2026-11-08"
    summary: "CLAUDE.md gained a bullet: before you plan or design, read the full ADR of each decision the plan touches."
occurrences:
  - session: session_013zxzeRCJHe4rmKN5i2CQ16
    date: "2026-11-06"
    severity: major
    description: "Built a cross-Space read although ADR-0006 says a page reads only its own Space; I leaned on the Journal precedent and the spec session's advice."
    solution: "Treat a recommendation from another session as non-binding against an ADR; ask the owner before building anything that needs an exception."
  - session: session_013zxzeQUzcNjB7oD8ukBLGp
    date: "2026-11-06"
    severity: minor
    description: "The spec put a workshop link in the guide overview without checking page-checks.ts, which forbids guide links outside the guide; caught only by review"
    solution: "Grep the page checks for link rules before specifying a new link on a Glass Box page"
  - session: session_013zxzeNm7AawB63t1M33Hse
    date: "2026-11-08"
    severity: minor
    description: "Explained how Routines work without first reading the Glass Box overview page that CLAUDE.md requires for such explanations."
    solution: "Read layers/glassbox/content/guide/pages/index.md before answering."
  - session: session_013zxzeNd2Ethpd3anqbmpkr
    date: "2026-11-09"
    severity: minor
    description: "Drafted rule-path proposals before reading ADR-0029 and the Bash hint, though CLAUDE.md says read the full ADR before planning; its broad-paths stance reframed the advice."
    solution: "Make CLAUDE.md's plan trigger name audits and reviews of a mechanism, so the ADR is read first."
  - session: session_013zxzeSjczLUzQPWWSHP4t9
    date: "2026-11-10"
    severity: minor
    description: "Planned a session-log schema change without reading the full ADR-0009, which CLAUDE.md requires before planning; I relied on its summary rule."
    solution: "Read docs/adr/0009 before designing a schema change; the summary rule happened to cover the additive-only constraint."
  - session: session_013zxzeS36fzX6FB2vAr7yRR
    date: "2026-11-09"
    severity: nit
    description: "I only noticed ADR-0004's 'behaviour no test can observe' exception after the fix PR's gate was green, then had to add e2e assertions and a second verdict."
    solution: "Ask which test would fail if this regressed when planning each fix, before opening the PR."
  - session: session_013zxzeP1EixGDy96kmktFi2
    date: "2026-11-12"
    severity: minor
    description: "CLAUDE.md says read the full ADR before planning; most ADRs were read only after an edit hook told me, so my first glassbox-content rule ordered a read, against ADR-0029."
    solution: "Read the ADR summary rules that load at a first edit before drafting a rule or payload; the hook text arrives only after the write."
  - session: session_013zxzePXpUx7WY6K2uHsxKz
    date: "2026-11-12"
    severity: minor
    description: "Designed the homepage and the hero's Atlas payload before reading ADR-0025 and ADR-0028 in full; the path-scoped rules only loaded after the first edit (CLAUDE.md: read the ADRs a plan touches)."
    solution: "List the ADRs the home page and its payload touch in CLAUDE.md's plan trigger, or load the ADR-0025/0028 rules when index.vue is merely read."
  - session: session_013zxzeQ4cuLLoFfdaf5sE2d
    date: "2026-11-13"
    severity: minor
    description: "CLAUDE.md says read the full ADR of each decision a plan touches; I recommended changes around ADR-0004, 0009, 0017 and 0027 from lessons and rule summaries only."
    solution: "For a repo-wide assessment, have the lesson-digest agents also read the cited ADRs, or say in the output that reasons come from lessons."
