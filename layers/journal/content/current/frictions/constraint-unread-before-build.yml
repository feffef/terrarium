name: constraint-unread-before-build
surface: safe
summary: A design or build went against a rule or check that governs it, because the agent leaned on precedent or advice instead of reading the rule, and review found it.
cause: "An agent specs, designs or builds a page or feature without reading the governing rule or the full ADR first (ADR-0006: a page reads only its own Space; page-checks.ts: no guide links outside the guide; ADR-0003's per-row bounds), relying on a precedent (the Journal), another session's advice or an ADR summary; a reviewer or the check finds it after the work is built. PR #2980 (CLAUDE.md, 2026-11-08) now says to read the full ADR of each decision a plan touches before planning or designing. Signals: 'although ADR-0006 says', 'page-checks.ts forbids', 'leaned on the Journal'."
status: open
related:
  - entry: adr-read-after-edit
    rule: The ADR was read late but the edit was already right.
  - entry: governing-doc-read-after-draft
    rule: The doc was read after drafting, and a reviewer or hint found a wording or term it settles.
  - entry: human-merge-need-found-after-pr-opened
    rule: ADR-0004's untested-behaviour exception was recognised only after the PR was open.
notes: |-
  2026-11-07 design: no change: RCJH read ADR-0006 and built the cross-Space read anyway (judgement against a rule in front of it); QUzc's page-check miss is caught mechanically by the gate. dropped: more prose would not change it; revisit on a third occurrence.
fixes:
  - pr: 2980
    date: "2026-11-08"
    summary: "CLAUDE.md gained a bullet: before you plan or design, read the full ADR of each decision the plan touches."
occurrences:
  - session: session_013zxzeQ4cuLLoFfdaf5sE2d
    date: "2026-11-13"
    severity: minor
    description: "CLAUDE.md says read the full ADR of each decision a plan touches; I recommended changes around ADR-0004, 0009, 0017 and 0027 from lessons and rule summaries only."
    solution: "For a repo-wide assessment, have the lesson-digest agents also read the cited ADRs, or say in the output that reasons come from lessons."
  - session: session_013zxzeTKSiBSmkCLfn4BYL6
    date: "2026-11-20"
    severity: minor
    description: "A builder found only at gate time that ADR-0015 and a schema comment said observations are not shown, then re-stamped a rule and widened a Glass Box glob; HEAD moved after review and cost an extra re-check and gate."
    solution: "Brief builders of a new displayed value to grep every statement saying it is not shown (docs, ADRs, schema comments, Glass Box pages) before building."
