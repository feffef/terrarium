name: blocked-waiting
summary: >-
  Agents had no allowed way to wait for a long check to finish, so they kept polling.
cause: >-
  Waiting on a backgrounded gate, build or CI needs a sleep the guards deny, so sessions poll with no-op calls or shell backgrounding.
surface: guard-or-hook
status: open
ref: "issue #1499 closed 2026-10-12 by PR #1825, but #1499 is the worktree-isolation guard, not waiting; nothing tracks this cause"
notes: |-
  2026-10-20 design: a CLAUDE.md clause (end your turn; the notification wakes you) dropped: the guard denials already name the alternative, each occurrence costs a call or two, and the clause would cost words in every session.
  2026-10-25 design: no change: the five later occurrences are all nits that cost one denied call each and recovered by the denial's own message, no guard changed since 10-20, ScheduleWakeup is a harness tool we cannot hide, and the CLAUDE.md clause would still cost words in every session.
occurrences:
  - session: session_01P7kLLJwHBgCaeVSUjhbScg
    date: "2026-10-15"
    severity: minor
    description: "Polled a long-running background gate with many no-op Bash echo calls instead of simply waiting for its own completion notification, wasting turns"
    solution: "After starting a run_in_background command, stop calling tools and let the completion notification arrive rather than polling"
  - session: session_01Sr3uwZro23NY3Z4sk5ojsM
    date: "2026-10-18"
    severity: nit
    description: "Called ScheduleWakeup to wait on a running subagent instead of just ending the turn; it was blocked outright by the /loop-only tool guard (issue #814), since this is not a /loop session."
    solution: "No cost beyond one wasted tool call - the guard's error message was clear and I ended the turn correctly afterward. Remember that a dispatched Agent-tool subagent self-notifies on completion; no wait/poll tool is ever needed for it."
