name: blocked-waiting
summary: >-
  Agents tried to wait for a running check or helper by sleeping, polling or scheduling a wake-up instead of ending the turn, and guards blocked the calls or the loops wasted turns.
cause: >-
  Waiting on a backgrounded gate, build, CI run or subagent needs no tool (the completion notification wakes the session), but sessions reach for a foreground sleep (denied), ScheduleWakeup (denied outside /loop), no-op polling calls, a pgrep loop that times out, or a Monitor until-loop that matches the wrong marker or is armed twice. Signals: 'sleep was blocked', 'ScheduleWakeup', 'loop-only guard', 'Monitor until-loop', 'polled', '600s timeout'. A run_in_background call plus a trailing & is double-background.
surface: guard-or-hook
status: open
ref: "issue #1499 closed 2026-10-12 by PR #1825, but #1499 is the worktree-isolation guard, not waiting; nothing tracks this cause"
notes: |-
  2026-10-20 design: a CLAUDE.md clause (end your turn; the notification wakes you) dropped: the guard denials already name the alternative, each occurrence costs a call or two, and the clause would cost words in every session.
  2026-10-25 design: no change: the five later occurrences are all nits that cost one denied call each and recovered by the denial's own message, no guard changed since 10-20, ScheduleWakeup is a harness tool we cannot hide, and the CLAUDE.md clause would still cost words in every session.
fixes:
  - pr: 2697
    date: "2026-10-30"
    summary: "CLAUDE.md: in the main session end your turn and let the completion notification wake you; never wait with pgrep -f"
