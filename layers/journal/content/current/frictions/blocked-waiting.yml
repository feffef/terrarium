name: blocked-waiting
summary: >-
  Agents had no allowed way to wait for a long check to finish, so they kept polling.
cause: >-
  Waiting on a backgrounded gate, build or CI needs a sleep the guards deny, so sessions poll with no-op calls or shell backgrounding.
surface: guard-or-hook
status: open
ref: "issue #1499 closed 2026-10-12 by PR #1825, but #1499 is the worktree-isolation guard, not waiting; nothing tracks this cause"
occurrences:
  - session: session_01P7kLLJwHBgCaeVSUjhbScg
    date: "2026-10-15"
    severity: minor
    description: "Polled a long-running background gate with many no-op Bash echo calls instead of simply waiting for its own completion notification, wasting turns"
    solution: "After starting a run_in_background command, stop calling tools and let the completion notification arrive rather than polling"
  - session: session_01Sr3uwZro23NY3Z4sk5ojsM
    date: "2026-10-18"
    severity: nit
    description: "Called ScheduleWakeup to wait on a running subagent instead of just ending the turn; it was blocked outright by the /loop-only tool guard (issue #814), since this is not a /loop session."
    solution: "No cost beyond one wasted tool call - the guard's error message was clear and I ended the turn correctly afterward. Remember that a dispatched Agent-tool subagent self-notifies on completion; no wait/poll tool is ever needed for it."
  - session: session_01Ai3w5epHj4PWgBC8XSoEwz
    date: "2026-10-18"
    severity: nit
    description: "Tried ScheduleWakeup and a foreground sleep to wait for visitors; both were blocked by guards, wasting two calls."
    solution: "Visitor-loop step 2 could say: subagents self-notify, end the turn and wait."
  - session: session_0183U5MkKrjuhRKdjpFxD9Xj
    date: "2026-10-19"
    severity: nit
    description: "Monitor until-loop matched an early tool-use name and ended before the agent finished; foreground sleep was also blocked."
    solution: "Match only the final-message shape; poll from the first attempt."
  - session: session_011G3PKUqDog2WRSuqypmuJX
    date: "2026-10-20"
    severity: nit
    description: "ScheduleWakeup was blocked by the loop-only guard; the tool list offers it outside /loop."
    solution: "Hide ScheduleWakeup outside /loop sessions."
  - session: session_012XnetQuxWoyaVFYw1BqMoy
    date: "2026-10-20"
    severity: nit
    description: "Tried a foreground sleep to wait for agents, then a run_in_background command that also used a trailing ampersand; both were blocked by guards."
    solution: "The tool descriptions already say not to; waiting for agent notifications needs no polling."
  - session: session_011W3gVNQAR433FiJcPAAEDK
    date: "2026-10-20"
    severity: nit
    description: "A foreground pgrep wait loop for the background gate hit the 600s timeout and was moved to background; the gate's completion notification would have sufficed."
    solution: "Wait for the background task notification instead of polling."
