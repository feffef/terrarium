name: closure-not-invoked-on-answers
summary: >-
  Agents that only answered a question forgot to write their session log, and the user had to ask whether it was done.
cause: >-
  CLAUDE.md asks for close-session when a session only answers a question, or when its work is done without a PR; the session waits for a follow-up or the end instead, and the user has to ask whether it was logged. Signals: 'did not invoke close-session after answering', 'the user had to ask "Logged?"', no PR in the session.
surface: safe
status: open
ref: "Issue #2209 closed 2026-10-17: the owner left the answer-only half out of scope of PR #2217, and PR #2381 kept it out."
fixes:
  - pr: 1801
    date: "2026-10-12"
    summary: "Added a CLAUDE.md rule to run close-session when a session only answers a question."
occurrences:
  - session: session_018pjaBqTXahmE3DFhAbkide
    date: "2026-10-16"
    severity: nit
    description: "Did not invoke close-session after the earlier answer-only turns, as CLAUDE.md asks when a session only answers a question."
    solution: "Log after the first answered question; re-invoking later is cheap."
  - session: session_01CBVi4qZ2RqPhfHeHPYrkwD
    date: "2026-10-19"
    severity: minor
    description: "Did not invoke close-session after the first two answers, though CLAUDE.md asks for it when a session only answers a question."
    solution: "Invoke close-session at the end of each answer turn; re-invoking is cheap."
  - session: session_019SNgYeofJtzoLvh8QNAwYD
    date: "2026-10-23"
    severity: nit
    description: "Answered the first two research questions without invoking close-session, which CLAUDE.md asks for when a session only answers a question."
    solution: "Invoke close-session after a question-only turn; logging self-heals so early logging is free."
