name: glassbox-curate-run-cost
surface: safe
summary: A glassbox-curate run's subagent fan-out spends most of the session budget.
cause: "glassbox-curate dispatches writers, checkers and fresh readers per page, each brief repeating standing instructions and rereading the same pages; signal: get_session cost near the session budget after a curate run (SKTB, 19.20 of 20 dollars)."
status: open
notes: |-
  2026-11-11 design: shared boilerplate file dropped: SKTB stayed inside its budget after the owner widened it, boilerplate is not the main cost, and #2992 holds the check of the Scout step.
  2026-11-14 design: no change: a script flag for pages whose cited file changed only outside the cited lines. dropped: no second occurrence behind it; #2987, #2992, #3170 closed.
occurrences:
  - session: session_013zxzeSKTBjSfYnUxNHTJw1
    date: "2026-11-09"
    severity: moderate
    description: "Each subagent brief repeated the same standing instructions, and the fan-out (16 subagent spawns, 6 resumes, per the transcript) took the session to 19.20 dollars of a 20 dollar budget (get_session)."
    solution: "Keep the writer, checker and reader boilerplate in one file under the glassbox-curate Skill folder and point each brief to it."
  - session: session_013zxzeShUkKqUQT1kYCw5UK
    date: "2026-11-07"
    severity: minor
    description: "The step-1 report listed 30 pages with 20 distinct changed files; briefing four agents to re-read pages whose only change was a one-line hook entry cost about 600k subagent tokens and found no false claim."
    solution: "Let the script drop a flag when a page cites a file only for lines the diff did not touch (it already shifts lines ranges), so a scoped check starts from real overlaps."
