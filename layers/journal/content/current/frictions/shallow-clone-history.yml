name: shallow-clone-history
summary: >-
  The repository's history was cut short at startup, so history lookups gave wrong answers.
cause: >-
  The SessionStart unshallow hook ran beside pnpm install and failed ("tsx not found"), so the clone stayed shallow and history reads (git log, merge-base) were truncated.
surface: guard-or-hook
status: open
ref: "issue #1835; PR #1840 (unshallow after pnpm install)"
fixes:
  - pr: 1840
    date: "2026-10-12"
    summary: "The history-unshallow step now runs after dependencies install, instead of in parallel where it failed."
occurrences:
  - session: session_01SZwdbK8GbYtyj926UyJT6o
    date: "2026-10-12"
    severity: moderate
    description: "Dispatched 14 triage agents on a shallow clone (107 commits); git-conventions says unshallow before trusting history, and two agents reported truncated git log results"
    solution: "Check git rev-parse --is-shallow-repository before any history-dependent dispatch; clear-backlog/auto-triage could say so; the SessionStart hook errored (tsx not found) which likely skipped unshallow-on-start"
  - session: session_01La82mxqduxHnRS9jRfNHmU
    date: "2026-10-12"
    severity: minor
    description: "SessionStart hook errored (tsx not found) and the clone started shallow again; unshallow-on-start likely skipped"
    solution: "Make the SessionStart hook install deps before running tsx scripts, or order them so tsx exists"
