name: scratchpad-script-cant-import-repo-deps
summary: >-
  A quick throwaway script outside the repo could not use the project's libraries or top-level await.
cause: "A throwaway tsx script outside the repo resolves modules from its own directory, so `import 'yaml'` or playwright-core fails, and a .ts file there runs as CommonJS, so top-level await fails; .throwaway/ (PR #2273) resolves the repo's node_modules, and .mts runs as ESM. Signals: 'cannot find module', 'scratchpad .ts is CJS', 'top-level await', renamed to .mts."
surface: safe
status: open
ref: "issue #2266 closed by PR #2273"
fixes:
  - pr: 1920
    date: "2026-10-14"
    summary: "Added a note that throwaway scripts need NODE_PATH set, or an absolute import, to use repo libraries."
  - pr: 2273
    date: "2026-10-19"
    summary: "Added a git-ignored .throwaway/ folder whose scripts resolve the repo's node_modules, with a CLAUDE.md line pointing to it."
occurrences:
  - session: session_01RKUs8JUM5uASMfiE3hvXRA
    date: "2026-10-16"
    severity: minor
    description: "First Playwright script failed twice: scratchpad .ts is CJS under tsx, and playwright-core would not resolve from outside the repo."
    solution: "The Skill could point at scripts/probe.ts first, or the doc could say scratchpad scripts need .mts plus absolute imports."
  - session: session_01CXxyUmwkN3Rx5DTSK2s391
    date: "2026-10-17"
    severity: nit
    description: "A Playwright script with top-level await in a .ts file failed under tsx (cjs); renamed to .mts."
    solution: "Mention in verifying-ui-changes.md that hand-rolled scripts use .mts."
  - session: session_01GfmoxeLwrvC7CARuaBAXfB
    date: "2026-10-18"
    severity: nit
    description: "The scratchpad cannot resolve node modules, so the migration script failed once and needed a temporary copy in the repo root."
    solution: "Note in environment-caveats that one-off tsx scripts must run from the repo."
