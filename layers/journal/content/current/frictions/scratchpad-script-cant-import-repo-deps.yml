    date: "2026-10-13"
    severity: nit
    description: "A throwaway tsx script in the scratchpad could not import 'yaml' (module resolution is from the script's dir), so I copied it into scripts/ temporarily."
    solution: "Run ad-hoc scans with node -e from the repo root, or a short note in environment-caveats that scratchpad scripts don't resolve repo deps."
