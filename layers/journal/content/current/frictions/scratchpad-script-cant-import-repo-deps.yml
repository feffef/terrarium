name: scratchpad-script-cant-import-repo-deps
summary: >-
  A quick throwaway script could not use the project's libraries, and no doc says how.
cause: A throwaway tsx script in the scratchpad resolves modules from its own directory, so `import 'yaml'` fails; no doc says to set NODE_PATH or import by absolute path.
surface: safe
status: open
fixes:
  - pr: 1920
    date: "2026-10-14"
    summary: "Added a note that throwaway scripts need NODE_PATH set, or an absolute import, to use repo libraries."
occurrences:
  - session: session_01QUhfMeVRZg7NX654bv5ZE5
    date: "2026-10-13"
    severity: nit
    description: "A throwaway tsx script in the scratchpad could not import 'yaml' (module resolution is from the script's dir), so I copied it into scripts/ temporarily."
    solution: "Run ad-hoc scans with node -e from the repo root, or a short note in environment-caveats that scratchpad scripts don't resolve repo deps."
  - session: session_01WUDXJjhrM6uHf9Sjjvw2N9
    date: "2026-10-13"
    severity: nit
    description: "Scratch analysis script failed: yaml package not resolvable from the scratchpad, needed an absolute import path"
    solution: "Import /home/user/terrarium/node_modules/yaml directly, or run scripts via tsx from the repo root"
  - session: session_01RKUs8JUM5uASMfiE3hvXRA
    date: "2026-10-16"
    severity: minor
    description: "First Playwright script failed twice: scratchpad .ts is CJS under tsx, and playwright-core would not resolve from outside the repo."
    solution: "The Skill could point at scripts/probe.ts first, or the doc could say scratchpad scripts need .mts plus absolute imports."
