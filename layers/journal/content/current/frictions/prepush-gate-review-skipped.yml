name: prepush-gate-review-skipped
summary: >-
  Agents skipped the required code review before a branch's first push, or gave a change their own read when it was not simple.
cause: >-
  ADR-0004 and pr-workflow.md ask for the code-review Skill before a branch's first push (and on a larger follow-up), allowing only a simple change (at most 10 lines in 2 files) the author's own read; sessions judge a small, prose, ledger, test or follow-up diff simple without counting it, self-review instead, or review only after pushing. Signals: 'skipped the code-review Skill', 'pushed before running gate:scoped and code-review', 'reviewed inline', 'self-reviewed', 'simple-change bar', 'without a fresh code-review', code-review run after the first push. A gate:scoped run that did not test the final head belongs to edit-during-gate-run.
surface: guard-or-hook
status: on-trial
ref: "Prune Trial opened 2026-10-22 by PR #2412 (territory: docs/agents/pr-workflow.md (all of it); keywords 'Review before the first push', 'simple change'). Earlier: issue #2311 closed by PR #2319, reversed by PR #2321. Left open: pr-workflow.md and ADR-0004 must still agree on the review skip. code-review is in skills-lock.json (ADR-0015): a note on the Skill itself belongs in its Skill Inventory entry (audit-skills)."
fixes:
  - pr: 1852
    date: "2026-10-12"
    summary: "clear-backlog runs the full code-review Skill on every branch and opens the PR only once review is done."
  - pr: 1853
    date: "2026-10-12"
    summary: "pr-workflow.md asks for code-review before every branch's first push, and build agents hand back unpushed branches for review."
  - pr: 1854
    date: "2026-10-12"
    summary: "The safety-gate rule now requires review before the first push; prose-only follow-ups may rely on CI."
  - pr: 2319
    date: "2026-10-20"
    summary: "ADR-0004 let a prose-, docs- or content-only first push skip code-review (reversed by #2321)."
  - pr: 2321
    date: "2026-10-20"
    summary: "ADR-0004 now reviews Skills and docs like code; only a simple change (typo, rewrap, link, restamp, or at most 10 lines in 2 files) gets the author's own read."
  - pr: 2412
    date: "2026-10-22"
    summary: "pr-workflow.md reworded plainly (-3 net) with one line added (count, don't judge a simple change), and a Prune Trial opened."
