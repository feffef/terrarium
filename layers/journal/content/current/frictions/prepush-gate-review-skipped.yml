name: prepush-gate-review-skipped
summary: >-
  Agents skipped the required code review before a branch's first push, or gave a change their own read when it was not simple.
cause: >-
  ADR-0004 and pr-workflow.md ask for the code-review Skill before a branch's first push (and on a larger follow-up), allowing only a simple change (at most 10 lines in 2 files, adding, renaming or moving no file since PR #2638) the author's own read; sessions judge a small, prose, ledger, test or follow-up diff simple without counting it, self-review instead, or review only after pushing. Signals: 'skipped the code-review Skill', 'pushed before running gate:scoped and code-review', 'reviewed inline', 'self-reviewed', 'simple-change bar', 'without a fresh code-review', code-review run after the first push. A gate:scoped run that did not test the final head belongs to edit-during-gate-run.
surface: guard-or-hook
status: accepted
ref: "Issue #2748 (first-push code-review skipped again after #2638) closed not planned 2026-11-01: the owner declines a further fix."
notes: |-
  2026-10-28 survey: the PR #2412 Prune Trial is no longer in .agents/prune-trials.yml (judged and deleted by the 2026-10-27 prune run), so the entry is no longer on trial; issue #2472 (regression of #2407) is open.
  2026-10-29 survey: issue #2472 closed by PR #2638 (merged 2026-10-28), which recorded as a fix here.
  2026-11-02 survey: set accepted after issue #2748 closed not planned; session_013zxzeSgWhesrfA7R1JBnhE (escalation PR, one rule line) is the newest occurrence.
fixes:
  - pr: 1852
    date: "2026-10-12"
    summary: "clear-backlog runs the full code-review Skill on every branch and opens the PR only once review is done."
  - pr: 1853
    date: "2026-10-12"
    summary: "pr-workflow.md asks for code-review before every branch's first push, and build agents hand back unpushed branches for review."
  - pr: 1854
    date: "2026-10-12"
    summary: "The safety-gate rule now requires review before the first push; prose-only follow-ups may rely on CI."
  - pr: 2319
    date: "2026-10-20"
    summary: "ADR-0004 let a prose-, docs- or content-only first push skip code-review (reversed by #2321)."
  - pr: 2321
    date: "2026-10-20"
    summary: "ADR-0004 now reviews Skills and docs like code; only a simple change (typo, rewrap, link, restamp, or at most 10 lines in 2 files) gets the author's own read."
  - pr: 2412
    date: "2026-10-22"
    summary: "pr-workflow.md reworded plainly (-3 net) with one line added (count, don't judge a simple change), and a Prune Trial opened."
  - pr: 2638
    date: "2026-10-28"
    summary: "pr-workflow.md's simple-change bar now says a simple change adds, renames or moves no file, so a rename sweep gets code-review before its first push."
