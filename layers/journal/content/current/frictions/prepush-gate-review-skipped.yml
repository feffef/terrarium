name: prepush-gate-review-skipped
summary: >-
  Agents pushed changes without running the required checks and review first.
cause: >-
  ADR-0004's before-first-push gate:scoped plus code-review is skipped or the gate is not rerun after late edits.
surface: guard-or-hook
status: on-trial
ref: "Prune Trial opened 2026-10-22 by PR #2412 (territory: docs/agents/pr-workflow.md (all of it); keywords 'Review before the first push', 'simple change'). Issue #2397 (regression of #2359) closed by PR #2407. Issue #2354 closed by PR #2359, a doc rule with no guard. Earlier: issue #2311 closed by PR #2319, reversed by PR #2321. Left open: pr-workflow.md and ADR-0004 must still agree on the review skip."
fixes:
  - pr: 1852
    date: "2026-10-12"
    summary: "clear-backlog runs the full code-review Skill on every branch and opens the PR only once review is done."
  - pr: 1853
    date: "2026-10-12"
    summary: "pr-workflow.md asks for code-review before every branch's first push, and build agents hand back unpushed branches for review."
  - pr: 2314
    date: "2026-10-20"
    summary: "pr-workflow.md now runs the gate last, on the final head, after code-review and its fixes."
  - pr: 2319
    date: "2026-10-20"
    summary: "ADR-0004 let a prose-, docs- or content-only first push skip code-review (reversed by #2321)."
  - pr: 2321
    date: "2026-10-20"
    summary: "ADR-0004 now reviews Skills and docs like code; only a simple change (typo, rewrap, link, restamp, or at most 10 lines in 2 files) gets the author's own read."
  - pr: 2359
    date: "2026-10-21"
    summary: "git-conventions.md's rule against chaining a push after a gate run now covers foreground runs too, and says to read the exit status in a separate step first (doc only; no guard or hook)."
  - pr: 2407
    date: "2026-10-22"
    summary: "git-conventions.md's chaining rule now forbids a push or other state-changing git only when it comes later in the same command as a gate or test run."
  - pr: 2412
    date: "2026-10-22"
    summary: "pr-workflow.md reworded plainly (-3 net) with one line added (count, don't judge a simple change), and a Prune Trial opened."
occurrences:
  - session: session_011t1xXHxqwrfAjt83s9oTEP
    date: "2026-10-15"
    severity: minor
    description: "Pushed follow-up branch for PR #2088 before running gate:scoped and code-review, which ADR-0004 asks for before a first push."
    solution: "Treat a branch restarted after merge as a first push; run gate:scoped before git push. It passed afterwards."
  - session: session_01NqN7omu3o4kxoGeQzzSXhK
    date: "2026-10-15"
    severity: minor
    description: "Committed small wording fixes on the 2029 and 2071 worktrees after their gate ran and pushed without rerunning gate:scoped (validate-adr-rules only); the nuxt.config.ts edit is a comment in a code file"
    solution: "Run pnpm validate:content or gate:scoped for any non-doc follow-up, even a comment"
  - session: session_01JkzKjuQD4wH34MjxMjKHaX
    date: "2026-10-14"
    severity: nit
    description: "Pushed the prototype branch without pnpm gate:scoped, code-review or reading pr-workflow.md (ADR-0004, CLAUDE.md read-first). Low impact: Markdown on a never-merged branch."
    solution: "Same exception as above: state that never-merged prototype branches skip the pre-push steps."
  - session: session_01GG85r8HWMEdaMgKUaNUZH7
    date: "2026-10-14"
    severity: minor
    description: "Content PRs got a content review by subagent instead of the code-review Skill before their first push"
    solution: "Have pr-workflow name content review as the review for content-only Glass Box PRs, or run code-review too"
  - session: session_01VPNHf6qDdJPXX23GghKs74
