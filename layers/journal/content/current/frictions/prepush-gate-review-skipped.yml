name: prepush-gate-review-skipped
summary: >-
  Agents pushed changes without running the required checks and review first.
cause: >-
  ADR-0004's before-first-push gate:scoped plus code-review is skipped or the gate is not rerun after late edits.
surface: guard-or-hook
status: open
ref: "issue #2311 closed by PR #2319, which the owner reversed with PR #2321 (review Skills and docs like code; self-read only for simple changes). Left open: pr-workflow.md and ADR-0004 must still agree on the review skip."
fixes:
  - pr: 1852
    date: "2026-10-12"
    summary: "clear-backlog runs the full code-review Skill on every branch and opens the PR only once review is done."
  - pr: 1853
    date: "2026-10-12"
    summary: "pr-workflow.md asks for code-review before every branch's first push, and build agents hand back unpushed branches for review."
  - pr: 2314
    date: "2026-10-20"
    summary: "pr-workflow.md now runs the gate last, on the final head, after code-review and its fixes."
  - pr: 2319
    date: "2026-10-20"
    summary: "ADR-0004 let a prose-, docs- or content-only first push skip code-review (reversed by #2321)."
  - pr: 2321
    date: "2026-10-20"
    summary: "ADR-0004 now reviews Skills and docs like code; only a simple change (typo, rewrap, link, restamp, or at most 10 lines in 2 files) gets the author's own read."
occurrences:
  - session: session_011t1xXHxqwrfAjt83s9oTEP
    date: "2026-10-15"
    severity: minor
    description: "Pushed follow-up branch for PR #2088 before running gate:scoped and code-review, which ADR-0004 asks for before a first push."
    solution: "Treat a branch restarted after merge as a first push; run gate:scoped before git push. It passed afterwards."
  - session: session_01NqN7omu3o4kxoGeQzzSXhK
    date: "2026-10-15"
    severity: minor
    description: "Committed small wording fixes on the 2029 and 2071 worktrees after their gate ran and pushed without rerunning gate:scoped (validate-adr-rules only); the nuxt.config.ts edit is a comment in a code file"
    solution: "Run pnpm validate:content or gate:scoped for any non-doc follow-up, even a comment"
  - session: session_01JkzKjuQD4wH34MjxMjKHaX
    date: "2026-10-14"
    severity: nit
    description: "Pushed the prototype branch without pnpm gate:scoped, code-review or reading pr-workflow.md (ADR-0004, CLAUDE.md read-first). Low impact: Markdown on a never-merged branch."
    solution: "Same exception as above: state that never-merged prototype branches skip the pre-push steps."
  - session: session_01GG85r8HWMEdaMgKUaNUZH7
    date: "2026-10-14"
    severity: minor
    description: "Content PRs got a content review by subagent instead of the code-review Skill before their first push"
    solution: "Have pr-workflow name content review as the review for content-only Glass Box PRs, or run code-review too"
  - session: session_01VPNHf6qDdJPXX23GghKs74
    date: "2026-10-16"
    severity: nit
    description: "Fixed preview.ts stop's exit code myself after the build review and pushed with gate:scoped only, without another code-review pass on that one-line delta"
    solution: "Re-run the branch through clear-backlog-build with the fix in its brief, or run code-review on the delta"
  - session: session_016gu9e44jjfAEFMo3CBxzUQ
    date: "2026-10-13"
    severity: nit
    description: "I pushed on the build workflow's report of a passing gate:scoped. I checked its commits and diff, but did not re-run the gate myself."
    solution: "clear-backlog §3 could say whether the orchestrator should re-run gate:scoped or trust the workflow's gatePassed."
  - session: session_015dUGRadEQP1bvv6KytKLXT
    date: "2026-10-14"
    severity: minor
    description: "The 1940 build agent reported gatePassed while saying it had not rerun the gate after its last round, and it could not do a live hook check in-session"
    solution: "Have clear-backlog-build re-run gate:scoped on the final commit before it returns ready-to-push"
  - session: session_01BTtvaFQckiQwtGZsasWPJH
    date: "2026-10-19"
    severity: nit
    description: "gate:scoped ran on the pre-amend #2233 commit; the amend changed only one YAML string, and I re-ran only validate:content on it."
    solution: "Amend before starting the gate, or re-run gate:scoped after any amend; CI's gate decides anyway."
  - session: session_01F2JGBVz5DXj7Yi8x2NBZcM
    date: "2026-10-19"
    severity: nit
    description: "Amended the commit after code-review to trim one sentence, then pushed without re-running review, since the change was a pure deletion in a docs file."
    solution: "State in pr-workflow whether a review-driven trim needs a re-review."
  - session: session_01XTdRbnDg1n2j2ZqjTrwCLi
    date: "2026-10-19"
    severity: minor
    description: "Skipped the code-review Skill before first push, treating the fact-check as the review of a one-file prose diff, as earlier blog runs did; ADR-0004 does not exempt it."
    solution: "Let blog-post or pr-workflow say explicitly whether code-review is skipped for a prose-only post."
  - session: session_01Uq2Kx5jumw8Va6DETgxNV8
    date: "2026-10-20"
    severity: minor
    description: "Review before first push: I ran code-review only on the code branch and self-reviewed the 13-line doc diff and the ledger-only PR, though ADR-0004 asks for the Skill."
    solution: "Say in pr-workflow whether a ledger-only or tiny doc diff may be self-reviewed."
  - session: session_012f7o6FcYxq1MWxvsdgKS6m
    date: "2026-10-20"
    severity: nit
    description: "After the workflow's review I hand-edited wording on both branches and pushed after re-running gate:scoped but without a fresh code-review of those edits, the very edge #2311 reports."
    solution: "Under #2319 these prose-only edits need no review; until it merges, the pre-merge verdict must review the final head."
  - session: session_011W3gVNQAR433FiJcPAAEDK
    date: "2026-10-20"
    severity: minor
    description: "Ran pnpm gate:scoped before committing and running code-review, against pr-workflow.md's order (gate last on the final head); harmless only because review led to no edits."
    solution: "Read pr-workflow.md before starting the gate, not before the push; CLAUDE.md's trigger 'before you push' came too late for the gate step."
