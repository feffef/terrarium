    date: "2026-11-16"
    severity: nit
    description: "Piped the first log-session --author output through head, which close-session forbids; I re-ran it unfiltered and found no warning."
    solution: "Print the run's output through a tool that cannot truncate, or have log-session --author refuse a piped stdout."
