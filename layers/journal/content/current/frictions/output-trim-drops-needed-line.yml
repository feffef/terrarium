name: output-trim-drops-needed-line
summary: >-
  An agent trimmed or filtered a command's output (tail, head, grep) and lost the line it needed.
cause: >-
  A command's output is piped to tail -N, head -N or grep assuming the wanted line (a PID, a path, a section, a status) is in what is kept, but the script prints it elsewhere or the filter hides a failure; later commands get garbage args, work from a truncated report, or the agent reports success it did not see. The old tail-pipe guard is gone (tail-pipe-guard). Signals: 'tail -3 dropped', 'tail -1 assuming it prints only its path', 'filtered through grep, which hid', 'head -300 truncated'.
surface: safe
status: tracked
ref: "issue #2884 (log-session --author piped through grep; covers the grep occurrence only)"
fixes:
  - pr: 2534
    date: "2026-10-25"
    summary: "inspect-session SKILL.md now says outline.ts prints its path with the line count, then a coverage line, not only the path."
occurrences:
