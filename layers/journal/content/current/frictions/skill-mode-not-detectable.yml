name: skill-mode-not-detectable
surface: safe
summary: A Skill that branches on interactive versus scheduled mode gave no way to tell which, so the agent spent a question on it.
cause: "Skills that say 'in interactive mode, ask' (glassbox-curate, glassbox-update) were invoked with no sign of whether a person or a Routine started the run, so the agent asked which mode applies. PR #2973 (2026-11-08) made glassbox-curate name the sign (the 'Fired by routine' reminder); glassbox-update's mode paragraph is not changed. Signals: 'no way to tell the mode', 'carried no sign of whether a person or a Routine started the run'."
status: open
fixes:
  - pr: 2973
    date: "2026-11-08"
    summary: "glassbox-curate Modes paragraph defines Autonomous by the first message's 'Fired by routine' system-reminder, so a Routine-fired run is always autonomous."
occurrences:
  - session: session_013zxzeRwjiiLkjj6sQ3u49g
    date: "2026-11-07"
    severity: nit
    description: "Skill says ask for a focus in interactive mode but gives no way to tell the mode when invoked; I asked the user."
    solution: "State in the Skill how to tell a Routine run from a person's."
  - session: session_013zxzeNqe2cXhykGMMq7vUi
    date: "2026-11-07"
    severity: minor
    description: "The invocation carried no sign of whether a person or a Routine started the run, so I spent a question round trip on the mode."
    solution: "Have orient.ts print how the run was started, or default to autonomous when nothing says otherwise."
  - session: session_013zxzeQwU4eYGrEvV8x42ts
    date: "2026-11-08"
    severity: minor
    description: "The 2962 triage pick (the Routine's prompt says autonomous) rested on an unverified signal; the investigation I ordered afterwards found the real one, so the first question gave the owner a weaker option."
    solution: "In clear-backlog explore, make the triage agent verify an unverified signal before it becomes a pick, or label the pick unverified in the question."
