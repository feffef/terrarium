name: bare-cd-moves-session-cwd
summary: A cd in the main agent's shell, alone or inside a compound command, moved its working directory for every later call, so relative paths and git commands ran in the wrong place.
cause: "In the primary session the Bash tool keeps the working directory between calls, so any cd (a bare one, or one chained inside a compound command) into a worktree, the frictions folder, .agents/skills or node_modules persists: later relative paths fail, git or merge-pr runs in the wrong checkout, removing a worktree leaves the shell in a deleted directory, and parallel Bash calls that cd race on the shared directory (a commit pushed to the wrong branch). Signals: 'a cd into', 'chained cd', 'moved the primary working directory', 'had to cd back', 'deleted directory', parallel calls landing in the wrong checkout."
surface: safe
status: open
ref: "fix PR #2507 merged 2026-10-25"
notes: |-
  2026-10-21 design: a hint or guard on a bare cd, or a reworded cd line in docs, dropped: our own briefs tell sessions to run cd <root> &&, so a guard would flag recommended usage; the harness flags the drift and recovery is one cd. Note for any later edit of dispatch-subagents §3 (open trial territory): its claim that the Bash tool resets cwd between calls is wrong for the primary session.
fixes:
  - pr: 2507
    date: "2026-10-25"
    summary: "dispatch-subagents §3 and clear-backlog-build.js now say run git as git -C <worktree-root>, never cd: the Bash tool keeps its cwd and parallel calls share it."
