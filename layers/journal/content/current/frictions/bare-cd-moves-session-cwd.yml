name: bare-cd-moves-session-cwd
summary: A plain cd in the main agent's shell moved its working directory for every later command, so relative paths and git commands ran in the wrong place.
cause: "In the primary session the Bash tool keeps the working directory between calls, so a bare cd (into a worktree, the frictions folder, .agents/skills, node_modules) persists: later relative paths fail, git or merge-pr runs in the wrong checkout, and removing a worktree leaves the shell in a deleted directory. Signals: 'a cd into', 'moved the primary working directory', 'had to cd back', 'deleted directory'."
surface: safe
status: open
ref: "fix PR #2507 merged 2026-10-25"
notes: |-
  2026-10-21 design: a hint or guard on a bare cd, or a reworded cd line in docs, dropped: our own briefs tell sessions to run cd <root> &&, so a guard would flag recommended usage; the harness flags the drift and recovery is one cd. Note for any later edit of dispatch-subagents §3 (open trial territory): its claim that the Bash tool resets cwd between calls is wrong for the primary session.
fixes:
  - pr: 2507
    date: "2026-10-25"
    summary: "dispatch-subagents §3 and clear-backlog-build.js now say run git as git -C <worktree-root>, never cd: the Bash tool keeps its cwd and parallel calls share it."
