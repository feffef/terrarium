name: relayed-subagent-claims
summary: >-
  Agents passed on a helper agent's or another session's claim or count as fact without checking it.
cause: >-
  A subagent's report, a triage agent's pick or another session's claim (an earlier note, a run log) is relayed into chat, an issue, a brief or the ledger as fact, unchecked against the source. PR #2736 (2026-10-31) makes subagents give a source per count, id or attribution, but the main session's own relaying of a note into an issue is not covered. Signals: 'relayed', 'subagent's count', 'the survey subagent stated', 'repeating the agent's claim', 'trusting an earlier note'.
surface: safe
status: accepted
ref: "Issue #2751: the owner accepted the cost on 2026-11-01 (clear-backlog grilling); recent occurrences are minor or nit and caught before shipping."
notes: |-
  2026-10-30 survey: issue #2657 closed by PR #2670 (recorded in fixes); status reset to open.
fixes:
  - pr: 2336
    date: "2026-10-20"
    summary: "CLAUDE.md \"Verify before you state\" now names subagent reports, script behaviour from recall, \"only\"/\"every\"/\"nothing\" claims and one-test causes; \"One home per fact\" says to grep for other statements when changing one."
  - pr: 2378
    date: "2026-10-21"
    summary: "Restored the shorter \"Verify before you state\" bullet in CLAUDE.md, and the Standards reviewer in clear-backlog-build now flags a count or subagent claim that cites no source."
  - pr: 2485
    date: "2026-10-24"
    summary: "Made each triage side finding in clear-backlog-explore carry a required source (file:line, SHA, URL or 'unverified' plus what would verify it)."
  - pr: 2670
    date: "2026-10-29"
    summary: "dispatch-subagents again tells the dispatcher to re-check a subagent's factual or attribution claims against their cited source before they ship."
  - pr: 2736
    date: "2026-10-31"
    summary: "CLAUDE.md and the clear-backlog workflows' shared brief line ask each subagent to give every count, id or attribution with its source (command or file:line) or mark it unverified."
