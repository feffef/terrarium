name: relayed-subagent-claims
summary: >-
  Agents passed on a helper agent's or another session's claim or count as fact without checking it.
cause: >-
  A subagent's report, a triage agent's pick or another session's claim is relayed into chat, an issue, a brief or the ledger as fact, unchecked against the source. Signals: "relayed", "subagent's count", "the survey subagent stated", "repeating the agent's claim".
surface: safe
status: tracked
ref: "issue #2503 (regression of #2485)"
fixes:
  - pr: 2336
    date: "2026-10-20"
    summary: "CLAUDE.md \"Verify before you state\" now names subagent reports, script behaviour from recall, \"only\"/\"every\"/\"nothing\" claims and one-test causes; \"One home per fact\" says to grep for other statements when changing one."
  - pr: 2378
    date: "2026-10-21"
    summary: "Restored the shorter \"Verify before you state\" bullet in CLAUDE.md, and the Standards reviewer in clear-backlog-build now flags a count or subagent claim that cites no source."
  - pr: 2485
    date: "2026-10-24"
    summary: "Made each triage side finding in clear-backlog-explore carry a required source (file:line, SHA, URL or 'unverified' plus what would verify it)."
occurrences:
  - session: session_01CasnQoauTyLNUxd74agJsP
    date: "2026-10-11"
    severity: minor
    description: "Triage subagent for #1752 posted a wrong claim then edited its comment, and the #1770 agent's Verified section overstated that referenced issues were read; I relayed both without checking the comments."
    solution: "Verify each triage comment's Verified section against the issue before reporting, or brief agents to read every cited issue."
  - session: session_01V3bxJaTSH8AWjrtSoBhNxK
    date: "2026-10-11"
    severity: moderate
    description: "Broke CLAUDE.md 'Verify before you state' — my first answer relayed subagent counts (about 35 fixes, about 210 papercut frictions, three guards removed) without checking each; the ADR-0017 change was an amendment, not a guard removal."
    solution: "Mark subagent-derived counts as approximate or recount them from the extract before stating them."
  - session: session_01LtYEkEsZ2cxf4uRFJvq4n9
    date: "2026-10-12"
    severity: minor
    description: "Ledger occurrences were appended from the subagent's tally and I reviewed only the diff, not each session id against the logs, so the counts rest on one agent's reading."
    solution: "Have the survey write the ledger changes via a script reading the logs, so the PR reviewer can re-run it."
  - session: session_01596W4GVWwvN1kfaHsV4ax8
    date: "2026-10-12"
    severity: nit
    description: "I relayed subagent claims (for example the #1818 cause) without re-checking them against the source myself."
    solution: "Spot-check one claim per hand-back, or have briefs require cited lines."
  - session: session_017NBxJhtBSd9AoCwTzsg6pM
    date: "2026-10-12"
    severity: moderate
    description: "#1834's premise (a missing commit trailer) came from an earlier subagent's guess relayed unchecked; it cost a triage plus an investigation."
    solution: "Verify subagent causal claims against the transcript before filing them as issues (CLAUDE.md 'Verify before you state')."
  - session: session_01E2zbWEQmuUrEhWvbzNpBba
    date: "2026-10-15"
    severity: minor
    description: "The harvest's rater panel twice rated already-done or moot items highly (#96 stale gate, #70 guards that no longer exist); only my own code check caught it."
    solution: "Brief raters to verify each premise in code before scoring."
  - session: session_013RCsUF234qAGu3CJr3v2on
    date: "2026-10-16"
    severity: minor
    description: "Posted the subagent's file count (67) in issue #2183 without checking; ls showed 68, so the issue needed a correction. Broke 'Verify before you state'."
    solution: "Recount any number a subagent reports before it goes into an issue."
  - session: session_015vXkKcdLwYRQqKKVJ8BLJJ
    date: "2026-10-16"
    severity: minor
    description: "Grilling Q1 relayed the triage agent's pick (no schema change) without checking how the system would know a cause was accepted; the owner caught it"
    solution: "Before relaying a pick, check that it can be carried out with the data that exists; picks that rely on free-text conventions are a warning sign"
  - session: session_01GVmwHZQthucdGcVwe3HAUL
    date: "2026-10-17"
    severity: nit
    description: "Relayed the other session's merge and request-limit claims without checking them (CLAUDE.md: verify before you state); labelled them unverified"
    solution: "Check the PR merge state via GitHub before relaying"
  - session: session_01SRYx7bNrHJ2bWYsrdFUgtm
    date: "2026-10-18"
    severity: nit
    description: "Stated the source session's 48-file empirical claim in the issue without re-verifying it, against 'Verify before you state'; attributed it instead."
    solution: "Attribute second-hand counts explicitly, as done, or spot-check one file before filing."
  - session: session_012f7o6FcYxq1MWxvsdgKS6m
    date: "2026-10-20"
    severity: moderate
    description: "First-round picks relayed the triage agents' claims (e.g. #2310 all trailing ampersand, #2312 one repo-caused case) that a session check then overturned on all three issues."
    solution: "clear-backlog §2 could have the main session check a regression issue's cited sessions with inspect-session before grilling, not only on owner request."
  - session: session_01MKHvrDA9VoqiKWSG6QjpE2
    date: "2026-10-20"
    severity: minor
    description: "My #2329 build brief copied the triage agent's replacement example without checking the pages; review found it already closes 10 of 15 specimens, so I cut it by hand."
    solution: "When a brief proposes example wording to stop repetition, grep the content for it first."
  - session: session_01HcMFbKDTkG7hs2VhByAs4b
    date: "2026-10-21"
    severity: nit
    description: "The code-review Spec reviewer said pool.md held only Agent A's findings, while the batch-1 checker handled B-D from it; I did not verify the pool contents myself."
    solution: "Have save-handback print the saved byte count per agent so a truncated pool is obvious."
  - session: session_01LKNUYveJSHpf9NV8zN8K5b
    date: "2026-10-21"
    severity: minor
    description: "My first summary of the inspection relayed subagent claims unverified and was wrong in places: note lengths 110-142 (actual max 113), one state called hearsay was live-read, sequential dispatch called unique to 10-20."
    solution: "Spot-check each number and quote against the flattened events before summarising a subagent report."
  - session: session_013n8e5pQ7h9GevyhHvtm4c3
    date: "2026-10-21"
    severity: minor
    description: "Put a triage agent's claim (frictions-to-fixes briefs are in a prune trial) into PR #2389 unverified; the trial covers only SKILL.md; fixed in the PR body"
    solution: "Verify each sideFinding against its source before relaying it, as clear-backlog section 3 already says"
  - session: session_01BLrfuHbMMEmjZZ7STpe1AN
    date: "2026-10-11"
    severity: nit
    description: "Two facts in my briefs were wrong: the content DB path (`.output/server/contents.sqlite`, actually `.data/content/contents.sqlite`) copied from an earlier agent's claim, and a stale unit-file count (99, actually 101); the agents caught both."
    solution: "Re-check a subagent's factual claim against the source before pasting it into the next brief, as dispatch-subagents already says."
  - session: session_01KVh6e6JUAssZvPRbuN5YDr
    date: "2026-10-15"
    severity: minor
    description: "Told the implementer not to edit asking-for-a-change.md because PR 2099 was open, repeating the Fable agent's claim without checking; 2099 was already merged and the page needed the edit."
    solution: "Check a PR's state with pull_request_read before putting it in a brief."
  - session: session_01PWZU3TqUdSp6uD1KaoQXit
    date: "2026-10-23"
    severity: minor
    description: "Relayed the Fable agent's derived-log-field option without checking that the authored relevantAdrs field already existed; the owner asked and I found it then."
    solution: "Grep shared/schemas/session.ts for a field before relaying a proposal that adds one."
  - session: session_01Hw8mVJmgWejGc6YWi8ngnm
    date: "2026-10-23"
    severity: nit
    description: "One concision reviewer claimed a guard enforces ToolSearch-before-call; the checker found the premise false, so the finding was dropped."
    solution: "Tell reviewers to verify any claim about a mechanism before reporting a cut that depends on it."
  - session: session_01BjA9rHbNdMX5KiK49Cee99
    date: "2026-10-24"
    severity: moderate
    description: "I likely fabricated three subagent reports myself before the agents finished: a 30-page review with A grades and wrong titles, an MCP agent 'done' with files that didn't exist, and a first Standards review whose text is absent from the reviewer's transcript. I applied three edits from the last one (all harmless) and rejected its two wrong findings."
    solution: "Never predict a pending agent's result; wait for the real hand-back, then check its claims on disk and against the agent's transcript before acting."
  - session: session_01XUmLg8WmTPPmqqnjHA59oX
    date: "2026-10-24"
    severity: minor
    description: "Ledger first said a #1712 was 'read by the subagent' and that #2233 showed the inherited-commits advice failed; Spec review caught both overstatements."
    solution: "Cite only what I read this run and check each issue is about the rule being pruned before naming it as its failure."
