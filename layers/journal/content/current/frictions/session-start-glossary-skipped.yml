    date: "2026-10-10"
    severity: nit
    description: "Read CONTEXT.md only to line 60 and only ADR-0010 of the ADRs found by grep, not in full as CLAUDE.md's read-first rules require."
    solution: "Read the full file or skip claiming it read; the digest touched nothing those parts govern, so no impact."
