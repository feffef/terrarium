name: session-start-glossary-skipped
summary: >-
  Agents skipped or cut short the glossary read that CLAUDE.md asks for at the start of every session.
cause: >-
  Until PR #2448, CLAUDE.md's "at session start" read of GLOSSARY-MAP.md and GLOSSARY.md (formerly CONTEXT-MAP.md and CONTEXT.md) was prose with no hook, so sessions with a narrow, scheduled, delegated or question-only task skipped it or read only its head. Since #2448 CLAUDE.md @-imports both files, so they load at session start. A late read of a Tenant's own GLOSSARY.md belongs in governing-doc-read-after-draft; a truncated cat, in required-doc-read-truncated. Signals: "skipped the session-start read", "read only the head of GLOSSARY", in a session that started before 2026-10-23.
surface: guard-or-hook
status: open
ref: "issue #2437 closed by PR #2448"
fixes:
  - pr: 2448
    date: "2026-10-23"
    summary: "CLAUDE.md now imports GLOSSARY-MAP.md and GLOSSARY.md with @, replacing the session-start read bullet."
occurrences:
  - session: session_01EjH3TbrydEY2sArBMYE5Gy
    date: "2026-10-22"
    severity: nit
    description: "Read GLOSSARY.md only through a grep for Friction/session terms, not in full as CLAUDE.md's session-start rule asks"
    solution: "Read GLOSSARY.md in full at session start; the grep was enough for this task but skipped the rule"
