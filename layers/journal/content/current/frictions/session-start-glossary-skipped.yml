    date: "2026-10-14"
    severity: minor
    description: "Never read CONTEXT-MAP.md and CONTEXT.md at session start, though CLAUDE.md requires it; the task was about those very files being renamed."
    solution: "Read them first; a session-start read list in a hook output would make the skip visible."
  - session: session_01P7kLLJwHBgCaeVSUjhbScg
    date: "2026-10-15"
    severity: moderate
    description: "Did not read GLOSSARY-MAP.md then GLOSSARY.md in full at session start, against CLAUDE.md's \"at session start\" rule, before acting on the scheduled prompt"
    solution: "Read both at the very start of every session before acting, even when the scheduled prompt already carries extensive inline context"
