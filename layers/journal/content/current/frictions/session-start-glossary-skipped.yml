name: session-start-glossary-skipped
summary: >-
  Agents skipped or cut short the glossary read that CLAUDE.md asks for at the start of every session.
cause: >-
  CLAUDE.md's "at session start" read of GLOSSARY-MAP.md and GLOSSARY.md (formerly CONTEXT-MAP.md and CONTEXT.md) is prose with no SessionStart hook, so sessions with a narrow, scheduled, delegated or question-only task skip it or read only its head. Signals: "skipped the session-start read", "GLOSSARY-MAP", "CONTEXT.md only to line 60", "read only the head of GLOSSARY". A read cut short by a truncated cat belongs to required-doc-read-truncated.
surface: guard-or-hook
status: open
ref: "issue #2437 closed by PR #2448"
fixes:
  - pr: 2448
    date: "2026-10-23"
    summary: "CLAUDE.md now imports GLOSSARY-MAP.md and GLOSSARY.md with @, replacing the session-start read bullet."
occurrences:
