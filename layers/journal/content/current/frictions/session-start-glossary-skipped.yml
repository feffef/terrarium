name: session-start-glossary-skipped
summary: >-
  Agents skipped or cut short the glossary read that CLAUDE.md asks for at the start of every session.
cause: >-
  Until PR #2448, CLAUDE.md's "at session start" read of GLOSSARY-MAP.md and GLOSSARY.md (formerly CONTEXT-MAP.md and CONTEXT.md) was prose with no hook, so sessions with a narrow, scheduled, delegated or question-only task skipped it or read only its head. Since #2448 CLAUDE.md @-imports both files, so they load at session start. A late read of a Tenant's own GLOSSARY.md belongs in governing-doc-read-after-draft; a truncated cat, in required-doc-read-truncated. Signals: "skipped the session-start read", "read only the head of GLOSSARY", in a session that started before 2026-10-23.
surface: guard-or-hook
status: open
ref: "issue #2437 closed by PR #2448"
fixes:
  - pr: 2448
    date: "2026-10-23"
    summary: "CLAUDE.md now imports GLOSSARY-MAP.md and GLOSSARY.md with @, replacing the session-start read bullet."
occurrences:
  - session: session_01GVmwHZQthucdGcVwe3HAUL
    date: "2026-10-17"
    severity: nit
    description: "Skipped reading GLOSSARY-MAP.md and GLOSSARY.md at session start (CLAUDE.md) because the task was an ops question"
    solution: "Low impact here; a lighter trigger for pure-ops sessions would avoid the skip being a rule break"
  - session: session_01QMsuxS3fR6VMfWU1gXEYvk
    date: "2026-10-19"
    severity: nit
    description: "Read GLOSSARY.md (40 lines) and github-integration.md (one section) only partly, though CLAUDE.md says read in full; no ADR grep done for the question."
    solution: "Read the trigger docs in full at session start, in the first tool batch."
  - session: session_017X5SQqh4JtkECD69pftATE
    date: "2026-10-20"
    severity: nit
    description: "Skipped the session-start GLOSSARY-MAP.md and GLOSSARY.md reads CLAUDE.md requires; no wrong term resulted in this answer-only session"
    solution: "Read both in the first batch of tool calls; a SessionStart hint could name them"
  - session: session_01FTPnEsW1XNhaqYFdxaE24v
    date: "2026-10-20"
    severity: nit
    description: "Ran git log to draw conclusions before reading docs/agents/git-conventions.md, and skipped the full GLOSSARY read at session start."
    solution: "Read-only question sessions still trigger the read-first list; the hint fired late but was right."
