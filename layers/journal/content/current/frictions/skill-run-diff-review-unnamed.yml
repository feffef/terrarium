name: skill-run-diff-review-unnamed
summary: >-
  Agents skipped the code review on changes a Skill had produced and already checked, because no rule says whether those checks count as the review.
cause: >-
  A diff a Skill or script produced and already checked (a Digest with archive moves, a fact-checked blog post, a Glass Box or pin-bump update, a verbatim pack install, Glass Box content reviewed by a subagent) is larger than pr-workflow.md's simple-change bar, and neither pr-workflow.md nor the Skill says whether the Skill's own checks count as the review, so the session skips code-review on its own judgement. Signals: 'prose-only digest diff', 'one-file prose post already fact-checked', 'pin-only', 'Digest pages and archive moves', 'verbatim upstream copy', a Skill step named as the review.
surface: safe
status: open
notes: |-
  2026-10-28 survey: the PR #2412 Prune Trial is no longer in .agents/prune-trials.yml (judged and deleted by the 2026-10-27 prune run), so the entry is no longer on trial; issue #2472 (regression of #2407) is open.
  2026-10-29 survey: PR #2512 and #2642 (blog-post review and fact-check order) recorded as fixes for the blog-post half; the Digest, Glass Box and pin-bump halves have no fix.
fixes:
  - pr: 2319
    date: "2026-10-20"
    summary: "ADR-0004 let a prose-, docs- or content-only first push skip code-review (reversed by #2321)."
  - pr: 2321
    date: "2026-10-20"
    summary: "ADR-0004 now reviews Skills and docs like code; only a simple change (typo, rewrap, link, restamp, or at most 10 lines in 2 files) gets the author's own read."
  - pr: 2512
    date: "2026-10-25"
    summary: "blog-post step 9 commits and reviews per pr-workflow.md before the fact-check, so the checker reads the final text."
  - pr: 2642
    date: "2026-10-28"
    summary: "blog-post steps 10-11 no longer send the run into a second review after the fact-check; step 10 just runs the gate."
