    date: "2026-10-14"
    severity: "minor"
    description: "Wayfinder Skill says research findings go on a pushed research/ branch with no PR, which conflicts with ADR-0003's open-a-PR-for-every-pushed-branch rule."
    solution: "State in docs/agents/issue-tracker.md Wayfinding operations that research findings go in a ticket comment (as done here) and not on a branch."
  - session: "session_01JkzKjuQD4wH34MjxMjKHaX"
    date: "2026-10-14"
