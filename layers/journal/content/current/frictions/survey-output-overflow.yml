name: survey-output-overflow
summary: >-
  The data the self-improvement Skills read about past sessions was too large to read in one go.
cause: >-
  The reads behind frictions-to-fixes and similar Journal surveys (session-frictions, extract-frictions --compact at about 90-150 KB, the ledger directory, a dump of several Skill Inventory entries) overflow a tool result, so agents slice, truncate or re-query them and can miss lines. Since PR #2640 prune-friction-ledger.ts --summary and --candidates send large output to a file and print a notice. A bare audit-skills.ts run belongs in audit-skills-output-overflow. Signals: output persisted to a file, '| head truncated', a second narrower query, 'printed N KB'.
surface: safe
status: open
fixes:
  - pr: 1918
    date: "2026-10-14"
    summary: "Shrank the survey's data reads: compact one-line-per-session output and a short summary of each ledger entry."
  - pr: 2281
    date: "2026-10-19"
    summary: "extract-frictions --compact no longer prints each session's docsRead paths, about half its bytes."
  - pr: 2640
    date: "2026-10-28"
    summary: "prune-friction-ledger --summary and --candidates write output over a size threshold to a file under TMPDIR and print one notice line; --out PATH always writes to that path."
occurrences:
  - session: session_01RfmdPFPhtKo6h6GFwxLeRb
    date: "2026-10-16"
    severity: minor
    description: "session-frictions output was a 670KB JSON file; finding blog-post hits needed an ad-hoc node filter script."
    solution: "Give the helper a --grep option for keywords."
  - session: session_0135hcUf12mVM8dEZfDRAkUb
    date: "2026-10-18"
    severity: nit
    description: "The Skill says the survey agent works from a read of the extract file, but the compact output was still 90 KB with long docsRead arrays."
    solution: "Have extract-frictions --compact drop docsRead."
  - session: session_01TwTc2v8Afxqc9R4NdUcNPD
    date: "2026-10-18"
    severity: nit
    description: "First dump of eight Skill Inventory entries was 36KB and truncated; a second query for observations was 137KB. Cost two extra calls before I filtered to recent dates."
    solution: "Filter Inventory observations by date and truncate notes on the first query."
  - session: session_019jfJv6yLmcLUAJiTTomyeu
    date: "2026-10-25"
    severity: minor
    description: "Survey subagent reported: --summary | head truncated the two-cluster list, large outputs needed --out, and ledger-set refuses a session already in an entry with no way to upgrade its severity."
    solution: "Brief should say the two-cluster list is at the end of --summary, to use --out, and what to do when a new friction outranks the stored one."
  - session: session_013zxzeQvE9RNYoZRiZEEKBG
    date: "2026-10-28"
    severity: minor
    description: "Survey agent hit unlisted traps: --summary and --candidates print 34KB and 20KB to stdout, --append is all-or-nothing on a duplicate session, and closed issues came via gh api page=N."
    solution: "Name --out for the summary scripts, say --append writes nothing on refusal, and name the cheap closed-issues recipe in survey-brief §1 and §3."
  - session: session_013zxzeR86n7CjfWXZh4HXyc
    date: "2026-10-28"
    severity: nit
    description: "My first scan printed every post-fix occurrence across the ledger (102 KB), which overflowed to a file and needed a second, filtered grep."
    solution: "Filter by keyword in the first scan, or hand a full-ledger read to subagents from the start."
