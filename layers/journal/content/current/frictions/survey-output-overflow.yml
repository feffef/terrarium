name: survey-output-overflow
summary: >-
  A dump of a large data file or script output (session logs, the ledger, Inventory or run YAML, session records) was too large to read in one go.
cause: >-
  The reads behind frictions-to-fixes and similar surveys (session-frictions, extract-frictions --compact at about 90-250 KB with no per-severity view, the ledger directory, Skill Inventory entries) and cat or dumps of big YAML data files (runs.yml 190 KB, a 32 KB observations file, nine get_session records) overflow a tool result or the context, so agents slice, truncate, re-query or write ad hoc filters and can miss lines. Since PR #2640 prune-friction-ledger.ts --summary and --candidates send large output to a file and print a notice. Signals: output persisted to a file, '| head truncated', a second narrower query, 'printed N KB', 'dumped ... twice'.
surface: safe
status: open
related:
  - entry: output-trim-drops-needed-line
    rule: The agent trimmed output with head, tail or grep and lost the needed line.
  - entry: audit-skills-output-overflow
    rule: The output came from a bare audit-skills.ts run.
  - entry: orient-output-truncates
    rule: The output came from the glassbox-curate orientation script.
fixes:
  - pr: 1918
    date: "2026-10-14"
    summary: "Shrank the survey's data reads: compact one-line-per-session output and a short summary of each ledger entry."
  - pr: 2281
    date: "2026-10-19"
    summary: "extract-frictions --compact no longer prints each session's docsRead paths, about half its bytes."
  - pr: 2640
    date: "2026-10-28"
    summary: "prune-friction-ledger --summary and --candidates write output over a size threshold to a file under TMPDIR and print one notice line; --out PATH always writes to that path."
  - pr: 3532
    date: "2026-11-20"
    summary: "harvest evidence ranks tracker hits and caps them at 10."
  - pr: 3572
    date: "2026-11-21"
    summary: "harvest evidence caps the rulings and ledger blocks at 10 hits per group."
occurrences:
  - session: session_013zxzeT8MiA3ZbpACZhayfL
    date: "2026-11-14"
    severity: minor
    description: "Scorecard and 16 data files total about 900 KB; I had to script a summary of observations to decide escalations, since subagents' 'known repeat' claims need the full observation history."
    solution: "Have audit-skills.ts print each Skill's matching open or closed issues beside its observations."
  - session: session_013zxzePNLUgD6AbfEmXykEJ
    date: "2026-11-15"
    severity: nit
    description: "Reading all observations dumped 41 KB in one call, then I re-read them in trimmed batches."
    solution: "Trim and batch note output from the start with a small script, as I did on the second attempt."
  - session: session_013zxzePak78Sud7pyRQMjeV
    date: "2026-11-15"
    severity: nit
    description: "A wide git show of close-session.yml to check one field dumped its whole 40-day observations list into context."
    solution: "Read only the lines needed (sed range or grep) when checking one field of a data file."
  - session: session_013zxzeT29epAaAQNqmHmeU4
    date: "2026-11-16"
    severity: nit
    description: "list-merges-since.ts prints about 3,700 lines for a 4-day window and shows only branch names; I used git log with name-only for file evidence instead."
    solution: "Step 3 could name the merges-only flag or the name-only log; rejected earlier in #3191."
  - session: session_013zxzeQxKAZzjCV61mM31sR
    date: "2026-11-18"
    severity: nit
    description: "The survey report arrived at about 8k words and its summary.txt exceeded Read's cap; deciding picks needed me to re-query the ledger summary and issue #3234 myself."
    solution: "Ask the survey for a one-page ranked digest and name the idle-check result per open-already entry."
  - session: session_013zxzeRjfC32pkbUMmiaMnN
    date: "2026-11-18"
    severity: minor
    description: "issue_read get_comments on 3143 returned 254K characters and overflowed context, forcing a saved-file slice; github-integration.md warns only about get_sub_issues and bodies."
    solution: "Add get_comments on a long standing thread to the 'Three calls return huge output' list in docs/agents/github-integration.md, with the python slice recipe."
  - session: session_013zxzeRVd5oef56BLsas85y
    date: "2026-11-19"
    severity: nit
    description: "A search/code gh api call returned about 20 KB of repository JSON for a one-line question, flooding context."
    solution: "Pipe gh api search results through --jq to a few fields; the Skill's brief could say so."
  - session: session_013zxzeSARDGdXM7Hqe83quy
    date: "2026-11-21"
    severity: moderate
    description: "harvest evidence printed 488 lines of mostly unrelated hits (glossary lines, old closed issues) so I verified by hand instead."
    solution: "Require two keyword matches per hit and skip glossary files in the rulings block."
