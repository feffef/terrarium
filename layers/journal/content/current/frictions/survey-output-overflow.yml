name: survey-output-overflow
summary: >-
  The data the self-improvement Skills read about past sessions was too large to read in one go.
cause: >-
  The reads behind frictions-to-fixes and similar Journal surveys (session-frictions, extract-frictions --compact at about 90-150 KB, the ledger directory, prune-friction-ledger.ts --summary, a dump of several Skill Inventory entries) overflow a tool result, so agents slice, truncate or re-query them and can miss lines. A bare audit-skills.ts run belongs in audit-skills-output-overflow. Signals: output persisted to a file, '| head truncated', a second narrower query, 'printed N KB'.
surface: safe
status: open
ref: "issue #1917 closed 2026-10-14T02:23Z by PR #1918"
fixes:
  - pr: 1918
    date: "2026-10-14"
    summary: "Shrank the survey's data reads: compact one-line-per-session output and a short summary of each ledger entry."
  - pr: 2281
    date: "2026-10-19"
    summary: "extract-frictions --compact no longer prints each session's docsRead paths, about half its bytes."
occurrences:
  - session: session_01ERZa4fUGxpF81MeLhZMkSB
    date: "2026-10-14"
    severity: minor
    description: "Survey subagent's compact output and ledger dir still overflowed reads (73 KB, 2004 lines), the already-known survey-output-overflow cause."
    solution: "PR 1918 (compact one-line sessions, ledger --summary)."
  - session: session_01RfmdPFPhtKo6h6GFwxLeRb
    date: "2026-10-16"
    severity: minor
    description: "session-frictions output was a 670KB JSON file; finding blog-post hits needed an ad-hoc node filter script."
    solution: "Give the helper a --grep option for keywords."
  - session: session_0135hcUf12mVM8dEZfDRAkUb
    date: "2026-10-18"
    severity: nit
    description: "The Skill says the survey agent works from a read of the extract file, but the compact output was still 90 KB with long docsRead arrays."
    solution: "Have extract-frictions --compact drop docsRead."
  - session: session_01TwTc2v8Afxqc9R4NdUcNPD
    date: "2026-10-18"
    severity: nit
    description: "First dump of eight Skill Inventory entries was 36KB and truncated; a second query for observations was 137KB. Cost two extra calls before I filtered to recent dates."
    solution: "Filter Inventory observations by date and truncate notes on the first query."
  - session: session_019jfJv6yLmcLUAJiTTomyeu
    date: "2026-10-25"
    severity: minor
    description: "Survey subagent reported: --summary | head truncated the two-cluster list, large outputs needed --out, and ledger-set refuses a session already in an entry with no way to upgrade its severity."
    solution: "Brief should say the two-cluster list is at the end of --summary, to use --out, and what to do when a new friction outranks the stored one."
