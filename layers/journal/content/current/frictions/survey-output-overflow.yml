name: survey-output-overflow
summary: >-
  A dump of a large data file or script output (session logs, the ledger, Inventory or run YAML, session records) was too large to read in one go.
cause: >-
  The reads behind frictions-to-fixes and similar surveys (session-frictions, extract-frictions --compact at about 90-250 KB with no per-severity view, the ledger directory, Skill Inventory entries) and cat or dumps of big YAML data files (runs.yml 190 KB, a 32 KB observations file, nine get_session records) overflow a tool result or the context, so agents slice, truncate, re-query or write ad hoc filters and can miss lines. Since PR #2640 prune-friction-ledger.ts --summary and --candidates send large output to a file and print a notice. Signals: output persisted to a file, '| head truncated', a second narrower query, 'printed N KB', 'dumped ... twice'.
surface: safe
status: open
related:
  - entry: output-trim-drops-needed-line
    rule: The agent trimmed output with head, tail or grep and lost the needed line.
  - entry: audit-skills-output-overflow
    rule: The output came from a bare audit-skills.ts run.
  - entry: orient-output-truncates
    rule: The output came from the glassbox-curate orientation script.
fixes:
  - pr: 1918
    date: "2026-10-14"
    summary: "Shrank the survey's data reads: compact one-line-per-session output and a short summary of each ledger entry."
  - pr: 2281
    date: "2026-10-19"
    summary: "extract-frictions --compact no longer prints each session's docsRead paths, about half its bytes."
  - pr: 2640
    date: "2026-10-28"
    summary: "prune-friction-ledger --summary and --candidates write output over a size threshold to a file under TMPDIR and print one notice line; --out PATH always writes to that path."
