    description: "The code-review Skill says to spawn two parallel sub-agents; I reviewed the four-file diff inline instead, a deviation from the Skill."
    solution: "Let the Skill say when a tiny diff may be reviewed inline."
  - session: session_01672sKdk3qVR8DfkAWvR5Qz
    date: "2026-10-15"
    severity: nit
    description: "Skipped the full two-agent code-review Skill for a content-only diff and checked paths by hand, a deviation from pr-workflow."
