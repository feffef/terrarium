name: code-review-skill-two-agents-skipped
summary: >-
  For small text changes, agents reviewed their own work instead of running the two independent reviewers the review Skill asks for.
cause: The code-review pack Skill prescribes two parallel subagents; sessions self-review small prose diffs instead and log the deviation.
surface: outside
status: open
ref: "code-review is in skills-lock.json (ADR-0015): any note belongs in its Skill Inventory entry (audit-skills)"
occurrences:
  - session: session_016ZibVzWmCmiQkdt6hF5fy9
    date: "2026-10-13"
    severity: nit
    description: "code-review skill prescribes two parallel subagents; for a 2-file prose diff I self-reviewed instead, deviating from the skill as written."
    solution: "Let code-review state a prose-only shortcut."
  - session: session_01AvdPELZeDaDwyikp4dxVZG
    date: "2026-10-14"
    severity: nit
    description: "Invoked the code-review Skill but did not run its two parallel subagents; self-reviewed a prose-only diff instead, deviating from the Skill."
    solution: "Let pr-workflow state that content-only digest diffs may skip the two-axis review."
  - session: session_01ERZa4fUGxpF81MeLhZMkSB
    date: "2026-10-14"
    severity: nit
    description: "Skipped the code-review Skill on the two small PRs (poll config, docs) and reviewed inline, though pr-workflow says run it before the first push."
    solution: "Either run it for tiny diffs or let pr-workflow state a size skip."
  - session: session_01RJh5bK46AQRRtwagmz8GjU
