    description: "I invoked code-review but skipped its two sub-agents for a one-file prose diff, against ADR-0004's before-first-push rule; the post had already had a blind read and fact-check."
    solution: "Let pr-workflow name a skip for blog-post runs, whose own steps already review the diff, as it does for midden-catalogue."
