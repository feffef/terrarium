name: ledger-append-refuses-held-session
surface: safe
summary: The ledger append script refused a whole call because one session was already in the entry, so the survey had to retry without it.
cause: "print-ledger-occurrence.ts --append writes through ledger-set.ts, which refuses a session the entry already holds or the call repeats (PR #2366's content test, PR #2567's named refusal); extract-frictions --unledgered still offers that session's other Frictions, so one call fails whole and is re-run. Signals: '--append fails whole', 'refuses a session already in an entry', 'no way to upgrade its severity'."
status: open
related:
  - entry: ledger-yaml-hand-edit-errors
    rule: A YAML data file was hand-edited or scripted and broke.
notes: |-
  2026-10-28 design: survey-brief.md wording on holding a session dropped: the file is in the open frictions-to-fixes-briefs-mismatch Prune Trial territory (PR #2539); a script flag would defeat the call's atomic safety. dropped: one extra call.
fixes:
  - pr: 2755
    date: "2026-11-01"
    summary: "print-ledger-occurrence --append now names every failing entry in one error, still writing nothing on any failure."
  - pr: 3409
    date: "2026-11-17"
    summary: "print-ledger-occurrence --append --skip-held skips sessions the entry already holds and prints each skip"
occurrences:
  - session: session_013zxzeSyRCdzfotAbmBuiPp
    date: "2026-11-16"
    severity: minor
    description: "Survey report's window start was ambiguous (extract-frictions prefix 2026-11-13T02:27 versus first session 2026-11-12T23:06) and its ledger append refused all 84 triples over 15 held sessions, needing a throwaway filter script."
    solution: "Print one canonical window start; let print-ledger-occurrence --append skip held sessions with a flag."
  - session: session_013zxzeSZQpKBLnM3DK1cPRQ
    date: "2026-11-17"
    severity: minor
    description: "Survey agent: ledger append refused three already-held session triples after --unledgered, and it first typed the commit-trailer session id by hand; design agent: audit-skills output dumps 66KB, no path lookup for trial territory, no guidance when every pick is no change."
    solution: "Add session-level pre-filtering to --unledgered, a doc-counts mode for audit-skills, and a no-change clause in design-brief section 6."
  - session: session_013zxzeR67EGdvDDNgGomDr6
    date: "2026-11-25"
    severity: minor
    description: "The survey subagent reported the survey brief section 3 asks to label every candidate but cannot confirm 157 entries; append aborts on repeated sessions within one call."
    solution: "Say which subset to confirm in survey-brief section 3 (inside an open prune trial's territory, so left for the trial)."
