name: shell-read-detection-branch-only-docs
summary: >-
  The session-log check missed a doc a session read from a branch that is not merged to main.
cause: "`git show origin/<branch>:<path>` of a doc that exists only on an unmerged research or prototype branch is not credited by the shell-read detector (scripts/session/shell-reads.ts header: a doc read from history whose lines are gone stays invisible), so the session logs a moderate SHELL-READ-DETECTION Friction. Signals: 'a real read went uncounted', a git show of origin/research/... or origin/prototype/... after a git fetch. Both docs are absent from main (checked 2026-10-20); the detector was not run on the transcripts."
surface: safe
status: tracked
ref: "Dispatched in the 2026-10-20 frictions-to-fixes run (near-miss filter in transcript-trace.ts)."
occurrences:
  - session: session_01MKmEo8yAjxTqJ5h3zceLL5
    date: "2026-10-19"
    severity: moderate
    description: "SHELL-READ-DETECTION: a real read went uncounted. Command: git show origin/prototype/transcript-search-shape:.agents/skills/transcript-search/prototype/README.md | head -80 (chained after git fetch and git ls-tree). Expected path: .agents/skills/transcript-search/prototype/README.md"
    solution: "Have shell-reads.ts credit git show <ref>:<path> output against the path after the colon."
  - session: session_01Pc15CVrLGyHXgoygsRHLbB
    date: "2026-10-19"
    severity: moderate
    description: "SHELL-READ-DETECTION: a real read went uncounted. Command: git show origin/research/cloud-session-transcript-tools:docs/research/cloud-session-transcript-tools.md (after a git fetch on the same line). Expected path: docs/research/cloud-session-transcript-tools.md"
    solution: "Teach scripts/session/shell-reads.ts that git show <ref>:<path> reads <path> when its output is shown"
