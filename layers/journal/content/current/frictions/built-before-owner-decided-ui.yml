name: built-before-owner-decided-ui
surface: safe
summary: Agents built user-facing UI from a spec or a one-line ask before the owner settled its labels or saw a sample, so it was redesigned or the owner was asked afterwards.
cause: "CLAUDE.md 'Ask before building' (the grilling Skill: settle what each displayed value shows) and, since PR #3032 (2026-11-10), 'before any UI build, agree it on a short sample shown with preview.ts start --dev' are not applied: a build brief leaves a label open, a tile is built whole from a spec, or a screenshot request is built without confirming. Signals: 'built user-facing UI before the owner decided', 'before showing the owner a sample', 'triggered a full redesign', 'ask-first preference not applied'. Since PR #3094 (2026-11-11) the sample-first rule lives in .claude/rules/ui-verification.md (CLAUDE.md keeps a pointer), and since PR #3107 clear-backlog explore asks the visible-UI questions in its grilling round."
status: tracked
ref: "issue #3297"
notes: |-
  2026-11-11 survey: issue #3026 closed by PR #3032 (recorded in fixes); status reset to open.
  2026-11-11 survey: two sessions after PR #3032 (R7qQ3HKo built UI without asking the owner to confirm the first screenshot; NeWJTvqX built a Term.vue link without agreeing a sample) show the sample-first rule did not hold.
  2026-11-14: regression of #3032/#3094/#3107 filed as issue #3297.
fixes:
  - pr: 3032
    date: "2026-11-10"
    summary: "CLAUDE.md 'Ask before building': any UI build is agreed on a short sample, shown with scripts/ui/preview.ts start --dev, before the full build."
  - pr: 3094
    date: "2026-11-11"
    summary: "The sample-first UI rule moves from CLAUDE.md to .claude/rules/ui-verification.md: grep for an existing element, agree a short preview.ts --dev sample, confirm each screenshot with the owner."
  - pr: 3107
    date: "2026-11-11"
    summary: "clear-backlog explore returns a visible-UI change as grill with follow-up questions: which pages show it, what each value follows, the look in words."
occurrences:
  - session: session_013zxzeSy38XR1wPjCGFUExY
    date: "2026-11-07"
    severity: minor
    description: "The #2884 build brief left the new Session card label open, so the agent built user-facing UI before the owner decided it; I asked afterwards."
    solution: "In clear-backlog section 2, ask what a displayed value looks like and says in the first grilling round when a pick adds UI."
  - session: session_013zxzeR2kKbsT81QWkXUrvK
    date: "2026-11-09"
    severity: moderate
    description: "Built the whole tile UI from the spec before showing the owner a sample; the first screenshot triggered a full tile redesign"
    solution: "CLAUDE.md says to agree a short sample first for user-facing UI; send a screenshot after the first tile renders, before tests and review"
  - session: session_013zxzeQ93oSKkX5CBEcFiXU
    date: "2026-11-09"
    severity: nit
    description: "The CLAUDE.md 'Ask before building' rule and the user's ask-first preference were not applied; I built from a one-line screenshot request without confirming."
    solution: "Low cost here because the request was specific; for a fixed-count UI choice, a one-question check such as 'four even when data is younger?' would have been cheap."
  - session: session_013zxzeR7qQ3HKogNsnf5Zm8
    date: "2026-11-11"
    severity: minor
    description: "I did not ask the owner to confirm the first UI screenshot; the owner had to point it out."
    solution: "End every UI iteration by sending the screenshot and asking for confirmation, as CLAUDE.md implies."
  - session: session_013zxzeNeWJTvqXPTEeR63qC
    date: "2026-11-11"
    severity: moderate
    description: "Built a new Term.vue link with the plain text Lesson without agreeing a sample first; the owner then pointed to the existing titled Lesson chip."
    solution: "Before a UI change, grep the tenant for an existing component for the same element and show a sample with preview, as CLAUDE.md says."
  - session: session_013zxzeRVjHExXhciv5BwiTB
    date: "2026-11-11"
    severity: moderate
    description: "Grilled the #3075 footer SHA as one vague question; it never said which pages show it, so the line shipped on every page and the owner had to correct it."
    solution: "Ask where it shows, what it displays and a sample before the pick, as CLAUDE.md says for user-facing UI; filed as #3098."
  - session: session_013zxzePKLPsiqSXCrEd1QCE
    date: "2026-11-13"
    severity: moderate
    description: "I merged a visitor-facing Walkthrough page change without reading docs/agents/verifying-ui-changes.md, taking screenshots or confirming them with the owner, as ui-verification.md requires; the user said so afterwards."
    solution: "Before any owner-facing UI change, read verifying-ui-changes.md, preview with scripts/ui/preview.ts, show screenshots and hold the PR for the owner's confirmation; a green gate and unit tests do not replace that."
  - session: session_013zxzeQrRhhVjja2AkCLcyV
    date: "2026-11-13"
    severity: moderate
    description: "Committed and pushed an owner-facing UI change without rendering it or showing the owner; they had to ask for the render."
    solution: "Rule: a session or issue that only adds or changes UI must render and show it, and the owner signs off before code review. Make that a CLAUDE.md or ui-verification.md must-have, and have the Stop hook's commit nudge defer to it."
