name: data-shape-built-before-asked
summary: >-
  Agents built a stored field or data format before asking the owner how it should be shaped, and had to redo it.
cause: >-
  A stored field, schema or storage location is built while its shape (index vs full text, per run vs mean, where the numbers live) is still open, instead of asking the Trusted user one question first (.claude/rules/data-shapes.md). Signals: schema or session-log edits reverted after the owner's answer, a second PR plus backfill for a field's shape, "never asked per-run vs mean".
surface: safe
status: open
ref: "issue #2264 closed by PR #2272"
fixes:
  - pr: 2213
    date: "2026-10-17"
    summary: "dispatch-subagents section 1 now names owner-visible shape, data shape, length and ownership as choices to settle first, and CLAUDE.md says to ask before building what the Trusted user will see."
  - pr: 2272
    date: "2026-10-19"
    summary: "Added a path-scoped rule to settle a stored field's shape with a Trusted user before building it."
occurrences:
  - session: session_01DNheR1Cpt9b6vFsmGdzvxq
    date: "2026-10-16"
    severity: nit
    description: "The first backfill plan used an index, the user then preferred full text; the index commits and schema were built and thrown away within one PR."
    solution: "When a data-shape choice is cheap to ask about, ask it before building; I only answered with a size comparison afterwards."
  - session: session_014PZ7z8L13nqP7rPdCgZRcM
    date: "2026-10-17"
    severity: moderate
    description: "I began editing the session schema and transcript trace to record tokens in session logs before the user had chosen where the numbers live; they interrupted and I reverted all of it."
    solution: "When the user's answer leaves the storage choice open, ask it as a single question before editing (the grilling and ask-before-building rules), not after reading code."
  - session: session_01TJH95qkztCQJ8PF6G6pvqs
    date: "2026-10-18"
    severity: moderate
    description: "Broke CLAUDE.md 'Ask before building a data shape they may prefer': Q3 on #2239 never asked per-run vs mean, so #2243 shipped means and needed a second PR plus backfill."
    solution: "When a grill question settles a stored field, ask its shape explicitly; clear-backlog-explore could flag new schema fields as owner questions."
