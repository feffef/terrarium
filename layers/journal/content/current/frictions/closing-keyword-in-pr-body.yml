name: closing-keyword-in-pr-body
surface: safe
summary: A PR body used a closing keyword in a non-closing sense, so GitHub closed an issue or merge-pr.ts refused the body.
cause: "A PR body wrote 'does not close #N' or 'Fixes: #N' as a label; GitHub and merge-pr.ts read a negated or labelled keyword as a closing one. Signals: 'Fixes:', 'does not close', merge-pr.ts refusing a closing keyword, an issue closed on merge."
status: open
occurrences:
  - session: session_013zxzeRCJHe4rmKN5i2CQ16
    date: "2026-11-06"
    severity: minor
    description: "Wrote 'It does not close #2898' in the PR body; GitHub treats a negated closing keyword as a closing one and closed the issue on merge."
    solution: "Name a related issue without the words close, fix or resolve next to its number; pr-workflow.md already warns of this, so I should have rechecked the body against that line."
  - session: session_013zxzeS3L4tvAUKm5q3d9qD
    date: "2026-11-08"
    severity: nit
    description: "My PR body wrote 'Fixes: #2961' as a label for a filed issue; merge-pr.ts refused it as a closing keyword and cost a rerun."
    solution: "Write 'relates to #N' for issues a PR does not complete, as pr-workflow.md says."
