name: closing-keyword-in-pr-body
surface: safe
summary: A PR body used a closing keyword in a non-closing sense, so GitHub closed an issue or merge-pr.ts refused the body.
cause: "A PR body wrote 'does not close #N' or 'Fixes: #N' as a label; GitHub and merge-pr.ts read a negated or labelled keyword as a closing one. Signals: 'Fixes:', 'does not close', merge-pr.ts refusing a closing keyword, an issue closed on merge."
status: open
related:
  - entry: pr-body-angle-bracket-rejected
    rule: check-body rejected bare angle brackets in the body.
notes: |-
  2026-11-08 design: a PreToolUse guard denying negated or labelled closing keywords in PR bodies dropped: it needs a Human-only guard (.claude/settings.json, scripts/hooks/**) for two low-severity events, pr-workflow.md:74 already warns and both sessions read it, and merge-pr.ts already refuses the labelled form.
  2026-11-19 design: no change dropped: merge-pr.ts already refuses the keyword on a non-ready-for-agent issue; a guard is Human-only; one self-recovering body edit.
occurrences:
  - session: session_013zxzeNd9wP36dUYyykDdBv
    date: "2026-11-18"
    severity: nit
    description: "merge-pr.ts refused #3478 because its Closes keyword named a ready-for-human issue the owner had already agreed to close; I edited the PR body and closed the issue by hand."
    solution: "When an owner pick closes an issue, write 'relates to' from the start and close it by hand after the merge."
