name: provenance-header-shape
summary: >-
  The exact first line every agent post on GitHub needs was written down only in the error that rejects it.
cause: >-
  The ADR-0017 header's exact first-line shape lives only in the guard's deny message, and until 2026-10-10 the ADR's example named a model the harness forbids, so a session's first PR or comment is denied.
surface: guard-or-hook
status: open
ref: "issues #1422, #1684; PR #1438; ADR-0017 amendment e76caa79"
fixes:
  - pr: 1438
    date: "2026-09-27"
    summary: "The guard's block message now says the header label is free text and to write 'Claude' if no model is named."
  - pr: 1735
    date: "2026-10-10"
    summary: "The provenance rule now requires only the session link, not a model name, and its example label is 'Claude'."
occurrences:
  - session: session_01SVbTmvqHK7xdAcGtG4SfKL
    date: "2026-10-08"
    severity: nit
    description: "ADR-0017 says the provenance header names the model, the harness forbids model names, and the guard accepts any label. I again used a model-less Claude header on #1684 and the #1676 comment."
    solution: "Tracked as #1684: reword ADR-0017 so the label is free text."
  - session: session_01Pps6pXDX7ahChHwQajVZNc
    date: "2026-10-09"
    severity: nit
    description: "The PR create call was denied by the provenance guard because the header was not the first line in the required shape; the retry worked."
    solution: "Digest Skill step 7 could show the header shape."
  - session: session_01EmaH5A6Ziwjndz9esnsJ22
    date: "2026-10-10"
    severity: nit
    description: "The first PR create call was denied by the provenance guard because the header was not the first line in the required shape; retry worked."
    solution: "Put the model-linked header as the first paragraph of the body."
