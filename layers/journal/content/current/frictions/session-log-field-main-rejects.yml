name: session-log-field-main-rejects
summary: >-
  A session adding a field to session logs could land its own log with that field, which main's schema rejects.
cause: >-
  Session logs land on main without a gate (ADR-0009) and main's session schema is strict, so a branch that adds a log field and writes it into its own log would turn main red until merge; the lander now refuses such a log. Signals: a new session-schema field, the lander holding a log, 'main's schema rejects'.
surface: safe
status: open
ref: "Earlier: issue #1784; PR #1792 (regressed)."
fixes:
  - pr: 1748
    date: "2026-10-10"
    summary: "The log lander now refuses to commit a session log that main's schema would reject."
  - pr: 1792
    date: "2026-10-11"
    summary: "The log tool now tells the agent when its log will be held because main's schema rejects it."
occurrences:
  - session: session_01WoJ2cTAuA3Qo9Mi9fd6Tki
    date: "2026-10-11"
    severity: minor
    description: "The lander validates logs against main's schema, so a session adding log fields cannot use them in its own log until merge; found by reading log-session.ts"
    solution: "Mention it in the log-session Skill next to the schema note"
