name: git-checkout-misused-to-read-or-switch
surface: safe
summary: Agents used git checkout or switch to read a file or change branch and discarded or tried to stage work.
cause: "git checkout <ref> -- . or git switch with discard-changes is used to read a file or move branches; git-conventions.md forbids it. Signals: 'git switch --discard-changes', 'git checkout origin/main -- .', classifier denial, a lost edit."
status: open
notes: |-
  2026-11-08 design: a PreToolUse guard denying git switch --discard-changes and git checkout <ref> -- . dropped: it needs a Human-only guard, the harness classifier already denied the costlier case, git-conventions.md:27 already forbids it, and the other cost one redone edit.
  2026-11-11 design: no non-guard fix dropped: git-conventions.md:26-28 already forbids it, SBfN's call was a no-op, and the owner accepts late reads.
occurrences:
  - session: session_013zxzeSRr9pF9MCBQDGAN5L
    date: "2026-11-07"
    severity: minor
    description: "Impl subagent's own: ran git switch with discard-changes after editing, silently discarding its first edit, then redid it."
    solution: "Brief should say to create the branch before editing."
  - session: session_013zxzeQWJUyfuXJgdfypeuc
    date: "2026-11-07"
    severity: minor
    description: "Ran git checkout origin/main -- . to read a file, which git-conventions.md forbids; the classifier denied it, so nothing was staged"
    solution: "Read a file from main with git show origin/main:<path>, as git-conventions says"
  - session: session_013zxzeSBfN7oWScF9TgN4eB
    date: "2026-11-10"
    severity: moderate
    description: "Ran `git checkout origin/main -- layers/journal/content` before reading git-conventions.md, which forbids checkout of a ref onto paths (it stages them)."
    solution: "Read git-conventions.md before the first non-read-only git command, as CLAUDE.md says; it was a no-op only because the branch equalled main."
  - session: session_013zxzeSSDUXBAYYrwXtej8b
    date: "2026-11-10"
    severity: nit
    description: "A stray git checkout -b tmp-check in a compound command moved me off the session branch briefly; fixed with checkout and branch -d."
    solution: "Keep exploratory git read-only (git show) per git-conventions."
  - session: session_013zxzeNrvAWHmAPYsSy8u7x
    date: "2026-11-12"
    severity: nit
    description: "Put a stray git checkout --detach into a read-only grep command, which detached HEAD; I noticed from git status and re-attached the session branch in the next call, with nothing lost."
    solution: "Keep read-only searches free of git commands that change state, and check git status after any git call in a compound command."
