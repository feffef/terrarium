name: frictions-to-fixes-briefs-mismatch
summary: >-
  The frictions-to-fixes survey and design briefs disagreed with the repo or left steps out, so their helper agents lost rounds or worked by hand.
cause: >-
  survey-brief.md and design-brief.md (not SKILL.md) carry broken or outdated instructions: a dangling fragment and a glob that matches nothing, mixed window dates, no status for closed-not-planned or on-trial entries, search guidance that contradicts github-integration.md, no named way to find merged PRs missing from the ledger, an impossible 'read every full log' ask, no owner/repo slug, and a design-brief wanting only docReadCounts from a 40 KB audit-skills JSON with no filter. PR #2733 (2026-10-31) gave the survey brief {SCRATCH_DIR} output paths and an all-or-nothing note for --append and redirected the design brief's audit-skills output. Signals: a survey or design subagent reporting the brief 'says ... but', a glob matching nothing, work done by hand that the brief should have pointed to.
surface: safe
status: open
notes: |-
  2026-10-30 survey: the Prune Trial of PR #2539 was judged and deleted by PR #2681; status reset to open.
fixes:
  - pr: 2347
    date: "2026-10-20"
    summary: "Made the survey and design briefs match the repo: tracker search via the listing script, window wording, status reset, repo name, log-reading rule."
  - pr: 2451
    date: "2026-10-23"
    summary: "The survey brief pages list_issues for closed issues instead of searching, and --summary prints the highest severity since the latest fix."
  - pr: 2459
    date: "2026-10-23"
    summary: "prune-friction-ledger.ts --move re-clusters one session's occurrence and refuses a duplicate or a text conflict."
  - pr: 2539
    date: "2026-10-25"
    summary: "Rewrote the three frictions-to-fixes briefs in the per-step shape and fixed the dangling opening, the audit-docs pointer and the survey's candidate set."
  - pr: 2733
    date: "2026-10-31"
    summary: "Survey brief passes --out {SCRATCH_DIR} paths to the summary, candidates and extract calls and redirects the merges and open-issues calls; design brief redirects audit-skills output; states that --append writes all or nothing."
occurrences:
  - session: session_01WU8rXHT5rKQKDYbYqCv7Sd
    date: "2026-10-21"
    severity: nit
    description: "Survey brief mixes window start and session end dates, and never says which status a ledger entry takes when its issue closes not planned or its Skill sits in a trial."
    solution: "State the window by session start, and list the status for closed-not-planned and on-trial entries in the brief."
  - session: session_01JkRFBik4MUWwZcP45q7egk
    date: "2026-10-22"
    severity: minor
    description: "Survey agent reported the survey brief pulls opposite ways on closed-issue search (brief says search_issues, github-integration.md says avoid it), and that --summary's max-severity column does not match the brief's 'since the latest PR' part (e)."
    solution: "Make --summary print the severity since the latest PR, and reconcile the search guidance in the brief with github-integration.md."
  - session: session_01CfTFFQrkwq1eUsDy61AJzz
    date: "2026-10-23"
    severity: minor
    description: "The survey subagent reported survey-brief.md pulls opposite ways: it tells agents to search_issues for closed issues while github-integration.md says to prefer list scans."
    solution: "Make the brief point to github-integration.md for search instead of restating it."
  - session: session_01E3XmTJcpKMZstW7MHL2eks
    date: "2026-10-23"
    severity: minor
    description: "design-brief.md has a dangling fragment after PICKS ('...what the survey found about it). You') and points to audit-docs house rules that SKILL.md has no section for; the design agent used the eight lenses."
    solution: "Fix the sentence and name the eight lenses in design-brief.md (tracked with the briefs regression, issue #2436)."
  - session: session_017vrdmQQwC4obwbJS9G5Dyg
    date: "2026-10-25"
    severity: minor
    description: "Screening the workflow-gate issue against closed issues covered only the newest 60 of 833, so a paraphrased older closure could be missed; the design agent made no tracker check at all."
    solution: "Give the screen a script that filters all closed issue titles locally, as the survey brief asks for open ones."
  - session: session_016edAfTmLE1szSBGNZTorPH
    date: "2026-10-25"
    severity: nit
    description: "The design brief's docsReadViaShell caveat (logs older than 2026-10-10) is stale: the 14-day ledger horizon no longer reaches such logs, so every design agent reads a dead branch."
    solution: "Cut the sentence; proposed to the owner among five cuts, awaiting their answer."
  - session: session_01S9UeKa9mCWdPVBjAezCSaL
    date: "2026-10-25"
