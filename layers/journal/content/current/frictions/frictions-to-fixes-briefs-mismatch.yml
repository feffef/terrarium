    description: "Design agent: survey-brief and design-brief leave audit-skills docReadCounts parsing unspecified (plain text before the JSON), and it never opened the human-merge paths file."
    solution: "Say to parse from the first brace, or give the script a --json flag."
  - session: session_01CpD4piFGbFhvGG5KWdtsCG
