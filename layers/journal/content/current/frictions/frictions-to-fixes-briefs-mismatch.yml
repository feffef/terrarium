    date: "2026-10-25"
    summary: "Rewrote the three frictions-to-fixes briefs in the per-step shape and fixed the dangling opening, the audit-docs pointer and the survey's candidate set."
  - pr: 2733
    date: "2026-10-31"
    summary: "Survey brief passes --out {SCRATCH_DIR} paths to the summary, candidates and extract calls and redirects the merges and open-issues calls; design brief redirects audit-skills output; states that --append writes all or nothing."
  - pr: 2891
    date: "2026-11-06"
    summary: "list-open-issues.ts gets a --closed flag and the survey brief §3 lists closed issues with it, not with MCP list_issues paging."
  - pr: 3091
    date: "2026-11-11"
    summary: "survey-brief.md: for a closed regression issue, read closed_by_pull_requests (issue_read) and cite any PR that closed it."
