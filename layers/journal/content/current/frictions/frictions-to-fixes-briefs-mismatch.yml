name: frictions-to-fixes-briefs-mismatch
summary: >-
  The frictions-to-fixes survey and design briefs disagreed with the repo or left steps out, so their helper agents lost rounds or worked by hand.
cause: >-
  survey-brief.md and design-brief.md (not SKILL.md) carry broken or outdated instructions: a dangling fragment and a glob that matches nothing, mixed window dates, no status for closed-not-planned or on-trial entries, no named way to find merged PRs missing from the ledger, an impossible 'read every full log' ask, no owner/repo slug, and a design-brief wanting only docReadCounts from a 40 KB audit-skills JSON with no filter. PR #2733 (2026-10-31) gave the survey brief {SCRATCH_DIR} output paths and an all-or-nothing note for --append and redirected the design brief's audit-skills output; PR #2891 (2026-11-06) replaced its closed-issue MCP paging, which contradicted github-integration.md, with list-open-issues.ts --closed. Signals: a survey or design subagent reporting the brief 'says ... but', a glob matching nothing, work done by hand that the brief should have pointed to. PR #3091 (2026-11-11) added the closed_by_pull_requests read for closed regressions to the survey brief. PR #3414 (2026-11-17) added the related-only rule for a new entry's distinction; PR #3477 (2026-11-18) made step 5 skip a tracked entry with no ref.
surface: safe
status: on-trial
ref: "Prune Trial opened 2026-11-23 (.agents/prune-trials.yml): territory .agents/skills/frictions-to-fixes/survey-brief.md"
related:
  - entry: frictions-to-fixes-skill-gaps
    rule: SKILL.md leaves a recurring situation unspecified.
  - entry: survey-label-and-ledger-errors
    rule: The survey agent mislabelled a candidate or left ledger work undone, though its brief was right.
notes: |-
  2026-10-30 survey: the Prune Trial of PR #2539 was judged and deleted by PR #2681; status reset to open.
fixes:
  - pr: 2347
    date: "2026-10-20"
    summary: "Made the survey and design briefs match the repo: tracker search via the listing script, window wording, status reset, repo name, log-reading rule."
  - pr: 2451
    date: "2026-10-23"
    summary: "The survey brief pages list_issues for closed issues instead of searching, and --summary prints the highest severity since the latest fix."
  - pr: 2459
    date: "2026-10-23"
    summary: "prune-friction-ledger.ts --move re-clusters one session's occurrence and refuses a duplicate or a text conflict."
  - pr: 2539
    date: "2026-10-25"
    summary: "Rewrote the three frictions-to-fixes briefs in the per-step shape and fixed the dangling opening, the audit-docs pointer and the survey's candidate set."
  - pr: 2733
    date: "2026-10-31"
    summary: "Survey brief passes --out {SCRATCH_DIR} paths to the summary, candidates and extract calls and redirects the merges and open-issues calls; design brief redirects audit-skills output; states that --append writes all or nothing."
  - pr: 2891
    date: "2026-11-06"
    summary: "list-open-issues.ts gets a --closed flag and the survey brief §3 lists closed issues with it, not with MCP list_issues paging."
  - pr: 3091
    date: "2026-11-11"
    summary: "survey-brief.md: for a closed regression issue, read closed_by_pull_requests (issue_read) and cite any PR that closed it."
  - pr: 3408
    date: "2026-11-17"
    summary: "survey-brief command now shows --merges-only; design-brief looks up one docReadCounts entry with jq"
  - pr: 3414
    date: "2026-11-17"
    summary: "survey-brief.md step 2 says a new entry's distinction from a near match lives in related only, never in summary or cause."
  - pr: 3477
    date: "2026-11-18"
    summary: "survey-brief.md step 5 skips a tracked entry with no ref (a dispatched fix in flight), resolving its contradiction with SKILL.md 5.3."
