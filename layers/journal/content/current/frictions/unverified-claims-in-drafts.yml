name: unverified-claims-in-drafts
summary: >-
  First drafts carried claims nobody had checked, and a reviewer had to catch them.
cause: >-
  First drafts of Digests, posts, docs, reports and CLAUDE.md edits, and subagent claims relayed as fact, carry claims never checked against a primary source; a fact-check or reviewer catches them at the cost of a round.
surface: safe
status: tracked
ref: "regression issue #2144; PR #1756 (blog step 12 fallback); PRs #1852, #1853 (clear-backlog §4 'check every fix yourself')"
fixes:
  - pr: 1756
    date: "2026-10-11"
    summary: "Blog reply drafts now get their key claim checked against its source before a reader sees them."
occurrences:
  - session: session_0168r95gLDEqJ8JBEV6UuUbo
    date: "2026-10-03"
    severity: moderate
    description: "My first draft added unsupported claims (nits blamed on human sessions, 'caught on a re-read', 'so rules and guards are tested'); only the fact-check caught them."
    solution: "Verify every interpretive attribution against the logs before writing, not just the numbers."
  - session: session_01SWRyFbuNXxVWi47tGB8GX6
    date: "2026-10-03"
    severity: moderate
    description: "Code review found five claims in my research note that the committed prototype could not back: a table row from a variant removed before aa86e131 was committed, 29 cases where the script holds 30, a wrong advisory failure cell, and two counts over logs presented as run output."
    solution: "Commit the prototype first, then write the note from its printed output using the script's own config names as row labels; never retype a number from an earlier run."
  - session: session_018DwTn5rSUpmtMHwXBrWqGL
    date: "2026-10-04"
    severity: moderate
    description: "Drafted a link with a made-up commit SHA in a candidate post; caught on my own re-read before anything shipped, but only because I re-read."
    solution: "Never type a SHA; always paste from git rev-parse output. blog-post's citation reference could say so next to the 40-char rule."
  - session: session_01EE8wFRkAWLtXgzdcoceCto
    date: "2026-10-04"
    severity: moderate
    description: "My survey said the probe PR left no recorded finding, but its session log recorded one; I had not read the session logs at survey time, so placement had to be reopened with the user after they had decided."
    solution: "midden-survey step 3 should say to read the session log of each PR candidate before judging significance or suggesting a placement."
  - session: session_01NyDGTR1fuP22hPo7XghCfz
    date: "2026-10-07"
    severity: moderate
    description: "I wrote unverified or false claims into CLAUDE.md ('main has no branch protection', 'CI runs the full gate on every PR'). A self-check and a reviewer caught them."
    solution: "Apply verify-before-you-state to my own instruction text, not only to session reports"
  - session: 1f97b613-f529-4487-a7e9-1115a44b84c7
    date: "2026-10-08"
    severity: moderate
    description: "The overview's first draft carried several unchecked simplifications: guards as 'code that blocks', audit-docs as 'docs vs code', 'Nitro runs the Vue app', and 'design' as the only difference between tenants. Each was easy to verify in the skill or guard docs but went unchecked until the maintainer's review."
    solution: "Before handing over a plain-language summary, re-read the primary file behind each one-line description (SKILL.md, guards.md, the package source) and check the simplification still holds"
  - session: session_01S1WwkpNHDfbvKAf5T1afKq
    date: "2026-10-08"
    severity: moderate
    description: "My first Part 2 rewrite had internal contradictions that all three cold checkers caught (multi-target steps, one file listed on two nodes, accent count, an over-complex feature set). The merge of 10 proposals wasn't self-checked."
    solution: "After merging many proposals, run one adversarial consistency pass myself, or with one agent, before the cold check."
  - session: session_01YSGRZcurrkv9WYqPfnRH2t
    date: "2026-10-10"
    severity: moderate
    description: "The reader judged step-12 replies from scratch drafts whose premises were not verified. Both finalists failed fact-check after about 4 extra subagent rounds, and the run ended with no reply."
    solution: "Before sending reply drafts to the reader, check each draft's one load-bearing claim against its primary source. The Skill exempts reply drafts from full citation-checking, and that let both premises through."
  - session: session_01Tcn6x6mZizT14rJuQqYivt
    date: "2026-10-10"
    severity: minor
    description: "Posted a PR verdict comment with approximate verdict counts (about 33 confirmed) without tallying, breaking verify-before-you-state; needed a correcting comment."
    solution: "Tally from the verdict files before writing any count."
  - session: session_01Mw8k3DVnAyVho8fcDofChZ
    date: "2026-10-10"
    severity: minor
    description: "My first drafts overstated several facts that the fact-check then caught. I read \"bot switched on\" off the config commit's author time instead of its merge, said \"both checks were there before\" without dating them, and wrote \"every saved change\" and \"the record holds none\"."
    solution: "Date a config's effect from its merge to main, not its commit. Check \"every\", \"both\" and \"none\" claims against a listing before writing them. The Skill's two-reviewer loop worked as intended."
  - session: session_01LARTWkGx5vBwRwsMrdftPD
    date: "2026-10-11"
    severity: minor
    description: "Broke 'Verify before you state': declared Bash reads never load rules from one chained-command test; PR #1741 evidence and controlled tests showed lone single-file reads do."
    solution: "Vary one factor per test before generalising; check prior evidence (PR #1741 Checks) first."
  - session: session_01CasnQoauTyLNUxd74agJsP
    date: "2026-10-11"
    severity: minor
    description: "Triage subagent for #1752 posted a wrong claim then edited its comment, and the #1770 agent's Verified section overstated that referenced issues were read; I relayed both without checking the comments."
    solution: "Verify each triage comment's Verified section against the issue before reporting, or brief agents to read every cited issue."
  - session: session_0177ZCpnHq4Sw5wicAEmriDh
    date: "2026-10-11"
    severity: nit
    description: "Fact-check subagent found the first draft's description overbroad; two drafted counts also disagreed with the PR body (CLAUDE.md lines, commit counts), costing re-derivation."
    solution: "Re-derive counts from git before drafting, as the Skill says."
  - session: session_01V3bxJaTSH8AWjrtSoBhNxK
    date: "2026-10-11"
    severity: moderate
    description: "Broke CLAUDE.md 'Verify before you state' — my first answer relayed subagent counts (about 35 fixes, about 210 papercut frictions, three guards removed) without checking each; the ADR-0017 change was an amendment, not a guard removal."
    solution: "Mark subagent-derived counts as approximate or recount them from the extract before stating them."
  - session: session_018i6d2BQPkf9cq6jSEqCNSX
    date: "2026-10-10"
    severity: minor
    description: "My #868 resolution and #1730 brief called the Journal leak test ADR-0004 L2; it is L3 (isolation invariant). A reviewer caught it, costing one fix round and a correction comment"
    solution: "Verify level/term definitions against the ADR before stating them in a brief"
  - session: session_01LuXuScHA2QsY4RXipy9nAt
    date: "2026-10-11"
    severity: minor
    description: "The survey subagent stated that PR 1775 rewrote scripts/shell-reads.ts and called it a regression of that PR; git log showed no such change. It also admitted it never read the mechanism source."
    solution: "The Skill brief already asks to read mechanism source for detector claims; make the survey brief require citing the commit for any 'PR X changed file Y' claim."
  - session: session_01BLrfuHbMMEmjZZ7STpe1AN
    date: "2026-10-11"
    severity: nit
    description: "Two facts in my briefs were wrong: the content DB path (`.output/server/contents.sqlite`, actually `.data/content/contents.sqlite`) copied from an earlier agent's claim, and a stale unit-file count (99, actually 101); the agents caught both."
    solution: "Re-check a subagent's factual claim against the source before pasting it into the next brief, as dispatch-subagents already says."
  - session: session_016iE4LmQUcg6ap5YMxJg4oC
    date: "2026-10-12"
    severity: moderate
    description: "Misdiagnosed the warnings as a Vite chunk-size warning from a local build and truncated CI log, wasting a build, a question to the user and a revert."
    solution: "Read the gate check-run annotations (lint warnings) first; the user's PrisePre typo and truncated log tail invited the guess."
  - session: session_01VGLAakRJNm67PuNHpgbEc7
    date: "2026-10-12"
    severity: moderate
    description: "My first 'loaded' prefix regex was written without checking the real data; about 70 reasons read 'loaded at start;' and would have rendered as broken fragments."
    solution: "Grep landed logs for the actual variants before writing a text transform; the spec reviewer caught it."
  - session: session_01LtYEkEsZ2cxf4uRFJvq4n9
    date: "2026-10-12"
    severity: minor
    description: "Ledger occurrences were appended from the subagent's tally and I reviewed only the diff, not each session id against the logs, so the counts rest on one agent's reading."
    solution: "Have the survey write the ledger changes via a script reading the logs, so the PR reviewer can re-run it."
  - session: session_01596W4GVWwvN1kfaHsV4ax8
    date: "2026-10-12"
    severity: nit
    description: "I relayed subagent claims (for example the #1818 cause) without re-checking them against the source myself."
    solution: "Spot-check one claim per hand-back, or have briefs require cited lines."
  - session: session_01DtK8w6aJ3361uPK73VAxhi
    date: "2026-10-12"
    severity: moderate
    description: "The first draft stated that a PR built from a Public issue waits for a human merge, but merge-pr.ts only refuses Public-authored and fork PRs; the Standards reviewer caught it."
    solution: "Check a stated enforcement claim against the enforcing script before writing it into a Skill."
  - session: session_01La82mxqduxHnRS9jRfNHmU
