name: unverified-claims-in-drafts
summary: >-
  First drafts carried claims nobody had checked, and a reviewer had to catch them.
cause: >-
  First drafts of Digests, posts, docs, reports and CLAUDE.md edits, and subagent claims relayed as fact, carry claims never checked against a primary source; a fact-check or reviewer catches them at the cost of a round.
surface: safe
status: tracked
ref: "regression issue #2144; PR #1756 (blog step 12 fallback); PRs #1852, #1853 (clear-backlog §4 'check every fix yourself')"
fixes:
  - pr: 1756
    date: "2026-10-11"
    summary: "Blog reply drafts now get their key claim checked against its source before a reader sees them."
occurrences:
  - session: session_018DwTn5rSUpmtMHwXBrWqGL
    date: "2026-10-04"
    severity: moderate
    description: "Drafted a link with a made-up commit SHA in a candidate post; caught on my own re-read before anything shipped, but only because I re-read."
    solution: "Never type a SHA; always paste from git rev-parse output. blog-post's citation reference could say so next to the 40-char rule."
  - session: session_01EE8wFRkAWLtXgzdcoceCto
    date: "2026-10-04"
    severity: moderate
    description: "My survey said the probe PR left no recorded finding, but its session log recorded one; I had not read the session logs at survey time, so placement had to be reopened with the user after they had decided."
    solution: "midden-survey step 3 should say to read the session log of each PR candidate before judging significance or suggesting a placement."
  - session: session_01NyDGTR1fuP22hPo7XghCfz
    date: "2026-10-07"
    severity: moderate
    description: "I wrote unverified or false claims into CLAUDE.md ('main has no branch protection', 'CI runs the full gate on every PR'). A self-check and a reviewer caught them."
    solution: "Apply verify-before-you-state to my own instruction text, not only to session reports"
  - session: 1f97b613-f529-4487-a7e9-1115a44b84c7
    date: "2026-10-08"
    severity: moderate
    description: "The overview's first draft carried several unchecked simplifications: guards as 'code that blocks', audit-docs as 'docs vs code', 'Nitro runs the Vue app', and 'design' as the only difference between tenants. Each was easy to verify in the skill or guard docs but went unchecked until the maintainer's review."
    solution: "Before handing over a plain-language summary, re-read the primary file behind each one-line description (SKILL.md, guards.md, the package source) and check the simplification still holds"
  - session: session_01S1WwkpNHDfbvKAf5T1afKq
    date: "2026-10-08"
    severity: moderate
    description: "My first Part 2 rewrite had internal contradictions that all three cold checkers caught (multi-target steps, one file listed on two nodes, accent count, an over-complex feature set). The merge of 10 proposals wasn't self-checked."
    solution: "After merging many proposals, run one adversarial consistency pass myself, or with one agent, before the cold check."
  - session: session_01Tcn6x6mZizT14rJuQqYivt
    date: "2026-10-10"
    severity: minor
    description: "Posted a PR verdict comment with approximate verdict counts (about 33 confirmed) without tallying, breaking verify-before-you-state; needed a correcting comment."
    solution: "Tally from the verdict files before writing any count."
  - session: session_01Mw8k3DVnAyVho8fcDofChZ
    date: "2026-10-10"
    severity: minor
    description: "My first drafts overstated several facts that the fact-check then caught. I read \"bot switched on\" off the config commit's author time instead of its merge, said \"both checks were there before\" without dating them, and wrote \"every saved change\" and \"the record holds none\"."
    solution: "Date a config's effect from its merge to main, not its commit. Check \"every\", \"both\" and \"none\" claims against a listing before writing them. The Skill's two-reviewer loop worked as intended."
  - session: session_01LARTWkGx5vBwRwsMrdftPD
    date: "2026-10-11"
    severity: minor
    description: "Broke 'Verify before you state': declared Bash reads never load rules from one chained-command test; PR #1741 evidence and controlled tests showed lone single-file reads do."
    solution: "Vary one factor per test before generalising; check prior evidence (PR #1741 Checks) first."
  - session: session_01CasnQoauTyLNUxd74agJsP
    date: "2026-10-11"
    severity: minor
    description: "Triage subagent for #1752 posted a wrong claim then edited its comment, and the #1770 agent's Verified section overstated that referenced issues were read; I relayed both without checking the comments."
    solution: "Verify each triage comment's Verified section against the issue before reporting, or brief agents to read every cited issue."
  - session: session_0177ZCpnHq4Sw5wicAEmriDh
    date: "2026-10-11"
    severity: nit
    description: "Fact-check subagent found the first draft's description overbroad; two drafted counts also disagreed with the PR body (CLAUDE.md lines, commit counts), costing re-derivation."
