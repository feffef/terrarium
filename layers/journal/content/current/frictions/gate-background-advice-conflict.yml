name: gate-background-advice-conflict
summary: >-
  Two instructions seemed to disagree on whether to run the long gate check in the background, so agents stopped to work out which applied.
cause: >-
  dispatch-subagents section 3 tells a dispatched subagent to run pnpm gate:scoped in the foreground (a guard denies a subagent's backgrounding), while CLAUDE.md's Self-verification bullet tells the session to start it with run_in_background; an orchestrator reading section 3 takes the subagent line as its own and sees a contradiction, though CLAUDE.md already says a dispatched subagent can't background. Signals: "dispatch-subagents says run the gate in the foreground", "CLAUDE.md says run_in_background", the gate-run choice in a session that dispatches.
surface: safe
status: on-trial
ref: "The fix (section 3 saying its foreground line is for subagents only) lands inside the open Prune Trial territory '.agents/skills/dispatch-subagents/SKILL.md: §3 (Write the brief)' (opened 2026-10-20)."
fixes: []
occurrences:
  - session: session_01JkRFBik4MUWwZcP45q7egk
    date: "2026-10-22"
    severity: nit
    description: "dispatch-subagents says run the gate in the foreground because a guard denies backgrounding, while CLAUDE.md says start any gate over 2 minutes with run_in_background; I followed CLAUDE.md and it worked."
    solution: "State once, in CLAUDE.md, which applies to the orchestrator versus a dispatched subagent."
  - session: session_01CfTFFQrkwq1eUsDy61AJzz
    date: "2026-10-23"
    severity: nit
    description: "dispatch-subagents §3 says to run pnpm gate:scoped in the foreground while CLAUDE.md says run_in_background; I hit the conflict choosing how to run the gate."
    solution: "Point §3 to CLAUDE.md and state that only dispatched subagents run it in the foreground."
