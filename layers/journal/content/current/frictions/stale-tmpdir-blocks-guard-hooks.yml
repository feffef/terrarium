name: stale-tmpdir-blocks-guard-hooks
surface: outside
summary: After a terminal suspend, a stale TMPDIR made every guard hook fail, so every Bash call was blocked until the owner restarted Claude Code.
cause: "A local CLI session resumed with a TMPDIR that no longer exists or is not writable, so each PreToolUse guard hook crashes with EACCES before the tool runs. Signals: 'stale TMPDIR', 'EACCES' in a PreToolUse hook, all Bash blocked after a suspend."
status: open
