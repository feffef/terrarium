    date: "2026-11-10"
    severity: moderate
    description: "Stale TMPDIR after a terminal suspend made every PreToolUse guard hook fail with EACCES, blocking all Bash until the owner restarted Claude Code."
    solution: "Known terminal quirk (memory stale-tmpdir-after-suspend); a guard wrapper could fall back to getconf DARWIN_USER_TEMP_DIR when TMPDIR is unwritable."
