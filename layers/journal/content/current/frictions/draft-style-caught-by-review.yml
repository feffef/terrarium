name: draft-style-caught-by-review
surface: safe
summary: First drafts of posts, PR bodies and write-ups broke the writing Skill's style rules (project jargon, length, a flat or repeated opening), and only a Standards review or the agent's own re-read caught it.
cause: "A Skill that drafts first and reviews after: the drafter ignores its plain-words, length or opening rules, and a Standards reviewer or step-8 re-read finds it, costing a rewrite commit and sometimes a gate rerun. Signals: 'used project jargon the Skill forbids', 'the Standards review caught it', 'first draft ran six paragraphs', 'replayed the previous post', 'jargon in Also shipped'."
status: open
related:
  - entry: drafts-caught-by-fact-check
    rule: The draft carried wrong or overstated facts, not style slips.
notes: |-
  2026-11-11 design: lint check or more style prose dropped: the Skill rules were in the drafter's prompt, the review and step-8 catches worked each time, and the breaks share no rule a check could hold.
  2026-11-13 design: page-check for volatile counts dropped: the counts were written as words, which no check can separate from ordinary prose; the rule was loaded, review caught it before merge, and the rule file is Human-only.
fixes:
  - pr: 3582
    date: "2026-11-22"
    summary: "audit-skills prune-observations.ts reports today's notes outside the 300-500 word range (print-only)"
occurrences:
  - session: session_013zxzeRwYp54RD4CM5MiabZ
    date: "2026-11-09"
    severity: minor
    description: "First draft used project jargon (textbook, ledger, trial, push wording) the Skill forbids; the Standards review caught it, costing a rewrite commit and a second look."
    solution: "Re-read the Skill's plain-English rule against the draft before the fact-check."
  - session: session_013zxzeNkk5oEC8RnBdMeMEt
    date: "2026-11-10"
    severity: minor
    description: "First draft put two routine PRs in the prose and used jargon in Also shipped; the Standards review caught it, costing one more commit and a gate rerun."
    solution: "Before saving, check each prose PR against the routine-PR rule."
  - session: session_013zxzePitVv4rX66ZhZa4kw
    date: "2026-11-09"
    severity: nit
    description: "Wrote the first draft's opening 'The way I would have done it', which replayed Kevin's previous post; step 8 re-read caught it and I rewrote it."
    solution: "Step 4's overlap grep should include opening phrases of the Persona's last three posts, not only topic terms."
  - session: session_013zxzeRvdzBc3xXGo24TkVf
    date: "2026-11-12"
    severity: moderate
    description: "Wrote changing counts and history in Lesson prose (\"has cost over a hundred thousand subagent tokens\", \"two sessions were wrong\") although glassbox-content.md was loaded; only code-review caught it, and the claims were unsourced."
    solution: "Check new prose against glassbox-content.md and each claim against its source before the first commit."
  - session: session_013zxzeRd1qkgnadmWbZLoZu
    date: "2026-11-13"
    severity: nit
    description: "The Digest prose was 264 words against the Skill's 250 cap; code-review caught it and it cost one more commit before the gate."
    solution: "Count the prose words before committing the draft."
  - session: session_013zxzeQ9FTpQjBywTHWkdXF
    date: "2026-11-13"
    severity: minor
    description: "The first version of the draft used the retired term 'Skill pack' fifteen times though GLOSSARY.md is loaded at start and says to write 'installed Skill'; the standards reviewer caught it."
    solution: "Grep a new doc for the glossary's retired terms before committing; a lint rule over docs/ for the retired-term list would catch it without a reviewer."
  - session: session_013zxzeSvCUWdcpBdHi4sdX2
    date: "2026-11-13"
    severity: nit
    description: "Neutral doc first draft named GitHub-like hosts and multi-tenant machinery despite the no-repo-names brief; found only by a grep after writing."
    solution: "Grep the draft for repo and product terms before reporting it done."
  - session: session_013zxzeNmq54AMia53quaCHn
    date: "2026-11-13"
    severity: minor
    description: "The draft was written at about 6900 words against the owner's \"about 4800\"; the size was only measured after writing."
    solution: "Budget words per section before writing a document with a stated length."
  - session: session_013zxzeQnCCyBdXZDEv9qTNh
    date: "2026-11-14"
    severity: minor
    description: "My first draft kept the Digest-fix and PR #2993 history although the owner said rant only; code-review's Spec axis caught it, costing one extra fact-check round."
    solution: "Before drafting, restate the owner's scope answers as a don't list and check each paragraph against it."
  - session: session_013zxzeRsaSP4XhVGZDUk153
    date: "2026-11-19"
    severity: nit
    description: "Audit summaries first carried PR numbers and jargon the Skill forbids; a reviewer caught 11 of them and I rewrote all. Cost one follow-up commit."
    solution: "A check-states-like script could flag digits or a short jargon list in auditSummary text."
  - session: session_013zxzeQ5mMr3n1PjgqM4sUa
    date: "2026-11-19"
    severity: nit
    description: "My first drafts contained shaky sentences (a visitor run 'loaded 217 times', a Karen jab about 'the same hand' measuring both ends) that I only caught from the blind reader and my own re-read."
    solution: "Source each sentence while drafting; the three-candidate step rewards speed over checking."
  - session: session_013zxzeQAV89N7K2uJN1FbsR
    date: "2026-11-20"
    severity: minor
    description: "Seven of 15 first-draft notes were under 300 words, and several summaries used jargon; the review caught both and a follow-up commit and second review round were needed."
    solution: "Count words and scan summaries for terms a site reader lacks before committing."
  - session: session_013zxzeRKMTCrTfnEGHcTwAZ
    date: "2026-11-21"
    severity: minor
    description: "Three notes came out under the 300-word floor on first draft, caught only by the reviewers, costing a follow-up commit and a second two-axis review."
    solution: "Print word counts of the drafted notes in the script that appends them, and refuse under 300."
  - session: session_013zxzeSd7Ki1925oLx6Voj4
    date: "2026-11-22"
    severity: minor
    description: "First draft used Tenant names and insider wording (echo call, builder prompt) and ran about 270 words; review caught it and cost a rewrite commit."
    solution: "Count words and plain-language check before the first save."
  - session: session_013zxzePAekyp1bgbnenrGfK
    date: "2026-11-23"
    severity: nit
    description: "Review's Standards pass found Tenant in prose, a term the Skill bans, after the gate had started, so the fix landed after the gated head."
    solution: "Run the project-term check on the draft before the first commit."
