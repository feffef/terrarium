name: draft-style-caught-by-review
surface: safe
summary: First drafts of posts, PR bodies and write-ups broke the writing Skill's style rules (project jargon, length, a flat or repeated opening), and only a Standards review or the agent's own re-read caught it.
cause: "A Skill that drafts first and reviews after: the drafter ignores its plain-words, length or opening rules, and a Standards reviewer or step-8 re-read finds it, costing a rewrite commit and sometimes a gate rerun. Distinct from drafts-caught-by-fact-check, which is wrong facts. Signals: 'used project jargon the Skill forbids', 'the Standards review caught it', 'first draft ran six paragraphs', 'replayed the previous post', 'jargon in Also shipped'."
status: open
notes: |-
  2026-11-11 design: lint check or more style prose dropped: the Skill rules were in the drafter's prompt, the review and step-8 catches worked each time, and the breaks share no rule a check could hold.
  2026-11-13 design: page-check for volatile counts dropped: the counts were written as words, which no check can separate from ordinary prose; the rule was loaded, review caught it before merge, and the rule file is Human-only.
occurrences:
  - session: session_013zxzeRwYp54RD4CM5MiabZ
    date: "2026-11-09"
    severity: minor
    description: "First draft used project jargon (textbook, ledger, trial, push wording) the Skill forbids; the Standards review caught it, costing a rewrite commit and a second look."
    solution: "Re-read the Skill's plain-English rule against the draft before the fact-check."
  - session: session_013zxzeNkk5oEC8RnBdMeMEt
    date: "2026-11-10"
    severity: minor
    description: "First draft put two routine PRs in the prose and used jargon in Also shipped; the Standards review caught it, costing one more commit and a gate rerun."
    solution: "Before saving, check each prose PR against the routine-PR rule."
  - session: session_013zxzeR6WXvZ48FrLjwtn9b
    date: "2026-11-08"
    severity: minor
    description: "Three candidates plus a draft rewrite for a post whose first-draft body ran six paragraphs; reviewers flagged length and a flat opening, costing a restructure and two extra fact-check passes."
    solution: "Draft to the four-paragraph norm and open on the strongest receipt before the blind read."
  - session: session_013zxzePitVv4rX66ZhZa4kw
    date: "2026-11-09"
    severity: nit
    description: "Wrote the first draft's opening 'The way I would have done it', which replayed Kevin's previous post; step 8 re-read caught it and I rewrote it."
    solution: "Step 4's overlap grep should include opening phrases of the Persona's last three posts, not only topic terms."
  - session: session_013zxzeRvdzBc3xXGo24TkVf
    date: "2026-11-12"
    severity: moderate
    description: "Wrote changing counts and history in Lesson prose (\"has cost over a hundred thousand subagent tokens\", \"two sessions were wrong\") although glassbox-content.md was loaded; only code-review caught it, and the claims were unsourced."
    solution: "Check new prose against glassbox-content.md and each claim against its source before the first commit."
  - session: session_013zxzeRd1qkgnadmWbZLoZu
    date: "2026-11-13"
    severity: nit
    description: "The Digest prose was 264 words against the Skill's 250 cap; code-review caught it and it cost one more commit before the gate."
    solution: "Count the prose words before committing the draft."
  - session: session_013zxzeQ9FTpQjBywTHWkdXF
    date: "2026-11-13"
    severity: minor
    description: "The first version of the draft used the retired term 'Skill pack' fifteen times though GLOSSARY.md is loaded at start and says to write 'installed Skill'; the standards reviewer caught it."
    solution: "Grep a new doc for the glossary's retired terms before committing; a lint rule over docs/ for the retired-term list would catch it without a reviewer."
  - session: session_013zxzeSvCUWdcpBdHi4sdX2
    date: "2026-11-13"
    severity: nit
    description: "Neutral doc first draft named GitHub-like hosts and multi-tenant machinery despite the no-repo-names brief; found only by a grep after writing."
    solution: "Grep the draft for repo and product terms before reporting it done."
