name: readonly-brief-vs-helped-hint
surface: guard-or-hook
summary: A subagent briefed as read-only is hinted to run helped.sh, which the permission classifier denies or the agent skips, leaving its rule-verdict row unanswered.
cause: "The SubagentStart hint tells every subagent to run scripts/session/helped.sh even when the brief says read-only; the agent either follows the brief and skips it or runs it and the auto-mode classifier denies it. Signals: 'read-only', 'helped.sh', 'classifier denied', 'ledger row unanswered'."
status: open
occurrences:
  - session: session_013zxzeSreQ7NRPpBQ2QtvEs
    date: "2026-11-10"
    severity: minor
    description: "A read-only brief barring writes made the Explore agent skip helped.sh, leaving its ledger row unanswered."
    solution: "Exempt helped.sh from read-only brief wording."
  - session: session_013zxzeRFyoLhQz55N76NoCM
    date: "2026-11-10"
    severity: nit
    description: "Explore subagent, told to be read-only, was hinted to run helped.sh and the permission classifier denied it."
    solution: "Do not hint read-only subagents to run a script, or allow helped.sh for them."
