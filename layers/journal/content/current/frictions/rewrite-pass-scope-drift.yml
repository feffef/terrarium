name: rewrite-pass-scope-drift
summary: >-
  A rewrite, reword or trim changed what the text meant, dropping or tightening a rule, and review had to catch it.
cause: >-
  An agent rewriting a Skill, doc or definition to a stated goal (plain rewrite, prune, compression) works from a mental checklist instead of diffing old against new rule by rule: it drops a rule, pointer, qualifier or why that was meant to stay, or adds a stricter rule. Signals: "lost a rule", "dropped ... exception", "a prune must not change meaning", "review caught both".
surface: safe
status: open
notes: |-
  2026-10-23 design: a rewrite-discipline line dropped: the two newer sessions were caught by code-review before merge, no session shipped the drift, and the candidate homes sit in open Prune Trial territory.
occurrences:
  - session: session_01BZNS3KuWTBxqAHxTfx3uzp
    date: "2026-10-25"
    severity: minor
    description: "My first shortened descriptions dropped each page's point; the Spec review caught it and I redid three of four, costing an extra build cycle."
    solution: "Keep the distinctive clause and cut elsewhere; check against the page body before committing."
  - session: session_013zxzePQM2TjRCTtcKaV61o
    date: "2026-10-29"
    severity: nit
    description: "First prune dropped four rules and the ledger claimed every rule was kept; code-review caught it before the push."
    solution: "List every rule in the section before trimming and check each against the new text."
  - session: session_013zxzeRUFEQvJ2mE6PXbv3w
    date: "2026-11-03"
    severity: minor
    description: "My first prune cut the ADR bullet and typecheck clause in ways that lost meaning; reviewers caught both before the push and I reverted them."
    solution: "Before committing a CLAUDE.md wording cut, reread each cut bullet against the rule summaries it paraphrases."
