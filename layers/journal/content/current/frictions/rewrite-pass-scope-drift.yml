name: rewrite-pass-scope-drift
summary: >-
  A rewrite, reword or trim changed what the text meant, dropping or tightening a rule, and review had to catch it.
cause: >-
  An agent rewriting a Skill, doc or definition to a stated goal (plain rewrite, prune, compression) works from a mental checklist instead of diffing old against new rule by rule: it drops a rule, pointer, qualifier or why that was meant to stay, or adds a stricter rule. Signals: "lost a rule", "dropped ... exception", "a prune must not change meaning", "review caught both".
surface: safe
status: open
notes: |-
  2026-10-23 design: a rewrite-discipline line dropped: the two newer sessions were caught by code-review before merge, no session shipped the drift, and the candidate homes sit in open Prune Trial territory.
occurrences:
  - session: session_01FTPnEsW1XNhaqYFdxaE24v
    date: "2026-10-20"
    severity: minor
    description: "First rewrite pass dropped several pointers and why-clauses and a no-argument default while claiming every rule kept; the spec review caught them."
    solution: "Before committing a whole-file rewrite, diff an old-vs-new rule checklist myself rather than relying on review to find losses."
  - session: session_0149fVyZ37qWGMuwVPw3Uryc
    date: "2026-10-22"
    severity: nit
    description: "First draft of the reword added stricter rules and an inaccurate ledger claim, caught by Standards/Spec review; a prune must not change meaning."
    solution: "Diff the old and new text rule by rule before committing."
  - session: session_019CbZiWqLbydExXQCmHRDyg
    date: "2026-10-22"
    severity: minor
    description: "Trimming the Human-only definition dropped ADR-0004's Dependabot exception, a meaning change caught in the second review."
    solution: "When compressing a definition, diff each qualifier against its ADR before committing."
  - session: session_01BZNS3KuWTBxqAHxTfx3uzp
    date: "2026-10-25"
    severity: minor
    description: "My first shortened descriptions dropped each page's point; the Spec review caught it and I redid three of four, costing an extra build cycle."
    solution: "Keep the distinctive clause and cut elsewhere; check against the page body before committing."
