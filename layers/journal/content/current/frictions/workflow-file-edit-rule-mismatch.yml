name: workflow-file-edit-rule-mismatch
summary: >-
  The docs said agents cannot push GitHub workflow files, but a local session can, so agents planned around a limit that did not apply and tried to slip an edit past the guard.
cause: >-
  ADR-0026, its rule, environment-caveats.md and the workflow-edit guard treated the missing `workflow` token scope as universal, though only a cloud session lacks it; a local session pushes with the owner's SSH key. Signals: `.github/workflows/`, workflow-edit guard, `git apply` from a scratchpad diff, "ready-for-human" issue whose only change is a workflow.
surface: safe
status: open
ref: "issue #2174 closed by PR #2177"
fixes:
  - pr: 2177
    date: "2026-10-16"
    summary: "The workflow-edit guard now denies a write into .github/workflows/ only in a cloud session; ADR-0026, its rule and the caveat docs scope the limit to cloud sessions."
occurrences:
  - session: 5ba40529-d06b-4b13-a44a-a01292148909
    date: "2026-10-16"
    severity: moderate
    description: "ADR-0026's rule, environment-caveats and the workflow-edit guard say agents can't push workflow files, but a local session can push over SSH"
    solution: "Scope the caveat and the ADR-0026 rule to cloud sessions, and let the guard allow local sessions; the guard and ADR are Human-only"
