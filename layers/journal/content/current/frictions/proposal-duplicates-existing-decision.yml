name: proposal-duplicates-existing-decision
summary: Agents proposed features or retro candidates without checking the tracker, the Friction Ledger or the site for something already settled, and the owner or refinement killed them.
cause: "A candidate list (retro candidates, visitor-loop feature picks) is built before searching issues, the Friction Ledger, Tenant decisions.md/GLOSSARY or the live homepage for an existing feature or a recorded owner decision; the duplicate check filters too narrowly (by Tenant name) or skips a source. Signals: 'before searching issues or the Friction Ledger', 'duplicate check', 'the owner had to ask me to check', 'two feature picks died in refinement'."
surface: safe
status: open
related:
  - entry: premise-not-questioned
    rule: A change was built without asking whether it should exist or how big it should be.
  - entry: prune-trial-territory-unchecked
    rule: A claim about or action in a Prune Trial's territory skipped .agents/prune-trials.yml.
notes: |-
  2026-11-04 design: no change dropped: the retro half is an installed Skill (ADR-0015) and the visitor-loop half was closed by PR #2824 (decisions.md line) with the step 4 refiner as backstop; revisit on a third occurrence.
  2026-11-14 design: no change: the newest occurrence is a nit that review caught, and the earlier mechanism drop stands. dropped: a CLAUDE.md 'Question the premise' phrase; revisit on a moderate recurrence.
occurrences:
  - session: session_013zxzeNd2Ethpd3anqbmpkr
    date: "2026-11-09"
    severity: minor
    description: "Proposed changes to the Bash read hint and mermaid-lanes without checking the Friction Ledger and closed issues; the owner had already decided both, found only after the user's frictions question."
    solution: "Search the ledger and closed issues for an existing decision before proposing a change to a mechanism."
  - session: session_013zxzePXpUx7WY6K2uHsxKz
    date: "2026-11-12"
    severity: nit
    description: "Added Glass Box to the footer site list as a consistency fix, against an owner ruling in visitor-loop decisions.md that fixes that list; review caught it and I reverted."
    solution: "Grep .agents/skills/*/decisions.md for a list before extending it, or point app/utils/sites.ts at its ruling in a comment."
  - session: session_013zxzeNrvAWHmAPYsSy8u7x
    date: "2026-11-12"
    severity: nit
    description: "Found issue 3105 had already said the detached-HEAD push is in the Ledger only after drafting it as a candidate; my summary-line check had missed the covering entry."
    solution: "Read a closed Seedling on the same doc before drafting a learning for it."
  - session: session_013zxzePBxPjfMQRm8C4FwqZ
    date: "2026-11-18"
    severity: minor
    description: "I offered 'a page under /t/blog' as Q7.1a without checking ADR-0016/0006; the owner picked it, forcing an extra question (Q8) about where the page lives."
    solution: "Before offering a routing or URL option in a grilling question, read the ADRs that govern routes; have the explore agent list route constraints."
