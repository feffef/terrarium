    date: "2026-10-15"
    severity: nit
    description: "A push of the restarted branch with force-with-lease was rejected as stale info because the remote branch had been deleted on merge; needed git remote prune and a plain push."
    solution: "pr-workflow.md already says push plainly after a restart; follow it instead of using the lease."
