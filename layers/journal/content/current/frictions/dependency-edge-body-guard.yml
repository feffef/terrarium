name: "dependency-edge-body-guard"
summary: >-
  A safety check blocked a GitHub request whose text it could not read in advance, so agents retyped it by hand.
cause: "issue-tracker.md's Blocking recipe gets run with a stdin or variable-built body; github-provenance-guard denies any gh api / curl body it cannot read (by design, #1900), so the edges are retyped literally."
surface: "safe"
status: "fixed"
fixedOn: "2026-10-15"
ref: "docs/agents/issue-tracker.md Blocking clause"
fixes:
  - pr: 2030
    date: "2026-10-15"
    summary: "Added a note to the issue-tracker Blocking recipe that edge bodies must be typed literally, not piped."
occurrences:
  - session: "session_01BdQnbVQmdfrD1PPyZTnL9w"
    date: "2026-10-14"
    severity: "nit"
    description: "Wired blocking edges with gh api --input stdin; the provenance guard blocked it even though the body was only an issue id."
    solution: "Follow issue-tracker.md's -F issue_id= form from the start; it passed the guard."
  - session: "session_01Dcufz27EyPsKy6sYafpKRg"
    date: "2026-10-14"
    severity: "minor"
    description: "The ADR-0017 guard blocked a curl loop that built dependency-edge bodies from variables, so I had to rewrite it as 44 literal curl calls"
    solution: "Add an MCP tool or a small repo script for issue dependencies, so blocking edges need no hand-written curl"
