name: full-adr-read-skipped
summary: >-
  Agents relied on an ADR's short summary when its rule said to read the full ADR.
cause: >-
  Each ADR summary rule says to read the full ADR in some cases, and sessions whose task touched the topic used the summary (or pr-workflow.md) instead; most found the summary enough, so the read-in-full line reads as optional. Signals: "did not open the full ADR-000N", "their summaries said to read them", "relied on the rule summaries".
surface: safe
status: open
fixes:
  - pr: 2165
    date: "2026-10-16"
    summary: "Each ADR summary rule now says when to read its full ADR, naming what only the ADR holds."
