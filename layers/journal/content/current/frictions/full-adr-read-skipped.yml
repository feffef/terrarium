    date: "2026-10-16"
    severity: nit
    description: "Edited ADR-0009 text after reading only its rejected-alternatives section, not the full ADR the summary rule asks for; a checker did read it in full."
    solution: "Read the whole ADR before editing it."
  - session: session_01Fay2GiWTwxDKnnqS9DznHk
