name: full-adr-read-skipped
summary: >-
  Agents relied on an ADR's short summary when its rule said to read the full ADR.
cause: >-
  Each ADR summary rule says to read the full ADR in some cases, and sessions whose task touched the topic used the summary (or pr-workflow.md) instead; most found the summary enough, so the read-in-full line reads as optional. A late read the adr-read hint prompted after an edit, with no other cost, belongs in adr-read-after-edit. Signals: "did not open the full ADR-000N", "their summaries said to read them", "relied on the rule summaries".
surface: safe
status: open
fixes:
  - pr: 2165
    date: "2026-10-16"
    summary: "Each ADR summary rule now says when to read its full ADR, naming what only the ADR holds."
  - pr: 2431
    date: "2026-10-23"
    summary: "Retired the adr-check Skill and its CLAUDE.md trigger; a new PostToolUse hook (adr-read-hint.ts) now names, once per agent, each ADR an Edit or Write touches by its rule paths or by number and that the agent has not read in full."
  - pr: 2572
    date: "2026-10-26"
    summary: "digest step 3 says to read ADR-0010 in full before saving the first Digest (partial)."
occurrences:
