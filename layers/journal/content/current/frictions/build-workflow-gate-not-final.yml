name: build-workflow-gate-not-final
summary: >-
  The backlog build workflow trusted a helper agent's word on the gate instead of a gate run on the branch's final commit, so it reported a pass that had not run or failed a branch that was green.
cause: >-
  clear-backlog-build returns gatePassed from a gate:scoped run that may predate its last review-fix round, or a fix round's own report, and clear-backlog section 3 does not say whether the orchestrator re-runs the gate before pushing. Signals: 'reported gatePassed while saying it had not rerun the gate', pushing on the workflow's gatePassed, 'returned as failed though the fix round was done'.
surface: safe
status: open
ref: "issue #2523 closed by PR #2532"
fixes: [ { pr: 2532, date: "2026-10-25", summary: "clear-backlog-build runs a final gate agent on HEAD and marks a branch ready-to-push only when that agent reports a pass." } ]
occurrences:
  - session: session_013QKXoGLaEHEJanyw5TrPqj
    date: "2026-10-25"
    severity: minor
    description: "clear-backlog-build returned the #2503 hook branch as failed (its fix round reported done without a passing gate:scoped), leaving six review findings to judge and fix by hand."
    solution: "clear-backlog-build could re-run gate:scoped itself after a fix round instead of trusting the agent, so a green branch is never classed failed."
