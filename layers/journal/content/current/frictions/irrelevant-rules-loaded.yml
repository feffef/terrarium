name: irrelevant-rules-loaded
summary: >-
  Rules for unrelated ADRs loaded into sessions whose work they do not touch.
cause: "Hook-injected or session-start rule files (adr-0005, adr-0021, adr-0027, adr-0029 and others) add context with no bearing on the task. Signals: 'loaded after plain reads of unrelated docs', 'loaded at session start though irrelevant', 'no bearing'."
surface: guard-or-hook
status: open
ref: "issue #2167 closed 2026-10-23: owner kept bash-rules-hint.ts as is; no open issue or trial tracks it."
occurrences:
  - session: session_01CfTFFQrkwq1eUsDy61AJzz
    date: "2026-10-23"
    severity: nit
    description: "Subagents' tool results carried many unrelated ADR rules loaded by ledger file reads, costing context in the survey with no use."
    solution: "Narrow the paths of the rules that load on layers/journal/content/current/frictions/*.yml."
  - session: session_01PGQQj6iUaMYCkphVjFEsBP
    date: "2026-10-25"
    severity: minor
    description: "Every subagent loaded about a dozen unrelated rules (ADR summaries, mermaid-lanes, glossary rules) for prose-only work, and each had to grade them."
    solution: "Narrow the paths of adr-0021, tenant-glossary, glossary-terms and mermaid-lanes so they do not load when reading Glass Box content pages."
  - session: session_017vrdmQQwC4obwbJS9G5Dyg
    date: "2026-10-25"
    severity: nit
    description: "Reading ledger and tenant.config.ts files loaded five unrelated rules (adr-0002, adr-0008, data-shapes, mdc-when-to-use, tenant-layers) into this ledger-only run."
    solution: "Narrow those rules' paths so reading the Journal ledger files does not load them."
  - session: session_013zxzeRrC6V68k1QwREpWtf
    date: "2026-11-02"
    severity: minor
    description: "Many unrelated ADR rules loaded into reviewer and checker subagents when they read ADRs, adding noise to their verdict reports."
    solution: "Narrower rule paths, or tell read-only auditors that rule verdicts are unneeded."
  - session: session_013zxzeRrK38XMhpkF7RSfp2
    date: "2026-11-02"
    severity: nit
    description: "Path-scoped rules (tenant-layers, data-shapes, mdc, adr-0002) loaded by merely reading the blog tenant.config.ts for tags; none applied to a content post."
    solution: "Narrow those rules' paths so a read-only look at a config for its tag list does not load them."
  - session: session_013zxzeSbc2WJGVqnu6YVjXr
    date: "2026-11-02"
    severity: nit
    description: "adr-0004-human-merge rule fired on merely reading ADR files, saying 'You just touched a Human-only file' when nothing was edited"
    solution: "Fire that rule only on edits, or reword it for reads"
  - session: session_013zxzeShpLwnUmQEGZdog9F
    date: "2026-11-05"
    severity: nit
    description: "Rules unrelated to the task (adr-0021, guards, adr-0022 and others) loaded into the search subagent as hook side effects, adding noise to its report."
    solution: "Narrower paths for those rules so a grep over scripts or journal files doesn't load them."
