name: irrelevant-rules-loaded
summary: >-
  Rules for unrelated ADRs loaded into sessions whose work they do not touch.
cause: "Hook-injected or session-start rule files (adr-0005, adr-0021, adr-0027, adr-0029 and others) add context with no bearing on the task. Signals: 'loaded after plain reads of unrelated docs', 'loaded at session start though irrelevant', 'no bearing'."
surface: guard-or-hook
status: open
ref: "issue #2167 closed 2026-10-23: owner kept bash-rules-hint.ts as is; no open issue or trial tracks it."
occurrences:
  - session: session_01PGQQj6iUaMYCkphVjFEsBP
    date: "2026-10-25"
    severity: minor
    description: "Every subagent loaded about a dozen unrelated rules (ADR summaries, mermaid-lanes, glossary rules) for prose-only work, and each had to grade them."
    solution: "Narrow the paths of adr-0021, tenant-glossary, glossary-terms and mermaid-lanes so they do not load when reading Glass Box content pages."
  - session: session_017vrdmQQwC4obwbJS9G5Dyg
