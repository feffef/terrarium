name: subagent-brief-omits-verdict-ask
summary: Briefs for helper agents left out the lines CLAUDE.md asks every brief to carry (rule and doc verdicts, a scratchpad subfolder per agent), so verdicts went missing and output landed elsewhere.
cause: "CLAUDE.md asks every subagent brief for a rule/doc verdict in the final reply (PR #2060), a scratchpad subfolder named for the agent, sources for counts, and the read-first triggers (git, GitHub docs) the agent's work needs; nothing puts those lines into a brief and the dispatch-subagents Skill does not carry them, so orchestrators omit them from hand-written, one-off and Skill-templated briefs alike. Since PR #2645 the Journal marks every loaded rule without a verdict as 'no verdict provided', so the omission shows but is not prevented. Signals: 'briefs didn't ask for rule and doc verdicts', 'no verdict provided', output written outside a per-agent scratchpad subfolder, unverified figures in a report, a subagent reading git-conventions late. Since PR #2932 (2026-11-07) dispatch-subagents section 3 opens with a pointer to CLAUDE.md's every-brief asks. Since PR #3010 (2026-11-10) rule use is captured by hooks (a SubagentStart note and a rule-load ledger), not a brief line; the verdict ask is retired."
surface: safe
status: open
related:
  - entry: subagent-brief-defects
    rule: The brief has those lines but carries a wrong path, value or placeholder.
  - entry: shared-scratchpad-collisions
    rule: Parallel agents wrote to one scratchpad folder or overwrote each other's helpers.
  - entry: pending-verdicts-subagent-only-docs
    rule: log-session --pending asked for verdicts on docs only subagents read.
  - entry: save-handback-skipped
    rule: The orchestrator skipped save-handback.ts for subagent replies.
fixes:
  - pr: 1964
    date: "2026-10-14"
    summary: Session logs now show one verdict list per session, with subagents' answers merged in.
  - pr: 2060
    date: "2026-10-15"
    summary: A CLAUDE.md line asks every subagent brief for verdicts in its final reply; the later SendMessage step is removed.
  - pr: 2206
    date: "2026-10-17"
    summary: "The blind-reader briefs in the blog, visitor-loop, digest, audit-skills and midden Skills now end with the rule and doc verdict request."
  - pr: 2645
    date: "2026-10-28"
    summary: "The Journal session card marks every loaded rule without a verdict as 'no verdict provided', whoever loaded it, so omitted verdicts show."
  - pr: 2932
    date: "2026-11-07"
    summary: "Closes #2911: dispatch-subagents SKILL.md section 3 points at CLAUDE.md's every-brief asks instead of restating them."
  - pr: 3010
    date: "2026-11-10"
    summary: "Replaced the rule and doc verdict ask in subagent briefs with out-of-band rule-load and helped.sh hooks that give every subagent a static note."
