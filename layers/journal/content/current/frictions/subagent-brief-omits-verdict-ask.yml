name: subagent-brief-omits-verdict-ask
summary: Briefs for helper agents left out the lines CLAUDE.md asks every brief to carry (rule and doc verdicts, a scratchpad subfolder per agent), so verdicts went missing and output landed elsewhere.
cause: "CLAUDE.md asks every subagent brief for a rule/doc verdict in the final reply (PR #2060) and for a scratchpad subfolder named for the agent; nothing puts those lines into a brief, so orchestrators omit them from hand-written, one-off and Skill-templated briefs alike. Since PR #2645 the Journal marks every loaded rule without a verdict as 'no verdict provided', so the omission shows but is not prevented. Signals: 'briefs didn't ask for rule and doc verdicts', 'no verdict provided', output written outside a per-agent scratchpad subfolder."
surface: safe
status: open
ref: "Owner kept the request (issue #2115 closed not-planned 2026-10-16); 01E2zbWE (nit, after the fix) shows it still gets omitted."
fixes:
  - pr: 1964
    date: "2026-10-14"
    summary: Session logs now show one verdict list per session, with subagents' answers merged in.
  - pr: 2060
    date: "2026-10-15"
    summary: A CLAUDE.md line asks every subagent brief for verdicts in its final reply; the later SendMessage step is removed.
  - pr: 2206
    date: "2026-10-17"
    summary: "The blind-reader briefs in the blog, visitor-loop, digest, audit-skills and midden Skills now end with the rule and doc verdict request."
  - pr: 2645
    date: "2026-10-28"
    summary: "The Journal session card marks every loaded rule without a verdict as 'no verdict provided', whoever loaded it, so omitted verdicts show."
occurrences:
  - session: session_01Hw8mVJmgWejGc6YWi8ngnm
    date: "2026-10-23"
    severity: nit
    description: "The two code-review agent prompts omitted the CLAUDE.md request for a rule and doc verdict in the final reply."
    solution: "Put the verdict request in a reusable brief snippet so every dispatch carries it."
  - session: session_013zxzeQZYwzDuf4JEncnqAa
    date: "2026-11-02"
    severity: nit
    description: "Fix-round SendMessages to resumed writers did not repeat CLAUDE.md's ask for rule and doc verdicts; only the original briefs did"
    solution: "Include the verdict ask in every resume message"
