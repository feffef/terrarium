name: subagent-brief-omits-verdict-ask
summary: Briefs for helper agents left out the lines CLAUDE.md asks every brief to carry (rule and doc verdicts, a scratchpad subfolder per agent), so verdicts went missing and output landed elsewhere.
cause: "CLAUDE.md asks every subagent brief for a rule/doc verdict in the final reply (PR #2060) and for a scratchpad subfolder named for the agent; nothing puts those lines into a brief, so orchestrators omit them from hand-written, one-off and Skill-templated briefs alike. Signals: 'briefs didn't ask for rule and doc verdicts', 'no verdict provided', output written outside a per-agent scratchpad subfolder."
surface: safe
status: open
ref: "Owner kept the request (issue #2115 closed not-planned 2026-10-16); 01E2zbWE (nit, after the fix) shows it still gets omitted."
fixes:
  - pr: 1964
    date: "2026-10-14"
    summary: Session logs now show one verdict list per session, with subagents' answers merged in.
  - pr: 2060
    date: "2026-10-15"
    summary: A CLAUDE.md line asks every subagent brief for verdicts in its final reply; the later SendMessage step is removed.
  - pr: 2206
    date: "2026-10-17"
    summary: "The blind-reader briefs in the blog, visitor-loop, digest, audit-skills and midden Skills now end with the rule and doc verdict request."
occurrences:
  - session: session_01BdQnbVQmdfrD1PPyZTnL9w
    date: "2026-10-14"
    severity: nit
    description: "My three subagent briefs didn't ask for rule and doc verdicts, so 49 subagent-only reads have no verdict in this log."
    solution: "Read the dispatch-subagents Skill before dispatching any subagent, not only git-touching ones, and add its verdict request to each brief."
  - session: session_01GG85r8HWMEdaMgKUaNUZH7
    date: "2026-10-14"
    severity: minor
    description: "Did not collect rule and doc verdicts from the roughly 40 subagents; their rules show as unknown in this log"
    solution: "Ask each writer for verdicts in its hand-back template so no extra round trip is needed"
  - session: session_01E2zbWEQmuUrEhWvbzNpBba
    date: "2026-10-15"
    severity: nit
    description: "Two of the three deep-research briefs omitted the rule/doc verdict request CLAUDE.md requires of every subagent brief."
    solution: "Append the verdict line to every brief, including Skill-templated ones."
  - session: session_01Mf4dUxuWB7WtkC5fVzByH6
    date: "2026-10-16"
    severity: nit
    description: "I forgot the CLAUDE.md verdict request in the two code-review spec briefs for the first PR and used wording from memory in the second; no verdicts came back from them."
    solution: "Put the verdict line into the code-review Skill's sub-agent briefs, or a shared brief snippet."
  - session: session_014PZ7z8L13nqP7rPdCgZRcM
    date: "2026-10-17"
    severity: nit
    description: "The first probe subagent brief said use no other tools and did not ask for the per-rule verdicts or a scratchpad subfolder that CLAUDE.md requires of every subagent brief."
    solution: "Put the CLAUDE.md subagent-brief lines in a reusable snippet or a dispatch-subagents checklist so a one-off probe still carries them."
  - session: session_01XWMuHGcaNTvRPHfYb9T7z2
    date: "2026-10-19"
    severity: nit
    description: "First Explore brief omitted the CLAUDE.md line about a per-subagent scratchpad subfolder (it wrote nothing, so no harm)"
    solution: "Keep a brief template with the verdict and scratchpad lines"
  - session: session_01MwrXDH7XwMNUofgz3HvQ5N
    date: "2026-10-19"
    severity: nit
    description: "The first two recipe runs wrote their output to .throwaway rather than a scratchpad subfolder named for each subagent, as CLAUDE.md asks."
    solution: "Put the OUT folder under the scratchpad, named per subagent, in every brief."
  - session: session_01Hw8mVJmgWejGc6YWi8ngnm
    date: "2026-10-23"
    severity: nit
    description: "The two code-review agent prompts omitted the CLAUDE.md request for a rule and doc verdict in the final reply."
    solution: "Put the verdict request in a reusable brief snippet so every dispatch carries it."
