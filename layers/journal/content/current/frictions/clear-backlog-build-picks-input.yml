name: clear-backlog-build-picks-input
summary: >-
  The backlog workflows showed every agent the owner's whole chat reply, so agents treated picks meant for other questions or branches as their own instructions.
cause: >-
  The Workflow harness relays the owner's chat reply to every workflow agent (explore triage and build), and clear-backlog passed each build branch all the picks, so an agent read another question's or branch's answer as binding on itself or as an owner decision. Signals: a build agent following another branch's pick, a triage agent saying the owner decided something from a relayed '1a 2a', issue #2399. Stray 01JygBaH (picks passed as a string failed the run, fixed by PR #2240) needs a different fix.
surface: safe
status: open
ref: "Issue #2399 (regression of #2240) closed by PR #2405. Issue #2232 (picks as a plain string)."
fixes:
  - pr: 2067
    date: "2026-10-15"
    summary: "Fixed remaining clear-backlog gaps: per-branch picks, label docs, and a dispatch-subagents trigger."
  - pr: 2240
    date: "2026-10-18"
    summary: "clear-backlog no longer leaves out issues whose fix changes a guard or hook wiring, and the build workflow accepts picks given as a plain string."
  - pr: 2405
    date: "2026-10-22"
    summary: "Each clear-backlog workflow brief now says the relayed user reply answers the orchestrator's questions for the whole run and is not the agent's own decision."
occurrences:
  - session: session_01BYiuxza1S1QZgmyXngfzLE
    date: "2026-10-22"
    severity: nit
    description: "The #2399 regression recurred live: the Workflow harness relayed the owner's '1a, 2a' to triage agents; they ignored it, but two spent effort reasoning about it."
    solution: "PR #2405 adds a RELAYED_REPLY sentence to both clear-backlog workflow briefs."
