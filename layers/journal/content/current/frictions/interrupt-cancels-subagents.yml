name: interrupt-cancels-subagents
summary: >-
  Interrupting an agent silently stopped its helpers, and it went on reporting them as running.
cause: >-
  A user interrupt cancels running Agent subagents with no notification, and nothing tells the orchestrator to check, so it keeps reporting them as running.
surface: safe
status: open
ref: "frictions-to-fixes 2026-10-13b grouped doc PR: dispatch-subagents §3 says to check agents are alive after an interrupt"
fixes:
  - pr: 1882
    date: "2026-10-13"
    summary: "Orchestration guidance now says to check helper agents are still alive after the user interrupts."
occurrences:
  - session: session_01STVS35HcxNZp7dQ1pPnrhW
    date: "2026-10-13"
    severity: major
    description: "Told the owner three times that the four triage agents were still running; the owner's interrupt had cancelled them at 05:06 and I never checked"
    solution: "After any interrupt, verify subagent liveness (transcript tail or SendMessage) before reporting status; clear-backlog could say an interrupt cancels running agents"
