name: commit-trailer-guard
summary: >-
  Agents were told to add a signature line to commits by hand, and a safety check then blocked the hand-written line.
cause: >-
  The harness attribution reminder told sessions to hand-write the Co-Authored-By and Claude-Session trailer the commit-msg hook adds, and the commit-trailer guard denied the hand-written one.
surface: guard-or-hook
status: open
ref: "issue #1652; commit c9763310"
fixes:
  - pr: 1735
    date: "2026-10-10"
    summary: "Removed the commit-trailer guard, so hand-written trailers are no longer denied; recognised current models."
occurrences:
  - session: session_015UvXah6phvbuMpUWmf5rYs
    date: "2026-10-08"
    severity: minor
    description: "Hand-wrote Co-Authored-By and Claude-Session trailers in a commit, copying the harness reminder; commit-trailer-guard denied it, nothing ran."
    solution: "The system reminder's attribution text conflicts with the CLAUDE.md rule; the repo rule should win, or the reminder should be dropped here."
  - session: session_01UvFUKPkQSkZS1qS7VndRqX
    date: "2026-10-08"
    severity: nit
    description: "The harness attribution reminder says to end commits and PR bodies with trailers, but CLAUDE.md says never hand-write the commit trailer; I followed CLAUDE.md and the hook added it."
    solution: "Make the harness reminder and CLAUDE.md agree, or point CLAUDE.md at the guard that names the marker."
  - session: session_01GGSSswkV3J9p255u5hcvSp
    date: "2026-10-09"
    severity: minor
    description: "Hand-wrote Co-Authored-By and Claude-Session trailers in a git commit command; the commit-trailer guard denied the whole call, so the staged edit and gate chain did not run (CLAUDE.md: never hand-write the commit trailer)."
    solution: "The attribution system-reminder says to end commits with those lines while CLAUDE.md forbids it; make the reminder defer to the guard."
  - session: session_01NHHafnvmf9qkvq85pvMYzc
    date: "2026-10-09"
    severity: nit
    description: "The harness attribution reminder says to hand-write the Co-Authored-By trailer; the repo commit-trailer guard denies that. The denied Bash call also dropped an earlier python edit in the same call, so it had to be re-run."
    solution: "Keep file edits and commits in separate Bash calls; the guard message should state it denies the whole call, and the attribution reminder should defer to the repo."
  - session: session_01VaPP7iMRxMvKvX8KQh1qeY
    date: "2026-10-09"
    severity: minor
    description: "commit-trailer-guard denied a Bash python heredoc that only edited a test file, because the heredoc text contained a git commit fixture and a Claude-Session: string. Worked around by writing the script to a file first."
    solution: "The guard could ignore text inside heredoc bodies, or anchor git commit at command position, the same fix this PR applies to session-id-guard."
  - session: session_01KRLFYUD31NaEVTs4Qs1Tzj
    date: "2026-10-10"
    severity: nit
    description: "Tried to hand-write the Co-Authored-By trailer from the attribution reminder in a git commit; commit-trailer-guard denied the whole call, including a chained file edit."
    solution: "Never chain edits with a commit; write the message without a trailer."
  - session: session_01Tcn6x6mZizT14rJuQqYivt
    date: "2026-10-10"
    severity: nit
    description: "Hand-wrote Co-Authored-By and Claude-Session trailers in the first commit, copying the harness attribution reminder; the commit-trailer guard denied it."
    solution: "The harness reminder and the repo rule conflict; the guard caught it at no cost. Reminder text should defer to the guard."
