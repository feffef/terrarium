    date: "2026-11-02"
    severity: minor
    description: "After opening PRs 2798-2800 and merging 2796, 2799 and 2800, I updated the log by calling log-session --author directly instead of re-invoking close-session, which ADR-0009 asks for at PR open and at merge. log-session refused the completed log until close-session ran: the same slip #2772 fixes."
    solution: "PR #2798's merge hint now covers it; that hint landed only at the end of this session."
