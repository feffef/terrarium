name: log-session-refuses-hand-closed-log
surface: safe
summary: After a merge, agents wrote the completed session log by hand, so the logging script warned or refused and they had to run the closing Skill and try again.
cause: "log-session --author warns (PR #2452) and, since PR #2536, refuses a completed log after a merge with no close-session call, so a session that authors the log first loses a call and then invokes close-session. Signals: 'the script warned', 'warning fired', 'refused until close-session ran', 'one extra call'."
status: open
ref: "Comes from the fixes PR #2452 and #2536 for close-session-bypassed-by-hand-log (a log closed by hand, skipping close-session, so the user had to ask for a proper close)."
related:
  - entry: close-session-bypassed-by-hand-log
    rule: The hand-written log got through, or the owner had to prompt for it.
notes: |-
  2026-10-28 design: dropped: the refusal is the designed enforcement of #2536 and names the fix; cost is one call.
  2026-11-05 design: stronger close-session hint or relaxing the refusal dropped: the refusal is the designed enforcement (close-session-bypassed-by-hand-log), a hint change is Human-only, the cost is one call; the #2798 hint did not move it
occurrences:
  - session: session_013zxzePc3zKAyZGZfucZa9y
    date: "2026-11-07"
    severity: nit
    description: "After opening the second PR I re-authored the log through the helper without re-invoking close-session, which only refused at completion; skipped the Skill's re-invoke rule"
    solution: "Re-invoke close-session at every PR open, as its text says"
  - session: session_013zxzeNqe2cXhykGMMq7vUi
    date: "2026-11-07"
    severity: minor
    description: "After the merge, log-session refused a completed log until close-session ran again, but re-invoking the loaded Skill returned only 'already loaded', which read as circular."
    solution: "Make the refusal say a fresh close-session call is what satisfies it, or have the check read the Skill-invocation event after the merge."
  - session: session_013zxzePitVv4rX66ZhZa4kw
    date: "2026-11-09"
    severity: nit
    description: "log-session refused a completed log right after merge until close-session was re-invoked; I authored first, then invoked the Skill, one wasted call."
    solution: "Invoke close-session when the merge notice arrives, before editing the scratch."
  - session: session_013zxzeNiyBNZD3Zn5dUm9Bq
    date: "2026-11-13"
    severity: nit
    description: "Authored the completed log straight after the merge, though the hook said to invoke close-session first; log-session refused it and I reran."
    solution: "After a merge, invoke close-session before writing any log scratch, as the merge hook says."
