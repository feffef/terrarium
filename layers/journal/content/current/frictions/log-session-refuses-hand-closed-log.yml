name: log-session-refuses-hand-closed-log
surface: safe
summary: After a merge, agents wrote the completed session log by hand, so the logging script warned or refused and they had to run the closing Skill and try again.
cause: "log-session --author warns (PR #2452) and, since PR #2536, refuses a completed log after a merge with no close-session call, so a session that authors the log first loses a call and then invokes close-session. Signals: 'the script warned', 'warning fired', 'refused until close-session ran', 'one extra call'."
status: open
ref: "Comes from the fixes PR #2452 and #2536 for close-session-bypassed-by-hand-log (a log closed by hand, skipping close-session, so the user had to ask for a proper close)."
occurrences:
