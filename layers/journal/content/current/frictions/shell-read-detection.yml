name: shell-read-detection
summary: >-
  A warning fired when an agent said it had not read a doc that the tracker saw it read through the shell, usually because a helper agent had read it.
cause: >-
  The advisory fires when an agent marks `(not read)` a doc the detector credited from shell output, often one a subagent opened; the detector is usually right, and `--author` hides subagent shell reads (#1786 re-triage). Signals: the boilerplate "credited from shell output, but the session marked it (not read)" with no evidence the crediting command missed the file. A credit from output that did not come from the doc is shell-read-detector-false-credit.
surface: safe
status: accepted
ref: "Issue #2355 (regression of #2160) closed not planned on 2026-10-21 (wontfix): the owner accepts the cost. Issue #1786 closed by PR #2160 (superseded by #1941/#1943); #2160 only made the advisory text neutral. Detector left as is."
fixes:
  - pr: 1485
    date: "2026-09-29"
    summary: "The read detector now counts doc reads via extensionless wildcards and 'git log -p'."
  - pr: 1725
    date: "2026-10-10"
    summary: "The read detector stopped crediting docs that merely appeared quoted in GitHub or session-log output."
  - pr: 1792
    date: "2026-10-11"
    summary: "Session logging now refuses '(not read)' for docs the Read tool opened, and shows where each read came from."
  - pr: 2160
    date: "2026-10-16"
    summary: "Made the shell-read advisory's text neutral: it no longer calls a disputed credit a false positive and tells the agent to check the transcript for the earlier reader."
