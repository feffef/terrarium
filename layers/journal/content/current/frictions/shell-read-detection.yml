name: shell-read-detection
summary: >-
  A warning fired when an agent said it had not read a doc that the tracker saw it read through the shell, usually because a helper agent had read it.
cause: >-
  The advisory fires when an agent marks `(not read)` a doc the detector credited from shell output, often one a subagent opened; the detector is usually right, and `--author` hides subagent shell reads (#1786 re-triage). Signals: the boilerplate "credited from shell output, but the session marked it (not read)" with no evidence the crediting command missed the file.
surface: safe
status: accepted
acceptedSeverity: moderate
ref: "Issue #2355 (regression of #2160) closed not planned on 2026-10-21 (wontfix): the owner accepts the cost. Issue #1786 closed by PR #2160 (superseded by #1941/#1943); #2160 only made the advisory text neutral. Detector left as is."
related:
  - entry: required-doc-read-truncated
    rule: A doc read through a shell pipe was cut, so part of it went unread.
fixes:
  - pr: 1485
    date: "2026-09-29"
    summary: "The read detector now counts doc reads via extensionless wildcards and 'git log -p'."
  - pr: 1725
    date: "2026-10-10"
    summary: "The read detector stopped crediting docs that merely appeared quoted in GitHub or session-log output."
  - pr: 1792
    date: "2026-10-11"
    summary: "Session logging now refuses '(not read)' for docs the Read tool opened, and shows where each read came from."
  - pr: 2160
    date: "2026-10-16"
    summary: "Made the shell-read advisory's text neutral: it no longer calls a disputed credit a false positive and tells the agent to check the transcript for the earlier reader."
occurrences:
  - session: e5f88467-c386-4b88-8c16-b9786c748d41
    date: "2026-11-13"
    severity: moderate
    description: "SHELL-READ-DETECTION: docs/agents/triage-labels.md was read in full, yet is not counted. Command: cd /Users/feffef/Development/ai-playground/terrarium && cat docs/agents/git-conventions.md docs/agents/github-integration.md docs/agents/pr-workflow.md docs/agents/triage-labels.md docs/agents/issue-tracker.md docs/proposals/README.md. Its output overflowed to a persisted file, and I then Read that file whole."
    solution: "Have shell-reads.ts credit a multi-file cat whose persisted output file is later Read in full"
  - session: session_013zxzeRByCWuYi8gThTfvKA
    date: "2026-11-25"
    severity: moderate
    description: "SHELL-READ-DETECTION: I read docs/agents/triage-labels.md (first 30 lines, label table) in a command the detector did not count: pnpm exec tsx scripts/github/list-open-issues.ts 5000 2>&1 | grep -E '\"(number|title)\"' | paste - - | head -30 (same Bash call as cat docs/agents/triage-labels.md | head -30). Path expected: docs/agents/triage-labels.md."
    solution: "Count a cat of a doc as read when it shares a Bash call with another command."
  - session: session_013zxzePSaj6hZQUzYVaqg4f
    date: "2026-11-25"
    severity: minor
    description: "Filed issues after only grepping issue-tracker.md and triage-labels.md in a shell call, not reading issue-tracker.md whole as CLAUDE.md requires; the detector did not count it."
    solution: "Read issue-tracker.md whole before the first issue_write; the harvest Skill step 4 could name it as the first call."
