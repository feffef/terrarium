name: shell-read-detection
summary: >-
  A warning fired when an agent said it had not read a doc that the tracker saw it read through the shell.
cause: >-
  The advisory fires when an agent marks `(not read)` a doc the detector credited from shell output, often one a subagent opened; the detector is usually right, and `--author` hides subagent shell reads (#1786 re-triage).
surface: safe
status: open
ref: "Issue #1786 closed by PR #2160 (superseded by #1941/#1943); #2160 only made the advisory text neutral. Detector left as is."
fixes:
  - pr: 1485
    date: "2026-09-29"
    summary: "The read detector now counts doc reads via extensionless wildcards and 'git log -p'."
  - pr: 1725
    date: "2026-10-10"
    summary: "The read detector stopped crediting docs that merely appeared quoted in GitHub or session-log output."
  - pr: 1792
    date: "2026-10-11"
    summary: "Session logging now refuses '(not read)' for docs the Read tool opened, and shows where each read came from."
  - pr: 2160
    date: "2026-10-16"
    summary: "Made the shell-read advisory's text neutral: it no longer calls a disputed credit a false positive and tells the agent to check the transcript for the earlier reader."
occurrences:
  - session: session_01LEQpnXw4SeWsfw4THR5NbX
    date: "2026-10-04"
    severity: moderate
    description: "SHELL-READ-DETECTION miss: command `grep -n -i -E \"44rem|narrow|owner-correct|owner correct\" .agents/skills/visitor-loop/decisions.md | head` printed line 8 of that file (\"On narrow screens the Blog's persona/tag panel stays above the posts...\"), yet the report lists .agents/skills/visitor-loop/decisions.md as named but showing no line (the command it cites is a different one, so which command was matched is unclear)."
    solution: "Check whether grep -n output with its line-number prefix is matched against the doc, and whether the report picks the first command that names a path rather than the one that showed it."
  - session: session_01CF4k9jXS9wLrcPVsGduZmn
    date: "2026-10-08"
    severity: moderate
    description: "SHELL-READ-DETECTION miss: `cat docs/adr/0009-session-logs-commit-directly-to-main.md && echo ===== && cat docs/adr/0003-agent-operating-model-and-governance.md && echo ===== && cat docs/adr/0004-objective-safety-gate.md` overflowed, the harness persisted the output to a tool-results file and showed a 2KB preview, and I read the full text with Read on that file; the detector credits only ADR-0009 (in the preview) and reports ADR-0003 and ADR-0004 as 'named by the command, but its output shows no line of this doc'. Both were read in full. Same session: .agents/skills/triage/SKILL.md was credited because an issue comment printed by `gh api .../issues/348/comments` quoted a line of it, which is a GitHub body echoing a doc, not a read."
    solution: "Let the trace follow a persisted-output pointer ('Full output saved to: <path>') and match the saved file's content, or treat a Read of a tool-results file as the Bash command's output. For the quoted-line case, consider excluding output of gh api calls that return GitHub bodies."
  - session: session_01VaPP7iMRxMvKvX8KQh1qeY
    date: "2026-10-09"
    severity: moderate
    description: "SHELL-READ-DETECTION false positive: docs/agents/environment-caveats.md credited from command `sed -n 70,96p layers/journal/content/current/sessions/2026-10-08-1f97b613-f529-4487-a7e9-1115a44b84c7.yml; grep -rn worktree CLAUDE.md docs/agents/*.md | head`. Its output was a session log's friction quoting the doc's fix, not the doc; grep -rn showed only one environment-caveats line about a worktree guard."
    solution: "Credit a doc only when the matching line's output source is that file (grep -rn prefixes it); a quoted fix inside another file should not count."
  - session: session_01JR1AZGGyi6AEh1SHTp6qsH
    date: "2026-10-10"
    severity: moderate
    description: "SHELL-READ-DETECTION: docsReadViaShell credited .agents/skills/wait-what/SKILL.md and .agents/skills/ask-matt/SKILL.md from one subagent command: `ls layers/journal/content/current/skills/ | grep -i wait; echo \"---\"; grep -rn \"wait-what\" layers/journal/...` (the \"Behaviour-check audit-skills\" subagent, checking the wait-what coverage-gap call). That command only reads layers/journal/content/current/skills/ and never cats or greps either SKILL.md under .agents/skills/, so its output cannot contain a line from either file."
    solution: "False positive, direction credited-but-not-read, on both paths. Same shape as the already-tracked SHELL-READ-DETECTION false-positive family (#1482/#1542) — a short/generic string (\"wait\") matched somewhere unrelated to the actual file content."
  - session: session_015Hx2GtEuH6WZBL8Hp4aDgg
    date: "2026-10-11"
    severity: moderate
    description: "SHELL-READ-DETECTION false positive: .agents/skills/blog-post/SKILL.md was credited from shell output, but the session marked it (not read)"
    solution: "Find the crediting command in the transcript and tighten scripts/shell-reads.ts"
