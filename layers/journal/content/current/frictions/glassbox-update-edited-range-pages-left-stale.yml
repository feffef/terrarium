name: glassbox-update-edited-range-pages-left-stale
surface: safe
summary: glassbox-update left pages with an edited range stale (old revision or Excerpt lines) without saying so in its report.
cause: "glassbox-update.ts --write skips both the pin and the line shift on a page with an edited range, and its report did not list those pages, so Excerpt lines and old revisions were found by hand or by a helper agent. PR #2971 (2026-11-08) documents the skip in the Skill; the script is unchanged. Signals: 'left Excerpt lines stale', 'hooks/01 still carried the old revision', 'did not say which pages it could not pin'."
status: open
fixes:
  - pr: 2971
    date: "2026-11-08"
    summary: "glassbox-update SKILL.md steps 2 and 4 now say --write leaves an edited-range page wholly untouched and the agent re-lines each edited range by hand; no script change."
occurrences:
  - session: session_013zxzeRLzBAw62ZMjhsbHiq
    date: "2026-11-06"
    severity: minor
    description: "glassbox-update --write shifted ranges but left Excerpt lines stale on pages with an edited range; fixed by hand after reading files at the commit."
    solution: "Have the script report the new line numbers for edited ranges or flag them explicitly in step 2."
  - session: session_013zxzeShUkKqUQT1kYCw5UK
    date: "2026-11-07"
    severity: minor
    description: "The glassbox-update report did not say which pages it could not pin (those with an edited range); a subagent told me hooks/01 still carried the old revision."
    solution: "List unpinned pages in the report with the cited range the change overlaps, and let the claim check start from those overlaps."
  - session: session_013zxzeQMfaaC4C4CNuFY3EH
    date: "2026-11-09"
    severity: minor
    description: "glassbox-update --write leaves hand-edited pages' revision unpinned; I only noticed through a failing glassbox-pages spec."
    solution: "Step 2 could say those pages' revision and revisionDate still need pinning by hand in step 4."
  - session: session_013zxzePSj9Rpf6qCGowU7gi
    date: "2026-11-10"
    severity: minor
    description: "The update script leaves pages with edited ranges unpinned, so subagents could not pass their tests until I pinned by hand."
    solution: "Brief agents to pin edited pages themselves, or have the script pin them after re-lining."
  - session: session_013zxzePP7cbXFfoqEXbKwKW
    date: "2026-11-12"
    severity: minor
    description: "glassbox-update.ts --write left the two pages with an edited range wholly unpinned, so I hand-pinned them and used a grep for the old revision to confirm none remained."
    solution: "Have the script print the unpinned pages by name after --write."
