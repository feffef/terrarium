name: bash-reads-not-read-tool
summary: >-
  Agents read files through the shell instead of the file-reading tool, so the rules attached to those files never loaded.
cause: >-
  Sessions read governed files with cat, sed or chained Bash instead of the Read tool, so path rules can fail to load; PR #1775's Bash rules hint loads them for most shell reads. A read the hint covered (rules loaded anyway, no cost) belongs in shell-read-rules-hint-covered. The harness auto-mode message that tells agents to prefer Bash contributes (sessions 01V3bxJa, 01BLrfuH). Signals: a governed file read through cat, sed or head, 'rules may not have loaded', a rule absent after a shell read.
surface: safe
status: open
ref: "issues #2145 (closed not planned 2026-10-23: superseded by the Read-tool trial verdict, PR #2324) and #2167 (closed: bash-rules-hint kept as is) are closed; no open issue or trial tracks it."
fixes:
  - pr: 1775
    date: "2026-10-11"
    summary: "Added path-scoped rules and a Bash hint that loads a governed file's rules when read through Bash."
  - pr: 1946
    date: "2026-10-14"
    summary: "Made the Bash rules hint also run when a Bash call fails, such as a compound read."
  - pr: 2467
    date: "2026-10-23"
    summary: "bash-rules-hint now loads rules for shell reads of bracketed Nuxt route paths."
occurrences:
  - session: session_01PaPpUz7irjArWFrkrYgRwH
    date: "2026-10-19"
    severity: nit
    description: "Read verifying-ui-changes.md and ran greps through Bash (grep, sed) instead of the Read and Grep tools, against the tool guidance."
    solution: "Use Read with offset/limit and Grep for repo files."
