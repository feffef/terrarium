name: orient-output-truncates
surface: safe
summary: The glassbox-curate orientation script prints more than a tool result holds, so a section (the guide pages) was cut off and had to be re-fetched.
cause: ".agents/skills/glassbox-curate/scripts/orient.ts prints about 73 KB unfiltered; the harness cuts it to a file or the agent pipes it through head -300, losing the guide-pages section at the end, so the curate run works from an incomplete orientation. Signals: 'orient.ts output', 'head -300 truncated the guide-pages section', 'cut to a file and one lost the guide-pages section'. Since PRs #2929 and #2944 (2026-11-07) orient.ts prints one line per page in a single output of about 27 KB and has a --subject read; issue #2906 closed completed."
status: open
fixes:
  - pr: 2929
    date: "2026-11-07"
    summary: "glassbox-curate reads the Subject first and orient.ts gains a per-Subject read."
  - pr: 2944
    date: "2026-11-07"
    summary: "orient.ts prints one line per page (title and description) in one output of about 27 KB; the separate --pages call is gone."
occurrences:
  - session: session_013zxzeQUzcNjB7oD8ukBLGp
    date: "2026-11-06"
    severity: moderate
    description: "My orientation script design sent 73KB unfiltered, so every curate run had it cut to a file and one lost the guide-pages section; I had measured words, not the tool's output limit"
    solution: "Size a script meant for a context against the tool output cap (about 30KB), not a word count"
  - session: session_013zxzeRJEE2ehNrQTL62nhX
    date: "2026-11-06"
    severity: minor
    description: "Piped orient.ts output through head -300, which truncated the guide-pages section of its output."
    solution: "Redirect orient output to a file and read it whole."
  - session: session_013zxzeNqe2cXhykGMMq7vUi
    date: "2026-11-07"
    severity: minor
    description: "orient.ts printed 13KB and --pages 5,400 words for all pages, though the change touched two pages."
    solution: "Let --pages take a Subject filter, and say the full list is for gap and overlap hunts only."
  - session: session_013zxzeSjaFuTmBXbfN2o5AH
    date: "2026-11-10"
    severity: minor
    description: "orient.ts output for a Subject is 50 to 70 KB, so I read it in two pages three times; plain.ts for readers duplicated it."
    solution: "Let orient --subject skip the frontmatter and Excerpt blocks, or print plain text only."
  - session: session_013zxzeS5rcf8VwnGmjcpphq
    date: "2026-11-12"
    severity: minor
    description: "orient.ts --subject output was 72 KB, so it needed two paged reads and consumed context the page text duplicates"
    solution: "Have --subject print only pagesRead and page paths when the pages were already read from the index files"
  - session: session_013zxzeRo4piyeogCXsijcHx
    date: "2026-11-12"
    severity: minor
    description: "Orientation output was 69 KB for one Subject, so reading it took paging; the guide index files were another 80 KB read whole."
    solution: "orient.ts --subject could print only the Subject's page bodies once; the index files are already read from the first run."
  - session: session_013zxzePqQeuW4GkMnxNpPp3
    date: "2026-11-12"
    severity: minor
    description: "Orientation output plus two 40 KB index files read whole used a large share of context before any edit."
    solution: "Print the index entries only for the chosen Subject plus titles for the rest."
  - session: session_013zxzeT2YDMzAWKoi2AC98c
    date: "2026-11-12"
    severity: minor
    description: "The orientation output is over 25 KB and the Subject output over 70 KB, so reading them cost several paged reads and many tokens."
    solution: "Print only the Subject's pages' Try-it and Where next on request, or split the output into files up front."
