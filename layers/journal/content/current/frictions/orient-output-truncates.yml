name: orient-output-truncates
surface: safe
summary: The glassbox-curate orientation script prints more than a tool result holds, so a section (the guide pages) was cut off and had to be re-fetched.
cause: ".agents/skills/glassbox-curate/scripts/orient.ts prints about 73 KB unfiltered; the harness cuts it to a file or the agent pipes it through head -300, losing the guide-pages section at the end, so the curate run works from an incomplete orientation. Signals: 'orient.ts output', 'head -300 truncated the guide-pages section', 'cut to a file and one lost the guide-pages section'. Since PRs #2929 and #2944 (2026-11-07) the unflagged orient.ts prints a short output and writes the guide index to files in parts (one entry per page, with its Teaches, Why and Watch lead-ins), but --subject printed every page of the Subject whole and uncapped, 18 to about 114 KB (#3362). Issue #2906 closed completed."
status: open
related:
  - entry: survey-output-overflow
    rule: The overflow came from a survey read or a data-file dump.
  - entry: glassbox-curate-orientation-read-cost
    rule: The opening reads of a glassbox-curate run (guide index, Subject pages) cost 90-120 KB before a focus is chosen.
fixes:
  - pr: 2929
    date: "2026-11-07"
    summary: "glassbox-curate reads the Subject first and orient.ts gains a per-Subject read."
  - pr: 2944
    date: "2026-11-07"
    summary: "orient.ts prints one line per page (title and description) in one output of about 27 KB; the separate --pages call is gone."
  - pr: 3375
    date: "2026-11-16"
    summary: "orient.ts --subject writes the Subject in parts of at most 40 KB to .throwaway/glassbox-curate and prints the part paths and pagesRead block; the full Subject read stays required."
occurrences:
  - session: session_013zxzePxNrkPQ4muYeaAFZT
    date: "2026-11-15"
    severity: nit
    description: "The orient --subject output exceeded the Read cap and needed a second Read with an offset."
    solution: "orient.ts could write one file per page for a subject."
  - session: session_013zxzePak78Sud7pyRQMjeV
    date: "2026-11-15"
    severity: moderate
    description: "orient.ts --subject printed 113 KB, about 45k tokens over three reads, for an 11-page Subject whose pages I mostly only needed to scan."
    solution: "Let orient.ts --subject print each page's headings and Why bullets by default, with full text on request."
