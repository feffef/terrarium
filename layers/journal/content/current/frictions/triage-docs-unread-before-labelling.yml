name: triage-docs-unread-before-labelling
summary: >-
  Agents labelled, closed or triaged issues without first reading the issue-tracker and triage-label docs.
cause: >-
  CLAUDE.md's trigger for docs/agents/issue-tracker.md and triage-labels.md is prose with no hint (read-first-hint.ts covers only git, GitHub and screenshots), and the clear-backlog and wayfinder Skills neither name the docs at their label step nor say whether their triage agents' reads cover the orchestrator. Signals: an issue_write label or close before either doc is read, "the triage agents did the labelling".
surface: safe
status: open
ref: "issue #2439 closed by PR #2446"
fixes:
  - pr: 2446
    date: "2026-10-23"
    summary: "read-first-hint points to issue-tracker.md and triage-labels.md on an issue write."
occurrences:
