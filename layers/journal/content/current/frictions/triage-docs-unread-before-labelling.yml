    severity: minor
    description: "Labelled #1844 ready-for-agent without first reading docs/agents/issue-tracker.md and triage-labels.md, which CLAUDE.md requires before labelling"
    solution: "A read-first hint on issue_write label changes, like the git/GitHub one, would have surfaced them"
