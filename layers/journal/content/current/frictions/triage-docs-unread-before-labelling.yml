name: triage-docs-unread-before-labelling
summary: >-
  Agents labelled, closed or triaged issues without first reading the issue-tracker and triage-label docs.
cause: >-
  CLAUDE.md's trigger for docs/agents/issue-tracker.md and triage-labels.md is prose, and the clear-backlog and wayfinder Skills neither name the docs at their label step nor say whether their triage agents' reads cover the orchestrator. Since PR #2446 read-first-hint.ts points to both docs after the first issue write, so a late read the hint prompted belongs in late-read-first-docs; this entry keeps a label or close that was wrong or unchecked because the docs went unread. Signals: an issue_write label or close before either doc is read, with a wrong or unchecked label; "the triage agents did the labelling".
surface: safe
status: open
ref: "issue #2439 closed by PR #2446"
fixes:
  - pr: 2446
    date: "2026-10-23"
    summary: "read-first-hint points to issue-tracker.md and triage-labels.md on an issue write."
occurrences:
  - session: session_015vXkKcdLwYRQqKKVJ8BLJJ
    date: "2026-10-16"
    severity: minor
    description: "Labelled issues after reading triage-labels.md but not docs/agents/issue-tracker.md in full, which CLAUDE.md requires before labelling"
    solution: "Read issue-tracker.md alongside triage-labels.md before the first label write"
  - session: session_01PHx8z77pGDJT7vmfA7P6Sw
    date: "2026-10-17"
    severity: nit
    description: "Read github-integration.md, issue-tracker.md and triage-labels.md only after already listing issues with a script; late reads cost a few tokens."
    solution: "Read the GitHub docs before the duplicate check, in the same step."
  - session: session_01TNqbizPuP8kvWwD4hfwUwG
    date: "2026-10-19"
    severity: minor
    description: "Read docs/agents/issue-tracker.md (Wayfinding operations) only at closure, after claiming, closing and editing issues; CLAUDE.md requires it before triaging issues."
    solution: "wayfinder Skill could name docs/agents/issue-tracker.md by path instead of 'the tracker doc', so the read happens at step 1."
