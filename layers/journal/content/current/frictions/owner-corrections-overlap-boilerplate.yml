name: owner-corrections-overlap-boilerplate
summary: The visitor-loop owner-memory check lists many unrelated file-overlap candidates, and each needs its own boilerplate line in the PR body.
cause: owner-corrections.ts prints a 'rework' candidate for every merged non-bot PR touching a file a visitor-loop PR touched in the prior 3 days (16-26 per run); --check wants one tally line each (#1912 made that strict on purpose).
surface: safe
status: open
ref: "Issue #2229 closed by PR #2241. Before that, no open issue. #1912 (closed) tightened the same check in the opposite direction; a grouped-line fix would reopen it, so filter the candidates instead."
fixes:
  - pr: 2241
    date: "2026-10-18"
    summary: "owner-corrections.ts --check now credits every issue or URL named on one dismissal line, so one tally line can dismiss several candidates."
occurrences:
  - session: session_01RKUs8JUM5uASMfiE3hvXRA
    date: "2026-10-16"
    severity: minor
    description: "owner-corrections.ts listed 16 candidates; 13 came from file overlap with unrelated Journal Friction Ledger PRs, and each needed its own tally line."
    solution: "Skip overlap candidates whose title and body never name a visitor-loop PR."
  - session: session_0195CYW3YBg2stBS6aGigmbp
    date: "2026-10-22"
    severity: minor
    description: "owner-corrections.ts printed 19 candidates for ten PRs, almost all routine bot content PRs; resolving them took several GitHub reads that the previous run had already done."
    solution: "Have the script skip PRs whose title matches a known routine prefix (glassbox-update, journal(digest), blog(...)) or whose author is a Routine session."
  - session: session_013zxzePwzHSC4uh6dyhsHxg
    date: "2026-10-27"
    severity: nit
    description: "owner-corrections.ts listed seven candidates, all file-overlap reworks of unrelated Blog, Glass Box and Midden PRs; each still needed a tally line."
    solution: "Ignore a rework candidate whose overlap is only a glossary or a path outside the run's focus Tenant, unless it names the visitor-loop PR."
  - session: session_013zxzeQZ6Qwu5TMAKNcgDtH
    date: "2026-10-29"
    severity: nit
    description: "owner-corrections lists 16 candidates, nearly all file-overlap noise, each needing a named tally line; costly to resolve."
    solution: "Filter overlap candidates to PRs touching the focus Tenant's layer."
