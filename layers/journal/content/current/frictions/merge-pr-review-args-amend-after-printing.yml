name: merge-pr-review-args-amend-after-printing
surface: safe
summary: A session amended its work after the code-review call was printed, so the printed head sha no longer existed and the review had to rerun.
cause: "verdict-line.ts --review-call prints the head sha at that moment; a later amend or rename changes the head, so the sha in the review call no longer matches and merge-pr.ts's reviewed-head check fails until review reruns on the final head. Signals: 'printed sha no longer existed', 'amended after', 'rename', 're-ran code-review on the final head'."
status: open
related:
  - entry: merge-pr-review-args-refusal
    rule: That entry is a review call whose args named no sha at all; here they named a sha the head later moved past.
  - entry: merge-pr-own-read-refusal
    rule: That entry is a verdict's Own-read line refused on a diff that was not simple; here the review call's sha went stale.
notes: |-
  2026-11-28 design: none dropped: pr-workflow.md already gives the follow-up form (all three sessions opened it) and sits in an open prune trial's territory; a verdict-line flag only saves typing a sha; revisit on a fourth occurrence
occurrences:
  - session: session_013zxzeQ5mMr3n1PjgqM4sUa
    date: "2026-11-19"
    severity: minor
    description: "I amended Karen's post after the code-review call was printed, so the printed sha no longer existed and I had to re-run code-review on the final head, then again after a rename."
    solution: "Finish every edit, including wording and slug, before printing the review call; a rename makes Own-read ineligible."
  - session: session_013zxzeRCqnsnapQCvq1q748
    date: "2026-11-26"
    severity: nit
    description: "First verdict comment claimed the head was reviewed when code-review ran on the previous commit; merge-pr.ts refused and I posted a correction."
    solution: "After a follow-up commit, write Reviewed: <reviewed sha> and Own-read: <head> from the start."
  - session: session_013zxzeQivG2v72EMRPiQ5aR
    date: "2026-11-27"
    severity: nit
    description: "Read the PR verdict doc and ran verdict-line twice; its Own-read output names the reviewed sha, not the head, so I wrote the follow-up verdict lines by hand."
    solution: "verdict-line should accept a separate head for Own-read."
