name: clear-backlog-build-review-cap-fails
summary: "The backlog build loop started a fresh review round after any defect or spec-mismatch, however small the fix, and the round found only nits; since PR #3419 a round starts by fix size."
cause: "clear-backlog section 3 step 4 started a fresh review round on any defect or spec-mismatch line, whatever the fix size, so a one-line fix could cost a whole round that found only nits (2026-11-16: four small branches, about 600k tokens by the run logs). reviewBranch no longer returns 'failed' at the round cap (older signals: 'review capped at 3 rounds'). A 2026-11-11 run also spent 4.4M tokens over 52 agents when five of six small branches hit the cap on cosmetic findings; PR #3119 redesigned the review and fix steps, PR #3196 narrowed which findings force another round, PR #3419 (2026-11-17) starts round N+1 only by fix size, and PR #3589 (2026-11-22) counts a missing-test only while it is still open after the re-checks."
surface: safe
status: open
notes: |-
  2026-11-13 survey: issue #3110 closed completed 2026-11-12T08:50Z (no closing PR in its timeline; PRs #3119 and #3196 relate to it and are recorded in fixes); status reset from tracked.
  2026-11-17 regression issue #3400 filed (2 occurrences since #3196).
  2026-11-18 survey: issue #3400 closed completed 2026-11-17 by PR #3419 (recorded in fixes); status reset from tracked.
fixes:
  - pr: 2140
    date: "2026-10-16"
    summary: "clear-backlog §3 now says what to do when a branch fails at the review cap with open findings."
  - pr: 3119
    date: "2026-11-12"
    summary: "clear-backlog section 3 redesigned: branches build with fast checks only, get one fresh Standards and Spec review round, and builders and reviewers are resumed for fixes instead of fresh fix rounds."
  - pr: 3196
    date: "2026-11-12"
    summary: "clear-backlog: a missing-test finding forces a fresh round only above 50 changed lines, a branch meeting the simple-change test gets one reviewer and no further round, and wrap width is the builder's check, not a finding."
  - pr: 3419
    date: "2026-11-17"
    summary: "clear-backlog section 3 step 4 starts a fresh round N+1 only for a defect still open after the re-check, round N's fixes over about 10 lines, or a missing-test on a branch over 50 lines; a spec-mismatch fixed with a clean re-check starts none."
  - pr: 3589
    date: "2026-11-22"
    summary: "clear-backlog section 3 step 4: a missing-test starts round N+1 only if still open after round N's re-checks on a branch above 50 changed lines; one already fixed and re-checked clean no longer does."
occurrences:
  - session: session_013zxzeTEBhUnvwNNBASiFDg
    date: "2026-11-11"
    severity: moderate
    description: "clear-backlog-build used 52 agents and 4.4M tokens on six small branches; five hit the 3-round cap on cosmetic findings, and the cost showed only after the run."
    solution: "Skip reviewers for simple diffs, one round for the rest, nits reported not fixed; filed as issue 3110."
  - session: session_013zxzeSiYFQ3mgaCyMXicwp
    date: "2026-11-12"
    severity: moderate
    description: "Round 2 on a two-line Skill edit and round 3 on low-risk test gaps each cost about 150000 to 170000 tokens and found only nits."
    solution: "Apply pr-workflow's simple-change test and a risk bar to clear-backlog §3 step 4 before it forces another fresh round."
  - session: session_013zxzeTChey8pdC2fuTTH7i
    date: "2026-11-16"
    severity: minor
    description: "Round 3 for merge-pr-retry ran four agents over a missing-test already refused with proof and accepted by the re-check."
    solution: "clear-backlog §3 step 4: a missing-test the re-check accepted as refused-with-proof should not trigger a further round."
  - session: session_013zxzeRCPF7mHwN6aT8t7RQ
    date: "2026-11-16"
    severity: moderate
    description: "The second-round rule fired on four small branches because round 1 held a spec-mismatch, defect or both, though each fix was one line or one sentence. Round 2 found only nits, costing about 600k subagent tokens and four extra workflow runs."
    solution: "Let a small branch stop after a clean re-check of its fix (extend the small flag), or limit round 2 to defects above a size."
  - session: session_013zxzeSbz6S2A8goaq25ibN
    date: "2026-11-19"
    severity: minor
    description: "#3481 needed a third full review round only because round 2 raised a missing-test on a 98-line branch; round 3 found one wording nit."
    solution: "In clear-backlog section 3 step 4, skip the next round when the missing-test was fixed and re-checked clean in its own round."
  - session: session_013zxzePUNdDXiqJrj8m6Bjs
    date: "2026-11-19"
    severity: minor
    description: "The clear-backlog rule that a missing-test or a fix over 10 lines forces another full review round cost two extra rounds (about 320k subagent tokens) on the harvest branch; round 3 found only nits."
    solution: "Skip the next round when the previous round's re-checks were clean and the fix was test-only; or count a clean re-check as closing the round."
  - session: session_013zxzePVqgGH7hbNFvSCqQR
    date: "2026-11-21"
    severity: minor
    description: "Retro: #3543's round 2 (triggered by a 13-line fix commit) found only nits; the one real defect (stale body-template.md) was caught in round 1."
    solution: "clear-backlog §3 step 4: count only logic lines (not prose/test wording) toward the 10-line round-2 trigger; one instance, so gather more runs first."
  - session: session_013zxzeT3ZUhBeG84jQUD1Hw
    date: "2026-11-21"
    severity: moderate
    description: "Discover ran a third review round only because a round-2 summary held a missing-test already fixed and re-checked clean; it found two nits and cost about 170k subagent tokens."
    solution: "In clear-backlog section 3 step 4, require the missing-test to be still open after the re-checks before starting the next round."
  - session: session_013zxzeNisEDZyrmPg2jhA5G
    date: "2026-11-22"
    severity: nit
    description: "On the glassbox-curate branch I ran a third re-check in round 2 (a CLAUDE.md wording nit) past clear-backlog §3 step 3's 2-re-check cap, judging an always-loaded file worth it."
    solution: "clear-backlog §3 could say owner-answer fixes get their own re-check outside the cap, which is how step 2 already reads; the cap's scope is unclear."
