name: followup-review-overcost
surface: safe
summary: pr-workflow's review rules sent tiny first pushes and small follow-up commits through full two-agent code-review rounds whose cost far exceeded what they found.
cause: "pr-workflow.md asks for code-review before a first push (PRs #1853, #1854) and on a larger follow-up; before PR #2321's simple-change bar a 1- to 6-line diff, and since then a prose cut already probed, a 40-line review-fix commit or a 2-line one, ran two-agent rounds costing 120k-370k subagent tokens for little or cosmetic findings. Signals: 'follow-up rule', 'further code-review rounds', 'two review agents for a N-line diff', 'subagent tokens'."
status: open
related:
  - entry: prepush-gate-review-skipped
    rule: Review was skipped, or the author's own read replaced it on a change that was not simple.
  - entry: reviewer-findings-mostly-wrong
    rule: Most findings were WRONG per the checkers, a quality problem not a re-run cost.
  - entry: clear-backlog-review-round-low-yield
    rule: That entry is a normal first review round on several clear-backlog branches finding little; here the change was a tiny push or small follow-up.
notes: |-
  2026-10-28 design: a looser follow-up review bar dropped: three of six predate the simple-change bar, the others read pr-workflow.md and followed it, and ADR-0004 rejects skipping review for prose. dropped: a policy change for a human, not a fix.
occurrences:
  - session: session_013zxzeSgAcwDrJXAMFAC4Qf
    date: "2026-11-17"
    severity: minor
    description: "A 5-line addition to a Skill brief failed the simple-change test because it changes the Skill's meaning, so it needed two Opus review agents, about 175k subagent tokens, for a one-sentence edit."
    solution: "Let a one-sentence doc addition that two pages already cover take the own-read path, or review it with one agent."
  - session: session_013zxzeSbxN1yAYBzyNbUST6
    date: "2026-11-19"
    severity: minor
    description: "Every follow-up after code-review (7 prose files) needed a second two-agent code-review because merge-pr.ts counts it as non-simple."
    solution: "None needed; the cost is the intended safety net, but a glassbox-update note could say to fold review fixes in before the first review."
  - session: session_013zxzePBiGUC5ThCkjDhzN7
    date: "2026-11-19"
    severity: minor
    description: "A 25-line prose change to a Skill took two full code-review rounds (four subagents), because the simple-change bar is 10 lines and a fix commit over it needs a fresh review."
    solution: "Draft the whole change from the writing-for-agents rules first, so round one finds less."
  - session: session_013zxzePUNdDXiqJrj8m6Bjs
    date: "2026-11-19"
    severity: minor
    description: "A one-blank-line Skill doc edit got the full build recipe (tdd, three ADR reads forced by hooks after the edit) and a review spawn that only re-confirmed the builder's claims."
    solution: "Add a fast path to rules() and the small flag: a doc-only change of 5 lines or fewer skips tdd and the review round."
  - session: session_013zxzeSbz6S2A8goaq25ibN
    date: "2026-11-19"
    severity: minor
    description: "Retro: a further fresh round started when the previous round's missing-test was already fixed and re-checked clean; #3481's round 3 found one nit (Standards-r3) and nothing on the Spec axis."
    solution: "clear-backlog SKILL.md section 3 step 4: count only a missing-test still open after the round's re-checks. #3483's round 3, started by open defects, caught 2 defects and a spec-mismatch, so keep the defect trigger."
  - session: session_013zxzeTEVK6AmvvjoF7wNV8
    date: "2026-11-20"
    severity: minor
    description: "Ran the code-review Skill twice (two Standards plus Spec rounds) because a one-sentence fix landed after the first and merge-pr needs the head named."
    solution: "Draft the final wording before the first review, or let a simple fix after review pass on an own read."
  - session: session_013zxzeTKSiBSmkCLfn4BYL6
    date: "2026-11-20"
    severity: minor
    description: "Retro (reviews): round 1 caught something that mattered on three of seven branches (curate contradiction, harvest untested case, Skill pages vacuous e2e); the three round-2 pairs and four small branches' reviews re-found only small things."
    solution: "Start a round 2 only when round 1 had a defect or spec-mismatch, not on fix size alone, and keep one reviewer for diffs under about 100 lines."
  - session: session_013zxzePp6Xf4HuGyQNDdBpB
    date: "2026-11-20"
    severity: nit
    description: "A reviewer note on jargon (builder, orchestrator) was left unfixed to keep the reviewed sha valid for merge-pr."
    solution: "Fix prose before the review round, not after."
  - session: session_013zxzeQLrTRb5hCDjSRuQHb
    date: "2026-11-21"
    severity: minor
    description: "The ledger PR, 61 machine-written occurrences, failed the simple-change test, so merge-pr refused my own-read verdict and I ran a full two-agent code-review that found only judgement calls."
    solution: "Skill step 5.4 says review the ledger PR by the simple-change test; say what a data-only ledger PR needs instead (its content spec and gate)."
  - session: session_013zxzePVqgGH7hbNFvSCqQR
    date: "2026-11-21"
    severity: minor
    description: "Retro (14 of 14 agents replied): Standards and Spec raised the same nit on #3541, #3552 and #3543; on #3541 and #3551 (docs/content-only) neither axis found anything that mattered."
    solution: "In clear-backlog-build.js, send a docs- or content-only branch under ~20 lines to one `Both` reviewer, counting deletions lightly (the #3551 12-line deletion exceeds the Both limit at :115); keep the pair for code (Spec alone caught #3552's unanchored locator)."
  - session: session_013zxzeQemDnZfmHdeYUmhur
    date: "2026-11-23"
    severity: minor
    description: "Retro, reviewers: round-1 Standards and Spec reviews of two diffs of about 10 to 40 lines found only cosmetic nits (import order, cast, test title) and no defect, which looked costly for their size (reviewers' reports and findings files)."
    solution: "Evidence only, from n=2 branches: a lower bar for small:true than the simple-change test would cut one reviewer per small branch; weigh before cutting, since a safety net is kept."
  - session: session_013zxzeT6Ss7hjULbaTx2PS2
    date: "2026-11-23"
    severity: nit
    description: "Round 2 on the visitor-loop branch was triggered by a 25-line prose-and-list fix commit (over the 10-line rule) and returned only nits; one data point that the line threshold over-triggers for content edits."
    solution: "Gather more rounds before changing step 4 of clear-backlog; the one case here suggests counting only code or logic lines."
  - session: session_013zxzeSBTTxHztyPoJeEwAj
    date: "2026-11-24"
    severity: nit
    description: "Retro (Both reviewer, unverified in the workflow file): on a 5-line, 2-file content diff the full review re-found nothing that mattered, and it spent two Bash calls on unrelated rule-use echoes; the code-review Skill section it was told to read is mostly about its own sub-agent spawning."
    solution: "In reviewPrompt() of .claude/workflows/clear-backlog-build.js paste the smell list instead of pointing at the Skill, and consider the orchestrator's own read for diffs of 10 lines or fewer when the owner's picks are binding."
  - session: session_013zxzeQLTeC8GETW73Aho8C
    date: "2026-11-26"
    severity: nit
    description: "Retro (Both reviewer): for a 2-line diff the reviewer paid three reads and two rule-use echo calls; its single nit was a small re-find. The re-check brief naming the diff range worked well."
    solution: "Skip the code-review Skill section read and the rule-use echo for a Both reviewer on a diff at or under the simple-change bar."
