name: followup-review-overcost
surface: safe
summary: pr-workflow's review rules sent tiny first pushes and small follow-up commits through full two-agent code-review rounds whose cost far exceeded what they found.
cause: "pr-workflow.md asks for code-review before a first push (PRs #1853, #1854) and on a larger follow-up; before PR #2321's simple-change bar a 1- to 6-line diff, and since then a prose cut already probed, a 40-line review-fix commit or a 2-line one, ran two-agent rounds costing 120k-370k subagent tokens for little or cosmetic findings. Signals: 'follow-up rule', 'further code-review rounds', 'two review agents for a N-line diff', 'subagent tokens'."
status: open
related:
  - entry: prepush-gate-review-skipped
    rule: Review was skipped, or the author's own read replaced it on a change that was not simple.
  - entry: reviewer-findings-mostly-wrong
    rule: Most findings were WRONG per the checkers, a quality problem not a re-run cost.
  - entry: clear-backlog-review-round-low-yield
    rule: That entry is a normal first review round on several clear-backlog branches finding little; here the change was a tiny push or small follow-up.
notes: |-
  2026-10-28 design: a looser follow-up review bar dropped: three of six predate the simple-change bar, the others read pr-workflow.md and followed it, and ADR-0004 rejects skipping review for prose. dropped: a policy change for a human, not a fix.
occurrences:
  - session: session_013zxzeP3xBUNvHd5kGFihuo
    date: "2026-11-12"
    severity: minor
    description: "SKILL §5 says review the ledger PR by the simple-change test, but a 58-file data-only diff fails the count, so I ran full code-review on machine-written YAML."
    solution: "Say what a ledger PR needs: its content spec and gate, or one reviewer on occurrences."
