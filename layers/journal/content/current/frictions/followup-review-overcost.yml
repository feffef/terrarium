name: followup-review-overcost
surface: safe
summary: pr-workflow's review rules sent tiny first pushes and small follow-up commits through full two-agent code-review rounds whose cost far exceeded what they found.
cause: "pr-workflow.md asks for code-review before a first push (PRs #1853, #1854) and on a larger follow-up; before PR #2321's simple-change bar a 1- to 6-line diff, and since then a prose cut already probed, a 40-line review-fix commit or a 2-line one, ran two-agent rounds costing 120k-370k subagent tokens for little or cosmetic findings. The opposite miss is prepush-gate-review-skipped. Signals: 'follow-up rule', 'further code-review rounds', 'two review agents for a N-line diff', 'subagent tokens'."
status: open
notes: |-
  2026-10-28 design: a looser follow-up review bar dropped: three of six predate the simple-change bar, the others read pr-workflow.md and followed it, and ADR-0004 rejects skipping review for prose. dropped: a policy change for a human, not a fix.
occurrences:
  - session: session_013zxzeSYWF1rye7qScgSUFV
    date: "2026-11-06"
    severity: minor
    description: "Review of a one-file post cost two extra subagents; the only real catch was length, and each text edit forced a new fact-check round because the Fact-checked blob must match."
    solution: "Check paragraph count and description hook before step 9, so edits land before the first fact-check."
  - session: session_013zxzeP3xBUNvHd5kGFihuo
    date: "2026-11-12"
    severity: minor
    description: "SKILL §5 says review the ledger PR by the simple-change test, but a 58-file data-only diff fails the count, so I ran full code-review on machine-written YAML."
    solution: "Say what a ledger PR needs: its content spec and gate, or one reviewer on occurrences."
  - session: session_013zxzeNrvAWHmAPYsSy8u7x
    date: "2026-11-12"
    severity: minor
    description: "Ran two code-review subagents (about 164,000 tokens) on a 4-line, 2-file change because pr-workflow's simple-change test excludes any code-logic change, even a constant."
    solution: "Let the simple-change test treat a single constant or number change as simple, or let code-review run both axes inline for a diff this small."
  - session: session_013zxzeNdAgdKF5tpWTQLowx
    date: "2026-11-13"
    severity: minor
    description: "Each fix PR took a full code-review round on its follow-up commit too: six reviewer subagents in all for 13 doc lines and one 80-line script."
    solution: "Known entry followup-review-overcost; the second round on the script found nothing required."
  - session: session_013zxzeSvCUWdcpBdHi4sdX2
    date: "2026-11-13"
    severity: minor
    description: "Two full Opus Standards and Spec review rounds on one docs file used about 470k subagent tokens; the second round found mostly small duplicates."
    solution: "For a docs-only file, run one full round and read later fixes myself, or use a lighter model."
  - session: e5f88467-c386-4b88-8c16-b9786c748d41
    date: "2026-11-13"
    severity: minor
    description: "Two full Standards+Spec subagent rounds (four agents) for a YAML install and a 20-line test, because pr-workflow says any added file is never simple"
    solution: "Let pr-workflow call a small new test file or a moved file simple, so it gets a self-read"
