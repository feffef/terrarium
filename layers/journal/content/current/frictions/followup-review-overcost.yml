name: followup-review-overcost
surface: safe
summary: pr-workflow's follow-up rule sent small or owner-directed follow-up commits through full code-review rounds that found nothing or only cosmetic slips.
cause: "pr-workflow.md says a larger follow-up gets code-review on its own diff; sessions with a prose cut already probed, a 40-line review-fix commit or a 2-line one ran further two-agent review rounds costing 170k-370k subagent tokens for cosmetic findings. The opposite miss is prepush-gate-review-skipped. Signals: 'follow-up rule', 'further code-review rounds', 'subagent tokens to confirm nothing'."
status: open
occurrences:
