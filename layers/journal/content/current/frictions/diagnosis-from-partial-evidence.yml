name: diagnosis-from-partial-evidence
summary: >-
  Agents settled on a cause or on which PR made a change from one test or a commit list, and it was wrong.
cause: >-
  A diagnosis or attribution (why something behaves as it does, which PR made a change) is generalised from partial evidence, a single test or a merge-commit list, without varying one factor per test or reading the diff. Signals: "from one test", "without checking its diff", a cause reversed by a controlled test or git show.
surface: safe
status: open
fixes:
  - pr: 2336
    date: "2026-10-20"
    summary: "CLAUDE.md \"Verify before you state\" now names subagent reports, script behaviour from recall, \"only\"/\"every\"/\"nothing\" claims and one-test causes; \"One home per fact\" says to grep for other statements when changing one."
  - pr: 2378
    date: "2026-10-21"
    summary: "Restored the shorter \"Verify before you state\" bullet in CLAUDE.md, and the Standards reviewer in clear-backlog-build now flags a count or subagent claim that cites no source."
occurrences:
  - session: session_013zxzeTDG9WP45rYE5hRMpG
    date: "2026-11-06"
    severity: minor
    description: "First diagnostic diffed page files naively and reported every page's text changed, missing that pageHash already strips revision lines"
    solution: "Reuse the Skill's own exported hash functions in a diagnostic from the start"
  - session: session_013zxzeRCJHe4rmKN5i2CQ16
    date: "2026-11-06"
    severity: nit
    description: "Called a sentence in the new Skill unsupported after one grep; reviewers showed glassbox-improve already held it with its reason."
    solution: "Before calling a claim unsupported, grep the sibling Skills for its key terms and read the neighbouring lines."
  - session: session_013zxzeNd2Ethpd3anqbmpkr
    date: "2026-11-09"
    severity: minor
    description: "Compared rules across a 24-day window without checking path history; the user's question showed four rules were created mid-window, so load counts are not comparable."
    solution: "Run git log on .claude/rules for path changes before comparing rules over a window."
  - session: session_013zxzeTDaVmVLQ94B5sfpZB
    date: "2026-11-12"
    severity: minor
    description: "Explained why the improver Skill was rebuilt from Digests alone; issue 2896 held the details and surfaced only when the owner said a ticket existed, costing one rewrite."
    solution: "Search issues for the subject before drafting a why, since Digests omit the owner's reasoning."
