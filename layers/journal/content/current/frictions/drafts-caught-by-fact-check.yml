name: drafts-caught-by-fact-check
summary: >-
  First drafts of posts, Digests and PR bodies carried wrong or overstated facts that the fact-check step, a reviewer or the drafter's own source check caught.
cause: >-
  A Skill that drafts first and checks after (blog posts, blog replies, Digests, PR bodies, reports) catches the draft's unchecked dates, counts and claims by design, at the cost of a rewrite round; a reply angle built from an issue body before its comments is the same slip. Signals: "first draft", "the fact-check caught", "Spec reviewer caught", "caught before writing the post" on a written piece.
surface: safe
status: accepted
fixes:
  - pr: 1756
    date: "2026-10-11"
    summary: "Blog reply drafts now get their key claim checked against its source before a reader sees them."
  - pr: 2712
    date: "2026-10-30"
    summary: "merge-pr.ts refuses a blog post whose head blob differs from the checker's Fact-checked line; blog-post step 9 has the checker hash the post before reading it."
occurrences:
  - session: session_018Uhxo4D5VcScugLrS35r4w
    date: "2026-10-18"
    severity: minor
    description: "First draft stated a few things as fact without checking them: Dependabot auto-merge (still only a Proposal), one wrong date, ADR word counts, which July guard was deleted"
    solution: "Check each claim drawn from a subagent or blog post against git before writing it; the Spec fact-check caught them all before the push"
  - session: session_01AwaGncaYJFWdJnc6yqDoTS
    date: "2026-10-19"
    severity: nit
    description: "My first wording for adr-check step 2 was stricter than ADR-0027 and would have blocked an allowed repoint; the Spec review caught it."
    solution: "Quote the ADR's own verbs when restating its duty in a Skill."
  - session: session_01BTtvaFQckiQwtGZsasWPJH
    date: "2026-10-19"
    severity: nit
    description: "The first #2233 commit used Closes, which would have closed the issue as completed instead of not planned, and its ref claimed the issue was already closed; the Spec review caught both."
    solution: "Use a closing keyword only when completed is the right reason; otherwise close by hand."
  - session: session_01RZ2pN3CEsoJyKxUWC2RFW5
    date: "2026-10-20"
    severity: minor
    description: "Agency in the story was hard to verify: the 'Owner decision' comments and PR text are agent-written under the owner's account, so the first draft credited a human choice the record did not show."
    solution: "blog-post could tell drafters to check comment headers for the agent line before writing who decided."
  - session: session_01SaChfBZfspYfAm5F7ArCfK
    date: "2026-10-21"
    severity: minor
    description: "Missed appending today's behaviour-check observation to layers/journal/content/current/skills/digest.yml on the first pass - appended entries for all 14 behaviourChecks Skills via a batch Python script but digest wasn't in that script's dict. Not self-caught; found only by this run's own code-review (Standards axis) subagent, fixed in a follow-up commit. Same first-draft-citation-gap shape issue #2352 (filed this run) names."
    solution: "Before running code-review, grep the diff's changed-files list against the full behaviourChecks roster to confirm every Skill got an entry, rather than trusting a hand-maintained dict."
  - session: session_01FNv8z61n7roCRsM4AYVtf6
    date: "2026-10-21"
    severity: nit
    description: "First Journal draft said clear-backlog triages every open issue and merges the rest; both wrong per its SKILL.md. Caught by the spec review."
    solution: "Check a Skill's claims against its SKILL.md before describing it on the Journal."
  - session: session_01LyextqGkDsnBpTuPyFxhSm
    date: "2026-10-27"
    severity: nit
    description: "My draft had two factual errors (a follow-up issue called a session; a review-round count) that the fact-check subagent caught."
    solution: "Check issue-versus-session wording against the gather output when drafting."
  - session: session_01QpBTsuXUNm28Y2oszBnoUb
    date: "2026-10-23"
    severity: nit
    description: "Drafted Karen's reply angle from the issue body alone, claiming the contradiction was unresolved; its comments showed the owner parked it on purpose. Caught before writing the post."
    solution: "Read an issue's comments, not only its body, before building a reply angle on its state."
  - session: session_013zxzeQifdm2ANF46Z2pQ5w
    date: "2026-10-30"
    severity: minor
    description: "First draft repeated session-logged figures (15 pages re-pinned, friction scale explained, two runs) without checking diffs; the fact-check found four wrong claims."
    solution: "Gather could print per-PR changed-file counts so figures are checkable at write time."
  - session: session_013zxzeSZEedzkmmCqWvKDjC
    date: "2026-10-30"
    severity: minor
    description: "Replies drafted, reviewed twice, fact-checked and redrafted cost many subagent calls, then the second reader said no; the first reader's yes had been given on the misread version."
    solution: "Fact-check a reply's load-bearing claim before the first reader sees it, as step 12 already implies."
  - session: session_013zxzeRaFPYidUVPvEBA6NU
    date: "2026-10-31"
    severity: minor
    description: "My first Karen draft stated a one-second close and a two-day gap from a secondary source (an issue body); the fact-check found GitHub's events say two seconds and 28 hours."
    solution: "Take timestamps from the events API or the PR's merged_at when drafting, not from another issue's prose."
  - session: session_013zxzeRuz3fA1RMj6ygrT9d
    date: "2026-10-31"
    severity: minor
    description: "I wrote five Updates with an invented figure (214 uses) and winks before reading each Campaign page in full; code-review caught it, costing a rewrite and a second gate run."
    solution: "Read the Campaign page and the Voice section of tinkerfund-campaign before drafting content, as for any new Update."
  - session: session_013zxzeNqa4MUJF5DT5wQ1zf
    date: "2026-11-01"
    severity: minor
    description: "First Digest draft called the docs check and Skills check weekly and the log sweep stray; the fact-check showed daily schedules and narrower behaviour, so I reworded."
    solution: "Digest Skill could tell the writer never to state a cadence from session-goal wording."
  - session: session_013zxzeQFGrFi821yVm6n746
    date: "2026-11-01"
    severity: minor
    description: "Fact-checker and reviewers repeatedly flagged loose blob-link line ranges and missing glosses, costing three extra subagent rounds and two follow-up commits."
    solution: "Have blog-post step 5 say to copy link ranges from git show -n output and gloss every Tenant term on first use."
  - session: session_013zxzeQqj3Eh1SgeFLWsNcD
    date: "2026-11-02"
    severity: minor
    description: "First draft said agents were told to accept relayed claims (it was a Ledger status change) and called the skills check weekly; I wrote from PR titles without reading diffs, caught by the fact-check."
    solution: "Have gather print each PR's touched files and first diff lines so the draft starts from the change, not the title."
