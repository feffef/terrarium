name: drafts-caught-by-fact-check
summary: >-
  First drafts of posts, Digests and PR bodies carried wrong or overstated facts that the fact-check step, a reviewer or the drafter's own source check caught.
cause: >-
  A Skill that drafts first and checks after (blog posts, blog replies, Digests, PR bodies, reports, Glass Box pages) catches the draft's unchecked dates, counts, cadence words and claims by design, at the cost of a rewrite round; a reply angle built from an issue body before its comments is the same slip, and so is a shipped page carrying a count copied from a draft. Since PR #3251 (2026-11-13) the Digest Skill requires a source for cadence words. Signals: "first draft", "the fact-check caught", "claim checker caught", "Spec reviewer caught", "caught before writing the post" on a written piece.
surface: safe
status: open
related:
  - entry: draft-style-caught-by-review
    rule: The draft broke the Skill's style rules (jargon, length, opening) and its facts were right.
  - entry: fact-check-blob-resign-rounds
    rule: The facts were right or fixed, and the cost was repeated checker rounds to re-sign the blob.
notes: |-
  2026-11-04 reopened: fix #2712 (2026-10-30) merged after the owner accepted it on 2026-10-19.
fixes:
  - pr: 1756
    date: "2026-10-11"
    summary: "Blog reply drafts now get their key claim checked against its source before a reader sees them."
  - pr: 2712
    date: "2026-10-30"
    summary: "merge-pr.ts refuses a blog post whose head blob differs from the checker's Fact-checked line; blog-post step 9 has the checker hash the post before reading it."
  - pr: 2864
    date: "2026-11-05"
    summary: "list-recent-prs.ts --diff prints each PR's touched files and first diff lines, and the blog-post gather step uses it so drafts start from the change, not the title (closes #2854)."
  - pr: 2936
    date: "2026-11-07"
    summary: "glassbox-curate's memory-page bullet says to state a count only after counting its items in their source (the shipped 'eight stops' miss, closes #2915)."
  - pr: 3251
    date: "2026-11-13"
    summary: "digest SKILL.md needs a source in the day's gathered material for a cadence word and drops 'scheduled' from its example; the fact-check checks both."
