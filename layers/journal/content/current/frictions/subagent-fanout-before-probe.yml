name: subagent-fanout-before-probe
surface: safe
summary: A session dispatched many transcript-reading subagents before probing one, so most reports could not answer the question and about a million subagent tokens were spent.
cause: "A plan fans out subagents over session transcripts (events omit hook-injected rule text in some sessions) without a one-subagent probe of whether the data answers the question first. Signals: 'before probing one', 'could not show whether a rule changed anything', subagent token totals in the hundreds of thousands."
status: open
related:
