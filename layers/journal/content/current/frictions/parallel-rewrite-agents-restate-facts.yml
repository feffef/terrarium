name: parallel-rewrite-agents-restate-facts
summary: >-
  New text, or a proposed field or rule, repeated a fact that already has a home, and a reviewer or the owner had to catch it.
cause: >-
  Agents add a sentence, rejected alternative or excerpt that restates a fact kept elsewhere (CLAUDE.md "One home per fact"): ADR rewrite agents, a build adding two ADR-0003 sentences, a lesson draft repeating ADR-0028 and an excerpt, a proposed frontmatter field or path-scoped rule whose content a doc already holds, a writer whose Why bullets repeated a concept a sibling page owns despite a brief asking for one sentence; the build reviewers passed some of it. Signals: "duplicated", "one home", "already covered", "repeated", the owner or raters asking about overlap.
surface: safe
status: open
notes: |-
  2026-10-20 design: no separate fix designed: rides on PR #2336's CLAUDE.md "One home per fact" grep sentence plus review; not recurred since 2026-10-16.
occurrences:
  - session: session_01NFv67izdzVGrFHb2EVwZJ2
    date: "2026-10-16"
    severity: minor
    description: "First draft repeated ADR-0028's varies point as a watch item and kept a second copy of the Tinkerfund excerpt in the content database Lesson; code-review caught both"
    solution: "Before writing What to watch for, grep sibling Lessons and the linked ADR for each point (EVERY-PAGE.md already says so)"
  - session: session_01WynjtDHvk8MajTsgr59Ckt
    date: "2026-10-16"
    severity: minor
    description: "First commit wrote the publishedAt rule twice (EVERY-PAGE.md and the Glass Box glossary) and left EVERY-PAGE.md saying frontmatter holds four fields only"
    solution: "Search the edited doc for statements the new rule contradicts before committing; code-review caught both"
  - session: session_01FNv8z61n7roCRsM4AYVtf6
    date: "2026-10-21"
    severity: minor
    description: "First recommendation proposed a new path-scoped rule before checking that issue-tracker.md's Filing an issue already covered most of it; the owner had to ask about overlap."
    solution: "Grep the existing homes of a fact before proposing a new doc (CLAUDE.md one home per fact)."
  - session: session_013zxzeQDh7MCP7HpYBYBTeh
    date: "2026-10-28"
    severity: moderate
    description: "My writer brief said to give sibling-owned reasons one sentence, but the Why bullets still repeated Human-in-the-loop; raters flagged it three times and the page ended at B after two fix rounds."
    solution: "Brief a promotion writer to diff each Why bullet against the Lessons its ADRs appear in before committing, naming those Lessons."
