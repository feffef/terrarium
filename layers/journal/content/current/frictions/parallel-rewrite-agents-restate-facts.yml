name: parallel-rewrite-agents-restate-facts
summary: >-
  New text from drafting or rewriting agents repeated a fact that already has a home, and a reviewer or the owner had to catch it.
cause: >-
  Agents add a sentence, rejected alternative or excerpt that restates a fact kept elsewhere (CLAUDE.md "One home per fact"): ADR rewrite agents, a build adding two ADR-0003 sentences, a lesson draft repeating ADR-0028 and an excerpt; the build reviewers passed some of it.
surface: safe
status: open
notes: |-
  2026-10-20 design: no separate fix designed: rides on PR #2336's CLAUDE.md "One home per fact" grep sentence plus review; not recurred since 2026-10-16.
occurrences:
  - session: session_011xN2Zi67cjpCguuMiZbsJ6
    date: "2026-10-13"
    severity: moderate
    description: "Parallel rewrite agents restated the same fact in several ADRs (merge-pr gap, generated-config alternative); it took a separate consistency pass to find and fix."
    solution: "Rewrite in dependency order or add a mandatory cross-batch dedupe step to the rewrite guide."
  - session: session_01NqN7omu3o4kxoGeQzzSXhK
    date: "2026-10-15"
    severity: minor
    description: "Owner review on #2085 flagged two ADR-0003 additions (a rejected alternative and a summary sentence) as repetition the build reviewers had passed"
    solution: "Have the clear-backlog-build Standards reviewer check new ADR text against Scope and summary for repetition"
  - session: session_01NFv67izdzVGrFHb2EVwZJ2
    date: "2026-10-16"
    severity: minor
    description: "First draft repeated ADR-0028's varies point as a watch item and kept a second copy of the Tinkerfund excerpt in the content database Lesson; code-review caught both"
    solution: "Before writing What to watch for, grep sibling Lessons and the linked ADR for each point (EVERY-PAGE.md already says so)"
  - session: session_01WynjtDHvk8MajTsgr59Ckt
    date: "2026-10-16"
    severity: minor
    description: "First commit wrote the publishedAt rule twice (EVERY-PAGE.md and the Glass Box glossary) and left EVERY-PAGE.md saying frontmatter holds four fields only"
