name: stop-hook-counts-main-commits
summary: >-
  The end-of-turn reminder asked agents to push commits that had only come in from main.
cause: >-
  The Stop hook's git check counts commits a branch inherited from main (after a fast-forward, a switch to a PR's branch, or on a branch with no upstream) as unpushed work and asks to push them. Signals: the hook naming many unpushed commits that origin/main..HEAD does not show, 'only inherited from origin/main', 'counted main's merged commits'.
surface: safe
status: open
fixes:
  - pr: 2123
    date: "2026-10-16"
    summary: "git-conventions now says no push is needed when the Stop hook counts main's commits and origin/main..HEAD is empty."
  - pr: 2188
    date: "2026-10-16"
    summary: "git-conventions.md now says to push a branch whose only unpushed commits are main's, ending the per-turn Stop hook nag."
occurrences:
  - session: session_013LwpcexAe7t3Qck4CKtj9Y
    date: "2026-10-15"
    severity: nit
    description: "Stop hook asked to push the branch five times when only commits fast-forwarded from main were unpushed, since the branch had no upstream."
    solution: "Make the hook compare against origin/main when the branch has no upstream."
  - session: session_01KVh6e6JUAssZvPRbuN5YDr
    date: "2026-10-15"
    severity: nit
    description: "Stop hook asked to push 7 commits that were only inherited from origin/main after my fast-forward, which cost an explanation turn."
    solution: "The hook should compare against origin/main, not the remote branch."
  - session: session_019nDDDS9GsXdTKWK44j18fT
    date: "2026-10-24"
    severity: nit
    description: "After the PR merged, the branch was restarted from origin/main, and the Stop hook then flagged inherited main commits as unpushed three times while builders and the gate ran."
    solution: "The Stop hook could count only commits not on origin/main, as git-conventions.md already advises readers to check by hand."
  - session: session_013zxzeQvE9RNYoZRiZEEKBG
    date: "2026-10-28"
    severity: nit
    description: "Restarting the merged session branch for the closing ledger PR left the Stop hook counting five unpushed commits against the stale remote branch, nagging until the push."
    solution: "Have the Stop hook count against origin/main when the branch's PR is already merged."
