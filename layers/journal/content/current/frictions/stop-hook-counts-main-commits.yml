name: stop-hook-counts-main-commits
summary: >-
  The end-of-turn reminder asked agents to push commits that had only come in from main.
cause: >-
  The Stop hook's git check counts commits a branch inherited from main (after a fast-forward, a switch to a PR's branch, or on a branch with no upstream) as unpushed work and asks to push them. Signals: the hook naming many unpushed commits that origin/main..HEAD does not show, 'only inherited from origin/main', 'counted main's merged commits'.
surface: safe
status: open
related:
  - entry: stop-hook-nag
    rule: The hook asked to commit and push while a gate, build or fact-check was still running.
fixes:
  - pr: 2123
    date: "2026-10-16"
    summary: "git-conventions now says no push is needed when the Stop hook counts main's commits and origin/main..HEAD is empty."
  - pr: 2188
    date: "2026-10-16"
    summary: "git-conventions.md now says to push a branch whose only unpushed commits are main's, ending the per-turn Stop hook nag."
occurrences:
  - session: session_013zxzeQESWGW1qj9P1Egphc
    date: "2026-11-15"
    severity: nit
    description: "After fast-forwarding to origin/main the Stop hook counted five session-log commits from main as unpushed; pushing my branch cleared it though none of the work was mine."
    solution: "Count only commits in origin/main..HEAD, as git-conventions.md already says to do by hand."
  - session: session_013zxzeSgAcwDrJXAMFAC4Qf
    date: "2026-11-17"
    severity: nit
    description: "The Stop hook counted 33 of main's commits as unpushed on the merged session branch; my fast-forward push then recreated the remote branch GitHub had deleted, which I did not check with ls-remote."
    solution: "Check git ls-remote for the branch before pushing a merged branch, and have the Stop hook skip a branch whose PR has merged."
  - session: session_013zxzeT3ZUhBeG84jQUD1Hw
    date: "2026-11-21"
    severity: nit
    description: "My fast-forward of the session branch to origin/main made the Stop hook flag main's own log commit as unpushed; I pushed the branch to quiet it."
    solution: "Leave the session branch where it started when I only read main; use origin/main in read commands instead of fast-forwarding."
  - session: session_013zxzeQ92opecHinpUgHCyA
    date: "2026-11-26"
    severity: nit
    description: "After the merge I fast-forwarded my branch onto origin/main; the Stop hook then reported two unpushed commits that were main's own history, costing a push and a re-read of git-conventions."
    solution: "Stay on the branch tip after merge; push plainly only if a follow-up commit exists."
