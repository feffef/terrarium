name: stop-hook-counts-main-commits
summary: >-
  The end-of-turn reminder asked agents to push commits that had only come in from main.
cause: >-
  The Stop hook's git check counts commits a branch inherited from main (after a fast-forward, a switch to a PR's branch, or on a branch with no upstream) as unpushed work and asks to push them. Signals: the hook naming many unpushed commits that origin/main..HEAD does not show, 'only inherited from origin/main', 'counted main's merged commits'.
surface: safe
status: open
related:
  - entry: stop-hook-nag
    rule: The hook asked to commit and push while a gate, build or fact-check was still running.
fixes:
  - pr: 2123
    date: "2026-10-16"
    summary: "git-conventions now says no push is needed when the Stop hook counts main's commits and origin/main..HEAD is empty."
  - pr: 2188
    date: "2026-10-16"
    summary: "git-conventions.md now says to push a branch whose only unpushed commits are main's, ending the per-turn Stop hook nag."
occurrences:
  - session: session_013zxzeRCCqrxVitqSaxJa4K
    date: "2026-11-07"
    severity: nit
    description: "After PR 2948 merged and GitHub deleted its branch, the stop hook kept reporting 5 unpushed commits against a stale remote-tracking ref, which cost a fetch and ancestry check before a plain push."
    solution: "The hook could compare against origin/main when the remote branch no longer exists, or git-conventions could name this case."
  - session: session_013zxzeQRndZ5iHweDq8ceMP
    date: "2026-11-11"
    severity: nit
    description: "The Stop hook counted 46 unpushed commits against a remote branch deleted after the merge, though almost all were main's own commits."
    solution: "Count commits against origin/main, or skip the nag when the remote branch no longer exists."
  - session: session_013zxzeNjAbKXTy5zKs2fg8r
    date: "2026-11-12"
    severity: nit
    description: "Merged origin/main into the session branch to run a lookup script, so the Stop hook counted 40 unpushed commits (merged main history on a remote branch deleted by an earlier merge) and asked for a push."
    solution: "Use a detached checkout of origin/main for a read-only check instead of merging it into the session branch."
  - session: session_013zxzeRifuq1jTn2WseeBhP
    date: "2026-11-13"
    severity: nit
    description: "The Stop hook reported one unpushed commit after I fast-forwarded the session branch to origin/main; no commit of mine existed."
    solution: "The hook could count commits not on origin/main; git-conventions.md already gave the push fix."
  - session: session_013zxzeSTLT98vFMqWFKbjqG
    date: "2026-11-13"
    severity: nit
    description: "The Stop hook counted 14 unpushed commits after I restarted the merged branch from main, though all but one were already on main."
    solution: "Have the hook count against origin/main, as git-conventions.md says to, when the remote branch is gone."
  - session: session_013zxzeQESWGW1qj9P1Egphc
    date: "2026-11-15"
    severity: nit
    description: "After fast-forwarding to origin/main the Stop hook counted five session-log commits from main as unpushed; pushing my branch cleared it though none of the work was mine."
    solution: "Count only commits in origin/main..HEAD, as git-conventions.md already says to do by hand."
  - session: session_013zxzeSgAcwDrJXAMFAC4Qf
    date: "2026-11-17"
    severity: nit
    description: "The Stop hook counted 33 of main's commits as unpushed on the merged session branch; my fast-forward push then recreated the remote branch GitHub had deleted, which I did not check with ls-remote."
    solution: "Check git ls-remote for the branch before pushing a merged branch, and have the Stop hook skip a branch whose PR has merged."
