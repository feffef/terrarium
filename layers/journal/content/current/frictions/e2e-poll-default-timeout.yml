name: e2e-poll-default-timeout
summary: >-
  Browser tests gave up after one second, so a slow Tinkerfund page failed unrelated changes and passed on a retry.
cause: >-
  e2e specs asserted with vitest's expect.poll at its 1000 ms default, so a slow back/forward step in tinkerfund-flows.spec.ts (around line 387, goForward and the cart checkbox) timed out under load and passed on re-run. Signals: tinkerfund-flows.spec.ts:387 or :388 failing in gate:scoped or CI on an unrelated diff.
surface: safe
status: open
fixes:
  - pr: 1919
    date: "2026-10-14"
    summary: "Browser tests now wait up to 10 seconds instead of 1 second before failing."
occurrences:
