name: worktree-guard-blocks-compound-bash
summary: The container's worktree safety check refused helper agents' compound shell commands, so they rewrote them as plain calls or helper scripts.
cause: "The container-level worktree-isolation guard refuses compound Bash in an agent worktree (loops, variable expansion, pipes, heredocs piped to node), not only commands naming git twice; agents find out by trial and fall back to plain calls or scratch helper scripts. environment-caveats.md lists some triggers. Signals: 'worktree guard refused' on a compound command, heredoc or pipe, 'forcing plain calls and a helper script'."
surface: outside
status: open
related:
  - entry: harness-classifier-denials
    rule: The auto-mode classifier denied an amend, force push or reset.
fixes:
  - pr: 1825
    date: "2026-10-12"
    summary: The dispatch Skill and environment-caveats now list what the worktree guard wrongly blocks and say one git command per call.
  - pr: 2732
    date: "2026-10-31"
    summary: "environment-caveats.md replaces the guess at the guard's triggers with a dated probe list: only $VAR expansion in a git command was refused; one git command per call with literal paths."
occurrences:
  - session: session_013zxzeNiyBNZD3Zn5dUm9Bq
    date: "2026-11-13"
    severity: nit
    description: "A combined printf-and-commit Bash call was blocked whole by the gate-edit guard, so the message file was never written and the retry failed."
    solution: "Write commit messages with the Write tool, separate from the git call (git-conventions.md already says keep git apart)."
  - session: session_013zxzeNd9wP36dUYyykDdBv
    date: "2026-11-18"
    severity: minor
    description: "The builder rules say no && chains in a worktree yet their own gate example is a cd && chain, and the wrap-width check assumes 80 columns where blog files keep 120; builders lost a turn to the guard and a gate failed on a missing node_modules (retro replies)."
    solution: "In rules() in .claude/workflows/clear-backlog-build.js: use the width the file keeps, say Write/Edit for files and one command per Bash call, and tell the builder to pnpm install before a gate."
  - session: session_013zxzeSbz6S2A8goaq25ibN
    date: "2026-11-19"
    severity: minor
    description: "Retro, both builders: the worktree guard refused non-git commands such as a python3 heredoc and cd-then-git chains, costing retries."
    solution: "clear-backlog-build.js rules(): say interpreter heredocs that touch files are refused too; use Edit or Write."
  - session: session_013zxzePUNdDXiqJrj8m6Bjs
    date: "2026-11-19"
    severity: nit
    description: "A builder's commit-message printf chained with git commit was refused by the one-git-command-per-call hook, so the commit failed on a missing file and cost a turn."
    solution: "Tell builders in rules() to write the commit message with the Write tool, then run git commit -F alone."
  - session: session_013zxzeT3ZUhBeG84jQUD1Hw
    date: "2026-11-21"
    severity: minor
    description: "Builders report compound Bash commands refused by the worktree guard, silently dropping a file write or an edit batch (tap-targets, glassbox), though the brief states the rule."
    solution: "Have the guard's refusal say that nothing in the call ran, and repeat the one-command-per-call rule at the point of the first edit step in rules()."
  - session: session_013zxzeQemDnZfmHdeYUmhur
    date: "2026-11-23"
    severity: nit
    description: "Retro, builder: rules() puts the no-chaining Bash rule after the task steps, so a compound cd command was refused by the worktree guard and rewritten; the gate command in the first-turn brief also blurs which turn it is."
    solution: "In .claude/workflows/clear-backlog-build.js rules(), put the no-chaining rule and scratchpad-script tip first, and drop the gate command from the first-turn brief (unverified: builder's own report)."
  - session: session_013zxzeRQRYWw3yLJzSdaozk
    date: "2026-11-24"
    severity: minor
    description: "Retro, builder (unverified by me): rules() forbids && and ; in a worktree yet prescribes the gate command with cd and &&; its own chained call was refused, taking a turn and skipping pnpm install, so vitest was missing."
    solution: "State in rules() of .claude/workflows/clear-backlog-build.js that every Bash call is one plain command (writes through Write and Edit) and the gate command is the only chain."
  - session: session_013zxzeSBTTxHztyPoJeEwAj
    date: "2026-11-24"
    severity: nit
    description: "Retro (builder): the worktree guard refused three chained or heredoc Bash calls; the brief states the no-chaining rule only for git, so non-git chains were retried."
    solution: "Reword the rule in .claude/workflows/clear-backlog-build.js as one simple command per Bash call, no heredocs, in a worktree."
