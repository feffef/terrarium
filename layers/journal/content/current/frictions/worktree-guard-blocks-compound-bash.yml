name: worktree-guard-blocks-compound-bash
summary: The container's worktree safety check refused helper agents' compound shell commands, so they rewrote them as plain calls or helper scripts.
cause: "The container-level worktree-isolation guard refuses compound Bash in an agent worktree (loops, variable expansion, pipes, heredocs piped to node), not only commands naming git twice; agents find out by trial and fall back to plain calls or scratch helper scripts. environment-caveats.md lists some triggers. Signals: 'worktree guard refused' on a compound command, heredoc or pipe, 'forcing plain calls and a helper script'."
surface: outside
status: open
fixes:
  - pr: 1825
    date: "2026-10-12"
    summary: The dispatch Skill and environment-caveats now list what the worktree guard wrongly blocks and say one git command per call.
occurrences:
  - session: session_01LpcCJWRYb5grgQe3wBGEwb
    date: "2026-10-15"
    severity: nit
    description: "Digest impl agent: the worktree guard refused several compound Bash commands (loops, variables, heredocs piped to node), forcing plain calls and a helper script"
    solution: "The dispatch brief could say up front to write helper scripts with Write instead of compound Bash"
  - session: session_01XUuxhnMc7t2zXaH9ebtxKZ
    date: "2026-10-16"
    severity: nit
    description: "The impl agent's Bash commands hit the worktree guard on compound commands and a pipe, the same behaviour fix 1 addresses."
    solution: "The new clause in the build workflow brief; the guard itself is outside the repo."
  - session: session_013RCsUF234qAGu3CJr3v2on
    date: "2026-10-16"
    severity: minor
    description: "Impl agents repeatedly hit the worktree shell guard on compound commands, heredocs and variable expansion, and worked around it with helper scripts; one ran a stale helper left in the shared scratchpad."
    solution: "Briefs tell agents to name scratch helpers uniquely; consider documenting the guard's triggers where dispatch-subagents points."
