name: worktree-guard-blocks-compound-bash
summary: The container's worktree safety check refused helper agents' compound shell commands, so they rewrote them as plain calls or helper scripts.
cause: "The container-level worktree-isolation guard refuses compound Bash in an agent worktree (loops, variable expansion, pipes, heredocs piped to node), not only commands naming git twice; agents find out by trial and fall back to plain calls or scratch helper scripts. environment-caveats.md lists some triggers. Signals: 'worktree guard refused' on a compound command, heredoc or pipe, 'forcing plain calls and a helper script'."
surface: outside
status: open
fixes:
  - pr: 1825
    date: "2026-10-12"
    summary: The dispatch Skill and environment-caveats now list what the worktree guard wrongly blocks and say one git command per call.
  - pr: 2732
    date: "2026-10-31"
    summary: "environment-caveats.md replaces the guess at the guard's triggers with a dated probe list: only $VAR expansion in a git command was refused; one git command per call with literal paths."
occurrences:
  - session: session_013zxzeSvdGhiM7SLEUgzvmF
    date: "2026-11-01"
    severity: nit
    description: "Worktree guard refused two writer commands: a curl URL containing the word github and a for loop with sed and git ls-files."
    solution: "Document in dispatch-subagents which command shapes the worktree guard refuses."
  - session: session_013zxzeQZYwzDuf4JEncnqAa
    date: "2026-11-02"
    severity: minor
    description: "Writers hit worktree-guard and inline-heredoc refusals and worked around them with script files"
    solution: "writer-brief should tell writers to write edit scripts to their scratch folder from the start"
  - session: session_013zxzeS7NuFmaoXJkxVfNby
    date: "2026-11-05"
    severity: nit
    description: "Impl agent's combined mkdir && git && pnpm call was refused by the worktree-isolation guard; it split the call."
    solution: "dispatch-subagents already says one git command per Bash call; repeat it in impl-brief."
  - session: session_013zxzeNiyBNZD3Zn5dUm9Bq
    date: "2026-11-13"
    severity: nit
    description: "A combined printf-and-commit Bash call was blocked whole by the gate-edit guard, so the message file was never written and the retry failed."
    solution: "Write commit messages with the Write tool, separate from the git call (git-conventions.md already says keep git apart)."
