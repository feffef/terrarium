name: worktree-guard-false-positive
summary: The container's worktree safety check refused git commands on a branch whose name contains "git", so helper agents committed under another branch name.
cause: "Until about 2026-10-21 the container-level worktree-isolation guard refused a command that named git twice and counted a branch or file name containing 'git' as the second, so build agents committed on a temp or renamed branch. The 2026-10-31 probe (#2612) found both accepted. Signals: 'worktree guard refused', 'containing git twice'. Compound-command refusals belong in worktree-guard-blocks-compound-bash."
surface: outside
status: open
notes: |-
  2026-10-31 survey: the probe for #2612 (PR #2732) found the guard accepts 'git' in a branch name and git named twice, so clear-backlog-build no longer refuses such names; a new occurrence means the guard changed back.
fixes:
  - pr: 1825
    date: "2026-10-12"
    summary: The dispatch Skill and environment-caveats now list what the worktree guard wrongly blocks and say one git command per call.
  - pr: 2140
    date: "2026-10-16"
    summary: "The build workflow brief now says a branch name or path containing git counts toward the worktree guard's two-git limit."
  - pr: 2377
    date: "2026-10-21"
    summary: "clear-backlog-build now refuses a planned branch name containing \"git\" before any agent runs, replacing the prose warning in its build brief."
occurrences:
  - session: session_01QsVUJGmHhhoAn8T6ewjnLP
    date: "2026-10-21"
    severity: minor
    description: "The build agent's worktree guard refused every command naming the branch git-conventions-foreground-gate-chain because it contains 'git', so the commit sat on the worktree branch and I pushed it under another name."
    solution: "Narrow the guard's match so that a branch name containing the word git is not treated as a git command."
