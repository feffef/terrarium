name: parallel-branches-same-lines-conflict
summary: Parallel branches editing the same lines of a shared file conflicted, and the second to merge needed a manual merge.
cause: "Branches built in parallel edit the same lines of one shared file (Where next lists, a stamped pointer line, a roster table, a moved script), and nothing orders or groups them; signals: merge conflicts on adjacent shared lines, restamps, lists re-grown past the cap."
surface: safe
status: open
occurrences:
  - session: session_01GG85r8HWMEdaMgKUaNUZH7
    date: "2026-10-14"
    severity: moderate
    description: "Parallel content PRs conflicted repeatedly on shared Where next lists and Opening a page chips; keeping both sides re-grew lists past the cap"
    solution: "Cap Where next and stop chips in the contract from the start (now done), and merge content PRs serially"
  - session: session_015dUGRadEQP1bvv6KytKLXT
    date: "2026-10-14"
    severity: minor
    description: "Builds of PRs that touch the same adr-0002 pointer line ran in parallel, so the second needed a manual conflict merge and restamp"
    solution: "Have clear-backlog group branches that regenerate the same stamped files, or order them"
  - session: e34491a0-8237-4285-88b7-1a0b73cd29e7
    date: "2026-10-16"
    severity: nit
    description: "After #2179 merged, PR #2177 conflicted on an adjacent guards.md roster row another PR had reworded"
    solution: "Expected with a shared table; merging main into the branch resolved it in one step"
  - session: session_01JuCbPDE6DkKs6mTCFAKQNr
    date: "2026-10-16"
    severity: minor
    description: "Main restructured the same landing while the PR was open, causing a merge conflict the owner had to point out."
    solution: "Fetch origin main and check for recent edits to the files right before pushing or asking to merge."
  - session: session_013RCsUF234qAGu3CJr3v2on
    date: "2026-10-16"
    severity: minor
    description: "main landed the empty-glob check in the old scripts/validate-adr-rules.ts while this branch had split it, giving a content conflict plus a spec whose new fixtures used the old flat layout."
    solution: "Land large file moves quickly, or announce them so parallel PRs target the new layout."
