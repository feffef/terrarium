    rule: A guide page check failed (word cap, link text) after an edit, with no merge conflict.
notes: |-
  2026-10-21 design: a rule on parallel branches dropped: the five occurrences have different causes, one is already fixed by a cap in the contract, and the cost is one merge step.
occurrences:
  - session: session_013zxzeS7WM4TBNbgtufBjAT
    date: "2026-11-12"
    severity: minor
    description: "The PR opened conflicted with main because the Glass Box glossary changed upstream after my last fetch; fixed with a merge and a re-run of the glossary sweep."
    solution: "Fetch and test the merge (git merge-tree) right before opening a PR that edits a doc other sessions edit, as git-conventions says for long sessions."
