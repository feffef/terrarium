name: parallel-branches-same-lines-conflict
summary: Branches built in parallel edited the same lines of a shared file, and the second to merge needed a manual merge.
cause: "One run builds branches in parallel that edit the same lines of one shared file (Where next lists, a stamped pointer line, a roster table), and nothing orders or groups them; signals: merge conflicts on adjacent shared lines between a run's own PRs, restamps, lists re-grown past the cap. Strays 01JuCbPD and 013RCsUF are conflicts with main changed by another session (fixes: fetch before pushing; land large moves quickly)."
surface: safe
status: open
notes: |-
  2026-10-21 design: a rule on parallel branches dropped: the five occurrences have different causes, one is already fixed by a cap in the contract, and the cost is one merge step.
occurrences:
  - session: e34491a0-8237-4285-88b7-1a0b73cd29e7
    date: "2026-10-16"
    severity: nit
    description: "After #2179 merged, PR #2177 conflicted on an adjacent guards.md roster row another PR had reworded"
    solution: "Expected with a shared table; merging main into the branch resolved it in one step"
  - session: session_01JuCbPDE6DkKs6mTCFAKQNr
    date: "2026-10-16"
    severity: minor
    description: "Main restructured the same landing while the PR was open, causing a merge conflict the owner had to point out."
    solution: "Fetch origin main and check for recent edits to the files right before pushing or asking to merge."
  - session: session_013RCsUF234qAGu3CJr3v2on
    date: "2026-10-16"
    severity: minor
    description: "main landed the empty-glob check in the old scripts/validate-adr-rules.ts while this branch had split it, giving a content conflict plus a spec whose new fixtures used the old flat layout."
    solution: "Land large file moves quickly, or announce them so parallel PRs target the new layout."
  - session: session_013zxzeRkASapvnaGkGVdSBk
    date: "2026-10-27"
    severity: minor
    description: "Two promotion agents each edited the other's draft link before moving it; cherry-picks conflicted on both moved drafts"
    solution: "Tell promotion agents not to touch another promoted draft; repoint links in the join pass"
