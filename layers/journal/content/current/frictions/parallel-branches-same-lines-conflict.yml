name: parallel-branches-same-lines-conflict
summary: Branches built in parallel edited the same lines of a shared file, and the second to merge needed a manual merge.
cause: "One run builds branches in parallel that edit the same lines of one shared file (Where next lists, a stamped pointer line, a roster table), and nothing orders or groups them; signals: merge conflicts on adjacent shared lines between a run's own PRs, restamps, lists re-grown past the cap. Strays 01JuCbPD and 013RCsUF are conflicts with main changed by another session (fixes: fetch before pushing; land large moves quickly)."
surface: safe
status: open
notes: |-
  2026-10-21 design: a rule on parallel branches dropped: the five occurrences have different causes, one is already fixed by a cap in the contract, and the cost is one merge step.
occurrences:
  - session: session_013zxzeT8tDd5GPJiRNZRA4J
    date: "2026-11-04"
    severity: minor
    description: "Skipped dispatch-subagents section 4: sixteen writers edited overlapping pages in parallel, giving four merge conflicts (04.hooks, a promoted Walkthrough, the Routines draft, Path-specific rules) I resolved by hand."
    solution: "Have grades.ts briefs merge writers that touch the same page (a step's trims versus a Subject writer's items) or serialize them."
  - session: session_013zxzeQwU4eYGrEvV8x42ts
    date: "2026-11-08"
    severity: minor
    description: "Started the SessionStart-hook build while the sibling Stop-hook PR was still open on the same files; the branch then needed a rebase with a guards.md conflict and a second gate run."
    solution: "Serialize builds that touch the same Human-only files, or tell the builder to base on the sibling's branch."
