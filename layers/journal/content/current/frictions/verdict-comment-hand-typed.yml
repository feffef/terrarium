name: verdict-comment-hand-typed
summary: >-
  Agents typed the reviewed commit's SHA into their merge verdict by hand and got it wrong.
cause: >-
  The Reviewed SHA in a PR verdict comment is typed from memory, a short hash, the workflow's commit list or a CI comment's merge ref instead of copied from git rev-parse HEAD, so merge-pr.ts refuses it or the session corrects it. Since PR #2841 (2026-11-04) pr-workflow step 4 says to paste the output of scripts/github/verdict-line.ts, which prints the line from git rev-parse HEAD. Signals: 'typed the Reviewed SHA from memory', 'made-up full commit SHA', 'mistyped short SHA', merge-pr refusing the verdict's SHA.
surface: safe
status: open
notes: |-
  2026-10-21 design: a pr-workflow line or a guard on hand-typed SHAs and paths dropped: all 8 sessions read pr-workflow.md and slipped anyway, merge-pr.ts already refuses a wrong Reviewed SHA and prints the line, and a guard is a Human-only edit for a nit-level cost.
  2026-10-23 design: a merge-pr.ts flag or hand-typed-value guard dropped again: merge-pr.ts already refuses a wrong Reviewed SHA and prints the exact line, so a slip costs one edit, and a guard is a Human-only edit.
  2026-10-25 design: no change: the mechanism is unchanged since 10-21 (merge-pr.ts still refuses the SHA and prints the line, pr-workflow.md was only pruned), a guard or merge-pr.ts flag stays a Human-only edit already rejected twice, and the prose half (the verify-before-you-state bullet) is in an open Prune Trial's territory (ADR-0027).
fixes:
  - pr: 2697
    date: "2026-10-30"
    summary: "pr-workflow step 4: paste the Reviewed SHA from git rev-parse HEAD run in the reviewed head's checkout"
  - pr: 2841
    date: "2026-11-04"
    summary: "New scripts/github/verdict-line.ts prints the Reviewed line from git rev-parse HEAD (warns when HEAD is not the PR head) and pr-workflow step 4 says to paste its output."
