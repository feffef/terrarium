    description: "My first verdict comment named a mistyped short SHA (30a92a7247 vs ...7244); merge-pr.ts refused and I edited the comment."
    solution: "Paste the head SHA from git rev-parse HEAD into the verdict rather than typing it."
  - session: session_01VH74k3Z27QtjR19XNC76qm
    date: "2026-10-20"
    severity: nit
    description: "Filed regression issue #2332 with a garbled phrase (#321-era follow-up #2321) and had to edit the body after creating it."
    solution: "Re-read the body before sending, as for any GitHub post."
