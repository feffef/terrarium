name: verdict-comment-hand-typed
summary: >-
  Agents typed paths, commit SHAs and ids into GitHub posts by hand and got them wrong.
cause: >-
  A path, SHA, branch or id in a GitHub body (a verdict comment's Reviewed SHA or footer link, an issue or PR body) is written from memory, a short hash or an earlier transcript instead of copied from git rev-parse, the file tree or the session id when posting, so it is wrong until compared and corrected. Signals: 'typed the Reviewed SHA from memory', 'made-up full commit SHA', 'duplicated path segment' in the footer link, a guessed path, a cited commit a later rewrite replaced.
surface: safe
status: open
fixes: []
occurrences:
  - session: session_01Sc82qSCs4NVP3igf9SaGXM
    date: "2026-10-17"
    severity: nit
    description: "Wrote a made-up full commit SHA in a PR verdict comment after seeing only the short hash; I caught it before merging and edited the comment to the real SHA."
    solution: "Take the full head SHA from git rev-parse before writing the Reviewed line."
  - session: session_01CXxyUmwkN3Rx5DTSK2s391
    date: "2026-10-17"
    severity: nit
    description: "Typed the Reviewed SHA in the verdict comment from memory and got the tail wrong; caught it by comparing with git rev-parse and posted a correction."
    solution: "Have the verdict comment built from the git rev-parse output, or have merge-pr.ts print the line to paste."
  - session: session_01P39mjYt8LWVh2TYNyxWdqN
    date: "2026-10-17"
    severity: nit
    description: "The PR's merge-verdict comment's footer link rendered as \"https://claude.ai/code/code\" (a duplicated path segment) instead of \"https://claude.ai/code\", a copy-paste slip in the attribution footer."
    solution: "Proofread the exact attribution footer text against the system reminder's literal string before posting a GitHub comment, rather than typing it from memory."
  - session: session_018Uhxo4D5VcScugLrS35r4w
    date: "2026-10-18"
    severity: nit
    description: "Typed the review verdict's head SHA from memory and got its tail wrong; merge-pr.ts refused the merge until the comment was corrected"
    solution: "Paste the SHA from git rev-parse HEAD into the verdict rather than retyping it; the script's exact-SHA check worked as designed"
  - session: session_012VTgtrUEy7cPVTN5sMriXj
    date: "2026-10-15"
    severity: nit
    description: "Filed #2076 with a guessed spec path (tests/e2e/ instead of layers/tinkerfund/tests/e2e/) before checking it; corrected the body right after."
    solution: "Verify a path with git ls-files before it goes into an issue body (CLAUDE.md Verify before you state)."
  - session: session_01TJH95qkztCQJ8PF6G6pvqs
    date: "2026-10-18"
    severity: minor
    description: "After stopping the #2231 build I cited a commit and branch from the builder's first commit; a review round had rewritten them, so I posted a correction."
    solution: "Read git log in the worktree before quoting a sha from a transcript."
  - session: session_01MeatWCLdQDV2rWVNHumqX7
    date: "2026-10-19"
    severity: nit
    description: "My first verdict comment named a mistyped short SHA (30a92a7247 vs ...7244); merge-pr.ts refused and I edited the comment."
    solution: "Paste the head SHA from git rev-parse HEAD into the verdict rather than typing it."
