name: binding-docs-skipped
summary: >-
  Agents skipped docs they are told to read first, because nothing enforces most of those reminders.
cause: >-
  CLAUDE.md's read-first rules are prose, and nothing hooks the session-start GLOSSARY.md reads, full-ADR reads or the ADR grep before a recommendation. A late read of a step-triggered doc (git-conventions.md, github-integration.md and the like) belongs to late-read-first-docs, which the owner accepted.
surface: guard-or-hook
status: tracked
ref: "issue #2146: the owner decides whether these need a new mechanism; its accepted late reads and PRs #1793/#2066 moved to late-read-first-docs"
occurrences:
  - session: session_01NyDGTR1fuP22hPo7XghCfz
    date: "2026-10-07"
    severity: moderate
    description: "Broke CLAUDE.md 'Before you plan a change: grep docs/adr' (old CLAUDE.md: read all ADRs) — no ADR lookup before planning. Impact: I mis-cited ADR-0018/0026 in the Human-only list, which two review rounds had to fix."
    solution: "Would have grepped had the trigger named instruction files too ('including CLAUDE.md and Skills'); I treated the rewrite as prose, not as a change ADRs bind"
