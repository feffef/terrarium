name: binding-docs-skipped
summary: >-
  Agents skipped docs they are told to read first, because nothing enforces most of those reminders.
cause: >-
  CLAUDE.md's read-first rules are prose, and nothing hooks the session-start GLOSSARY.md reads, full-ADR reads or the ADR grep before a recommendation. A late read of a step-triggered doc (git-conventions.md, github-integration.md and the like) belongs to late-read-first-docs, which the owner accepted.
surface: guard-or-hook
status: tracked
ref: "issue #2146 closed by PR #2284 (adr-check Skill); issue #2286 reviews adr-check around 2026-10-22; PR #2287 trimmed its output. Sessions after #2284 still skipped adr-check (012f7o6F, 017X5SQq, 01FTPnEs). Late reads of step-triggered docs belong to late-read-first-docs.; issue #2342 (CLAUDE.md demands adr-check before any recommendation, but frictions-to-fixes mandates decisions without it)"
fixes:
  - pr: 2165
    date: "2026-10-16"
    summary: "Each ADR summary rule now says when to read its full ADR, naming what only the ADR holds."
  - pr: 2284
    date: "2026-10-19"
    summary: "Moved the ADR grep before a recommendation into a model-invoked adr-check Skill that prints every ADR summary and reads the related ADRs in full."
