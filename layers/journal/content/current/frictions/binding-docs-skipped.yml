name: binding-docs-skipped
summary: >-
  Agents gave a recommendation or planned a change without first checking which ADRs bind it.
cause: >-
  Before PR #2431, CLAUDE.md asked for an ADR check (a grep of docs/adr, then the adr-check Skill) before any plan or recommendation, a chat opinion included; it was prose and agents answered first. Since #2431 the trigger is gone, and adr-read-hint.ts names an unread ADR only when an Edit, Write or (PR #2570) git commit touches its paths, so a recommendation given in chat still meets no check. Signals: "recommended ... before grepping docs/adr", "without running adr-check", the owner asking whether any ADRs were read, an adr-read hint firing after the plan was given. A Skill-scripted decision belongs to adr-check-scope-in-skill-runs; a summary-only read, to full-adr-read-skipped; the glossary read, to session-start-glossary-skipped.
surface: guard-or-hook
status: open
fixes:
  - pr: 2284
    date: "2026-10-19"
    summary: "Moved the ADR grep before a recommendation into a model-invoked adr-check Skill that prints every ADR summary and reads the related ADRs in full."
  - pr: 2431
    date: "2026-10-23"
    summary: "Retired the adr-check Skill and its CLAUDE.md trigger; a new PostToolUse hook (adr-read-hint.ts) now names, once per agent, each ADR an Edit or Write touches by its rule paths or by number and that the agent has not read in full."
  - pr: 2570
    date: "2026-10-26"
    summary: "adr-read-hint also points at the ADRs a Bash git commit touches."
