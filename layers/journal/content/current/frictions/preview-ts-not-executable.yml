name: preview-ts-not-executable
surface: safe
summary: Agents ran scripts/ui/preview.ts directly, as the docs show it, and the shell refused it because the file is not executable, so they retried through pnpm exec tsx.
cause: "scripts/ui/preview.ts has no executable bit, so a bare call exits 126 (permission denied); before PR #3078 (2026-11-11) docs and CLAUDE.md showed it bare. Since then CLAUDE.md Repo layout says scripts run through pnpm exec tsx, and verifying-ui-changes.md writes its first call that way. Signals: 'Exit 126', 'not executable', 'permission denied', 'preview.ts' run bare."
status: open
fixes:
  - pr: 3078
    date: "2026-11-11"
    summary: "CLAUDE.md Repo layout says scripts run as pnpm exec tsx scripts/<area>/<file>.ts; verifying-ui-changes.md writes the first preview.ts call that way."
occurrences:
  - session: session_013zxzeRpiY8hmJh8z3HELvr
    date: "2026-11-11"
    severity: minor
    description: "Ran scripts/ui/preview.ts directly and got Exit 126 (not executable); docs show it bare, so a shell call fails."
    solution: "Mark scripts/ui/preview.ts executable, or write it as pnpm exec tsx scripts/ui/preview.ts in verifying-ui-changes.md."
  - session: session_013zxzeQjCNYD6UbYX7LTjkR
    date: "2026-11-11"
    severity: nit
    description: "scripts/ui/preview.ts is not executable, so running it directly failed; had to use pnpm exec tsx."
    solution: "Docs should show the pnpm exec tsx form, or the file should be made executable."
  - session: session_013zxzeNeWJTvqXPTEeR63qC
    date: "2026-11-11"
    severity: nit
    description: "scripts/ui/preview.ts is not executable, so running it directly failed with permission denied; it needs pnpm exec tsx."
    solution: "Document the pnpm exec tsx form in verifying-ui-changes.md or mark the script executable."
