name: validate-content-skipped-before-gate
surface: safe
summary: A content edit failed the first gate run on a schema rule that pnpm validate:content would have shown in seconds.
cause: "After a content-only edit (text wrapped by hand into folded YAML lines) the author ran gate:scoped without the quick validate:content that ADR-0004 recommends while iterating; the gate failed on validate-content-schema and was rerun. Signals: 'validate-content-schema', 'hyphenated words split across folded YAML lines', 'had not run validate:content first'."
status: open
notes: |-
  2026-11-03 design: no change: ADR-0004 already says to run validate:content, the gate runs it as a floor step, and moving it earlier edits Human-only gate files for a rare one-rerun cost; dropped: same cause as ledger-yaml-hand-edit-errors
occurrences:
  - session: session_013zxzePh7qKycsJT9g2eqU1
    date: "2026-11-03"
    severity: moderate
    description: "My text wrapping split hyphenated words across folded YAML lines, so the first gate:scoped failed on validate-content-schema and I reran the gate. I had not run validate:content first."
    solution: "Run pnpm validate:content after any Journal content edit and before gate:scoped, as ADR-0004 says."
  - session: session_013zxzeQN4dgz9seaMtnRf7u
    date: "2026-11-10"
    severity: nit
    description: "A page description I edited came back over its 120-character cap twice, and an unquoted # in the run entry broke validate:content; both only showed after a commit."
    solution: "Run glassbox-pages.spec.ts and validate:content after each edit to a description or run entry, and note the cap in the writer brief."
  - session: session_013zxzePbgAjUYqz6Zpvm4uU
    date: "2026-11-12"
    severity: minor
    description: "Edited the post's description after validate:content last passed and never re-ran it, so the gate failed on an unquoted colon in the YAML."
    solution: "Run pnpm validate:content after any frontmatter edit, or have the Skill's fact-check loop end with it."
