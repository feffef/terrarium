name: get-session-cost-unreported
surface: outside
summary: A Skill or PR body needed the run's cost, but get_session showed none (or none yet), so the PR said the cost was unreported.
cause: "A Skill or PR body once required the run's cost from get_session, which returned no cost_usd or usage field at some calls or was not among a scheduled run's tools, so the PR said the cost was unreported. No Skill or doc now asks for a run cost in a PR body, and glassbox-curate loops by default without reading cost. Signals: 'get_session returned no cost figure', 'no usage field', 'Run cost: unreported', 'cost_usd 0.12 early, 4.22 later'."
status: open
related:
  - entry: inspect-session-skill-skipped
    rule: get_session did give the cost, but the agent wrote "unreported" or said it was not recorded, or inspected another session without the inspect-session Skill.
notes: |-
  2026-11-17 regression issue #3401 filed (2 occurrences since #3258).
fixes:
  - pr: 2944
    date: "2026-11-07"
    summary: "glassbox-curate says to read cost at landing, since two runs read get_session early and reported unreported."
  - pr: 3001
    date: "2026-11-09"
    summary: "glassbox-curate SKILL.md reads cost_usd again just before the PR body and makes the run's cost a Done-when ('unreported' only when still missing)."
  - pr: 3258
    date: "2026-11-13"
    summary: "glassbox-curate says a run whose session lacks get_session estimates usage without it and the loop is the last step."
  - pr: 3388
    date: "2026-11-17"
    summary: "glassbox-curate SKILL.md: Shape and the head of Loop say a scheduled run without get_session keeps looping, the 450k estimated-token budget decides, never stopping only because cost is unknown."
  - pr: 3461
    date: "2026-11-18"
    summary: "glassbox-curate SKILL.md makes the loop the default and drops every cost_usd, get_session and 450k mention; no Skill or pr-workflow.md asks for a run cost in a PR body."
occurrences:
  - session: session_013zxzeRSMtPAREKXCce9GT6
    date: "2026-11-09"
    severity: minor
    description: "get_session was not available to this session, so the Skill's cost_usd budget check and the PR's cost line could not be filled."
    solution: "The curate Skill could say what to do when get_session is absent; the run reported cost as unreported."
  - session: session_013zxzeNvpKDRhFYp216ti6n
    date: "2026-11-10"
    severity: minor
    description: "get_session was not available, so the run cost could not be read for the PR body."
    solution: "Expose get_session in scheduled curate runs, or let the skill accept 'unreported' earlier."
  - session: session_013zxzeQ2wC57fFKCB2ZNBZb
    date: "2026-11-11"
    severity: minor
    description: "get_session was not available, so the run's cost_usd could not be read and the PR says unreported."
    solution: "Say in the Skill how to read cost when no get_session tool exists, or allow unreported as the Skill already does."
  - session: session_013zxzeSYMKya1mzpFJhAcSk
    date: "2026-11-13"
    severity: minor
    description: "Cost could not be read: get_session was not available as a tool, so the PR says unreported."
    solution: "Make get_session reachable in scheduled runs, or let the Skill accept unreported."
  - session: session_013zxzeS6AE1WUN124PHnm4b
    date: "2026-11-13"
    severity: nit
    description: "I wrote about 4 dollars as the run cost in the PR body without reading cost_usd; the session had cost 12.68 dollars, so I corrected the body."
    solution: "Read cost_usd with get_session before writing the cost line, as glassbox-curate says."
  - session: session_013zxzePak78Sud7pyRQMjeV
    date: "2026-11-15"
    severity: minor
    description: "get_session cost_usd read 0.12 early in run 1 and was put in the PR body; it was a lagging figure (4.22 later), so the PR body is wrong."
    solution: "Have the Skill say to read the cost at the end of the run, or to omit it when the figure is under a minute old."
  - session: session_013zxzeSoqEeWqPDrCqDCcJn
    date: "2026-11-16"
    severity: moderate
    description: "Stopped after one PR at about a third of the context budget: with no get_session the cost was unknown, and I read that as the repeat loop not applying; the owner had to ask."
    solution: "glassbox-curate should say the loop applies to scheduled autonomous runs too, with the estimated context limit as the budget (issue 3370)."
