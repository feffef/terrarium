    severity: minor
    description: "Ran gate:scoped before code-review, then edited during the run; pr-workflow says review first and edit nothing until the gate ends, so one gate run was wasted"
    solution: "Make scripts/gate/gate.ts record HEAD and the working-tree state at start and fail at the end if either changed, so a stale run is caught mechanically"
  - session: session_019CbZiWqLbydExXQCmHRDyg
    date: "2026-10-22"
    severity: minor
    description: "Edited files while the first gate:scoped run was in flight, so it had to be re-run on the final head (pr-workflow: edit nothing until it ends)."
    solution: "Apply review fixes before starting the gate, then wait."
  - session: session_01NqN7omu3o4kxoGeQzzSXhK
