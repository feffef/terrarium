name: edit-during-gate-run
summary: "The gate passed on a different tree than the one pushed, because files were edited during its run or committed after it."
cause: "Agents start gate:scoped before the final head exists: they keep editing while it runs, so the e2e step builds the old tree then runs new tests, or they run it before code-review or commit, amend or fix wording after it and push without rerunning it. Signals: \"edited files while gate:scoped was building\", \"had to run a second time on the final head\", gate run before code-review, an amend or follow-up commit pushed after the gate."
surface: safe
status: open
ref: ""
fixes:
  - pr: 2314
    date: "2026-10-20"
    summary: "pr-workflow.md now orders the pre-push steps commit, code-review, then gate:scoped last with no edits during it."
  - pr: 2450
    date: "2026-10-23"
    summary: "gate:scoped now warns at exit when HEAD or the working tree changed during its run."
  - pr: 2486
    date: "2026-10-24"
    summary: "Made gate.ts re-snapshot HEAD and the working tree before each step and abort when either changed."
  - pr: 2549
    date: "2026-10-25"
    summary: "The e2e .output reuse line now names the latest source edit it compared against, so a fresh gate build is not read as stale."
occurrences:
  - session: session_01WynjtDHvk8MajTsgr59Ckt
    date: "2026-10-16"
    severity: minor
    description: "Edited files while gate:scoped was building, so its e2e ran a new test against an old build and failed"
    solution: "Don't edit the tree during a gate run; commit fixes after it ends, then re-run"
  - session: session_01JuCbPDE6DkKs6mTCFAKQNr
    date: "2026-10-16"
    severity: minor
    description: "Started pnpm gate:scoped in the background, then edited files during it, so it had to run a second time on the final head."
    solution: "Finish review fixes before starting the gate, or start it only after the last commit."
  - session: session_011G3PKUqDog2WRSuqypmuJX
    date: "2026-10-20"
    severity: minor
    description: "Edited the Digest after gate:scoped had started, to apply fact-check fixes, so the gate did not see the final text; reran validate:content only."
    solution: "Wait for the fact-check before starting the gate."
  - session: session_01AwaGncaYJFWdJnc6yqDoTS
    date: "2026-10-19"
    severity: minor
    description: "gate:scoped started on the first commit; review fixes were amended in mid-run, so I ran the gate a second time (about 5 extra minutes). The origin session logged the same."
    solution: "Run code-review before starting gate:scoped, so amends land before the gate."
  - session: session_01FNv8z61n7roCRsM4AYVtf6
    date: "2026-10-21"
    severity: minor
    description: "Applied review fixes and amended the commit while the first gate:scoped run was still going, against pr-workflow.md's edit-nothing-until-it-ends; had to re-run the gate."
    solution: "Start the gate only after the review fixes are in, as pr-workflow.md orders."
