name: edit-during-gate-run
summary: "The gate passed on a different tree than the one pushed, because files were edited during its run or committed after it."
cause: "Agents start gate:scoped before the final head exists: they keep editing while it runs, so the e2e step builds the old tree then runs new tests, or they run it before code-review or commit, amend or fix wording after it and push without rerunning it; or the e2e step reuses an .output built before the last commit, so the final head is never exercised. glassbox-improve now runs the gate once on the final head (PRs #2626, #2629); since PR #3058 (2026-11-11) gate-edit-guard.ts denies Edit, Write, NotebookEdit and git commit while a gate:scoped run holds its run lock in that checkout, and since PR #3250 (2026-11-13) also git add, stash, checkout and reset (per worktree); a scripted Bash write (sed, a shell script) is still not caught, and a run before code-review or commit can still pass on an older tree. Signals: \"edited files while gate:scoped was building\", \"had to run a second time on the final head\", gate run before code-review, an amend or follow-up commit pushed after the gate, \"reused an .output\", \"L2 reuse\", an edit by shell script while the gate ran."
surface: safe
status: open
notes: |-
  2026-11-04 reopened: fixes #2626 and #2629 (2026-10-28) merged after the owner accepted it on 2026-10-27.
fixes:
  - pr: 2314
    date: "2026-10-20"
    summary: "pr-workflow.md now orders the pre-push steps commit, code-review, then gate:scoped last with no edits during it."
  - pr: 2450
    date: "2026-10-23"
    summary: "gate:scoped now warns at exit when HEAD or the working tree changed during its run."
  - pr: 2486
    date: "2026-10-24"
    summary: "Made gate.ts re-snapshot HEAD and the working tree before each step and abort when either changed."
  - pr: 2549
    date: "2026-10-25"
    summary: "The e2e .output reuse line now names the latest source edit it compared against, so a fresh gate build is not read as stale."
  - pr: 2626
    date: "2026-10-28"
    summary: "glassbox-improve runs gate:scoped once, on the final head; EVERY-PAGE's Check serves between rounds."
  - pr: 2629
    date: "2026-10-28"
    summary: "glassbox-improve step 7 fixes a false claim from the last re-grade before step 8's gate, and Done counts it."
  - pr: 3058
    date: "2026-11-11"
    summary: "gate-edit-guard.ts hook denies Edit, Write, NotebookEdit and git commit while a gate:scoped run holds its run lock in the checkout."
  - pr: 3250
    date: "2026-11-13"
    summary: "gate-edit-guard.ts also denies git add, stash, checkout and reset (not only commit) while a gate runs, per worktree; scripted Bash writes are left alone."
