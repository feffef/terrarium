name: edit-during-gate-run
summary: "Editing files while pnpm gate:scoped runs makes its result test a different tree, so it fails or must run again."
cause: "Agents start gate:scoped in the background and keep editing; the e2e step builds the old tree then runs new tests, or the gate must rerun on the final head. Signals: \"edited files while gate:scoped was building\", \"had to run a second time on the final head\"."
surface: safe
status: tracked
ref: "Dispatched in the 2026-10-20 frictions-to-fixes run (pr-workflow.md reorder)."
occurrences:
  - session: session_01WynjtDHvk8MajTsgr59Ckt
    date: "2026-10-16"
    severity: minor
    description: "Edited files while gate:scoped was building, so its e2e ran a new test against an old build and failed"
    solution: "Don't edit the tree during a gate run; commit fixes after it ends, then re-run"
  - session: session_01JuCbPDE6DkKs6mTCFAKQNr
    date: "2026-10-16"
    severity: minor
    description: "Started pnpm gate:scoped in the background, then edited files during it, so it had to run a second time on the final head."
    solution: "Finish review fixes before starting the gate, or start it only after the last commit."
  - session: session_011G3PKUqDog2WRSuqypmuJX
    date: "2026-10-20"
    severity: minor
    description: "Edited the Digest after gate:scoped had started, to apply fact-check fixes, so the gate did not see the final text; reran validate:content only."
    solution: "Wait for the fact-check before starting the gate."
  - session: session_01AwaGncaYJFWdJnc6yqDoTS
    date: "2026-10-19"
    severity: minor
    description: "gate:scoped started on the first commit; review fixes were amended in mid-run, so I ran the gate a second time (about 5 extra minutes). The origin session logged the same."
    solution: "Run code-review before starting gate:scoped, so amends land before the gate."
