name: clear-backlog-log-summary-line
summary: >-
  The backlog Skill did not ask the session log to say what each branch changed, so the owner had to ask.
cause: >-
  clear-backlog §4 and log-session set no line per merged or opened branch naming what it changed, though the digest reads the log rather than the PR. Signals: a log summary that names a branch but not its change, an owner asking what a run changed.
surface: safe
status: open
ref: "Issue #1878 (one log summary line per branch)."
fixes:
  - pr: 1880
    date: "2026-10-13"
    summary: "The session log now gets one summary line per merged or opened branch."
occurrences:
  - session: session_016gu9e44jjfAEFMo3CBxzUQ
    date: "2026-10-13"
    severity: moderate
    description: "My first session log summarized the build as 'the session-trace fix' and left out what it changed, although the workflow returned every decision. The owner had to ask for it."
    solution: "clear-backlog §4 or log-session should require one line per merged branch naming what it changed, since the digest reads the log rather than the PR."
