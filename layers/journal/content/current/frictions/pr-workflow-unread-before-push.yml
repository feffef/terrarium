name: pr-workflow-unread-before-push
summary: >-
  Agents pushed a branch or opened a PR before reading the PR workflow doc.
cause: >-
  CLAUDE.md's "before you push a branch, or open ... a PR" trigger for docs/agents/pr-workflow.md has no hint (read-first-hint.ts covers only git conventions, GitHub and screenshots), so nothing points to it before a push or create_pull_request; a prototype/ branch that gets no PR feels exempt. Signals: a push or PR opened before pr-workflow.md is read.
surface: safe
status: open
notes: |-
  2026-10-28 design: dropped: the fix is a read-first hint entry in read-first-hint.ts (Human-only); the five slips of this and pr-workflow-read-in-part span 10-19 to 10-24 with none since, and the two have different causes.
occurrences:
  - session: session_013zxzeRJEE2ehNrQTL62nhX
    date: "2026-11-06"
    severity: nit
    description: "Read pr-workflow.md only after review and gate had started, though CLAUDE.md asks for it before opening a PR."
    solution: "Read the PR doc before starting the review step."
