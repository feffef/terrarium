name: pr-workflow-unread-before-push
summary: >-
  Agents pushed a branch or opened a PR before reading the PR workflow doc.
cause: >-
  CLAUDE.md's "before you push a branch, or open ... a PR" trigger for docs/agents/pr-workflow.md has no hint (read-first-hint.ts covers only git conventions, GitHub and screenshots), so nothing points to it before a push or create_pull_request; a prototype/ branch that gets no PR feels exempt. Signals: a push or PR opened before pr-workflow.md is read.
surface: safe
status: open
notes: |-
  2026-10-28 design: dropped: the fix is a read-first hint entry in read-first-hint.ts (Human-only); the five slips of this and pr-workflow-read-in-part span 10-19 to 10-24 with none since, and the two have different causes.
occurrences:
  - session: session_01MwrXDH7XwMNUofgz3HvQ5N
    date: "2026-10-19"
    severity: minor
    description: "Pushed the prototype/ branch without reading docs/agents/pr-workflow.md, which CLAUDE.md requires before any push."
    solution: "Read pr-workflow.md before pushing any branch, even a prototype/ branch that gets no PR."
  - session: session_01E3XmTJcpKMZstW7MHL2eks
    date: "2026-10-23"
    severity: nit
    description: "Pushed the branch (inherited session-log commit only) at a Stop-hook nag before reading pr-workflow.md, which CLAUDE.md requires before any push."
    solution: "Read pr-workflow.md before answering the first Stop-hook push nag."
  - session: session_01FzJhmX3omaAFqoXjXWkcyK
    date: "2026-10-24"
    severity: minor
    description: "Merged a PR without first reading docs/agents/pr-workflow.md, which CLAUDE.md requires before merging; the Skill's step named merge-pr.ts directly."
    solution: "Point the dependabot-sweep Skill's merge step at pr-workflow.md, or have merge-pr.ts remind."
