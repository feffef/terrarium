name: clear-backlog-zero-grill-skip
summary: >-
  The backlog Skill did not say what to do when the grilling step had no questions for the owner.
cause: >-
  clear-backlog §2 always sent the push notification and ran the grilling, with no rule for a run whose grill results are empty. Signals: a notification or grilling step with nothing to ask.
