name: flaky-e2e-matcher-timeouts
summary: >-
  A browser test clicked a card while the page was still moving, so the click sometimes missed and unrelated changes failed until a re-run.
cause: "The Journal accordion e2e clicked a session card while the digest it had just opened was still expanding (160 ms), which moved the card below it under Playwright's click, so the click could miss the head and aria-expanded never flipped (not reproduced locally). A longer expect.poll timeout (10 s since PR #1919) can't help. Signal: an unrelated PR fails journal.spec.ts's accordion test or another click right after an open, and passes on re-run."
surface: safe
status: tracked
ref: "issue #2231 (regression of PR #1919)"
fixes:
  - pr: 1919
    date: "2026-10-14"
    summary: "Browser tests now wait up to 10 seconds instead of 1 second before failing."
