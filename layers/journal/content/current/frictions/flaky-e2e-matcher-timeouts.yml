name: flaky-e2e-matcher-timeouts
summary: >-
  Journal browser tests that open or collapse a session card fail at random, so unrelated changes fail once and pass on a retry.
cause: >-
  The Journal accordion e2e test (journal.spec.ts, the session-card head toggle) times out in gate:scoped or CI on diffs that do not touch it and passes on re-run; raising expect.poll's timeout to 10 s (PR #1919) did not stop it. The sibling-collapse layout check (a displacement measured before the digest body renders, PR #2565) flakes the same way. Signals: 'Journal accordion e2e', journal.spec.ts:393, 'displacement ... < 30px', 'sibling-collapse', a gate red on an unrelated Journal test that passes on rerun. Most likely (issue #2231; not reproduced, 120 throttled Chromium runs passed, commit 19077ebc): the test clicked a session card while the digest it had just opened was still expanding, so the card moved under the click.
surface: safe
status: open
fixes:
  - pr: 1919
    date: "2026-10-14"
    summary: "Browser tests now wait up to 10 seconds instead of 1 second before failing."
  - pr: 2458
    date: "2026-10-23"
    summary: "The Journal accordion e2e waits for the digest's scroll pin to settle before clicking a card."
  - pr: 2565
    date: "2026-10-26"
    summary: "The sibling-collapse e2e waits for the digest body to render before measuring."
occurrences:
  - session: session_01VfbgTTxASAKYdiziaLGuXM
    date: "2026-10-25"
    severity: nit
    description: "A build gate run failed once on an unrelated journal e2e layout check (displacement 16px < 30px) and passed on rerun."
    solution: "Track the journal layout test as a possible flake if it recurs."
  - session: session_013zxzePCZc7PkwLBo6YoDJt
    date: "2026-11-03"
    severity: nit
    description: "Own e2e test used a re-resolving first-unpressed locator and failed the first gate; the reviewer had also caught a once-a-year date flaw in it."
    solution: "Hold the clicked button by its label; reason about the day-0 case when a test asserts ?day=."
