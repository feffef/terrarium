name: flaky-e2e-matcher-timeouts
summary: >-
  Browser tests gave up after one second, so slow pages failed unrelated changes and passed on a retry.
cause: e2e specs assert with vitest's expect.poll, whose default timeout is 1000 ms (vitest.config.ts does not raise it), so slow hydration or a loaded gate fails an unrelated PR and passes on re-run.
surface: safe
status: tracked
ref: "issue #2231 (regression of PR #1919)"
fixes:
  - pr: 1919
    date: "2026-10-14"
    summary: "Browser tests now wait up to 10 seconds instead of 1 second before failing."
  - pr: 2258
    date: "2026-10-18"
    summary: "The smoke navigation test now fetches the exact payload URL the browser will request before clicking, so a cold first render no longer times it out (not the Journal accordion flake of #2231)."
