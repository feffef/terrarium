name: workflow-output-result-key
summary: >-
  Workflow results sat one level deeper than expected, so the first read found nothing.
cause: A saved Workflow's .output file nests the script's return value under a `result` key, so a first parse of explore/build output finds nothing; clear-backlog/SKILL.md does not say so.
surface: safe
status: open
ref: "run-summary.ts --verdicts takes one run at a time, so merging verdicts across runs is still by hand (left open in PR #2350; seen again in session 01MKHvrD)."
