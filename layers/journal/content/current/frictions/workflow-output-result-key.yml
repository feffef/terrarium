name: workflow-output-result-key
summary: >-
  Reading what a saved clear-backlog Workflow returned took hand-written parsing: at first the result sat one level deeper than expected, later the helper script lacked the view needed.
cause: "A saved Workflow's .output nests the script's return value under a `result` key and can run to about 90 KB. #2030 documented the key and run-summary.ts (#2350, #2589) prints triage, build and verdict views, but a view it lacks (a triage brief field, merging several runs into an authored log) sends the orchestrator back to ad-hoc node or YAML scripts. Signals: 'first parse found nothing', 'node -e parser', 'hand-written merge script', 'run-summary.ts could'."
surface: safe
status: open
fixes:
  - pr: 2030
    date: "2026-10-15"
    summary: "Backlog-clearing instructions now say saved workflow output nests the return value under a 'result' key."
  - pr: 2350
    date: "2026-10-20"
    summary: "Added run-summary.ts, which reads the return value under result from a saved workflow output (triage, build and verdict views)."
  - pr: 2589
    date: "2026-10-27"
    summary: "run-summary.ts --verdicts now merges the verdicts of several saved runs into one block."
occurrences:
  - session: session_014H5yqxJ4wuQfuCP7tqW7z5
    date: "2026-10-17"
    severity: nit
    description: "Workflow results are nested JSON in .output files, so reading them took a one-off node script each time."
    solution: "A small script that prints a clear-backlog run's results (outcome, question, decisions, judgement calls) from the .output file."
  - session: session_01BTtvaFQckiQwtGZsasWPJH
    date: "2026-10-19"
    severity: minor
    description: "Both clear-backlog workflows return 57-88 KB that the tool result truncates; I hand-wrote node -e parsers three times, for triage results, build statuses and the log's merged verdicts, and shell quoting broke one."
    solution: "A clear-backlog run-summary.ts with --triage, --build and --verdicts modes that the Skill names in sections 1, 3 and 4."
  - session: session_01MKHvrDA9VoqiKWSG6QjpE2
    date: "2026-10-20"
    severity: minor
    description: "Hand-parsed both workflow outputs (explore, build) with ad-hoc node -e scripts, the exact pain #2334 reports."
    solution: "#2334's run-summary.ts, being built in this run."
  - session: session_01W8fFNeEtqXbeuGRWKNU2Jd
    date: "2026-10-23"
    severity: minor
    description: "Tried four times to pull a triage brief out of the explore output and journal; grill results carry no brief field"
    solution: "Have run-summary.ts --triage print the brief field when one exists, and say when it is absent"
  - session: session_01VfbgTTxASAKYdiziaLGuXM
    date: "2026-10-25"
    severity: minor
    description: "Merging five runs of run-summary --verdicts into one ruleVerdicts/docsRead list took a hand-written script and two retries (duplicate YAML key, yes/no parsed as booleans)."
    solution: "run-summary.ts --verdicts could take several run outputs and emit one merged block per path."
  - session: session_01Cb8ETAZztznLYx6CC7MKyE
    date: "2026-10-26"
    severity: minor
    description: "Merging four workflow runs' run-summary --verdicts output into my own ruleVerdicts/docsRead took a hand-written YAML merge script in .throwaway."
    solution: "Give run-summary.ts a mode that merges --verdicts into an authored log YAML, keeping the orchestrator's own entries and appending subagent reasons."
