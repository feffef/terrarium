name: workflow-output-result-key
summary: >-
  Workflow results sat one level deeper than expected, so the first read found nothing.
cause: A saved Workflow's .output file nests the script's return value under a `result` key, so a first parse of explore/build output finds nothing; clear-backlog/SKILL.md does not say so.
surface: safe
status: open
fixes:
  - pr: 2030
    date: "2026-10-15"
    summary: "Backlog-clearing instructions now say saved workflow output nests the return value under a 'result' key."
  - pr: 2350
    date: "2026-10-20"
    summary: "Added run-summary.ts, which reads the return value under result from a saved workflow output (triage, build and verdict views)."
  - pr: 2589
    date: "2026-10-27"
    summary: "run-summary.ts --verdicts now merges the verdicts of several saved runs into one block."
