name: workflow-output-result-key
summary: >-
  Reading what a saved clear-backlog Workflow returned took hand-written parsing: at first the result sat one level deeper than expected, later the helper script lacked the view needed.
cause: "A saved Workflow's .output nests the script's return value under a `result` key and can run to about 90 KB. #2030 documented the key and run-summary.ts (#2350, #2589) prints triage, build and verdict views, but a view it lacks (a triage brief field, merging several runs into an authored log) sends the orchestrator back to ad-hoc node or YAML scripts. Signals: 'first parse found nothing', 'node -e parser', 'hand-written merge script', 'run-summary.ts could'."
surface: safe
status: open
fixes:
  - pr: 2030
    date: "2026-10-15"
    summary: "Backlog-clearing instructions now say saved workflow output nests the return value under a 'result' key."
  - pr: 2350
    date: "2026-10-20"
    summary: "Added run-summary.ts, which reads the return value under result from a saved workflow output (triage, build and verdict views)."
  - pr: 2589
    date: "2026-10-27"
    summary: "run-summary.ts --verdicts now merges the verdicts of several saved runs into one block."
occurrences:
  - session: session_01Cb8ETAZztznLYx6CC7MKyE
    date: "2026-10-26"
    severity: minor
    description: "Merging four workflow runs' run-summary --verdicts output into my own ruleVerdicts/docsRead took a hand-written YAML merge script in .throwaway."
    solution: "Give run-summary.ts a mode that merges --verdicts into an authored log YAML, keeping the orchestrator's own entries and appending subagent reasons."
