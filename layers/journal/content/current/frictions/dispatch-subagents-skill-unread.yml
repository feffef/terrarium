name: dispatch-subagents-skill-unread
summary: >-
  Agents dispatched subagents or a workflow without first reading the dispatch-subagents Skill.
cause: >-
  CLAUDE.md's dispatch-subagents trigger is prose with no hint (read-first-hint.ts covers only git, GitHub and screenshots), and agents read it as not covering read-only git or a saved workflow (clear-backlog-build, explore) that dispatches for them. Signals: "without reading the dispatch-subagents Skill", "read-only git diff", "the workflow does the dispatch".
surface: safe
status: accepted
ref: "issue #2580 closed not planned on 2026-10-27: the owner accepts the one-retry cost of the #2550 dispatch-read guard; saved workflows stay unexempted, since clear-backlog-build takes orchestrator-written briefs."
fixes:
  - pr: 2448
    date: "2026-10-23"
    summary: "CLAUDE.md's dispatch-subagents trigger now fires on writing a brief, not on every dispatch."
  - pr: 2484
    date: "2026-10-24"
    summary: "Added a read-first-hint entry that points to the dispatch-subagents Skill on the first Agent, Workflow or SendMessage call, silenced once the Skill is invoked."
  - pr: 2550
    date: "2026-10-25"
    summary: "A guard blocks the first subagent dispatch until the dispatch-subagents Skill is read."
