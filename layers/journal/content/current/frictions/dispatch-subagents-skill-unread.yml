name: dispatch-subagents-skill-unread
summary: >-
  Agents dispatched subagents or a workflow without first reading the dispatch-subagents Skill.
cause: >-
  Agents dispatch before reading the dispatch-subagents Skill, reading CLAUDE.md's trigger as not covering read-only git or a saved workflow (clear-backlog-build, explore) that dispatches for them, so a brief goes out without its rules; the #2484 hint fires only after the call. Since #2550 a guard refuses the dispatch instead; those refusals are dispatch-read-guard-deny. Signals: 'without reading the dispatch-subagents Skill', 'read-only git diff', 'the workflow does the dispatch', a hint after the dispatch.
surface: safe
status: open
fixes:
  - pr: 2448
    date: "2026-10-23"
    summary: "CLAUDE.md's dispatch-subagents trigger now fires on writing a brief, not on every dispatch."
  - pr: 2484
    date: "2026-10-24"
    summary: "Added a read-first-hint entry that points to the dispatch-subagents Skill on the first Agent, Workflow or SendMessage call, silenced once the Skill is invoked."
  - pr: 2550
    date: "2026-10-25"
    summary: "A guard blocks the first subagent dispatch until the dispatch-subagents Skill is read."
occurrences:
  - session: session_01GKJysgAiGN7bmdFJcKvFoC
    date: "2026-10-25"
    severity: minor
    description: "Read dispatch-subagents only after writing and sending the blind-read brief, though CLAUDE.md says to read it before writing any subagent brief."
    solution: "Read it with the other pre-git docs at the start of a Skill that dispatches subagents."
  - session: session_01BZNS3KuWTBxqAHxTfx3uzp
    date: "2026-10-25"
    severity: minor
    description: "Wrote three visitor briefs and the refiner brief without first reading the dispatch-subagents Skill that CLAUDE.md requires; a hook reminded me afterwards."
    solution: "Visitor-loop SKILL could point at dispatch-subagents next to the dispatch step."
  - session: session_01FDWjoePShpq7fov1iKn4GB
    date: "2026-10-25"
    severity: nit
    description: "Tried to Read docs/agents/dispatch-subagents.md, which does not exist; dispatch-subagents is a Skill."
    solution: "CLAUDE.md could say Skill, not doc, which it does; I misremembered it"
  - session: session_01VfbgTTxASAKYdiziaLGuXM
    date: "2026-10-25"
    severity: nit
    description: "Read the dispatch-subagents Skill only after the first Workflow call (CLAUDE.md trigger: before writing a subagent brief); the hint caught it, no harm."
    solution: "Owner chose a deny guard for this (#2543), being built in this run."
  - session: session_013zxzeR8CEiWCmTmvjhCZ1A
    date: "2026-11-03"
    severity: nit
    description: "Subagent briefs and the dispatch-subagents Skill were read after the first Agent call was already written in my head; I invoked the Skill just before dispatching, so no guard fired."
    solution: "None needed."
