name: shell-read-rules-hint-covered
surface: guard-or-hook
summary: Agents read files through the shell, but the rules hint loaded those files' rules anyway, so the only cost was a skipped convention or an unneeded rule reminder.
cause: "PR #1775's Bash rules hint (extended by #1946 and #2467) loads a governed file's rules after a cat, sed or head read, so a shell read costs nothing beyond a skipped Read tool, or a reminder for a file only inspected. Signals: 'loaded the rules anyway', 'hook injected rules anyway', 'no rule was missed', 'no harm', an irrelevant rule reminder after a shell read."
status: open
ref: "Comes from PR #1775, the fix for bash-reads-not-read-tool (rules never loading for a shell read)."
notes: |-
  2026-10-28 design: dropped: all 12 nits predate the 2026-10-16 cut of CLAUDE.md's Read-tool instruction (a6cdc3561); none since.
