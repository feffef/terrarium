name: read-first-hint-repeats-in-subagents
summary: >-
  The hint that points to a required doc fires again in subagents that were told to read nothing else, or had already read it.
cause: >-
  read-first-hint.ts (PostToolUse) points to git-conventions.md or github-integration.md on a matching call in every session, including dispatched subagents whose brief limits what they read, and repeats on each call even after the doc was read; since PR #2669 it no longer fires for read-only git show, ls-tree and cat-file, though log, blame and other git calls still hint. Signals: 'hint repeated on every call', 'hint to read git-conventions.md after a detached checkout', a subagent explaining why it ignored the hint, a subagent skipping the doc because its calls were read-only.
surface: guard-or-hook
status: open
ref: ""
fixes:
  - pr: 2550
    date: "2026-10-25"
    summary: "read-first-hint and bash-rules-hint now find workflow agents' nested transcripts, so they stop repeating on every call."
  - pr: 2669
    date: "2026-10-29"
    summary: "The git-conventions read-first hint now skips read-only git show, ls-tree and cat-file, and CLAUDE.md names the skipped subcommands."
occurrences:
  - session: session_013zxzeQ5JaiqQgggGaNSagD
    date: "2026-10-29"
    severity: nit
    description: "Subagents broke brief lines or hook-requested reads: the sonnet rater used cd with git, and several never read git-conventions.md after the hook asked, because their calls were read-only."
    solution: "The hook's wording could say read-only show, diff and ls-tree calls need no read, so agents stop reporting it as a miss."
  - session: session_013zxzeSkTLmRxa2PWgt3kPw
    date: "2026-11-02"
    severity: nit
    description: "Several subagents ran git log/show before reading docs/agents/git-conventions.md, which CLAUDE.md requires first"
    solution: "Name git-conventions.md in the rater, researcher and writer briefs' read-first lists"
