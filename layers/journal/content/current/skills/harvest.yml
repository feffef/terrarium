name: harvest
category: platform-operation
importance: specialist
gist: Turns recent sessions' ideas and learnings into proposals to green-light.
role: >-
  Reads the last week of session logs' ideas and learnings and files up to ten
  Seedlings: self-contained issues that wait for a Trusted user's green
  light, preferring Tenant, content and UI ideas and leaving Frictions to
  `frictions-to-fixes`. Files issues only; user-invoked
  (disable-model-invocation: true), alone or with a person.
