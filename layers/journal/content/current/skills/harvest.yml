name: harvest
category: platform-operation
importance: routine
gist: Turns recent sessions' ideas and learnings into proposals to green-light.
role: >-
  Reads the last week of session logs' ideas and learnings and files up to ten
  Seedlings: self-contained issues that wait for a Trusted user's green
  light, preferring Tenant, content and UI ideas and leaving Frictions to
  `frictions-to-fixes`. Files issues only; fired by a Routine, or invoked by a
  person (disable-model-invocation: true).
auditSummary:
  date: "2026-11-17"
  text: "Files well-formed Seedling issues from the logs on a schedule. It keeps stopping before its quota or cluster limit with no reason logged, leaving many learnings unchecked."
observations:
