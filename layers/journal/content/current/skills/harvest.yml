name: harvest
category: platform-operation
importance: routine
gist: Turns recent sessions' ideas and learnings into proposals to green-light.
role: >-
  Reads the last week of session logs' ideas and learnings and files up to ten
  Seedlings: self-contained issues that wait for a Trusted user's green
  light, preferring Tenant, content and UI ideas and leaving Frictions to
  `frictions-to-fixes`. Files issues only; fired by a Routine, or invoked by a
  person (disable-model-invocation: true).
watchFor:
  - "The session log gives the stop reason: Seedling quota filled, 30 clusters checked or an explicit budget."
  - "Every Seedling the run filed exists on GitHub with a well-formed body."
  - "Existing Seedlings were checked without reading the whole issue list into the run's own context."
  - "No new Seedling duplicates an open issue or one the owner closed as not planned."
auditSummary:
  date: "2026-11-28"
  text: "Turns recent ideas into well-formed, distinct proposals that wait for the owner. It stops early with a free-text reason on every recent run, short of its quota, and its list reading is costly."

