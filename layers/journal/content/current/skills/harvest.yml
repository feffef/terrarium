name: harvest
category: platform-operation
importance: specialist
gist: Turns recent sessions' ideas and learnings into proposals to green-light.
role: >-
  Reads the last week of session logs' ideas and learnings and files up to ten
  Seedlings: self-contained issues that wait for a Trusted user's green
  light, preferring Tenant, content and UI ideas and leaving Frictions to
  `frictions-to-fixes`. Files issues only; user-invoked
  (disable-model-invocation: true), alone or with a person.
auditSummary:
  date: "2026-11-16"
  text: "Files well-formed Seedling issues from the logs. It tends to stop checking clusters well before its quota or limit, leaving many learnings unchecked."
observations:
  - date: "2026-11-13"
    note: >-
      Coverage gap: new Skill, 5 uses in the window, no entry until now. Behaviour check, 5 runs delivered: Seedlings #3086, #3103, #3129 and #3178 were built and closed by merged PRs; #3172 and #3186 wait. Graded specialist: only this Skill files Seedlings (session_013zxzeS6gV5rfHembHQYP6K, session_013zxzeNrvAWHmAPYsSy8u7x), and no scheduled session runs it yet. Minor: 2 runs filtered script output against step 3 (self-caught).
  - date: "2026-11-14"
    note: >-
      Behaviour check, 6 runs delivered; Seedlings exist on GitHub. Repeat n=5 of 6, minor: git and GitHub read before git-conventions.md and github-integration.md; step 3 names neither. 9 of the fetched Seedlings were closed not planned (the share is unverified). Whole-list read costs 33k to 90k tokens in 3 runs. Grade unchanged.
  - date: "2026-11-15"
    note: >-
      Behaviour check, 7 runs delivered (Seedlings exist on GitHub). Repeat n>=7: git and GitHub docs read late; whole-list read costs 33k to 90k tokens. One scheduled run so far (session_013zxzeNxZVrKu9whNTs4pnR, 11-14); not enough to regrade to routine. Grade unchanged.
  - date: "2026-11-16"
    note: "Behaviour check, 8 runs; 14 Seedlings checked on GitHub exist. Silent failure (new, n=3): step 2 stops early on 11-13, 11-14, 11-15 (6, 8, 11 clusters; 4, 3, 6 filed; quota 10, limit 30), no friction logged. Late git/GitHub doc reads repeat. Idea: make check-clusters require a stopped reason. Not issued. Grade unchanged."
