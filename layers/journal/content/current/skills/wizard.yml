gist: Generates an interactive bash wizard for steps only a human can run.
role: >-
  The hand-off when an agent genuinely cannot do a step (a workflow-file edit,
  a credential, a third-party dashboard, a one-off cutover): instead of
  working around the restriction, it produces a script the human runs, and the
  agent does every surrounding step. Essential when a guard rightly blocks an
  agent action.
