name: auto-triage
category: platform-operation
importance: specialist
gist: Sorts the open-issue backlog automatically, without a human.
role: >-
  The unattended, batch sibling of `triage`: one brave sweep over issues needing
  attention, applying triage's per-issue rules and stamping `ready-for-agent`
  under ADR-0022 (a Trusted user starting the run is the approval).
  User-invoked, by hand or on an interval, to keep the Trusted-authored backlog
  moving. Escalates judgment calls and design uncertainty to a human.
auditSummary:
  date: "2026-10-18"
  text: >-
    Works well: its closures and escalations matched what the Skill promised, and early routing mistakes were fixed within days.
observations:
  - date: "2026-10-18"
    note: >-
      Self-check (audit-skills behaviour check): all 4 usedIn sessions
      re-verified, 16 issues/claims checked directly against live GitHub
      state across them; every label/closure/escalation matched what the
      Skill promised when each session ran, none later reverted. #1786's
      full lifecycle traced end to end (re-opened/re-escalated twice,
      finally closed by owner decision via PR #2160) as a good example of
      the judgment-call machinery working, not a failure. One minor,
      non-blocking note, not escalated: session_01CasnQoauTyLNUxd74agJsP's
      log `summary` says "#1770 stays open" but GitHub shows that same
      session closed it ~4 minutes after its logged `endedAt` with a
      reasoned comment - a stale summary sentence, not a mislabeling (the
      actual triage action was correct). No reverts in the 2-week sweep. No
      new silent failure. Grade/role unchanged.
