name: auto-triage
category: platform-operation
importance: specialist
gist: Sorts the open-issue backlog automatically, without a human.
role: >-
  The unattended, batch sibling of `triage`: one brave sweep over issues needing
  attention, applying triage's per-issue rules and stamping `ready-for-agent`
  under ADR-0022 (a Trusted user starting the run is the approval).
  User-invoked, by hand or on an interval, to keep the Trusted-authored backlog
  moving. Escalates judgment calls and design uncertainty to a human.
auditSummary:
  date: "2026-10-18"
  text: >-
    Works well: its closures and escalations matched what the Skill promised, and early routing mistakes were fixed within days.
observations: []
