    note: "Behaviour check of 41 runs dated 11-18 to 11-21 and two non-users, using a script that parsed every log. SKILL.md last changed 64abedad (11-15), before every run; dddedf89 (PR #3531, merged 2026-11-20T19:09:41Z) changed only scripts/session/log-session.ts and rule-use.ts, so refusing unrated rule loads applies to runs that started after it (session_013zxzePzEySsawKSfNrCBtk, session_013zxzeSSEyKMAcAZESc5L4b, session_013zxzeSTzsjoZsvRrpTME5a). All 41 logs parse with goal, outcome, summary, frictions and ruleUse and are on main at schemaVersion 1. PR delivery: 76 distinct PR numbers are claimed; 73 appear in origin/main commit subjects and the other three are honest (#3475 closed by the owner, #3530 closed unmerged, #3538 open and logged in-review). PR content was not compared with diffs. No revert; the only recent landing is the intended guard (7e1fdb01, 2e0ec25f, dddedf89). Known repeat, six of 41 logs leave loaded rules unrated while answered is true: five already named (session_013zxzePp6Xf4HuGyQNDdBpB 8 of 14, session_013zxzeQuz1peCEYugreTtXU 7 of 13, session_013zxzePBxPjfMQRm8C4FwqZ 2 of 28, session_013zxzeNYPwVfq4WoT28Nfuu 20 of 25, session_013zxzeQbSZQ554vFZiT2f2D 6 of 20) and new session_013zxzeTKSiBSmkCLfn4BYL6 (2 of 21: adr-0021 and glossary-terms), which built the guard itself and started 50 minutes before it merged, so it probably wrote its log under the old code (unverified); its friction list has no entry about the rules. The three runs that started after the guard have the main agent at 0 unrated, a first clean stretch at n=3 with the guard the likely cause (unverified). The gap has moved to subagent entries, which the guard does not refuse: session_013zxzeSTzsjoZsvRrpTME5a has subagents unrated 2 of 9, 5 of 11 and 4 of 9, and session_013zxzeSSEyKMAcAZESc5L4b has two entries with answered false; PR #3538 (open) targets the echo call. Non-users session_013zxzeNkrnZpMkYb9UUBh2t and session_013zxzeQsCq5g9jeQpmsULPZ are visitor-loop runs that used close-session and log-session, so not missed. Role and gist were not rechecked. Idea: extend the refusal in scripts/session/rule-use.ts so answered is true only when loads minus reported paths is empty for every by, not just main. Grade unchanged (essential)."
  - date: "2026-11-22"
    note: "Behaviour check of 39 runs (11-19 to 11-22) plus 3 non-users, scripted over all logs. SKILL.md was last changed by 64abedad, before every run. Delivery: all 39 logs parse and are status completed; they claim 65 distinct PRs, 64 appear in origin/main subjects and the other, #3530, is the known closed-unmerged one; #3538, in review last time, is now on main (15a4bc709); no revert (the only recent log-session landings are the intended guard, 7e1fdb012, 2e0ec25f6 and dddedf899); PR content was not compared with diffs; the newest run's #3573 (merge ec556f12f) matches its log. Rule-use gap, known: main-agent loads minus reported were unrated in 3 of 39 logs, all started before the guard (dddedf899, 11-20T19:09Z): session_013zxzePp6Xf4HuGyQNDdBpB 8 of 14, session_013zxzeQuz1peCEYugreTtXU 7 of 13, session_013zxzeTKSiBSmkCLfn4BYL6 2 of 21; 0 unrated in all 16 runs started at or after the guard (the guard is the likely cause, unverified); no main entry answered false. The gap now sits in subagent entries, which the guard does not refuse: 13 of the 14 post-guard runs that had subagents left at least one entry with loaded rules unrated (worst: session_013zxzeSd7Ki1925oLx6Voj4's general-purpose3 at 7 of 7, session_013zxzeT3ZUhBeG84jQUD1Hw's workflow-subagent44 at 15 of 19 and workflow-subagent41 at 4 of 4, the last answered false). The newest run rated tenant-glossary missed and also logged it as a friction, so self-reporting is consistent. Non-users: two visitor-loop runs used close-session; session_013zxzeStkfKoZxBQUkQd9pd (Tinkerfund visit) was ruled out on goal and its log not opened. Role and gist current. Idea: extend the refusal in rule-use.ts to every by entry, so answered is true only when each agent's loads minus reported paths is empty or one explicit none-applies entry exists; the earlier issue #3508 (closed) fixed main only. Limits: PR content was matched to logs by number and merge commit, not by diff, and the non-user visit log was not opened, so a miss