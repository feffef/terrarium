name: log-session
category: platform-operation
importance: essential
role: >-
  The Platform's first platform-operation Skill, and the source of its primary
  self-improvement signal: every session's honest self-report — goal, outcome,
  and above all its frictions — appended to this Journal. You author only that
  interpretive half; a committed hook derives the rest and lands the merged log
  direct to `main` (the bounded ADR-0009 exception), live and normally well
  before session teardown, for the self-improvement Skills to mine.
  Normally invoked *by* `close-session` (the closure front door), which authors
  the log as one step of its closing sequence; callable directly only to amend an
  already-written log.
observations:
  - date: 2026-09-09
    note: >-
      Suggestive-not-confirmed regression watch: log-session's most recent
      SKILL.md-linked edit (253f5745, "merge session-end.ts into the
      log-session lander", 2026-09-05) touches exactly the machinery that
      derives the docsReadViaShell trace field. The first post-edit session
      to log a related friction, session_016ahWmRcpKL7NJpcrtA8zPy (2026-09-05),
      reported a moderate friction: "SHELL-READ-DETECTION: docsReadViaShell
      listed docs/agents/environment-caveats.md as read via shell this
      session. No Bash/Grep/Read call this session named that path at all
      (checked the full tool-call history) — this looks like a false
      positive, direction: listed-but-never-read." Single occurrence so far,
      not the "≥2 sessions" pattern step 4 asks for before treating it as
      confirmed — recorded here so a future run's Phase A screen has it if a
      second instance turns up.
  - date: 2026-09-10
    note: >-
      Confirmed regression watch, filed as issue #1206. Four more
      SHELL-READ-DETECTION frictions turned up since the 2026-09-09 note above
      (session_01EQQRCf2wcFwvTjRWs7tvL2, 2026-09-01, archived — predates the
      2026-09-05 log-session edit, so this is a pre-existing, unfixed bug, not
      a fresh regression from that edit; session_01DAJKXQEzuASCBWZgjqh5h6 and
      session_01MCTb9XRPHbF549LQ199QzQ, both 2026-09-08/09, both describing
      shell-command-shaped text from a dispatched subagent's own report prose
      apparently being credited as this session's own shell read;
      session_01Lk7T884197VeKnMEB8NXhW, 2026-09-09, the opposite miss — a
      `git show <ref>:<path> | grep` pipeline not recognized as a reader
      shape). All five are `moderate` severity. Grade/role unchanged — this is
      a mechanism bug in the derived trace (`scripts/shell-reads.ts` /
      `session-trace.ts`), not a Skill-doc issue this Skill's grade should
      move on.
  - date: 2026-09-13
    note: >-
      A sixth instance, found opportunistically while deep-reading
      session_01DykmgE9WhzKVCTdbuUfuxx (2026-09-12) for an unrelated
      dispatch-subagents regression screen: a moderate SHELL-READ-DETECTION
      friction reports docs/agents/guards.md wrongly credited as
      docsReadViaShell — the only shell commands naming that path were
      `git merge --ff-only origin/main` and `git stash pop`, whose output
      listed it only as a changed filename, never its content. This is a new
      false-positive shape not yet covered by issue #1206's fix (#1209, the
      `git show` miss) or its false-positive investigation (which confirmed
      subagent-shell-read folding is working as designed) — a git
      merge/stash file-list line is being treated as content-revealing the
      same way a bare `cat`/`grep` path is. Added as a comment on #1206
      rather than a new issue, per that thread's own "recurring problem is
      evidence it's real" framing. Grade/role unchanged.
