    note: "Behaviour check of 35 run logs (11-21 to 11-23) plus three non-users, all parsed by script from origin/main. No watchFor items. SKILL.md last changed in 750d8edc (wording only) and the guard landed in dddedf899 (11-20, scripts only); all 35 runs started after the guard, so one contract applies. Role and gist current. Delivery: all 35 logs exist and are completed with kind, goal, outcome, summary, frictions and ruleUse; frictions recorded in 34 (session_013zxzeSXn685ayFTrDqxrqK has none; session_013zxzeT3ZUhBeG84jQUD1Hw has 23 with four moderate or worse); 63 distinct PR numbers claimed, all 63 present as #N in git log origin/main; #3608, logged in-review by session_013zxzeSxk2Nq3K4cxLysUN2, is now merged; no revert; two commits for session_013zxzeRQQomSvhPo9RWTEkC (4cf6b9e8e and 6dc0f440b) are a re-log, which the Skill allows. PR contents were matched by number, not diffed. Verified finding (silent failure, repeat after closed #3508, escalated as issue #3633): the main agent left no loaded rule unrated in any of the 35 logs, but subagent entries have loads minus reported non-empty with answered: true in 31 of 35 (worst session_013zxzeT6Ss7hjULbaTx2PS2 with 16 of 20 in one entry); only four logs are clean. New verified hole: session_013zxzeStkfKoZxBQUkQd9pd (visitor-loop, 11-21, no close-session or log-session in skillsUsed) landed via landedBy: Stop with the main entry answered: true, reported: [] and many loads, which I confirmed in its log (lines 55 to 97), so the refusal in log-session.ts seems not to apply on the Stop path; the cause (the check running only with --author context) is unverified, and the agent did not run the script. The other two visitor-loop non-users used close-session and are not missed invocations. Newest run session_013zxzeSMNGy8G5ktwppozy2 is fully clean. Grade unchanged (essential). The 11-23 auditSummary still describes the picture correctly, with the extra Stop-path gap added. Idea, kept: extend the refusal to every by entry (answered true only when each agent's loads minus reported is empty or one none-applies entry exists) and make the landing path refuse or mark answered false when a scratch lacks ratings. Evidence: 31 of 35 logs and the 15-of-15-unrated log. Limits: the agent did not read each log's friction text individually and did not redo the who-prompted keyword check; the closure-completeness signals for this window are covered in the close-session note."
