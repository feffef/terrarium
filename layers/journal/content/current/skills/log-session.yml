  - date: "2026-11-20"
    note: "Behaviour check over 43 logs (41 runs, 2 non-users), parsed by script; the current SKILL.md applies to all because its last landings (64abedad, 2d09f311) predate the runs. All 41 logs are on main with schemaVersion 1 and goal, outcome, summary, frictions and ruleUse; the top-level reported field is absent by design (folded into ruleUse). Of 78 distinct PR numbers claimed, 76 appear in git log origin/main; the other two are #3475 (closed by the owner) and #3504 (open and unmerged per REST, honestly logged in-review). PR content was checked against the log only for #3504 and the digest run. No revert of delivered work. Known repeat with the cause now verified: loaded rules left unrated while answered: true in 7 of 41 logs (the 11-19 note counted 11); scripts/session/transcript-trace.ts:931 sets answered: !!s.reportedNamed so any reported list counts as answered, and rule-use-report.ts:72 skips only logs with answered false. The logs are session_013zxzePp6Xf4HuGyQNDdBpB (8 of 14 unrated), session_013zxzeQuz1peCEYugreTtXU (7 of 13), session_013zxzePBxPjfMQRm8C4FwqZ (2 of 28), session_013zxzeNYPwVfq4WoT28Nfuu (20 of 25), session_013zxzeQbSZQ554vFZiT2f2D (6 of 20), session_013zxzeR4N3chSHqH7Po2sjW (14 of 23) and session_013zxzeSpYABZ15tUzNbPJN9 (1 of 17); none logged a friction about it (only friction counts checked). Escalated as #3508. Self-reporting works elsewhere: session_013zxzePp6Xf4HuGyQNDdBpB marked tenant-glossary missed: late. Non-users ruled out: the two visitor-loop sessions session_013zxzeNkrnZpMkYb9UUBh2t and session_013zxzeQsCq5g9jeQpmsULPZ ran log-session through close-session and their logs are on main. Idea: at transcript-trace.ts:931 set answered true only when every load of that agent has a reported entry or one explicit none-applies entry, so the 7 logs show as unanswered and drop out of the rule-use report. Grade unchanged: essential. Limits: the audit counted frictions per log but did not read every friction text, so \"no friction about it\" is a count, not a reading; PR content was compared with log summaries only for #3504 and the digest run; the 7 of 41 figure uses loads minus reported paths for the main agent only, not subagents."
