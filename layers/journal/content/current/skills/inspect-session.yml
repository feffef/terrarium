name: inspect-session
category: platform-operation
importance: specialist
gist: Answers what another Claude session did, read or failed, at the lowest cost to the asking session's own context.
role: >-
  The model-facing front door for reading another session's events
  (`list_events`/`get_event`): answers from the session's log and cheap reads
  first, then dispatches a subagent to search the raw events so they never
  enter the asking session's context. Essential whenever a session must
  inspect a sibling's history, rare otherwise.
