name: guest-intake
category: platform-operation
importance: specialist
gist: Interviews a visitor to turn their idea into a buildable spec.
role: >-
  The intake half of the guest-demo pipeline (ADR-0023): runs a bounded, GitHub-
  comment requirements-refinement session with each guest, borrowing `grilling`
  and `domain-modeling`'s voice, then hands off to `guest-build` via `ready-for-
  agent`. Essential while the pipeline runs, but that is only in the owner's
  bounded demo windows, so it is rarely used.
