name: close-session
category: platform-operation
importance: essential
gist: Wraps up a session and writes its honest closing diary entry.
role: >-
  The model-facing front door for Session closure: checks the session against
  CLAUDE.md and the always-loaded rules (already in context), logs a Friction
  for each rule broken and writes the session log via `log-session`. It makes
  the self-judged "invoke at closure" rule fire reliably; its invocation rate is the evidence for ADR-0009's choice
  of a Skill over a reminder hook.
auditSummary:
  date: "2026-11-22"
  text: "Every recent session closed with a committed log, shortly after its last merge, and none needed a human nudge. Whether it really looks back at its work cannot be told from the logs."
