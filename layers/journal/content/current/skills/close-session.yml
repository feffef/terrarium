  - date: "2026-11-20"
    note: "Behaviour check over all 43 logs in the window (scripted extraction of status, kind, skillsUsed, prs, endedAt, then git log origin/main --grep per session). SKILL.md has not changed in 14 days, so every run is graded against the file on disk. 42 logs are completed and each has at least one journal(sessions) commit on main (1 to 17 commits per session); one, session_013zxzePUNdDXiqJrj8m6Bjs, is honestly in-review with PR #3504 awaiting a human merge (no merge on origin/main). Merge time against log endedAt fits on five PRs: #3506 merged 00:26:16 and its log ended 00:26:33 on 11-20, #3497 13:20:58 against 13:21:17, #3490 07:13:46 against 07:14:14, and #3503 and #3505 (00:03:41, 00:02:12) against the final log at 00:05:01. Frictions per log range from 1 to 25 and none has zero; step 1 is evidenced by session_013zxzePp6Xf4HuGyQNDdBpB (\"Ran git fetch and git mv before reading git-conventions.md\") and session_013zxzePUNdDXiqJrj8m6Bjs (relabelled issues without reading issue-tracker.md). No log contains a human-prompted closure; the scorecard's humanPromptedClosures, manuallyRescuedClosures and orphanedSessions are all empty and orphanScan scanned true (192 merged PRs, 100 issues, 291 logs with a session). Missed invocations: none; session_013zxzeQpVcWQaKyrR36MwpN (visitor-loop, 11-13) never invoked close-session but ran log-session and has three journal commits (7745b7705, dc9b280ff, 976db64e2), and visitor-loop owns its closure step (80d326f03). Known repeat: session_013zxzeNkrnZpMkYb9UUBh2t (visitor-loop 11-17) lists close-session without log-session in skillsUsed, the known accounting gap. Could not tell: step 2's look-back, which no log field records (all 43 runs). No revert of any delivered work. Idea: require a [lookback] prefix on Frictions that step 2 logs, so a completed log with none can be audited mechanically. Grade unchanged: essential, no regrade evidence. Limits: the audit sampled merge times on five PRs, not all, and could not see the transcript-level order of events; completeness of logging rests on the journal commits and the scorecard signals, which were all clear. The audit subagent reported the look-back gap as already noted in earlier observations; that was not re-read here."
  - date: "2026-11-21"
    note: "Behaviour check of 43 logs dated 11-18 to 11-21 (session_013zxzeQxKAZzjCV61mM31sR through session_013zxzeSTzsjoZsvRrpTME5a). SKILL.md did not change in the window. The subagent extracted status, kind, prs, skillsUsed, friction counts and git commit counts per log with a script, read two logs in full and spot-read the rest by field; it did not read all 43 in full. 42 logs are completed and one is in-review: session_013zxzePzEySsawKSfNrCBtk has PR #3538 open, which touches scripts/hooks and needs a human merge, so that status is honest. session_013zxzePUNdDXiqJrj8m6Bjs was in-review in the last audit and is now completed with #3504 merged (7e3bfc17c), so the re-closure worked. Every log has at least one journal commit on main and at least one friction; HUMAN-PROMPTED-CLOSURE appears in none. Merge-to-log timing fits on five sampled PRs: #3540 merged 00:26:52Z against a log end of 00:27:11Z, #3537 21:22:19Z against 21:23:01Z, #3539 23:12:44Z against 23:13:13Z, #3509 01:03:10Z against 01:04:04Z, #3523 16:51:21Z against 16:51:39Z. Six autonomous PR-less runs (harvest and visitor-loop) logged once each. No revert of delivered work; the four reverts in the window are unrelated. Step 3 of this audit: orphanScan scanned true (170 merged pull requests, 90 issues, 259 sessions with an id), orphanedSessions, orphanSuppressionLog, humanPromptedClosures and manuallyRescuedClosures are all empty, so closure completeness is clean. Known repeat: step 2's look-back cannot be checked from the logs in 43 of 43 runs, as in every earlier note back to 11-16. Accounting nit, unverified: session_013zxzeRypyCMruPYBQnRskt lists close-session before code-review in skillsUsed. Role and gist were not rechecked (no SKILL.md change). Idea: have look-back frictions start with a [lookback] prefix, or add an optional lookback field to the log schema, so a completed log with no look-back evidence can be flagged by the scorecard. Limits of this check: the per-field extraction cannot show whether each log's summary matches the session's real events, and the five-PR timing sample is not exhaustive. Grade unchanged (essential)."
  - date: "2026-11-22"
    note: "Behaviour check of 43 runs (11-19 to 11-22) plus one non-user. SKILL.md is unchanged, so runs were graded against the file on disk. The auditing agent extracted every log by script and read in full only the 11-22 digest run, RggWMbZ2Dumotgw, StkfKoZxBQUkQd9pd and the heads of QLrT, PzEyS and QAV89; the rest were read at summary, outcome and frictions level (partial, unverified for the remainder). Delivery verified: all 43 logs are status completed, each with 1 to 26 journal(sessions) commits on origin/main; HUMAN-PROMPTED-CLOSURE appears in 0 of 43; for every log with PRs the log ends 14 to 63 s after its last merge (T3Z about 150 s); PzEySsawKSfNrCBtk, in review in the last audit, is now completed with #3538 merged (15a4bc709), so re-closure worked. No revert. My own step 3 signals this run: orphanScan scanned (169 merged PRs, 90 issues), orphanedSessions, orphanSuppressionLog, humanPromptedClosures and manuallyRescuedClosures all empty. The non-user StkfKoZxBQUkQd9pd (visitor-loop, Tinkerfund) is not a missed invocation: its docsRead holds the log-session SKILL.md and the log is committed (a4fd3f607); the Skill is simply absent from skillsUsed (known accounting gap, one more repeat). New findings. The rule 'never filter log-session.ts output' was broken in 3 of 43 runs by their own account (PBiGUC5Th, PVqgGH7hb, RypyCMruP; piped through head or sed), with no hidden refusal; a floor, since only self-reported cases show. First zero-friction log: RggWMbZ2Dumotgw (105 s scheduled prune-trial), so nothing in a log separates 'looked back, found nothing' from 'skipped'. Data nit: QLrTRb5hCDjSRuQHb lists #3543 (an issue) and TKSiBSmkCLfn4BYL6 lists #3530 (left unmerged) under prs; status completed is honest in both. Known repeat: step 2's look-back cannot be checked from logs (43 of 43). Role and gist not rechecked. Idea: have a hook warn on log-session.ts piped to head, grep, sed or tail, so the 'never filter' sentence can be cut per ADR-0027. Grade unchanged (essential)."
