  - date: "2026-11-20"
    note: "Behaviour check over all 43 logs in the window (scripted extraction of status, kind, skillsUsed, prs, endedAt, then git log origin/main --grep per session). SKILL.md has not changed in 14 days, so every run is graded against the file on disk. 42 logs are completed and each has at least one journal(sessions) commit on main (1 to 17 commits per session); one, session_013zxzePUNdDXiqJrj8m6Bjs, is honestly in-review with PR #3504 awaiting a human merge (no merge on origin/main). Merge time against log endedAt fits on five PRs: #3506 merged 00:26:16 and its log ended 00:26:33 on 11-20, #3497 13:20:58 against 13:21:17, #3490 07:13:46 against 07:14:14, and #3503 and #3505 (00:03:41, 00:02:12) against the final log at 00:05:01. Frictions per log range from 1 to 25 and none has zero; step 1 is evidenced by session_013zxzePp6Xf4HuGyQNDdBpB (\"Ran git fetch and git mv before reading git-conventions.md\") and session_013zxzePUNdDXiqJrj8m6Bjs (relabelled issues without reading issue-tracker.md). No log contains a human-prompted closure; the scorecard's humanPromptedClosures, manuallyRescuedClosures and orphanedSessions are all empty and orphanScan scanned true (192 merged PRs, 100 issues, 291 logs with a session). Missed invocations: none; session_013zxzeQpVcWQaKyrR36MwpN (visitor-loop, 11-13) never invoked close-session but ran log-session and has three journal commits (7745b7705, dc9b280ff, 976db64e2), and visitor-loop owns its closure step (80d326f03). Known repeat: session_013zxzeNkrnZpMkYb9UUBh2t (visitor-loop 11-17) lists close-session without log-session in skillsUsed, the known accounting gap. Could not tell: step 2's look-back, which no log field records (all 43 runs). No revert of any delivered work. Idea: require a [lookback] prefix on Frictions that step 2 logs, so a completed log with none can be audited mechanically. Grade unchanged: essential, no regrade evidence. Limits: the audit sampled merge times on five PRs, not all, and could not see the transcript-level order of events; completeness of logging rests on the journal commits and the scorecard signals, which were all clear. The audit subagent reported the look-back gap as already noted in earlier observations; that was not re-read here."
  - date: "2026-11-21"
    note: "Behaviour check of 43 logs dated 11-18 to 11-21 (session_013zxzeQxKAZzjCV61mM31sR through session_013zxzeSTzsjoZsvRrpTME5a). SKILL.md did not change in the window. The subagent extracted status, kind, prs, skillsUsed, friction counts and git commit counts per log with a script, read two logs in full and spot-read the rest by field; it did not read all 43 in full. 42 logs are completed and one is in-review: session_013zxzePzEySsawKSfNrCBtk has PR #3538 open, which touches scripts/hooks and needs a human merge, so that status is honest. session_013zxzePUNdDXiqJrj8m6Bjs was in-review in the last audit and is now completed with #3504 merged (7e3bfc17c), so the re-closure worked. Every log has at least one journal commit on main and at least one friction; HUMAN-PROMPTED-CLOSURE appears in none. Merge-to-log timing fits on five sampled PRs: #3540 merged 00:26:52Z against a log end of 00:27:11Z, #3537 21:22:19Z against 21:23:01Z, #3539 23:12:44Z against 23:13:13Z, #3509 01:03:10Z against 01:04:04Z, #3523 16:51:21Z against 16:51:39Z. Six autonomous PR-less runs (harvest and visitor-loop) logged once each. No revert of delivered work; the four reverts in the window are unrelated. Step 3 of this audit: orphanScan scanned true (170 merged pull requests, 90 issues, 259 sessions with an id), orphanedSessions, orphanSuppressionLog, humanPromptedClosures and manuallyRescuedClosures are all empty, so closure completeness is clean. Known repeat: step 2's look-back cannot be checked from the logs in 43 of 43 runs, as in every earlier note back to 11-16. Accounting nit, unverified: session_013zxzeRypyCMruPYBQnRskt lists close-session before code-review in skillsUsed. Role and gist were not rechecked (no SKILL.md change). Idea: have look-back frictions start with a [lookback] prefix, or add an optional lookback field to the log schema, so a completed log with no look-back evidence can be flagged by the scorecard. Limits of this check: the per-field extraction cannot show whether each log's summary matches the session's real events, and the five-PR timing sample is not exhaustive. Grade unchanged (essential)."
  - date: "2026-11-22"
    note: "Behaviour check of 43 runs (11-19 to 11-22) plus one non-user. SKILL.md is unchanged, so runs were graded against the file on disk. The auditing agent extracted every log by script and read in full only the 11-22 digest run, RggWMbZ2Dumotgw, StkfKoZxBQUkQd9pd and the heads of QLrT, PzEyS and QAV89; the rest were read at summary, outcome and frictions level (partial, unverified for the remainder). Delivery verified: all 43 logs are status completed, each with 1 to 26 journal(sessions) commits on origin/main; HUMAN-PROMPTED-CLOSURE appears in 0 of 43; for every log with PRs the log ends 14 to 63 s after its last merge (T3Z about 150 s); PzEySsawKSfNrCBtk, in review in the last audit, is now completed with #3538 merged (15a4bc709), so re-closure worked. No revert. My own step 3 signals this run: orphanScan scanned (169 merged PRs, 90 issues), orphanedSessions, orphanSuppressionLog, humanPromptedClosures and manuallyRescuedClosures all empty. The non-user StkfKoZxBQUkQd9pd (visitor-loop, Tinkerfund) is not a missed invocation: its docsRead holds the log-session SKILL.md and the log is committed (a4fd3f607); the Skill is simply absent from skillsUsed (known accounting gap, one more repeat). New findings. The rule 'never filter log-session.ts output' was broken in 3 of 43 runs by their own account (PBiGUC5Th, PVqgGH7hb, RypyCMruP; piped through head or sed), with no hidden refusal; a floor, since only self-reported cases show. First zero-friction log: RggWMbZ2Dumotgw (105 s scheduled prune-trial), so nothing in a log separates 'looked back, found nothing' from 'skipped'. Data nit: QLrTRb5hCDjSRuQHb lists #3543 (an issue) and TKSiBSmkCLfn4BYL6 lists #3530 (left unmerged) under prs; status completed is honest in both. Known repeat: step 2's look-back cannot be checked from logs (43 of 43). Role and gist not rechecked. Idea: have a hook warn on log-session.ts piped to head, grep, sed or tail, so the 'never filter' sentence can be cut per ADR-0027. Grade unchanged (essential)."
  - date: "2026-11-23"
    note: "Behaviour check over 40 runs (11-20 to 11-23, from session_013zxzeQEGaun1DYXBUuVEmu to session_013zxzePAekyp1bgbnenrGfK) plus one non-user, session_013zxzeStkfKoZxBQUkQd9pd. The subagent extracted status, prs, skillsUsed, friction counts and git commit counts for every log by script and read only the newest few in full; the rest were grepped, so that part is partial and unverified. SKILL.md changed once, in 7a0f512c0 (11-22 04:11Z, inside merge 750d8edc0): it removed the \"never filter log-session.ts output\" sentence and capitalised Session closure; runs before that are graded on the old text. Delivery: all 40 logs exist, 39 are completed with 1 to 26 journal commits each on origin/main, and none carries a human-prompted closure marker. session_013zxzeSxk2Nq3K4cxLysUN2 is in-review with PR #3608, which the REST API shows open and unmerged, so the log is honest. Merge to log-end timing fits on six PRs (gaps of 15 to 69 seconds, e.g. #3609 merged 00:25:58Z, log ended 00:26:15Z). No revert or rewrite: the two-week searches for the Skill's name show only SKILL.md edits and other Skills mentioning it. Closure completeness (step 3 of the audit): orphanScan scanned true (170 merged PRs, 98 issues, 267 with a session), orphanedSessions is empty, the suppression log is empty, and no human-prompted or manually rescued closures were listed, so every closure signal is cleared. The non-user is a visitor-loop run whose log is completed and committed (a4fd3f607) and whose docsRead includes the log-session SKILL.md, so it is ruled out; it is missing from skillsUsed, the known accounting gap. Known repeats: step 2's look-back cannot be checked from any log (40 of 40); the removed filter rule was broken by two runs by their own account (session_013zxzePVqgGH7hbNFvSCqQR, and one on 11-19), now moot; two zero-friction logs (session_013zxzeRgg77WMbZ2Dumotgw and session_013zxzeSXn685ayFTrDqxrqK) look the same as a skipped look-back; session_013zxzeQQP2yCoP7hw7GD1Gx logged that the Stop hook demanded closure after the first merge while a ledger PR was gating, and it re-invoked correctly. Role and gist are current. Idea, dropped: a lookback field in the session-log schema adds a schema field and a step, against ADR-0009's slow growth; the look-back is a judgement step and a missing record of it is not damage. Grade unchanged (essential)."
  - date: "2026-11-24"
    note: "Behaviour check of 37 run logs (session_013zxzeSMNGy8G5ktwppozy2 through session_013zxzeQLrTRb5hCDjSRuQHb, 11-21 to 11-24) plus one non-user, session_013zxzeStkfKoZxBQUkQd9pd (visitor-loop; ruled out, its log landed with one commit via the Stop hook). The auditing agent extracted status, kind, prs, skillsUsed and friction counts by script and ran git log origin/main with the session id per log; it read in full only the newest log and the SKILL.md, so the rest is partial. SKILL.md changed once (750d8edc0, 11-22, wording only); three runs began before it. All 38 logs exist with status completed and one to 22 journal commits on main. HUMAN-PROMPTED was 0 in all 38 (grep). Timing fits on two of three spot-checked PRs (#3631 merged 00:05:38Z with the log ending 00:06:11Z; #3623 merged 15:52:46Z with the log ending 15:53:26Z); the third (#3608, session_013zxzeSxk2Nq3K4cxLysUN2) was not timed, but its merge commit a6a768495 is on main and its log moved from in-review to completed, so the re-close worked. No revert. Closure scorecard of this run: orphanScan scanned true (167 merged PRs, 89 issues, 255 with a session); orphanSuppressionLog empty; humanPromptedClosures and manuallyRescuedClosures empty; one orphaned session, session_013zxzePy1ZjrPSpQ5fDkVkz, which filed Seedling issues #3624 to #3627 on 11-23 at 17:10Z (verified: #3624's body line one carries its id and it harvested from session_013zxzePNKjPWkVNAkzZbSVC ideas) and has no log anywhere in the Journal (grep of layers and origin/main). Its work landed and was closed by the next clear-backlog run, so there was no damage, but it is the first orphan in several windows; not escalated because one session with no damage is below the bar, and a later audit should look for a repeat. Known repeats: the step 2 look-back cannot be checked in any log (37 of 37); skill accounting gap where session_013zxzePNKjPWkVNAkzZbSVC lists close-session without log-session although it logged; zero-friction logs (session_013zxzeRgg77WMbZ2Dumotgw prune-trial, session_013zxzeSXn685ayFTrDqxrqK audit-docs) that look the same as a skipped look-back. The newest run logged five frictions, one a read-after-act on git-conventions, which evidences step 1. Role and gist not opened by the agent; the earlier note called them current. Grade unchanged (essential). Idea, kept: fold the unverifiable look-back step into step 1 as one sentence (also log late knowledge and detours), removing a step nothing checks, per ADR-0027."
  - date: "2026-11-25"
    note: "Behaviour check of 36 run logs (2026-11-22 02:07Z to 2026-11-25 00:15Z) plus the non-user session_013zxzeStkfKoZxBQUkQd9pd. The auditing agent extracted all 36 logs by script and read in full only the newest log plus the heads and frictions of five low-friction logs; the rest were grepped, so that part is partial. No watchFor items. SKILL.md changed once (7a0f512c0 on 11-22 04:11, wording only); one run began before it. Delivery verified: all 36 logs are completed and each has 1 to 25 journal commits on origin/main; none contains HUMAN-PROMPTED; all 61 PR numbers in the logs' prs are on origin/main. Merge-to-log timing fits (#3661 merged 00:25:28Z, log ended 17 seconds later; #3608 merged 06:25:09Z, log 38 seconds later, so the re-close of the earlier in-review session worked). Orphans: 53 session ids in commit bodies since 11-21 all have logs; session_013zxzePy1ZjrPSpQ5fDkVkz (harvest, filed Seedling issues #3624 to #3627 on 11-23) still has no log, already recorded and not escalated. Today's scorecard: orphanScan scanned true (158 merged PRs, 88 issues, 245 with a session), orphanSuppressionLog empty, humanPromptedClosures and manuallyRescuedClosures empty. The non-user session_013zxzeStkfKoZxBQUkQd9pd is a visitor-loop run whose log landed through the Stop hook; ruled out. No revert, no new silent failure, no missed invocation. Known repeats: step 2's look-back leaves no trace in any log, 36 of 36; the Skill accounting gap (session_013zxzePNKjPWkVNAkzZbSVC lists close-session without log-session yet is logged; StkfK lists neither); the one zero-friction log (session_013zxzeSXn685ayFTrDqxrqK, audit-docs) is indistinguishable from a skipped look-back; one Stop-hook reminder after a merge (session_013zxzeQQP2yCoP7hw7GD1Gx), down from several a week in early November; git-conventions read after the act in the newest run and in PNKj (nits). Friction counts run 0 to 14 per log. Role and gist are current. Grade essential, unchanged. Idea, kept: fold step 2's look-back into step 1 as one sentence (also log knowledge found late and detours); no log can show whether step 2 ran, in 36 of 36 runs and every audit back to 11-16, and ADR-0027 says to cut what cannot be tested. Next focus: transcript-level order of events (invocation before turn end), which no log shows, and full reads of the roughly 30 logs only grepped."
