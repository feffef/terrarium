name: adr-check
category: platform-operation
importance: essential
gist: Finds and reads the ADRs that bind a planned change before you plan, recommend or implement it.
role: >-
  Replaces CLAUDE.md's old inline "search the ADRs first" step with a
  model-invoked one: prints every ADR summary, then the full text behind any
  even slightly related one, so a recommendation or change starts from what's
  already decided rather than rediscovering it. Binds virtually every
  planning/implementing session, not a specialist tool.
observations:
