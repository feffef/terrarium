name: glassbox-improve
category: platform-operation
importance: specialist
gist: Raises the Glass Box guide lens by lens, gating each edit with blind judges.
role: >-
  Lens raters grade the Glass Box guide, researchers confirm each finding, and
  an edit lands only if blind judges prefer it to the page it replaces; judges
  also elect A per lens. Self-merges one PR. Meant to be manual
  (disable-model-invocation).
