    note: "Behaviour check, runs session_013zxzeRsaSP4XhVGZDUk153 (11-19) and session_013zxzeQty154cpRRShQjRhX (11-18); the 11-19 audit's own SKILL.md edit e6a0d6fae landed after both started, so the 300-500 word notes and the newest-7-observations rule are untested by them. Delivery verified from git: PR #3482 (a0e69fe53) changed 9 routine files and 16 skill files only (25 files, matching the log); PR #3441 (ca462f965) changed 10 routine and 17 skill files; issues #3481 and #3440 are closed; no revert. Both runs reported orphanScan scanned true with 0 orphans (not re-run by the audit). Silent failure, self-disclosed, n=1 confirmed: on 11-19 step 5 says to reread SKILL.md and rewrite gist or role when changes lists an edit, but the friction says \"I did not reread any, though 13 Skills changed in the window\" and the summary says \"Not done: role or gist rewrites\". The 11-18 log is silent. Likely cause: nothing in the scorecard prompts it and 16 subagents had used the effort. Repeats: tenant-glossary rule missed in both runs (both ruleUse say missed, both edited layers/journal without its glossary); wording and id rework after the PR in both (d626970a1 fixed 11 jargon or id items; 40b8112d0 reworded three summaries), since only a reviewer checks them; git doc read late, 7 to 9 times in all; a drafted wrong session id, n=5; 15 to 17 near-identical behaviour subagents costing about 1.6M to 1.7M tokens each run. New evidence: the 11-19 run's first Agent call was not blocked by the dispatch-read guard because it read dispatch-subagents first. This 11-20 run repeats the pattern: it again had 15 subagents, and the dispatch-read guard denied its first dispatch until the Skill was read. Idea: the scorecard prints a per-Skill staleFlag when SKILL.md changed after that entry's date, and one skip hint when runs, changes and observations repeat the last check; both runs spent about 1.7M subagent tokens re-confirming repeats. Grade unchanged."
  - date: "2026-11-21"
    note: "Behaviour check of session_013zxzeQAV89N7K2uJN1FbsR (11-20, PR #3509, 26 files) and session_013zxzeRsaSP4XhVGZDUk153 (11-19, PR #3482, 25 files). Both merged (64abc4426 and a0e69fe53); the diff size matches the log's filesEdited; no revert. Both runs started before the 11-20 SKILL.md changes (649e8ffec, e8431d318); the 11-19 run also predates e6a0d6fae (300 to 500 word notes). Observations: the 11-20 run applied the 300 to 500 word rule, the newest-7-observations rule (9049833ad) is untested. Known silent failure, now n=2 and verified in both logs: step 5 asks to reread every changed Skill and rewrite stale gist and role, but 11-20 reread only blog-post's (\"left 13 other changed Skills unchecked\") and 11-19 said \"not done: role or gist rewrites\". The fix landed after both runs (0b8ab4bbe moved the check into per-Skill subagents; 649e8ffec reworded it), so it is untested until this run. This run's check: the per-Skill subagents did return role and gist verdicts for most Skills; several said they did not open the Inventory entry (audit-docs, digest, glassbox-update, log-session), so the fix only partly holds (verified by reading their reports). Repeats: Tenant-glossary rule missed in both main logs (n=3 with 11-18); late git and GitHub doc reads in both (about 9 total); rework after the PR for jargon and truncated ids (both); the dispatch-read guard denied 16 first-dispatch Agent calls on 11-20 but nothing on 11-19. New minor: on 11-20 merge-pr.ts refused four times (an Own-read line in an earlier comment, and code-review args lacking the head sha), costing three extra comments; a verdict comment wrongly said the gate ran before the last edit and was corrected. On 11-19 a single combined reviewer was used on a 25-file Inventory diff instead of the two-axis pair (self-disclosed; own-read-on-Inventory n=3). Role and gist are current (about 48 words, no ids). Nine Skills with runs but no behaviour check get no note, by the current text; whether that is intended is unverified. Idea: print a roleStale flag per Skill in the scorecard (SKILL.md commit later than the Inventory entry) so the role and gist reread is a list, not a memory task; and skip a Skill's behaviour agent when its runs, changes and observations repeat the last check. Grade unchanged (routine)."
  - date: "2026-11-22"
    note: "Behaviour check of session_013zxzeQAV89N7K2uJN1FbsR (11-20, PR #3509, merge 64abc4426) and session_013zxzeRKMTCrTfnEGHcTwAZ (11-21, PR #3542, merge fd9156e3c). The 11-20 run started 00:45Z, before 649e8ffec and e8431d318 (per-Skill role and gist subagent check), so that step was untested for it; 11-21 ran on the current text (the only later SKILL.md commit, c8e0b4b65, is punctuation). Delivery: #3542 touches 27 files, all under skills/ or routines/, matching the log; sampled notes run 312 to 410 words and each auditSummary 25 to 43 words, inside the 300 to 500 and about 40 word rules. The 11-21 run filed #3541 (closed). orphanScan was clean in both logs. No revert (79129ae2c concerns harvest). Findings. Known silent failure, n=3 across 11-19, 11-20 and 11-21: step 5's role and gist reread. 11-20 reread only blog-post and left 13 changed Skills unchecked; 11-21 used per-Skill subagents, yet its own friction says four did not open the Inventory entry. The fix partly holds. Role and gist of this Skill are current (role about 48 words, no ids). Repeats: git and GitHub docs read late (about 11 runs); tenant-glossary rule rated missed in both main logs (n=4), costing 11-20 a validate-content rejection for a word in a Routine note; first-draft notes under 300 words caught only by reviewers (7 of 15 on 11-20, 3 on 11-21), each needing a follow-up commit and review round; rework after the PR (11-20 jargon and ids; 11-21 a wrong blog-post role claim copied from a subagent report, caught by the Spec reviewer); the dispatch guard denied 16 first Agent calls on 11-20 but not on 11-21. Heavy spend: 11-21 used 15 behaviour agents plus 4 review agents, about 1.5M tokens by its own idea text (unverified). New minor, n=1: a chained sleep and a command mixing run_in_background with an ampersand were blocked by guards on 11-21. Open, unverified: Skills with runs but no behaviour check (code-review, grilling, tdd and others) get no note under the current text. No missed invocations. Idea: print a roleStale flag per Skill in the scorecard (SKILL.md commit later than the Inventory entry date) and a word-count column on appended notes. Grade unchanged (routine)."
  - date: "2026-11-23"
    note: "Behaviour check of session_013zxzeSjAhKC67o9cGa94Tm (11-22) and session_013zxzeRKMTCrTfnEGHcTwAZ (11-21), by a read-only subagent against git and the logs. Both delivered. PR #3542 (11-21) merged as fd9156e3c; PR #3576 (11-22) merged as 7e5201c71, and a diff with --no-renames shows 27 files, none outside skills/ or routines/, as the Skill requires. The 11-22 observation is present in audit-skills.yml. No revert: git log origin/main since 11-22 with --grep=revert finds nothing, and the two-week history for the Skill's name shows only follow-ups (9b9a96b06, c02eb5546, 1bb6678ac). SKILL.md in effect: the 11-22 run started at 00:45Z and the only later edit is 750d8edc0 (04:14Z), which adds the prune-observations word-count flag; so the run was graded on the text that already had the 300 to 500 word rule and the per-Skill role/gist subagents. Findings, all repeats. Known silent failure, now n=4: step 5's role and gist reread cannot be seen in the log, which mentions it only in its summary (\"changed no grade, role or gist\") and an idea; whether the subagents reported verdicts is unverified because the subagent reports were not read, so the verdict is couldn't tell. Tenant-glossary was read late (n=5): the run wrote 15 Journal observations with one Node script before reading layers/journal/GLOSSARY.md, and the guard fired only on a later edit. The first note draft was under 300 words (282), caught by the run's own length check; 750d8edc0 now flags it automatically, so this should stop. Counts and ids from 15 subagent reports were verified for only a few and the rest tagged unverified; the run made 18 Agent calls. New, minor, n=1: check-states flagged five ordinary-prose phrasings (written open, merged) in the new notes and the run reworded them. The run also filed #3574 and #3575 (taken from the log summary, not re-checked). The subagent also ran gh pr view before reading the GitHub doc and got a 403, which is its own process slip. Role and gist: SKILL.md changed by a two-line wording edit only; the subagent did not open the Inventory entry, so it could not tell; nothing in the runs contradicts the text. Idea, dropped: a scorecard roleStale flag would add a moving part to detect a stale role, while the word-count half is already done by prune-observations; the evidence (n=4 on the reread) is better served by this run's own subagent verdicts, so nothing new is kept. Grade unchanged (routine). No Watch for section exists on this Skill."
  - date: "2026-11-24"
    note: "Behaviour check of session_013zxzeSjAhKC67o9cGa94Tm (11-22) and session_013zxzeRQQomSvhPo9RWTEkC (11-23); no watchFor items. The 11-22 run predates the word-count flag (1bb6678ac, merged with 750d8edc0), so the flag was untested for it; the 11-23 run ran on the current text. Delivery verified: PR #3612 merged as 2b01ee359 with 26 files (16 under skills, 10 under routines, nothing outside the allowed paths), matching the log's filesEdited; PR #3576 merged as 7e5201c71 with no path outside skills and routines. Observation notes counted by script on main: the 15 notes of 11-23 run 336 to 413 words and the 15 of 11-22 run 306 to 372, all inside the 300 to 500 limit, so the flag works. The 11-23 auditSummary text is 39 words with no ids. The issues the runs filed (#3610, #3611, #3574, #3575) exist, carry the run's header and are closed. Follow-ups 392188888, 764f92d86 and 1214051b4 corrected real wording problems that review caught. No revert. Orphan scan of the 11-23 run was reported as scanned (170 merged pull requests, 98 issues) with every closure signal empty. Known repeats: the step 5 re-read of role and gist cannot be seen in the logs (n=5, couldn't tell); 15 behaviour agents again; the git and triage docs read after the first command; six Skills with runs but no behaviour check (code-review, grilling, tdd, prototype, writing-for-agents, dependabot-sweep) get no new summary, an open question of whether that is intended (n=3). New and minor: on 11-23 gate:scoped failed on validate-skill-cadence because a note said a Skill runs daily, costing fix commit 764f92d86, a second review round and two more gate runs; the step 5 text never states the schedule-wording rule (n=2 with the 11-20 rejection). The first drafts of two notes named the wrong current grade (clear-backlog, inspect-session) and were caught by grepping importance; the watchFor verdict wording was fixed only after reviewers objected. The 11-23 skillsUsed reason says 17 read-only subagents but th