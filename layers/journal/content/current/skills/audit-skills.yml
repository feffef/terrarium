name: audit-skills
category: platform-operation
importance: routine
gist: Keeps the list of which Skills matter, and why, up to date.
role: >-
  A self-improvement Skill. Checks that our own Skills fire when they should and
  deliver what they promise, even without frictions; files significant or
  repeated findings as issues, never editing a Skill. Keeps the Skill
  Inventory's grades in line with usage as a by-product, self-merging those
  edits (ADR-0015).
auditSummary:
  date: "2026-11-28"
  text: "Checks each Skill against its runs and keeps the Inventory current, with notes within bounds and issues filed on solid evidence. It writes its notes by hand without reading the Journal glossary, which costs rework."

