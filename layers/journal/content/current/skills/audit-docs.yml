name: audit-docs
category: platform-operation
importance: routine
gist: Sweeps the docs for outdated, confusing, or duplicated writing.
role: >-
  The prose counterpart to `audit-skills`: an autonomous sweep that audits every
  live doc and Skill against the code for correctness, single-homing, concision
  and clarity, fact-checks each finding, fixes it bravely, and self-merges its
  own gated PR on green (ADR-0003/0004). It files an issue only for a factual
  conflict it can't resolve. Reach for it whenever docs and code drift apart.
