is possible), and the 11-18 summary's \"20 doc fixes\" against 14 surviving findings in 15 files (3rd sighting). The two-commit sweep on 11-20 is no longer a violation since c736e4c12. merge-pr.ts refused twice on 11-20 because code-review args named origin/main; that belongs to pr-workflow, not this Skill. Role and gist were not graded this window. Not escalated: the 11-19 gap is a first verified instance. Idea: in step 1.3, skip docs that state a review date, make reviewers quote every rule they drop, and tell them to skip owner-decision tensions. Grade unchanged (routine)."
