name: dispatch-subagents
category: platform-operation
importance: essential
gist: Rules for safely handing work off to helper agents.
role: >-
  Single-homes how this Platform spawns work: which worktree-isolation mechanism
  to use, the self-contained brief that survives this environment's sharp edges,
  and the post-dispatch check that no finished subagent work is stranded. Every
  rule in it was paid for by a session that lost work.
