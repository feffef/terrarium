    note: "Behaviour check by script over the 30 logs that used the Skill and 51 that did not (outcome, prs, toolCounts, docsRead, every friction); raw event streams were not read and runs were graded against the current text plus friction text, not each run's start-of-run SKILL.md, so the two newest landings (afac46f0d, 11-19) are unchecked against older runs and the runs' own claims about brief contents are unverified. Delivery: 112 distinct PR numbers claimed, 110 on origin/main; the two not on main are #3475 (closed by the owner, known) and #3504 (open, awaiting a human, honest in its log; state not confirmed on GitHub because GraphQL is blocked). git worktree list shows one worktree, so nothing is stranded, and no revert of run deliverables was found. Missed invocations: none; of 51 non-users, 20 dispatched nothing and the rest read the SKILL.md before dispatching. Repeats: the dispatch-read guard denied the first Agent or Workflow call in about 10 runs (approximate; matched by log suffix); the placeholder-token guard blocked a brief that quoted the brace token (session_013zxzeQgh4aLo2xMP4FzXZJ, session_013zxzeSZQpKBLnM3DK1cPRQ); cd into a builder's worktree persisted in three runs, two self-caught; retro resumes cost 75k to 111k subagent tokens each; reviewers got two or three hand-off channels; code-review's heading level misled grep for its section 3. New, minor: unchecked subagent claims were relayed in two more runs (one wrote \"about 130 of the 143 changed files are data\" while the list gave 135; one relayed \"max tag count is 12\" without recounting and was wrong); after an owner stop signal killed running builders and gates, nothing says what to do when the agents are gone; the Stop hook flagged uncommitted changes while agents ran and forced partial commits in several runs. Unexercised: section 7. Idea: have the dispatch-read guard denial print the Skill path, or auto-read it, and have dispatching Skills cite it in step 1; denials recur in about 10 of