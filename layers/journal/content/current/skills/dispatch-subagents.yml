name: dispatch-subagents
category: platform-operation
importance: essential
gist: Rules for safely handing work off to helper agents.
role: >-
  Single-homes how this Platform spawns work: which worktree-isolation mechanism
  to use, the self-contained brief that survives this environment's sharp edges,
  and the post-dispatch check that no finished subagent work is stranded. Every
  rule in it was paid for by a session that lost work.
observations:
  - date: 2026-09-28
    note: >-
      Audit-skills behaviour check, 10 newest sessions: no stranded work, but
      4 rule-adjacent incidents, each self-caught by a safeguard rather than
      by the rule being followed. session_0158JckUL8YWJtVL7s9i7xRr: a
      worktree subagent pushed the same branch the primary checkout had
      checked out, needing manual human rescue. session_01648DQZcyo8J5TBnQCYMzMM:
      dispatched merge-pr.ts to a subagent — directly against this Skill's
      explicit "never" rule — blocked 4 times by the classifier, not by the
      rule holding; same session also hit repeated same-file collisions from
      under-checked parallel dispatch. session_016u3USbZw7eybPYiDatPJmE: two
      probe agents started on a stale pre-prune HEAD, skipping the
      verify-HEAD step. session_01S5bzNzvg1DURebeNRDgVi5 (minor): an
      orchestrator `cd` into a subagent's worktree persisted across Bash
      calls. Separately, one near-miss missed invocation:
      session_01LKfKKxwgThbVFE79NWohET dispatched ~39 parallel subagents
      (content-editing, git-touching) without dispatch-subagents in
      skillsUsed, but handled the resulting 429 failure correctly anyway
      (banked progress, resumed via SendMessage). Not escalated as issues —
      no real damage occurred in any case — but a repeat of the merge-pr.ts
      or branch-collision shape would be.
