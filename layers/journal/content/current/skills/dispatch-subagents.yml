name: dispatch-subagents
category: platform-operation
importance: essential
gist: Rules for safely handing work off to helper agents.
role: >-
  Single-homes how this Platform spawns work: which worktree-isolation mechanism
  to use, the self-contained brief that survives this environment's sharp edges,
  and the post-dispatch check that no finished subagent work is stranded. Every
  rule in it was paid for by a session that lost work.
observations:
  - date: 2026-09-28
    note: >-
      Audit-skills behaviour check, 10 newest sessions: no stranded work, but
      4 rule-adjacent incidents, each self-caught by a safeguard rather than
      by the rule being followed. session_0158JckUL8YWJtVL7s9i7xRr: a
      worktree subagent pushed the same branch the primary checkout had
      checked out, needing manual human rescue. session_01648DQZcyo8J5TBnQCYMzMM:
      dispatched merge-pr.ts to a subagent — directly against this Skill's
      explicit "never" rule — blocked 4 times by the classifier, not by the
      rule holding; same session also hit repeated same-file collisions from
      under-checked parallel dispatch. session_016u3USbZw7eybPYiDatPJmE: two
      probe agents started on a stale pre-prune HEAD, skipping the
      verify-HEAD step. session_01S5bzNzvg1DURebeNRDgVi5 (minor): an
      orchestrator `cd` into a subagent's worktree persisted across Bash
      calls. Separately, one near-miss missed invocation:
      session_01LKfKKxwgThbVFE79NWohET dispatched ~39 parallel subagents
      (content-editing, git-touching) without dispatch-subagents in
      skillsUsed, but handled the resulting 429 failure correctly anyway
      (banked progress, resumed via SendMessage). Not escalated as issues —
      no real damage occurred in any case — but a repeat of the merge-pr.ts
      or branch-collision shape would be.
  - date: 2026-09-29
    note: >-
      The cd-into-worktree footgun named above (session_01S5bzNzvg1DURebeNRDgVi5)
      recurred the very next day in session_0185EAXqfuX1twvr6Z67SsY4 —
      near-identical wording, same self-recovery, no damage either time. Two
      occurrences on consecutive days against an already-explicit,
      already-once-recorded rule cleared the escalation bar; filed as issue
      #1480. Two further single-instance findings, not yet escalated:
      session_01S5bzNzvg1DURebeNRDgVi5 also passed `isolation:'worktree'`
      only in prompt text rather than as the actual Agent-tool parameter —
      exactly the mistake §2 warns against by name — caught via TaskStop
      before any work occurred; and session_01NT2TmgJJGjEsc84AW6oAi7 hit a
      parallel-load test-fixture tmp-path collision (a variant of the
      #847/#1191 artifact-naming-collision class, but a shared fixture path
      rather than a named log/scratch output), self-caught via rerun. Both
      recorded here for a future run's screen. No other rule-adjacent
      incident recurred among the 10 newest sessions checked; the near-miss
      missed-invocation (session_01LKfKKxwgThbVFE79NWohET) remains the only
      real instance in the window — a broader check of the ~30 non-users
      whose goals plausibly implied subagent work found no new missed
      invocation (every one dispatched only read-only subagents, outside
      this Skill's git/worktree remit).
  - date: "2026-09-30"
    note: >-
      Re-checked (audit-skills behaviour check), 10 newest sessions (09-27
      through 09-29): no stranded work, no merge-pr.ts dispatched to a
      subagent, no new branch/worktree collision. Issue #1480
      (cd-into-worktree) is still open/unassigned/unfixed but has not
      recurred a third time in this batch. Screened all 62 nonUsers by goal,
      opened 16 of the plausible ones: every dispatch found was strictly
      read-only (behaviour-check/review/fact-check/visitor/research agents);
      no new missed invocation. The prior window's near-miss
      (session_01LKfKKxwgThbVFE79NWohET) remains the only real instance to
      date.
