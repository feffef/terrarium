name: glassbox-update
category: platform-operation
importance: routine
gist: Keeps every Glass Box guide page pinned to what the code does.
role: >-
  The one-way code-to-pages sync for the Glass Box textbook: re-pins every
  guide page and term to a commit, flags the ones whose prose
  or diagrams may now be stale, and lands a self-merging PR once they're
  re-checked. Its Scout lists each new topic no page teaches on the memory
  page, for glassbox-curate. Fired by a Routine; keeps Glass Box honest as the
  Platform changes.
auditSummary:
  date: "2026-11-25"
  text: "Keeps the Glass Box textbook pinned to current commits by rotating through pages and checking claims, and its pull requests have merged without reverts. Its instruction for recording newly found gaps points at a memory-page section that no longer exists."
