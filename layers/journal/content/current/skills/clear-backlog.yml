name: clear-backlog
category: platform-operation
importance: specialist
gist: Clears the open-issue backlog in one run, asking the owner once.
role: >-
  Runs `auto-triage`, `implement`, `dispatch-subagents` and `code-review`
  through two saved workflows as one pass over the open issues its sweep picks
  up: explores them, grills the owner once in plain words on judgment calls,
  then builds, reviews and lands the PRs unattended. For a deliberate "clear
  everything now" pass, not a substitute for the smaller on-interval Skills it
  composes.
