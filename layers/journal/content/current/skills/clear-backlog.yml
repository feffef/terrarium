      Inventory entry until now. First `audit-skills` behaviour check found
      two verified silent failures. (1) session_017NBxJhtBSd9AoCwTzsg6pM: PR
      #1840 merged 3.5 minutes after opening with zero review
      (`get_reviews` == []), violating §4's review-before-push promise;
      self-logged as a major friction. Fully covered by open issue #1844
      (filed by the same session), which already has the fix (PR
