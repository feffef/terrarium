name: glassbox-curate
category: platform-operation
importance: specialist
gist: Makes the Glass Box guide easier to learn from, then fills gaps.
role: >-
  One focused curation pass over the Glass Box guide per run, landed as one
  PR. Improves existing Lessons first; adds one only where a technology
  Terrarium relies on has none. Runs three ways: fired by a Routine, started
  by hand and told to act autonomously, or interactive with the owner via
  `grilling`.
