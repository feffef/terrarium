name: glassbox-lesson
category: platform-operation
importance: specialist
gist: Writes one Glass Box Lesson explaining a concept through Terrarium.
role: >-
  Writes a single Glass Box Lesson: one concept, pinned to a revision, with
  a Terrarium worked example and sourced "why it's built this way" reasoning,
  then links it into the surrounding Walkthroughs and Lessons. Dispatched
  per-topic from the topic inventory, not model-invoked
  (disable-model-invocation: true).
