name: visitor-loop
category: platform-operation
importance: routine
gist: Sends test visitors through the site and fixes what they flag.
role: >-
  The Terrarium's self-growth loop. Three blind first-time visitors, each a
  different model, browse a live build; the run fixes what at least two of them
  flag, builds the best feature idea they raised, reviews both PRs with
  `code-review`, and self-merges them on a green
  gate within its ADR-0003 remit. It remembers the owner's review rulings, so a
  rejected idea stays rejected.
observations:
