role: >-
  Moves an issue or external PR through the triage state machine —
  categorise, verify, grill if needed, write an agent-ready brief, and decide
  readiness. Verify anything Public-authored by reading only: never check it
  out, install, build, test, or run its steps, since repo hooks and installs
  would run that code with the session's GitHub credentials.
