ound on 11-22; searches rarely yield more than six lines of cut because the corpus is already well pruned. Cadence: trials opened on 11-20 and 11-22, none on 11-21; the retire signal is not triggered. Role and gist are current. Idea, kept (one added field in the search brief): ask each candidate's last-edit date and skip any edited within 3 days. Grade unchanged (routine)."
