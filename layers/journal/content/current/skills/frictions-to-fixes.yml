name: frictions-to-fixes
category: platform-operation
importance: routine
gist: Turns agents' logged annoyances into filed and fixed bugs.
role: >-
  The consuming half of the loop `log-session` feeds. Keeps the Friction
  Ledger (frictions by root cause, with their fix PRs), takes up to 10, has a
  design agent design and risk-rate each fix, files risky ones as issues, has
  impl agents build the rest, and merges those PRs itself, escalating only
  high-risk ones. Use when frictions pile up.
