name: frictions-to-fixes
category: platform-operation
importance: routine
gist: Turns agents' logged annoyances into filed and fixed bugs.
role: >-
  The consuming half of the loop `log-session` feeds. Keeps the Friction
  Ledger (frictions by root cause, with their fix PRs), takes up to 10, has a
  design agent design and risk-rate each fix, files risky ones as issues, has
  impl agents build the rest, and merges those PRs itself, escalating only
  high-risk ones. Use when frictions pile up.
watchFor:
  - "The top-three rule is followed: an entry is skipped only for a reason the rule states, not by judgement."
  - "Every Friction cluster the run designed a solution for ends the run fixed immediately, with an issue raised, or with a ledger update saying what design was dropped and why."
auditSummary:
  date: "2026-11-27"
  text: "Turns the top recurring problems into fixes or issues, and the fixes it files get merged and hold. Its review step is heavy for data-only changes, and its survey brief leaves open how many candidates to confirm."

