name: frictions-to-fixes
category: platform-operation
importance: routine
gist: Turns agents' logged annoyances into filed and fixed bugs.
role: >-
  The consuming half of the self-improvement loop `log-session` feeds, where the
  project's autonomy first closes end-to-end. It picks up to 10 logged frictions
  to fix (at most 2 hard, the only selections filed as issues), dispatches impl
  agents, then reviews and merges their gated PRs itself, escalating only
  genuinely high-risk changes. Reach for it when frictions pile up.
