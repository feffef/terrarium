name: digest
category: platform-operation
importance: routine
gist: Writes the daily catch-up summary of what happened on the site.
role: >-
  Writes the Journal's daily Digests (ADR-0010): one per closed UTC day, a
  short catch-up from git history and session logs. A tested helper gathers
  the facts; the Skill writes the prose, has a separate pass fact-check it
  against the PRs' diffs, and merges its own gated PR on green. Scheduled; run
  by hand to catch up.
