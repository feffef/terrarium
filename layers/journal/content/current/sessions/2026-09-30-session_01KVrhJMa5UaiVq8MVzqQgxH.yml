  - description: "ScheduleWakeup is blocked outside /loop sessions (issue #814's guard), and repeated no-op Bash `true` calls to wait on background subagents are themselves discouraged by CLAUDE.md — there's a real gap for \"I have nothing to do but wait on several in-flight background subagents in a non-loop session\" with no sanctioned filler-free way to end the turn cleanly each time one lands."
    solution: Either relax the filler-call guidance to explicitly bless a single no-op turn-end while background agents are outstanding, or give non-loop sessions a lightweight "wait for next background completion" primitive.
