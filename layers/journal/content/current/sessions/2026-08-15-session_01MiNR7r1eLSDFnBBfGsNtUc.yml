  - description: "Survey subagent: session-frictions.ts --window 20's raw JSON (~30KB) exceeded the Bash inline-capture cap; --compact drops the prose fields (solution/goal/outcome) a survey needs for grouping and severity judgment, so it isn't a substitute for a redirect-to-file workaround on a survey run specifically. 3rd occurrence in this window per the subagent's own count."
    solution: Either raise session-frictions.ts's default inline size for non-compact output, or document redirect-to-file as the expected pattern for a survey/audit consumer specifically (distinct from --compact's original motivating consumer).
