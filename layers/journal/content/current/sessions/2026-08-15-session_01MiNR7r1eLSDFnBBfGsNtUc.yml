  - description: 'Survey subagent found 3 tracker issues (#950, #952, #954) reporting state "open" via mcp__github__issue_read despite each having a closed_by_pull_requests reference to an already-MERGED PR (#955), with the fix content verifiably present in the repo. A screening pass that trusted the state field alone would have wrongly re-recommended fixes for already-closed work.'
    solution: Investigate why merge-pr.ts's merge commits (or those issues' original PRs) didn't trigger GitHub's auto-close on a Closes/Fixes keyword — either the issues need manual closing, or the merge flow isn't reliably using a closing keyword. Flagged to the user; not fixed in this run (root cause unconfirmed, could be a real bug or a GitHub-side quirk).
    severity: moderate
  - description: "Called mcp__github__pull_request_read method \"get_status\" on two PRs expecting CI state; this repo reports CI via check runs, not legacy commit statuses, so it returned {state: pending, total_count: 0} on an already-green PR — a wasted round trip before switching to get_check_runs, which pr-workflow.md's own recipe already names as the right call."
    solution: Reach for get_check_runs directly per docs/agents/pr-workflow.md's recipe step 3, not get_status, when polling this repo's CI state.
    severity: nit
