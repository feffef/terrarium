  - description: "Survey subagent: confirming each doc-covered candidate's fixed/open status required grepping ~6 separate docs by hand (no single helper surfaces \"is this rule already documented/fixed\"). Recurring meta-friction, previously judged non-trivial to fix and left unaddressed twice already."
