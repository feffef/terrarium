learnings:
  - A commit-msg hook appends the Co-Authored-By and Claude-Session trailers, so a plain git commit -F message is enough.
  - git log -S lists commits where the occurrence count of a string changed, so for a reworded quote the newest hit is the commit that removed it; always confirm with git show.
