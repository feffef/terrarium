frictions:
  - description: Tried to invoke clear-backlog through the Skill tool; it is user-invoked only, so the owner had to retype the command (their first try had a trailing period).
    solution: Recognise a /name. message as a failed slash command and ask the owner to resend it without punctuation.
    severity: minor
  - description: The dispatch-read guard blocked the first clear-backlog-explore Workflow call until I read dispatch-subagents, whose brief-writing steps don't apply to a saved workflow the Skill runs by name.
    solution: Exempt named saved workflows (clear-backlog-explore/build) from the dispatch-read guard, since they brief their own agents.
    severity: minor
  - description: The build workflow could not check out the session branch (held by the main checkout), so it committed on a worktree branch and I had to push HEAD to the session branch by hand.
    solution: clear-backlog-build could push via HEAD:<name> by design, or the Skill could say the session branch name is always held by the main checkout.
    severity: nit
  - description: Wrote a log-session scratch path without its scratchpad/ segment, so one Bash call failed on missing files and was resent.
    solution: Set the scratch dir in one variable and reuse it.
    severity: nit
  - description: "The owner deferred #1689 and #1904 after explore had started, and their triage agents had already posted status comments the owner may not have wanted on deferred issues."
    solution: Ask which issues to defer before launching explore when the set includes long-parked ready-for-human issues.
    severity: nit
