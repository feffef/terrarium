frictions:
  - description: My first prune cut the ADR bullet and typecheck clause in ways that lost meaning; reviewers caught both before the push and I reverted them.
    solution: Before committing a CLAUDE.md wording cut, reread each cut bullet against the rule summaries it paraphrases.
    severity: minor
  - description: Edited CLAUDE.md before reading ADR-0029, which the post-edit hook then required; the late read changed nothing.
    solution: Read the governing ADR summary's full ADR before the first edit of CLAUDE.md in a prune run.
    severity: nit
  - description: My first Agent call was blocked by the dispatch-read guard because I had not read dispatch-subagents; one wasted call.
    solution: Read dispatch-subagents before the first brief in a prune run.
    severity: nit
  - description: The Stop hook asked me to push four times while the probe, review and gate were pending; ADR-0004 required waiting.
    solution: Have the Stop hook stay quiet while a probe, review or gate is pending.
    severity: nit
  - description: I typed a wrong session id in the commit message trailer; the commit-msg hook corrected it, which I verified in git log.
    solution: Copy the id from the system-prompt template, not from memory.
    severity: nit
