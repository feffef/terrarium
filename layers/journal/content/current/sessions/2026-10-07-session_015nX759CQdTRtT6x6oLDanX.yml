  - description: Survey subagent hit 180KB session-frictions output and a 1358-line merged-since listing, forcing manual slicing.
    solution: Add a compact mode to session-frictions.ts and merge-commits-only to merged-since.ts.
    severity: minor
  - description: Impl agent's compound git command was refused as too complex and a chained grep -c exit 1 stopped later commands.
    solution: Brief should say to run git calls separately and not chain after grep -c.
    severity: nit
  - description: Dropped the survey's ADR-0017 candidate citing the provenance trial territory, which does not list ADR-0017; it was surface-blocked and needed a ready-for-human issue, never filed. Verified with one grep only.
    solution: Check a trial's territory paths literally before dropping on it; file surface-blocked candidates per frictions-to-fixes section 4.
    severity: moderate
  - description: "Never listed docs/adr or grepped it for touched files and terms, and read no binding ADR in full (CLAUDE.md ADR trigger); also labeled #1659 ready-for-agent without reading ADR-0020."
    solution: Run the ADR list and grep before planning; frictions-to-fixes could name the ADRs it binds (0003, 0004, 0015, 0020).
    severity: minor
  - description: Skipped pnpm check:worktrees after dispatch, skipped check-conflicting-issues.ts (pr-workflow step 2), and asserted audit-docs compliance in the review comment without reading that Skill.
    solution: Make merge-pr.ts run the conflicting-issues check; add a check:worktrees line to frictions-to-fixes section 5 done-when.
    severity: minor
  - description: Dispatched the survey subagent, which reads git, before loading dispatch-subagents; also read files via Bash sed and grep instead of the Read tool.
    solution: Load dispatch-subagents before any Agent call; use Read for files.
    severity: nit
  - description: Repeated survey figures (33 sessions, tracked by 1651-1654) and the impl agent's local gate result as fact without checking them against the source.
    solution: Spot-check one count against the output file before stating it; only CI green was verified.
    severity: minor
  - description: Re-invoked log-session directly for the final update instead of close-session, and did not confirm the log commit on origin/main.
    solution: Re-invoke close-session at completion, then verify the log commit with git log origin/main.
    severity: nit
