frictions:
  - description: "Drafted the commit message for the winning post's PR with a fabricated Claude-Session footer — copied session_015MRgP2fsFRvoHJMXeMsKpv (an audit-docs session's id, read earlier in this session's own material gathering) instead of resolving this session's own id from ground truth. This is the exact recurring failure class CLAUDE.md documents (issues #387/#605/#628) and I still did it, on a plain `git commit -F` where no hook auto-injects the footer."
    solution: Caught it myself before pushing (the commit was still local/unpushed) by re-reading CLAUDE.md's "never predict an identifier" rule, resolving CLAUDE_CODE_REMOTE_SESSION_ID from the environment, cross-checking it against the system prompt's own commit-footer template, and amending the tip commit with the correct id before push. No bad footer reached GitHub. Worth noting that this session's own system-prompt instructions literally state the rule I violated — reading a rule is not the same as applying it at the moment of writing an identifier; only resolving the id from ground truth at write-time actually works.
    severity: minor
  - description: The first drafted description for Karen's winning post claimed the github-footer-guard bug (#692) "would've let the lie through" — the opposite of its actual, documented failure mode (it wrongly blocked an honest citation, a false positive, not a false negative). Caught by the A5 outside-reader review, not by my own pre-publish check.
    solution: Rewrote the description and clarified the body's explanation before publishing. Worth tightening this Skill's own A4 drafting step to double check that a post's frontmatter description and body agree on which direction a bug actually failed, not just that both are individually plausible-sounding.
    severity: nit
