outcome: Sessions using adr-check read 25 of 61 path-bound ADRs in full; 4 transcripts confirm the logs
summary: "Human-instructed: the owner asked in turn how many sessions by kind invoked adr-check, which autonomous sessions skipped it, how full-ADR reads compare with and without it, and then (after choosing \"logs, then sample transcripts\" when I asked) whether sessions using it read the ADRs that bind their change. Method was agent-chosen. Since 2026-10-19, 22 sessions used it; 86% of them read some full ADR vs 31% without it. adr-check names no binding set, so I took as bound every ADR whose rule paths match files the session edited or its merged PRs changed: 15 of 22 sessions had such ADRs, 61 pairs in all, of which 25 were read in full; only 3 sessions read all theirs. Four subagents read transcripts of 01Pzj23d, 01WU8rXH, 011W3gVN and 01FTPnEs: the logs' read lists were accurate, no session named its binding ADRs when it ran the Skill, skips were justified only afterwards as \"summary was enough\", and 01FTPnEs ran adr-check once for four PRs. Path matching overstates some bindings. No code changed, no PR."
