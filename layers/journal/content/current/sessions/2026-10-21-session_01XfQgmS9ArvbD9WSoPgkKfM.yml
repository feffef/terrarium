summary: "Human-instructed: the owner asked three questions in turn: how many sessions, by kind, invoked the adr-check Skill; which autonomous sessions skipped it; and how often full ADRs were read with versus without it. The method was agent-chosen: parse every session log on origin/main and use skillsUsed and docsRead. Since the Skill was added on 2026-10-19, 21 (later 22, as a new log landed) sessions used it; 18 autonomous sessions did not, 3 of which admit the skip in a friction. Of the 22 with the Skill, 19 (86%) list at least one docs/adr file in docsRead (mean 2.6); of the 26 without, 8 (31%, mean 1.5, skewed by one docs audit that read all 30). The comparison is confounded: the with-group is mostly interactive design work, the without-group mostly scheduled content runs, and docsRead cannot say whether the right ADRs were read. No code changed, no PR."
