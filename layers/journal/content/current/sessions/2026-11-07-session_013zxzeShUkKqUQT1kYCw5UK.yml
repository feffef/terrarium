frictions:
  - description: Stated 'pins of 70 guide pages' in the review brief from memory; the diff changed 72 pages (73 files with update.yml).
    solution: Count with git diff --name-only before putting a number in a brief or PR text; I kept the PR body free of the count.
    severity: nit
  - description: PR body said no diagram SVGs were due a re-render, but no step checked it; the spec reviewer noted it was unchecked.
    solution: Either check the guide pages' mermaid fences against app/assets/mermaid or leave the sentence out.
    severity: minor
  - description: The Stop hook demanded a commit and push twice mid-run, forcing two commits labelled work in progress before the review was done.
    solution: Have the hook ignore a branch with no PR yet, or let the run commit once at the end.
    severity: nit
  - description: The step-1 report listed 30 pages with 20 distinct changed files; briefing four agents to re-read pages whose only change was a one-line hook entry cost about 600k subagent tokens and found no false claim.
    solution: Let the script drop a flag when a page cites a file only for lines the diff did not touch (it already shifts lines ranges), so a scoped check starts from real overlaps.
    severity: minor
