  - description: Did not invoke the dispatch-subagents Skill before spawning the A5 review subagent, per CLAUDE.md's blanket rule ("invoke the dispatch-subagents Skill before spawning one"). The reviewer was purely read-only (Read tool only, judging three scratch files, no git/worktree involvement, no code change), so the worktree-isolation mechanics that Skill governs didn't obviously apply, but the CLAUDE.md rule as written carves out no exception for a read-only subagent.
