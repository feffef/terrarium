  - description: "This session's outer attribution instructions (system-reminder) direct hand-writing a Co-Authored-By/Claude-Session trailer on every commit, which directly conflicts with this repo's commit-trailer guard (issue #921): the first commit attempt, with a hand-typed trailer, was denied."
    solution: Retried with no trailer at all (subject + body only); the repo-side hook landed the correct trailer automatically, verified via `git log -1 --format=%B`. Repo convention correctly won the conflict, but the outer attribution instructions themselves are stale for repos with this guard.
    severity: minor
  - description: "First `pnpm gate:scoped` attempt was piped through `tail -100` out of habit, which the tail-pipe guard (issue #873) correctly denied before the gate ever ran (it would have lost the real exit status)."
    solution: Redirected to a scratch log file instead (cmd > log 2>&1; echo EXIT_CODE=$?) and read the tail via the Read tool. No wasted gate run — caught before execution.
    severity: nit
