learnings:
  - "`pnpm test:e2e <file>` runs every e2e spec: vitest takes both `tests/e2e` and the path as filters, and the project includes every layer's e2e folder"
  - A tooltip inside a stretched-link tile needs the stat buttons positioned above the link's ::after; z-index on a non-positioned flex item works but reads as accidental
  - Chromium in this container can't load Type1 fonts (Bitstream Charter), so DejaVu Serif and DejaVu Sans Mono are the usable wide-font proxies for checking that macOS text fits
ideas:
