frictions:
  - description: "Ran git rev-parse and git status before reading git-conventions.md; the read-first hint fired afterwards. rev-parse is the command #3194 proposes to exempt."
    solution: "Land #3194 so read-only lookups stop drawing the hint, or read the doc at session start."
    severity: nit
  - description: Push notification said 6 questions but the list had 7 Seedlings; I did not count before sending.
    solution: Count the list's items before writing the notification text.
    severity: nit
  - description: Ran list-open-issues.ts, which calls gh, before reading github-integration.md.
    solution: Read the GitHub doc before the sweep's first listing step.
    severity: nit
  - description: "Closed #3187 and #3188 with issue_write before reading issue-tracker.md; the hint asked for it afterwards."
    solution: Read issue-tracker.md and triage-labels.md before the first issue write of the run.
    severity: nit
  - description: "Linked worktree(s) left with uncommitted or unpushed work at close: /home/user/terrarium/.claude/worktrees/wf_2a497b56-b98-1"
    solution: Push each, or remove it if its work is meant to be dropped.
    severity: minor
  - description: "Merged PR 3201 (workshop page, 2382 words) after its own gate passed, without re-checking the capped page against a concurrent PR; main hit 2503 words, and a later #3189 gate failed on it."
    solution: Before merging an edit to a size-capped page, fetch main and re-run its spec on the merge result, or have gate:scoped test the merge ref.
    severity: minor
  - description: First token-bar screenshot clip used viewport coordinates on a scrolled page and captured the wrong region; redone with an element screenshot.
    solution: Use locator.screenshot for a block, as verifying-ui-changes.md warns about clip.
    severity: nit
  - description: "Started builders for #3194 and #3193 while grilling questions were still open, so builder and reviewer news interleaved with the owner's questions and sample screenshots; the owner asked for the rule that this never happens."
    solution: "PR 3207 makes it a hard rule in clear-backlog: no builder runs before grilling and UI samples are done."
    severity: moderate
