frictions:
  - description: pnpm gate:scoped's inert-path classifier correctly ran the full gate for the architecture.md edit, but the Mermaid-source change also required a separate manual pnpm render:mermaid step before verify:mermaid would pass — easy to miss on a first pass since gate:scoped doesn't call it automatically.
    solution: Consider having gate:scoped (or verify:mermaid itself) auto-run render:mermaid and diff-check the result when a changed path contains a live ```mermaid fence, rather than failing and pointing the agent at a separate command.
    severity: nit
  - description: "A pooled Duplication finding (merge-authority prose restated across several Skills' own SKILL.md files) turned out to already be tracked as the pending policy-as-data work in issue #864 (recorded in docs/research/rulebook-migration-table.md's PR-11 row) — this sweep correctly recognized it as known/pending rather than re-deciding it, but only because the fact-checking agent happened to surface that cross-reference."
    solution: No action needed this run; noting for future audit-docs runs so a similar already-tracked duplication isn't mistaken for a fresh, independently-fixable finding.
    severity: nit
  - description: Ran scripts/merge-pr.ts straight after check-conflicting-issues.ts without first posting pr-workflow.md step 4's verdict comment — the recipe says post it "before merging, every time," and merge-pr.ts doesn't do this itself ("still do step 4 ... around it"). Caught only after the merge, from get_comments coming back with no verdict trace.
    solution: "Posted the verdict comment retroactively after merge. For next time: treat posting the verdict comment as the literal step immediately before invoking merge-pr.ts, not something to add after checking the audit trail."
    severity: minor
