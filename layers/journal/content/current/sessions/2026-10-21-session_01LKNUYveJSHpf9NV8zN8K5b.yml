  - description: Last follow-up commit touched 3 files (7+/4-), over pr-workflow.md's 2-file simple bar, yet I gave it only my own read, skipping code-review. Gate passed.
    solution: Count files against the simple-change bar before choosing the review path, or run code-review on any follow-up that is not clearly simple.
    severity: minor
  - description: "I did not invoke adr-check myself before relaying and recommending the Fable proposal; I only asked the subagent to run it (the gap audit-skills flags in #2286)."
    solution: Invoke adr-check in the orchestrating session before presenting a recommendation, even when a subagent already did.
    severity: nit
  - description: "My first summary of the inspection relayed subagent claims unverified and was wrong in places: note lengths 110-142 (actual max 113), one state called hearsay was live-read, sequential dispatch called unique to 10-20."
    solution: Spot-check each number and quote against the flattened events before summarising a subagent report.
    severity: minor
  - description: The first check-states heuristic misfired on 222 claims across the current Inventory; the Spec reviewer caught it after the first commit and I reworked it.
    solution: Measure a new heuristic against real historical diffs before the first commit.
    severity: nit
