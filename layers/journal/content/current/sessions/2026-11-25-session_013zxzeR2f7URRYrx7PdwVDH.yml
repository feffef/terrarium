frictions:
  - description: Ran git fetch and a GraphQL gh issue list before reading git-conventions.md and github-integration.md, which CLAUDE.md requires first; the gh call 403ed.
    solution: Read both docs at the first git or GitHub call; a hook hint at the first fetch would have prompted it.
    severity: nit
  - description: Drafted two issue bodies with a session id I had not looked up, then caught it before posting by calling get_session.
    solution: Print the session id once at the start (get_session) and paste from it; the system prompt's commit template gives it.
    severity: minor
  - description: My first apply script re-serialized every Inventory yml (1815 deleted lines) because the yaml library reflowed old block notes; I redid it as a text append.
    solution: audit-skills could ship a small append-observation script so each run does not hand-roll one.
    severity: minor
  - description: Edits blocked while the scoped gate ran (gate-edit guard); a sleep command and a double-background call were also refused.
    solution: Plan the edit before starting the gate; use Monitor with an until-loop to wait.
    severity: nit
  - description: Two bash cd calls left the shell cwd inside the skills folder, so later relative paths needed a reset.
    solution: Use absolute paths in grep calls instead of cd.
    severity: nit
  - description: The skill asks for 15 per-Skill subagents each run; most only re-confirmed known repeats, so a large share of tokens bought no new finding.
    solution: Let step 2 skip a Skill whose newest note already covers its runs, with a one-line clean verdict.
    severity: minor
