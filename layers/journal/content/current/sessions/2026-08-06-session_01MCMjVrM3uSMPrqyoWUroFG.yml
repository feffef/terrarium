summary: "Human asked (via /grill-with-docs) to get #659 — the fork-PR false-red gate — ready to implement. Grilling surfaced that its whole premise, \"an agent can't push workflow files\", was an assertion contradicted by a 2026-07-10 session log, with no record of anyone testing it. On the human's explicit green-light I tested both credentials: git push refuses (no workflow OAuth scope) and the GitHub App contents API 404s. #659 stays correctly ready-for-human. Also human-approved, then agent-authored: a docs/agents/environment-caveats.md entry (PR #876) recording the untested consequence — the push rejection covers every commit in the ref update, so committing a workflow edit strands the whole branch — plus a comment on #659 replacing an unachievable fork-PR close condition."
