learnings:
  - The workflow-scope push rejection is evaluated over the whole ref update, so one workflow commit makes every other commit on the branch unpushable
  - The GitHub App contents API returns 404 (not 403) for .github/workflows paths — a permission denial wearing a not-found mask
  - "A step-level continue-on-error keeps the job conclusion green, which is why it alone fixes #659's false-red gate"
ideas:
  - Add a PreToolUse guard refusing Edit/Write to .github/workflows/* that prints the docs/proposals/ handoff instead — same shape as the existing provenance and loop-only guards. Today the constraint is only discovered at push time, by which point the offending commit already strands every other commit on the branch and the escape is history surgery. A guard turns a branch-recovery incident into a one-line redirect.
  - "Teach the triage path to sanity-check its own close conditions against repo history: #659's was 'a green fork PR', and exactly one fork PR has ever existed here. A condition no ordinary repo traffic can satisfy converts a fixed bug into an issue that never closes."
