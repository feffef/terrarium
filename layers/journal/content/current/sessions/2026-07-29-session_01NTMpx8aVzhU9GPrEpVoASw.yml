  - A surveyor intake Skill that sweeps recent history (closed-unmerged PRs, branches past the 30-day dormancy floor, lockfile-dropped dependencies, deleted files), applies the two-gate test, and files candidate issues or draft YAML for the curator to grade — mechanize discovery, keep grading curator-authored, so the Midden keeps growing without manual noticing.
