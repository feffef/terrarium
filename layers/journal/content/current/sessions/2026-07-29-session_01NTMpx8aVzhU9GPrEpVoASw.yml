frictions:
  - description: "Two artifact records contained latent inaccuracies only a primary-source dig exposed: a continuityCheck counting components that never existed and an inscription quoting a key the file never contained."
    solution: "Curation passes should read the referenced revision, not trust the earlier record — the midden-survey Skill's draft-provenance step already pushes this; fixed both records in PR #731."
    severity: minor
  - description: MiddenArtifact.vue's comment says validate-content-refs catches a bad embed slug, but the validator has no embed-side check at all.
    solution: Fix the comment or add the embed-side check (idea 1 of this session's proposals) — both directions of the page-body/artifact reference.
    severity: minor
  - description: git push --force-with-lease rejected with stale info because the pre-cloned environment carried a remote-tracking ref for a branch the remote no longer has.
    solution: git remote prune origin before the first push of a session whose branch name predates the clone; plain push then succeeded.
    severity: nit
  - description: A git checkout -- used to restore a negative-test edit silently reverted that file's own uncommitted backfill too — caught only because the post-restore diff came back empty, then re-applied.
    solution: "CLAUDE.md's check-first discipline applies to single-file checkout restores as much as reset --hard: stash or commit pending edits before any discard-and-restore probe on a file you have modified."
    severity: minor
  - description: Stop hook flagged inherited origin/main commit adb167c as Unverified alongside this session's own tip; signing key unprovisioned so the suggested --reset-author remedy could fix nothing.
    solution: Followed CLAUDE.md's existing guidance (check origin/main..HEAD, known platform limitation) — no doc change needed, just noise.
    severity: nit
