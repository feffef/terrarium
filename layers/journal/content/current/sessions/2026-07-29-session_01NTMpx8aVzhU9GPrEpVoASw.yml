learnings:
  - mcp github list_branches can never surface a deleted branch — a dead branch's only remaining trace is its closed-unmerged PR's head ref
  - git log --diff-filter=D with -M reclassifies moved files as renames, giving a free mechanical slice of the Midden's Gate B
ideas:
  - "Extend validate-content-refs' Midden pass to parse each trench site page body for ::midden-artifact{slug} embeds and enforce both directions: every embed names a real artifact stem, and every artifact YAML is embedded at least once in its declared site. Today a typo'd embed silently renders the \"Artifact not found\" fallback in production and an orphaned artifact is invisible."
  - A "resurrection watch" script or chartered Skill that mechanically re-runs Gate B per provenance kind (dependency absent from package.json, file absent from origin/main, branch still deleted, PR still closed) and flags artifacts whose corpse grew back for curator re-assessment — flagging only, never re-deriving condition. scripts/midden-survey.ts's provenanceKey/screen helpers are a ready substrate for it.
  - "A Midden season-closing ritual: a documented convention (CONTEXT.md or a small Skill) for when the curator closes the open-ended current-midden stratum — name it, set its end date, open a fresh one, re-file settled finds — plus a text-only strata summary (label, range, find count) on the landing for orientation without resurrecting the removed gauge."
