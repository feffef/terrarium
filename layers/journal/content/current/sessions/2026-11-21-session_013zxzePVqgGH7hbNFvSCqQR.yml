frictions:
  - description: Ran git fetch origin main before reading docs/agents/git-conventions.md, against CLAUDE.md's 'Before your first git command' trigger; a hook flagged it.
    solution: Read git-conventions.md at session start in clear-backlog runs, since §1 needs git history; the hook reminder worked.
    severity: nit
  - description: "Relabelled #3551 before reading docs/agents/triage-labels.md (CLAUDE.md 'Before you file, triage or label'); the doc showed the call was right."
    solution: clear-backlog §2 could name triage-labels.md where it says to set the label the answer implies; it already does, I skipped it.
    severity: nit
  - description: Read only the external-PR section of docs/agents/issue-tracker.md by grep, not the whole doc as CLAUDE.md asks once triage is involved.
    solution: Read the doc whole once per session when a trigger applies.
    severity: nit
  - description: "My #3552 brief asked to edit a Glass Box sentence without noting the page is pinned to an older revision, so a reviewer raised an owner-call I then had to judge."
    solution: When verifying a brief that edits Glass Box prose, check the page's revision pin and state in the brief whether the edit is wanted before a re-pin.
    severity: minor
  - description: A cd into a worktree inside one Bash call moved the session's primary working directory; I had to cd back.
    solution: Use git -C and absolute paths for worktree commands, never cd, as dispatch-subagents §5 implies.
    severity: nit
  - description: Builders replied 'recheck Both' on a branch with a Standards+Spec pair; 'Both' is also the small-branch reviewer's name, so the axis list was ambiguous.
    solution: In clear-backlog-build.js rules(), have the builder name the axes it means (Standards Spec) rather than 'Both' on a non-small branch.
    severity: nit
  - description: "The #3551 builder's first gate:scoped failed only on the wall-clock ratio test in tests/unit/shell-reads.spec.ts, on a content-only diff; an unchanged rerun passed."
    solution: Make the shell-reads linearity test robust to a loaded container (e.g. compare operation counts, not wall-clock ratios), since two gates run at once.
    severity: minor
