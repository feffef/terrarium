frictions:
  - description: Ran git fetch and git checkout -- on the Blog layer before reading git-conventions.md; a hook told me afterwards. I had saved the sample diff first, so nothing was lost.
    solution: The late-read hint arrives after the command; list fetch and checkout among the read-first triggers, or load the doc at session start.
    severity: minor
  - description: "Skipped the prototype Skill's capture step: the 3600 sample code was discarded, with its diff only in the ephemeral scratchpad, not on a prototype branch or the issue."
    solution: Push the sample to a prototype/ branch and link it on the issue before discarding the code.
    severity: minor
  - description: Q5 of the grilling list had no lettered options, so the owner's answer '5a' was ambiguous and I had to interpret it as accepting my picks.
    solution: Label every choice a), b), c) even when the only choice is accept or change; clear-backlog already says so.
    severity: nit
  - description: A builder reply on the small Blog branch asked for a 'Standards' re-check, but small branches only have a Both reviewer; I had to map it myself.
    solution: Have the build workflow's rules() tell a builder on a small branch to name Both in its recheck axes.
    severity: nit
  - description: A Spec reviewer filed an owner-call finding that the PR body must mention the stale premise; it is an orchestrator duty, not a code change, and cost a triage line.
    solution: Say in reviewPrompt() that PR-body duties are not findings.
    severity: nit
  - description: I opened the first PRs and moved on without calling subscribe_pr_activity; the Stop hook had to ask for it. I subscribed to all five PRs afterwards.
    solution: clear-backlog section 4 could name the subscribe step beside opening the PR, since ADR-0003 says it only in prose.
    severity: minor
  - description: "Retro (builder): the tenant-glossary guard blocked its first three parallel Edits until it read layers/glassbox/GLOSSARY.md, a 199-line read made only to satisfy the guard."
    solution: In rules() of .claude/workflows/clear-backlog-build.js, tell the builder to read the Tenant's GLOSSARY.md before the first edit to that layer.
    severity: minor
  - description: "Retro (builder): the brief's flock e2e command contains '; echo EXIT=' while another rule bans chained commands, and a stale e2e.log could be mistaken for the new result."
    solution: Have rules() in clear-backlog-build.js delete the log before each e2e run and exempt the flock command from the chaining rule.
    severity: nit
  - description: "Retro (reviewers): the rule-use hook asked read-only review subagents for a second echo rule-use call listing rules unrelated to their review; pure overhead."
    solution: Skip or shorten the rule-use prompt for read-only review subagents in the SubagentStart hook under scripts/hooks/ (not located).
    severity: nit
  - description: "Retro (reviewers): the brief asked for a StructuredOutput result while the resume protocol asked for a JSON file and a one-line reply, so they reconciled two formats."
    solution: State the resume hand-off format once in reviewPrompt() of .claude/workflows/clear-backlog-build.js.
    severity: nit
  - description: "Retro (reviewers): the pointer to section 3 of the code-review Skill mixes the smell list with sub-agent spawning steps, so reviewers read past what they needed."
    solution: Point reviewers at the smell list's line range in .agents/skills/code-review/SKILL.md, or paste it into reviewPrompt().
    severity: nit
