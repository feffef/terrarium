frictions:
  - description: Ran `git checkout origin/main -- layers/journal/content` before reading git-conventions.md, which forbids checkout of a ref onto paths (it stages them).
    solution: Read git-conventions.md before the first non-read-only git command, as CLAUDE.md says; it was a no-op only because the branch equalled main.
    severity: moderate
  - description: "Relayed two of #3009's reasons for excluding always-loaded rules as if sound; the owner had to point out they were weak."
    solution: Before passing on a prior decision's rationale, test each reason against the current goal (CLAUDE.md, Question the premise).
    severity: moderate
  - description: First migration script was not idempotent; after an interrupt, re-running it would have deleted the new steered/backed values.
    solution: Write data migrations to leave already-migrated values untouched, so a partial run can be resumed.
    severity: minor
  - description: A half-finished export rename in rule-use.ts made a Bash PreToolUse guard crash on import, blocking every Bash call until fixed via Edit.
    solution: Guards that import session modules could fail open on an import error, or rename an export and its importers in one edit.
    severity: minor
  - description: The nuxt dev server reloaded the SessionCard template but not the edited dashboard.ts utils, so one screenshot mixed old and new code.
    solution: Restart the preview server after editing a layer util before a screenshot (or note it in verifying-ui-changes.md).
    severity: minor
  - description: Editing files while gate:scoped ran aborted it twice; each fix round meant a full gate rerun.
    solution: Batch review fixes and start the gate only once no more edits are pending.
    severity: minor
  - description: First Agent call blocked by the dispatch-read guard because dispatch-subagents had not been read.
    solution: Read the dispatch-subagents Skill before the first subagent brief, as CLAUDE.md says.
    severity: nit
  - description: Code-review spec file I wrote for the reviewer left out the owner's 'always loaded' tag decision, so the reviewer flagged it as scope creep.
    solution: Copy each owner decision into a review spec from the issue comment, not from memory.
    severity: nit
