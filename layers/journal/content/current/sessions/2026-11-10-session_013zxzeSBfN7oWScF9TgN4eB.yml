goal: Show rule use on the Journal session card, and make agents rate every loaded rule
status: completed
outcome: "Merged as PR #3041 after two rounds of test sessions came back clean; #3020 closed"
summary: "The owner asked for a grilling on issue #3020 (the session card showed \"no verdict provided\" for every log since ruleUse replaced ruleVerdicts). Every design choice was settled with the owner over many rounds and posted on #3020. Human-decided: show ruleUse on the SessionCard only, grouped by Main session and Subagents, with per-rule shares over answering subagents; rename the values to steered | backed, dropping none and unsure, and rewrite the 16 existing logs, with ADR-0009 changed to allow that; rate always-loaded rules too (via: start), reversing a #3009 exclusion the owner judged wrong; give each subagent its own list of loaded rules at rating time rather than asking from memory; rename the human-merge rule's heading. The owner also asked for Sonnet test sessions with realistic tasks, repeated until the process worked, workflows included. Agent-found and fixed after review or testing: the ask could repeat forever on a second bare call; rules named but never loaded vanished from the card; a call the permission classifier denied counted as an answer; the classifier denied `sh helped.sh` for read-only agents (the owner chose `echo rule-use:` instead); `backed` was under-reported where the task said the same (the owner approved new wording); a rule read as a file never showed as loaded (the owner approved `via: read`). Round 2 of the three test sessions (subagents with Explore and code-review, a 3-agent workflow, main agent only) was clean. The six test sessions are idle; asked the owner whether to archive them so their held logs never land. The owner merged PR #3041 and #3020 closed."
