learnings:
  - The Claude Code auto-mode classifier can deny `sh <repo script>` for read-only subagents (Explore) as risky; a plain `echo` passes.
  - "Inferred, not verified: once an agent reads a rule file directly, the harness may skip that rule's later path-scoped load, so the rule never shows as loaded."
  - A PostToolUse hook can find a subagent's own transcript from the payload's agent_id plus the parent transcript_path; the subagent transcript carries its own `instructions` attachment with the always-loaded rules.
ideas:
  - "A reusable test-session harness Skill: spawn N Sonnet sessions on a branch with a realistic task each, a fixed evidence script and a report format, then diff their reports. This session hand-built one and it found four bugs unit tests missed."
