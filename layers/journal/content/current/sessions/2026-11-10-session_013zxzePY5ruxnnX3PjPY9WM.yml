summary: "Scheduled audit-docs run; no human prompted any step (all agent-initiated). Three read-only reviewers returned 9 findings (Freshness 0, Single-home 6, Coherence 3); no overlaps. One checker returned 1 CONFIRMED-BUT and 8 WRONG. The 8 WRONGs were duplicates that are really a specific case plus a pointer (B1, B3, B4), text covered by open prune trials (B2, C2), placements stated by a commit or issue (B5, B6), an invented \"10 lines\" definition (C2) and a text that was not ambiguous (C3). The survivor was ADR-0009's claim that read-first-hint.ts is the one reminder hook; merge-close-stop.ts also blocks one stop after a merge. I fixed it in place, restamped the rule, ran Standards and Spec review (clean, one wording nit applied) and gate:scoped (green), pushed, opened PR 3028 and subscribed. The PR touches an ADR, so it was escalated; a human merged it later (the merge event arrived hours after CI went green). No sweep PR (no other fix survived) and no issue filed. Two commits instead of one because an amend of the pushed commit was denied. A human asked \"You didn't log yet?\" after the in-review log had already landed; that was a check, not a missed PR-open log. Covered: CLAUDE.md, GLOSSARY.md, GLOSSARY-MAP.md, docs/agents/*, tests/README.md, ADRs 0003 0004 0009 0027, glassbox and commons GLOSSARY.md, Skills close-session code-review dispatch-subagents clear-backlog dependabot-sweep."
