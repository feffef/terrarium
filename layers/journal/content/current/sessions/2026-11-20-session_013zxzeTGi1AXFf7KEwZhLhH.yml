summary: "Scheduled prune-trial run, no human prompts. Everything was agent-initiated under the Skill. Judged the owner-facing UI trial (friction share 3.7% to 4.3%, 8/216 to 2/47) and the glassbox-curate read trial (6.1% to 0%): both hold, entries deleted, no issue. Left the pr-workflow trial (judgeable 2026-11-22). Criterion-1 subagent search found failed-prose candidates; the two best (tenant-glossary rule, edit-during-gate-run) were already 13-31 words and held by guards, so I trimmed dispatch-subagents section 3 (-3 lines, justifications only, every rule kept) and opened it as a trial, marking subagent-brief-defects on-trial after the Spec reviewer noted it. Sonnet probe at the pinned SHA passed; gate:scoped passed; code-review found no dropped rule. Honest limit: the cut is tiny because the Skill was pruned several times before. PR 3521 merged after green CI (merge 8b73b145)."
