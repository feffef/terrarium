outcome: "PR 3334 open: denied dispatches are tagged in the log and hidden on the card; waiting on CI and merge"
summary: "The owner asked why a session log listed several \"Frictions survey\" subagents; I traced it, on their request, to a guard denying the first Agent calls, which the trace still logged as stat-less entries. Human-instructed: the explanation, finding a smaller example session, confirming the cause with /inspect-session on its events (first call blocked by the dispatch-read guard, second ran), tagging with an optional schema flag, hiding tagged rows, naming the flag (an enum outcome was dropped for a boolean denied because outcome already means something else on every log), no backfill, the preview, \"yes\" to open the PR, and \"you may merge it yourself\" (the owner waiver for a Human-only schema file). Agent-initiated: the review-fix commit (one home for the flag's meaning, hoisted id, flatter fold), opening and subscribing to the PR under ADR-0003. Dropped on the way: hiding via the token bar, since denied entries have no share anyway. Open: extract-frictions collapseSubagents still counts denied entries; I left it as a separate follow-up. The preview used a temporary copy of a real log with the flag set, deleted afterwards."
