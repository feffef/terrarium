frictions:
  - description: Started pnpm gate:scoped before running code-review, so the gate-edit guard blocked the review fixes and I had to stop the gate and rerun it.
    solution: Follow pr-workflow order, review first, then gate only on the final head; the doc already says it.
    severity: minor
  - description: Hand-typed the session id in the first commit message and got it wrong; caught it in the file before committing.
    solution: Copy the id from the system-prompt template, as ADR-0017 says, or generate the message file from it.
    severity: nit
  - description: Previewing needed a temporary copy of a real log in the content folder and a hand-written Playwright script, and the original card's head was not clickable, so no side-by-side shot.
    solution: A preview option that takes a fixture session log and expands a named card would spare the manual steps.
    severity: minor
  - description: My new tests failed twice on expectations I guessed wrong (1m 0s label, token share 50, missing timestamps in a fixture).
    solution: Run the spec once while writing assertions, or copy an existing test's fixture shape.
    severity: nit
  - description: Proposed and then built a survey follow-up whose benefit I could not state when asked; the premise check CLAUDE.md asks for came only after the gate and review.
    solution: Before offering a follow-up, name the reader it helps and what decision changes; drop it if none.
    severity: minor
  - description: Told subagents to run no command while also asking them to read each rule's paths, so four could not verify their path-based labels.
    solution: Paste each rule's paths into the brief, or allow reading the rule files.
    severity: minor
  - description: Posted the issue 3017 comments with miscounts and one wrong claim about which agents said what, and fixed them by editing the comments three times.
    solution: Recompute every count from the log with a command, and re-read each claim against the replies, before posting.
    severity: minor
  - description: Answered eight rounds of another session's open-ended rule-rating iteration, resuming five subagents each time, with no stop point agreed until I raised the cost.
    solution: Agree a round limit up front, ask the subagents once and reuse their labels where the wording change cannot affect them.
    severity: moderate
