learnings:
  - A guard-denied Agent call is still logged as a subagent entry with no stats, so duplicate same-task entries in a session log usually mean a denied first attempt, not parallel agents.
  - A subagent resumed with SendMessage may re-deliver its earlier report before answering the new question, so ask for a reply that starts with a fixed word and re-ask once if it is missing.
  - Sibling reviewers of the same diff gave different labels for the same rule depending on whether they had checked it against the rule, so a rating scheme needs the check stated in its definition.
ideas:
  - Let `scripts/ui/preview.ts` take a fixture session log and a card id, so a Journal card change can be previewed and screenshotted without copying a real log into the content folder and hand-writing a Playwright script.
