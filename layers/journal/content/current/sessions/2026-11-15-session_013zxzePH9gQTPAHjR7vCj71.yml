summary: "The owner asked why a session log listed several \"Frictions survey\" subagents; I traced it, on their request, to a guard denying the first Agent calls, which the trace still logged as stat-less entries. Human-instructed: the explanation, finding a smaller example session, confirming the cause with /inspect-session on its events (first call blocked by the dispatch-read guard, second ran), tagging with an optional schema flag, hiding tagged rows, naming the flag (an enum outcome was dropped for a boolean denied because outcome already means something else on every log), no backfill, the preview, \"yes\" to open the PR, and \"you may merge it yourself\" (the owner waiver for a Human-only schema file). Agent-initiated: the review-fix commit (one home for the flag's meaning, hoisted id, flatter fold), opening and subscribing to the PR under ADR-0003, and the verdict comment and merge once CI was green; the merge used merge-pr.ts with the owner's quoted word. Dropped on the way: hiding via the token bar, since denied entries have no share anyway. I proposed filtering denied entries out of the frictions survey too and the owner said yes, so I built and gated it (extract-frictions toTriageSession), but when the owner asked why it helps I found the benefit marginal (the survey only reads subagents in two edge cases, and old logs are not backfilled), and on their word to close I dropped it without a PR; the two commits stay pushed on the session branch. The preview used a temporary copy of a real log with the flag set, deleted afterwards. After closing, another Claude session working on issue 3017 sent messages asking how I and my five finished subagents would rate the rules we loaded; I held off until the owner said to answer and act for that session, then ran eight rounds (four comments on the issue, then four by message only) resuming the subagents each time, as the owner instructed. I changed no rule, code or log in that work."
