outcome: Rule and five reopened entries merged in PR 2846 after a green gate
summary: "The owner asked why the stop-hook-nag cluster was still accepted after fix 2828. I traced it: the ledger never recomputes the accepted status, and nothing reset it when a fix was recorded. The owner chose (human-instructed) to change the rule, and answered two design questions: reset at write time in ledger-set.ts, and any recorded fix triggers it. I built that with a test and comment updates. A mid-session ask from the owner (human-instructed) had me list the other accepted entries that got fixes after acceptance; the owner then said to reopen those six in the same PR. I reopened five, because relayed-subagent-claims was re-accepted after its last fix; I found that while verifying, and the first list (from git first-add dates) was wrong about it. The owner also asked why acceptance has no UTC timestamp; I answered that none is stored, offered a proposal, and did not build it (a stored field needs the owner to settle its shape). Agent- initiated: the review round (code-review, two small fixes), softening the stop-hook-nag note, and opening and subscribing to the PR as ADR-0003 requires, and merging it with merge-pr.ts once CI was green and no ADR-0004 exception applied (merge commit cb0861688). Open: whether the stop-hook-nag ref condition counts as met is the owner's call; stale ref text on the reopened entries is kept as history."
