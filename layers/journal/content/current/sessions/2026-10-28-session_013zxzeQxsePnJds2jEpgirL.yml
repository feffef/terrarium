outcome: "PR 2620 merged green: Journal dashboard capped at 1000 sessions, e2e reads SSR HTML in Node"
summary: "Human-instructed: the owner asked why daily digests couldn't archive older sessions and to fix the e2e test; after I laid out three options they chose \"test fix plus shrink the page, limit to 1000 sessions\" and added \"don't delete sessions, filter them\". The 2026-10-28 digest session log gave the cause; I reproduced it (sweep, build, smoke spec): /t/journal/archived was 10.4 MB with 1153 sessions, past Chrome's response-body buffer, so response.text() threw. Fix: the dashboard query loads the newest 1000 sessions and labels the filter; expectServerRendered refetches HTML in Node. Agent-initiated: an e2e test for the cap (so ADR-0004 lets an agent merge), leaving the sweep itself to the next digest run, and the review fixes (headline wording for any Space, one home for the label). Open: the tile and browse pages still count differently from the capped dashboard on archived; the archived page is 9.3 MB and still heavy."
