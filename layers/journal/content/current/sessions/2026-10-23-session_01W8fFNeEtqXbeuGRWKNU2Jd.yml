summary: "Human-instructed: the owner ran /clear-backlog with \"full sweep except for the node and typescript update issues\", then picked full-sweep mode and left out #2373 and #2432 (time-boxed). The explore workflow triaged 12 issues: 11 grill and 1 blocked (#2433 waits for #2432), none build. I verified the picks' key claims on origin/main (adr-check retired in 46886f5a7, #2368 merged, trial verdict in #2324, open prune trials, the 2231 branches) and grilled Q4-Q14 in one round. Owner answers: deferred #1689 and #1904; un-park #2231; park #2426 on the long-command trial; build #2338 and #2449; keep the Bash rules hint (closed #2167); closed #2145, #2332 and #2342 as not planned; left #2352 open until #2373. Agent-initiated: issue #2456 for two Glass Box pages that still mention adr-check. The owner then asked to build #2338 now and to merge its PR themselves after the frictions-to-fixes SKILL.md trial is judged (PR #2457, two minimal SKILL.md pointers), and told me to merge #2231 and #2449 myself. Open judgement calls on #2457: the undocumented empty --replace-fixes, append() naming, and usage text written twice. PR #2458 (#2231) un-parks the accordion pin-wait test fix with main merged in; I cut its spec comment to one line so the cause stays in one place, the ledger entry. PR #2459 (#2449) adds prune-friction-ledger.ts --move; open calls on it: an unreachable survival-failure throw and nested describe blocks. After the trial was judged (df8fb8d2f), the owner picked Q15 b): I added the SKILL.md section 7 pointer and refused an empty --replace-fixes; a two-axis code-review moved that check into setEntry, and the owner merged #2457 by auto-merge."
