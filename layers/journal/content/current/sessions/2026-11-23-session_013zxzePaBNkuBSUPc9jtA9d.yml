learnings:
  - A per-element overflow scan flags code blocks and decorative SVG children even when the page itself does not scroll; check documentElement.scrollWidth first, and skip 0x0 hidden links in tap-target scans.
ideas:
  - "[content editor, UI tester, blind] / Midden Today's find card: the card shows a 200-330 word dig report that fades out mid-sentence, with figures swamping a teaser slot and no read-more cue besides the title link. Show a one-sentence teaser plus a visible 'Read the full find' link, so a phone visitor can scan it."
  - "[content editor, blind] / Glass Box card: the 'Lesson of the day' label reads 'INSTALLED SKILLS' (a section name) above 'Planning skills', with the button 'Start with the Glass Box'. Label it 'Lesson: Planning skills' so a visitor knows what the teaser is."
  - "[content editor, blind, UI tester] / Journal digests card: the two or three latest digests fade out mid-sentence ('...and a new guard checks code...'). Give each a short headline or cut to the first clause so the teaser reads whole."
  - "[content editor] / intro: 'People steer, and have to manually merge only the risky changes' is awkward and 'manually' is redundant. Change it to 'People steer, and merge by hand only the risky changes.'"
  - "[content editor] / section taglines: the Blog tagline 'Recent interesting events, retold in several voices, and discarded work curated like a museum' also describes the Midden, so it reads as a leftover. Shorten it to describe only the Blog's block."
  - "[UI tester, blind] / hero: the jar drawing sits behind the intro paragraphs and its lines cross the text at 390px (home390.png, y=230-600). Fade it further under the text so reading stays easy."
