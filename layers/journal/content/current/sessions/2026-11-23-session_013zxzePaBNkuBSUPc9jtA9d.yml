summary: "Scheduled visitor-loop run, no human prompt; everything here was agent-initiated by the schedule. Focus: homepage (entry /, row 6 of the rotation for 2026-11-23). Built origin/main (eca2bf0c), served a production preview, wrote a context file and sent a blind first-time visitor, an informed content editor and an informed UI tester (all sonnet). Yield: blind 7 findings and 3 ideas, editor 7 findings and 3 ideas, UI tester 7 findings and 3 ideas. After checking against source and the rendered page, no bug survived, so no issue was filed. Dropped as not reproduced: Tinkerfund prod and Midden/trench overflow at 390px (documentElement.scrollWidth is 390; only internal elements extend), Tinkerfund campaign link lacking a name (its accessible text is figure label, title and 92% funded). Dropped by decisions.md: Marquee and Commons links on the homepage, reading-order or orientation strip, jargon line in the hero, clickable jar, Journal \"up to mid-November\" blurb (already ruled a dated story on 11-19). Dropped as out of focus or already logged: Journal counters without definitions, 404 links. Dropped as exempt: 21px inline prose links (WCAG 2.5.8). Filter misses: two visitors (blind, UI) claimed overflow or a nameless link without the page-level measure; the content editor guessed the Journal blurb text was homepage copy. Retros: blind said the SubagentStart rule-use echo ran twice and rated four irrelevant ADRs, asking for it to be skipped for read-only visitors (hook path unverified); editor said breadth-first crawling from a one-page focus spent 10 of 16 pages in Glass Box and Blog, and the brief gave no width guidance for a homepage focus (it took no 390px shot); the UI tester's resumed reply repeated its visit report instead of a retro."
