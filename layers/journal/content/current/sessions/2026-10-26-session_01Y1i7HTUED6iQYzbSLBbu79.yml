frictions:
  - description: Called search_issues without fields; the search-fields guard blocked it and I had to read github-integration.md first.
    solution: Read github-integration.md before the first GitHub call, as CLAUDE.md says.
    severity: nit
  - description: Ran extract-frictions twice; both runs write the same /tmp output file, so the second overwrote the first and I had to rerun.
    solution: Have extract-frictions take an output path or name the file by --since.
    severity: nit
  - description: The code-review Standards subagent ran git checkout --detach despite a read-only brief; it switched back, nothing lost.
    solution: Brief read-only reviewers to use git show, never checkout.
    severity: minor
  - description: Stop hook asked to push three times while the probe and gate were pending; ADR-0004 says review and gate first.
    solution: "Let the Stop hook skip its push nag while a background gate or agent runs (known, #2233)."
    severity: nit
