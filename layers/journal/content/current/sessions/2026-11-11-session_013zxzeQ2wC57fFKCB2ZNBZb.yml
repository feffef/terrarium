    severity: nit
  - description: get_session was not available, so the run's cost_usd could not be read and the PR says unreported.
    solution: Say in the Skill how to read cost when no get_session tool exists, or allow unreported as the Skill already does.
    severity: minor
  - description: plain.ts pastes term definitions inline and strips link text, so fresh readers kept reporting those artifacts as confusion and I had to filter them out.
    solution: Have plain.ts keep terms as a short gloss outside the sentence, and keep link labels, or tell readers about both artifacts in the brief.
    severity: minor
  - description: The Stop hook asked me to commit while a writer was still editing, forcing a partial commit of one writer's files.
    solution: Brief writers to commit their own pages in a worktree, or have the hook skip while a subagent runs.
    severity: nit
