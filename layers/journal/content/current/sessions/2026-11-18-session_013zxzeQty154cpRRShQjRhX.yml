learnings:
  - The Stop hook flags unpushed commits even before the PR step, so pushing the branch right after committing avoids that nudge.
ideas:
  - The dispatch-read guard blocked the first Agent or Workflow call in most scheduled Skills this window (digest, blog-post, clear-backlog, visitor-loop, glassbox, others), and each Skill's observation proposes the same wording fix. Exempt a session that has the dispatch-subagents Skill loaded, or let the guard point at the Skill and allow one retry, instead of editing every Skill.
