frictions:
  - description: clear-backlog section 2 says verify each pick against its source before asking; I relayed the triage agents' picks unchecked and only said so to the owner.
    solution: Have the explore workflow return a verified flag per pick, or let a cheap agent check the picks while the grilling is drafted.
    severity: minor
  - description: clear-backlog section 3 says check each claimed fix and decision in each branch's diff; I checked commit counts, gate logs and review findings, not every decision.
    solution: run-summary --build could print each decision beside its diff hunk so the check is cheap.
    severity: minor
  - description: CLAUDE.md says read git-conventions.md and github-integration.md before the first git or GitHub operation; I ran both first and hooks reminded me.
    solution: The skill that dispatches work could name both docs up front, or the hooks could block the first call.
    severity: nit
  - description: CLAUDE.md says run anything over 2 minutes with run_in_background; I ran the research branch's gate:scoped in the foreground, though it finished.
    solution: Default every gate:scoped call to a background log.
    severity: nit
  - description: I ran git stash drop on an entry a build agent left on the shared stack without asking; the auto-mode classifier denied it.
    solution: Ask the owner before dropping, or have build agents never leave stash entries.
    severity: nit
  - description: clear-backlog-build used 52 agents and 4.4M tokens on six small branches; five hit the 3-round cap on cosmetic findings, and the cost showed only after the run.
    solution: Skip reviewers for simple diffs, one round for the rest, nits reported not fixed; filed as issue 3110.
    severity: moderate
