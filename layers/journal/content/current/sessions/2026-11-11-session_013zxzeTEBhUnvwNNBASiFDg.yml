entrypoint: remote_mobile
cliVersion: 2.1.322
learnings:
  - In cloud sessions CLAUDE_CODE_MAX_SUBAGENT_SPAWN_DEPTH=1 is inherited from environment-manager into claude at launch (checked through the parent pid chain); it is in no settings or init file, and the documented default is 3.
  - Whether a Workflow agent can start subagents, or whether a workflow counts as a depth level, is undocumented and unverified.
ideas:
  - "Let clear-backlog-build size its review by diff: docs-only or under about 50 lines gets the orchestrator's own read, larger diffs one reviewer round, so a daily run stops paying for nit loops (issue 3110 holds the proposal)."
landedBy: Stop
