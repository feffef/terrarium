frictions:
  - description: Ran git fetch in the same batch as reading git-conventions.md, so the required read came after the first git command.
    solution: Read required docs in their own call before any git command.
    severity: nit
  - description: First PR body miscounted fact-check verdicts; I caught it and corrected the body before CI.
    solution: Tally verdicts from the checker reply before writing the body.
    severity: nit
  - description: Single-home reviewer covered only a fraction of the docs and had to be resumed, doubling its cost.
    solution: Brief reviewers with an explicit file list and ask for coverage in the reply.
    severity: minor
  - description: Stop hook asked to push twice while the review and gate were still running, against the push-after-gate rule.
    solution: Stop hook could skip its nag when a gate run is in flight.
    severity: nit
