summary: "Owner invoked /clear-backlog. The sweep found four needs-triage issues (2997, 2996, 2992, 2987); the seven others were skipped because an agent commented last, and none was ready-for-agent. The explore workflow triaged them and labelled the three grill issues ready-for-human. One grilling round followed. Owner answers (human-instructed): 2996 parked until its prune trial ends; 2997 closed as wontfix, no change; 2987 fixed in glassbox-curate. 2992 is time-gated to 2026-11-12 and goes in the report. I labelled 2987 ready-for-agent and closed 2997 on those answers. Mid-build the owner refined the 2987 pick to state the rules as Done-when conditions, so I stopped the running build and re-ran it with the new brief (agent-initiated mechanics, human-instructed change). The build hit its 3-round review cap with only cosmetic findings; I fixed those by hand, passed gate:scoped on the final head, pushed to fix-2987-glassbox-curate-rules (a branch other than the session branch, as clear-backlog section 4 directs) and opened PR 3001, subscribed. Open: CI, my verdict, merge, and the owner's call on the two judgement calls in the PR body. I read my own follow-up diff instead of re-running code-review on it; pr-workflow wants code-review for a follow-up that changes a Skill's meaning, so that is a deviation I disclosed in the PR body."
