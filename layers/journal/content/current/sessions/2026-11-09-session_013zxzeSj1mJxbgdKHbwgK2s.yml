frictions:
  - description: Launched the explore workflow before reading dispatch-subagents; the dispatch-read guard denied it and I had to read the Skill and retry.
    solution: The guard is the fix; a saved workflow that builds its own briefs could be exempt from it.
    severity: nit
  - description: Ran git rev-parse before reading git-conventions.md; a hook then demanded the read. The doc showed the call was already fine.
    solution: None needed; the hook caught it with no cost.
    severity: nit
  - description: Read ADR-0005 and ADR-0027 only after a hook demanded them following my SKILL.md edit, not before editing.
    solution: Read the governing ADRs when the Skill is first opened; the edit was consistent with both.
    severity: nit
  - description: Owner refined the 2987 pick after the build had started, so I stopped the workflow and re-ran it; the first build's agent time was wasted.
    solution: Ask whether a pick has further wording before starting its build, when the answer says 'b' to prose-style choices.
    severity: minor
  - description: The 2987 build ran its 3 review rounds and returned failed on three cosmetic findings; two review rounds went to rewrapping and wording churn.
    solution: Treat cosmetic-only findings as a stop condition for the review loop so the branch returns ready-to-push.
    severity: minor
  - description: Did not run code-review on my follow-up commit that moved a Skill sentence; pr-workflow says a Skill-meaning follow-up gets its own review. I read the diff and disclosed it.
    solution: Run code-review on the follow-up diff, or state in pr-workflow that a reorder of an already reviewed sentence counts as simple.
    severity: minor
