frictions:
  - description: "Issue #1092's locked design was a script hitting GitHub's REST search endpoint, which returns 403 through the session proxy; the script could never run here. Converted the PR to doc-only after the reviewer probed it."
    solution: Triage should probe an endpoint once before locking a script design on it; github-integration.md now records the block.
    severity: moderate
  - description: "Issue #865's locked design named scripts/session-trace.ts as a file to merge into the lander, but two of the lander's imports depend on it, an import cycle. The implementer refused with proof."
    solution: Check the import graph before locking a "merge these files" design; one grep would have caught it.
    severity: moderate
  - description: 'Four guard implementations arrived over-built despite a "keep it small" brief: helpers with one caller, predicates that existed only to be tested, 14 tests for a boolean. Every Opus review cut 30 to 50 percent.'
    solution: Brief implementers with a line budget and a test-count ceiling up front, as later dispatches did; consider adding that to dispatch-subagents.
    severity: minor
  - description: PR 1157 conflicted with PR 1156 on docs/research/rulebook-migration-table.md section 3 and its section 8 tally, because every guard PR is told to re-derive the same tally lines.
    solution: Derive the tally by script or drop it, so parallel PRs stop colliding on the same lines.
    severity: minor
  - description: tests/unit/commit-trailer-guard.spec.ts writes a fixed temp filename, so concurrent gate runs in one container collide and one run fails; an implementer had to re-run the gate.
    solution: Use a unique temp path per run in that spec.
    severity: minor
  - description: "Three implementers were blocked by the container's worktree-isolation guard on ordinary commands: redirected pnpm or git push, a literal \"Bash\" plus \"pnpm\" in one command, a heredoc mentioning git. Each cost round trips."
    solution: Note the workaround (write a script file, run it) in docs/agents/environment-caveats.md.
    severity: minor
  - description: scripts/merge-pr.ts reported "failed to verify/close" on issues GitHub had already auto-closed a second earlier; harmless but each needed a manual check.
    solution: Re-read issue state after a short delay before reporting a failure.
    severity: nit
  - description: Review subagents whose worktree could not check out a branch already checked out elsewhere committed in the orchestrator's main checkout or in the implementer's worktree instead; shared branch refs then moved under those checkouts, leaving stale indexes that check:worktrees reported as uncommitted changes in 11 merged worktrees.
    solution: Give review subagents their own branch to check out (detached HEAD on the PR commit) rather than the PR branch, or have dispatch-subagents say so; treat a stale index whose HEAD is in origin/main as clean.
    severity: moderate
