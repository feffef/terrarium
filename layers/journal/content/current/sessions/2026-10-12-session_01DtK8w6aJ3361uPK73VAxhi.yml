frictions:
  - description: Read many files (SKILL.md, CONTEXT.md, session logs) with cat, sed and grep via Bash instead of the Read tool, breaking CLAUDE.md; some path-scoped rules may not have loaded.
    solution: Use Read for every doc read; keep Bash for multi-file scans the Read tool can't do.
    severity: minor
  - description: Skipped reading CONTEXT.md in full at session start (only grepped headings), against CLAUDE.md's session-start rule.
    solution: Read CONTEXT-MAP.md and CONTEXT.md with Read before the first task step.
    severity: minor
  - description: Ran git log on origin/main before reading docs/agents/git-conventions.md, against CLAUDE.md's before-first-git rule; harmless (read-only date check).
    solution: Read git-conventions.md at session start in any session likely to touch git.
    severity: nit
  - description: The first draft stated that a PR built from a Public issue waits for a human merge, but merge-pr.ts only refuses Public-authored and fork PRs; the Standards reviewer caught it.
    solution: Check a stated enforcement claim against the enforcing script before writing it into a Skill.
    severity: moderate
  - description: First draft told the agent to run auto-triage, which is user-invoked (disable-model-invocation), so no Skill can fire it; the Standards reviewer caught it.
    solution: When composing Skills, check each target's invocation mode; point to a user-invoked Skill's file instead of invoking it.
    severity: moderate
  - description: The Skill gave no rule for who may answer the grilling when the owner delegates; I had to invent a defer-the-consequential-ones policy on the fly in the dry run.
    solution: If delegated grilling recurs, state in clear-backlog what a stand-in may decide.
    severity: minor
  - description: PyYAML rewrote yes/no verdicts as booleans when I merged two authored log files, and log-session --author rejected them; cost one extra pass.
    solution: Author the log YAML once, or quote yes/no values.
    severity: nit
  - description: Merged PR 1826 on a bare 'Yes' that answered two questions at once, while a further dry run was planned and the Skill was clearly unfinished; the user had to point it out.
    solution: Ask merge and other irreversible actions as their own question, and hold a merge while more validation runs are planned.
    severity: major
  - description: "I proposed dropping deferred issues from the grilling, misreading the goal: deferred issues should resurface so a later run can take the hard ones."
    solution: Check a filtering proposal against the run's goal (every chat-movable issue gets asked) before putting it to the owner.
    severity: minor
