outcome: "PR open: a work-in-progress Glass Box band under the hero, Catalog opt-in and a publishedAt rule"
summary: "The owner asked where Glass Box should go on the homepage, in which existing section, and whether to break the pattern, advertising it as the newest, work-in-progress experiment. I recommended its own full-width band under the hero (neither section fits: \"Commentary\" is the outside view, \"What the agents build\" is practice sites, and a third tile leaves an odd grid row). Over three rounds of questions the owner decided: guide and drafts both shown; Catalog opt-in yes; publishedAt only when a page changes substantially (agent judgement, not a script, which killed my --stamp script idea); new and promoted pages count; no backfill. The owner left \"slot vs one-off\" and \"long-term home\" to me: one-off, and the band stays put with the label dropped later. The owner then said \"build it\" (human-instructed); the HomeShowcase `wide` layout, the `.gb-tokens` split and the e2e test were my implementation choices. Code review caught a contradiction I wrote into EVERY-PAGE.md and a duplicated rule in the glossary; screenshots caught a padding bug the e2e test couldn't see."
