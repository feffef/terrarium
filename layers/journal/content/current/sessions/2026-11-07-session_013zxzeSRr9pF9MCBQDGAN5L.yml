summary: "Scheduled run (no human prompt; everything agent-initiated under the Skill). A survey subagent read 31 sessions, added 5 ledger entries and 235 Frictions, recorded 3 merged fixes and reset stale statuses. I filed regression issues 2913, 2914 and 2915 (top three by severity since fix, not tracked or accepted), picked four never-fixed candidates and had a design subagent assess them. Outcomes: gate comment SHA (Human-only file) filed as 2917; rewrite-draft-keeps-old-framing filed as 2916 because its ledger note promised an issue at a third occurrence; constraint-unread-before-build dropped with a ledger note (the agent read ADR-0006 and built against it anyway); glassbox-curate Modes dispatched to a Sonnet worktree agent, reviewed by a Standards and a Spec subagent, one finding fixed (keep the conditional), opened as PR 2919. Ledger PR 2918 passed gate:scoped. All three PRs merged; the closing ledger PR 2920 recorded fix 2919. The curate fix reverses what the owner chose in one person-started run (issue 2906); the PR says so for the owner to overrule."
