frictions:
  - description: My first Agent call was blocked by the dispatch-read guard; I had not read the dispatch-subagents Skill, though CLAUDE.md names that trigger. Cost one retry.
    solution: Read dispatch-subagents before the first brief.
    severity: nit
  - description: I backgrounded the gate with a trailing ampersand plus run_in_background; the double-background guard refused the whole call, including the commit chained before it, so I had to redo both.
    solution: Pass run_in_background alone, and never chain a commit before a gate run.
    severity: minor
  - description: A chained sleep-then-tail wait command was blocked by the sleep guard; I used a plain check instead.
    solution: Use a background command's notification rather than sleeping.
    severity: nit
  - description: Skill ranks regressions by highest severity since the fix but gives no tie-break among a dozen minor ones, so I picked the third regression by recurrence count alone.
    solution: Add a tie-break to section 2, for example most occurrences since the fix.
    severity: nit
  - description: Skill section 5 step 4 says review the diff yourself, while pr-workflow.md says a Skill meaning change needs code-review; two review subagents were spent on a 5-line prose edit.
    solution: Let the frictions-to-fixes Skill name which rule wins for a dispatched fix of a few lines.
    severity: minor
  - description: "Survey subagent's own: mistyped 22-character session ids in the append triples and hit the all-or-nothing refusal for sessions already held, costing two reruns."
    solution: Accept the last four characters of an id and add a dry-run flag to the append script.
    severity: minor
  - description: "Impl subagent's own: ran git switch with discard-changes after editing, silently discarding its first edit, then redid it."
    solution: Brief should say to create the branch before editing.
    severity: minor
  - description: I typed a PR head SHA from memory into the verdict comment on PR 2920; it was wrong, and I had to post a corrected verdict after running verdict-line.ts.
    solution: Run verdict-line.ts first and paste its output, as pr-workflow says.
    severity: minor
  - description: A force-with-lease push of the reset session branch was denied by the classifier; a plain push worked because the branch was a fast-forward of the merged history.
    solution: Check merge-base --is-ancestor before assuming a force is needed.
    severity: nit
