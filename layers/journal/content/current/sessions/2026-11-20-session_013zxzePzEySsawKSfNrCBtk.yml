frictions:
  - description: Ran git fetch and git log before reading git-conventions.md; the hook flagged it afterwards. The fetch was right anyway.
    solution: Pre-read hint at the first git call of a kind CLAUDE.md binds, as read-first-hint does for other docs.
    severity: nit
  - description: "Closed #3508 and rewrote #3340 before reading issue-tracker.md and triage-labels.md; the hook asked after the write."
    solution: Read the issue docs before the first issue write; the hint fired only after it.
    severity: nit
  - description: "Rewrote the #3340 body keeping its old session header; the ADR-0017 guard blocked the call and I resent it."
    solution: When rewriting a body wholesale, replace the header first; the guard worked as designed.
    severity: nit
  - description: Edited rule-use-ask.ts, guards.md and its test before reading the ADRs the post-edit hooks named (0004, 0027, 0029, 0003); the edits stood.
    solution: Read the governing ADR before the first edit to a hook, not after the hint.
    severity: minor
  - description: Started the first code-review with hand-written args instead of the call verdict-line.ts --review-call prints; re-ran it on the final head.
    solution: Print the review call before the first review, as pr-workflow step 3 says.
    severity: minor
  - description: "My first draft of the #3340 comment gave a main-versus-subagent split of reported-with-no-load that the report did not give; caught before posting."
    solution: State only what the report's Data quality line prints, and source each number.
    severity: nit
  - description: "My checkout was stale and lacked unratedRules from the merged #3531; found only by grepping. Two Edits also failed on wrong line breaks in a comment."
    solution: Fast-forward to origin/main before designing against a merged PR; copy comment text exactly.
    severity: minor
  - description: "The first #3340 review counted the unrated gap for main only; the subagent gap (30%) surfaced later, so I posted a correction comment."
    solution: Compute unrated loads for both agent groups before posting a review that rests on shares.
    severity: minor
