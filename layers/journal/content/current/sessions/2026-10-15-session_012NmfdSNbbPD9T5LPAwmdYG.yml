frictions:
  - description: Read docs and rule-governed files with cat/sed through Bash instead of the Read tool, against CLAUDE.md's Read-tool convention.
    solution: Use Read for instruction docs; Bash only for bulk JSON processing.
    severity: minor
  - description: Labelled and closed issues without first reading docs/agents/triage-labels.md and all of issue-tracker.md, as CLAUDE.md's trigger requires; read only its Specs section.
    solution: clear-backlog §2 could name the two docs at the point where it says to set labels.
    severity: minor
  - description: Started the clear-backlog-build workflow (worktrees, git) without invoking dispatch-subagents first, as CLAUDE.md's trigger requires.
    solution: clear-backlog §3 could say whether its workflow satisfies the dispatch-subagents trigger.
    severity: nit
  - description: "The #1844 build agent saw every owner pick and treated pick 2a's no-verdict wording request as binding on its own merge-pr.ts messages."
    solution: clear-backlog-build should pass each branch only its own picks, not the whole relayed owner reply.
    severity: minor
  - description: "The #2011+#2028 branch came back 'failed' at the 3-round review cap with two small worthFixing findings, so the orchestrator had to fix them by hand."
    solution: Fine as is; the cap worked. Optionally give the fixer one more round when only doc-wording findings remain.
    severity: nit
