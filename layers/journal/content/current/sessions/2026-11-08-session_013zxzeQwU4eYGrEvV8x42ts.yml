  - description: Edited two Skill files in worktrees before reading ADR-0005/0015/0027; the edit hook then demanded them, and the ADRs confirmed the edits were right.
    solution: A rule loaded on opening a Skill file could say to read the three ADRs first, or the clear-backlog hand-fix step could list them.
    severity: minor
  - description: My hand fix of the glassbox-update step 4 line left another over-long line, so I needed a second edit, commit and a full gate:scoped re-run for a whitespace-only change.
    solution: Check the rewrapped paragraph's line lengths (awk) before running the gate.
    severity: minor
  - description: The Stop hook flagged uncommitted changes while the gate runs for those very changes were in progress; I had to inspect the worktrees to show they were not stray.
    solution: The Stop hook could skip worktrees with a running gate or name which tree is dirty.
    severity: nit
  - description: Fixed the 'cap' wording in frictions-to-fixes by hand, but the Done-when line still reads vaguer than before; I left it as an owner judgement call rather than polishing.
    solution: Decide in the brief whether the Done-when line must keep the count.
    severity: nit
