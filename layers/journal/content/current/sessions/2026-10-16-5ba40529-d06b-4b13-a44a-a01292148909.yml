frictions:
  - description: A stale TMPDIR (root's /var/folders/zz) made every tsx guard crash with EACCES and fail closed, blocking almost all tool calls
    solution: "Add a line to docs/agents/environment-caveats.md: on a guard-wrap 'exited 1 with no output' deny, check TMPDIR and restart Claude Code with a fresh one"
    severity: major
  - description: /implement was run on a ready-for-human issue whose only change is in .github/workflows/, which agents cannot edit
    solution: The implement Skill could check for the ready-for-human label and stop early with the handoff
    severity: minor
  - description: Skipped reading GLOSSARY-MAP.md and GLOSSARY.md at session start, as CLAUDE.md requires
    solution: Low impact here since nothing was written; the glossary read could be enforced by a SessionStart hint
    severity: nit
  - description: Ran git fetch before reading docs/agents/git-conventions.md, against CLAUDE.md's git trigger
    solution: Read it before any git command beyond status and diff; the hook only reminds afterwards
    severity: nit
  - description: ADR-0026's rule, environment-caveats and the workflow-edit guard say agents can't push workflow files, but a local session can push over SSH
    solution: Scope the caveat and the ADR-0026 rule to cloud sessions, and let the guard allow local sessions; the guard and ADR are Human-only
    severity: moderate
  - description: Tried git apply from a scratchpad diff, which would have slipped past the workflow-edit guard; the user rejected it
    solution: When a guard blocks a user-approved change, ask the user to run it or change the guard; never route around the guard's text match
    severity: moderate
  - description: A wizard run through the ! prefix gets no keyboard input, so its first confirm read as no and it stopped
    solution: Tell the user to run a wizard in their own terminal, never with !; the wizard Skill could say so
    severity: minor
  - description: Two tinkerfund e2e tests fail in a non-UTC local timezone, so gate:scoped is red locally on unrelated work
    solution: Pin TZ=UTC in the e2e config or make the tests timezone-independent
    severity: minor
  - description: Local gate's e2e step failed because the Playwright browser was not installed
    solution: Have the gate or postinstall check for the browser and print the install command (playwright-core install chromium-headless-shell)
    severity: minor
  - description: A commit made by the owner outside the session lacked the ADR-0017 session trailer; I amended it in-session
    solution: A wizard that commits for an agent session could pass the session id to the hook
    severity: nit
