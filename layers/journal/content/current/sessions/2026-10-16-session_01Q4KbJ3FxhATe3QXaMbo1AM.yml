frictions:
  - description: Pinned retro.yml's installedSha256 to skills-lock.json's computedHash instead of the actual on-disk SKILL.md sha256, wasting one full gate run before verify-skills-lock caught the drift.
    solution: scripts/verify-skills-lock.ts's own header comment already explains why the lock's computedHash can't be reused (it hashes upstream source, not the installed file) — read that comment before guessing a pin value, or just run pnpm verify:skills-lock --write instead of hand-computing it.
    severity: minor
  - description: Three of the fourteen appended Inventory observations initially broke audit-skills' own step-5 rule (only append when it cites a session no remaining entry already cites) — two cited no genuinely new session at all, one carried a redundant already-cited session id — caught only by the mandated code-review subagents, not self-caught.
    solution: Before appending each observation, grep the target file for existing session ids and confirm at least one id in the new note is absent from that list, instead of trusting my own summary judgment that this is new ground.
    severity: minor
