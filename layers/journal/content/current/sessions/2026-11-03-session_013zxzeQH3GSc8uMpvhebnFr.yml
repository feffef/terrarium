ideas:
  - "Propose a DECISIONS.md line: the payload-size reason lives on Data fetching and Query collection only links it, so a later run does not flip the bullet back (item f13, skipped as an undo of the earlier run today)."
  - "Propose a DECISIONS.md line: verification/09.invariant-tests stays its own page; folding it into Testing was proposed in three runs and each researcher or history dropped it."
  - Fix docs/agents/guards.md lines 42-43, which credit a bare || true with letting a crashing hint go ahead; that is the same error the 06 hook-added-context false claim had, and onFailure unset already makes it non-blocking.
