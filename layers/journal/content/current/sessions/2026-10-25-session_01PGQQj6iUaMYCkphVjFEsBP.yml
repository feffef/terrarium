frictions:
  - description: Read git-conventions.md only after a hook prompted it, following my first git command; CLAUDE.md says to read it before any non-status git command.
    solution: Treat the Skill's first step (rev-parse, fetch) as the trigger and read the doc first.
    severity: nit
  - description: Read github-integration.md only after the hook fired on my first GitHub call, against the CLAUDE.md read-before rule.
    solution: Read it before the first mcp__github__ call, as CLAUDE.md says.
    severity: nit
  - description: The Stop hook asked me to commit and push about ten times while subagents were still editing, each needing a reply, though the PR workflow forbids pushing before review and gate.
    solution: Let the stop-git-check skip while background Agent tasks run or while pr-workflow's pre-push review is pending.
    severity: minor
  - description: Skipped Skill step 5 (build and preview screenshots for pages whose teaching changed) to save time; the PR says so, but the visual check was not done.
    solution: Either shoot the few changed-teaching pages or make the Skill say screenshots are optional for drafts.
    severity: minor
  - description: Every subagent loaded about a dozen unrelated rules (ADR summaries, mermaid-lanes, glossary rules) for prose-only work, and each had to grade them.
    solution: Narrow the paths of adr-0021, tenant-glossary, glossary-terms and mermaid-lanes so they do not load when reading Glass Box content pages.
    severity: minor
  - description: Told the user three agents were still running when four were, a miscount from memory instead of the launch list.
    solution: Count from the launch calls before stating a number.
    severity: nit
