frictions:
  - description: SessionStart hook errored (tsx not found) and the clone started shallow again; unshallow-on-start likely skipped
    solution: Make the SessionStart hook install deps before running tsx scripts, or order them so tsx exists
    severity: minor
  - description: clear-backlog gave no rule for owner reservations relayed by an AI reset comment; full-sweep would let the sweep re-stamp ready-for-agent over them, so I improvised a brief rule
    solution: "clear-backlog/auto-triage: an owner's 'I decide this' (direct or relayed) outranks the standing green-light; drop such issues from the grilling"
    severity: moderate
  - description: Grilling spent 10 of 15 questions on issues the owner had already reclaimed; all came back 'defer'
    solution: Filter owner-reserved issues out before building the list
    severity: minor
  - description: My triage brief said the 16:43Z resets undid dry-run-1 answers, but only 4 issues had resets; 8 subagents each flagged the ambiguity
    solution: Check which issues carry a reset before writing a shared brief; the Skill could say how a prior run's answers bind
    severity: minor
  - description: Subagent build commit landed before pnpm install, so the commit-msg hook silently no-op'd (trailer written by hand, verified)
    solution: "dispatch-subagents brief: run pnpm install before the first commit, not only before the gate"
    severity: nit
  - description: Draft report said 8 subagents flagged the prior-run ambiguity and 'five issues got comments'; recounting caught 9 and four issues before sending
    solution: Count from the per-issue results file, not from memory, before writing totals
    severity: nit
