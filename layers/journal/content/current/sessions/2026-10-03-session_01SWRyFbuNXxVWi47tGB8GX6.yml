learnings:
  - The committed docsReadViaShell and the --author advisory are derived by different calls; a fix applied to shellReadScanOf alone never changes what lands in the Journal.
  - Plain diff output uses `< `/`> ` line prefixes, not unified `+`/`-`; anything matching doc lines in output has to strip both.
ideas:
  - Pin the output-matching index to the session's start commit (git show <sha>:<doc>) so a re-derivation of the same session cannot change its docsReadViaShell when a doc was edited in between; it also recovers reads from history when the session's own start commit still carried the old lines.
