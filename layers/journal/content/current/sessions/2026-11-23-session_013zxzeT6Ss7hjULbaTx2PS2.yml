frictions:
  - description: tenant-glossary guard blocked five edits in a row because I only grepped layers/journal/GLOSSARY.md; the guard wants a full Read.
    solution: The rule text (tenant-glossary.md) should say a full Read, not a search, so I read it before the first edit.
    severity: nit
  - description: "I labelled #3624 and #3627 ready-for-agent, and ran a git checkout to revert my prototype, before reading triage-labels.md, issue-tracker.md and git-conventions.md; hooks reminded me afterwards."
    solution: clear-backlog could name these three docs at the step that labels and the step that reverts, so the read comes first.
    severity: nit
  - description: After a prototype edit under layers/journal a hook asked me to read ADR-0006, ADR-0008 and ADR-0016 in full; I skipped it because the edit was throwaway and reverted.
    solution: The prototype Skill could say a reverted sample needs no ADR read, or the ADR rules could exclude layers/journal/app/pages in a prototype.
    severity: nit
  - description: I opened three PRs and ended the turn without subscribe_pr_activity or close-session; the Stop hook flagged the subscription and I invoked close-session only after the merges.
    solution: clear-backlog section 4 should list subscribe and the PR-open close-session as steps right after the PRs are opened.
    severity: minor
  - description: My Bash cwd ended inside a builder's worktree after a cd chain for verdict-line.ts; removing that worktree deleted my own cwd and the next command failed.
    solution: Run worktree removal with git -C from the main checkout and run verdict-line.ts via an absolute path, never cd into a worktree.
    severity: nit
  - description: "Owner's #3626 reply 'include the total number of ideas' changed the look, so I built a second sample, then the owner replied 'Just write ideas in b of C sessions' and I guessed it meant dropping the total without asking."
    solution: When an answer to a look question could be read two ways, ask the one-line question before building a second sample.
    severity: minor
  - description: "Subagent retro (builder and Standards reviewer): the first turn says return structured output, later resumes say reply with one line or a findings file; two hand-off channels were confusing."
    solution: State the hand-off channel once in rules() in .claude/workflows/clear-backlog-build.js.
    severity: minor
  - description: "Subagent retro (all three): the rule-use hook demands `echo rule-use:` twice per subagent and the loaded ADR rules were unrelated to a read-only review, costing two extra Bash calls each."
    solution: Skip the rule-use ritual for read-only reviewer and builder subagents, or load only the rules their paths match.
    severity: minor
  - description: "Subagent retro (Standards reviewer): the brief names section 3 of code-review/SKILL.md; the reviewer had to grep for it and read lines that pulled in unrelated dispatch text."
    solution: Give the line range or paste the smell baseline in reviewPrompt() in .claude/workflows/clear-backlog-build.js.
    severity: nit
  - description: "Subagent retro (Spec reviewer): it skipped the glossary and owner-decisions reads and could not confirm that pnpm validate:content passed, since a read-only reviewer cannot run it."
    solution: Have the builder record its fast-check results in decisions.md, and say in reviewPrompt() which reads the Spec axis needs.
    severity: minor
  - description: Round 2 on the visitor-loop branch was triggered by a 25-line prose-and-list fix commit (over the 10-line rule) and returned only nits; one data point that the line threshold over-triggers for content edits.
    solution: Gather more rounds before changing step 4 of clear-backlog; the one case here suggests counting only code or logic lines.
    severity: nit
