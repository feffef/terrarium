frictions:
  - description: Copied the previous run's session id into the new run entry instead of this session's id; fixed by a follow-up commit after the first push.
    solution: orient.ts could print this session's id in the run-entry skeleton so it is never copied from the last run.
    severity: minor
  - description: Called ScheduleWakeup outside a loop session while waiting for a subagent; the loop-only guard blocked it.
    solution: The glassbox-curate pause step could say a subagent wait needs no wakeup tool, only ending the turn.
    severity: nit
  - description: The system prompt names a harness branch to develop on while glassbox-curate says never use the harness-assigned branch; I followed the Skill.
    solution: State once, in the scheduled routine's prompt or the Skill, which of the two wins for curate runs.
    severity: minor
  - description: First pagesRead left out two pages the run edited (Testing, Headless browser checks) because I only grepped them; the Spec reviewer caught it.
    solution: orient.ts could name the Where next pages a change will edit so they are read whole in step 3.
    severity: nit
  - description: A plain git revert of the three drafts-removal commits conflicted with later file renames, so the revival needed a subagent to re-apply it by hand.
    solution: When a Space is removed, note in the removal commit which later renames would block a revert; or keep removed Spaces recoverable in a doc.
    severity: nit
  - description: Stopped after one run although the curate Skill says to start the next run at once; I misread the pause rule, which applies only when open PRs block every remaining item.
    solution: Step 8 could say a PR waiting for the owner is never a reason to end the session, and that the pause rule needs every remaining item blocked.
    severity: minor
