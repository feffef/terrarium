frictions:
  - description: The grade set was written out in seven places (Zod enum, TS union, order array, two comments, a test name, CONTEXT.md, ADR, SKILL.md); adding one value meant editing all of them by hand with nothing to catch a miss.
    solution: Derive the `Importance` TS union from the manifest's Zod enum, or add a unit test asserting the two literal lists agree, so a partially-added grade fails the gate instead of shipping.
    severity: moderate
  - description: A shipped inventory entry already violated CLAUDE.md's "never state a Routine's schedule in a committed doc" rule — frictions-to-fixes' role prose named an interval. The rule has no mechanical enforcement.
    solution: Add a validate-content check flagging cadence words (daily, twice-daily, hourly, nightly) adjacent to "Routine" in Skill Inventory roles and docs.
    severity: minor
  - description: SkillInventory.vue branched on an allow-list of two grades to decide role-vs-chip rendering, so a newly added grade would have silently collapsed to chips rather than showing its role.
    solution: Inverted it to exclude supporting/peripheral, so any future grade shows its role by default and the failure mode is visible, not silent.
    severity: minor
  - description: The Stop hook flagged uncommitted changes mid-task, while edits were deliberately still in progress and not yet in a committable state.
    solution: Nothing to fix in-repo; noting it because the signal reads as a defect when the session is simply mid-edit rather than winding down.
    severity: nit
