summary: "Human-instructed throughout: the user observed that the Skills run by scheduled Routines were graded `specialist`, said they are really the daily routine, and explicitly authorised introducing a new category if none fit. Scanned five days of session logs to identify the set from evidence — digest, audit-docs, audit-skills, blog-post (all `specialist`) plus frictions-to-fixes (`essential`). Clarified that `specialist` is an `importance` value, not `category`, and added a fifth grade `routine` between `essential` and `specialist` — defined in CONTEXT.md, amended into ADR-0015, taught to audit-skills, wired through schema, type, ordering and the inventory component. Pulling frictions-to-fixes off `essential` was my own judgement call, flagged to the user as reversible. Gate green; live-DOM probe confirmed the render. PR #803 merged by a human, as required for a change touching docs/adr/."
