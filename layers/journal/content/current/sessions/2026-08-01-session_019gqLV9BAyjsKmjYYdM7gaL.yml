learnings:
  - "`importance` and `category` are two separate Skill Inventory fields; `specialist`/`essential` are importance grades, while `category` is only platform-operation vs general-engineering."
  - The dashboard's Skill Inventory renders only platform-operation Skills (ownSkills), so a grade change on an external-pack Skill would not be visible on the page at all.
ideas:
  - Assert the manifest Zod enums and their hand-maintained TS mirrors in layers/journal/app/types/journal.ts agree, as a unit test over the two literal lists. journal.ts already documents why it cannot alias the generated Collections types, which is exactly why the drift is possible; a test closes the gap the comment only warns about.
  - Have audit-skills read the live Routine set (via CronList or the scheduled sessions' goals) and reconcile it against which entries carry the `routine` grade, so a Skill that gains or loses a Routine is re-graded automatically instead of waiting for a human to notice the inventory has gone stale.
