frictions:
  - description: Stop hook asked to push the ledger commits three times while the gate was still running and the Skill says review and gate come first.
    solution: The hook could skip its nag while a gate:scoped run or a Skill-ordered review is pending.
    severity: nit
  - description: A cd into the frictions directory in a compound Bash call moved the primary working directory; I had to use absolute paths until the next cd back.
    solution: Use absolute paths in compound Bash calls, never cd.
    severity: nit
  - description: The Skill has no tie-break for the top-three regression issues when many entries share minor severity since the fix; I chose by recurrence myself.
    solution: Say in frictions-to-fixes §2 to break ties by occurrences since the fix.
    severity: minor
  - description: Running code-review with two subagents on a 4-line doc change, after a rewrap round, cost about 120k subagent tokens to find nothing blocking.
    solution: Let pr-workflow's simple-change test cover a one-sentence addition to a Skill that adds no new rule.
    severity: minor
  - description: Survey subagent reported the brief omits --out for --summary and --candidates, that --append is all-or-nothing on a duplicate session, and that §3 tracker paging is heavy for about 140 candidates.
    solution: Add --out to the survey brief's summary step and an append mode that skips sessions an entry already holds.
    severity: minor
  - description: Design subagent found design-brief §3 gives no step for a design that changes no prose and does not say how much session-log reading is enough for a nit.
    solution: State in design-brief §3 that a non-prose design skips the read count, and cap log reading for nits.
    severity: nit
