summary: "Scheduled frictions-to-fixes run (no human prompt; everything here is agent-initiated under the Skill's own allowance). A survey subagent ledgered about 40 window Frictions, recorded six merged fixes and opened three entries. I filed regression issues #2579 (edit-during-gate-run), #2580 (dispatch-subagents-skill-unread) and #2581 (workflow-output-result-key), choosing by severity since the fix and, among minor ties, by recurrence; I skipped local-gate-green-ci-red (owner's #2138 decision predates its only occurrence) and bash-rules-hint-failure-path (logged false alarm). A design subagent covered four picks: one became issue #2582 (data-shape tightening, left to a Trusted user), one a one-sentence clear-backlog §4 doc fix built by a Sonnet agent on claude/fix-clear-backlog-push-hint (rewrapped once after my review, then Standards and Spec review found nothing blocking), two were dropped with ledger notes. Ledger PR #2583 holds the survey and screen commits, gate green. Still open: merge both PRs, then the closing ledger PR (§8)."
