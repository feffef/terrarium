frictions:
  - description: Did not save the seven subagent hand-backs with save-handback.ts as dispatch-subagents says; I quoted them in chat, so the raw reports are not kept.
    solution: Name save-handback in the brief checklist's first line so it is done per hand-back before summarising.
    severity: nit
  - description: Keyed sessions by a 10-character id prefix; three of 390 collided and skewed the edit-versus-read table until I reran on full ids. Caught before publishing.
    solution: Key by full session id and assert uniqueness in throwaway aggregation scripts.
    severity: nit
  - description: "Dispatched seven transcript subagents (about 774k subagent tokens) before probing one: events omit hook-injected rule context in some sessions, so three reports found no loads."
    solution: inspect-session should say events may omit hook output; probe one session before fanning out.
    severity: moderate
  - description: Drafted rule-path proposals before reading ADR-0029 and the Bash hint, though CLAUDE.md says read the full ADR before planning; its broad-paths stance reframed the advice.
    solution: Make CLAUDE.md's plan trigger name audits and reviews of a mechanism, so the ADR is read first.
    severity: minor
  - description: An interim chat message said seven rules loaded in 300-383 sessions and were rated no in 60-80 percent; only five loaded in 300+, and two of the seven were 49 and 88 percent.
    solution: Compute chat summaries from the table output, not from memory; corrected in the final reply.
    severity: minor
  - description: Compared rules across a 24-day window without checking path history; the user's question showed four rules were created mid-window, so load counts are not comparable.
    solution: Run git log on .claude/rules for path changes before comparing rules over a window.
    severity: minor
  - description: A throwaway script imported picomatch, which is not a direct dependency, and failed; switched to node:path matchesGlob.
    solution: Use node:path matchesGlob for glob checks in throwaway scripts.
    severity: nit
  - description: Eight phase-two transcript checks cost about 1.05M subagent tokens and mostly could not show whether a rule changed anything, as events omit hook-injected rule text.
    solution: Before fanning out, confirm the target rule's text or a Read of it appears in one session's events; else use logs only.
    severity: minor
  - description: Published two path-removal proposals from rule-level counts before checking per-path dependence; the second round showed they would lose yes sessions and I withdrew them.
    solution: Compute per-path dependence of the yes sessions before proposing any path removal.
    severity: minor
  - description: Proposed changes to the Bash read hint and mermaid-lanes without checking the Friction Ledger and closed issues; the owner had already decided both, found only after the user's frictions question.
    solution: Search the ledger and closed issues for an existing decision before proposing a change to a mechanism.
    severity: minor
  - description: "The ADR read-rate analysis counts any docsRead entry as a read: the logs cannot tell a full read from a partial one, or a read before an edit from one after."
    solution: Log per governing ADR whether its full read came before the first governed edit, after the hint, or never.
    severity: nit
  - description: My capture-design draft broke its own no-trigger-change constraint by editing the hint hooks and understated cost by ignoring cache re-reads; the Fable reviewer caught both before anything was built.
    solution: Check a draft against its own stated constraints, and price a forced extra turn as a context re-read, before sending it for review.
    severity: minor
  - description: Labelled one transcript-check session as a Digest session in a draft table; it edited pr-workflow.md and a trial file. Caught while assembling the page.
    solution: Take the task label from the session's filesEdited, not from the sibling sessions in the same batch.
    severity: nit
