outcome: Published an artifact report with per-rule ratings, evidence and proposed path changes; no repo changes
summary: "The user first asked when the per-rule verdict instruction last changed; I asked which one they meant, then answered from git history on origin/main (wording from 2026-10-15, later edits only rewraps and small additions). They then asked for a full audit of the rules since Oct 16 (human-instructed): a per-rule breakdown of useful, partly and not-useful ratings from the session logs, a peek into sampled sessions for patterns, and ideas for adding, narrowing or removing rule paths. Per their stated preference I asked four scoping questions first; they chose all 40 rules, logs plus sampled transcripts, report only, and an artifact page. Agent-initiated within that scope: the aggregation scripts in .throwaway, seven Haiku subagents that each read one session's events, the choice of which sessions to sample, and the proposals. Two user follow-ups arrived mid-turn and were handled the same turn: whether rule paths changed recently (yes, 11 commits; four rules were created inside the window, now a caveat on the page) and a request to describe each rule on the page (done). Result, at https://claude.ai/artifact/XZj2n5SbM7dqVKv6t4Ao3v: path-scoped rules were rated yes 17 percent, partly 18 percent, no 66 percent; the yes-rate is 34 percent when the session edited a governed file and 10 percent otherwise; six rules hold 46 percent of the no ratings. The transcripts could confirm rule loads in only 4 of 7 sessions, so the logs' own reason text carried the evidence on triggers. I read ADR-0029 and ADR-0027 in full only after drafting the proposals; ADR-0029 says broad paths are fine, which turned the advice from narrow these rules into candidates for a trial a Trusted user starts. Still open: record the triggering path in the log so per-path advice rests on data. No repo files changed and no PR was opened."
