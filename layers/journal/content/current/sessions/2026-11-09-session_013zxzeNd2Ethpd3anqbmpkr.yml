outcome: Published an artifact report on per-rule usefulness with evidence and revised proposals; no repo changes
summary: "The user first asked when the per-rule verdict instruction last changed; I asked which one they meant, then answered from git history on origin/main. They then asked for a full audit of the rules since Oct 16 (human-instructed): per-rule useful, partly and not-useful ratings from the session logs, a peek into sampled sessions for patterns, and ideas for adding, narrowing or removing rule paths. Per their stated preference I asked four scoping questions first; they chose all 40 rules, logs plus sampled transcripts, report only, and an artifact page. Agent-initiated within that scope: the aggregation scripts in .throwaway, seven Haiku subagents reading one session each, and the first proposals. Mid-turn user follow-ups, each handled in the same turn: whether rule paths changed recently (11 commits, four rules created inside the window, now a caveat), a request to describe each rule on the page, which model the subagents use, and whether sessions complain about rules. The user then asked for subagents to dig into more sessions, especially why low-yield rules were useful in specific sessions; after asking which rules and what depth they chose all four rule groups, logs first. Four subagents analysed the 136 yes ratings of ten rules from the logs, then eight Haiku subagents checked the best short sessions in transcripts. Result at https://claude.ai/artifact/XZj2n5SbM7dqVKv6t4Ao3v: path-scoped rules were rated yes 17 percent, partly 18 percent, no 66 percent, with 34 percent yes when the session edited a governed file and 10 percent otherwise. Of 11 yes ratings checked against transcripts, 4 shaped a decision, 3 only confirmed it and 4 left no trace, so yes is an upper bound. Only 18 of 1,907 frictions complain about rule noise, all nit or minor. The ledger cluster irrelevant-rules-loaded shows the owner already decided to keep the Bash read hint (issue #2167) and dropped narrowing mermaid-lanes, which I only found after the user asked about frictions; I withdrew two of my first proposals (drop CLAUDE.md and docs/agents from ADR-0029, drop .agents/skills from ADR-0005) and demoted two. Still open: record the triggering path of each load in the log. No repo files changed and no PR was opened."
