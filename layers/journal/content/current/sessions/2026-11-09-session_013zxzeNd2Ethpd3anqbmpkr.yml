goal: Audit how useful the Platform's rules were since Oct 16
status: completed
outcome: Published an audit artifact with an ADR-read study, plus a reviewed capture redesign draft; no repo changes
summary: "The user first asked when the per-rule verdict instruction last changed; I asked which one they meant and answered from git history. They then asked for a full audit of the rules since Oct 16 (human-instructed). Per their stated preference I asked scoping questions first; they chose all 40 rules, logs plus sampled transcripts, report only, and an artifact page. I built aggregation scripts in .throwaway, ran Haiku subagents on transcripts, and at the user's request added log analysis of why low-yield rules were useful plus eight more transcript checks. Mid-turn follow-ups were handled in the same turn: path history, a description of each rule on the page, subagent models, whether sessions complain about rules, the cost of subagent verdicts, and whether loads can be captured mechanically. The user asked me to try an InstructionsLoaded hook; a throwaway headless Claude showed it fires for the parent and a subagent with the trigger file and agent id. They then asked for a redesign of verdict capture; I drafted it and a Fable reviewer, which also ran six throwaway hook tests, found that the forced SubagentStop ask replaces the subagent's report, that the Stop ask repeats, that my hint-hook edit broke the no-trigger-change constraint, and that I understated cost; I recommended adopting its minimal version and asked the user to settle the stored-field shape. Last, the user asked whether agents read full ADRs when pointed to them and whether it helped: the trace shows the ADR was read in full after its rule loaded in 46 percent of edit sessions (25 percent before the Oct 23 hint, 54 percent after) and in 76 percent of hints (my first any-read count gave 53 percent and 35 to 60), and six transcript checks found five of six reads came after the first edit and none changed an edit, while three sessions' own claims about the read did not hold. I added that to the artifact (https://claude.ai/artifact/XZj2n5SbM7dqVKv6t4Ao3v, version 6). The user then pointed out that verdicts in subagent reports eat the main session context; a throwaway headless test showed a SubagentStart hook can inject the ask, the subagent records its answer with a script, and its report stays intact with no block. The user then asked for the simplest version that keeps the evidence and bothers agents least; I cut the holdout, judge, scale and derived signals, adopted positive-only naming of helpful rules and docs, tested the wording in three throwaway runs and wrote scratchpad design/rule-doc-capture-simple.md. I checked adding an edit-after-load signal to the trace: not small (new field in a Human-only schema file, about six places, and it would miss Bash writes), so I left it out and sent the simple design to a new Fable reviewer. The fresh reviewer found the design sound with changes (derive answers from the transcript, store per agent, fix the rate, no real file names in the note) and I wrote them into scratchpad design/rule-doc-capture-v1.1.md; its point that transcripts outlast the container, which log-session.ts:504-512 supports, corrected my earlier claim that underived data is lost. Still open: the user's decision on a v0.2 capture design. No repo files changed and no PR was opened."
