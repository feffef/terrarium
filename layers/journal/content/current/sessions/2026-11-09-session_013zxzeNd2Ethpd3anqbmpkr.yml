learnings:
  - "list_events appears to omit hook-injected rule context in some sessions: 3 of 7 sampled transcripts showed no Contents of rules blocks although their logs list loads, and logs and events disagreed on which rules loaded. Inferred from the sample, not documented."
  - "A yes rating is weak evidence of causation: in 11 yes ratings checked against transcripts, 4 shaped a decision, 3 only confirmed it and 4 left no trace. Inferred from subagent reports, not read from a doc."
  - Session logs carry no per-read timing, so whether an ADR read came before or after the first governed edit needs the Friction Ledger or transcripts. Inferred from the schema and the analysis, not a documented fact.
  - "A SubagentStop or Stop hook that blocks makes the answer replace the agent's final message: in the reviewer's run the parent's final result was only the rule-use line. Read from the reviewer's hook log in this session, one CLI version."
ideas:
  - Record the triggering path and tool for every rule load in the session log (rulesLoaded entries become rule, path, tool), then rank each path glob by the share of its loads rated yes. It turns this one-off audit into a standing view, so narrowing or adding paths rests on evidence and the weekly rule-coverage audit another session proposed gets its data.
  - Replace the yes, partly, no rating with changed something, only confirmed, no effect. In the transcripts agents said yes for rules that matched what they were already doing, so the current scale overstates usefulness and hides which rules actually steer work.
  - Log, per governing ADR, when its full read happened relative to the first governed edit and the ADR-read hint, and whether governed files changed after the read. It would show directly whether the hint's late reads ever change an edit, which the ledger can only assert.
  - Judge a stratified sample of about 200 rule loads from transcripts with a blind reader, 20 of them human-checked, instead of forcing subagents to rate their own loads. It measures how wrong self-reports are without adding an extra turn to every agent.
