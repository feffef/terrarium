summary: "Human-instructed: read issues 2871 (backlog, grades change only on evidence) and 2872 (materiality bar) and judge whether they solve the glassbox-improve run cost; then post a verdict and suggestions on each; then, after the owner set the goal (cost per run, spend on real improvements not churn, some lost recall acceptable, feed into the 2792 review), post a cost proposal. Verdict: 2871 Part 1 is a good correctness fix, its backlog needs a cap and expiry, 2872 is sound but cost-neutral. Agent-initiated: I measured why every v3 run reads all pages by recomputing planPages' changed set with the real pageHash/sourcesHash across the five run bases. The main cause is a run's own edits re-entering 'changed' next run, then cited-file changes (including whole cited directories) and the one-third rotation. My earlier guess posted on 2871 (sources hash) was wrong, so I posted a correction there. Chose 2805 for the proposal because 2792 is closed and 2805 is the open cost issue parked on that review. The owner then noted glassbox-update runs daily; I verified it already re-checks pages whose cited files changed, so improve duplicates that, and posted an amendment (human-instructed) dropping that check and sketching a daily improve Routine."
