learnings:
  - "Inferred, not verified: glassbox-improve's planPages rotation never narrows in practice, because the changed set covers nearly every page each run"
  - glassbox-improve reads every page each run mainly because a run's own gated edits change pageHash, so the next run re-reads them; rotationRuns=3 sweeps up the rest
ideas:
  - Have grades.ts plan write, per page, which trigger put it in the read set (text hash, sources hash, never read, rematch, rotation) into runs.yml, so the 2792 review can see why every run reads all pages and target the claim-check cost
  - Add a grades.ts plan --why flag that prints, per page, which trigger put it in the read set, backed by a unit test, so cost regressions from read-set growth show in the plan output
