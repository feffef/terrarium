summary: "Human-instructed: the owner invoked /frictions-to-fixes; everything after was agent-run under that Skill. A survey subagent read the 10 unledgered sessions since 2026-10-11 and saved its ledger changes as a YAML patch file, which the impl agent applied without re-typing. That is itself one of the fixes, for findings-retyped-by-hand, which I judged a scope gap and not a regression: the earlier fixes covered audit-docs only. I picked four simple doc fixes: dispatch-subagents (a user interrupt can cancel agents silently; one major occurrence), frictions-to-fixes §1/§5 (ledger patch file), log-session (every --author pass needs every required field) and clear-backlog §2 (skip it with no grill results). I dropped the HTML-entity note for clear-backlog-explore.js as a lone minor that would need its own PR. unverified-claims-in-drafts (27 occurrences) has no ripe fix: the CLAUDE.md prose is read and still missed, so a mechanism needs design. binding-docs-skipped #1819 is now unblocked (#1859 closed) and waits on a human. One Sonnet impl agent built the branch with gate:scoped green. Two code-review rounds caught a wrong claim in my own brief: mergeAuthored unions every list, not only docsRead/ruleVerdicts. They also moved the patch-file hand-off into §5. Pushed to the designated branch and opened #1882."
