frictions:
  - description: Ran list-open-issues.ts (a gh read) before reading docs/agents/github-integration.md, breaking CLAUDE.md's read-first trigger for GitHub operations.
    solution: Read the GitHub doc in the same call that first lists issues; the clear-backlog sweep step could name it.
    severity: nit
  - description: First git command beyond read-only (git fetch origin main) ran before docs/agents/git-conventions.md; a hook flagged it afterwards.
    solution: Read git-conventions.md at session start in any Skill that fetches; the call itself was right.
    severity: nit
  - description: Labelled four issues with issue_write before reading issue-tracker.md and triage-labels.md; the hook flagged it after the write. Labels turned out correct.
    solution: clear-backlog §2 says to set the label the answer implies; it could name the two docs there.
    severity: minor
  - description: My glassbox-curate brief didn't mention step 2's existing skip-in-place rule for owner-question items, so the new section duplicated it and the builder raised an owner-call (Q9) mid-build.
    solution: Before asking a question that adds a place or rule, grep the target Skill for the rule it overlaps and put the overlap in the grilling question.
    severity: minor
  - description: Owner left Q3 and Q6 unanswered twice and wrote an ambiguous 'cut the cluster' reply, costing two extra rounds; my Q3 wording didn't make its scope (clear-backlog only) clear.
    solution: State each question's scope in its first line, and use the glossary term (Friction Ledger entry) rather than leaving side findings for the owner to map.
    severity: minor
  - description: Owner answered '11a 12a' to questions numbered Q10 and Q11; I had to ask Q10 again because it edits CLAUDE.md, costing one round.
    solution: When asking a single follow-up pair, restate the numbers in the opening line and accept a positional answer only when every option it maps to is low-stakes.
    severity: nit
  - description: On the glassbox-curate branch I ran a third re-check in round 2 (a CLAUDE.md wording nit) past clear-backlog §3 step 3's 2-re-check cap, judging an always-loaded file worth it.
    solution: clear-backlog §3 could say owner-answer fixes get their own re-check outside the cap, which is how step 2 already reads; the cap's scope is unclear.
    severity: nit
  - description: "Retro (Standards reviewer): code-review §3 only says to search for standards files, so each reviewer re-greps which docs bind the diff (guards.md, the ledger schema in tenant.config.ts)."
    solution: reviewPrompt() in .claude/workflows/clear-backlog-build.js could list standards homes per changed path; source the reviewer's reply, unverified by me.
    severity: minor
  - description: "Retro (builder): the wrap-width awk in rules() also flags long diff and @@ header lines, which cost two extra edit rounds before the builder widened the filter."
    solution: "In rules() (.claude/workflows/clear-backlog-build.js), check only added lines: awk 'length>81 && /^\\+[^+]/'."
    severity: minor
  - description: "Retro (builder): the tenant-glossary guard blocked the first memory-page edit until layers/glassbox/GLOSSARY.md was read, costing a round trip."
    solution: A brief for a branch that touches a Tenant layer names its GLOSSARY.md as a first read.
    severity: nit
  - description: "Retro (Spec reviewer): 4 of 5 round-1 Spec findings on the guard branch duplicated Standards findings (triage.md 'same as Standards #N'). Counter-evidence: round 2 on the guard found a defect only Standards saw, and round 2 on glassbox an owner-call only Spec saw."
    solution: reviewPrompt() could keep Spec to brief fit (picks, never-clauses) and leave code shape and schema to Standards; weigh against the unique catches before cutting.
    severity: minor
  - description: "My #3580 brief said to import the SHA regex, too narrow: the guard then matched the skill name its own way, and both reviewers flagged the drift."
    solution: Brief the shared check, not one of its parts, when two code paths must agree.
    severity: minor
