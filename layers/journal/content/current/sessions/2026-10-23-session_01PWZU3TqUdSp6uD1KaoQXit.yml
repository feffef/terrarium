goal: Judge whether the adr-check Skill helps, and plan its replacement
status: completed
outcome: "Impact review and the chosen plan (write-time ADR hint replacing adr-check) posted to issue #2286"
summary: "Human-instructed throughout: the owner asked me to read #2286 and critically review whether adr-check had any positive impact. I asked how to judge it; the owner picked outcome, process and cost signals, an equal-length pre-#2284 baseline, and chat-first reporting. A throwaway script over every session log in both windows (86 vs 61 sessions) plus a read of all 120 ADR-related Frictions showed a modest process gain in interactive sessions (61% to 92% reading at least one full ADR; governing ADRs read 33% to 47%), no change for autonomous runs, no drop in ADR-content mistakes, and real cost (24 KB output, cut-offs, duplicated summaries). The owner then asked for inspect-session checks: three partial reads showed the \"adr-check user\" count is inflated (skillsUsed folds subagent calls; 012f7o6F's main session never ran it), 016THR5o cut the output with head -150 before ADR-0021, and 019CbZiW never read ADR-0004. At the owner's request I proposed a write-time hint (rule paths plus ADR numbers named in the edited text, silent once the full ADR is read), and at the owner's request dispatched a Fable agent for a detailed design, drawbacks and alternatives. The owner questioned a proposed derived log field; I found the existing authored relevantAdrs field, advised against repurposing it, and the owner chose to retire adr-check and the relevantAdrs prompt together with the hint in one PR. At the owner's request I posted the full plan, with open questions, to #2286. No code changed."
