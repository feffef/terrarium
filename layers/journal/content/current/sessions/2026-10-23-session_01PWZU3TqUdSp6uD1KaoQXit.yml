learnings:
  - skillsUsed in a session log folds in subagent and workflow Skill calls, and docsRead does not reliably list a Skill's SKILL.md, so a log cannot show whether the main session itself ran a Skill.
  - inspect-session pages cover roughly one minute of a busy session each, so reaching the start of a 40-minute session takes 30+ pages.
ideas:
  - "Add a derived skillCallers map (Skill name to main or subagent ids) to the session trace, so Skill audits like #2286 can tell a main-session call from a triage agent's without paging events."
