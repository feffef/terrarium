frictions:
  - description: Gave an impact verdict and fix proposals in my first report before running adr-check, which CLAUDE.md requires before any recommendation; ran it only for the later hint proposal.
    solution: "Retire the chat-recommendation trigger with adr-check as planned on #2286, or run it at the first evaluative reply."
    severity: minor
  - description: First report counted three post-landing errors as happening despite adr-check, trusting skillsUsed; inspect-session showed 012f7o6F's main session never ran it.
    solution: Note in docs/agents (or log-session) that skillsUsed folds subagent and workflow calls, so it can't show who ran a Skill.
    severity: minor
  - description: Two inspect-session partial reads hit their page limit before the session start (about a minute of events per page), needing resumes; 019CbZiW never reached it after 20 pages.
    solution: inspect-session could estimate pages from get_session duration and say so, or offer a start-first cursor walk for questions about a session's opening.
    severity: minor
  - description: Relayed the Fable agent's derived-log-field option without checking that the authored relevantAdrs field already existed; the owner asked and I found it then.
    solution: Grep shared/schemas/session.ts for a field before relaying a proposal that adds one.
    severity: minor
  - description: Tried docsRead SKILL.md entries to split main-session from subagent adr-check use; dead end, since the log omits the Skill read even when the parent ran it.
    solution: Record per-Skill caller (main vs subagent) in the derived trace.
    severity: nit
  - description: "Posted baseline numbers to #2286 from a throwaway script that dropped sessions reading 20+ ADRs; the real audit shows autonomous 40% to 51%, not flat."
    solution: Report medians or state outlier exclusions next to any read-share figure; the PR now does.
    severity: minor
  - description: The Stop hook asked four times to push the impl branch while code-review and the follow-up review ran; each needed a reply.
    solution: Let the Stop hook stay quiet while a subagent is running or a review is in progress.
    severity: nit
  - description: The Standards reviewer reported prose mentions of relevantAdrs in three logs as schema violations; I had to check and discard it.
    solution: Have reviewers distinguish a YAML key from prose before calling a schema break.
    severity: nit
