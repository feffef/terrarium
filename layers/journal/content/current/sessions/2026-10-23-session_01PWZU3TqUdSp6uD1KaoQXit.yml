outcome: "PR #2431 merged: adr-read-hint hook and adrHints log field replace adr-check; relevantAdrs removed"
summary: "Human-instructed throughout. The owner asked me to read #2286 and critically review whether adr-check had any positive impact; I asked how to judge it (owner: outcome, process and cost signals, an equal pre-#2284 baseline, chat first). A throwaway analysis of every session log in both windows and all 120 ADR-related Frictions showed a modest interactive process gain, no drop in ADR-content mistakes, and real cost. At the owner's request three inspect-session reads verified that the counted \"users\" were inflated (skillsUsed folds subagent calls) and that the three post-landing errors came from adr-check not running, its output cut by head -150, or the touched ADR going unread. The owner asked for a simpler mechanism; I proposed a write-time hint (rule paths plus ADR numbers named in the edit), a Fable agent designed it at the owner's request, and the owner chose to retire adr-check and the relevantAdrs prompt together with the hint; I posted the plan to #2286. The owner then ran /implement asking for an Opus subagent: I asked the plan's open questions first (owner: no log field, text match everywhere but content, one PR, no Bash writes), then the owner revised to add a derived adrHints field with a settled shape and to remove relevantAdrs fully from schema and logs with an ADR-0009 exception (I flagged the ADR conflict and asked first). The Opus agent built it in a worktree; two-axis code-review on the branch and on its fix commit found and fixed an index divergence between hook and trace, a pre-filter cost and rule-wording drift. A live probe in this session showed the hint firing once and staying silent on a repeat. Pushed and opened PR #2431, which the owner merged. The real audit's baseline differs from my posted throwaway numbers (autonomous 40% to 51%, not flat), driven by audit runs that read all 30 ADRs; the PR says so."
