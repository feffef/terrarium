frictions:
  - description: Ran git rev-parse HEAD before reading git-conventions.md; a hook reminded me. rev-parse is not on CLAUDE.md's read-only list.
    solution: Add rev-parse to the read-only list, or read the doc when a Skill says it dispatches git-touching agents.
    severity: nit
  - description: The dispatch-read guard blocked my first survey brief because my own wrapper text contained the literal placeholder, costing one retry and a filled copy of the brief.
    solution: Have the Skill say to write the filled brief to a scratchpad file and hand that path, since pasting verbatim trips the guard.
    severity: nit
  - description: Survey subagent labelled preview-dev-server-stale-or-unhydrated never-fixed and said no issue found, but open issue 3070 covered it; I caught it only by reading 3070.
    solution: Have the survey brief list issues filed that same day and match them on the Friction's own words, not just titles.
    severity: minor
  - description: The Stop hook claimed a PR had merged and demanded close-session, though no PR had merged or opened this run.
    solution: Make the merge-close hint check the session's own PRs before firing.
    severity: nit
