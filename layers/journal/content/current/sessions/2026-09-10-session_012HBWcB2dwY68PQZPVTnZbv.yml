  - description: "SHELL-READ-DETECTION false positive: docsReadViaShell attributed 5 doc reads to this session (.agents/skills/log-session/SKILL.md, .agents/skills/audit-skills/SKILL.md, .agents/skills/frictions-to-fixes/SKILL.md, docs/agents/guards.md, docs/research/rulebook-migration-table.md) that this session never shell-read itself. This session's own Bash calls were only `git status`/`git branch`/`git log`/`git fetch` — no cat/grep/git-show on any of these 5 paths. The likely cause: the four dispatched lens-reviewer agents (and the fact-checker) ran their own cat/grep/git-show commands on these paths inside their own isolated subagent contexts, and the trace-derivation appears to be folding those subagent-transcript shell reads into the parent session's own docsReadViaShell set instead of scoping them to the subagent (or dropping them, since subagent reads already surface via the `subagents` field per ADR-0009)."
    solution: Scope docsReadViaShell's transcript scan to the parent session's own tool calls, excluding shell commands that ran inside a dispatched Agent-tool subagent's isolated context — those are already captured by the derived `subagents` field.
    severity: moderate
