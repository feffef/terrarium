frictions:
  - description: I edited audit-skills SKILL.md while gate:scoped was running, which aborted it before e2e and cost a full re-run.
    solution: Read the pr-workflow rule that nothing may change during a gate before starting one; finish all edits first.
    severity: minor
  - description: I hand-wrote sample audit lines with counts I had not verified, including a code-review line, before showing them.
    solution: Fill samples only from the observations, or label them placeholders; caught before commit.
    severity: nit
  - description: I told the owner 26 Skills had observations; the actual count was 23. Corrected the next message.
    solution: Count with a script before stating a number, as CLAUDE.md says.
    severity: nit
  - description: I asked design questions with AskUserQuestion without invoking the grilling Skill CLAUDE.md names for owner-facing UI.
    solution: Invoke grilling first when asking before building owner-facing UI.
    severity: nit
  - description: I explained how Skill observations and the Journal work without first reading the overview page CLAUDE.md requires.
    solution: Read layers/glassbox/content/guide/pages/index.md before explaining the Platform.
    severity: nit
  - description: A background gate call combined run_in_background with a trailing ampersand and was blocked by the double-background guard.
    solution: Pass run_in_background alone with a plain foreground command.
    severity: nit
  - description: My screenshot script imported playwright, which is not a repo dependency, and failed before I switched to playwright-core.
    solution: The verifying-ui doc could name playwright-core with the executablePath for throwaway scripts.
    severity: nit
  - description: My first backfill lines drew only on each Skill's latest notes, so the owner had to ask for an overall verdict and I redid all 17 lines in a second PR.
    solution: Read a Skill's whole observation history before summarising it; the owner's wording "last week's runs" invited a short window, so ask what span the summary covers.
    severity: moderate
  - description: Reading all observations dumped 41 KB in one call, then I re-read them in trimmed batches.
    solution: Trim and batch note output from the start with a small script, as I did on the second attempt.
    severity: nit
  - description: Two resumed subagents answered a new question by redelivering their old reports, so I spent a round trip and got no answer from them.
    solution: After a resume, wait for the next notification and check it answers the new question before counting the agent as having replied.
    severity: nit
