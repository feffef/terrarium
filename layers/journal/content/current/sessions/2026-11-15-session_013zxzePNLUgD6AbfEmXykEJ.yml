learnings:
  - gate:scoped exits 1 with an ABORTED line when the tree changes mid-run, and the background-task notification still reports exit 0 for a compound command that echoes afterwards, so read the log's own status.
  - After a PR merges with a merge commit, the branch can fast-forward to origin/main and be reused for follow-up work without a force-push.
ideas:
  - Have audit-skills compute auditSummary from a fixed template of counts (runs, PRs merged, open issues) plus one agent-written sentence, so lines stay comparable week to week and a script can check their length and jargon.
