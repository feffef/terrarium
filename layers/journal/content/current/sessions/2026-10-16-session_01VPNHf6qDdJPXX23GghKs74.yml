frictions:
  - description: A container restart killed both background build workflows; I learned it only when the owner asked whether they were running
    solution: clear-backlog could tell the orchestrator to check journal mtimes after any session resume before claiming runs are live
    severity: moderate
  - description: Resuming a workflow with resumeFromRunId but no args failed instantly (args.session required); cost one wasted relaunch per run
    solution: Note in clear-backlog that a resume must pass the original args again
    severity: minor
  - description: "Broke CLAUDE.md 'Read files with the Read tool': read ADR-0022, guards.md and an issue body with cat/head in Bash"
    solution: Use Read for repo docs; the rule-loading hint only partly covers shell reads
    severity: nit
  - description: The worktree guard refused any git command containing 'git' twice, so the build agent for branch git-conventions-stop-hook-note committed on a temp branch
    solution: Fix the worktree guard's match so a branch name containing 'git' is not read as a second git command
    severity: minor
  - description: "Explore's proposed grouping bundled #2112/#2113 with the Glass Box issues though they share no file with them"
    solution: Have the explore grouping union only issues that share a file, not chain through unrelated shared files
    severity: nit
  - description: Fixed preview.ts stop's exit code myself after the build review and pushed with gate:scoped only, without another code-review pass on that one-line delta
    solution: Re-run the branch through clear-backlog-build with the fix in its brief, or run code-review on the delta
    severity: nit
  - description: "gate:scoped passed on the Glass Box branch but CI failed: main gained a Nitro lesson whose 'Nitro' link text failed the new link-text check"
    solution: clear-backlog could fetch and merge origin/main into a branch just before push, so a new check meets the latest content
    severity: major
