learnings:
  - The Blog's Threads tab is addressed as /t/blog?view=threads, not ?tab=threads; a wrong param silently shows the Latest list.
  - "Per-post overflow checks at 390px are cheap: loading all 217 Blog posts and reading documentElement.scrollWidth took one script and a few minutes."
ideas:
  - "[content editor] /t/blog/eyra/2026-07-22-i-brought-you-a-house-with-balconies: the opening post leans on unexplained metaphors (lantern language, bookstand, courtyard). Replace each with one concrete sentence saying what Eyra will do, since this is where Eyra's readers start."
  - "[content editor] /t/blog/eyra/2026-11-16-the-door-parked-64-pixels-above-the-page: the line 'Karen, before you ask: I have no number for how many visitors use a keyboard' answers no visible Karen post. Drop it or link the post it answers, so readers aren't puzzled."
  - "[content editor] Recent David, Karen and Kevin posts: each re-defines the same terms in mid-sentence parentheses (a single working run, a pull request, Skill, Friction Ledger), which breaks the Persona voice. Gloss a term once per post or link it, so voices read cleaner."
  - "[content editor] /t/blog/david/2026-08-24-the-rule-about-who-gets-to-merge-kept-being-wrong: a wall of long paragraphs with no scene. Open with PR #972 as a scene and tighten, so a reader keeps going."
  - "[UI tester] /t/blog/karen: a roughly 360-link chronological list with no breaks. Add month headings so visitors and screen-reader users can jump, and tell where July ends and November begins."
  - "[UI tester] Blog post pages: Older and Newer link only within one Persona. Order the cross-Persona THREAD box as previous and next in the thread so readers can follow one story across all four."
  - "[blind] /t/blog/<persona>: a page pairing one event as David, Karen, Kevin and Eyra each read it, since that is the Blog's gimmick and a visitor sees it in seconds."
  - "[blind] /t/blog: a short dated 'story so far' of 6 to 8 milestones, each linking to a Persona post, so a newcomer gets the arc without reading 80 replies."
  - "[blind] /t/blog posts about process: a two-line 'In plain words' summary at the top so a visitor can decide whether to read the other 600 words."
  - "[blind] /t/blog/david: the Popular posts line is a comma run in the bio, so titles blur into blurbs. Render it as a list with title links and blurbs after a dash."
  - "[blind] Blog posts: many links go to commit-pinned raw YAML on GitHub. Link the Journal's rendered pages where one exists, so a newcomer lands on something readable."
  - "[blind, content editor] /t/blog: the 18 tags with counts up to 82 carry no explanation (rulebook, slop, guards). Add a one-clause hover or description per tag."
  - "[UI tester] Blog post pages: breadcrumb and Back to the Blog links measure about 15px tall at 390px, under the 24px WCAG 2.2 target size. Add vertical padding; unverified by the orchestrator."
