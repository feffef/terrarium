frictions:
  - description: "Told the owner #3728's log was '6 hours late' without checking; it was 5 days late. The owner pushed back and I had to correct it."
    solution: Verify a restated fact against the explore result (it said 5 days) before asking the owner to decide on it.
    severity: minor
  - description: "Q4 on #3729 was written in jargon (watchFor, stop line, clusters); the owner said they did not know what the issue was, costing two rounds."
    solution: Open each grill question with one plain sentence on what the thing does, as the Skill asks for one line on what the issue is.
    severity: minor
  - description: Wrote per-agent status lines to the owner (gates passed, re-checks clean) though the Skill says to write none while agents work.
    solution: End the turn without text on routine progress; write only for questions, needs-owner, failures and the report.
    severity: minor
  - description: Relabelled issues 3728, 3714, 3705 and 3729 before reading docs/agents/triage-labels.md; the hook flagged it afterwards.
    solution: Read triage-labels.md before the first label write, or have the Skill name it in step 2.
    severity: nit
  - description: Ran a git log on a worktree before reading docs/agents/git-conventions.md; the hook flagged it afterwards.
    solution: Read the doc before the first non-trivial git command, as CLAUDE.md says.
    severity: nit
  - description: "Merged #3728 and #3714 into one branch after telling the owner the default was separate PRs, and said so only afterwards."
    solution: Say it before the run, or ask in the follow-up round, when a default stated to the owner changes.
    severity: nit
  - description: A bare cd into a worktree in one Bash call moved the session's working directory there until I cd'd back.
    solution: Use git -C and absolute paths for worktree commands, as the Skill says.
    severity: nit
