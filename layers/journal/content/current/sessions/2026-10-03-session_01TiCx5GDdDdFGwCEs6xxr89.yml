summary: "Human-instructed throughout. The owner first asked what is required to start the remaining Tinkerfund issues (answer: nothing blocks them; all phase-1 blockers are closed), then invoked grill-with-docs. An Explore subagent mapped the Tenant's code, decision tickets and phase-1 PRs; it surfaced heavy drift from the issue wording (28 Campaigns not 6, Updates now a data Collection, Inventor comment badge and \"You backed this\" already built). Mid-grilling the owner asked to read today's visitor loop, which turned out to have built the Inventor page (#1573) without referencing open story #1388, so the tree was recomputed. Two rounds settled every branch: baked per-Campaign recent-Backer list shown statically (no ticker, WCAG 2.2.2); hand-picked one-way alsoBacked links; a percentage-only automatic bundle Promotion counted per checkout and kept after a sibling cancel; #1388 kept open for a small follow-up. The owner took every recommendation except choosing to keep #1388 open. Decisions were posted as issue comments (the single home for a content Tenant's decisions, ADR-0021) and the visitor-loop slip was filed as #1578. No code or CONTEXT.md change: \"Bundle\" waits for a second instance (rule of two)."
