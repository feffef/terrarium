frictions:
  - description: "The visitor loop built open story #1388 as #1573 without referencing it, despite its own 'search open issues first' rule; found only by reading the merged PR"
    solution: "Make the check leave a trace in the tally and link closed issues from the feature PR (filed as #1578)"
    severity: moderate
  - description: "Story issues #1386-#1389 still describe the 6-Campaign launch catalog and Update pages; every agent must re-derive the drift from code"
    solution: Decision comments now note the current shape; a spec-refresh step when a later phase starts would prevent it
    severity: minor
  - description: Agent tool guard rejected run_in_background false on the first Explore dispatch; cost one retry
    solution: Omit the flag; the guard message was clear
    severity: nit
  - description: An impl agent's `git checkout -B <session-branch>` in its worktree moved the branch my primary checkout had checked out, leaving my tree looking like a reversed diff of its commits
    solution: Detach the orchestrator checkout before dispatching agents that push the same branch; worth a line in dispatch-subagents for single-branch serial integration
    severity: moderate
  - description: My `git reset --hard HEAD` to resync that stale checkout was denied as destructive; worked around by detaching at the old commit after proving the tree matched it
    solution: Detach first (above) so the situation never arises
    severity: minor
  - description: check:worktrees flagged six agent worktrees as uncommitted; all were false positives from the same shared-branch-ref effect, verified tree-by-tree against each pushed SHA
    solution: check-worktrees could compare a worktree's tree to any commit on its upstream before calling it unrescued
    severity: minor
  - description: Container restart dropped two agent hand-backs; recovered from the pushed commits and the agent's gate log in the scratchpad
    solution: Agents banking reports to scratchpad files made recovery cheap; keep requiring it
    severity: minor
  - description: Review agents could not spawn the code-review Skill's two sub-agents and ran both axes sequentially themselves
    solution: Brief already allowed the fallback; the Skill could document it for nested dispatch
    severity: nit
  - description: Per-story implementers repeatedly reintroduced small duplicates (pluralisers, slug lookups, Live filters) that only the whole-branch review caught
    solution: Tell impl briefs to grep app/utils for an existing helper before adding one
    severity: minor
