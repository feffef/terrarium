frictions:
  - description: Didn't log the session at PR-open, a closure point; only closed after the final user-requested tune.
    solution: Invoke close-session immediately after opening a PR, then re-invoke when later work happens.
    severity: minor
  - description: The Stop hook demanded commit-and-push on every turn while subagents were mid-edit on files, forcing repeated 'not yet' turns.
    solution: The stop-hook git check could tolerate files a still-running background agent is editing, or I could have dispatched agents into worktrees.
    severity: moderate
  - description: An agent drew circles as zero-length arcs (`a r r 0 1 0 .1 0`), which centres them r units off the start point; the loupe misplacement survived two review rounds.
    solution: Brief agents to use <circle>/<ellipse> for round shapes; I reviewed at too small a scale to spot the geometry until rendering at 420px.
    severity: moderate
  - description: Reviewed contact sheets at 160–200px, which hid geometry bugs (Ines's glasses over her mouth, the loupe on Lucia's cheek) that a 400px render showed at once.
    solution: Render one large tile per portrait in each review pass, not only the grid.
    severity: minor
  - description: My pass-2 notes contradicted each other on who keeps a pencil behind the ear (Declan was told 'good', batch 4 was told Declan switches); fixed in pass 3.
    solution: Write a single set-wide prop roster before sending per-batch notes.
    severity: nit
  - description: "Didn't consider dark mode up front: theme tokens invert the drawings, which the user disliked; fixed late with color-scheme: light."
    solution: For illustrations drawn in ink/surface tokens, decide early whether they should invert or render in the light scheme.
    severity: minor
