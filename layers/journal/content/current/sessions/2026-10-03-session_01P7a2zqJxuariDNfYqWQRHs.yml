outcome: "19 portraits redrawn over three review passes plus a fine-tune and dark-mode fix; PR #1583 merged"
summary: "Human-instructed throughout: the user asked for Fable agents to redraw every Tinkerfund inventor portrait as fun, stylized comic avatars in the existing colour scheme with more natural shapes. After clarifying questions they chose to raise the portrait byte budget to 4 KiB, scope it to the 19 prod inventors, keep \"nerdy\" light, and use four agents. Mid-way the user asked for at least three improvement passes with review, using only orange, black and white (strict: ink/surface/accent, no mixes). I ran four parallel Fable agents over a scratch contact-sheet harness and a palette checker, and reviewed the full set between passes (pass 1 palette, pass 2 outfit/face variety, pass 3 polish). The user then disliked the inverted dark-mode portraits and asked for a final tune of Lucia and Ines. I fixed dark mode with one CSS line (color-scheme: light on the portrait svg, verified by a dark-mode screenshot) and redrew Lucia's and Ines's features myself: the agent's loupe kept landing on Lucia's cheek because an arc-based circle put its centre 6.5 units below the intended point. Agent-initiated: the preview/palette tooling (scratch only), Ines's hand-mirror nod (from her bio), and opening the PR per ADR-0003."
