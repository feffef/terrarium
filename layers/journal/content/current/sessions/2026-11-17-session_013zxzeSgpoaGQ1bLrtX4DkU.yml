frictions:
  - description: First git commit came before reading git-conventions.md and I read dispatch-subagents only after the first Agent call; the guards had to nudge me.
    solution: Load these doc triggers with the digest Skill itself, so the reads precede the first git or Agent call.
    severity: nit
  - description: I typed the session id by hand in a commit message trailer and got it wrong; I caught it with get_session before committing.
    solution: Copy the id from the attribution reminder, never retype it.
    severity: nit
  - description: The first background gate call stacked run_in_background with a text-level ampersand and the double-background guard blocked it.
    solution: Pass run_in_background alone with a plain command.
    severity: nit
  - description: "My first fact-check was too lenient: it let 'daily' through; the later review caught that cadence word, so I reran the gate once more."
    solution: Brief the fact-checker to flag every cadence word the Skill lists, not just ones it can disprove.
    severity: minor
