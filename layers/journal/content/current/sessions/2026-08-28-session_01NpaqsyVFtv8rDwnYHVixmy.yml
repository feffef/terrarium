summary: "User reported that prune-trial seemed to use exact timestamps wrong, closing two trials in one day despite one-per-day opening. Investigated via git history (human-prompted): confirmed PR #1061 judged the guards.md-consolidation trial ~31 hours early, citing a landing commit (d4c08f6) that does not exist anywhere in the repo, instead of the real landing (96bcd24, 2026-08-25). The same-day double-close in PR #1068 was correct by design (SKILL.md: \"§1 may close several\"). Agent-initiated from there: built scripts/prune-trial-window.ts to compute each trial's real landing/window from git log -S instead of freehand derivation, added unit tests, updated SKILL.md/ledger header to point at it, filed issue #1069 documenting the bad PR #1061 verdict for human judgment (did not revert it unilaterally), and opened PR #1070. User then pushed back (human-prompted): the window shouldn't be framed as an exact deadline since scheduled Routines have no exact-timing guarantee. Reframed the computed window as a floor (earliestJudgeableAtUtc), not a deadline, renamed the field/CLI output/SKILL.md wording accordingly, and confirmed in discussion that the ledger's re-scan-every-run design already prevents a judgeable trial from ever being silently skipped (only judged later than the floor, never dropped). Gate green throughout; PR #1070 merged, needing no self-merge since it was an ordinary work PR under this repo's per-tier merge authority."
