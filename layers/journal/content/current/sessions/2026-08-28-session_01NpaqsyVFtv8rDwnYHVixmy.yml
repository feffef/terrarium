frictions:
  - description: A naive first version of the fix searched git log -S using the YAML-parsed (folded) problem text, which silently found nothing — YAML's `>` scalar joins wrapped lines with a space, so the parsed string isn't always a literal substring of the raw file `-S` searches.
    solution: Extract each entry's literal raw first line via regex instead of using the parsed value as the search key; added a unit test asserting the raw line is always a substring of the file while the folded text is not guaranteed to be.
    severity: minor
  - description: First shipped version framed the computed window as "closes at T", which reads as a deadline to hit rather than a floor never to precede — misleading given /prune-trial runs on a scheduled Routine with no exact-timing guarantee. User caught this after the PR was already open and merged-ready.
    solution: Renamed windowClosesAtUtc()/closesAtUtc to earliestJudgeableAtUtc(), rewrote CLI output and SKILL.md wording to say explicitly that judging later than the floor is normal and correct, only judging before it is the failure. Pushed as a follow-up commit before merge.
    severity: minor
