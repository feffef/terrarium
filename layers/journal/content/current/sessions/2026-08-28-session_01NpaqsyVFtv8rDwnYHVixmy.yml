  - description: A naive first version of the fix searched git log -S using the YAML-parsed (folded) problem text, which silently found nothing — YAML's `>` scalar joins wrapped lines with a space, so the parsed string isn't always a literal substring of the raw file `-S` searches.
    solution: Extract each entry's literal raw first line via regex instead of using the parsed value as the search key; added a unit test asserting the raw line is always a substring of the file while the folded text is not guaranteed to be.
