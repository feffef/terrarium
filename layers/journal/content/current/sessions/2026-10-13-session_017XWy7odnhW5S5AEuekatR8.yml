frictions:
  - description: Never read CONTEXT-MAP.md or CONTEXT.md at session start, as CLAUDE.md requires; the session added a glossary term through a subagent.
    solution: Read both in the first batch of calls; impact low because the subagent read domain.md and CONTEXT.md itself.
    severity: minor
  - description: I stated the workflow concurrency cap as fixed and unconfigurable before checking the docs; the owner had to ask, and an env var sets it.
    solution: Verify a harness limit against the current docs before calling it a constraint (CLAUDE.md Verify before you state).
    severity: moderate
  - description: Read several files through cat, sed and chained greps instead of the Read tool, so their rules may not have loaded (CLAUDE.md, ADR-0029).
    solution: Use Read for single files; keep Bash for searches.
    severity: minor
  - description: Answered the first opinion question after grepping docs/adr but before reading the binding ADRs in full; ADR-0005 was read only later.
    solution: Read the grep hits before giving the opinion, as CLAUDE.md asks.
    severity: minor
  - description: The owner asked for less progress-update spam mid-session; my early replies narrated subagent status.
    solution: Reply only with findings and questions while agents run.
    severity: minor
  - description: The Stop hook asked to push unreviewed commits five times while the gate and reviews were still running.
    solution: The Stop hook could recognise a running gate or pending review subagent and stay quiet.
    severity: nit
  - description: The first build brief left gatePassed unchecked and a lost-worktree path; only the two-axis review caught it.
    solution: A workflow brief should name, for every schema field, what the script does with it.
    severity: minor
