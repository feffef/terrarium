    solution: Caught before publishing by explicitly re-deriving both facts (a `date -u -d` call and re-reading the issue's created_at) per CLAUDE.md's "verify any weekday, count, or date straight from git/the file on disk" rule — but the first draft should have done that check at drafting time, not as a separate pass afterward.
