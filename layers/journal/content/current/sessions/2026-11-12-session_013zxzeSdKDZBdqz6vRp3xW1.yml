  - description: Ran git push and pnpm gate:scoped in one Bash command, against git-conventions.
    solution: Push in its own call, then start the gate in a separate call.
    severity: nit
  - description: Edited page files while gate:scoped ran, so it aborted and had to be rerun.
    solution: Finish every edit before starting the gate; pr-workflow says to edit nothing until it ends.
