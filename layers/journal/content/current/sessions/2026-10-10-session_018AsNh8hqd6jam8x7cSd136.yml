frictions:
  - description: Ran git log to date the shell-reads change before reading docs/agents/git-conventions.md, breaking CLAUDE.md's read-first rule for git log used to draw a conclusion
    solution: Read git-conventions.md before the first git log; impact here was nil as the log was only used to date a commit
    severity: minor
  - description: Skimmed CONTEXT-MAP.md with head and never read CONTEXT.md or ADR-0009 in full at the start, breaking CLAUDE.md's session-start and ADR read-first rules
    solution: Read both in full at session start even for research-only questions; a session-start hook printing the reminder would help
    severity: minor
  - description: A subagent used GitHub MCP search tools without docs/agents/github-integration.md being read first
    solution: Mention the doc in dispatch briefs that touch GitHub, or note in CLAUDE.md that read-only search is exempt
    severity: nit
  - description: Raw transcripts of long sessions are ~100 events per list_events page with ~10% assistant/user, so mapping 50-70 credits to commands was infeasible
    solution: Have log-session persist the per-doc credit table (doc -> command) in the log or a sidecar so audits don't need transcript replay
    severity: moderate
  - description: First gate run failed on no-empty lint for an empty catch I added after review; lint was not run locally before committing the review fixes
    solution: Run eslint on changed files before committing a fix round, not only vitest
    severity: minor
  - description: A python replace script asserted a wrong count and aborted midway, leaving half the review fixes applied across files
    solution: Apply multi-file scripted edits per file with independent checks, or use the Edit tool
    severity: nit
  - description: Started the gate before the review fixes, so it had to be stopped and rerun; cost ~4 minutes
    solution: Start the gate only after review fixes are committed when a review is already in flight
    severity: nit
