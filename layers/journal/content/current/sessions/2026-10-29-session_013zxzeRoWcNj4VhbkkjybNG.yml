summary: "Ran the glassbox-improve Skill, started by one human kickoff (/glassbox-improve); later the owner also directly asked, in two separate messages, to split the Vue components and hydration Lesson into two Lessons and then to run the whole rating and improvement process on those two Lessons only. Everything else was the Skill's own procedure. Run 1 (merged as PR 2684): three raters (sonnet, fable, opus) graded all 41 guide pages at base d08dde31; nearly all were A, the one consensus deficit sat on a cooling-off page, so no page was raised. The structural step promoted the Workflow scripts draft, since all three raters listed it and its title already passed. Three single-rater false claims were confirmed in the source and fixed by me (Routines, the pnpm page's ADR-0026 cite, a Type checking anecdote). Run 2 (PR 2685, open): I split the page myself by moving text; code-review found small gaps that I fixed; the process then ran on the two pages with rater, researcher and opus writer subagents, two fix rounds and a last re-grade, ending A and A by the middle grade. A single fable rater found that Vue 3.5.44 patches a bound attribute in hydration, contradicting the page. I confirmed it in the pinned runtime and fixed it. Single-rater points (Nuxt docs link, ADR-0028 citation) were left as Optional. I posted my verdict, CI went green and merge-pr.ts merged PR 2685."
