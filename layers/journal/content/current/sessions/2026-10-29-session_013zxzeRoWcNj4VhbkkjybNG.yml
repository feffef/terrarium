frictions:
  - description: Stop hook asked to push about eight times while ADR-0004 required code-review and gate:scoped first; each reply had to restate why I was holding.
    solution: Make the Stop hook skip its push nag while a background gate or review subagent is running in the session.
    severity: nit
  - description: I put the researcher's claim that the docs do not say the script cannot ask the user into the writer brief unchecked; the docs table does say it.
    solution: Verify a researcher's contradicted claim against its source before it becomes a deficit in a brief; the writer caught it by fetching the docs.
    severity: minor
  - description: Three rater briefs each needed the full 41-page list and 26-draft list pasted in by hand, a very large prompt typed three times.
    solution: Let the rater brief take a command that lists pages and drafts at the base, or a scratch file path, instead of pasted lists.
    severity: minor
  - description: Tally rule is unclear when two raters list a point as Optional and one as a deficit; the SKILL says drop Optional but not whether that counts as independent raising.
    solution: State in step 3 whether independent Optional reports of the same point count towards consensus, or add a DECISIONS line.
    severity: minor
  - description: Picking the structural step meant summing gap places across three differently numbered prose lists by hand, and a rater's single entry could cover two drafts.
    solution: Ask raters for Gaps as a table of draft path and rank, so the sum is mechanical.
    severity: minor
  - description: Draft-promotion candidates all had pointer-only Why sections and stale pins, so any promotion costs a writer round whichever draft wins.
    solution: Raise this as a recurring cost in the ideas list; consider a standing pass that rewrites draft Why sections as reason bullets.
    severity: nit
