gitBranch: claude/loving-tesla-46at2w
entrypoint: remote_trigger
cliVersion: 2.1.329
trigger: audit-skills
learnings:
  - "merge-pr.ts reads every PR comment: a superseded comment that still holds an Own-read line blocks the merge, and a code-review call only counts if its args carry the head sha (inferred from four refusals, not read in the script)."
  - Nine Skills with runs in the window but no behaviour check (code-review, grilling, tdd, prototype, research, writing-for-agents, ask-matt, grill-me, dependabot-sweep) get no note from this Skill, so their auditSummary ages unseen.
ideas:
  - "Scorecard staleFlag: print per Skill whether SKILL.md changed after its Inventory entry's date, plus a skip hint when runs, changes and observations repeat the last check. 11-19 skipped all role rewrites for 13 changed Skills, and both runs spent about 1.7M subagent tokens reconfirming repeats."
  - "inspect-session step 1: add one line saying an answer from log and PR reads is a complete use, so zero event reads is expected; audit notes read it as a mis-log three times."
  - "harvest step 2: make the stop explicit (quota, 30 clusters, or budget with a number) and have check-clusters accept only those; 11-18 and 11-19 invented effort wording."
  - "audit-docs step 1: tell reviewers to quote every rule, condition and why of text they propose to rewrite, and to skip ADR-versus-code tensions needing an owner decision; 17 of 26 findings on 11-19 were wrong, mostly rewrites that dropped a rule."
  - "blog-post step 9: batch all post-checker fixes into one commit before the re-check; each small commit forced a full re-sign (five rounds on 11-19, four on 11-17)."
