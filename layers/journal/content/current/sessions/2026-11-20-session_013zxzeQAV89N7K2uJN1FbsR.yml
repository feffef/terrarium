goal: Weekly check of the Platform's own Skills
status: completed
outcome: "Inventory update for 15 Skills merged (PR #3509); two issues filed (#3507, #3508); closure checks clear"
summary: "Scheduled audit-skills run, nothing human-instructed; every step was agent-initiated under the Skill. Gathered the scorecard (7-day window, 15 behaviour checks, 10 unlisted routine runs), had one subagent fetch run costs and 15 read-only subagents check each Skill. Step 3 closure signals were clear (orphanScan scanned: true, 192 merged PRs and 100 issues, 0 orphans, 0 suppressions, 0 human-prompted or rescued closures). Step 4: filed #3507 (glassbox-curate still stops after one PR and skips writer, checker and reader after the loop default; #3440 and #3395 are closed) and #3508 (log-session rule-use accounting counts logs with unrated rules as answered; cause at transcript-trace.ts:931). Other findings stayed observations (harvest read summaries not whole logs, n=1; audit-skills skipped role rewrites on 11-19). Step 5: observation and summary for 15 Skills, blog-post role names the Take, run costs for 10 routine runs, no grade or watchFor change. Not covered: Skills with runs but no behaviour check (code-review, grilling, tdd and others) got no note, and I reread role and gist only for blog-post though several Skills changed, repeating the very gap the 11-19 run disclosed. Landed as PR #3509 after two code-review rounds and a follow-up for note length and jargon; merge-pr.ts then refused four times because an earlier comment of mine held an Own-read line and the code-review call lacked the sha. Dropped ideas: pre-step doc-read lines for digest, prune-trial and visitor-loop (the hooks already say it; ADR-0027 says cut before adding), a lookback marker for close-session (a new moving part for one signal), and the dispatch guard's denial text (it already prints the Skill path)."
