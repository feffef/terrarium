frictions:
  - description: Ran `git checkout --detach origin/main` before reading docs/agents/git-conventions.md; the hook reminded me afterwards. The command was read-safe in effect.
    solution: Have the visitor-loop step 1 say 'detach with git checkout --detach origin/main' so the git-conventions read is not triggered late, or exempt that command in CLAUDE.md.
    severity: nit
  - description: Filed issues, then the hook pointed me at docs/agents/triage-labels.md, which I had not read; labels needs-triage and area:atlas were right by luck.
    solution: visitor-loop step 4 should name triage-labels.md next to issue-tracker.md as a read before filing.
    severity: minor
  - description: Brief gives no pointer to content paths or a starter crawl script, so each visitor rewrote the same crawl and hit the same page.evaluate string-escaping trap.
    solution: "Add to .agents/skills/visitor-loop/visitor-brief.md: content lives at layers/<tenant>/, a one-line string page.evaluate example (join with '|', never a newline), and that SVG a.href is an object."
    severity: minor
  - description: The brief and context file were written to the scratchpad and referenced by path instead of pasted; the Skill says to give the brief verbatim, so this is a small deviation, and the blind visitor had to read a file.
    solution: State in .claude/skills/visitor-loop/SKILL.md that passing the brief by scratchpad path is acceptable, or generate it with a script.
    severity: nit
