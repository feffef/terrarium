learnings:
  - The Atlas Biome and specimen pages' section titles are span.atlas-eyebrow, not headings; the landing page alone uses an h2.
  - Observation files without a `specimen:` key show on no page, so prose that counts them (Umbra vacans 'fourth entry') cannot be reconciled from the site.
ideas:
  - "[content editor] /t/atlas/<wing>: the catalogue shows rarity dots only while the page text says a missing plate number is a plate not yet drawn; print each plate's numeral in its row and show undrawn numbers as dashed 'not yet drawn' rows, to make the joke visible without a cross-Biome page."
  - "[content editor, first-time visitor] /t/atlas/pool/snail: the 404 suggestion only matches a full common name; also match the last word ('snail', 'weaver', 'moth') when unique, so a visitor who types a short name lands on the Specimen."
  - "[first-time visitor] /t/atlas: the landing never says what Terrarium is; add one plain sentence under the subtitle linking to the Terrarium overview."
  - "[first-time visitor, UI tester] /t/atlas/<wing>/<specimen>: pages are long; add previous/next plate links or a section mini-index so a visitor can keep wandering or jump to the almanac."
  - "[UI tester] /t/atlas/<wing>: mark the current hour on the Daily choreography bars so the chart shows what is abroad now."
