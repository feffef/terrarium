summary: "Human-kicked-off /auto-triage sweep (single command invocation, no further human prompts). Listed all 36 open issues via scripts/list-open-issues.ts, then used scripts/last-comment-authors.ts to apply the auto-triage idempotency rule: an issue is eligible only if it has no state label / is needs-triage, or its most recent comment/body lacks ADR-0017 AI provenance. 31 issues (3 wayfinder:map, 28 others) had AI-authored last activity and were correctly skipped. The 5 eligible issues (#1018, #1008, #993, #984, #976 — all \"REGRESSION\" tickets self-filed by frictions-to-fixes) were each triaged by a dedicated parallel subagent per the /triage per-issue procedure: verify claims against primary sources, decide category/state, post an Agent Brief or ready-for-human rationale. All 5 landed as ready-for-human (bug x4, enhancement x1) — each involved a genuine design/mechanism judgment call (a repeat-regression pattern, or a factual error the subagent caught in the issue's own suggested fix for #993). No code was changed; no PR was opened."
