summary: "Human-instructed: link Inventor names everywhere and find a less ugly common link style. I explored, then asked three questions (style scope, look, prose mentions). The first commit linked card and home-hero names and made all text links ink-coloured with a faint underline. The user said LGTM; I started merge-pr.ts, then the user ran /code-review and I held the merge at their choice. On \"address them all\", I began renaming --tf-link (it is also the figure/focus/funded blue across 16 files), but the user interrupted and redirected: since blue is used consistently, keep it and dial it down. I reverted the rename, mixed the link blue 60/40 with the surrounding text colour, made title/footer links fade their underline like other links, added one inventorLink helper, and stopped cards self-linking on an Inventor's own page. The gate passed locally and in CI; new screenshots were sent. The merge awaits the user's sign-off. Opening the PR followed ADR-0003's auto-open default (agent-initiated)."
