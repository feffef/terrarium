frictions:
  - description: The Digest's first paragraph opened with a markdown PR link inside the first six words. journal.e2e.ts's digestBodySnippet() strips `[text](url)` links to empty string when computing the expected inline preload snippet, but the real MDC-rendered payload keeps the link's visible anchor text (e.g. "#695"), so the computed expected snippet ("... repairs landed (, ):") never actually matches the rendered page, failing pnpm gate:scoped's smoke suite until the digest prose was restructured to keep the first ~6 words link-free.
    solution: Fixed locally by moving the links later in the sentence (matches how every prior digest happens to be phrased). A more durable fix would be to make digestBodySnippet() preserve a link's visible anchor text instead of stripping the whole node to empty, so any digest phrasing is safe — worth a small frictions-to-fixes follow-up.
