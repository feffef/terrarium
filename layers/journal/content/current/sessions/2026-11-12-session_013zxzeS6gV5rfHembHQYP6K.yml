ideas:
  - "Make harvest step 3's tracker scan one compact line per issue (number, state, stateReason, labels, title): list-open-issues.ts printed about 9,300 lines of JSON for the closed list and no stateReason, so every run rebuilds it with jq and cannot tell a completed close from not planned without reading each issue."
  - Add a harvest rulings command that greps one keyword set across .out-of-scope, owner-decisions.md, visitor-loop decisions.md and the Tenant GLOSSARY.md product decisions, so the unrejected test is one call instead of reading four files in full (this run read each by hand).
  - "Have harvest draft print a Seedling scaffold from the extract: banner, key lines, the Where it came from session sentences, quoted entry words and the Sources filenames, so the agent writes only the idea, why and what-would-change parts; bodies of about 1,200 tokens were typed twice, once to a file and once into the issue call."
  - Let check-clusters verify mechanically that each unbuilt field names a path that exists in the repo and that each cited issue number appears in the tracker lists, so a cluster cannot pass on evidence that points at nothing.
