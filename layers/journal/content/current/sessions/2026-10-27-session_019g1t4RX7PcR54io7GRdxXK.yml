frictions:
  - description: Called search_issues without fields before reading github-integration.md; the guard blocked it, costing one retry.
    solution: Read github-integration.md before the first GitHub call, as CLAUDE.md says.
    severity: nit
  - description: Filed the issue before reading triage-labels.md, which CLAUDE.md requires before filing; the label I used was right.
    solution: Read the listed docs when the trigger first applies, not after the hook asks.
    severity: nit
  - description: Followed review fixes in 4 files with my own read instead of code-review, though a follow-up over 2 files is not simple by pr-workflow.
    solution: Count files before choosing the self-read path; the fixes were the reviewers' own findings and the gate passed.
    severity: minor
  - description: textwrap split hyphenated words in appended observations, so validate:content failed on four files and I rejoined them by hand.
    solution: Wrap with break_on_hyphens=False, or give audit-skills a script that appends observations.
    severity: nit
  - description: First drafts of notes used truncated session ids and PR counts GitHub already shows; review caught both.
    solution: Quote full ids from the data file when writing observations; step 5 already says so.
    severity: nit
