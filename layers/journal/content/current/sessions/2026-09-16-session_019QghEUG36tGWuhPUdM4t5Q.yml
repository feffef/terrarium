frictions:
  - description: The fact-checker's CONFIRMED-BUT verdict on the rulebook-migration-table.md mis-location finding didn't check the doc's originating issue (#867), which explicitly requested docs/research/ as the deliverable location - a decisive primary source it had available but didn't reach for.
    solution: When fact-checking a Mis-location finding on a doc that names or implies an originating issue/PR, the checker should look that issue up before concluding the current home is wrong, not just check the general docs/research-vs-issue convention in isolation.
    severity: moderate
  - description: A dispatched fact-checker's tool output triggered the harness's instruction-shaped-content scanner (flagged 'settings-json'), neutralizing some tags; on inspection the content was benign (legitimate discussion of .claude/settings.json while checking whether a guard existed).
    solution: No action needed this time since the content was benign, but worth recording as a case where the scanner's heuristic can fire on ordinary technical discussion of settings.json in a security-analysis context.
    severity: nit
