goal: Keep Tinkerfund Inventor portraits in light colours in dark mode
status: in-review
outcome: "Fixed and e2e-pinned in PR #2596; the Oct 4 fix had never applied"
summary: "Human-instructed: the user asked that Inventor portraits not invert in dark mode. A fix (f1b551f27, color-scheme: light on the SVG) was already on main, but a production-build screenshot showed it never applied: Lightning CSS lowers light-dark() into --lightningcss-* variables, so tokens resolve where declared (.tf-page), and theme.css's :is(.tf-tokens, :root:has(> .tf-page)) outranked the scoped svg rule. Fix: class tf-tokens on the portrait plus an .intro > svg selector; verified pixel-identical light vs dark. Agent-initiated: an e2e assert in the shell-theme flow (red on main, green here), since the earlier fix shipped without one."
