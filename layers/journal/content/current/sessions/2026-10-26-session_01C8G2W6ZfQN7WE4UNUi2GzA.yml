  - "Homepage digest list and Midden card clip with no read-on cue (single visitor); #2573 now adds a digests link for the first."
  - "Journal mobile: the status pill wraps to 'COMPLETE / D' on session cards; add white-space nowrap and let the date line wrap."
  - Friction Ledger opens on 14 days (about 12,000px, 47 clusters); default to 7 days or collapse below the top 10.
  - Glass Box lesson code excerpts fade out the key YAML description line; wrap long lines in frontmatter excerpts.
  - Journal Skills page says 'used in 0 sessions' for 9 of 11 Skills; say 'not used in the last week' or hide zeros.
  - Journal 404 ('No document at ...') has no way forward except the breadcrumb; add 'Back to the Journal'.
  - Glass Box term popover opens mid-sentence and splits the paragraph; anchor it to the word or show it below the paragraph.
