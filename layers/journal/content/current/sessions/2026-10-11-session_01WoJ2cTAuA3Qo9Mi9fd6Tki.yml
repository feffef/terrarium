frictions:
  - description: Read CONTEXT-MAP.md, CONTEXT.md and several scripts via cat/sed in chained Bash commands, breaking CLAUDE.md's 'Read files with the Read tool' rule
    solution: Use Read; chained reads load no path-scoped rule (ADR-0029), so a governing rule could have been missed
    severity: minor
  - description: First commit was titled journal(sessions):, the prefix git-conventions reserves for session-log commits; amended before opening the PR
    solution: Have commit-msg hook reject that prefix on a commit touching anything but a session log
    severity: minor
  - description: A test run piped into tail was blocked by the tail-pipe guard; rerun with output to a file
    solution: None needed; the guard message was clear
    severity: nit
  - description: The lander validates logs against main's schema, so a session adding log fields cannot use them in its own log until merge; found by reading log-session.ts
    solution: Mention it in the log-session Skill next to the schema note
    severity: minor
  - description: "First card screenshots showed collapsed details: setting el.open from script did not stick after hydration; clicking the summary worked"
    solution: "Add to verifying-ui-changes.md: open a details element by clicking its summary"
    severity: nit
  - description: The owner said 'Run /code-review before pushing' but the first commit was already pushed and the PR open; the review ran after the push
    solution: Run code-review before the first push on a non-trivial change, not only on request
    severity: minor
  - description: The trace's own comment said session-start rules 'carry no signal', an earlier design call the owner reversed; a stale test comment repeated it until review caught it
    solution: When reversing a recorded exclusion, grep for its rationale in comments and tests before committing
    severity: nit
