entrypoint: remote
cliVersion: 2.1.296
learnings:
  - Most ADR limits already live in Skills or code; the ones only in the ADR are the ones agents open it for, and repeated numbers in ADRs drift (ADR-0027's grace period).
  - A summary rule agent will narrow paths when its report recommends it, which can silently stop a rule loading where it is needed (ADR-0029 lost docs/agents/**).
ideas:
  - Add a gate check that every 'ADR-NNNN' citation in code comments points to an ADR whose text mentions the cited term, so repointing drift after an ADR rewrite is caught mechanically instead of by review agents.
