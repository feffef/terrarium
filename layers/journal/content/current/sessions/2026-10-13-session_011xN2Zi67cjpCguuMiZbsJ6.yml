outcome: All 30 ADRs, their rules and ~150 callers rewritten in one PR (#1898), awaiting a human merge
summary: "Human-instructed throughout: the owner asked me to read the ADR-rewrite handoff, survey the earlier test runs, grill and narrow their decisions into ADR-0030, build the new-ADR gate check, then \"be brave\": fix the prompt, rewrite all ADRs, repoint callers, review, and open a clean PR on a fresh branch, resolving open questions from git history first. The grilling settled readers, Scope instead of \"limits\" (an agent showed most limits already live in Skills/code, and copies of numbers drift), one home per fact, the keep/drop test, rejected-alternative test, fewer glossary terms, and a \"trace each part to its reason\" step; ADR-0030 was retitled and its template moved to docs/adr/TEMPLATE.md. Prompt v6 was tested on 5 ADRs (0004, 0015, 0022, 0023, 0028) and read far better than v1-v5; v7 added cross-batch reading. Then 24 blind caller-checklist agents and 24 rewrite agents ran in waves, 3 agents wrote summary rules, 4 agents repointed callers by disjoint file area, and a consistency agent plus the code-review Skill found cross-ADR contradictions (who merges guest and Public-request PRs, cross-Tenant reads, ADR-0007 overlap) that I settled and applied. Agent- initiated: filing #1895 and #1896 (owner then asked for them), #1897 for workflow comments agents can't push, and the decisions list in the PR. Real policy calls remain the owner's and are listed in #1898. The prep branch (PR #1892) keeps all working files. After CI went green, the owner asked for a handoff; HANDOFF.md on #1892 now records both branches' state and lists 13 contradictions and 9 open points for the review session."
