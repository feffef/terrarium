goal: Combine the two single-site template design drafts into one
status: completed
outcome: Combined design draft merged as docs/design/single-site-template-design-combined-draft.md; it is a proposal and decides nothing
summary: "The owner asked the session to read the four documents in docs/design, then to detail where the two design drafts differ, then to write a new draft that takes the best decisions from both, using Sonnet agents to explore the repo and the grilling Skill for owner input, later to run code-review with Opus, and finally to merge once CI was green. All of that was human-instructed. Agent-initiated: which repo facts to check, which decision records to read, and each choice between the two drafts that the owner was not asked about. Three read-only Sonnet agents reported how a log lands on main and where the session id comes from, how the gate and CI share their step list, and counts of Frictions and watcher observations; the session re-ran the counts it cites. Two rounds of questions settled thirteen points. The owner's answers changed the plan in three places: the draft describes both places for records without choosing, platform Skills keep a project-name prefix with the name left open, and the guide, dashboard and digests move into a separate owner area on its own port. Mid-work the owner added that the document must stand alone and cite none of the other four design notes, and twice said not to dwell on existing decision records. Two Opus reviewers found a retired glossary term used fifteen times, four internal contradictions, a lost access default and two leftover pointers to earlier work; a second commit fixed them, both reviewers re-checked it, and a third small commit closed what the re-check found. A GitHub credential outage then cost several retries: three failed pushes, a subscription to the pull request that never succeeded, and two failed merge attempts before the third merged. Left open for the owner in the draft itself: where records live, the stack, the platform's name, and the questions in its section 14."
