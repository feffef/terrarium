frictions:
  - description: Called the Agent tool for the Scout without reading the dispatch-subagents Skill first, so the dispatch-read guard blocked the call.
    solution: CLAUDE.md already says to read it before writing a brief; the curate Skill's Scout step could name dispatch-subagents so the read comes first.
    severity: nit
  - description: Subscribed to PR activity on a guessed PR number (1) before any PR existed, then had to unsubscribe and ignore a stale wake event.
    solution: Subscribe only with the number returned by create_pull_request; the PR-open hint could say so.
    severity: minor
  - description: Sent a background Bash call with a trailing nohup and ampersand as well as run_in_background; the double-background guard blocked it.
    solution: Pass run_in_background alone, as the guard's message and dispatch-subagents say.
    severity: nit
  - description: The run entry's changes line held a colon followed by a space, which YAML read as an object and failed validate:content.
    solution: The orient.ts skeleton or the curate Skill's State section could warn that a changes entry must avoid a colon followed by a space.
    severity: minor
  - description: Review fixes edited files while pnpm gate:scoped was running, so I stopped the gate and re-ran it, wasting several minutes.
    solution: Start the gate only after code-review fixes are done; pr-workflow already says edit nothing while it runs.
    severity: minor
  - description: get_session was not available to this session, so the Skill's cost_usd budget check and the PR's cost line could not be filled.
    solution: The curate Skill could say what to do when get_session is absent; the run reported cost as unreported.
    severity: minor
