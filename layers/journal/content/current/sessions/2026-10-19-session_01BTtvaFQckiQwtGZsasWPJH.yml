frictions:
  - description: Echoed a prefix of GH_TOKEN in a Bash command while checking the gh setup; the auto-mode classifier denied it as credential materialization.
    solution: Never print any part of a token; check gh with which gh or a harmless gh api call.
    severity: minor
  - description: "The first validate:content in a fresh worktree failed with tsx not found: the worktree had no node_modules, which dispatch-subagents warns about."
    solution: Run pnpm install in a new worktree before any pnpm exec; a worktree helper could do it.
    severity: nit
  - description: "The first #2233 commit used Closes, which would have closed the issue as completed instead of not planned, and its ref claimed the issue was already closed; the Spec review caught both."
    solution: Use a closing keyword only when completed is the right reason; otherwise close by hand.
    severity: nit
  - description: "gate:scoped ran on the pre-amend #2233 commit; the amend changed only one YAML string, and I re-ran only validate:content on it."
    solution: Amend before starting the gate, or re-run gate:scoped after any amend; CI's gate decides anyway.
    severity: nit
