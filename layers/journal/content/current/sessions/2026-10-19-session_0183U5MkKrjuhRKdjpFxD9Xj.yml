frictions:
  - description: save-handback.ts refused every subagent hand-back (final turn is a SubagentHandback tool call, 'no final text'), so I wrote my own extractor over the transcript JSONL.
    solution: Make finalText accept a handback tool call's text input as the final message.
    severity: moderate
  - description: Read git-conventions.md in the same command as my first git fetch/log, and the first-GitHub-op doc after pushing; the hook flagged the late read.
    solution: Read the first-op docs in a separate call before the first such command.
    severity: nit
  - description: "Single-home reviewer returned five findings and all were WRONG: it ignored the cited-issue placements and the Skill's own ledger procedure."
    solution: Brief Agent B to read each target doc's originating issue and header before reporting a mis-location.
    severity: nit
  - description: Monitor until-loop matched an early tool-use name and ended before the agent finished; foreground sleep was also blocked.
    solution: Match only the final-message shape; poll from the first attempt.
    severity: nit
  - description: Stop hook asked to push uncommitted/unpushed work while the gate and code-review still had to run first.
    solution: Have the hook skip its nag while a background gate is running.
    severity: nit
