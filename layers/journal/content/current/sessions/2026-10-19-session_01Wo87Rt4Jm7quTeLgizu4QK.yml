summary: "Started from a /grill-with-docs idea (from another session) that audit-skills step 5's wording gates Inventory observations too strictly. Grilling showed commit ec14392b had already reworded the gate a day earlier, and a subagent count showed re-confirmations without new ids were only ~13% of entries, so the user (human-instructed) dropped that part. The user then added a new ask: stop agents copying earlier observations and use a short free-format note, soft cap 100 words, no repeated git facts but key commit/issue/PR references allowed. I proposed wording, the user said go ahead, and I edited only the SKILL.md bullet. Two code-review subagents caught that I had loosened the append condition (the user had said existing rules stay) and some length and ambiguity issues; I restored the original condition and tightened the text before pushing. Opening the PR and subscribing were agent-initiated per ADR-0003. CI went green; I posted a verdict and merged it myself with merge-pr.ts (a Skill prose edit, not Human-only)."
