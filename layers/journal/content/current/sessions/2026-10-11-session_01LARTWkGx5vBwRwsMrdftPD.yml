outcome: "ADR-0029 merged (PR #1762): file-bound instructions live in .claude/rules/; follow-ups filed as #1763, #1764, #1765"
summary: "Human-instructed throughout. The owner first asked me to explain how ADRs reach agents through .claude/rules/; I traced PR #1741's mechanism. Asked whether it was documented, I found no ADR, glossary term or how-to. The owner ran /grill-with-docs and asked for an ADR that widens the idea: any instruction a glob can match to its files moves into a path-scoped rule. Sixteen questions were settled in rounds; the owner agreed to my recommendations except two choices of their own: the wording \"file-bound\" and the title, and keeping rules short instead of globs narrow (\"I don't mind the noise\"). At the owner's request I tested Bash reads: a lone single-file cat/head/sed -n/grep loads path rules, piped, chained and multi-file commands do not. My first chained test led me to overclaim that Bash reads never load rules; PR #1741's evidence and controlled tests corrected that. The owner then asked for a Sonnet agent to inspect the six sessions since #1741; its findings (broad firing, partial reads a rule cannot prevent, measurement gaps) went into the ADR. The owner asked to add a log-session instruction for Frictions about unrelated rules, which I did, and I filed #1763 as agreed. The owner then ran /code-review against origin/main with the grilling decisions as spec; it found 8 Standards and 3 Spec issues, chiefly the ADR contradicting itself on \"read the full ADR\". The owner approved all fixes and the exception for session-start ADR rules; I filed #1764 and #1765 for the untracked follow-ups. The owner enabled auto-merge and PR #1762 merged. A session resume then rolled the log scratch back; the owner noticed the completed log was missing and I re-landed it."
