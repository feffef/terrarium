outcome: "ADR-0029 drafted with its rule, a Rule glossary term and a CLAUDE.md line; PR #1762 waits for a human merge"
summary: "Human-instructed throughout. The owner first asked me to explain how ADRs reach agents through .claude/rules/; I traced PR #1741's mechanism (rule frontmatter paths, the adr: hash and validate-adr-rules, skill-rules-hint.ts, the human-merge paths, rulesLoaded tracing). Asked whether that was documented anywhere, I found no ADR, glossary term or how-to. The owner then ran /grill-with-docs and asked for an ADR that widens the idea: any instruction a glob can match to its files moves into a path-scoped rule. Eleven questions were settled in rounds (owner agreed to all recommendations; the title wording and \"file-bound\" replacing \"path trigger\" came from the owner). At the owner's request I tested Bash reads before writing: a lone single-file cat/head/sed -n/grep loads path rules, while piped, chained and multi-file commands do not. My first test (a chained command) led me to overclaim that Bash reads never load rules; a research subagent's PR #1741 evidence contradicted that and controlled tests settled it. PR #1762 adds ADR-0029, its rule, the Rule glossary term and the CLAUDE.md reason line. Follow-ups named in the ADR (a Bash hint hook, migrating CLAUDE.md's file-bound triggers, gate checks for non-ADR rules) were not built. The PR is Human-only, so the owner merges it."
