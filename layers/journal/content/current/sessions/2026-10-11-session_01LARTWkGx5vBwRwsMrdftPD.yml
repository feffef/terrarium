frictions:
  - description: "Broke CLAUDE.md 'Read files with the Read tool': read many governed files via chained or piped Bash, so their path rules (human-merge on .claude/settings.json) never loaded."
    solution: Auto-mode harness text invites cat/sed/grep; a PostToolUse Bash hint for compound reads (ADR-0029 follow-up) would make this harmless.
    severity: moderate
  - description: "Broke 'Verify before you state': declared Bash reads never load rules from one chained-command test; PR #1741 evidence and controlled tests showed lone single-file reads do."
    solution: "Vary one factor per test before generalising; check prior evidence (PR #1741 Checks) first."
    severity: minor
  - description: "Skipped session-start reading: did not read CONTEXT-MAP.md and CONTEXT.md in full before answering; read the map later and CONTEXT.md only in part."
    solution: Read both before the first answer, even for an orientation question.
    severity: minor
  - description: Ran git log on .claude/rules to draw conclusions in the first turn before reading docs/agents/git-conventions.md, as CLAUDE.md requires.
    solution: Read git-conventions.md before any history-drawing git command; a path rule cannot fire on a git command, so this stays prose.
    severity: nit
  - description: Dispatched a research subagent that ran git show/log without reading the dispatch-subagents Skill first (CLAUDE.md trigger).
    solution: Clarify whether read-only git in a subagent counts as touching git; if not, narrow the trigger.
    severity: nit
