frictions:
  - description: The first two turns only answered a question (reading docs), and I did not invoke close-session at the end of them as CLAUDE.md asks
    solution: Treat a pure read-and-summarize turn as session closure and invoke close-session; re-invoking later is safe
    severity: minor
  - description: The brief agent's re-wrap follow-up still left three lines over 80 columns. I fixed them myself in an extra commit.
    solution: Ask the agent to check line length with an awk command before committing a re-wrap
    severity: minor
  - description: git status on the ADR agent's auto-removed worktree path printed every file as deleted, which briefly looked like data loss
    solution: Check git worktree list before running git -C on a finished agent's worktree path
    severity: nit
  - description: My own candidate list for the brief missed the home-page cache contradiction (ADR-0028); only the subagent's code check found it
    solution: When building candidate findings, grep each claim in the brief against nuxt.config.ts and the Skills, not only against other docs
    severity: nit
  - description: I told the Journal agent to push its branch before running code-review on it, breaking ADR-0004's review-before-first-push rule; the review ran after the push, before the PR
    solution: Always run code-review on a subagent's branch before telling it to push, as the dispatch-subagents Skill's Scope-and-trust section says
    severity: minor
  - description: For the Glass Box branch I used one combined Standards and Spec reviewer instead of the code-review Skill's two parallel axes
    solution: Follow the code-review Skill as written, even for a mostly re-pin diff, or record why a single reviewer is enough
    severity: nit
  - description: The auto-mode classifier denied the Glass Box subagent's git push with no reason, after the brief and Journal agents had pushed the same way; the branch is stranded until the owner answers
    solution: Have the orchestrator, not the subagent, push reviewed branches, so one permission context covers every push
    severity: moderate
  - description: "Agents disagreed on whether dependabot-sweep is a Routine: the Journal agent added it from its SKILL.md alone, the other two left it out for lack of evidence"
    solution: Give every agent in a parallel batch the same ruling on a shared fact; settle it before dispatch (dispatch-subagents §1)
    severity: minor
