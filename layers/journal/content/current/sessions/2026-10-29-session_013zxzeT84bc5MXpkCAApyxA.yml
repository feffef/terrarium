goal: Find and fix stale facts across Terrarium's overview docs
status: completed
outcome: "Four PRs merged (#2675 brief, #2676 Journal pages, #2677 Glass Box, #2678 owner follow-ups); ADRs needed no change"
summary: "Human-instructed throughout. The owner first asked me to read the interactive-map diagram brief, all 30 ADRs, the Journal's five start-here pages and every Glass Box guide Lesson. Then they asked me to find stale docs, contradictions and gaps in them and fix them with Sonnet subagents, using git history, PRs and issues. Before dispatching I asked four questions. The owner chose: fix and open PRs, all four document groups, code plus ADRs on main as ground truth, one PR per group. I dispatched four Sonnet agents in separate worktrees, each with candidate findings to confirm or refute. The ADR agent found every path, identifier and claim in the 30 ADRs true, so there was no PR. The brief agent confirmed the candidates and found the now-cached home page (PR #2675). The Journal agent fixed the deploy step, the gate list and the merge reservations; I added the Friction Ledger and the prune-trial issue outcome after review (PR #2676). The Glass Box agent re-pinned all guide pages and fixed the prune-trial verdict, the Heavy term and the survey window. Its push was denied by the classifier, so I asked the owner, who approved my pushing it. A concurrent glassbox-improve run had re-pinned four of the same pages, so I merged main and took its pins (PR #2677). The owner then answered three open questions. `dependabot-sweep` is a Routine that starts on a Dependabot PR; its trigger never fired because of a wrong username. The owner also asked me to fix the root Heavy glossary entry and the \"atomically swaps\" wording. I made those edits myself, and review found the same wording in docker-compose.yml (PR #2678). Every PR got a Standards and Spec review and a green gate, and I merged each one."
