learnings:
  - "Sandboxed Bash cannot hold an ssh session to vigia: TCP connects but the banner exchange times out."
  - Terrarium's production build peaks at about 2.1 GB RSS, right at the edge of what vigia can spare.
ideas:
  - "Have deploy/entrypoint.sh post a GitHub commit status (success or failure, with the served SHA) after each build, so cloud agents can see a stale or failed deploy without server access and #3029-style incidents surface in minutes instead of hours."
