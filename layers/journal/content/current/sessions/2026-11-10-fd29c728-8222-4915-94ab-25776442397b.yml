outcome: "Deploy builds are intermittently OOM-killed; 2 GB swapfile added on vigia, documented in merged PR #3035, #3029 closed"
summary: "Human-instructed: the owner asked me to inspect deploy-terrarium-1's logs on vigia over ssh for issue #3029, then (explicit green-light) to post the findings and add a swapfile. The build of 95de88ccb was killed by the kernel's global OOM killer at 04:41 UTC after 28 minutes of memory pressure (a normal build takes ~55 s); entrypoint.sh then waited for the next commit, as the issue's theory said. Fetch never failed. The container log shows 10 OOM-killed builds since 2026-09-28, 6 since 2026-11-07, and one recurred live during the session (05772903a at 08:18), recovering only because ee9aee159 landed. The build's node peaks at ~2.1 GB beside openclaw (~560 MB) and dockerd (~310 MB) on a 3.8 GB host with no swap. I posted the findings on #3029, then created /swapfile (2 GB, persisted in /etc/fstab, backup at /etc/fstab.bak-2026-11-10). At close, on the owner's instruction, I removed the clean worktree terrarium-2175 (its branch stays local) so the log could land. No repo change: the capped retry in deploy/entrypoint.sh still awaits the owner's decision on #3029. Then, on the owner's instruction, I documented the swapfile and the measured build peak in deploy/README.md (PR #3035, merged by me once CI was green; it also correcting its claim that an OOM-killed build retries) and commented on and closed #3029, naming the capped retry as not done. The session was restarted once because a stale TMPDIR broke every guard hook."
