frictions:
  - description: "Regression: shallow-clone check-first rule (issue #703) still not followed by agents in 2 more sessions, despite its exact fixed wording already live in docs/agents/git-conventions.md — a 4th round of the same gap (#413 -> #682 -> #703 -> now)."
    solution: "Filed #772 as a distinct regression issue rather than a 5th prose tweak; recommended a mechanical nudge (SessionStart hook or preflight script) and escalated to the user for the design decision, per the skill's regression-handling rule."
    severity: major
  - description: Survey subagent's `session-frictions.ts` default-20 output (37KB) blew the Bash tool's inline-output cap and silently redirected to a spill file instead of erroring.
    solution: Expect this pattern up front; read the persisted file directly rather than relying on inline stdout.
    severity: nit
  - description: Both the survey subagent and I independently hit the known `search_issues`/`search_pull_requests` total_count:0 false-negative bug repeatedly while duplicate-checking candidates, forcing fallback to full `list_issues` scans each time.
    solution: "Already tracked by a separate fix (PR #744/issue #741); this run is more evidence the fallback-to-list_issues habit is the right one until that lands more durably."
    severity: moderate
  - description: "`scripts/merged-since.ts`'s `git fetch` progress line landed in the same file as its JSON output when the subagent redirected `2>&1` together, breaking `json.load`."
    solution: Redirect stdout and stderr separately when calling merged-since.ts; note this in the script's usage comment.
    severity: minor
  - description: 'Confirming the real scope of a "fixed" candidate (e.g. whether #740 closed the actual gap or only a misleading comment) required reading the issue body and commit diff by hand each time, since merged-since.ts only returns commit subjects.'
    solution: Subject-matching alone risks a false 'fixed' classification; worth flagging in the skill or script docs.
    severity: minor
  - description: "The #773 impl agent stalled twice waiting on a backgrounded `pnpm gate:scoped`, checking once and stopping instead of monitoring to completion — the exact issue #602 failure mode recurring despite the dispatch brief explicitly naming Monitor/log-tail as the confirmation method."
    solution: Resumed it via SendMessage each time with the actual process state I'd verified myself. A future dispatch brief may need an even more forceful instruction, or tooling that verifies backgrounded-command completion for the subagent rather than trusting it to keep polling.
    severity: major
  - description: "The #773 impl agent's backgrounded process was silently killed by this orchestrating session's own resume event (~4h after dispatch, no error, no notification) — only discovered because the user asked \"Is the agent really still running?\" and I had to verify independently via SendMessage (\"had no active task\")."
    solution: Generalizes the already-documented CronCreate/session-resume caveat to backgrounded Agent-tool subagents too. After any session-resume event, proactively re-verify outstanding backgrounded subagents' liveness rather than passively waiting on a notification that may never arrive.
    severity: major
  - description: "Mistakenly called `ScheduleWakeup` (scoped to `/loop` dynamic mode) right after dispatching background impl agents in this plain scheduled routine; had to call it again with `stop: true` to cancel."
    solution: Background Agent-tool notifications arrive automatically without ScheduleWakeup; reserve that tool strictly for actual /loop sessions.
    severity: nit
  - description: "`list_pull_requests` returned a stale `merged: false` for PR #781 immediately after `merge-pr.ts` had already reported `merged: true` and merged it."
    solution: After a merge, prefer pull_request_read (method get) over list_pull_requests for the just-merged PR's state — the list endpoint can lag.
    severity: minor
  - description: 'The #773 impl agent self-caught a trailing `&` appended to a `run_in_background: true` Bash call for `pnpm gate:scoped`, which produced a false "completed" signal — the exact footgun CLAUDE.md already documents, still hit despite the existing warning.'
    solution: No new fix — already documented. Recurrence is evidence the prose warning alone isn't fully preventing the mistake; worth a future pass considering a mechanical guard if it keeps recurring.
    severity: moderate
