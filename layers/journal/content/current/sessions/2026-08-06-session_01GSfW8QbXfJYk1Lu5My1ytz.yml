frictions:
  - description: "Issue #853's solutions-considered listed only two candidate homes; github-integration.md, which claims the mcp__github__* surface in its own header, was never weighed."
    solution: When a fix relocates a rule between docs/agents/*.md, enumerate candidates from those docs' own stated ownership headers rather than from the issue's list alone.
    severity: minor
  - description: The Stop hook's unpushed-commit prompt fired while both review subagents were still running, so the branch was pushed before findings could be folded in.
    solution: Cost an amend plus a force-with-lease re-push for a one-line nit. Dispatching review before the first push, or accepting a follow-up commit, both avoid it.
    severity: nit
  - description: "Wrote an angle-bracketed placeholder into issue #880's title and body; GitHub silently stripped it, and the first corrective edit repeated the mistake."
    solution: github-integration.md documents this exact trap and I had read that file earlier in the session, so prose was not the gap. A provenance-guard-style PreToolUse check on GitHub bodies for bare angle brackets would have caught it at write time.
    severity: minor
