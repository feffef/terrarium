learnings:
  - This repo's bar for escalating a doc rule to a PreToolUse guard is that the failure is SILENT, not merely that it recurred — a loud, self-correcting footgun stays doc-only however often it repeats.
  - "A 'never' rule whose stated rationale covers only some of its cases is a latent regression: #301's wording only explained self-authored PRs, leaving the fork-PR case visibly unargued."
ideas:
  - "Add a validate-docs-pointers.ts step to the gate that resolves every 'see <doc>.md's recipe (step N)' cross-reference against the target's actual numbered list, failing when N doesn't exist. This session created exactly such a pointer, and step numbers in pr-workflow.md renumber silently whenever a step is inserted — the pointer keeps rendering fine while aiming at the wrong rule, which is the same invisible-drift shape that produced #853 in the first place."
