frictions:
  - description: "Opened PR #735 at the first (Midden-link) commit but never invoked close-session/log-session then, per CLAUDE.md's \"opening the PR is the first session log\" rule. The user had to ask \"Session logged?\" to prompt this closure. HUMAN-PROMPTED-CLOSURE."
    solution: Invoke close-session right at PR-open, before replying, not after a later prompt.
    severity: major
  - description: Sent three Agent tool calls with run_in_background:false in one message expecting them to block and return inline, but all three launched as async background agents anyway, arriving later as separate notifications.
    solution: Treat a multi-agent dispatch in this harness as always-async regardless of run_in_background; plan the turn around notifications, not an inline return.
    severity: minor
  - description: Backgrounded `pnpm gate:scoped > log 2>&1 &` inside a Bash run_in_background call; the outer call reported "completed" almost immediately since it only waited for the detached shell to return, not for gate:scoped itself, which was still running minutes later.
    solution: Don't put a trailing `&` inside a command already passed to run_in_background — let the tool background it, or from the start use Monitor/ps to track the real child process and a log completion marker.
    severity: moderate
  - description: The redirected vitest reporter's plain-text log omitted some individual e2e `it` lines (only ~70 of 76 printed) even though the aggregate pass/fail count and exit code were accurate — could be misread as missing test coverage if only skimming printed lines.
    solution: Verify via the aggregate summary line and exit code, not by grepping for every individual test name in a redirected log.
    severity: nit
  - description: "A safety-gate PR comment cited a SHA that didn't match the PR's actual head SHA (a synthetic merge-test commit GitHub Actions sometimes reports against) — recurred on both pushes to PR #735 in this session."
    solution: Cross-check the Actions API's workflow-run head_sha directly instead of trusting the comment's cited SHA when they disagree.
    severity: nit
