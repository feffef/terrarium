learnings:
  - A Tenant layer's global CSS (registered via that layer's nuxt.config.ts `css:` array) loads app-wide, not scoped to that Tenant's own routes — so `var(--midden-accent)` resolves correctly even on the root index page outside `/t/midden/*`.
ideas:
  - A `/design-bakeoff` command formalizing today's ad-hoc pattern — dispatch N model-diverse Agent proposals in isolated worktrees, each building + auto-screenshotting desktop and mobile, then presenting them side by side for the human to pick — since this is a workflow likely to be asked for again for other pages/components.
