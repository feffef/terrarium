goal: Re-cluster the Friction Ledger by fix, then run frictions-to-fixes
status: in-review
outcome: "Ledger re-clustered (102 to 140 entries) and fix PR #2441 merged; closing ledger PR #2442 open; six issues filed"
summary: "The owner invoked frictions-to-fixes with the ask to put extra effort into re-clustering the Friction Ledger so no entry mixes frictions with different root causes or fixes. Before starting I asked four questions; the owner chose: all 102 entries, a dedicated re-cluster pass before the survey, split whenever the occurrences need different fixes, and a full run afterwards. The re-cluster design (five themed slices, one agent each, then one consolidation agent applying the cross-slice moves I approved, then a global pass) was mine. Result: 140 entries; a script showed every distinct occurrence block survived except four duplicates dropped under the one-session rule. The biggest catch-alls (binding-docs-skipped, late-read-first-docs, code-review-skill-two-agents-skipped, closure-not-invoked-on-answers, flaky-e2e) split into pieces whose fixes differ, and statuses moved to the piece they covered (PR #2066 checked for the late-read pieces). Then the Skill ran as written: the survey added 25 occurrences and two missed fix PRs; its ranking covered only window-active entries, so I added never-fixed entries the re-cluster exposed from --candidates. I filed regressions #2434 to #2436. The design agent proposed four fixes for ten picks; the owner chose to file fix A (glossary @imports, #2437) and fix C (dispatch trigger wording, #2438) rather than build them; fix B is Human-only (#2439); five picks were dropped with notes. Fix D (one github-integration.md bullet on check-run annotations) is built by a Sonnet agent; code-review found it overstated annotations and contradicted the doc's get_job_logs tail advice, so it went back for a second commit. Ledger PR #2440 merged; fix D merged as #2441 on its own branch (the owner allowed the extra branch); the closing ledger PR #2442 is open."
