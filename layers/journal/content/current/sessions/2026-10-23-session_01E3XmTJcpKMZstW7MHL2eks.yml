frictions:
  - description: A bash while-read loop had no input redirect, so it read stdin and hung until the 120s timeout; I had to stop it and redo the fill in Python.
    solution: Redirect the loop's input (done < file) or loop in a script; nothing in the repo to change.
    severity: minor
  - description: Ran git log, fetch and merge --ff-only before reading git-conventions.md, which CLAUDE.md requires before the first git command beyond status and diff.
    solution: Read git-conventions.md in the session-start batch when a Skill run will touch git; read-only here, no harm.
    severity: nit
  - description: Pushed the branch (inherited session-log commit only) at a Stop-hook nag before reading pr-workflow.md, which CLAUDE.md requires before any push.
    solution: Read pr-workflow.md before answering the first Stop-hook push nag.
    severity: nit
  - description: The survey ranked only entries with window activity, so never-fixed entries the re-cluster exposed (12 truncated reads, 9 triage-doc misses, 7 dispatch misses) were missing; I ran --candidates myself to pick them.
    solution: "survey-brief.md: rank from prune-friction-ledger.ts --candidates (all never-fixed entries with recurrence), not only entries that gained occurrences this window."
    severity: minor
  - description: My consolidation brief listed session ids partly as suffixes (ki1C5ArD, NqN7), copied from slice reports; the agent had to add suffix matching to find them.
    solution: Give full session ids in briefs; slice agents should report full ids, not trimmed ones.
    severity: nit
  - description: The recluster brief's one-session-per-entry rule dropped four distinct friction texts when a move met the same session already in the target.
    solution: When a moved block's text differs from the target's block for that session, keep the one whose text names the target's cause, and list both in the report for the main session to pick.
    severity: minor
  - description: Recluster slice agents' cross-slice targets went stale mid-run as other slices created entries; proposals named entries that had just split.
    solution: Run splits in parallel, then cross-slice moves in one serial pass (as this run did); say so in the brief.
    severity: nit
  - description: design-brief.md has a dangling fragment after PICKS ('...what the survey found about it). You') and points to audit-docs house rules that SKILL.md has no section for; the design agent used the eight lenses.
    solution: "Fix the sentence and name the eight lenses in design-brief.md (tracked with the briefs regression, issue #2436)."
    severity: minor
  - description: "Re-clustering reached misread-owner-instruction's 'revisit on a fourth' threshold with no new occurrence, and gave worktree-guard-blocks-compound-bash PR #1825 as a fix though #1825 introduced the guard, so it reads as a regression."
    solution: When a re-cluster moves fix PRs or occurrences, add a dated note on each entry whose counts or fix state changed without new evidence.
    severity: minor
  - description: After the impl agent's hand-back the harness moved my working directory into its worktree, the worktree-cwd-switch cluster again; I kept to absolute paths.
    solution: Accepted harness behaviour; absolute paths.
    severity: nit
  - description: First draft of the doc fix overstated that annotations always name the failing file and contradicted the same doc's get_job_logs tail advice; code-review caught both before push.
    solution: Fact-check a new doc claim against a live run and grep the target doc for the same tool before drafting the design text.
    severity: nit
  - description: Pushed the restarted branch with --force-with-lease and got a stale-info rejection, though pr-workflow.md says to push a branch restarted after its merge plainly.
    solution: "Follow pr-workflow.md: push plainly after restarting a merged branch."
    severity: nit
  - description: A git commit passed both -m and -F and failed, so the closing PR's gate ran on the uncommitted tree; the tree was identical to the commit, but it cost a check.
    solution: Commit before starting the gate, and check the commit landed before the gate step.
    severity: nit
