summary: Scheduled audit-docs run (no human prompt). Concision family chosen from the newest family commit (root), so this run was docs/agents. Four read-only reviewers (Freshness, Single-home, Concision, Coherence) returned 17 findings; I merged overlaps, and two independent checkers returned 3 CONFIRMED, 5 CONFIRMED-BUT and 9 WRONG. Rejected ones were mostly rewrites that lost a rule, a why, or ground held by an open prune trial or a deliberate earlier audit commit. I applied only checker-confirmed text across seven files, ran code-review (one judgement call, an ambiguous step reference, fixed), ran gate:scoped green, pushed, opened PR 2358 and posted the verdict. No ADR edit, no issue filed, so no escalation PR. Everything was agent-initiated under the schedule's stored prompt; no human instruction beyond it.
