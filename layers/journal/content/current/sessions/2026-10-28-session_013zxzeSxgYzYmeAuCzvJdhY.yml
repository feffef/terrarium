frictions:
  - description: Dispatched the three visitors before reading dispatch-subagents; the dispatch-read guard blocked all three calls and they were resent unchanged.
    solution: CLAUDE.md names the trigger; visitor-loop step 2 could say to read dispatch-subagents first.
    severity: nit
  - description: Started gate:scoped before code-review, against pr-workflow order (review, then gate last); stopped it and reran, wasting a few minutes.
    solution: visitor-loop step 5 says commit, review, then push; add that the gate runs after review.
    severity: nit
  - description: The tally's `git log origin/main --grep` search ran on a shallow clone and said no match for threads; a merged PR (2383) already existed. Only the refiner's GitHub search caught it.
    solution: visitor-loop step 3 should use GitHub search for merged PRs, or unshallow first.
    severity: minor
  - description: Stop hook repeatedly asked to push uncommitted/unreviewed work, conflicting with ADR-0004's review-then-gate-then-push order.
    solution: Hook could skip the nag while a scheduled run is mid-review.
    severity: nit
  - description: Double-background guard blocked a Bash call that used both run_in_background and a trailing &.
    solution: None needed; guard worked as designed.
    severity: nit
  - description: Skipped code-review on both follow-up commits (over 10 lines and 2 files) and read the diffs myself, against pr-workflow's larger-follow-up rule; the reviews were clean on their first rounds.
    solution: Count lines and files before judging a follow-up simple; run code-review on its own diff.
    severity: minor
  - description: "Tried initial-letter as a copy fix for the drop cap, rebuilt and measured, then reverted: Chromium drops the space after any floated or initial-letter cap. One build and screenshot cycle wasted."
    solution: Test the copy behaviour in the already-running preview with an injected style before editing source.
    severity: nit
