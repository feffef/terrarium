frictions:
  - description: Commit was blocked because I hand-wrote the attribution trailer the harness system-reminder told me to add; the repo guard forbids it.
    solution: The guard's deny message explained it; re-committed without the trailer.
    severity: nit
  - description: The PR's provenance first line needs a model name, while the harness says to keep model identifiers out of PR bodies; I used 'Claude Code' and the guard accepted it.
    solution: Have the guard's deny message say which name to use instead of a model-name placeholder.
    severity: nit
  - description: The skill grew by 5 lines, which goes against the simplify-first rule, but a human asked for the change outright, which the rule allows.
    solution: None needed; noted in the PR.
    severity: nit
  - description: My first rewrite of the digests reworded the old digest text instead of summarising the session logs, so it wasn't a real dry run; the user had to ask again.
    solution: When asked to show what a skill would produce, run the skill's real inputs rather than paraphrasing its old output.
    severity: minor
  - description: My first 'Also shipped' wording ('PRs the prose didn't mention') let every agent keep all PRs in the prose and drop the line; it took another round to state the intent (routine PRs out of the prose).
    solution: Put the goal in the instruction, not just a mechanical rule.
    severity: minor
  - description: For the dry run I told agents to read session YAMLs by file-name date, which differs from gather's UTC end-time boundary; 09-24 got 10 sessions instead of 8 until the review caught it.
    solution: Dry runs should use the skill's own gather output.
    severity: moderate
  - description: The skill's own example 'the daily docs check' broke CLAUDE.md's never-say-when rule for scheduled jobs, and four digests copied it; the cadence validator only scans the Skill Inventory, so it wasn't caught automatically.
    solution: Fixed the wording; consider extending validate-skill-cadence to cover digests.
    severity: minor
