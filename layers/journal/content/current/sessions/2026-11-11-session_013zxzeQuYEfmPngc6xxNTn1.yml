frictions:
  - description: My first Agent call (the Scout) was blocked by the dispatch-read guard because I had not read dispatch-subagents first, though CLAUDE.md says to.
    solution: List dispatch-subagents in the glassbox-curate Skill's Read first, since the Scout is its first subagent.
    severity: nit
  - description: The writer brief named EVERY-PAGE but not its rules on ADR paraphrase, motive clauses and publishedAt; code-review then found them and a second writer round was needed.
    solution: "Give writers a short checklist in the glassbox-curate Fix step: no ADR paraphrase in watch bullets, no ids in excerpts, bump publishedAt when a claim is added."
    severity: moderate
  - description: Fresh readers flagged repeated Term parentheticals as duplicated page text, though they render from Term entries; I had to tell the writer to ignore them.
    solution: Have plain.ts mark rendered Term glosses, or tell readers in the brief that parenthesised glosses are generated.
    severity: minor
  - description: The Stop hook demanded commits mid-run several times, so intermediate states were committed and pushed before the claim checks had finished.
    solution: "Accepted: a branch push opens no PR; no change needed beyond noting that WIP commits are expected during a curate run."
    severity: nit
