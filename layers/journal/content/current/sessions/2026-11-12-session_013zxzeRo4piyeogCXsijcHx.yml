frictions:
  - description: Orientation output was 69 KB for one Subject, so reading it took paging; the guide index files were another 80 KB read whole.
    solution: orient.ts --subject could print only the Subject's page bodies once; the index files are already read from the first run.
    severity: minor
  - description: The Stop hook demanded commits and pushes while subagents were still running; two extra commit and push turns resulted.
    solution: Commit page edits right after the writer returns, before launching checkers.
    severity: nit
  - description: The memory page hit its word cap again and two same-day items had to be swapped for each other; the reviewer then called one cut premature.
    solution: Make the cap check part of orient.ts output so a run budgets its additions before writing them.
    severity: minor
