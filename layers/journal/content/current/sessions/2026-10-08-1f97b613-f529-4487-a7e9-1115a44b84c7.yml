frictions:
  - description: "Local gate:scoped failed typecheck in two Atlas files untouched by the diff. Cause: stale node_modules (an untracked package-lock.json suggests a stray npm install). Cost one full gate run plus a reinstall."
    solution: environment-caveats.md already names the fix (rm -rf node_modules .nuxt; pnpm install --frozen-lockfile); gate.ts could warn when package-lock.json exists beside pnpm-lock.yaml
    severity: minor
  - description: gate:scoped counted an unrelated untracked .archify/ folder as changed, so it ran the full gate on a docs-only (Inert) commit
    solution: scripts/gate.ts could scope to tracked/staged paths (or the branch diff) rather than untracked files
    severity: minor
  - description: "Pushed without a fully green gate:scoped. Floor, unit tests and build passed; e2e could not launch because no Playwright Chromium is installed locally (CLAUDE.md Self-verification). Low impact: the pushed change is Inert, so CI skips Heavy."
    solution: Run `pnpm exec playwright install chromium` once locally, or have gate.ts detect a missing browser and say so up front
    severity: minor
  - description: Read several docs (CONTEXT.md, git-conventions.md, the ADR-0003 head) with cat/sed in Bash instead of the Read tool (CLAUDE.md Working conventions). No impact; none of them were edited.
    solution: Use Read for docs; auto-mode's 'shell reads are fine' system hint competes with CLAUDE.md here
    severity: nit
  - description: Did not grep docs/adr for the touched path docs/research before writing (CLAUDE.md Docs you must read first), though many ADRs were read as source material
    solution: For docs-only research notes the ADR trigger is low-value; consider scoping it to code/config changes
    severity: nit
  - description: "Could not subscribe to PR activity: this local CLI session has no mcp__github__subscribe_pr_activity tool, so babysitting depends on the user returning"
    solution: pr-workflow.md could name the local-CLI fallback (gh pr checks --watch, or hand-off to the human)
    severity: minor
  - description: The first-pass briefs missed key high-level pieces (Nuxt Content, content files, build-time principle, issue lane, Skill evolution, the human's real tasks) and over-explained plumbing. Only a user-requested review caught it, which cost a full rewrite round.
    solution: For overview research, run an adversarial completeness/over-detail review before opening the PR, and ground the human-actor section in real session goals from the start
    severity: moderate
  - description: A combined python-edit + gh pr edit + gh checks --watch command was rejected by the user mid-run, but its first parts had already run, so the PR body was half-updated
    solution: Keep outward-facing steps (PR edits) as single, separate commands so a rejection leaves a clean state
    severity: minor
