summary: "Human-instructed: the user asked for the research groundwork (not the diagrams) that a later session will use to draw two interactive diagrams. One covers the Nuxt app architecture. The other covers how humans, agent sessions and \"gitlab\" improve the Platform, with emphasis on the Routine and session-log self-improvement loop. Output: two markdown documents with pointers to real files, and explore agents allowed. The forge is GitHub; the briefs say so. Two Explore agents mapped the app and the process. I then verified their key claims against source: nuxt.config modules, gate.ts Floor/Heavy, deploy poll, Blog queryPages call, pr-workflow merge tiers, ADR-0003 ledger, settings.json hooks, merge-pr refusals, CI doorbell, session status enum and the scope of validate-skill-cadence. I tabulated Routine fire times from the 2026-10-01..08 session logs. The agent-proposed \"routines fire every 90 min\" reading was wrong; each fires once a day at a stable UTC time. The briefs also list doc/code gaps for honest drawing. Examples: the Platform home reads Tenant tables outside the Catalog; ideas are never promoted to issues; Dependabot auto-merge is still a Proposal. This same session id had already drawn diagrams before a /clear; this run produced only the research notes, as asked. The briefs live in docs/research/ (agent's choice of home). main was red on e2e because another session's log quotes the smoke test's 404 marker; the user said another session handles it, so I left it. Second round, human-instructed: the user asked for subagent reviews of both briefs. Questions: were all key components, actors and processes covered, and was anything over-explained? Two reviewer agents found real gaps that my first pass missed. Architecture: content files, Nuxt Content as the engine, the \"decide it at build time\" principle, GitHub as deploy source, layers changing Platform config. Process: Skill evolution, the issue lane, what the human actually does (mostly assessing Routine output), the auto-triage standing green-light, human idea harvest. They also found errors: \"adding a Tenant needs nothing else\", frictions-to-fixes hard-fix handling, a \"four roles\" list of five. And much over-detail (signatures, script names, times, PR numbers, plumbing). I spot-checked their claims (one miscount: the pack has 25 Skills, not 26). I grounded the human section in this week's human-started session goals. On the user's \"yes\" I rewrote both briefs and pushed a second commit to PR 1694. Third round, human-instructed: the user asked for another subagent review. The reviewers got the original task and the round-1 brief. The focus: what an outside visitor needs, facts, simple language over project jargon, and structured items that map onto diagram nodes. Both reviewers' key claims checked out: all 7 Tenants have their own pages, so the generic renderer is a fallback; Routine is defined in ADR-0010; there are four Observability altitudes; digest backfills; blog-post can add a reply. I rewrote both briefs: plain words with terms in parentheses, ADRs moved to Further reading, and node/edge tables per zoom. At the user's request I removed the cross-references to the Journal's own architecture/how-it-works pages and the companion/GitHub line. PR CI fails only on the inherited red-main e2e failure, which another session owns. Fourth round, human-instructed: the user asked for another review, then rewrites. Its concerns: plain language had drifted away from project terms, important concepts were missed (browse uncovered repo areas), and some minor things sounded too important. Mid-round the user added a fourth agent to compare the two briefs, said SKILL.md files beat the Journal's how-it-works.md for correctness, asked to write into docs/diagrams/, and said PR 1690 (protect-main ruleset) had merged. Four reviewers ran: two terminology, one repo coverage sweep, one cross-comparison. Verified fixes: my real-estate metaphor was wrong (floors/rooms instead of Spaces); Journal Spaces are current/archived; the Platform home also reads the Commons Timeline and a Midden component; frictions-to-fixes merge rules per SKILL.md; Proposals now cover repo settings too. The sweep's \"main has no branch protection\" claim was outdated: I read the live ruleset and the merged 1690 doc. Conflict resolved: the comparison reviewer wanted plain labels with terms in parentheses, but the user's goal is mapping back to project terms, so labels are glossary terms with plain subtitles. The briefs moved to docs/diagrams/ and were rewritten to one shared structure; the branch was rebased onto main and force-pushed. Fifth round, human-instructed: the maintainer reported that the diagrams built from those briefs didn't work. The jargon (\"Trusted human\") hurt, and manifest expansion, routing map and catalog got too much room. The briefs also never showed that guidance, skills, logs, content and code all live in one GitHub repo that Nuxt Content turns into a database at build time. Asked for one new brief, grouped by where things live (GitHub, Claude, Docker host, browser), plus research on the SSR engine and payload.json. Research in the installed packages: Nitro node-server runs Vue's server renderer; Nuxt Content ships compressed SQL dumps and loads each into SQLite on its first query; later clicks fetch _payload.json. Grilled the layout over three rounds (grill-with-docs). Decisions: maintainer/ visitor; six repo parts (agent guidance, skills, guards & hooks, app code, site content, session logs); logs and skill inventory as double-duty content; site content as tenants > spaces > collections, with the Journal expanded as the example; click-a-component stories (13) instead of scenario buttons; Part 1 prose for reuse, Part 2 visualisation ideas. Wrote docs/diagrams/terrarium-overview.md and deleted the two old briefs."
