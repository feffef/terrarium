learnings:
  - The seven Routines each fire once a day at a stable UTC time (digest 00:16, audit-skills 00:46, frictions-to-fixes 02:03, audit-docs 04:00, blog-post 11:05, prune-trial 13:14, visitor-loop 16:48), observed 2026-10-01..08; the repo deliberately never states it.
  - A session log's free text is rendered on the Journal dashboard, so quoting the e2e smoke test's 404 marker ('No document at') in a friction turns main red.
ideas:
  - Make the smoke test's 404 check look for a dedicated data attribute (e.g. data-testid=not-found) instead of the human string 'No document at', so a session log that quotes the string can't break main.
