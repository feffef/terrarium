summary: "Human-instructed: the user asked for the research groundwork (not the diagrams) that a later session will use to draw two interactive diagrams. One covers the Nuxt app architecture. The other covers how humans, agent sessions and \"gitlab\" improve the Platform, with emphasis on the Routine and session-log self-improvement loop. Output: two markdown documents with pointers to real files, and explore agents allowed. The forge is GitHub; the briefs say so. Two Explore agents mapped the app and the process. I then verified their key claims against source: nuxt.config modules, gate.ts Floor/Heavy, deploy poll, Blog queryPages call, pr-workflow merge tiers, ADR-0003 ledger, settings.json hooks, merge-pr refusals, CI doorbell, session status enum and the scope of validate-skill-cadence. I tabulated Routine fire times from the 2026-10-01..08 session logs. The agent-proposed \"routines fire every 90 min\" reading was wrong; each fires once a day at a stable UTC time. The briefs also list doc/code gaps for honest drawing. Examples: the Platform home reads Tenant tables outside the Catalog; ideas are never promoted to issues; Dependabot auto-merge is still a Proposal. This same session id had already drawn diagrams before a /clear; this run produced only the research notes, as asked. The briefs live in docs/research/ (agent's choice of home). main was red on e2e because another session's log quotes the smoke test's 404 marker; the user said another session handles it, so I left it. Second round, human-instructed: the user asked for subagent reviews of both briefs. Questions: were all key components, actors and processes covered, and was anything over-explained? Two reviewer agents found real gaps that my first pass missed. Architecture: content files, Nuxt Content as the engine, the \"decide it at build time\" principle, GitHub as deploy source, layers changing Platform config. Process: Skill evolution, the issue lane, what the human actually does (mostly assessing Routine output), the auto-triage standing green-light, human idea harvest. They also found errors: \"adding a Tenant needs nothing else\", frictions-to-fixes hard-fix handling, a \"four roles\" list of five. And much over-detail (signatures, script names, times, PR numbers, plumbing). I spot-checked their claims (one miscount: the pack has 25 Skills, not 26). I grounded the human section in this week's human-started session goals. On the user's \"yes\" I rewrote both briefs and pushed a second commit to PR 1694."
