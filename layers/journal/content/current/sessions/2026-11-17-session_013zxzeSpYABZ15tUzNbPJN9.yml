goal: Give audit-skills an owner-written checklist per Skill
status: completed
outcome: watchFor field, brief, docs and three pilot checklists merged in PR 3421 by the owner
summary: "The owner asked for an optional Skill Inventory property that says what to watch for each run, so the audit stops inferring expected behaviour from the Skill text alone. After reading the audit helper, schema and brief, I ran the grilling Skill over four rounds. Human-instructed: the field's existence and purpose, every design answer (owner-written and never edited by the audit, added focus not replacement, per-item held/failed/couldn't tell verdicts, a check from the first use, retirement only as a suggestion), the pilot Skills, and the items picked in dialogs (including an owner-written frictions-to-fixes item and a split-out loop item for glassbox-curate). Agent-initiated: candidate lists, the ADR-0015 sentence, wording of the items, and applying review findings. I dropped the \"mode honoured\" item on the strength of the owner's agreement with my recommendation, which was ambiguous. Built in one commit plus a review-fix commit, both reviewed by subagents, gate green on the final head, PR opened without asking per the repo rule. Open: nothing tests that readInventory parses watchFor from a file, and the pilot items are untested until the next audit run grades them. The owner merged PR 3421 (human merge, as the Human-only paths require) about 12 minutes after it opened; CI's gate was green on the merged head. Afterwards the owner asked for a follow-up ticket to review the pilot after a week; I filed issue 3423 (due 2026-11-24) with the checks and a baseline, and set no reminder."
