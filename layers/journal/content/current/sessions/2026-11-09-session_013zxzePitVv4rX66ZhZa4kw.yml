  - description: Subagent briefs did not name a scratchpad subfolder per CLAUDE.md; the three agents wrote no files, so no collision occurred.
    solution: Put the scratchpad-subfolder line in the blog-post step briefs, or confirm it is only needed for agents that write files.
    severity: nit
  - description: Hook-injected rules (about 17) loaded from incidental reads of journal and glassbox files, requiring verdicts that mostly said not applicable.
    solution: Narrower paths on rules that load when reading a PR diff's touched files, or fewer ADR summary rules loading on journal reads.
    severity: minor
  - description: "Karen draft miscounted fixes ('fifth' while later calling #2974 a second PR); the fact-checker caught it before landing, costing two extra check rounds."
    solution: Count items from the source list before drafting a tally claim, as CLAUDE.md says; the draft relied on memory of the PR body.
    severity: nit
  - description: log-session refused a completed log right after merge until close-session was re-invoked; I authored first, then invoked the Skill, one wasted call.
    solution: Invoke close-session when the merge notice arrives, before editing the scratch.
    severity: nit
