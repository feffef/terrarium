learnings:
  - Chromium reports tinted backgrounds as `color(srgb r g b)`; a contrast script parsing only rgb() reads them wrong and gives bogus ratios, so convert or use a screenshot pixel.
ideas:
  - "[blind, content editor] /t/atlas and Specimen pages: the last Observation is dated 2026-10-19 and Aranea patiens' newest sighting is 2026-07-30 while the dial says Day 320. Add a few Observations dated up to today so the log reads as live (dates on or before today, per the Atlas ruling)."
  - "[content editor] /t/atlas/pool/echo-cantans: the prose says nine reports but the ledger lists 3; 'never twice by the same observer' contradicts the 2026-06-20 and 2026-08-19 sightings; 'the plate overleaf' means nothing on a web page. Reconcile the count, change the 08-19 observer, say 'above'."
  - "[blind, content editor] Specimen pages: Plate numbers run I to XXIV across 15 Specimens with gaps (V, X, XII, XIII, XV, XVI, XVIII to XX). One line on a Biome landing could say unfilled numbers are plates not yet drawn, so the gaps read as intended."
  - "[blind, content editor] /t/atlas: the lede says 'Start with a wing' then 'Choose a wing, and go quietly', and a long essay precedes the seasonal dial. Drop the repeated sentence and consider putting the dial and Abroad-now list before the essay."
  - "[blind] /t/atlas/<biome>/<unknown slug>: a 404 for a common name such as /lantern-moth dead-ends with only back links. Suggest the matching Specimen ('Did you mean Lumina fabulae, the lantern moth?') by matching common names within that Biome."
  - "[content editor] Specimen pages: stock lines are reused ('never twice by the same observer' on the legend, Echo cantans and Lumina fabulae; the mended-galleries anecdote on Formica textrix and Textor absens; Aranea patiens' 2025-10-03 sighting repeats its phase gloss). Give each its own phrasing or turn the repeat into a callback."
  - "[UI tester] /t/atlas/canopy/umbra-vacans: only a back link and 'all of The Canopy' exist. Add previous and next Specimen links within the Biome so a visitor can keep browsing in sequence."
  - "[UI tester] /t/atlas/canopy and its sibling Biomes: on a 390px phone about 800px of prose comes before the first Specimen card. Put the cards first, or fold the prose under 'About this wing'; the cropped food web stays visible per the owner ruling."
  - "[content editor] Biome landings: the food web is text-free on phones. Add a one-line caption naming the apex and one oddity (for example the beetle that fears the mender) so the story survives without reading arrows."
  - "[content editor] /t/atlas: the landing shows four recent sightings, none newer than 2026-10-19. Add a 'this day in the glass' line showing the sighting nearest today's day number from any past year, within one Biome's data so no cross-Biome page is needed."
