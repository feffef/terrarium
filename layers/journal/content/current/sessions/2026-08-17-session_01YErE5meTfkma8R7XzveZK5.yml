  - description: The digest Skill's step 7 requires opening a gated PR via GitHub, but the first attempt had no authenticated github MCP tools (server needed an OAuth flow a non-interactive scheduled session can't run) and no gh CLI installed as a fallback — so the finished, gate-green work sat on a pushed branch with no PR opened until a later turn restored GitHub access.
