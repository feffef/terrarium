frictions:
  - description: Ran git branch --show-current before reading docs/agents/git-conventions.md; the late-read hook fired after. The doc showed the call was fine.
    solution: Treat --show-current as read-only in CLAUDE.md's list, or have the hook skip it.
    severity: nit
  - description: Typed a made-up session id into a draft commit-message file; caught before committing and the commit-msg hook then added the correct trailer.
    solution: Leave the trailer to the commit-msg hook, or copy the id from the system prompt instead of retyping it.
    severity: nit
  - description: Left an 11-number rate list in the log-session observation for a 'tenth' window after reviewers flagged it, to avoid restarting the gate.
    solution: Proofread new observation notes before running the gate so a nit does not have to be left in.
    severity: nit
  - description: audit-skills step 1 does not name the dispatch-subagents read that CLAUDE.md requires before a brief, so I read it only when about to write briefs.
    solution: Name dispatch-subagents in audit-skills step 1 where the usage subagent is dispatched.
    severity: nit
