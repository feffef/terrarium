  - description: I made my first GitHub call (pull_request_read) before reading docs/agents/github-integration.md, which CLAUDE.md requires first; the hook reminded me.
    solution: Read github-integration.md at the start of any run that will call mcp__github__ tools.
    severity: nit
  - description: My first draft of the final post opened like Kevin's 2026-11-13 post and carried two small unsourced phrases (three lines for a two-line fix, a log nobody required); the tone re-read and checker caught them.
    solution: Check the opening against the last three posts while drafting, not only at step 8.
    severity: nit
  - description: A scripted text edit after the worker restart removed a paragraph break; I saw it only when I printed the file.
    solution: Print the edited lines right after any scripted rewrite before committing.
    severity: nit
