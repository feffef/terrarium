frictions:
  - description: Read git-conventions.md and github-integration.md only after a hook reminded me, after my first git and GitHub commands had run.
    solution: Read the two docs at the first git or GitHub step; the CLAUDE.md triggers name them.
    severity: nit
  - description: Edited journal files for the sample before reading layers/journal/GLOSSARY.md; the guard blocked all five edits once. Also skipped the ADR-0006/0008/0016 reads the hooks asked for.
    solution: Read the Tenant glossary when starting work on a Tenant layer; read the ADRs for any change that will ship, not only a sample.
    severity: nit
  - description: Relabelled issues and edited labels without reading docs/agents/issue-tracker.md first, which the CLAUDE.md trigger and a hook required.
    solution: Read issue-tracker.md before the first label write in the land phase.
    severity: nit
  - description: The clear-backlog rule that a missing-test or a fix over 10 lines forces another full review round cost two extra rounds (about 320k subagent tokens) on the harvest branch; round 3 found only nits.
    solution: Skip the next round when the previous round's re-checks were clean and the fix was test-only; or count a clean re-check as closing the round.
    severity: minor
  - description: Built a sample of the shared hover change that the owner then dropped (answer 10a), so the focus/tap sample and its clipped-label finding were discarded work.
    solution: Ask the strip-behaviour question with the cost (shared component, label clips at 390px) before building the sample.
    severity: nit
  - description: Reviewers got three hand-off channels in one run (StructuredOutput in the brief, SubagentHandback and a findings file in later messages); five of them said it was unclear which to use.
    solution: State one hand-off channel once in reviewPrompt() in .claude/workflows/clear-backlog-build.js.
    severity: minor
  - description: The rule-use echo hook ran twice for every read-only reviewer on rules (ADR-0003/0004/0009/0017) that governed nothing in a review, costing two tool calls each.
    solution: Skip the rule-use echo for read-only review subagents, or ask for it once, in the SubagentStart hook under scripts/hooks/.
    severity: minor
  - description: The reviewer brief names code-review SKILL.md section 3 for the smell baseline, but the heading is '### 3' (lines 34-56); three reviewers grepped '^## 3' and missed it.
    solution: Write the line range in reviewPrompt() in .claude/workflows/clear-backlog-build.js.
    severity: nit
  - description: The builder brief says to run e2e in the background and poll, but the subagent background guard denies it, so the builder retried in the foreground.
    solution: Say foreground with timeout 600000 for builders in rules() in .claude/workflows/clear-backlog-build.js.
    severity: nit
  - description: A one-blank-line Skill doc edit got the full build recipe (tdd, three ADR reads forced by hooks after the edit) and a review spawn that only re-confirmed the builder's claims.
    solution: "Add a fast path to rules() and the small flag: a doc-only change of 5 lines or fewer skips tdd and the review round."
    severity: minor
  - description: A builder's commit-message printf chained with git commit was refused by the one-git-command-per-call hook, so the commit failed on a missing file and cost a turn.
    solution: Tell builders in rules() to write the commit message with the Write tool, then run git commit -F alone.
    severity: nit
  - description: The re-check brief gave reviewers only triage.md one-liners, so a reviewer could not judge a refusal's proof; I never passed the builder's refusal reasons.
    solution: Quote each refused finding's reason in the re-check message, in the clear-backlog Skill step 3.
    severity: nit
