learnings:
  - Fail-closed hooks (gate-edit-guard.ts, github-provenance-guard.ts, create-session-repo-guard.ts) import transcript-trace.ts, so an unresolved export there blocks every guarded tool. I took this from issue 3741 and the relayed message, and did not read the guards myself.
ideas:
  - Give the fail-closed guards a small import smoke test, run by pnpm typecheck or a pre-commit step, that loads every scripts/hooks entry point, so a broken import in a shared module fails a test instead of blocking all tools. Pair it with moving guards onto hook-io.ts alone instead of transcript-trace.ts.
