learnings:
  - vue-router 5.4.0 with a path like /blog/:slug(.*)* leaves the param absent for /blog and /blog/, so the file-routing page's empty catch-all claim is right; the docs summary suggested otherwise.
ideas:
  - "Add a pin-drift script to the glassbox tooling: given a page, diff each file it cites between its old and new revision and print the changes beside the prose that names them. Today it takes a whole subagent per run, and it is what finds claims that went false when a page was re-pinned."
  - Make orient.ts print, for each page a Subject focus would edit, the pages that link to it or cite the same files, so the Read step becomes a lookup instead of a judgement the Spec reviewer has to audit.
