frictions:
  - description: "Stop hook feedback from command hook 5 said uncommitted changes five times, plus once for unpushed commits, while subagent writers were still editing; I pushed WIP drafts. The repo wires four Stop hooks, so its origin is outside the repo (unverified). Cost: noise commits on a feature branch, nothing landed unreviewed."
    solution: Have that hook stay quiet while a dispatched subagent is running; find which config wires it, since the repo's .claude/settings.json does not.
    severity: minor
  - description: I gave a background gate run both run_in_background and a trailing nohup ampersand; the double-background guard (issue 1208) refused it, nothing ran, and I resent it once.
    solution: "CLAUDE.md or the dispatch Skill could show the one correct form: a plain foreground command, run_in_background true, output redirected to a log."
    severity: nit
  - description: The glassbox-curate Skill lists QUALITY.md (Lenses only) as read-first; I never opened it and chose the checks without the Lenses. No page problem traced to the skip.
    solution: Mark which read-first files a run may skip, or have orient.ts print the Lenses with the skeleton.
    severity: nit
  - description: "I dispatched writers before reading overlapping pages; the Spec reviewer then named six: terrarium-practice session-logs, protected-paths and self-improvement-loop, verification gate, and two walkthroughs. I read them before landing; they needed no edit. Token cost not measured."
    solution: Have orient.ts print, per Subject page, the pages that link to it or share its cited files, so they are read before the writers start.
    severity: minor
  - description: A writer set the overview index.md to the new revision after checking one sentence, which would have claimed the whole page true at that commit; I caught it in its report and restored the old pin.
    solution: Tell writers in every brief to re-pin only pages whose cited files they re-read in full, or have the page test refuse a re-pin without a recorded read.
    severity: minor
  - description: A checker quoted line numbers that did not match the page files (author-trust 91 and 93 against real lines 16 and 18), so the writer relocated each finding by hand.
    solution: Briefs for checkers should ask for the quoted sentence, not a line number, since fetched plain text numbers differently.
    severity: nit
  - description: The first fresh-reader pass read 7 whole Claude Code pages (93,117 subagent tokens per its notice); most complaints predated my edits, and the changed sentences yielded two small fixes.
    solution: Scope fresh readers to the changed sentences plus their neighbours, as the Skill's Check step implies, instead of whole pages.
    severity: minor
  - description: Re-pinning 15 pages (counted from the revision lines) needed a whole subagent to diff each page's cited files between the old and new revision; it used 109,166 subagent tokens and found two real gaps.
    solution: Add a pin-drift script to the glassbox tooling that prints each cited file's diff between a page's old and new revision.
    severity: minor
  - description: The Standards reviewer found three pages whose teaches field was stale against the body (blocking-hooks, hooks/10, permissions); nothing in page-checks compares teaches with the files a page cites.
    solution: Add a page check that warns when a path cited in a page is missing from its teaches field.
    severity: minor
  - description: Each subagent brief repeated the same standing instructions, and the fan-out (16 subagent spawns, 6 resumes, per the transcript) took the session to 19.20 dollars of a 20 dollar budget (get_session).
    solution: Keep the writer, checker and reader boilerplate in one file under the glassbox-curate Skill folder and point each brief to it.
    severity: moderate
  - description: My PR body and first log said about 45 pages and five checkers and 16 changed pages; the run entry lists 40 pages, I dispatched six checkers and 17 files changed. I found it only when the owner asked; CLAUDE.md says count every item.
    solution: The curate Skill's Land step should say to take page and checker counts from the run entry and git diff --name-only before writing the PR body.
    severity: moderate
