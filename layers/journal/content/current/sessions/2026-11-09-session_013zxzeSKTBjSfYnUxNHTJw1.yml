frictions:
  - description: Stop hook asked me four times to commit while subagent writers were still editing, so I pushed WIP commits of unreviewed drafts to the branch.
    solution: Have the commit-and-push Stop hook stay quiet while a dispatched subagent is running, or word the ask as safe to defer until it finishes.
    severity: minor
  - description: I gave a background gate run both run_in_background and a trailing nohup ampersand; the double-background guard refused it and nothing ran.
    solution: "CLAUDE.md or the dispatch Skill could show the one correct form: a plain foreground command, run_in_background true, output redirected to a log."
    severity: nit
  - description: I skipped QUALITY.md, which the glassbox-curate Skill lists as read-first for its Lenses, and chose subagent checks without them.
    solution: Skill read-first lists could mark which files a run may skip; or the orientation could print the Lenses with the skeleton.
    severity: nit
  - description: I dispatched writers before reading the overlapping pages (walkthroughs, protected paths, gate); the Spec reviewer then named six I had to read afterwards.
    solution: The curate Skill's Read step could have orient.ts print, per edited page, the pages that link or overlap it, so they are read before the writers start.
    severity: minor
  - description: A writer re-pinned the overview to the new commit after checking one sentence, which would have claimed the whole page true there; I caught it only on reading its report.
    solution: Tell writers in every brief to re-pin only pages whose cited files they re-read in full, or have the page test refuse a re-pin without a recorded read.
    severity: minor
  - description: Checker reports quoted line numbers that did not match the page files (for example author-trust 91 and 93 against real lines 16 and 18), so writers had to relocate every finding.
    solution: Briefs for checkers should ask for the quoted sentence, not a line number, since fetched plain text numbers differently.
    severity: nit
  - description: The first fresh-reader pass over 7 Claude Code pages mostly returned density complaints that were already there, costing tokens for little that changed a page.
    solution: Scope fresh readers to the changed sentences plus their neighbours, as the Skill's Check step implies, instead of whole pages.
    severity: minor
