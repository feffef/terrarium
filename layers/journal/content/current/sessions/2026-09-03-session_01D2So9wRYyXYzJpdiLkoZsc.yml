frictions:
  - description: 'Started history-dependent subagents on a shallow clone; the owner had to interrupt with "Unshallow first" and 7 subagents were cancelled and relaunched. Fourth recurrence of the #772 rule; this session moved #772 to ready-for-agent with a SessionStart unshallow as the locked fix.'
    solution: "Land #772: SessionStart hook runs git fetch --unshallow; delete the prose rule."
    severity: major
  - description: auto-triage's idempotency rule (skip when the last comment is AI-authored) excluded 34 of 42 issues; the owner had to override it mid-run in prose because the Skill has no argument for a full re-triage.
    solution: Give auto-triage an explicit full-sweep mode (an argument) that disables the skip rule for one run.
    severity: moderate
  - description: The Agent tool's 20-concurrent-subagent cap rejected 10 of 23 launches in one batch with no queueing; each had to be relaunched by hand as slots freed.
    solution: dispatch-subagents should state the cap and recommend batches of at most 20 minus running agents.
    severity: minor
  - description: Several earlier triage passes escalated regression issues to ready-for-human without reading docs/research/rulebook-migration-table.md, which had already classified the exact rule (CM-32, FF-02, PR-10, GI-01, CM-38, GC-03); today's re-read collapsed those forks in minutes.
    solution: "triage/auto-triage: for a 'prose rule didn't hold' regression, read the migration table row before recommending a state."
    severity: moderate
  - description: "The consolidation:before / consolidation:on-hold labels have no description on GitHub and no entry in docs/agents/triage-labels.md; their meaning lives only in map #862's body, so every subagent had to be briefed on it."
    solution: Add one-line label descriptions on GitHub and a pointer row in triage-labels.md.
    severity: nit
