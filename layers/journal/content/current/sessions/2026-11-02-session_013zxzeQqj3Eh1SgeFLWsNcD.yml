frictions:
  - description: First draft said agents were told to accept relayed claims (it was a Ledger status change) and called the skills check weekly; I wrote from PR titles without reading diffs, caught by the fact-check.
    solution: Have gather print each PR's touched files and first diff lines so the draft starts from the change, not the title.
    severity: minor
  - description: Draft repeated two routine PRs in both the prose and Also shipped, which the Skill forbids; found only by the Standards review.
    solution: Draft Also shipped first, then write prose only about what is left.
    severity: nit
  - description: The Stop hook asked me to push or commit five times while the fact-check, reviews and gate were pending; ADR-0004 says wait, so each turn needed a refusal.
    solution: Let the Stop hook stay quiet while a background gate or subagent is running.
    severity: nit
  - description: Ran gate:scoped twice because the post-review prose fixes changed the head after the first green run.
    solution: Fold the fact-check and review fixes in before the first gate when both reports are cheap to wait for.
    severity: nit
