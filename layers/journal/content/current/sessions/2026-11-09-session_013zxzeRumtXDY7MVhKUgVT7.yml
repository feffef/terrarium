summary: "Implemented issue 3009 (human-instructed: the owner ran /implement 3009, told me to ask the research session for questions, then said \"go ahead and build it\"). I first stopped because the issue was on hold; the research session relayed the owner's decisions (shape approved, docsRead reason/useful dropped, dashboard left alone, go-ahead; later: drop the (not read) over-credit check, mark a named rule with no load \"(no load recorded)\"). The owner directly decided to keep the prune trial untouched. Built test-first: an InstructionsLoaded ledger hook, a SubagentStart note hook, a no-op helped.sh, the per-agent ruleUse derivation, a required authored helped key, a names-only pending report, and removal of the verdict flows (CLAUDE.md ask, log-session step 3, authored docsRead, clear-backlog verdicts, six Skill briefs). Agent-initiated choices: omit ruleUse when empty (main's schema check would otherwise hold every log), `by: workflow` for untyped agents. Then, at the owner's direction, autonomous hardening: a headless smoke test, a review by the design's author (owner-requested), five code-review rounds on follow-up commits, and three live Sonnet test sessions (owner-requested; draft test PRs 3011-3013 against this branch, not to be merged). Reviews found real parser and join bugs (a command naming helped.sh counted as an answer; dual-loaded rules losing their trigger; redirect targets as names; trailing digits lost before an unspaced redirect; .md-less rule names), all fixed with tests. The live tests found no bugs: 11 of 11 subagents answered, none leaked the note, triggers joined per agent. Later the owner asked to restore a rule value scale (changed/confirmed/none/unsure), which the design author had cut on its own reading of \"strip it\"; with the owner's sign-off the list became `reported` with per-rule values. Three more live tests (4-6) found two bugs (a rule read directly was marked unloaded; a read-only brief suppressed the call), both fixed and re-tested. The owner gave an explicit green light to merge; merge-pr.ts refused (Human-only files) and, after asking, I merged via the GitHub merge tool. Closed test PRs 3011-3013 at the owner's request; tests 4-6 closed their own PRs and landed abandoned logs through the new mechanism. Filed 3017 for the 7-day comparison against the audit artifact, and (owner-requested review of this log) issue 3019 for a ruleUse report script and joinable subagent entries."
