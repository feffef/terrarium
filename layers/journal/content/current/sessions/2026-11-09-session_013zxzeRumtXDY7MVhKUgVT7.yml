learnings:
  - A SubagentStart hook's additionalContext lands in the subagent's own transcript as a hook_additional_context attachment (hookEvent SubagentStart), and the InstructionsLoaded agent_id equals the subagent transcript's agent-<id>.jsonl name (CLI 2.1.321).
  - The lander checks every log against origin/main's session schema, so a stitch that always emits a new field holds every log until the schema PR merges; omit a new field when empty.
  - Child sessions created with create_session can reply to their parent with send_message.
ideas:
  - Let log-session land a log with fields main's schema rejects stripped (recording which), then re-land the full log after the schema change merges, so schema-changing branches stop risking their own sessions' logs.
