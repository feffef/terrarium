frictions:
  - description: Ran git fetch origin main before reading docs/agents/git-conventions.md, which CLAUDE.md requires before the first non-read-only git command; the doc said to fetch, so no harm.
    solution: Fire the git-conventions hint before the first fetch, not after it.
    severity: nit
  - description: The ADRs governing files I edited (session schema, ADR-0009 text, the log-session Skill, a Journal comment) were read only after each edit, when the hook asked; the edits stood.
    solution: Show the read-first hint on the first read of a governed file, so the ADR is read before the first edit.
    severity: minor
  - description: Ran pnpm typecheck in the foreground twice instead of in the background, though CLAUDE.md says to background anything that can take over two minutes.
    solution: List pnpm typecheck beside the gate and build in CLAUDE.md's background-run line.
    severity: nit
  - description: "My first split analysis read each log twice, since readSessionLogs with archived: true already includes the current logs, which doubled every count; I noticed when coverage read 244 against 122."
    solution: Rename the option includeArchived and say in its doc comment that it adds to current logs, not replaces them.
    severity: minor
  - description: "Asking nine sessions through send_message cost extra rounds: each rightly treated my message as peer data and asked the owner before posting to GitHub or messaging its subagents."
    solution: Let the owner pre-authorise a survey in one message the receiving sessions can verify, or broadcast it to them directly.
    severity: minor
  - description: I tallied and relayed about fifteen sets of self-reported counts by hand; each was marked unverified, but one figure (sessions with a passing backed) was wrong and had to be corrected.
    solution: Have sessions post structured counts and sum them with a script, not by hand in the reply.
    severity: minor
  - description: Did not check that the commit trailer landed on my third commit, which ADR-0017 asks for; the first two were checked and my message carried the trailer.
    solution: Have the commit-msg hook or a Stop check report a missing Claude-Session trailer.
    severity: nit
  - description: After fast-forwarding to origin/main the Stop hook counted five session-log commits from main as unpushed; pushing my branch cleared it though none of the work was mine.
    solution: Count only commits in origin/main..HEAD, as git-conventions.md already says to do by hand.
    severity: nit
  - description: A worker restart delayed nine queued session notifications by about an hour and a half, so replies to draft 6 arrived long after I had moved on to draft 7.
    solution: Deliver or flag queued notifications on resume so a restart does not reorder a multi-round survey.
    severity: minor
  - description: "The first session to rate with the new values cannot land its own log: main's schema rejects them until a human merges the schema PR, and this session may end first."
    solution: Land a schema widening ahead of the prompt that offers its values, or let the landing script hold the log across sessions.
    severity: minor
  - description: My drafts 4 and 5 listed unrelated ahead of late, and I first agreed with a session that late could never win; the owner pointed out that late is not unrelated, which cost a round.
    solution: Test a draft value order on two concrete rules before sending it, and check that each pair of values is disjoint, not only listed in order.
    severity: minor
