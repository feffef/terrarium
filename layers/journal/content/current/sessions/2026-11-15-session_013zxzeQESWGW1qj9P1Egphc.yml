learnings:
  - A rule's paths say why it loaded, but only its text says what it governs; judged by paths, every path-matched load counts as in-scope and says nothing about whether the paths are too wide.
  - Sessions re-rated their old backed entries as duplicate, checked or unrelated in 23 of 26 pairs in one session, which suggests the old value was inflated; re-rating from memory with the new definitions in view may bias that (unverified).
ideas:
  - Derive the late word mechanically by comparing each rule's ledger load time with the first edit of a file it governs, so agents never have to guess the order, which several could not.
  - Print each rule's governs line from one derived source (title plus first sentence) instead of the hand-kept table of eleven lines in scripts/session/rule-use.ts, so it cannot drift from the rule.
