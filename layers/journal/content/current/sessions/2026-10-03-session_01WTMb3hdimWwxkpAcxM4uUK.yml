summary: 'Human-instructed: the user asked me to check issue 1248 and scan recent session logs to see how widespread it is. That was research only, so nothing was committed and no PR was opened. I read the issue and its triage comment. The prune trial it asked for landed on 2026-09-24 (6fc603d6) and was judged "holds" on 2026-09-28 (ece30c81), but the issue is still open. A throwaway Python scan covered 135 logs since 2026-09-24 and 279 since 2026-09-01. It compared which subagents each log lists against skillsUsed and docsRead, and it collected frictions about dispatch, worktrees and subagents. Since the prune, 22 sessions dispatched a subagent likely to touch git. 18 of them invoked the Skill. Of the rest, 3 were read-only searches the task wording misclassified and 1 was a Workflow run. That leaves 1 real skip: the frictions-to-fixes doc-fix agent in session_016xwHemy6X6LmFrzBs4mgad, which read the Skill without invoking it and still landed PR 1500 cleanly. The moderate dispatch frictions (a shared branch ref pushed under the primary checkout, worktrees starting on a stale HEAD, a stopped impl agent) all happened in sessions that DID invoke the Skill.'
