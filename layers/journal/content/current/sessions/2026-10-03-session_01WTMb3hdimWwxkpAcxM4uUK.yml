summary: "Human-instructed: the user asked me to check issue 1248 and scan recent session logs to see how widespread it is. That was research only, so nothing was committed and no PR was opened. I read the issue and its triage comment. The prune trial it asked for landed on 2026-09-24 (6fc603d6) and was judged \"holds\" on 2026-09-28 (ece30c81), but the issue is still open. A throwaway Python scan covered 135 logs since 2026-09-24 and 279 since 2026-09-01. It compared which subagents each log lists against skillsUsed and docsRead, and it collected frictions about dispatch, worktrees and subagents. Since the prune, 22 sessions dispatched a subagent likely to touch git. 18 of them invoked the Skill. Of the rest, 3 were read-only searches the task wording misclassified and 1 was a Workflow run. That leaves 1 real skip: the frictions-to-fixes doc-fix agent in session_016xwHemy6X6LmFrzBs4mgad, which read the Skill without invoking it and still landed PR 1500 cleanly. The moderate dispatch frictions (a shared branch ref pushed under the primary checkout, worktrees starting on a stale HEAD, a stopped impl agent) all happened in sessions that DID invoke the Skill. Second human-instructed turn: the user asked me to (1) comment the findings on 1248, which I did with a recommendation to close it, and (2) search for existing issues covering the Skill-content gaps. Three gaps are already fixed: stale HEAD (#1420 plus the Skill's verify-HEAD bullet), work stranded by a stopped agent (the commit-before-stopping and bank-progress bullets), and the commit-msg hook in worktrees without node_modules (2e41583f, 2026-09-27). The fourth gap has no issue and isn't in the Skill: a worktree impl agent pushing the very branch the primary checkout has open. It is a single occurrence, so I asked the user before filing it. The user said not to file it and told me to close 1248, which I did (completed), and then to close the session."
