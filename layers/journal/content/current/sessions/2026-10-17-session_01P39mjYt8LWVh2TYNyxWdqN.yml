frictions:
  - description: Several of this run's new YAML observation notes use a plain ASCII hyphen ("-") where sibling entries in the same files use a real em dash, after an Edit-tool old_string mismatch on a line that looked identical forced a plain-ASCII rewrite instead of diagnosing the real cause.
    solution: When an Edit's old_string match fails on a line that visually looks identical, suspect a non-ASCII character (em dash, curly quote) before falling back to a plain-ASCII rewrite - copy the exact bytes from a fresh Read of the file instead.
