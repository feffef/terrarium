frictions:
  - description: Survey subagent's --append hit 13 of 61 triples already held by the entry through a different Friction index; one failed call and a pre-check loop.
    solution: Have print-ledger-occurrence --append skip held sessions with a warning, or say in the brief that a held session can match another index.
    severity: minor
  - description: Stop hook asked me to push twice while a background gate ran; I pushed mid-gate, safe only because a push leaves HEAD and tree unchanged.
    solution: Have the Stop hook skip its push nag while a gate:scoped run is in progress.
    severity: nit
  - description: Survey and design briefs say 'verbatim' with values filled in, but the CLAUDE.md every-brief asks must be appended by hand; easy to forget.
    solution: Put the every-brief asks line inside the survey and design brief files, or name them in the Skill's step.
    severity: nit
  - description: Skill §2 says top-three regression issues 'since the latest fix', but subagent-brief-defects' own note calls its occurrences separate strays; I filed anyway, as the rule says.
    solution: Let the Skill skip a cluster whose newest note says its occurrences need separate fixes.
    severity: nit
