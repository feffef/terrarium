summary: "The owner ran /glassbox-curate with a focus (check whether the guide overview needs additions for Lessons added or changed since its last large rewrite). That focus, the 2026-11-02 baseline, the three gaps (planning big work, skill inventory and logged ideas, what the gate checks), allowing a new section, parking new Lessons on the memory page and the owner-decisions line on lowercase terms were all human decisions, answered through questions. The owner also interrupted midway to say the overview should not capitalise glossary terms; I then lowercased every term across the page and, on their answer, added a line to owner-decisions.md (a Human-only file, so the PR waits for their merge). Agent-initiated: skipping the Scout subagent, the memory-page cuts to stay under the word cap (five long-standing soft decisions), the wording of the new paragraphs (opus writer subagent), and the choice to read three overlapping Lessons in full after the review named them. A sonnet claim checker found the planning sentence needed the research-ticket exception; a fresh reader found spec, stories and grade needed a gloss; both were fixed. Both code-review axes ran, scoped gate passed, PR 3154 is open and subscribed. Left open: the other guide pages still capitalise glossary terms (recorded on the memory page), and the harvest Skill's own text still says a Routine runs it."
