frictions:
  - description: Filed three issues before reading docs/agents/triage-labels.md, which CLAUDE.md requires before filing; the hook reminded me afterwards.
    solution: Read triage-labels.md together with issue-tracker.md before the first issue_write.
    severity: nit
  - description: First gate launch used a trailing & plus run_in_background; the double-background guard blocked it and I resent it plain.
    solution: Pass run_in_background alone, as CLAUDE.md says.
    severity: nit
  - description: "Survey subagent: print-ledger-occurrence --append refused the whole call on 7 held sessions, and short session ids were mistyped three times; the --unledgered count fell by 101 while 80 occurrences were added, unexplained."
    solution: Let --append skip held sessions with a warning, and accept short suffixes; document why --unledgered counts differ.
    severity: minor
  - description: "Survey subagent: classifier denials of amend or reset were appended to harness-proxy-blocks, so a host-block cluster flipped to a moderate regression of #2976 that is really two harms."
    solution: Split classifier denials into their own entry; the survey brief should say where they belong.
    severity: minor
  - description: "Design subagent: my picks named the wrong Skills (digest, glassbox-update, not blog or curate), and the design brief has no shape for a no-change recommendation; it spent about 137k tokens to drop all four picks."
    solution: Name each session's Skill in a pick; give the design brief a no-change form and an early drop path for guard-only fixes.
    severity: minor
