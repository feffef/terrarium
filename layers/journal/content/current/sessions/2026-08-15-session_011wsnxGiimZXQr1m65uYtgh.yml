learnings:
  - 'A merged PR whose body lists several "Closes #N" lines (one per issue, same keyword, own line) does not reliably auto-close all of them on this repo — PR #955 named four issues and only the first (#948) actually closed; #950/#952/#954 remain open with the merged PR still referenced on each. Root cause unconfirmed as of this session.'
ideas:
  - Add a post-merge check (or extend an existing sweep like frictions-to-fixes or auto-triage) that, for any merged PR whose body contains Closes/Fixes/ Resolves keywords, verifies every named issue actually closed — and files or reopens the gap automatically instead of relying on a survey subagent stumbling onto the mismatch, the way this session's source friction did.
