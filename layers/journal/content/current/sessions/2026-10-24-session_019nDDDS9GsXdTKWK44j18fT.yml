outcome: Verdicts, re-audit overlap and an audited recommendation posted on issue 2373
summary: "Started by another session, not by a human prompt. The task came from the owner's decision in a clear-backlog grilling (session_01PYyNMqrrDLZdXEej11LMzs): inspect issue 2373 read-only, build nothing, open no PR. That makes the scope human-decided; how I inspected was my own choice. The runs in scope were the three scheduled ones (10-22, 10-23, 10-24). I found no human-invoked run in the logs. One inspect-session subagent per run did a full read of its events. I checked the Inventory and PR-body state claims myself, sampled six clean-report claims on GitHub, and checked the scope and the Skill text. To measure overlap, I replayed audit-skills.ts --briefs in throwaway worktrees at each run's start commit with a faked clock. The file counts matched the real runs. Consecutive runs re-list 61 to 74% of run sessions, but only 11 to 53% if any SKILL.md commit resets the list. The surprise was that both issues filed on 10-24 came from sessions the 10-23 run had already audited and passed. That argues against `audited` under a lax reset rule. The cheap $8.36 run turned out to differ in model too: claude-sonnet-5-5 at medium effort, against the Routine's pinned claude-sonnet-5 with no effort set. Posted one comment: keep 2368 and 2372, a small fix for the step-1 usage fetch and the clean-report rule, and a recommendation not to build `audited` now. The owner decides that, and any Routine model or effort change."
