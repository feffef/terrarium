frictions:
  - description: Ran git fetch before reading docs/agents/git-conventions.md, which CLAUDE.md requires before the first git command beyond status and diff.
    solution: Read the git doc together with the GitHub doc at the start of any task that will read history.
    severity: nit
  - description: "Measuring the overlap between consecutive runs needed a hand-built replay: worktrees at old commits plus a Date-faking import, because audit-skills.ts only computes its window from now."
    solution: Give audit-skills.ts an --at ISO flag so a past run's data files can be rebuilt in one command.
    severity: minor
  - description: The first inspection subagent left the oldest inline page unsaved, so its coverage never reached the session start (that page held no relevant events).
    solution: The inspect-session brief could say that an inline first page must still be written to Out before Flatten runs.
    severity: nit
  - description: Edited SKILL.md before reading ADR-0005, ADR-0015 and ADR-0027 in full; the hook asked for them after the edit, and they confirmed the edit.
    solution: Read the governing ADRs a Skill file loads before the first edit, not after.
    severity: nit
  - description: After the PR merged, the branch was restarted from origin/main, and the Stop hook then flagged inherited main commits as unpushed three times while builders and the gate ran.
    solution: The Stop hook could count only commits not on origin/main, as git-conventions.md already advises readers to check by hand.
    severity: nit
  - description: First idea-3 script compared ISO timestamps against bare HH:MM:SS strings and printed nothing; cost one rerun.
    solution: Slice the time field before comparing in throwaway event scripts.
    severity: nit
  - description: update_trigger refused to change the Audit Skills Routine's model because a human created it; the owner had to make the change by hand.
    solution: Check a Routine's created_via before offering to change it, and point to its settings page instead.
    severity: nit
