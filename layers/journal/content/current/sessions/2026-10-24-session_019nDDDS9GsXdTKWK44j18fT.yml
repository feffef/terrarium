learnings:
  - Scheduled Routine sessions show no effort_level in get_session, while an app-started session records one. Compare model and effort before crediting a cost change to a Skill edit.
  - In audit-skills runs, the expensive part is the main session's verify-and-edit step after the checks return, not the parallel checks themselves.
ideas:
  - Add audit-skills.ts --at ISO to replay a past run's scorecard and briefs from the commit and time it started. That makes overlap and regression questions like issue 2373 a one-line check instead of a worktree-and-clock-shim job.
