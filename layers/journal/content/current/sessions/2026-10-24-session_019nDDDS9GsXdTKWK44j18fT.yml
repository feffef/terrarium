  - description: "Measuring the overlap between consecutive runs needed a hand-built replay: worktrees at old commits plus a Date-faking import, because audit-skills.ts only computes its window from now."
    solution: Give audit-skills.ts an --at ISO flag so a past run's data files can be rebuilt in one command.
