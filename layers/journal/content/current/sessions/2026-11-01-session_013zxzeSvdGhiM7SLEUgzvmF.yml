frictions:
  - description: Tally rejected fable's report because one lone page had no grade; the Skill covers only parse errors, so I resumed fable and merged its addendum into a copy.
    solution: Say in glassbox-improve step 2 what to do for a missing grade, or let grades.ts tally accept an addendum file per rater.
    severity: minor
  - description: MCP create_pull_request takes the body only inline, so the 40KB tally had to be read back and retyped, roughly 25k tokens, in one call.
    solution: "None wanted: the owner chose to keep the full inline PR body (issue 2700 option a) and rejected a body-file script because of ADR-0017; I proposed otherwise before checking."
    severity: moderate
  - description: To keep the PR body postable I condensed the Structural raises table; the long re-cut texts are only in the saved hand-backs, not the PR.
    solution: Post the omitted re-cut and raise texts as a PR comment, or keep the full tally in the PR with a file-based body.
    severity: minor
  - description: The planning writer linked a work-queue anchor that the git-github writer removed in the same run; only code-review found it.
    solution: "Add to writer-brief: link a section of a page another writer edits this run without an anchor, or ask the coordinator."
    severity: minor
  - description: A claude-code writer's python heredoc containing an ampersand was denied by subagent-background-guard as a background operator; the writer switched to Edit.
    solution: Make the guard ignore heredoc and quoted text when looking for a bare ampersand.
    severity: minor
  - description: "Worktree guard refused two writer commands: a curl URL containing the word github and a for loop with sed and git ls-files."
    solution: Document in dispatch-subagents which command shapes the worktree guard refuses.
    severity: nit
  - description: I called a non-existent mcp__github__subscribe_pr_activity and invoked Monitor without loading its schema; both cost a wasted call.
    solution: Name subscribe_pr_activity under mcp__claude-code-remote__ in github-integration.md.
    severity: nit
  - description: The Stop hook demanded a push five times while review, fix round and gate were pending; ADR-0004 required waiting, so each turn needed a refusal note.
    solution: Let the hook skip while a code-review or gate:scoped step is known to be running.
    severity: nit
  - description: code-review's Standards brief and smell baseline assume code; for a Markdown guide diff I wrote my own subagent prompts and ignored the baseline.
    solution: Give code-review a short docs-diff variant that points at the repo's page rules.
    severity: nit
  - description: I first created rater scratch folders in the wrong place; plan --briefs already made the right ones, so the extras were unused.
    solution: Say in glassbox-improve step 1 that plan --briefs creates the rater folders.
    severity: nit
  - description: Presented seven retro candidates before searching issues or the Friction Ledger; two were settled (issue 2700 chose to keep the inline PR body; stop-hook-nag is accepted via issue 2233) and the owner had to ask me to check.
    solution: Run the redundancy search from docs/agents/issue-tracker.md before proposing, and have the retro Skill say to search issues and the ledger before presenting candidates.
    severity: minor
