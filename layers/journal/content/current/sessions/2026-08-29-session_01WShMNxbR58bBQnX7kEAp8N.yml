frictions:
  - description: "Nearly asserted 'the actual first commit holds five ADRs' via a fresh git log --reverse, without first checking git rev-parse --is-shallow-repository — this repo IS shallow, so that would have derived a wrong commit (the shallow boundary, not the true root) as fact, the exact failure mode CLAUDE.md and issue #1074 both warn about."
    solution: "Checked is-shallow-repository before trusting the output, caught it was true, and rewrote the claim to cite the already fact-checked fix commit's own message instead of re-deriving history myself. Worth a standing habit: check shallow status before ANY git log --reverse / first-commit claim, not just blame/pickaxe work as CLAUDE.md's bullet currently scopes it to."
    severity: minor
  - description: Drafted a claim that the rotation gate's starved-forces-eligibility case (this run) was 'the first real test' of that rule, without checking prior blog-post session logs first — it wasn't; Kevin was starved and forced on 2026-08-27, two days earlier.
    solution: Grepped prior blog-post session summaries for 'starved'/'last:' before finalizing and found the counterexample, then corrected the post to describe it as the second recent forced case instead of the first. A blog-post step 3/A1 material-gathering pass should routinely grep prior blog-post runs' own rotation-gate output, not just their published posts, when a candidate's premise involves the rotation mechanism's history.
    severity: minor
  - description: First draft of the winning candidate said the session in question happened 'on Friday' and that the Read:Bash ratio fell over 'eight weeks' — both wrong (the date was a Saturday; the week gap was seven weeks by ISO week number), caught only by explicitly re-deriving each with date -u rather than trusting the drafted prose.
    solution: Both were caught before publishing by treating every weekday/count claim as needing fresh derivation, per CLAUDE.md's existing rule — no new fix needed, just confirms the rule's value; worth noting the same discipline should apply mid-revision, not only on first draft.
    severity: nit
