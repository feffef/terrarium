learnings:
  - "The tool-results spill threshold is not about 90k characters: a 66k-character list_events page spilled too, so it is probably counted in tokens."
  - A background Agent dispatch's tool_result is only a launch receipt; the real reply arrives later as a synthetic user hand-back message, matched by agentId.
  - "Haiku batches parallel MCP calls within one turn: 23 list_events pages took 26 s, against about 6.5 s per page sequentially."
ideas:
  - Have a SessionEnd hook write this session's own flattened transcript to a git-ignored mirror, so a later session's transcript search reads one file instead of 91 MCP pages.
