outcome: "Wayfinder ticket #2296 resolved: two-tier shape with a grep-able flattened transcript"
summary: "The owner invoked /wayfinder on map 2291 and asked me to work the prototype ticket \"What shape should the transcript-search Skill take?\" live with them. I claimed it and asked four questions first. The owner chose: only the caller's context counts; a hybrid shape (caller answers Outcome, a subagent loops fetch, script, NEXT for the rest); I pick the test sessions; build two questions first. I built a throwaway filter script (Read check, Dispatches) and a subagent recipe, and ran it on real transcripts. Testing showed Bash cat/sed reads are the main read path, and that 5 pages miss early dispatches. The owner accepted my fixes (Bash reads, orphan subagents, budget 15 for Dispatches). The owner then asked that the subagent store the full response for grepping; after a clarifying question they chose a flattened one-line-per-event transcript. They then asked to try chained Haiku agents for a full transcript. I ran both a sequential chain and a cursor walk plus 4 parallel Haiku fetchers on a 4.9-hour session. The fan-out got all 91 pages in about 8 min. The chain broke when the server once returned an already-fetched page, which a Haiku link took for a loop; I verified with a repeat call that the API was fine. The owner chose two tiers with the caller orchestrating full mode. I pushed the prototype to prototype/transcript-search-shape (no PR, ADR-0003), posted the resolution, closed the ticket and added the decision to the map. All build steps were owner-directed; the background hand-back matching fix and the duplicate-first_id retry finding were my own."
