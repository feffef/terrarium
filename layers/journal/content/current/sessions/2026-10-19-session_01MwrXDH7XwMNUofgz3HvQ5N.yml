frictions:
  - description: Pushed the prototype/ branch without reading docs/agents/pr-workflow.md, which CLAUDE.md requires before any push.
    solution: Read pr-workflow.md before pushing any branch, even a prototype/ branch that gets no PR.
    severity: minor
  - description: Ran git branch and git fetch before reading git-conventions.md, and issue_read before github-integration.md; the read-first hints fired after.
    solution: Read both trigger docs at session start in a wayfinder session that will touch git and GitHub.
    severity: nit
  - description: A Haiku chain link reported a deterministic cursor loop; it was one wrong page from the server, which cost a verification round.
    solution: The transcript Skill should check each first_id is new and retry once; fetchers should report, not diagnose.
    severity: minor
  - description: The first two recipe runs wrote their output to .throwaway rather than a scratchpad subfolder named for each subagent, as CLAUDE.md asks.
    solution: Put the OUT folder under the scratchpad, named per subagent, in every brief.
    severity: nit
  - description: A Haiku fetcher skipped ToolSearch and made two stray list_events calls outside its range.
    solution: Keep fetcher briefs strict, and have the merge script dedupe pages by first_id.
    severity: nit
  - description: The worker process restarted twice mid-session; files survived, but each restart re-ran setup and cost a recheck.
    solution: None in the repo; check scratch files on resume, as done.
    severity: nit
