learnings:
  - The home page's "Show all N Campaigns" counts only non-ended campaigns (browse.ts popular filter), so it is 20 while 29 exist; not a bug but confuses visitors.
  - Tinkerfund /t/tinkerfund redirects to /t/tinkerfund/prod; /qa is a component gallery, not a second shop.
ideas:
  - "[blind + content editor] /t/tinkerfund/prod: the home table button reads 'Show all 20 Campaigns' while Discover says 29; say 'Show all 20 open Campaigns' or add the ended ones, so the count matches what visitors see elsewhere."
  - "[content editor] /t/tinkerfund/prod/how-it-works: 'Ending soon marks a Live Campaign that closes within 48 hours, and Upcoming one that has not launched yet.' is garbled; write 'Ending soon marks a Live Campaign that closes within 48 hours. Upcoming marks one that has not launched yet.'"
  - "[content editor] /t/tinkerfund/prod/campaigns/automatic-sheep-counter: Grzegorz K.'s question about resetting the count at night has no Inventor reply while nearly every other question does; add one in character."
  - "[content editor] /t/tinkerfund/prod: Recently ended shows only unfunded cards; add one funded ended card (Pocket Sundial with Snooze, 210%) so visitors see success as well as the post-mortem jokes."
  - "[UI tester] /t/tinkerfund/prod: campaign links in the Popular now table measure 15px tall at 390px (footer 'the Terrarium' 14px); PR #3323 aimed at 24px targets, so add min-height or padding to .inv a."
  - "[UI tester + blind] /t/tinkerfund/prod/discover: show a visible result count and active-filter chips, plus a Funded/Unfunded/Live filter, so unfunded gems are findable and filtered state is clear."
  - "[UI tester] /t/tinkerfund/qa: the body gives no cue that it is a component gallery for testing; add a one-line note so visitors do not read it as a second shop."
  - "[blind] /t/tinkerfund/prod/account: opens as 'Robin Demo, always signed in' with no sample banner (campaign pages have one); add one line saying it is a sample Backer."
  - "[blind] /t/tinkerfund/prod/inventors/*: inventor pages are reachable only from campaign bylines; add a Meet the Inventors index."
