summary: "Human-instructed question: a Routine log on main (the user said audit-logs; their screenshot showed it was the audit-docs run, commit 95de88ccb at 04:11 UTC) does not show on the live Journal. Agent-initiated investigation: the log passes validate:content; Recent Activity has no status filter; a local pnpm build of main succeeds and the preview's Journal lists the log (All 112 versus 111 live). The live site serves exactly main minus that commit, so the ADR-0011 self-updating container either failed that build on the server or stopped polling. The deployed site and its logs cannot be reached from a cloud session, so the next step (docker compose logs on the server) is the user's. No code changed, no PR. After the owner merged PR 3028 the log appeared; the git timeline shows the site caught up only once new commits landed, which fits a failed server build that the entrypoint retries only on the next commit. At the owner's request I filed issue 3029 (needs-triage) to check the server logs."
