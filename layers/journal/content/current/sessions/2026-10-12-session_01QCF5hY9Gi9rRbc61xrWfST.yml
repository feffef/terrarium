summary: "The user asked (direct ask) that Tinkerfund's Reset demo button appear only once the visitor has modified in-browser state. Per their preference I asked three scoping questions first (not rendered vs disabled, whether a theme change counts, live vs on-load); they chose not rendered, theme excluded, live. I extracted a shared useTinkerfundActions() composable so the Cart and the button read one hydration-safe source, gated the button on it, moved the demo bar divider into the component, and updated e2e tests. The first gate run failed because I used Playwright's toHaveCount in a vitest suite; fixed with expect.poll. The user then asked (direct ask) for /code-review before self-merging; Standards and Spec subagents ran, I fixed a duplicated doc comment and deliberately left per-Space visibility as a documented limit. Opening the PR and subscribing were agent-initiated per ADR-0003. Still open: wait for CI, post verdict, run merge-pr.ts."
