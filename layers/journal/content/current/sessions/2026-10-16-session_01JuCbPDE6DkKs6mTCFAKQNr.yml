outcome: The "Words we use" cards became a compact chip strip above Primary sources
summary: 'The owner said the "Words we use" section on the Glass Box landing was too prominent and odd. Following their preference, I asked questions before building. They confirmed it was too prominent, in the wrong place and showed the wrong terms, noted that Lessons already highlight terms inline with :term, and chose a compact strip. From two follow-up options they chose to put it above Primary sources and to show the terms guide Lessons expand most (I counted them). Human-instructed: the change, the placement and the term set. Agent-initiated: the heading wording, capitalizing Manifest in its term files, and the review fixes (aria-live, useId, Term naming, a heading that also holds on drafts). The Spec review rightly flagged that "use most" was untrue on drafts. Verified with screenshots and a Playwright click; scoped gate green.'
