frictions:
  - description: Called the TaskCreate tool with a guessed `tasks` array parameter instead of loading its real schema via ToolSearch first, as CLAUDE.md's working-conventions bullet requires for any deferred tool's first call this session — the guard rejected it with the correct fix.
    solution: Always run ToolSearch("select:<ToolName>") before a deferred tool's first call this session, even when the name looks self-explanatory.
    severity: minor
  - description: "Piped `pnpm build` into `tail` on the first build attempt; the tail-pipe guard (issue #873) correctly blocked it since a backgrounded long build's real exit status/output would otherwise be lost."
    solution: Redirect the primary command to a log file and read it with the Read tool instead, from the very first attempt on any long-running command.
    severity: nit
  - description: Repeatedly issued no-op `sleep 1` Bash calls while waiting on background build/gate/agent completions instead of simply ending the turn with a short status line and letting the completion notification arrive on its own — wasted several turns for no effect.
    solution: When a background task/agent is already running, end the turn with a one-line status update and no tool call; do not invent filler Bash calls to "wait".
    severity: minor
  - description: A `playwright-core` verification script placed under the scratchpad directory can't resolve `playwright-core` via Node's module resolution, since that walks up from the importing file's own path and never reaches the repo's node_modules from /tmp.
    solution: Write such a script temporarily at the repo root (never under `scripts/`, and delete it before staging/committing) so module resolution finds the repo's own node_modules; keep the *inputs* passed to it in the scratchpad.
    severity: nit
  - description: Repeatedly issued no-op `sleep 1` Bash calls across both PRs' build/ gate/CI wait cycles instead of ending the turn with a status line and letting the completion notification arrive on its own — a recurring pattern across the whole session, not a one-off.
    solution: When a background task or subscribed PR event is the only thing being waited on, end the turn with one status sentence and no tool call at all; never invent a filler Bash command to "pass time".
    severity: minor
