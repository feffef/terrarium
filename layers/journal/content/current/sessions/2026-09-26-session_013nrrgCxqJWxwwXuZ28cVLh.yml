learnings:
  - "A pure CSS background-color fade at a scrollable diagram's edge is too subtle a scroll affordance on its own — two more independent first-time visitors still read the Atlas Relations diagram as \"clipped\" a full day after PR #1341 added exactly that fade for the same complaint. An explicit, visible text hint reads far more reliably than a color-only cue."
  - "When two or three blind visitors independently propose different-worded variants of the same underlying fix (here: \"surface the Blog's best material higher on the homepage\"), picking the smallest/most content-homed variant — reusing an existing curated list via one new optional schema field, rather than authoring new content or a new route — keeps the feature PR proportionate to a single-session chartered run."
