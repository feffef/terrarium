frictions:
  - description: Shipped a shell-command parser with six wrong rule classes; a background review found all of them
    solution: Adversarial cases for a parser belong in the first test pass — I tested the shapes I had thought of, which is not the same as testing the shapes that occur
    severity: moderate
  - description: sed -i recorded a WRITE as a read, the likeliest shape to occur since agents here are told to edit with sed
    solution: When a verb can both read and write, enumerate its write flags before its read flags — the write case is the one that corrupts data
    severity: moderate
  - description: Told the user docsReadViaShell would be 'weaker evidence' than docsRead without checking; it is 34.5% self-report
    solution: Measure the corpus before characterising an existing field's reliability — the data was one script away and inverted the claim
    severity: minor
  - description: Chained git status after a preview-server stop; the SIGTERM ate it and only exit 144 hinted why
    solution: CLAUDE.md already forbids chaining after a process kill — the rule is right, I ran the command anyway
    severity: minor
  - description: tsx could not resolve a repo .ts imported by absolute path from a scratchpad script; TransformError with no clear cause
    solution: Put ad-hoc probe scripts inside the repo and delete them after, rather than importing outward from the scratchpad
    severity: minor
  - description: Guessed the session card's anchor format instead of reading sessionAnchor, wasting a screenshot round trip
    solution: Grep for the anchor helper before constructing a deep link
    severity: nit
  - description: Wrote a test expectation asserting a near-miss for `awk -v P=docs/x.md`, where the token is P=docs/… and correctly matches nothing
    solution: Reason about what the tokenizer actually sees before pinning an expectation on it
    severity: nit
