learnings:
  - grep/rg context flags (-A/-B/-C/-m) consume their argument, so a naive positional index puts the pattern in slot 2 — the same decoy class returns whenever a context flag is present
  - rg -L means --follow; grep -L means --files-without-match. Sharing one flag table across the two silently drops real reads
  - A quoted argument that looks like a flag will be read as one unless the tokenizer keeps the quoting — `grep -rn "-l" file` is indistinguishable from a names-only grep after quote-stripping
  - docsRead is 34.5% authored self-report across all 528 logs (1216 of 4554 entries); its derived guarantee covers only the marked entries, which makes a new derived-only field the stricter of the two
  - A heredoc body is part of the Bash command string in the transcript, so any analysis over commands reads written file content as if it were commands that ran — this repo writes docs and fixtures that way constantly
  - grep -e supplies the pattern, so the first positional is then a FILE; a blanket skip-the-first-positional rule silently loses that read
ideas:
  - "Apply this PR's recognition-over-recall trick to docsRead itself: have log-session --author print the transcript-derived reads before the agent writes its curated list, so authoring becomes checking a list rather than recalling one. It attacks the 34.5% self-report share directly, needs no schema change, and reuses the reporting path just built."
  - Add a scripts/corpus-stats.ts that answers questions like 'what fraction of docsRead entries are derived' over the session-log corpus. Three separate sessions have now hand-rolled a one-off parser for that (this one included); a committed script would make claims about the corpus cheap to verify instead of quietly optional.
