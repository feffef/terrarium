frictions:
  - description: Committed and pushed an owner-facing UI change without rendering it or showing the owner; they had to ask for the render.
    solution: "Rule: a session or issue that only adds or changes UI must render and show it, and the owner signs off before code review. Make that a CLAUDE.md or ui-verification.md must-have, and have the Stop hook's commit nudge defer to it."
    severity: moderate
  - description: Read the Journal GLOSSARY only by grep, and read ui-verification.md's linked doc only after the owner asked for a render.
    solution: Read the Tenant glossary whole and the UI doc before the first edit; the rule load did not force it.
    severity: nit
  - description: preview.ts shot only captures whole pages; a 6000px full-page shot was unreadable, so I wrote a throwaway Playwright script to clip one element.
    solution: Add a --selector option to preview.ts shot and screenshot.ts.
    severity: minor
  - description: Started pnpm gate:scoped before running code-review, against pr-workflow.md's review-then-gate order, and had to stop it so review fixes would not abort it.
    solution: Read pr-workflow.md before the first PR step; it was opened only after the gate had started.
    severity: nit
  - description: Recommended a hover-only title for the main segment's explanation; the owner then found native tooltips too slow to discover, so the first build was reworked into instant tooltips.
    solution: Before recommending a hover-only design, ask whether a reader would find it, and show a real hover first.
    severity: minor
  - description: The dev server kept serving a stale layer component after an edit (tooltips stayed centred), costing two screenshot rounds before a restart.
    solution: Restart the dev server when a layer component edit does not show, as verifying-ui-changes.md warns.
    severity: nit
