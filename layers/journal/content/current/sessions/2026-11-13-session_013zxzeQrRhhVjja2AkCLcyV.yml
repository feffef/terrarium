summary: "The owner asked to reorder the Journal session card's subagent token bar: subagent shares first, the main session last with a fuller label than \"main\". I asked three questions first, as the owner prefers. Human-instructed: the reorder, the label wording (they dictated \"the session that directed the subagents and that users interact with directly\", mentioned only for interactive, and \"the session users created to trigger the work\" for delegated), order of appearance, then reversing their own hover-title-only choice once they saw the native tooltip is slow and undiscoverable, reuse of the Routine chart's hand-drawn tooltip but not its CSS 1:1 (two looks accepted), applying the tooltip to other native titles that relay detail, a merge of main, and \"go ahead until merge\". Agent-initiated: threading `kind` through the card view, choosing which titles count as detail (converted the rule and value hovers, Friction status and strip, the Routine description; kept action labels, one-word repeats and the ribbon and chips native), the dark serif pill for prose tips, and dropping an unused centre option after review. I committed and pushed before rendering, which the owner flagged and had me log as a friction; the render and their \"ok\" followed. The gate and code-review (Standards and Spec subagents) passed; the Spec review flagged three more native titles that carry detail (Friction bar severity counts, \"merged since\", the \"external\" ribbon), left for the owner to decide because converting them changes owner-visible UI. Open: CI, the verdict comment and the merge of PR 3310."
