summary: "The user asked that the Where next to Lessons already read move, applied only on Lesson pages, also apply on Walkthrough pages (human-instructed). Their stated preference is to ask questions first, so I traced the code and asked three questions; they chose that Walkthroughs are never marked read, that the Where next heading and table-of-contents entry vanish once all rows are read, and that the section sits below the body (all human-decided). I then passed the read list into glassboxWalkthroughParts, enabled the section and table of contents in Article.vue, updated the glossary line and added two unit tests (agent-initiated implementation of those decisions). A Stop hook asked for a commit and push, which I did. I then asked whether to run the gate and open the PR; the user said yes and asked why I had asked. The gate passed (172 e2e tests), two review subagents (Standards and Spec) found no blocking defects, and I opened the PR and subscribed to it. Open: no browser check of a Walkthrough page, no e2e case for a Walkthrough, and the read parameter order differs from glassboxLessonSections (left as a judgement call)."
