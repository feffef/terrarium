learnings:
  - "A Skill's section heading can be load-bearing outside the Skill: 'A0. Rotation gate' was cited in a script comment, a unit test comment, and a research table, so renumbering steps is a four-file change"
  - Sonnet read 17 Skills plus support files in about 110 seconds and 155k tokens; its quotes were exact on every spot-check, so a cross-Skill confusion audit is cheap enough to repeat
ideas:
  - "Resolve the auto-triage vs guest-intake conflict: auto-triage routes every Public-authored issue to ready-for-human while guest-intake applies ready-for-agent on the guest's confirmation, and auto-triage's own 'Coexisting with the guest pipeline' section admits it relies on timing. Add the explicit skip auto-triage says it would add, so the two Skills agree by rule"
  - digest keeps unverifiable claims while blog-post cuts them; either document in digest why its bar is lower (a digest cites session logs, not a public blog) or raise it to match, so a fact-check subagent brief can be shared between the two
  - Teach scripts/gate.ts's inert classifier to treat a .ts diff that changes only comment lines as inert, so a pointer fix in a script comment doesn't cost a full build + e2e
  - "Filed as #1603: let gate:scoped skip build + e2e for a scripts/*.ts change that no runtime or e2e file imports, keeping unit tests; comment-only .ts diffs as the cheap sub-case"
  - The first run on the rewritten blog-post Skill followed every structural step but skipped or thinned every judgement step (overlap check, tone re-read, unverifiable-row handling); a Done-when that cannot be checked from the transcript is a Done-when a Sonnet run will claim without doing
