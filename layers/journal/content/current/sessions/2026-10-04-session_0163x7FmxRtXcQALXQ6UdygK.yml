frictions:
  - description: Provenance header built from the repo's own helpers (provenanceHeader + sessionUrl(CLAUDE_CODE_REMOTE_SESSION_ID)) rendered a cse_ URL; the ADR-0017 guard rejected it and demanded the session_ shape
    solution: Make shared/session-url.ts and the guard agree on one id prefix, or have sessionUrl normalise cse_ to session_; until then the guard's deny text is the only reliable source of the header
    severity: moderate
  - description: "A comment-only edit to scripts/blog-rotation.ts (a heading reference) forced the full gate: build + e2e for a change with no runtime effect"
    solution: Accepted as fail-safe by design; an inert classifier for comment-only diffs in .ts files is an idea below, not a request
    severity: minor
  - description: Harness system-reminder said to end the commit message with Co-Authored-By/Claude-Session lines; the repo's commit-trailer guard denied the commit for exactly that
    solution: Known tension, guard message was clear and the retry without a trailer landed both lines; nothing to change in the repo
    severity: nit
  - description: "Agent tool call with run_in_background: false denied by the Agent-background-flag guard; harness guidance suggests the flag, repo guard forbids it"
    solution: Guard message named the fix; omitted the flag and waited for the notification
    severity: nit
  - description: close-session says the same session finalizes the log to completed after merge; log-session says a later session flips it on merge. Read both this session and had to pick
    solution: Single-home who flips in-review to completed in close-session and have log-session point at it
    severity: minor
  - description: "A comment-only edit to scripts/blog-rotation.ts (a heading reference) forced the full gate twice: gate:scoped diffs the whole branch against merge-base, so every later md-only commit on the branch also paid build + e2e"
    solution: Accepted as fail-safe by design; an inert classifier for comment-only diffs in .ts files is an idea below, not a request
    severity: minor
  - description: "force-with-lease push failed five times with 'stale info' after restarting the branch from main: the remote branch had been auto-deleted on merge, so the lease compared against a dead tracking ref"
    solution: After a merged-PR branch restart, fetch the branch first; if the remote ref is gone, push plain (no lease) since there is nothing to protect
    severity: minor
  - description: A subagent's transcript read via list_events pages newest-first and a 100-event page is ~65k chars, too large for the main context; had to delegate the whole read
    solution: Document in CLAUDE.md's transcript-reading bullet that list_events is newest-first and must be delegated to a subagent for any session over ~50 turns
    severity: nit
