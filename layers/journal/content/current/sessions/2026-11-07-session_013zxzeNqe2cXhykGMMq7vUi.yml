frictions:
  - description: Ran git fetch and git branch before reading git-conventions.md, which CLAUDE.md requires before any git command beyond read-only ones.
    solution: The orient step and Skill read list could say to read git-conventions.md before the first fetch; no harm resulted.
    severity: nit
  - description: The Skill's read-first list names glassbox GLOSSARY and QUALITY; I never read them and relied on the subagent reading the GLOSSARY.
    solution: Fine for a removal-only edit, but the Skill could say which of the read-first files a removal run may skip.
    severity: minor
  - description: The dispatch-read guard blocked my first two Agent calls, costing a retry; I had not read dispatch-subagents before writing the briefs.
    solution: The code-review Skill step 4 could point to dispatch-subagents, so the read happens before briefs are written.
    severity: minor
  - description: Skipped the Diagnose step and wrote the run entry after the edits, not right after choosing the focus as the Skill orders.
    solution: The Skill could say a removal-only run may skip Diagnose and write the entry at landing.
    severity: nit
  - description: The workflow forced a Subject-wide read for a two-sentence edit; orient output was 13KB plus a 5K-word page list, more than this change needed.
    solution: Let orient --pages take a Subject filter so a focused run reads only its area.
    severity: nit
  - description: get_session returned no usage field, so the Skill's cost budget could not be read or enforced; the PR reports cost as unreported.
    solution: Have orient.ts print the run's spend, or name a fallback source in the Skill; the get_session owner may need to expose the field.
    severity: minor
  - description: orient.ts printed 13KB and --pages 5,400 words for all pages, though the change touched two pages.
    solution: Let --pages take a Subject filter, and say the full list is for gap and overlap hunts only.
    severity: minor
  - description: The Skill's read-first list names eight docs for every run; a removal-only run had no guidance on which it may skip.
    solution: "Tier the list: removal-only runs read EVERY-PAGE.md and the content rule, writing runs the full set."
    severity: nit
  - description: The invocation carried no sign of whether a person or a Routine started the run, so I spent a question round trip on the mode.
    solution: Have orient.ts print how the run was started, or default to autonomous when nothing says otherwise.
    severity: minor
  - description: The code-review Skill's step 4 says to spawn subagents without pointing at dispatch-subagents, so the dispatch-read guard denied two Agent calls.
    solution: Add one pointer line in code-review step 4 to the dispatch-subagents Skill.
    severity: minor
  - description: After the merge, log-session refused a completed log until close-session ran again, but re-invoking the loaded Skill returned only 'already loaded', which read as circular.
    solution: Make the refusal say a fresh close-session call is what satisfies it, or have the check read the Skill-invocation event after the merge.
    severity: minor
  - description: The merged run entry lists claude-code/05.mcp-servers in pagesRead, but I only grepped it and never read it in full.
    solution: List a page in pagesRead only after a full read; the entry in PR 2940 needs a correction in a later run.
    severity: minor
