frictions:
  - description: Agent calls were blocked by the dispatch-read guard because I wrote subagent briefs before reading the dispatch-subagents Skill, which CLAUDE.md names.
    solution: Read the Skill before the first brief; the guard worked as designed, one retry.
    severity: nit
  - description: The first Standards, Spec and claim-check subagents stalled silently with idle transcripts for over ten minutes and no notification, then were abandoned and rerun on the final head.
    solution: Set a call budget in every reviewer brief and check transcript activity sooner.
    severity: minor
  - description: I renamed a page file while a claim checker was reading it by path, so I waited and later reran the check.
    solution: Finish all renames before dispatching checkers, or give them a pinned commit instead of the working tree.
    severity: minor
  - description: The Stop hook asked repeatedly for commits mid-work, so I committed unfinished drafts to satisfy it.
    solution: Let the hook skip a branch with no open PR while subagents are still writing.
    severity: nit
  - description: MDN, w3.org, vuejs.org and playwright.dev did not resolve from the cloud session, so writers read raw GitHub sources and some doc URLs rest on a source slug.
    solution: Allow these hosts in the environment, or keep a saved docs mirror for Glass Box runs.
    severity: minor
  - description: A retitle to Colour and motion preferences was one character over the 28-character title cap, found only at test time.
    solution: Say the cap in the glassbox-curate Skill or run the title check before a rename.
    severity: nit
