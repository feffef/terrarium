summary: "Human-instructed: the user asked for a script that frictions-to-fixes runs on every run to prune Friction Ledger entries older than 14 days. Per the user's stated preference I asked first, and the user chose: drop occurrences (not just whole entries) before the horizon, delete emptied entries of any status, run it in §4's ledger edit. A first scan showed no entry was wholly stale; 45 old occurrences sat across 13 entries. The script edits each file's parsed YAML document so comments and quoting survive; its first run removed only lines. Agent-initiated: applying the prune to today's ledger in the same PR, sharing LEDGER_DIR with session-frictions.ts, and a §5 hand-off line after the code-review spec axis noted the doc-PR agent's brief would not otherwise name the script. Open note in the PR: a run dispatching only code fixes has no carrier for its ledger edit (predates this PR). CI gate green; posted verdict and merged via merge-pr.ts."
