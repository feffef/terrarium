frictions:
  - description: Built a new Term.vue link with the plain text Lesson without agreeing a sample first; the owner then pointed to the existing titled Lesson chip.
    solution: Before a UI change, grep the tenant for an existing component for the same element and show a sample with preview, as CLAUDE.md says.
    severity: moderate
  - description: The dev preview server never hydrated in headless Chromium, so two checks returned empty before I rebuilt production, which cost a few minutes.
    solution: verifying-ui-changes.md could say dev preview may not hydrate in the headless check, so build first.
    severity: minor
  - description: TMPDIR was empty, so gate logs and screenshots landed in the filesystem root instead of the scratchpad.
    solution: Write to the scratchpad path named in the system prompt, never to TMPDIR.
    severity: nit
  - description: scripts/ui/preview.ts is not executable, so running it directly failed with permission denied; it needs pnpm exec tsx.
    solution: Document the pnpm exec tsx form in verifying-ui-changes.md or mark the script executable.
    severity: nit
  - description: Wrote the first Skill inventory Lesson from the schema and audit-skills alone, without tracing who reads the inventory; the owner found the concept weak and I redid it.
    solution: Before a Lesson on Terrarium data, grep for every consumer of that data, as glassbox-lesson's read-the-source step intends, then write the concept.
    severity: moderate
  - description: Two content files failed validation on a colon in an unquoted YAML scalar, found only when the full validator or page test ran.
    solution: Quote any description or changes entry that holds a colon; the glassbox-curate run-entry skeleton could show them quoted.
    severity: nit
