  - description: TMPDIR was empty, so gate logs and screenshots landed in the filesystem root instead of the scratchpad.
    solution: Write to the scratchpad path named in the system prompt, never to TMPDIR.
    severity: nit
  - description: scripts/ui/preview.ts is not executable, so running it directly failed with permission denied; it needs pnpm exec tsx.
    solution: Document the pnpm exec tsx form in verifying-ui-changes.md or mark the script executable.
    severity: nit
