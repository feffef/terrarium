summary: "The owner asked whether each expanded Glass Box term has a matching Lesson, and wanted terms to link the Lesson instead of GLOSSARY.md. I mapped all terms to Lessons and found about nine without a good one, asked three questions, and the owner decided: Lesson only when there is one, keep the glossary link for no-Lesson and Tenant-specific terms, delete Proposal and Pingback, write a Skill inventory Lesson, leave XSS unlinked. Those were human-instructed. I built an optional lesson field, a check that rejects both fields or a missing page, the term data, the new Lesson and the doc edits. My first Term.vue link just said Lesson; the owner pointed out the existing titled Lesson-chip design, so I redrew it from the page list (agent-initiated wording of the first version, owner-corrected). Code review by two read-only subagents found no hard violations; I moved Session to Session logs and cut a duplicate bullet and comment. Open: the new Lesson uses prefix 85 against the tens rule, and a human must merge it."
