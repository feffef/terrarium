    solution: "Worth its own follow-up: file (or point to) an issue proposing the PreToolUse guard the research table already specs (deny git log -S / blame / merge-base when git rev-parse --is-shallow-repository is true), since the table already judges it the strongest unbuilt refusal candidate in the corpus."
