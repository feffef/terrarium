    solution: Checked git cat-file -p on the parent commit to confirm it wasn't the shallow boundary before trusting the "new file" diff as a genuine creation date. No new gap found, just a reminder that git-conventions.md's shallow-clone guidance is worth the extra verification step it asks for.
    severity: nit
