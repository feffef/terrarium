frictions:
  - description: My first grep for the wrong claim hit the 2026-09-24 digest, whose homepage claim was correct, so I asked the owner for the date instead of checking the newest digest first.
    solution: When a user reports a recent wrong summary, check the most recent digests on a freshly fetched main first.
    severity: nit
  - description: Running `git checkout -q origin/main --` to read main left the checkout on a detached HEAD; caught before committing.
    solution: Read main's files with `git show origin/main:<path>` or a worktree, never by checking out.
    severity: minor
  - description: Hand-wrote the commit trailer and the PR provenance line in the wrong shape; both guards denied, costing two retries.
    solution: Let the commit hook add the trailer, and put the provenance line first in GitHub bodies as the guard describes.
    severity: nit
