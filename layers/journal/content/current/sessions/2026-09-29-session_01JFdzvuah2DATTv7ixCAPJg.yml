summary: "Human-instructed throughout. The owner asked whether the daily digest reads only session logs and suggested it also read git logs, PRs and issues. I showed it reads git (PR numbers and titles from merge commits) plus session logs, with GitHub issues optional. The owner then named the concrete error: the 2026-09-28 digest said \"the homepage gained a map of what is real and what is invented\", but PR #1475 added that page to the Journal. Tracing it showed the input data already had the right facts (the PR title says \"to the Journal onramp\", and the diff is one Journal file); the writer read the visitor-loop's \"(homepage)\" focus label as a location. More sources alone would not have caught it. I proposed adding changed file paths to gather; the owner instead chose a separate review step that fact-checks the generated Digest, leaving generation unchanged. The owner decided: fall back to git alone when GitHub is unavailable, keep unverifiable claims but don't self-merge, and fix the 2026-09-28 digest in the same PR. Modelled the step on blog-post's existing fact-check stage. PR #1488 opened by repo default."
