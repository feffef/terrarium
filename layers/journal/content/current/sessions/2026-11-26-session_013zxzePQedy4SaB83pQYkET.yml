frictions:
  - description: All 16 subagents dispatched in one go failed on a 5-hour API rate limit; I had to resume each by SendMessage after the limit lifted, costing a long wait and 16 extra calls.
    solution: Dispatch in smaller batches or check the limit first; the Skill could say to resume by SendMessage, not redispatch.
    severity: moderate
  - description: Ran a gh api search before reading github-integration.md; the PostToolUse hook pointed at it afterwards.
    solution: Read github-integration.md before the first GitHub call, as CLAUDE.md says.
    severity: nit
  - description: Edited Journal Inventory yml without reading layers/journal/GLOSSARY.md first; wrote 'diary entry' where the glossary says session log, caught in code-review.
    solution: Step 5 of audit-skills should list the Journal glossary among docs to read before editing Inventory entries.
    severity: minor
  - description: Two notes ran over the 300-500 word limit and a stale issue state (#3635 closed) went into a note; fixed after prune-observations and check-states flagged them.
    solution: Draft notes closer to 450 words and run both scripts before committing.
    severity: nit
  - description: The role trim to 50 words needed a follow-up commit because I counted words wrongly; the follow-up fit the two-file simple-change bar only after reverting a third edit.
    solution: Count words with a script (yaml load plus split) when trimming a role.
    severity: nit
