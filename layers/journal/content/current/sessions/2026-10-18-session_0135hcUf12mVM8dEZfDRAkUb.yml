frictions:
  - description: The Stop hook demanded a push about seven times while reviews were running and ADR-0004 required gate and review first.
    solution: Known stop-hook-nag cause; the hook cannot see running subagents or the review-before-push rule.
    severity: nit
  - description: design-brief.md opens with a dangling fragment after {PICKS} and its session-log glob matches nothing; the design agent lost rounds on both.
    solution: Rewrite the brief's first lines and give the real glob (*session_<id>*.yml).
    severity: minor
  - description: The Skill says the survey agent works from a read of the extract file, but the compact output was still 90 KB with long docsRead arrays.
    solution: Have extract-frictions --compact drop docsRead.
    severity: nit
  - description: Hook-injected rule files (adr-0005, adr-0021, adr-0029 and others) loaded after plain reads of unrelated docs, adding context with no bearing.
    solution: Narrow those rules' paths.
    severity: nit
  - description: The impl agent's scratch subfolder did not exist, so its first gate redirect failed; the Skill's brief does not say to create it.
    solution: Add mkdir -p of the scratch subfolder to the impl-brief.
    severity: nit
  - description: Skill section 5 says to track picks in the ledger before the fix PR exists, then section 8 resets them; the ref text for a dispatched fix is unspecified.
    solution: State the ref wording for a dispatched, not-yet-merged fix.
    severity: nit
