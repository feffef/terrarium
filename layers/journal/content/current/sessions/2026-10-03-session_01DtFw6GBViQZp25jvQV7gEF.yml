learnings:
  - Vue's `.self` modifier on a role=button row's keydown handlers is the one-line way to let nested links keep their Enter; `.prevent` without it cancels the link's activation
  - In this sandbox a navigation to a blocked external host surfaces as no navigation at all in Playwright; intercept with page.route to observe it
  - A web page cannot learn whether a visitor is logged in to GitHub or claude.ai (same-origin policy, SameSite cookies), so a maintainer-only affordance can only be a per-browser toggle or a real server-side OAuth check
ideas:
  - "Generate tsconfig.node.json's `paths` from .nuxt/tsconfig.json at `nuxt prepare` (or assert parity in a unit test) so #shared/#catalog/#routing stay in sync across the two typecheck programs instead of being added one failure at a time"
  - Reuse the maintainer view for other maintainer-only Journal affordances (a copy-resume-prompt button on each card, a link from a card to its PR's CI run) once a second one exists, and only then give it a glossary term under the rule of two
