frictions:
  - description: "pnpm typecheck failed with 'Cannot find module #shared/session-url' after the alias switch; it looked like nuxt typecheck and the stale-.nuxt caveat, but came from tsc -p tsconfig.node.json, which maps #routing and #catalog but not #shared"
    solution: "Added the #shared path there (in PR 1548). Better: derive tsconfig.node.json paths from the Nuxt-generated aliases so a root alias can never be missing from the node program"
    severity: moderate
  - description: A relative import from layers/journal/app/utils into root shared/ passed vitest and lint but Nitro's server build externalised it and failed; tenant-layers.md says use the root alias, which vitest did not resolve
    solution: "vitest.config.ts now aliases #shared like #routing; tenant-layers.md could say a relative path into shared/ breaks the server build, not just style"
    severity: minor
  - description: Playwright waitForNavigation reported no navigation for the chip's Enter press because the sandbox proxy blocks claude.ai; a first probe read as a real defect
    solution: Stub the external host with page.route and assert the request was issued; worth one line in verifying-ui-changes.md
    severity: minor
  - description: The stop hook demanded commit-and-push four times while the full gate was still running, pushing toward an unverified push
    solution: Have the hook tolerate a running gate:scoped, or say verify-then-push rather than push
    severity: nit
  - description: Passed run_in_background:false to Agent out of habit; the guard denied both review dispatches and they had to be re-issued
    solution: None needed beyond the guard, which named the fix
    severity: nit
