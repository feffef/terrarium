frictions:
  - description: "A dispatched corpus-search subagent recommended re-pruning CLAUDE.md's run_in_background-from-the-outset bullet (issue #1293) based on two cited recurrences, but those recurrences predated an already-landed 2026-09-22 prune of that exact bullet, whose pruned form a 2026-09-26 verdict had already validated holding — the subagent's report read the issue history but didn't check the ledger's actual git commits first."
    solution: Cross-checked the candidate against git log --oneline -- .agents/prune-trials.yml and the actual commit diffs myself before acting, per CLAUDE.md's 'verify fresh, don't recall a subagent's report as settled' rule; caught it before any wrong prune shipped. A second dispatched search, explicitly instructed to check historical trial commits first, avoided the same mistake.
    severity: moderate
  - description: While inspecting a completed probe subagent's worktree for check-worktrees.ts's false 'unpushed' flag (a detached-HEAD probe worktree at the feature branch's own tip, which check-worktrees.ts compares against origin/main rather than the feature branch), ran `cd <worktree> && ...` from the orchestrator's own persistent shell, which silently changed this session's own working directory into the subagent's worktree — exactly the footgun dispatch-subagents/SKILL.md section 5 names by name.
    solution: "Recognized the environment-update notice and cd'd back to the repo root immediately, then re-verified git status there before trusting it. Worth restating dispatch-subagents/SKILL.md's own warning even more concretely: any `cd` into a linked worktree from the orchestrator's Bash tool persists across calls exactly like any other cd, with no automatic return."
    severity: minor
  - description: First Agent tool dispatch for the §4 Sonnet probe mentioned isolation:'worktree' only in the prompt text, not as an actual tool parameter — the dispatch-subagents Skill explicitly warns this must be passed explicitly, not implied by prose.
    solution: Caught before the agent did any real work; stopped it via TaskStop and redispatched with the isolation parameter actually set. No work was lost.
    severity: nit
