  - description: A Nuxt dev server (PID 1071) was already running, so three preview.ts start --dev attempts died on its lock, costing about four calls before I found the existing URL.
    solution: Check for a running dev server first, or have preview.ts reuse the running one.
    severity: minor
  - description: I did not verify the Claude-Session commit trailer on the last two commits after they landed, though git-conventions says to check it.
    solution: Run git log -1 --format=%B after every commit, not only the first two.
    severity: minor
