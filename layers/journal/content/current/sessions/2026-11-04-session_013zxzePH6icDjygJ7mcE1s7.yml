outcome: "PR 2845 merged: Routine chart bars show the selected metric instantly above the hovered bar"
summary: "The user asked for the Routine cost bar charts to show dollar costs on hover. I found a native tooltip already existed, asked questions first as the user's preference said, and learned they wanted an instant label right above the hovered bar, not at the cursor, per-Routine charts only. I built it (human-instructed) as an HTML label driven by a hovered-bar index, with full-height hit areas. I first showed cost only, which was my own assumption; the user then corrected it to the selected metric and said no date. On their question I measured edge placement (slight overhang of the card on a 360px phone) and left it unclamped because they did not ask for it. On \"review, open PR and merge\" (human-instructed) I added an e2e test so ADR-0004's untested-behaviour exception does not force a human merge, ran code-review (standards and spec subagents), strengthened the test per their findings, ran gate:scoped green, and opened the PR. CI's gate went green on the head; I checked the doorbell's SHA was the merge ref, posted my verdict comment and merged with merge-pr.ts (human-instructed: \"review, open PR and merge\"). Edge clamping of the label is still open, unrequested."
