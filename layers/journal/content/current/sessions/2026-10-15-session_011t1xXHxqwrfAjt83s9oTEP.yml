outcome: "PR #2087 open: dated Glass Box focus plus a new opus refiner step before any PR"
summary: "Human-instructed: the owner asked that visitor-loop look only at Glass Box this October and that a subagent refine every proposed change against ADRs, repo docs and GitHub issues, so visitors' outside view can't override platform decisions. Before building, I asked four questions; the owner chose an auto-expiring focus (through 2026-10-31), a refiner placed after the tally and before any PR, refine-or-drop authority with a cited source, and opus. I added a dated override to \"Today's focus\", a new step 4 \"Check fit\" with refiner-brief.md, and renumbered steps 5-7. code-review (agent-initiated, per ADR-0004) found step 7's done line contradicted the new verdicts and that a refined item could leave the remit; both fixed. Left as-is on purpose: an explicit focus argument still wins in October, and the Standards reviewer's point that a Routine argument could carry the focus instead (ADR-0005)."
