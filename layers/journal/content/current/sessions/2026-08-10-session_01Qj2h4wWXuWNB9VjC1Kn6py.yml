summary: "Scheduled /digest Routine fired with no human prompt this turn. Authored the 2026-08-09 Digest from scripts/digest.ts gather output, ran the retention archive sweep (archived the 2026-08-02 digest and 6 aged-out session logs), and opened PR #905 with both riding one commit as the skill directs. CI's test:e2e gate then failed on a real, PR-905-caused regression (see frictions): the previously-fixed \"Sparks drives row height\" invariant (issue #760) has drifted back to its tipping point on main, and this PR's new digest content is what tips it over in CI's own environment, confirmed via a controlled clean-rebuild A/B in an isolated worktree. Corrected an earlier (wrong) claim in the PR body that had misattributed the failure to local Chromium/font differences and proposed deferring to CI — CI itself is red and the cause is real. Filed issue #906 (referencing #760) with the evidence, updated PR #905's description, and left the PR open rather than self-merging, since the fix is a product/design call outside this run's scope (per #760's own \"ready-for-human\" framing). Every future /digest run will likely keep tripping this until #906 is resolved."
