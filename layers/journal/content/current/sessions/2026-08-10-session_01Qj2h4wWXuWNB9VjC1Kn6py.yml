frictions:
  - description: "Asserted in PR #905's body (before verifying against CI) that a failing test:e2e assertion — journal Tenant \"keeps Sparks the driver of the digests+Sparks band height at desktop width\", issue #760 — was a pre-existing, environment-only (Chromium/font) divergence unrelated to this PR's content, based on a `git stash` + single-test rerun that turned out to be an invalid reproduction: it either reused a stale `.output` build from an earlier full gate run, or ran the test in isolation (`-t` filter) rather than as part of the full 80-test suite, which changes the measured outcome. CI then failed for real. A controlled clean-rebuild A/B (isolated worktree, fresh install/build, full test:e2e suite, once on origin/main and once on the PR branch) showed CI's own environment flips this exact test from pass to fail when this PR's digest content is added — the failure is real and attributable to the PR, not a local artifact. I shipped the wrong claim into the PR body before verifying it against the authoritative source (CI itself), which CLAUDE.md's verification rule exists to prevent."
    solution: 'Redid the reproduction properly (isolated worktree, full suite, fresh build both sides) before asserting causation either way, corrected the PR body, and filed issue #906 with the real evidence. For any future "is this failure pre-existing or caused by my change" check involving Playwright/e2e layout assertions, always (a) run the full suite, not a `-t`-filtered single test, and (b) start from a clean `pnpm build`, not a reused `.output` — a filtered run or stale build can both give a wrong verdict that looks superficially like solid verification.'
    severity: major
  - description: "`git stash` / `git stash pop` around the archive sweep's `git mv` renames split each rename into a separate staged-add + unstaged-delete instead of preserving the rename, requiring a `git add -A` to re-consolidate before the gate run."
    solution: Minor mechanical wrinkle of stashing around already-staged renames — no repo change needed, just worth remembering `git add -A` after any stash pop that touches `git mv`'d paths.
    severity: nit
