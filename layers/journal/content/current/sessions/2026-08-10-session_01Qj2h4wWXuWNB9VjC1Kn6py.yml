learnings:
  - A single-test `-t`-filtered vitest e2e run, or a run against a stale `.output` build, is not a valid way to check whether a layout/height assertion is "pre-existing" — both can silently produce a different numeric result than the full suite against a fresh build. Always rebuild clean and run the full spec file before drawing a pre-existing-vs-caused- by-this-change conclusion for this class of test.
  - This sandbox's pre-installed Chromium (/opt/pw-browsers, build 1194) is a genuinely different browser build than CI's `playwright-core install --with-deps chromium` step fetches (build 1228 observed) — a real, confirmed version gap, not just a font-set difference, worth remembering as one plausible contributor to local-vs-CI pixel-measurement gaps (though it did not explain away this session's failure — CI was red for real).
ideas:
  - "Issue #906 asks whether main's CI gate might already be intermittently at risk on the \"keeps Sparks the driver\" invariant even without a new digest, given how thin the margin looked locally. A cheap follow-up: add a scheduled/manual `pnpm exec vitest run tests/e2e/smoke.spec.ts -t \"keeps Sparks\"` check (full suite context, clean build) against `main` a few times to see if the margin is stable or already flapping, before a human picks one of #760/#906's three fixes."
