entrypoint: remote
cliVersion: 2.1.323
learnings:
  - save-handback.ts captures only the last assistant record, so a resumed subagent's earlier report is lost unless saved first
  - A scheduled run reading its own cost fails, but reading a finished run's cost from another session works
ideas:
  - "Give research subagents a shared fact-check phase: before writing, one agent re-runs every count the final doc quotes and returns a table of verified or wrong, so the writer never relays an unverified number"
  - Let save-handback.ts save every assistant reply of an agent as numbered files, so reports that predate a resume are never lost
landedBy: Stop
