goal: Requirements and design draft for a single-site template
status: in-review
outcome: "Two research docs in PR 3269: requirements with evidence, and a proposal-only design draft"
summary: "The owner asked (human-instructed) for a deep dig into Terrarium's Skills, scripts, session logs, state files, instructions and issue history to find where the earlier single-site template breakdown was shallow or called hard-won things simple, and to write a requirements-only document that complements it. The session orchestrated three rounds of Sonnet subagents (6, 7 and 4, plus a docs-research agent) and kept its own context for writing. Mid-session the owner corrected several premises: parallel steering stays, observability and the Digest are must-have, a watcher stays, audit-docs is core, docs upkeep is autonomous and owner-steerable, the visitor loop stays but report-only, one unified self-improvement loop, browser navigation opt-in, logs stated only as a requirement, three autonomy presets. Agents were re-briefed with each correction and told to ground every claim in live session logs. A grilling round settled background questions. The owner then asked for a separate design-draft document and for long unclear-points sections in both; both are human-instructed. The design choices in the draft (Astro, five commands, nine p- Skills, one finding shape, request-time Journal) are the agent's proposal. code-review ran on both docs and its findings were fixed; gate:scoped passed. Open: the owner's review of PR 3269."
