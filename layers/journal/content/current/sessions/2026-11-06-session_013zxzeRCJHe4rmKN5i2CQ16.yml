frictions:
  - description: Built a cross-Space read although ADR-0006 says a page reads only its own Space; I leaned on the Journal precedent and the spec session's advice.
    solution: Treat a recommendation from another session as non-binding against an ADR; ask the owner before building anything that needs an exception.
    severity: major
  - description: Seeded the memory page from grades.yml but checked only one step against the repo; review found two more stale entries.
    solution: Before writing a seed, check every cited stem and claim against the current repo with one script.
    severity: moderate
  - description: Zod shapes and the list look were settled with the spec session, not the owner, and the grilling Skill was not invoked.
    solution: When the spec says settle with the owner, ask the owner directly in the first round, then use grilling.
    severity: minor
  - description: Wrote the spec session's id into a commit-message trailer; the commit hook corrected it.
    solution: Copy the id from my own system-prompt commit template, never from an issue body.
    severity: nit
  - description: A Bash call set run_in_background and also a trailing ampersand, so the double-background guard blocked it and nothing ran.
    solution: Use run_in_background alone with a plain foreground command.
    severity: nit
  - description: The preview shot of a route with an anchor did not scroll, so I took full-page shots and cropped them with a script.
    solution: Document in verifying-ui-changes.md that anchors do not scroll in shot mode, and recommend a full-page shot with a crop.
    severity: nit
  - description: Saved only the first subagent hand-back with save-handback.ts; the later hand-backs and the reviewers' replies were not saved.
    solution: Run save-handback.ts after every hand-back, or note in dispatch-subagents that a resumed agent's later reply needs it too.
    severity: nit
  - description: A third commit and gate run was spent on a one-phrase rewording that a bundled second pass could have carried.
    solution: Collect every reviewer's wording nits before resuming the implementation agent, and send one fix list.
    severity: nit
  - description: "Wrote 'It does not close #2898' in the PR body; GitHub treats a negated closing keyword as a closing one and closed the issue on merge."
    solution: Name a related issue without the words close, fix or resolve next to its number; pr-workflow.md already warns of this, so I should have rechecked the body against that line.
    severity: minor
