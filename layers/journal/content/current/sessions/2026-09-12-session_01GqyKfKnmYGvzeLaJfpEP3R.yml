learnings:
  - A pnpm `overrides` entry on `vue` also drags `@vue/compiler-sfc` to that version, so pinning the runtime does not by itself create a compiler/runtime skew
  - MDCRenderer wraps any MDC component carrying a `setup` in `defineAsyncComponent(() => Promise.resolve(component))` on every render — all five of our MDC components use `<script setup>`, so all five take that path
  - vue compiles its dev warnings out of production builds, so hydration-mismatch and resolveComponent warnings are invisible to a production preview probe
ideas:
  - "Teach the Routine behind #926 to run a negative control: before opening an un-pin PR, also test the pinned-out version and report whether the original failure still reproduces. A pin whose stated cause no longer reproduces is a different finding from a pin that upstream fixed, and only the control distinguishes them."
  - Add a gate check that fails when the lockfile resolves two different versions of the same @vue/* package, since a compiler/runtime skew produces SSR-vs-client symptoms that read as upstream regressions and cost a bisect to diagnose.
