frictions:
  - description: Believed 3.5.42 fixed it upstream and committed that claim before the control on 3.5.41 came back and falsified it.
    solution: Run the negative control before writing a causal claim anywhere, not after. A changelog entry that matches the symptom is a hypothesis, not evidence.
    severity: moderate
  - description: A green production probe cannot distinguish "bug fixed" from "vue dev warning compiled out"; nearly reported the prod result as proof.
    solution: CLAUDE.md's verifying-ui-changes guidance could state that hydration/warning assertions need a dev build, since production strips vue's warn calls.
    severity: minor
  - description: Probe script in the scratchpad failed under tsx as .ts (top-level await, cjs output); had to copy it into the repo as .mts to run.
    solution: Write ad-hoc probe scripts with an .mts extension, or note the constraint where scripts/screenshot.ts's ad-hoc-probe pattern is documented.
    severity: nit
  - description: Reading package.json's pnpm override does not tell you the installed version; a lockfile-respecting pnpm install kept vue at 3.5.40 after the override was removed.
    solution: Verify a dependency experiment from the build output's own version constant, not from package.json or from the install command's exit code.
    severity: nit
  - description: 'SHELL-READ-DETECTION miss. Ran `sed -n 30,70p docs/adr/*0017*` and `grep -rn "provenance header" docs/adr/*0017*`, which showed me docs/adr/0017-provenance-footer-on-agent-authored-content.md, but docsReadViaShell reported 0 docs and did not list either command as a rejected candidate. Direction: a miss, not a false positive.'
    solution: The detector appears not to resolve glob paths — `docs/adr/*0017*` never becomes a concrete doc path. Expand globs, or treat a reader command whose path argument globs into docs/ as a read of every match.
    severity: moderate
