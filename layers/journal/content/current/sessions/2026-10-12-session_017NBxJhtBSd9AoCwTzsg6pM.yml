frictions:
  - description: "Used only an inline review for the few-line PRs (#1840-#1843, #1847, #1848), following clear-backlog §4's few-line exception; the owner finds the full two-axis code-review useful even for minor changes."
    solution: "clear-backlog §4: drop the few-line exception; run code-review on every PR."
    severity: major
  - description: Questions for the owner were buried among a stream of status updates; owner had to dig, questions get overlooked and answers misread.
    solution: "clear-backlog: while waiting on the owner, the chat carries only the open questions; no progress narration; acknowledge events silently."
    severity: major
  - description: "Told the owner #1840 was ready for human merge before running phase-4 review; owner merged an unreviewed PR on my word."
    solution: "clear-backlog §5: hand a PR to the owner for merge only after its review round is done and the verdict is posted."
    severity: major
  - description: Keying grilling questions by ticket number (#1803a) confused the owner.
    solution: "clear-backlog §2: number questions plainly (Q1, Q2) and name the issue inside each question."
    severity: moderate
  - description: "Broke CLAUDE.md 'Invoke close-session when you open a PR': opened #1840 and several more PRs without logging until the end."
    solution: Log at the first PR open; re-invoke later.
    severity: minor
  - description: "#1834's premise (a missing commit trailer) came from an earlier subagent's guess relayed unchecked; it cost a triage plus an investigation."
    solution: Verify subagent causal claims against the transcript before filing them as issues (CLAUDE.md 'Verify before you state').
    severity: moderate
  - description: The auto-mode classifier denied the .claude/settings.json edit (Self-Modification) before the owner approved it in chat.
    solution: List Human-only settings edits as an explicit approval question in the grilling up front.
    severity: minor
  - description: Owner's '1786a C' mapped letters onto numbered options; needed a confirmation round.
    solution: Use one consistent option scheme across all questions.
    severity: nit
  - description: "Wrote PR #1847's body naming issue #1846 before the issue-create call returned; it happened to match."
    solution: Create the issue first, then cite its returned number.
    severity: nit
  - description: Read diffs and settings with grep/sed/git show in Bash rather than the Read tool, so path rules may not have loaded.
    solution: Use Read for repo files; Bash only for git diffs.
    severity: nit
  - description: "Pushed a follow-up fix to #1849's branch after the owner had merged it, breaking pr-workflow's check-before-follow-up rule; the fix never reached main and was re-landed as #1850."
    solution: Before any push to a PR branch, check with pull_request_read that the PR is still open.
    severity: moderate
  - description: "Pushed and opened #1850 before its review ran, so an unreviewed version was visible and then changed twice; the owner flagged the confusion."
    solution: Review the local worktree first; push and open the PR once the review rounds are clean.
    severity: moderate
