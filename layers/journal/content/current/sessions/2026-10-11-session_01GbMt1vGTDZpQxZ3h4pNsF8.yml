frictions:
  - description: Applied four C2 concision edits to how-it-works.md before the checker had returned; one (C2-4) was later judged WRONG and had to be reverted.
    solution: Stage edits only after every checker verdict is in; the Skill says act only on CONFIRMED.
    severity: minor
  - description: Three of six reviewer subagents could not write their findings file (harness refused), so I transcribed findings into scratchpad files by hand and had to chase C2 a second time.
    solution: Tell reviewers up front to return findings as text, and let the orchestrator write the files.
    severity: moderate
  - description: gate:scoped failed on verify:mermaid after I edited a mermaid diagram; the audit-docs Skill does not mention regenerating SVGs for diagram edits.
    solution: Add a one-line note to audit-docs that editing a mermaid block needs pnpm render:mermaid.
    severity: minor
  - description: Stop hook asked to push uncommitted work while the gate was running; ADR-0004 says push only after it passes, so I waited.
    solution: The hook could check for a running or failed gate before nagging.
    severity: nit
