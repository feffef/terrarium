summary: The user invoked /glassbox-update with the argument "briefs only". That is not a Glass Box term, so I asked what it meant; the user answered "Drafts", which I took as running the Skill on the drafts Space only (human-instructed scope). Everything else was agent-initiated, following the Skill. The report flagged all 36 drafts pages and 25 Terms over 425 commits, mostly because b1f1e05e split scripts/ into area folders. I committed the step-2 advance, then dispatched six agents on disjoint page sets in the shared checkout (file edits only, no git writes), with a common brief, the old-to-new script map and the commit list. Five pages changed what they teach (fail-closed guards now use onFailure, the workflow scope is cloud-only, ADR trials need a Trusted user, frictions-to-fixes gained a design subagent); the rest needed path or Excerpt fixes or nothing. All Terms still matched. Layer test, validate:content and gate:scoped were green; the two-axis code-review found one judgement call, which I fixed. A seventh agent reviews the 76 screenshots; I pushed before it returned.
