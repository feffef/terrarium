frictions:
  - description: The Skill argument 'briefs only' matched no Glass Box term or Skill mode, costing a clarifying round-trip before any work
    solution: glassbox-update could list its accepted arguments (Space names) so a typo is caught by the user or Skill
    severity: nit
  - description: The Stop hook asked to commit and push about ten times while subagents were mid-edit and before gate and review, adding noise
    solution: Stop hook could stay quiet while background agents run, or ADR-0004's precedence over it could be noted in the hook message
    severity: minor
  - description: I pushed and opened the PR before the screenshot-review agent returned, so the PR's screenshot line claims shots taken, not reviewed
    solution: Wait for the shot review before pushing, or start it right after the build, in parallel with gate:scoped earlier
    severity: minor
  - description: The Spec review subagent was denied running glassbox-update.ts by the auto-mode classifier, so it could not confirm step 4's done check itself
    solution: Paste the done-check output into review briefs; I had already run it
    severity: nit
  - description: Most drafts pages have no publishedAt, so agents disagreed whether a teaching change should add one; I had to reconcile one page by hand
    solution: EVERY-PAGE.md Pin could say plainly to add publishedAt when absent and the teaching changes
    severity: nit
  - description: The screenshot-review subagent read 76 full-page shots one by one, hit image request limits, looped for ~50 minutes and 1,200 tool calls, and left the session unopenable in the app
    solution: Check mobile overflow by image width in a script, and look at only the shots of pages whose teaching changed; EVERY-PAGE.md Check could say so for bulk runs, and dispatch briefs should cap image reads
    severity: major
  - description: nuxt-content/mdc-components scrolls sideways on mobile because a long :file chip path does not wrap; pre-existing, outside this run's paths
    solution: "Let the Glass Box :file chip wrap (overflow-wrap: anywhere) in its component; file an issue"
    severity: minor
  - description: "I subscribed to PR #2221 by guessing the new PR number before reading the create result (it was #2222), then had to unsubscribe and resubscribe"
    solution: Wait for create_pull_request's result before subscribing
    severity: nit
