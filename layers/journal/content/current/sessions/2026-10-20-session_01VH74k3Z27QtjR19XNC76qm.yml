frictions:
  - description: Ran git log and git diff --stat before reading git-conventions.md; the PostToolUse hook reminded me. No harm, the doc did not change the call.
    solution: None needed beyond the existing hook; the hook worked as designed.
    severity: nit
  - description: Gave recommendations (which fixes to dispatch or file, and the regression picks) without invoking the adr-check Skill that CLAUDE.md requires before a recommendation; the design agent ran it for its picks.
    solution: The Skill could say adr-check is run by the design agent so the main session need not repeat it, or CLAUDE.md could exempt Skill-mandated decisions.
    severity: minor
  - description: A bash cd into the frictions directory moved the session working directory, so later relative commands needed an explicit cd back.
    solution: Use subshell cd or absolute paths in one-off commands.
    severity: nit
  - description: "Filed regression issue #2332 with a garbled phrase (#321-era follow-up #2321) and had to edit the body after creating it."
    solution: Re-read the body before sending, as for any GitHub post.
    severity: nit
  - description: Survey brief says to read every session in the window but the extract printed 37 sessions since 2026-10-18 while its first record began 2026-10-17; the survey agent flagged the window rule and output disagree.
    solution: Have extract-frictions.ts print the exact window start it filters on, or the brief name which bound wins.
    severity: minor
  - description: Survey brief says to search the tracker with search_issues, while github-integration.md says search is rate-limited and to use list-open-issues.ts; the survey agent used the script and could not tell whether that counts.
    solution: Brief points to the listing script and says a scan of open issues plus merged PRs counts as the keyword search.
    severity: minor
  - description: Survey labelled ledger-yaml-hand-edit-errors never-fixed although it already carried fixes 2154 and 2297; the design agent caught it. The brief also gives no rule for status when an owner closed the tracking issue not planned or a trial was judged.
    solution: "Brief: classify from the entry's fixes first, and state which status an owner-declined or judged-trial entry gets."
    severity: minor
  - description: "prune-friction-ledger.ts --summary compares dates as strings, hiding same-day post-fix sessions; the survey agent counted them by hand. Same cause as open issue #2333, and one subagent hit three ledger YAML edit hazards (blank line, quoting)."
    solution: "Compare session start time with the fix merged_at, as issue #2333 proposes."
    severity: minor
  - description: Design brief says read the full log of every occurrence, impossible for 35 occurrences; the design agent scripted extracts and listed what it read. It also gave no repo slug, so a GitHub read failed on a wrong owner.
    solution: "Brief: full logs for moderate and above plus the newest three; give feffef/terrarium as owner/repo."
    severity: minor
  - description: Skill section 6 has the build agent push after review, but the agent could not push in its worktree-isolated setup; I pushed the reviewed branch from the main checkout, and the build agent left a stray local worktree branch.
    solution: Skill section 7 says who pushes when the agent is worktree-isolated; clean the stray branch with check:worktrees.
    severity: nit
  - description: The Stop hook asked to push six times while the gate and reviews were still running and ADR-0004 forbids pushing before them.
    solution: "Accepted cost (stop-hook-nag cluster, issue #2233)."
    severity: nit
