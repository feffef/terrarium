outcome: Ledger PR and one batched doc-fix PR are open; three regression issues filed; the closing ledger PR is still to do
summary: "The owner invoked /frictions-to-fixes (the only human prompt; everything after was the Skill's own procedure, so every step below was agent-initiated within that Skill). A survey subagent read 37 sessions, appended 45 occurrences to the Friction Ledger, recorded six missed fix PRs and ranked candidates. I filed regression issues #2332, #2333 and #2334 (the top three by severity, count and dated recurrence), picked seven fix groups and had a design agent design them. Two designs were dispatched as one doc branch (tighter CLAUDE.md verify-before-you-state wording, one clear-backlog sentence, quoted atlas-specimen note examples); the design agent recommended no change for four picks (misread-owner-instruction, blocked-waiting, designated-branch-clash, parallel-rewrite) because the guards already say the right thing or a clause would cost every session more than the slip, and the survey's pick 5 turned out to already have two fixes. Standards and Spec review of the doc branch found no hard violations; two wording fixes went back to the build agent. Ledger PR 2335 and doc PR 2336 are open and subscribed. Still open: CI, verdict comments, merging both, the closing status-only ledger PR (section 8) and cleaning the build agent's stray worktree branch. The weak point is that the same rule wording did not stop 35 earlier occurrences, so the doc PR may not move the counts."
