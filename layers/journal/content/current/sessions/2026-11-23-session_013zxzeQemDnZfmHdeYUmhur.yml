frictions:
  - description: "I wrote 'five nits fixed' in PR #3615's body from memory; the triage lines show four fixed and one skipped. Corrected by a PR edit."
    solution: Count from triage.md before writing the PR body, as CLAUDE.md says (verify before you state).
    severity: nit
  - description: "Retro, builder: rules() puts the no-chaining Bash rule after the task steps, so a compound cd command was refused by the worktree guard and rewritten; the gate command in the first-turn brief also blurs which turn it is."
    solution: "In .claude/workflows/clear-backlog-build.js rules(), put the no-chaining rule and scratchpad-script tip first, and drop the gate command from the first-turn brief (unverified: builder's own report)."
    severity: nit
  - description: "Retro, builder: brief step 2 says to read implement/SKILL.md, whose lines 15-16 say to invoke code-review, while the brief says to skip it; reconciling the two cost a re-read (builder's claim, not re-checked)."
    solution: Have the build brief say once which implement/SKILL.md steps apply, in .claude/workflows/clear-backlog-build.js.
    severity: nit
  - description: "Retro, all three agents: the rule-use hook asked for two echo calls per agent, listing rules that did not apply to a read-only review or a small build, with no effect on the work (their reports; hook home file unverified)."
    solution: Skip the rule-use prompt for read-only review subagents, in the hook script that emits it, likely under scripts/hooks/ (unverified).
    severity: minor
  - description: "Retro, reviewers: round-1 Standards and Spec reviews of two diffs of about 10 to 40 lines found only cosmetic nits (import order, cast, test title) and no defect, which looked costly for their size (reviewers' reports and findings files)."
    solution: "Evidence only, from n=2 branches: a lower bar for small:true than the simple-change test would cut one reviewer per small branch; weigh before cutting, since a safety net is kept."
    severity: minor
  - description: "Retro, Spec reviewer: the first turn asked for structured output and the resume asked for a JSON file plus one line, two hand-off formats in one run."
    solution: The resume text in .claude/workflows/clear-backlog-build.js should always name the hand-off and the file path (reviewer's report; first-turn source unverified).
    severity: nit
  - description: "Retro, Standards reviewer: told to read only the '### 3' section of code-review SKILL.md without an end line, so its sed range also pulled in step 4's prompt text."
    solution: Name the section's end line or heading in the review brief in .claude/workflows/clear-backlog-build.js (reviewer's claim, unverified).
    severity: nit
