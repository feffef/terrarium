frictions:
  - description: Dispatched worktree subagents via the build workflow without first reading the dispatch-subagents Skill, which CLAUDE.md requires; I only grepped its 'simple' size line.
    solution: clear-backlog §3 could say the workflow carries dispatch-subagents' rules, so the orchestrator need not read it, or tell the orchestrator to read it.
    severity: minor
  - description: Did not open the full ADR-0003/0004/0022 texts before acting, relying on rule summaries; no harm seen on two owner-authored issues.
    solution: Summaries sufficed here; no change needed unless a later run trips on a detail.
    severity: nit
  - description: Spot-checked triage claims with one multi-file Bash sed/grep instead of Read, so the reads loaded no rules (CLAUDE.md, ADR-0029).
    solution: Use Read with offset/limit for spot checks.
    severity: nit
  - description: The workflow's §2 grilling step had zero questions, but the Skill doesn't say to skip the push notification and grilling in that case; I skipped them by judgement.
    solution: "Add to clear-backlog §2: with no grill results, skip the notification and go straight to §3."
    severity: nit
  - description: A chained background command (two merge-pr.ts runs then tail) reported exit 1 though both merges succeeded with EXIT=0, costing a log check.
    solution: End a chained background command on its own status line, not a trailing tail of several files.
    severity: nit
