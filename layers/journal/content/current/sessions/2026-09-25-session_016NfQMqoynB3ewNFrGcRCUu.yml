frictions:
  - description: The survey subagent hit mcp__github__search_issues rate limiting (HTTP 403) whenever it issued 2+ search calls in the same batch, forcing it to serialize every subsequent tracker search one at a time.
    solution: Budget tracker-search calls in future frictions-to-fixes survey subagent briefs as strictly sequential, not parallel-batched.
    severity: minor
  - description: scripts/session-frictions.ts's JSON output (~74KB for a 20-session window) exceeded the Read tool's single-call inline cap, requiring a second Read with an offset to get the rest.
    solution: Expected/known given Read's pagination; note in the Skill's own instructions to budget ≥2 Read calls for the raw survey data, or land the --out flag PR from this run (adds a flag but doesn't itself fix chunking) plus consider a --compact-like size reduction in a future run.
    severity: nit
  - description: 'The doc-batch impl agent (af599b74f21a545cb) briefly ran `pnpm install` with run_in_background: true, violating the "a dispatched subagent must never background a Bash command" rule from dispatch-subagents/SKILL.md. It caught this itself immediately, did not call Monitor (also disallowed), and foreground-polled a log file instead — no work was stranded and nothing else was backgrounded for the rest of that session.'
    solution: Self-corrected in the moment; no further fix needed here, but worth watching if this recurs across future dispatched agents — could indicate the rule needs to be stated more prominently near the top of the brief rather than in a later mechanics bullet.
    severity: minor
