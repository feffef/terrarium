learnings:
  - In the Atlas theme, --sig-1 is resolved at :root, so any plate drawn outside a Specimen page must re-bind --sig-1 itself to pick up the Biome accent.
  - Nuxt resolves a component by a runtime-built name only if it is registered globally (.global.vue); resolveDynamicComponent returns the string unchanged and without a warning when it is missing.
