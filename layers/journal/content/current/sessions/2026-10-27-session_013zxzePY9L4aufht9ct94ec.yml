outcome: "PR #2597 open: Atlas 404 plate plus a per-Tenant not-found seam in app/error.vue"
summary: "The user invoked grill-with-docs on an idea from another session: style the Atlas 404 as a plate in the book's design. Over two grilling rounds the user decided every branch: cover both 404 shapes (unknown Specimen in a known Biome, and unknown Biome, which fell through to the generic error page), a newly drawn empty-specimen-jar plate, the naturalist's copy kept, a per-Tenant `<Tenant>NotFound` seam in app/error.vue rather than an Atlas-only special case or bypassing useSpace, Biome-accent tint with neutral ink for an unknown Biome, e2e tests plus a one-line doc, one PR built by Fable. The user then said \"build it now\". Agent-initiated within that ask: a Fable subagent built it in a worktree; two code-review rounds found the smudge was never tinted (theme.css binds --sig-1 to the neutral accent on :root, so a Biome class can't re-tint it) and the neutral link failed AA contrast; both were fixed, a tint assertion was added, and I fixed glossary drift (\"wing\" for Biome) in comments myself. No glossary term or ADR: the seam is small and easy to reverse. The seam's opt-in is a `.global.vue` component, because only a globally registered component resolves by a runtime-built name."
