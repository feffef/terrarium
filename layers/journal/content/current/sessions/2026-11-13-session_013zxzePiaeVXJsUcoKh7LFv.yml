frictions:
  - description: Ran git log --grep to verify a closure before reading git-conventions.md; the read-first hint fired after the call.
    solution: Read git-conventions.md at session start when the skill will run git beyond status, or use git show.
    severity: nit
  - description: Passed --help to list-open-issues.ts, which only takes a number, and got a parse error.
    solution: Have the script print usage on an unknown argument.
    severity: nit
  - description: The SubagentStart hook demanded two echo rule-use Bash calls per agent; 10 of 15 retros named it as extra turns with no review value.
    solution: Batch the rule-use bookkeeping into one call, or skip it for read-only review agents.
    severity: minor
  - description: PostToolUse hints asked for git-conventions, github-integration and ADR reads after the first git or edit call; 8 of 15 retros reported late reads.
    solution: Point agents at the docs in the brief before the first git or GitHub call, or drop hints a brief already covers.
    severity: minor
