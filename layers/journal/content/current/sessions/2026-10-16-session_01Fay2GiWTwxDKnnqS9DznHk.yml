frictions:
  - description: Ran git fetch before reading docs/agents/git-conventions.md, against CLAUDE.md's read-first trigger; no harm, but the order was wrong.
    solution: The read-first hint could also fire on git fetch/merge, not only later commands.
    severity: minor
  - description: My first template edit left EVERY-PAGE.md's 'In Terrarium gives no reasons' bullet, contradicting the new Why section; the review caught it.
    solution: When changing a contract, grep the Skill docs for every rule naming that section before dispatching agents.
    severity: moderate
  - description: I dispatched 20 agents before settling paragraph length and per-reason ownership, so a second 5-agent polish pass was needed.
    solution: Settle length bound and an ownership map of shared reasons in the first brief (dispatch-subagents §1).
    severity: moderate
  - description: My brief's check grepped vitest's default output, which lists only failures, so several agents saw nothing for a passing page.
    solution: Brief agents to use --reporter=verbose when grepping per-page results.
    severity: minor
  - description: Polish agents shared the scratchpad; one agent's apply script picked up another agent's draft files and errored.
    solution: Name each agent's scratch subfolder uniquely in the brief (dispatch-subagents §3 already says so; I missed it).
    severity: minor
  - description: Did not open the full ADRs whose summary rules loaded (0004, 0005, 0021, 0029, 0030) though each says to when relevant.
    solution: The summaries sufficed for this content task; the rule wording could say which tasks need the full ADR.
    severity: nit
  - description: Read and edited files mostly via cat/sed/python in auto mode instead of the Read tool that CLAUDE.md asks for.
    solution: Use Read for files I edit so their rules load reliably.
    severity: nit
  - description: Did not read docs/agents/domain.md before editing layers/glassbox/GLOSSARY.md, though I changed a contract, not a term.
    solution: The trigger names glossary terms; a contract edit may not need it, but checking costs little.
    severity: nit
