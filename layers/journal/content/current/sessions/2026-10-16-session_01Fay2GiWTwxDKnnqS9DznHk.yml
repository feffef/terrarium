outcome: "PR #2124 open: new Why contract, check and Skill, plus 20 rewritten guide Lessons"
summary: "Human-instructed: the user asked that Glass Box guide Lessons' \"Why it's built this way\" sections explain the real reasons in newbie-friendly language (ADR links optional), that the template and Skill be adjusted, and that one agent per Lesson do deep research across ADRs, code, PRs, commits and issues. Per the user's preference I asked first; the user chose guide only (20 Lessons), short paragraphs per reason, no PR/issue ids in prose, and one PR. I changed the Lesson contract in layers/glassbox/GLOSSARY.md, replaced the link-only whyLine check in page-checks.ts with an ADR-citation check plus a 12-90 own-words bound on guide pages (drafts exempt until promoted), and updated the glassbox-lesson Skill. 20 research agents (shared checkout, one file each, no git writes) rewrote and re-pinned the Lessons. The two-axis code review then found my own template edits left a contradiction (EVERY-PAGE still banned reasons in In Terrarium), a restated contract, no length bound, jargon and many cross-Lesson repeats; agent-initiated follow-ups added the word cap, an ownership map so a repeated reason becomes a link to the Lesson that owns it, and a 5-agent polish pass. A re-review was clean but for small items I fixed directly. Gate green, 178 tests, two pages screenshotted. Open: whether the \"cost\" sentence (my addition beyond the user's \"problem, then the choice\") is wanted."
