outcome: "Report posted on issue #2432; PR #2570 merged by the owner, closing issue #2433 (ADR hint at git commit)"
summary: "Started from a scheduled task (issue #2432, read-measure-propose only). I re-ran audit-skills --adr-reads for windows A-C, wrote per-session throwaway scripts, and used two inspect-session subagents to verify 4 Bash-write misses. I read all 230 window Frictions and posted the report on #2432: 30 misses, at least 14 of them Bash writes, and 82% of hints followed. The owner then joined (human-instructed from here). They agreed with the proposals and asked what separate Bash/Edit logging would buy; I advised dropping it, since #2433's hint makes it moot. They said to implement #2433 and picked option 2, the commit-time hint, from my question. I extended adr-read-hint.ts to read each commit a Bash `git commit` reports (diff-tree names plus a -U0 patch) and run the same matching and dedupe, widened the matcher to Bash, and added a pre-filter branch and tests. The branch's own first commit was the live probe and drew the new pointer. Five review rounds found real bugs: path quoting, dropped `-- ` lines, hunkless files, and commit detection that backtracked exponentially, then quadratically. The fix was replacing the regex with a tokenizer. gate:scoped and CI were green on 07202cb90, and the owner merged PR #2570 (Human-only hook and settings files), which closed #2433. Still open with the owner: whether to build proposals 5 and 6 (digest ADR-0010 read, audit-docs reviewers and prune trials) as a separate PR, and whether to drop proposal 4."
