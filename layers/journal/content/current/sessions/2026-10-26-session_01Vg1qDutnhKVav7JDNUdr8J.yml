learnings:
  - "A session log's toolCounts counts the main agent only, while filesEdited also folds in subagents' edits and the session's committed files (the latter catching Bash writes, #2386)."
  - node:path matchesGlob does not match dotfiles with **, so a rule glob like dir/** misses dir/.gitkeep for both Edit and commit hints.
  - git diff-tree -p prints no header for an empty, binary or mode-only change; --name-only is needed to list every changed file.
ideas:
  - "Give adr-read-hint a Bash sibling that runs git diff --name-only after a Bash call that changed the tree and points to the ADRs governing the changed paths: it would catch heredoc, sed -i and python replaces, which made at least 14 of 30 misses (#2433)."
  - Give hook parsers a shared linear shell tokenizer in scripts/hooks/hook-io.ts with one adversarial timing test, so read-first-hint, bash-rules-hint and adr-read-hint stop growing separate regexes that can backtrack.
