summary: "Started by a scheduled or system-delivered task, not a human prompt. The task told me to run issue #2432's steps 1-7 and post one report comment, with no PR, no hook edit and no follow-up issues; I kept to that. I re-ran audit-skills --adr-reads for windows A, B and C (A and B matched the baseline exactly). A throwaway per-session script reused audit-skills' own functions for outliers, medians, the hint split and the misses. Window C's share read in full, without outliers, was 62%, against 25% (A) and 36% (B). 60 of 73 hints were followed (main 29/31, subagent 31/42), and all were path matches. A hook dry run showed the text match works; window C simply had no edit that needed it. I traced the 30 misses through filesEdited, commit-derived files and main-only toolCounts. Two inspect-session subagents verified 4 Bash writes, and 10 more were inferred from tool counts, 5 were workflow agents' edits and 11 stay unresolved. I read all 230 window Frictions and counted 2 ADR-content mistakes in 51 sessions, against #2286's 4/86 and 3/61. The Friction Ledger has 0 new binding-docs-skipped and 1 premise-not-questioned. Proposals went into the comment for the owner."
