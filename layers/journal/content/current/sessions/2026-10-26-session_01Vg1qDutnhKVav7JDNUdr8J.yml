  - description: "Commit detection took three review rounds: two regex fixes still backtracked exponentially, then the tokenizer was quadratic on unquoted escapes, before an escape-aware tokenizer held."
    solution: For hook input parsing, start with a tokenizer whose alternatives start with distinct characters, and time adversarial runs before the first review.
    severity: moderate
  - description: pr-workflow's follow-up rule sent four review-fix commits through further reviews (about 370k subagent tokens). Each round did find a real bug, but most of the cost came from the regex path.
    solution: "None proposed: pr-workflow.md is in an open Prune Trial, so the cost is logged here for its verdict."
    severity: minor
  - description: First pre-filter test replaced only an unindented tsx line, so the new indented Bash branch ran real tsx and the test failed for a harness reason; also, one test fixture committed files in the wrong order.
    solution: Make the sh test's substitution global and indentation-tolerant, and build fixtures in commit order.
    severity: nit
