  - description: Spent a detour checking whether the nested-transcript fix (#2546/#2550) changed adr-read-hint; it already used agentTranscript, so it did not.
    solution: Grep the hook's own imports first before reading another fix's history.
    severity: nit
  - description: Edited the hook while the first pnpm gate:scoped ran, against pr-workflow.md's 'edit nothing until it ends'; that gate run was wasted.
