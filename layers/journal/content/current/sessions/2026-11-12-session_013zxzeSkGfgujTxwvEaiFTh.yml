learnings:
  - gh api treats any -f flag as a POST even with a GET-style path; a 422 on a read means this happened.
  - Merge timestamps of the PRs, not commit dates, give a thing's real lifetime; a squash or integration PR can land a commit a day later than its date.
  - A Skill's description and behaviour change between versions within days, so a record that links the last revision must not describe the first.
ideas:
  - Make midden-survey's script also list closed-unmerged PRs and dormant branches with their unmerged-commit counts and merged-PR links, so the GitHub-side half needs no hand-written paging and branch squash-merges are screened mechanically.
  - Have midden-catalogue ship a small script that, given a removal commit and the PRs that added and removed a thing, prints its lifetime from merged_at times, so no record rounds a lifetime by hand.
