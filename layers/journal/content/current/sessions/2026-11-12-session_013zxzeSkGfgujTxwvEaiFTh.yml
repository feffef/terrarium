frictions:
  - description: gh api --paginate fails in this cloud proxy (numeric-ID repository paths blocked); I paged by hand with a page parameter.
    solution: Have midden-survey say to page closed PRs manually in cloud sessions, with a loop that stops at the window start.
    severity: minor
  - description: My first manual PR page loop stopped at 8 pages and silently missed PRs 1827-1830 and 1804; I caught it only by spot-checking a branch's PR.
    solution: Have midden-survey give one tested command that pages until created_at falls before the window.
    severity: moderate
  - description: I passed -f query params to gh api on the issues endpoint, which turned a GET into a POST; GitHub rejected it with 422, so nothing was created.
    solution: Document in github-integration.md that gh api -f makes a POST; use -X GET or put parameters in the URL.
    severity: minor
  - description: The sweep window held 118 deleted files and 39 branches; judging them one by one took many batched checks, since the script's noise screen misses generated mermaid SVGs.
    solution: Add generated mermaid SVG paths and blog in-place retitles to the survey script's noise or relocation screens.
    severity: minor
