summary: "The owner invoked /midden-survey (human-instructed; no other ask). I ran the Skill as written: confirmed the checkout was not shallow, bounded the sweep at the previous report's date (2026-10-10, issue 1739), ran the mechanical script (118 deleted-file candidates), then swept closed-unmerged PRs and the 39 branches newly past the 30-day floor, deduped against the trench and stores, and judged each cluster against both gates by checking origin/main for successors. Most of the window's deletions failed Gate B (promoted or folded Glass Box drafts, in-place Blog rewrites, replaced scripts, a clear-backlog dry run whose issues were closed by real PRs), so those went into the exclusions table. I filed one survey-report issue (3213) labelled needs-triage, and flagged three weak candidates and several borderline exclusions for the curator rather than deciding them. Agent-initiated: the choice of which borderline items to include or exclude (the curator should revisit). Not verified: eslint caching on the gate experiments, whether later Karen posts repeat the withdrawn reply, and the late commit on claude/visitor-fixes-mobile. Suggested next step: /midden-catalogue on the issue."
