frictions:
  - description: gh api --paginate fails in this cloud proxy (numeric-ID repository paths blocked); I paged by hand with a page parameter.
    solution: Have midden-survey say to page closed PRs manually in cloud sessions, with a loop that stops at the window start.
    severity: minor
  - description: My first manual PR page loop stopped at 8 pages and silently missed PRs 1827-1830 and 1804; I caught it only by spot-checking a branch's PR.
    solution: Have midden-survey give one tested command that pages until created_at falls before the window.
    severity: moderate
  - description: I passed -f query params to gh api on the issues endpoint, which turned a GET into a POST; GitHub rejected it with 422, so nothing was created.
    solution: Document in github-integration.md that gh api -f makes a POST; use -X GET or put parameters in the URL.
    severity: minor
  - description: The sweep window held 118 deleted files and 39 branches; judging them one by one took many batched checks, since the script's noise screen misses generated mermaid SVGs.
    solution: Add generated mermaid SVG paths and blog in-place retitles to the survey script's noise or relocation screens.
    severity: minor
  - description: "First drafts of the six records carried overstated numbers: lifetimes rounded up from calendar dates, 10 refusals instead of 10 sessions, and a library said to be dropped when only a patch was removed."
    solution: midden-catalogue should say to compute each lifetime from merged_at timestamps and to copy counts with their unit from the source line before writing.
    severity: minor
  - description: The guide-rater record first described the Skill's first version, while the revision it links is a later one that works differently.
    solution: midden-catalogue step 2 should say to read the thing at the revision the remains link names, not at its birth commit.
    severity: nit
  - description: I began editing the season list after the owner's 9 and 2 answer, then reverted when they changed their mind.
    solution: Confirm a structural change such as closing a season once more before editing.
    severity: nit
  - description: I opened the PR and told the owner I had not subscribed, following the system prompt's 'ask first' line over ADR-0003, until the Stop hook flagged it.
    solution: Subscribe in the same turn as opening the PR, as ADR-0003 says; the rule already overrides the generic prompt.
    severity: nit
