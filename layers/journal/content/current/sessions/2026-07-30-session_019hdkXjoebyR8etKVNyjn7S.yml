frictions:
  - description: Briefed four concurrent reviewers to diff against FETCH_HEAD in one shared checkout; siblings' fetches clobbered it, once to another PR's head entirely.
    solution: Resolve and pin an explicit SHA per PR before dispatch, never hand a shared mutable ref to concurrent agents. The failure is silent — it yields confident, wrong findings rather than an error — and was caught only because one reviewer noticed its own grep contradicted the diff and said so. Two of four were affected; a third had pinned a SHA itself and was unharmed.
    severity: moderate
  - description: check:worktrees reported 4 worktrees with unrescued work; all four were stale round-1 trees whose branch ref a round-2 agent had moved underneath them.
    solution: The guard compares a worktree's tree against its branch HEAD, so it cannot distinguish "stale worktree, ref moved by another agent" from "real unrescued work" — and reports the alarming reading. Proving it benign took a per-worktree diff against the pre-fix commit. Two fan-outs over the same branches will hit this every time; the guard could say "tree matches an ancestor commit, likely stale" instead. Removing the dead worktrees restored a green signal.
    severity: minor
  - description: Filed "#752" asserting its fix direction was ambiguous, having verified the defect in code but not read the provenance schema or the real artifacts.
    solution: '"Ambiguous" and "needs a human decision" are themselves factual claims about the code, not a safe default — they need the same primary-source check as any other assertion. Reading the schema and the artifact corpus took one command each and showed commit-kind provenance already carries the path, collapsing the ambiguity and narrowing the scope. Verify before escalating, not only before asserting.'
    severity: minor
  - description: Issue "#754"'s spec contradicted itself — Desired behaviour said the field lists candidates that were dropped, while its own Verified section said one path isn't.
    solution: Cross-check a spec's normative section against its own evidence section before filing. The implementer resolved it correctly and the reviewer caught the contradiction, but a spec that disagrees with itself invites either reading.
    severity: minor
  - description: No committed helper answers auto-triage's own eligibility question — which open issues have human-authored most-recent activity. Hand-rolled a scratch script.
    solution: Codify it as scripts/auto-triage-eligibility.ts, reusing isAiAuthored and the list-open-issues REST helpers exactly as the scratch did. Every sweep repeats this cost otherwise, and a hand-rolled script is a fresh chance to get the authorship signal wrong.
    severity: minor
  - description: The platform appends its own attribution footer after the ADR-0017 footer on GitHub comments, so a last-two-lines footer check false-negatives.
    solution: Verify the provenance footer by searching the whole comment body, never by position. Worth a line in the issue-tracker doc so a future session doesn't misdiagnose a correctly-footered comment as missing one.
    severity: minor
