  - description: No committed helper answers auto-triage's own eligibility question — which open issues have human-authored most-recent activity. Hand-rolled a scratch script.
    solution: Codify it as scripts/auto-triage-eligibility.ts, reusing isAiAuthored and the list-open-issues REST helpers exactly as the scratch did. Every sweep repeats this cost otherwise, and a hand-rolled script is a fresh chance to get the authorship signal wrong.
