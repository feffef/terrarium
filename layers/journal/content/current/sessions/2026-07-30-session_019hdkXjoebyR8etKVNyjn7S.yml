learnings:
  - "A sweep's own idempotency rule doubles as its cheapest correctness check: 14 of 28 issues skipped because AI acted last is the mechanism working, not coverage lost."
  - "Determinable and authorized are independent: #674's design was fully determined, yet its body withheld the green-light, so ready-for-agent would have granted what the ticket forbids."
  - Safari and iOS Safari implement no scroll anchoring at all, so a test that disables it via overflow-anchor:none is reproducing the production configuration for WebKit users, not inventing a synthetic one — the opposite of how it first reads.
  - A guard that still passes with the mechanism it guards deleted carries zero regression information; replacing it with one that goes red on sabotage is a strict gain, even when the new assertion is narrower.
  - Concurrent agents on one checkout share more mutable git state than is obvious — FETCH_HEAD, shallow-ness, and cwd have each silently crossed between agents this session.
ideas:
  - "Give auto-triage a bravery-calibration readout: record each sweep's state distribution over time, so a run of near-total ready-for-human escalation is visibly either the hard governance residue or a miscalibrated determinability bar, instead of a judgment no one can audit across runs."
  - Make the sweep's residue path first-class. Three real defects this run were found by subagents, recorded only in issue comments, and would have died there without a human happening to say 'create issues'. Have each triage subagent emit residues as structured output, and have the sweep report them as a distinct 'found but unfiled' section for one green-light decision.
  - Add a dispatch preflight that resolves every shared mutable git ref a fan-out will touch — PR head/base SHAs, shallow state — and injects the pinned values into each brief, so no subagent is ever handed a ref another subagent can move underneath it.
