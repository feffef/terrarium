learnings:
  - "A sweep's own idempotency rule doubles as its cheapest correctness check: 14 of 28 issues skipped because AI acted last is the mechanism working, not coverage lost."
  - "Two subagents on one shared checkout can race on repo state: one unshallowed the clone mid-sweep, and another observed shallow-then-not and correctly re-ran its history claims."
  - "Determinable and authorized are independent: #674's design was fully determined, yet its body withheld the green-light, so ready-for-agent would have granted what the ticket forbids."
ideas:
  - "File the verified midden-survey.ts dedupe defect: surveyReport() keys deletion candidates as file:<path> but matches against provenanceKey(), which returns commit:<hash7> for a commit-kind provenance, so a commit-kind cluster can never screen out its sibling paths; separately screenRegrown() compares paths by exact string, which is why a relocated file resurfaced. Both confirmed in code during #730's triage and tracked by no issue."
  - "Give auto-triage a bravery-calibration readout: record each sweep's state distribution over time, so a run of near-total ready-for-human escalation is visibly either the hard governance residue or a miscalibrated determinability bar, instead of a judgment no one can audit across runs."
