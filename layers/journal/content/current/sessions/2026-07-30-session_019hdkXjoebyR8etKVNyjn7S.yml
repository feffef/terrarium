frictions:
  - description: This session's own log reddened `main` for ~2h, and I misdiagnosed the cause as document size, then "fixed" it by trimming — which did not work.
    solution: "Real cause (#768, proven by an elementFromPoint probe): `locator.click()` aims at the bounding-box CENTRE, and this log's 8 PR chips wrapped the card head tall enough that the centre landed on a chip link whose `@click.stop` suppressed the toggle and navigated away. Size was a proxy for head-layout coincidence — which is why no threshold bisected. `main` recovered only when a newer log displaced mine as the first card; the real fix was #769. Lesson: a controlled table varying one input can still support a wrong causal story. Probe the mechanism before asserting it."
    severity: major
  - description: Briefed four concurrent reviewers to diff against FETCH_HEAD in one shared checkout; siblings' fetches moved it, once to another PR's head entirely.
    solution: Pin an explicit SHA per PR before dispatch; never hand a shared mutable ref to concurrent agents. Fails silently — yields confident wrong findings, not errors.
    severity: moderate
  - description: Filed "#752" calling its fix direction ambiguous without first reading the provenance schema or the real artifacts; both collapsed the ambiguity.
    solution: '"Ambiguous" and "needs a human" are factual claims about the code and need the same primary-source check as any other. Verify before escalating, not only before asserting.'
    severity: minor
  - description: check:worktrees reported four worktrees with unrescued work; all four were stale trees whose branch ref a later agent had moved underneath them.
    solution: It compares tree against branch HEAD, so it cannot tell "stale, ref moved" from "real unrescued work" and reports the alarming reading. Could say "matches an ancestor commit, likely stale".
    severity: minor
  - description: No committed helper answers auto-triage's own eligibility question (which open issues have human-authored most-recent activity); hand-rolled a scratch script.
    solution: Codify as scripts/auto-triage-eligibility.ts, reusing isAiAuthored and the list-open-issues REST helpers.
    severity: minor
