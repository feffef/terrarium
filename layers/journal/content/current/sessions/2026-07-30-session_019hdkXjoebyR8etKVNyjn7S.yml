learnings:
  - "A sweep's idempotency rule doubles as its cheapest correctness check: 14 of 28 issues skipped because AI acted last is the mechanism working, not coverage lost."
  - "Determinable and authorized are independent — #674's design was settled, yet its body withheld the green-light."
  - "The schema field whose NAME matches an intent may not carry it: midden's `removedIn` reads as 'the commit that retired this', but only 1 of 14 artifacts sets it, and there it names a different commit than `provenance.hash`."
  - Safari and iOS Safari implement no scroll anchoring at all, so a test disabling it reproduces the WebKit production configuration rather than inventing a synthetic one.
  - "Subagents given explicit authority to refuse produce better outcomes: four declined a listed change and proved why, and each refusal was correct."
ideas:
  - "Treat 'a click target whose centre can be covered by an interactive child' as a checkable class, not a one-off: #769's sweep guards session cards, but the same shape recurs anywhere a container both toggles and hosts links (digest rows already qualify). A lint or shared e2e helper asserting every toggle's centre hit-tests to the toggle would generalise it."
  - "Decide whether a card head crowded with PR chips is acceptable UX: a real user clicking the middle of a tall head is navigated to GitHub rather than expanding the card, and the chips' share of the head grows with PR count. #769 fixed the test's aim, not the interaction."
  - "Give auto-triage a bravery-calibration readout: record each sweep's state distribution over time, so near-total escalation is visibly either the hard residue or a miscalibrated bar."
  - "Make the sweep's residue path first-class: have triage subagents emit residues as structured output and report them as a distinct 'found but unfiled' section for one green-light decision."
