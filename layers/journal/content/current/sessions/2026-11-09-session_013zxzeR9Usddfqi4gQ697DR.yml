outcome: "Digest fixed and merged in PR #2993, Friction logged"
summary: "The owner asked where the \"weekly schedule\" in the 2026-11-08 Digest came from. I traced it: no file sets a cadence (the timer lives in a Routine outside the repo), and the likeliest source was session goals such as \"Weekly Glass Box curate run\". The owner then said the job is daily and recently set up, so \"weekly\" was made up, and asked me to log a Friction and correct it. Human-instructed: the investigation, the Friction and the correction. Agent-initiated: opening the PR (ADR-0003) and subscribing to it. I changed one word (\"weekly\" to \"scheduled\", since Digests never state a cadence), ran the scoped gate green, pushed, opened PR #2993, and merged it once CI was green with a verdict comment. Left alone and flagged in the PR: the 2026-11-02 to 11-05 Digests also call jobs \"weekly\" in their Also-shipped lists, cadences unverified. The session goals saying \"Weekly\" are other sessions' logs, which I must not edit."
