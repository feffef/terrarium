  - description: Briefed the step 12 reader with a path to a Kevin-post copy I never created, so it judged the replies without the post; I only saw this in its report and re-judged with a second reader.
    solution: Have the blog-post Skill's step 12 brief point at the merged post's repo path, not a scratch copy.
    severity: nit
  - description: Drafted Karen's reply around 'the cap's test was skipped' from the PR body's nits list without opening the spec; the spec already tested the cap, so the draft invented a flaw until I checked.
    solution: Make step 12 say to check a reply's load-bearing claim against the file it names before drafting, not after the reader picks it.
