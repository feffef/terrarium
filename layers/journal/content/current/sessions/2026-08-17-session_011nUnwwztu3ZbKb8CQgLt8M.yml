  - description: Agent B's duplication finding claimed commit 2998802's message "explicitly named" three guard docs (loop-only-tool-guard.md, deferred-tool-guard.md, subagent-background-guard.md) as deferred follow-ups; the fact-checker found the message only says "three", never naming them — the filenames appear only as unchanged context lines in a diff, not in the prose.
    solution: Fact-checked before use; the merged PR's description cites the precedent pattern without the inaccurate "explicitly named" claim.
    severity: nit
  - description: The reviewer agent's own finding pre-judged escalation scope (assumed fixing the guard-doc duplication would require editing the human-only .ts scripts) before a fix was actually designed. The narrower, purely doc-side fix it also proposed as an alternative turned out to be sufficient and stayed self-mergeable, avoiding an unnecessary second human-reviewed PR — a session briefly went down the escalation-branch path before catching this.
    solution: When a finding's proposed fix would touch a human-only surface, design the actual fix first and re-check its real diff footprint before committing to the escalation path, rather than trusting the finding's own escalation flag at face value.
    severity: nit
