learnings:
  - Overflow on a Journal Skill page can sit inside a list item whose own scrollWidth exceeds clientWidth while no descendant rect passes the viewport; scan scrollWidth > clientWidth per element.
  - The Journal's digests and sessions are anchors on /t/journal/current; /t/journal/current/digests and /sessions are 404 and nothing links to them.
ideas:
  - "[blind, content editor] /t/journal/current: the page never says what Terrarium is in one plain sentence and uses Friction, Routine, Skill, Tenant, Digest unexplained. Add a two-line 'What is this?' above the stat tiles plus a short glossary strip of those terms from GLOSSARY.md, so a stranger can read the numbers. (Check against the owner ruling that the on-ramp explains the Platform itself, not the demo sites.)"
  - "[content editor, blind] /t/journal/current/skills/<name>: audit observations are dense agent shorthand with session UUIDs and code identifiers. Put a one-line plain-language verdict first, fold the full notes behind a disclosure, and link or drop the ids, so a newcomer learns whether the Skill is healthy."
  - "[content editor, UI tester] /t/journal/current/frictions: the intro is one ~170-word paragraph of state names (fix landed, likely fixed, still recurring, accepted). Cut it to two sentences and show the four states as a legend beside the filters, so the data is reachable first."
  - "[UI tester] /t/journal/current: Recent activity has ~100 h3 headings in a row and a zero tally ('0 delegated'). Cap the list at 10-15 entries with a show-all link, or group by day linking each digest, and hide or grey zero tallies, so screen-reader heading navigation is usable."
  - "[UI tester, content editor] /t/journal/current/ideas: a flat list of 145 ideas and 65 learnings. Add filter chips by originating Skill, and on each Skill page list that Skill's ideas linking back, tying the 'N ideas in M sessions' count to the ideas themselves."
  - "[content editor] /t/journal/current/digests/<date>: the digest says 'trivial' where the homepage says 'nit', and the page is headed only by the date. Use one lowest-severity word across the Journal and head the page 'Digest, Tuesday 25 November 2026'."
  - "[blind, UI tester] /t/journal/current: counts disagree without stating a window (100 sessions vs '99 logged' on a Skill page, '1 logged' on dependabot-sweep against two runs in its note). Print the window beside each count, so numbers don't look contradictory."
  - "[blind] /t/journal/current/history: a static table of sessions and frictions that stops at 11 Nov. Add a small chart of sessions per week against frictions per session, so the 'activity fell but was not decline' point reads at a glance."
  - "[blind] /t/journal/archived: one page with 1,356 links and no grouping. Group digests by month with collapsible headings so the archive can be browsed."
