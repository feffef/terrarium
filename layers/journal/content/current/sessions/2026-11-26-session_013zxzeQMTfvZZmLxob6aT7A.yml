frictions:
  - description: Context file listed /t/journal/current/digests as a page; it and /sessions return 404, costing the editor two visits and a finding.
    solution: ".agents/skills/visitor-loop/SKILL.md step 2: say a Space or folder root that has no index (digests, sessions) is not a page; list only URLs that return 200."
    severity: minor
  - description: UI tester's overflow (424px on dependabot-sweep) was reported unconfirmed because the brief's measurement hint finds no wide element; the li scrolls inside its own box.
    solution: "visitor-brief.md: add 'also scan elements whose scrollWidth exceeds clientWidth, not only getBoundingClientRect().right'."
    severity: minor
  - description: Isolating the overflow source took four ad hoc scripts; the culprit token still unknown.
    solution: Add a starter overflow-finder script under .agents/skills/visitor-loop/scripts/ or docs/agents/verifying-ui-changes.md.
    severity: minor
  - description: Read git-conventions and github-integration/triage-labels only after the first git fetch and issue writes, which CLAUDE.md says to read first; head -30 of triage-labels was too little to count.
    solution: visitor-loop SKILL.md step 1 could name git-conventions.md and github-integration.md as first reads.
    severity: nit
  - description: SubagentStart rule-use hook made the blind visitor rate four ADR rules for a read-only browse, wasting turns.
    solution: Skip the rule-use note for read-only visitor briefs in the SubagentStart hook under scripts/hooks/.
    severity: nit
