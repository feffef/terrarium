frictions:
  - description: CLAUDE.md's "before you plan a change" rule asks to grep docs/adr/ for every file/term a change touches and read every matching ADR in full. I edited layers/journal/content/current/skills/*.yml all run without reading ADR-0015, which directly governs that path, until step 6 — well after the edits were already made.
    solution: Read ADR-0015 before the step-5 Inventory edits, not after. No actual deviation resulted this time (ADR-0015's amendments are already faithfully encoded in audit-skills/SKILL.md, which I did follow), but the rule was still skipped on the letter.
    severity: minor
  - description: CLAUDE.md requires reading docs/agents/github-integration.md before the first mcp__github__* call. I made several (issue_read, search_issues, pull_request_read) during verification before reading it, only reading it ahead of the first write (issue_write).
    solution: Read it at session start alongside CONTEXT.md/CONTEXT-MAP.md, since this Skill's whole job involves GitHub reads from step 2 onward. No overflow/encoding problem actually occurred this run.
    severity: minor
  - description: Four parallel Edit calls (close-session.yml, dispatch-subagents.yml, log-session.yml, prune-trial.yml) failed with "String to replace not found in file" despite the old_string matching the file's content byte-for-byte (verified via Python repr/line-offset Read immediately after the failure). Retrying the identical Edit call individually right after succeeded with no change made in between.
    solution: Unexplained — docs/agents/environment-caveats.md has no matching entry (checked). Possibly a batching/snapshot quirk when many Edit calls targeting different files are sent in one parallel block; worth a future session's attention if it recurs, logged here as a data point rather than re-diagnosed.
    severity: minor
  - description: The first `pnpm gate:scoped` run (before push) failed on tests/unit/check-worktrees.spec.ts's contentMatchesRemoteCommit test, unrelated to this run's content-only YAML diff; the same test passed standalone and the full gate passed clean on an immediate re-run.
    solution: Confirmed flake per CLAUDE.md's "re-run once to confirm" convention before pushing; cost one extra ~2.5 minute gate run, no other impact.
    severity: minor
  - description: 'SHELL-READ-DETECTION: docsReadViaShell credited .agents/skills/wait-what/SKILL.md and .agents/skills/ask-matt/SKILL.md from one subagent command: `ls layers/journal/content/current/skills/ | grep -i wait; echo "---"; grep -rn "wait-what" layers/journal/...` (the "Behaviour-check audit-skills" subagent, checking the wait-what coverage-gap call). That command only reads layers/journal/content/current/skills/ and never cats or greps either SKILL.md under .agents/skills/, so its output cannot contain a line from either file.'
    solution: False positive, direction credited-but-not-read, on both paths. Same shape as the already-tracked SHELL-READ-DETECTION false-positive family (#1482/#1542) — a short/generic string ("wait") matched somewhere unrelated to the actual file content.
    severity: moderate
