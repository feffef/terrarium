outcome: Three visitors reported; 8 bugs filed as issues 3246-3248, ideas and learnings logged, retro posted on 3244
summary: "Human-instructed: the owner ran the visitor-loop Skill, whose procedure I followed as written. Focus came from the rotation (row 3, midden). I built and served the production preview on a fresh origin/main, wrote a context file, dispatched blind, content-editor and UI-tester visitors on sonnet, then verified each reported bug against the rendered page (one script at 390px) and the source. Eight bugs survived; two blind-visitor findings did not reproduce (a \"mangled\" card link, a \"duplicated\" season strip), one was ruled out by decisions.md (footer lacks Marquee and Commons) and one was by design (generic 404 for a non-route). The retro report is on #3244. First pass, my error: I logged the 8 bugs as Frictions and filed no issues. Cause: I read four lines as settled and never questioned them, the SKILL.md Remit (\"no branch, PR or issue. Everything it finds goes into that log\"), step 4 (\"each bug is a Friction\"), step 5 (\"never as an issue\") and #3244's rule that site problems stay in the log. I also used Frictions for site faults, though they are for where the run was bumpy. The owner corrected me (human-instructed): bugs go into issues, grouped when closely related, Frictions only for the run's own trouble. I filed #3246 (Midden cause chips), #3247 (Platform lang and tap targets) and #3248 (Midden content and heading order), removed the bug Frictions, and rewrote the #3244 comment with this cause (candidate C0). The SKILL.md text is still unchanged; the run may not edit it. The visitors' stray screenshots in the repo root tripped the Stop hook; I moved them into the git-ignored scratch folder."
