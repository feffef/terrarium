learnings:
  - The Glass Box header's empty outlined square is intentional (layers/glassbox/app/assets/theme.css:188 ::before); two visitors read it as a missing icon.
  - "Judge a Glass Box page's existence by its title and body, not its HTTP status: /walkthroughs returns 200 with a Not found title because the title code ignores the list branch."
ideas:
  - "[blind, UI tester] /t/glassbox/guide header: the outlined square beside Glass Box looks like a missing icon. Add a glyph or a one-line title explaining it, so first-time visitors do not think an image failed to load."
  - "[blind] /t/glassbox/guide/hooks/blocking-hooks: opens with PreToolUse, fails closed and exit 2 before saying what a hook is. Add a one-sentence plain gloss first, so a reader new to Claude Code is not lost in line one."
  - "[blind] /t/glassbox/guide at 390px: the header takes about 80px and the subtitle wraps to two lines. Hide the subtitle at narrow widths so the lesson starts higher on the screen."
  - "[blind] /t/glassbox/guide sidebar: subject counts such as Claude Code 5 do not say they count lessons. Add the word lessons or a title so the number is understood."
  - "[content editor] /t/glassbox/guide sidebar: the subject is Installed Skills in layers/glassbox/app/utils/subjects.ts but Installed skills in lesson link text. Pick one casing so the name reads as one thing."
  - "[content editor] /t/glassbox/guide/terrarium-practice/skill-inventory: In Terrarium lists field names (gist, observations, auditSummary) before the three-step data flow. Lead with the flow and put the fields in a short list after it, so skimmers get the idea first."
  - "[content editor] /t/glassbox/guide/terrarium-practice/skill-inventory: describes entries in prose only. Show one real rendered entry as a worked example so readers can picture the schema."
  - "[content editor] /t/glassbox/guide: uses lowercase tenant first in Who decides without explaining it. Add one parenthetical, one of the sites in this repository, at first use."
  - "[blind] /t/glassbox/guide/hooks/blocking-hooks: a small diagram of a tool call being denied and the reason returned to the agent, so the abstract idea lands in seconds."
  - "[UI tester] /t/glassbox/guide lessons: inline links are 16-24px tall at 390px. Add vertical padding to inline links on touch widths so they are easier to tap."
