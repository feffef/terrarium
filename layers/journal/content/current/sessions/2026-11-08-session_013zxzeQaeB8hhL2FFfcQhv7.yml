frictions:
  - description: Fanned out six writer subagents on an untried brief; its grep filter was wrong and its loose licence gave 29 uneven extra lead-in rewrites
    solution: Pilot a fan-out brief on one agent or a cold reviewer first; dispatch-subagents could say so for any brief sent to more than two agents
    severity: moderate
  - description: Trial of the split index used filler text, which fit one Read; real code-dense teaches hit Read's 25,000-token cap, found only in review
    solution: Size files meant for Read in tokens with real content, about 2.5 bytes per token for code names; orient now splits parts under 40 KB
    severity: moderate
  - description: Ran git stash and stash pop to measure old output before reading docs/agents/git-conventions.md, against CLAUDE.md's read-first trigger
    solution: Use git show or a temporary worktree for before/after measurements; the read-first hint fired only after the command
    severity: minor
  - description: Tried amend plus force-with-lease to fix a stale commit message; the auto-mode classifier denied it, so the message stays wrong
    solution: Write the commit message after the subagent reports, not as a checkpoint label; or accept a follow-up commit
    severity: minor
  - description: Issue 2945 said the Commons Timeline shows descriptions; the code shows Glass Box pages there by title, so one consumer was wrong
    solution: When an issue lists consumers, verify each in code before planning; noted in the PR
    severity: nit
  - description: An Agent call with run_in_background false still ran in the background, so I had to wait for a notification before aggregating the review
    solution: Expect either and wait on the notification; no repo change
    severity: nit
  - description: My diff filter grep '^[-+][^-+]' dropped changed bullet lines, which start '- **', so I briefly misjudged two findings as old text
    solution: Filter diffs with '^[-+]' and exclude only the '---'/'+++' headers; caught by re-grepping before acting
    severity: minor
