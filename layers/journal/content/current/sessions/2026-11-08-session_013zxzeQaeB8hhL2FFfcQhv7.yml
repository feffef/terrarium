learnings:
  - Read stops at 25,000 tokens; code-dense Markdown runs about 2.5 bytes a token, so a 66 KB file is cut while 64 KB of prose fit
  - glassbox-curate pagesRead stems break on every file rename; git log --name-status -M --diff-filter=R recovers all but draft stems
  - Piloting a checker brief on one group of 8 pages surfaced four brief fixes (changed-lines list, git grep first, docs only for new tool facts, lead-in vs sentence) before eight more ran
ideas:
  - "Give dispatch-subagents a pilot step: for any brief sent to three or more agents, run it once on one item and have a cold reviewer read it, then fan out; this session's writer brief would have lost its broken grep and loose licence"
