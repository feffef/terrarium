goal: Rework the Glass Box guide index that curate runs read, with a teaches field for agents
status: completed
outcome: "PRs 2982 and 2983 merged: guide index, teaches, plain descriptions, and two claims to correct recorded"
summary: "Human-instructed throughout. The owner asked me to read issue 2945 (rewrite Glass Box descriptions), then steered through samples to the decision that agents are the main reader. On the owner's go I added each page's Why/Watch lead-ins, Walkthrough stops, pointer marks and stop Lessons to orient.ts; a fresh subagent judged the overview and named the gap (tool and file names). The owner chose a separate `teaches` field for agents (400 characters), descriptions for visitors, a rewrite of 21 vague lead-ins, read/checked dates and a format key, and said \"build it all\" in one PR. Agent-initiated within that: following renames for read dates, splitting orient into inline state plus an index file, and a trial run. Six writer subagents filled all 72 pages; I fanned out without piloting the brief, which the owner called out (a wrong grep filter, a loose licence giving 29 extra lead-in rewrites). Review found the index exceeded Read's 25,000-token cap, so it now writes parts under 40 KB, each confirmed to Read whole. The owner then kept the extra lead-ins, asked for plain-language descriptions (I agreed tone on six samples, then rewrote 54 myself for one voice and added the rule to EVERY-PAGE.md), and asked for a full fact check like glassbox-update. This time I piloted the checker brief on one group, improved it from the pilot's notes, then ran eight more: about 910 claims, 19 findings (1 false, 1 unsupported, 17 misleading), each confirmed against source; the 17 in new text are fixed, 2 in older sentences are left for glassbox-update and named in the PR. The owner merged PR 2982 and issue 2945 closed; the safety-net check-in was cancelled. Afterwards the owner asked to record the two older-sentence findings on the Glass Box memory page; I restarted the branch from main and opened PR 2983 for that. PR 2983 merged after a green gate and a posted verdict."
