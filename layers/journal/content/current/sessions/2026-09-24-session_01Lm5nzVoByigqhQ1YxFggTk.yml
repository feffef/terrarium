frictions:
  - description: "workflow-edit guard (issue #897) blocked a heredoc writing a brief to the scratchpad because the brief TEXT mentioned the CI workflows directory"
    solution: Match the write target path, not any occurrence of the directory string inside heredoc content; worked around with the Write tool
    severity: minor
  - description: Finding the ADR-0017 PR-body provenance header format took three greps through guard and helper source before the first PR
    solution: Put the literal header shape in docs/agents/pr-workflow.md so it is known before the first attempt
    severity: nit
  - description: Four impl PRs were opened without any independent review; the human had to ask whether /code-review ran, and it then found real bugs including an ADR-0016 violation
    solution: Run code-review on every dispatched impl PR before announcing it ready; the visitor-loop Skill should do the same before self-merge
    severity: major
  - description: "Owner merged #1312 while its review fixes were in flight; the impl agent then recreated the deleted branch by pushing to it, before the redirect message arrived"
    solution: Before resuming an agent on a PR branch, check the PR is still open; tell agents to verify the remote branch exists before pushing
    severity: moderate
  - description: Impl brief let an agent add a Platform catch-all route without reading ADR-0016, which it contradicted; only the standards review caught it
    solution: Dispatch briefs touching routes should require reading all ADRs (CLAUDE.md already says so for planning) — name the relevant ADRs explicitly
    severity: moderate
  - description: Re-dated Atlas observations shifted by exactly one year leave a sparse winter; the human asked for an even spread
    solution: State the distribution target explicitly in the brief; left for a human decision
    severity: minor
  - description: create_trigger stored no connectors and an empty sources list for the new Visitor Loop Routine, unlike the existing Routines
    solution: Human should attach the Claude_Code_Remote connector and the repo in the routines UI; create Routines from a session holding the connector
    severity: moderate
