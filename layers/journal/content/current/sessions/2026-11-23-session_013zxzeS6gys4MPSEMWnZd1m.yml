frictions:
  - description: Stacked run_in_background with a text-level ampersand on the gate command; the double-background guard denied it and I resent it.
    solution: The Skill and pr-workflow could say to run the gate with run_in_background alone and no trailing ampersand.
    severity: nit
  - description: The memory page's digest gap said a Skill-detail gap suits no guide page, yet it stayed listed for runs; each run re-judged it.
    solution: Step 2 should say to delete such an item at once, in the run that first judges it.
    severity: nit
  - description: A run entry's changes line held a colon followed by a space, so validate:content failed; it happened twice, once after I had already committed.
    solution: The Skill's State section says to quote such a line, but orient.ts's skeleton could warn, or validate:content could name the colon.
    severity: minor
  - description: Step 3 makes the run read a whole Subject (four files, about 116 KB for terrarium-practice) to trim one page, which cost a large share of the session's context.
    solution: For a pure cut, the Skill could allow reading only the focus page and the pages it links.
    severity: minor
  - description: Merging main into a run branch pulled the other run's files into the diff, so merge-pr.ts refused an Own-read verdict and I had to run a second code-review.
    solution: The Skill could say to merge main into a branch only after the review, or to expect a second review when a merge brings in files.
    severity: minor
