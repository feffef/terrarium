summary: The owner asked to install the retro Skill from mattpocock/skills (human-instructed). Per their preference I asked three scoping questions first (repo vs personal, verbatim vs adapted, behaviour if not found); they chose this repo, verbatim, stop-and-ask. I cloned the pack, confirmed skills/engineering/retro exists, and ran the skills CLI, which wrote it to .claude/skills/retro and added the lock entry. I moved it to .agents/skills/retro with a .claude/skills link to match the repo layout, confirmed it is identical to upstream, and verify:skills-lock and gate:scoped passed. I skipped code-review on purpose because the diff is an unmodified upstream copy. Pushed and opened the PR; no Inventory entry was added (audit-skills adds it on first use, ADR-0015). Merged on the owner's explicit instruction; I had declined to self-merge because a new Skill changes behaviour no gate step observes.
