  - description: Started gate:scoped before code-review, then edited the tree through a Bash python script while it ran; the gate-edit guard blocks Edit only, so the run aborted.
    solution: Run code-review first as pr-workflow says; have the guard cover Bash writes, or mention it in the Edit block message.
    severity: moderate
  - description: Changed Where next and Lessons already read row text and ran only unit tests; an e2e assertion on the old text failed in the gate, costing a second full gate run.
    solution: Grep tests/e2e for the changed text and run the touched e2e before the gate, per One home per fact.
    severity: moderate
  - description: Browser check scripts passed arrow functions as strings to evaluate, which returned undefined and cost three retries.
    solution: docs/agents/verifying-ui-changes.md could say a string arrow is not called; pass a real function or a plain expression.
    severity: minor
