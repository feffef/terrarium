summary: "The owner reported that clicking a Subject in the Glass Box sidebar sometimes only expanded it without opening the page. Cause: only the name text was a link. I asked which behaviour they wanted and they chose whole-row navigation (human-instructed). They then added, mid-turn, a series of direct asks that I implemented: book and tick icons and whole-teaser links on Subject pages, descriptions in Lessons already read, Subject names as Where next labels, whole-row links for both lists, one accent-colour title hover everywhere, and later the Surround card hover and a shared book class (the last two after I proposed them and they said yes). Agent-initiated: the glossary updates, a hoisted helper call and CSS tidy-ups from my own code review, and the e2e assertion fix. Checked in a real browser; code review by two subagents and one follow-up reviewer; first gate run aborted because I edited the tree via Bash, second failed on an e2e test I had not run, third passed. A screenshot the user sent without text was the old deployed page. Open: the glossary wording for the cards is slightly awkward (left on purpose to keep the gated head); PR activity not yet subscribed at log time."
