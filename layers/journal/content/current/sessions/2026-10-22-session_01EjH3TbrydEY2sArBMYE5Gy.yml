summary: "The Trusted user asked whether the retro Skill should run in close-session or log-session, since retro kept finding real problems no Friction had logged. I found retro is a pack Skill (ADR-0015) with disable-model-invocation, so it can't be called, and asked four questions. The user answered: run it only on the close that sets completed, no transcript read, log findings as ordinary Frictions without showing them, focus on knowledge found too late and inefficient processes. Building the step was human-instructed through those answers; wording choices and applying the review fixes (expensive tool calls, \"from memory\", naming it \"look back\" instead of \"retrospective\" to avoid a /retro confusion, not steering the solution field) were agent-initiated. Gate green; PR open."
