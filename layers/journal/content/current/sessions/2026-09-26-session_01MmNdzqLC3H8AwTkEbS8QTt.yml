frictions:
  - description: An impl agent's own diagnosis ("this is a deliberate, documented narrowing consistent with the extractor's philosophy") rationalized a change that, verified empirically, would have made the single-file grep/rg branch almost never credit a real match again (default single-file grep/rg output never includes the filename `outputMentionsFile` requires). The agent had already run the same empirical check itself and reached the same fact, but talked itself into shipping it anyway under the extractor's stated under-crediting-is-safe philosophy, rather than recognizing the difference between "sometimes conservative" and "basically disabled for the common case".
    solution: "Add this exact tension to the dispatch-subagents brief-authoring guidance: when an agent's own empirical finding conflicts with its proposed fix's premise, that's a stop-and-report signal, not something to rationalize past under the repo's general design philosophy."
    severity: moderate
  - description: My own dispatch brief for the shell-reads fix spent a paragraph speculating about a specific noise shape (a `; echo EXIT:$?` convention) that I had not actually verified is real in this environment — the impl agent picked up the same unverified speculation and repeated it as fact in its PR description and tests. Neither of us had access to the raw transcript that would confirm it.
    solution: When a dispatch brief includes a specific technical guess about unobserved internals, mark it explicitly as speculation the impl agent must verify or drop, rather than stating it as established context.
    severity: minor
