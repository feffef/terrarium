summary: "Scheduled, unprompted run of the frictions-to-fixes Skill (no human present). Surveyed the last 20 session logs via a background subagent, screened against the tracker and against main, and selected 2 never-fixed candidates: a shell-reads.ts grep/rg/diff crediting gap (moderate, recurring) and a missing digest dry-run doc caveat (moderate, single occurrence). Both were \"simple\" selections (no issue filed per the Skill's own rule), dispatched to two Sonnet impl agents in isolated worktrees. Reviewed both PRs myself as the ADR-0003 reviewer-agent. The digest doc fix (PR #1353) was clean and merged as-is. The shell-reads fix (PR #1354) bundled two changes; review caught that one of them (unifying single-file grep/rg confirmation onto a filename-match check) would have silently stopped crediting the overwhelming majority of genuine single-file grep/rg reads, since default single-file grep/rg output never contains the filename — verified empirically against real grep/rg, not just against the impl agent's own claim. Amended the PR myself to keep only the uncontroversial half (recognizing `diff` as a reader verb), reverted the other half back to status quo, updated the PR description to match the narrower shipped scope, and filed issue #1355 with the full analysis for a properly considered fix later. Both PRs merged this session; no escalation needed."
