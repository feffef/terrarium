summary: "Human-instructed throughout. The owner asked for a Sonnet agent to harvest the ideas and learnings fields of the last 14 days of session logs (frictions excluded on their instruction), check them against issues and git, and drop implemented ones; then for Sonnet, Opus and Fable agents to rate every item; then for a merged top 20. I verified the two biggest rater disagreements myself: the \"stale gate build\" item (#96) is moot because tests/support/fresh-output.ts checks every tracked and untracked file, and #99 is already fixed. The owner picked items 30, 70, 71 and 6. 71 and 6 were already open as #2073 and #2093; 70's premise was stale (the guards it names no longer exist), so I did not file it and said why; 30 became #2101, which the owner then had me close. The owner then asked me to fix the diagram in the Glass Box Walkthrough \"From file to browser\" so it shows the build creating the database and the browser querying from the other side; they chose to show both readers and adjust the text. My first left-to-right version was unreadable at 390px and drew one shared database; code-review caught both, and the second commit draws the build's dumps with the server's and the browser's own SQLite copies, top-down at 351px. Opened PR 2102. Last, the owner asked for a deep-research on whether Nuxt, Vue and Nitro deserve their own Glass Box pages; three researchers are running."
