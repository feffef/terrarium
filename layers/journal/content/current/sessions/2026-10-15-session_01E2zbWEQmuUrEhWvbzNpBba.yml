frictions:
  - description: Skipped reading GLOSSARY-MAP.md and GLOSSARY.md at session start, as CLAUDE.md requires; the task started as a delegation so it felt optional.
    solution: Read them before the first dispatch; a SessionStart reminder naming them would have caught it.
    severity: minor
  - description: Ran git branch/fetch before reading docs/agents/git-conventions.md; the PostToolUse hint caught it, and the calls were already compliant.
    solution: Read git-conventions.md before any git call beyond status.
    severity: nit
  - description: "Recommended a top-20 in chat without grepping docs/adr for the binding ADRs (CLAUDE.md: an opinion asked in chat counts); relied on the raters' ADR checks."
    solution: Grep docs/adr for each top item's paths before presenting a recommendation.
    severity: minor
  - description: First diagram version was committed unreadable at 390px and factually wrong about one shared database; I checked only a 1000px screenshot and skipped docs/agents/verifying-ui-changes.md before screenshotting.
    solution: Read verifying-ui-changes.md and EVERY-PAGE.md's diagram bar before drawing, and screenshot at 390px.
    severity: moderate
  - description: Two of the three deep-research briefs omitted the rule/doc verdict request CLAUDE.md requires of every subagent brief.
    solution: Append the verdict line to every brief, including Skill-templated ones.
    severity: nit
  - description: "The harvest's rater panel twice rated already-done or moot items highly (#96 stale gate, #70 guards that no longer exist); only my own code check caught it."
    solution: Brief raters to verify each premise in code before scoring.
    severity: minor
