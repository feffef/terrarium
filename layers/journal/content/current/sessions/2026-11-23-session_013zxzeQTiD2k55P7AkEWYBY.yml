frictions:
  - description: Ran git log and status before reading docs/agents/git-conventions.md; the post-tool hint demanded the read afterwards.
    solution: None needed beyond reading the doc first when the Skill starts with git.
    severity: nit
  - description: Sent a background Bash call with a trailing & too; the double-background guard refused it and nothing ran.
    solution: Pass run_in_background alone with a plain command.
    severity: nit
  - description: The survey agent mis-indexed one --append (log index versus compact index), creating a duplicate occurrence that needed deleting and recreating an entry by hand.
    solution: Have print-ledger-occurrence --append echo the Friction text it copied so a wrong index shows at once.
    severity: minor
  - description: A prune-friction-ledger --move of a cluster's only occurrence silently deleted the entry with its fixes and notes; the survey agent had to restore it from git.
    solution: Have --move refuse or warn when the source entry would end empty.
    severity: minor
  - description: My design brief gave the clear-backlog source as a nonexistent Skill path; the design agent had to correct it.
    solution: Check each path in a filled brief exists before dispatch.
    severity: nit
  - description: The design agent skipped the subagents and docReadCounts docstring checks, so its doc-read findings are only partly verified.
    solution: Let design-brief §2 and §3 say which steps may be skipped when no doc edit is proposed.
    severity: nit
