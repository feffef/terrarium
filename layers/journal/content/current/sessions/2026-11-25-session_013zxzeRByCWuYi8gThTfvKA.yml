learnings:
  - On /t/blog the tag directory is rendered twice (narrow details and wide div, index.vue:120-134); the hidden twin measures zero height, so two navs labelled Browse by tag are not an accessibility fault.
  - Blog post URLs are /t/blog/<persona>/<date-slug>; /t/blog/<persona>/pingbacks has no route and returns the 404, by ADR-0006.
ideas:
  - "[content editor] /t/blog/eyra/2026-07-22-i-brought-you-a-house-with-balconies: the opening post is lantern and courtyard metaphor and never says what Eyra will publish. Replace the closing paragraphs with one plain sentence about her beat (the look of the Platform, with a screenshot where it helps), so a newcomer who starts at her first post knows what the column is."
  - "[content editor, blind] /t/blog/karen/2026-11-25-an-issue-asked-for-a-summary-and-closed-as-completed-without-one and /t/blog/eyra/2026-11-25-a-slim-line-now-sits-above-every-post-this-one-too: both argue over the owner's comment but link neither issue #3600 nor the comment. Link them so a reader can check the claim; Karen's 'The repo has a rule' should name its doc."
  - "[content editor] /t/blog/eyra (masthead): Popular posts run title and blurb together with a comma, so a title and the next blurb read as clauses. Show 'Title — blurb' with the title as a link; the same fault was already seen on David."
  - "[blind] /t/blog: the 'Twelve stories worth reading first' link is one small line under 18 tags, so a first-time visitor reaches posts about internals. Move it into the intro as 'New here? Start with twelve stories' and consider collapsing the tags by default on wide screens."
  - "[blind, content editor] /t/blog/kevin/2026-11-24-31-of-35-logs-said-complete-the-fix-is-a-marker-file: the opening packs seven numbers and Hook jargon before saying what went wrong, and the drop cap sits on the one-letter word A. Open with one plain sentence, and skip the drop cap when the first word is a single letter."
  - "[UI tester, content editor] /t/blog?view=threads: the intro says newest first but threads run Nov 21, Nov 17, Nov 20, so it looks mis-sorted. Say threads are ordered by their newest post, or add a divider per thread."
  - "[UI tester] /t/blog/<persona>: lists run 176 to 306 links with month headings only. Add a jump-to-month row at the top so one tap reaches older posts on a phone."
  - "[UI tester] /t/blog/nobody: an unknown persona gets the generic site 404 while an unknown post gets the persona-styled one. Show the four persona cards on the persona 404 so a mistyped URL lands on real choices."
  - "[blind] /t/blog posts: add a two to three line In plain words box at the top of each post (what broke, what changed) so non-engineers get the point before the numbers; and a 'pick a voice' strip on /t/blog with each persona's sample line and most popular post."
  - "[editor, blind] /t/blog/stories: twelve hand-picked stories from July and August with nothing recent. Add a Since then strip of three fresh posts, and number the four-part sequence 1 to 4."
