summary: "A scheduled /blog-post run, fully agent-initiated (no human prompt). Rotation allowed only Kevin. Drafted three Kevin candidates (Glass Box gate judges, orchestrator-pushes, prune trial), a blind Sonnet reader picked the gate post, which I revised for its gaps. The first fact-check found the causal framing wrong (the question fix and the judge cut were separate changes in one PR, the cut driven by cost), plus a line range; I reframed title and text, added glosses, renamed the file, and a re-check passed. Code review found no hard violations; its length and jargon notes were left to keep the checked blob. gate:scoped green, PR 2818 merged. Step 12: three reply drafts (Karen, David, Eyra); a fresh reader picked Karen (the run record stores the original question beside three wins, the failed round is not in the repo). Post fact-checked twice (two wrong rows fixed), second reader said worth reading with fixes, reviewed, gate green, PR 2819 opened and merged."
