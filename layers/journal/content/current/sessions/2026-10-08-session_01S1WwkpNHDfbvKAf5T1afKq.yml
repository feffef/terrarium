learnings:
  - Cold readers with no repo access find structure bugs in a spec reliably, but they also flag 'contradictions' the repo resolves (e.g. ready-for-human per ADR-0022). Verify each claim before applying it.
ideas:
  - "Build the drift test from Part 2's 'Keeping it true' before the diagram itself: a tests/unit spec that reads a typed diagram data file and fails on missing paths or unknown node ids. That way the content is checked in CI no matter where the diagram ends up living."
