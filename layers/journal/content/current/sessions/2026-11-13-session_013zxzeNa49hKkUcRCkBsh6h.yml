summary: The owner asked whether Glass Box covers the shell pre-filters that keep tsx from starting on every tool call, and why they exist. I found the coverage in the hooks chapter (10.hooks.md, 20.blocking-hooks.md), then read docs/agents/guards.md at the owner's request for the fuller rationale (~0.3s per tsx start, matcher scoping, known gap). The owner suspected an issue or PR about long e2e times as the origin; four fuzzy issue searches found nothing, and git history showed the first .sh filter arrived with the subagent-background guard (#694), motivated by Bash being the hottest tool, not by e2e. All of this was human-asked reading. I asked whether to expand the Glass Box page; the owner declined the question dialog, then asked if the topic merits its own lesson, and I gave an opinion (expand the existing bullet first). Nothing was edited; the owner ended the session.
