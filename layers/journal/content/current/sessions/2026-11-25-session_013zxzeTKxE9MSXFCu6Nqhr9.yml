trigger: blog-post
learnings:
  - A PR body can describe a test as checking more than it asserts (here 'after the header' was only 'before the body'); the test file is the source.
  - "An issue's comments can hold the decision a PR body omits (issue 3600: the owner's comment narrowed the ask to a teaser); read comments, not just the body, before saying why a change has its shape"
ideas:
  - Blog posts could carry a per-tag Glass Box link (a merge-flow post points at the pull-requests lesson) in place of the one fixed new-here link, so a newcomer lands on the lesson for the post's topic.
  - Require a PR that closes an issue with something other than what it asked for to link the comment that changed the ask (a one-line check in merge-pr.ts or the PR body convention), so closed-as-completed stays traceable without reading timestamps
landedBy: Stop
