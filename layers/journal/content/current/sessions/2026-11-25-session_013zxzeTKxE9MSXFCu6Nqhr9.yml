frictions:
  - description: Wrote a claim about the e2e test (line comes after the header) from the PR body instead of the test I had already seen; the fact-checker caught it.
    solution: Re-derive every test claim from the test file itself while drafting, as the Skill's re-derive rule says.
    severity: minor
  - description: Started the full gate while code-review was still running; its findings then changed the post, so the first 20-minute gate run was wasted and had to be redone.
    solution: Run the gate only after review fixes land, as step 10 orders; the Skill could say review findings come before the gate run.
    severity: minor
  - description: The tenant-glossary guard blocked my first Write of the post because I had not read the Blog glossary in full; the rule loaded only after earlier Blog reads.
    solution: Read the Tenant's GLOSSARY.md at step 2 of blog-post when gathering material.
    severity: nit
  - description: Merged PR 3672 and carried on to the reply without re-running close-session; the Stop hook had to remind me.
    solution: Re-invoke close-session at each merge, as CLAUDE.md says, before the next step.
    severity: nit
  - description: Edited the reply post while pnpm gate:scoped was still running in the background after code-review findings arrived, so the run aborted and a full gate was wasted again.
    solution: Start the gate only after review findings are in; the gate-edit guard blocked the commit only after the edit.
    severity: minor
  - description: Drafted the first post from issue 3600's body without reading its comments; the owner's comment, the real story behind the post's thesis, surfaced only at step 12 and became the reply.
    solution: Read an issue's comments, not only its body, when a post says why a change took the shape it did.
    severity: minor
