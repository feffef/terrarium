frictions:
  - description: The orientation output is over 25 KB and the Subject output over 70 KB, so reading them cost several paged reads and many tokens.
    solution: Print only the Subject's pages' Try-it and Where next on request, or split the output into files up front.
    severity: minor
  - description: I took a screenshot of the Walkthrough sidebar before reading docs/agents/verifying-ui-changes.md; the hook pointed to it only afterwards. The shot was right anyway.
    solution: Have the read-first hint fire on scripts/ui/preview.ts in a Bash call, not after it.
    severity: nit
  - description: My multi-edit Python helper wrote each file as it went and then failed an assertion, so two edits applied only in part (a test and the memory note), costing extra fix commits and a re-run.
    solution: Check every replacement before writing any file, or use the Edit tool per change.
    severity: minor
  - description: I named a run entry with a trailing letter, 2026-11-13T0005b, which the run-start parser may not read; I renamed it before the PR merged.
    solution: The orientation could print the next free run-entry name when two runs start in the same minute.
    severity: nit
