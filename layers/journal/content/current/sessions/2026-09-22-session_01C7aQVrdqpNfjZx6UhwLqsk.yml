frictions:
  - description: "SHELL-READ-DETECTION: backgrounded pnpm gate:scoped once via `nohup … &` combined with run_in_background:true (correctly denied by the double-background guard), then a follow-up run piped through `tee` into a log directory that did not exist yet; tee's write failure made the whole pipeline exit 1 even though gate:scoped itself printed \"all planned steps passed\" -- a misleading top-level status that needed a clean re-run (plain redirection, no tee) to trust."
    solution: Never pipe a backgrounded gate/build/test run through tee or any other command that can itself fail silently -- redirect straight to a file with '>', and mkdir -p the log directory first.
    severity: minor
  - description: While waiting on a dispatched Agent-tool subagent (the A5 outside reader), reflexively reached for ScheduleWakeup to check back later; correctly denied by the /loop-only tool guard since this isn't a /loop session.
    solution: Remember a dispatched Agent-tool subagent self-notifies on completion -- just end the turn and wait, never poll or schedule a wakeup for it.
    severity: nit
