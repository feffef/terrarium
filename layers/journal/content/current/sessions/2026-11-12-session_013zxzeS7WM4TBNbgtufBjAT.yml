outcome: Costs reported; PR 3220 (plain.ts, term-case warning, word count, run loop) and PR 3258 (loop as the last step, usage estimate, foci never run out) merged
summary: "Human-instructed: the person asked for the costs of the glassbox-curate runs in the last 6, then 12 hours; later for \"check their session logs as well if the frictions overlap\", for which fixes were worth it, then \"do 1, 2\" plus a loop in the Skill, a better plain.ts output and the page check; they answered my questions (loop ends on budget only and hands over only when told; page check warns on terms collection plus glossary headings; definitions as a note after the paragraph), asked for a note on working around false positives, ran /code-review, said to leave the page fixes to the curate run, said \"yes, add the note and open the PR\", asked that the scan cover the Glass Box glossary, that the glossary be fixed, and that the numbering fact come out of its Two spaces bullet; they merged PR 3220. After that they pasted a snippet from the first scheduled run with the new loop, which did not loop, and asked for clearer instructions, an estimate rule for a session without get_session, the whole usage topic at the end where it is used, a re-read of the Skill for other one-focus wording, and that foci never run out so only the budget ends a session; then \"merge it\" for PR 3258. Agent-initiated: choosing which retro points to recommend, the shape of the check (skipped spans, word list, proper-noun list), the bare-stem matching, the colon rule, which glossary sentences to lowercase, moving the Lesson numbering rule into the glassbox-lesson Skill so its pointer did not dangle, the loop edge cases (only a run that opened a PR reaches Loop; interactive sessions settle the next focus with the person), the 450k-per-$25 and 100k-per-run figures (read from get_session costs and the retros), and subscribing to both PRs. Eight costs came from get_session (about $148 for eight sessions in 12 hours); seven retros arrived as messages from other sessions and I took no action on them, only compared them with the session logs. I told the person the Glass Box words are capitalised on purpose; they asked \"are they?\" and the guide showed they are not. PR 3220 was opened conflicted with main (the glossary was edited upstream); I merged main in and re-applied the sweep. PR 3258 needed four rewrites of the Skill text because I fixed only the parts I thought of; the person's follow-ups (one-focus wording, foci never run out) found the rest. After the owner's word I posted a verdict and merged 3258 with scripts/github/merge-pr.ts, which did not ask for the owner-approved flag. Still open: the curate run that fixes the 15 guide hits as the first real test of the warning, whether the next scheduled run now loops, and whether the root glossary note (borderline under ADR-0021) stays."
