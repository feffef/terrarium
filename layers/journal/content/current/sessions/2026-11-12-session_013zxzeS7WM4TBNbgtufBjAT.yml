summary: 'Human-instructed: the person asked for the costs of the glassbox-curate runs in the last 6, then 12 hours; later for "check their session logs as well if the frictions overlap", for which fixes were worth it, then "do 1, 2" plus a loop in the Skill, a better plain.ts output and the page check; they answered my questions (loop ends on budget only and hands over only when told; page check warns on terms collection plus glossary headings; definitions as a note after the paragraph), asked for a note on working around false positives, ran /code-review, said to leave the page fixes to the curate run, said "yes, add the note and open the PR", asked that the scan cover the Glass Box glossary, that the glossary be fixed, and that the numbering fact come out of its Two spaces bullet; they merged the PR. Agent-initiated: choosing which retro points to recommend, the shape of the check (skipped spans, word list, proper-noun list), the bare-stem matching, the colon rule, which glossary sentences to lowercase, moving the Lesson numbering rule into the glassbox-lesson Skill so its pointer did not dangle, and subscribing to the PR. Eight costs came from get_session (about $148 for eight sessions in 12 hours); seven retros arrived as messages from other sessions and I took no action on them, only compared them with the session logs. Built plain.ts (bare stems, notes after paragraphs, link titles, code kept as written), the warn-only capitalised-term check, the memory-page word count in orient.ts and a Loop paragraph in SKILL.md; two code-review rounds, three scoped gates green. I told the person the Glass Box words are capitalised on purpose; they asked "are they?" and the guide showed they are not, so the glossary headings were added to the word list. They also explained the cause (agents copy capitals from glossary headings), which led to the heading-style note in both glossaries and the sweep of the Glass Box glossary (57 hits). The PR was opened conflicted with main (the glossary was edited upstream); I merged main in and re-applied the sweep. Still open: the curate run that fixes the 15 guide hits as the first real test of the warning, and whether the root glossary note (borderline under ADR-0021) stays.'
