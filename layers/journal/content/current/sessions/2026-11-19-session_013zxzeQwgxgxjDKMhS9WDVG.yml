frictions:
  - description: I typed this session's id by hand in the first issue body; the ADR-0017 guard blocked it, and I almost cited a truncated session id in the same body.
    solution: Show the ground-truth session id in the run's opening context, or have issue_write fill it.
    severity: minor
  - description: "I filed issue #3483 before reading docs/agents/triage-labels.md, which CLAUDE.md requires before filing; a hook told me afterwards."
    solution: Load the triage-labels reminder before issue_write, not after.
    severity: nit
  - description: I tried a background gate run with a trailing ampersand plus run_in_background, and a foreground sleep; guards blocked both.
    solution: None needed beyond the existing guards.
    severity: nit
  - description: A cd into the builder's worktree persisted, so my later commands ran there and the harness flagged the changed working directory several times.
    solution: Use git -C and absolute paths; never bare cd into a worktree.
    severity: nit
  - description: I edited pr-workflow.md before the hook's ADR-0027, ADR-0029 and ADR-0004 full reads; the edit was already consistent, but the read came after.
    solution: Show the governing-ADR read hint on the first read of a governed file, not after the edit.
    severity: nit
  - description: SKILL.md sends the ledger PR to the simple-change test, but a 38-file ledger update can never pass it, so a full two-agent code-review ran on script-made data; the Skill never says whether that is intended.
    solution: State in frictions-to-fixes SKILL.md §5 that a script-made ledger PR gets code-review or a named lighter path.
    severity: minor
  - description: design-brief.md says run §1 to §5 for each pick but gives no short form for a no-change pick; the survey brief omits the ledger commit hash and the create-entry recipe, and its §2.5 does not cover a tracked entry whose issue closed with no PR.
    solution: Add a one-line no-change answer to design-brief, and the hash and create recipe to survey-brief.
    severity: minor
  - description: The survey report said the ledger had 74+ never-fixed or regression entries, so its tracker confirmation covered only a few; I had to rank and pick from ledger-derived labels.
    solution: Have the survey cap what it must confirm to the top-ranked candidates and say so.
    severity: minor
