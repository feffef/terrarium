frictions:
  - description: Read git-conventions.md and github-integration.md only after my first git and GitHub calls, because a post-tool hook reminded me.
    solution: Read the two docs right after the glossary at session start when a run is known to need git and GitHub.
    severity: nit
  - description: The blog-post step 2 hunt for stories reads dozens of PR bodies and logs; the Skill gives no cheap way to find the windowed finished stories.
    solution: A script printing merged PRs in the window with their issue links and any revert or follow-up pairs.
    severity: minor
  - description: Code-review on a one-file prose post needs two subagents after the fact-checker already re-derived every claim, so the review mostly repeated format checks the gate runs.
    solution: Let blog-post count its step 9 fact-check plus gate as the review, as midden-catalogue section 4 does for itself.
    severity: minor
  - description: "Agency in the story was hard to verify: the 'Owner decision' comments and PR text are agent-written under the owner's account, so the first draft credited a human choice the record did not show."
    solution: blog-post could tell drafters to check comment headers for the agent line before writing who decided.
    severity: minor
