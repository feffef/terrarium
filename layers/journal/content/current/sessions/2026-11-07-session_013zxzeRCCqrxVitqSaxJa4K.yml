frictions:
  - description: "Verify before you state broken: I told the user 52 titles were kept (the seven reports covered 62) and drafted memory-page counts (12 names sharing no words, about 60 links) that were wrong."
    solution: Count with a command before writing any number; really 8 file names share no word with their title, 4 share one, and 186 guide links use the 12 old addresses. The code-review agents caught the memory-page ones.
    severity: minor
  - description: "Skipped the curate Read step: I edited after reading only two walkthroughs myself, relying on reviewer reports, and left pagesRead empty until the Standards reviewer flagged it."
    solution: Read the pages the change edits, links or overlaps before the edit, then fill pagesRead from what I read.
    severity: minor
  - description: Planned and costed a 12-file rename, grepping every link, before checking whether titles were settled; the owner's question about a title consolidation redirected the run.
    solution: The memory page's good next focus should say titles are not yet reviewed, or the rename lead should wait until they are.
    severity: moderate
  - description: My reviewer briefs said read each page in full, but several reviewers read through cut or head filters and truncated long lines, so some keeps rest on ledes and headings.
    solution: State in the brief that page text must not be filtered or cut, and ask each reviewer to name any page it read only in part.
    severity: minor
  - description: "Wrote 'Run cost: unreported' in the PR body after calling get_session only once, at the start; the Land step says to read the cost just before writing the body. A later call showed cost_usd 2.85."
    solution: Call get_session again right before writing the PR body and quote cost_usd; the main-session figure may not include subagent runs, which I could not verify.
    severity: minor
  - description: Dispatched eight reviewers asking for one title proposal each, then resumed all eight to ask for ranked alternatives, so every reviewer read its pages and reported twice.
    solution: Settle the number of proposals per page before dispatch (dispatch-subagents section 1, lock the shared design axis); skipped because the run began autonomous and ran no grilling.
    severity: minor
  - description: A read-only grep of layers/glassbox/tenant.config.ts loaded adr-0002, data-shapes, mdc-when-to-use and tenant-layers; all four got a no verdict, and mermaid-lanes loaded on reading walkthroughs with no diagram edit.
    solution: Their paths are right for editing those files; the cost is the loader firing on read-only access. Decide whether a read-only grep should load rules, or accept the cost.
    severity: nit
  - description: No orient output shows which guide file names differ from their titles or how many links use each old address, so I wrote a throwaway bash loop and hand-counted, which led to the wrong counts.
    solution: Add a section to glassbox-curate orient.ts listing pages whose file name shares no word with the title, with their inbound link counts; a Skill change that waits for the owner's merge.
    severity: minor
  - description: Recommended a capital S for Skills in titles as 'following the glossary term', but other glossary terms (Collection, Friction, Routine) are lowercase in titles; the owner caught it after the merge, costing a reversal PR.
    solution: Before recommending a title convention, list how every comparable word is already cased in the guide (one grep of title lines) instead of reasoning from the glossary alone.
    severity: moderate
