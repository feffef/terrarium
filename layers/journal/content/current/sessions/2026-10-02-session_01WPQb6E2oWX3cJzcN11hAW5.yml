summary: "The user asked (human-instructed) for a direct GitHub link from the Journal's skills page and from the session log's \"Skills used\" list to each Skill's current version on main. Following the user's preference to ask before assuming, I asked four questions first and the user picked every recommended option: link this repo's own copy, even for external-pack Skills; point at SKILL.md rather than the folder; link the compact chips too; and leave names with no repo Skill as plain text. Linking only the Skill Inventory's names would have missed three repo Skills that have no inventory entry (midden-catalogue, wait-what, wizard). So the journal layer's nuxt.config reads the list of folders under .agents/skills/ that have a SKILL.md at build time and passes it through appConfig. That is the first appConfig use in the repo. A `skillUrl` helper in dashboard.ts builds each link, and unit tests cover it. pnpm gate:scoped passed. Opening and subscribing to the PR was agent-initiated, per ADR-0003's auto-open default. The user then ran /code-review against origin/main: Spec found no gaps; Standards flagged a WHAT-comment on skillUrl, duplicated link markup/CSS and a silent `= []` default. I offered a cleanup push but got no answer before the user merged PR 1529 as is, so those cleanups remain open as a possible follow-up."
