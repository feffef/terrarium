frictions:
  - description: Ran gh api issue searches before reading github-integration.md; the hook then reminded me, so the doc was read after the first GitHub operation.
    solution: Read the GitHub docs in step 4 of audit-skills before the issue searches; the Skill could name them there.
    severity: nit
  - description: Wrote 14 Inventory notes without reading layers/journal/GLOSSARY.md, which the tenant-glossary rule asks for before Journal work; no term error was found afterwards.
    solution: Name the Journal glossary in audit-skills step 5, as earlier audits already suggest.
    severity: minor
  - description: Draft notes had a placeholder session id and four issue or PR state phrases GitHub contradicted; check-states and a re-read caught them before the commit.
    solution: Draft notes from the auditors' verified states only, and run check-states on the draft file first.
    severity: nit
