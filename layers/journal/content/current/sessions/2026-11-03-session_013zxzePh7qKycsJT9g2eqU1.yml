  - description: Ran git rev-parse HEAD before reading docs/agents/git-conventions.md, which CLAUDE.md orders before the first git command beyond read-only ones.
    solution: Read the doc first; the hook caught it and the late read changed nothing.
    severity: minor
  - description: Ran gh api search before reading docs/agents/github-integration.md, which CLAUDE.md orders before the first GitHub operation.
    solution: Read the doc first; the hook caught it and the late read changed nothing.
    severity: minor
  - description: Typed a wrong session id into my commit trailer from memory; the commit-msg hook replaced it with the right one.
    solution: Copy the id from the system prompt, or leave the trailer to the hook.
    severity: nit
  - description: My text wrapping split hyphenated words across folded YAML lines, so the first gate:scoped failed on validate-content-schema and I reran the gate. I had not run validate:content first.
    solution: Run pnpm validate:content after any Journal content edit and before gate:scoped, as ADR-0004 says.
    severity: moderate
  - description: "SHELL-READ-DETECTION: .agents/skills/clear-backlog/SKILL.md was credited from shell output, but the session marked it (not read)"
