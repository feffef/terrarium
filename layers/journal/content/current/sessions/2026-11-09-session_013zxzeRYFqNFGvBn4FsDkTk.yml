goal: Make glassbox-curate scout recent git history for topics worth documenting
status: completed
outcome: PR 2991 added a background Scout step to glassbox-curate and was merged
summary: "The owner asked whether glassbox-curate looks at recent git history for new topics. I read the Skill and orient.ts and answered no: its Gaps step compares the current tree, and orient.ts only logs guide and drafts commits. I then asked three scoping questions (user preference: ask first), and the owner answered: all changes, a subagent that also uses orient.ts, always in the background on sonnet without blocking focus selection, and a window since the last run. Building that was a direct human instruction. I added a Scout step and a Land sentence to the Skill, ran the scoped gate (the first run aborted because I committed during it), and ran code-review with a Standards and a Spec subagent. Their findings were a \"never wait\" vs \"wait now\" contradiction, Scout re-running orient.ts (it rewrites the index files), an unclear window start and some scope creep; I fixed these in a second commit, which I reviewed myself instead of re-running code-review. Opened PR 2991, which says it waits for the owner's merge because it changes a Skill. Opening the PR itself followed ADR-0003 and was agent-initiated. The Stop hook then made me subscribe to PR activity; CI went green and the owner merged the PR. A /retro followed, and at the owner's ask I filed issue 2992 to check the Scout's output on 2026-11-12 and logged the retro's findings as frictions. The Scout's cost is not added to the run's reported cost, left open."
