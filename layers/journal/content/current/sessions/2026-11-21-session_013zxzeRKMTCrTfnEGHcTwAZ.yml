trigger: audit-skills
learnings:
  - The scorecard's routineRuns list per Routine and usage had to be matched by hand against each Routine file to find which runs lacked usage rows.
ideas:
  - Make the audit-skills scorecard print a roleStale flag (SKILL.md changed after the Inventory entry's date) and a repeatsLastCheck flag (no new runs or changes), then dispatch behaviour agents only for flagged Skills; this run spent about 1.5M subagent tokens re-confirming known repeats.
  - Have the audit's note-append step count words and refuse notes outside 300 to 500, so the reviewers never spend a round on length.
landedBy: Stop
