frictions:
  - description: Ran git status, a fetch and gh api before reading git-conventions.md and github-integration.md; hooks named them afterwards.
    solution: List both read-first docs in the audit-skills SKILL.md opening so they load before step 1 (same gap as 9 earlier runs).
    severity: nit
  - description: Wrote the blog-post note's claim that its role omits the Take from a subagent's report without checking the file; the Spec reviewer caught it.
    solution: Check each claim a note takes from a subagent report against its source line before writing it.
    severity: minor
  - description: Three notes came out under the 300-word floor on first draft, caught only by the reviewers, costing a follow-up commit and a second two-axis review.
    solution: Print word counts of the drafted notes in the script that appends them, and refuse under 300.
    severity: minor
  - description: Did not read layers/journal/GLOSSARY.md before editing journal Inventory files; the Tenant-glossary rule loaded after the edits.
    solution: Have audit-skills step 5 name the journal glossary as a read-first doc.
    severity: nit
  - description: The Stop hook demanded a push and a commit while the reviewers ran; I pushed early, then pushed two follow-ups.
    solution: None needed; a push opens nothing.
    severity: nit
  - description: A chained sleep and a command mixing run_in_background with a text-level ampersand were blocked by guards, costing two retries.
    solution: State in the audit-skills Skill to run gates with run_in_background alone and wait for the notification.
    severity: nit
  - description: Fifteen behaviour agents plus two review rounds cost a lot to confirm mostly known repeats, and four did not read the Inventory entry for the role/gist check.
    solution: Print a roleStale flag per Skill in the scorecard and skip a Skill whose runs and changes repeat the last check.
    severity: moderate
