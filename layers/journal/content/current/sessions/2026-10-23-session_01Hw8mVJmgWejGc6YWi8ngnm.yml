summary: "Scheduled audit-docs run, started by a Routine with no human prompt; every step was agent-initiated under the Skill's own authority. Concision family picked from the newest origin/main commit (docs/research, so skills). Five read-only reviewers (freshness, single-home, two concision halves, coherence) produced 80 findings; three independent checkers returned 50 CONFIRMED, 20 CONFIRMED-BUT, 9 WRONG, and 1 finding was dropped because its file is in an open Prune Trial's territory. Applied the survivors in one sweep commit (22 files, none Human-only), ran code-review and gate:scoped, pushed and opened the sweep PR with a verdict comment. The two ADR pointer fixes (ADR-0021, ADR-0012, plus their rule hash restamps) went to a separate escalation PR that waits for a human merge. Open: sweep PR CI and merge, escalation PR review. Chose to keep edits the code-review Standards reviewer second-guessed (guest-build author filter, CLAUDE.md trigger) because the checkers had verified them against primary sources."
