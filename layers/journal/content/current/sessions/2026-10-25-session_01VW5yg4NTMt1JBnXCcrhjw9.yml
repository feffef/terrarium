outcome: "PR 2518 drops the audit-docs Concision lens. Coherence lens lands real fixes; the Concision lens confirms the churn suspicion: about 19 of 25 landed concision edits in two runs changed no reader action"
summary: "Human-instructed: the user asked me to use inspect-session on the last two audit-docs runs (session_01Ku4KD2Ua5MXi6eQ95TG4aj on 2026-10-24 and session_01EQ8sMcrX7UwDXFBx6tfUWu on 2026-10-25) to confirm or refute that the Coherence lens (Agent D) only makes churn. The session logs and sweep PR bodies (#2481, #2509) don't split findings by lens, so I dispatched two partial-read subagents, one per session. Results: on 10-25, D made 12 findings and 4 landed (the CLAUDE.md .throwaway contradiction, the Midden trench/stores fact, the close-session Inventory babysit claim, and one mis-labelled glossary move). On 10-24, 12 checked coherence findings produced 4 landings (ADR-0004 0.x-minor escalation, ledger-set path, close-session role, journal glossary wording). The 10-24 reader reached its 25-page limit before Agent D's own hand-back and worked from the checker's re-listing. The verdict the user got: the lens mostly lands real fixes, and most churn in those PRs is concision and Inventory wording. Its real cost is rejected findings that come back every run (visitor-loop \"five homepage sites\", Tinkerfund \"Live ending soon\", pr-workflow under a Prune Trial). The user then clarified they meant the Concision lens (human-instructed follow-up). Resuming the same two readers: on 10-25, C made 39 findings, 7 confirmed, all same-meaning rewordings; on 10-24, about 68 findings, about 29 confirmed, about 6 useful (a wrong \"six weeks\" fact, a stale \"small set of ADRs\", a stale correction note) and the rest wording churn. My own git blame over 16 sweeps since 10-13 showed 10-22% of each sweep's removed lines were written by an earlier sweep. Concision's share of tokens was about 8-20%; Coherence's reviewer alone was 29-33%. The user then picked option 1 of three (remove the lens). I removed Agent C and the concision-family rotation from audit-docs, repointed four references (impl-brief, prune-trial, the Inventory role, the interactive map), left the pinned Glass Box walkthrough alone, and changed the intro's \"plain\" to \"clear\" after both code-review axes flagged it. Gate green; PR 2518 open."
