frictions:
  - description: The Skill ranks regressions by highest severity since the fix but gives no tie-break; four were moderate with one occurrence each, and I picked the third by horizon count.
    solution: Say how to break ties, or allow fewer than three when the remaining candidates are superseded or server faults.
    severity: minor
  - description: The survey report omitted each regression's highest-severity-since, though its brief asks for it; I re-derived it from the summary file with grep.
    solution: Have the survey brief require the since value column copied per regression, or write the ranked list to a file.
    severity: minor
  - description: "The third regression issue (#2806, inspect-session paging) is a likely server fault whose use case was removed by #2688; the Skill said file the top three anyway."
    solution: Let the Skill skip a regression whose use case a merged PR removed, as the earlier run's log also suggested.
    severity: minor
  - description: The design subagent tried gh issue view (GraphQL, 403) before reading github-integration.md, and the survey agent's own occurrence count was unverified (tail cut its output).
    solution: Brief the agent with the cloud gh limitation inline; have append scripts print a total count.
    severity: nit
  - description: The Stop hook asked twice to push the ledger commits before the pre-push gate and review had run, as ADR-0004 allows overriding.
    solution: Have the hook stay quiet while a gate run is in progress or on a branch with no PR yet.
    severity: nit
