summary: "The owner asked why Journal pages had become a narrow card with white borders. History showed two causes: the white margins have existed since #25 (only .jd is themed, the body is not, and .jd was a centred 1120px box), but they only became prominent today when bd394111 (via #1563, a visitor-loop session) capped document pages at 44rem. On direct owner instruction I reverted that cap, made .jd span the window with padding centring the 1120px column (plus body margin 0), and then, again on explicit owner choice among three offered options, dropped the 68ch prose cap entirely. Screenshots in dark, light and 390px were shared. Nothing was agent-initiated beyond the auto-opened PR. Local gate:scoped failed 2 journal e2e tests caused by a session log already on main whose id lacks the session_ prefix; noted in the PR, not fixed here."
