  - description: Owner had to ask three rounds (undo narrowing, why off-centre, why not wider) before the real ask, full width, surfaced; the 68ch cap was the root cause I did not name in the first answer.
    solution: When explaining a layout, name every width constraint in the stack up front.
    severity: minor
  - description: Chose 88ch from an estimate, then had to measure the screenshot and rebuild at 82ch; each rebuild costs minutes.
    solution: Measure characters per ch from an existing screenshot before picking the value.
    severity: nit
