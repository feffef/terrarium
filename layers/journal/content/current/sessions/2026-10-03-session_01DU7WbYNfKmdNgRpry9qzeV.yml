frictions:
  - description: I ran the screenshot step while pnpm build was still running in the background, so preview.ts found no .output and the shots failed.
    solution: Wait for the background build notification before any step that consumes .output.
    severity: minor
  - description: First commit attempt hand-wrote the Co-Authored-By and Claude-Session trailer because the system reminder said to; the commit-trailer guard denied it.
    solution: Already guarded; the CLAUDE.md rule and guard deny message cover it.
    severity: nit
  - description: "Local gate:scoped fails on main content: a session log (2026-10-03-a1af4e46…) has a non-session_ id, breaking two journal e2e chip tests unrelated to this PR."
    solution: The lander or schema should reject or normalise non-session_ ids; or the e2e test should pick a card with a session_ link.
    severity: moderate
  - description: Owner had to ask three rounds (undo narrowing, why off-centre, why not wider) before the real ask, full width, surfaced; the 68ch cap was the root cause I did not name in the first answer.
    solution: When explaining a layout, name every width constraint in the stack up front.
    severity: minor
  - description: Chose 88ch from an estimate, then had to measure the screenshot and rebuild at 82ch; each rebuild costs minutes.
    solution: Measure characters per ch from an existing screenshot before picking the value.
    severity: nit
  - description: Centred only the Document route and did not check the other single-column Journal pages (Skills, Ideas); the owner found Skills still off-centre after merge.
    solution: When changing a shared layout rule, screenshot every page that uses it before opening the PR.
    severity: minor
  - description: 'Opened PR #1579 without running gate:scoped; CI then failed on an e2e test asserting the exact class="jd" string, which a local gate would have caught.'
    solution: Run gate:scoped before opening every PR, even a two-line class change.
    severity: moderate
  - description: Launched a second gate:scoped while the first (pre-merge) one was still running, both writing the same log file; a dirty-tree merge had silently failed inside the first command.
    solution: Check merge exit status before chaining a gate; never run two gates concurrently.
    severity: minor
