frictions:
  - description: The merge-close Stop hook blocked the turn twice saying a PR merged; none did. My Bash commands only named scripts/github/merge-pr.ts while reading it.
    solution: Make merge-close-stop.ts test a merge result, not command text (cause merge-close-hint-fires-without-merge).
    severity: minor
  - description: CLAUDE.md asks for the overview page and the full ADRs before reviewing work that spans the Platform's parts; I compared two cross-cutting designs without reading either.
    solution: I judged a design comparison of a new system as outside the trigger; the trigger could say whether reviewing a design note about a successor system counts.
    severity: nit
  - description: dispatch-subagents says to keep each subagent's final reply with save-handback.ts; I kept none of the six hand-backs that way.
    solution: For read-only Explore agents whose reply arrives in context, the Skill could say the save is not needed, or a hint could fire on the hand-back.
    severity: nit
  - description: The other session and I sent long first messages at the same time, twice, so each answered points the other had already covered.
    solution: When opening a cross-session exchange, send a one-line hello and wait for the reply before sending findings.
    severity: minor
  - description: I told the other session the Friction Ledger starts 2026-09-29, a date two subagents gave; my own count later showed 2026-10-30. I had spot-checked their counts but not that date.
    solution: Check a window or date that scopes every later count the same turn it is first relayed; I sent a correction.
    severity: minor
  - description: A Bash call with a bare cd into layers/journal/content moved the session's working directory for the following calls.
    solution: Use absolute paths or git -C; cause bare-cd-moves-session-cwd.
    severity: nit
  - description: Several messages crossed because the other session replied within seconds while my research agents took minutes; I answered some points twice.
    solution: Say in each message which earlier messages it has and has not seen.
    severity: nit
