learnings:
  - A Routine-fired session is told apart only by the transcript's entrypoint value remote_trigger; no environment variable or hook payload field carries it
  - Asking for the recorded problem behind a mechanism, with its count, settled design disagreements faster than describing how the mechanism works
  - With one build and one check run, separate styles and folders per part did nothing to stop one part's content or tests failing another's change; only a separate check scope does
ideas:
