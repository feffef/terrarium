summary: "The owner asked (direct ask) that the home page's Latest digests teasers link to the Journal index with an anchor, not the standalone digest page. I asked two scoping questions first, per the owner's preference: home teasers only, standalone pages kept. Both answers were the owner's. The Journal index already opened a digest from digest-date hashes, so the change was small: a digestLink helper in app/pages/index.vue and a stricter home-page e2e assertion. I checked it by clicking a teaser in a dev server. gate:scoped passed with 172 e2e, and code-review (Standards and Spec) found no hard violations. The commit, push and PR were agent-initiated follow-through; the owner said yes to the gate, review and PR. The PR touched a Human-only file, so a human merged it; the merge was theirs, not mine. Nothing is open."
