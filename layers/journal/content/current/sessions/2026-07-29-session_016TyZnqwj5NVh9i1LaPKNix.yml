learnings:
  - preserveAspectRatio="slice" crops the sides at narrow viewports and the top and bottom at wide ones, so an illustration's safe zone is the intersection of both crops, not the viewBox
  - The --midden-slate* tokens were defined in both theme blocks but referenced by zero components, orphaned since the depth-gauge was removed
  - A full-bleed band inside a max-width column is safer as two page blocks than a width 100vw breakout, which counts the scrollbar and adds a horizontal one
  - Asking an agent to review its own rendered screenshots between iterations produces real reversals; both agents reverted a prior iteration's overshoot rather than defending it
ideas:
  - Commit an illustration contact-sheet script (scripts/illustration-sheet.ts) that renders every Tenant's inline SVG illustrations across light and dark and three viewport widths into one PNG. This session hand-built that scaffolding twice in scratch and threw it away both times, and the slice-crop defect it caught (objects falling outside the crop at 700px) is invisible to the e2e gate, which only asserts hydration. A committed sheet turns presentational regression from something each session re-improvises into one command a reviewer can eyeball on any PR touching a drawing.
