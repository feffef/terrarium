frictions:
  - description: Three transient API 500s killed both refinement subagents mid-run, twice during grounding before either wrote a byte.
    solution: SendMessage resume preserved their grounding rather than restarting cold. Brief long subagents to bank each iteration's artifacts to disk before starting the next, so an interruption leaves a partial deliverable.
    severity: major
  - description: Did not invoke close-session at PR-open as CLAUDE.md requires; closure slipped to post-merge because the PR-open sequence was interrupted.
    solution: Treat the create_pull_request tool result itself as the closure trigger and invoke close-session in that same turn, before subscribing.
    severity: moderate
  - description: An ideation agent's flagship idea was invalidated by corpus counts a single grep would have surfaced before it ever drew anything.
    solution: Ship the corpus statistics (per-kind, per-grade counts) inside the ideation brief, so agents cannot propose iconography for fields that never render.
    severity: moderate
  - description: Shipped the section column hidden below 44rem, and the human caught it. The drawing was the only place one dig season appears at all.
    solution: Treat a display-none breakpoint as a design failure to justify in the PR, not a default. The real constraint was SVG text scaling, which a narrow variant plus an HTML legend solves without hiding anything.
    severity: moderate
  - description: Two parallel refinement agents would have raced on one shared gallery.html in the scratchpad.
    solution: Hand-partitioned them into per-idea subdirectories in the dispatch brief; a convention for per-agent scratch dirs would make this automatic.
    severity: minor
