outcome: "No run hit the cap; added a Friction Ledger collection and seeded it, PR #1782 open"
summary: "Human-instructed: the owner asked for an analysis of the frictions-to-fixes Skill and the last 14 days of session logs, current and archived, with a Sonnet agent doing the exploration and the analysis done here. The Sonnet agent extracted all 15 daily runs and 889 frictions from 205 sessions; I spot-checked its PR lists, cap wording and severity totals against the raw logs. Finding: no run reached the 10-total or 2-hard cap; the binding filters are the guard and hook surface rule, the ripeness test and the 3-day window, which hides causes that recur every few days. The owner then asked whether this meant an observation log like audit-skills; I compared it with the prune-trial ledger and asked four questions. The owner chose a repo-file ledger in the Journal, seeded from the analysis, with full occurrence lists, named Friction Ledger, page in a later PR. I added the frictions Collection and schema to the Journal manifest, seeded 23 clusters (every moderate-or-worse friction read and classified by hand, papercut clusters matched by pattern with every match read), rewrote the Skill's survey and selection steps around the ledger, and added the glossary entry. Opening PR #1782 was agent-initiated per ADR-0003. The owner then questioned the 3-day scan; I proposed a cursor plus moderate-or-worse singletons, and the owner countered that nit and minor recurrence still needs a short scan window (48 hours). That window and singleton design is still open and will land on PR #1782 as a second commit if agreed."
