  - description: "Broke CLAUDE.md 'Before your first git command (log to draw a conclusion): read git-conventions.md' — ran git log on the SKILL.md cap history before reading it, without fetching origin main."
    solution: Read git-conventions.md before the first git log used as evidence; low impact here since the history matched main.
