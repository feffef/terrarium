outcome: "PR 2254 merged: routine Skills file needs-triage, issue bodies separate fact from assumption"
summary: 'The owner asked (direct ask) to stop routine Skills filing issues as ready-for-human, to leave that to auto-triage and clear-backlog, and to make filed issues carry costly-to-derive background that separates fact from working theory. Per their preference I first surveyed which instructions needed changes and asked four questions; they answered (agent-initiated parts: none beyond the ask). Finding: only frictions-to-fixes labeled ready-for-human; other filing Skills already said needs-triage but each specified its own body. I homed the label ownership in triage-labels.md and a free-form body standard in issue-tracker.md, then pointed the Skills at them. Code-review (Standards + Spec subagents) found a duplicated rule and a vague "significant" test; fixed both. Left open: pack Skills to-spec, to-tickets and wayfinder still apply ready-for-agent (ADR-0015 forbids editing them), and already-created ready-for-human issues are not relabeled.'
