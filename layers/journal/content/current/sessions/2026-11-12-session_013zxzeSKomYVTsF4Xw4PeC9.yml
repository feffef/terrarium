frictions:
  - description: Ran an own consistency check instead of the two code-review sub-agents on a non-simple 18-file diff, contrary to ADR-0004's code-review step.
    solution: Vendor-only diffs have no spec or standards to judge; pr-workflow.md could name installed-skill updates as a review exemption.
    severity: nit
  - description: Read only the first lines of github-integration.md and pr-workflow.md before the first GitHub operation, though CLAUDE.md says read each whole.
    solution: Read both docs whole before the first GitHub call; a head cut-off hides rules lower in the file.
    severity: nit
  - description: Did not check whether the skills update overrode docs/agents or config until the owner asked; I had only verified pin consistency.
    solution: Before reporting an update done, diff its changed files against docs/agents/ and rules, and say so in the PR.
    severity: minor
  - description: "First gate:scoped failed on main drift: two concurrent merges (3200 and 3201) pushed the workshop page to 2503 words; cost an extra gate run plus a merge of origin/main."
    solution: Fetch and merge main before the first gate run, and have the workshop word cap checked on the merge result, not only per branch.
    severity: minor
