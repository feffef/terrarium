status: completed
outcome: Reordered two Glass Box subjects; PR 3739 reviewed, gate green and merged
summary: "The owner asked whether Self-improvement and House rules should sit higher in the Glass Box subject list, since they are what the platform adds on top of existing tools, and asked where I would place them. I first answered from one grep and subjects.ts; the owner then twice told me to orient properly and to use the real orient.ts script (human-instructed). After running it with --index and reading the three guide index files, I recommended positions 5 and 6 (House rules, then Self-improvement) right after Installed Skills, because the lessons link forward and back in loops, the overview already puts who-decides and how-it-improves before the stack, and putting them first would quietly name a starting point against the glossary. The owner said go (human green-light to build) and later ok (confirming the sidebar sample). Agent-initiated: the exact placement, the two read-only reviewer subagents, committing and pushing when the Stop hook asked, and opening the PR and subscribing to it without asking, as ADR-0003 and CLAUDE.md say once review and the gate pass. I wrongly told the owner subjects.ts was not Human-only; the human-merge rule loaded when I edited it and I corrected the claim, so the PR said it waited for a human merge. The gate and reviews were clean, no review comments arrived, and the PR was merged without further changes from me."
