frictions:
  - description: First gate launch used run_in_background plus a text-level ampersand; the double-background guard blocked it and nothing ran.
    solution: CLAUDE.md's background advice could say pass run_in_background alone with a plain foreground command.
    severity: nit
  - description: The Stop hook asked me to push nine times while ADR-0004 required code-review and gate first; each ask cost a turn of explanation.
    solution: Have the Stop hook skip its push request while a Skill's review or gate steps are still running, or say the ADR-0004 order in its text.
    severity: minor
  - description: "Re-grade rounds churn: each round a rater found a new deficit in Cloud sessions (a count, a lede, then a false watch item), costing three rounds of three raters."
    solution: glassbox-improve could fix a deficit list per page from the first re-grade and treat only new false claims after that, since a fresh opus rater finds something every time.
    severity: moderate
  - description: "The promoted draft failed the page spec on first run: description over 120 characters, bullets over 65 words, and link text not equal to a title, found only by running the tests."
    solution: The writer brief could list the caps (description 120, bullet 65 words, link text equals title) so a promotion fixes them before the Check.
    severity: minor
  - description: "Cooling-off step: git diff -M --name-status over the whole tree between merge and base printed about 60 unrelated Journal rename and delete lines before I found the one glassbox deletion."
    solution: Scope that command to layers/glassbox/content in the Skill's cooling-off step.
    severity: nit
  - description: "Subagents broke brief lines or hook-requested reads: the sonnet rater used cd with git, and several never read git-conventions.md after the hook asked, because their calls were read-only."
    solution: The hook's wording could say read-only show, diff and ls-tree calls need no read, so agents stop reporting it as a miss.
    severity: nit
