frictions:
  - description: Instinctively reached for ScheduleWakeup to wait on a background research agent before remembering Agent-tool dispatches self-notify on completion with no wait/poll needed; the loop-only-tool guard correctly refused it.
    solution: No doc change needed — CLAUDE.md already states this rule and the guard caught it before any harm; just a personal habit to drop, noted for the record since the guard's deny message is the actual teaching moment here.
    severity: nit
  - description: The only clean, verified prune candidate found nets -29 lines, well under the prune-trial Skill's ~100-line aspirational bar; an extensive corpus search found the repo already tightly single-homed after several prior successful trials, with no other pure (behavior-preserving, doc-only) duplication of comparable size available this run.
    solution: Shipped honestly at the smaller size rather than forcing scope to hit the bar or padding the change. If this recurs across future runs, the Skill may want an explicit note that the ~100-line bar is a target that naturally shrinks as the corpus gets pruned, not a floor to force.
    severity: minor
  - description: "SHELL-READ-DETECTION false positive: docsReadViaShell credited at least auto-triage/SKILL.md, docs/adr/0003-agent-operating-model-and-governance.md, docs/adr/0004-objective-safety-gate.md, guest-build/SKILL.md, and guest-intake/SKILL.md as read this session; I never opened any of their content (no Read/Grep-with-content call touched them). The one candidate command whose file-list overlaps several other flagged entries (guards.md, tenant-layers.md, mdc-when-to-use.md, guest-contributions.md) is `wc -l /home/user/terrarium/docs/agents/guards.md /home/user/terrarium/docs/agents/*.md /home/user/terrarium/.agents/skills/*/SKILL.md`, run only to compare file sizes — `wc -l` never shows file content, only line counts, so every path it names should be rejected the same way the detector already correctly rejects a plain `wc -l <single-file>` call elsewhere in this same run. docs/adr/0003 and 0004 aren't even in that glob, so at least one more unidentified command or heuristic is also over-crediting."
    solution: Have the shell-read detector treat `wc -l`/`wc -c`/similar count-only utilities as never content-revealing regardless of how many file args they take (it already gets this right for a single-file `wc -l` call elsewhere in this run — the multi-file case falls through the same rule it should hit). Also worth an isolated repro to find what credited the two ADR paths, since they weren't arguments to any command in this session's transcript at all.
    severity: moderate
