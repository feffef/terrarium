learnings:
  - "scripts/prune-trial-window.ts is the only trustworthy source for a trial's judgeable-from time — two of the four open trials had an opened: date matching today's date but were still correctly reported not-yet-judgeable, confirming opened: is not the window start."
ideas:
  - As single-homing matures and remaining pure-prose duplication shrinks, /prune-trial runs may increasingly need to bundle several small, non-overlapping clean prunes into one PR to keep hitting a meaningful line-delta bar, rather than treating one candidate per run as fixed.
