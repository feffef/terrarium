frictions:
  - description: Ran git rev-parse before reading git-conventions.md; a hook prompted the read after the fact, though CLAUDE.md says to read it before the first non-status git command.
    solution: Treat any Skill step that touches git as the trigger and read the doc first.
    severity: nit
  - description: ledger-set.ts has no flag for entry notes, so the five drop notes needed a throwaway yaml script despite the 'never by hand' rule.
    solution: Add a --note flag to ledger-set.ts, or say in the Skill that notes may be scripted.
    severity: minor
  - description: The Stop hook asked me to push the ledger branch three times while gate:scoped was running or subagents were building; pushing then would have broken the review-and-gate-first rule.
    solution: Have the stop-git-check skip its nag while a gate:scoped process or background agent is alive.
    severity: nit
  - description: Screening the workflow-gate issue against closed issues covered only the newest 60 of 833, so a paraphrased older closure could be missed; the design agent made no tracker check at all.
    solution: Give the screen a script that filters all closed issue titles locally, as the survey brief asks for open ones.
    severity: minor
  - description: Reading ledger and tenant.config.ts files loaded five unrelated rules (adr-0002, adr-0008, data-shapes, mdc-when-to-use, tenant-layers) into this ledger-only run.
    solution: Narrow those rules' paths so reading the Journal ledger files does not load them.
    severity: nit
