  - description: The first probe subagent brief said use no other tools and did not ask for the per-rule verdicts or a scratchpad subfolder that CLAUDE.md requires of every subagent brief.
    solution: Put the CLAUDE.md subagent-brief lines in a reusable snippet or a dispatch-subagents checklist so a one-off probe still carries them.
    severity: nit
  - description: The session API usage counter did not change after a subagent ran, so I could not verify whether subagent tokens are counted; the counter refreshes at an unclear cadence.
    solution: Document in docs/agents/github-integration.md (or a new note) when get_session usage refreshes and whether it includes subagents, once measured on a finished Routine run.
    severity: minor
  - description: Before recommending the audit-skills change I did not run the grep for ADRs that bind it, nor read ADR-0015 in full.
    solution: Run the ADR grep from CLAUDE.md before proposing a design, even in chat.
    severity: nit
