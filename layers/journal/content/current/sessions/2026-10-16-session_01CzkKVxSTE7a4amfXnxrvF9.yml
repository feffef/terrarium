learnings:
  - Full ADR reads pay off by task (merge decisions, triage, Skill audit, trial verdicts, editing rules or ADRs, design), almost never by which file a session touched.
  - Path-scoping an always-loaded rule only saves context when the path set excludes most sessions; for 0003, 0004, 0009 and 0017 any covering set still loads in over 90% of sessions.
ideas:
  - "Split ADR-0020 and ADR-0027 into one CLAUDE.md action line each plus a path-scoped rule (paths from the survey: guest-contributions.md, trust.ts, triage and auto-triage Skills; prune-trials.yml and the instruction-editing Skills), cutting about 2k tokens from most sessions."
  - Have log-session drop the 'did you open the full ADR' question for rules whose when-clause did not apply, so sessions stop logging skipped-read nits.
