frictions:
  - description: Harness rule 'never push to a branch other than the assigned one' conflicts with the prototype skill's throwaway-branch capture; the assigned branch is unsuitable too because CLAUDE.md auto-opens a PR for substantive commits there.
    solution: Had to ask the human. Say in prototype/wayfinder guidance (or issue-tracker.md) that the throwaway prototype/research branch needs a human OK in harness-restricted sessions, or bless that pattern in CLAUDE.md.
    severity: minor
  - description: "The commit on prototype/tinkerfund-visual-identity has no ADR-0017 provenance footer: it was made in a git worktree under the scratchpad with no node_modules, so .githooks/commit-msg failed open silently."
    solution: Have the commit-msg hook resolve tsx from the main checkout (git rev-parse --git-common-dir), or warn instead of exiting 0 silently.
    severity: minor
  - description: "First screenshot pass captured variant A six times: navigating file:// only by changing the #hash doesn't reload the page, so the boot-time hash parse never re-ran."
    solution: Go to about:blank between captures (did that), or listen for hashchange in prototypes.
    severity: nit
  - description: Google Fonts is blocked in the container (cert error), so no screenshot showed the real typefaces; the human judged fonts I never saw render.
    solution: "For font decisions, commit the woff2 files into the prototype, or inline them as data: URIs, so they can be checked locally."
    severity: minor
  - description: get_sub_issues on the map returned 129k characters (full bodies) and overflowed to a file I had to parse with python just to list the frontier.
    solution: "Note in github-integration.md: parse the saved JSON for number/state/labels/assignees, or use list_issues with fields."
    severity: nit
  - description: The map-body update was denied by the provenance guard because I kept the original session's header line when rewriting the body.
    solution: Guard worked as designed; when rewriting an issue body, replace the header with this session's id.
    severity: nit
