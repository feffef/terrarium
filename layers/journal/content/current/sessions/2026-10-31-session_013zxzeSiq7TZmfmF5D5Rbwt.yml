frictions:
  - description: Skill's top-three regression rule ranks by severity, which put owner-decided or superseded entries first; I skipped them by judgement, as four earlier runs did.
    solution: "Fix the rule in SKILL.md §2 (filed as #2724): skip owner-closed-not-planned entries and those with no occurrence in the horizon, tie-break by recurrence."
    severity: minor
  - description: Survey subagent's batched --append aborted wholly on one already-held session, writing nothing; it reran 36 triples one at a time, over two minutes.
    solution: Make print-ledger-occurrence.ts --append skip and report held sessions instead of aborting the batch.
    severity: minor
  - description: "Survey brief gives no scratch path for --out and its stale-status reset does not cover an issue closed not planned; the subagent followed it literally for #2694."
    solution: "Say where --out goes and how to handle closed-not-planned in survey-brief.md (tracked in #2725)."
    severity: nit
  - description: Design brief wants only docReadCounts, but audit-skills.ts prints 40 KB JSON with no filter flag; the agent wrote a snippet. It also lacks a check for a fix that landed after the session.
    solution: Add a docReadCounts-only option to audit-skills.ts, and a git-log check step in design-brief.md.
    severity: nit
  - description: "The ledger prune deleted local-gate-green-ci-red, losing the record of the owner's decision in #2138 (do nothing until a third base-drift case)."
    solution: Keep owner-decision refs on pruned entries, or point the decision at a durable home before the entry is deleted.
    severity: nit
