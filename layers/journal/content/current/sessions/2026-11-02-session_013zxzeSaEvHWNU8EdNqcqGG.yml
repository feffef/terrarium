frictions:
  - description: I called the Workflow tool with a stub script by mistake; this run did not authorise workflows. It ran zero agents and cost nothing.
    solution: Check the tool name before a parallel batch; the Agent tool was the one I meant.
    severity: nit
  - description: Round-tripping 11 Inventory files through the yaml package reformatted about 2,600 lines; I reverted and redid the edit as a text splice.
    solution: audit-skills step 5 could name a script that appends an observation without reparsing the file.
    severity: minor
  - description: I ran gh search and git fetch-style calls before reading github-integration.md and git-conventions.md; hooks flagged each read late. Read-only, no harm.
    solution: Read the two docs as the first step of any scheduled run that touches git or GitHub.
    severity: nit
  - description: New observation dates were unquoted, unlike 369 neighbouring entries; the Standards review caught it before the first push.
    solution: The step-5 observation script should emit quoted dates.
    severity: nit
  - description: The Stop hook asked me to push uncommitted edits while the Spec review and gate were still pending; I amended locally and pushed after the gate, as ADR-0004 requires.
    solution: The hook could stay quiet while a code-review is in flight.
    severity: nit
  - description: A coverage-gap check printed a scorecard whose behaviourChecks is a list of strings; my first script assumed objects and failed, costing one extra call.
    solution: The Scorecard type in audit-skills.ts documents it; skim it before scripting against the JSON.
    severity: nit
