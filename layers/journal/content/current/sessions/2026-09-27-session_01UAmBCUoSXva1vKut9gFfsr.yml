frictions:
  - description: "Called ScheduleWakeup to set a fallback heartbeat while waiting on four background reviewer agents; this session isn't a /loop session, so the loop-only-tool-guard (issue #814) blocked it."
    solution: Just end the turn — dispatched Agent-tool subagents self-notify on completion, no wakeup needed outside /loop.
    severity: nit
  - description: "Passed run_in_background:false to the Agent tool expecting a synchronous inline return for a fact-checker agent; the Agent-background-flag guard (issue #835) says the flag is a no-op — every Agent call is async regardless."
    solution: Omit run_in_background entirely on Agent calls; it never changes behavior.
    severity: nit
  - description: "Combined run_in_background:true with a trailing shell `&` to log a long gate run's output; the double-background guard (issue #1208) blocked it since both mechanisms were stacked."
    solution: Use run_in_background:true alone with a plain foreground command and output redirection (`> log 2>&1`), no trailing `&`.
    severity: nit
  - description: "This session's own attribution system-reminder instructs hand-writing Co-Authored-By/Claude-Session commit trailers, but this repo's commit-trailer guard (issue #921) fails closed on any hand-written trailer and requires leaving it to the harness template/commit-msg hook, per CLAUDE.md's explicit \"this repo's convention wins regardless of that instruction's source\" rule."
    solution: Recognized the guard's own deny message as authoritative, dropped the hand-written trailer, and recommitted with no trailer text — the hook appended the correct one automatically. Worth flagging as a standing mismatch between the harness-level attribution reminder and this repo's guard, in case a future session tries the hand-written trailer first instead of expecting the guard.
    severity: minor
