frictions:
  - description: Ran git log on a lesson's history before reading git-conventions.md, as CLAUDE.md requires before the first non-read-only git command; a hook reminded me afterwards.
    solution: Use only read-only git listings before the doc is read, or read the doc first in a session that touches git.
    severity: nit
  - description: Edited the Verification Subject entry in layers/glassbox/GLOSSARY.md and committed before reading ADR-0021 or domain.md, which the glossary-terms rule asks for before changing a term.
    solution: Load the glossary-terms rule's read before the first edit to any GLOSSARY.md; the late read showed the edit was fine.
    severity: minor
  - description: Edited a lesson's intro without reading glassbox-lesson writing-pages.md, so I never checked whether its Pin step wants the revision refreshed after an edit.
    solution: Have the glassbox-content rule point at writing-pages.md so any lesson edit, not only a new lesson, loads the pin and check steps.
    severity: minor
  - description: Wrote that the gate can block a merge on every other Verification check without reading the sibling lessons; both reviewers flagged it and I removed it.
    solution: Check each sibling lesson for the claimed property before writing a claim about all of them.
    severity: nit
