summary: "The owner asked whether the Usability testing lesson belongs in Verification rather than Agents. I laid out the case for and against and asked two questions. The owner agreed it isn't a mechanical gate check, dismissed my only counter-argument (Agents losing its lesson about visitor agents), and then asked for a slight intro change explaining why it is a different but useful kind of verification while still an agent routine. Human-instructed: the move, the 85 slot (my suggestion, accepted), the intro rewording, and the PR (\"pr\"). Agent-initiated: repointing the three links, rewording the Verification Subject entry in the Glass Box glossary, trimming the intro after the two code-review sub-agents flagged an unverified claim that the gate blocks a merge on every other Verification check (the headless-browser lesson never mentions the gate) and a redundant sentence. Still open and unchecked: whether reading progress is keyed by path, so readers could lose the lesson's tick, and whether the lesson's revision pin needs refreshing after the intro edit."
