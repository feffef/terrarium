goal: Move Routine run costs out of the Skill Inventory
status: completed
outcome: PR 2247 merged; Routine run costs now live in a journal routines collection with mandatory run rows
summary: "The user asked, in their own words, to move the Routine cost data out of the Skill Inventory into a new Journal routines collection. Per their preference I asked first and they answered: one doc per Routine with a runs array, move existing rows and drop runCosts, extra fields durationSeconds and startedAt, current Space only, prune to the newest 30 runs through a script. The agent decided the file layout, the prune script, passing startedAt and durationSeconds through the audit-skills scorecard, and backfilling both from session logs. A code review found ADR-0015 and its rule out of step with audit-skills now writing routines; I fixed both and dropped a redundant test. The PR touches docs/adr and .claude/rules, so a human merged it after the gate went green. My first migration re-serialized the skill files and reformatted all their prose; I restored them and cut the runCosts block as text instead."
