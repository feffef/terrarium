frictions:
  - description: Ran git log on the skill files before reading git-conventions.md, which CLAUDE.md requires before the first git command beyond status and diff.
    solution: Read the doc at session start together with the glossary, or have the hook fire before the first Bash call.
    severity: nit
  - description: First migration script re-serialized skill YAML, reformatting every long prose field, so I had to restore the files and redo the edit as a text cut.
    solution: Edit YAML as text or with parseDocument for a field removal; check git diff --stat right after any data migration.
    severity: minor
  - description: The scratchpad cannot resolve node modules, so the migration script failed once and needed a temporary copy in the repo root.
    solution: Note in environment-caveats that one-off tsx scripts must run from the repo.
    severity: nit
  - description: Spawned two review subagents without invoking the dispatch-subagents Skill, which CLAUDE.md names for subagents that touch git; they only ran read-only git diff.
    solution: Say in CLAUDE.md that read-only subagents need no Skill, or invoke it anyway.
    severity: nit
