summary: "Human-instructed: the owner asked for branch protection on main that does not hurt the current workflow, session logs included. Research first: every direct push and merge on main is actor feffef (100 of 100 direct pushes, all session-log commits), the cloud session's GH_TOKEN is the owner's OAuth token, and a ruleset bypass can name only a role, team or App, so the only bypass that lets the lander through today is Repository admin, which also covers every agent session. Per the owner's preference I asked before building. They chose a staged path (guardrail ruleset now, a GitHub App identity for the lander later, owner keeping a pull-request-only bypass in the end state) and asked me to apply the ruleset via the API; they confirmed the exact JSON. The proxy refused the POST to the rulesets endpoint, so the config became a Proposal (docs/proposals/348-protect-main-ruleset.md) with the one local gh command, and stage 2 became issue 1689 (ready-for-human: creating the App and its secrets is a human act; the lander change is a later gated PR). Agent-initiated within that scope: updating the July research note (status paragraph, plus the exempt bypass mode GitHub added in September 2025), an environment-caveats bullet for the proxy refusal, and widening the proposals README to admit repository settings. Rules deliberately left off because each would break the workflow: required approvals above 0 (the owner identity authors every PR and cannot self-approve), strict up-to-date branches, linear history, signed commits. Not verified from GitHub's docs: whether an Always bypass actor's REST merge passes a red check silently; recorded in the Proposal as a safety-net question only. Second human prompt: \"update all documentation as if the change was already applied\". Did that as a second commit: the research note's closing section became the single home for main's current state (rules, bypass, omitted rules and why, the JSON to re-create it); the Proposal file was deleted since a Proposal records pending intent; the Dependabot proposal's \"main has no branch protection\" rationale was reworded; ADR-0009 gained a dated amendment pointing at the research note; issue 1689 and the PR description were repointed. CLAUDE.md was left alone because the open prune trial's territory covers it. Stated plainly to the owner: the API still showed no ruleset at the time of writing, so the docs describe a state the owner must create by running the recorded command. The owner ran it during a /code-review of the branch; the live ruleset (id 24740110) matches the approved JSON exactly, and this log's own landing is the first session-log push through the admin bypass."
