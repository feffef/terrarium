learnings:
  - GitHub's activity REST endpoint (repos/{o}/{r}/activity?activity_type=direct_push&ref=refs/heads/main) shows the pushing actor per direct push; it proved in one call that every session-log push is the owner's identity.
  - The Terraform GitHub provider's repository_ruleset docs mirror the REST ruleset schema (RepositoryRole ids maintain=2, write=4, admin=5; bypass modes always, pull_request, exempt) and are reachable when docs.github.com is not.
