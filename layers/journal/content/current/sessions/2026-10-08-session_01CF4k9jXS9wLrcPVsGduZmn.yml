frictions:
  - description: The agent proxy refuses POST repos/{owner}/{repo}/rulesets (403 'Write access to this GitHub API path is not permitted'), so the owner-approved ruleset could not be applied from the session.
    solution: Recorded in environment-caveats; the config shipped as a Proposal with a one-line local gh command. Stage 2 (issue 1689) notes the same proxy may block an App token mint.
    severity: moderate
  - description: docs.github.com and github.blog are blocked by the egress proxy, so GitHub's own ruleset docs and the exempt-mode changelog could not be read first-hand.
    solution: Used raw.githubusercontent.com/github/docs reusables (already the documented workaround) and the Terraform provider's ruleset docs for the REST schema; marked the changelog fact as second-hand in the research note.
    severity: minor
  - description: The proxy also blocks non-repo-scoped REST paths (apps/github-actions, repos/.../collaborators), needed for the required check's integration_id.
    solution: Read the app id from a PR head's check-runs payload (.check_runs[].app.id), a repo-scoped path; noted in the environment-caveats bullet.
    severity: nit
  - description: WebFetch caps quotations at 125 characters, so verifying doc wording needs several fetches and paraphrase instead of one verbatim read.
    solution: Ask for summaries plus short key quotes; keep the primary-source citation in the research note rather than the quote.
    severity: nit
  - description: Ran gh api read calls (rulesets, branch protection, activity) before reading docs/agents/github-integration.md, against CLAUDE.md's read-before-first-GitHub-operation rule; no harm, the doc then confirmed gh api reads are the right tool in the cloud.
    solution: Read the doc in the same first batch as CONTEXT.md when the task is GitHub-shaped.
    severity: nit
  - description: The harness's auto mode instructs reading files with cat/sed while CLAUDE.md says use the Read tool; followed auto mode for most doc reads.
    solution: None needed if the shell-read detector credits them (it did); otherwise CLAUDE.md's rule should say the detector makes shell reads acceptable.
    severity: nit
  - description: The harness Stop hook demanded a push while gate:scoped was still running, as CLAUDE.md predicts.
    solution: Already documented; ignored it and pushed after the gate passed.
    severity: nit
  - description: "SHELL-READ-DETECTION miss: `cat docs/adr/0009-session-logs-commit-directly-to-main.md && echo ===== && cat docs/adr/0003-agent-operating-model-and-governance.md && echo ===== && cat docs/adr/0004-objective-safety-gate.md` overflowed, the harness persisted the output to a tool-results file and showed a 2KB preview, and I read the full text with Read on that file; the detector credits only ADR-0009 (in the preview) and reports ADR-0003 and ADR-0004 as 'named by the command, but its output shows no line of this doc'. Both were read in full. Same session: .agents/skills/triage/SKILL.md was credited because an issue comment printed by `gh api .../issues/348/comments` quoted a line of it, which is a GitHub body echoing a doc, not a read."
    solution: "Let the trace follow a persisted-output pointer ('Full output saved to: <path>') and match the saved file's content, or treat a Read of a tool-results file as the Bash command's output. For the quoted-line case, consider excluding output of gh api calls that return GitHub bodies."
    severity: moderate
