frictions:
  - description: Dev server kept serving the old history page after editing history.md, even across dev-server restarts; stale Nitro route cache in .nuxt/cache/nitro/routes
    solution: rm -rf .nuxt/cache/nitro/routes before each capture; document this in docs/agents/verifying-ui-changes.md or have preview.ts clear it
    severity: moderate
  - description: preview.ts shot captured the cards prototype before hydration, so client-set labels were missing and the variant looked broken
    solution: Use a longer wait or captureScreenshotWaitingFor; a custom Playwright probe with networkidle plus 6s showed the real render
    severity: minor
  - description: ADR-0017 header names the model, but the harness forbids model ids in PR bodies; I used a generic 'Claude' header, which the guard accepted
    solution: ADR-0017 should say whether a generic name is acceptable, so the two rules stop conflicting
    severity: nit
