goal: Make the journal history page's table readable on mobile
status: completed
outcome: "Owner picked CSS-only table styling with scroll-edge shadows from three screenshotted variants; PR #1556 merged"
summary: "The owner reported, with a phone screenshot, that the table on /t/journal/current/history was unreadable on mobile. I found the cause (unstyled table in the existing JournalScrollTable wrapper: labels wrap word by word, last columns cut off with no scroll cue) and, per the owner's ask-first preference, offered three approaches instead of picking one. The owner asked to try all three with screenshots: content rewrite of the table, CSS for all journal tables, and stacked mobile cards (prototyped with client-side data-label injection, which has an SSR/no-JS gap). The owner asked how many other tables exist (only this one in journal content), then chose option 2. I generalised the scroll cue to all widths, tinted it from --jd-ink for dark mode, checked light/dark/desktop screenshots, ran gate:scoped (passed), and opened PR #1556, which the owner merged. All work was human-instructed; opening the PR is ADR-0003's default."
