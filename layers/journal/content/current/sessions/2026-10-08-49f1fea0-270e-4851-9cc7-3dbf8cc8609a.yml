summary: "Human-instructed: the user asked (one prompt, via /archify) for exactly two interactive diagrams based on docs/diagrams/nuxt-architecture.md and docs/diagrams/improvement-loop.md, using Explore agents where needed and free to override the briefs' layout proposals. Agent-initiated: two Explore agents spot-checked every brief claim and gathered line ranges for source links. They confirmed most claims but found six inaccuracies in the architecture brief: there is no `extends` (layers are auto-merged); useSpace only resolves/404s and pages call queryCollection; the home page reads Tenants through the routing map, not the Catalog; the Blog also reads across Tenants via queryPages; the 60 s cache covers only /t/**; deploy is rsync plus restart, not an atomic swap. These corrections went into the diagrams' cards and edges. The architecture diagram (build → request → isolation, five guided views, Human-only security frames) passed on the first finalize; I retargeted the home-page exception edge to the routing map, which removed its only crossing and matches the code. The improvement loop started as an Archify workflow (lanes), but its showcase gate rejects any crossing and this cyclic graph can't avoid one, so I rebuilt it as an architecture canvas with four row boundaries standing in for lanes; two auto-resolved crossings remain on \"Routines files issues\". Node tags render only at 175% zoom, so Human-only became a visible frame. Outputs are untracked in .archify/; nothing was committed, no PR opened, and the briefs themselves were not corrected (the user decides)."
