summary: "Human-instructed: the user asked (one kickoff prompt, via /artifact-diagramming) for exactly two interactive diagrams built from docs/diagrams/nuxt-architecture.md and docs/diagrams/improvement-loop.md, using Explore agents where needed and free to drop the briefs' layout proposals. Two read-only Explore agents verified the mechanisms (build pipeline, request path, Catalog reads, deploy loop; Routines, merge ledger, session-log schema, week counts) and I dumped expand(loadManifests()) to get the real 16 Spaces / 48 Collections / 14 Catalog entries. Layout choices were mine: the architecture diagram draws the content database as a floor plan (one room per Space) with clickable rooms that trace a request to exactly that Space, plus Catalog, 404 and home-page-exception traces; the loop diagram is a ring (rules -> Session -> log -> Routines -> PR -> Gate -> main -> rules) because the core graph is K3,3 and a ring with one hop over the Session->PR chord was the cleanest drawing. Both are generated by a small Node script into static inline SVG with vanilla JS stepping. The agents found the briefs out of date in places (Blog also reads via the Catalog; 108 not 107 Sessions this week; tables are _content_<key>; 60 s cache only on /t/**; home reads midden trench artifacts); the diagrams use the verified facts, but the briefs themselves were not edited. After seeing both artifacts the user said neither works well, for several reasons not yet spelled out, and chose to improve the briefs in docs/diagrams before trying again, so this attempt does not count as done."
