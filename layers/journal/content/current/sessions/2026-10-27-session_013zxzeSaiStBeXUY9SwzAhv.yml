summary: "The owner invoked grill-with-docs to refine an idea logged by session_01C8G2W6ZfQN7WE4UNUi2GzA (\"Friction Ledger opens on 14 days; default to 7 days\"). Before asking, I measured the content: the idea's \"47 clusters\" was stale (130 clusters on 14 days today; 88 on 7 days), so 7 days cuts about a third, not most. One round of five questions settled it; the owner agreed with all recommendations: the goal is relevance not length, the \"collapse below top 10\" half stays out of scope, a separate LEDGER_DEFAULT_DAYS keeps the 14-day horizon for pruning and fix states, ?days=14 becomes explicit, and the intro separates retention from the default view. The owner then green-lit building it and opening a PR. Code-review found no hard findings; I applied its three judgement calls (default referenced inside LEDGER_WINDOWS, exact comment wording, test uses the constant). Full gate passed; a production build confirmed 88 rows / 8,245px by default vs 130 rows / 11,873px on 14 days."
