frictions:
  - description: Survey brief's list_issues CLOSED paging asks for a heavy scan; the survey agent substituted a gh api scan, and the survey omitted each regression's severity-since that its brief requires.
    solution: Have the survey brief require the since column copied per regression, and name the cheap closed-issue scan.
    severity: minor
  - description: The design brief says pick sessions by 4-letter suffix and 'retro and visitor-loop' for pick 1, but one session was a glassbox-improve run; the designer had to read the log to learn that.
    solution: Have the survey report the Skill and full session id for each candidate session.
    severity: nit
  - description: The design brief asks the designer to time a script but also to change nothing in the repo, and timing needs a git fetch; the fix shipped untimed.
    solution: Let the design brief say whether a fetching run counts as a repo change, or move timing into the build step.
    severity: minor
  - description: A stop hook asked me to push twice while the gate ran; git-conventions forbids pushing in the same command as a gate, so I had to push in separate calls.
    solution: Fine as is; the separate-call rule worked.
    severity: nit
  - description: The skill's regression rule files an issue for minor and nit recurrences too; I filed three issues for sub-moderate regressions where earlier fixes had mostly dropped designs.
    solution: Rank regressions by cost since the fix, not only by severity, so repeat nits do not take the three slots.
    severity: nit
  - description: "I typed a full SHA from the short hash in my #2836 verdict update, the exact slip the verdict-comment-hand-typed entry records; I fixed the comment one call later."
    solution: Run git rev-parse HEAD in the same step before writing any Reviewed line.
    severity: nit
  - description: I passed both -m and -F to git commit, which git rejects; the failed commit left the branch unchanged and I redid it.
    solution: Use only -F for commit messages, as git-conventions says.
    severity: nit
