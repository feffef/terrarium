learnings:
  - Reading innerText of a closed <details> returns empty, so an audit counts its links as unnamed; use textContent.
ideas:
  - "[blind, content editor] /t/midden: Latest-finds cards open with lowercase fragments (the instructions for reading the project's decisions) and show no cause. Give each a capitalised title and the cause chip used on the Trench index, so the cards read as titles."
  - "[blind] /t/midden/trench: the list shows 16 prose cards. Add a one-sentence verdict per find (for example 'closed after 90 minutes: bought nothing'), so a visitor can pick a story in seconds."
  - "[blind] /t/midden: finds are only listed by report. Add a clickable timeline strip of when finds were discarded, from the Stores' season data, to show the rhythm of the Platform's discards."
  - "[blind] /t/midden/trench/*: evidence links go to raw GitHub commits and blobs with no hint. Mark them external and say they open GitHub, since a visitor lands on a bare diff."
  - "[content editor] /t/midden/trench/stood-down: the first find is one ~330-word paragraph of dates and PR numbers. Split it into what it did, why it went in and how it ended, or lead with its sharpest fact, so it can be skimmed."
  - "[content editor] /t/midden/trench/barely-cold: the standfirst says 'closed when its own CI went unstable' and cites an '@nuxt/content #236 client-DB patch', and a find is titled 'copy-link affordance on session/digest heads'. Plain the wording, and add a line that Fresh finds are assessed while still open, since the grade sits inside the find's own 14-24 Jul life."
  - "[content editor] /t/midden/trench/what-the-record-claimed: the standfirst is one ~60-word run-on of stacked clauses. Replace it with a short list-like sentence naming the four finds, so a newcomer can parse it."
  - "[content editor] /t/midden/trench/the-thirty-day-exception and the-first-almanac: both open 'This site holds', where they mean 'This report' (the same slip is logged for the-simpler-verdict). Change to 'This report holds'."
  - "[content editor] /t/midden/stores: the season index shows ISO dates ('from 2026-10-05') while every report uses '16 Jul 2026'. Use the report date style, so the two read as one catalogue."
  - "[UI tester] /t/midden/trench/<report>: the 'In this report' list is closed inside a details element, behind a long prose lead, with a 17px-tall summary. Open it by default or add a 'Jump to finds' link, so a phone visitor reaches the finds quickly."
  - "[UI tester] /t/midden/trench/<report>: the last breadcrumb shows the slug ('short-lives'). Show the title ('Short Lives'), since the crumb reads like a file path."
  - "[UI tester] /t/midden/trench and /t/midden/stores: the focus outline is the browser default 1px on beige. Use a 2px accent outline with an offset, so keyboard focus is easy to see."
