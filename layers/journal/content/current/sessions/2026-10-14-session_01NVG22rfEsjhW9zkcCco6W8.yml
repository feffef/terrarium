summary: "The owner's single kickoff prompt asked for a live test of today's merged changes (PRs 1946 to 1951), with no GitHub writes or pushes; I did everything agent-side from that instruction and no step was human-steered afterwards. I read CONTEXT-MAP.md and CONTEXT.md, cut a branch from origin/main, pushed nothing and wrote only this log. Results. 1 FAIL (PR 1946). `cat .claude/rules/guards.md; ls /nonexistent-path-xyz` exited 2 and its result held only the cat output and the ls error; no \"Files this command read are governed by these rules\" hint. The control `cat docs/agents/guards.md` also showed none (expected, no rule governs it). 2 BLOCKED (PR 1949). The task has me read the rules' paths frontmatter first, which marks tenant-layers, mdc-when-to-use and mermaid-lanes as loaded, so later reads could not show them. Observed: layers/atlas/tests/unit/almanac-state.spec.ts loaded nothing (2a, matches expectation but uninformative); layers/atlas/app/composables/webViewBox.ts and layers/atlas/content/floor/pages/rubra-territa.md loaded nothing; layers/atlas/tenant.config.ts loaded only adr-0002. The log-session report lists none of those three rules as loaded for me. In a fresh context the subagent did see tenant-layers load after its layers/atlas/app read (it could not say which of its two reads triggered it), a hint that 2b works. 2c and 2d are untested. Rerun with a session that reads those files before the rule files. 3 PASS (PR 1951). Reading scripts/poll-guest-tickets.ts in ../tt-sibling loaded nothing; reading it in .claude/worktrees/tt-inner injected adr-0023.md. Both worktrees were removed. Caveat: just before, I ran `grep -c . .claude/rules/adr-0023.md` in Bash, which did not load the rule. 4 PASS (PR 1948). In .claude/worktrees/tt-hop with both files committed, `pnpm exec tsx scripts/human-only-paths.ts` printed `.claude/rules/guards.md` only and exited 0; worktree and test/hop branch deleted. 5 PASS (PR 1950). adr-0004.md reads \"If this rule seems relevant to your task, you must read the full ADR first (about 1000 tokens):\", as expected; the same line is in every ADR rule. I judged the pointers mostly not applicable and opened no ADR. 6 PASS (PR 1947). A general-purpose subagent read docs/agents/tenant-layers.md and layers/atlas/app/composables/almanac.ts and reported both first lines. SendMessage worked and returned a verdict list. Pass (c) without subagentVerdicts listed docs/agents/tenant-layers.md and the tenant-layers rule under \"no verdict from subagent\" and asked me for nothing on them. Pass (d), a ruleVerdict for adr-0025.md, was refused with exit 1 and left the scratch byte-identical. Pass (e) with subagentVerdicts no longer listed them, and reminded me that the adr-0021 \"no\" verdict was omitted. | Check | Result | | 1 PR 1946 hint on failed Bash | FAIL | | 2 PR 1949 narrowed globs | BLOCKED | | 3 PR 1951 worktree rules | PASS | | 4 PR 1948 human-only-paths | PASS | | 5 PR 1950 ADR pointer | PASS | | 6 PR 1947 subagent verdicts | PASS |"
