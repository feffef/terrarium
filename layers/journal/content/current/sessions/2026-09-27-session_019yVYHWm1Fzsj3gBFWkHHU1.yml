frictions:
  - description: "auto-triage's eligibility rule (unlabelled = always eligible) has no skip for a wayfinder spec issue, which carries no triage label by convention, so #1375 surfaces on every sweep and burns a subagent"
    solution: Add a spec skip next to the wayfinder:map skip in auto-triage/SKILL.md (a one-clause change), or have list-open-issues.ts flag specs
    severity: minor
  - description: Subagent briefs repeated ~40 identical lines seven times; the per-issue brief could be a committed template the orchestrator references by path
    solution: Ship the per-issue unattended brief as a file under the auto-triage Skill and pass only the issue number
    severity: nit
  - description: 'SHELL-READ-DETECTION false positive: credited CONTEXT.md from `grep -n -A12 "^### Session$\|^### Session\b" CONTEXT.md | grep -i -A2 "interactive\|delegated\|autonomous" | head -30`, which printed "(Bash completed with no output)" — exactly the #1355 placeholder bug (CONTEXT.md was later read via the Grep tool, so only the shell credit is wrong)'
    solution: "Fix #1355 (now ready-for-agent): treat the no-output placeholder as empty"
    severity: moderate
  - description: "I briefed impl agents to put a model name in the PR provenance header, which the harness forbids in PR bodies — the exact #1422 gap, caught before any PR opened"
    solution: PR 1438 now teaches the free-text label and the `Claude` fallback in the guard deny message
    severity: minor
  - description: Auto-mode classifier denied a plain read of docs/agents/pr-workflow.md right after a deliberate live guard probe; the user had to say 'retry the edit' before it went through
    solution: Nothing repo-side; note that a probe that trips a guard can make the next unrelated call look suspicious
    severity: minor
  - description: Classifier denied a sed that updated the tee verb list in guards.md, the .sh header and the spec header (Self-Modification), so PR 1439 ships with three stale comment/doc mentions
    solution: Use the Edit tool per file for guard-adjacent docs instead of one batched sed; the user can finish the three wording updates
    severity: minor
