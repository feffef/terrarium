frictions:
  - description: I read docs and skills with cat via Bash instead of the Read tool, against CLAUDE.md's 'Read files with the Read tool' rule, so some rules may not have loaded
    solution: Use Read for doc and skill files; keep Bash for listings and git
    severity: minor
  - description: I didn't read docs/agents/issue-tracker.md and triage-labels.md in full before triage, which CLAUDE.md requires; the triage agents did the labelling, but the orchestrator still decided set membership
    solution: clear-backlog section 1 could name those two docs as orchestrator reads, or say explicitly that only the triage agents need them
    severity: nit
  - description: The workflow's .output file wraps the script's return value under a 'result' key, so my first parse failed with KeyError
    solution: clear-backlog could say that the task output file nests the return value under result
    severity: nit
  - description: The explore run's grouping chained six unrelated issues into one branch through transitive shared files, so I had to regroup by hand
    solution: Group only on direct file overlap in clear-backlog-explore, not on the transitive closure
    severity: minor
  - description: The 1940 build agent reported gatePassed while saying it had not rerun the gate after its last round, and it could not do a live hook check in-session
    solution: Have clear-backlog-build re-run gate:scoped on the final commit before it returns ready-to-push
    severity: minor
  - description: The 1937/1938 build hit the 3-round review cap with two one-line findings open, so I fixed them by hand
    solution: Let clear-backlog-build return the open findings with ready-to-push when they are all small, or allow a 4th fix-only round
    severity: minor
  - description: Builds of PRs that touch the same adr-0002 pointer line ran in parallel, so the second needed a manual conflict merge and restamp
    solution: Have clear-backlog group branches that regenerate the same stamped files, or order them
    severity: minor
  - description: My first test-session brief told it to read the rule files before the governed files, which loaded those rules early and hid two of the six checks; it needed a second session
    solution: When briefing a rule-loading test, order the steps so that no step loads a rule a later step checks, and work out each step's expected rules up front
    severity: minor
  - description: I ran git checkout origin/main -- with no path, which detached HEAD in the main checkout, against git-conventions; I restored the branch right away
    solution: Read files from main with git show origin/main:path, as git-conventions says
    severity: nit
  - description: I briefed the 1947 build with a separate subagent-verdict list and card section without asking the owner how it should look; it shipped and needed a redesign PR (1964)
    solution: When a change alters what a person sees, put the layout to the owner as a grilling question before building
    severity: moderate
