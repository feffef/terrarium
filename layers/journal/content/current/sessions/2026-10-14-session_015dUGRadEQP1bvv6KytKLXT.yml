frictions:
  - description: I read docs and skills with cat via Bash instead of the Read tool, against CLAUDE.md's 'Read files with the Read tool' rule, so some rules may not have loaded
    solution: Use Read for doc and skill files; keep Bash for listings and git
    severity: minor
  - description: I didn't read docs/agents/issue-tracker.md and triage-labels.md in full before triage, which CLAUDE.md requires; the triage agents did the labelling, but the orchestrator still decided set membership
    solution: clear-backlog section 1 could name those two docs as orchestrator reads, or say explicitly that only the triage agents need them
    severity: nit
  - description: The workflow's .output file wraps the script's return value under a 'result' key, so my first parse failed with KeyError
    solution: clear-backlog could say that the task output file nests the return value under result
    severity: nit
  - description: The explore run's grouping chained six unrelated issues into one branch through transitive shared files, so I had to regroup by hand
    solution: Group only on direct file overlap in clear-backlog-explore, not on the transitive closure
    severity: minor
  - description: The 1940 build agent reported gatePassed while saying it had not rerun the gate after its last round, and it could not do a live hook check in-session
    solution: Have clear-backlog-build re-run gate:scoped on the final commit before it returns ready-to-push
    severity: minor
