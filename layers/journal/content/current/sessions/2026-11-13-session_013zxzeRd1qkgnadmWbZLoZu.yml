frictions:
  - description: The first Digest draft had five wrong or misleading claims; I wrote three Specimens from a WIP commit message and misattributed a rule to PR 3138 without reading the merged code (CLAUDE.md, Verify before you state).
    solution: Read the merged file or diff for every number and attribution before drafting; the fact-check subagent caught all five before the PR.
    severity: minor
  - description: digest.ts gather titled PR 3151 with its merge commit subject, an owner-approval note about ADR-0004, not the PR's real title, so I first misfiled a 51-file Glass Box PR as an instructions change.
    solution: Have gather take the title from the PR branch or the body's first line when a merge used --owner-approved, or flag such titles.
    severity: minor
  - description: My first lookup of 20 PR merge commits used a grep that matched nothing and fell through to HEAD, printing the same session-log commit 19 times.
    solution: scripts/git/list-recent-prs.ts --diff, which github-integration.md names, would have given the touched files directly; I read that doc only later.
    severity: minor
  - description: Wrote under layers/journal without reading layers/journal/GLOSSARY.md (tenant-glossary rule); the Digest avoids glossary terms by design, so nothing came of it.
    solution: Read the Tenant glossary before the first write; the rule loaded only after the gather step.
    severity: nit
  - description: The Stop hook demanded a commit and push while the fact-check was still running, so the draft was pushed before its corrections and the fixes became two follow-up commits.
    solution: Harmless here, since a push opens no PR; a hook that tolerates a running background agent would keep the history to one commit.
    severity: nit
  - description: The Digest prose was 264 words against the Skill's 250 cap; code-review caught it and it cost one more commit before the gate.
    solution: Count the prose words before committing the draft.
    severity: nit
  - description: The Stop hook reported that a PR merged and demanded close-session right after I started merge-pr.ts in the background; PR 3224 was still open and waiting on CI.
    solution: Have the hook check the PR's merged state, not that a merge-pr.ts command ran.
    severity: nit
