frictions:
  - description: Stop hook flagged uncommitted changes while claim-check agents were still running, four times, forcing partial commits mid-run.
    solution: Let a scheduled run's Stop hook skip while a subagent is in flight, or accept commits as progress saves.
    severity: nit
  - description: I drafted a commit message with a mistyped session id before remembering the commit-msg hook adds the trailer.
    solution: State in the attribution reminder that the hook adds the Claude-Session line, so none is typed by hand.
    severity: nit
  - description: Every follow-up after code-review (7 prose files) needed a second two-agent code-review because merge-pr.ts counts it as non-simple.
    solution: None needed; the cost is the intended safety net, but a glassbox-update note could say to fold review fixes in before the first review.
    severity: minor
