learnings:
  - plain.ts puts each term's definition inside the sentence and strips link syntax from code, so fresh-reader findings about long brackets or a missing link in an excerpt can be rendering artifacts
  - gate:scoped aborts if the tree changes while it runs, so any edit after code-review means a gate rerun
ideas:
  - Make plain.ts show each term's definition after its sentence and keep link syntax in code, so fresh readers stop reporting rendering artifacts as page defects; it is a small script change in the glassbox-curate Skill that needs the owner's merge
