  - A Blog post's route is /t/blog/<persona>/<file-stem>; the Persona Space slug is the link prefix, not part of the document path
  - The Journal on-ramp is a two-column grid, so a fourth card is what squares it off rather than leaving a ragged row
ideas:
  - A scripts/verify-quotes.ts that checks a quoted line against its source file with whitespace and markdown-link normalisation, and reports miss/false-positive. Every citation-heavy Skill (blog-post, digest, midden-survey) currently re-implements this check by hand or skips it, and this session hit five false mismatches in one pass of forty quotes.
