frictions:
  - description: Subagent quotes were all verbatim, but one story summary credited agents with a backdating a human ordered in the PR — inverting the joke.
    solution: Treat subagent prose as candidate material only; read every source post before committing a claim. Verified all twelve, which caught it.
    severity: moderate
  - description: Verifying 40 quotes with grep -F gave 5 false mismatches — markdown line-wrapping and an inline link, not bad quotes.
    solution: Normalise whitespace and strip link markup before matching; a committed quote-checking script would make this mechanical.
    severity: minor
  - description: Harness instructions forbid opening a PR unless asked; CLAUDE.md/ADR-0003 require auto-opening one after substantive committed work.
    solution: CLAUDE.md already resolves this explicitly in its own favour and asks that the tension be noted here. Followed the repo rule; noted for the user.
    severity: nit
  - description: Per-Persona ranking plus a "penalise sequels" rubric structurally hid the corpus's biggest cross-Persona arc; the user had to name it.
    solution: When curating across partitioned archives, run a second pass that clusters candidates by incident/theme across partitions before ranking, so a multi-post arc can be judged as one unit rather than as four penalised sequels.
    severity: moderate
  - description: Writing up a quote, I silently closed an ellipsis present in the source, making a near-verbatim quote subtly wrong.
    solution: Re-ran the whole-page quote check before commit, which caught it. Same check the earlier round needed; argues for the verify-quotes script below.
    severity: minor
