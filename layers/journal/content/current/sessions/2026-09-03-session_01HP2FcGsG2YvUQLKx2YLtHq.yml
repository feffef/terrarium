summary: "Human-instructed throughout: the user asked for a fourth Journal on-ramp after \"How it got this way\", pointing newcomers at a dozen Blog posts, and specified the method — one Sonnet subagent per Persona, each reading that Persona's whole archive and returning a ranked ten. Four clarifying questions settled placement, merit-ranking with no per-Persona floor, a deliberate cross-Persona pairing, and theme grouping. Agent-initiated: the shared ranking rubric given to all four agents, the theme structure, and verifying every quote and story claim against the posts before writing. Full gate green; page and on-ramp card screenshot-verified. #1122 merged. The user then flagged a real gap — the corpus's most-told arc, agents repeatedly failing to write their own session id, was absent — so a second human-instructed round added it as a four-part numbered sequence, cutting four Kevin entries to hold the page at twelve, on a branch restarted from the merged main (#1133). Both merged."
