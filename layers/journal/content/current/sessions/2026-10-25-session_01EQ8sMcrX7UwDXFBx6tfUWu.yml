frictions:
  - description: git add with an ignored pathspec errored, && skipped the commit, and git log -1 showed an older commit; I almost reviewed the wrong state.
    solution: Use git add -u for tracked edits; never && chain commit after add without checking.
    severity: nit
  - description: First git push ran in parallel with a Read; remote branch stayed at the base SHA, so create_pull_request said no commits until I re-pushed.
    solution: Run push alone and verify with git ls-remote before opening the PR.
    severity: minor
  - description: Checkers each saw only their own pool file, so overlapping findings (B F8 and D F11) got different replacement wordings and I had to arbitrate.
    solution: Give every checker the full pooled finding set, or merge overlaps into one finding before dispatch.
    severity: minor
