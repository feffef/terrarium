frictions:
  - description: Ran git log on a worktree before reading docs/agents/git-conventions.md; a hook reminded me after the command. No harm, the command was read-only.
    solution: Read git-conventions.md together with github-integration.md at the start of clear-backlog, since §3 always uses git.
    severity: nit
  - description: Labelled issues with issue_write before reading docs/agents/issue-tracker.md; a hook flagged it afterwards. Labels were right (I had read triage-labels.md).
    solution: Add issue-tracker.md to the clear-backlog read-first list next to triage-labels.md.
    severity: nit
  - description: The build workflow's builder replied `recheck Both` on a branch that had Standards and Spec reviewers; I had to guess both should be re-checked.
    solution: Have rules() name the branch's actual axes in the recheck line, or tell builders to use the axis names the run printed.
    severity: nit
  - description: The explore workflow's grouping put all four ready issues in one group although none share a file; I overrode it by hand into three branches.
    solution: Make run-summary --triage group by the files each result lists, not one group when every pair is merely related.
    severity: minor
  - description: "Retro, builder (unverified by me): rules() forbids && and ; in a worktree yet prescribes the gate command with cd and &&; its own chained call was refused, taking a turn and skipping pnpm install, so vitest was missing."
    solution: State in rules() of .claude/workflows/clear-backlog-build.js that every Bash call is one plain command (writes through Write and Edit) and the gate command is the only chain.
    severity: minor
  - description: "Retro, builder: the hooks docs fetch was truncated before the SubagentStop section, so stop_hook_active and agent_transcript_path stayed unverified and the PR carries that caveat."
    solution: Add a docs/research note on the hook payload fields, or have the brief name the doc section to fetch.
    severity: minor
  - description: "Retro, reviewers (their claims, unverified by me): briefs gave no line ranges (code-review SKILL.md section 3, harvest.ts:361 for the stopped check), so each searched; read-only reviewers also paid rule-use echo round trips."
    solution: Have reviewPrompt() in .claude/workflows/clear-backlog-build.js carry file paths and line numbers for spec sources and say the smell list is section 3 only.
    severity: nit
  - description: "Retro verdict on review value: the Standards re-check caught a real defect (loop cap relied on an unconfirmed field) and the Spec round caught a missing test; the small-diff watchFor branch's review found only nits."
    solution: Keep the review rounds; no cut is supported by evidence from this run.
    severity: nit
