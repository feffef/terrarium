learnings:
  - PreToolUse genuinely intercepts Bash tool calls in this cloud environment — observed live when the new guard denied two of my own probes, which answers the residual both deferred-tool-guard.md and loop-only-tool-guard.md record as unresolved
  - A guard that pattern-matches command strings will block authoring content about itself; the repo's Write-over-cat convention is already the workaround
  - All 34 open issues had AI-authored most-recent activity, so auto-triage's human-authored eligibility branch matched nothing at all
  - The rejection of CI-enforced doc invariants is not absolute — two doc/metadata gate checks merged after it was recorded, and the line falls between a prose property and a structured artifact checked against its own schema
ideas:
  - Extract `scripts/guard-harness.ts`. Five PreToolUse guards now duplicate `denyUninspectable`, `denyOutputFor`, the flag parser, and the `import.meta.url` bootstrap almost verbatim; the fifth instance is the point to collapse them. Deliberately not done in PR 946 because it would drag four human-only-to-merge guards into that diff — so it needs its own change.
  - Add `scripts/triage-eligibility.ts` emitting one record per open issue with everything auto-triage's step 1 needs — labels, last-comment provenance, assignees, native blocked_by AND the body "Blocked by:" fallback, author association, and the wayfinder:map skip — so the sweep starts from one command instead of three scripts plus ad-hoc curl, and the body-fallback blocker this session missed cannot be missed again.
  - "Make the rulebook migration table refreshable instead of a one-off: a script that lists the in-scope corpus (deriving repo-authored Skills from skills-lock.json) and diffs it against the table's row set, so a rule added to CLAUDE.md after 2026-08-13 shows up as an unclassified gap rather than silently aging the asset out of date."
