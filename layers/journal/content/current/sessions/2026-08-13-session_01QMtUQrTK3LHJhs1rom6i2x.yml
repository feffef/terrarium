learnings:
  - PreToolUse genuinely intercepts Bash tool calls in this cloud environment — observed live when the new guard denied two of my own probes, which answers the residual both deferred-tool-guard.md and loop-only-tool-guard.md record as unresolved
  - A guard that pattern-matches command strings will block authoring content about itself; the repo's Write-over-cat convention is already the workaround
  - All 34 open issues had AI-authored most-recent activity, so auto-triage's human-authored eligibility branch matched nothing at all
  - The rejection of CI-enforced doc invariants is not absolute — two doc/metadata gate checks merged after it was recorded, and the line falls between a prose property and a structured artifact checked against its own schema
  - "`foldSubagentTrace` unions subagent transcripts into `filesRead`/`filesEdited`/`skillsUsed` only; `models`/`toolCounts`/`durationSec` stay the parent's, deliberately, so a reader cannot compare `toolCounts.Read` against a `filesRead` drawn from a different population"
  - A merged-and-deleted remote branch makes `--force-with-lease` fail with "stale info", which reads as a lease conflict rather than as the branch being gone
ideas:
  - Extract `scripts/guard-harness.ts` AND collapse the guard docs, as one change — two findings that point at the same seam. Five guards duplicate `denyUninspectable`, `denyOutputFor`, the flag parser and the `import.meta.url` bootstrap almost verbatim; separately, the four `docs/agents/*-guard.md` notes are the same five sections four times (283 lines describing one mechanism, in a directory CLAUDE.md describes as per-repo skill configuration). One harness plus one shared doc on the guard pattern replaces both piles. Deliberately not done in PR 946 because it drags four human-only-to-merge guards into that diff.
  - Add `scripts/triage-eligibility.ts` emitting one record per open issue with everything auto-triage's step 1 needs — labels, last-comment provenance, assignees, native blocked_by AND the body "Blocked by:" fallback, author association, and the wayfinder:map skip — so the sweep starts from one command instead of three scripts plus ad-hoc curl, and the body-fallback blocker this session missed cannot be missed again.
  - "Make the rulebook migration table refreshable instead of a one-off: a script that lists the in-scope corpus (deriving repo-authored Skills from skills-lock.json) and diffs it against the table's row set, so a rule added to CLAUDE.md after 2026-08-13 shows up as an unclassified gap rather than silently aging the asset out of date."
  - Export the folded-field list from `session-trace.ts` as one constant and have `SessionCard.vue` render its subagent note from it, so the prose cannot contradict the code. The note just drifted for a month undetected because it restates a split the code owns — the same single-home failure the repo already polices in docs, applied to user-facing UI copy, which nothing currently checks.
  - Give `scripts/probe.ts` a `--wait-ms` (or `--wait-for <selector>`) flag. Every caller probing a hydrated Vue control currently has to hand-roll a `setTimeout` inside the evaluated expression, and the failure mode when they forget is a silent empty result that looks like a wrong selector rather than a timing problem.
