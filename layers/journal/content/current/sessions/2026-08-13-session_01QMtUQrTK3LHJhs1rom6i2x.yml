frictions:
  - description: Resolved "blocked" only from GitHub's native issue_dependencies_summary; issue 869's body-line blocker was invisible, so its subagent got wrong grounding.
    solution: auto-triage's step 1 should read both blocker representations — issue-tracker.md already documents the body "Blocked by:" line as the fallback.
    severity: moderate
  - description: No single helper emits the sweep's eligibility record; needed three scripts plus hand-rolled curl for assignees, blockers and author association.
    solution: Extend last-comment-authors.ts, or add a sibling, to emit the complete per-issue eligibility record the sweep's step 1 actually consumes.
    severity: minor
  - description: issue_write rejects a PR number when the call carries state or state_reason, though a labels-only update on the same number succeeds.
    solution: Record in github-integration.md that closing a PR needs two calls — labels via issue_write, then state via update_pull_request, which has no labels param.
    severity: minor
  - description: The gh binary is absent in this container, so every issue field the helper scripts do not expose had to go through raw curl against REST.
    solution: Already partly handled by the scripts' rest fallback; the gap is coverage of fields, not of transport.
    severity: nit
