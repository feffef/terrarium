frictions:
  - description: Wrote a 109-line `docs/agents/commit-trailer-guard.md` documenting a 213-line script — a second copy of facts the code owns, which is the duplication this repo's single-home rule exists to prevent.
    solution: "Deleted it; residuals and false-positive shapes now sit above the patterns they describe. Worst part was the residual-fail-open list: it described what the regexes miss, from another file, where it rots on the next regex edit."
    severity: moderate
  - description: Challenged on that doc, I defended it from precedent — the brief asked for it, all four siblings have one — instead of evaluating whether the pattern was right. The user had to push twice.
    solution: '"Every sibling does it" is how a bad pattern reaches five copies. When I finally checked, `docs/agents/` is described as per-repo skill configuration and the four guard docs are the same five sections four times.'
    severity: moderate
  - description: The PR body claimed this change answered a residual both sibling guard docs leave open. Their actual open question is ordering — whether PreToolUse fires before the harness's own handling — which a Bash probe cannot test.
    solution: Caught by reading both docs before writing the note, not before writing the PR body. An "I confirmed X" claim needs the *other* document's exact wording read first, not recalled.
    severity: moderate
  - description: Deleting the doc left four dangling references — CLAUDE.md, the spec header, the pre-filter comment, the research table's own exclusion row. I fixed three, then re-grepped with a wider include list and found the fourth.
    solution: Grep for the filename across every extension before deleting a referenced file, not after. My first pass omitted `*.sh`.
    severity: minor
  - description: Asserted a 137-row aggregate in the research asset from estimation, not counting. The real figure was 208 — off by ~70.
    solution: "Caught only because I then parsed the file to check. This is exactly #871/#933's failure class, authored into a doc whose own CM-32 row describes it."
    severity: moderate
  - description: The guard I built blocked my own workflow twice — writing and probing files whose text contains an example git commit plus an example trailer.
    solution: Use the Write tool, which CLAUDE.md already prefers over cat. Documented as a known false-positive shape, and `--dry-run` gained `--input-file`.
    severity: minor
  - description: My guard module's header claimed the detection contract was single-homed in its doc and then restated it verbatim.
    solution: Caught by the Standards review, not by me. Cut to pointers. Authoring the exact defect the rule warns about, while writing a table classifying that rule.
    severity: minor
  - description: A bad `--input-file` fell through to the hook's fail-closed catch, so a dry run emitted a deny control object.
    solution: Handle it explicitly in dryRun with exit 1. Found only because the test was written before the code.
    severity: minor
  - description: "#867 needed ~5,400 lines of corpus read by hand; no tooling enumerates the rule set or its boundary."
    solution: The skills-lock discriminator was scriptable, but rule extraction was manual. A corpus-lister would make the table refreshable rather than a one-off.
    severity: minor
  - description: Resolved "blocked" from GitHub's native dependency summary only, so issue 869's body-line blocker was invisible and its subagent got wrong grounding.
    solution: auto-triage's step 1 should read both blocker representations — issue-tracker.md already documents the body-line fallback as the only one MCP exposes.
    severity: moderate
  - description: No single helper emits the sweep's eligibility record; three scripts plus hand-rolled curl for assignees, blockers and author association.
    solution: Extend last-comment-authors.ts, or add a sibling, to emit the whole record.
    severity: minor
  - description: issue_write rejects a PR number when the call carries state or state_reason, though a labels-only update on the same number succeeds.
    solution: Record in github-integration.md that closing a PR needs two calls — labels via issue_write, then state via update_pull_request.
    severity: minor
  - description: A user-facing sentence describing a code-level split drifted for a month and was caught by a human reading the page, not by CI. No test pinned it, and none could have.
    solution: Fixed the prose and pointed a comment at `foldSubagentTrace`, but that is the weakest guard — it relies on the next author reading it. Deriving the note from one exported field list would make divergence impossible.
    severity: moderate
  - description: '`git push --force-with-lease` failed with "stale info" on a branch whose PR had merged. The remote ref was deleted on merge, so the stale local tracking ref failed the lease against a branch that no longer existed.'
    solution: "`git remote prune origin` first, after which a plain push recreates the branch and no force is needed. Worth a line in git-conventions.md — the error text points at the lease, not at the deleted ref."
    severity: minor
  - description: "`scripts/probe.ts` evaluates its expression immediately after `page.goto` with no hydration wait, so clicking a hydrated control silently no-opped and returned an empty result that read like a bad selector."
    solution: Hand-rolled a `setTimeout` inside the probe expression. A `--wait-ms` flag, or a `networkidle` waitUntil, would stop every caller re-deriving this.
    severity: minor
  - description: "`preview.ts shot` with a `#anchor` fragment returned a top-of-page capture rather than the anchored card, so the intended visual check produced nothing useful and I fell back to a DOM probe."
    solution: The DOM probe was the better verification anyway (a screenshot cannot prove text). Worth checking whether the anchor scroll needs a post-hydration wait before CLAUDE.md keeps advertising it for below-the-fold content.
    severity: minor
  - description: An already-fired one-shot `send_later` Routine still reports a future `next_run_at` in `list_triggers`, so a finished check-in reads as still-armed.
    solution: "`ended_reason: run_once_fired` is the field that actually settles it — check that, not `next_run_at`. Nearly spent a `delete_trigger` on an already-disabled Routine at closure."
    severity: nit
