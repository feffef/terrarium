outcome: "PR #3473 open for a human merge; vigia already runs the Node 26 image"
summary: "The owner asked directly for this: address issue 1552, update Node in the Docker build, deploy to vigia and update the types. Per the owner's earlier choice in the issue, the target is Node 26 LTS (26.13.x). engines, the Gate action's node-version, the deploy image tag and @types/node all moved to 26. The issue also listed deploy/README.md and ADR-0011, but on main they already name no Node version. On its own initiative the session found that Node 25+ no longer bundles corepack, which would have broken the image's `corepack enable`, and added a pinned `npm install -g corepack` before it. Review found a stale \"Node 22\" in a Glass Box page; it was dropped there, along with the version number. The scoped gate passed under a locally nvm-installed Node v26.13.1. The first run failed only in e2e: no Chromium for the newly locked playwright-core. Deploying was the owner's ask, and they acknowledged the downtime (\"ok\"). The image was built first on vigia and smoke-tested (node, corepack and pnpm 10.33.0 via corepack), then the container was recreated. It rebuilt main on Node 26 in about 50s, reports healthy and serves 200 publicly. Still open: the host clone at /opt/terrarium/repo sits on node-26 until the merge. Sessions on Node 22 are now below the engines floor; pnpm only warns."
