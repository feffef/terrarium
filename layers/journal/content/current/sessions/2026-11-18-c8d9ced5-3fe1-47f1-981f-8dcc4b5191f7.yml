frictions:
  - description: "First gate:scoped failed all e2e: SessionStart install bumped playwright-core to 1.65 but no matching Chromium was installed locally."
    solution: SessionStart hook could run `playwright-core install chromium` when the locked playwright-core version changes, or the gate could print that fix.
    severity: minor
  - description: My One-home-per-fact grep for Node 22 skipped layers/ (zsh --include glob error) and missed Glass Box prose; reviewers caught it.
    solution: Use `git grep` over the whole tree for fact sweeps, not grep with --include globs in zsh.
    severity: minor
  - description: ADR-0003 asks to subscribe to PR activity, but this local CLI session has no subscribe_pr_activity tool; step skipped.
    solution: ADR-0003 or pr-workflow.md could name the local-session substitute (poll gh pr checks) for subscribing.
    severity: nit
  - description: Edited a Glass Box page without first reading layers/glassbox/GLOSSARY.md, as tenant-glossary.md requires; edit was a one-word removal.
    solution: Read the Tenant glossary before any edit under layers/, however small.
    severity: nit
