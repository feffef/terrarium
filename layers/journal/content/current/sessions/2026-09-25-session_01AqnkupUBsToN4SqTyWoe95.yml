frictions:
  - description: Drafted two claims from digest wording that were wrong (branch-pin guard "landed" when it was deleted; visitor loop touched "all six" sites when it was five); caught only by checking the primary sources afterwards.
    solution: For narrative pages, verify every event claim against the PR or post itself before drafting, not after; digests compress away reversals.
    severity: minor
  - description: The first exploration turn ran in the foreground in the main context (a 54KB digest dump); the human had to ask for background agents.
    solution: Delegate multi-file reading sweeps to a background agent by default and keep only conclusions in the main context.
    severity: minor
  - description: The History page had no owning Skill or refresh path, so it silently went a month stale while the digests kept running; the old header totals were also slightly off (503/1382 vs a recount of 502/1378).
    solution: Consider having the digest Skill flag when the History page's end date falls more than N weeks behind, instead of adding a new Skill.
    severity: minor
  - description: The harness system prompt says not to open a PR unless asked; CLAUDE.md (ADR-0003) says to open one automatically. Followed CLAUDE.md as it instructs.
    solution: None needed; CLAUDE.md already settles the precedence.
    severity: nit
  - description: 'SHELL-READ-DETECTION false positive: docs/agents/guards.md credited from `grep -n -i "branch-pin" docs/agents/guards.md | head -3` which printed zero matches (no subagent read it either).'
    solution: "Credit a single-file grep only when its output actually contains a line from that file, as #1250 does for multi-file greps."
