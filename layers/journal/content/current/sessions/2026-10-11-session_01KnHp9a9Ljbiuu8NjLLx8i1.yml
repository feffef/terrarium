frictions:
  - description: CLAUDE.md requires reading docs/agents/github-integration.md before this session's first GitHub operation. I ran several mcp__github__ calls (issue_read, issue_write, add_issue_comment, subscribe_pr_activity) before reading it — only read it incidentally, right before opening the PR.
    solution: No damage this run (no overflow, no HTML-entity-encoding mishap), but it was blind luck. Read the trigger docs before the first matching tool call, not after — check the "docs you must read first" list against the next tool call before making it, not just at session start.
    severity: minor
  - description: "CLAUDE.md requires reading docs/agents/issue-tracker.md and docs/agents/triage-labels.md before filing, triaging, or labeling an issue. I filed issue #1752 and commented on #1586 without reading either doc first."
    solution: The label I used (`needs-triage`) happened to match convention by precedent from reading other Skills' instructions, but that's luck, not verification. Read the issue-tracker/triage-labels docs before the first issue_write/add_issue_comment call of a session that will file or label, not after.
    severity: minor
  - description: CLAUDE.md's dispatch-subagents trigger ("before you dispatch a subagent that touches git or needs a worktree") is ambiguous for a read-only investigative subagent that runs git-log/gh-api reads but performs no write and needs no worktree. I dispatched 11 such subagents without reading the Skill first, then read it later for an unrelated reason.
    solution: No damage (no collision, since nothing wrote). Worth a line in CLAUDE.md or the Skill itself clarifying whether a strictly read-only git-inspection subagent is in scope for the trigger, so this stays a judgment call rather than a guess next time.
    severity: nit
