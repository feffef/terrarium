frictions:
  - description: "My first GitHub call (issue_read on #3247) came before I read github-integration.md, which CLAUDE.md says to read first; a hook then asked for it."
    solution: Read the doc in the same early batch as the other pre-reads, or let the Skill's own step name it.
    severity: nit
  - description: I read decisions.md only after filing the bugs, so one idea (a session-log tour strip) was checked against it late.
    solution: Have step 3 of the visitor-loop Skill name decisions.md as a file to read before marking anything.
    severity: nit
  - description: The brief's 'without changing directory' rule has no reason, so two visitors hit ERR_PNPM_RECURSIVE_EXEC_NO_PACKAGE after a cd; the brief also names resolveChromiumPath where launchChromium adds the sandbox flags.
    solution: In visitor-brief.md say pnpm needs the repo as cwd, and point to launchChromium.
    severity: minor
  - description: The brief says to follow the site's links, but Journal sessions and digests open in place, so the UI tester's first crawl stopped at 8 pages.
    solution: Add a line to the context file saying sessions and digests open in place and where digests live.
    severity: minor
  - description: The Stop hook reported one unpushed commit after I fast-forwarded the session branch to origin/main; no commit of mine existed.
    solution: The hook could count commits not on origin/main; git-conventions.md already gave the push fix.
    severity: nit
  - description: One of my own verification scripts had a syntax error in a page.evaluate string and needed a second run.
    solution: Pass evaluate a plain string built once, as the brief says, and test it on one page first.
    severity: nit
