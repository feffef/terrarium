learnings:
  - Journal sessions and digests are in-page expanders, not links; a link-following crawl stops after about 8 pages, and digests are reachable directly at /t/journal/<space>/digests/<date>.
  - pnpm exec tsx fails with ERR_PNPM_RECURSIVE_EXEC_NO_PACKAGE when the shell's cwd is outside the repo, so a visitor must not cd into its scratch directory.
ideas:
  - "Digest Also-shipped lines: name every PR (a bare number like #2919 on 2026-11-07 tells a reader nothing) and group the long runs, about 25 items on 2026-11-12, into a few themed items."
  - "Journal Skills and Routines pages: make 'runs on a schedule' one fact, since Skills groups only 7 as ROUTINE while Routines lists 11, with harvest and glassbox under SPECIALIST."
  - "Journal Routines page: mark a Routine that has not run (harvest shows $0.00 over 0 runs) and say which window each total covers (audit-skills $380 over 30 runs against a four-week table)."
  - "Journal landing, digests and Ideas page: gloss repeated jargon (Routine, Walkthrough, re-pinned) where it first appears, for example from GLOSSARY.md."
  - "Journal Ideas page: group the 95 ideas by Tenant and say they are unreviewed; a status mark overlaps an already logged idea."
  - "Journal landing: open with one plain sentence on what the place is, and show the latest digest news, before the nine stat tiles."
  - "Journal Friction Ledger: split the 150 to 170 word intro, move the fix-state definitions into a legend below the chart."
  - "Journal landing KPI tiles: the Frictions tile wraps its severity row so 447 nit sits alone; let the row wrap evenly."
  - "Journal landing: a worst friction of the week card carrying the agent's own quote, since the most human content is buried in the ledger."
  - "Journal session feed: filter by outcome, PR or no PR, and friction count, so the archived wall of rows has a way in."
  - "Journal Friction Ledger: a strip of the three most severe open clusters above the long list."
  - "Journal digests: a new-since-your-last-visit badge kept in the browser's localStorage."
  - "Journal Highlights page: a filter by persona or month for the twelve stories."
  - "Journal landing footer: one descriptive line beside the Midden, Atlas and Tinkerfund links."
