  - description: "The sweep PR has two commits though audit-docs asks for one: the Stop hook had me push the first commit while a code-review finding was still with the checker, and a pushed commit can't be amended."
    solution: Resolve every code-review finding in the same turn before ending it, or let audit-docs accept a review follow-up commit.
    severity: minor
  - description: "Skipped CLAUDE.md's read-first trigger for a cross-cutting review: never read the overview layers/glassbox/content/guide/pages/index.md before dispatching reviewers."
    solution: No harm seen (reviewers and checker worked from primary sources); a line in audit-docs §1 naming the overview would have made me read it.
    severity: nit
  - description: The checker's own CONFIRMED-BUT rewording of the CLAUDE.md log/blame clause was still ambiguous; only code-review's Standards axis caught it, costing a checker resume and a second commit.
    solution: Ask the checker to test each corrected text for a second reading before returning it.
    severity: minor
  - description: The worker restarted at session start; I had to re-derive from git and the empty scratchpad that no step had run.
    solution: Nothing lost this time; a progress marker in the scratchpad after each audit-docs step would make a restart cheap.
    severity: nit
