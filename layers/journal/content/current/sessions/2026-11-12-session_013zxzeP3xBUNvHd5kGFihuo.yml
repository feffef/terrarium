frictions:
  - description: My first survey dispatch was denied by the dispatch-read guard because I had not read dispatch-subagents; I read it and retried unchanged.
    solution: Read dispatch-subagents before the first brief; frictions-to-fixes could name it before its first dispatch step.
    severity: minor
  - description: The retry was denied again because my own prompt mentioned the literal curly-braced scratch placeholder while explaining it; I reworded it.
    solution: The guard could ignore a placeholder named inside backticks, or the briefs could say to hand them by path without naming it.
    severity: nit
  - description: Survey-brief says a tracked entry must point at something open, but SKILL §5 says a dispatched fix gets no ref until §8; the Standards reviewer flagged the empty ref.
    solution: Say in survey-brief §2 that an entry tracked for a dispatched fix has no ref until the closing PR.
    severity: minor
  - description: SKILL §5 says review the ledger PR by the simple-change test, but a 58-file data-only diff fails the count, so I ran full code-review on machine-written YAML.
    solution: "Say what a ledger PR needs: its content spec and gate, or one reviewer on occurrences."
    severity: minor
  - description: The Stop hook asked me to push twice while the gate was still running on the head, so I had to explain and wait.
    solution: The hook could stay quiet while a gate log exists without an exit marker.
    severity: nit
  - description: "close-session was prompted by the Stop hook after the first merge, not run by me when #3125 opened."
    solution: Run close-session in the same turn that opens a PR, before ending the turn.
    severity: minor
  - description: "Survey subagent: with about 140 Frictions for 38 sessions, matching and appending needed a scratch script, and session-id prefix mistakes cost five retries."
    solution: Let print-ledger-occurrence take a session id prefix and skip held sessions instead of aborting.
    severity: minor
  - description: "Survey subagent: list-merges-since output lacks dates and subjects for merge commits, so it made about 60 per-PR gh api calls to date fixes."
    solution: Add merged_at and title to list-merges-since --merges-only output.
    severity: minor
  - description: "Design agent: the brief has no step for a ledger entry whose premise is wrong (explore writes by design), and does not say how to read the Human-only paths."
    solution: "Add to design-brief §1: verify the entry's cause against source first; §5: name the rule file's paths field to read."
    severity: minor
