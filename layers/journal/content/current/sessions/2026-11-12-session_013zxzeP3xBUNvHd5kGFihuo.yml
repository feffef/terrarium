summary: "Scheduled frictions-to-fixes run, no human prompt. A survey subagent updated the Friction Ledger (about 80 occurrences, 4 new entries, 5 fixes recorded, 3 stale statuses reset). I filed regression issues #3123 (subagent-brief-defects) and #3124 (harness-proxy-blocks); #3110 already tracked the third regression. One never-fixed pick, explore-agent-writes-to-tracker: the design agent found the ledger cause wrong (explore writes by design; the Skill never says so), so the fix is 3 lines in clear-backlog SKILL.md, built by a Sonnet agent, reviewed with code-review, merged as #3126. Ledger PR #3125 and the closing ledger PR #3127 (records fix #3126) also merged, each after a green gate. Left for the next run: misread-owner-instruction (possible third occurrence, owner call), minor regressions, simplify-cut-drops-needed-instruction (one occurrence). All work was agent-initiated under the schedule; no human instruction."
