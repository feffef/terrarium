frictions:
  - description: Edited the post's description after validate:content last passed and never re-ran it, so the gate failed on an unquoted colon in the YAML.
    solution: Run pnpm validate:content after any frontmatter edit, or have the Skill's fact-check loop end with it.
    severity: minor
  - description: Each small wording fix needed its own checker re-dispatch and a fresh blob, four rounds in all, for a post of about five paragraphs.
    solution: Batch all review and checker fixes into one edit before re-checking; the Skill could say so in step 9.
    severity: minor
  - description: Ran git push in the same Bash call as the backgrounded gate, which git-conventions says never to do; nothing broke.
    solution: Push in its own call before starting the gate.
    severity: nit
  - description: Typed a placeholder session id in my first commit message; the commit-msg hook replaced it with the real trailer, so no harm.
    solution: Copy the id from the attribution reminder before writing the message.
    severity: nit
