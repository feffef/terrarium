summary: 'The user invoked glassbox-curate with no focus. I asked once which focus to take (their stated preference is to ask first); they answered "let the run choose", so I ran in autonomous mode: agent-initiated focus, chosen by me. I ran the orientation script, rejected a git-hooks Lesson (the repo has one hook, already taught by Commit and PR attribution), and confirmed a real gap: the guide never covered the scripts/ui capture tools that several Skills depend on. An opus writer drafted verification/09 Headless browser checks; a sonnet claim checker found nine items (three Why-bullet costs the cited file never states, a screenshot.ts flag that belongs to preview.ts, imprecise stop/PID wording) and a fresh reader asked for sample output and the package choice; I fixed those. code-review Standards and Spec axes found more; I applied the valid ones, kept the preview.ts verb list (a fixed interface) and the dev-warning watch item. Gate green on the pre-review head; the review fixes were prose-only. Opened PR 2908, set pr in the run entry, subscribed, posted my verdict once CI gate was green on the head, and merged it with merge-pr.ts. Open: playwright.dev was unreachable, so the Full reference was checked against raw docs source; the Try it install commands were not run.'
