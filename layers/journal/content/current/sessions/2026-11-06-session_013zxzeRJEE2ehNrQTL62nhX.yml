frictions:
  - description: Ran my first git command and first GitHub call before reading git-conventions.md and github-integration.md; hooks pointed to them only after the call.
    solution: Read the CLAUDE.md-triggered docs before the first matching command; a PreToolUse guard could deny the first non-read-only git or GitHub call until that doc is in the transcript, since the hint arrives only after the call.
    severity: minor
  - description: Piped orient.ts output through head -300, which truncated the guide-pages section of its output.
    solution: Redirect orient output to a file and read it whole.
    severity: minor
  - description: A Bash call set run_in_background and also ended in an ampersand; the double-background guard blocked it and nothing ran.
    solution: Pass run_in_background alone with a plain foreground command.
    severity: nit
  - description: Wrote the run entry's focus with an unquoted colon-space, which broke the runs YAML and failed validate:content until quoted.
    solution: Quote free-text YAML values in run entries; the curate Skill could say so.
    severity: minor
  - description: Read pr-workflow.md only after review and gate had started, though CLAUDE.md asks for it before opening a PR.
    solution: Read the PR doc before starting the review step.
    severity: nit
  - description: The curate Skill says autonomous mode asks nothing, while the user's preference is to ask first; I had to reconcile them by asking one focus question.
    solution: Let the Skill say an interactive invocation with no focus should ask one question.
    severity: nit
  - description: Safety-gate bot comments and a check-suite event named commits other than my PR head, briefly looking like a green on my head; I had to confirm the gate run itself.
    solution: Have the gate comment and event name the PR head they cover, or say when they are for a merge ref.
    severity: nit
