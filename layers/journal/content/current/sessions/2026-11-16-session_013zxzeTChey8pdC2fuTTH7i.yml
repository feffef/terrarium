frictions:
  - description: Launched the explore Workflow without first reading dispatch-subagents; a guard blocked it and I retried after reading.
    solution: Name the dispatch-subagents read in clear-backlog's explore step, or have the Skill's Workflow instruction point at it.
    severity: nit
  - description: Stop hook said a PR merged and demanded close-session, though this session opened and merged none; cost an extra closure pass.
    solution: Have the hook check the session's own PRs, not any merge event, before demanding close-session.
    severity: nit
  - description: The two explore summaries came to about 80 KB, mostly repeated background and sourcesRead, all read in full before asking questions.
    solution: Let run-summary.ts --triage print a trimmed view (question, options, pick, files) and keep background behind a flag.
    severity: minor
  - description: Mistakenly applied the prototype patch with a placeholder git apply, so the 'before' screenshots needed a stash and a second capture.
    solution: Write a script that shoots before and after in one go, and never leave a placeholder command in a tool block.
    severity: nit
  - description: Dev server returned 500 after git stash and pop under it; restarting it cost two retries.
    solution: "docs/agents/verifying-ui-changes.md: restart the dev server after stashing or restoring files under it."
    severity: nit
  - description: First Excerpt screenshots were hidden behind the sticky On this page bar, so I re-shot twice.
    solution: Document the sticky-bar scroll offset in verifying-ui-changes.md or give the shot script an offset flag.
    severity: nit
  - description: Round 3 for merge-pr-retry ran four agents over a missing-test already refused with proof and accepted by the re-check.
    solution: "clear-backlog §3 step 4: a missing-test the re-check accepted as refused-with-proof should not trigger a further round."
    severity: minor
  - description: Each later review round needed the full branch entries (long briefs) resent to the workflow by hand, three times.
    solution: "Let clear-backlog-build take branch entries from a saved run (by run id) when review: true."
    severity: minor
  - description: Two of six gates failed on the unrelated timing test shell-reads.spec.ts when run alongside another gate, costing a rerun each.
    solution: Loosen or isolate the timing assertion in tests/unit/shell-reads.spec.ts, or cap concurrent gates at one.
    severity: minor
  - description: "Linked worktree(s) left with uncommitted or unpushed work at close: /home/user/terrarium/.claude/worktrees/wf_3a42b15e-529-3"
    solution: Push each, or remove it if its work is meant to be dropped.
    severity: minor
  - description: Piped the first log-session --author output through head, which close-session forbids; I re-ran it unfiltered and found no warning.
    solution: Print the run's output through a tool that cannot truncate, or have log-session --author refuse a piped stdout.
    severity: nit
