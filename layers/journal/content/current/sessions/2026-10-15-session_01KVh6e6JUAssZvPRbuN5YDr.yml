summary: The user directly asked for a background Sonnet agent to browse the Glass Box guide, take desktop and mobile screenshots and give a tech-curious visitor's impressions. The first agent failed because the sandbox network policy blocks terrarium.feffef.de (403 on CONNECT). I offered two options; the user answered "use the local prod build then". I ran pnpm build, started scripts/preview.ts, dispatched a second agent against the local URL, then stopped the server. The agent produced desktop and mobile shots and a review (hero too long, no architecture overview, no links to ADRs or glossary, ragged card grid). Everything was human-instructed; I made no repo changes and opened no PR.
