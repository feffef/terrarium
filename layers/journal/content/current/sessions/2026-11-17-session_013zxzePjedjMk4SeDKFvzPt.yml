frictions:
  - description: The Stop hook said a PR merged and demanded close-session twice, and a PostToolUse hint did too, when this session had merged nothing; I had only run commands naming merge-pr.ts.
    solution: Fix 3412 landed hours earlier; check whether it covers the PostToolUse hint and the Stop hook for commands that only grep or log the script name.
    severity: minor
  - description: Blog-post step 2 asks for the newest three posts of all four Personas and the last five blog( PR bodies; I listed filenames and read only David's three posts.
    solution: Give the step a script that prints those posts and PR bodies in one call, so skipping the read costs more than doing it.
    severity: minor
  - description: I read the Blog glossary and ADR-0012 only after drafting and the first save, although the tenant-glossary rule says read it before working on a Tenant.
    solution: Have blog-post step 5 name layers/blog/GLOSSARY.md as a read before drafting.
    severity: nit
  - description: The first fact-check pass found an inexact quote, an ambiguous within-a-day claim and an unverifiable that-morning time, forcing two re-check rounds.
    solution: At drafting time, quote primary text verbatim and state time claims as explicit UTC times from the event.
    severity: minor
  - description: The dispatch-read guard blocked my first subagent call until I read the dispatch-subagents Skill, costing one retry.
    solution: None needed; the guard worked as designed.
    severity: nit
