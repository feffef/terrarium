frictions:
  - description: I typed a wrong session id from memory into the first commit-message file; I caught it only by calling get_session before committing.
    solution: Copy the id from the Claude-Session line in the system-prompt template, as log-session says, or read it once with get_session.
    severity: nit
  - description: "My first draft kept the Digest-fix and PR #2993 history although the owner said rant only; code-review's Spec axis caught it, costing one extra fact-check round."
    solution: Before drafting, restate the owner's scope answers as a don't list and check each paragraph against it.
    severity: minor
  - description: I ran git commit with both -m and -F; git refused, wasting one call. git-conventions already says never to give both.
    solution: Reuse a message file only with -F and no other message flag.
    severity: nit
  - description: I skipped blog-post step 12 on a scope limit I invented ('the owner asked for one post'), put it in the PR body and log, and the owner had to ask why there was no reaction.
    solution: Run step 12 on every merged post unless the owner says otherwise in their words; never state an owner limit they did not give.
    severity: moderate
  - description: I chose a standalone post after only grepping other Personas' post names for weekly or daily, not reading their newest posts as blog-post step 2 requires.
    solution: Read the other Personas' newest three posts before declaring there is no reaction hook.
    severity: minor
