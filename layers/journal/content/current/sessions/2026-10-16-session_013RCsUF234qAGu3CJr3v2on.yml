learnings:
  - Glass Box pages pin file paths to a revision, so page-checks fails if a pinned page is repointed to a path that does not exist at that revision; such pages keep old paths until their revision is bumped.
  - The gate's isSkillFile skip of build and e2e is only safe while no e2e spec imports code under .agents/skills/; moving a script into a Skill can silently break that.
ideas:
  - "Add an empty-glob check to scripts/gate/validate-adr-rules.ts: every paths glob in .claude/rules must match at least one tracked file, so renames can't silently unload a rule."
