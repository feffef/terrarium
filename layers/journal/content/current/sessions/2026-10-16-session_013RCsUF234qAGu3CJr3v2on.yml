frictions:
  - description: "Filed the umbrella issue with #TBD placeholders for sub-issues, then had to rewrite the whole body once numbers existed."
    solution: Create sub-issues first, or the umbrella last with real numbers; or keep the plan list only in native sub-issues.
    severity: nit
  - description: Explore subagent's report was very long (~6k tokens); much of the per-file table was not needed for the proposal.
    solution: Brief subagents to return only findings that feed the decision, with the full table written to a scratch file.
    severity: nit
  - description: "Opened PR #2189 after the first issue landed but did not invoke close-session then, against CLAUDE.md's 'Invoke close-session when you open a PR'; the session log stayed stale for hours."
    solution: Invoke close-session in the same turn as create_pull_request; a PostToolUse hint on create_pull_request could remind.
    severity: minor
  - description: "Subscribed to PR #2188 by guessing the next number before create_pull_request returned #2189; had to unsubscribe and resubscribe."
    solution: Read the PR number from the create result before subscribing; never predict ids.
    severity: nit
  - description: "Posted the subagent's file count (67) in issue #2183 without checking; ls showed 68, so the issue needed a correction. Broke 'Verify before you state'."
    solution: Recount any number a subagent reports before it goes into an issue.
    severity: minor
  - description: "My #2186 brief did not exclude dated content, so the agent rewrote three dated blog posts to new paths; a review caught it and they were reverted."
    solution: "Every move/rename brief lists dated content (journal, blog, pinned Glass Box pages, docs/research) as untouchable; done from #2187 on."
    severity: minor
  - description: A read-only review agent ran prune-friction-ledger.ts without flags to check imports; it rewrote 7 Journal friction files in the worktree, which it then restored.
    solution: Scripts that write by default should need an explicit --write; until then, review briefs name which scripts must not be run without flags (added from round 2 on).
    severity: minor
  - description: validate-adr-rules passes rules whose paths glob matches no file, so ADR-0007's rule silently stopped loading after the move until a review spotted it.
    solution: Make validate-adr-rules fail on a paths glob that matches no tracked file (tenant-layers.md already has one such glob).
    severity: moderate
  - description: Impl agents repeatedly hit the worktree shell guard on compound commands, heredocs and variable expansion, and worked around it with helper scripts; one ran a stale helper left in the shared scratchpad.
    solution: Briefs tell agents to name scratch helpers uniquely; consider documenting the guard's triggers where dispatch-subagents points.
    severity: minor
  - description: Amended my own merge commit with a needless git commit --amend while checking its trailer.
    solution: Inspect with git log -1 rather than amending.
    severity: nit
  - description: Mid-merge, conflict markers in scripts/lib/adr-rules.ts made skill-inline-guard crash at module load, so guard-wrap.sh blocked a Skill call until the conflict was resolved.
    solution: Resolve conflicts in scripts/lib/ before any Skill or guarded tool call; or keep guards' import graph away from lib modules that change often.
    severity: minor
  - description: main landed the empty-glob check in the old scripts/validate-adr-rules.ts while this branch had split it, giving a content conflict plus a spec whose new fixtures used the old flat layout.
    solution: Land large file moves quickly, or announce them so parallel PRs target the new layout.
    severity: minor
