frictions:
  - description: Did not read GLOSSARY-MAP.md then GLOSSARY.md in full at session start, against CLAUDE.md's "at session start" rule, before acting on the scheduled prompt
    solution: Read both at the very start of every session before acting, even when the scheduled prompt already carries extensive inline context
    severity: moderate
  - description: First GitHub operation (mcp__github__list_issues) preceded reading docs/agents/github-integration.md; a PostToolUse hook caught it after the call rather than before
    solution: Read the doc proactively before the first mcp__github__* call rather than waiting for the hook's reminder
    severity: nit
  - description: First non-status/diff git command (git log --follow, to draw a conclusion about commit history) preceded reading docs/agents/git-conventions.md; a PostToolUse hook caught it after the fact
    solution: Read the doc before the first such git command, not after the hook flags it
    severity: nit
  - description: Read several reference docs (GLOSSARY.md's Importance/Role section, pr-workflow.md's gate-skip rule) via Bash grep instead of the Read tool, against CLAUDE.md's Read-tool rule (ADR-0029)
    solution: Use the Read tool even for a quick section lookup, not grep, so a file's own rules always load
    severity: nit
  - description: Polled a long-running background gate with many no-op Bash echo calls instead of simply waiting for its own completion notification, wasting turns
    solution: After starting a run_in_background command, stop calling tools and let the completion notification arrive rather than polling
    severity: minor
