outcome: "PR 3055 merged: gist under each chart name and on weekly-table hover, with an e2e assertion"
summary: "The owner asked (direct ask) that the Routine charts on /t/journal/current/routines show the Skill's title from the Skill Inventory, since they showed only the name. The Inventory has no title field, so I asked four questions; the owner chose the gist field, under the name, always visible in the charts and on hover in the weekly table, name only when there is no gist (all human-decided). I built it agent-initiated as the smallest join: the page also loads the skills collection and attaches each gist to the Routine of the same name; no stored field changed. After pushing I stopped and asked about a PR; the owner said to open it, which ADR-0003 already required. Then I ran code-review (two read-only subagents; no hard findings, one real spacing typo fixed, one subagent miscounted Routines) and the gate, and opened PR 3055. Before merging I noticed no test observed the gist, which ADR-0004 would have sent to a human; I added a one-line e2e assertion (agent-initiated), reran the gate, posted my verdict and merged with merge-pr.ts."
