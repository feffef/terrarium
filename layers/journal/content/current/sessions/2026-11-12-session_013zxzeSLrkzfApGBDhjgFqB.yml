summary: "The owner asked, in one line, that Where next links in Glass Box lessons show the book for lessons and a right arrow for other places like the Journal. Human-instructed: the feature itself and its answers to my questions (arrow is →; Lessons and Walkthroughs both; book for any Glass Box page, matching inline links; read-state behaviour the same as inline links), the go-ahead to run the gate and open the PR, and \"add a test\". Agent-initiated: the shared --gb-book token, the 12px gap before the row mark (I saw the book touching text in a screenshot), one glossary sentence, and merging once CI was green. Verified in a dev preview in light and dark. The gate passed and the two review agents found nothing hard. After the gate, I judged ADR-0004's untested-behaviour exception applied, since the row mark is CSS no test saw, and held the merge; the owner chose an e2e test over a human merge, I added it (computed ::after on the cloud-sessions Lesson, which lists both kinds), CI went green, and merge-pr.ts merged it. The test is tied to that page keeping a Journal link in Where next."
