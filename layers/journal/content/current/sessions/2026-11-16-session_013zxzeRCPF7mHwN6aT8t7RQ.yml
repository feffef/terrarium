frictions:
  - description: Ran git apply and git restore on the sample edits before reading git-conventions.md; the hook told me only afterwards. The restore was safe because I had saved the patch.
    solution: List docs/agents/git-conventions.md in the clear-backlog Skill's section 2 (samples), where it first runs git.
    severity: nit
  - description: The first Workflow call was blocked by the dispatch-read guard, because I had not read dispatch-subagents; I read it and retried. A saved workflow's brief lives in the repo, so the read changed nothing.
    solution: Have the guard skip a saved clear-backlog workflow, or name the Skill in clear-backlog's opening line.
    severity: nit
  - description: Relabelled four issues ready-for-agent before reading triage-labels.md, and only grepped issue-tracker.md; the later read showed clear-backlog may set the label, so the call was right.
    solution: Point clear-backlog section 2 at triage-labels.md, since it tells the run to set the label.
    severity: nit
  - description: The dev preview kept serving the old Journal Markdown after I edited it, so the first screenshot showed the old text. I found it by probing the DOM and restarted the server, about four extra calls.
    solution: "Add to verifying-ui-changes.md: restart the dev server after editing a content file, since it serves cached content."
    severity: minor
  - description: "A PR body with a bare angle-bracket tag was blocked by the guard, so the first create_pull_request for #3385 failed and I reworded and retried."
    solution: The guard worked as designed; the PR-body recipe in pr-workflow.md could say to describe tags in words.
    severity: nit
  - description: The second-round rule fired on four small branches because round 1 held a spec-mismatch, defect or both, though each fix was one line or one sentence. Round 2 found only nits, costing about 600k subagent tokens and four extra workflow runs.
    solution: Let a small branch stop after a clean re-check of its fix (extend the small flag), or limit round 2 to defects above a size.
    severity: moderate
  - description: "The #3386 builder ran the gate on an uncommitted test fix, so HEAD moved afterwards. That forced a reviewer re-check and a second full gate, about ten extra minutes."
    solution: Tell the builder in its rules to commit before it gates, or to gate only a clean tree.
    severity: minor
