learnings:
  - Playwright's newPage({ colorScheme }) is enough to shoot a page in dark mode when its theme follows prefers-color-scheme or light-dark().
  - The GitHub PR-files API reports a rename under filename only; the old path is in previous_filename, the same blind spot as git diff --name-only without --no-renames.
