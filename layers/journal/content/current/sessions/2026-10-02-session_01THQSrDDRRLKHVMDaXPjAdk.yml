frictions:
  - description: "Dispatched the Explore agent with run_in_background: false; the Agent-background-flag guard denied it and I re-dispatched."
    solution: Guard worked as designed; omit the flag on Agent calls.
    severity: nit
  - description: First draft of the CSS sharp-edges section cited PR numbers from memory of the candidate doc and three were wrong; caught by mapping each learning's session log to its PRs.
    solution: Map citations from the originating session's prs field before writing, not after.
    severity: minor
  - description: Judge subagents stated repo facts that were wrong or incomplete (Opus called the countdown trivial while e2e pins its exact text; Sonnet used only 4 tool calls but quoted line numbers).
    solution: Verify each disputed judge claim against source before merging rankings, as done here.
    severity: minor
  - description: System prompt forbids model ids in PR bodies while ADR-0017's header example names the model; used the generic 'Claude Code' link text, which earlier PRs also used.
    solution: ADR-0017 could state whether the header's link text must name the model or may be generic.
    severity: minor
  - description: First draft of the CSS sharp-edges section cited PR numbers from memory and three were wrong; a further citation (#1383 for the storage rule) was still wrong and only the Spec review caught it.
    solution: "Cite from the code comment or session log that owns the fact (here utils/demo.ts names #1358/#1359), never from a nearby story number."
    severity: minor
  - description: My first --scheme implementation hand-rolled flag parsing and copied the DERIVED_REASON string instead of reusing extractFlag and sharing the constant; the Standards review flagged both, costing a second push.
    solution: Before adding a flag or constant, grep for an existing parser/constant and move it to a shared home rather than duplicating.
    severity: minor
