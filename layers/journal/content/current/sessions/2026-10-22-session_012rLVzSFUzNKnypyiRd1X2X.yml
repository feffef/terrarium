frictions:
  - description: The user's term usageShare matched no field; it took several greps to map it to subagents[].tokenShare
    solution: Name the field tokenShare in the card's note so a reader asking for it uses the stored name
    severity: nit
  - description: Ran gate:scoped before code-review, then edited during the run; pr-workflow says review first and edit nothing until the gate ends, so one gate run was wasted
    solution: Make scripts/gate/gate.ts record HEAD and the working-tree state at start and fail at the end if either changed, so a stale run is caught mechanically
    severity: minor
  - description: User asked me to run /retro after the merge; the Skill has disable-model-invocation, so it needed an extra user turn
    solution: Let a Skill the user names in a prompt run by model, or list user-only Skills so the agent can say so up front
    severity: minor
  - description: adr-check's relevant-adrs.ts printed all 30 ADR summaries (about 6k tokens), including the always-loaded ones, for a 30-line display change
    solution: Skip the always-loaded rules (no paths) and print one line per ADR, so the agent opens only the summaries that bear on the change
    severity: minor
  - description: log-session --author listed a reviewer subagent's shell command as this session's own read, asking me to account for it
    solution: Have scripts/session/shell-reads.ts tag each shell read with the agent that ran it, as the rules report already does
    severity: nit
