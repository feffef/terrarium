summary: "The user asked (human-instructed) for \"usageShare\" and the seconds an agent ran to show in the Journal's sessions view, via /grill-me. No usageShare field exists; I found the stored subagents[].tokenShare and durationSec, which were never displayed, and put six questions (field, placement, format, missing values, explanatory note, scope) in one round. The user accepted every recommendation. Building it followed from that green-light: a subagentUsageLabel helper in the Journal's dashboard utils, mapped onto each subagent in sessionCardViews, rendered at the end of the card's Subagents line, plus one clause in the note under it. code-review's Standards pass suggested the view-model mapping and the schema type, which I applied (agent-initiated); I kept the agreed \"3m 12s\" format although the Journal already has two other duration styles. Gate green, screenshot of the production build checked, PR opened and verdict posted; waiting on CI to merge."
