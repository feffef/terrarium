frictions:
  - description: A Bash `cd` into a subdirectory permanently changed the session's tracked working directory. Every PreToolUse guard hook (Bash, Edit, Write, Skill, Agent) invokes `sh scripts/guard-wrap.sh ...` via a path relative to that same tracked directory, so once it drifted off repo root every one of those hooks failed with "cannot open scripts/guard-wrap.sh" and denied the call — a catch-22, since there was no working Bash left to `cd` back or Skill/Agent left to delegate recovery to. Only Read/Grep/Glob/ToolSearch and non-gated MCP tools kept working. Notified the user via push and could not proceed until the session was later resumed, which reset the tracked directory and fixed every hook.
    solution: Never `cd` in a Bash command — use absolute paths throughout, per the Bash tool's own guidance (already violated here). Longer-term, scripts/guard-wrap.sh's invocations in .claude/settings.json should resolve their own location independent of the caller's cwd (an absolute path, or self-locating via the script's own path) so a stray `cd` can't brick every guard-wrapped tool for the rest of a session.
    severity: blocker
