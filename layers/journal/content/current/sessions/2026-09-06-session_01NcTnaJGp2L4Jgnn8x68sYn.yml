frictions:
  - description: Calling the Skill tool with the scheduled task's own command name (frictions-to-fixes) failed with disable-model-invocation, even though the scheduled prompt had already inlined the skill's full SKILL.md content verbatim.
    solution: For a scheduled trigger whose prompt already inlines a disable-model-invocation skill's content, skip the Skill tool call and follow the inlined instructions directly rather than attempting (and eating an error from) the tool call first.
    severity: minor
  - description: session-frictions.ts's compressed triage extract omits docsRead and subagents, so the survey subagent had to re-open each full session .yml by path (a separate Read) every time it needed to check whether a doc was actually opened before drafting.
    solution: Add docsRead and subagents (or a derived boolean) to session-frictions.ts's per-record output so this check doesn't cost a second file read per candidate.
    severity: minor
  - description: About a third of this 20-session survey window's frictions were already resolved by an immediately-following session or PR inside the same window, including one caused by the previous frictions-to-fixes run itself — a window containing its own prior frictions-to-fixes run produces heavy self-resolution and a thin actionable tail.
    solution: Consider excluding sessions before the last frictions-to-fixes run's own startedAt from the survey window (or shrinking the window when a prior run is found inside it), so the budget goes to genuinely unscreened frictions instead of re-confirming already-fixed ones.
    severity: minor
