summary: "Human-asked: investigate why docs/agents/provenance.md looked unread while PR footers stayed correct. Audited all 114 GitHub artefacts since it landed — 86 agent-authored, 84 carrying the footer, zero fabricated session ids. Both premises were false. The 2 misses used the harness's own footer: the harness prescribes three footers, two contradicting ADR-0017, and no repo doc named the conflict. The user then set the real requirement (a full session URL, format irrelevant) and green-lit a header, explicitly choosing backward compatibility plus a cleanup issue over a clean sweep. Agent-initiated within that: the guard broadening, the permanent-vs-temporary compat split, and preserving issue \"#692\"'s guarantee. A human-invoked two-axis code review then found three real defects in my own first commit — all reproduced by executing the code path, all fixed in a second commit."
