frictions:
  - description: The ADR-0017 footer convention was in direct, undocumented conflict with the harness's own PR-body and comment attribution footers. Agents that "failed" it were resolving a conflict they were never told existed, and the harness won.
    solution: Moved the repo marker to a header so the positions no longer compete; documented the conflict in ADR-0017's amendment and provenance.md; stated the requirement as the invariant (a full session URL) rather than one spelling, so following the harness is no longer a breach.
    severity: major
  - description: The footer guard was in-path for both observed misses and passed them — it only blocked a divergent Claude-Session footer, never a missing one (known gap "#737"). A guard that is in-path and silent is worse than none, because it reads as coverage.
    solution: Broadened to checkGithubProvenance with an explicit missing/mismatch split, plus an end-to-end hook test for the missing case.
    severity: major
  - description: The session log's docsRead field cannot support the inference it invites. Only Read tool calls count; subagent reads never appear (one session, 29 subagents and 9 PRs, showed zero create_pull_request calls — 12 of 23 PR bodies in the window came from invisible subagents); auto-injected context is not a Read (CLAUDE.md in only 3 of 12 logs); and the scratch-hash gate freezes the snapshot at the last log-session call.
    solution: Not fixed here. Document the subagent blind spot in session-trace.ts's header beside the existing cat/grep caveat, and treat docsRead as a floor, never as evidence of absence — frictions-to-fixes currently mines a heavily undercounted field.
    severity: major
  - description: The obvious way to express the new format-agnostic rule — "is the ground-truth id present anywhere" — would have silently regressed issue "#692"'s quoted-citation guarantee. Caught only because the existing spec pinned that case.
    solution: The guard adjudicates the most-canonical slot first (header, then legacy last-match trailer, then any URL), preserving the old rule verbatim for legacy content.
    severity: minor
  - description: "My first commit reintroduced issue \"#692\" through the new marker. The header regex used the /m flag, so a body quoting another agent's post — or embedding this repo's own doc example, which carries a real session id — had that quote adjudicated as its own provenance and was blocked. The full gate passed on that commit: the existing \"#692\" tests exercised the legacy footer path, so they never touched the new header path."
    solution: "Anchor the header to the start of the body (which the docs already claimed). The general lesson is sharper than the fix: when a change introduces a NEW marker for an old concern, the old regression tests do not transfer to it — port each one to the new path explicitly, or the suite reports coverage it does not have."
    severity: major
  - description: 'The requirement I was given — a full session URL is always present — still had a hole in my own implementation. A body-less call was an unconditional pass and `body` is optional on create_pull_request, so a title-only PR could publish with zero provenance: exactly the case "#737" exists for. I had verified 86/86 against existing artefacts and never probed the body-optional path.'
    solution: "Per-tool bodyRequired policy. Method lesson: verifying a guarantee against observed data proves the common path, never the absent one — the hole is by definition not in the corpus."
    severity: major
  - description: 'Broadening isAiAuthored to "contains a session URL" introduced a silent false positive: a human pasting a session URL read as agent-authored, so guest-intake-scan would classify their comment agent-authored-skip and never answer them. A loop-prevention predicate fails dangerously in the false-positive direction, which I had not considered when widening it.'
    solution: Require a deliberate marker (header, legacy footer, or the harness's footer), never a bare URL. When widening a predicate, check both error directions against who depends on it.
    severity: major
  - description: My own change left roughly ten stale "footer" references in the very files it edited — including a line that appeared as diff CONTEXT beside one I changed — plus two identifiers (agent-footer-skip, hasProvenanceFooter) whose names silently began to lie.
    solution: When retiring a term, grep the whole repo for it and triage every hit, rather than fixing the sites you happen to touch. Distinguish real drift from immutable record (session logs, blog posts, ADR history) instead of rewriting the latter.
    severity: minor
