frictions:
  - description: "An impl agent's fix for #1223 needed to edit .claude/settings.json's guard wiring, which triggered a live interactive permission prompt with no human normally present during a scheduled routine run — the human had to notice and manually approve it after the fact."
    solution: "Added a docs/agents/guards.md convention (and a frictions-to-fixes §3 pointer to it): a guard/.claude/settings.json-touching fix is never autonomously dispatched for implementation, only filed as an issue for a human-attended session to implement. Shipped in PR #1231 this same run."
    severity: moderate
  - description: frictions-to-fixes' §4 (as written before this run) filed a tracker issue for every selection, including ones this same run fully dispatches, reviews, and merges — opened only to be closed again by that same merge minutes later, per live human feedback mid-run.
    solution: "Changed §4 so an issue is filed only for a hard/escalated selection expected to outlive the run; a simple selection's problem/evidence/fix goes straight into its PR description instead. Shipped in PR #1231 this same run."
    severity: minor
  - description: "SHELL-READ-DETECTION: the survey subagent reported scripts/session-frictions.ts's ~73KB/1863-line output exceeded the Read tool's single-call cap, needing a second paginated Read with an explicit offset to see the full 20-session window."
    solution: No repo-side fix needed this time — cost one extra round trip. Worth watching if the windowed output keeps growing past the single-Read cap as more sessions accumulate.
    severity: nit
  - description: The survey subagent hit a GitHub API rate limit (403, ~19s reset) on one mcp__github__search_issues call, and again on a second call in the same cooldown window — the same transient-limit shape a prior survey subagent already logged.
    solution: Resolved by waiting and retrying; no repo-side fix identified beyond what's already documented in docs/agents/github-integration.md.
    severity: nit
  - description: 'SHELL-READ-DETECTION: docsReadViaShell flagged docs/agents/guards.md as read via shell this session. I never ran a cat/grep/sed against that literal path — the only shell commands naming it were `git merge --ff-only origin/main` and `git stash pop`, whose output listed it only as a changed filename (e.g. "Auto-merging docs/agents/guards.md"), never its content. Its actual content reached me via the Read tool earlier, and again via an automatic system-injected "file changed on disk" notice after the merge — neither is a shell read.'
    solution: "False positive, direction: over-counted. The detector likely treats any git command whose output lists a path (status/merge/diff --stat) as revealing that file's content, when a bare filename in a file list does not. Consider narrowing the heuristic to commands that print the file's actual body (cat/sed/head/tail/grep -A, or diff/show with content) rather than any command that merely names the path."
    severity: moderate
