outcome: Reviewed adr-check; PR 2287 makes it print only open trial territories
summary: 'The owner asked me to look at the adr-check Skill and the issue, PR and session it came from (#2146, PR #2284, session 01BTtvaF). I summarised that history and asked what they wanted; they chose a review. I ran adr-check on the review itself. Its main findings: a Skill can be skipped as easily as the CLAUDE.md line it replaced; one run cost about 13k tokens even for a chat opinion; "Question the premise" now only reaches agents that run the whole Skill; and subagents in a fresh worktree may fail at its tsx step. No session since the merge has used it yet, so there is no evidence either way. The owner then asked which parts of prune-trials.yml matter generally and whether a script could extract them. I said only `territory` binds other sessions, prototyped an extract (829 bytes instead of 8.5 KB), and found an unquoted `Reviewed:` keyword that YAML read as a mapping. The owner said "Only territory", which I took as the go-ahead to build it. Owner-instructed: the review, and the territory-only extract. Agent-initiated: renaming the script to binding.ts so steps 1 and 2 share one run, putting the keyword fix in the same PR (I said so and offered to split it), and the review-driven fixes (ADR-0027 wording in step 2, tolerating missing fields, a blank line between trials, reusing the ledger path). Left out: a gate check that territory keywords are strings. PR #2287 is open and the gate is green locally.'
