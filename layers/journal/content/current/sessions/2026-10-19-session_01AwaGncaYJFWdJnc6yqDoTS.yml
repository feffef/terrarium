frictions:
  - description: I gave a light opinion on adr-check (a Skill is as skippable as a line) in my first reply, before running adr-check as CLAUDE.md requires.
    solution: Run adr-check before any evaluative remark on a change, even in a context-gathering reply.
    severity: nit
  - description: gate:scoped started on the first commit; review fixes were amended in mid-run, so I ran the gate a second time (about 5 extra minutes). The origin session logged the same.
    solution: Run code-review before starting gate:scoped, so amends land before the gate.
    severity: minor
  - description: The Stop hook asked twice to push while gate:scoped was still running; I declined per ADR-0004.
    solution: Accepted cost (stop-hook-nag, PR 2278).
    severity: nit
  - description: "One adr-check run for a chat review cost about 13k tokens: 6k summaries, 3k trial ledger, 4k full ADRs."
    solution: PR 2287 cuts the ledger part; a lighter path for chat opinions is still open.
    severity: minor
  - description: My first wording for adr-check step 2 was stricter than ADR-0027 and would have blocked an allowed repoint; the Spec review caught it.
    solution: Quote the ADR's own verbs when restating its duty in a Skill.
    severity: nit
  - description: The first tool call, a find for the Skill folder, was rejected by the user without a stated reason.
    solution: Use Glob for a file lookup, as the harness prefers.
    severity: nit
