learnings:
  - An unquoted YAML list item ending in a colon (`- Reviewed:`) parses as a one-key mapping, not a string; a strict parse still succeeds, so the gate's YAML check misses it.
ideas:
  - Extend validate-prune-trials.ts to check every trial's territory paths and keywords are strings, so an unquoted `Reviewed:`-style keyword fails the gate instead of printing as an object.
  - "Have log-session flag a session that opened a PR or recommended a change without invoking adr-check, giving the Skill a mechanical backstop and the #2146 experiment a measurable signal."
