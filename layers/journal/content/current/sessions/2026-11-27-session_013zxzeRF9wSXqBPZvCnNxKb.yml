summary: Scheduled frictions-to-fixes run, no human prompt. A survey subagent appended 70 window Frictions to the ledger, opened 3 entries and recorded 3 merged fixes (commit af4bcfc21). I picked three never-fixed entries; a design agent recommended one fix (the gate treats .claude/rules/*.md as inert, so a rule-only PR skipped the tests; touches Human-only gate.ts) and no change for the other two. Per the Skill I filed 3713 for the gate fix (not dispatchable) and 3714 as a regression of PR 2937 (close-session-bypassed-by-hand-log, major). Ledger got tracking refs, two dropped-design notes, a cause rewrite and the prune script's output. code-review ran twice (survey commit and follow-up), gate:scoped passed, PR 3715 merged with my verdict comment. No fix PRs, so the closing ledger PR was skipped. All actions were Skill-instructed, none human-instructed.
