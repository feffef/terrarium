frictions:
  - description: Filed two issues before reading docs/agents/triage-labels.md, which CLAUDE.md requires before filing; a hook then reminded me. needs-triage was the label anyway.
    solution: Read triage-labels.md together with issue-tracker.md before the first issue_write.
    severity: nit
  - description: A Bash call with run_in_background plus a trailing & was denied by the double-background guard; resent plainly.
    solution: Pass run_in_background alone.
    severity: nit
  - description: The Agent call was denied because my brief named the unfilled scratch placeholder in prose; I reworded and resent.
    solution: Fill every placeholder before the call, never name one.
    severity: nit
  - description: survey-brief step 3 asks to confirm every never-fixed or regression label, impossible for about 85 candidates; the survey agent confirmed only the top ones and said so.
    solution: Ask for confirmation of the top-ranked candidates only.
    severity: minor
  - description: design-brief steps 2 and 3 assume a doc Friction; the gate-scoping pick had no doc, so the agent found the real cause outside the brief.
    solution: Say in design-brief that a code-cause Friction skips steps 2 and 3.
    severity: nit
  - description: The survey agent's commit message miscounted its appends (68 and 44 against 65 and 39 plus 3 new entries), and the Standards reviewer wrongly reported an unchanged status; I verified both against the diff.
    solution: Have the survey cite counts from git diff, not from its own tally.
    severity: nit
  - description: The Spec reviewer flagged a missing 'dropped:' word in one note; I left it unfixed to avoid rerunning a 70-second gate.
    solution: Use the exact note format when writing the note.
    severity: nit
