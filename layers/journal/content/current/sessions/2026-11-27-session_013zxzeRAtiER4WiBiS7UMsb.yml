  - "[blind] /t/midden: the Latest finds cards pack four jargon facts into one line (Intact · cost more than it caught · in Short Lives · assessed 12 Nov 2026), and terms like season and stratum come before any explanation. Add a one-line legend above the cards (condition · cause · report · date graded) so a first-time visitor can read them without opening the Stores page."
  - "[content editor] /t/midden/trench: the Short Lives teaser reads 'two sets of agent instructions after under four days and about ten days', which is ambiguous. Reword to 'two sets of agent instructions, taken down after under four days and about ten days', so the teaser states what happened and when."
  - "[content editor] /t/midden/trench/<any dig report>: the Condition key repeats 'a Dissolved find's Remains links may still show an intact original', which a newcomer cannot parse. Reword to 'A Dissolved find's links may still lead to the full original.'"
  - "[blind, content editor] /t/midden/stores: four of eight seasons say 'no finds', and the same eight seasons appear twice (a date strip and headings), with 'The Current Midden' heading twice. Show empty seasons as one line (4 seasons held nothing) and keep one list, so the page stops reading as filler."
  - "[content editor] /t/midden/trench: Barely Cold is described as freshest when dug but sits at slot 10 under newest-stratum-first. Say 'freshest at the time of the dig (July)', so the name does not contradict the list order."
  - "[content editor] /t/midden: cause chips only filter. Add a tally (count of finds by cause across all reports) to the front door, so visitors see the project's failure patterns at a glance."
  - "[UI tester] /t/midden/trench?cause=bogus: an unknown cause silently shows all 16 reports with no chip active. Show an 'unknown cause' note and a visible clear-filter link, so a mistyped or stale link is not mistaken for a working filter."
