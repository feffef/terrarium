learnings:
  - Nuxt dev forwards SSR-side logs to the browser in the data-nuxt-logs payload - a server-only Vue warning invisible in the browser console shows up there
  - An MDC prose component can produce byte-identical SSR HTML and still mismatch on hydration, because ProseP renders exactly the plain tag it falls back to
  - Under pnpm's strict node_modules, require('./node_modules/vue/package.json') fails for a transitive dep - read versions from pnpm-lock.yaml instead
ideas:
  - Add scripts/dep-bisect.ts - given a package and a list of versions, it pins each via pnpm.overrides, boots the dev server on an ephemeral port, probes a route for console errors, and prints a clean/broken table. Today's five-permutation Nuxt/Vue bisect was assembled by hand each round; a dependabot bump that reddens the gate is a recurring event, and this turns the diagnosis into one command.
