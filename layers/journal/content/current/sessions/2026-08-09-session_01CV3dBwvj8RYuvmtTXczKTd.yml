summary: "Human-instructed: find why the open PR's test fails, then \"rebase to main\". PR #895 (Nuxt 4.4.8 to 4.5.1) fails 36 of 80 e2e tests, all on \"Hydration completed but contains mismatches\". Reproduced locally in both preview and dev builds: the mismatch is inside MDCRenderer (server renders a plain element, client resolves ProseP), alongside an SSR-only \"resolveComponent can only be used in render() or setup()\" warning absent on main. Bisected by pinning versions - broken only on Nuxt 4.5.x plus Vue 3.5.41; Nuxt 4.5.1 with Vue 3.5.40/3.5.39 and Nuxt 4.4.8 with Vue 3.5.41 are both clean. Nuxt 4.5.2 still reproduces. Merged current main into the dependabot branch (fast-forward, no history rewrite) after the user expressed no preference among the branch options. On a later explicit green-light, opened PR #914 - nuxt ^4.5.1 plus a pnpm.overrides pin of vue to 3.5.40 - which passes the full gate locally and in CI, 81/81 e2e. Nothing was agent-initiated beyond the diagnosis itself."
