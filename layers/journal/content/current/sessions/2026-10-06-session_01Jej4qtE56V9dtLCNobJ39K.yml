frictions:
  - description: "Reading another session's transcript via list_events is very token-heavy: subagent events interleave with the parent's, so finding the dispatch briefs took about 10 pages of 60-190k chars each."
    solution: list_events could filter to parent-only events (parent_tool_use_id null), or a local script could page and extract tool_use/text events to a file.
    severity: minor
  - description: The audit-docs log's stated reason for unapplied concision fixes (coverage) hid the real cause (no checker, self-imposed ~10-finding cap), and the skipped checker was not logged as a friction.
    solution: "Fixed in PR 1632: the log must now name the concision family and checker verdict counts, so a skipped checker is visible."
    severity: moderate
  - description: My first Skill edit shipped date +%j in bash arithmetic, which errors or misreads zero-padded days as octal; only the dry run's coherence reviewer caught it.
    solution: Run any shell snippet you put in a Skill once, including a padded value like 009, before committing.
    severity: minor
  - description: A fix-applying agent wrote two pieces of wording no checker saw (environment-caveats.md:6 spelling, blog-post step 7 restart pointer), which the new hard rule would leave unfixed.
    solution: audit-docs step 6 could say a fixer applies only checker-supplied text and returns any gap as a new finding for the checker.
    severity: minor
  - description: Tail-pipe guard denied a git diff --stat | tail chained before a backgrounded gate; one retry.
    solution: Redirect to a file as the guard says.
    severity: nit
  - description: Checkers erred twice in dry run 2 (a dropped still-true clause, a field judged from a tool description rather than real output); dry run 1 shipped one of those wrong fixes to its patch.
    solution: audit-docs could tell checkers to verify a tool-behaviour claim by calling the tool read-only, not from its description, and the orchestrator routes cross-checker disagreement back for a re-verdict.
    severity: moderate
  - description: Checkers in different dry runs disagreed on the same facts (triage (planned), MCP prefix, trial territory of a bullet), so a verdict is not fully repeatable.
    solution: Have checkers cite the primary-source line for each verdict so disagreements are quick to resolve.
    severity: minor
