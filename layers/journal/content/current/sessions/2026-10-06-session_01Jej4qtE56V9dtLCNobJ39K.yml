summary: "Human-instructed throughout. The user asked me to explain, from the full transcript, why the 2026-10-06 audit-docs run (session_01L6ePb5aMsH4u53XnEs7FLQ, PR 1631) left most concision proposals unapplied: 36 proposed, 1 applied, because briefs capped reviewers at about 10 findings, two agents split 40+ files, and no checker ran. The user then asked twice to adjust the Skill and dry-run it, choosing among options I offered each time. Round 1 (PR 1632): rotate one concision family per run with no cap, and only a checker's CONFIRMED is applied. Dry run 1 (family 4): 56 findings, 38 CONFIRMED, 15 CONFIRMED-BUT, 3 WRONG, 53 edits, full gate green; it exposed an octal bug in my formula (fixed) and two fixer-written unchecked edits. Round 2: fixers apply only checker text and return gaps to a checker, out-of-lens findings join the pool, plus three confirmed audit-docs fixes. Dry run 2 (family 4 again, by the user's choice): 67 findings, 22 CONFIRMED, 35 CONFIRMED-BUT, 9 WRONG, 1 CONFLICT, 56 edits with zero fixer-written text, full gate green. Two checker errors were caught by routing evidence back to the same checker; one of them (last_fired_at) was a wrong fix dry run 1 had applied. Patches for both dry runs are in the scratchpad, not shipped."
