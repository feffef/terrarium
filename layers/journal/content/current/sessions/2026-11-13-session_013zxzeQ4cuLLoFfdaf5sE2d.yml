frictions:
  - description: The Stop hook said a PR merged and demanded close-session, but this session opened and merged no PR; work was still running.
    solution: merge-close-stop should match only this session's own merge-pr.ts run, not the word merged in tool output.
    severity: minor
  - description: CLAUDE.md says read the full ADR of each decision a plan touches; I recommended changes around ADR-0004, 0009, 0017 and 0027 from lessons and rule summaries only.
    solution: For a repo-wide assessment, have the lesson-digest agents also read the cited ADRs, or say in the output that reasons come from lessons.
    severity: minor
  - description: Took 'read them all' literally and read 22 lessons (about 30k words) into the main context before the owner redirected me to explore agents.
    solution: Size the reading first and propose delegation when it exceeds a few thousand words, before starting.
    severity: moderate
  - description: A Bash cat of five lessons overflowed the output limit and returned only a preview; had to redo it with Read calls.
    solution: Use Read for whole files; check combined size before a shell cat.
    severity: nit
  - description: The first Agent call for the stack comparison failed with an empty error message; the identical call succeeded on retry.
    solution: Nothing in the repo; the harness should return a reason.
    severity: nit
  - description: Verifying one subagent claim with WebFetch pulled the whole plugin loading page into context when two sentences were needed.
    solution: Ask WebFetch for a yes or no with the quoted sentence, not for every related sentence.
    severity: nit
  - description: dispatch-subagents says to pilot one agent when more than three run from one improvised brief; unclear whether five different improvised briefs count. I dispatched all five.
    solution: Say in the Skill whether the pilot rule counts agents or briefs.
    severity: nit
  - description: A usage-analysis agent ran rule-use-report.ts, which writes its report to /tmp outside the agent's scratchpad subfolder.
    solution: Give rule-use-report.ts an --out option, or have it print to stdout.
    severity: nit
  - description: ADR-0004 and pr-workflow.md ask for code-review and gate:scoped before a PR that adds a file; the owner stopped the review and said to just commit and push, so both were skipped.
    solution: Let pr-workflow.md say that the owner's in-session word waives the pre-PR review, as it already does for a Human-only merge.
    severity: minor
  - description: My stop message to the stack-comparison agent crossed its finished report, so the note first said the study was stopped early and had to be corrected.
    solution: Before telling an agent to stop, check whether its hand-back is already queued.
    severity: nit
  - description: Writing docs/research/single-site-template-breakdown.md loaded .claude/rules/adr-0027.md and a hint to read the full ADR; neither bears on adding a research note.
    solution: Narrow that rule's paths from docs/** so docs/research/** is left out.
    severity: nit
  - description: The system prompt says never put a model identifier in a commit message, while the attribution reminder and commit-trailer.ts require a Co-Authored-By line that names the model.
    solution: Say in git-conventions.md that the trailer's model name is the one allowed exception.
    severity: nit
