entrypoint: remote
cliVersion: 2.1.323
learnings:
  - Claude Code plugins declared in a repo's settings do not load in cloud sessions, so a shared platform layer for cloud-run repos has to be plain committed files
  - GitHub branch protection cannot separate the owner from agents that act under the owner's account, which is why the Human-only refusal has to live in a script
ideas:
  - "Move session logs out of the Journal's content on main to their own branch: a log would stop triggering a full site rebuild and stop depending on the site's content schema, and main could then use GitHub's own required-check branch protection"
  - "Give each Glass Box lesson's 'Try it in your project' section a stable anchor and collect them on one page: together they are the minimal form of the whole working model and a ready starting point for anyone adopting it"
landedBy: Stop
