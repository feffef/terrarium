goal: Break down what Terrarium does and what a single-site template should take from it
status: in-review
outcome: Breakdown committed as a research note; its PR is open and waits for CI before the merge the owner asked for
summary: "The owner asked for an overview of the repo, then for proposals on which parts to keep, adapt or redesign for a spin-off: a GitHub template for one small content website per repo with a reduced version of the working model. All of the work was human-instructed: the owner asked to be grilled first (three rounds with the grilling Skill), then set the deliverable himself: read every Glass Box lesson, use explore agents on the source and the recorded state, and break down what Terrarium does at build time, at runtime, in interactive sessions and in Routines, each with a recommendation. I read 22 lessons in full before the owner said the lessons were large and to use explore agents; three agents digested the other 52. Five more agents inventoried build, gate, CI and deploy; Journal and Glass Box at runtime; session guidance, hooks and Skills; Routines and the loop; and recorded usage from the session logs. Two agents studied the stack, one from docs with one-page tests and one building the same site in Astro and in Nuxt Content. The owner then said no stack decision was needed, told me to stop the comparison (it had just finished), and asked for the breakdown to be committed under docs/research with a header giving the date and the task, and merged to main. When I started the code-review Skill he stopped it and said to just commit and push, so the PR was opened without a review or a local gate run, at his word. Agent-initiated parts: checking the plugin claim against the docs myself, proposing session logs on their own branch, and recommending a throwaway pilot site against the owner's \"no\". Still open: CI on the PR, the merge, and the owner's six decisions listed in the note."
