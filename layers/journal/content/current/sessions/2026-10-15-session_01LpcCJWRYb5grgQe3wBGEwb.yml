summary: 'The user invoked frictions-to-fixes. A survey subagent read the 7 sessions in the window (21 frictions) and the Friction Ledger and ranked the candidates. Selected as simple fixes (agent-initiated under the Skill): clear-backlog SKILL.md gaps (per-branch picks, label docs, the dispatch-subagents trigger) and the digest.ts PR double-count (git log without --first-parent counted branch commits ending "(#N)" as PRs, 70 vs 44 on 2026-10-14). Not taken: the flaky Journal e2e (one minor with no output) and bash-reads (needs an ADR change). The survey found #1819 (late reads of binding docs) closed without a fix. I asked the user whether to refile it. The user asked whether a deny was really better. The evidence since the hint landed showed nits and one classifier-caught near miss, so I recommended accepting late reads. The user then asked for, and approved, one hint sentence: "If the doc shows your call was already right, the late read is not a Friction." That change is human-instructed and goes to its own PR. The ledger records the acceptance.'
