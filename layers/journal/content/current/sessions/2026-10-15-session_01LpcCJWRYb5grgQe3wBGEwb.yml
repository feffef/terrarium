frictions:
  - description: Recommended accepting late reads and a hint wording change before running grep -l on docs/adr, against CLAUDE.md's opinion-in-chat rule; grep afterwards found only ADR-0029 listing the hint, no conflict
    solution: Run the ADR grep before answering any 'should we' question; the rule is in CLAUDE.md but easy to skip mid-run
    severity: minor
  - description: Read several files with cat/sed via Bash instead of the Read tool (GLOSSARY-MAP, prune-trials.yml, digest.ts excerpt)
    solution: Use Read for any doc or source read; Bash only for command output
    severity: nit
  - description: Friction Ledger status enum has no value for an accepted cause, so binding-docs-skipped must stay open or tracked and will resurface each run after the owner accepted late reads
    solution: Add an optional 'accepted' status (or reuse fixed once the hint wording PR lands) in layers/journal/tenant.config.ts
    severity: minor
  - description: "Survey subagent: audit-skills.ts output plus a broad grep printed 56 KB and was persisted to a file; it re-ran with narrow extraction"
    solution: audit-skills.ts could offer a --doc-read-counts-only flag
    severity: minor
  - description: "Survey subagent spent about 4 extra calls working out why #1819 closed; the close event shows only the owner login since agents act as the owner"
    solution: When closing an issue without a fix, leave a one-line comment saying why
    severity: nit
  - description: "Digest impl agent: the worktree guard refused several compound Bash commands (loops, variables, heredocs piped to node), forcing plain calls and a helper script"
    solution: The dispatch brief could say up front to write helper scripts with Write instead of compound Bash
    severity: nit
  - description: Docs impl agent's first pass at applying the YAML ledger patch unquoted dates and replaced a full ref; it had to repair both
    solution: Ship the ledger patch as a small apply script, or have the survey write per-file edits
    severity: minor
  - description: code-review's two parallel review agents for a one-line --first-parent diff cost about 125k subagent tokens
    solution: "Let code-review scale down to one inline pass for a diff under ~5 lines (pack Skill: note it in its Inventory entry)"
    severity: nit
