goal: Build a weekly Skill that files agent ideas and learnings as issues
status: in-review
outcome: harvest merged in PR 3080; follow-up PR 3085 awaits a human merge; the owner's first /harvest ideas run filed 4 Seedlings (3086-3089)
summary: "The owner asked for the ideas and learnings of the past week to be mined, ranked, and filed as issues (I filed 3068-3075 on their picks), then for an unattended weekly Skill doing the same, up to 10 issues per run, filed ready-for-human. After clarifying questions they chose one Skill, Seedling as the marker word, state derived from the issues themselves, a 28-day lookback, 30 clusters checked per run, a /harvest ideas or learnings argument and recency-only ranking. It merged as PR 3080. The owner then asked for more: leave Frictions to frictions-to-fixes, prefer positive ideas that simplify, prefer Tenant, content and UI ideas over agent-workflow ones (workflow Seedlings capped at 3), and self-contained issue bodies; I restarted the branch from main, rewrote the Skill, added body-template.md and check-body section and session-id checks, ran a Standards and Spec review and opened PR 3085, which needs a human merge (ADR-0004). The owner told me not to rewrite 3068-3075 because they are already being processed. The owner then ran /harvest ideas as the first real run of the Skill as it stands on the PR branch. Of 161 unharvested ideas, most concerned Glass Box curation tooling or other agent workflow; product clusters were checked first, several were already built (code-block fade, per Tenant diagram font, Routine cost charts), several fell to the Glass Box glossary or added new concepts without retiring any. Four passed every check and were filed as 3086 (one duration format in the Journal), 3087 (empty state for the Glass Box drafts page), 3088 (a folder-tree diagram for the Adding a site Walkthrough) and 3089 (Where next rows show the target title); all stored their keys on read-back and a rerun skips them. No workflow cluster was filed. The run filed 4 of a possible 10, which I judge correct rather than a shortfall. Still open: PR 3085 awaits a human merge, and the owner creates the Routine."
