goal: Build a weekly Skill that files agent ideas and learnings as issues
status: in-review
outcome: harvest merged in PR 3080; a follow-up in PR 3085 focuses it on product ideas and self-contained issues, waiting for a human merge
summary: "The owner asked for the ideas and learnings of the past week to be mined with an explore agent, then ranked as issue proposals, then asked for a top 10 with quick wins flagged, and told me to file items 1-6, 9 and 10 (human-instructed, with picks and wording mine); I filed eight issues (3068-3075). The owner then asked for an unattended Skill doing the same weekly, up to 10 issues per run, filed ready-for-human. After clarifying questions they chose one Skill, Seedling as the marker word, state derived from the issues themselves, a fixed 28-day lookback, 30 clusters checked per run, and later a /harvest ideas or learnings argument and recency-only ranking. The design went through two Fable review rounds. I built it, rewrote 3068-3075 as Seedlings, and it merged as PR 3080 (the owner enabled auto-merge; a human made the merge call). After the merge the owner asked for more: leave Frictions to frictions-to-fixes (check the Friction Ledger summaries), prefer positive ideas that simplify, prefer tenant, content and UI ideas over agent-workflow ones (capped at 3 workflow Seedlings per run, the owner said yes to my question), and make Seedling bodies self-contained so the owner never needs the repo or a session log. I restarted the branch from main, rewrote the Skill, added body-template.md and a check-body section and session-id check, dry-ran the template on a real idea, ran a Standards and Spec review and applied its findings, and opened PR 3085. It needs a human merge under ADR-0004's outside side effect exception, so I will not self-merge. Still open: the owner creates the weekly Routine, and decides whether the eight first Seedlings, which predate the template, get rewritten."
