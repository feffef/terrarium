goal: Build a weekly Skill that files agent ideas and learnings as issues
status: in-review
outcome: harvest Skill in PR 3080, CI green, waiting for a human merge; 8 earlier issues rewritten as Seedlings
summary: "The owner asked for the ideas and learnings of the past week to be mined with an explore agent (full logs, git history for what is resolved), then ranked as issue proposals, then asked for a top 10 with quick wins flagged, and then told me to file items 1-6, 9 and 10: all human-instructed, with the picks and wording mine. I filed eight issues (3068-3075). The owner then asked for unattended Skills doing the same weekly, up to 10 issues per run, filed ready-for-human as agent suggestions. After clarifying questions (labels, window, scope, structure), they chose: one Skill, Seedling as the marker word (Proposal clashes with GLOSSARY, which defines it as a file in docs/proposals), state derived from the issues themselves with no state file, a fixed 28-day lookback so entries ranked below the cap return next week, and 30 clusters checked per run. The design went through two Fable review rounds (duplicate key by source entry hash, auto-triage guard, Routine is created outside the repo, archived logs needed for 28 days, format verification before and after posting). I then built it on the session branch, rewrote 3068-3075 as Seedlings with script-rendered keys (the owner asked whether I had), ran code-review passes with fixes, and opened PR 3080. The owner's two review comments then asked for a /harvest ideas or learnings argument, which I had cut on a reviewer's advice without confirming, and a Seedling glossary entry; both are done, with a review-found fix to the --kind parsing. It needs a human merge under ADR-0004's outside side effect exception, so I will not self-merge; CI is green on the head. The owner still has to create the Routine, and the routines.md line and Inventory entry wait for its first run."
