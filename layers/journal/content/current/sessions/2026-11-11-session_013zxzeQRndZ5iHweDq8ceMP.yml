cliVersion: 2.1.322
learnings:
  - A read-only Explore agent cannot write files, so a 200-line catalogue only comes back as a final message; budget for that in the brief.
  - REST issue bodies come back raw while MCP reads are entity-encoded, so a machine-read key line must use an alphabet that entity decoding cannot change.
  - A full open and closed issue listing with bodies takes about 36 seconds, so one scan per run is fine but a read-back per issue is not; read back the single issue instead.
ideas:
  - Add a script that lists a week's ideas and learnings from Session logs with a resolved or open status, so this review is one command instead of a 200k-token agent run; stamp each idea with the issue that filed it so nothing is filed twice.
  - Add a script that lists a week's ideas and learnings with a resolved or open status; the harvest Skill now does the extraction half, so a status column from its relevance check could feed the Journal.
landedBy: Stop
