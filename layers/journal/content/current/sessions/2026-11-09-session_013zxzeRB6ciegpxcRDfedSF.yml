  - description: Trimmed the tile intro instead of asking what it should say, so the user had to flag it as meaningless; one extra round and commit.
    solution: Settle every displayed string, intro lines included, in the first question round, as CLAUDE.md says for user-facing UI.
    severity: minor
  - description: Changed a fact but grepped only code for its other statements, so the stale line in layers/glassbox/GLOSSARY.md surfaced only in code review.
    solution: Grep the Tenant glossary and docs for the old fact in the same edit, as CLAUDE.md One home per fact says.
    severity: minor
  - description: Edited layers/glassbox/GLOSSARY.md before the ADR-0021 and tenant-glossary reads that the hook and rule asked for; the edit was right, no cost.
    solution: Read the Tenant glossary before editing a Tenant's files, as the tenant-glossary rule says.
    severity: nit
  - description: Took the option "Drop the intro line" literally and deleted the wording the user wanted kept; the user said so and I redid it as a fold into the blurb.
    solution: When an option removes user-visible text, say where its wording goes before acting, and ask if that is unclear.
