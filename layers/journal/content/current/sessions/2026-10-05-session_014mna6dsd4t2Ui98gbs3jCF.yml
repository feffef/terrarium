frictions:
  - description: "auto-triage's Blocking rule only covers two of this run's ready-for-agent issues; #1578 collided with an earlier-run ready-for-agent issue (#1515) and the rule is silent on that"
    solution: Widen the auto-triage Report step to any open ready-for-agent issue sharing a file, not only this run's
    severity: nit
  - description: Shared subagent brief had to be inlined via a scratch file and each subagent re-read ~6 docs (triage, ADR-0022, CONTEXT.md); ~95k tokens per issue for 7 issues
    solution: Acceptable for a small eligible set; if sweeps grow, a condensed triage-subagent brief in the Skill would cut repeated reads
    severity: nit
  - description: Each Opus triage subagent re-read ~6 docs (~95k tokens per issue); the Sonnet re-check pass was ~75k per issue and mostly found no change
    solution: A condensed triage-subagent brief in the auto-triage Skill would cut repeated reads; Sonnet is enough for no-change re-checks
    severity: nit
  - description: "The guards.md rule bars unattended sessions from guard work, so #1611 and #1304 sit ready-for-human although the design is settled; an attended session could implement them"
    solution: Owner may hand guard issues to an attended session; no doc change needed
    severity: nit
  - description: "Local gate:scoped passed but CI failed on PR #1622: a test hard-coded git 2.43's `+00:00` %aI output while CI's git 2.55 prints `Z`. Not an inert-classifier skip; the full local gate ran."
    solution: Compare parsed instants rather than raw git date strings; note the container-vs-CI git version gap in environment-caveats.md
    severity: moderate
  - description: "Triage subagents classed #1611/#1304 ready-for-human on guards.md's unattended-session rule although the owner was attending; the owner had to correct me"
    solution: Triage briefs should state whether the sweep is attended; ready-for-human only when the implementing session would be unattended
    severity: moderate
  - description: "The #1608 triage brief (made ready-for-agent) encoded a policy the owner rejected at review; a full impl + review + fix cycle was spent before the premise was questioned"
    solution: A 'which behaviour is right' bug against a self-merge tier is an owner judgement call; route it ready-for-human
    severity: moderate
  - description: "First serialized dispatch of #1515 and #1578 (blocked-by) when one agent and branch for both was simpler; the owner had to point it out"
    solution: When two ready issues edit the same file, default to one agent, one branch, one PR
    severity: minor
  - description: flock-serialized gates in subagents routinely exceeded the 600s foreground Bash timeout and were auto-backgrounded (4 agents reported it)
    solution: For queued gates, have subagents poll a log marker, or cap concurrent impl agents to the gate concurrency
    severity: minor
  - description: workflow-edit-guard false-positived on a heredoc whose TEXT mentioned the CI workflow directory (no write to it); the worktree-isolation guard refused python heredocs mentioning git
    solution: "Workflow-edit-guard should match write targets, not path mentions in heredoc bodies (issue #897)"
    severity: minor
  - description: "auto-triage's Blocking rule only covers two of this run's ready-for-agent issues; #1578 collided with an earlier-run ready-for-agent issue (#1515)"
    solution: Widen the Report step to any open ready-for-agent issue sharing a file
    severity: nit
