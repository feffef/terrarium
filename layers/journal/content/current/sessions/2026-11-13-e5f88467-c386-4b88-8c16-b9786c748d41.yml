learnings:
  - A change to only .agents/skills/*/SKILL.md is inert to gate:scoped and CI (gate.ts isInert), so unit tests that parse a SKILL.md don't run on it
ideas:
  - Make isInert treat a .md as non-inert when a unit spec reads it (e.g. specs declare the files they read), so a Skill-only edit can't break a parity test such as area-labels.spec.ts until main's full gate
