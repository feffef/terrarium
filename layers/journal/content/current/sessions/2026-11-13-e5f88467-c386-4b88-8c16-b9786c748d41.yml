outcome: "PR #3286 merged; follow-up PR #3288 waits for a human merge; all 19 open issues carry area labels"
summary: "Human-instructed throughout. The owner asked to apply the PR area-label proposal (installed as .github/workflows/pr-area-label.yml in PR #3286, plus a Tenant-list test and a New Tenant rule line the owner picked over editing GLOSSARY-MAP.md or an ADR; the owner merged it). The owner then asked for reworded label descriptions (done on GitHub). The owner questioned why Seedlings and wayfinder maps were excluded, asked for a backfill of all open issues, asked how some could get no label, and asked whether #2916 was really about the Platform. Each question exposed a choice I had inherited or made without checking: the exclusions (an earlier run's mechanical gap recorded as a scope cut), a narrow platform path list that left agent-tooling issues unlabelled, and labels set from titles instead of the Friction clusters behind them. PR #3288 makes area:platform everything outside a Tenant and the home page, has harvest label Seedlings and auto-triage label maps, and tells auto-triage to read where each Friction occurrence showed up. Agent-initiated: the rename-safe file list in the workflow, review fixes, and a wayfinder Inventory note the owner disliked and I reverted. All 19 open issues were labelled by hand under the final rule. Open: a SKILL.md-only PR skips unit tests, so the Tenant-list test can miss a Skill-only drift."
