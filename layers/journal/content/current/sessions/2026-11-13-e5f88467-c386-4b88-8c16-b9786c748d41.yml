learnings:
  - A change to only .agents/skills/*/SKILL.md is inert to gate:scoped and CI (gate.ts isInert), so unit tests that parse a SKILL.md don't run on it
  - A Friction-ledger issue's title names the rule that slipped; where its problem showed up is only in each occurrence's session log (goal, filesEdited)
ideas:
  - Make isInert treat a .md as non-inert when a unit spec reads it (e.g. specs declare the files they read), so a Skill-only edit can't break a parity test such as area-labels.spec.ts until main's full gate
  - Give the Friction Ledger an optional per-occurrence `area` field filled by log-session from filesEdited, so triage and visitor-loop can label and find Friction issues by Tenant without opening every session log
