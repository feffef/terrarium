frictions:
  - description: adr-check printed every ADR summary (24KB) for a pick step where only ADR-0003/0004/0005/0027 and trial territories applied.
    solution: Let binding.ts take a topic filter, or print only summaries whose paths match.
    severity: minor
  - description: Survey and design subagents each skipped or read late the CLAUDE.md-required reads; the design agent also skipped adr-check and cited stale paths from the ledger.
    solution: Brief templates could list the required reads first, and ledger entries should cite current paths.
    severity: nit
  - description: The Stop hook asked twice to push while the gate ran, against ADR-0004's review-and-gate-before-first-push rule.
    solution: "None here: the owner accepts the nag (stop-hook-nag); declining was correct."
    severity: nit
  - description: Survey brief mixes window start and session end dates, and never says which status a ledger entry takes when its issue closes not planned or its Skill sits in a trial.
    solution: State the window by session start, and list the status for closed-not-planned and on-trial entries in the brief.
    severity: nit
  - description: The brief and ledger entries cite scripts/verify-skills-lock.ts and a CLAUDE.md Read-tool rule that no longer exist, so the design agent had to re-check them.
    solution: Fix the stale path in the ledger entry; cite current paths when an entry is written.
    severity: nit
  - description: SKILL.md section 2 and pr-workflow.md leave open whether a test counts as code logic for the simple-change read; I reran the test and read the diff to be safe.
    solution: Say in pr-workflow.md whether a test-only change of at most 10 lines counts as simple.
    severity: nit
  - description: check-conflicting-issues.ts flagged a watch-list issue on the keyword remove, which has nothing to do with the change; reading the issue body cost a call.
    solution: None needed; it is advisory and one call.
    severity: nit
  - description: Ran the Skill with its autonomous decisions and built without the grilling the owner's preference for questions-first suggests; no question was asked.
    solution: Say in the Skill that the owner's start is the approval for picks, so no question is expected.
    severity: nit
