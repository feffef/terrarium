frictions:
  - description: Drafted the claim that the issue counted 11 sessions breaking the glossary rule from the issue's prose alone; only six did. The fact-check caught it, costing two extra check rounds.
    solution: Read the ledger occurrences, not the summary sentence, before writing a count into a draft.
    severity: minor
  - description: Blind-read subagent brief omitted the CLAUDE.md ask to write files in a named scratchpad subfolder; the agent wrote none, so no harm.
    solution: Keep the CLAUDE.md subagent-brief asks as a pasted checklist in the blog-post step 6 brief.
    severity: nit
  - description: "merge-pr refused: I called code-review with only origin/main, not the full printed args naming the head sha, so the transcript showed no reviewed sha. One extra Skill call and retry."
    solution: Say in pr-workflow step 3 to paste the printed args whole, sha included.
    severity: nit
