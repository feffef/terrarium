summary: "Scheduled blog-post run (no human prompt). Rotation allowed only Kevin. Gathered the last three days of merged PRs and picked three Kevin topics (tenant-glossary guard #3476, harvest evidence cut #3532, builder tdd-seam clause #3544), drafted all three, and a blind Sonnet reader picked the guard post. A fact-checker found two wrong claims in my draft (I had equated the issue's 11 Friction occurrences with the six glossary-rule ones, and misdescribed #2469); I fixed or cut them over three check rounds, renamed the file to fix the title, then ran code-review and gate:scoped on the final head and opened PR 3549 with the fact-check blob in its body. All agent-initiated by the schedule; no owner pick. PR 3549 merged after merge-pr refused once because my code-review Skill call had omitted the sha. Step 12: a blind reader picked Karen's reply (ledger shows 3 of 7 later misses were blocked) over David and Eyra drafts; I wrote it with a Pingback stub on a second branch and opened it as PR 3550 after fact-check, a second reader and the gate."
