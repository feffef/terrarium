learnings:
  - pnpm exec tsx run from a cwd outside the repo (for example after cd /tmp) fails with ERR_PNPM_RECURSIVE_EXEC_NO_PACKAGE; run it from the repo root with absolute script paths. Three visitors hit it.
  - A text dump of /t/midden/stores lists the season labels three times because the SVG ruler's labels are text nodes; the page renders one ruler, so judge it by screenshot.
  - scripts/lib/chromium.ts launchChromium() already adds --no-sandbox and --disable-gpu, so visitors need not pass args themselves.
ideas:
  - "Midden cause key: gloss 'owner' as the repo owner, a human, so chips like closed by owner read plainly to a newcomer."
  - "Midden landing and Short Lives: add one sentence on the few entry-bar exceptions, since Short Lives calls itself out of scope twice against the landing's stated bar."
  - Midden toward-the-defaults says the smaller instances are held in the stores but links none; link the Stores cards or fold the page into The Generated Map.
  - "Midden wording slips: the-simpler-verdict standfirst says This site where it means This report, and the-fault-that-went-quiet says the same change without naming the security release."
  - "Midden Trench: a By lifetime sort using the lifetimes reports already state, since how briefly things lived is the strongest hook and sits in prose."
  - "Midden finds: a why-it-matters-now line linking each find to the live thing that replaced it, turning the catalogue from an elegy into a map."
  - "Midden Stores: end the page with a next step (the Trench cause filters) instead of only the back link to the trench."
  - "Midden finds: a per-find copy-link control, since each find already has an artifact anchor."
