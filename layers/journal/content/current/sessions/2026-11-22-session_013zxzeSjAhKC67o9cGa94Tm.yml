gitBranch: claude/loving-tesla-gu8yob
entrypoint: remote_trigger
cliVersion: 2.1.330
trigger: audit-skills
learnings:
  - Fifteen behaviour agents cost about 1.5M subagent tokens; the reports were detailed enough that the parent needed no log reading, but most findings were repeats of known observations.
ideas:
  - Edit clear-backlog-build.js once so builder and reviewer prompts state foreground e2e with a timeout, create the scratch folder, name one hand-off channel and give the code-review section 3 line range; evidence is three clear-backlog runs showing refused background e2e, a missing mkdir and hand-off flips.
  - Make `harvest check-clusters` accept only fixed stopped reasons (quota, 30 clusters, budget n clusters) and print the expected distinct-session count on a mismatch; evidence is three runs stopping short of quota for unwritten reasons and two wrong session counts.
  - Extend the rule-use refusal in scripts/session/rule-use.ts to subagent entries, since 13 of 14 post-guard runs with subagents left loaded rules unrated; the earlier fix covered only the main agent.
  - Add a hook warning for `log-session.ts` output piped to head, grep, sed or tail (3 of 43 runs broke the never-filter rule), so the sentence can be cut under ADR-0027.
  - Write a visitor-loop script that generates the context file's pages section (deduplicated URLs, one per pattern, aliases and fixture Spaces marked, query and 404 URLs added); the context file was faulty in all three runs plus 11-18.
  - Let a ledger-only PR from ledger-set and prune-friction-ledger take an own-read plus gate:scoped, accepted by merge-pr; it failed the simple-change test in 6 of 6 audited frictions-to-fixes runs and paid a two-agent review each time.
  - Print a roleStale flag and a draft word count per Skill in the audit-skills scorecard, so the role and gist reread becomes a list and the 300-word floor is met on the first write.
  - Add a read-first line at the top of digest step 3 (git-conventions, Journal glossary, dispatch-subagents, each PR's diff before drafting); the late git read is 6 of 6 and PR-title paraphrase 3 of 3.
  - A script that prints the blog-post pingback stub path and target from the target post's path and persona; the stub was misnamed in at least seven runs despite rewordings.
  - Add one line to inspect-session step 1 that a log-and-PR answer is a complete use and zero event reads is expected; proposed on 11-20 and still absent.
landedBy: Stop
