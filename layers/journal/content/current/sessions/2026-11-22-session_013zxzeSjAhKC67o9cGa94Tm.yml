goal: Weekly check of the Platform's own Skills
status: completed
outcome: Audited 15 Skills, filed two issues, and landed the Inventory update as PR 3576.
summary: "Scheduled audit-skills run, started by a schedule with no human prompt; every step was the Skill's own. Step 1 built the scorecard for 11-15 to 11-22 and a subagent fetched usage for 11 Routine runs. Step 2 ran 15 read-only Sonnet behaviour checks, one per Skill, from the repo's brief. Step 3 closure signals were all empty (orphan scan ran: 169 merged PRs, 90 issues, no orphans, no suppressions, no human-prompted or rescued closures). Step 4 escalated two findings that cleared the repeated bar: \"#3574\" (glassbox-curate stopped after one PR again, the first unattended run on the new two-mode text) and \"#3575\" (prune-trial never marks the covered ledger entry on-trial; I confirmed the ledger entry is still open and that the Skill has no marking step). Other findings stayed observations: the clear-backlog Seedling sweep gap, subagent-only rule-use gaps in log-session, the blog-post stub name (already fixed in \"#3558\" after those runs) and several repeated late-read and review-cost patterns. Step 5 appended a fresh observation and auditSummary to each of the 15 Skills, changed no grade, role or gist, and appended 11 Routine run costs. check-states flagged five ordinary-prose phrasings, which I reworded. Step 6 landed \"#3576\" after code-review on the first commit, my own read of a two-line follow-up, and a passing gate:scoped on the final head. Open: nothing; the issues wait for triage. Limits: the subagents' counts and ids were checked only where noted; the many claims marked unverified in the notes were not reread."
