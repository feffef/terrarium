frictions:
  - description: Wrote 15 Journal observations with one Node script before reading layers/journal/GLOSSARY.md; the tenant-glossary guard only fired on a later Edit.
    solution: Read the Journal glossary in step 5 before the first Inventory write; a note in audit-skills step 5 would do it.
    severity: minor
  - description: Put counts, ids and attributions from 15 subagent reports into the notes after checking only a few (prune-trial entry status, issue states); the rest carry an unverified tag.
    solution: Have the brief ask each agent to list its three claims most worth re-checking, so the parent verifies those.
    severity: minor
  - description: check-states flagged five ordinary-prose phrasings (written open, merged) in my new notes; I reworded them.
    solution: Let check-states ignore a state word that follows 'was' or sits in a clause about an earlier audit.
    severity: nit
  - description: The log-session note came out at 282 words, under the 300-word floor; my own length check caught it and I extended it.
    solution: Have the audit-skills scorecard print a draft word count so the floor is met on the first write.
    severity: nit
