frictions:
  - description: CLAUDE.md demands adr-check before any recommendation, but frictions-to-fixes mandates dispatch/drop decisions without a step for it; I decided picks without running adr-check.
    solution: "Let frictions-to-fixes name adr-check in the decide step or exempt its decisions in CLAUDE.md (issue #2342 already tracks this)."
    severity: minor
  - description: dispatch-subagents says run the gate in the foreground because a guard denies backgrounding, while CLAUDE.md says start any gate over 2 minutes with run_in_background; I followed CLAUDE.md and it worked.
    solution: State once, in CLAUDE.md, which applies to the orchestrator versus a dispatched subagent.
    severity: nit
  - description: The Stop hook demanded a push twice while the required gate was still running, and ADR-0004 says to push only after a green gate.
    solution: Have the hook skip its nag while a gate:scoped run is in progress.
    severity: nit
  - description: Survey agent reported the survey brief pulls opposite ways on closed-issue search (brief says search_issues, github-integration.md says avoid it), and that --summary's max-severity column does not match the brief's 'since the latest PR' part (e).
    solution: Make --summary print the severity since the latest PR, and reconcile the search guidance in the brief with github-integration.md.
    severity: minor
  - description: Design agent could not cheaply locate docReadCounts in the 4000-line audit-skills.ts JSON, and received truncated session ids in the PICKS text.
    solution: Give audit-skills.ts a --doc PATH flag, and pass full session ids in the design brief picks.
    severity: nit
