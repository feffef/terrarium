summary: "Human-instructed: the user asked me to read and explain #1698, keeping in mind that the last days mixed cloud and local sessions, and to propose improvements. They then asked whether it relates to a prune trial, told me they share one working copy for read-only local sessions and use worktrees only for writing ones, chose fixes 1 (transcript-based ownership) and 2 (blocker to major), dropped the .archify gitignore idea, and asked for the issue and PR to be referenced in the prune-trial ledger. Later they ran /code-review on the PR and told me to apply all fixes I proposed from it. Analysis: the three 2026-10-08 sessions were all local CLI sessions in one working copy; the two flagged ones committed nothing, and 1f97b613's correct commits landed in their origin/main..HEAD after they started. The issue's preferred option (skip trailers naming a logged session) was rejected because it would pass #387's own failure mode. No prune trial caused the bug, but three open trials' checks could misread the false blockers as damage. The review found my first version scanned every tool result, so a commit line the session merely read (a log, a sibling's transcript) would bring the #1698 false positive back, and subject matching could claim a sibling's commit; both were fixed by reading only results of Bash calls running a committing git command at command position, and using subjects only after a rebase. The review also caught three pasted copies of one fact in the ledger; they became one pointer per trial plus a single comment on #1698. Agent-initiated: subagent transcripts, the rebase handling, the command-position rule (found when a live probe showed a denied heredoc quoting git rebase had switched subject matching on), and documenting the residual fail-opens in the header. A second /code-review round found the shell-command matching both too loose and too strict. The user then asked whether the whole thing was too complicated; the Journal showed all three findings the guard ever logged were false positives and the commit-time guards already cover the failure, so on the user's instruction I closed #1704 and opened #1708 on a new branch removing the teardown check, keeping resolveGroundTruthFromTranscript (moved into session-trace.ts) and the two remaining ledger pointers."
