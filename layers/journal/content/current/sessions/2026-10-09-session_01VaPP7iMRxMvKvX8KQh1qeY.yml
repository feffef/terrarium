frictions:
  - description: "Broke CLAUDE.md 'Before your first GitHub operation read github-integration.md': I cat'ed it with CONTEXT files through head -400, which cut it off unread. No harm seen; risk was missing a GitHub tool trap."
    solution: Read each mandatory doc with the Read tool, one per call, so truncation is visible; a combined cat hid that the doc never printed.
    severity: minor
  - description: Broke CLAUDE.md 'Read files with the Read tool, not cat' for CONTEXT-MAP.md, CONTEXT.md, git-conventions.md and guards.md. No impact; none were edited.
    solution: Auto mode's 'shell reads are fine' hint competes with CLAUDE.md; CLAUDE.md wins here.
    severity: nit
  - description: "Skipped part of CLAUDE.md's ADR trigger: grep found ADR-0009 and ADR-0025 for the touched paths, but I read only ADR-0009's matching lines, not either in full, nor ADR-0027 before editing the prune-trial ledger. The ledger misuse of check: that review later caught is the kind of thing ADR-0027 would have shown."
    solution: Read every ADR the grep returns in full before editing; for the ledger, ADR-0027 and the prune-trial Skill are the binding docs.
    severity: minor
  - description: "My first version of the fix scanned every tool result for commit lines, which would have reintroduced the #1698 false positive for any commit line the session merely read, and claimed siblings' commits by subject. Caught by /code-review before merge, fixed in the same PR."
    solution: For an ownership check, write the adversarial 'read, not made' and 'same subject' tests first; guards.md already asks for adversarial inputs.
    severity: minor
  - description: "Pasted the same four-line fact into three prune-trial check: fields and added a to-do there, against CLAUDE.md 'one home per fact' and the ledger's own contract. Caught by review, reduced to pointers plus one issue comment."
    solution: Put facts in one home (an issue comment) and point to it from ledger entries.
    severity: minor
  - description: "My first live probe of the fixed guard passed vacuously: I had committed with git commit -q, which prints no [branch sha] line, so the guard saw no commits. Caught by checking findMadeCommits output, documented as a fail-open."
    solution: When live-probing a check, assert the positive path (it found something) not just a pass.
    severity: minor
  - description: "commit-trailer-guard denied a Bash python heredoc that only edited a test file, because the heredoc text contained a git commit fixture and a Claude-Session: string. Worked around by writing the script to a file first."
    solution: The guard could ignore text inside heredoc bodies, or anchor git commit at command position, the same fix this PR applies to session-id-guard.
    severity: minor
  - description: tail-pipe-guard denied two of my commands (a background wait loop piped to grep, an amend piped to head); fixed in one retry each from the deny message.
    solution: Redirect to a file and read it, as the deny message says.
    severity: nit
  - description: A blanket str.replace in my test-edit script also rewrote the MADE_ALL constant's own definition into a self-reference; the test run caught it at once.
    solution: Replace before adding the new definition, or scope replacements to the region being edited.
    severity: nit
  - description: "SHELL-READ-DETECTION false positive: docs/agents/environment-caveats.md credited from command `sed -n 70,96p layers/journal/content/current/sessions/2026-10-08-1f97b613-f529-4487-a7e9-1115a44b84c7.yml; grep -rn worktree CLAUDE.md docs/agents/*.md | head`. Its output was a session log's friction quoting the doc's fix, not the doc; grep -rn showed only one environment-caveats line about a worktree guard."
    solution: Credit a doc only when the matching line's output source is that file (grep -rn prefixes it); a quoted fix inside another file should not count.
    severity: moderate
  - description: I spent two fix-and-review rounds hardening session-id-guard's ownership parsing before checking whether the guard caught anything at all; the Journal showed its three findings ever were all false positives, so the right fix was deletion. The user had to prompt the step back.
    solution: "Before fixing a recurring false positive in a guard, count its true positives in the Journal first; a guard with none and a stronger point-of-action cover is a deletion candidate (CLAUDE.md: cut before you add)."
    severity: moderate
