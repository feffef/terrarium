learnings:
  - On a local machine, parallel sessions in one working copy share HEAD, so any git-range notion of 'this session's commits' sees siblings' commits; only the transcript knows which commits a session made.
  - git commit -q suppresses the [branch sha] subject line, the only per-commit trace a session's transcript otherwise carries; a merge prints none either.
  - Matching a command by substring catches text it merely quotes (heredocs, grep patterns, echo); anchoring at command position after ^ ; & | ( avoids that cheaply.
ideas:
  - "Record each session's commits at commit time: have the commit-msg or post-commit hook append sha and session id to a gitignored per-session file, so session-id-guard and the trace extractor get exact ownership even for git commit -q, merges and rebases, instead of parsing tool output."
  - Share one 'git at command position' matcher across commit-trailer-guard, session-id-guard and the other Bash-matching guards, so a heredoc or grep that only mentions git stops tripping them.
