learnings:
  - On a local machine, parallel sessions in one working copy share HEAD, so any git-range notion of 'this session's commits' sees siblings' commits; only the transcript knows which commits a session made.
  - git commit -q suppresses the [branch sha] subject line, the only per-commit trace a session's transcript otherwise carries.
ideas:
  - "Record each session's commits at commit time: have the commit-msg or post-commit hook append sha and session id to a gitignored per-session file, so session-id-guard and the trace extractor get exact ownership even for git commit -q and rebases, instead of parsing tool output."
