frictions:
  - description: "Broke CLAUDE.md 'Read files with the Read tool': read docs, the build workflow and the human-merge rule with cat/sed in Bash, so some rules loaded only via the hint hook"
    solution: Use Read for instruction docs even when batching; a Bash hint caught most of them
    severity: minor
  - description: clear-backlog-build returned status failed for the 2069/2076 branch only because review hit its 3-round cap, though every remaining finding was a judgement call (worthFixing false)
    solution: Have the workflow return ready-to-push when the final round's findings are all worthFixing false
    severity: minor
  - description: "Build agents' decisions contradicted themselves: 2071 said the 22.13 claim was both verified and unverified; 2069 said expand-transition was left excluded, then kept re-included"
    solution: Have the fix agent rewrite decisions whole each round instead of appending, so stale lines drop out
    severity: minor
  - description: "scripts/human-only-paths.ts printed nothing for #2080, but ADR-0004 still reserves it (behaviour no gate observes); easy to miss when trusting the script"
    solution: Note in clear-backlog section 4 that the path list covers only one ADR-0004 exception
    severity: nit
  - description: Committed small wording fixes on the 2029 and 2071 worktrees after their gate ran and pushed without rerunning gate:scoped (validate-adr-rules only); the nuxt.config.ts edit is a comment in a code file
    solution: Run pnpm validate:content or gate:scoped for any non-doc follow-up, even a comment
    severity: minor
  - description: First diffed a worktree with two-dot origin/main..HEAD and saw an unrelated session log file because main had moved
    solution: Use three-dot diffs as git-conventions says; I switched once I saw the stray file
    severity: nit
