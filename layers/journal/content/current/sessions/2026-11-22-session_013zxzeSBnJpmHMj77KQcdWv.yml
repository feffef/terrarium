frictions:
  - description: Edited the Journal Skill page without reading layers/journal/GLOSSARY.md, though the tenant-glossary rule says to read it before working on a Tenant.
    solution: A rule can't order a read before the one that loads it; add the glossary read to the start of any Tenant UI task, or load it on layers/journal paths at session start.
    severity: minor
  - description: Hooks said to read ADR-0006, ADR-0008 and ADR-0016 in full after I edited the page; I did not read them, only kept the useSpace data path unchanged.
    solution: Narrow ADR-0016 and ADR-0006 paths so a styling-only edit to a Space page does not trigger three ADR reads.
    severity: nit
  - description: Read only the first 80 lines of verifying-ui-changes.md though CLAUDE.md says read the whole doc, since a rule can sit anywhere.
    solution: Shorten the doc, or move its key rules into the ui-verification rule.
    severity: nit
  - description: Showed the owner a screenshot with default blue links; had I checked the page against the tenant CSS first, one round of feedback would have been saved.
    solution: Before a UI sample, grep the layer's theme.css for the element's styles.
    severity: nit
  - description: The adr-0004-human-merge rule loaded when I only grepped package.json and read tests/README.md, saying I touched a Human-only file when none changed.
    solution: Load the rule on edits to its paths only, not on shell reads of them.
    severity: nit
