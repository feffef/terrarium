frictions:
  - description: "The survey subagent appended fixes but missed that PR #2973 closed regression issue #2958 for premise-not-questioned; I found it only because I re-checked the regression screen before filing."
    solution: Survey-brief §2.4 could say to check each closed regression issue's closing PR and record it as a fix on that entry.
    severity: minor
  - description: Picked three two-occurrence minor/nit entries whose only fixes were Human-only guards; the design subagent (96k tokens) returned no change for all three, so the pick, design and drop steps bought only ledger notes.
    solution: SKILL.md §3 could skip entries whose docs already state the rule and were read and whose only fix is a guard or gate file, before spending a design agent.
    severity: minor
  - description: SKILL.md §5 step 4 says to review the ledger PR by the simple-change test, but the ledger diff (25 files, 238 lines) fails that test, so I ran code-review with two subagents.
    solution: Say in §5 that a ledger PR is exempt from code-review, or that it is reviewed by the ledger content test and gate only.
    severity: minor
  - description: "Survey subagent hit ledger-append-refuses-held-session: its single --append call aborted on one held session, so it looped about 36 sequential calls, past the foreground limit, and mistyped four session ids."
    solution: Let print-ledger-occurrence.ts --append skip already-held sessions and report them, instead of aborting the whole call.
    severity: minor
  - description: Stop hook asked me to push twice while work was mid-flight; each time a plain push opened no PR, but it interrupted waiting turns.
    solution: Already tracked as stop-hook-nag; no new fix.
    severity: nit
  - description: A bare cd into a ledger subfolder moved the session's working directory, which the harness reported two turns later.
    solution: Use absolute paths instead of cd, as CLAUDE.md-adjacent docs already advise (bare-cd-moves-session-cwd).
    severity: nit
  - description: The design subagent's note cited line numbers for pr-workflow.md and git-conventions.md that I kept in ledger notes; the Standards reviewer found git-conventions.md does not name git switch --discard-changes, so the note is slightly imprecise.
    solution: Verify a doc-forbids claim against the exact command before writing it into a note.
    severity: nit
