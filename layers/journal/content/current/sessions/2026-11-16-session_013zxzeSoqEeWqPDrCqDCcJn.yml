frictions:
  - description: Opened and merged PR 3369, and opened PR 3371, with no code-review and no gate:scoped. Each added a run-entry file, so neither met the simple-change bar in pr-workflow.md; ADR-0004 requires both.
    solution: Run code-review and gate:scoped (in the background) before every PR; count the file-added rule before taking the own-read path.
    severity: major
  - description: First Agent call for the Scout was denied by the dispatch-read guard because dispatch-subagents was unread; the Skill's trigger is only in CLAUDE.md prose.
    solution: Have glassbox-curate say to read dispatch-subagents before the Scout brief.
    severity: nit
  - description: Glossing ADR pushed the Why bullet over its word cap; found only by running the page test, then fixed by trimming other words.
    solution: Say in the Skill's Fix step that a bullet near 65 words has no room for a gloss.
    severity: nit
  - description: "Stopped after one PR at about a third of the context budget: with no get_session the cost was unknown, and I read that as the repeat loop not applying; the owner had to ask."
    solution: glassbox-curate should say the loop applies to scheduled autonomous runs too, with the estimated context limit as the budget (issue 3370).
    severity: moderate
  - description: "My verdict comment on PR 3369 said code-review was skipped yet carried a Reviewed: line from verdict-line.ts, and merge-pr.ts accepted it; the line asserts a review no tool checks."
    solution: verdict-line.ts or merge-pr.ts should require evidence a review ran, or the line should not print unless a review is recorded.
    severity: major
