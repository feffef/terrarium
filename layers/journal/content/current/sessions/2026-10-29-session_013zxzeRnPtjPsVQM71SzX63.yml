  - description: Called the Agent tool before reading dispatch-subagents SKILL.md; the dispatch-read guard blocked the call, costing one retry.
    solution: Read the Skill when the frictions-to-fixes Skill first says to dispatch, or have the Skill name the read at its start.
    severity: nit
  - description: The Skill's top-three regression rule ranks by severity, which picked two phantom regressions (an owner-declined case and a stale-session false alarm); I skipped them by judgement.
    solution: Have the survey exclude regressions whose ref says closed not planned or false alarm before ranking the top three.
    severity: minor
  - description: "Survey subagent: print-ledger-occurrence --append aborts the whole call on one held session, forcing grep pre-checks; gh api --paginate failed through the proxy."
    solution: Let --append skip held sessions and report them; note the proxy pagination workaround in github-integration.md.
    severity: minor
  - description: Design subagent had no short path for nit picks where the right design is no change; sections 1 to 5 apply in full, and audit-skills output was 505 KB.
    solution: Let the design brief say a pick may stop at section 2 with no change when its cause is a read-past rule, and print docReadCounts alone.
    severity: nit
