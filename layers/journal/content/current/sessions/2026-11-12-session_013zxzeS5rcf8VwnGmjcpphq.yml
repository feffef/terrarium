summary: "An autonomous glassbox-curate run, started by the chained routine (no human prompt in this session). I chose the focus myself: the Verification Subject, because no PR touched the guide, it still capitalised glossary terms against the owner's rule, and no fresh reader had read it. The Scout found no new topic. Two fresh readers read the pages, an opus writer fixed them, a claim checker found one false jiti sentence, two overstated ones and a loose clause, and code-review found two motive clauses and one temporal word; all were corrected. One unsourced speed claim on Linting was cut. The memory page lost four items to stay under its word cap and gained the Verification leads and a question about the capitalised term definitions. Gate passed and PR 3179 merged. A second run in the same session did the Nuxt Content Subject the same way (PR 3180, merged); a third run did the Web standards Subject (PR 3181, open); it found one wrong claim on prefix in the source and confirmed a search sentence true. Still open: the terms files and the next Subject for the following run."
