frictions:
  - description: I asked the owner Q5 a on an explore pick whose audit-counting premise the agent itself marked unverified; no such count existed, which cost an extra owner question and a fix round.
    solution: Before asking, check each pick premise that explore marks unverified, or ask it as an open question instead of a recommendation.
    severity: moderate
  - description: "The #3662 brief told the builder to find and change an audit 'unrated' count I had not confirmed existed; the builder had to refute it with a grep."
    solution: Verify a brief's every claim in source before dispatch; clear-backlog already says so.
    severity: minor
  - description: "The Glass Box page edit in the #3662 brief failed glassbox-pages.spec on the first gate because the page is pinned to a revision; one full gate run was wasted."
    solution: A brief that names a Glass Box page should say it is pinned and may not be edited outside a Glass Box run.
    severity: minor
  - description: I ran git log on a worktree to verify a builder's claim before reading git-conventions.md; the hook said read first, and the doc showed the call was fine.
    solution: None needed; the read-only log exemption is narrow, so read the doc at the first conclusion-drawing log.
    severity: nit
  - description: "A builder appended to decisions.md without updating earlier lines, so the #3662 file contradicted itself (no count added, then count added); I had to use my own summary for the PR body."
    solution: Tell builders to rewrite superseded decisions.md lines instead of appending.
    severity: nit
  - description: "Retro (builder): my brief named list-human-only-paths.ts without its path, so the builder looked under scripts/hooks, wrongly reported it missing and needed a correction round."
    solution: Briefs in clear-backlog-build.js should give the script's full path .agents/skills/clear-backlog/scripts/list-human-only-paths.ts.
    severity: minor
  - description: "Retro (builder and Standards reviewer): subagents hit repeated SubagentStop blocks as each new rule loaded and re-sent rule-use echoes for unrelated rules; a few extra calls with no new information."
    solution: Unverified how much it cost; the capped 3-block hook in PR 3689 bounds it, so judge after it merges.
    severity: nit
  - description: "Retro (Standards reviewer): round 2, triggered by the over-10-lines fix rule, found only wording leftovers, while the check on the Glass Box revert caught the one real issue."
    solution: Keep the size rule but let the re-check of a revert or pin conflict count as the second look; one data point, so frictions-to-fixes should wait for more.
    severity: nit
