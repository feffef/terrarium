summary: "Human-instructed: the owner started the clear-backlog Skill, then answered the grilling round (rule-path narrowing proposal approved, no subagent echo default, drop product-first ordering in harvest, replace harvest keyword evidence with a full digest, relabel and retitle issues). Agent-initiated: the sweep set (6 eligible issues; 8 Seedlings and one ready-for-human issue skipped), the explore run, relabelling to ready-for-agent, filing issue 3705 (late tenant-glossary hint, as the owner decided), the briefs, the build run, the pushes, the PRs and the merge of 3707. Four branches were built in worktrees. Harvest digest (3707) merged after green CI: it replaces keyword evidence with a full digest and drops the product-first ordering. Workflow evidence (3706) is open and waits for a human merge, since prompt wording is not test-observable. Journal tap targets and overflow (3708) merged after the owner confirmed the before and after screenshots I sent (no sample was shown first, since the change is meant to move nothing). The rule-paths branch (3340) has adr-0021 and mermaid-lanes narrowed but no PR: the builder held the adr-0029 path because no gate check catches an unreachable docs/agents doc, and that question is still open with the owner. The owner pushed back on two triage picks: subagents cannot be told read-only from builder (all general-purpose or workflow-subagent), and keyword matching was dropped for a full digest. Still open: the owner's answer on the adr-0029 path, the 3706 human merge, and the retro."
