frictions:
  - description: Ran git fetch and other git commands before reading git-conventions.md; the hook flagged it only after. No wrong result followed.
    solution: Load git-conventions earlier, or make the read-first hint fire on the first non-read-only git command.
    severity: nit
  - description: Labelled issues through issue_write before reading issue-tracker.md and triage-labels.md; the hook flagged them afterwards.
    solution: Read the tracker docs when the Skill's step 1 starts, not on the first write.
    severity: nit
  - description: Kept making tool calls (verifying hand-backs, sending resumes) while question Q9 was pending, against the clear-backlog rule to ask with no tool calls.
    solution: Cut the rule's no-tool-call clause, or say it applies only to the grilling round.
    severity: nit
  - description: The Stop hook repeatedly asked to push the harvest branch before its gate passed, conflicting with clear-backlog push-after-gate.
    solution: Have the stop hook skip worktree branches a running workflow owns.
    severity: minor
  - description: "Linked worktree(s) left with uncommitted or unpushed work at close: /home/user/terrarium/.claude/worktrees/wf_705700fc-260-1, /home/user/terrarium/.claude/worktrees/wf_705700fc-260-2, /home/user/terrarium/.claude/worktrees/wf_705700fc-260-4"
    solution: Push each, or remove it if its work is meant to be dropped.
    severity: minor
  - description: The journal branch's first gate run failed on a timing assert in tests/unit/shell-reads.spec.ts that the diff did not touch; the rerun passed, costing one gate run.
    solution: Make the heredoc linearity test robust against load, or run it with a generous bound.
    severity: minor
  - description: "Linked worktree(s) left with uncommitted or unpushed work at close: /home/user/terrarium/.claude/worktrees/wf_705700fc-260-1"
    solution: Push each, or remove it if its work is meant to be dropped.
    severity: minor
  - description: After a merge I re-authored the log with log-session directly instead of invoking close-session, so the Stop hook blocked the turn end twice.
    solution: Say in the merge step of pr-workflow that close-session, not log-session, is the re-invoke after a merge.
    severity: nit
