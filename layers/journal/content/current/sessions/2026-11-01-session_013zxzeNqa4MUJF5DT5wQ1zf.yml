frictions:
  - description: Called the first Agent call before reading dispatch-subagents, as CLAUDE.md requires before any subagent brief; the guard blocked it and the brief was resent.
    solution: Read dispatch-subagents right after the Skill's fact-check step names a subagent.
    severity: nit
  - description: First Digest draft called the docs check and Skills check weekly and the log sweep stray; the fact-check showed daily schedules and narrower behaviour, so I reworded.
    solution: Digest Skill could tell the writer never to state a cadence from session-goal wording.
    severity: minor
  - description: Review findings arrived while the gate ran, so I stopped the gate and re-ran it after trimming; the first gate run was wasted.
    solution: Run the Standards and Spec reviews before starting the gate, as pr-workflow orders.
    severity: minor
  - description: My amend was chained into the backgrounded gate command and never ran, leaving the trimmed Digest uncommitted while the gate tested it; I amended separately.
    solution: Commit in its own call before any backgrounded gate command.
    severity: nit
  - description: First PR body claimed 33 claims checked and 3 fixed without counting the report; I counted 32 rows and 1 wrong and edited the body.
    solution: Count the fact-check rows before writing the tally.
    severity: nit
  - description: Stop hook asked to push or commit four times while reviews and the gate were pending; ADR-0004 overrides it but each prompt cost a turn.
    solution: The hook should skip while a gate or review subagent is running.
    severity: nit
