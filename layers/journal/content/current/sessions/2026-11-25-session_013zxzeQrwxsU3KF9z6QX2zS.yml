frictions:
  - description: Started gate:scoped as a bare background subshell after cd had drifted; the first run had the wrong cwd output and a second gate refused to start beside it.
    solution: Launch with run_in_background and an explicit cd /home/user/terrarium, as CLAUDE.md says, and check cwd first.
    severity: minor
  - description: Called code-review with args lacking the head sha; the review-call guard blocked it and I reran with the printed args.
    solution: Always paste the output of verdict-line.ts --review-call whole.
    severity: nit
  - description: Ran git fetch in the same parallel call that read git-conventions.md, so the doc was not read before my first non-read-only git command.
    solution: Read the doc in an earlier call than the first fetch.
    severity: nit
  - description: Gave git commit both -m and -F in one call, which failed, and tried foreground sleep which the harness blocks.
    solution: Use one message source; wait with Monitor.
    severity: nit
  - description: guards.md's crash convention does not list the new blocking subagent-rule-use-stop hook that is wired with || true; reviewers and readers see a gap.
    solution: Add it to the fail-open list in docs/agents/guards.md lines 52-56 (human-merge file).
    severity: nit
