learnings:
  - "@nuxt/test-utils setup({ build: false, nuxtConfig: { nitro: { output: { dir } } } }) serves an existing .output; its own build used compatibilityDate 2024-04-03 and NODE_ENV=test, so the e2e had been testing a different build than production."
  - Parallel Nitro servers sharing one Nuxt Content SQLite file race the lazy per-collection import (database is locked, pages answer 500); NUXT_CONTENT_DATABASE_FILENAME per server fixes it, and the filled DB is .data/content/contents.sqlite, not under .output.
  - A vitest project's globalSetup runs only when that project has specs in the run (plus the root project), so an e2e-only build hook must sit on the e2e project.
  - "CI's playwright-core install had been dead weight: Linux Chromium now lands in chromium-<rev>/chrome-linux64/, chromium-path.ts scanned chrome-linux/, and the suite silently ran the runner's system Chrome."
  - vitest 5 drops console.log output from a passing run; a line that must always show goes through process.stdout.write.
  - "Splitting e2e spec files past the worker count costs more than it saves: each file adds ~3 s of server, DB copy and Chromium startup, and 3 workers on 4 vCPUs are bound by total work (CI: 65.6 s with 14 files vs 56 s with 9)."
  - pnpm exec tsx costs ~1.7 s per spawn here versus ~0.45 s for node --import tsx; guard specs that spawn per case pay that 45 times per file.
  - "Nuxt experimental.buildCache hashes only app/, layer config and the lockfile: it served stale content after a content-only edit and missed shared/ changes."
ideas:
  - "Component tests as a third vitest project (@nuxt/test-utils/runtime with happy-dom): the per-test classification in this session's PR description says 60 of 131 e2e tests only need a mounted component plus mocked queryCollection (39 Tinkerfund server-rendered checks, 8 Journal dashboard checks, Commons search/timeline). Gains maintainability and test speed per file, not gate wall-clock now that specs run in parallel; costs two devDependencies and queryCollection mocking."
  - "Shorten the new e2e critical path (tinkerfund-flows ~37 s, smoke ~31 s locally): move each Tenant's entry-route hydrations from the Platform sweep into that Tenant's spec, and split the six Tinkerfund flows two per file; both are mechanical and coverage-neutral."
  - "Unit step: eight hook-guard specs spawn a subprocess per case and take ~40 of the step's ~50 cumulative seconds (bash-rules-hint 17 s, subagent-background-guard 16 s, ...). Exercise the guard function in-process with one subprocess smoke test per guard."
