summary: "Human-instructed: investigate why the full gate (especially e2e) is slow and improve it without losing coverage, using Sonnet agents for exploration and refactoring with this session orchestrating; mid-way the user added that some e2e tests could become component tests; the user reviews and merges, no self-merge. Three read-only agents measured first: five CI job logs (full gate 205-296 s, e2e 99-130 s, pnpm build 27-47 s, Chromium download 17-22 s every run), a local profile (e2e 185 s of which 84 s was a second nuxt build inside setup()), and a source read of @nuxt/test-utils showing build:false plus nitro.output.dir serves an existing .output. Agent-initiated design, within the ask: reuse the gate's own build (freshness-checked by mtime, fail-closed, because a stale reuse once hid a regression), then split the single smoke spec into one spec per Tenant run in parallel by vitest, which needed a dated ADR-0004 amendment since the one-spec rule rested on the per-spec rebuild. Surprises: parallel Nitro servers sharing one Nuxt Content SQLite file corrupted each other's lazy import (database is locked, 500s), fixed by a per-spec copy of .data/content/contents.sqlite; CI's Chromium download had never been used because playwright-core now installs chrome-linux64 and chromium-path.ts scanned chrome-linux, so CI ran the runner's system Chrome; the e2e had been testing a build with test-utils' compatibilityDate 2024-04-03 rather than the production one. Twenty duplicate tests were folded with every assertion rehomed (150 to 131). The component-test suggestion was analysed, not built: a classification of all 150 tests (57 keep, 60 could be component tests, 3 unit, 20 duplicates) shows that after the parallel split it would no longer shorten wall-clock, and it adds two devDependencies plus a nuxt-environment vitest project, so it is reported for the user's decision. Local gate:scoped green; the PR's first CI run took 203 s for the composite (typical before: 270-295 s) with test:e2e at 56 s (before: 100-130 s), 9 files, 131 tests; the second run, with the Chromium cache hitting, 183 s. A main-side audit-docs sweep conflicted on tests/README.md, merged by hand; the owner then enabled auto-merge and the PR landed. Follow-up experiments (e2e file split, Chromium apt step, build caches, Floor parallelism, in-process guard specs) ran as separate Sonnet agents in worktrees after the merge, to find which remaining cuts are easy wins. Human-instructed: try all five in separate agents. Wins, now PR 1805: guard specs spawning node --import tsx instead of pnpm exec tsx plus isolate:false (unit 52 s to 28 s locally), eslint and incremental-typecheck caches, the Content parse cache, no sourcemaps, Chromium without apt deps. Rejected on measurement: the 14-file e2e split (65.6 s vs 56 s in CI, draft PR 1804 closed), disabling the sql_dump prerender (the runtime handler sets no ETag and re-splits the database per request, a live-site cost), Nuxt buildCache (served stale content), concurrent lint+typecheck (both already use ~3 cores)."
