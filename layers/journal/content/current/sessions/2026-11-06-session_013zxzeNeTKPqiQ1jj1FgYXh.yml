frictions:
  - description: Ran git fetch before reading docs/agents/git-conventions.md, and an MCP PR list before github-integration.md; both CLAUDE.md triggers. A hook then pointed to each.
    solution: Read the trigger docs right after the Skill's orientation step, before the first non-read-only git or GitHub call.
    severity: nit
  - description: git-scm.com returned 403, so the writer and checker verified git claims from the docs source on GitHub, and the mode 100644 meaning stayed unsourced.
    solution: Allow git-scm.com in the environment, or have EVERY-PAGE name the raw git/git docs path as a standard fallback.
    severity: nit
  - description: The first draft overstated that all five plumbing commands use GIT_INDEX_FILE and pinned a cost on ADR-0009 that it does not state; the claim checker caught both.
    solution: Keep the separate claim checker step; tell writers to cite a cost to code, not to an ADR that does not state it.
    severity: minor
  - description: The Skill says autonomous mode asks nothing, but the user's preference was to ask first and the invocation named no focus, so I asked one mode question.
    solution: Say in the Skill how a user-started run with no focus should choose its mode.
    severity: nit
  - description: Three of four subagent briefs (reader, claim checker, code-review pair) omitted CLAUDE.md's required ask for doc and rule verdicts, scratchpad subfolder and sourced counts; only the writer's brief had them.
    solution: Make the dispatch-subagents Skill's brief checklist include the CLAUDE.md every-brief line verbatim, so a brief cannot skip it.
    severity: minor
  - description: Bot comments 'safety-gate green on <sha>' named shas that were not the PR head (merge refs), so they could be misread as green on my head; I waited for the gate check run instead.
    solution: "Add one line to docs/agents/pr-workflow.md step 3: the head's check run decides, not the sha in the bot comment."
    severity: nit
