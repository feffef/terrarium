learnings:
  - Of the five git plumbing commands, only read-tree, update-index and write-tree use GIT_INDEX_FILE; hash-object and commit-tree do not.
  - The commit-msg hook runs for git commit and git merge but not for commit-tree, so a plumbing commit must carry its own trailer.
