frictions:
  - description: Launched the first subagent with an unfilled {PAGES} placeholder in its brief, wasting a run until I re-sent the page list.
    solution: Build briefs from a script or re-read the prompt for placeholders before dispatching.
    severity: minor
  - description: Read .claude/rules/glassbox-content.md and a term file with cat instead of the Read tool, against CLAUDE.md.
    solution: Use Read for repo files; the rule loaded anyway through the hook.
    severity: nit
  - description: Skipped the full ADR for ADR-0003, 0004, 0009 and 0017 though each summary says to read it; their summaries were enough but the instruction was not followed.
    solution: Either read them or let the summaries drop the must-read line for ADRs a content run never needs.
    severity: nit
  - description: The Stop hook asked to commit and push five times while subagents were still editing and gate and review were not yet run.
    solution: Let the hook stay quiet while background subagents are running.
    severity: nit
  - description: The glassbox-update script flags pages by directory-level paths such as .claude/rules/, so most flagged pages needed no edit and 17 pages took a four-agent sweep.
    solution: Have the script report changed files the page's prose or Excerpt names, not whole directories.
    severity: minor
