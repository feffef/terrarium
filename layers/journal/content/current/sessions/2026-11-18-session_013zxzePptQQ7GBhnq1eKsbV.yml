frictions:
  - description: First Workflow call was denied by the dispatch-read guard because I had not read dispatch-subagents before the subagent brief, as CLAUDE.md requires.
    solution: Read dispatch-subagents when clear-backlog starts, or name it in that Skill's first step (restored in PR 3461).
    severity: nit
  - description: Ran git log in the same parallel call as reading git-conventions.md, so the doc did not precede the first non-trivial git command.
    solution: Read git-conventions in an earlier call before any log used for a conclusion.
    severity: nit
  - description: Owner's "everything else waits" answer to Q10 was ambiguous; I read it as not building the Blog fix and did not re-ask.
    solution: Phrase a go/hold question so each option names the issue it holds.
    severity: nit
  - description: After the owner's answers I did not set ready-for-agent on the three issues, so merge-pr.ts refused the first PR (closes-unready-issue) and cost one retry.
    solution: Name the relabel step at the start of clear-backlog section 3 (candidate C4 in the 3143 report).
    severity: minor
  - description: Subagent hooks demanded rule-use echoes and full-ADR reads after compliant edits, costing read-only reviewers and builders extra calls (six agents named it).
    solution: Skip the rule-use prompt for read-only subagents and read an ADR only when the edit touches what it governs.
    severity: minor
