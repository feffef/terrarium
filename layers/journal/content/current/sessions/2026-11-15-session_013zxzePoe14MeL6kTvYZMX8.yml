learnings:
  - On the Glass Box guide, excerpt-header paths are clipped inside their figure, so document scrollWidth stays 390 and misses them; a per-element getBoundingClientRect scan finds them.
ideas:
  - "[blind, content editor] /t/glassbox/guide/walkthroughs: the bare path 404s while the sidebar lists ten Walkthroughs and the other Subject indexes exist. Add a plain Walkthroughs index with one sentence per story, so a visitor who trims the URL lands somewhere."
  - "[content editor] /t/glassbox/guide/skill-pack/wayfinder: to-spec, ask-matt, HITL, AFK and Fog appear in one paragraph with no gloss. Add a short words-you-will-meet list saying which are Terrarium's and which come from the upstream skill."
  - "[content editor] /t/glassbox/guide/terrarium-practice/skill-inventory: says a script deletes observations after a fixed window without naming it. Say where the window is set, without a changing number in prose."
  - "[content editor] /t/glassbox/guide/deploy/pnpm-lockfile: says Terrarium installs in three places, then that each agent session runs pnpm install. Fold sessions into the contributor-checkout place so the count is not contradicted."
  - "[content editor] /t/glassbox/guide/walkthroughs/asking-for-a-change step 9 restates the merge refusals as a partial list that differs from the guide home page. Point step 9 to the one full list in the gate and human-in-the-loop lessons."
  - "[content editor] /t/glassbox/guide/verification/gate: uses FLOOR, HEAVY and inert as prose words. Bold each at first use with a one-line meaning so readers can scan for them."
  - "[content editor] /t/glassbox/guide: no A to Z term list exists for words such as friction, seedling, routine and fog. Check the guide's terms Space first, then offer a one-screen list linking each term to its lesson."
  - "[blind, UI tester] /t/glassbox/guide at 390px: the lead paragraph fills the first screen before any navigation. Shorten or shrink it on phones, not as a Start here strip, which the owner ruled out."
