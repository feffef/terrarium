outcome: "Both icons shipped: ? on expandable terms (PR 3056) and a book on Lesson links and chips (PR 3067), each merged after a green gate"
summary: "The owner asked (direct ask) that Glass Box glossary terms that expand carry a \"?\" marker, like the arrow on code links. Following their preference to ask first, I read Term.vue and File.vue and asked three questions (placement, scope, open state); the owner answered all three. I built it, and the owner then steered the look by direct asks (smaller, then an icon that does not read as part of the sentence, then smaller again) and approved it; the circled-icon design and sizes were agent-proposed within those asks. gate:scoped passed, I read the one-file diff myself and merged PR 3056 (agent-initiated merge per ADR-0004). The owner then asked (direct ask) for a similar marker on inline links to other lessons and which icon to use. I surveyed the existing glyphs, proposed a book, the owner chose it, asked for it on Lesson chips too, and asked for a sample of 2-3 designs; I rendered three, the owner picked variant A (outline open book) and said to build, review and merge (and to merge main if content needed touching, which it did not). The rule is one CSS mask in Article.vue matched by href /t/glassbox/, plus removing the dead arrow in Term.vue; main's new Lesson chip inside Term definitions needed that cleanup. Because the diff was over 10 lines I ran code-review (two read-only subagents, agent-initiated per the PR workflow): it found my selector also hit the subject chip and the prev/next cards, which I verified in the DOM and excluded before landing. gate:scoped passed on 8117fab23, CI's gate went green, I posted my verdict and merged PR 3067 as defa1ddf9 through merge-pr.ts (agent-initiated per ADR-0004, owner had said merge). Verification cost the most again: stale dev servers (CSS, then the content database after fast-forwarding main) and screenshot scripts that sampled the wrong element, each caught by reading computed values or counts in the DOM instead of trusting the picture."
