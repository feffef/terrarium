entrypoint: remote_mobile
cliVersion: 2.1.322
learnings:
  - A Glass Box Lesson's Where next is a hand-written list of at most five links, so it has no ranked extras to backfill with after read ones are moved out
  - A saved workflow's build agent keeps running under its journal id, so a SendMessage to it mid-run lands in the same worktree as the live run
  - run-summary.ts --build --run writes the reviewers' findings files as a side effect, so a builder resumed before it runs finds nothing
ideas:
  - Let clear-backlog run an owner-requested prototype inside its own prototype worktree and print the three screenshots itself, so a visual question costs one step instead of a hand-built dev-server loop
landedBy: Stop
