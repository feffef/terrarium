frictions:
  - description: "I SendMessage-resumed a workflow's build agent while its run was live, so two writers edited the #3130 worktree and the workflow reported failed."
    solution: Say in clear-backlog §3 never to resume a workflow agent until its run ends; send owner design changes after the run result.
    severity: moderate
  - description: I labelled issues before reading triage-labels.md, and ran git rev-parse before git-conventions.md; both hooks flagged it after the call.
    solution: Read the named docs in the first batch of tool calls once the Skill's rules are in context.
    severity: nit
  - description: The dispatch-read guard blocked my first Workflow call until I read dispatch-subagents, though the saved workflow writes its own briefs.
    solution: Exempt named saved workflows from the read guard, or list dispatch-subagents in clear-backlog's read-first.
    severity: nit
  - description: The dev server answered 503 for several minutes on cold start and a wrong Lesson slug (10.gate vs gate) cost two failed screenshot rounds.
    solution: Say in verifying-ui-changes.md that dev answers 503 until Ready and that the route drops the numeric prefix.
    severity: minor
  - description: A Stop hook demanded a commit of the prototype edits mid-session, forcing a branch switch away from the session branch.
    solution: Start a prototype in a prototype/ branch worktree so the session checkout stays clean.
    severity: nit
  - description: "Linked worktree(s) left with uncommitted or unpushed work at close: /home/user/terrarium/.claude/worktrees/wf_ecc8c921-b7b-1, /home/user/terrarium/.claude/worktrees/wf_ecc8c921-b7b-3, /home/user/terrarium/.claude/worktrees/wf_ecc8c921-b7b-4, /home/user/terrarium/.claude/worktrees/wf_ecc8c921-b7b-5"
    solution: Push each, or remove it if its work is meant to be dropped.
    severity: minor
  - description: Round-3 findings files did not exist when I resumed the harvest builder right after the workflow result, so it replied it had nothing to fix.
    solution: Have the workflow write each findings file before it returns, or run-summary should wait for them.
    severity: nit
  - description: "Linked worktree(s) left with uncommitted or unpushed work at close: /home/user/terrarium/.claude/worktrees/wf_0ff57fd2-593-1, /home/user/terrarium/.claude/worktrees/wf_ecc8c921-b7b-1, /home/user/terrarium/.claude/worktrees/wf_ecc8c921-b7b-5"
    solution: Push each, or remove it if its work is meant to be dropped.
    severity: minor
  - description: run-summary.ts is what writes the findings files, so resuming a builder before running it gave a reply that there was nothing to fix, twice.
    solution: Say in clear-backlog §3 to run run-summary --build before sending any findings, or have the workflow write the files itself.
    severity: nit
