frictions:
  - description: The Stop hook asked to push three times while code-review and the gate ran; ADR-0004 says hold the first push until both finish.
    solution: "None: the owner accepted this cost (issue 2233)."
    severity: nit
  - description: Both read-only Sonnet probes left a detached-HEAD worktree behind (the checkout to the pinned SHA defeats auto-cleanup); I removed each by hand before check:worktrees.
    solution: Have the prune-trial probe brief end with the agent removing nothing but tell the orchestrator to expect the worktree, or let unchanged detached worktrees auto-clean.
    severity: nit
  - description: The Standards reviewer called the brief's 'gh pr view is blocked' drift after grepping docs/agents for 'blocked', missing github-integration.md's table that lists it as GraphQL-backed and blocked in the cloud; verifying cost a lookup.
    solution: A review brief that names github-integration.md among the standards sources whenever the diff cites a gh command; the brief now cites the doc itself.
    severity: minor
  - description: My first survey-brief draft told the agent to print all occurrence pairs in one call and pipe them into one entry's ledger-set.ts call, which cannot route blocks to several entries; the probe and the Spec review caught it.
    solution: "Fixed in the second commit: one print, one --occurrences file per entry. A print-ledger-occurrence flag that groups output by entry would remove the split."
    severity: nit
  - description: "The design brief's docsReadViaShell caveat (logs older than 2026-10-10) is stale: the 14-day ledger horizon no longer reaches such logs, so every design agent reads a dead branch."
    solution: Cut the sentence; proposed to the owner among five cuts, awaiting their answer.
    severity: nit
  - description: Each of three read-only Sonnet probes got a PostToolUse hint to read git-conventions.md after its single detached checkout, which clashed with the brief's rule to read nothing but the briefs; each spent words explaining why it ignored it.
    solution: Let a probe brief name git-conventions.md as pre-read by the orchestrator, or have the hint skip a detached checkout of a pinned SHA.
    severity: nit
  - description: "pr-workflow's follow-up rule sent a 30-line owner-directed prose cut, already probed on Sonnet, through a full two-agent code-review before merge: about 170k subagent tokens to confirm nothing."
    solution: "None proposed: pr-workflow.md is in an open Prune Trial (its 'simple change' bar), so the cost is logged here for that trial's verdict."
    severity: minor
  - description: "My verdict comment on PR #2540 named a Reviewed SHA I expanded from the short hash instead of copying it, so it was wrong; merge-pr.ts would have refused it and a wrong id sat in a public comment until I corrected it one call later."
    solution: Copy the full SHA from git rev-parse in the same turn as the comment, never from a short hash; CLAUDE.md's verify-before-you-state covers this and I skipped it.
    severity: minor
  - description: Pushing the session branch recut from main was rejected as stale info under --force-with-lease, because the remote branch was deleted on merge; the push hook explained it and a prune plus plain push worked.
    solution: "None needed: the hook's hint (issue 1610) was exact. The harness instruction to use force-with-lease on a recut branch could say to prune first."
    severity: nit
  - description: pr-workflow's follow-up rule sent two further code-review rounds (four agents) over a 40-line review-fix commit and then a 2-line one; each round found one cosmetic slip.
    solution: "None proposed: pr-workflow.md is in an open Prune Trial; logged for its verdict."
    severity: minor
