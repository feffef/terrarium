outcome: "PR #2539 (briefs rewritten as a Prune Trial) and PR #2540 (print-ledger-occurrence --append) both merged"
summary: "Human-instructed throughout. The owner asked for the three frictions-to-fixes agent briefs (survey, design, impl) to get the same clean per-step rewrite SKILL.md got on 2026-10-20, keeping every rule. Per their preference I asked three questions first; they chose the SKILL.md shape adapted (role and inputs up front, then Goal / Instructions / Done when / Edge cases per step, then the report), a Prune Trial rather than a plain PR, and four fixes alongside the restructure: the design brief's dangling opening and session-log path, the dead \"audit-docs house rules\" pointer, SKILL.md saying what \"verbatim\" means for a brief handed by path, and the survey's candidate set (every entry --candidates lists). I inventoried every rule of the old briefs before writing, reordered the survey so it screens before it ranks, and committed. A Sonnet probe pinned to that commit answered sixteen scenarios from the briefs alone. code-review (Standards and Spec) found a hedge I had hardened, two done-when lines an agent could not check, a half-made pointer in the impl brief, and an ambiguous pipe of occurrence blocks into ledger-set.ts; the owner meanwhile asked for a Done when section per step. A second commit took all of that; I declined one Standards claim (gh pr view is blocked in the cloud, per github-integration.md) and said why in the brief. Re-probed at the final head, gate green, pushed, PR #2539 opened with the trial entry. Agent-initiated: the step reorder and the verdict comment. The owner then asked whether anything could be cut; I proposed five cuts (the ledger data model restated in survey section 2, a stale docsReadViaShell caveat, a no-op schema check, an incident example, script semantics copied from headers). They said do the cuts but not to expect agents to read script headers, so the fifth stayed and the first became a tightening with every fact inline. A third commit took them, re-probed on Sonnet and reviewed on its own diff (both axes clean); CI green, merged through merge-pr.ts as an ordinary agent PR (ADR-0027: a trial PR merges like any agent's). The owner then asked me to explain the idea from my log (print-ledger-occurrence taking entry-session-index triples so the survey agent never splits printed blocks by hand) and said build it and amend the trial. Built on the session branch recut from main: an --append mode that groups picks by entry and appends through ledger-set's setEntry (schema still refuses a duplicate session, nothing written on any failure), unit tests, a smoke test on the real ledger, the survey brief's step reduced to one command, the trial entry amended. Two code-review rounds (shared lookup and index check, entry-prefixed errors, a type rename, header and brief restatements cut), gate green, PR #2540 opened and merged through merge-pr.ts once CI passed. One slip on the way: my first verdict comment on #2540 carried a Reviewed SHA expanded from the short hash, corrected one call later."
