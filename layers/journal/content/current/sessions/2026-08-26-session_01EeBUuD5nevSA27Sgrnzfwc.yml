learnings:
  - dagre routes a mermaid edge behind an unrelated sibling node when a parent's children fan wider than the parent, so the edge reads as belonging to the sibling — it bit twice, and only checking the rendered SVG (never the source) catches it
  - Keeping each Tenant's fan symmetric — every sibling at a rank carrying the same number of children — is what actually avoids that mis-routing; it is a layout constraint on the diagram, not a content choice
ideas:
  - Teach scripts/render-mermaid.ts to prune SVGs its own pass orphaned (it already knows every live key it just rendered), turning today's render-then-verify-then-rm into one command and removing a class of gate-red-on-commit surprises.
  - Add a Playwright check to the e2e module that fails when a committed diagram SVG has an edge path crossing a node's bounding box — the mis-routing above is invisible in review and currently only caught by a human eyeballing a screenshot.
