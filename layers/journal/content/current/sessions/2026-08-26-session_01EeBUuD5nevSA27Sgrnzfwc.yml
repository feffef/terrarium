frictions:
  - description: Editing a mermaid block orphans its old SVG, and verify:mermaid only reports it on a later run, after render:mermaid appears to have succeeded. Hit twice this session.
    solution: Have render:mermaid prune the SVGs its own pass orphaned — it already knows every live key it just rendered — instead of leaving the drift gate as the first place you learn about it.
    severity: minor
  - description: Wanted a comparison table for the Blog/Midden contrast, but no content page in any Tenant uses a markdown table and no prose CSS styles one.
    solution: Either style tables in the shared prose CSS and prove it with one page, or record in docs/agents/mdc-when-to-use.md that tables are an unsupported surface, so the next author doesn't have to grep to find out.
    severity: minor
  - description: CONTEXT.md's Tenant glossary entry says "see the Tenants roster below for the current four"; the roster directly below it lists six.
    solution: Fix the one home — drop the count from the Tenant entry rather than re-syncing a number that rots on every new Tenant. Left unfixed to keep this content PR scoped; audit-docs' territory.
    severity: minor
  - description: A `cd` inside one Bash call persisted into later calls, so a later relative path failed with a confusing "no such directory".
    solution: Use absolute paths or a subshell for any directory change; the tool description does say the working directory persists.
    severity: nit
