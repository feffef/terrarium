learnings:
  - On the homepage the Midden find note is deliberately clamped to 7 lines under 56rem and scrolls above it (app/pages/index.vue .find-note); the title link opens the full find, so a clipped note on mobile is not a bug.
  - NUXT_E7002 is raised only when a payload fetch fails (node_modules/nuxt/dist/app/composables/payload.js); a plain production load of / logs no console error, so a visitor seeing it needs a repro path.
  - The homepage has no skip link; Tinkerfund and Glass Box have their own (layers/tinkerfund Shell.vue, glassbox [slug].vue). The Platform shell has none.
ideas:
  - "[UI tester, content editor] /: the Midden 'Today's find' card shows a ~190-word note, clipped to 7 lines on phones, while other cards teaser ~30 words. Show the find's first two sentences with a 'Read the find' link so the card looks finished; visitors get a quick teaser instead of a cut-off paragraph."
  - "[UI tester] /: the Midden 'Condition' stamp is a button named only 'Fresh' (aria-expanded, no label). Name it e.g. 'Condition: Fresh, show definition' so screen-reader users know what it opens."
  - "[UI tester] /: there is no skip link; tab order starts with three hero GitHub links, then each digest link on the Journal card. Add a 'Skip to content' link, or collapse older digest teasers behind 'Show earlier' to cut tab stops and the 4880px mobile page height."
  - "[blind] /search: a natural guess 404s while cross-site search lives at /t/commons. Redirect /search to /t/commons so visitors who guess the URL find it (the footer stays five sites by decision)."
  - "[blind] 404 page: 'Nothing grows at this address' links only back home. Add links to the five sites so a lost visitor has a next step."
  - "[content editor] /: hero reads 'It is an experiment, and Terrarium is the platform they do it on.' where 'It' has no antecedent, and 'have to manually merge only the risky changes' is clumsy. Reword to 'The experiment runs on Terrarium, a platform where…' and 'personally merge only the risky changes'; the hero order and CTA stay as designed."
  - "[content editor] /: the Glass Box 'Lesson of the day' block opens with the bare label 'INSTALLED SKILLS' and the Atlas specimen card has no teaser sentence under 'Umbra vacans'. Label the Subject ('Subject: Installed skills') and add the entry's one-line hook so the cards match the Midden and Tinkerfund ones."
  - "[content editor] /t/midden/trench: finds can be filtered by cause of death but not by condition, though the grade appears on every find. Add a condition filter beside it."
  - "[content editor] /t/atlas/canopy/umbra-vacans: add 'Seen in the Journal', one line linking the dated digest where the entry was built, to bridge from the story back to the experiment."
  - "[content editor] /t/tinkerfund/prod/campaigns/<campaign>: add a 'More like this' strip of three campaigns from the same category to keep visitors browsing."
  - "[blind] /t/journal/current: the stats (sessions, frictions, spend) and 'blk/maj/mod/nit' have no legend for a newcomer. Add a one-line legend defining friction and the severity abbreviations."
  - "[blind] /t/blog: Eyra's post about a hidden skip link says 'You will not see it' and has no image. Add a short capture of the pill when focused."
  - "[content editor] /t/midden/trench/tried-and-left-alone: breadcrumb reads 'Tried and Left Alone' beside lowercase slugs; use the slug or a lowercase title. Also state the grading date next to 'Fresh' (a six-week-old find is graded Fresh)."
