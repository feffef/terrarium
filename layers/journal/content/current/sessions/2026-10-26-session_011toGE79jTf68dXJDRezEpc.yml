summary: "The owner asked a chain of questions, all human-instructed: how the ADR summary rules and adr-read-hint.ts interact, whether the rules could go, whether they could drop their read-the-full-ADR lines, and whether the hint triggers needless reads. I read the hook, its pre-filter, adr-rules.ts and the validate-adr-rules check. The hint reads its paths from the rules, so the rules can't go, and the read-the-full-ADR line is gate-checked and still covers reviews. To measure needless reads I joined each session log's adrHints with its docsRead useful verdicts since the hint shipped (63 logs, 70 hint-followed reads: 12 yes, 31 partly, 18 no, 9 unrated). The main causes are broad Skill paths, per-agent dedupe and text matches in test fixtures. The owner then asked why the Frictions don't show this. The hint's own \"late read is not a Friction\" line excuses exactly these cases, and the 4 related occurrences all blame lateness. The owner chose to let the hint run and asked for an issue to revisit in four days, which is #2575 (needs-triage). No code changed."
