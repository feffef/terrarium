learnings:
  - resolveGroundTruthSessionId prefers CLAUDE_CODE_REMOTE_SESSION_ID over the transcript, so an absent transcript_path never meant ground truth was unresolvable — the old guard's early return skipped a check it could have run
  - A PreToolUse deny travels in the stdout JSON, not the exit code, so the hook's trailing `|| true` cannot defeat a deny — but a missing pnpm/tsx interpreter still can, because the script never evaluates
  - "Writer-side strictness and reader-side permanence are independent for the same marker: the guard can stop accepting the legacy footer while hasAuthorshipMarker must keep matching it forever, since historical comments are immutable"
ideas:
  - "Establish whether a PreToolUse hook can rewrite tool_input, and if so make github-provenance-guard.ts inject the provenance header rather than block on its absence. Blocking supervises the choice point; injection removes it, which is what issue #723's option 3 actually asked for. The two helpers needed already exist (provenanceHeader plus reconstructFooterValues), so the whole question is a harness capability check — and the answer also settles issue #737's option (b), which its triage brief left open as an unverified premise."
