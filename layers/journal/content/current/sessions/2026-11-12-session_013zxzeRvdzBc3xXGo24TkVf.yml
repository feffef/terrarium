learnings:
  - The Skill tool refuses a disable-model-invocation Skill even when the user typed its slash command mid-turn; the command works only as the user's own new message.
  - "Link text rule: only a Where next row to a guide page may be a bare [](path); an inline link needs the target's exact title unless it starts lowercase."
  - A branch whose PR merged can be fast-forwarded to the new origin/main with git merge --ff-only, since its tip is an ancestor of the merge commit; no force push is needed, and the remote branch was deleted on merge so the next push recreates it.
ideas:
  - Add a Glass Box page check that warns on changing facts in Lesson prose (digits followed by units such as tokens or sessions, 'has cost', 'sessions have'), since glassbox-content.md forbids them and only a late code-review caught them in this session's new Lesson.
