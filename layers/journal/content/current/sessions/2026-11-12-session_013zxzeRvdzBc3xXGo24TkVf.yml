frictions:
  - description: Chose the new Lesson's Where next and inline links from memory and titles without running orient.ts or reading how sibling Lessons end bullets; the owner had to point this out twice and links were reworked in three rounds.
    solution: glassbox-lesson now starts with an Orient step (orient.ts --index, read the index whole); writing-pages.md holds the link form.
    severity: moderate
  - description: Wrote changing counts and history in Lesson prose ("has cost over a hundred thousand subagent tokens", "two sessions were wrong") although glassbox-content.md was loaded; only code-review caught it, and the claims were unsourced.
    solution: Check new prose against glassbox-content.md and each claim against its source before the first commit.
    severity: moderate
  - description: Replaced Cloud sessions' Journal Where next row without checking that an e2e test needs a non-Glass-Box row there, and dropped three pages below the two-incoming-links check; the gate failed once and page checks flagged the rest.
    solution: Before swapping a Where next entry, run the page checks and grep the e2e spec for the page.
    severity: minor
  - description: Chose lowercase and typed link text for Where next rows of guide pages, then had to learn from a failing page test and the glossary that guide rows are bare links and inline text must be the exact title.
    solution: Read the glossary's Where next rule and page-checks link rules before writing links; the writing-pages.md bullet now states them.
    severity: minor
  - description: Tried to start the user-invoked glassbox-lesson Skill through the Skill tool; it was refused, so I had written the owner's request off until they typed the command themselves.
    solution: For a disable-model-invocation Skill, tell the owner to send the slash command as its own message right away, as I did, and do not draft its steps first.
    severity: nit
  - description: Ran git log on a doc before reading git-conventions.md; the hook pointed to it afterwards and the call was already right.
    solution: Read git-conventions.md with the first doc read of a session that will commit.
    severity: nit
  - description: Edited Skill files before reading ADR-0027 and ADR-0015 in full; the post-edit hook demanded them and the edits were right.
    solution: Read the ADRs a Skill's rules name before the first edit to a SKILL.md.
    severity: nit
  - description: The gate-edit guard denied my edits four times while pnpm gate:scoped ran, so each owner correction waited a full gate run; I also reran the gate after every small text edit.
    solution: Batch pending edits and start the gate once, or stop the gate before editing.
    severity: minor
  - description: AskUserQuestion failed twice with invalid JSON because I put escaped quotes inside option text.
    solution: Keep question and option text free of nested quotes and backslashes.
    severity: nit
  - description: First count of sessions that used inspect-session (6) came from current logs only; the archive held many more, and I corrected it only after counting both folders.
    solution: Count every log folder (current and archived) before stating how many sessions did something.
    severity: nit
