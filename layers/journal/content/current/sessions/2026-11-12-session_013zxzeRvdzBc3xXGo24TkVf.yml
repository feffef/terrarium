outcome: PR 3160 merged (Lesson, orient.ts --index, glassbox-lesson changes); follow-up PR 3162 open to reorder the Lesson's In Terrarium section and fix a claim
summary: "Human-instructed throughout. The owner asked for a Lesson on inspect-session and on asking an earlier session to search its own transcript, and to explore recent session logs first. I read the Glass Box contracts, the Skill and about two dozen session logs (every log that used inspect-session, current and archived), then asked three scoping questions (Subject, one Lesson or two, which gotchas) per their preference. They chose Agents & automation, one Lesson, all four gotchas. The owner directed every later change: built-in records versus Terrarium's session log, a Haiku subagent doing the reading, search-not-recall as the key to getting facts from an old session, section-anchored links at bullet ends, bare Where next links, dropping the own-id gotcha, and the lede wording. They also pointed out twice that I had not used orient.ts, which led to a new orient.ts --index flag (their choice), a first Orient step in glassbox-lesson (moved out of writing-pages.md at their request) and a curate note. Agent-initiated: fixing a YAML quoting error, an e2e test that needed a Journal row in Cloud sessions' Where next, page-check failures, and the code-review findings (changing counts and history in prose against glassbox-content.md, an unanchored link, a repeated type in orient.ts). PR 3160 merged after the owner told me to merge it myself; being Human-only, it needed their quoted instruction as --owner-approved. After the merge the owner read the page in full and found that the asking paragraph had no antecedent, came after the events paragraph against the page's own ladder, and that the single excerpt mixed both approaches without explanation. I proposed a reorder and an excerpt split, then did both as follow-up PR 3162 (human-instructed in effect; I proceeded after they added the excerpt complaint). Code-review on that diff found the missing still-reachable condition and a dangling routine sentence, both fixed. The owner then asked for a full claim check as glassbox-update describes; a sonnet checker found one real false claim (the Haiku lead-in was too broad, as the Skill sets Haiku only for a full read) and one I rejected after checking the source (usage cost_usd); I also added the page's check date to update.yml, which they had not asked for. Gate green on the final head; PR 3162 open and subscribed, to be merged by me once CI is green (a Lesson-only PR, so no Human-only waiver should be needed). Left open for the owner: whether the title is general enough, and scheduled-tasks losing its Journal evidence row."
