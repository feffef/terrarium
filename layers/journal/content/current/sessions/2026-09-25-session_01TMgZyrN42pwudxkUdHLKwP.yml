frictions:
  - description: Editing .claude/settings.json hook commands was denied by the auto-mode classifier as self-modification; needed a round trip to ask the human.
    solution: Expected for hook config; ask up front when a planned change touches settings.json hooks.
    severity: minor
  - description: First gate:scoped run started before my last edits, so it did not cover settings.json and the collapsed yml; had to re-run targeted tests instead of a clean full pass.
    solution: Finish all edits (including pending human decisions) before starting the gate.
    severity: minor
  - description: Hand-typed the commit trailer from the system-reminder attribution instruction; commit-trailer-guard denied it.
    solution: The guard message was clear; CLAUDE.md already says not to — follow the repo rule over the harness reminder.
    severity: nit
  - description: The ideas extraction needed an ad-hoc script copied into scripts/ to resolve the yaml package, then deleted — a third one-off corpus parser.
    solution: A committed corpus query script (session_01QMRAWh's corpus-stats idea) would make this one command.
    severity: minor
  - description: ADR-0015 says a silent audit-skills run adds no observations entry, yet 17 held-as-is entries accumulated; the SKILL.md wording ('every grade change or role refresh gets an entry') never said the converse.
    solution: SKILL.md now states it; this PR fixes the wording.
    severity: minor
  - description: Both review subagents claimed a failed cd in the hook prefix fails open; testing showed dash exits 2 (blocking). Unverified shell-semantics claims from reviewers need a quick probe.
    solution: Probe shell exit codes before accepting a fail-open claim; the dispatch brief could ask reviewers to test such claims.
    severity: minor
  - description: My first cut placed a new const between an existing JSDoc and its function, and wrote an audit-skills rule broader than ADR-0015; both only caught by /code-review.
    solution: Re-read inserted code in context and check new rules against the ADR's full list before committing.
    severity: minor
  - description: The owner told me to merge on green, but the auto-mode classifier denied scripts/merge-pr.ts as merge-without-review; the owner had to merge by hand.
    solution: A Bash allow rule for merge-pr.ts in the user's settings, or accept that ordinary work PRs are human-merged anyway.
    severity: minor
  - description: Recommended building shell-read --explain from a 13-day-old idea without first checking git history; it had shipped the day before (62261eb8), caught only when I started building.
    solution: Check git log -S / recent commits for each idea before recommending it, not just the files.
    severity: minor
