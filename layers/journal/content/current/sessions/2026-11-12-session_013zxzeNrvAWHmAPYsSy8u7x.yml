learnings:
  - list-merges-since.ts prints merge subjects that name only a branch, so file-level evidence for whether an idea is built needs git log origin/main --since=START --name-only.
  - "A closed-completed Seedling can leave part of its body unbuilt: issue 3178 was closed by PR 3182, which changed only step 4's wording; read the PR's file list before treating a completed close as settling a cluster."
  - "A reviewer subagent that does not run the spec can call a hard-coded test fixture cosmetic when it is not: tying harvest.spec.ts's fixture to WINDOW_DAYS fails the ranking test because one log falls outside 7 days."
