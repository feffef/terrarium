summary: "Human-instructed: the owner ran the harvest Skill, whose steps drove the first half. Extract gave 381 entries; 17 clusters were checked, 5 passed (four Glass Box and Journal product ideas, one environment-caveats learning) and 12 were dropped with evidence. Agent-initiated within the Skill: which clusters to check and drop, the wording of each Seedling, and the retro Seedling 3191. I caught three of my own unverified claims before posting. The owner then ran /retro (human-instructed), leaned toward a 7-day window and more frequent runs, and asked for a Seedling for a trial-territory lookup script (3193) and an issue listing git commands for the read-first-hint skip list (3194); I filed both. Last, the owner asked me to close 3191 and just change the window to 7 days in this session (human-instructed): I changed WINDOW_DAYS and three statements in harvest SKILL.md, ran code-review (two subagents) and the scoped gate, and opened PR 3195. Both reviewers called a 28-day test fixture cosmetic; I tested that and it breaks the ranking test at 7 days, so it stays. Still open: PR 3195 awaits CI, then merge through merge-pr.ts; issue 3191 still has to be closed with a comment saying the window change supersedes its text-cut idea (the git log swap is dropped); running harvest more often is a Routine setting outside the repo."
