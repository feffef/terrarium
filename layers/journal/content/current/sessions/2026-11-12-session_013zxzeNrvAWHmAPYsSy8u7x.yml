summary: "Human-instructed: the owner ran the harvest Skill (the one kickoff prompt); every step below is that Skill's own. Extract gave 381 entries (171 ideas, 210 learnings) from the last 28 days; the list was 561 lines and took three Read calls. I clustered, then checked 17 clusters (product first): four product clusters passed (an agent-readable Glass Box guide, a confusing-section link, guided Lesson exercises, a token-share bar on the Journal session card) and one workflow learning cluster (two harness facts for environment-caveats.md). Twelve were dropped with evidence: reading path and prerequisites (ruled out by the Glass Box glossary and visitor-loop decisions), code-block fade and Routine cost panel (already built), the detached-HEAD push (a Ledger entry holds it, which issue 3105 had also said), gate-abort, spawn-depth, resume-by-id and link-text facts (built or in the Ledger), and four clusters that add checks or facts without retiring or recurring (harvest tooling, page checks, screenshot diffs, CSS gotchas). Agent-initiated, within the Skill: which clusters to check and drop, and how to word each Seedling; the retro step (also the Skill's) filed one more Seedling about step 1's whole-list read and step 3's merge evidence. I caught and corrected three claims of my own before posting (a truncated merge list read as \"none about it\", an unread claim about CI fonts and a claim that no Prune Trial covered environment-caveats.md; one does, on a different bullet). Still open: the owner decides the six Seedlings; two of the product ones may meet the same \"too complicated\" answer the owner gave to two earlier ideas of the same source session."
