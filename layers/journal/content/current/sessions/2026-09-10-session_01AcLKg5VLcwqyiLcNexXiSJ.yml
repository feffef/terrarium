frictions:
  - description: "A dispatched impl agent's edit to `.claude/settings.json` (wiring the new double-background-guard into `hooks.PreToolUse`, issue #1208) hit a permission prompt needing human approval, and stalled the impl agent for ~3h. This is a scheduled `frictions-to-fixes` run with no human watching — and none of this session's own tools (no wake, no signal back from a dispatched subagent's pending permission prompt) surfaced that anything was stuck. The user was NOT present; they discovered the stall only by chance, opening the Claude web interface for an unrelated reason and happening to notice this session's pending approval, which they then granted manually. Had they not happened to check, the dispatched agent would have stayed stalled indefinitely with nothing in this session able to detect or escalate it."
    solution: "Two angles worth a future frictions-to-fixes cycle: (1) narrower — check whether `.claude/settings.json` edits from a dispatched impl agent could be pre-approved (`fewer-permission-prompts`/`update-config` mechanism) specifically for guard-wiring fixes, since every such PR is human-reviewed and human-merged anyway — the approval gate currently sits earlier (mid-edit) than the repo's own human-only bar (at merge). (2) broader, and the real gap this correction surfaced — a scheduled/ autonomous session has no way to detect or surface that a dispatched subagent is blocked on an unapproved permission prompt; from the orchestrator's side the subagent just looks slow, not stuck. This is a platform-level quirk, not a repo bug, so it likely belongs in docs/agents/environment-caveats.md once someone can confirm the mechanism (or lack of one) rather than guessing here — and/or reported upstream as a product gap: a headless run silently stalling on a permission prompt with zero proactive signal is a structural risk for every scheduled Skill that dispatches subagents, not just this one."
    severity: major
  - description: "A dispatched impl agent's edit to `.claude/settings.json` (wiring the new double-background-guard into `hooks.PreToolUse`, issue #1208) hit a permission prompt needing human approval, and stalled the impl agent for ~3h. This is a scheduled `frictions-to-fixes` run with no human watching — and none of this session's own tools (no wake, no signal back from a dispatched subagent's pending permission prompt) surfaced that anything was stuck. The user was NOT present; they discovered the stall only by chance, opening the Claude web interface for an unrelated reason and happening to notice this session's pending approval, which they then granted manually. Had they not happened to check, the dispatched agent would have stayed stalled indefinitely with nothing in this session able to detect or escalate it. Both PRs (#1209, #1210) subsequently merged — #1210 by a human, ~40 minutes after escalation."
