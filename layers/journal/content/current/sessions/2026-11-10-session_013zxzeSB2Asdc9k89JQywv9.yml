frictions:
  - description: Impl agent ran checkout -B on the branch my main checkout held, moving the shared ref and leaving a stale staged revert in my checkout.
    solution: dispatch-subagents should say an impl agent never reuses the orchestrator's branch name; give it its own branch.
    severity: minor
  - description: git reset --hard HEAD to clear that stale index was denied by the auto-mode classifier, so Stop hooks kept flagging uncommitted changes.
    solution: Document a safe way to resync an index after a worktree moves the branch, such as git restore --staged then git restore.
    severity: nit
  - description: Stop hooks demanded subscribe_pr_activity after I opened the test PR, though the task said not to subscribe.
    solution: Let the hook skip PRs whose title carries a test marker, or let a session mark a PR as not to watch.
    severity: nit
  - description: ADR-0027 and ADR-0029 rules loaded when I read pr-workflow.md, though neither bore on a one-line content edit.
    solution: Narrow those rules' paths so reading an agent doc does not load them.
    severity: nit
