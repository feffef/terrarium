frictions:
  - description: Did not invoke close-session at PR-open, only after the user reported the merge, so no in-review log existed for hours
    solution: Self-judge closure when the PR opens; the CLAUDE.md rule exists but I only remembered it at the end
    severity: minor
  - description: System-reminder told me to end commits with attribution trailers; the commit-trailer guard then denied the whole commit command for hand-writing them
    solution: Harness attribution reminder and repo guard contradict; the repo guard should be named in the reminder or the reminder should be dropped for this repo
    severity: minor
  - description: Passed run_in_background false to the Agent tool and was denied by the guard; that rule lives only in dispatch-subagents SKILL, which I had not opened
    solution: Surface the one-line rule where Agent calls are decided, or prune the habit; the guard costs one retry
    severity: nit
  - description: Piped test and typecheck output into tail in one Bash call and the tail-pipe guard denied the whole command, including the python edit chained before it
    solution: Redirect to a log file from the start, as CLAUDE.md says
    severity: nit
  - description: Called mcp__github__search_pull_requests before loading its schema via ToolSearch, against the CLAUDE.md rule; it errored on a missing query
    solution: Load deferred GitHub tools with ToolSearch first
    severity: nit
  - description: Grep glob with nested alternate braces was rejected by ripgrep, costing one wasted search
    solution: Use flat brace lists or separate calls
    severity: nit
