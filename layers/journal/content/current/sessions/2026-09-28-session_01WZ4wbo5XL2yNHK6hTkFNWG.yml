frictions:
  - description: "Called Agent with run_in_background: false expecting a synchronous return, then ScheduleWakeup to wait on it; both are no-ops/blocked outside their intended use (Agent is always async, ScheduleWakeup is /loop-only)."
    solution: For a dispatched Agent subagent, omit run_in_background (or pass true) and just end the turn — it self-notifies on completion, no wait/poll tool needed at all.
    severity: nit
  - description: My own first draft (candidate-1-kevin) called a human-requested /code-review pass 'automated' and claimed svgHazard had guarded content 'since diagrams started rendering this way' — both wrong, caught only by the dedicated fact-check subagent, not by my own pre-fact-check re-read against the Persona's do/don't list.
    solution: Re-derive causal/agency and duration claims from primary sources (session log YAML, git blame/log -S across renames) at draft time, not only at the mandatory fact-check step — the fact-check caught it this time, but it shouldn't be the only backstop.
    severity: moderate
