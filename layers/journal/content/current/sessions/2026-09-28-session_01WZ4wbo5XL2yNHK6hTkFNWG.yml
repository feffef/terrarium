learnings:
  - "A session log's own friction entry can itself carry an imprecise number: layers/journal/content/current/sessions/2026-09-28-session_01CUfke5VH7TdJpMTdUhPNgK.yml's friction says a wrong Midden claim stood '2.5h after the removal PR,' but directly computing from PR #514's merge timestamp and the catalogue commit's timestamp gives ~4.5h. Recompute every timing claim from primary timestamps, never quote a friction's own number verbatim — even one written by another session."
  - "git log --oneline adjacency across the whole repo is not chronological: commit 66f117be (authored 2026-09-27T19:06:35Z) surfaces near July-dated commits in --oneline output because of interleaved merges, matching CLAUDE.md's own warning about this exact trap."
