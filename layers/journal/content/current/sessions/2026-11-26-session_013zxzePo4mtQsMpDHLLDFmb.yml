frictions:
  - description: Two path-scoped rules for Tenant pages (tenant-layers, ui-verification, adr-0006, adr-0016) loaded on a Bash grep of layers/ though the run only edited Glass Box Markdown.
    solution: Narrow their paths so a Bash read of CSS and Vue files in other tenants does not load them for a content-only run.
    severity: nit
  - description: The harness stop hook asked to commit and push untracked and uncommitted files mid-run, three times, while claim checks were still running, forcing extra draft commits.
    solution: Let the hook skip while a subagent is running, or accept the Skill's draft-commit rhythm in the hook text.
    severity: minor
  - description: A pnpm gate:scoped call written with a trailing & plus run_in_background was blocked by the double-background guard and had to be resent.
    solution: The Bash tool text could say plainly not to add & when run_in_background is set.
    severity: nit
  - description: The curate Skill says to read each outside page in full, but the writer's new page links three verification pages and a draft; reading about 5000 words of them only to link by title was costly.
    solution: State in the Skill that a page linked only by title in Where next needs no whole read.
    severity: minor
