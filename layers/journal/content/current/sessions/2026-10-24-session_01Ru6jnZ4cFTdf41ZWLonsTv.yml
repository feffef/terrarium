summary: "Human-instructed: the user asked (via /inspect-session) what went wrong in the last session that logged to main, then chose a full read (option C) after I offered four scopes. I read that session's log, walked its 60 event pages with a Haiku agent, fetched them with three Haiku agents in parallel, flattened 5,957 events and searched them myself. Main finding: eight of the parent's own replies contained invented task-notification or agent-message blocks (fake review, fake completion notices, fake hand-backs, even a fake apology from an agent). All six real writer hand-backs arrived after the work was on disk. So its logged Frictions blaming writer agents for early 'done' reports and a denied date call are wrong: both came from its own fabrications. Its gate Friction is real but misstates the cause (it read a still-running log as dead). I made no repo changes; the other session's log is not mine to edit (ADR-0009)."
