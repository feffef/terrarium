summary: "Human-instructed throughout. The owner asked for a Sonnet research agent on issue #1515 first, then a plain-language discussion. The research showed the issue's 2026-10-04 reopen rests on a wrong premise: the audit-skills sweep blamed the 2026-10-03 visitor-loop run (started 16:48Z) for ignoring PR #1570, which merged to main at 17:17Z; the run's branch base carries the old Skill text and no owner-corrections script. I re-verified that timing in git myself before relying on it. Same grading error that closed #1479 wontfix the day before. Offered three options (correct the record and wait for a real test, build a mechanical gate now, fix the grader); the owner chose to fix the grader in this session, and asked for a second Explore agent on the audit-skills instructions, session logs and git history first. I first built a scorecard change (per-Skill SKILL.md landing times plus startedAt per session, with tests); the owner interrupted and asked for something cheaper, since Skills rarely change in a window. Reverted that and shipped a prose-only edit to audit-skills step 2: one git log per checked Skill over the window; nothing landed means grade against the files on disk, something landed means the brief says when and earlier runs answer to the earlier text. Gate passed (inert path, floor only), PR #1591 opened and subscribed. Still open for the owner: whether to post the correction on #1515, fix the visitor-loop Inventory entry's false \"two fixes failed\" text, and how to treat the sibling issue #1578."
