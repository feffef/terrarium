summary: The person invoked /glassbox-curate with the instruction to pick focuses autonomously until the context reached 500k, then hand over to a new sonnet session; that one prompt and the Skill's own steps were the human instruction. Everything else was agent-chosen. I oriented, read the whole guide index, picked the Agents & automation Subject (no open PR touched the guide, it still capitalised glossary terms and one page had never been read by a run), ran a Scout (no new topic), two fresh readers, two opus writers, a claim checker, a second reader and a code-review round. The claim checker found two unsupported cost clauses and two overstated sentences, which I corrected by hand. The pages keep revision and publishedAt (wording only). I opened PR 3165 and subscribed to it; the merge and a second focus are still open. The thirteen outside pages the Spec reviewer named were grep-checked for the changed claims, not read in full, and the run entry says so.
