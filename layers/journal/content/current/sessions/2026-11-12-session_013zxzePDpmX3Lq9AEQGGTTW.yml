    solution: "Judge status against the whole instruction, not the last PR: repeated-focus sessions stay partial until the budget stops them."
    severity: minor
  - description: Wrote a session cost of about $17 in a PR body from memory; the real session total read $19.28 and I corrected the body.
    solution: Read cost_usd from get_session before writing any figure, as CLAUDE.md's verify-before-you-state rule says.
    severity: minor
