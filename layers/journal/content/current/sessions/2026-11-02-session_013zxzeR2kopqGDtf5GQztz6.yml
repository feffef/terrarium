summary: The owner asked how API costs of glassbox-improve sessions developed. I first answered from session logs only, wrongly concluding no cost data exists; on the owner's pointer to inspect-session, get_session gave each session's list-price cost (about 337 USD for 8 runs), and result events gave the per-model split of the two v2 runs (10-29 and 11-01). The owner then asked, via inspect-session, whether the v2 runs worked as designed; I asked scope and depth first, and the owner chose the v2 changes only, from logs and PR descriptions, events only if needed. I checked PRs 2688 and 2711 (the design) against the two run logs, PRs 2689 and 2763, and grades.yml. One point (hand-backs saved in pairs on 11-01) needs an event read, which I offered instead of running. Nothing was built or filed; all work was human-instructed reading.
