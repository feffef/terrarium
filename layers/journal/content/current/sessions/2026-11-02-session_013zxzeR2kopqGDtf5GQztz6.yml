learnings:
  - Session logs keep only subagent tokenShare; absolute USD cost of a cloud session sits in get_session usage.cost_usd (list price) and in result events' modelUsage.
  - Single-model lens raters at one commit flagged 25 of 58 pages on at least one lens, against 10 pages with any C from the three mixed-model raters; the per-grade below-B rate stayed about 11%.
  - Two single-model lens runs at one commit agreed on 92% of lens grades but only 26 of about 39 below-B grades; capped A sets overlapped 10 of 11 for Relevance and 3-5 of 11 for the other lenses.
  - Blind A/B judging of a glassbox-improve run (6 pages, 3 sonnet judges, about 284k tokens) preferred the edited version 18/18 on the targeted criterion and overall; naming the targeted criterion likely biases toward the edit, so a negative control is needed before using it as a gate.
  - With the criterion named, blind judges rejected 9/9 deliberately worse edits and kept 16/18 real ones; without it they preferred added material (a tangent 3/3) and rejected cuts, real edits winning only 9/18.
ideas:
  - Have log-session's mechanical half record get_session usage.cost_usd and per-model costUSD, so Skill cost trends are answerable from the Journal without MCP calls (needs a data-shape decision first).
  - Record each glassbox-improve run's cost (get_session usage.cost_usd) the way Routines record costUsd in layers/journal/content/current/routines, so cost per run is comparable without MCP reads.
