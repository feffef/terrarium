summary: "Human-instructed throughout. The user asked for a five-way subagent fan-out over session, GitHub and git history to find discarded work the Midden has not catalogued, plus a view on whether finds fit existing dig reports, and whether a Skill owns this job. They invoked /grill-with-docs, then interrupted it to invoke /midden-survey directly, which settled scope. Ran the Skill: unshallowed the clone, ran the mechanical sweep, and dispatched five read-only agents pinned to one SHA. Six candidates cleared the two-gate bar, including the first-ever branch- and skill-provenance finds; the eight doc deletions all failed Gate B. Filed one survey-report issue per the Skill's charter (#1043). The user then gave an explicit green-light to catalogue everything found, loosening the rule that reserves condition/stratum/site/catalogNote to the curator — so all four were authored here. Six Artifacts landed (the Tenant's first branch- and skill-provenance finds), three new dig reports, a fifth find folded into an existing report, and the dig-season list rebuilt: the 43-day open season named and closed, a new one coined, nine artifacts repointed. Gate green end to end; PR #1044 opened and subscribed."
