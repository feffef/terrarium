learnings:
  - isNoisePath's layers/journal/content/ prefix makes the survey structurally blind to Skill Inventory deletions — the likely reason kind:skill has never once been used in 34 artifacts
  - A GitHub `closed:>=` range qualifier can silently under-report against this repo's search index; the unqualified search plus a local merged_at filter is the reliable control
  - Author-date fingerprinting a branch against main false-negatives on squash merges, since the squash commit carries the merge time, not the original author date
ideas:
  - Build a `midden-catalogue` Skill for the curatorial half the survey deliberately stops before — grading condition, coining/closing dig seasons, and authoring the dig report. Today that work is freehand every run, which is why `current-midden` has been left open 43 days holding 9 of 34 finds while three closed seasons cover 10 days total. A Skill could at minimum flag the open season for closure once it passes a threshold.
  - Add a survey self-check that reports coverage per provenance kind. Two of six declared kinds (`branch`, `skill`) sat at zero for the Midden's whole life, and in the `skill` case that was a tooling blind spot rather than an absence of finds — a per-kind zero is exactly the signal that the sweep, not the history, is empty.
