frictions:
  - description: midden-survey SKILL.md tells the surveyor to bound closed PRs with `closed:>=<since>`. Run literally it returned 1 of 4 in-window PRs.
    solution: "Sweep unqualified and filter locally; fix the Skill. Filed as D1 in issue #1043."
    severity: major
  - description: scripts/midden-survey.ts isNoisePath screens all of layers/journal/content/, which contains the Skill Inventory, so a deleted Inventory entry never surfaces.
    solution: "Exempt layers/journal/content/*/skills/ from the noise screen. Filed as D2 in issue #1043."
    severity: major
  - description: I propagated the Skill's broken PR query verbatim into a subagent brief; the agent caught it and cross-checked two ways rather than building on it.
    solution: Sanity-check a Skill's literal query against an unqualified control before briefing it out.
    severity: minor
  - description: My first attempt to verify the query defect passed an HTML-escaped `>` and returned zero, which looked like confirmation for the wrong reason.
    solution: Caught it before asserting; re-ran with an unqualified search. Watch for entity-escaping in MCP query strings.
    severity: nit
