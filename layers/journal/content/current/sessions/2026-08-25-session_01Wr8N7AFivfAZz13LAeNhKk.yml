frictions:
  - description: midden-survey SKILL.md tells the surveyor to bound closed PRs with `closed:>=<since>`. Run literally it returned 1 of 4 in-window PRs.
    solution: "Sweep unqualified and filter locally; fix the Skill. Filed as D1 in issue #1043."
    severity: major
  - description: scripts/midden-survey.ts isNoisePath screens all of layers/journal/content/, which contains the Skill Inventory, so a deleted Inventory entry never surfaces.
    solution: "Exempt layers/journal/content/*/skills/ from the noise screen. Filed as D2 in issue #1043."
    severity: major
  - description: I propagated the Skill's broken PR query verbatim into a subagent brief; the agent caught it and cross-checked two ways rather than building on it.
    solution: Sanity-check a Skill's literal query against an unqualified control before briefing it out.
    severity: minor
  - description: My first attempt to verify the query defect passed an HTML-escaped `>` and returned zero, which looked like confirmation for the wrong reason.
    solution: Caught it before asserting; re-ran with an unqualified search. Watch for entity-escaping in MCP query strings.
    severity: nit
  - description: I catalogued from my own survey issue instead of re-opening the primary sources, producing 12 factual defects — including an inscription that silently dropped a 17-word sentence mid-quote and presented the result as continuous quotation.
    solution: A survey report is one remove from the evidence and that was enough. Cataloguing must re-read the PR body, the file at its revision, and the frontmatter itself — never the report that summarised them. Caught only because a review was requested.
    severity: major
  - description: Closing the open dig season silently falsified two pre-existing pages that called their finds "the newest spoil" and "the current cut". Gate was green throughout.
    solution: A rename that changes a term's meaning must grep for prose asserting the old meaning. No validator can catch a page whose claim rotted; only a reader can.
    severity: moderate
  - description: Two condition grades (`dissolved`) described erosion that never happened, and one dig report called a find "preserved intact" beside that grade.
    solution: Grade against the single-homed definition text in condition.ts, not against the grade's connotation. Both regraded `never-activated`.
    severity: minor
  - description: "A commit message asserted a correction that its own diff did not contain: the target phrase sat on a context line of the hunk, so I rewrote around it and recorded it as fixed."
    solution: After editing to fix a specific phrase, grep for that phrase before claiming it in a commit message. Seeing corrected text in a diff is not evidence the wrong text is gone. Caught only by a diff-scoped review two rounds later.
    severity: major
  - description: Each rewrite overstated by one notch — "opening body" became "opening words", "same day" became "the morning", a true-but-narrow claim became a punchier false one. Four consecutive correcting rounds each introduced fresh defects.
    solution: When correcting a factual error, write the weakest phrasing the evidence supports, not the sharpest one it permits. A correction that is merely less wrong still fails.
    severity: major
