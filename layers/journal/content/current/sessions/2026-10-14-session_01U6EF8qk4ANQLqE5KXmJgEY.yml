summary: "The owner asked how the rules entries in session_01BdQnbV's log came about, then narrowed it to the subagent entries, which show \"unknown: no agent reported\" in the Journal. It happened again in session_01G6m9Sb. I read scripts/session-trace.ts (extractTrace, foldSubagentTrace, stitch) and both logs. The trace data is correct and has no duplicates. The owner briefly suspected duplicates; my own overlapping sed output had looked doubled, and the two ADR-0004 rows are different rules. Verdicts are missing because Agent-tool subagents are asked for them only through a follow-up SendMessage in dispatch-subagents §5, which 01G6m9Sb skipped (no SendMessage call). The 01BdQnbV session never read the Skill: CLAUDE.md triggers it only for git or worktree subagents. 01BdQnbV also ran trace code older than c82a0ac1, so its log lacks docsReadBySubagents. Workflow agents return verdicts in their schema instead. The owner first approved my proposal to move the verdict ask into the dispatch brief, then rejected my reference grep mid-way and asked for an issue instead, as the fix looks more complex. At the owner's request I filed #2011 with the findings and open questions. No code changed."
