frictions:
  - description: Ran git fetch and git log before reading docs/agents/git-conventions.md, against CLAUDE.md's first-git-command trigger; the hook flagged it.
    solution: Read git-conventions.md before the first fetch; the hook's reminder came after the call.
    severity: nit
  - description: Tried 'git checkout origin/main -- .' plus 'git stash' to read files from main; the classifier blocked it. git-conventions.md forbids it, and it could have overwritten the tree.
    solution: Use git show or git grep on origin/main to read main's files, as git-conventions.md says.
    severity: moderate
  - description: Read session-trace.ts, Skills and logs with cat/sed/grep in Bash instead of the Read tool, against CLAUDE.md; rules may not have loaded.
    solution: Use Read for files whose content matters; keep Bash for grep and listings.
    severity: nit
  - description: Skipped GLOSSARY-MAP.md and GLOSSARY.md at session start, against CLAUDE.md.
    solution: Read both at session start, even for a question-only session.
    severity: nit
  - description: Proposed a fix (moving the verdict ask into the brief) without first grepping docs/adr for the ADRs that bind it, as CLAUDE.md's recommend trigger asks.
    solution: Run grep -l on the touched paths in docs/adr before recommending; ADR-0029 and ADR-0005 were relevant.
    severity: minor
  - description: An overlapping sed range printed each list twice; I first flagged it as a possible duplicate before checking the YAML.
    solution: Parse the YAML before reading counts or duplicates from shell output.
    severity: nit
