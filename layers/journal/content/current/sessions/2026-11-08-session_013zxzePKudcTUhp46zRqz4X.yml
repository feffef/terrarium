summary: "Scheduled audit-skills run (agent-initiated by the schedule; no human instructions). Gathered the 7-day scorecard, had one Sonnet subagent fetch usage for 8 unlisted Routine runs and 13 read-only Sonnet subagents check each Skill's behaviour. Orphan scan was clean (2 candidates, both resolved); 3 human-prompted closures. No silent failure did damage. Three repeated findings became needs-triage issues: digest skips code-review on file-adding PRs (#2954), glassbox-update re-pin leaves edited-range Excerpts stale (#2955), and a new standing thread for human-prompted closures because #2772 is closed (#2956). Other findings (glassbox-curate unreadable cost and skipped reads, frictions-to-fixes churn) went to Inventory observations as unverified. No grade or role changed. Routine run costs appended, old observations pruned. Standards and Spec code-review were clean; fixed one wording nit. PR #2957 opened, subscribed, verdict posted; merge follows once CI is green."
