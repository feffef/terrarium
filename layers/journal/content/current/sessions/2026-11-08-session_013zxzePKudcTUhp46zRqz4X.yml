frictions:
  - description: Ran gh api issue searches before reading github-integration.md; they printed nothing, so I wasted two calls and then used list-open-issues.ts.
    solution: The Bash hook already named the doc after the first call; reading it first would have shown the script escape.
    severity: nit
  - description: A relative cd into the skills folder twice left the shell in the wrong directory, so a python read failed with file-not-found.
    solution: Use absolute paths in every command instead of cd.
    severity: nit
  - description: First attempt to start the gate stacked run_in_background with a trailing ampersand and the double-background guard refused it.
    solution: Pass run_in_background alone; the guard message said so.
    severity: nit
  - description: The glassbox-curate and clear-backlog reports were long; the scorecard plus 13 reports cost much context to reconcile into 5 short observations.
    solution: A brief limit of 200 words for runs with no finding would cut reading.
    severity: minor
