entrypoint: remote
cliVersion: 2.1.330
learnings:
  - Per-page e2e cost on the Blog is server rendering (about 225ms per post); blocking JS and waiting only for domcontentloaded did not cut the 50s full sweep.
  - A commit made with --no-verify skips the commit-msg hook, so the Claude-Session trailer must be added by hand.
  - The two real failures in this run (a footer tab-order e2e test, a Glass Box link-title check) were caught by the gate and a unit spec, not by the review rounds; review mainly added missing tests and small nits.
  - git merge-tree --write-tree origin/main origin/<branch> shows whether a PR branch merges cleanly when GitHub still reports mergeable_state unknown after a sibling merge.
ideas:
  - Make clear-backlog's explore result carry a measured cost for any proposal that adds e2e or build time, so the owner is shown numbers at the grilling instead of after a build.
  - Have run-summary --triage print cross-group file overlaps, so the owner can answer one branches question with the real conflict list.
  - Make merge-pr.ts, or the landing recipe, require a gate on the merged tree when a sibling PR merged since the PR's last gate, so overlapping branches are never merged on a stale green.
landedBy: Stop
