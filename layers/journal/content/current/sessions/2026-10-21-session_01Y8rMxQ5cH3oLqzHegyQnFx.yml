outcome: "PR #2393 merged: session logs show each subagent's price-weighted token share"
summary: "The owner asked (human-instructed) whether clear-backlog-build wastes context by handing review findings to a fresh fix agent, checked via inspect-session on session_01C32ny8 and session_01MKHvrD. Confirmed: every fix round is a new agent (the Workflow API can't continue one), contrary to dispatch-subagents §5, and fixPrompt omits the build decisions; one branch's fixes moved a rule between files twice. Per-agent cost couldn't be measured because workflow agents' turns aren't in events. The owner then chose (human-instructed) to have session logs record it mechanically. Building it showed subagent transcripts hold stream-start output_tokens; the owner asked for a deep-research run, whose three tracks (docs, GitHub issues, the installed 2.1.306 binary) found no exact per-subagent output source on disk, only OTel spans. The owner then narrowed the goal to a reliable rough split, price-weighted, stored as percent shares, which PR #2393 implements (tokenShare at top level and per subagent, plus durationSec, toolCalls, modelCalls per subagent). code-review found nested and unmatched transcripts were dropped; fixed. The owner then asked (human-instructed) to drop the session-level share as derivable, and authorized me in chat to merge this Human-only PR myself; merge-pr.ts refuses Human-only paths, so I merged with the GitHub merge tool after merging main in (one conflict with #2386 in traceOf, both sides kept) and a green gate. No change to clear-backlog-build itself; that is left for the owner to decide."
