goal: Check whether clear-backlog-build's fresh fix agents waste context
status: completed
outcome: "Confirmed: each fix round spawns a new agent, contrary to dispatch-subagents; per-agent cost unmeasurable from events"
summary: The owner asked (human-instructed) whether clear-backlog-build is wasteful because review findings go to a new fix agent instead of the implementer, and to use inspect-session on two recent sessions. I picked session_01C32ny8 (6 fix agents over 4 of 5 branches; one branch hit the 3-round cap and the orchestrator fixed it by hand) and session_01MKHvrD (3 fix agents over 2 of 5 branches). The script's fixPrompt spawns a fresh agent per round, and the Workflow API's agent() cannot continue an earlier agent. dispatch-subagents says to resume the implementer for every fix, so the workflow departs from it. fixPrompt also omits the build agent's decisions, which reviewers get. Workflow agents' turns are not in session events and their .output files lived in the dead containers, so per-agent tool calls and tokens can't be measured; the logs record only one doc read by any fix agent. No change was made; the recommendation and the question of direction went to the owner (agent-initiated opinion).
