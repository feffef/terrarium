learnings:
  - Workflow agents' turns do not appear in list_events for the parent session; only the parent's lines do.
  - Subagent transcripts (CLI 2.1.306) write each record before message_delta, so output_tokens is a stream-start count while input and cache counts are final; the parent transcript is final.
  - A background agent's task-notification subagent_tokens is its last response's context plus that response's output, not a run total.
ideas:
  - Have log-session record per workflow agent its tool count, tokens and duration from the run journal, so retrospectives on workflow cost don't depend on a dead container.
  - Show tokenShare on the Journal's session card as a small bar per agent, once a few logs carry it, so expensive orchestration patterns stand out at a glance.
