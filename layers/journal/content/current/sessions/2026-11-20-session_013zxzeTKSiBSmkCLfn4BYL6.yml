frictions:
  - description: I passed the explore workflow a wrong session id; the provenance guard blocked each agent's first comment and nine agents had to retry with the id it printed.
    solution: Copy the id from the Claude-Session trailer or get_session verbatim before passing it, and have the workflow check it once up front.
    severity: minor
  - description: I labelled seven issues ready-for-agent before reading issue-tracker.md and triage-labels.md; a hook reminded me. The labels were right.
    solution: Read the two docs when the owner's answers arrive, since relabelling is the next step of the Skill.
    severity: nit
  - description: I read the grilling rule 'no tool calls while waiting' as holding all builder follow-up for several turns, reposting Q25 each time, though the Skill says the rest keep going.
    solution: The Skill should say outright that a wait on one question never pauses other branches' re-checks and gates.
    severity: minor
  - description: My Q7 text promised no visible layout shift, but my own after-sample shifted the next line about 8px; I only saw it when I viewed the screenshots.
    solution: Measure the position of the next element in the sample before writing a no-shift promise into a question.
    severity: nit
  - description: A builder found only at gate time that ADR-0015 and a schema comment said observations are not shown, then re-stamped a rule and widened a Glass Box glob; HEAD moved after review and cost an extra re-check and gate.
    solution: Brief builders of a new displayed value to grep every statement saying it is not shown (docs, ADRs, schema comments, Glass Box pages) before building.
    severity: minor
  - description: Gate logs print about thirty 'not a git repository' lines from self-tests; they read like failures while a gate is still running.
    solution: Have the gate script silence or label those lines so only an EXIT line is read as the verdict.
    severity: nit
  - description: I edited Midden and Journal layer files for samples without reading the Tenant glossaries the rule asks for first.
    solution: Read the glossary when the first sample edit touches a layer, or run prototypes through a subagent that reads it.
    severity: nit
  - description: "Retro (6 of 7 builders): the build brief told them to run e2e in the background and prescribed a gate line with cd and semicolons, but the subagent guards refuse both; each refusal cost a retry and one silently dropped a decisions.md write."
    solution: In rules() of .claude/workflows/clear-backlog-build.js say gate and e2e run in the foreground with timeout 600000, one command per Bash call, and name the gate line as the exception.
    severity: minor
  - description: "Retro (9 of 12 reviewers): the SubagentStart rule-use echo ritual cost two extra Bash calls per read-only reviewer with every listed rule unrelated, and builders got the same ADR read reminder after every edit."
    solution: Skip the rule-use ask for read-only review subagents in scripts/hooks, and send a path-scoped ADR reminder once per session, not per edit.
    severity: minor
  - description: "Retro (6 reviewers): the review brief points to section 3 of code-review SKILL.md, found only by grep, so reviewers read spawn instructions they were told to skip."
    solution: Move the smell baseline to its own short file, or inline it in reviewPrompt(), so one home serves code-review and the workflow.
    severity: nit
  - description: "Retro (5 reviewers): three hand-off formats (StructuredOutput first, then a findings file plus a one-line reply, then SubagentHandback) reached reviewers piecemeal and cost guessing."
    solution: State the re-check hand-off format and the one reply channel in reviewPrompt() on the first turn.
    severity: minor
  - description: "Retro (reviews): round 1 caught something that mattered on three of seven branches (curate contradiction, harvest untested case, Skill pages vacuous e2e); the three round-2 pairs and four small branches' reviews re-found only small things."
    solution: Start a round 2 only when round 1 had a defect or spec-mismatch, not on fix size alone, and keep one reviewer for diffs under about 100 lines.
    severity: minor
  - description: "Retro (3 builders): the Implement Skill and brief ask for tdd with user-confirmed seams while the brief says decide yourself, so a prose or small change had no seam and the step was dead weight."
    solution: "Add one line in rules() of the build workflow: tdd seams are picked by the builder, and skip tdd for content-only edits."
    severity: nit
  - description: "Retro (builders): the first gate failed because pnpm install never ran in a fresh worktree, and a wrap-check awk filter also matched diff hunk headers, giving false positives."
    solution: Say in rules() to run pnpm install first when node_modules is missing, and exclude lines starting with @@ in the awk wrap check.
    severity: nit
  - description: "Retro (Standards reviewer): the one-home-per-fact grep for stale statements is not in the review prompt, so a defect about stale ADR text was first filed hedged and cost a triage line."
    solution: Tell Standards reviewers in reviewPrompt() to run the repo-wide grep before filing a stale-statement finding.
    severity: nit
