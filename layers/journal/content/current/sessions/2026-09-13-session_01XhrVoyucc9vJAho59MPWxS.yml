frictions:
  - description: Hand-wrote the ADR-0017 Co-Authored-By/Claude-Session commit trailer per the outer session's attribution system-reminder, which conflicts with CLAUDE.md's "never hand-write it — the harness template and .githooks/commit-msg already land it" rule and its fail-closed guard. The commit succeeded anyway with the correct-looking trailer and no duplication, so no actual damage, but the instruction conflict itself is the friction.
    solution: Repo convention should win over a generic outer-session attribution reminder when the two conflict; let the guard/hook supply the trailer by omitting it from the authored message next time.
    severity: nit
  - description: 'SHELL-READ-DETECTION miss (over-counted): docsReadViaShell flagged CONTEXT.md as read via shell, but the only shell command naming it — `grep -n -A15 "^\*\*Session\*\*\|### Session\b" CONTEXT.md | head -40` (and a second, similarly-scoped grep against `kind`/interactive/ delegated/autonomous) — returned zero matching lines both times ("Bash completed with no output"). No CONTEXT.md content ever reached me via shell; I read its Session-kind definition via a subsequent Read tool call at offset=92.'
    solution: "Same direction as the already-tracked #1074 false-positive pattern: the detector should require the shell command's own stdout to be non-empty for the target path before attributing a read, not just that the command named the path."
    severity: moderate
  - description: "SHELL-READ-DETECTION miss (over-counted): docsReadViaShell flagged `.agents/skills/blog-post/SKILL.md` as read via shell from `grep -n \"recurred\\|regression\\|previously\\|used to\\|earlier version\\|no longer\\|deprecated\\|superseded\\|historical\" .agents/skills/blog-post/SKILL.md .agents/skills/audit-skills/SKILL.md .agents/skills/frictions-to-fixes/SKILL.md docs/agents/guards.md`, but every line in that grep's actual output was from the other three files — none matched in blog-post/SKILL.md, so its content was never shown to me."
    solution: Same fix as the CONTEXT.md miss above — attribute a multi-file grep's reveal only to the files that actually appear in its output, not every file named in the command.
    severity: moderate
