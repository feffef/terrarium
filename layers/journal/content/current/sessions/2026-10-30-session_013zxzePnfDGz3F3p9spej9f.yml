frictions:
  - description: Chained git status, git log and the git-conventions read in one call, so the first git commands ran before the required doc was read.
    solution: Read the doc in its own call before any git command.
    severity: nit
  - description: A backgrounded gate command carrying a trailing ampersand plus run_in_background was blocked by the double-background guard; one wasted call.
    solution: Pass run_in_background alone, as CLAUDE.md says.
    severity: nit
  - description: impl-brief step 2 and CLAUDE.md say to run the gate in the background, but the subagent hook blocks that for dispatched agents; the agent ran it foreground.
    solution: Say in impl-brief step 2 that a dispatched agent runs the gate in the foreground.
    severity: minor
  - description: SKILL.md step 7 says the agent pushes, but dispatch-subagents lets the lead push a reviewed branch; the agent had no push step and I pushed from the main checkout.
    solution: State in step 7 who pushes the branch.
    severity: nit
  - description: design-brief gives session log paths as layers/journal/content/*/sessions/*, but logs sit under current/sessions with a date prefix; the design agent hand-grepped them.
    solution: Fix the glob in design-brief step 1.
    severity: nit
  - description: survey-brief says to pass --out, but gives no scratchpad path; the survey agent used an unset TMPDIR and wrote a stray file at the filesystem root.
    solution: Tell the survey agent to pass --out under its scratch directory.
    severity: nit
  - description: frictions-to-fixes step 2 ranks regressions by highest severity since the fix, which put local-gate-green-ci-red first although the owner closed that issue not planned; the Skill has no rule for it.
    solution: Skip an entry whose ref records an owner decision not to fix, and list it in the PR description.
    severity: minor
