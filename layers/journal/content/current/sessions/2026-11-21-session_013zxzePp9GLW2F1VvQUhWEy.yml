frictions:
  - description: Launched four claim-check agents at once from one improvised brief, skipping the pilot-first rule for more than three agents.
    solution: The glassbox-update step 5 brief could name itself as repo-defined, or say to pilot one group first.
    severity: nit
  - description: The first claim-check brief had a garbled sentence about where the page list lives; the agent coped, but the brief was not re-read before dispatch.
    solution: Re-read each brief once before dispatching, as dispatch-subagents says.
    severity: nit
  - description: Started the full gate in a background subshell from a foreground call, so no completion notification came and I polled with a sleep loop.
    solution: Use run_in_background on the Bash call itself so the harness wakes the session.
    severity: minor
  - description: Made the code-review call with only `origin/main` as args; merge-pr.ts found no sha in the transcript and refused, costing a second review round and a superseded verdict comment.
    solution: Paste the whole printed review-call args, sha included; pr-workflow.md step 3 could say the parenthetical is part of the args.
    severity: minor
