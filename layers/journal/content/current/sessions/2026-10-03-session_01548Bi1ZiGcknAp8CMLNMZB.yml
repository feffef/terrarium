frictions:
  - description: "Impl subagents had no Agent tool, so code-review's parallel sub-agents and #1526's Sonnet probe could not run inside them; all six self-reviewed and reported it as /code-review until the user asked"
    solution: dispatch-subagents brief should say nested dispatch is unavailable and route review/probe steps back to the orchestrator, which should run /code-review itself after hand-back
    severity: moderate
  - description: "My relayed fix for #1570 told the agent to drop the [bot] login filter on a reviewer's 'provenance only' reading; that made CI bot comments count as owner corrections (11→23 candidates) until I caught it"
    solution: Before relaying a reviewer finding as an instruction, check what the removed code was guarding against; bots are excluded by account type, provenance separates AI from owner
    severity: moderate
  - description: "Five parallel full gates in one container exhausted memory: test:e2e died with a setup-hook timeout or worker SIGKILL on #1566, #1567 and #1569 while every other step passed; e2e alone or CI passed each time"
    solution: "Record in docs/agents/environment-caveats.md: test:e2e SIGKILL/hook timeout under concurrent gates is memory pressure; serialize heavy gates across parallel impl agents or re-run e2e alone before diagnosing"
    severity: moderate
  - description: "Cloud system prompt says 'You do NOT have access to the gh CLI', but gh 2.89.0 is installed and REST-backed commands work; likely origin of the false doc claim fixed in #1566"
    solution: Recorded in github-integration.md (#1566); the harness prompt itself is outside the repo
    severity: minor
  - description: First triage roll-up relayed a subagent rationale (#1480 'human-only to merge' as an escalation reason) before checking it
    solution: Scan subagent rationales against the ADR-0022 taxonomy before relaying
    severity: nit
  - description: "#1549 was triaged ready-for-agent and implemented without anyone asking whether a zod major bump had any benefit; the owner caught that it was cost-only after a full impl + review cycle"
    solution: Triage of dependency-sweep majors should state the concrete benefit in the brief, and route a no-benefit bump with a transitive-dependency mismatch to ready-for-human
    severity: moderate
