frictions:
  - description: First survey dispatch was blocked by the dispatch-read guard because my brief named the scratch placeholder literally; I reworded and resent.
    solution: Guard could allow a placeholder named in prose, or the Skill could say to fill it in the brief.
    severity: nit
  - description: Started pnpm gate:scoped on the ledger branch, then the Standards review found a dangling ref, so I stopped the gate and reran it, wasting minutes.
    solution: "Skill §5: run code-review before the gate, not in parallel; the review can change the head."
    severity: minor
  - description: A double-background guard blocked my first gate start because I added a trailing & to run_in_background; resent plain.
    solution: None needed; the guard worked as designed.
    severity: nit
  - description: code-review skill says to ask the user for a spec when none exists, which an unattended run cannot do; I substituted the Skill text and the ledger entry as spec.
    solution: Say in code-review that an automated run names its Skill or ledger entry as spec.
    severity: nit
  - description: The survey subagent reported the survey brief section 3 asks to label every candidate but cannot confirm 157 entries; append aborts on repeated sessions within one call.
    solution: Say which subset to confirm in survey-brief section 3 (inside an open prune trial's territory, so left for the trial).
    severity: minor
  - description: Ledger-only PR touched 58 files, so it failed the simple-change test and needed a two-agent code-review, costly for data with no logic.
    solution: Let a ledger-only diff produced by the Skill's scripts count as simple, or review it by the ledger spec.
    severity: minor
  - description: merge-pr.ts refused my own-read verdict because the follow-up commit touched a .ts file, though it was a one-line comment edit; I ran another full code-review.
    solution: Let the simple-change test ignore comment-only lines, or say in the Skill that a builder's comment fix needs a review round.
    severity: minor
