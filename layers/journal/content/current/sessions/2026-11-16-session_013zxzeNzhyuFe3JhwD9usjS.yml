frictions:
  - description: Bash auto-mode classifier returned no verdict on every call for several turns, so the run could not start and I pushed a could-not-run notification, then it recovered.
    solution: Retry once on a no-verdict error before notifying the owner, or let the harness retry transient classifier errors itself.
    severity: moderate
  - description: Ran my first git command (fetch) before reading docs/agents/git-conventions.md, which CLAUDE.md requires; the read hint arrived after the call.
    solution: Read the CLAUDE.md-listed doc before the first non-read-only git command, as the instruction says.
    severity: nit
  - description: First dispatch brief held an unfilled placeholder and the dispatch guard rejected it.
    solution: Inline the assignment text when writing the brief instead of a placeholder.
    severity: nit
  - description: Claim-check subagents read page text and line numbers from my stale checked-out tree, so they reported already-fixed excerpt ranges as false claims and I re-verified each by hand.
    solution: The glassbox-update brief should tell checkers to compare excerpt ranges only against git show of the commit and to ignore ranges the script already shifted.
    severity: minor
  - description: My branch started behind the commit the pages pin, so I had to merge origin/main late and resolve a frontmatter conflict after the claim checks had run.
    solution: In step 2 of glassbox-update, merge origin/main into the branch before the script writes pins.
    severity: minor
  - description: Skipped the code-review Skill that ADR-0004 asks for on a larger diff, reading the mechanical diff myself instead.
    solution: Either run code-review or let pr-workflow's simple-change test cover pure re-pin diffs of any size.
    severity: minor
