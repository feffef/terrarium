learnings:
  - The history table's Agent-initiated column counts only kind autonomous sessions; delegated sessions count as person-started (the owner's ruling).
  - Digest Sessions lines sum to 410 for 18 Oct to 11 Nov but the session logs hold 401 files, so count from the logs.
  - Counting commits from origin/main commit dates and sessions and frictions from session-log file dates reproduces the page's 17 October totals of 6319, 1078 and 3432.
ideas:
  - A small script that computes the history table row (sessions per week, autonomous share, frictions per session, commits) from the session logs and git for any date range, so these counts stop being assembled by hand each time the page is extended and could be checked by the gate.
