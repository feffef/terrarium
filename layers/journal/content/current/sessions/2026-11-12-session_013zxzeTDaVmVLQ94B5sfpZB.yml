frictions:
  - description: Staged files with git add -A while gate:scoped was running, which aborted the gate; the guard only fired later, at commit, so one gate run was wasted.
    solution: State in the gate doc that any tree change, staging included, aborts a run, or have the guard also refuse git add while a gate runs.
    severity: minor
  - description: Started the scoped gate before the code review and before the text was final, so it had to be stopped and re-run on the final head.
    solution: "Follow docs/agents/pr-workflow.md order: review, fix, then gate the final head; start the gate last."
    severity: minor
  - description: Wrote a subagent brief before reading the dispatch-subagents Skill, which CLAUDE.md requires first; the dispatch-read guard blocked the call.
    solution: Read the Skill before drafting any brief; the guard caught it at no cost beyond one call.
    severity: nit
  - description: "New history prose overclaimed beyond its evidence: cost framed as pressure, a claim nobody noticed the waste, lessons earning the highest grade against a later grading finding, all 68 pages read."
    solution: Check each drafted claim against its source before showing it, and read the whole page once before the first review.
    severity: moderate
  - description: Explained why the improver Skill was rebuilt from Digests alone; issue 2896 held the details and surfaced only when the owner said a ticket existed, costing one rewrite.
    solution: Search issues for the subject before drafting a why, since Digests omit the owner's reasoning.
    severity: minor
  - description: The Stop hook demanded a commit while the gate-edit guard blocked commits during a gate run, so the two hooks conflicted for several turns.
    solution: Have the Stop hook skip its commit demand while a gate run is active.
    severity: nit
