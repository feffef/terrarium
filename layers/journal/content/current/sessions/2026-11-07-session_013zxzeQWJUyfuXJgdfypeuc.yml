summary: "The owner asked me to read issue #2906 and its comments, then to design improvements to glassbox-curate, allowing me to message the sessions that designed and ran it. I asked the designer and the four run sessions which orientation sections they used: all chose focus from the memory page, none used terms or warnings, and two never reached the guide pages. The designer quoted the owner's own plan to trim once the output grew. Every design choice was the owner's (human-instructed): drop pr and learned, a session link on the workshop page, claims through open PRs only, proposal-as-result, the Where next check, the memory-page fixes, and orient.ts in two calls. The owner corrected my first cut: the first paragraph of each page is essential and must stay, Where next can go, and the Skill should explain why. Agent-initiated: removing the Walkthrough links the new check flagged in two Lessons and relinking the orphaned Walkthrough from another Walkthrough. code-review found a stale \"claim\" wording and a misplaced doc comment, both fixed. Gate green."
