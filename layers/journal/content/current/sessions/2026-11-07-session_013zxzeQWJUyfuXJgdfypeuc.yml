learnings:
  - In the Claude app, text written before an AskUserQuestion call is hidden while the dialog is open, so the question must carry its own examples
  - A get_session call's cost sits at external_metadata.usage.cost_usd; one run looked and reported no cost field
ideas:
  - Have orient.ts print its own byte count and warn above the tool's save-to-file limit, so a future section that grows the output is noticed by the first run, not after four
  - Give orient.ts a per-Subject read list (every page path in the chosen area with its word count), so the Read step's cost is visible and pagesRead can be checked against it mechanically
