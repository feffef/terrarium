frictions:
  - description: Ran git fetch before reading docs/agents/git-conventions.md, which CLAUDE.md requires first; a hook pointed to it after the call
    solution: Read the git doc together with github-integration.md at the first GitHub step; the fetch itself was harmless
    severity: nit
  - description: Sent a garbled first send_message to the designer session, with a wrong header id and no content, then had to send a correction
    solution: Check my own session id with get_session before the first peer message, and write the message before sending
    severity: minor
  - description: Examples written in chat before an AskUserQuestion were not visible to the owner in the app; it took two extra rounds to show them
    solution: Put examples in the question text or option previews, or send them as a file, not in the text before the dialog
    severity: moderate
  - description: My first guide-pages proposal cut the first paragraph, which the owner calls essential; I had weighted run reports over the design intent
    solution: Ask the owner which part of a section serves which decision before proposing cuts to it
    severity: minor
  - description: The new Where next check broke two existing Lessons and orphaned a Walkthrough; found only by running the real script
    solution: Run a new page check against the real guide before writing its test
    severity: nit
  - description: A scripted SKILL.md edit failed on a mismatched old string and had to be resent in full, since the script aborted before writing
    solution: Grep the exact lines first, or use the Edit tool per hunk so one mismatch does not void the batch
    severity: nit
  - description: "Edited the curate Skill while pnpm gate:scoped ran, so the gate aborted and had to run again (pr-workflow: edit nothing while it runs)"
    solution: Hold new owner requests until the gate finishes, or stop the gate before editing
    severity: minor
  - description: Pushed with --force-with-lease after restarting the branch from main; the classifier denied it though a plain push was a fast-forward
    solution: Check merge-base --is-ancestor before choosing a push form; a branch restarted after its merge needs no force
    severity: minor
  - description: The denied command also held the commit-message heredoc, so the message file never existed and the commit failed once more
    solution: Write the message file with the Write tool in its own step before committing
    severity: nit
  - description: A narrowing error in the new changedFiles code passed vitest but failed pnpm typecheck
    solution: Run pnpm typecheck right after editing a script, as CLAUDE.md says, before the specs
    severity: nit
  - description: The update session had no send_message tool, so its retro reached me only because the owner pasted it
    solution: Before asking a scheduled session for a reply, say it may answer in its own transcript and read it there with the inspect-session Skill
    severity: minor
