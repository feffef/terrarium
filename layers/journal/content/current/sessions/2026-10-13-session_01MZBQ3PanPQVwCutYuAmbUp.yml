frictions:
  - description: gate:scoped failed on an unrelated Journal accordion e2e test (matcher timeout) and passed on re-run; cost about three minutes.
    solution: Make that e2e test robust against slow hydration, or log it as a known flake.
    severity: minor
  - description: A Bash call that set run_in_background and also ended with a shell ampersand was blocked as a whole, so the python edit chained in it did not run; I only noticed on the next step.
    solution: Pick one background mechanism per call and keep edits in a separate call.
    severity: nit
  - description: I introduced a broken markdown link while editing the post with a replace script and only a re-check caught it.
    solution: Grep rendered link patterns after scripted edits.
    severity: nit
