frictions:
  - description: Ran git fetch in the same parallel batch as reading git-conventions.md, so the read wasn't strictly first
    solution: Read the CLAUDE.md trigger doc in its own call before any non-status git command
    severity: nit
  - description: My fix brief to the HITL writer proposed 'None looks for the approval label before a build', which was false (guest-build's poll-guest-tickets.ts)
    solution: A researcher brief for an absence claim names every code location, including .agents/skills/*/scripts/, and I propose no wording I haven't grepped
    severity: moderate
  - description: A first-round Zod fix ('type and schema overlap on one rule') was false and passed code-review; only the last re-grade caught it
    solution: Have the review's Spec agent re-check every sentence a fix round rewrote against its source, not only the targeted deficit
    severity: minor
  - description: I refused a Standards finding on attribution's Block-posts ADR trace; all three re-raters then raised it, costing a fix round
    solution: Judge an ADR-trace finding against the ADR's Rejected alternatives and When to revisit, not only its Why
    severity: moderate
  - description: The promotion writer's worktree page test was red by design because the join edits lived only on the run branch
    solution: Let the promotion writer commit the link repoints to drafts that point at its moved page, as part of its own move
    severity: minor
  - description: A researcher left a stray empty x.txt in the shared scratchpad root
    solution: None needed beyond the existing per-agent subfolder rule; removed it
    severity: nit
  - description: Ran pnpm gate:scoped three times (one early run before review fixes landed), each a few minutes of container time
    solution: Run the gate once on the final head after the last re-grade; rely on the page spec and validate:content between rounds
    severity: minor
