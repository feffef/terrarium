learnings:
  - The gate's content validation parses run entries as YAML, so a plain scalar holding a colon plus a space becomes a map and fails; run pnpm validate:content right after writing a run entry.
  - The Own-read verdict is checked only by file status (added, renamed, copied), not by how large or complex the change is; the simple-change rule lives in pr-workflow.md and the script cannot enforce it.
