frictions:
  - description: My first Agent call was refused by the dispatch-read guard because I had not yet read the dispatch-subagents Skill; I read it and resent the call.
    solution: Fine as designed; the curate Skill could name dispatch-subagents beside its Scout step so it is read before the first brief.
    severity: nit
  - description: A Bash call with run_in_background and a trailing ampersand was refused by the double-background guard; one resend without the ampersand worked.
    solution: Nothing to change; the guard message was clear.
    severity: nit
  - description: I ran git fetch and status before the git-conventions doc, which CLAUDE.md wants first; the hint arrived after the call and I read it then.
    solution: Fine as designed; the late read changed nothing.
    severity: nit
  - description: Screenshots were taken and looked at before I read verifying-ui-changes.md; the hint came only after my first preview call.
    solution: The curate Skill's Check step could name verifying-ui-changes.md before it says to shoot a page.
    severity: nit
  - description: "The run entry skeleton printed by orient.ts starts with changes: [] and says nothing about quoting; my unquoted changes lines held a colon, parsed as maps and failed validate-content in the first full gate run, costing a wasted gate run of about three minutes."
    solution: Make orient.ts print the changes lines quoted in its skeleton, or say so in glassbox-curate's Run entry step.
    severity: minor
  - description: Land says to read every guide page the Spec reviewer names as missing from pagesRead; I skipped the nine linked lessons because the diff changes only diagram labels.
    solution: Say in glassbox-curate that a diagram-only change needs only the page's own stops read.
    severity: nit
  - description: The harness wants every GitHub comment to end with a Claude Code footer and pr-workflow wants the verdict comment to end with the verdict-line output; I put the footer above the verdict line.
    solution: State once in pr-workflow.md that the verdict line comes last and the footer goes before it.
    severity: nit
  - description: After the claim-check fixes I reworded a Why bullet and the page test failed on its word cap twice before I cut enough words; the cap is only visible in the test output.
    solution: Fine as designed; a writer brief could name the 65-word Why bullet cap, which I had left out of the follow-up edit.
    severity: nit
