status: in-review
outcome: "PR #2172 makes the guard's deny message say nothing in the call ran; waits for a human merge"
summary: "The owner asked why frictions-to-fixes never addressed the double-background cluster (11 occurrences, 2026-10-05..16, status open, no ref). I found the guard (PR 1210) already exists and every occurrence is nit/minor and the guard working as designed, and a guard fix can't be dispatched by that Skill; no run recorded why it skipped the cluster. At the owner's request, three background agents read 10 of the 11 transcripts and traced our instructions: every case was a gate launch with a hand-built \"( ... ) &\" subshell, often with edits or a commit chained into the same call, which the deny silently dropped; the CLAUDE.md prose warning was cut by the 2026-10-07 prune trial. The owner then asked what changed around run_in_background (I traced the commits) and whether sleep/Monitor waits rose after 10-07 (session-log tool counts: no clear rise, two outlier sessions). I proposed a small PR; the owner approved it (\"yes\"). Built: the deny message adds the owner-approved \"nothing in this call ran\" sentence and drops the shell-& option; header and guards.md roster fixed; tests updated; code-review findings (paraphrased sentence, an unverified \"you are notified\" claim) fixed; ledger entry set to tracked. A gate.ts exit-line idea was dropped as weak on its own."
