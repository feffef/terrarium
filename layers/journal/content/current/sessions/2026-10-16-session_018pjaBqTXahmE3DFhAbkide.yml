frictions:
  - description: Skipped the session-start full reads of GLOSSARY-MAP.md and GLOSSARY.md; only grepped GLOSSARY.md for two terms.
    solution: Read both at session start as CLAUDE.md says; a hook could flag a first turn without them.
    severity: nit
  - description: Read git-conventions.md and github-integration.md only after the read-first hint fired on my first git log and GitHub search.
    solution: Read them before the first git or GitHub call; the hint caught it and the calls were already correct.
    severity: nit
  - description: Recommended fixes without first grepping docs/adr for the guard and gate, as CLAUDE.md asks before a recommendation.
    solution: Run grep -l on the paths in docs/adr before proposing a change.
    severity: minor
  - description: Told the owner the gate.ts change was agent-mergeable; gate.ts is on the Human-only list. Caught and corrected one turn later.
    solution: Check the human-merge rule's paths before stating who may merge a file.
    severity: minor
  - description: Did not invoke close-session after the earlier answer-only turns, as CLAUDE.md asks when a session only answers a question.
    solution: Log after the first answered question; re-invoking later is cheap.
    severity: nit
  - description: First draft of the deny message paraphrased the owner-approved sentence and added an unverified 'you are notified' claim, false for subagents; code-review caught both.
    solution: Paste approved wording verbatim and add nothing the owner did not approve.
    severity: minor
  - description: One session-reading subagent skipped a 3.6 h transcript because paging list_events was too slow, so one occurrence came from its log only.
    solution: list_events with kinds filtering still pages the whole transcript; a search-by-tool filter would help for long sessions.
    severity: nit
  - description: frictions-to-fixes runs left an 11-occurrence cluster open with no recorded reason, so the owner had to ask why.
    solution: Have the ledger PR description name each high-occurrence open cluster it skipped and why.
    severity: minor
