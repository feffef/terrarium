frictions:
  - description: My first git command ran before I read git-conventions.md; a hook flagged it after the fact. The command was read-only.
    solution: Nothing needed; the hook's late reminder did its job.
    severity: nit
  - description: The clear-backlog Skill leaves hook-wiring issues out by default, and the owner had to tell me to include them.
    solution: Ask about that exclusion at the start of the run, or drop it when a Trusted owner starts the run, since a human merge already controls those files.
    severity: minor
  - description: Workflow results are nested JSON in .output files, so reading them took a one-off node script each time.
    solution: A small script that prints a clear-backlog run's results (outcome, question, decisions, judgement calls) from the .output file.
    severity: nit
