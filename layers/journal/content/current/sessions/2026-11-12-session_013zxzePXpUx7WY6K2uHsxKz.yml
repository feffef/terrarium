learnings:
  - In a scoped Vue SFC, `.hero-art svg` also matches inline SVGs you nest inside it, since scoped attributes sit on every template element; use `>` for the outer one.
  - "`vector-effect` is not inherited, so an SVG `<use>` needs it on the referenced path or the shadow copy scales its stroke."
ideas:
  - Declare each Tenant's homepage placement (tile order, group, footer entry, 404 mapping) in its manifest and derive the home tiles, SITES and the map's relationships from it, so a reorder or new Tenant is one edit and lists like the footer's five sites cannot drift.
  - Add a screenshot-diff step for the Platform homepage at three widths to the browser tier of the gate, so layout regressions such as a display:contents rule losing to a later base rule fail a PR instead of reaching a screenshot review.
