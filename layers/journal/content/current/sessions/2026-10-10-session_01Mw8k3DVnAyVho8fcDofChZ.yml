outcome: "Survey #1739 filed; PR #1740 catalogues its 5 finds and closes the Kiln Wasters season, awaiting human merge"
summary: |-
  All of this was human-instructed. The user invoked /midden-survey and then /midden-catalogue. Before cataloguing I asked three scope questions, and the user chose: all five candidates, leave Karen's replaced post out, and close and name the open season.
  The survey (#1739) found five candidates and eight Gate-B exclusions.
  For the catalogue, I re-read every find at its primary sources: commits, files at their last revision, issue and PR bodies and comments, the two session logs that did the removals, and #1637's CI log, which showed the zod-4 bump failing on the same tuple loosening as #1569. Those sources gave the facts the survey lacked: - the background-flag guard's premise had become false by the time it was
    removed;
  - the session-id check's only three findings were all false positives, and the
    owner chose deletion over the #1704 rescue;
  - the scaffold-tenant row was a 98-day placeholder that no test ever named.
  Placement: - Three guard finds form a new report, Stood Down. #1704 is folded into the
    session-id find rather than catalogued separately.
  - The placeholder joined What the Record Claimed. - #1636 and #1637 became one find in Tried and Left Alone.
  Agent-initiated choices: the season name (the Kiln Wasters, 09-05..10-04, six finds repointed, new Current Midden from 10-05), every grade, every report placement, and folding #1704 and #1637 into other finds. The PR flags these for the reviewer.
  Two read-only reviewers ran in parallel: - The fact-check found three real errors: the Dependabot schedule went live at
    07:09 UTC (PR #1633 merge), not at the config commit's 05:52; one of the
    remaining background guards was added after the removed one; and the record
    does hold a zod reason. It also found four overstatements. All were fixed, and
    a second fact-check pass came back clean.
  - The voice review drove plain titles, explanations of terms before use, and a
    regrade of the bot upgrades to intact.

  pnpm gate:scoped was green on both commits, and CI was green on the first push.
