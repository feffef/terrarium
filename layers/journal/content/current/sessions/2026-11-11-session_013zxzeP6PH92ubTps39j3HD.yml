learnings:
  - list-open-issues.ts output carries only labels, number, title and updatedAt, so a title match cannot show whether the issue is closed as completed or not planned.
  - In a detached HEAD, git push origin feat pushes feat's old commit, not HEAD; reproduced in a scratch repo.
ideas:
  - Make harvest step 3 weigh a learning by recurrence across sessions and by whether its home doc lacks the fact, instead of the retire-as-much-as-it-adds test, which fits ideas but rejects almost every doc-fact learning.
