summary: "Scheduled-style harvest run with the argument learnings. First pass was agent-initiated and too shallow: I opened about ten of the 204 unharvested learnings' clusters, screened mostly by keyword grep, and filed nothing. The owner then asked whether nothing was worth documenting (human-instructed) and told me to do a second pass and think about improving the Skill (human-instructed). The second pass checked the GitHub, git and harness clusters against docs/agents, the tracker and the Friction Ledger, dropped what the Ledger or open issues already cover (closing keywords, helper agents moving the branch, gate comment SHA, hand-back guidance), and filed three workflow Seedlings, each adding a few lines to one existing doc - 3103 (github-integration.md), 3104 (environment-caveats.md), 3105 (git-conventions.md) - all verified with check-posted. Product clusters stayed unfiled because their facts already sit in code comments or are single-session. The owner then told me to build the Skill changes in this session (human-instructed): PR 3106 changes harvest step 1, 3, 4, 5 and adds stateReason to list-open-issues.ts, reviewed with code-review (valid findings applied), gated green before the push, and merged by me through merge-pr.ts after the green gate and my verdict comment. Earlier open question, now settled: the Skill's rule that a change must retire as much as it adds blocks nearly every doc-fact learning, so the first pass dropped real candidates for that reason."
