frictions:
  - description: Skipped QUALITY.md Lenses from the curate Skill's Read first list until the owner asked whether I used glassbox-lesson. Never opened it for four passes.
    solution: Make the curate Skill's Read first list load QUALITY.md, or have orient.ts print a reminder when it was not read.
    severity: minor
  - description: First subagent brief was blocked by the dispatch-read guard because I had not read dispatch-subagents; CLAUDE.md names that trigger and I skipped it.
    solution: Read the Skill when the curate run first plans a subagent, as the CLAUDE.md read-first list says.
    severity: nit
  - description: Ran a throwaway git checkout -b, checkout and branch -D chain in one Bash call, against git-conventions' one state-changing command per call; it did nothing useful.
    solution: Do not touch branches at all after orient; run each git command alone.
    severity: nit
  - description: Stacked run_in_background with a trailing ampersand and the double-background guard blocked the gate run; I resent it plainly.
    solution: Use run_in_background alone, as the guard message and CLAUDE.md say.
    severity: nit
  - description: Wrote a harvest Routine bullet into Scheduled tasks from the Skill's own text; the owner said no Routine exists, so it was written, checked and reverted.
    solution: Check whether a Routine exists before listing a Skill as one, since SKILL.md wording (A Routine runs this Skill) states intent not fact.
    severity: moderate
  - description: Run entry failed validate:content twice because plain YAML scalars held colon-space inside changes rows, parsed as objects; also the memory page exceeded its word cap once.
    solution: Have the orient skeleton warn to avoid colon-space in changes rows, and run workshop.spec before the first commit.
    severity: nit
  - description: One fresh reader on the Hooks pages never reported back, so Hook-added context and Session transcripts went unreviewed; I only noticed at landing.
    solution: Check the task output file after a reasonable wait or resend the brief, rather than assuming the notification will arrive.
    severity: minor
  - description: plain.ts rejected bare walkthrough stems; I redirected output to files, so the error hid in nine five-word files until I read one.
    solution: Show a stem example with its folder in plain.ts usage, and print the error to the terminal.
    severity: nit
  - description: The Stop hook asked me to commit and push uncommitted writer output three times mid-run, so text not yet claim-checked was pushed to the branch before review.
    solution: Commit writer output to the run branch as work in progress right away, since a push opens nothing, and say so in the commit title.
    severity: nit
