learnings:
  - A Skill's own wording that a Routine runs it states intent, not fact; whether a Routine exists lives in the owner's claude.ai account, which the repo cannot read, so ask before listing a Skill as scheduled.
ideas:
  - Have glassbox-curate's orient.ts list Skills in .agents/skills that no guide page names, so a gap like harvest and Seedlings shows up in the first read instead of waiting for the owner to notice, then rank them by how often session logs show the Skill running.
