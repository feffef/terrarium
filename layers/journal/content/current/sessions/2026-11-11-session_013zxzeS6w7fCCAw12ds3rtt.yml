goal: Make the audit-skills orphan check cheap and cover issue-only sessions
status: completed
outcome: "PR 3054 merged by the owner: the orphan scan reads only the last 7 days of PRs and issues"
summary: 'The owner asked how expensive the orphan scan over 2000+ closed PRs is, proposed limiting it to 7 days (the audit runs daily) and adding issues updated in the last 7 days to catch sessions that only filed issues. I read the code, gave a cost estimate (about 21 requests per run, growing), and asked three questions first; the owner confirmed the 7-day window, said an old issue commented on today should count, and said the stale RESOLVED_ORPHANED_SESSIONS map can stay as long as it does not grow. Human-instructed: the 7-day window, the issue source, leaving the map alone, "continue with code review", and the merge itself (the owner merged the PR). Agent-initiated: building it without asking again, dropping the opt-in full-scan flag (nothing needs it), the sort=updated early stop, putting the cutoff in orphanScan, the originSession helper and type rename from review findings, and opening the PR (ADR-0003 standing rule; the owner had not asked for a PR explicitly). Both review axes found no rule violations; the untested live GitHub reader is the reason the PR said it needed a human merge, which I first misattributed to a Human-only path before checking the list. A live run showed 151 merged PRs and 63 issues in the window with no orphans. Still open after the merge: no test covers readOrphanCandidates itself (early stop, failure path), and the orphan window also shrinks with --days N.'
