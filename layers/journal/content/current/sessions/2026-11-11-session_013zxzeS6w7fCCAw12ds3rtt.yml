frictions:
  - description: Called list_pull_requests, my first GitHub operation, before reading github-integration.md; a hook then asked me to read it first.
    solution: Read the doc at session start when a PR is the planned end, or make the read-first hint fire before the call.
    severity: nit
  - description: Edited audit-skills.ts and its SKILL.md before reading the full ADRs the PostToolUse hooks named; the ADRs showed the edits were fine.
    solution: The rule summaries said to read the ADR to change governed work; read it at the first Read of the governed file.
    severity: nit
  - description: Introduced RawIssueApiRecord without grepping for it; the file already imported that name. Typecheck caught it.
    solution: Grep a new exported type's name across the file's imports before adding it.
    severity: nit
  - description: A global sed rename also changed an unrelated use of the imported type, which I only spotted from the file-changed notice and then fixed.
    solution: Use targeted Edits for renames in a file that imports a same-named type.
    severity: nit
  - description: The Human-only rule (adr-0004-human-merge) loaded though none of my edited files is on its paths list, so I told the user the PR needed a human merge for the wrong reason until I checked the list.
    solution: Have the rule-loaded notice name the path that matched; unverified why it loaded for these files.
    severity: minor
  - description: Ended a turn with the review-fix commit unpushed while the gate ran, so the Stop hook asked me to push; costing one extra turn.
    solution: Push the review-fix commit right after committing; a push does not disturb a running gate.
    severity: nit
