learnings:
  - GitHub's updated_at on a PR is never earlier than merged_at, so a closed-PR listing sorted by updated desc can stop at the first all-stale page without missing a PR merged in the window
  - The issues listing since filter matches updated time, not creation, so an old issue commented on today is a candidate; the issues endpoint also returns PRs, told apart by the pull_request key
