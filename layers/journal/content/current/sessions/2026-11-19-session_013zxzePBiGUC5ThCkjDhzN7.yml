learnings:
  - Session logs record `skillsUsed` entries that are slash commands or built-ins (`context`, `model`, `loop`), so a by-skill count mixes real Skills with commands.
  - "`filesEdited` in a session log is a more reliable way to find sessions that touched a Tenant's content than the goal text; older archived logs may record it less completely."
ideas:
  - Have `log-session.ts --author` warn when a blog-post session has neither `ideas` nor `learnings`, so an empty field is a conscious choice; the warning costs a re-run and surfaces the 8-of-137 gap at the moment it can be fixed.
  - Add a Journal page row or chart for the share of sessions with `ideas`, per Skill used, so a gap like blog-post's shows without a one-off script.
  - Judge the Take change after a trial window by the share of blog-post logs with a non-empty `ideas` field against the 8 of 129 baseline from the archived logs (ADR-0027 style).
