frictions:
  - description: Ran git rev-parse as my first git command before reading git-conventions.md; a hook flagged it afterwards.
    solution: Read git-conventions.md first, or list rev-parse among the read-only commands CLAUDE.md allows.
    severity: nit
  - description: The dispatch-read guard blocked my first Workflow call until I read dispatch-subagents; one retry.
    solution: Read dispatch-subagents before any Workflow call; clear-backlog could name it.
    severity: nit
  - description: "Picked a diff-based gate check for #3047 without running it on the three recorded occurrences; it catches 1 of 3 and audit-docs already covers it. The owner's question exposed this, costing one round."
    solution: Run a proposed check on the issue's own concrete cases before presenting it as a pick.
    severity: minor
  - description: Merged PR 3053 and moved on without re-invoking close-session; the Stop hook had to remind me.
    solution: Re-invoke close-session in the same turn as the merge-pr.ts call.
    severity: nit
  - description: "Relaunched the #3046 build on my own reading of the owner's correction to 4c without confirming the scope first; the owner interrupted to ask what was being built."
    solution: Restate a corrected scope in one line and wait for a yes before relaunching a build.
    severity: minor
  - description: Rebuild was given the old worktree to continue, but the workflow made fresh worktrees and copied the drafts, so the old one lingered and tripped the Stop hook.
    solution: After a killed build, remove the old worktree or tell the agent to use it explicitly.
    severity: nit
  - description: "log-session --author removed the in-flight #3046 build worktree as merged, because its branch had zero commits and looked merged."
    solution: log-session should skip worktrees of a running workflow or branches with no commits.
    severity: nit
