summary: 'All work was human-instructed, step by step. The owner asked which read-first line was moved into a rule alongside the now-retired adr-check Skill (01177f458: the UI-verification line became .claude/rules/ui-verification.md). They then asked how often that rule fired since, how useful it was, and whether the linked doc was read. Across 82 session logs: 16 loads; 8 in the main session, 6 of them rated useful with verifying-ui-changes.md read; the 9 subagent-only loads were noise. The owner then asked me to check for missed triggers. Matching UI-path commits on main to sessions through their Claude-Session trailers found 12 UI-changing sessions, 2 of which never loaded the rule. Both edited the bracketed frictions.vue through Bash alone. The cause: bashReadPaths dropped any token containing [ or ], so bash-rules-hint never fires for Nuxt dynamic routes (31 of 40 page files). The owner said "fix it right away". PR #2467 accepts brackets as literal in read arguments, with tests. A cd into a bracketed directory stays strict, because github-provenance-guard reads request bodies from that directory and fails closed when it is unknown; the PR records this as a known limit. Two review rounds (Standards and Spec) shaped the helper and its comments. The owner then asked which other read-first lines suit path-bound rules. Only domain.md fits; the rest trigger on actions. They approved moving it as a separate PR. That branch (ccr-7abdc1fd-hjtj4f-glossary-rule) adds .claude/rules/glossary-terms.md, a Human-only path, so PR #2469 waits for a human merge; its gate passed.'
