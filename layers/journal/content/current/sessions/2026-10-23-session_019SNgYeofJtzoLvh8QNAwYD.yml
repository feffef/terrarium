frictions:
  - description: Ran git log --all -S in the same call that first read git-conventions.md, which says to scope -S to origin/main, never --all.
    solution: Read git-conventions.md in its own call before any history query; the read-first hint fires after the call, too late.
    severity: nit
  - description: Told the owner that session 01Wd2W never loaded ui-verification.md; it had. I misread my own script output and stated it unchecked.
    solution: "Verify before you state: grep the log file itself before reporting a per-session claim from a script's summary line."
    severity: minor
  - description: First audit script compared a YAML datetime's str() against an ISO string, silently dropping every 2026-10-19 session; caught before reporting.
    solution: Normalize timestamps (or parse them) before comparing; print the count of sessions in scope as a sanity check.
    severity: nit
  - description: Loosened the shared cd check in shellSegments before grepping its callers, then reverted once I saw github-provenance-guard depends on it.
    solution: "One home per fact: grep consumers of a shared helper before changing it."
    severity: minor
  - description: Answered the first two research questions without invoking close-session, which CLAUDE.md asks for when a session only answers a question.
    solution: Invoke close-session after a question-only turn; logging self-heals so early logging is free.
    severity: nit
  - description: session logs' filesEdited omits shell edits for part of the month, so a missed-trigger audit must fall back to commit trailers on main.
    solution: Derive filesEdited from the session's own commits for every log (2964475de started this on 10-21).
    severity: minor
