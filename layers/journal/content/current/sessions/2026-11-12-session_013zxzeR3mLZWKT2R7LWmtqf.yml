frictions:
  - description: Called the explore Workflow before reading dispatch-subagents; the dispatch-read guard blocked it and I retried the same call after reading.
    solution: The CLAUDE.md trigger names briefs, but a saved repo workflow needs none; the clear-backlog Skill could say the read is not needed, or the guard could exempt saved workflows.
    severity: nit
  - description: A gh api call with -f state=open became a POST to the issues endpoint and failed with a 422; nothing was created.
    solution: Use -X GET explicitly with -f on gh api reads; github-integration.md could say so.
    severity: nit
  - description: The owner's one-word reply 'Three columns' was ambiguous, and my own question tables may have prompted it, so one round was spent clarifying.
    solution: Keep grilling answers to lettered options and avoid tables inside the question text.
    severity: minor
  - description: run-summary.ts --findings crashed on a re-check findings file because the reviewer wrote a bare array, not the review's shape.
    solution: Make findingsSummary accept a bare array, or the re-check prompt in clear-backlog §3 should state the shape.
    severity: minor
  - description: Two Standards re-checks and a builder fix ping-ponged on line-wrap nits, because each rewrap moved the overrun to the next line.
    solution: Have the builder run awk length>80 on touched lines before the first commit; the builder rules() could say so.
    severity: minor
  - description: "Linked worktree(s) left with uncommitted or unpushed work at close: /home/user/terrarium/.claude/worktrees/wf_610db963-f72-2"
    solution: Push each, or remove it if its work is meant to be dropped.
    severity: minor
  - description: After the PR merged I updated the log with log-session directly and skipped close-session; the Stop hook had to block the turn to make me invoke it.
    solution: The merge-pr.ts output or the PostToolUse hint already says to invoke close-session; follow it before any other write.
    severity: nit
  - description: "The SubagentStart hook demanded repeated echo rule-use: Bash calls from every read-only reviewer (8 of 8, two or three each) with no effect on the review."
    solution: Give read-only reviewers one rule-use report call at the end, or drop the start-of-run demand for them.
    severity: minor
  - description: The git-conventions hint fired after read-only or first git commands for three clear-backlog agents, though CLAUDE.md already exempts read-only git.
    solution: Narrow the hint in scripts/hooks/ to skip diff, log, show and rev-parse.
    severity: nit
  - description: I asked the owner a builder-raised owner-call (late logs failing a gate check) that followed from a choice the owner had already made; the owner asked why.
    solution: clear-backlog section 3 step 2 should say to check an owner-call against decisions already made before asking it.
    severity: minor
