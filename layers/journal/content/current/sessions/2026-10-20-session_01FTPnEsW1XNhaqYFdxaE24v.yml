frictions:
  - description: Ran git log to draw conclusions before reading docs/agents/git-conventions.md, and skipped the full GLOSSARY read at session start.
    solution: Read-only question sessions still trigger the read-first list; the hint fired late but was right.
    severity: nit
  - description: Did not run adr-check before giving an opinion on Skill quality, which CLAUDE.md counts as a recommendation.
    solution: Opinion was descriptive, not a proposed change; clarify whether adr-check applies to pure assessments.
    severity: nit
  - description: My first gate-wait loop grepped the gate log for an EXIT marker that only the outer task output held, so it could never end; stopped it.
    solution: Wait on the background task's own completion notification instead of polling a log for a marker the command writes elsewhere.
    severity: nit
  - description: First rewrite pass dropped several pointers and why-clauses and a no-argument default while claiming every rule kept; the spec review caught them.
    solution: Before committing a whole-file rewrite, diff an old-vs-new rule checklist myself rather than relying on review to find losses.
    severity: minor
  - description: Second rewrite again lost a rule (never cut a load-bearing why) and broadened the sweep PR scope despite a mental checklist; review caught both.
    solution: Write the old-rule checklist to a file and tick it against the new text before committing; a mental pass missed the lens's opening line.
    severity: minor
  - description: The Stop hook asked to push five times while the gate and reviews ran; ADR-0004 says hold, so each nag cost a turn.
    solution: Have the git-check Stop hook stay quiet while a gate:scoped run for the branch is in progress or a review agent is running.
    severity: nit
  - description: "The audit-docs log-session pass failed silently on an unquoted # because I grepped its output for one phrase; caught only on the next pass."
    solution: Read the whole --author output, or check its exit code, instead of grepping for one expected line.
    severity: minor
  - description: "The audit-docs restructure in #2331 grew the file instead of pruning it; the user had to point out it was not a real prune."
    solution: In a prune-trial rewrite, ask of each line whether a rule, guard or the gate already enforces it before moving it; moving text is not pruning.
    severity: moderate
  - description: Third time this session the first pass cut items beyond what was approved (gap rule, Mis-location order, shorter-or-plainer); review caught them.
    solution: Diff the approved cut list against git diff before committing; any removed line not on the list is restored or asked about.
    severity: minor
