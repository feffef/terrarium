summary: "Human-instructed throughout. First a question: which routine Skill reads worst and which is cleanest; answered frictions-to-fixes and audit-skills after reading all seven. The user then asked for frictions-to-fixes to be rewritten in plain language, each step as a goal paragraph, instructions with script and subagent calls, and edge cases, keeping its logic. Before building I asked three questions (the typo \"sjioo calls\", SKILL.md only or briefs too, Prune Trial or plain PR); the user chose script calls or subagents, SKILL.md only, and a Prune Trial. That PR (#2330) merged after a Sonnet probe and a two-axis code-review whose findings (dropped pointers and why-clauses, a lost no-argument default) I fixed. The user then asked for audit-docs \"the same way\"; I carried the earlier answers over without asking again. Its reference block (tiers, lenses, checker sources) moved into the steps that use them, so this file grew slightly (2058 to 2113 words) where the first shrank. A Sonnet probe answered ten scenarios correctly; review found a broadened sweep-PR scope line, a lost load-bearing-why rule and the open-trial check placed away from the edits, all fixed. Agent-initiated within the asks: the overview of each run's PRs, keeping section numbers and tier and lens names for their callers, and the trials' check texts."
