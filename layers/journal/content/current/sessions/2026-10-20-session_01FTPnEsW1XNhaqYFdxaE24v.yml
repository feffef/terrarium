summary: "Human-instructed throughout. First a question: which routine Skill reads worst and which is cleanest; answered frictions-to-fixes and audit-skills. The user then asked for frictions-to-fixes to be rewritten in plain language, one section per step (goal, instructions with script and subagent calls, edge cases); after three clarifying questions it shipped as a Prune Trial in #2330. The user asked for audit-docs \"the same way\" (#2331), which grew slightly because its front-loaded reference moved into the steps. The user then said that one wasn't really a prune and asked which detailed edge cases could go. I proposed a list grouped as enforced elsewhere (ADR-0027 rule, skills-lock gate, spawn depth, provenance guard, gate scope), no-ops or impossible cases, and heavy simplifications (one checker rule, no read counts for Agent B); the user approved all of it and asked to fold it into the same trial. The pruned file is 230 lines / ~1630 words, from 297 / 2113. A Sonnet probe answered 11 scenarios correctly; a review against the approved list found I had again cut a few unapproved items, which I restored. Last, on request, I inspected the first frictions-to-fixes run on the rewritten text (session 01VH74k3, 18:05 UTC): it followed every step, with no major friction traceable to the rewrite; its gaps sit in the briefs and in rules the old text shared."
