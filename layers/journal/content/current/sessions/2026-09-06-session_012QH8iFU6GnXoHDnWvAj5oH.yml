summary: "Ran the scheduled /digest Skill (no human prompt this turn). `digest.ts list` reported 57 undigested days going back to 2026-07-04, which looked like a huge missed backlog. Investigated against git history before writing 57 digests: every one of those days already had a Digest written and later archived by the retention sweep — `existingDigestDays()` in scripts/digest.ts only scanned the current/ directory, not archived/, so an archived day looked undigested again forever. Fixed the scanner to check both directories (moved the ARCHIVED_DIGESTS_DIR constant into digest.ts, re-exported from archive-journal-content.ts to keep its existing test import working), added a regression test, then confirmed only 2026-09-05 was genuinely missing and wrote that one Digest. Ran the retention sweep (1 digest, 10 sessions archived). Gate green; opened PR #1167 and subscribed to its activity. This PR carries a script fix outside pure digest-page content, so per the digest Skill's self-merge boundary it is left open for human review rather than self-merged on green CI."
