learnings:
  - scripts/audit-skills.ts' orphanedSessions check has a 4-day memory (ORPHAN_WINDOW_DAYS = 4) — an orphan older than that is permanently undetectable by it, so the check cannot support ADR-0009's close-session-invocation-rate measurement
  - github-footer-guard blocks a divergent Claude-Session footer but explicitly skip-and-passes an absent one, so an unfootered PR body is the quieter ADR-0017 violation
  - A PR body's Claude-Session footer is a window-free PR-to-session linkage — unlike commit-trailer scanning, it needs no calendar window at all
ideas:
  - "Build the audit this session ran by hand as a committed script (pnpm audit:pr-logs): for every merged PR, resolve its body's Claude-Session footer to a session-log file and report the misses. It is window-free by construction, so unlike orphanedSessions nothing ages out of detection — it is exactly option 3 in issue #738, and it would also surface footerless PR bodies (#737) as a side effect, since a PR with no footer is precisely the row it cannot resolve."
