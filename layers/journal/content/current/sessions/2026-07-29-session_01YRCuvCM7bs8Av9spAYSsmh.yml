learnings:
  - isResolvedMisfile (audit-skills.ts) suppresses an orphan candidate on ANY added-then-later-deleted path, though its docstring scopes the intent to a mis-filed session log — so a session that adds a doc and folds it into its single home becomes invisible to the only did-work-never-logged detector
  - Following this repo's own single-home convention (add a doc, collapse it into CLAUDE.md, delete the file) is precisely the behaviour that triggers that suppression — the blind spot is manufactured by the conventions, not by rare accident
  - isResolvedMisfile compares git %aI timestamps as raw strings while its sibling functions deliberately use Date.parse and document the mixed-offset hazard; real data in the window carries +02:00 offsets
  - "The last successful orphan detections (#564/#565, filed 2026-07-18T00:51Z) predate PR #581's merge (01:39Z) by 48 minutes — the detector worked right up to the regression landing"
  - "Emulating a historical scheduled run is easy and worth doing: --since/--until pinned to the sweep's own timestamp reproduces exactly what that day's check saw, turning did-it-run guesswork into a table"
ideas:
  - "Make orphanedSessions report its suppressions instead of `continue`-ing silently. A check that both has a 4-day memory and a quiet filter path cannot signal 'I dropped something', which is what let #747 hide a true positive across four consecutive daily sweeps — nobody can notice an absent row. Emit suppressed candidates with the reason and the triggering path as a separate, non-actionable section of the scorecard, so a wrong filter shows up as visibly wrong rather than as silence."
  - "Build the audit this session ran by hand as a committed script (pnpm audit:pr-logs): for every merged PR, resolve its body's Claude-Session footer to a session-log file and report the misses. Window-free by construction, so unlike orphanedSessions nothing ages out — it is option 3 in #738, is immune to #747's suppression bug because it never looks at file diffs at all, and would surface footerless PR bodies (#737) for free as the rows it cannot resolve."
