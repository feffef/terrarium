frictions:
  - description: Redirected `git stash pop` output to /dev/null; it failed silently, so a "base vs mine" comparison run actually re-tested base and looked like a clean pass.
    solution: Never silence a state-changing git command. Assert the expected state afterwards (git status / git diff --stat) instead of trusting the command's own exit path.
    severity: moderate
  - description: Ruling out an unrelated intermittent e2e failure cost six full build/e2e/gate runs (~20 min) before the gate went green on an unchanged tree.
    solution: Check whether the app actually imports the changed module FIRST — one grep showed nothing under app/layers/shared/modules imports scripts/, which bounded it immediately.
    severity: moderate
  - description: "My own filed fix proposal (#747 item 2, require the candidate's session id in the path) would have reintroduced #574 — a mis-file is by definition under the WRONG id."
    solution: Read the existing tests before proposing a predicate change, not just the implementation; the test at audit-skills.spec.ts:570 encodes the semantics the docstring left ambiguous.
    severity: minor
  - description: Filed issue 738 blaming ORPHAN_WINDOW_DAYS for the missed orphan without testing that causal claim. It was wrong — the real cause was a suppression bug — needing a public correction.
    solution: "CLAUDE.md's verify-before-asserting rule covers inferred CAUSAL claims, not just quoted facts. A cause is testable: execute the code path before naming it in an issue title."
    severity: moderate
  - description: 'First cross-reference scan matched only "#NNN" and pull/NNN, missing that session-log prs: entries are bare quoted numbers. Reported 4 false unreferenced PRs.'
    solution: "Parse the prs: field structurally against shared/schemas/session.ts rather than regex-scanning the whole YAML as prose — read the schema before scanning for a field."
    severity: moderate
  - description: Ran history archaeology on a shallow clone; git log --grep returned empty for real sessions and merged PRs looked like they had no merge commit.
    solution: CLAUDE.md already says to run git rev-parse --is-shallow-repository as the FIRST step of any history work — I ran it only after a result looked wrong. Follow the rule up front.
    severity: moderate
  - description: Repro script compared bare session ids against parseSessionTrailers output, which keeps the session_ prefix. Printed a false "not suppressed" before the raw list contradicted it.
    solution: When a probe reports the negative you did not expect, distrust the probe before the hypothesis — here an unrelated debug line in the same output already disproved it.
    severity: minor
  - description: search_pull_requests and search_issues blew the token limit three times, each dumping 100-500KB to a file that then needed python slicing.
    solution: These search tools expose no minimal_output despite the server instructions advertising it; default to paging small and parsing the overflow file, or add field-projection support.
    severity: minor
  - description: Two pnpm exec runs failed with ERR_PNPM_RECURSIVE_EXEC_NO_PACKAGE because an earlier cd in the same command left cwd outside the repo; one silently emptied a loop's output.
    solution: "Same footgun CLAUDE.md documents for subagent worktrees, applies to the main session too: prefer absolute-path one-off commands over a standalone cd that later steps inherit."
    severity: minor
  - description: Nearly filed a duplicate of open issue 564 for the audit's headline finding; only the pre-filing tracker search caught it.
    solution: Worked as intended — noting it because the near-miss shows how easily a fresh audit re-reports an already-tracked gap when the tracked issue is weeks old.
    severity: nit
