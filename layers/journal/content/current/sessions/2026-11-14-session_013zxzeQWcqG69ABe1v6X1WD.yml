learnings:
  - "Tinkerfund prod delivery dates are relative offsets (+45d) and QA pins its clock, so visitors read both as stale-date bugs; the campaign tab bar is deliberately anchor links (SectionNav.vue, #1375)."
  - Visitors misreading cm as mm, or a filtered Popular list's count as the shop total, produced false content findings; check units and list scope before marking a bug.
ideas:
  - "[first-time visitor] /t/tinkerfund/prod: only a thin top bar says the shop is a demo; add one line under the hero saying it is a crowdfunding site for inventions nobody needs, so a newcomer reads the deadpan as parody."
  - "[content editor] /t/tinkerfund/prod/how-it-works: generic rules only; add a short 'reading a Campaign page' glossary (FIG. numbers, TF ids, Ending soon, Upcoming) so visitors understand the drawings and badges."
  - "[blind + content editor] /t/tinkerfund/prod: Recently ended cards show only numbers; add each Inventor's last comment or a hall of spectacular failures, since the post-mortem jokes are buried in comments."
  - "[blind] /t/tinkerfund/prod: every card corner reads FIG. 1 with its TF id; show only the TF id on cards and keep FIG numbers for the campaign gallery."
  - "[blind] /t/tinkerfund/prod/deals: site-wide and single-Campaign deals sit in one list; group them as site-wide and single Campaign so visitors see which apply."
  - "[blind] /t/tinkerfund/prod/cart: the empty cart gives no hint how to add; suggest a Campaign next to the Discover link."
  - "[blind] /t/tinkerfund/prod/account: demo purchase has no ending; add a pledge receipt page that jokes about shipping."
  - "[UI tester] /t/tinkerfund/prod/campaigns/*: gallery has no position cue; add an n of 5 counter and swipe on phones."
  - "[content editor] /t/tinkerfund/prod/campaigns/canned-silence: a comment places the library in Aarhus, but the story names Aarhus only for the chamber; name the library's city in the story."
