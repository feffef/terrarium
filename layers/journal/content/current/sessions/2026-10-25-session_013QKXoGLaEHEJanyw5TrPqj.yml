frictions:
  - description: Ran git rev-parse --is-shallow-repository before reading git-conventions.md; a hook flagged it. The call was harmless.
    solution: clear-backlog §1's first command is a git command; it could name git-conventions.md as the read before it.
    severity: nit
  - description: clear-backlog §4 says push each branch from its worktree, while the harness restricts pushes to the session branch. I pushed the worktree HEAD to the session branch instead of its own name.
    solution: clear-backlog §4 could say what to do with a one-branch run in a cloud session that has a designated branch.
    severity: minor
  - description: "run-summary's grouping put #2499 (build) with #2503 (grill) because #2503 listed flatten.ts only as background. Following it would have held up a ready build."
    solution: run-summary.ts could group only issues with the same outcome, or ignore files a grill result lists as background.
    severity: minor
  - description: "merge-pr.ts closed #2504 with state_reason completed although the owner chose not planned; I had to re-close it by hand."
    solution: Close a not-planned issue before merging a PR that names it, or have merge-pr.ts leave a merely related issue alone.
    severity: nit
  - description: "clear-backlog-build returned the #2503 hook branch as failed (its fix round reported done without a passing gate:scoped), leaving six review findings to judge and fix by hand."
    solution: clear-backlog-build could re-run gate:scoped itself after a fix round instead of trusting the agent, so a green branch is never classed failed.
    severity: minor
  - description: The container restarted while the second build ran; the result survived only because the workflow had finished and its output file was intact.
    solution: None needed this time; clear-backlog already says to check the run journal mtime after a restart.
    severity: nit
