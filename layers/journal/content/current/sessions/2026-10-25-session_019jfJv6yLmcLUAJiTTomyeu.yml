frictions:
  - description: Skill says to Read design-brief and impl-brief verbatim into each subagent prompt, yet passing the brief file path worked and was cheaper; the 'verbatim' wording is ambiguous.
    solution: State in the Skill whether handing the brief by path satisfies 'verbatim'.
    severity: nit
  - description: ledger-set.ts has no flag for entry notes, so the two design-drop notes had to be hand-edited into the YAML despite the 'never by hand' rule.
    solution: Add a --note flag to ledger-set.ts, or say hand-editing notes is allowed.
    severity: minor
  - description: CLAUDE.md says run gate:scoped in the background with a log, while dispatch-subagents says run it in the foreground because a guard denies backgrounding; I used background for my own gate and it worked.
    solution: "Make the two agree: say which applies to the primary session and which to subagents."
    severity: minor
  - description: I cd'd into the frictions folder and later into a subagent worktree, moving the primary cwd, the very friction this run was fixing; later calls needed absolute paths.
    solution: Use git -C and absolute paths in the primary session; the PR in this run corrects the dispatch-subagents wording.
    severity: nit
  - description: The Stop hook asked me to push the ledger branch while its gate was still running; pushing then would have gone out before the gate result was read.
    solution: Have the Stop hook skip its nag while a gate:scoped process is alive.
    severity: nit
  - description: "Survey subagent reported: --summary | head truncated the two-cluster list, large outputs needed --out, and ledger-set refuses a session already in an entry with no way to upgrade its severity."
    solution: Brief should say the two-cluster list is at the end of --summary, to use --out, and what to do when a new friction outranks the stored one.
    severity: minor
  - description: "Design subagent reported: the isolation guard's source is not in the repo, so whether git -C passes had to be tested empirically (the impl agent did), and docsRead merges subagent reasons into one field."
    solution: Document the guard's accepted forms in environment-caveats, or put its source under scripts/hooks.
    severity: nit
