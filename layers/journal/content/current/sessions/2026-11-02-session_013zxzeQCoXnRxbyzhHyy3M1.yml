frictions:
  - description: Ran git log on README.md and git fetch to judge staleness before reading docs/agents/git-conventions.md, breaking CLAUDE.md's first-git-command rule
    solution: Low impact here; a PreToolUse hint on the first log/fetch would catch it before the call rather than after
    severity: minor
  - description: My first README told readers that asking an agent in the clone needs no install, though the SessionStart hook runs pnpm install and guards need node_modules; the owner and a second review caught the gaps
    solution: Before telling readers what a local session needs, read .claude/settings.json hooks, not just package.json
    severity: moderate
  - description: I kept the Contributing list from the old README without asking whether an outsider could act on it; the owner had to point out it was arbitrary
    solution: "Apply CLAUDE.md 'question the premise' to inherited sections too: give each link a reason for the stated audience"
    severity: minor
  - description: Re-authored the log as completed after the merge without re-invoking close-session; log-session refused it and the sed-edited scratch silently kept in-review until I checked
    solution: After a merge, invoke close-session first as its Skill says, then author
    severity: nit
