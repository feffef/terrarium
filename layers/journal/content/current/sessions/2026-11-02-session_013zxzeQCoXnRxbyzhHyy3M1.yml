outcome: "Merged PRs 2795 and 2797: README links the live-site intro pages, local options and real contribution paths"
summary: "The owner asked me to check the stale README and propose which live-site pages best introduce Terrarium. After I asked four questions, the owner set the shape (readers and contributors, a clone-and-run quickstart that suggests asking an agent, keep the Blog link, no deep links into Lessons), and PR 2795 merged. The owner then pointed out two flaws: the local section read as if you needed pnpm dev to ask an agent, and the Contributing links were arbitrary. I proposed two real contribution paths and two small cuts; the owner approved them and asked to keep the guest pipeline vague. Human-instructed: the whole rewrite, the either-or local options, the Contributing redesign, both cuts. Agent-initiated: cutting the duplicated idea/status prose, the ADR-0018 wording fix, pointing facts at their homes, and, after the second code-review, putting pnpm install before both options (the SessionStart hook and guards need node_modules) and replacing \"a maintainer decides\" (false under ADR-0023). I kept the deploy-link cut over the reviewer's suggestion because the owner approved it."
