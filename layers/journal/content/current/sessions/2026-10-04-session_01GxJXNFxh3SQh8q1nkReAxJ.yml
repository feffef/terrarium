frictions:
  - description: Harness attribution reminder told me to hand-write the Co-Authored-By and Claude-Session commit trailer; the commit-trailer guard then denied the commit and the whole chained call.
    solution: "Single-home the rule: the harness reminder and the repo guard contradict. Repo guard should win, so the reminder wording for this repo should say the trailer is landed automatically."
    severity: minor
  - description: First create_pull_request call was denied by the provenance guard because the session marker needs a specific shape and position; I only learned the shape from the denial.
    solution: Put the exact first-line marker shape (robot emoji, bracketed label, session URL) in CLAUDE.md or the PR workflow doc, not only in the deny message.
    severity: nit
  - description: Three of five second-pass subagent reports were not extractable from their output files, so I retyped 85 per-post labels by hand into a script; a transcription slip would silently mis-tag posts.
    solution: Have classification subagents write their JSON lines to a scratchpad file (or return them in the final assistant message) so results can be parsed instead of retyped.
    severity: moderate
  - description: Built a regex keyword classifier first; hit counts overlapped between hand-labelled positive and negative posts, so it was unusable and cost a step before switching to full reads.
    solution: For topic tagging of prose, go straight to read-based classification; use keywords only as a cross-check.
    severity: nit
  - description: layers/blog/CONTEXT.md described innovation and slop as an outcome-quality axis, which my early analysis (treating slop as a topic) missed until I read the glossary at implementation time.
    solution: Read the Tag glossary term before proposing vocabulary changes, not only when applying them.
    severity: nit
  - description: The Stop hook demanded commit and push while the background gate was still running, which pushes toward committing before verification.
    solution: Have the stop hook skip or defer while a gate:scoped run for the same tree is in progress.
    severity: nit
