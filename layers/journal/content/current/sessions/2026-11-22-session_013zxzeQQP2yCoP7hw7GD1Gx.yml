frictions:
  - description: Read docs/agents/triage-labels.md only after filing three issues, when the post-write hint named it; CLAUDE.md requires it before filing.
    solution: List triage-labels.md beside issue-tracker.md in the Skill's issue step so one read covers both.
    severity: nit
  - description: Edited ledger entries with ledger-set.ts before reading layers/journal/GLOSSARY.md; the tenant-glossary rule only loaded on the later read.
    solution: Let the frictions-to-fixes Skill name the Journal glossary, or load the rule on ledger scripts.
    severity: nit
  - description: Subagent brief hit the dispatch-read guard because it named the scratch placeholder literally; reworded and retried.
    solution: Fill the placeholder into a copy of the brief file, as done after the first denial.
    severity: nit
  - description: A Bash call with run_in_background and a trailing & was blocked by the double-background guard; resent plainly.
    solution: None needed; the guard worked as designed.
    severity: nit
  - description: pr-workflow's simple-change test sends a 400-line ledger-data PR to code-review (two subagents) though it is only machine-edited YAML; reviewers found two small cause and ref wording issues.
    solution: Let a ledger-only PR whose gate passed take an own read, or state this case in the simple-change test.
    severity: minor
  - description: Survey brief says --unledgered drops Frictions the ledger carries, but after append with --skip-held sessions still list others; the survey agent found out by rerunning (its own report).
    solution: Say in survey-brief step 1 that the output keeps Frictions whose session already sits in the entry.
    severity: minor
  - description: Design brief runs steps 1-5 for every pick, but a no-change pick has no design to write; the design agent wrote None (its own report).
    solution: Let section 5 say a no-change pick skips the design and reports only the reason.
    severity: nit
  - description: Stop hook demanded close-session after the first merge while the closing ledger PR still waited on its gate, so I had to log mid-flow.
    solution: Nothing to change; re-invocation is safe and this log is replaced at the end.
    severity: nit
