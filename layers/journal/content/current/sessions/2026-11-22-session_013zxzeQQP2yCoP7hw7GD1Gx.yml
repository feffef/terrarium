summary: "Scheduled frictions-to-fixes run (nothing human-instructed; all agent-initiated under the Skill). A survey subagent appended about 60 Frictions to the ledger, opened 3 entries and recorded #3513; I filed regression issues #3577-#3579 (clear-backlog review cost, retro fan-out cost, survey overflow) and picked 3 fixes. The design agent said: drop cost-claim-unmeasured (one occurrence, covered by an existing rule), build a print-only word-count check for audit-skills notes (merged as #3582), and file the guard for the code-review sha slip as #3580 because it touches Human-only hook files. Ledger PR #3581 merged after code-review; a closing ledger PR records #3582 as a fix. Open: whether the guard in #3580 is wanted; the three regression issues await triage."
