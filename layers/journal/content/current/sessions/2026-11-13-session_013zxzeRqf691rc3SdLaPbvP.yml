frictions:
  - description: Skipped dispatch-subagents section 3's save-handback.ts for all 18 subagent replies; I worked from the hand-back messages in context.
    solution: audit-skills step 2 could say whether the replies need saving, or the hand-back message could be saved by the harness.
    severity: nit
  - description: Checker subagents cited commit hashes I could not resolve (42d8d760b, 28cfa01); git log -1 with an unknown hash printed the branch tip, which looked like a match at first.
    solution: Verify a cited hash with git cat-file -e before reading its date; brief.md could ask checkers to cite full hashes.
    severity: nit
  - description: The dispatch-subagents checker used git worktree list in this container as evidence that other sessions' worktrees were not stranded; I dropped that claim.
    solution: brief.md could say another session's worktrees are not visible from this checkout.
    severity: nit
  - description: Step 4 gives no rule for a repeat whose earlier issue is closed (3043, 2987); I filed new issues that point to the closed ones.
    solution: "audit-skills step 4: say that a repeat after a closed fix gets a new issue naming the old one."
    severity: minor
  - description: The clear-backlog stranded-worktree friction is hook-written at every close-session call, so a log cannot show whether the final close was clean.
    solution: Have the stranding check record the time or the close count, or write the friction only at the final close.
    severity: minor
