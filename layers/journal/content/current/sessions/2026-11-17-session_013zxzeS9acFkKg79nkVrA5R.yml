  - description: Called the clear-backlog-explore Workflow before reading dispatch-subagents; the dispatch-read guard denied the call, costing one retry.
    solution: Read dispatch-subagents at the start of any run that dispatches agents; the clear-backlog Skill could name it in section 1.
    severity: nit
  - description: The SubagentStart rule-use echo ritual ran twice per agent and read-only reviewers had no rule to rate; 15 of 17 retro answers named it.
    solution: Ask once at the end, or skip it for read-only reviewer subagents, in the hook that emits it under scripts/hooks.
    severity: minor
  - description: PostToolUse read-first hints (git-conventions, ADRs) reached all 5 builders after the action they govern, so the reads changed nothing.
    solution: Fire the hint before the action, or drop it for subagents whose brief names the files, in the read-hint hook under scripts/hooks.
    severity: minor
