    solution: Note in verifying-ui-changes.md that scratch probes must import playwright-core by absolute repo path or live under the repo
    severity: nit
  - description: One probe run reported 0 rendered width for all desktop diagrams; a re-run showed correct widths, so a measurement can silently read before layout settles
    solution: Wait for networkidle or the diagram's layout before measuring
