outcome: CLAUDE.md cut from 374 to 146 lines; PR 1658 merged after two Sonnet probes and two review rounds
summary: "Human-instructed throughout: the owner invoked /prune-trial with an explicit ask to rewrite CLAUDE.md to the bare minimum, trace each rule's origin with git log/blame, drop rules whose origin wasn't major or critical, and use pointers wisely. The owner made every structural call in-session: keep the three open-trial bullets verbatim, keep WHY-not-WHAT and Read-not-cat, a minimal layout, drop issue/PR numbers, drop the Skill Inventory pointer, turn the docs index into mandatory \"before you X, read Y\" triggers, move the ADR rule from session start to a planning trigger, restore the pack-Skill rule, and remove vague wording everywhere. Agent-initiated parts: the rule-origin trace (subagent, 54 rules graded), the ADR-reading survey (36 large human-prompted sessions, median 2 of 28 ADRs read), the Skill Inventory usage check (only audit-skills sweeps read it), judging the workflow-file trial (holds), the Sonnet probes, and proposing fixes from two /code-review rounds that the owner ran and approved. Two surprises: \"read all ADRs\" was almost never followed, while grepping docs/adr by file path reliably finds the binding ADRs; and the Skill Inventory pointer was dead weight. The owner merged PR 1658 after CI went green; the new trial's verdict is due three days after landing."
