frictions:
  - description: Ran git log and GitHub reads before reading git-conventions.md and github-integration.md; the hooks reminded me and the calls were fine.
    solution: Read both docs first, or accept the read-only exemption the hook already knows.
    severity: nit
  - description: Wrote 14 Journal Inventory notes and summaries without reading layers/journal/GLOSSARY.md, which the tenant-glossary rule asks for.
    solution: "Name the Journal glossary in audit-skills step 5 (issue #3705 covers the late-rule problem)."
    severity: minor
  - description: Copied a harvest commit sha (2dc4441d7) from a subagent report into a note without checking it; the Spec reviewer found it wrong and I had to fix and re-gate.
    solution: Check each commit id a subagent cites against git before writing it into a note.
    severity: minor
  - description: First code-review call omitted the head sha and the guard blocked it; I reran verdict-line --review-call and pasted its args.
    solution: Paste the review-call args whole the first time.
    severity: nit
  - description: Wrapped the notes with textwrap, which split hyphenated words at line ends and failed validate:content; had to rejoin the lines.
    solution: An append-observation script (idea below) would wrap without breaking words.
    severity: nit
  - description: Filed issues and read triage-labels.md only after the first issue_write; a foreground sleep was also blocked.
    solution: Read triage-labels.md before filing; use Monitor, not sleep, to wait.
    severity: nit
