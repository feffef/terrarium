frictions:
  - description: /security-review's embedded `git diff origin/HEAD...` failed because origin/HEAD is unset in this clone, so the skill had no diff scope.
    solution: Fall back to origin/main when origin/HEAD is missing, or have the SessionStart setup run `git remote set-head origin -a`.
    severity: minor
  - description: First-pass SVG safety check was a regex denylist that entity-encoded attributes bypassed; only the Spec code-review caught it, costing a second agent round.
    solution: Brief security fixes to prefer allowlists and to include adversarial bypass tests (entities, escapes) up front.
    severity: moderate
  - description: "Harness system prompt says never open a PR unless asked; CLAUDE.md/ADR-0003 says auto-open. Followed the repo rule and opened PR #1443."
    solution: Known tension documented in CLAUDE.md (#592); no change needed, noted for the record.
    severity: nit
  - description: An impl agent saw skill-inline-guard and workflow-edit-guard specs fail under parallel load, then pass on rerun — likely a fixed /tmp path shared across agents.
    solution: Give those specs a per-run temp dir (mkdtemp) instead of a fixed /tmp path.
    severity: minor
  - description: verify:mermaid, now a security check, still isn't run by CI's gate.yml, so the mermaid SVG scan is local-only until proposal 879 is applied.
    solution: Human applies docs/proposals/879-gate-yml-thin-shell.md.
    severity: moderate
  - description: "Human said Merge; merge-pr.ts was denied by the auto-mode Self-Approval classifier, so the human had to merge PR #1443 by hand."
    solution: pr-workflow.md could note that a human-asked merge of an agent-opened PR may still be classifier-blocked; offer the UI merge up front.
    severity: minor
