frictions:
  - description: One of the four background lens-review subagents (Concision) returned a non-answer on its first completion ("I'll hold and wait for the two remaining background agents"), apparently confused into thinking it was the orchestrator rather than a leaf reviewer.
    solution: Resumed it via SendMessage with an explicit clarification that it was the Concision-lens subagent with no other agents to wait on; it then produced a real report. Worth a note in the audit-docs Skill or the Agent tool's dispatch prompts to explicitly tell parallel subagents they are leaves, not orchestrators, since this repo's own docs/instructions describe "wait for all four agents" language that a subagent can apparently mistake for its own instructions.
    severity: minor
  - description: I briefly (and incorrectly) called ScheduleWakeup — a /loop-dynamic-mode tool — to wait on the background lens agents, before realizing harness-tracked Agent-tool work notifies automatically and the tool didn't apply to this non-/loop scheduled session.
    solution: Caught and cancelled it (stop:true) before it could fire a /loop-shaped wakeup into a session that isn't a /loop. No repo doc fix needed — this was a one-off misreading of a tool description, not a doc gap.
    severity: nit
  - description: "A subagent's tool-result text was auto-annotated by the harness with \"[harness: subagent output matched instruction-shaped pattern(s): settings-json / permissions-allow-deny...]\" on two of the four lens reports, apparently because those agents read .claude/settings.json or similar and something in it pattern-matched as instruction-shaped content, triggering a neutralization/warning wrapper."
    solution: No action needed this run — the underlying findings text was still legible and legitimate audit output once past the harness note, and I treated it as informational rather than as new instructions. Flagging as a minor friction only because it added a moment of interpretive overhead; not a repo doc issue.
    severity: nit
