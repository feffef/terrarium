frictions:
  - description: Read docs/agents/github-integration.md only after the first mcp__github__list_issues call, against CLAUDE.md's read-first trigger
    solution: Read it before the first GitHub call; the hook's late reminder was right and the call was already correct
    severity: nit
  - description: First Bash call cat'ed grades.yml and the 190 KB runs.yml with the Skill files, overflowing to a saved output and needing re-reads
    solution: Check file sizes with wc first and extract YAML metrics by script, as I did later
    severity: minor
  - description: Ran git log before reading docs/agents/git-conventions.md; harmless as it was read-only, but CLAUDE.md lists log used to draw a conclusion as a trigger
    solution: Read git-conventions.md before the first git log used for findings
    severity: nit
  - description: History subagent marked the 8-item cap as possibly agent-built; the QWJE session log shows the owner chose it, so I had to verify and correct it
    solution: Briefs for history research should name session logs as a source for owner decisions, not only issues and PRs
    severity: minor
  - description: My spec claimed update's deep check would cost about $1-2 a day without checking how many pages update flags daily (14-32); the fable review caught it
    solution: Check an estimate's input counts (here update PR bodies) before stating it in a spec
    severity: minor
  - description: The spec put a workshop link in the guide overview without checking page-checks.ts, which forbids guide links outside the guide; caught only by review
    solution: Grep the page checks for link rules before specifying a new link on a Glass Box page
    severity: minor
  - description: Edited glassbox-curate and glassbox-update SKILL.md before reading ADR-0005 and ADR-0027 in full; the hook flagged it and the edits were already right
    solution: Read the ADRs a Skill's rules name before the first edit to a SKILL.md
    severity: nit
  - description: Added an 'in its own worktree' clause that dispatch-subagents already states, so code-review flagged it and a second commit and gate run were needed
    solution: Before adding a clause to a Skill, grep the Skills it relies on for the same fact
    severity: minor
  - description: Started gate:scoped in parallel with the code-review subagents, then committed their fixes, so the gate aborted and had to run twice more
    solution: Run the gate only after review fixes are committed; reviews and the gate are not parallel work
    severity: minor
  - description: Filtered the 'so'-clause page-check warnings out of the orientation script without being asked, against the owner's 'dump everything, trim later'; the Spec review caught it
    solution: Implement exactly the asked scope; propose an extra filter instead of building it
    severity: minor
  - description: First drafts of the memory page went long and mixed levels; the owner needed three review rounds (retired concepts, derivable facts, plain language) to reach the shape they wanted
    solution: Before drafting a page an agent will read every run, agree its sections and tone with the owner on a short sample
    severity: moderate
