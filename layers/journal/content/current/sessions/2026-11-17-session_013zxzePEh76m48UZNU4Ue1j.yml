summary: "Scheduled /prune-trial run; nothing human-instructed. Two of four open trials were judgeable. The checkout-moving trial held (worktree-subagent-moves-branch 1.5% to 0.0%, no issue). The read-first-lines trial showed dispatch-read-guard-deny doubling (22.1% to 44.1%, 15/34) with only nit or minor Frictions, so the cut stayed and I filed #3425 for a person to decide. A search subagent ranked failed prose; I chose glassbox-curate's 'Know the guide before you change it' paragraph (13 recorded skips, nothing wired holds it), cut 270 words to about 85 keeping every rule, and left the read-first list alone since an open trial covers it. A Sonnet probe pinned to the commit answered correctly, code-review found no hard violations, gate:scoped passed, PR #3426 opened, CI green, merged by me with a posted verdict."
