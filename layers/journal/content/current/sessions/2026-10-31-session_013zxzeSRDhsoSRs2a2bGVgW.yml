frictions:
  - description: First draft repeated session-logged claims (unchecked boxes on blog posts, a blog post resting on a misread, "blind visitors") without checking diffs; fact-check and review found four wrong or jargon claims.
    solution: Make digest.ts gather print each PR's touched files and have the brief say session outcomes are candidates, not facts.
    severity: minor
  - description: A chained Python edit failed on an assertion but the following git add and commit still ran, committing the unedited Digest; I amended afterward.
    solution: Never put a commit after a step that can fail in the same call; check exit status first, as git-conventions already says.
    severity: nit
  - description: The Stop hook asked to push five times while the fact-check, review and gate were pending, each costing a turn.
    solution: The hook should stay quiet while a branch has a pending ADR-0004 review.
    severity: nit
  - description: Ran the scoped gate before the review and again after review edits, doubling gate time.
    solution: Review first, then run the gate once, as pr-workflow says; I ran it early out of habit.
    severity: nit
