frictions:
  - description: Ran git fetch before reading git-conventions.md; the hook flagged it after the call and CLAUDE.md says to read it before the first non-read-only git command.
    solution: Read the named docs in the first batch of tool calls once CLAUDE.md's trigger applies.
    severity: nit
  - description: A gh api search call used a since filter and --paginate and the proxy answered 403 for numeric repo paths, so the listing had to be redone with other calls.
    solution: Say in github-integration.md that a paginated gh api issues call can 403 through the proxy and list_issues with since is the way.
    severity: nit
  - description: Edited rules() with unescaped backticks inside the workflow's template literal, which broke the whole script until tests failed with a syntax error.
    solution: The workflow-scripts spec caught it; a one-line note at the top of rules() that its text sits in a template literal would have spared the slip.
    severity: nit
  - description: The system prompt says commit and push only when asked while CLAUDE.md says push early and often, so I left edits uncommitted until the Stop hook demanded a commit.
    solution: State once in CLAUDE.md that a Stop-hook request to commit and push is enough, or drop the conflicting system line.
    severity: nit
