goal: Cut the cost and friction of the clear-backlog Skill using its run reports
status: completed
outcome: Rule-use note reworded and five Skill, workflow and script changes built, reviewed and gated; PR 3196 merged by the owner
summary: "Human-instructed: the owner asked me to read the standing clear-backlog report issue (#3143) and its related issues and PRs, then to compare the frictions in the three runs' session logs with the reports' candidates. They said the rule-use calls are worth their cost and asked for a wording change (the note now says the data is essential to analyse whether the rules help), then asked for proposals to cut cost without dropping essential reviews, then agreed to all five (P1 to P5) and I built them. Agent-initiated: the 50-line bar for a missing-test, the single `Both` reviewer for `small` branches and its escalation path, the NO WRITES flag, the commit and push after the Stop hook asked, running code-review with two subagents and fixing four of their findings, and opening PR 3196 and subscribing to it (ADR-0003). What the analysis found: most logged frictions already sit in a report candidate; the new information was the resume-while-run-live hazard, the dispatch-subagents guard hitting all three orchestrators, and leftover worktrees at close. The rule-use note gave agents no purpose, so I could not tell whether the complaints came from cost or from missing context; the owner's closing comment on #3147 said the same. Landed: the owner enabled auto-merge and merged PR 3196 after CI's gate went green. Open: the 50-line bar is a guess from the reports and token savings are not measured; I posted a note on issue 3143 saying reports after the merge ran the updated Skill."
