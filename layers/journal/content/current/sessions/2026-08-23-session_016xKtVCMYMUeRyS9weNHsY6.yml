learnings:
  - A trial protocol can detect damage from a removed rule but never from a removed capability — nothing fails when a Skill stops running, so silence reads as success.
ideas:
  - "A PreToolUse or CI check that flags a PR re-adding prose on a topic with an open entry in .agents/prune-trials.yml. The CLAUDE.md note asking sessions not to re-legislate a pruned topic is itself prose, in a repo whose own regression issues (#772, #1018) show prose rules of exactly that shape don't hold — so the coordination rule that makes trials work is the least defended part of the design."
