frictions:
  - description: Chartered the Skill to prune "ADR prose" without excluding an ADR's Decision and Consequences, which ADR-0018 forbids rewriting in place.
    solution: Bounded the grant to explanatory prose in all four places it appears and gave ADR-0018 the amendment banner its own convention requires. Found only by the second adversarial audit — the first pass missed it entirely.
    severity: major
  - description: Taught audit-docs to respect an open trial but left frictions-to-fixes, the likelier offender, with no such screen.
    solution: Added the same drop rule to its §2 screen. When wiring a new mechanism into a Skill ecosystem, enumerate every Skill that edits the same surface rather than patching the one that comes to mind first.
    severity: moderate
  - description: Wrote "REGRESSION issues" into the Skill as though it named a real label; the repo defines five triage labels and none is that.
    solution: Named the actual mechanism. A Sonnet run would have found nothing and silently skipped the Skill's highest-priority targeting rule on every run.
    severity: moderate
  - description: Subagent report asserted a 24-of-30-PRs prose-only tally from PR titles alone and flagged it as heuristic; I could not cite it as fact.
    solution: Verified the parallel claim I did cite (40/41 autonomous session logs, exact 8-way trigger split) locally with grep before putting it in a committed ADR.
    severity: nit
  - description: The window constant "three days" wanted to live in the ADR, the ledger header and the glossary term at once — a single-home violation in a doc about bloat.
    solution: Kept it in ADR-0027 and the ledger's own header; the glossary term says "a fixed window" and points at the ADR.
    severity: nit
  - description: Gate ran full heavy layers (~6 min) because two of eight changed paths were .yml; the six markdown files were inert.
    solution: Expected behaviour of the fail-safe classifier, not a defect — noting it only because prose-authoring sessions will keep paying it whenever a Skill ships an Inventory entry alongside its docs.
    severity: nit
