summary: "Scheduled frictions-to-fixes run, no human prompt (agent-initiated throughout, per the Skill). A survey subagent filed 61 occurrences from 29 sessions (3 new entries, fixes #3532 and #3537 recorded). Screening found one regression with moderate severity since its fix (harvest-first-pass-shallow), filed as issue #3543. Of the never-fixed candidates, a design subagent recommended: one dispatch (tdd seam confirmation clashing with builders), one dispatch (audit-docs reviewer brief), one no change (blog-post fan-out entry was really an audit-skills run, so its text was corrected). I dropped the audit-docs one (design working as intended, one outlier run) and dispatched only the tdd fix to a Sonnet builder; its PR #3544 changes a workflow prompt no test observes, so I escalated it for a human merge, with its own fixes ledger entry added; a human merged it. The ledger PR #3545 merged after a full code-review, because a many-file data PR fails the simple-change test. A closing ledger PR #3546 set the entry back to open."
