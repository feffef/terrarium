frictions:
  - description: Ran git commands, then GitHub calls and filed an issue, before reading git-conventions.md, github-integration.md and triage-labels.md; hooks named each doc afterwards.
    solution: Read the three docs at run start; the Skill could list them as reads for this run.
    severity: nit
  - description: Typed a session id from memory in the regression issue body; the provenance guard blocked it and I retried with the real id.
    solution: Copy the id from the system prompt's trailer template before writing any body.
    severity: nit
  - description: First survey dispatch was blocked by the dispatch-read guard because my brief named the scratch placeholder in prose, costing one retry.
    solution: The Skill's brief says to fill placeholders; reword the dispatch instruction to name the directory rather than the placeholder.
    severity: nit
  - description: The ledger PR, 61 machine-written occurrences, failed the simple-change test, so merge-pr refused my own-read verdict and I ran a full two-agent code-review that found only judgement calls.
    solution: Skill step 5.4 says review the ledger PR by the simple-change test; say what a data-only ledger PR needs instead (its content spec and gate).
    severity: minor
  - description: The design agent's pick 1 showed the survey ledger entry named the wrong Skill (audit-skills, not blog-post); the survey had flagged it unverified and the brief has no step for a mislabelled entry.
    solution: "Survey brief: when a Friction's named home cannot be found in source, check the session's trigger before opening an entry."
    severity: minor
  - description: Review of a one-line workflow prompt edit still cost two review subagents (about 150k tokens) because ADR-0004 does not count a .claude/workflows file as a simple change.
    solution: Known followup-review-overcost; no change proposed here.
    severity: nit
