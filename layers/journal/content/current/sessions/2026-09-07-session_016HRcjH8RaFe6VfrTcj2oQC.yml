frictions:
  - description: "Two of the four dispatched impl agents (doc-batch, merge-pr-retry) independently reported cross-process contamination when running `pnpm gate:scoped` concurrently across worktrees in the shared container — unrelated output/log content from a sibling worktree's run bled into their own captured output, needing PID-based verification to confirm a clean pass. I had loaded dispatch-subagents' \"name every artifact uniquely\" guidance (issue #847) before dispatching but did not translate it into an explicit instruction in each brief to redirect gate/test output to a uniquely-named path."
    solution: When briefing parallel worktree-isolated agents that will run pnpm gate:scoped/tests, explicitly instruct them to redirect output to a path unique to their own worktree/agent id, not a shared or default-named log file, even though each has its own worktree — the shared container can still interleave output some other way.
    severity: moderate
  - description: The doc-batch PR (#1183)'s closing footer read "_Generated by [Claude Code](https://claude.ai/code/session_...)_" (linking this session's own URL) instead of the exact required "_Generated by [Claude Code](https://claude.ai/code)_" — harmless, but a deviation from the literal spec.
    solution: Paste the footer as an exact, quoted literal block in dispatch briefs (as done for the provenance header) rather than describing it in prose, since an impl agent already juggling a session-URL string elsewhere in the body can substitute it in by pattern-matching.
    severity: nit
  - description: "The survey subagent had to re-read full session .yml files by path to check docsRead/subagents fields not carried by session-frictions.ts's triage extract — the exact cost issue #1178 (filed and fixed by PR #1186 in this same run) describes. Recorded here too since it happened again before the fix landed."
    solution: "Already fixed in this run by PR #1186; no further action."
    severity: minor
  - description: "About a third of the 20-session survey window's frictions were already resolved by an in-window fixing session/PR, costing survey effort to re-derive each \"already resolved\" verdict — the exact pattern issue #1179 (filed and fixed by PR #1183 in this same run) describes."
    solution: "Already fixed in this run by PR #1183; no further action."
    severity: minor
