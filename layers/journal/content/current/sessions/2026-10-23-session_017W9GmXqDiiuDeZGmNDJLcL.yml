frictions:
  - description: "Did not invoke the adr-check Skill before recommending fixes/wording and a label change in GitHub comments on #2370, #2105 and #2286 - the same scheduled-sweep adr-check silent-skip pattern this run's own adr-check behaviour check found and escalated (as a 5th instance) for 5 other sessions."
    solution: Scheduled Skill runs that end up making small judgment calls (a proposed fix framing, a label) should treat that as recommending a change and run adr-check, or CLAUDE.md's trigger should name an explicit exemption for judgment calls a Skill's own numbered steps already walk through.
    severity: minor
  - description: Assumed the scorecard JSON's behaviourChecks field was a list of per-Skill detail objects; it's actually a flat list of Skill-name strings, found only after an AttributeError when iterating it as objects.
    solution: Print or grep one sample entry's type/shape before writing a parsing loop against an unfamiliar script's JSON output.
    severity: nit
  - description: Ignored repeated harness reminders to use TaskCreate/TaskUpdate for progress tracking across this long multi-step run, using a plain scratchpad markdown file instead; worked fine but didn't surface interim progress in the task list.
    solution: For a long scheduled run with many parallel subagents, use TaskCreate/TaskUpdate so progress is visible outside the transcript too.
    severity: nit
