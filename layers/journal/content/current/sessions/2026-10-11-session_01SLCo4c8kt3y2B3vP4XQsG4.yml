  - description: Broke CLAUDE.md "find the ADRs that bind it with grep -l … docs/adr/* and read them" before recommending options; read no full ADR (e.g. ADR-0009, ADR-0029).
    solution: The rule summaries sufficed for a display-only change, but the grep step is cheap; do it before the AskUserQuestion recommendations.
    severity: minor
  - description: Broke CLAUDE.md "Read files with the Read tool, not cat" — read CONTEXT-MAP.md and session logs via chained cat/head/grep.
    solution: Use Read for instruction docs; the chained read loads no rule and may be uncredited.
    severity: nit
  - description: Broke CLAUDE.md "never chain a kill with && or ;" — ran preview.ts stop followed by ; rm of the verify script.
    solution: Run the stop as its own command; no harm here because both commands ran.
    severity: nit
