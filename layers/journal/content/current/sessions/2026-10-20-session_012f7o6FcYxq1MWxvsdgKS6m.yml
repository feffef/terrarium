frictions:
  - description: Recommended changes in the grilling rounds without invoking the adr-check Skill, which CLAUDE.md requires before any recommendation.
    solution: clear-backlog §2 could name adr-check before the main session revises a triage agent's pick; the triage agents had run it, so the gap was only in my revisions.
    severity: minor
  - description: "First-round picks relayed the triage agents' claims (e.g. #2310 all trailing ampersand, #2312 one repo-caused case) that a session check then overturned on all three issues."
    solution: clear-backlog §2 could have the main session check a regression issue's cited sessions with inspect-session before grilling, not only on owner request.
    severity: moderate
  - description: "After the workflow's review I hand-edited wording on both branches and pushed after re-running gate:scoped but without a fresh code-review of those edits, the very edge #2311 reports."
    solution: "Under #2319 these prose-only edits need no review; until it merges, the pre-merge verdict must review the final head."
    severity: nit
  - description: The session branch was checked out in the main checkout, so the build workflow's worktree could not use it; I detached the main checkout's HEAD to free it.
    solution: clear-backlog §3 could say to detach or switch the main checkout when a planned branch is the session's own branch.
    severity: nit
  - description: Subagents reported the read-first hint for github-integration.md kept firing after they had read it with cat (hint counts only Read-tool reads).
    solution: Let the read-first hint count shell reads the trace already detects.
    severity: nit
