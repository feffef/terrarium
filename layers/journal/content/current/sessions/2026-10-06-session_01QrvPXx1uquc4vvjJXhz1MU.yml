summary: "Part 1 (human-asked): which packages the Dependabot alerts need upgraded. pnpm audit stood in for the unreachable alert list. A screenshot from the human showed only braces #54 and node-forge #53 open, and neither has a patched release. The human chose to leave both open. Part 2 (human-asked, with choices made via AskUserQuestion: minor+patch, npm+github-actions, weekly grouped, merge on gate success): added .github/dependabot.yml with a 3-day cooldown and grouped minor/patch, plus an ADR-0003 auto-merge ledger row scoped to Dependabot npm minor/patch PRs that touch only package.json/pnpm-lock.yaml. The merging workflow (workflow_run on safety-gate, checking author, commits, files and the update-type commit metadata, then merging the exact head SHA) went to docs/proposals/1633 because agents can't push workflows. I chose workflow_run because main has no branch protection, so native auto-merge can't wait for the gate. The PR is human-merged (governance + CI). The workflow is untested until a human applies it."
