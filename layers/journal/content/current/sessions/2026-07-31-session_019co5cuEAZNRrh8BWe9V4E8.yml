frictions:
  - description: "Invented a `**Session:** <url>` provenance header for PR #788 instead of reading provenance.md's documented `🤖 [model](url)` format first."
    solution: CLAUDE.md already says read provenance.md before writing either marker by hand; the miss was skipping that step, not missing guidance. The guard is format-agnostic (URL present and matching), so nothing flagged it — only a human question did. Fifth recurrence of the class provenance.md tracks.
    severity: moderate
  - description: Extraction added pointers to the new Skill but left the restated prose in frictions-to-fixes §5 — duplication doubled instead of removed.
    solution: Treat "delete the restatement" as part of the extraction, not a follow-up; the code-review Standards axis caught both instances before merge.
    severity: minor
  - description: 'Nearly shipped "Closes #766 group A only" in the PR body; GitHub parses the keyword and would have closed an issue with five groups left.'
    solution: 'Never put a close keyword plus a scoping qualifier in one phrase — say "Part of #766" and put the scope in its own section.'
    severity: minor
  - description: Spec review agent asserted the implement-reachability requirement was unmet, using a definition of "reachable" that contradicts writing-great-skills.
    solution: Verified against the primary source and rejected the finding; cross-skill reach IS model-invocation in this repo's vocabulary.
    severity: minor
  - description: Every new Skill needs an inventory .yml under layers/, so the full gate runs (~5 min) even for an otherwise prose-only change — twice here.
    solution: Working as designed rather than a bug (content changes affect the build), but worth knowing that no new-Skill PR can ever hit the inert skip path.
    severity: nit
