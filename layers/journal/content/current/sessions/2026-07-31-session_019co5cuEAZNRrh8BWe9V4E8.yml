learnings:
  - The github-provenance-guard is deliberately format-agnostic — it blocks a missing or mismatched session URL, never a wrongly-formatted header — so a self-invented marker shape passes every mechanical check and only a reader catches it.
  - gate.ts's inert rule covers .agents/skills/**/SKILL.md via its generic non-layers `.md` clause, not via the `.claude/skills/` prefix clause — the symlink mirror is only what makes non-.md skill assets inert.
  - writing-great-skills defines cross-skill reach as exactly what model-invocation provides, which settles 'reachable by X' requirements without needing a pointer inside X.
ideas:
  - "Issue #766's own finding — that skill descriptions live in the durable system prompt while CLAUDE.md rides in a summarizable message — is now testable against this PR: `dispatch-subagents` is the first must-not-miss rule set to move from CLAUDE.md prose into a Skill. Mine the next ~40 session logs for dispatch frictions (stale worktree HEAD, uncommitted-on-abort, missing `cd &&`) and compare their rate to the pre-move window. If the rate drops, group B's revised ranking is evidenced and the remaining Bash/process footguns should follow the same path; if it doesn't, the asymmetry argument is dead and B stays inline or gets mechanized as a hook."
