frictions:
  - description: Bare cd in compound Bash calls moved the primary working directory twice, so later calls needed absolute paths.
    solution: Use absolute paths and git -C instead of cd.
    severity: nit
  - description: Ran git branch --show-current alongside git status before reading git-conventions.md; the hook flagged the late read.
    solution: Read git-conventions.md before any git command beyond a bare status.
    severity: nit
  - description: Skill says file regression issues for the top three by severity, but the top two were an owner-decided entry and a stale-session false alarm; I had to deviate and pick by recurrence.
    solution: Say in §2 to skip entries whose issue the owner closed not planned or whose fix is recorded as holding, and how to break minor-severity ties.
    severity: minor
  - description: "Survey agent hit unlisted traps: --summary and --candidates print 34KB and 20KB to stdout, --append is all-or-nothing on a duplicate session, and closed issues came via gh api page=N."
    solution: Name --out for the summary scripts, say --append writes nothing on refusal, and name the cheap closed-issues recipe in survey-brief §1 and §3.
    severity: minor
  - description: Design agent found audit-skills docReadCounts keyed by mixed absolute, worktree and combined paths, so locating one doc needed substring matching.
    solution: Normalize docReadCounts keys to repo-relative paths.
    severity: nit
  - description: Restarting the merged session branch for the closing ledger PR left the Stop hook counting five unpushed commits against the stale remote branch, nagging until the push.
    solution: Have the Stop hook count against origin/main when the branch's PR is already merged.
    severity: nit
  - description: My closing PR body first carried a stray 'claude/..' typo; I fixed it with an update after opening.
    solution: Re-read a PR body before creating the PR.
    severity: nit
