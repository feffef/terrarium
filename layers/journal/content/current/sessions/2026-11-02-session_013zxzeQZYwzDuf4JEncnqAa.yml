frictions:
  - description: The blind gate never judged claude-code/04.hooks; it was edited for item f9, whose page is 06, so gate skipped it
    solution: grades.ts gate should brief every page the diff changes, not only item pages
    severity: minor
  - description: A judge misread a move's direction on session-logs, read the target as the source, and voted against it
    solution: judge-brief should name a move's source and target pages explicitly
    severity: minor
  - description: About 127 judges were dispatched by hand in seven waves, which is heavy lead orchestration and a large token cost
    solution: Run gate and election judges through a workflow script that grades.ts emits
    severity: moderate
  - description: Writers hit worktree-guard and inline-heredoc refusals and worked around them with script files
    solution: writer-brief should tell writers to write edit scripts to their scratch folder from the start
    severity: minor
  - description: The page-checks 'so' motive warning fires on dozens of mechanism sentences, so every Check output is noise to triage
    solution: Narrow the heuristic in layers/glassbox/page-checks.ts, e.g. to 'so that' or to clauses citing intent
    severity: minor
  - description: A review fix asked for an ADR chip that the page test refuses because a linked Lesson already cites it; the reviewer brief lacks that rule
    solution: Add the chip-repeat rule to EVERY-PAGE or the walkthrough Skill where reviewers read it
    severity: nit
  - description: The Stop hook asked about 30 times to push before the gate ran, each answer costing a turn
    solution: Stop hook could skip its push request while a background gate run or subagent is live
    severity: minor
  - description: "Broke CLAUDE.md 'Verify before you state': I forwarded an Excerpt trim without counting; it would still render 18 lines and drop a named line"
    solution: Count rendered lines against the cited file before sending a trim; the writer caught it
    severity: minor
  - description: Fix-round SendMessages to resumed writers did not repeat CLAUDE.md's ask for rule and doc verdicts; only the original briefs did
    solution: Include the verdict ask in every resume message
    severity: nit
