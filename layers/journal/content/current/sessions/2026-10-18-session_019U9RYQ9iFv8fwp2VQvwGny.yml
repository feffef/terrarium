frictions:
  - description: save-handback.ts failed on every reviewer because they delivered their report as a hand-back message, not final text, so I retyped the pool by hand.
    solution: Have save-handback read SubagentHandback messages too, or tell audit-docs briefs to end with a plain final reply.
    severity: minor
  - description: Ran git fetch in the same parallel batch as the git-conventions read, so the doc was not read before my first git command.
    solution: Read the trigger doc alone first, then start git.
    severity: nit
  - description: The Stop hook asked to commit and push uncommitted changes while checkers were still running and the gate and review were not done.
    solution: Let the hook skip when a scheduled run's PR steps are still pending.
    severity: nit
