entrypoint: remote_mobile
cliVersion: 2.1.322
learnings:
  - A scoped gate run aborts at its next step if any file changes during it, so review fixes have to land before the gate starts.
  - A subscribed PR gets no check runs for a few minutes after opening; the green comment from the gate action is the wake signal, not get_check_runs.
ideas:
  - Add a fresh-reader mode to glassbox-curate that runs once per Subject and writes its findings to a file in the workshop, so a later run reuses them instead of rereading, and the memory page stops growing leftovers.
landedBy: Stop
