frictions:
  - description: dispatch-read guard blocked my first Agent call because I had not read the dispatch-subagents Skill that CLAUDE.md names before a brief.
    solution: Read the Skill in the same batch as the other required reads at the start of a run.
    severity: nit
  - description: I edited page text while pnpm gate:scoped ran, so it aborted at the tree-changed check and wasted a full test pass.
    solution: Finish every edit, including review fixes, before starting the gate; the pr-workflow doc says so but I started it in parallel with code-review.
    severity: minor
  - description: The Stop hook said uncommitted changes five or more times while subagents were still editing pages, and each time needed an explanation instead of an action.
    solution: Let the hook skip while background subagents are running, or say so in its text.
    severity: nit
  - description: My brief to a writer said an inner MDC block needs more colons; the writer found it false in the parser. A fresh reader's guess went into my brief unchecked.
    solution: Mark reader findings as unverified in writer briefs; the writer already re-checks.
    severity: nit
  - description: Claim checkers twice flagged a removed sentence as the only statement of a fact when it was still on the page, so I re-grepped each one.
    solution: Brief checkers to grep the same page for the fact before calling a removal a loss.
    severity: nit
  - description: orient.ts output for a Subject is 50 to 70 KB, so I read it in two pages three times; plain.ts for readers duplicated it.
    solution: Let orient --subject skip the frontmatter and Excerpt blocks, or print plain text only.
    severity: minor
  - description: log-session --author rejected value on two skills docs in reported; only .claude/rules paths take one, which --pending does not say.
    solution: Have --pending print which listed paths take a value.
    severity: nit
