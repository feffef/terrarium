frictions:
  - description: "Issue #995 wired the Monitor guard and updated guards.md, but left the rule's two prose homes (CLAUDE.md, dispatch-subagents) still naming the blocked tool."
    solution: A guard-wiring change should sweep every doc that names the tool it now blocks. A grep for the tool name in the same PR would have caught both.
    severity: moderate
  - description: Checking out the escalation branch off origin/main reverted the Live-tier edits in the working tree; safe here since they were committed, but it reads alarming.
    solution: When one sweep produces both a self-merge and an escalation branch, commit and push the first fully before branching the second — which is what happened.
    severity: nit
  - description: ScheduleWakeup was reached for to wait on background subagents; the /loop-only guard correctly denied it. Dispatched agents self-notify, so no wait was needed.
    solution: The guard's denial message already teaches the right answer — it worked exactly as designed. No doc change needed.
    severity: nit
