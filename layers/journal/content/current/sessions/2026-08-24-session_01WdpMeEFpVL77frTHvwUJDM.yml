learnings:
  - ADR-0018's factual-correction category covers adding a missing forward-pointer to an existing amendment — the Decision text is not being reversed, only made readable in isolation.
  - scripts/subagent-background-guard.ts's checkMonitorCall denies any non-`main` context Monitor call unconditionally, not just ones waiting on a background job.
ideas:
  - Add a gate check that greps the rulebook for tool names a PreToolUse guard newly blocks, failing when a doc still recommends the blocked tool — this sweep's two Drift findings were both that exact shape, and both were mechanically detectable from the guard's own matcher list.
  - Add a `### Self-merge` term to CONTEXT.md defining it as the authoring session executing its own merge regardless of whether the trigger is judgement or an objective gate — ADR-0003's Decision line and CLAUDE.md currently describe the same five chartered tiers in opposite terms, and no glossary entry settles which reading wins.
