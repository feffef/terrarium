frictions:
  - description: My first Agent call was blocked by the dispatch-read guard because I had not read dispatch-subagents before writing a brief, as CLAUDE.md requires.
    solution: Read the Skill when a subagent is planned; the guard worked as designed.
    severity: nit
  - description: The Stop hook claimed a PR merged and close-session had not run, though this session merged nothing; it made me close early.
    solution: Have the merge-close hook match only a merge-pr.ts run in this session, not merge text in tool output.
    severity: minor
  - description: The uncommitted-changes Stop hook fired repeatedly while writer subagents were still editing, so committing then would have mixed half-finished edits.
    solution: Let the hook skip while background subagents are running.
    severity: nit
  - description: plain.ts strips term chips, so fresh readers kept reporting Skill, Routine and Gate as undefined and I had to filter that noise by hand.
    solution: Have plain.ts print each term's definition, or have the brief say to ignore capitalised glossary terms.
    severity: nit
  - description: "A page description I edited came back over its 120-character cap twice, and an unquoted # in the run entry broke validate:content; both only showed after a commit."
    solution: Run glassbox-pages.spec.ts and validate:content after each edit to a description or run entry, and note the cap in the writer brief.
    severity: nit
