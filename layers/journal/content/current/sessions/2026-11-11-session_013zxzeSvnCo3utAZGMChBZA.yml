frictions:
  - description: Told the owner PR 2938's rewrite sample-first clause was in CLAUDE.md; I only saw a grep hit on a UI sentence. PR 3032 had replaced it; the deep pass caught it.
    solution: Run git log -S on the file before stating a clause exists (CLAUDE.md Verify before you state).
    severity: minor
  - description: First git command (rev-parse --is-shallow-repository) was not on CLAUDE.md's read-only list and ran before docs/agents/git-conventions.md; the hook asked for the read.
    solution: Put the shallow check on the read-only list, or read git-conventions first.
    severity: nit
  - description: First Workflow call was blocked by the dispatch-read guard because I had not read the dispatch-subagents Skill, though CLAUDE.md names Workflow briefs as a trigger.
    solution: Read dispatch-subagents before the first Workflow or Agent call.
    severity: nit
  - description: "The saved clear-backlog-explore first pass was superficial: three of four picks changed or rested on stale facts after a deeper pass; its brief lacks the ledger, Skill Inventory and prune-trial sources."
    solution: "Issue 3061: name those sources in the brief and allow a background-understanding pass."
    severity: minor
