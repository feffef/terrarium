frictions:
  - description: A second glassbox-improve run on the same day hit the earlier run's branch name glassbox-improve/2026-10-28; I renamed mine with a -2 suffix.
    solution: glassbox-improve step 1 or 8 could name the branch with a time or the session id, not just the date.
    severity: nit
  - description: Step 3 names no tie-break among many three-rater promotions (six drafts tied); I reused the previous run's importance rank sum, which the Skill never states.
    solution: "glassbox-improve step 3 Structural step: state the tie-break inside one class (e.g. the raters' combined importance order)."
    severity: minor
  - description: "Cooling-off list from git diff --no-renames named pre-rename paths after #2627 moved pages into Verification; I mapped the renames by hand."
    solution: Step 1 could follow later renames (git log --follow or diff -M against the base) when building the cooling-off list.
    severity: nit
  - description: The last re-grade surfaced a pre-existing false claim on MCP servers after I had started gate:scoped on the 'final' head; I stopped and reran the gate.
    solution: Start gate:scoped only after the last re-grade's hand-backs are tallied, as step 8 already implies; I jumped ahead.
    severity: minor
  - description: Two raters wrote their page dumps (b2.txt, d1.txt …) to the shared scratchpad root with the same names, not the subfolder the brief named.
    solution: rater-brief could say every file goes in its own subfolder, with the folder path repeated next to the report instructions.
    severity: nit
  - description: The Spec reviewer read the writer brief's 'report join edits instead of making them' and flagged my own step 6 join edits as scope creep.
    solution: Give the Spec reviewer the Skill's step 6 join-edit rule with the briefs, so orchestrator join edits aren't read as a writer breaking its brief.
    severity: nit
  - description: The Stop hook asked me to push six times while raters, writers and the gate were still running; each turn I had to restate why not.
    solution: stop-hook-git-check could stay quiet while a dispatched agent or a backgrounded gate is still running in the session.
    severity: nit
  - description: Checking fable's Nuxt layers false claim took five reads through @nuxt/kit and c12 dist code before it proved a misreading.
    solution: None needed; a false claim needs a source check. The learning below saves the next run the walk.
    severity: minor
  - description: "Pushing the restarted branch with --force-with-lease was rejected as stale info: the merged PR had deleted the remote branch."
    solution: "The push hook named the cause (issue #1610); git remote prune origin, then a plain push, worked."
    severity: nit
