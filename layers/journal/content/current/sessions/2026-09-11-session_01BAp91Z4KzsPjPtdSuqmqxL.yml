    solution: Not root-caused this session (no visibility into the real PreToolUse hook invocation, only into the guard script's own logic, which is correct in isolation). Flagging for investigation — possibly a transient `pnpm exec tsx` cold-start/env hiccup causing the `|| true` wrapper to swallow a script-level failure rather than a deny decision, which would mean the guard fails OPEN on its own crash instead of closed. Needs a session with hook-invocation visibility to reproduce.
    severity: major
