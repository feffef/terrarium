  - description: ".agents/prune-trials.yml arrived corrupted: a prior prune's edit omitted a `- problem:` list-item boundary, merging two trial entries into one with duplicate `problem`/`territory`/`opened`/`proven`/`check` keys. `scripts/prune-trial-window.ts` (strict `yaml` lib) failed outright with a DUPLICATE_KEY parse error; Python's lenient yaml had silently mangled the merged entry instead (mixing one trial's problem with another's check/territory), which is presumably how it shipped unnoticed."
    solution: Fixed by inserting the missing `- problem:` line, re-verified 4 clean trials parse and `prune-trial-window.ts` runs correctly. Worth a structural safeguard (e.g. gate-check the ledger's YAML validity with the strict parser on any PR touching it) so a similar authoring slip fails CI instead of only failing the next /prune-trial run.
