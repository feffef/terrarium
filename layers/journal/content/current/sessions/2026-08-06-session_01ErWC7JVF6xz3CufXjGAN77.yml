summary: "Asked to grill issue #445 into an implementable state. Grilling established that #445's agent half was already done and only a human YAML paste remained, so the user green-lit (ADR-0003) a larger structural change instead: move the Gate's steps into a composite action. A probe verified empirically that the `workflow` OAuth scope fences `.github/workflows/` only, so `.github/actions/**` is agent-pushable — the finding the whole design rests on. The user chose every branch (scope, fence, sequencing, ADR placement, glossary terms) and pushed back on naming, which evidence then redirected. Agent-initiated within that mandate the parity spec, the superseded banners, and the review fixes."
