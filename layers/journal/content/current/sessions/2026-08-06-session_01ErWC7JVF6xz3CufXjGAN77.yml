learnings:
  - The `workflow` OAuth scope fences `.github/workflows/` only — `.github/actions/**` is agent-pushable (probe-verified, not inferred)
  - Composite action steps support `if` AND `continue-on-error`; the widely-cited runner issues saying otherwise are stale
  - The `secrets` context is unreachable inside a composite action — pass tokens as declared inputs
  - "`gate.yml`'s human-only status never protected the Gate: `package.json` already defined what each step means, and is agent-pushable"
ideas:
  - Add a supersede convention to docs/proposals/README.md — a replaced proposal must carry a banner naming its replacement. Three proposals in the drop-zone silently contradicted each other this session, and one actively instructed a human to undo in-flight work.
  - Give pr-authorassociation-label.yml the same thin-shell treatment. That would be the concept's second instance, which under the rule of two is exactly when 'gate shell' and 'gate action' earn CONTEXT.md entries.
  - "Build a stale-proposal detector in the gate floor: parse each docs/proposals/*.md Target block and fail when the quoted before-state no longer matches the real workflow file. Proposals rot silently today, and the only thing that catches it is a human reading all of them."
