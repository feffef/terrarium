frictions:
  - description: docs.github.com returns 403 through the agent proxy, so composite-action semantics could not be verified from the canonical URL.
    solution: Use raw.githubusercontent.com/github/docs for GitHub docs primary sources. Worth a line in docs/agents/environment-caveats.md — a subagent hit the same wall independently.
    severity: moderate
  - description: The spec-review subagent hit that 403, could not verify composite continue-on-error, and reported the fail-open argument as unverified — a false finding I had already disproven.
    solution: Dispatch briefs should hand subagents the primary sources the parent already fetched, rather than making each re-derive them against a proxy that blocks the obvious URL.
    severity: moderate
  - description: WebSearch confidently reported continue-on-error as unsupported in composite actions, citing 2021-23 runner issues; current docs say otherwise.
    solution: Treat search summaries about platform capabilities as leads only; grep the vendor's own docs source before designing on them.
    severity: minor
  - description: Three pending proposals silently contradicted each other; 445's still instructed a human to do the thing that would undo this change. The drop-zone has no supersede convention.
    solution: Add a superseded-banner convention to docs/proposals/README.md so a replaced proposal says so at the top instead of quietly staying applicable.
    severity: moderate
  - description: I violated the very staleness rule this change argues for — ADR-0004's amendment asserted the Gate's steps had already moved when gate.yml still runs them.
    solution: When splitting "land the decision, defer the behavioural claim", check the landed half for present-tense claims about the deferred half. Caught by code-review, not by me.
    severity: minor
  - description: Spawned two review subagents without first invoking the dispatch-subagents Skill, which CLAUDE.md requires before spawning any subagent.
    solution: The code-review Skill embeds its own dispatch instructions, which read as sufficient and displaced the repo rule; it should point at dispatch-subagents.
    severity: minor
  - description: Scratchpad files were truncated or removed mid-session — a docs copy shrank to 14 bytes and several logs vanished, so a re-verification silently returned nothing.
    solution: Do not treat the scratchpad as durable across turns; re-fetch and re-confirm rather than re-reading a file cached earlier. Possible environment-caveats entry.
    severity: minor
  - description: The session worker restarted mid-edit, leaving a malformed markdown bold marker in ADR-0004 that only a re-read caught.
    solution: After a worker restart, re-read files edited in the interrupted turn rather than assuming the last edit applied cleanly.
    severity: nit
