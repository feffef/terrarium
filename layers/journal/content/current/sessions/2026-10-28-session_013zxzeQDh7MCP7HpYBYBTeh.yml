frictions:
  - description: Called mcp__github__search_pull_requests before reading docs/agents/github-integration.md; a guard blocked it for missing fields.
    solution: Read the GitHub doc before the first mcp__github__ call, as CLAUDE.md says. The guard caught it at no cost.
    severity: nit
  - description: The skill gives no tie-break for two gap drafts with equal rank sums; I picked work-queue by judgement and had to disclose that in the PR.
    solution: Add a tie rule to glassbox-improve step 3, for example the draft needing fewer changes, or the lower Subject order.
    severity: minor
  - description: Chose the work-queue draft without checking its title against EVERY-PAGE's title rule; two raters then flagged five words, costing a retitle round and link-text edits on five pages.
    solution: Have step 3 check a candidate draft's title against the rule before it is chosen, or add the word count to page-checks (issue 2651).
    severity: minor
  - description: My writer brief said to give sibling-owned reasons one sentence, but the Why bullets still repeated Human-in-the-loop; raters flagged it three times and the page ended at B after two fix rounds.
    solution: Brief a promotion writer to diff each Why bullet against the Lessons its ADRs appear in before committing, naming those Lessons.
    severity: moderate
  - description: pnpm check:worktrees failed on the writer's merged worktree until I pushed the run branch, then passed; the skill does not say push first.
    solution: Note in glassbox-improve step 8 that check:worktrees needs the run branch pushed when a writer worktree was merged.
    severity: nit
