frictions:
  - description: Called search_pull_requests without fields before reading github-integration.md, breaking CLAUDE.md's read-first rule; the guard denied it and cost one retry.
    solution: None needed; the guard did its job. The read-first line was simply skipped.
    severity: nit
  - description: pnpm gate:scoped failed once on an unrelated Journal e2e accordion test and passed on rerun, costing about a minute of gate time.
    solution: Fix or quarantine the flaky accordion e2e test.
    severity: minor
  - description: The merge-commit title listing mixed up lines for merges with conflict bodies, so some PR titles were shifted by one row and I had to fetch PRs directly.
    solution: Use scripts/recent-prs.ts for titles instead of git log merge bodies.
    severity: nit
  - description: The Stop hook asked to commit and push untracked files while the fact-check was still pending; ADR-0004 required gate and review first.
    solution: Let the Stop hook skip when a scheduled Skill's own steps hold the push.
    severity: nit
  - description: First Karen draft asserted rule durations, timing and an ellipsised quote I had not derived from sources; the fact-check found eight wrong or overstated rows and forced a rewrite.
    solution: Pin the exact commits and timestamps in scratch notes before drafting a claim about how long a rule said something.
    severity: minor
  - description: A push of the restarted branch with force-with-lease was rejected as stale info because the remote branch had been deleted on merge; needed git remote prune and a plain push.
    solution: pr-workflow.md already says push plainly after a restart; follow it instead of using the lease.
    severity: nit
