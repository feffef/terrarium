frictions:
  - description: Ran git log to draw a conclusion before reading git-conventions.md, against CLAUDE.md's read-first rule; the hint caught it.
    solution: Read git-conventions before the first history query; the hint already fires, so no new rule.
    severity: nit
  - description: "inspect-session could not recover #2650's first-round raters: list_events skipped 40 minutes and rejected the cursor past the gap as Invalid."
    solution: Have run PR bodies carry every rater grade (now in glassbox-improve v2) so events are never the only record.
    severity: moderate
  - description: Recovering five sessions' rater hand-backs cost about 1.1M subagent tokens; one session needed 98 event pages sequentially.
    solution: "Same fix: intermediate results in the PR body; inspect-session full-read mode for long sessions."
    severity: moderate
  - description: The design repeated two retro claims I hadn't verified (hints draft wrong; frontmatter gate missing); both proved stale during implementation.
    solution: Verify each idea's claim against main before putting it in a design, not after.
    severity: minor
  - description: Stop hook asked to push while gate:scoped was running, against ADR-0004's order.
    solution: User-scope hook; skip the push request while a gate run is pending.
    severity: nit
  - description: The worker process restarted mid code-review; state survived but the review dispatch had to be redone.
    solution: None needed beyond committing before long steps, which held.
    severity: nit
  - description: 'SHELL-READ-DETECTION: for f in SKILL.md rater-brief.md researcher-brief.md writer-brief.md; do echo "=== $f"; cat $f; done read all four glassbox-improve files but was not credited.'
    solution: shell-reads.ts could expand a for-loop over literal names into reads of each path (.agents/skills/glassbox-improve/SKILL.md and the three briefs).
    severity: moderate
