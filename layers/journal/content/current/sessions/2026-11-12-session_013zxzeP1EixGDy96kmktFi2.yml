cliVersion: 2.1.322
learnings:
  - An at-sign import is not expanded inside a Skill (or a path-scoped rule), so a Skill must say 'read X in full' as an explicit step; ADR-0029's rejected alternatives say the same for rules.
  - A Walkthrough or Lesson Where next cap of five counts every list item including the one Journal link, so a list with four guide links and a Journal link is already full.
ideas:
  - "Add a post-edit hint, like adr-read-hint, that names an unread owner-decisions.md when a session edits Glass Box content: ADR-0029 says a rule cannot order a read, but a hint can point at an unread file, so non-Skill sessions would see the owner's hard rules."
  - "Highlight the diagram box for the stop in view on a Walkthrough page: the page already tracks the current stop for its table of contents, so the sticky diagram could mark the matching box and tie picture to steps without numbering."
  - "Progress-aware 'Next up' path: rank unread Lessons from the reader's local read list and the Where next graph, with a Start-here page and a resume button; reading progress and the Walkthrough re-order task now supply the data, so only the ranking and one page are missing."
  - "Updated-since-you-read-it: store the read date instead of only the path, compare it with each page's revisionDate, mark a changed Lesson with a dot and add a returning-reader page of what changed; it uses data that exists and turns a one-shot textbook into one people revisit."
  - A concept map built at build time from Where next links and Lesson chips, coloured by the reader's read state; it gives newcomers a way to choose a path and gives agents a view of weak clusters that the under-two-links warning only counts.
  - "Prerequisites in frontmatter (a needs list per Lesson) so the guide supports tracks such as 'I know Nuxt, new to Claude Code': an auto-ordered path, a ready-to-read status, and a check that numbered order never contradicts a prerequisite, instead of folder prefixes as the only order signal."
  - "Real reader signals for the curate loop: a 'this was confusing' link per section that opens a prefilled GitHub issue, plus fresh-reader results stored as data in the run entries, so a guide-health panel on the workshop page tracks where newcomers get lost over time and focuses are ranked by evidence, not only by simulated readers."
  - "Live evidence badges: at build time count how many cited files and ADRs changed since a page's pin and show a 'sources changed' badge; glassbox-update knows this offline, and showing it makes the textbook's honesty visible and puts the most drifted pages first for agents."
  - "Make the guide agent-readable: publish the teaches index and page bodies as an llms.txt or a concept kind in the catalog, and let the read-first hints name the Lesson for the area a session is editing, so Terrarium's own sessions meet the concept with citations instead of re-deriving it from docs."
  - Turn each Lesson's Try-it-in-your-project section into a guided, self-checking exercise (copy buttons, a command that proves it worked) and, for the Nuxt-specific Lessons such as layers and auto-imports, a runnable sandbox, so reading becomes doing.
landedBy: Stop
