frictions:
  - description: The dispatch-read guard denied my first survey Agent call until I read dispatch-subagents; a second call was denied because my brief text held the literal placeholder token, though I had filled the value.
    solution: Have the guard test for an unfilled value, not the literal token, or name this in the Skill's dispatch lines.
    severity: minor
  - description: Read git-conventions.md and github-integration.md only after my first git and GitHub operations (git log, push-adjacent calls and issue reads), as the hooks flagged.
    solution: Read the three required docs first when a Skill run starts; the Skill could list them.
    severity: nit
  - description: frictions-to-fixes §5.4 asks for the simple-change test on a ledger PR whose generated diff spans 57 files and 437 lines, so it can never pass; I checked paths only.
    solution: Say a ledger-only diff counts as simple when it touches only frictions entries and the gate passes.
    severity: minor
  - description: Survey report's window start was ambiguous (extract-frictions prefix 2026-11-13T02:27 versus first session 2026-11-12T23:06) and its ledger append refused all 84 triples over 15 held sessions, needing a throwaway filter script.
    solution: Print one canonical window start; let print-ledger-occurrence --append skip held sessions with a flag.
    severity: minor
  - description: Stop hook asked to push the ledger commit before the PR flow and to close the session mid-run while two PRs were still waiting on CI.
    solution: Have the hook treat a subscribed open PR as work in progress.
    severity: nit
