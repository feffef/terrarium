summary: "Scheduled frictions-to-fixes run, agent-initiated by the schedule (no human prompt). A survey subagent screened 27 sessions' frictions, appended 45 occurrences, added one entry, recorded five merged fix PRs and put one entry on trial; it committed the ledger. I filed regression issues #2424 (close-session skipped after a merge, major), #2425 (mechanism claims from recall) and #2426 (gate run outside run_in_background). I picked three open entries (pr-number-guessed-before-create, rewrite-pass-scope-drift, verdict-comment-hand-typed); the design subagent recommended no change for each (Human-only homes, trial territory, cost of one retry), so I recorded dropped-design notes, pruned the horizon and opened ledger PR #2427 after a green gate:scoped. No fix PRs, so no closing ledger PR. PR #2427 merged by me via merge-pr.ts after a green CI gate (ledger-only, ADR-0004 allows it)."
