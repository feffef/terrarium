frictions:
  - description: Started the gate with a trailing & plus run_in_background; the double-background guard blocked it and nothing ran.
    solution: Pass run_in_background alone with a plain command (the guard already says so).
    severity: nit
  - description: Ran git status before reading docs/agents/git-conventions.md; a hook reminded me after the first git command.
    solution: Read the git doc together with the session-start docs.
    severity: nit
  - description: Decided which fixes to drop or file without invoking adr-check, though CLAUDE.md asks for it before any recommendation; the frictions-to-fixes Skill has no step for it.
    solution: Add an adr-check step to the Skill's §5, or drop the CLAUDE.md trigger for scheduled sweeps.
    severity: minor
  - description: Called Monitor without loading its schema via ToolSearch, wasting one call.
    solution: Load deferred tools before use, or rely on the background-task notification.
    severity: nit
  - description: "The survey subagent reported survey-brief.md pulls opposite ways: it tells agents to search_issues for closed issues while github-integration.md says to prefer list scans."
    solution: Make the brief point to github-integration.md for search instead of restating it.
    severity: minor
  - description: survey-brief part (e) asks for the highest severity since the latest PR, but --summary shows the horizon maximum; the subagent computed it by hand.
    solution: Make --summary print the max severity since the latest fix.
    severity: minor
  - description: print-ledger-occurrence.ts prints blocks without cluster labels, so the survey agent wrote a splitter to place 45 blocks.
    solution: Add a --cluster flag or labelled output to the script.
    severity: minor
  - description: Design brief gives no instruction for when every candidate home is Human-only or on trial, nor how to tell docsRead from deprecated docsReadViaShell on old logs; the agent inferred no change.
    solution: State in the brief that no change is the answer when all homes are off limits, and name a helper for old logs.
    severity: nit
  - description: SKILL.md §2 ranks regressions to file by severity, count and recurrence together without saying whether entries already tracked by an open issue or on trial count; I chose by judgement.
    solution: State that regressions with an open issue, a trial or an owner decision are skipped before ranking.
    severity: nit
  - description: Subagents' tool results carried many unrelated ADR rules loaded by ledger file reads, costing context in the survey with no use.
    solution: Narrow the paths of the rules that load on layers/journal/content/current/frictions/*.yml.
    severity: nit
  - description: dispatch-subagents §3 says to run pnpm gate:scoped in the foreground while CLAUDE.md says run_in_background; I hit the conflict choosing how to run the gate.
    solution: Point §3 to CLAUDE.md and state that only dispatched subagents run it in the foreground.
    severity: nit
