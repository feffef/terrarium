summary: "The owner's one prompt was the /frictions-to-fixes Skill invocation; every pick, issue and decision after that was agent-initiated within the Skill. A survey subagent appended 37 occurrences, opened one entry and recorded nine merged fix PRs in the Friction Ledger. I checked the still-recurring list myself and filed regression issues for the three clusters with the most recurrence since their fix (dispatch-subagents-skill-unread, edit-during-gate-run, frictions-to-fixes-skill-gaps) after finding no open issue for them. Of three never-fixed picks, a design subagent verified the survey's source finding for read-first-hint-repeats-in-subagents; I checked it and filed it as an issue because scripts/hooks is Human-only to merge, so no fix was dispatched. The other two (verdict-comment-hand-typed, blocked-waiting) were dropped with notes: no new fact since the earlier dropped designs. The ledger PR passed gate:scoped and carries my verdict. Still open: it must merge when CI is green, and since there is no fix PR the closing ledger PR is skipped. The fixes list in the PR body came from the survey report, and I did not re-check each PR against its source."
