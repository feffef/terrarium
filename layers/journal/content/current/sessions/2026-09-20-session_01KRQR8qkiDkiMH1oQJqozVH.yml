  - description: "scripts/prune-trial-window.ts's git log -S search keys each open trial by only its raw problem: first line; when an older, already-judged trial about the same file/section happened to share that exact opening clause, the tool reported the CURRENT entry as landed 12 days early (JUDGEABLE, wrong commit/timestamp) instead of NOT FOUND. Caught only by manually re-running git log -S with a phrase unique to the current entry's body."
