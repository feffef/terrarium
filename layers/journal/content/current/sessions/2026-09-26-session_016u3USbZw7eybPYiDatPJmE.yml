frictions:
  - description: "Ran `pnpm gate:scoped` for the full gate without `run_in_background: true` from the outset, so it auto-backgrounded at the 2-minute timeout -- a direct instance of the very CLAUDE.md convention I was judging in this same run's trial."
    solution: "Pass `run_in_background: true` on any command expected to run long, every time, including ones encountered mid-task rather than planned up front."
    severity: minor
  - description: "Two dispatched Agent-tool worktree probes (isolation: 'worktree') silently started on a stale HEAD (the pre-prune commit) instead of the pushed branch tip, so their first comprehension answers actually quoted the OLD, pre-rewrite text -- caught only because one answer's exact wording didn't match what I'd just committed."
    solution: Always have a worktree-dispatched probe explicitly `git fetch` + `git checkout <exact SHA>` and confirm via `git log -1` before reading anything, per dispatch-subagents/SKILL.md's own "verify HEAD" guidance -- don't skip that check just because the dispatch is read-only with no commit at the end.
    severity: moderate
  - description: First draft of the new ledger entry (documenting the exhaustive criterion-1/2 search) was long enough that the combined diff came to +25 net lines, which runs against this repo's "every change must shrink it" mandate -- caught only by explicitly running `git diff --numstat` against the true base commit before opening the PR.
    solution: Check `git diff --numstat <base>` for a prune-trial change before committing, not just eyeball the file; trim the ledger entry itself when it's the thing that grew.
    severity: moderate
  - description: First pass at the domain.md "simplify the language" rewrite only reformatted sentences (671->668 words, effectively flat) rather than cutting real content, because I judged it by read-through impression instead of a word count.
    solution: Compare `wc -w` before/after immediately after any language- simplification rewrite, before treating it as done -- a rewrite that merely re-flows prose isn't a prune.
    severity: minor
