frictions:
  - description: Bundled two unrelated issues into one PR because the harness pinned a single designated branch. The user caught it and had to authorize extra branches before I could split.
    solution: A pinned branch is a packaging constraint, not an editorial one. Say so when picking up more than one issue, and ask up front whether separate branches are allowed.
    severity: moderate
  - description: Started implementing after checking only that the guard did not already exist - not whether anything since August had superseded either issue. The user had to ask.
    solution: Make the ready-for-agent premise re-check explicit before writing code - search for a superseding PR/commit and check prune-trial territory, not just "does the artifact exist".
    severity: moderate
  - description: Auto mode's classifier denied "git push --force-with-lease" on my own unshared branch, blocking the split cleanup until the user granted it.
    solution: Expected for a history-rewriting command. Reverting was not a valid workaround here - a revert commit would have deleted the bullet again after the sibling PR merged it.
    severity: minor
  - description: Twenty-six unit tests passed while the Bash deny message was garbled - the command was interpolated mid-sentence, so the clause after it ran into the code block.
    solution: Substring assertions cannot see an assembled sentence. Live-probe a guard's deny path once, or snapshot the whole message, rather than only asserting it contains keywords.
    severity: minor
  - description: "\"git add -A\" swept the second issue's doc change into the first issue's commit; needed a soft reset and a restage to split them."
    solution: Stage explicitly per issue when one session implements more than one - "git add -A" has no way to know two unrelated changes are sitting in the same tree.
    severity: minor
  - description: The new guard denied my own diagnostic command, because it quoted an example write as a dry-run argument - the same trait commit-trailer-guard already documents.
    solution: Accepted and recorded in the script header. The escape is the Edit tool or --input-file.
    severity: nit
