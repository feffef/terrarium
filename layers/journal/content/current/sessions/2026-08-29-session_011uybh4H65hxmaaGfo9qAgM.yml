learnings:
  - A PreToolUse hook added to .claude/settings.json takes effect immediately in the same session - no restart needed
  - A guard's unit tests cannot observe live interception, but a Write to a NEW file under the protected path probes it safely - a deny writes nothing, and a miss leaves only an untracked file
  - Splitting a bundled PR by reverting is unsafe when a sibling PR carries the same commit - the revert deletes the sibling's change once both merge. Dropping the commit with a force-push is the only correct move
ideas:
  - Add a tests/unit/guards-wiring.spec.ts that walks every "scripts/*-guard.ts" and asserts each is either wired into a PreToolUse matcher in .claude/settings.json or named in an explicit post-hoc allowlist (today only session-id-guard). A guard that lands unwired is silently unenforced, and nothing currently catches that - I wrote the per-guard drift test for this one by hand after noticing github-provenance-guard had one, which is exactly the kind of convention that gets skipped when it depends on an author remembering it.
  - CLAUDE.md's PR discipline assumes one session produces one PR, which collides with a harness-pinned designated branch when a session picks up several unrelated issues. Give the "one issue, one PR" default an explicit home, and say what to do when the branch is pinned - ask for a second branch, or state the bundle in the PR body as a constraint rather than letting the description imply the issues belong together.
