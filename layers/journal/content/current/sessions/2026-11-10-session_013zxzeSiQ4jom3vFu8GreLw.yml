frictions:
  - description: Ran git commands before reading git-conventions.md; a hook flagged it afterwards. The doc showed the commands were read-only, so no harm.
    solution: Read the doc at session start when a Skill's first step is a git command.
    severity: nit
  - description: The Workflow call was blocked until I read dispatch-subagents; the Skill sentence said to read it before a brief, but the trigger was easy to miss.
    solution: Have clear-backlog name dispatch-subagents as a read-first doc in its opening.
    severity: nit
  - description: Changed issue labels before reading issue-tracker.md (CLAUDE.md requires it first); a hook flagged it. The labels were right.
    solution: Read issue-tracker.md before the first label write in a clear-backlog run.
    severity: nit
  - description: The push notification said six questions but the grill had five; I had not counted the issues first.
    solution: Count the grill results before sending the notification.
    severity: nit
  - description: "merge-pr.ts refused my Closes #3024 because explore left the issue needs-triage, then did not close it after merging the reworded PR; two extra steps."
    solution: Have the explore step label a build result ready-for-agent, or have clear-backlog say to write relates-to and close the issue by hand.
    severity: minor
  - description: "Linked worktree(s) left with uncommitted or unpushed work at close: /home/user/terrarium/.claude/worktrees/wf_7d410a86-fae-2"
    solution: Push each, or remove it if its work is meant to be dropped.
    severity: minor
  - description: "Linked worktree(s) left with uncommitted or unpushed work at close: /home/user/terrarium/.claude/worktrees/wf_7d410a86-fae-1, /home/user/terrarium/.claude/worktrees/wf_7d410a86-fae-2"
    solution: Push each, or remove it if its work is meant to be dropped.
    severity: minor
  - description: Build agents and my own issue comments called CLAUDE.md Human-only; the rule paths on origin/main do not list it, so I repeated an unverified claim on three issues.
    solution: Check list-human-only-paths.ts output before a brief or comment names a file Human-only.
    severity: minor
  - description: Both build runs hit the 3-round review cap on cosmetic findings (wrap, a null default, one doc clause), then I fixed them by hand; many agent tokens for nits.
    solution: Let the build workflow stop at cosmetic-only findings, or give the builder the 80-column wrap rule up front.
    severity: minor
  - description: check:worktrees failed on a pushed branch because pushing HEAD:branch left no remote-tracking ref in the worktree; I had to fetch it to prove it was pushed.
    solution: Have clear-backlog section 4 push with a tracking ref, or check-worktrees compare against ls-remote.
    severity: nit
