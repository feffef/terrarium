frictions:
  - description: "The explore agent for #3483 said its PRs contradicted the Friction, but PR #3444 was opened 11 s after its commit and reviewed only afterwards; it never compared timestamps."
    solution: For a regression report, the explore brief should compare PR created_at with the review subagents' order or times before calling a premise false.
    severity: minor
  - description: "I recommended closing #3483 without checking the Blog; Karen's 2026-11-17 post already argued the #3416 call was wrong, and the owner pointed me to it, costing a grilling round."
    solution: When triaging a Friction regression, grep the Blog for posts tagged with the same area (here self-review) before picking.
    severity: minor
  - description: I did not check whether the grilling-skipping runs had read the grilling SKILL.md until the owner asked; the check took one grep.
    solution: Verify each option's premise before offering it, as section 2 asks.
    severity: nit
  - description: "#3481 needed a third full review round only because round 2 raised a missing-test on a 98-line branch; round 3 found one wording nit."
    solution: In clear-backlog section 3 step 4, skip the next round when the missing-test was fixed and re-checked clean in its own round.
    severity: minor
  - description: "The explore agent's comment on #3481 misspells one session id (its own side finding); the comment was left uncorrected."
    solution: Explore agents should copy session ids from the log filename, never retype them.
    severity: nit
