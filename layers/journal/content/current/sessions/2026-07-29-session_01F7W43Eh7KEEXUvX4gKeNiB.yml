learnings:
  - A per-Space content rule can often be derived from the data (does this Space have any pages?) instead of hardcoding Space names in a platform script — the derived form generalizes to future Spaces for free.
  - Nuxt auto-imports every app/utils export globally across ALL layers, so extracting a shared helper out of an SFC turns a private function into a global name — the repo's answer is layer-prefixed exports (formatBlogDate, formatMarqueeDate).
ideas:
  - 'Make `condition` decay visible as a curator worklist. The reviewers found `fresh` is rotting — cards graded fresh weeks ago still claim "barely cold" — but #526 rightly forbids re-deriving condition mechanically. The gap is that nothing surfaces staleness at all. Add a `pnpm midden:stale` check (and a line on the stores register) that flags any card whose `assessedAt` is older than its grade plausibly survives — fresh > 14 days, say — and files a survey-report issue listing them. It never changes a grade; it just tells the curator which grades are now lying, turning a silent rot into a bounded regrade queue.'
