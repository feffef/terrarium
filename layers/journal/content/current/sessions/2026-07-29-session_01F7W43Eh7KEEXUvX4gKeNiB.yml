frictions:
  - description: Initial `ls -R | head -100` silently truncated the midden pages listing to 3 of 9 Sites; I briefed three review agents believing only 3 Sites existed.
    solution: The agents caught it independently and read all 9. CLAUDE.md already warns against piping through head/tail when output matters — the rule is about exit status, but truncation of a listing is the same failure. Worth extending that bullet to cover directory listings, not just command output.
    severity: minor
  - description: Repo is a shallow clone, so a `remains` URL I wanted to add for the workspace file could not be verified against local git objects.
    solution: "`git fetch --deepen 200` made the blob resolvable and confirmed the path existed at that SHA. CLAUDE.md's shallow-clone bullet covers history archaeology; it does not mention verifying a SHA-pinned content link, which is the Midden's most common need for deep history."
    severity: minor
  - description: Reviewer summaries contained a detail I nearly published verbatim — "42/42 local" restated as "green forty-two times locally", which the card does not say.
    solution: Caught by reading the primary card before writing the Site prose, exactly as CLAUDE.md requires. No fix needed; recorded as evidence the rule earns its keep on subagent-derived prose specifically.
    severity: nit
  - description: GitHub silently stripped "<slug>" from the PR body as an HTML tag, even inside backticks, garbling a technical claim about the anchor format.
    solution: Spotted by reading the created PR back via the API rather than trusting the submitted text, and fixed with update_pull_request. Angle-bracket placeholders in any GitHub-bound prose need escaping or rewording — worth a line wherever ADR-0017's external-post conventions are written down.
    severity: nit
  - description: Reducing a dig report to one find exposed a latent "1 finds" pluralization bug that had been unreachable while every report had multiple finds.
    solution: Fixed inline. A content-shape change surfacing a presentation bug argues for pluralization helpers rather than inline ternaries, but two sites is too few to coin one (rule of two).
    severity: nit
