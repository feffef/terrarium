frictions:
  - description: Dispatched code-review subagents that ran git diff without first reading the dispatch-subagents Skill, which CLAUDE.md requires for subagents that touch git
    solution: The CLAUDE.md trigger says 'touches git'; read-only git diffs are ambiguous. Clarify whether read-only git counts.
    severity: nit
  - description: An ad-hoc python analysis of saved list_events pages printed a whole hand-back body, about 20k characters, into the main context
    solution: Truncate every printed field from the first run; the new Flatten plus grep -oE now does this by default
    severity: minor
  - description: First draft of the scripts carried WHAT-comments and duplicated helpers, which the code-review Standards pass had to flag
    solution: Re-read CLAUDE.md's comment rule before writing code comments
    severity: nit
  - description: A Bash call with run_in_background plus a subshell '&' was blocked by the double-background guard; resent without the '&'
    solution: Use run_in_background alone with a foreground command
    severity: nit
  - description: git checkout -b from origin/main left the new branch tracking origin/main; had to unset the upstream to avoid a push to main
    solution: Use git checkout --no-track -b <branch> origin/main
    severity: nit
  - description: "SHELL-READ-DETECTION: a real read went uncounted. Command: git show origin/research/cloud-session-transcript-tools:docs/research/cloud-session-transcript-tools.md (after a git fetch on the same line). Expected path: docs/research/cloud-session-transcript-tools.md"
    solution: Teach scripts/session/shell-reads.ts that git show <ref>:<path> reads <path> when its output is shown
    severity: moderate
