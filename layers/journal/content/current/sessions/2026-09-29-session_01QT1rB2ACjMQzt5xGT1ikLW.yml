outcome: "PR #1494 shows both webs at phone width as text-free overviews cropped to their medallions, with the words in the lists below"
summary: "The human asked for a better solution than #1492's phone-width fix, which hid the specimen relations web and swapped the food web for a list. Before building I asked two questions, per the user's preference to be asked first. The human chose to restore both diagrams and picked the \"compact overview\" approach (scaled down, no text) over a portrait re-layout or per-relation mini-plates. First pass: hide SVG text (strand labels, names, and later the orphaned name rules) at ≤30rem, keep the lists. The human then pointed out, twice, that the diagrams still wasted space left and right: the fixed viewBox kept the margins that had held the names. Second pass: a small useWebViewBox composable that crops the viewBox to the medallion bounds under a matchMedia query. Checked with 390px and 1280px preview screenshots. gate:scoped passed. PR opened automatically per ADR-0003, which is agent-initiated procedure, not a human ask."
