frictions:
  - description: Created a stray local branch tmp-none by mistake while checking files, against the stay-on-your-branch rule; noticed and deleted it at once.
    solution: Never run git checkout -b in an exploratory command; use read-only git commands there.
    severity: nit
  - description: Root GLOSSARY.md was catted together with other docs; output overflowed to a file and I read only its first 2KB, not the whole glossary the start-of-session rule requires.
    solution: Read big required docs in their own Read call so truncation is visible.
    severity: minor
  - description: First mcp__github__ call (pull_request_read) came before docs/agents/github-integration.md; a hook flagged it afterwards. The call was right, but the read order was wrong.
    solution: Read github-integration.md in the same batch as the other start-of-session docs.
    severity: nit
  - description: owner-corrections.ts printed 19 candidates for ten PRs, almost all routine bot content PRs; resolving them took several GitHub reads that the previous run had already done.
    solution: Have the script skip PRs whose title matches a known routine prefix (glassbox-update, journal(digest), blog(...)) or whose author is a Routine session.
    severity: minor
  - description: GitHub search_issues returned zero results for plain queries like Friction Ledger, while the refiner's searches found 166; so my no-match search lines were weak evidence.
    solution: Document in github-integration.md which search tool and query form is reliable for the visitor-loop search step.
    severity: minor
  - description: gate:scoped's e2e step reused an .output built before the last commit (L2 reuse), so it did not exercise the final v-if change.
    solution: Rebuild before gate:scoped when a later commit touches rendered code, or have the gate compare the build's age to the diff.
    severity: minor
