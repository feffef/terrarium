summary: "The user asked what in root GLOSSARY.md and GLOSSARY-MAP.md could be trimmed because it lives elsewhere. I answered first with an analysis: some text was plain duplication, but several entries (severity scale, Session kind, Importance grades) were the sole home other files point to, so they could only move. The user then directed (human-instructed): aim for fewer tokens, put the Tenant list in the map, prune retired terms, open a PR, and keep both files strictly a glossary and a map, moving concepts and instructions out. I did that: kind and severity grading moved to log-session, Importance grades to audit-skills, the no-shared-code stance to the tenant-layers rule, and ADR-0021 and its rule were rewritten to match. Only `Spawn` was pruned; the other retired terms still appear in old Journal and Blog content. Glass Box terms cite root headings, so every heading stayed. Two code-review rounds (the second requested by the user) caught stale pointers and one meaning change (Human-only lost ADR-0004's Dependabot exception); all fixed. Needs a human merge (ADR, rules, CLAUDE.md, shared/)."
