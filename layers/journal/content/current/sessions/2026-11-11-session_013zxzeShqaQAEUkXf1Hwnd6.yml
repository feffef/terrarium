goal: Make clear-backlog's explore agents research issues in depth
status: in-review
outcome: PR 3083 open for a human merge; gate green; no ticket changed by the explore test runs
summary: "The owner started /clear-backlog on all seedlings and regressions. The first explore run (11 issues) wrote comments and labels and closed one issue as the Skill is designed to, and was shallow (2-3 file reads and 2-8 shell commands per agent). The owner asked whether it was deep, then redirected the session: improve the explore brief, use the same 11 tickets as test candidates, and never act on their results. I reverted what could be reverted (relabelled #3076, reopened #2996); later the owner had me delete the ten first-run comments. Over five more explore runs I changed the brief, the result schema and run-summary.ts, measured depth from the agent transcripts (tool counts, sources opened, no write calls, issue timestamps unchanged), and compared each pick across runs. Picks held in 9 of 11 between runs 3 and 4 but only 6 of 11 between runs 4-5 and 5-6, because they turn on judgement calls, so the owner chose to make each pick state what would flip it (wouldChange) and to settle unverified options. Owner-instructed: the redirect, a dry-run mode (later removed at the owner's word, with wouldPost), option 2, seedlings always grill, run-summary showing the new fields and always the workflow logs, the SKILL.md note on what a build brief carries, deleting the first-run comments, and opening the PR. Agent-initiated: the pick normaliser (later removed), the title field and seedling demotion of every outcome, dropping the sourcesRead minimum, the soft cost line, a stubbed-agent test, two code-review rounds (required by pr-workflow), the full gate, and subscribing to the PR. Still open: picks are leanings not researched answers, and a seedling an agent already closed in a real run is guarded only by the brief."
