learnings:
  - run-summary.ts never read the workflow logs field, which holds harness warnings about subagent output; its settings-json pattern fired on plain mentions of the file path .claude/settings.json (inferred from which results mentioned it)
  - Explore picks flip between identical-brief runs on judgement calls (6 of 11 held between consecutive runs); they stay stable only where a checkable fact settles the choice (inferred from five runs, no stats)
  - pnpm gate:scoped runs the full gate whenever a non-inert path such as a tests/unit spec is in the diff
ideas:
  - Run each explore issue two or three times and show the orchestrator where the picks disagree, so the grilling labels a pick as a researched answer or as a judgement call before the owner decides
landedBy: Stop
