frictions:
  - description: Skill's glassbox row says stay inside /t/glassbox/guide, but the argument asked for the workshop; the Skill never says whether an argument can widen a focus's note.
    solution: Say in the Skill's focus section that an argument may widen or replace a row's Note, or add a workshop row.
    severity: minor
  - description: First Agent dispatch was blocked by the dispatch-read guard because I had read the .claude/skills link, not the .agents/skills path it checks; three long briefs were sent twice.
    solution: Make the guard accept the .claude/skills symlink path, or say the canonical path in CLAUDE.md's dispatch bullet.
    severity: nit
  - description: Stop hook said there were untracked files and uncommitted changes when git status was empty, and again mid-verification before I could commit.
    solution: Have the Stop hook skip files git ignores and wait for an in-flight background run.
    severity: nit
  - description: I keyed the bare layout on an empty Subject list, which would have stripped drafts of its sidebar; only the Spec review caught it before landing.
    solution: Key a Space-specific layout on the Space name, and measure drafts and guide too when changing a shared page.
    severity: minor
  - description: A python string replace cut a Vue template at the first closing tag and left a broken fragment in WorkshopRuns.vue; I read the diff and repaired it.
    solution: Rewrite whole component templates with the Write tool instead of slicing by string index.
    severity: nit
  - description: Reading Glass Box layer files loaded about ten unrelated rules (mermaid-lanes, mdc-when-to-use, adr-0021, adr-0025, adr-0030) into context.
    solution: Narrow the paths of mermaid-lanes.md and mdc-when-to-use.md to files that hold diagrams or content components.
    severity: nit
  - description: I only noticed ADR-0004's 'behaviour no test can observe' exception after the fix PR's gate was green, then had to add e2e assertions and a second verdict.
    solution: Ask which test would fail if this regressed when planning each fix, before opening the PR.
    severity: nit
