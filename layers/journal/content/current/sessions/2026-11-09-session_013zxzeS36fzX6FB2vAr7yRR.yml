learnings:
  - A Space's `terms` Collection can be a git symlink to another Space's terms folder, as drafts does, which gives the workshop `:term` chips with no new Collection or field.
  - 37 of 73 page names in the Glass Box curate run entries are stale stems of renamed pages, so any link built from them 404s unless checked against the update-checks list.
ideas:
  - Add a Glass Box check that every page stem named in a workshop run entry still exists or is mapped to its new stem, so run history stays linkable instead of rotting after renames.
  - Fold the homepage tile note, the workshop intro and the guide's one-line 'what is this' into a single source so a tile note and its target page cannot drift apart again within hours.
  - On the drafts landing, when the Space is empty, show 'No drafts right now' with a link to the workshop's ideas instead of an empty index with a Draft banner (visitor finding, single reporter).
  - Make code blocks on narrow phones show a right-edge fade so truncated lines such as 'payloa' read as scrollable (guide lesson excerpts at 390px; two visitors hinted, not verified).
