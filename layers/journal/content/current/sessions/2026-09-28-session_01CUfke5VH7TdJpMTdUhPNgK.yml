  - description: Even working from primary sources, two fact-check rounds found 10 defects, mostly paraphrase drift introduced by the plain-language rewrite (seconds became minutes, one line vs several passages, network-level block vs refusal).
    solution: Fact-check after every rewrite, diff-scoped; plain-language paraphrase is a rewrite and needs its own check. Encoded in midden-catalogue step 4.
    severity: moderate
  - description: the-current-cut.md says the content-engine patch lasted until upstream made it unnecessary; its own artifact says it was given up rather than fork a vendor build. Pre-existing doc contradiction.
    solution: "Re-read ADR-0019 and the removing commit, then fix whichever of the two is wrong. Flagged in PR #1470, not fixed there."
    severity: moderate
  - description: gate:scoped ran before the last prose-only review fixes; only validate:content re-ran on the final tree.
    solution: Acceptable for prose-only edits, but start the gate after the final review round when time allows.
    severity: nit
  - description: Plain `git log --diff-filter=AD -- path` returned nothing for files added and deleted within one PR; history simplification hid them until --full-history.
    solution: Note in midden-survey SKILL.md that manual follow-up of intra-PR corpses needs `git log --full-history`.
