outcome: "Dropdown (2-14 days, ?days=) filters clusters, frictions and solutions; PR #2325 merged"
summary: "Human-instructed: the owner asked for a dropdown on the Journal's Friction Ledger page to show only clusters, frictions and proposed solutions from the last 2/3/5/7/10/14 days. Before building, I asked four questions and the owner chose: count back from today on the viewer's clock (I had recommended the newest occurrence); recompute counts, severity and placement from in-window occurrences and hide empty clusters; keep merged PRs and fix state on full history; keep the window in ?days=. Agent-initiated: the window start uses the prune horizon's arithmetic (today minus N, so \"last 2 days\" includes 3 dates), and the prune script's horizonStart now calls the shared helper. The server's date renders first and the browser's date replaces it on mount, to keep hydration clean under ADR-0028's cache. Open judgement calls for the owner: UTC vs local date, the off-by-one convention, and a pill that can read \"2 since last fix\" beside a count of 1 (a result of keeping fix state on full history)."
