frictions:
  - description: Ran pnpm gate:scoped before committing and running code-review, against pr-workflow.md's order (gate last on the final head); harmless only because review led to no edits.
    solution: Read pr-workflow.md before starting the gate, not before the push; CLAUDE.md's trigger 'before you push' came too late for the gate step.
    severity: minor
  - description: A foreground pgrep wait loop for the background gate hit the 600s timeout and was moved to background; the gate's completion notification would have sufficed.
    solution: Wait for the background task notification instead of polling.
    severity: nit
  - description: Chose 'last N days' = today minus N (N+1 dates) to match the prune horizon instead of the plain reading; the owner had to correct it after merge, costing a follow-up PR.
    solution: When a boundary convention is ambiguous and the user prefers questions, ask before building or at least before merging, rather than flagging it afterwards.
    severity: moderate
  - description: "Subscribed to PR #2326 by guessing the next PR number before reading create_pull_request's result (#2327); had to unsubscribe and resubscribe."
    solution: Subscribe only after reading the PR number from the create result.
    severity: nit
  - description: First follow-up push with --force-with-lease was rejected as stale info because the merged PR's branch had been deleted on the remote.
    solution: After a merged PR, run git remote prune origin before pushing the restarted branch (the hook hint said so).
    severity: nit
