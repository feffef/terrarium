summary: "Human-instructed: the owner asked for a dropdown on the Journal's Friction Ledger page to show only clusters, frictions and proposed solutions from the last 2/3/5/7/10/14 days. Before building, I asked four questions and the owner chose: count back from today on the viewer's clock; recompute counts, severity and placement from in-window occurrences and hide empty clusters; keep merged PRs and fix state on full history; keep the window in ?days=. PR #2325 merged after CI went green (ADR-0004, no Human-only paths). Agent-initiated, and wrong: I made the window start at today minus N to match the prune horizon, so \"last 2 days\" showed 3 dates. I flagged it as a judgement call in my report, but merged before the owner answered. The owner then said they didn't expect the 18th under 2 days (human-instructed fix). PR #2327 (merged after green CI) makes N days cover exactly N dates; the prune keeps its 15-date horizon by asking the helper for one date more. Still open for the owner: UTC vs local date, and the \"since last fix\" pill counting all 14 days."
