frictions:
  - description: "The survey subagent's tracker screen found #824 (an identical, already-closed force-with-lease friction) in its own exact-string search results but dismissed it as \"unrelated\" without reading the issue body, so it mislabeled a regression as \"never fixed.\" Caught only because I independently re-verified each candidate's classification before filing."
    solution: "This is a repeat of exactly the failure issue #854 already warns about (exact-string miss alone is insufficient — do a nearby-issue eyeball, read the body). The subagent's brief already included that instruction; it just didn't follow it here. Worth reinforcing in the survey brief that \"nearby hit found in search results\" specifically means read that hit's body before ruling it unrelated, not just judging by title."
    severity: moderate
  - description: 'Meant to relay live evidence to the still-running #983 investigation subagent via SendMessage, but called the Agent tool instead (wrong tool for "send a message to an existing agent") — spawned a redundant duplicate agent that had to be stopped with TaskStop before sending the correct SendMessage.'
    solution: "Caught immediately (the Agent-tool result clearly showed a fresh agentId with no relation to the target), cost one wasted agent spin-up plus a TaskStop call. No lasting harm, but worth remembering: to inject new context into an already-running background subagent, use SendMessage to its agent id, never a fresh Agent call."
    severity: minor
  - description: One dispatched impl agent's worktree started from a stale base relative to origin/main (origin/main had moved during the investigation) and had to rebranch mid-session to carry its changes over.
    solution: Already a documented sharp edge in dispatch-subagents/SKILL.md ("verify HEAD before any commit... rebranch explicitly if it doesn't") — the agent followed that guidance correctly and self-recovered. No new fix needed, just confirms the existing guidance earns its place.
    severity: nit
