frictions:
  - description: Read ADR-0012 and the pingback rules only after saving the post and stub, when the post-edit hook named them.
    solution: Have the blog-post Skill's step 7 name ADR-0012 before the stub is written, since the rule loads on the first edit.
    severity: nit
  - description: Fact-checker found I wrote three new ledger entries where the issue lists three occurrences under one entry; cost a fix commit and a re-check.
    solution: Re-derive a count's unit from the source line when drafting, not only its number.
    severity: nit
  - description: Ran the code-review Skill twice (two Standards plus Spec rounds) because a one-sentence fix landed after the first and merge-pr needs the head named.
    solution: Draft the final wording before the first review, or let a simple fix after review pass on an own read.
    severity: minor
  - description: "The first merge-pr.ts run was refused: my code-review call had args 'origin/main' only; the printed call includes a '(reviewing head <sha>)' part I read as commentary."
    solution: Paste the printed call whole; have verdict-line print the args alone on their own line so nothing looks optional.
    severity: minor
