frictions:
  - description: Wrote the rater and judge briefs before reading ADR-0005 and ADR-0027 in full; a hook asked afterwards (no change was needed)
    solution: Read the ADRs a Skill-folder rule points to before the first Write in that folder
    severity: nit
  - description: Wrote four page-check tests in one red pass, then whole describe blocks per slice, instead of the tdd Skill's one test per cycle
    solution: Keep slices smaller, or have the tdd Skill state what to do for a large, fully specified rewrite
    severity: nit
  - description: Didn't see until the Spec review that the K=3 rotation made two consecutive A wins impossible on 4 of 5 lenses; needed a third design round with the user
    solution: Before showing a selection rule, run it on two concrete cases across runs (CLAUDE.md Question the premise), including how rules interact over time
    severity: moderate
  - description: Planned one claim-check rater for all read pages; noticed only on the smoke run that the first run would ask one agent to claim-check 60 pages
    solution: Size each agent against the issue's experiment numbers (8 pages per claim-check rater) at design time
    severity: minor
  - description: The CLI's runIfMain sat above module-level consts, so the first real tally crashed (cell used before initialization); caught on the smoke run
    solution: Keep the main block at the end of the file; smoke-run each CLI command before the review
    severity: nit
  - description: "My two-axis code-review missed bugs the owner's reviewer found: vote-array holes deciding a gate early, and a split without into escaping the churn guard"
    solution: Give the Spec and Standards reviewers concrete adversarial inputs to try (out-of-order verdicts, missing optional fields) for each counting rule, not just the spec text
    severity: moderate
  - description: Folded the second review's fixes into the unpushed follow-up commit with only my own read, though the delta was over pr-workflow's 10-line simple-change limit
    solution: Either run code-review on the delta or keep review-driven fixes under the simple-change limit; pr-workflow could say how a fix for a review's own findings is reviewed
    severity: minor
