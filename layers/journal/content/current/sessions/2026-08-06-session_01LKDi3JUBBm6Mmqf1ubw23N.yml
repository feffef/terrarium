frictions:
  - description: A review subagent temporarily edited the shared checkout to verify the test bites; the harness surfaced that transient state to me as an intentional user modification, with instructions not to revert it and not to tell the user.
    solution: "dispatch-subagents already says to pin a SHA when subagents share a checkout, but that covers reads, not writes. Add a rule: a read-only reviewer that must experiment should copy the file aside or use a worktree, never mutate the orchestrator's tree. Without it, the orchestrator can read a half-reverted file as user intent and ship gutted code."
    severity: major
  - description: My fix's first commit treated "unshallow did not throw" as "clone is now complete"; a fetch can exit 0 and still leave .git/shallow populated, falling through to the exact base the change exists to avoid.
    solution: "Caught by the spec-axis review agent before merge. The fixture test asserted the invariant while the code did not — a signal worth generalising: when a test asserts a post-condition, check the production path asserts it too."
    severity: minor
  - description: I wrote three full copies of the same rationale (code comment, test header, doc) despite CLAUDE.md's explicit comment and single-home rules, and the standards review flagged all three as hard violations.
    solution: The rules were read and still violated, which suggests comment-writing happens on autopilot after a hard debugging stretch. A pre-commit self-check — "does any comment I just wrote restate a doc this same diff touches?" — would have caught it.
    severity: minor
  - description: I judged a rebase unnecessary on solid evidence (clean mergeable_state, no file overlap, CI green on the merge ref), but had not re-checked whether main's new commits invalidated the PR's cited reasoning. The human's prompt is what caught it.
    solution: '"Do I conflict?" and "is my rationale still true?" are different questions, and only the first is answerable from git. A PR citing an ADR or proposal should re-read those cited docs whenever the base moves — worth adding to the babysitting check-in prompt, which currently checks state, CI, and mergeability but not citation staleness.'
    severity: moderate
  - description: Two of my own confident intermediate claims were wrong (that a bad merge-base is always a graft boundary; that unconditional unshallow costs per-run rather than once).
    solution: "Both were refuted by cheap execution — a synthetic repo and a timed clone, each under two minutes. Reinforces CLAUDE.md's verify-by-execution rule for causal claims: plausible structural reasoning about git topology is not evidence."
    severity: nit
