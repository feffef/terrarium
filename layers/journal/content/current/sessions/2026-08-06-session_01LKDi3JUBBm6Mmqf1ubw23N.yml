summary: "Human asked (via /grill-with-docs, then /implement) to grill issue #849 to a decision and build it. #849 asked what the local classifier should do on a shallow clone, and argued the failure was safe because an older base only over-reports. The human chose \"unshallow on demand\" and picked each design branch; every option below that was agent-proposed with a recommendation. Grilling by construction disproved two of the issue's premises: the detection-based option is unimplementable (a wrong merge-base is an ordinary commit, not in .git/shallow, not parentless), and the diff can UNDER-report, because git diff compares endpoints, so a revert branch hides a file — a real gate hole, not wasted minutes. Shipped unshallow-when-shallow, fail-closed, CI sibling left refusing, plus a fixture regression test. After PR-open the human asked twice about rebasing; the second time #881 had landed, moving the Gate's CI half into a composite action and superseding a proposal this PR cited, so main was merged in, a stale pointer fixed, and the PR description re-synced. PR #882 merged by the human after four silent no-change babysitting checks."
