learnings:
  - git merge-base in a shallow clone can return an ordinary hydrated commit that is neither in .git/shallow nor parentless, so a bad base is undetectable without the missing history
  - git diff A..B compares endpoints, not the path between them, so an older base can OMIT a file rather than over-report it when a branch reverts an intervening change
  - git fetch --unshallow errors on a complete repository, so the is-shallow check is required for correctness, not just to save a fetch
  - git clone --depth=N over file:// is shallow only if the bare origin's HEAD points at a branch that was actually pushed; otherwise it reports an empty repository
ideas:
  - Add a `pnpm verify:no-restated-docs` gate step that flags a comment block in a diff whose prose substantially overlaps a .md file the same diff touches. Three hard single-home violations in one commit here, all caught only by a review agent; the rule is documented, read, and still violated, which is exactly the profile of a rule that wants mechanical enforcement rather than more prose.
  - Make the review-subagent brief template mandate a scratch copy for any experiment that mutates tracked files. A reviewer proving a regression test bites is a genuinely useful move, but doing it in the orchestrator's checkout races the orchestrator's own reads and surfaces as a misleading "user modified this file" notice.
