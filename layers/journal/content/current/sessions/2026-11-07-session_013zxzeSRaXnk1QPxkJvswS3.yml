frictions:
  - description: Ran a gh api issue search before reading github-integration.md, which CLAUDE.md requires before the first GitHub operation.
    solution: The hint fires after the call; a pre-tool hint would let the read come first.
    severity: nit
  - description: Each of 17 subagent hand-backs arrived as a separate turn needing a reply, so waiting cost about a dozen near-empty turns.
    solution: Let the harness batch hand-backs that arrive together, or deliver them silently until the last one.
    severity: nit
  - description: Review briefs needed the CLAUDE.md every-brief asks pasted by hand; the dispatch-subagents Skill does not carry them.
    solution: "One line in dispatch-subagents section 3 pointing at that CLAUDE.md bullet (issue #2911)."
    severity: minor
