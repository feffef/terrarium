frictions:
  - description: Ran git log and status before reading git-conventions.md, which CLAUDE.md requires before the first non-read-only git command; a hook reminded me afterwards.
    solution: Read the three docs the Skill's first steps imply before any git call.
    severity: nit
  - description: The dispatch-read guard refused my survey brief for the literal scratch-directory placeholder name; I reworded and resent, one wasted call.
    solution: Fill the placeholder in the Skill's dispatch step or let the guard allow a named reference.
    severity: nit
  - description: Chained a trailing ampersand onto a run_in_background gate command; the double-background guard refused it and I resent.
    solution: Background a gate with the tool flag alone.
    severity: nit
  - description: The tenant-glossary guard refused a one-line Edit to a Journal ledger YAML until I read the Journal glossary; the file is data, not Tenant prose.
    solution: Exempt content/current/frictions data files from the tenant-glossary guard.
    severity: nit
  - description: SKILL step 5 says to review the ledger PR by the simple-change test, but a 65-file data diff always fails it, so I ran full two-agent code-review on YAML.
    solution: Say whether ledger-only PRs count as simple, or give them their own review step.
    severity: minor
  - description: survey-brief step 3 asks to confirm every never-fixed or regression label, but the survey subagent could confirm only a few of roughly 150 candidates and labelled the rest unconfirmed.
    solution: Limit confirmation to the top-ranked candidates in the brief.
    severity: minor
  - description: "Survey brief step 2 says to end each summary with see: related entries while stored summaries do not carry it; the subagent wrote then removed it."
    solution: "State that see: is derived and never stored."
    severity: nit
