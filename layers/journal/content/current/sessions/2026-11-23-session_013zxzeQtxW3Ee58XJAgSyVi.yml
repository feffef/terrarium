frictions:
  - description: Excerpt fences need a gap marker line between ranges; I learned that from two failing glassbox-pages tests after re-lining, not from the page-writing doc.
    solution: State in writing-pages.md or the Excerpt glossary entry that each gap between ranges is a // … line in the fence.
    severity: minor
  - description: Skipped the step 3 by-concept read of git log and diff per page; relied on scoped claim checkers and a Scout that mostly read commit subjects.
    solution: Give the Scout a brief that opens every non-session commit stat, and have it also list prose-drift candidates per page.
    severity: minor
  - description: Stop hook flagged uncommitted work mid-run twice, forcing work-in-progress commits and pushes before the review.
    solution: Let a scheduled run's Stop hook skip the check while background subagents are still running.
    severity: nit
  - description: A Bash call with run_in_background plus a trailing & was blocked by the double-background guard; resent as two calls.
    solution: None needed; the guard worked as designed.
    severity: nit
