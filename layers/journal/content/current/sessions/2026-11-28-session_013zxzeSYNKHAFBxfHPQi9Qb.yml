frictions:
  - description: My writer brief pinned the page to my own run-entry commit, which is not on main, so the page test failed until the writer re-pinned.
    solution: Tell the writer to pin to origin/main's tip (git rev-parse origin/main), never HEAD of the run branch.
    severity: nit
  - description: I called code-review with bare origin/main args and the sha guard blocked it, costing one extra call.
    solution: Paste the whole verdict-line.ts --review-call output as args the first time.
    severity: nit
  - description: After the claim check I edited several sentences myself (front-door wording, Why bullet) and ran no second claim check on them, which step 6 asks for.
    solution: Send fixes through the writer, or run the claim checker again on the changed sentences only.
    severity: minor
  - description: The run entry's pagesRead missed four pages the change touched or overlapped; the Spec and Standards reviewers caught it, not me.
    solution: List pages the Where next swaps remove and the overlapping draft when writing pagesRead.
    severity: minor
