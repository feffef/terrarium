frictions:
  - description: "scripts/audit-skills.ts's orphan scan (readClosedPullRequestsViaGh) failed outright this run: gh api --paginate against the pulls endpoint hit the Numeric-ID proxy 403 that #848 already fixed in check-conflicting-issues.ts two months ago, but the fix (a manual curl Link-header walk, already written in this same file as readClosedPullRequestsViaRest) was never ported — pickFetchStrategy always prefers 'gh' whenever the binary is present, with no fallback."
    solution: "Filed as issue #1514: either retry via readClosedPullRequestsViaRest when the gh-path call throws, or prefer 'rest' for the pulls endpoint specifically."
    severity: moderate
  - description: "SHELL-READ-DETECTION: docsReadViaShell did not credit /home/user/terrarium/.agents/skills/audit-docs/SKILL.md, direction miss (read-but-not-credited). The dispatched 'Behaviour check: audit-docs' subagent ran `cat /home/user/terrarium/.agents/skills/audit-docs/SKILL.md 2>/dev/null || cat /home/user/terrarium/...` as its first instructed step and its report summarizes that file's content, so one side of the || genuinely read it — the detector rejected the whole command as ambiguous ('stderr suppressed, output may belong to the other side') rather than crediting either branch."
    solution: A new facet of the already-tracked SHELL-READ-DETECTION mechanism gaps in scripts/shell-reads.ts (see log-session's Inventory observations) — a `cmd1 2>/dev/null || cmd2` fallback should credit cmd1's target when cmd1 is the more specific/likely-to-succeed path, not reject the pair outright. Recording here for a future run's screen rather than filing, since it's n=1.
    severity: moderate
