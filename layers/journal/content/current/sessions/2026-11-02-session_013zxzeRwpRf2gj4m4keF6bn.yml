goal: Make the Glass Box overview's links tell readers where they lead
status: in-review
outcome: "PR 2791 open: Lesson links move into chip rows, file links get ↗, ::stop-links renamed :lessons"
summary: "Human-instructed throughout. The owner said the Glass Box guide overview mixed glossary terms, GitHub file links and Lesson links that looked alike, and proposed putting Lesson links at the end of a paragraph, as Walkthrough stops do. I asked four questions first (placement, file markers, links that are a sentence's subject, scope), then prototyped on three sections and sent screenshots. The owner asked for a design with one or more chips per bullet. I built a row under each bullet; the owner asked whether it had to be on a new line, so I built an inline version that continues on the last line and wraps one chip at a time. The owner accepted it, confirmed ↗ for file links and Walkthrough labels, and asked to rename the directive in this PR (::stop-links became :lessons). Agent-initiated within that scope: a page-checks rule that the guide overview links pages only through chips, a fix to the link-title regex (the rename exposed it), reusing glassboxLinkLabel so Journal chips get a label too, and the glossary line. The two-axis code review found a WHAT comment, a duplicated label branch, an unchipped lede, a stray count that read code, and three sentences that lost meaning; I fixed all of them. Still open: the owner hasn't said whether ↗ should appear on every Glass Box page or only the overview, and inline chips assume tight lists."
