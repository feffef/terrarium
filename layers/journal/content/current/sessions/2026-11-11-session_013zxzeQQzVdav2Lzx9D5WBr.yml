frictions:
  - description: Ran git fetch before reading docs/agents/git-conventions.md, which CLAUDE.md requires before the first non-read-only git command; a hook flagged it.
    solution: Read git-conventions.md at session start when the task will touch git; the hook hint worked as designed.
    severity: nit
  - description: Wrote the workflow script and run-summary.ts before reading ADR-0005, ADR-0022 and ADR-0027 in full; hooks prompted the late reads, none changed the edit.
    solution: Read the governing ADRs when the rule loads on first Read, before the first Edit.
    severity: nit
  - description: In the first build I cut the builder's gate:scoped log and Bash-timeout recipe while simplifying rules(); all three reviewers caught it, costing a fix round.
    solution: When rewriting a prompt, diff the removed lines and give each a reason to drop; a removed timeout is load-bearing.
    severity: moderate
  - description: First fix round introduced a fallback that lacked the workflow's rules, then one lacking picks and dir; two further re-check rounds to converge.
    solution: Before adding a fallback path, list every input the primary path receives (rules, common(b), args) and check the fallback gets each.
    severity: minor
  - description: I argued the orchestrator should review simple fixes itself to save a reviewer resume; the owner pointed out its large context makes that far costlier.
    solution: Cost a step by the context of whoever runs it, not by the work it does; the orchestrator's context dominates.
    severity: minor
  - description: A python string-replace script failed on a slice boundary (substring not found), and save-handback failed once because its output folder didn't exist.
    solution: Edit with the Edit tool for multi-hunk changes; mkdir -p the scratch subfolder before save-handback.
    severity: nit
  - description: My triage-change proposal hid the builder's decisions in triage.md, which the orchestrator may not read, so it could not tell which reviewers to resume; two reviewers caught it.
    solution: When an orchestrator may read only replies, check every decision it must make has its input in a reply.
    severity: minor
  - description: Piped log-session.ts --author output through head twice, against the close-session and log-session rule never to filter it; a refusal or warning could have been cut off.
    solution: Run log-session.ts bare; the rule is in both Skills, so read their last line before the command.
    severity: minor
