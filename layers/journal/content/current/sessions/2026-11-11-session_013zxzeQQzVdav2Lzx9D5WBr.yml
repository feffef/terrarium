learnings:
  - Each orchestrator turn re-reads its whole context, so in a long clear-backlog session one tool call can cost more than a resumed 71K-token subagent turn; push reading work to agents.
  - A workflow script cannot learn its own agents' ids; the run journal's started lines map labels to ids, which the main session can use to resume them.
ideas:
  - Add a run-summary.ts mode that prints the build workflow's rules() for a branch, so a fallback agent gets the exact rules text without reading the workflow file, and a test can assert the fallback brief and the resume brief share one source.
