goal: Redesign the clear-backlog build and review loop to reuse agents
status: completed
outcome: "PR #3119 merged: builders and reviewers are resumed by id, the builder triages findings, and fresh rounds use the default model"
summary: "Human-instructed throughout. The owner asked me to read issue #3110, ask its author session once for more detail, and check the test session could be reached; both sessions answered, and I added the author's numbers to #3110 in one comment. The owner then asked for a redesign of clear-backlog-build: priority 1 reuse builders for fixes, priority 2 reuse reviewers for smaller fixes, a fresh reviewer pair for hard or large branches, and fewer gate runs. On the owner's instruction a Fable design agent proposed the mechanism and asked for four read-only experiments, which I relayed to the test session and the #3110 author; experiment A showed finished workflow agents resume by id concurrently. The owner settled the decisions in session: gate once at the end, fresh reviewers (not a fresh builder), the orchestrator judges which findings get fixed, the orchestrator never reviews a fix itself (the owner pointed out its large context makes that the costlier option, overturning my own cost argument), fresh pairs while a round has a major with a cap of 3, a round-3 major waits for the owner's merge, and the Skill keeps the chat quiet but raises owner items and repeats unanswered questions. The owner gave the build go-ahead and the review process: Fable checks the vision, two Opus code-review agents review, and the PR opens only once all agree. That took three fix rounds, each re-checked on its delta (the same re-check the new flow prescribes); all three returned CLEAN on 0e5cc4a and gate:scoped passed. After the PR opened, the owner called orchestrator triage on finding titles alone the weak spot of the design and chose that the builder triages by kind instead; the design agent amended it so reviewers judge fixes and refusals but not skipped nits, and three more delta-re-check rounds (gaps: which reviewers to resume, a NEEDS-OWNER reply dropping the sha range) led to agreement on 8039519 with CI and local gate green. The owner then decided fresh rounds 2 and 3 run on the default model and told me to merge after that change; it was reviewed on its delta (one test cleanup), gated, and merged as f53dbcb. The Glass Box pages that describe the old loop are pinned and left to glassbox-curate."
