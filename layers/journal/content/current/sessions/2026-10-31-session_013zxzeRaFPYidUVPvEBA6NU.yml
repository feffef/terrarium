frictions:
  - description: The dispatch-read guard blocked my first Agent call until I read dispatch-subagents SKILL.md; I had read the git, GitHub and PR docs but not that Skill before briefing.
    solution: Name dispatch-subagents in the blog-post Skill's step 6 so it is read before the first brief.
    severity: minor
  - description: A commit message heredoc carried a placeholder Claude-Session id; the commit-msg hook replaced it, but I should have used the id from the attribution reminder.
    solution: Copy the trailer from the system reminder verbatim.
    severity: nit
  - description: One grep chained after a cd left the shell cwd in layers/blog/content for a command, so relative paths broke until I used absolute paths again.
    solution: Use absolute paths and git -C instead of cd.
    severity: nit
  - description: My first Karen draft stated a one-second close and a two-day gap from a secondary source (an issue body); the fact-check found GitHub's events say two seconds and 28 hours.
    solution: Take timestamps from the events API or the PR's merged_at when drafting, not from another issue's prose.
    severity: minor
  - description: A round of fact-check, review and re-check ran twice (once per post), and the second post needed a full rewrite after the first checker pass; about eight subagent calls in all.
    solution: Pull the timeline events for any claim about issue open/close timing before drafting.
    severity: minor
