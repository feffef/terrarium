frictions:
  - description: "Setting the 53 KB PR body: my python write and gh api PATCH were chained, the provenance guard blocked the whole command, and its 'file could not be read' message sent me to retry other paths twice"
    solution: Write the body file in its own call before the gh api call; the guard message could say the file does not exist
    severity: minor
  - description: "CLAUDE.md says read triage-labels.md before filing an issue; I only grepped it for needs-triage and filed #2786 first"
    solution: Read the doc whole before the first issue_write; the hook reminder arrived after the call
    severity: nit
  - description: The PR body must hold the whole tally, so it is 53 KB and too large to paste through the MCP tool; I set it with gh api from a file instead of MCP
    solution: Let grades.ts write a PR-body file and let the provenance guard accept gh api --input from the scratch folder, or have the Skill keep the full tally in a details file
    severity: minor
  - description: Official-docs URLs content.nuxt.com, v3.zod.dev, vitest.dev and docs.github.com were blocked by the proxy; the queryCollection Full reference stays unverified over the network
    solution: Allow those hosts in the environment's network policy, or fetch docs sources the way EVERY-PAGE describes
    severity: minor
  - description: The query researcher gave the Journal Excerpt range as 33-43; it is 33-42, and the writer lost a test run finding it
    solution: Researchers check an Excerpt range with cat -A for a trailing blank line
    severity: nit
  - description: Several subagents ran git log/show before reading docs/agents/git-conventions.md, which CLAUDE.md requires first
    solution: Name git-conventions.md in the rater, researcher and writer briefs' read-first lists
    severity: nit
  - description: The Stop hook asked me to push about ten times while writers and the gate ran; each nag cost a turn explaining that ADR-0004 holds the push
    solution: Let the stop-hook git check skip a branch with no PR yet whose gate:scoped has not run
    severity: minor
