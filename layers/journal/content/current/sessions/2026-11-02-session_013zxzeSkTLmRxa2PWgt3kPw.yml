outcome: "PR #2787 merged: 6 pages raised, 3 drafts promoted to the guide, grades recorded"
summary: "Run of the glassbox-improve Skill. The /glassbox-improve invocation was the only human prompt; everything after followed the Skill's steps, with no further human instruction. Three raters (sonnet, fable, opus) graded 57 guide pages. The tally found no confirmed false claim. I selected 6 pages with consensus deficits or gaps: path-scoped rules, pnpm lockfile, Mermaid pre-rendering, planning Skills, human-in-the-loop and self-improvement loop. The three oldest candidates became this run's structural steps: promote schema-only-grows (now Schema evolution), query-collection-patterns (now queryCollection) and invariants-as-tests (now Invariant tests). Three gaps on subagents, cloud-sessions and work-queue were dropped by the churn rule and marked read-by-all. The 05+09 prune re-cut was done as 09's deficit fix, because Pruning instructions already holds every verdict rule. Three sonnet researchers measured each draft at 15-30% to change, so all three were promoted. Eight opus writers worked in worktrees; I merged them and made the join edits only where a Where next list had room. code-review (Standards and Spec) found one hard cite-form breach and several repeats, all fixed in one round; the rest were refused with reasons in the PR body. gate:scoped passed. I filed issue #2786 for the out-of-remit Subject move that opus proposed for Mermaid pre-rendering. CI went green, I posted my verdict and merge-pr.ts merged #2787."
