frictions:
  - description: prune-trial §2 steers at mechanism records, but their pointers live in guard-script comments, so a §2-compliant prune almost always escalates past the chartered prose tier.
    solution: §5 calls this "a foreseeable landing", but the tension is structural — the highest-mass candidates are the least self-mergeable. Worth stating in §2, so the tier cost is priced in when choosing, not discovered at ship time.
    severity: moderate
  - description: Rewrote a guard script's header to claim it carried the detection contract; it does not. Caught on self-review before commit, but it would have shipped a false claim in code.
    solution: "CLAUDE.md's issue #948 rule (verify a committed code comment like any other claim) already covers this; the near-miss came from editing a pointer without re-reading what it pointed at."
    severity: minor
  - description: The ledger's `proven` field is only written when the probe could NOT run, so a passing probe and a forgotten field look identical to whoever reads the entry later.
    solution: Make `proven` required with an explicit true, or rename it `probeSkipped`, so absence is never ambiguous to the session that judges the verdict.
    severity: minor
  - description: Polled the gate log by hand several times instead of waiting for the background-task notification that the harness delivers on exit.
    solution: The notification is the signal; the log tail added nothing but tokens. Wait unless the intermediate output is itself needed.
    severity: nit
