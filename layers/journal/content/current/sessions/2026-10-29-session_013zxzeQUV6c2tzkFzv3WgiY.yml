frictions:
  - description: Skill briefs and my prompts named .claude/skills paths that are links absent from the commit tree, so researchers' git show of the brief and glassbox-lesson docs failed and each retried via .agents.
    solution: Have glassbox-improve's briefs and SKILL.md name .agents/skills paths only, since agents read the base commit with git show.
    severity: minor
  - description: writer-brief.md tells a writer to repoint links in other drafts in its own commit, while my shared rules (from step 6) said the lead does it; every writer reported the conflict and the layer test stayed red per branch.
    solution: "Pick one home: let writers repoint drafts in a links-only commit, or say in the brief that the lead does, and have the Check tolerate it."
    severity: minor
  - description: "The Skill's remit takes every structural step two raters raise: 10 promotions, a new Lesson and a re-cut meant about 35 subagents against the Skill's under-10 workflow size guidance, and large token cost."
    solution: Cap structural steps per run (for example the three best by rank sum) or state in glassbox-improve that the guideline does not apply.
    severity: moderate
  - description: create_pull_request only accepts the body inline, so the 46KB PR body the Skill requires had to be read and pasted back through the model, about 25k tokens, after also trimming the tally output.
    solution: Add a body-file option to a PR script, and let grades.ts tally emit a compact PR section (changed grades, items truncated) instead of its 37KB output.
    severity: minor
  - description: My first GitHub call (search_pull_requests without fields) was blocked by the fields guard because I had not yet read docs/agents/github-integration.md as CLAUDE.md requires before any GitHub operation.
    solution: Read the doc before the first mcp__github__ call; the guard message itself pointed to it.
    severity: nit
  - description: The Stop hook asked me to push seven times while review and the gate were still pending; ADR-0004 already says to wait, but each reminder cost a turn of explanation.
    solution: Have the Stop hook skip the reminder while a branch has no push yet and a scheduled Skill's review steps are running, or point to the ADR-0004 clause.
    severity: nit
  - description: I stated in a status line that the hints and auto-imports writers had no findings; the hints writer had been sent findings. Caught and corrected in my next message.
    solution: "Check the sent-message list before summarising who got findings (CLAUDE.md: verify before you state)."
    severity: nit
  - description: Each of about 55 subagent replies needed its own save-handback.ts call and a separate follow-up check, a long chain of near-identical tool calls that bloated the turn count.
    solution: Let save-handback.ts take several agent ids and output paths at once, or save a reply automatically when its notification arrives.
    severity: minor
