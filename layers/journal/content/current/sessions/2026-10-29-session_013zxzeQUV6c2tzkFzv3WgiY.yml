learnings:
  - unimport 7.0.2 only suppresses an auto-import for a top-level declaration of the name; a declaration inside a function or a parameter does not
  - A subagent's worktree branch keeps its base commit, so a resumed writer's fix commit merges cleanly into a run branch that moved on, except where both touched the same line
ideas:
  - "Hand-promote or re-run the two held-back drafts: prune-trials (stale verdict paragraph after the rate comparison landed, comment-only Excerpt, title that fails the rule, overlap with Self-improvement loop) and schema-only-grows (about half its lines)"
  - "Proposed DECISIONS line: a gap counts as consensus only when both raters cite an A page (the tally should print the exemplar's grade so this is checkable, not judged by hand)"
  - Add guide links to the three promoted Lessons that have no inbound guide link (Engineering skills, Ubiquitous language, Out-of-scope records), from Pull requests, Asking for a change, Adding a site stop 7 and Cloud sessions, once next run's raters confirm where they fit
  - "Make glassbox-improve cheaper: have grades.ts also print the per-writer brief fill-ins (task, items, research path) and the PR body skeleton, so the lead stops hand-assembling 16 briefs and a 46KB PR description"
