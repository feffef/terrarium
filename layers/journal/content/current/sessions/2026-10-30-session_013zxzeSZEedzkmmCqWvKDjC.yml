frictions:
  - description: The dispatch-read guard blocked my first blind-read Agent call because I had not read the dispatch-subagents Skill, which CLAUDE.md requires before writing a brief.
    solution: Read dispatch-subagents at the point of the first brief, or have the blog-post Skill's step 6 name it as a pre-read.
    severity: minor
  - description: Ran several GitHub reads before reading docs/agents/github-integration.md, which CLAUDE.md requires first; a hook reminded me afterwards.
    solution: Read the doc at the first GitHub step of a scheduled run.
    severity: nit
  - description: The Stop hook asked to push five times while the review, fact-check and gate were pending, repeating text that cost turns and risked an early push.
    solution: Let the Stop hook stay quiet when a blog-post run's gate has not yet run.
    severity: nit
  - description: Misread the 28th triage option (a), an agent-run git diff step, as a check enforced by code, and built Karen's whole reply thesis on it until the fact-checker caught it.
    solution: Quote an option's own sentence next to my paraphrase before drafting a thesis on it; the checker step worked as designed.
    severity: minor
  - description: Replies drafted, reviewed twice, fact-checked and redrafted cost many subagent calls, then the second reader said no; the first reader's yes had been given on the misread version.
    solution: Fact-check a reply's load-bearing claim before the first reader sees it, as step 12 already implies.
    severity: minor
