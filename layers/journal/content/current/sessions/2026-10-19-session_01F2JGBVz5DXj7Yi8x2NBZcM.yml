summary: "The kickoff asked me to check a learning from session_01TwTc2v8Afxqc9R4NdUcNPD against code and docs, find its one home, and propose the exact edit before changing anything. I verified that routineData.ts provides and injects the shared Routine load and metric state, and that Glass Box does the same. I proposed one bullet in docs/agents/mdc-when-to-use.md, plus a reword of a neighbouring bullet. The human then approved both and asked for the Routine costs components as the example (human-instructed). I made the edit, ran gate:scoped (green) and code-review with Standards and Spec subagents (no breach). Agent-initiated: trimming the duplicated metric-switch detail the Standards review flagged, then amending the unpushed commit, pushing and opening PR 2279, which ADR-0003 requires. I kept the bullet despite a category-mismatch note, since it settles a use-MDC decision. I did not re-run the review after that small trim."
