goal: Stop accepted Friction Ledger clusters from hiding worse occurrences
status: in-review
outcome: Severity ceiling, related clusters and survey rules built, reviewed twice and gated; the PR is open and waits for a human merge
summary: "The owner reported that a major no-gate merge sat in a Friction Ledger cluster still marked accepted, and asked for acceptance to be bound to a severity or for a new cluster. Human-instructed: the acceptedSeverity design (their answers to my questions), splitting the major into merged-without-gate-or-review, leaving prepush-gate-review-skipped open, a symmetric related field with a rule per pair shown beside each candidate, migrating the prose relations, reviewing candidate pairs and the clusters that had no relation, the survey-brief rules (new linked cluster for a partial moderate-or-worse match, severity as a hint, split on a clearly different cause or harm, extra care after a split or merge), the Ledger page ceiling text, dropping see: from --candidates, and two Opus code reviews. The owner opened the PR themselves after I asked. Agent-initiated: which pairs to link and the wording of every rule, the one join (simplify-cut-drops-needed-instruction into rewrite-pass-scope-drift), moving misfiled occurrences, removing prose pointers to clusters that no longer exist, the dated breach note, and the fixes for review findings; the owner approved the lists in aggregate, not pair by pair. What surprised me: the first two rounds of related rules still held inverted or vague rules and misplaced occurrences that only the Opus reviewers found, and gate runs on an uncommitted tree kept blocking my own commits and edits. Open: PR 3405 needs a human merge because tenant.config.ts is Human-only; a Glass Box guide page still describes accepted without a ceiling and belongs to glassbox-update."
