  - "The build workflow's final gate runs on every clean review round, even when no commit followed the build agent's own gate; #2523 named this cost as an open choice and took the every-branch option."
ideas:
  - Have clear-backlog-explore mark any file a fix would touch that is listed in skills-lock.json, so a brief never tells a builder to edit an installed Skill and re-pin its hash to pass the gate.
