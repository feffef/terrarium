  - description: I stacked run_in_background with a trailing & on a gate command; the double-background guard blocked it and nothing ran.
    solution: Pass run_in_background alone with a plain foreground command.
    severity: nit
  - description: The Stop hook repeatedly asked me to push the survey agent's ledger commits while the gate and review were still pending.
    solution: None needed; the push rule correctly waits for gate and review.
    severity: nit
  - description: Survey brief's list_issues CLOSED paging is heavy; the survey agent swapped in gh api with a one-week window, so older closed-issue duplicates may be missed.
    solution: Give the survey a script that lists closed issues compactly, like list-open-issues.ts.
    severity: minor
  - description: "The third regression issue had no good candidate: the remaining moderate regressions were owner-decided or superseded, yet the Skill says to file the top three anyway."
    solution: Let the Skill skip a regression whose use case was removed or whose half the owner chose to keep.
    severity: minor
  - description: "Linked worktree(s) left with uncommitted or unpushed work at close: /home/user/terrarium/.claude/worktrees/agent-ac20f9a29706df114"
    solution: Push each, or remove it if its work is meant to be dropped.
    severity: minor
  - description: "I typed the Reviewed SHA in the #2777 verdict from memory and got it wrong; I caught it on re-read and edited the comment."
    solution: Paste the SHA from git rev-parse HEAD, as pr-workflow step 4 says.
    severity: minor
  - description: Survey and design briefs assume doc-based Frictions and a date field in list-merges-since output; both were moot or missing for a script fix.
    solution: Say which brief steps are skipped for a script fix, and add merge dates to list-merges-since.
    severity: minor
