frictions:
  - description: Called the Skill tool for frictions-to-fixes even though the scheduled firing had already inlined the skill's full body via <command-message>/<command-name> tags; the redundant call errored with disable-model-invocation.
    solution: Recognize when a scheduled slash-command firing has already delivered a skill's full instructions inline, and proceed directly from that instead of also calling the Skill tool.
    severity: nit
  - description: The survey subagent's mcp__github__search_issues hit a rate limit (403) on three consecutive back-to-back semantic-search calls during tracker screening, requiring a sleep+retry.
    solution: Pace/serialize search_issues calls rather than firing many in one turn, especially in a subagent doing heavy tracker due-diligence.
    severity: minor
  - description: search_issues does semantic, not substring, matching — several duplicate-check queries phrased close to a friction's own wording returned no near-miss result at all, so due diligence had to lean on grepping actual skill/script source instead of trusting tracker search.
    solution: Treat a search_issues miss as weak evidence only (as this skill's own instructions already say) and always corroborate with a source grep before concluding never-fixed.
    severity: minor
  - description: Two skills share confusingly close names (`triage`, an external pack skill; `auto-triage`, our own) and were both read by the same session under review — name similarity alone isn't enough to judge whether a candidate fix is off-limits under ADR-0015.
    solution: Always confirm the exact skills-lock.json key before ruling a Skill in/out of scope for a fix, never by name resemblance.
    severity: minor
  - description: "PR #1130's dispatched impl agent found that populating RESOLVED_ORPHANED_SESSIONS (#1127) coincidentally broke a pre-existing, unrelated issue-#747 regression test that reused the same real session id as a literal fixture without isolating the `resolved` map argument."
    solution: When a fix populates a lookup map keyed by real production ids (session ids, issue numbers), grep existing test fixtures for literal reuse of those same ids before assuming the change is isolated.
    severity: minor
