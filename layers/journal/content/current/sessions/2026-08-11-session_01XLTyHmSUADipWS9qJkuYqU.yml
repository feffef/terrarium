    solution: rm -rf node_modules .nuxt && pnpm install --frozen-lockfile resolved it immediately, matching the established fix. Worth a session dedicated to actually root-causing this (docs/agents/environment-caveats.md has no entry for it yet) rather than every session re-discovering the same workaround.
