frictions:
  - description: I told the user 11 issues had "no recorded rationale" on the strength of a keyword grep. The audit found 7 of those 7 were false negatives.
    solution: Don't characterise a set from a heuristic and hand the characterisation to a human as fact - either read the sources first, or label the number as unverified before it reaches them, not after.
    severity: moderate
  - description: last-comment-authors.ts omits issues with zero comments, but the sweep's eligibility rule needs the body's authorship for exactly those.
    solution: Emit a record for a comment-less issue too, with hasProvenance read off the issue body - otherwise every sweep re-derives it with ad-hoc curl.
    severity: minor
  - description: audit-skills.ts keeps its git readers module-private, so scanning orphans over a non-default window meant duplicating them in a scratch script.
    solution: Export the readers, or a findOrphanedSessionsFromRepo(days) wrapper, so a one-off scan reuses the real code path instead of a copy that can drift.
    severity: minor
  - description: That scratch scan silently returned "0 orphans" because I stubbed the record separators as empty strings - a wrong parse reads as a clean scan.
    solution: Import the exported REC/SEP constants rather than re-declaring them, which is what fixed it; a mis-parse should not be indistinguishable from a pass.
    severity: minor
  - description: Parallel dispatched agents share one scratchpad directory, so several wrote gate.log at once. One agent quoted a sibling worktree's gate run as its own, and I built a wrong causal explanation on that output before catching it.
    solution: dispatch-subagents should require an agent-unique artifact filename; two agents hit this independently, and CI was the only reason it stayed harmless.
    severity: moderate
  - description: I put e2e line numbers 148/181/219 in a dispatch brief, copied from an issue comment without checking them - a later issue had rewritten that region.
    solution: Resolve a line number against the current file at the moment of writing it, the same rule as any other identifier; the agent had to recover it by name.
    severity: minor
  - description: Python heredoc checks broke twice - once on an f-string backslash, once when a shell cd left pnpm unable to find the workspace.
    solution: Write checkers to a scratch .py/.ts file and pass absolute paths; never cd.
    severity: nit
