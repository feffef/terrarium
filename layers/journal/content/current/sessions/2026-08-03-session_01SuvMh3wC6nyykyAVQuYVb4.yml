learnings:
  - The orphan scan's real reach is set by the shallow clone, not its configured window - 7-day and 14-day runs returned byte-identical results because history floors at 2026-07-30.
  - A GitHub label update replaces the whole set, so every triage write must resend the wayfinder:* labels it means to preserve.
  - "Idempotency makes every settled issue permanently sweep-invisible: with AI-authored last activity on a non-needs-triage state, nothing re-examines it until a human speaks."
ideas:
  - 'Require an escalation receipt: nothing gets stamped ready-for-human without a machine-detectable rationale block naming which escalation trigger fired. This session spent 11 subagents and ~1.3M tokens answering "was this escalation ever justified?" - a question a structured block would answer with a grep. It also makes the backlog measurable: how many escalations cite each trigger, and which ones have gone stale because the thing that blocked them has since landed.'
  - Add a scripts/triage-eligibility.ts that emits the auto-triage eligible set directly - per open issue, its labels, the author's association, and whether the most-recent activity (last comment, else the body) carries an ADR-0017 marker. Step 1 of the sweep currently takes three tools plus hand-rolled curl to reconstruct that, and the body fallback is re-derived every run; one command would make the sweep's entry point verifiable and unit-testable the way its sibling scripts' pure cores already are.
