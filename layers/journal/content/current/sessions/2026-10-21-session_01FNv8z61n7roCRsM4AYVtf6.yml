goal: Should agents get a doc on the self-improvement loop?
status: in-review
outcome: "No new doc; auto-triage Routine wording cut, Journal and interactive map show clear-backlog (PR #2376, waits for a human merge)"
summary: "The owner asked, as an opinion question, whether a short agent doc or rule explaining the self-improvement loop (Routines fix inside their domain, file issues for the rest; clear-backlog works those issues with minimal owner input) would help agents that only see one piece. I read the Journal's how-it-works page, the Routine Skills, auto-triage, clear-backlog and ADR-0003/0022/0029 via adr-check. First I leaned toward a short path-scoped rule loading on the Routine Skills, with an \"options plus a recommended pick\" issue format. The owner rejected the pick (it could steer triage the wrong way) and asked whether this overlaps issue-filing guidance. It largely does: issue-tracker.md's \"Filing an issue\" (already linked from every Routine Skill), triage-labels.md's needs-triage -> clear-backlog line and ADR-0003 cover it, and no Friction evidence of a gap exists, so I recommended no new doc. The owner then directed (human-instructed): auto-triage will never run as a Routine and they no longer run it directly, so trim ADR-0022's \"Who starts a run\" section, and update the Journal section. I cut the Routine and /loop wording from ADR-0022, its summary rule and the auto-triage Skill, and added the clear-backlog second half to how-it-works.md. Two-axis code-review caught an inaccurate \"agents triage every open issue\" / \"merge the rest\" in my Journal text; fixed. PR #2376 is open and must wait for a human merge (ADR and rule are Human-only). The owner then asked (human-instructed) to fix the interactive map brief too; it now shows one clear-backlog session triaging, asking once and building, and a second code-review caught a dropped ready-for-human label there, fixed. Left open in the PR body: the auto-triage Inventory role and two Glass Box drafts still describe the old way."
