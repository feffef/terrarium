outcome: PR 2868 open with the cap and per-phase cost; gate green, prices not yet calibrated
summary: "Human-instructed: the owner asked to implement issue 2850 (per-phase cost in runs.yml, price-weighted shape B) and, in parallel, to limit the cost of each run by limiting the changes done per session, so later runs can be compared with the new per-phase cost without huge sessions. The owner's preference was to be asked first, so I asked: the cap counts pages per run, is enforced in grades.ts, ships in the same PR, and I should research before proposing numbers. The owner also interrupted me to say only v3 runs count as evidence. I proposed a cap of 12; the owner chose 8, with false claims counting and coming first, and steps counted inside the same budget. The owner then approved opening the PR. Agent-initiated: the USD unit and the shape of costBreakdown (the issue left the unit to the builder), the phase-mark names and phases.yml file, the dispatch-name convention in SKILL.md, putting steps right after false claims and checks in the cap order, and the review fixes. Built grades.ts capWork, a new cost.ts reading the lead's and subagents' transcripts, specs for both, and SKILL.md edits. Prices come from the claude-api Skill table because this session's transcript held no cost-state record, so they are not calibrated against a recorded costUSD and nothing was tested on a real glassbox run; the PR says so. Two-axis code review found one real bug (the lead curve counted from the transcript start), fixed in a second commit. A gate run was wasted when I committed during it."
