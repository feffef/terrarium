summary: "The user reported (screenshot from their phone) that an Atlas relations-web medallion looked cropped at phone width. Measuring the layout at the phone's size showed the geometry was fine; the \"crop\" was a darker, full-width band behind the diagram whose edge sliced a medallion's pale seat. At the user's direction the work became \"find the band\". I built two claude.ai test-page artifacts (a diagram replica with switches, then a full static snapshot of the live page); the user drove them on their moto g06. The replicas never banded while the live page did, and a pinch-zoom screenshot showed the band is tile-shaped. Pixel-sampling the user's screenshots was the decisive step: band colours equal the paper with the 5% biome tint composited ~2x and ~4x, so the translucent background layers were being re-stacked per tile (an earlier RGBA4444 hypothesis was refuted by the same samples). The user explicitly asked me to reproduce it in Chromium myself; headless Chromium across GL, Vulkan, Graphite, partial raster, low-end mode and the phone's exact compositor flags (from the user's chrome://gpu dump: Mali-G52, GaneshGL, partial raster, one-copy) never reproduced it, so I could not build the red/green loop /diagnosing-bugs requires, and said so. The user green-lit the opaque-ground fix: tint mixed into the paper via color-mix, grain drawn with opaque stops, same for the index wing cards. Gate passed; rendered colours unchanged within grain noise. The user said they will merge to test on the device. Human-instructed: the investigation, the test pages, the Chromium repro attempt, the fix. Agent-initiated: opening PR 1506 per the repo's auto-open rule."
