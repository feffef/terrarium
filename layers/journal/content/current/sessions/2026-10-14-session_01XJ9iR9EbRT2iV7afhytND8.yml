learnings:
  - In cloud list_events, harness nested_memory rule loads are invisible; only hook_response stdout shows the Bash rules hint, so harness-vs-hint duplicate checks need local transcripts
  - A Bash command that exits non-zero fires PostToolUseFailure, not PostToolUse, so the Bash rules hint skips compound reads whose last step fails
