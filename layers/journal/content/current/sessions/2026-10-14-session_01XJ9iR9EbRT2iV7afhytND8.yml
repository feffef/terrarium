frictions:
  - description: Ran git status/log in the same Bash call that first printed git-conventions.md, so the doc was read after, not before, the first git log
    solution: Read git-conventions.md in its own call before any git command beyond status/diff
    severity: nit
  - description: Read CONTEXT.md, CONTEXT-MAP.md and docs via cat in Bash despite CLAUDE.md's Read-tool rule; no rule load mattered here
    solution: Use the Read tool for repo docs at session start
    severity: nit
  - description: gh api job logs redirect to a blob host the proxy blocks; MCP get_job_logs tail only showed cleanup lines. Check-run annotations gave the cause
    solution: github-integration.md could name check-run annotations as the cheap way to get a gate failure's cause
    severity: minor
  - description: Tried ScheduleWakeup as a fallback while waiting on a subagent; the /loop-only guard blocked it
    solution: None needed; subagents self-notify, as the guard says
    severity: nit
  - description: "Labelled the ADR-0030 rewrite as PR #1909 from a merge-commit list without checking its diff; it was #1898, and #1909 only changed hash lines"
    solution: Check a merge's diff with git show --stat before naming it as the cause of a cohort split
    severity: minor
  - description: Two agents measuring the same fold share from the same class.json reported different numbers (84% vs 77% no for subagent-only); caught only because the evidence agent re-derived it
    solution: Have the evidence step re-derive every number it quotes from the saved data, as was done here
    severity: minor
