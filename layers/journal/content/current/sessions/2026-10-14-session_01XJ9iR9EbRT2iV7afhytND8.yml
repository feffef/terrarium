summary: "The owner asked (human-instructed) to run the #1778 checks about 20 minutes before the issue's 13:00Z gate, accounting for recent ADR changes, with an Explore overview and a transcript agent. Checks 1, 2c, 4, 6, 7c pass; 2a fails for tenant-layers (88%) and mdc-when-to-use (95%); 7a/7b fail for tenant-layers; check 3 found the hint skips compound reads whose last step fails (PostToolUse only); check 5's harness half is not checkable in the cloud. Human-instructed follow-ups, each run by an agent: a misses search (0 confirmed for the three rules); a new session I started, session_01CJix3AqBpX5KrAENqNp1M7, which showed rules do load in worktrees, so the #1896 empty humanOnly list was the brief, not a rule miss; an ADR-pointer check (0 agents followed \"read the full ADR first\", with or without the line count); a verdict reliability check (37 of 40 verdicts correct, 2a stands); and a fold check (subagent-only rules are rated no far more often, but not the cause for tenant-layers/mdc). The owner then asked (human-instructed) to post a summary and file one detailed issue per finding: an evidence agent gathered excerpts, I filed #1937-#1944 and posted the summary on #1778, leaving its closure to the owner. The evidence agent's recount of the fold numbers (77% vs 37%) differed from the first agent's (84% vs 37%); I used the recount. I misattributed the ADR-0030 rewrite to #1909 (it was #1898) and fixed it before posting."
