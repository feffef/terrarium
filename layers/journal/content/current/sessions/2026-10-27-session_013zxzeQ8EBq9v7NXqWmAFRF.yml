learnings:
  - A merge commit's body holds the PR title, so git log --merges --grep can find a Skill's earlier runs by PR-title prefix.
ideas:
  - Let page-checks.ts warn when a guide Lesson's title changes in a PR and its previous title was set within the last N merged PRs, so title churn shows up at review time rather than in a later audit of git history.
