summary: "The owner asked for feedback on an idea: a five-line summary per ADR, loaded at session start. I read all 28 ADRs and recommended it, with changes (a flexible length, a \"read in full when\" trigger, one home per fact). At the owner's direction I dispatched one research agent per ADR. Each read the ADR's history, session logs and issues, and returned a summary, its reasoning, drift findings and sources. Mid-run the owner added the rule that summaries use simple, positive wording. The owner asked whether a CLAUDE.md import beats a hook. The docs showed a 10,000-character cap on hook output, and the summaries total about 12,000, so a hook would cut them off. On the owner's question about rules I explained `.claude/rules/`, then tested it at their request. Path-scoped rules load after Read, after a single-file `cat`, after a new-file Write, and inside subagents. Each load is recorded in the transcript as a `nested_memory` attachment, which `rulesLoaded` in the session log could use. The owner wanted agents to read full ADRs, so I tested `@` imports in rules. They are unusable: a path-scoped rule's import is not expanded when the rule loads, yet the imported file loads unconditionally at session start. The owner rejected copying ADR text and settled the design: the summary lives only in its rule file. Twelve rules end with a pointer to read the full ADR. The owner approved six wording conventions, and I wrote the 27 rules. The Stop hook asked me to commit, so I ran gate:scoped (green), pushed and opened a draft PR, as CLAUDE.md requires. At the owner's request I then edited CLAUDE.md so that it points to the rules, and ran five plan-only scenario checks in fresh headless Sonnet sessions, judged from their transcripts. All nine always-loaded rules arrived in every session, and the path rules for 0012 and 0026 fired. The mermaid rule did not fire on a content edit, but the CLAUDE.md grep step found ADR-0024. No session over-read the full governance ADRs, and every plan was right. The owner chose to keep the full-read line on ADRs 0003, 0004, 0009 and 0020 and watch real sessions. The owner then asked for the sync check and the field in this session. Each rule carries its ADR's hash in frontmatter that Claude Code ignores, and scripts/validate-adr-rules.ts in validate:content fails when an ADR changes without its summary being re-stamped. The extractor now derives rulesLoaded and the schema accepts it, but the stitch does not write it yet: this session's log lands on main through this branch's scripts, and main's strict schema would reject the field. At the owner's request I then cut from CLAUDE.md every line the rules now carry, then moved every remaining ADR-backed line (PR auto-open, gate discipline, the Human-only list, close-session timing) into its ADR rule and fixed the pointers to it: 147 to 89 lines. Still open: the one-line follow-up that writes rulesLoaded after merge, and the ADR drift findings, which need human decisions. All design choices were the owner's; the split into always-loaded and path-scoped rules, the trap lines added to four rules and opening the PR were my proposals or CLAUDE.md defaults."
