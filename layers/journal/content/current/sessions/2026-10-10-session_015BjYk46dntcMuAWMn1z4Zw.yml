learnings:
  - Hook output (SessionStart stdout, additionalContext) is capped at 10,000 characters; anything longer becomes a file path plus a 2,000-character preview.
  - Path-scoped `.claude/rules/` load after the triggering tool result, so for a new file the rule arrives only after the Write.
  - "`@` imports in a path-scoped rule are not expanded when it loads, but the imported file loads at session start regardless of paths."
ideas:
  - "Add `rulesLoaded` to the session trace: collect `attachment.type == nested_memory` paths in scripts/session-trace.ts as an optional schema field, so audits can see whether a rule fired and whether the full ADR was read after it."
  - "Gate check: a PR that changes docs/adr/NNNN-* must also touch .claude/rules/adr-NNNN.md, so summaries cannot go stale silently."
  - Report the rules-import behaviour (imports of path-scoped rules load at startup, not on trigger) to Claude Code via /feedback.
  - Have scripts/log-session.ts --land also validate the entry against origin/main's shared/schemas/session.ts, so a branch that adds a session field cannot land a log main rejects.
