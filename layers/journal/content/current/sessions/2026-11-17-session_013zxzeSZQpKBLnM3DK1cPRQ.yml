frictions:
  - description: Ran my first non-read-only git command before reading git-conventions.md; the post-hook told me to read it first. No harm, nothing in it changed my call.
    solution: None needed; the hook already catches it.
    severity: nit
  - description: The dispatch-read guard blocked my first survey brief because it named the curly-brace scratch placeholder literally; I reworded and resent.
    solution: Have the Skill's briefs say how to fill the placeholder without quoting it, or let the guard ignore a quoted one.
    severity: minor
  - description: Survey brief tells the agent to pass --merges-only to list-merges-since.ts, which rejects that flag; the survey agent filtered by hand.
    solution: Fix survey-brief.md section 3 to match the script, or add the flag.
    severity: minor
  - description: "The survey labelled verdict-line-asserts-unchecked-review never-fixed though open issue #3395 covered it; I found it only by reading the open-issue titles myself."
    solution: Survey brief should match each new entry's session against open issue bodies, not only titles and a keyword scan.
    severity: minor
  - description: "I wrote an unverified session reference into regression issue #3401, then had to rewrite the body after reading the ledger."
    solution: Pull occurrence sessions from the entry file before drafting the issue.
    severity: nit
  - description: "SKILL section 5.4 asks the simple-change test on a ledger PR whose generated diff spans 58 files, so it can never pass (already tracked in #3397)."
    solution: Say a generated ledger diff gets the gate plus a read of the decisions commit.
    severity: minor
  - description: "Survey agent: ledger append refused three already-held session triples after --unledgered, and it first typed the commit-trailer session id by hand; design agent: audit-skills output dumps 66KB, no path lookup for trial territory, no guidance when every pick is no change."
    solution: Add session-level pre-filtering to --unledgered, a doc-counts mode for audit-skills, and a no-change clause in design-brief section 6.
    severity: minor
  - description: The Stop hook flagged uncommitted ledger changes while the survey agent was still mid-run; I had to check status to see they were the agent's.
    solution: None needed beyond waiting; the hook can't see subagent work in progress.
    severity: nit
