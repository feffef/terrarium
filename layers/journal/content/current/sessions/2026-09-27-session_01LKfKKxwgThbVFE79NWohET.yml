frictions:
  - description: Workflow engine caps concurrency at CPUs-2, which is 2 on this 4-CPU container, so 20 drawings queued two at a time
    solution: Stopped the workflow and fanned drawings out as parallel Agent calls; note the cap in workflow-authoring or check nproc before choosing the engine for wide fan-outs
    severity: moderate
  - description: All ten parallel Fable illustrators died on a session usage limit (HTTP 429) mid-drawing; resumed after reset via SendMessage
    solution: Budget model usage before fanning out many Fable agents; scratchpad banking of passes made resumption cheap
    severity: moderate
  - description: tinkerfund-campaign preview.mjs sizes sheet.png at 60+330px per figure but cards render ~430px, so figures past the second are cut off; five illustrators and I each worked around it
    solution: Fix the sheet height in .agents/skills/tinkerfund-campaign/tools/preview.mjs (file an issue; tool is Tenant tooling)
    severity: moderate
  - description: My until-loop used pgrep -f preview.mjs, which matched its own shell command line and never exited
    solution: Wait on a log completion marker instead of pgrep -f on a string present in the waiting command
    severity: minor
  - description: The stop hook demanded a commit after nearly every turn while agents were still writing, producing many WIP commits on the branch
    solution: Accept WIP commits or squash on merge; nothing to fix in the repo
    severity: nit
  - description: Fix agents occasionally introduced banned words (a fixer wrote "Ordered") and judges disagreed on the dark-theme black/white swap convention
    solution: Grep new content for order/product before landing; record the white-part dark-theme convention in ILLUSTRATION.md
    severity: minor
