summary: "The owner asked to investigate three ideas from a recent session log. Checking the code showed two were already shipped on main the same day (commit ac03730e): rulesLoaded in the trace, and ADR-rule staleness via a hash stamp (stronger than the proposed \"touch both files\" check). The third was a real gap: the lander validated a log against the branch's schema but committed it to main, whose strict schema could reject a branch-added field. I reported this and asked; the owner instructed building the third idea plus the remaining part of the first (whether an ADR was read after its rule loaded), with a rejected log refused rather than trimmed. Agent-chosen details: validate against origin/main's shared/schemas in a child process (the lander is synchronous), skip when the schema files match the checkout. PR #1748 is open. The second change (rulesFollowedUp) touches shared/schemas, a Human-only path, so it is planned as a separate PR after #1748 merges."
