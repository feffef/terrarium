outcome: "PR #1748 merged (lander refuses logs main's schema rejects); PR #1749 adds rulesFollowedUp and waits for a human merge"
summary: "The owner asked to investigate three ideas from a recent session log. Checking the code showed two were already shipped on main the same day (commit ac03730e): rulesLoaded in the trace, and ADR-rule staleness via a hash stamp (stronger than the proposed \"touch both files\" check). The third was a real gap: the lander validated a log against the branch's schema but committed it to main, whose strict schema could reject a branch-added field. I reported this and asked; the owner instructed building the third idea plus the remaining part of the first (whether an ADR was read after its rule loaded), with a rejected log refused rather than trimmed, and then asked for the second change as a new PR. Agent-chosen details: validate against origin/main's shared/schemas in a child process (the lander is synchronous), skipped when the schema files match the checkout; count only a whole Read (no offset/limit) or a shell-detector credit as following up a rule, and only after the rule's first load. PR #1748 merged on a green gate. PR #1749 touches shared/schemas (Human-only), so it waits for a human merge; it was cut on a new branch at the owner's request. Probing the extractor on this session's own transcript caught that a 30-line partial Read counted as a follow-up, which led to the whole-Read rule. I switched back to the first branch before ending the turn so this session's own log would not carry rulesFollowedUp onto a main that lacks it."
