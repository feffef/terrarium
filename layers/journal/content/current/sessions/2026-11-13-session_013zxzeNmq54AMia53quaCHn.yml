frictions:
  - description: Skipped CLAUDE.md's read-first trigger for the Platform overview before reviewing two documents that span the Platform's parts; judged the two documents and six ADRs enough.
    solution: The trigger could say whether reviewing a design document about the Platform counts.
    severity: nit
  - description: Ran git log on docs/design before reading git-conventions.md; the hint prompted a late read that changed nothing.
    solution: None needed; the call was a plain listing.
    severity: nit
  - description: The last follow-up commit changed 15 lines, over pr-workflow's 10-line limit for a simple change, and got only the author's own read, not a third code-review round.
    solution: A rule for a follow-up that only settles a re-check's listed findings would say whether another round is owed.
    severity: minor
  - description: The draft was written at about 6900 words against the owner's "about 4800"; the size was only measured after writing.
    solution: Budget words per section before writing a document with a stated length.
    severity: minor
  - description: Both reviewers launched in the background although the Agent calls set run_in_background false, so the turn ended twice to wait for them.
    solution: None found; the harness decided.
    severity: nit
  - description: The Write hook pointed to ADR-0027 as governing a new file in docs/design; the read changed nothing.
    solution: Narrow the adr-0027 rule's paths so docs/design proposals do not match.
    severity: nit
  - description: Piped log-session output through sed at the in-review close, against the Skill's rule never to filter it; only the first six lines were seen.
    solution: Run the command bare; nothing was hidden this time as far as the second run shows.
    severity: nit
