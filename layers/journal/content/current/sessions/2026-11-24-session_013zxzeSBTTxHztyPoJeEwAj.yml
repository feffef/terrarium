frictions:
  - description: Ran git push-free but state-changing git commands (apply, checkout, restore) for the sample before reading docs/agents/git-conventions.md; a hook reminded me afterwards.
    solution: Load git-conventions when the first non-read-only git command is planned, or make the hook fire before the command.
    severity: nit
  - description: subscribe_pr_activity is under mcp__claude-code-remote, but the PR text says use mcp__github tools; my first call used the wrong namespace and failed.
    solution: Name the full tool in ADR-0003 or pr-workflow.md where subscription is required.
    severity: nit
  - description: "The explore agent for #3655 posted no comment or label change; the clear-backlog check script only flags this for builds or uncommented issues, so it passed silently."
    solution: Let the --triage summary flag a grill result with no writes when the issue already had a human comment but no agent reply.
    severity: nit
  - description: PR opening for UI-visible branches needs owner confirmation of unshown text and unchanged looks; the skill gives no step to show these before the build, so it surfaces late.
    solution: Add to the clear-backlog grilling step that visitor-visible prose edits are shown as a sample sentence with the pick.
    severity: minor
