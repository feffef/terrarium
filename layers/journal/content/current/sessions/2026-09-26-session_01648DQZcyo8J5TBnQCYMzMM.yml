learnings:
  - A workflow cannot wait on an external event, so a merge handed back to the orchestrator ends the run; args-driven resume (merged/only lists) restarted it cheaply.
  - Tenant layer plugins and nuxt.config flags apply app-wide; keep them inert outside the Tenant's own opt-in.
ideas:
  - Add a per-Tenant gallery-section convention (one component file per story under components/<tenant>/gallery/) so parallel stories stop colliding on a single Gallery.vue. The six re-merge cycles in this run all traced to shared aggregator files.
  - Add a schema-level rule that figure text styles carry stroke:none and that figures never use --tf-warn, so validate:content catches both instead of relying on the skill's tool check.
