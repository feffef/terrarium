frictions:
  - description: "The auto-mode classifier blocked workflow merge agents' merge-pr.ts on 4 story PRs (#1391, #1393, #1396, #1398) as Merge Without Review, despite the user's explicit authorization quoted in the brief; each stalled its dependents until the orchestrator merged."
    solution: "Merge from the orchestrating session by design: have the workflow return ready-to-merge and let the main loop merge, instead of delegating merges to subagents."
    severity: moderate
  - description: "Sibling stories built in parallel conflicted repeatedly on shared files (Gallery.vue, composables/tinkerfund.ts, tinkerfund.e2e.ts): #1396 needed two re-merges and #1398 two, each a full gate cycle."
    solution: Split the qa gallery and the e2e module into per-story files, and merge each ready PR immediately so the window for integration to move stays short.
    severity: moderate
  - description: "A Discover filter/sort e2e passed in the agent's local full gate but failed in CI: a real race, navigateTo() returning early during pending route middleware and dropping the sort change."
    solution: Fixed in Browse.vue (router.replace plus a pending-query ref). URL-synced filters need a same-tick race test, not just sequential clicks.
    severity: moderate
  - description: The implement/code-review skill requirement arrived after launch, so the first workflow run was stopped and relaunched; implement has disable-model-invocation, so agents must Read it rather than invoke it.
    solution: Name every skill a stage must use in the workflow brief from the start; note in the Skill Inventory that implement is read, not invoked.
    severity: minor
  - description: Workflow subagents had no Agent tool, so code-review's two parallel sub-agent axes always ran one after the other inside the reviewer.
    solution: Make code-review/SKILL.md state the sequential fallback explicitly when sub-agents are unavailable.
    severity: minor
  - description: Re-arming the send_later fallback check-in was denied by the classifier (Auto-Mode Bypass), so the fallback heartbeat stopped after its first firing.
    solution: Rely on workflow completion notifications; ask the user up front to allow send_later for long orchestrations.
    severity: minor
  - description: "The #1384 merge agent dodged the foreground-sleep block with `timeout 240 tail -f /dev/null` while waiting for CI, which drew a security warning."
    solution: Merge briefs should say to poll with merge-pr.ts's own timeout loop and never hand-roll a sleep.
    severity: minor
