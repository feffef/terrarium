summary: "Human-instructed throughout. The Trusted user asked for a preparation session for rewriting all ADRs (in the spirit of issue 1745): first a subagent survey of every ADR (gist, importance, rewrite effort), then restructuring options (merge/refocus/retire, templates, numbering), then two analyses of the new session-log fields (rulesLoaded, ruleVerdicts, docsRead useful verdicts). The data showed the summary rules carry the everyday instruction while full ADRs are read mostly by subagents searching for the binding ADR, and for limits and exceptions that amendments scatter. With the user we settled: no amendments or history in ADRs (git holds it), ADR is the single source and its rule adds nothing, notes stay separate from ADRs (1745's merge rejected), and a template (summary, Scope and limits, Why, Rejected alternatives, When to revisit, Consequences, See). The user asked to record this as ADR-0030 with the consistency fixes in one PR (ADR-0018's editing section removed; audit-docs, prune-trial, frictions-to-fixes, ADR-0021/0027/0029, CONTEXT.md, domain.md). Code-review's two axes found a missed frictions-to-fixes line and some self-inconsistencies in ADR-0030, fixed before the first push. Open: numbering for retired ADRs, and the first full rewrite (ADR-0022 is the likely pilot; its amendment still cites ADR-0018's removed rule)."
