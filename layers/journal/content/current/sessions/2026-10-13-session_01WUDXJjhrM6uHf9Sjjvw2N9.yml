outcome: "ADR-0030 and prune-trial scope change in PR #1892; rewrite process tested over five prompt versions; handoff written for a review session"
summary: "Human-instructed throughout. After PR #1892 (ADR-0030, how we write ADRs) went up, the Trusted user steered a test of the rewrite process: ten background agents rewrote ten ADRs into the new format (scratchpad only), a reference collector found every live reference to each ADR, ten blind agents (never reading the ADR) built checklists of what callers need, and a comparison showed the rewrites missed caller-held limits and changed quoted wording. The prompt went through five versions on 0004 and 0022: callers mapped (v2), plain language over quoted wording (v3), natural language over glossary terms, short sentences, a 40-70 line guide and current rules (v4), guarantees not mechanics (v5, 0004 at 63 lines from 237). At the user's request ADR rewrites were taken out of Prune Trial scope (ADRs, Skill, docs, and merge-pr.ts --prune-trial removed), ADR-0030 was renamed and given the heading format \"# ADR-NNNN: Title\", and ADR-0029 now states a summary rule's two jobs. All working files sit in docs/adr-rewrite/ on the PR branch, to be pruned later. A final grilling round settled the goal; answers are in docs/adr-rewrite/decisions.md and the next session starts from docs/adr-rewrite/HANDOFF.md. Nothing merged, by the user's instruction."
