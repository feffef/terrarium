    solution: Document it in dispatch guidance; the handoff records it
    severity: minor
  - description: First rewrite prompt kept quoted wording and glossary terms, producing jargon-heavy ADRs the user rejected; three more prompt rounds were needed
    solution: State plain-language and length goals up front; done in prompt v3-v5
    severity: moderate
  - description: Launched ten rewrite agents writing in place before confirming where output should go; the user rejected the launch
    solution: Confirm output location before parallel dispatch that touches the working tree
    severity: minor
