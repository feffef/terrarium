frictions:
  - description: The user typed /blog-post but the Skill tool refused it (disable-model-invocation), so the workflow had to be read from disk and run by hand; the Skill text anticipates this, the harness does not.
    solution: Let a user-typed slash command expand even when model invocation is disabled, or document in CLAUDE.md that a refused user-typed Skill is read from .agents/skills/<name>/SKILL.md.
    severity: minor
  - description: "Broke CLAUDE.md's Read-not-cat rule for most reads: the harness's auto-mode instruction told me to use Bash for reading, so the derived docsRead undercounts and only output-matching credits the shell reads. No wrong action resulted."
    solution: "Resolve the conflict in one place: either the auto-mode harness text exempts instruction docs, or CLAUDE.md names the shell-read detector as the accepted fallback."
    severity: minor
  - description: "Skipped CLAUDE.md's verify-before-you-state rule once: the first PR body named David's post's PR as 1684 from memory; recent-prs.ts showed 1685. Corrected within minutes, but it was public for that window."
    solution: Run recent-prs.ts for every PR number before it goes in a body; a number not in a tool result this turn is not a fact.
    severity: minor
  - description: Ran git fetch and git log in the same parallel batch as the git-conventions.md read, so the doc was not read strictly before the first history-drawing git command, against CLAUDE.md's trigger. No cost this time.
    solution: Put the first doc read in its own round before the first git command it governs.
    severity: nit
  - description: Pushed and opened the PR after the gate but before the fact-check subagent reported, out of the blog-post Skill's step order, under repeated Stop-hook push reminders; the PR body carries no tally yet.
    solution: Treat the Stop hook's push nag as noise while a dispatched checker is running, or have the hook honour a pending-check marker in the scratchpad.
    severity: minor
  - description: claude-code-remote list_events pages newest-first and the pages are large, so verifying what another session read cost a long subagent run and still could not reach a subagent's first ~23 tool calls.
    solution: An oldest-first or kind-and-text filtered query, or a script that answers 'did session X Read path P, and with what offset/limit' from the trace.
    severity: nit
  - description: The independent fact-check subagent (Sonnet) stalled after 19 tool calls with its last transcript entry a tool result, never handed back, and was then stopped from the owner's side; the blog-post Skill's mandatory step 9 ended with a self-check instead of an independent tally.
    solution: Give the checker a time budget and a partial-report instruction, or split the claim list across two smaller checkers so one stall does not lose the whole step.
    severity: moderate
