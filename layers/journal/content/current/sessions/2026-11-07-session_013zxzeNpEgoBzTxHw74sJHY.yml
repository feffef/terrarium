summary: "The owner invoked glassbox-curate with no focus. I asked, and they answered in their own words: find Lessons whose primary docs were blocked in earlier runs, read the docs now that the network is open, fix the Lessons from what the docs say, and add deep links (human-instructed). Choosing which ten was my call (agent-initiated), made from PR bodies #2034, #2041, #2044, #2500, #2763 and #2787, which name the blocked sites. I did not confirm the ten with the owner before building. Five opus writers (one per page group) fetched the docs, corrected claims and added links; a sonnet claim checker, a sonnet fresh reader, and a two-axis code-review followed. The claim checker's one false verdict (Vue hydration re-patching bound attributes) was wrong: Vue's source re-patches dynamicProps and class/style are not in them, so I left that older sentence. The Standards reviewer made me cut the memory page lead and drop a publishedAt I had added to Content database; the Spec reviewer's missing-pagesRead list was read by one reader (no contradiction) and recorded. Open for later runs: the other Nuxt & Vue, Verification and Git & GitHub Lessons still rest on non-docs sources (memory page). Run cost was 10.32 USD at PR time. I posted my verdict and merged it with merge-pr.ts once the gate was green."
