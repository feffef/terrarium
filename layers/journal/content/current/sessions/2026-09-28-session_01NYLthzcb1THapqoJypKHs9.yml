frictions:
  - description: "PR #1459's impl agent wrote a fixture test asserting `git init`+`remote add`+`fetch` never sets origin/HEAD, verified true on this dev container's git (2.43.0) but false on the GitHub Actions runner's git (2.55.0), which sets it on fetch when the remote advertises it. Passed locally, failed CI on first push."
    solution: "Root-caused from the CI log and pushed a fix myself (delete the ref unconditionally after fetch so the test's precondition holds on either git version) rather than re-dispatching. Worth a line in docs/agents/environment-caveats.md: this dev container's git version can diverge from CI's, and a fixture that depends on git-version-specific behavior should force its precondition rather than assume it."
    severity: moderate
  - description: Deciding whether a "hard" candidate touching session-trace.ts counted as "touching a guard" (CLAUDE.md's never-dispatch rule) required manually tracing session-id-guard.ts's import graph, since guards.md's roster describes guards by name/file, not by which of a shared file's exports each guard actually imports.
    solution: frictions-to-fixes/SKILL.md or guards.md could note explicitly that "touches a guard" is assessed by import graph (does the guard import the changed export), not by file identity — a shared utility file can host both guard-critical and ordinary exports.
    severity: minor
