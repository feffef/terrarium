summary: "Human-instructed throughout. The user asked for an agent audit of the Glass Box guide pages (title clarity, one concept per page, standalone), answered scoping questions and set the title rule (a short name of the general concept). After reading the report they agreed to all fixes, including the split, merge and re-cut flagged as new work, in one PR. I did the edits myself rather than dispatching, because the cross-page re-cuts and link renames touch the same files. All pages stay pinned at cfce441; the deleted or renamed URLs (subagents-worktrees, one-table-per-key, use-space) 404 now, with every in-repo link updated. Two review subagents (Standards and Spec) found real gaps: points dropped in the merge, reasons inside In Terrarium, and a wrong ADR cite. All were fixed before the gate ran. Open: CI and merge."
