frictions:
  - description: "Every guard hook crashed at session start: TMPDIR pointed at root's temp dir after a terminal suspend, so tsx failed with EACCES"
    solution: Have guard-wrap.sh detect an unwritable TMPDIR and print the restart command instead of a generic guard fault
    severity: blocker
  - description: Auto mode's classifier blocked the git commit of a guard change (Security Weaken), and then even a cat of the gate log
    solution: Expected for a guard-loosening change; the owner left auto mode. A doc note that guard edits need a human-attended, non-auto session would set expectations
    severity: moderate
  - description: Local gate:scoped went red on two Tinkerfund e2e tests that fail outside UTC (#2175), unrelated to the diff
    solution: "Fix #2175, e.g. pin TZ=UTC for the e2e run"
    severity: minor
  - description: "Broke CLAUDE.md 'Verify before you state': adopted a reviewer's cse_ fixture from a code regex without checking the real value; the owner had to verify it in a cloud session"
    solution: Document the cse_ env value and session_ URL id in one home, so neither agent nor reviewer has to infer it
    severity: minor
  - description: CLAUDE.md 'Stay on the branch your session started on' has no case for a start branch whose PR already merged; I cut a new branch
    solution: "Add the merged-branch case to that line: cut a fresh branch from origin/main"
    severity: nit
  - description: ADR-0017's header says session_<id>, but a local session only has a raw UUID; the rule doesn't say which to use
    solution: State in ADR-0017's home which id a local session uses in the header
    severity: minor
  - description: zsh treated echo ===== as a command lookup, so a chained read stopped partway
    solution: Use dashes for separators in zsh
    severity: nit
  - description: "Skipped ADR-0003's subscribe-to-PR-activity step: no subscription tool in a local CLI session"
    solution: Say in pr-workflow.md what a local session does instead (poll with gh pr checks)
    severity: minor
  - description: "merge-pr.ts refused PR #2179 from a local session: PROVENANCE_HEADER only matches session_<id>, but a local session's resolved id is a raw UUID, so no verdict can match"
    solution: Let provenance-header.ts accept a raw UUID id (or have merge-pr compare normalized ids) so a local session can post a verdict that counts
    severity: moderate
  - description: An untracked .archify/ folder counted as a changed non-inert path, so gate:scoped ran the full gate on a docs-only diff
    solution: Have gate:scoped ignore untracked files, or gitignore .archify/
    severity: minor
  - description: "Broke ADR-0029 on the first pass of PR #2180: added a local-session clause to the ADR-0017 rule that the ADR itself did not state"
    solution: Caught by the Standards review; rule edits could get a validate-adr-rules check that flags a rule edit with no ADR edit in the same diff
    severity: nit
