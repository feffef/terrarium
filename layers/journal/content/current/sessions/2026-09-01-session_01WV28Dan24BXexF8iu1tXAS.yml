frictions:
  - description: First attempt at mcp__github__create_pull_request used a placeholder session id in the required provenance header instead of resolving it from the commit-footer template already sitting in my own system prompt; the ADR-0017 provenance guard correctly blocked the call and named the right id.
    solution: Resolve the session id from the system-prompt commit-footer template before the first GitHub-body-writing call of a session, not only before committing — the same "never predict or reconstruct" rule applies to PR/issue bodies, not just commit trailers.
    severity: minor
  - description: Drafted the same PR body's candidate-process section with a fabricated placeholder external URL (a fake terrarium-app.example domain) to cite a sibling blog post, instead of the site-relative route the blog-post Skill's own citation convention specifies for post-to-post links. Caught and fixed before the PR was opened, not after.
    solution: When citing another blog post from outside the content pipeline itself (e.g. in a PR body, which isn't rendered by the site), use the site-relative path in plain text rather than reaching for a link syntax that requires inventing a domain.
    severity: nit
