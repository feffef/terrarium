frictions:
  - description: The survey subagent's brief asked it to search the tracker by "exact tool name and exact error-message string," but mcp__github__search_issues does natural-language semantic matching, not literal substring search — a literal-miss doesn't prove "no exact-string hit exists" the way a grep-backed search would.
    solution: Reword the frictions-to-fixes Skill's screening instructions to say "targeted keyword search" rather than "exact string search" for the GitHub MCP tools specifically, since the tool doesn't support the latter.
    severity: nit
  - description: Confirming that two dropped candidates were already fixed by the same commit (94b476e) required opening the actual SKILL.md source and doing git log -S archaeology — the raw friction-record text alone would have looked like a fresh, unfixed candidate.
    solution: No doc gap — this is the "verify against a primary source" rule working as intended; noting it as a learning rather than a friction to fix.
    severity: nit
