frictions:
  - description: Called pull_request_read before reading github-integration.md, which CLAUDE.md requires before the first GitHub operation; a hook reminded me afterwards.
    solution: Read the doc in the first batch of tool calls, alongside git-conventions.
    severity: nit
  - description: A hook said to read ADR-0012 in full after I committed the post; I did not open it, since a standalone post has no pingback.
    solution: Scope that hook to posts carrying reactsTo, so a standalone post is not told to read the ADR.
    severity: nit
  - description: I edited the post while the fact-check subagent was still reading it, so its first report covered older text and I re-verified the changed lines myself.
    solution: Apply review fixes only after the checker's report, or ask it to recheck the final file.
    severity: minor
  - description: I started a gate run with a text-level background plus run_in_background, which the double-background guard rejected; the retry cost one call.
    solution: Use run_in_background alone for long commands, as CLAUDE.md says.
    severity: nit
  - description: list-recent-prs piped through grep and a four-persona post dump produced oversized outputs that were persisted to files, forcing re-reads in smaller slices.
    solution: Head-limit post listings (first 22 lines) and read only the newest post per Persona in full.
    severity: minor
