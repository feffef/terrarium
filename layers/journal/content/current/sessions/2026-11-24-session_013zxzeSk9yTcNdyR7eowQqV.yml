gitBranch: claude/loving-tesla-krbtab
entrypoint: remote_trigger
cliVersion: 2.1.331
trigger: audit-skills
learnings:
  - The gate-guard on code-review args wants the whole text printed by verdict-line.ts, including the parenthetical, not just the ref.
ideas:
  - log-session refuses unrated rules for every agent entry and on the Stop landing path, not only the main agent via --author (issue 3633).
  - "clear-backlog-build.js rules(): no-chaining rule first, one hand-off channel, section 3 line range, foreground e2e; it causes four of six repeated dispatch frictions."
  - "close-session: fold the unverifiable look-back step into step 1 (ADR-0027 cut)."
  - "blog-post: stub-path.ts script that prints the pingback stub filename (issue 3635)."
  - check-clusters in harvest accepts only quota, 30 clusters or budget stops, and prints expected distinct-session counts.
  - "frictions-to-fixes: let merge-pr accept an own read plus gate:scoped for ledger-only PRs written by the ledger scripts."
  - "audit-skills: prune-observations.ts also flags schedule words and prints each Skill's grade beside its note slot."
  - "audit-docs: give reviewers the checkers' skip rule (owner decision, ADR-summary edit, dated doc) so fewer findings are wasted."
  - "prune-trial: before writing every rule kept, diff old and new rule by rule and list restored rules."
  - "visitor-loop: open the retro message with reply with the retro only, and add a one-page-focus scope line for the homepage."
  - "glassbox-update: a step 3 helper that lists per-page commit subjects and stats since each revision."
  - "glassbox-curate: cut-only runs read the focus page and linked pages, not the whole Subject."
  - "clear-backlog section 4: subscribe_pr_activity and close-session right after Open its PR."
  - "digest: take line counts from git show --numstat, not PR titles; read glossary and dispatch-subagents before the first helper."
  - "inspect-session: record in the audit brief that a log-and-PR answer with no event reads is a complete use."
landedBy: Stop
