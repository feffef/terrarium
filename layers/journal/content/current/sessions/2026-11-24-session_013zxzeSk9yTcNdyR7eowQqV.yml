frictions:
  - description: Ran git fetch before reading git-conventions.md; the hook then reminded me. The fetch itself was correct, so no harm.
    solution: Move the fetch-before-trust advice into CLAUDE.md's first-git-command trigger or make the read-only list include fetch.
    severity: nit
  - description: First code-review call named only origin/main; the sha guard blocked it and I reran with the printed args.
    solution: Print the args line as the only output of verdict-line.ts --review-call so it can be pasted whole.
    severity: nit
  - description: Sixteen per-Skill agents again mostly re-confirmed known repeats; I could not re-verify most counts and marked them unverified in the notes.
    solution: Have the scorecard flag Skills whose runs and Changes are unchanged since the last note and skip their agent.
    severity: moderate
  - description: One agent returned a report that its own scorecard mislabelled (StkfK as a non-user); checking it cost extra reads of the log.
    solution: Brief agents to cite file and line for every claimed hole, as the log-session agent partly did.
    severity: minor
