learnings:
  - "`slice(-n)` with n=0 returns the whole array, so a count-based retention budget needs an explicit non-positive guard or it silently retains everything"
  - A calendar-window retention drains `current` toward empty during a quiet stretch, whereas a count-of-dates budget holds the newest N however far apart they fall
ideas:
  - Add a gate check that renders the Journal's `current` Space inventory as a committed snapshot — counts per Collection, oldest and newest date — so a retention change's real effect on the dashboard shows up as a reviewable diff instead of only as a passing unit test. The archive sweep's off-by-one survived for weeks precisely because nothing made the resulting shape of `current` visible in review.
