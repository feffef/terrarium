summary: 'The user asked why the archive sweep leaves six sessions in `current` when they expected seven, and whether the daily digest Routine was the cause. Investigated and answered: the six is Digests, not sessions, and the Routine is not the cause — `RETAIN_DAYS` was a today-inclusive calendar window, but a Digest covers a closed UTC day, so today always spent a slot on a Digest that cannot exist yet. The user then asked for a PR, and on a follow-up explicitly asked that the algorithm and naming be less confusing, since "retain days" reads as the count that remains. Both the fix and that reframing were human-instructed. Reworked retention into a count of surviving distinct dates per kind (`RETAIN_DATES`), which drops the wall clock entirely. The PR went green on both local and CI gates and a human merged it.'
