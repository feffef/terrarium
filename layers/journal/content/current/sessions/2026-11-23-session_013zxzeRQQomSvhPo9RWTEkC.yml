entrypoint: remote_trigger
cliVersion: 2.1.330
trigger: audit-skills
learnings:
  - "Inferred, not read: a note under the audit-skills step 5 format can be 300-500 words yet still fail the watchFor verdict wording; the reviewers, not the validators, caught that (held, failed or couldn't tell must be single words per item)."
ideas:
  - "audit-docs: tell reviewers to skip findings that need an owner decision and to quote every rule and why of text they propose to rewrite (WRONG share 17/26, 13/19, 10/10, 13/22 over four runs)"
  - "blog-post: a helper in scripts/blog-rotation.ts that prints the exact pingbacks stub path from the persona and target post, since wording failed four times"
  - "clear-backlog: fold step 4's two 'still open after round N re-checks' clauses into one"
  - "dispatch-subagents: state the four recurring clashes (foreground e2e with timeout, scratch mkdir, one hand-off channel, code-review smell-list line range) in clear-backlog-build.js rules() and reviewPrompt()"
  - "frictions-to-fixes: let a ledger-only PR made by ledger-set and prune-friction-ledger take an own read plus gate:scoped, with merge-pr accepting that verdict; three data diffs of 67-83 files each paid two reviewers for judgement calls"
  - "glassbox-curate: a light lane for one-clause fixes (sonnet claim checker only, logged in the run entry), and orient.ts printing this session's id in the run-entry skeleton"
  - "glassbox-update: subagents return only falseClaims and docs and drop the per-page claims list"
  - "harvest: either allow a cost stop in step 2 or make check-clusters accept only quota, 30 clusters or an explicit budget form; three runs stopped at 12-14 clusters on free text"
  - "log-session: extend the rule-use.ts refusal to every by entry so answered is true only when each agent's loads minus reported paths is empty"
  - "prune-trial: have the step-2 search brief ask each candidate's last-edit date and skip any edited within 3 days"
  - "visitor-loop: name docs/agents/triage-labels.md in step 4 as a read-before-filing"
landedBy: Stop
