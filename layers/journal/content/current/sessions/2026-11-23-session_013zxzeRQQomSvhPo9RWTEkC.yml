frictions:
  - description: Ran git fetch before reading docs/agents/git-conventions.md; the hook reminded me afterwards and the fetch was correct anyway.
    solution: None needed; the hook reminder already covers it.
    severity: nit
  - description: Filed the first issue before reading docs/agents/triage-labels.md; the hook reminded me afterwards and my labels were right.
    solution: Read the label doc together with issue-tracker.md before filing.
    severity: nit
  - description: First code-review call lacked the head sha and the guard blocked it; I reran with the printed args.
    solution: Run verdict-line.ts --review-call before invoking code-review.
    severity: nit
  - description: A background gate command also contained a trailing ampersand and the double-background guard refused it; nothing ran.
    solution: Pass run_in_background alone with a plain foreground command.
    severity: nit
  - description: gate:scoped failed on validate-skill-cadence because a note said a Skill runs daily; this cost a fix commit, a second review round and two more gate runs.
    solution: State the never-say-when convention in audit-skills step 5 where notes are written, instead of only in the validator.
    severity: minor
  - description: My first drafts of two notes named the wrong current grade for clear-backlog and inspect-session; I caught it by grepping importance before applying them.
    solution: Have the scorecard print each Skill's grade next to its observation slot, or read it before drafting.
    severity: nit
