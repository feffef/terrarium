frictions:
  - description: GitHub MCP list_issues and search_pull_requests overflowed the token cap three times; each needed a spill-file and an ad-hoc python parse.
    solution: Reach for minimal_output and a small perPage on the FIRST call to any repo-wide GitHub list/search tool, not after the overflow. Worth a line in docs/agents/issue-tracker.md's pagination guidance.
    severity: minor
  - description: search_issues returned total_count 0 for queries whose matches demonstrably exist, twice; only list_issues plus local filtering was trustworthy.
    solution: Don't treat a zero-result search_issues as evidence of absence in this environment — confirm via list_issues before concluding nothing exists. This nearly made me report "no prior survey" without checking.
    severity: moderate
  - description: scripts/midden-survey.ts dedupes candidates on exact provenance path, but the trench catalogues clusters as kind:commit with one representative path.
    solution: Dedupe on the deleting commit hash as well as the path. Four of 38 raw candidates this run were already-catalogued siblings resurfacing; the count grows every run as more clusters are catalogued. Written up in "#730".
    severity: moderate
  - description: The Skill says to bound the sweep with --since from the previous survey issue, but says nothing about the first run, when no such issue exists.
    solution: "Add one line to the Skill's step 1: on the first run, sweep unbounded and say so in the report. I inferred this, but a less careful run might have guessed an arbitrary date and silently under-reported."
    severity: nit
