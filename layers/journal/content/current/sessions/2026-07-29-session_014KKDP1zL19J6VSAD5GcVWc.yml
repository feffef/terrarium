learnings:
  - Midden routes are not prerendered, so greping .output/public for rendered content proves nothing - existing artifacts are absent from it too. Verifying Midden content needs a live preview server and a DOM check, which is exactly what docs/agents/verifying-ui-changes.md warns about in general form.
  - The branch half of a midden survey is fully decidable from the repo's oldest commit date while the repo is younger than the dormancy floor - no branch walk needed at all.
  - "git's -M rename detection misses a rename whose body also changed enough (the Atlas redate: same slug, new date, edited content), so those land in the deletion set looking terminal and must be Gate-B checked by hand."
ideas:
  - "Charter the Palimpsest Tenant off this survey's own byproduct. Every run already produces a Gate-B-failure list - 15 entries this run, each with a named living successor and commit evidence - that is richer than the Midden's haul: the story of what the Platform renamed, folded and rewrote rather than dropped. Concretely, extend scripts/midden-survey.ts to emit two arrays (discarded vs. superseded) and have the Skill file two issues; Palimpsest's artifact schema would carry a `successor` field where Midden's carries `continuityCheck`."
