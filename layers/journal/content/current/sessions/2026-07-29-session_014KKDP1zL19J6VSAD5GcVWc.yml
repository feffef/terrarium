frictions:
  - description: MiddenArtifact.vue's header claims a broken artifact slug is caught at build/CI time by validate-content-refs.ts. Nothing scans page bodies for those directives.
    solution: Either correct the comment or close the gap by validating ::midden-artifact slugs against the artifacts collection. A typo'd slug currently reaches the runtime "Artifact not found" fallback, which the comment calls the rare leak but is the only check. Reported on "#732".
    severity: moderate
  - description: search_issues returned total_count 0 for queries whose matches exist, twice; only list_issues plus local filtering was trustworthy.
    solution: Don't treat a zero-result search_issues as evidence of absence here. It nearly made me report "no prior survey" without checking.
    severity: moderate
  - description: scripts/midden-survey.ts dedupes on exact provenance path, but the trench catalogues clusters as kind:commit with one representative path.
    solution: Dedupe on the deleting commit hash as well as the path. Four of 38 raw candidates were already-catalogued siblings resurfacing, and the count grows every run as more clusters are catalogued.
    severity: moderate
  - description: I drafted two confident specifics into catalog notes that the record contradicted - "two hours later" was thirteen minutes, "the same week" spanned sixteen days.
    solution: Both were caught only because I went back to verify every claim before committing. The lesson is that curator's-voice prose invites invented precision; check each number against the record as it is written, not after.
    severity: minor
  - description: "A YAML plain scalar containing a colon-space failed validation. The repo's quoting guidance names `[`, `{`, `#` and `,` but not `: `."
    solution: Add colon-space to that list, or default catalogNote-length prose to a block scalar. It is the separator most likely to appear in written prose.
    severity: nit
  - description: GitHub MCP list_issues and search_pull_requests overflowed the token cap three times; each needed a spill-file and an ad-hoc python parse.
    solution: Reach for minimal_output and a small perPage on the first call to any repo-wide GitHub list/search tool, not after the overflow.
    severity: minor
