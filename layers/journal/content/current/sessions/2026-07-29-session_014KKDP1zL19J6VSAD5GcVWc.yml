learnings:
  - The branch half of the sweep is fully decidable from the repo's oldest commit date while the repo is younger than the dormancy floor — no branch walk needed. A cheap precondition check that saves paginating 100+ branches.
  - "git's -M rename detection silently misses a rename whose body also changed enough (the Atlas redate: same slug, new date filename, edited content). Those land in the deletion set looking terminal, so Gate B has to be checked by hand against same-slug successors — the script's mechanical slice can't see them."
ideas:
  - Charter the Palimpsest Tenant off this survey's own byproduct. Every run already produces a Gate-B-failure list (15 entries this run, each with a named living successor and commit evidence) that is richer and more narratively interesting than the Midden's haul — it is the story of what the Platform renamed, folded, and rewrote rather than what it dropped. Concretely - extend scripts/midden-survey.ts to emit two arrays instead of one (discarded vs. superseded), and have the Skill file two issues; Palimpsest's Artifact schema would carry a `successor` field where Midden's carries `continuityCheck`.
