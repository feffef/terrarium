goal: Bring every Glass Box guide Lesson to one quality standard
status: completed
outcome: Four review-fix-review rounds took the 26 guide Lessons from 15 A / 10 B / 1 C to all A; PR 2500 merged
summary: "Human-instructed: the user asked an agent to read all Glass Box guide Lessons and judge title, standalone cut and quality; chose scope (guide Lessons only), output (report plus fix PR) and the title test (clear, consistent, short); then asked to also find better examples in the source, and to repeat a Fable-model re-rating plus applying agreed suggestions with code-review runs in between until all Lessons reach a high standard, then merge. Agent-decided: which suggestions to accept (rejected splitting Self-improvement loop into a new Lesson since a Prune Trials draft exists and a new Lesson is new work; kept tool-prefixed titles where the bare word is ambiguous; refused to add publishedAt to old pages); splitting round 1 across three disjoint worktree agents, then one impl agent per later round. Reviewers sometimes reversed each other (Author trust vs Author association); the dispatcher settled those once and told later raters not to re-raise them, which made the ratings converge. The page check's link-title rule meant every rename had to touch link text across Lessons, Walkthroughs and drafts. A fourth round fixed the last two B Lessons (Skills, Hooks) and review nits; a final Fable check graded every Lesson A, and the PR merged after green CI."
