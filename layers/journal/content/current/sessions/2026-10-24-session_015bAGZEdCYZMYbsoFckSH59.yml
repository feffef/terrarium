frictions:
  - description: Ran git fetch before reading docs/agents/git-conventions.md, which CLAUDE.md requires before a first fetch; a hook flagged it.
    solution: Read git-conventions.md before the first git command beyond status/diff; no harm here since the fetch was read-only.
    severity: nit
  - description: Successive reviewers reversed each other's title proposals (Author association vs Author trust), costing a round of re-judging.
    solution: Record settled decisions in the rater brief from the first round, so later raters don't re-raise them.
    severity: minor
  - description: Renaming a Lesson forces link-text edits across many pages because the page check fails a link whose text differs from the title; parallel agents collided on Where next lists.
    solution: Give one agent ownership of all link-text fixes per round, or let the page render link text from the target title.
    severity: minor
  - description: Wrote 'Six renames' in the PR body while listing eight titles.
    solution: Count the list before writing a number; fix the description in the next push.
    severity: nit
  - description: Word-cap trims to fit the 65-word Why-bullet limit repeatedly dropped a bullet's reason (Merge gate's 'fails safer'), needing two more review rounds to restore it.
    solution: When a bullet hits the cap, cut a different clause than its reason, and re-read the bullet's logic before committing.
    severity: minor
