goal: Limit how long Glass Box lessons may be
status: completed
outcome: Hard (2000) and soft (1700) lesson word limits merged via PR 3608; the next glassbox-update run fills the Too long section
summary: "The owner asked how long the Glass Box lessons are and which limit exists (none for a whole lesson), then directed, in their own words, a hard limit of 2000 words without frontmatter that fails tests, a soft limit with a script warning run by glassbox-update, a workshop bullet per warned lesson, readers proposing the splits, a note that cutting is allowed when no split is logical, and a Too long priority in glassbox-curate. The owner chose the soft limit (first 1600 from my recommendation, then 1800, finally 1700) and, from my questions, that a reader proposes for every flagged lesson, a new Too long section, and guide lessons only with raw body words. Agent-initiated: the code-review rounds, the doc edits that keep one home per fact, and removing a redundant clause after review. The PR waited for the owner because it changes the page checks and two Skills, and the owner merged it. The Too long section was left empty on purpose; the first glassbox-update run after the merge writes the readers' split proposals there."
