summary: "Autonomous frictions-to-fixes run (schedule-started; no human instruction in the session). A survey subagent appended 38 in-window occurrences to the Friction Ledger and ranked candidates; it could only screen shallowly (139 candidates). Most never-fixed entries already carried a design-dropped note, so I picked three without one for a design agent. Outcome: issue #3733 (owner call on glassbox-curate index reads), a dispatched doc fix (audit-docs reviewers now told the checker bar and not to edit watchFor, PR #3735), and no change for merge-pr-review-args-amend-after-printing. I also filed a regression issue for harvest-list-read-cost (#3731, the harvest digest read overflows the token cap) and an issue for the dispatch-read-guard ignoring reads through the .claude/skills symlink (#3732, guard is Human-only). Ledger PR #3734 and closing ledger PR #3736 were merged with code-review (ledger) or own-read (closing); the doc fix went through code-review, #3735. All agent-initiated by the schedule. Open: fix quality of #3735 is judged by later occurrences; owner decisions on #3733."
