frictions:
  - description: The placeholder guard denied my first survey dispatch because the prompt merely named the scratch-directory placeholder while explaining it; I reworded and retried.
    solution: Let the guard ignore a placeholder quoted in backticks, or have the Skill brief say to describe it in words.
    severity: nit
  - description: The survey brief asks to confirm every never-fixed or regression label, impossible for 139 candidates; the survey agent did a shallow screen and reported labels as unconfirmed.
    solution: Say in survey-brief step 3 to confirm only the top-ranked candidates and window entries.
    severity: minor
  - description: Most never-fixed ledger entries already carried a design-dropped note, so picking them spent a design agent on dropped solutions; the survey does not flag a prior drop.
    solution: Have the survey's ranked list show each candidate's latest design-dropped note date, so picks skip repeats.
    severity: minor
  - description: The design brief's picks section gave only entry file names, forcing the design agent to read the files itself; I could not paste the evidence the brief expects.
    solution: Say in the design brief that picks may be given as ledger file paths.
    severity: nit
