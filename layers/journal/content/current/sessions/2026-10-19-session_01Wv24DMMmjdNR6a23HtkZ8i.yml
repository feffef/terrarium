frictions:
  - description: "Design brief has no 'no fix' option: it asks for dispatch or issue, so the design agent had to improvise when it found nothing worth fixing."
    solution: Let design-brief.md's Recommendation line allow 'no fix, with reason'.
    severity: nit
  - description: survey-brief says to append every friction but --unledgered drops sessions, and --summary counts regressions by date, so same-day post-fix sessions were missed and needed hand checking.
    solution: Count regressions by session start in --summary; name a per-cluster dedupe step in the brief.
    severity: minor
  - description: Passed the filled survey brief to the subagent as a file path, not pasted verbatim as the Skill says; the Skill does not say which is meant.
    solution: State in section 1 that pointing at the filled file counts as verbatim.
    severity: nit
  - description: Stop hook asked to push twice before the gate and review had run; ADR-0004 says to ignore it, but it nags mid-run on a scheduled routine.
    solution: Silence the hook while a gated first push is pending.
    severity: nit
