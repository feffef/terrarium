frictions:
  - description: Ran digest.ts list, then list-recent-prs, which fetches, before reading git-conventions.md; the hook flagged it afterwards.
    solution: Load the git read hint before the Skill's first helper that runs git fetch.
    severity: nit
  - description: The first Agent call was denied by the dispatch-read guard because I had not read dispatch-subagents; one wasted call.
    solution: Have the digest Skill step 3 name dispatch-subagents next to its fact-check subagent.
    severity: nit
  - description: I typed a made-up session id into a commit message file before noticing the hook adds the real trailer; no commit used it.
    solution: Never write the trailer by hand; the commit-msg hook supplies it.
    severity: nit
  - description: I edited the Digest wording while gate:scoped ran, so it aborted on a changed tree and I reran it, costing about a minute.
    solution: Gather review fixes first; start the gate only once every edit is done.
    severity: minor
