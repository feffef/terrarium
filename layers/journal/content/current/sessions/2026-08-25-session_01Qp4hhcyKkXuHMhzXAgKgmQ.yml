frictions:
  - description: render:mermaid writes new SVGs but never deletes the superseded one, so verify:mermaid fails on the orphan right after a legitimate re-render.
    solution: Have render-mermaid.ts prune orphaned SVGs itself (it already computes the live key set), or print the exact rm command the way verify-mermaid prints its regenerate hint.
    severity: minor
  - description: First mermaid render was visually poor — multi-line diamonds inflate hugely and wide graphs scale to unreadable text under max-width 100%.
    solution: "Record the label-length guidance in the ADR-0024 area or a diagramming note: keep decision-node text to one short line, prefer narrow graphs."
    severity: minor
  - description: No full-page screenshot path exists — screenshot.ts captures a fixed WxH viewport, so a full-page shot needs an ad-hoc script to measure scrollHeight first, then a second capture at that height.
    solution: Add a --full flag to scripts/screenshot.ts (and preview.ts shot) that reads document.documentElement.scrollHeight and sizes the viewport to it, instead of every caller re-deriving the two-step dance.
    severity: minor
  - description: A one-off tsx probe run from the scratchpad failed twice — first on top-level await under the cjs output format, then on module resolution outside the repo root.
    solution: When scripting an ad-hoc browser probe, write it inside the repo root and wrap the body in an async main(); the two failures cost a round trip each.
    severity: nit
  - description: Each committed diagram SVG is 60-150 KB and MermaidDiagram.vue eager-globs them all, so every diagram's weight ships with the content chunk site-wide.
    solution: Worth measuring whether the eager glob can become lazy per-key, or whether rough.js hand-drawn output can be slimmed; flag before diagram count grows.
    severity: nit
