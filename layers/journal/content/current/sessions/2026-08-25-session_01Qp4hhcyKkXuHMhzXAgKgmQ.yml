learnings:
  - "Baked mermaid geometry means narrow diagrams read better: a wide graph scales down under max-width 100% until its 20px baked text is unreadable, so label brevity is a legibility lever, not a style choice."
  - "The how-it-works page's audience is set by frontmatter: an `onramp` value opts a page into the Journal index's \"New here?\" card, which is what makes newcomer-level prose its job rather than a nicety."
ideas:
  - "The Journal has no page that simply lists the scheduled routines and what each one watches — how-it-works now narrates four of six in prose, but the roster lives only in the Skill Inventory's importance field. A small derived panel on /t/journal/current, built from `importance: routine` entries, would stay honest automatically as routines are added or retired, and would stop prose pages from having to re-list them."
