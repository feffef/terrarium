summary: "The owner invoked grill-with-docs to refine an idea from session_01Vg1qDutnhKVav7JDNUdr8J: give the hint hooks a shared linear tokenizer in hook-io.ts with one timing test. Reading the code showed a shared tokenizer already existed (commandWords in shell-reads.ts) and only adr-read-hint kept its own token regex, so the first grilling round reframed the goal; the owner agreed to every recommendation. At the owner's request a Fable agent verified the proposal and found my premise half wrong: commandWords itself was quadratic on blank-line heredoc bodies and overflowed the stack on deep $( nesting, a git-at-first-word match would lose `if git commit`, and one existing spec would break. A second round (agreed by the owner) folded those in. The owner then explicitly said \"build it\". Built: one-pass stripHeredocs, a 100-deep substitution cap, a shared gitSubcommandAt (returning an index so matching git at any word stays linear), adr-read-hint on commandWords, a growth-based adversarial test shown red on the old tokenizer, and a guards.md clause. Two code-review agents found a false guards.md sentence (stale-push-hint keeps a filter regex) and a timing slack that hid the old quadratic marker scan; both fixed. Agent-initiated: those review fixes and the extra heredoc-body spec case. Human-only files, so a human merges."
