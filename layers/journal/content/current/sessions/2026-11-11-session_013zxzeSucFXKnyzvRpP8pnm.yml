summary: "The owner asked me to read issue 3061, grill the idea with them, and message the session that opened it. I read the issue and the workflow script, messaged the origin session (its answers showed a longer source list alone would not have fixed one of the four cases, and that the comparison was not like for like), then ran three grilling rounds. Every design choice was the owner's: one widened agent instead of a second pass, named sources plus helper scripts and older file history (they asked for scripts to be named and dropped rule-use-report), background step in every mode except blocked-check, a required staleClaims field, sonnet kept, no formal test since the four issues are being fixed. I made the check-that-it-landed wording and the one-sentence dig scope as proposals they accepted. After the owner confirmed, I implemented it, added staleClaims printing to run-summary.ts with a fixture line (agent-initiated, a consequence of the owner seeing stale claims), ran code-review via two subagents, fixed the one real defect (ready-recheck was not pointed at the background step), ran gate:scoped green, and opened the PR myself per ADR-0003. It touched a Human-only file, so a human merged it. Still open: whether the wider brief works, to be judged on the next real clear-backlog run."
