learnings:
  - "The retro showed that only some round-1 reviews matter: they caught an inert dependency, a false sentence left by an edit and an untested rule, and on the other three branches only re-found nits the builder had already logged."
ideas:
  - Let the clear-backlog build workflow take a per-branch 're-check only' mode that sends the finding titles and the builder's one-line proof, so a nit-only round costs one reviewer instead of two.
