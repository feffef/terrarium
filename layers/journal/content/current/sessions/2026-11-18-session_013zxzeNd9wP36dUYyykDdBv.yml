frictions:
  - description: Ran git log, status and diff in builders' worktrees to verify their claims before reading git-conventions.md; the read-first hint reached me after the first calls.
    solution: Nothing new; the hint already fires once per doc, and the read-only exemption could name worktree log checks explicitly.
    severity: nit
  - description: "Closed and commented on issues (#1689, #3297, #3244) without having read triage-labels.md; the hint came after the first issue_write."
    solution: CLAUDE.md's trigger says file, triage or label an issue; say whether closing and commenting count.
    severity: nit
  - description: Wrote many short status messages while agents worked, against the Skill's 'no status lines' rule; most followed the owner asking what was happening.
    solution: The Skill could say how to answer an owner's mid-run 'status?' in one line instead of a table.
    severity: nit
  - description: My typescript-7 brief said to add each alias 'if required' and did not require showing each dependency was exercised; the first build added two inert packages and cost a fix round.
    solution: "Brief template for dependency trials: each added package needs a command showing something uses it, or it is dropped."
    severity: minor
  - description: The f2f builder's first gate failed for a missing node_modules in a new worktree, and the cost branch's gate log briefly showed a git error; each cost a rerun and a recheck of the log.
    solution: clear-backlog-build rules() should tell the builder to run pnpm install before any gate, as dispatch-subagents already says for the checkout.
    severity: minor
  - description: Ran a worktree-scoped cd in a Bash call, moving the main session's working directory into a builder's worktree until the next call.
    solution: Use absolute paths with git -C only, as dispatch-subagents says; no new text needed.
    severity: nit
  - description: The tenant-glossary guard's own ledger fix needed this PR's number, so the branch took a second push after the PR opened and a second builder turn.
    solution: Have the ledger fix name the commit instead of a PR number where the ledger allows it, so no follow-up commit is needed.
    severity: nit
  - description: Twelve read-only reviewers each had to run the rule-use echo twice, rating four ADR rules unrelated each time; two extra turns per reviewer with no signal (retro replies).
    solution: "scripts/hooks/rule-use-ask.sh: skip the prompt for read-only reviewer subagents, or ask once at the end of the run."
    severity: minor
  - description: reviewPrompt cites section 3 of the code-review Skill but its heading is '### 3.'; four Standards reviewers grepped '^## 3', found nothing and wasted a call or skipped the baseline (retro replies).
    solution: Name the section by its real heading in reviewPrompt() in .claude/workflows/clear-backlog-build.js.
    severity: minor
  - description: Builders and reviewers were told to return through StructuredOutput in round 1 and through SubagentHandback plus a JSON file later; five of them reported twice or had to work out which channel counted (retro replies).
    solution: State one return channel and the schema in every message in rules() and reviewPrompt() in .claude/workflows/clear-backlog-build.js.
    severity: minor
  - description: The builder rules say no && chains in a worktree yet their own gate example is a cd && chain, and the wrap-width check assumes 80 columns where blog files keep 120; builders lost a turn to the guard and a gate failed on a missing node_modules (retro replies).
    solution: "In rules() in .claude/workflows/clear-backlog-build.js: use the width the file keeps, say Write/Edit for files and one command per Bash call, and tell the builder to pnpm install before a gate."
    severity: minor
  - description: The owner widened the visitor-loop scope after its review round, so round 1 and two rewrites of step 5 were wasted; the three scope changes came as mid-run messages.
    solution: Settle scope with the owner before the build run; the clear-backlog Skill could say to hold a branch whose scope the owner is still changing.
    severity: minor
  - description: I copied the owner's pick 'set the status to fixed' and the ledger fix without checking them against the schema (no fixed value; fixes takes a PR number), so the builder, both reviewers and I each spent a step on it.
    solution: Before dispatch, check a brief's literal values (status words, PR numbers) against the schema, as the briefs' own 'verify claims' rule asks.
    severity: minor
  - description: I built owner-facing blog CSS without first agreeing a sample with the owner as ui-verification.md says; the owner's Q2 yes covered the approach, so I held the merge for their screenshot confirmation instead.
    solution: Show the sample before the build for any visitor-visible change, even a bug fix; the Skill's grilling step already allows it.
    severity: minor
  - description: "merge-pr.ts refused #3478 because its Closes keyword named a ready-for-human issue the owner had already agreed to close; I edited the PR body and closed the issue by hand."
    solution: When an owner pick closes an issue, write 'relates to' from the start and close it by hand after the merge.
    severity: nit
