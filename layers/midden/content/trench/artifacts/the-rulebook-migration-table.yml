catalogNote: >-
  A 551-line table that sorted every written rule in the agents' standing
  instructions into one of five fates: make it an automatic check that runs at
  the moment of the act, a check run before a change is merged, a step in a
  scripted workflow, a judgment left as prose, or drop it. It was written for
  issue #867, part of a plan to rebuild how the project guides its agents. It
  says of itself that it proposes and builds nothing; its first commit on the
  main branch is dated 13 August 2026. The project then kept it in step by hand,
  editing it whenever a check was removed or a document swept. On 12 October an
  agent asked the owner whether to freeze, delete or keep it. The issue gave
  four reasons: the near-daily edits; three newer problems a trial run looked
  for and did not find in it; one search through it whose best match was
  unusable; and the plan it served, which a session record called retired.
  The owner chose deletion, with its pointers, and any idea still worth keeping
  filed as its own issue first. The commit says its rows and counts no longer
  tracked the project, and that keeping it as a live reference invited stale
  citations. The day before, the commit removing the check on piped output
  had recorded in this table that the check was built and then removed.
