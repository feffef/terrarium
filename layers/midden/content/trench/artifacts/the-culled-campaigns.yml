catalogNote: >-
  The pull request merged without them. Three finished Campaigns for the
  fictional crowdfunding site — each with its pitch, specifications and five
  to seven drawn figures — written by one model, drawn by another, and never
  published. They came from a batch of twenty, picked from the ideas three
  model judges scored highest. The Passport Tracker Tracker, a passport cover
  with a second tracker to find the first, was the one finished Campaign that
  no final judge passed, and it was dropped. The Inbox Zero Tray and the Hotel
  Room Compass passed judging and were deleted on human review shortly before
  the pull request merged, within two minutes of each other. The record gives
  no reason for either.
