catalogNote: >-
  Two hundred and eleven lines and a spec, written to replace a sentence that
  had told sessions how long to wait after the search tools refused them — a
  number two sessions had since found wanting. The script would do the waiting itself,
  retrying on a growing delay. A probe in review found that it could never run:
  the environment's proxy refuses the search endpoint to scripts outright, and
  the command-line tool it could fall back to is not installed in these
  sessions. Both of its ways in were closed. It was deleted thirteen minutes
  after it was committed, before the pull request carrying it merged, and the
  sentence it was meant to replace was rewritten instead.
