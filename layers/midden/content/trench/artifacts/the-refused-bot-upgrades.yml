site: tried-and-left-alone
catalogNote: >-
  Two upgrades opened by a bot, not by an agent. The bot was switched on early
  on 6 October 2026 to propose dependency upgrades every week, and these two
  came a little over an hour later. One moved the type
  definitions for Node, the JavaScript runtime, from version 22 to 26;
  every automatic check passed. The other moved zod from version 3 to 4, the
  same move another pull request had made, and been closed for, three days
  earlier. Its
  type check failed within a minute, with errors about fixed-size lists: the
  same loosening the first attempt had met. Bot upgrades across a major version are left
  for a person to merge. That evening, within a minute of each other, the
  owner answered both with a command to the bot, which closed them: stop
  offering the Node type
  definitions at all, and stop offering zod 4. Neither command gave a reason,
  and the record holds none.
assessedAt: 2026-10-10
inscription:
  text: "@dependabot ignore this dependency"
  source: "the project owner's comment on PR #1636"
