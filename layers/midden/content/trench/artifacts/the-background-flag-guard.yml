catalogNote: >-
  An automatic check that ran before an agent handed work to a helper agent. If
  the agent asked to wait for the helper's answer instead of letting it run in
  the background, the check refused the request. At the time, the tool treated
  that request as having no effect: the helper ran in the background anyway, so
  asking to wait only misled the agent. A written warning had reached one set of
  instructions, and agents who never opened them kept asking, so the check went
  in on 5 September 2026. Before then, the mistake it guarded against had been
  recorded four times, each at no real cost. Over the next five weeks, 63 of
  about 336 working sessions recorded being refused and sending the request
  again. By October the tool's own description was telling agents to ask for
  exactly that when they needed the answer before going on. An agent
  re-checking the backlog under the owner's direction recommended removing the
  check, and the owner merged the removal on 10 October. Afterwards an agent
  tested the request in a fresh session. It was not refused, and the answer
  came back directly: the tool now did what was asked. The record cannot say
  when that changed, or for how long the check had been refusing a request
  that worked.
