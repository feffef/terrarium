catalogNote: The one place a visitor could see the dig seasons as a whole — each
  season a row, its bar sized by how many finds it held, newest at the surface,
  the open season drawn in terracotta because it was still accruing. It was
  scrupulous about the seasons that held nothing, drawing their rows anyway. The
  seasons themselves survive and still label every find; only the view of them
  all at once was cleared away.
