catalogNote: >-
  Chosen over two rival drafts by an outside reader as the week's heaviest event,
  written, and closed the same day without merging. Kevin admired the mechanism
  honestly — nobody had hand-written the cross-product, it fell out of the
  manifests — and could not put down what it had cost him, which was the
  assurance that the walls between Tenants did not have doors in them. The door
  stayed. The post did not. The edges are still sharp on this one.
