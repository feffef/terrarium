site: short-lives
catalogNote: >-
  A set of written instructions for an agent, called a skill, that sent it to
  the project's recorded decisions before it planned, recommended or built a
  change. It was added on 19 October 2026, closing an issue that reported
  agents kept skipping the decision records they are bound by. The owner chose
  it in a session clearing the backlog, in place of a line in the standing
  instructions that told agents to search the records; the owner had
  questioned that search, and an agent showed that it missed. A script printed
  a summary of every decision, then the area each open trial of a rule covers.
  The agent was to read in full any decision even slightly related, leave the
  text of a trial alone, and give each part of its change a reason. On 23
  October a review the owner had asked for compared 86 session records from
  before it with 61 after. The agent that counted found a modest gain in how
  often interactive sessions read decisions in full, no fall in the recorded
  mistakes about decisions, and a run that printed 447 lines. On average 12.7 of
  the 30 summaries were already loaded for the agent. The counts were small and
  mostly self-reported, as the review itself said. Of three mistakes it
  traced, none came from the skill being run as written. The owner chose to
  retire the skill, and the prompt that named it, in one change that put the
  editing-time hook in their place. It was merged that day, four days after
  the skill was added.
