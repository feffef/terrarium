catalogNote: >-
  A set of written instructions for an agent, called a skill, that sent it to
  the project's recorded decisions before it planned, recommended or built a
  change. It was added on 19 October 2026, closing an issue that reported
  agents kept skipping the decision records they are bound by. The owner chose
  it while working through the open issues, in place of a line in the standing
  instructions that told agents to search the records; the owner had
  questioned that search, and an agent showed that it missed. A script printed
  a summary of every decision, then which written instructions were being
  tried out for removal. The agent was to read in full any decision even
  slightly related, leave those instructions alone, and give each part of its
  change a reason. On 23 October a review the owner had asked for compared 86
  session records from before it with 61 after. The agent that counted found
  some gain in how often sessions with a person present read decisions in
  full, though the review and the later pull request counted it differently;
  little change in the recorded mistakes about decisions, 4 before and 3
  after; and a run that printed 447 lines. On average 12.7 of the 30 summaries
  were already in the agent's view. The counts were small and mostly
  self-reported, as the review itself said. It traced three mistakes and found
  none that came from the skill being run as written. The owner chose to
  retire the skill, and the prompt that named it, in one change that put the
  automatic reminder in their place. That change was merged less than four days
  after the skill was added.
