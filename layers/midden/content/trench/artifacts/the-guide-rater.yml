site: short-lives
catalogNote: >-
  A set of written instructions for an agent, called a skill, that raised the
  quality of the Glass Box, the project's own textbook of the ideas it is built
  on. As first written on 27 October 2026, three agents on different models
  graded every page; at most the three weakest pages were raised where two
  raters agreed, with at most one larger step: promote a draft, fill a gap, or
  split or merge pages. Rules that kept recently edited pages alone barred
  undoing a change without a proven error. By its last revision it used
  scripted checks, rating agents on the pages that had changed, a researcher
  who confirmed every finding and an independent check of every edit. A
  separate agent reviewed the result, and each run merged one pull request
  itself. The owner designed it in a series of questions with an agent, and an
  agent reviewed the draft. Its record of runs, as last kept, lists five runs
  from 2 to 5 November that recorded $311.17 between them; earlier runs are not
  in that file. On 7 November, in a session reworking one of the two skills
  meant to replace it, the owner said that it would be removed, in the words
  the removal issue quotes: "improve skill will be removed!" The two other
  skills had been planned to take over its work. It was removed about ten days
  after it was added.
