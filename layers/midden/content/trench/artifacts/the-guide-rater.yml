site: short-lives
catalogNote: >-
  A set of written instructions for an agent, called a skill, that raised the
  quality of the Glass Box, the project's own textbook of the ideas it is built
  on. In each run three agents on different models graded every page. It
  raised at most the three weakest pages where two raters agreed, and took at
  most one larger step: promote a draft, fill a gap, or split or merge pages.
  A separate agent reviewed the result, and the run merged one pull request
  itself. Rules against churn kept recently edited pages alone and barred
  undoing a change without a proven error. The owner designed it in a series
  of questions with an agent, and an agent reviewed the draft; it was added on
  27 October 2026. Its ledger, as last kept, lists five runs from 2 to 5
  November that recorded $311.17 between them; earlier runs are not in that
  file. On 7 November, in a session reworking its successor, the owner said
  that it would be removed, in the words the removal issue quotes: "improve
  skill will be removed!" Two other skills, one for curating the guide and one
  for updating it, had been planned to take over its work. It was removed
  eleven days after it was added.
