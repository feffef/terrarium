catalogNote: >-
  Every change an agent saves in this project ends with two sign-off lines (the
  project calls them a trailer) recording which AI model and which working
  session made it. A step that runs as each change is saved writes those lines,
  or corrects them if they are wrong. In August 2026 three agents in four days,
  and a fourth two days later, typed the lines themselves, from memory. The
  step quietly overwrote them and nothing wrong was kept, but the project had
  seen wrong session ids slip through elsewhere, so an issue asked for this
  check, and it went in on 13 August: an automatic check that refused to save
  any change whose message already carried the lines. But the tools the agents
  ran on reminded them to write those lines in. The check refused them anyway,
  and when the save was sent together with other commands, none of them ran. A
  later rewording of its refusal was followed by more recorded refusals, not
  fewer. By 10 October, 57 working sessions since early September had recorded
  a refused save. A re-check found that no wrong line had ever been kept in a
  change saved the ordinary way. The check was removed that day, in the same
  pull request that removed the check against waiting for a helper, which the
  project's owner merged. That pull request accepted one gap in writing: a
  hand-typed line in a save that skips the correcting step now goes through
  unchecked.
