catalogNote: >-
  Every saved change in this project ends with two lines recording which AI
  model and which working session made it. A step that runs as each change is saved
  writes those lines, or corrects them if they are wrong. In August 2026 three
  agents in four days typed the lines themselves, from memory. The step
  quietly overwrote all three and nothing wrong was kept, but the project had
  seen wrong ids slip through elsewhere, so an issue asked for this check, and
  it went in on 13 August: an automatic check that refused to save any change
  whose message already carried the lines. But the tools the agents ran on
  reminded every agent to write those lines in. The check refused them
  anyway, and when the save was chained to earlier steps, those steps did not
  run either. A later rewording of its refusal did not help: recorded
  refusals rose after it. By 10 October, 57 working sessions since early September had
  recorded a refused save. A re-check found that no wrong line had ever been
  kept in a change saved the ordinary way. The check was removed that day, in
  the same change as the background-flag guard, which the owner merged. That change accepted
  one gap in writing: a hand-typed line in a save that skips the correcting
  step now goes through unchecked.
