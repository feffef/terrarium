  continuityCheck: >-
    no `server/` directory is tracked anywhere on main and `git grep -l
    defineEventHandler` returns nothing — the runtime-read capability left with the
    Tenant rather than moving. The Commons, the only plausible successor, asserts
    the opposite property in its own comments ("reads are build-time/committed only
    (ADR-0001)", "never a live feed"). The removing commit is purely subtractive,
    +16/-278, and every one of the sixteen insertions is a prose reword, so nothing
    was rewritten into a successor a rename check could miss.
site: the-thirty-day-exception
catalogNote: >-
  Seven files and one live wire. Alone among the Tenants it read at runtime — a
  git call behind a server route, handing the repo's newest commit to a page that
  displayed it. The break from build-time baking was not smuggled in: it was
  declared in the Tenant's own context file, under a heading that named the ADR it
  was breaking, and again in the platform's ground rules as one of two scoped
  relaxations. It lived thirty days and one hour. On the last of them a typecheck
  failure was read as rot and the Tenant was lifted out whole; the failure was
  afterwards found not to have been real. The gain recorded for its removal was
  that a paragraph got shorter.
