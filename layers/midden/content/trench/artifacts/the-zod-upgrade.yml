  merged: false
  url: https://github.com/feffef/terrarium/pull/1569
  continuityCheck: >-
    On the project's main branch, package.json still pins zod at ^3.25.76 and no
    commit since the pull request closed mentions a zod upgrade. None of the work
    done on the branch appears on main, by content or by hash, and no other pull
    request carries the bump. The issue it was meant to close is still open,
    parked until the content framework itself moves to zod 4. That is an
    intention, not code, so it is not counted as a successor.
site: tried-and-left-alone
catalogNote: >-
  A change that moved zod, the library the site's data rules are written in, from
  version 3 to version 4. It came out of a sweep of major upgrades, where a trial
  run had rated it moderate work: five type errors. The branch fixed them with
  two type casts and a widened type in one section of the site's code, a one-line
  change to a test and a rewritten code comment, and every check passed. What it
  could not change was the content framework underneath, which keeps its own copy
  of zod 3. Two copies would stay installed, and the framework's conversion of
  zod 4 rules drops the lengths of fixed-size lists, so the type definitions
  derived from them came out looser. The project's owner asked what the upgrade
  bought. The agent doing the work answered that it bought almost nothing, since
  nothing in the repository uses a feature only zod 4 has. The pull request was
  closed about an hour and a half after it opened, and the owner parked the issue
  until the framework moves. The branch was written before anyone had asked that.
