  continuityCheck: >-
    no guard of that name, and no hook entry refusing a branch by its name,
    exists on main. The pull request recorded the instruction it deleted as a
    prune trial, which could have brought the rule back; three days later that
    trial was judged and closed with the prune holding. What main keeps is one
    sentence telling a session to stay on the branch it started on — the cause
    removed, not a mechanism policing it.
site: surface-finds
catalogNote: >-
  A hook that read the branch a session had been started on out of its own
  transcript, and refused to let it cut a branch under any other name. It was
  written against a failure recorded several times over, after two rounds of
  prose had not held, and a review round tightened it. Then, inside the same
  pull request, the person overseeing the run had the platform's own
  instruction deleted instead: the text that told a session already on the
  right branch to go and make a new one. With the cause gone the guard had
  nothing left to police, and went too. Twenty-seven minutes from the commit
  that wrote it to the commit that deleted it; it never ran on main. The rule
  that replaced it — prune an instruction before guarding it — was committed
  minutes later, naming this pull request as its first application.
