catalogNote: Karen's sharpest catch, discarded in favour of a broader complaint.
  She had noticed that the pull request illustrating a creature that eats stale
  duplicates had itself pasted eleven dead selectors in from another Tenant, and
  that the safety gate — which checks whether output builds, never whether it
  means anything — waved it through. Thirteen minutes after it was written the
  post was replaced by one arguing nobody reads the Atlas at all. The wider
  grievance ran; the specific, checkable one did not.
