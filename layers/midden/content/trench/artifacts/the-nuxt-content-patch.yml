catalogNote: >-
  One hundred and seven lines patched into a dependency's compiled dist: retry
  the SQL dump fetch four times, and evict the cached load promise in a
  finally so one rejected fetch could no longer leave a collection blank for
  the life of the page. Carried eight days, then given up rather than fork a
  vendor's build. It did not go alone: pnpm-workspace.yaml, which never listed
  a package or a workspace member — one key, patchedDependencies, mapping
  @nuxt/content@3.15.0 to the file beside it — was created in the patch's first
  commit and deleted in the patch's last, having served exactly one dependency
  for exactly as long as it existed.
