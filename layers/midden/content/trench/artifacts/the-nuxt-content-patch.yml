  continuityCheck: >-
    upstream had not fixed the flaw — the removing commit says it is back. What
    died is the patch's own answer to it, the quiet retry that let a page heal
    without the reader noticing; nothing on main retries that load. What stands
    in its place is a different answer to the same fault: an error dialog that
    shows the failure and offers a reload, still live on main. The workspace
    file that existed only to declare the patch went out in the same commit.
site: the-current-cut
catalogNote: >-
  One hundred and seven lines patched into a dependency's compiled dist: retry
  the SQL dump fetch four times, and evict the cached load promise in a
  finally so one rejected fetch could no longer leave a collection blank for
  the life of the page. Carried eight days, then given up rather than fork a
  vendor's build. Empty sections kept appearing with it in place, and the owner
  asked for it to be dropped rather than carried. Three days later the first real capture showed that
  the failure the owner had been hitting was a different one — a piece of the
  site's own code failing to load, not the fetch the patch was written to
  retry. It did not go alone: pnpm-workspace.yaml, which never listed
  a package or a workspace member — one key, patchedDependencies, mapping
  @nuxt/content@3.15.0 to the file beside it — was created in the patch's first
  commit and deleted in the patch's last, having served exactly one dependency
  for exactly as long as it existed.
