catalogNote: >-
  Three agents on three different models were given one brief and one page to
  redesign, each in its own isolated worktree, each screenshotted at two widths so
  the three could be set side by side. A human looked at them and chose one. The
  other two were complete, working implementations of the same page, and they were
  gone within the hour — not deleted, which would have left a commit, but simply
  never committed at all, in working trees that no longer exist. What is unusual
  even among the trench's lost finds is that these never touched a ref at all, and
  are known only from the log of the session that commissioned them: no diff, no
  blob, no quotable line of their own. That two thirds of the work would be
  destroyed was the plan, not the accident.
