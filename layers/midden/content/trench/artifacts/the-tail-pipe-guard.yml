catalogNote: >-
  Some commands an agent runs take a long time, such as the whole test suite.
  If the agent pipes such a command into one that keeps only the end of the
  output, or only the start, the pipe reports how the last command went, not
  the first, so a failure can be lost and the output cut short. A line in the
  agents' standing instructions against this had been added by 12 July 2026,
  and a warning in one script by 2 August. On 6 August an issue reported that
  the mistake had recurred twice more in a review of 20 working sessions, after
  both. The design for an automatic check was already written in the project's
  table of rules (see the rulebook table), and the check went in on 5
  September, in a session where the owner had asked an agent to clear the
  backlog of issues marked ready. It refused a command when one statement
  piped into such a cutter and either the call ran in the background or the
  statement named a known long-running command. On 27 September it was
  widened to cover one more cutter. On 11 October an agent reading the last
  three days of session records counted 10 refusals in 44 sessions, each a
  small annoyance cleared by one retry, and asked the owner whether to keep,
  narrow or delete the check. It matched raw text, so a quoted string or the
  body of a commit message could set it off. The commit that removed it says
  that no recorded incident showed it catching a hidden failure: the incidents
  behind the issue were cut-off output from short scripts it never covered.
  The owner decided to delete it, with every leftover, the same day. The
  removal edited the project's settings, so it waited for a person to merge it.
removedIn: bd80fc4b830a069498b897640b00c5d109ab5482
