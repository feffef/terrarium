inscription:
  text: "Blocked by the tail-pipe guard (issue #873): piping this command into a trailing `tail`/`head`/`echo`/`tee` loses its real exit status and can truncate its output. Redirect the primary command to a file instead (`cmd > log 2>&1`), check `$?` directly, then read the file."
  source: "the check's refusal message, scripts/tail-pipe-guard.ts"
