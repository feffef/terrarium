catalogNote: >-
  An entry on the platform's own list of skills worth trusting, graded for
  importance, annotated with a note about which tooling to substitute — and
  pointing at nothing. There was never a `review` skill. Not on disk, not in the
  lock file, not in any session's list of what it could call. Its sibling entry
  carried a checksum of the installed source; this one had no source to checksum.
  It stood on the recommended list for thirty-two days and was found by a
  mechanical audit sweeping for entries whose skills had gone missing — not by
  anyone trying to take the recommendation. A recommendation nobody acts on
  never produces an error.
