site: the-rehearsals
catalogNote: >-
  A prune performed properly on a real file, in a real pull request, by an
  instruction set that was not yet law — the skill it was testing had not merged.
  It collapsed three sections on the dangers of reading an incomplete git history
  from eighty-five lines to thirty-six, keeping every command and cutting the
  reasoning. The gate went green at 14:54. It was closed, unmerged, at 14:57. What
  the rehearsal found was folded into the skill one minute before it closed; what
  the rehearsal did was thrown away. The problem it fixed is still recorded as
  unsolved, and still described as the strongest unbuilt refusal candidate in the
  corpus.
