catalogNote: >-
  A throwaway branch that deleted the project's rules and automatic checks for
  recording who or what wrote each piece of work (two checks, a script that runs
  when changes are saved, their tests and the lines in the instruction files that
  named them) to see whether the project still needed them. An agent then made
  commits, an issue, a pull request and comments, each with and without
  instructions, to see what the tools added by themselves. A link back to the
  agent's session appears only on a pull request's description. Comments get a
  generic line, and issue text and commits get nothing. The person running the
  session kept the rules anyway, as a hedge in case the tools change. The pull
  request was open for about a minute and closed unmerged.
