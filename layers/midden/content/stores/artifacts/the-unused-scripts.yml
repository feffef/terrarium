catalogNote: >-
  Seven small command-line tools in the project's scripts folder, written
  between 8 July and 25 September 2026, each for one job: a sheet that laid the
  Atlas's engravings side by side; a harness that reproduced a page-loading
  bug, built to test a patch to a software library that the project later
  removed; a list of who had commented last on each open issue; a list of pull
  requests merged in a date range; a check that a quotation matches its source;
  a one-time repair of session records whose one-line outcomes had been cut
  short at a hash mark; and a query over the session records. On 16 October 2026 an agent
  searched the whole project and found no caller for any of them, only the
  script's own test, a comment or a documentation entry. The owner approved a
  cleanup of the scripts folder in chat that day, and deleting these was its
  first step. Five of the seven came with their own tests, which were deleted
  too; the repair script's trial run found nothing to repair. The record does
  not say whether anyone ran any of them by hand after their last change.
