focus: "The merge gate as a walkthrough. The owner proposed that the gate, a
  sequence across many lessons, becomes a walkthrough, with the lesson keeping
  the concept; they chose one page edit that needs every check, with the docs-only
  shortcut shown as a side branch, and one stop per check. They then proposed
  that the CI step points at a GitHub Actions lesson, and chose to retitle
  Composite actions rather than add a lesson. Chosen because the owner asked for
  it. Deviations for the budget: no Scout; the pages the new chips link were
  judged from the guide index, and only the gate, Composite actions, protected
  paths, session logs and the touched pages were read in full. The page checks, a
  sonnet claim checker and a sonnet fresh reader ran. The claim checker found no
  wrong sentence; its two soft points (the merge script's order, the scope step's
  home) were tightened, and the fresh reader's findings were fixed where a source
  allowed."
