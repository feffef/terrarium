term: Human-only
definition: Said of a file whose changes a person with write access must merge, whatever the gate says. Agents may still edit it. There are two exceptions. The owner may tell an agent in the session to merge a human-only PR it wrote. The other is a minor or patch npm bump that Dependabot opens from the repo itself, that changes only package.json and the lockfile, and that stays within each package's major version (a 0.x minor counts as a major).
lesson: /t/glassbox/guide/terrarium-practice/protected-paths
