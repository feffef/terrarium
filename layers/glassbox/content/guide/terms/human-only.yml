term: Human-only
definition: Said of a file whose changes a person with write access must merge, whatever the gate says. Agents may still edit it. There are two exceptions. The owner may tell an agent in the session to merge a human-only pull request it wrote. The other is a small version bump that Dependabot, GitHub's update bot, opens from this repository, if it changes only package.json and the lockfile and stays within each package's major version (a 0.x minor counts as a major).
lesson: /t/glassbox/guide/terrarium-practice/protected-paths
