# Issue #3243. The areas and their paths copy `auto-triage`'s "Area labels"
# (.agents/skills/auto-triage/SKILL.md); change both. Tenants are named, not
# `layers/*`: adding a label that doesn't exist fails the run, so a new Tenant
# needs its label and a line here. Renames count both paths (#1443).

name: pr-area-label

on:
  pull_request:
    types: [opened, reopened, synchronize]

permissions:
  contents: read
  issues: write
  pull-requests: write

jobs:
  label:
    # Same-repo only: a fork's token is read-only.
    if: github.event.pull_request.head.repo.full_name == github.repository
    runs-on: ubuntu-latest
    steps:
      - name: 'Label areas by touched paths'
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          PR: ${{ github.event.pull_request.number }}
          REPO: ${{ github.repository }}
        run: |
          gh api --paginate "repos/$REPO/pulls/$PR/files" \
            --jq '.[] | .filename, (.previous_filename // empty)' | while read -r f; do
            case "$f" in
              layers/journal/*|layers/blog/*|layers/atlas/*|layers/midden/*|layers/marquee/*|layers/tinkerfund/*|layers/glassbox/*|layers/commons/*)
                echo "${f#layers/}" | cut -d/ -f1 ;;
              app/pages/index.vue|app/components/HomeShowcase.vue) echo homepage ;;
              app/*|shared/*|modules/*|scripts/*|nuxt.config.ts) echo platform ;;
            esac
          done | sort -u | while read -r area; do
            gh pr edit "$PR" -R "$REPO" --add-label "area:$area"
          done
