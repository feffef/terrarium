# Labels a PR with the `area:*` labels of the paths it touches (issue #3243;
# the labels: docs/agents/triage-labels.md). Adds only, never removes. Each
# Tenant is listed by name: a label missing for a new layer would fail the run.
# Renames count both paths (#1443).

name: pr-area-label

on:
  pull_request:
    types: [opened, reopened, synchronize]

permissions:
  contents: read
  issues: write
  pull-requests: write

jobs:
  label:
    # Same-repo only: a fork's token is read-only.
    if: github.event.pull_request.head.repo.full_name == github.repository
    runs-on: ubuntu-latest
    steps:
      - env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          PR: ${{ github.event.pull_request.number }}
          REPO: ${{ github.repository }}
        run: |
          gh api --paginate "repos/$REPO/pulls/$PR/files" \
            --jq '.[] | .filename, (.previous_filename // empty)' | while read -r f; do
            case "$f" in
              layers/journal/*|layers/blog/*|layers/atlas/*|layers/midden/*|layers/marquee/*|layers/tinkerfund/*|layers/glassbox/*|layers/commons/*)
                echo "${f#layers/}" | cut -d/ -f1 ;;
              app/pages/index.vue|app/components/HomeShowcase.vue) echo homepage ;;
              app/*|shared/*|modules/*|scripts/*|nuxt.config.ts) echo platform ;;
            esac
          done | sort -u | while read -r area; do
            gh pr edit "$PR" -R "$REPO" --add-label "area:$area"
          done
