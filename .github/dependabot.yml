# Dependabot version updates. They change `package.json`, so a human merges
# them (ADR-0004). Proposal #1633 would auto-merge npm minor/patch bumps.
version: 2
updates:
  - package-ecosystem: npm
    directory: /
    schedule:
      interval: weekly
    cooldown:
      default-days: 3
    groups:
      npm-minor-patch:
        update-types: [minor, patch]

  # Touches .github/ (human-only, ADR-0004), so never auto-merged.
  - package-ecosystem: github-actions
    directories: [/, /.github/actions/gate]
    schedule:
      interval: weekly
    cooldown:
      default-days: 3
    groups:
      github-actions:
        patterns: ["*"]
