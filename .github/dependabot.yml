# Dependabot version updates. ADR-0004 lets agents merge minor/patch bumps
# and keeps major bumps for a human: the `dependabot-sweep` Skill reviews each
# PR, and `merge-pr.ts` merges only a plain minor/patch bump.
version: 2
updates:
  - package-ecosystem: npm
    directory: /
    schedule:
      interval: weekly
    cooldown:
      default-days: 3
    groups:
      npm-minor-patch:
        update-types: [minor, patch]

  # Touches .github/ (human-only, ADR-0004), so never auto-merged.
  - package-ecosystem: github-actions
    directories: [/, /.github/actions/gate]
    schedule:
      interval: weekly
    cooldown:
      default-days: 3
    groups:
      github-actions:
        patterns: ["*"]
