    text: May a build run on the live server? ADR-0011 reads ADR-0001 as forbidding it (immutable image, tag and redeploy) and relaxes it; the ADR-0011 rule and guest-intake cite ADR-0001 for the deploy runner being the one allowed runtime build.
    kind: decision
    home: deploy/entrypoint.sh
