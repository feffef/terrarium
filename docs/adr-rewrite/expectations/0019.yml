adr: "0019"
summary_in_context: false
items:
  - id: C1
    text: A failed client content load surfaces as ContentLoadErrorDialog; a full reload recovers (server-DB render), since @nuxt/content poisons its client DB state.
    kind: claim
    section: Summary
    refs: [layers/blog/tests/e2e/blog.spec.ts:8, docs/adr/0028-navigation-reads-server-payloads.md:58, docs/diagrams/interactive-map/terrarium-overview.md:873, app/components/ContentLoadErrorDialog.vue:15, layers/midden/app/utils/strata.ts:70, app/composables/contentLoadRecovery.ts:5]
    conflict: false
  - id: C2
    text: Chunk-load failures auto-reload once per path per reloadNuxtApp TTL; a surviving failure settles on the dialog (2026-08-04 amendment).
    kind: claim
    section: Summary
    refs: [app/components/ContentLoadErrorDialog.vue:15, layers/blog/tests/e2e/blog.spec.ts:16, app/composables/contentLoadRecovery.ts:5, app/utils/chunkRecovery.ts:3, docs/adr/0028-navigation-reads-server-payloads.md:58]
    conflict: false
  - id: C3
    text: Do not patch @nuxt/content; the 2026-07-16 amendment reverted the patch and pnpm-workspace.yaml.
    kind: claim
    section: Rejected alternatives
    refs: [layers/blog/tests/e2e/blog.spec.ts:8, scripts/repro-236.ts:5, docs/research/content-client-queries-without-wasm.md:394, layers/midden/app/utils/strata.ts:70, layers/midden/content/trench/artifacts/the-nuxt-content-patch.yml:36]
    conflict: false
  - id: C4
    text: What is the failure? Lazily fetched per-collection WASM SQLite dump; a failed load poisons the collection for the page's life (#236, 2026-07-19 capture).
    kind: question
    section: Why
    refs: [layers/blog/tests/e2e/blog.spec.ts:8, docs/adr/0028-navigation-reads-server-payloads.md:18, docs/research/content-client-queries-without-wasm.md:8, app/utils/chunkRecovery.ts:3, scripts/repro-236.ts:5]
    conflict: false
  - id: C5
    text: Only the chunk-load class auto-reloads because a reload cannot fix other funnels and a reload loop is worse than a modal.
    kind: claim
    section: Why
    refs: [app/composables/contentLoadRecovery.ts:5, app/utils/chunkRecovery.ts:3]
    conflict: false
  - id: C6
    text: Is ADR-0019 superseded or live? Midden content says superseded; code, tests and ADR-0028 cite it as live.
    kind: question
    section: Summary
    refs: [layers/midden/app/utils/strata.ts:70, layers/midden/content/trench/artifacts/the-nuxt-content-patch.yml:36, docs/adr/0028-navigation-reads-server-payloads.md:58, app/components/ContentLoadErrorDialog.vue:15, app/composables/contentLoadRecovery.ts:5]
    conflict: true
  - id: C7
    text: Recovery is one mechanism wired once at ContentLoadErrorDialog, not per page (#236).
    kind: claim
    section: Consequences
    refs: [app/components/ContentLoadErrorDialog.vue:15, app/composables/contentLoadRecovery.ts:5]
    conflict: false
  - id: C8
    text: ADR-0028 payloads skip the client DB on most navigations, but it still loads (search, re-queries, failed payload), so the recovery stays.
    kind: claim
    section: When to revisit
    refs: [docs/adr/0028-navigation-reads-server-payloads.md:58, docs/research/content-client-queries-without-wasm.md:253, layers/blog/tests/e2e/blog.spec.ts:8]
    conflict: false
  - id: C9
    text: Evidence lives in layers/blog/tests/e2e/blog.spec.ts and the historical scripts/repro-236.ts.
    kind: claim
    section: See
    refs: [layers/blog/tests/e2e/blog.spec.ts:8, scripts/repro-236.ts:5, docs/research/content-client-queries-without-wasm.md:253]
    conflict: false
