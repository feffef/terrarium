items:
  - id: dialog-on-failure
    text: When a page's content fails to load in the browser, show an error dialog with a reload, not a blank page; only a full reload recovers.
    kind: decision
    home: app/components/ContentLoadErrorDialog.vue
    refs: [app/components/ContentLoadErrorDialog.vue:15, layers/blog/tests/e2e/blog.spec.ts:8, docs/adr/0028-navigation-reads-server-payloads.md:58, docs/diagrams/interactive-map/terrarium-overview.md:873, layers/midden/app/utils/strata.ts:70, docs/research/content-client-queries-without-wasm.md:253]
    conflict: false
  - id: chunk-failure-auto-reload
    text: A failed download of the app's own code reloads the page once by itself; if it fails again, the dialog shows. Every other failure gets the dialog, since a reload loop is worse.
    kind: decision
    refs: [app/components/ContentLoadErrorDialog.vue:15, app/composables/contentLoadRecovery.ts:5, app/utils/chunkRecovery.ts:3, layers/blog/tests/e2e/blog.spec.ts:16, docs/adr/0028-navigation-reads-server-payloads.md:58]
    conflict: false
  - id: no-dependency-patch
    text: We do not patch @nuxt/content; the client-DB patch was removed on 2026-07-16.
    kind: decision
    refs: [layers/blog/tests/e2e/blog.spec.ts:8, scripts/repro-236.ts:5, layers/midden/app/utils/strata.ts:70, docs/research/content-client-queries-without-wasm.md:394, layers/midden/content/trench/artifacts/the-nuxt-content-patch.yml:36]
    conflict: false
  - id: failure-cause
    text: Browser queries use a SQLite DB that downloads each collection's data on first use; a failed download leaves that collection empty for the page's life (issue 236).
    kind: mechanic
    home: scripts/repro-236.ts
    refs: [layers/blog/tests/e2e/blog.spec.ts:8, app/components/ContentLoadErrorDialog.vue:15, scripts/repro-236.ts:5, docs/adr/0028-navigation-reads-server-payloads.md:18, docs/research/content-client-queries-without-wasm.md:8]
    conflict: false
  - id: status
    text: Is ADR-0019 in force or superseded? Midden says superseded; ADR-0028 and code comments treat it as the live rule.
    kind: decision
    refs: [layers/midden/app/utils/strata.ts:70, layers/midden/content/trench/artifacts/the-nuxt-content-patch.yml:36, docs/adr/0028-navigation-reads-server-payloads.md:58, app/composables/contentLoadRecovery.ts:5]
    conflict: true
  - id: reload-limit
    text: The automatic reload happens at most once per path within Nuxt's reload time limit, and only in the browser.
    kind: mechanic
    home: app/composables/contentLoadRecovery.ts
    refs: [app/composables/contentLoadRecovery.ts:5, layers/blog/tests/e2e/blog.spec.ts:16]
    conflict: false
  - id: single-mechanism
    text: The recovery is wired once in the dialog every page shows, not per page (unclear whether the ADR or issue 236 owns this).
    kind: decision
    home: app/components/ContentLoadErrorDialog.vue
    refs: [app/components/ContentLoadErrorDialog.vue:15, app/composables/contentLoadRecovery.ts:5]
    conflict: false
