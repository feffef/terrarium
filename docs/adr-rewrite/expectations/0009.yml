  - id: fallback-retirement-measure
    text: What measure decides when the fallback hooks can be retired?
    kind: decision
    conflict: true
    conflict_note: shared/schemas/session.ts:103 says it counts landedBy rather than orphaned sessions; scripts/audit-skills.ts:169 calls it the close-session invocation rate (orphan count).
    refs:
      - scripts/audit-skills.ts:169
      - shared/schemas/session.ts:103
  - id: landed-log-mutability
    text: Can a landed log be changed?
    kind: decision
    conflict: true
    conflict_note: scripts/validate-content.ts:97 treats older logs as untouchable (unclear wording); shared/schemas/session.ts:37 has a later session flip in-review to completed and guest-contributions.md:61 updates a log on revision.
    refs:
      - scripts/validate-content.ts:97
      - shared/schemas/session.ts:37
      - docs/agents/guest-contributions.md:61
  - id: rederive-repeatable
    text: Re-deriving a log gives the same bytes and a superset of entries; a doc edited between derivations can break this under output matching.
    kind: mechanic
    home: scripts/log-session.ts
    conflict: false
    refs:
