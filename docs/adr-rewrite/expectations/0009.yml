items:
  - id: external-logs
    text: A log by a different agent or toolchain carries external true (absent means ours); it stays visible and marked, has no session page, is skipped by friction mining and the Skill audit, keeps its ideas and drops its learnings.
    kind: decision
    conflict: false
    refs:
      - .agents/skills/visitor-loop/scripts/ideas.ts:155
      - .agents/skills/visitor-loop/tests/unit/ideas.spec.ts:144
