  - id: archiving
    text: Aged-out logs move from current to archived by git mv, keeping the newest 7 session dates, through a normal reviewed PR rather than the direct path.
    kind: mechanic
    home: scripts/archive-journal-content.ts
    conflict: false
    refs:
