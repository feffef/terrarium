  - id: not-read-and-detection-friction
    text: The agent marks a derived read it never read as (not read) and the stitch drops it, a dropped shell credit becoming a Friction; a real read the detector missed is logged as a SHELL-READ-DETECTION Friction, at least moderate, with the command and expected path.
    kind: mechanic
    home: scripts/session-trace.ts (NOT_READ_REASON), log-session Skill
    conflict: false
    refs:
      - scripts/session-trace.ts:768
      - .agents/skills/log-session/SKILL.md:170
      - .agents/skills/log-session/SKILL.md:190
      - CONTEXT.md:142
  - id: read-verdicts
    text: docsRead and skillsUsed merge the agent's picks with derived entries; the useful verdict (yes, partly, no) is agent-written only, absent on derived reads and on logs before 2026-10-11; loaded rules also get verdicts.
    kind: mechanic
    home: shared/schemas/session.ts
    conflict: false
    refs:
      - shared/schemas/session.ts:44
      - shared/schemas/session.ts:47
      - scripts/log-session.ts:810
  - id: commit-trailer
    text: The log commit carries the same Claude-Session trailer, built in repo code, and log-session reads the session id from it.
    kind: mechanic
    home: unclear (scripts/log-session.ts)
    conflict: false
    refs:
      - docs/adr/0017-provenance-footer-on-agent-authored-content.md:31
