  - id: direct-to-main-scope
    text: Only one session's own log file, in the sessions folder, pushed by a script, may reach main without a PR, because it is inert schema-checked data the gate can't protect and a PR would suppress; logs never travel through a feature branch or PR otherwise, and automatic PR opening doesn't change this.
    kind: decision
    conflict: true
    conflict_note: scripts/merged-since.ts says "session/doc" commits go direct to main; all others limit it to the one session-log file.
    refs:
      - scripts/log-session.ts:438
      - tests/unit/log-session-push.spec.ts:1
      - docs/adr/0003-agent-operating-model-and-governance.md:44
      - docs/adr/0003-agent-operating-model-and-governance.md:141
      - docs/adr/0003-agent-operating-model-and-governance.md:145
      - docs/diagrams/interactive-map/terrarium-overview.md:866
      - scripts/merged-since.ts:8
      - scripts/merged-since.ts:67
      - docs/research/github-branch-protection-vs-autonomous-log-commits.md:3
  - id: shell-read-detection
    text: A shell command counts as reading a doc when its output shows enough of the doc's distinctive lines (lines of 30+ chars, at least 10 shown); parsing the command only explains near-misses; scope is a path-shape test; shell reads fold into docsRead and docsReadViaShell stays only so old logs validate.
    kind: mechanic
    home: scripts/shell-reads.ts
    conflict: true
    conflict_note: docs/research/shell-reads-by-output-matching.md:129 quotes the ADR saying the trace is derived from tool_use calls, not results; output matching reads results.
    refs:
      - scripts/shell-reads.ts:15
      - scripts/shell-reads.ts:753
      - scripts/shell-reads.ts:770
      - scripts/session-trace.ts:285
      - scripts/session-trace.ts:335
      - scripts/session-trace.ts:532
      - shared/schemas/session.ts:68
      - docs/research/shell-reads-by-output-matching.md:3
      - docs/research/shell-reads-by-output-matching.md:129
      - docs/research/shell-reads-by-output-matching.md:139
      - .agents/prune-trials.yml:107
  - id: authored-vs-derived
    text: The agent writes only the judgment half (goal, status, outcome, summary, every friction, optional ideas and learnings, chosen reads and Skills with reasons); timings, models, tool counts, files, subagents, branch and rules loaded come from the transcript and are never self-reported; uncited reads get a placeholder reason.
    kind: decision
    conflict: false
    refs:
      - scripts/session-trace.ts:1
      - scripts/session-trace.ts:22
      - scripts/log-session.ts:109
      - shared/schemas/session.ts:53
      - tests/unit/session-trace.spec.ts:1
      - shared/trace-fields.ts:19
      - .agents/skills/log-session/SKILL.md:10
      - .agents/skills/log-session/SKILL.md:107
  - id: schema-evolution
    text: The log schema is frozen and strict; additive optional fields need no version bump and a missing schemaVersion means 1 until the first breaking change; other append-only collections (pingbacks) use this same policy, so the ADR is its single home.
    kind: decision
    conflict: false
    refs:
      - layers/blog/tenant.config.ts:86
      - docs/adr/0012-cross-persona-pingbacks-via-authored-denormalization.md:72
      - scripts/log-session.ts:67
      - scripts/log-session.ts:72
      - shared/schemas/session.ts:21
      - shared/schemas/session.ts:28
      - docs/adr/0017-provenance-footer-on-agent-authored-content.md:77
  - id: when-to-log
    text: A session writes its log when it opens a PR (status in-review, PR open but not merged) and again when done or blocked; completed is only for work that landed; the rule loads at session start so it can say when to act.
    kind: decision
    conflict: false
    refs:
      - docs/adr/0003-agent-operating-model-and-governance.md:46
      - shared/schemas/session.ts:37
      - docs/adr/0029-instructions-load-with-the-files-they-govern.md:66
      - docs/agents/pr-workflow.md:110
      - .agents/skills/audit-docs/SKILL.md:230
      - docs/diagrams/interactive-map/terrarium-overview.md:869
  - id: enforcement-point
    text: scripts/log-session.ts is the single enforcement point and only lander; it refuses a file outside the sessions folder, a commit changing more than one path, and a wrong filename (<startedAt-date>-<session>.yml), and validates against the schema; GitHub can't scope by path, so this is the only path-level check.
    kind: mechanic
    home: scripts/log-session.ts
    conflict: false
    refs:
      - scripts/log-session.ts:1
      - scripts/log-session.ts:1097
      - tests/unit/log-session.spec.ts:1
      - docs/research/github-branch-protection-vs-autonomous-log-commits.md:129
      - scripts/session-logs.ts:2
  - id: external-log-in-pr
    text: An outside agent has no hook and no push to main, so it commits its log inside its fork PR (the one allowed case of a log in a PR), marked external true, one log per unit of work including revisions.
    kind: decision
    conflict: false
    refs:
      - docs/agents/guest-contributions.md:16
      - docs/agents/guest-contributions.md:50
      - docs/agents/guest-contributions.md:61
      - docs/agents/guest-contributions.md:70
      - layers/journal/tests/e2e/journal.spec.ts:49
  - id: main-protection-bypass
    text: The protect-main ruleset lets the repo admin (the owner's credential the lander uses) bypass Always; each bypass is recorded as the exception's audit trail; classic branch protection would block the push.
    kind: mechanic
    home: GitHub protect-main ruleset (docs/research/github-branch-protection-vs-autonomous-log-commits.md, Current state)
    conflict: false
    refs:
      - docs/research/github-branch-protection-vs-autonomous-log-commits.md:73
      - docs/research/github-branch-protection-vs-autonomous-log-commits.md:210
      - docs/research/github-branch-protection-vs-autonomous-log-commits.md:269
      - docs/research/public-readiness-review.md:75
      - .agents/prune-trials.yml:94
  - id: landing-hooks
    text: Authoring writes a gitignored scratch; hooks stitch it with the trace and push it, Stop primary with SessionEnd and SessionStart (resume) as fallbacks; each log records which hook landed it (landedBy); an unchanged re-derive never commits.
    kind: mechanic
    home: scripts/log-session.ts, .claude/settings.json
    conflict: true
    conflict_note: shared/schemas/session.ts:53 and .gitignore:33 call the lander the SessionEnd extractor/handler; scripts/log-session.ts:11 and the log-session Skill make Stop primary.
    refs:
      - scripts/log-session.ts:11
      - scripts/log-session.ts:467
      - scripts/log-session.ts:659
      - shared/schemas/session.ts:103
      - .gitignore:33
  - id: log-purpose
    text: A session log is one honest self-report per session, the Platform's main record of itself rather than a Tenant's content, and the input the self-improvement Skills mine.
    kind: decision
    conflict: false
    refs:
      - shared/schemas/session.ts:1
      - .agents/skills/frictions-to-fixes/SKILL.md:9
      - layers/journal/tenant.config.ts:135
