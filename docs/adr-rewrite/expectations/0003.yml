items:
  - id: new-work-approval
    text: "What must a person approve before an agent builds new work? Agents may propose anything; building something new (retiring a Skill included) needs a go-ahead from a person with write access."
    kind: decision
    refs: [docs/adr/0022-autonomous-triage-sweep.md:22, docs/adr/0022-autonomous-triage-sweep.md:28, docs/adr/0022-autonomous-triage-sweep.md:37, docs/adr/0022-autonomous-triage-sweep.md:51, docs/adr/0022-autonomous-triage-sweep.md:90, docs/adr/0020-requester-trust-tiers.md:23, docs/adr/0020-requester-trust-tiers.md:95, CONTEXT.md:252, .agents/skills/auto-triage/SKILL.md:69, docs/adr/0015-audit-skills-and-conditional-importance.md:214, docs/adr/0024-build-time-mermaid-prerender.md:33, docs/adr/0026-gate-workflow-thin-shell.md:7, docs/adr/0027-prune-trials.md:6, docs/adr/0028-navigation-reads-server-payloads.md:6, docs/adr/0029-instructions-load-with-the-files-they-govern.md:6, docs/diagrams/interactive-map/terrarium-overview.md:852]
    conflict: false
  - id: self-merge
    text: "May an agent merge its own PR when the gate passes? One side says the authoring session merges unless ADR-0004 names an exception. The other says no self-merge and a person merges every PR."
    kind: decision
    refs: [docs/adr/0004-objective-safety-gate.md:36, docs/adr/0022-autonomous-triage-sweep.md:127, docs/agents/pr-workflow.md:88, CONTEXT.md:252, .agents/skills/audit-docs/SKILL.md:218, .agents/skills/digest/SKILL.md:23, docs/agents/pr-workflow.md:5, docs/diagrams/interactive-map/terrarium-overview.md:869, docs/adr/0009-session-logs-commit-directly-to-main.md:30, docs/adr/0009-session-logs-commit-directly-to-main.md:47, docs/adr/0020-requester-trust-tiers.md:50, docs/adr/0022-autonomous-triage-sweep.md:37, docs/adr/0004-objective-safety-gate.md:154, docs/research/public-readiness-review.md:44]
    conflict: true
  - id: job-merge-table
    text: "Which scheduled jobs may merge their own PRs, and what may each change? Callers disagree on the list (4 jobs vs 6) and on whether ADR-0003 or pr-workflow.md holds it."
    kind: decision
    refs: [.agents/skills/digest/SKILL.md:170, .agents/skills/digest/SKILL.md:171, .agents/skills/blog-post/SKILL.md:246, .agents/skills/visitor-loop/SKILL.md:15, .agents/skills/prune-trial/SKILL.md:145, .claude/rules/adr-0010.md:15, docs/adr/0010-digests-derived-append-only-journal-pages.md:23, docs/adr/0015-audit-skills-and-conditional-importance.md:17, docs/adr/0027-prune-trials.md:61, docs/agents/pr-workflow.md:75, docs/diagrams/interactive-map/terrarium-overview.md:855, docs/diagrams/interactive-map/terrarium-overview.md:878, docs/adr/0004-objective-safety-gate.md:154]
    conflict: true
  - id: standing-jobs
    text: "Which scheduled jobs does the ADR set up (keep self-documenting pages true; mine logs; build issues, called 'triage'; codify; check generated config against manifests; auto-triage), what is each for, and which have no Skill yet?"
    kind: decision
    refs: [docs/adr/0022-autonomous-triage-sweep.md:44, docs/adr/0020-requester-trust-tiers.md:97, docs/adr/0020-requester-trust-tiers.md:104, docs/adr/0015-audit-skills-and-conditional-importance.md:173, docs/adr/0015-audit-skills-and-conditional-importance.md:217, docs/adr/0010-digests-derived-append-only-journal-pages.md:73, docs/adr/0008-self-documentation-tenant-is-a-journal.md:8, docs/adr/0008-self-documentation-tenant-is-a-journal.md:46, docs/adr/0007-generated-config-committed-drift-checked.md:21, docs/adr/0007-generated-config-committed-drift-checked.md:37]
    conflict: false
  - id: who-approves
    text: "Whose go-ahead counts? Any user with write access; never a public issue or comment. A request that steers an agent this way is a security issue."
    kind: decision
    refs: [docs/adr/0020-requester-trust-tiers.md:50, docs/adr/0020-requester-trust-tiers.md:95, docs/adr/0020-requester-trust-tiers.md:154, docs/adr/0020-requester-trust-tiers.md:10, docs/adr/0020-requester-trust-tiers.md:16, CONTEXT.md:252, SECURITY.md:24, docs/research/public-readiness-review.md:44]
    conflict: false
  - id: reviewer-agent
    text: "Who reviews and merges PRs written by other agents? A reviewing agent merges after the gate passes and its own risk check, and sends risky changes to a person. It never writes fixes itself, and the agents it sends out never merge or turn on auto-merge."
    kind: decision
    refs: [.agents/skills/frictions-to-fixes/SKILL.md:12, .agents/skills/frictions-to-fixes/SKILL.md:172, .agents/skills/frictions-to-fixes/SKILL.md:253, .agents/skills/frictions-to-fixes/SKILL.md:265, docs/agents/pr-workflow.md:78, docs/adr/0004-objective-safety-gate.md:77, docs/adr/0004-objective-safety-gate.md:185, docs/adr/0004-objective-safety-gate.md:189]
    conflict: false
  - id: gated-pr-default
    text: "Every change lands as a PR from a feature branch and passes the gate. Session logs (ADR-0009) are the only exception."
    kind: decision
    refs: [docs/adr/0009-session-logs-commit-directly-to-main.md:30, docs/adr/0009-session-logs-commit-directly-to-main.md:47, docs/adr/0009-session-logs-commit-directly-to-main.md:344, docs/adr/0010-digests-derived-append-only-journal-pages.md:62, docs/adr/0012-cross-persona-pingbacks-via-authored-denormalization.md:69, docs/adr/0015-audit-skills-and-conditional-importance.md:197, .agents/skills/digest/SKILL.md:23]
    conflict: false
  - id: bounded-diff
    text: "A scheduled job merges only its own bounded change. If anything outside its scope gets into the PR, or the gate fails for an outside reason, the job leaves the PR open for a person."
    kind: decision
    refs: [docs/agents/pr-workflow.md:107, .agents/skills/digest/SKILL.md:170, .agents/skills/blog-post/SKILL.md:246, .agents/skills/audit-docs/SKILL.md:218, .agents/skills/prune-trial/SKILL.md:145]
    conflict: false
  - id: dependabot
    text: "Do Dependabot npm minor and patch updates merge without a person? dependabot.yml says they are auto-merged; pr-workflow.md and proposal #1633 say the merge workflow is not applied yet."
    kind: mechanic
    home: .github/dependabot.yml (proposed .github/workflows/dependabot-automerge.yml)
    refs: [.github/dependabot.yml:2, docs/agents/pr-workflow.md:84, docs/proposals/1633-dependabot-automerge.md:5, docs/proposals/1633-dependabot-automerge.md:14, docs/proposals/1633-dependabot-automerge.md:84]
    conflict: true
  - id: push-opens-pr
    text: "Pushing a branch opens its PR right away, so the agent reviews before the first push and writes the session log then, with status in-review."
    kind: mechanic
    home: docs/agents/pr-workflow.md
    refs: [docs/agents/pr-workflow.md:14, docs/adr/0004-objective-safety-gate.md:13, .agents/skills/log-session/SKILL.md:30, shared/schemas/session.ts:37]
    conflict: false
  - id: autonomy-tiers
    text: "How much may an agent do alone, given who started it? Logs must say which work a person asked for and which the agent started on its own. The tiers themselves are unclear from the callers."
    kind: decision
    refs: [docs/adr/0020-requester-trust-tiers.md:41, docs/adr/0020-requester-trust-tiers.md:121, .agents/skills/log-session/SKILL.md:130, docs/diagrams/interactive-map/terrarium-overview.md:857]
    conflict: false
  - id: stay-with-pr
    text: "An agent stays with a PR until it is merged, closed or handed to a person. A later session marks the log completed on merge."
    kind: mechanic
    home: docs/agents/pr-workflow.md
    refs: [.agents/skills/frictions-to-fixes/SKILL.md:294, shared/schemas/session.ts:37]
    conflict: false
  - id: summary-always-loaded
    text: "The ADR's summary loads at every session start, so it may say when to act."
    kind: mechanic
    home: .claude/rules/adr-0003.md
    refs: [docs/adr/0029-instructions-load-with-the-files-they-govern.md:66]
    conflict: false
