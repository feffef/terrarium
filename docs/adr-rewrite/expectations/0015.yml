items:
  - id: pack-skills-not-edited
    text: Skills from the outside pack (listed in skills-lock.json) are never edited; their SKILL.md stays as installed, because reinstalling wipes local edits.
    kind: decision
    refs: [scripts/verify-skills-lock.ts:1, scripts/verify-skills-lock.ts:4, scripts/verify-skills-lock.ts:221, scripts/audit-skills.ts:64, layers/journal/tenant.config.ts:39, .agents/skills/frictions-to-fixes/SKILL.md:97, docs/adr/0027-prune-trials.md:58, .claude/rules/adr-0005.md:17, docs/diagrams/interactive-map/terrarium-overview.md:860]
    conflict: false
  - id: inventory-purpose
    text: The Skill Inventory records each Skill's role and importance to this project, not a copy of its description; it is where outside-pack Skills get project-specific notes.
    kind: decision
    refs: [layers/journal/tenant.config.ts:127, scripts/verify-skills-lock.ts:4, scripts/validate-skill-cadence.ts:4, docs/diagrams/interactive-map/terrarium-overview.md:867, docs/diagrams/interactive-map/terrarium-overview.md:860]
    conflict: false
  - id: pack-hash-pin
    text: CI checks each outside-pack SKILL.md against a generated sha256 (installedSha256) in its Inventory entry; regenerate with pnpm verify:skills-lock --write; the check runs first in the gate.
    kind: mechanic
    home: [scripts/verify-skills-lock.ts, .github/actions/gate/action.yml]
    refs: [.github/actions/gate/action.yml:45, layers/journal/tenant.config.ts:39, scripts/verify-skills-lock.ts:1, scripts/verify-skills-lock.ts:4, scripts/verify-skills-lock.ts:221]
    conflict: false
  - id: audit-skills-scope
    text: audit-skills writes only Inventory entries and GitHub issues; a finding that would change a Skill's text becomes an issue for a person, the rest become observations; repo-specific notes on pack Skills are its job.
    kind: decision
    refs: [.agents/skills/audit-skills/SKILL.md:22, .agents/skills/frictions-to-fixes/SKILL.md:97, docs/adr/0003-agent-operating-model-and-governance.md:22]
    conflict: false
  - id: observations-log
    text: An Inventory entry's observations list is an internal audit-skills log, not shown on the site; one finding per run, may name PR/issue/session ids; entries older than 40 days are dropped.
    kind: mechanic
    home: [layers/journal/tenant.config.ts, scripts/audit-skills.ts]
    refs: [layers/journal/tenant.config.ts:43, layers/journal/tenant.config.ts:46, scripts/audit-skills.ts:112]
    conflict: false
  - id: sync-job
    text: audit-skills runs on a schedule and, with digest, makes up the sync job; one job may be carried out by several Skills.
    kind: decision
    refs: [docs/adr/0003-agent-operating-model-and-governance.md:54, docs/adr/0010-digests-derived-append-only-journal-pages.md:14]
    conflict: false
  - id: script-gathers-session-judges
    text: A script gathers audit-skills' facts (usage over N days of session logs, Inventory entries, behaviour-check picks, closure signals) as JSON; every judgement stays with the session.
    kind: mechanic
    home: [scripts/audit-skills.ts, tests/unit/audit-skills.spec.ts]
    refs: [scripts/audit-skills.ts:1, tests/unit/audit-skills.spec.ts:1]
    conflict: false
  - id: audit-skills-merge-evidence
    text: Which audit-skills changes merge without a person, and what existing evidence rule must each Inventory edit cite? (unclear)
    kind: decision
    refs: [docs/adr/0003-agent-operating-model-and-governance.md:22]
    conflict: false
  - id: role-field-limits
    text: An Inventory role is about 50 words (80 at most) and names no PR, issue or session ids.
    kind: mechanic
    home: [layers/journal/tenant.config.ts]
    refs: [layers/journal/tenant.config.ts:34]
    conflict: false
  - id: skills-dir-split
    text: Skills live in .agents/skills/ with .claude/skills/ as links (unclear whether ADR-0015 must say this).
    kind: mechanic
    home: [docs/adr/0005-skill-model.md]
    refs: [docs/adr/0005-skill-model.md:11]
    conflict: false
