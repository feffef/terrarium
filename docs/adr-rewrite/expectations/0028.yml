items:
  - id: 1
    text: In-app navigation loads page data from a server-rendered payload, not the browser content database.
    kind: decision
    refs: [nuxt.config.ts:16, layers/blog/tests/e2e/blog.spec.ts:12, layers/blog/tests/e2e/blog.spec.ts:126, tests/e2e/smoke.spec.ts:60, .claude/rules/adr-0019.md:15, docs/adr/0019-patched-nuxt-content-client-db-loading.md:199, docs/research/content-client-queries-without-wasm.md:31, docs/research/content-client-queries-without-wasm.md:376]
    conflict: false
  - id: 2
    text: When does the browser content database still load (Tinkerfund search, re-queries after mount, failed payload fetch falling back)?
    kind: decision
    refs: [layers/blog/tests/e2e/blog.spec.ts:26, layers/blog/tests/e2e/blog.spec.ts:12, docs/adr/0019-patched-nuxt-content-client-db-loading.md:199, .claude/rules/adr-0019.md:15, docs/diagrams/interactive-map/terrarium-overview.md:873, docs/research/content-client-queries-without-wasm.md:376]
    conflict: false
  - id: 3
    text: How is it tested? E2e tests assert navigation makes no browser-database request; blog tests block the payload to reach the recovery dialog.
    kind: mechanic
    home: [tests/e2e/smoke.spec.ts, layers/blog/tests/e2e/blog.spec.ts]
    refs: [tests/e2e/smoke.spec.ts:60, layers/blog/tests/e2e/blog.spec.ts:126, layers/blog/tests/e2e/blog.spec.ts:26, docs/adr/0019-patched-nuxt-content-client-db-loading.md:199, docs/research/content-client-queries-without-wasm.md:376]
    conflict: false
  - id: 4
    text: The server page cache is size-bounded (LRU, 200 entries) however many distinct URLs arrive.
    kind: mechanic
    home: [nuxt.config.ts, tests/unit/page-cache.spec.ts]
    refs: [nuxt.config.ts:25, tests/unit/page-cache.spec.ts:1, docs/research/content-client-queries-without-wasm.md:208, docs/research/content-client-queries-without-wasm.md:376]
    conflict: false
  - id: 5
    text: Which pages are cached and for how long? / and /t/**, 60 s, no stale serving.
    kind: mechanic
    home: [nuxt.config.ts]
    refs: [nuxt.config.ts:16, docs/research/content-client-queries-without-wasm.md:163, app/pages/index.vue:63]
    conflict: false
  - id: 6
    text: A page whose server render reads a request header must make the cache keep one copy per value; one visitor's locale never reaches another.
    kind: decision
    home: [layers/tinkerfund/nuxt.config.ts, layers/tinkerfund/tests/e2e/tinkerfund.spec.ts]
    refs: [layers/tinkerfund/nuxt.config.ts:10, layers/tinkerfund/tests/e2e/tinkerfund.spec.ts:31, docs/research/content-client-queries-without-wasm.md:208, docs/research/content-client-queries-without-wasm.md:376]
    conflict: false
  - id: 7
    text: How stale may time-dependent content ("today", "now") be? Computed at render time; cache bounds it (about 60 s server plus 60 s browser).
    kind: decision
    refs: [app/pages/index.vue:63, docs/research/content-client-queries-without-wasm.md:208]
    conflict: false
  - id: 8
    text: Which pages skip the cache? Tinkerfund search is uncached and runs in the browser.
    kind: decision
    refs: [layers/tinkerfund/nuxt.config.ts:10, docs/adr/0019-patched-nuxt-content-client-db-loading.md:199]
    conflict: false
  - id: 9
    text: Does the ADR hold the final configuration and byte measurements, or point to nuxt.config.ts? Research note says both.
    kind: decision
    refs: [docs/research/content-client-queries-without-wasm.md:31, docs/research/content-client-queries-without-wasm.md:34, docs/research/content-client-queries-without-wasm.md:163]
    conflict: true
  - id: 10
    text: Links fetch a payload on interaction, not when they scroll into view.
    kind: mechanic
    home: [nuxt.config.ts]
    refs: [nuxt.config.ts:16, docs/research/content-client-queries-without-wasm.md:163]
    conflict: false
  - id: 11
    text: Keep payloads small; fetched data is trimmed to what the page reads (partly unclear).
    kind: decision
    refs: [layers/tinkerfund/app/composables/browse.ts:20]
    conflict: false
  - id: 12
    text: Who merges a change here? Global runtime change and nuxt.config.ts need a human (ADR-0004, ADR-0018).
    kind: decision
    refs: [docs/research/content-client-queries-without-wasm.md:376]
    conflict: false
