adr: "0028"
summary_in_context: false
checklist:
  - id: C1
    text: In-app navigation reads a server-rendered _payload.json instead of querying Content in the browser client DB.
    kind: claim
    section: Summary
    refs: [nuxt.config.ts:16, layers/blog/tests/e2e/blog.spec.ts:12, layers/blog/tests/e2e/blog.spec.ts:126, tests/e2e/smoke.spec.ts:60, .claude/rules/adr-0019.md:15, docs/adr/0019-patched-nuxt-content-client-db-loading.md:199, docs/research/content-client-queries-without-wasm.md:31, docs/research/content-client-queries-without-wasm.md:376]
    conflict: false
  - id: C2
    text: Pages / and /t/** are served from a server-side page cache (maxAge 60, swr false).
    kind: claim
    section: Summary
    refs: [nuxt.config.ts:16, app/pages/index.vue:63, layers/tinkerfund/nuxt.config.ts:10, layers/tinkerfund/tests/e2e/tinkerfund.spec.ts:31, docs/research/content-client-queries-without-wasm.md:163, docs/research/content-client-queries-without-wasm.md:376]
    conflict: false
  - id: C3
    text: The page cache is size-bounded (lru-cache, max 200, #1446), added as an amendment.
    kind: claim
    section: Consequences
    refs: [nuxt.config.ts:25, tests/unit/page-cache.spec.ts:1, docs/research/content-client-queries-without-wasm.md:208, docs/research/content-client-queries-without-wasm.md:376]
    conflict: false
  - id: C4
    text: Where does the client DB still load? Queries outside a payload - Tinkerfund search, re-queries after mount, a failed payload fetch (falls back to the client DB).
    kind: question
    section: Scope and limits
    refs: [layers/blog/tests/e2e/blog.spec.ts:26, docs/adr/0019-patched-nuxt-content-client-db-loading.md:199, layers/tinkerfund/nuxt.config.ts:10, docs/research/content-client-queries-without-wasm.md:376]
    conflict: false
  - id: C5
    text: A page that reads a request header or cookie on the server must list it in the cache's varies, or one visitor's output reaches the next (#1365).
    kind: claim
    section: Consequences
    refs: [layers/tinkerfund/nuxt.config.ts:10, layers/tinkerfund/tests/e2e/tinkerfund.spec.ts:31, docs/research/content-client-queries-without-wasm.md:376]
    conflict: false
  - id: C6
    text: Failure recovery stays ADR-0019's; a failed payload falls back to the client DB where ContentLoadErrorDialog and its funnels apply unchanged.
    kind: claim
    section: See
    refs: [layers/blog/tests/e2e/blog.spec.ts:12, layers/blog/tests/e2e/blog.spec.ts:26, docs/diagrams/interactive-map/terrarium-overview.md:873, docs/adr/0019-patched-nuxt-content-client-db-loading.md:199]
    conflict: false
  - id: C7
    text: Server-computed "now" is computed at render time and stale by at most the page cache's window.
    kind: claim
    section: Consequences
    refs: [app/pages/index.vue:63]
    conflict: false
  - id: C8
    text: Payloads carry useAsyncData results, so Tenant code trims them to what the page reads.
    kind: claim
    section: Consequences
    refs: [layers/tinkerfund/app/composables/browse.ts:20]
    conflict: false
  - id: C9
    text: Where do the final configuration and the byte measurements live? research:34 says ADR-0028; research:163 says ADR-0028 and the two nuxt.config.ts files.
    kind: question
    section: Why
    refs: [docs/research/content-client-queries-without-wasm.md:34, docs/research/content-client-queries-without-wasm.md:163]
    conflict: true
  - id: C10
    text: Why payload extraction over prerendering, rewiring queryCollection, or a JS query engine?
    kind: question
    section: Rejected alternatives
    refs: [docs/research/content-client-queries-without-wasm.md:31, docs/research/content-client-queries-without-wasm.md:376]
    conflict: false
  - id: C11
    text: It is a global runtime change in a Human-only file, so a human merges changes to it (ADR-0004, ADR-0018).
    kind: claim
    section: Consequences
    refs: [docs/research/content-client-queries-without-wasm.md:376]
    conflict: false
  - id: C12
    text: Does ADR-0028 govern the container files (deploy/entrypoint.sh, Dockerfile, docker-compose.yml)? Unclear from context.
    kind: question
    section: Scope and limits
    refs: [docs/diagrams/interactive-map/terrarium-overview.md:872]
    conflict: false
  - id: C13
    text: The view-transition check is still open.
    kind: claim
    section: When to revisit
    refs: [docs/research/content-client-queries-without-wasm.md:376]
    conflict: false
