items:
  - id: infra-not-demo
    text: The Journal is part of the Platform itself (its self-documentation), not a demo Tenant, and is the only Tenant whose reason to exist is in an ADR.
    kind: decision
    refs: [CONTEXT.md:330, docs/adr/0021-multi-context-domain-docs.md:69, layers/journal/CONTEXT.md:8]
    conflict: false
  - id: why-it-exists
    text: Why does the Platform keep a journal of its own work, and why can't it be dropped?
    kind: decision
    refs: [docs/adr/0021-multi-context-domain-docs.md:69, layers/journal/CONTEXT.md:8]
    conflict: false
  - id: renamed-from-status
    text: The Tenant first called "status" was renamed the Journal because it is a logbook, not a status report; the status-dashboard design was dropped.
    kind: decision
    refs: [layers/midden/content/trench/artifacts/the-status-dashboard.yml:10, layers/midden/content/trench/artifacts/the-status-dashboard.yml:16]
    conflict: false
  - id: two-content-kinds
    text: Journal content comes in two kinds - Inventories rebuilt from repo state and overwritten each sync, and agent-written entries that are only ever added to (session logs, research, ideas).
    kind: decision
    refs: [docs/adr/0010-digests-derived-append-only-journal-pages.md:28, docs/adr/0015-audit-skills-and-conditional-importance.md:153]
    conflict: false
  - id: inventory-term-home
    text: Where is the word "Inventory" defined? 0015 says the Journal glossary (ADR-0008); the Journal's CONTEXT.md says root CONTEXT.md.
    kind: mechanic
    home: unclear
    refs: [docs/adr/0015-audit-skills-and-conditional-importance.md:153, layers/journal/CONTEXT.md:8]
    conflict: true
  - id: session-logs
    text: Every agent session gets a session log in the Journal - one honest self-report of its goal, outcome, reads, Skills used and every problem hit.
    kind: decision
    refs: [docs/adr/0009-session-logs-commit-directly-to-main.md:24]
    conflict: false
  - id: journal-location
    text: The Journal is shown at /t/journal/current and holds session logs, inventories and digests.
    kind: mechanic
    home: layers/journal/
    refs: [CONTEXT.md:330]
    conflict: false
  - id: journal-files
    text: Which files implement the Journal? Unclear whether archiving belongs to ADR-0008 or ADR-0010.
    kind: mechanic
    home: scripts/archive-journal-content.ts
    refs: [docs/diagrams/interactive-map/terrarium-overview.md:865]
    conflict: false
