items:
  - id: C1
    text: A collection is hidden from every cross-tenant reader unless its manifest opts it in with a `kind`; hidden is the default.
    kind: decision
    conflict: false
    refs: [layers/atlas/tenant.config.ts:62, layers/blog/tenant.config.ts:66, layers/journal/tenant.config.ts:102, layers/marquee/tenant.config.ts:29, layers/midden/tenant.config.ts:148, layers/commons/tenant.config.ts:22, shared/manifest.ts:19, layers/commons/tests/e2e/commons.spec.ts:2, shared/expand.ts:39, shared/expand.ts:191, shared/kinds.ts:1, shared/manifest.ts:36, CONTEXT.md:35, CONTEXT.md:70, layers/commons/CONTEXT.md:49]
  - id: C2
    text: Opting in keeps a tenant's private fields; the shared shape is a minimum set of fields added to the collection's own schema.
    kind: decision
    conflict: false
    refs: [shared/manifest.ts:19, layers/blog/tenant.config.ts:69, layers/marquee/tenant.config.ts:26, layers/journal/tenant.config.ts:106, shared/kinds.ts:26, shared/expand.ts:94, tests/unit/expand.spec.ts:163, tests/unit/kinds.spec.ts:1, CONTEXT.md:61, CONTEXT.md:70]
  - id: C3
    text: Code reads across tenants only through one shared read function (queryAcrossTenants / queryPages), never a manifest import or hard-coded tenant list.
    kind: decision
    conflict: false
    refs: [app/composables/catalog.ts:1, layers/commons/app/components/commons/Search.vue:5, layers/commons/app/components/commons/Timeline.vue:6, layers/commons/app/pages/t/commons/[space]/index.vue:10, layers/commons/nuxt.config.ts:4, "layers/blog/app/pages/t/blog/[space]/[...slug].vue:49", layers/commons/app/composables/timeline.ts:1, layers/commons/CONTEXT.md:32, CONTEXT.md:35]
  - id: C4
    text: The list of opted-in collections is built automatically at build time from the manifests, by the same step as routing; never hand-written.
    kind: mechanic
    home: modules/catalog.ts
    conflict: false
    refs: [modules/catalog.ts:1, modules/catalog.ts:38, shared/expand.ts:39, shared/expand.ts:175, shared/expand.ts:191, app/composables/catalog.ts:1, CONTEXT.md:229]
  - id: C5
    text: Which code may read across tenants - only a few governed aggregator views (Commons), or any tenant? Who decides the set?
    kind: decision
    conflict: true
    conflict_sides:
      - "CONTEXT.md:238 - normal Tenants never read across; only a small, governed set of Aggregators may"
      - "layers/blog/app/pages/t/blog/[space]/[...slug].vue:49 - the Blog, an ordinary tenant, reads Journal pages via queryPages, sanctioned by ADR-0025"
    refs: [CONTEXT.md:238, "layers/blog/app/pages/t/blog/[space]/[...slug].vue:49", layers/commons/tenant.config.ts:2, layers/commons/nuxt.config.ts:4, layers/commons/CONTEXT.md:9, CONTEXT.md:349]
  - id: C6
    text: A `kind` must name a known shape whose page/data type matches the collection's; a data collection needs a schema, a kind, or both; kind is separate from type.
    kind: mechanic
    home: shared/manifest.ts
    conflict: false
    refs: [shared/manifest.ts:36, shared/manifest.ts:104, shared/manifest.ts:123, tests/unit/expand.spec.ts:125, shared/manifest.ts:19, CONTEXT.md:61]
  - id: C7
    text: Which shared shapes exist - `page` (optional publish time and summary) and `session` (whole session-log shape).
    kind: mechanic
    home: shared/kinds.ts
    conflict: false
    refs: [shared/kinds.ts:1, shared/kinds.ts:64, tests/unit/kinds.spec.ts:1, layers/blog/tenant.config.ts:69, layers/marquee/tenant.config.ts:26, layers/journal/tenant.config.ts:106]
  - id: C8
    text: The session-log schema has one home and is the `session` shape; Journal sessions use it and log-session.ts validates against it.
    kind: mechanic
    home: shared/schemas/session.ts
    conflict: false
    refs: [shared/schemas/session.ts:1, shared/schemas/session.ts:4, layers/journal/tenant.config.ts:136, scripts/log-session.ts:68, shared/kinds.ts:64, docs/adr/0009-session-logs-commit-directly-to-main.md:11]
  - id: C9
    text: Cross-tenant reads see only committed, built-in content; nothing is fetched live (base rule is ADR-0001's).
    kind: decision
    conflict: false
    refs: [app/composables/catalog.ts:1, layers/commons/app/components/commons/Search.vue:5, layers/commons/app/components/commons/Timeline.vue:6, layers/commons/app/composables/timeline.ts:1, layers/commons/CONTEXT.md:29, modules/catalog.ts:1]
  - id: C10
    text: Why must a person merge changes to shared/kinds.ts, modules/catalog.ts and app/composables/catalog.ts? (full list lives in .claude/rules/adr-0004-human-merge.md)
    kind: decision
    conflict: false
    refs: [docs/adr/0004-objective-safety-gate.md:167, docs/adr/0004-objective-safety-gate.md:170, shared/kinds.ts:1, modules/catalog.ts:1, layers/commons/app/composables/timeline.ts:1]
  - id: C11
    text: Cross-tenant reading is read-only; nothing writes into another tenant.
    kind: decision
    conflict: false
    refs: [app/composables/catalog.ts:1, layers/commons/app/composables/timeline.ts:1, shared/expand.ts:175, CONTEXT.md:229, CONTEXT.md:238]
  - id: C12
    text: The shared read function stays generic; each aggregator owns how it turns rows into its view, as an ordinary edit to its own layer.
    kind: decision
    conflict: false
    refs: [app/composables/catalog.ts:1, layers/commons/app/composables/timeline.ts:1, layers/commons/app/pages/t/commons/[space]/index.vue:10, layers/commons/CONTEXT.md:32]
  - id: C13
    text: An aggregator never lists itself (its own pages carry no kind); a new cross-tenant view is a new Commons space, not a new tenant.
    kind: decision
    conflict: false
    refs: [layers/commons/tenant.config.ts:22, layers/commons/tenant.config.ts:2, layers/commons/tests/e2e/commons.spec.ts:2, layers/commons/CONTEXT.md:49]
  - id: C14
    text: Why shared shapes and one read path - one sanctioned way to look across tenants instead of a hard-coded list; copied schemas drift and importing internals couples tenants.
    kind: decision
    conflict: false
    refs: [layers/commons/CONTEXT.md:29, shared/kinds.ts:1, modules/catalog.ts:1, CONTEXT.md:61]
  - id: C15
    text: Every cross-tenant result links to the item's real page address; aggregators invent no URLs.
    kind: decision
    home: shared/routing.ts
    conflict: false
    refs: [shared/routing.ts:62, layers/commons/app/composables/timeline.ts:13, layers/commons/CONTEXT.md:29]
  - id: C16
    text: The read function trims rows to needed fields while fetching and tags each with tenant, space and collection; one type cast is accepted; typing results from the shape name is out of scope.
    kind: mechanic
    home: app/composables/catalog.ts
    conflict: false
    refs: [app/composables/catalog.ts:44, shared/expand.ts:175]
  - id: C17
    text: Timestamps are stored as UTC text ending in Z, not dates (unclear whether ADR-0025 decides this).
    kind: mechanic
    home: shared/schemas/timestamp.ts
    conflict: false
    refs: [shared/schemas/timestamp.ts:1]
