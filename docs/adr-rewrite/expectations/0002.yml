    conflict: false
  - id: manifest-checked-before-build
    text: A manifest is checked against a schema (and type-checked by the gate), so a mistake fails when the file is written, before any build.
    kind: mechanic
    home: shared/manifest.ts (validateManifest, collectionDefSchema); nuxt.config.ts typescript.tsConfig.include
    refs:
      - shared/manifest.ts:27
      - shared/manifest.ts:89
      - shared/manifest.ts:105
      - shared/manifest.ts:164
      - nuxt.config.ts:45
      - docs/adr/0025-cross-tenant-catalog-and-collection-kinds.md:84
    conflict: false
  - id: generator-or-not
    text: Does a generator write config files into the repo? Side A (0007, 0012, CONTEXT.md) says ADR-0002 has one writing content.config.ts and routing.generated.ts; side B (tenant configs, shared/manifest.ts) says nothing is generated. The rewrite must say whether ADR-0002 owns the generator or only the manifest decision.
    kind: decision
    home: null
    refs:
      - docs/adr/0007-generated-config-committed-drift-checked.md:19
      - docs/adr/0012-cross-persona-pingbacks-via-authored-denormalization.md:26
      - CONTEXT.md:51
      - layers/atlas/tenant.config.ts:7
      - layers/marquee/tenant.config.ts:7
      - layers/midden/tenant.config.ts:9
      - layers/journal/tenant.config.ts:3
      - shared/manifest.ts:164
    conflict: true
  - id: code-expands-cross-product
    text: Code, not people, turns each Tenant x Space x Collection combination into its own collection; nobody writes that list by hand.
    kind: mechanic
    home: shared/expand.ts (expand())
    refs:
      - shared/expand.ts:1
      - shared/manifest.ts:1
      - docs/adr/0013-dynamic-content-config-committed-routing-map.md:20
