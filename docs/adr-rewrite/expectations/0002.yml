    conflict: false
  - id: manifest-is-the-edit-surface
    text: Each Tenant is described by one small settings file, layers/<tenant>/tenant.config.ts, stating what it contains rather than how to build it; agents edit that file.
    kind: decision
    home: null
    refs:
      - shared/manifest.ts:1
      - nuxt.config.ts:45
      - layers/atlas/tenant.config.ts:7
      - layers/commons/tenant.config.ts:10
