    conflict: false
  - id: one-expansion-two-outputs
    text: One expansion feeds both the content collections and the URL routing map (mostly ADR-0014's mechanism, cited jointly).
    kind: mechanic
    home: shared/expand.ts; modules/routing.ts
    refs:
      - shared/expand.ts:1
      - layers/atlas/tenant.config.ts:7
