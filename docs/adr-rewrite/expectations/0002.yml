items:
  - id: one-place-for-collections
    text: Every content collection is defined in the root content.config.ts, built from the manifests; a Tenant's Nuxt layer only changes how things look and defines no collections.
    kind: decision
    home: null
    refs:
      - layers/atlas/nuxt.config.ts:8
      - layers/blog/nuxt.config.ts:7
      - layers/journal/nuxt.config.ts:8
