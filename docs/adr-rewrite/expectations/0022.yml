items:
  - id: C1
    text: A Trusted user starting the auto-triage sweep is a standing green-light, scoped to that run, to apply ready-for-agent without a per-issue human.
    kind: claim
    section: Summary
    refs: [.agents/skills/auto-triage/SKILL.md:67, docs/adr/0003-agent-operating-model-and-governance.md:73, docs/adr/0003-agent-operating-model-and-governance.md:85, docs/adr/0023-guest-driven-demo-pipeline.md:8, docs/adr/0023-guest-driven-demo-pipeline.md:65]
    conflict: false
    note: Unclear whether a scheduled Routine counts as "starting" (0003:85 says "scheduling"; 0023:65 includes a Routine).
  - id: C2
    text: The green-light covers only the Trusted-authored backlog; a Public-authored issue is never self-green-lit and goes to ready-for-human.
    kind: claim
    section: Summary
    refs: [.agents/skills/auto-triage/SKILL.md:67, docs/adr/0003-agent-operating-model-and-governance.md:73, docs/adr/0023-guest-driven-demo-pipeline.md:34, docs/adr/0023-guest-driven-demo-pipeline.md:37, docs/adr/0023-guest-driven-demo-pipeline.md:115]
    conflict: false
  - id: C3
    text: Merge stays gated; the resulting PRs pass the gate before merging, and the ADR names that boundary.
    kind: claim
    section: Scope and limits
    refs: [.agents/skills/auto-triage/SKILL.md:67, docs/adr/0003-agent-operating-model-and-governance.md:73, docs/adr/0003-agent-operating-model-and-governance.md:75]
    conflict: false
  - id: C4
    text: Which issues are a judgment call or genuine design uncertainty, and so go to ready-for-human (judgment-call bullets and uncertainty bullets)?
    kind: question
    section: Scope and limits
    refs: [.agents/skills/auto-triage/SKILL.md:48]
    conflict: false
  - id: C5
    text: A sweep fired from a Public context grants nothing.
    kind: claim
    section: Scope and limits
    refs: [docs/adr/0023-guest-driven-demo-pipeline.md:37, docs/adr/0023-guest-driven-demo-pipeline.md:34]
    conflict: false
  - id: C6
    text: Applying ready-for-agent is ADR-0003's implementation green-light; ADR-0022 adds auto-triage to ADR-0003's ledger as a chartered remit and is the one relaxation of it.
    kind: claim
    section: Summary
    refs: [docs/adr/0003-agent-operating-model-and-governance.md:70, docs/adr/0003-agent-operating-model-and-governance.md:73, .agents/skills/auto-triage/SKILL.md:67]
    conflict: false
  - id: C7
    text: Why is this relaxation safe (full rationale and bounds)?
    kind: question
    section: Why
    refs: [.agents/skills/auto-triage/SKILL.md:76]
    conflict: false
  - id: C8
    text: ADR-0023 is an additive exception, scoped to the demo, to ADR-0022's standing green-light; outside the demo ADR-0022 is unchanged.
    kind: claim
    section: See
    refs: [docs/adr/0023-guest-driven-demo-pipeline.md:8, docs/adr/0023-guest-driven-demo-pipeline.md:115, docs/agents/guest-contributions.md:12]
    conflict: false
  - id: C9
    text: A Public comment on a Trusted issue is data, not scope; what it asks for goes to ready-for-human, never into a brief.
    kind: claim
    section: Scope and limits
    refs: [.agents/skills/auto-triage/SKILL.md:67]
    conflict: false
  - id: C10
    text: ADR-0022 governs the issue-triage files (auto-triage Skill, triage-labels.md, issue-tracker.md).
    kind: claim
    section: See
    refs: [docs/diagrams/interactive-map/terrarium-overview.md:868]
    conflict: false
