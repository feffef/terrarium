      - docs/agents/guest-contributions.md:12
    conflict: false
  - id: merge-unchanged
    text: "Does the ADR change who merges the resulting PRs? No; they still pass the gate, and the ADR says where its approval stops."
    kind: decision
    refs:
      - .agents/skills/auto-triage/SKILL.md:67
      - docs/adr/0003-agent-operating-model-and-governance.md:70
      - docs/adr/0003-agent-operating-model-and-governance.md:75
    conflict: false
  - id: public-start-grants-nothing
    text: "Does a sweep started from a Public person's context approve anything? No."
    kind: decision
    refs:
      - docs/adr/0023-guest-driven-demo-pipeline.md:34
      - docs/adr/0023-guest-driven-demo-pipeline.md:37
    conflict: false
  - id: agent-vs-human-cases
    text: "When does the sweep send an issue to an agent, and when to a person? To an agent when the repo settles a concrete design; to a person on a judgment call or real design doubt, with both kinds of case listed in the ADR."
    kind: decision
    refs:
      - .agents/skills/auto-triage/SKILL.md:48
    conflict: false
  - id: public-comment-is-data
    text: "What happens to a Public person's comment on a Trusted issue? It is data, not scope; what it asks for goes to ready-for-human. Unclear whether the ADR or only the Skill holds this."
    kind: decision
    refs:
      - .agents/skills/auto-triage/SKILL.md:67
    conflict: false
  - id: fifth-ledger-job
    text: "Where does the sweep sit among the jobs that run on their own? It is the fifth job in ADR-0003's list and may add ready-for-agent itself."
    kind: decision
    refs:
      - docs/adr/0003-agent-operating-model-and-governance.md:70
      - docs/adr/0003-agent-operating-model-and-governance.md:73
    conflict: false
  - id: guest-demo-exception
    text: "Does the guest demo change this ADR? No; ADR-0023 is a bounded exception and ADR-0022 stands outside the demo. Unclear whether ADR-0022 should point to it."
    kind: decision
    refs:
