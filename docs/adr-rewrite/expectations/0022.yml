items:
  - id: trusted-start-approves
    text: "Who can let the triage sweep mark issues ready to build without asking each time? A Trusted person starting the sweep counts as approval for that run."
    kind: decision
    refs:
      - .agents/skills/auto-triage/SKILL.md:67
      - docs/adr/0003-agent-operating-model-and-governance.md:70
      - docs/adr/0003-agent-operating-model-and-governance.md:73
