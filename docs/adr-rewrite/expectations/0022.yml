      - docs/adr/0023-guest-driven-demo-pipeline.md:8
      - docs/adr/0023-guest-driven-demo-pipeline.md:65
      - docs/agents/guest-contributions.md:12
    conflict: true  # any Trusted user starting (SKILL:67, 0003:70) vs the owner scheduling (0003:85)
  - id: trusted-authored-only
    text: "Which issues does that approval cover? Only Trusted-authored ones; a Public person's issue is triaged but goes to ready-for-human."
    kind: decision
    refs:
      - .agents/skills/auto-triage/SKILL.md:67
      - docs/adr/0003-agent-operating-model-and-governance.md:70
      - docs/adr/0023-guest-driven-demo-pipeline.md:8
