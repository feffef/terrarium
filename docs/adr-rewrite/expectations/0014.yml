items:
  - id: derived-at-build
    text: The (Tenant, Space) to pages-collection map is derived from the manifests at prepare/build time; never committed, hand-written or produced by a generator script; no regenerate step.
    kind: decision
    home: null
    refs: [content.config.ts:12, layers/atlas/tenant.config.ts:7, layers/blog/tenant.config.ts:6, layers/marquee/tenant.config.ts:7, layers/midden/tenant.config.ts:9, layers/midden/app/utils/strata.ts:38, layers/midden/content/trench/artifacts/the-generator.yml:8, layers/midden/content/trench/artifacts/committed-routing-map.yml:8, shared/manifest.ts:150, shared/manifest.ts:163, tests/unit/expand.spec.ts:5, .claude/rules/adr-0002.md:13, docs/adr/0004-objective-safety-gate.md:82, modules/routing.ts:1, modules/routing.ts:35, docs/adr/0006-runtime-routing-path-prefix.md:6, docs/adr/0007-generated-config-committed-drift-checked.md:12, docs/adr/0007-generated-config-committed-drift-checked.md:15, docs/adr/0013-dynamic-content-config-committed-routing-map.md:14]
    conflict: false
  - id: one-expansion
    text: Content config, routing map and tests all run the same expand(loadManifests()), so they cannot disagree.
    kind: decision
    home: shared/expand.ts
    refs: [shared/expand.ts:6, content.config.ts:12, tests/support/e2e.ts:59, tests/support/e2e.ts:62, tests/unit/expand.spec.ts:5, modules/routing.ts:1, docs/adr/0025-cross-tenant-catalog-and-collection-kinds.md:36, docs/adr/0025-cross-tenant-catalog-and-collection-kinds.md:233, .claude/rules/adr-0002.md:13]
    conflict: false
  - id: routing-virtual-module
    text: The map reaches the app as the #routing import; modules/routing.ts writes .nuxt/routing.mjs (plain JS for the server bundler) and .nuxt/routing.d.ts with the exact literal type.
    kind: mechanic
    home: modules/routing.ts
    refs: [modules/routing.ts:1, modules/routing.ts:35, modules/routing.ts:49, shared/expand.ts:6, docs/adr/0006-runtime-routing-path-prefix.md:6, docs/adr/0007-generated-config-committed-drift-checked.md:12, docs/adr/0013-dynamic-content-config-committed-routing-map.md:14, docs/adr/0025-cross-tenant-catalog-and-collection-kinds.md:91]
    conflict: false
  - id: supersedes
    text: Which ADRs does this replace or change? It replaces the committed routing map (ADR-0007, kept by ADR-0013), changes only how ADR-0006's map is delivered, and makes ADR-0004's "generator" wording historical.
    kind: decision
    home: null
    refs: [docs/adr/0006-runtime-routing-path-prefix.md:4, docs/adr/0006-runtime-routing-path-prefix.md:6, docs/adr/0007-generated-config-committed-drift-checked.md:4, docs/adr/0007-generated-config-committed-drift-checked.md:12, docs/adr/0007-generated-config-committed-drift-checked.md:15, docs/adr/0013-dynamic-content-config-committed-routing-map.md:5, docs/adr/0013-dynamic-content-config-committed-routing-map.md:14, docs/adr/0004-objective-safety-gate.md:82]
    conflict: false
  - id: e2e-entry-routes
    text: The smoke test's route list comes from the same manifest expansion (entryRoutesFrom), so new Spaces are tested with no hand edits.
    kind: mechanic
    home: tests/support/e2e.ts
    refs: [tests/e2e/smoke.spec.ts:4, tests/support/e2e.ts:59, tests/support/e2e.ts:62, docs/adr/0004-objective-safety-gate.md:106, docs/adr/0006-runtime-routing-path-prefix.md:6, docs/adr/0016-tenant-root-layer-routes.md:33]
    conflict: true
    conflict_note: smoke.spec.ts:4 says derived at build time; tests/support/e2e.ts:59/62 say at test time.
  - id: no-drift-check
    text: Nothing generated is committed, so nothing can drift and no drift check or gate step is needed.
    kind: decision
    home: null
    refs: [layers/midden/content/stores/artifacts/the-drift-check.yml:11, layers/midden/content/trench/artifacts/the-drift-shim.yml:15, layers/midden/content/trench/artifacts/committed-routing-map.yml:8, docs/adr/0007-generated-config-committed-drift-checked.md:12, docs/adr/0013-dynamic-content-config-committed-routing-map.md:14]
    conflict: false
  - id: wiring-outside-nuxt
    text: How do tools outside Nuxt find #routing? tsconfig.node.json maps it to .nuxt/routing.d.ts (made by nuxt prepare on pnpm install); vitest.config.ts maps it to .nuxt/routing.mjs. Callers number these wiring points.
    kind: mechanic
    home: tsconfig.node.json, vitest.config.ts
    refs: [tsconfig.node.json:32, vitest.config.ts:21, modules/routing.ts:49, tests/unit/routing.spec.ts:130, docs/adr/0025-cross-tenant-catalog-and-collection-kinds.md:91]
    conflict: false
  - id: map-scope
    text: What does the map cover? Only Space routes and each Space's pages collection, for URL resolution; a Tenant's root page is outside it. Open whether it may serve as a full page list (sitemap).
    kind: decision
    home: null
    refs: [docs/adr/0016-tenant-root-layer-routes.md:33, docs/adr/0025-cross-tenant-catalog-and-collection-kinds.md:36, docs/adr/0025-cross-tenant-catalog-and-collection-kinds.md:233]
    conflict: false
  - id: reusable-pattern
    text: The build-time-module approach is a pattern other derived data may copy (as #catalog does).
    kind: decision
    home: null
    refs: [docs/adr/0025-cross-tenant-catalog-and-collection-kinds.md:91, docs/adr/0025-cross-tenant-catalog-and-collection-kinds.md:233]
    conflict: false
  - id: dev-watch
    text: How does a manifest edit reach a running dev server? The routing module keeps its own watch list, covering what Nuxt Content's config loader does not watch (issue #325).
    kind: mechanic
    home: modules/routing.ts
    refs: [content.config.ts:12, docs/adr/0025-cross-tenant-catalog-and-collection-kinds.md:233]
    conflict: false
  - id: default-map
    text: Route resolution reads the real built map by default when no map is passed in.
    kind: mechanic
    home: shared/routing.ts
    refs: [tests/unit/routing.spec.ts:130, tsconfig.node.json:32]
    conflict: false
