    kind: question
    section: Consequences
    conflict: false
    refs: [modules/routing.ts:49, modules/routing.ts:35, tsconfig.node.json:32, vitest.config.ts:21, .claude/rules/adr-0002.md:13, docs/adr/0025-cross-tenant-catalog-and-collection-kinds.md:91]
  - id: C7
    text: '"The ADR-0014 pattern" is reusable — a build-time module running expand(loadManifests()) that writes plain .mjs data plus a companion .d.ts to .nuxt/, wired as #routing is.'
    kind: claim
    section: Summary
    conflict: false
