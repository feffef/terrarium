  - id: auto-extend
    text: Nuxt loads every folder under layers/ on its own, so nuxt.config.ts keeps no list of layers; adding a Tenant is adding a folder (plus pnpm install). This made ADR-0002's 2026-07-05 extends amendment moot.
    kind: mechanic
    home: nuxt.config.ts
    refs:
      - nuxt.config.ts:8
      - docs/agents/tenant-layers.md:4
      - docs/adr/0002-manifest-driven-config-generation.md:6
      - shared/expand.ts:21
    conflict: false
  - id: typecheck-coverage
    text: Nuxt's own type check covers each layer's app/ and nuxt.config.*; only layers/*/tenant.config.* needs a hand-added include, and a test fails if that pattern stops matching a real file (issue #209 narrowed issue #93's check).
    kind: mechanic
    home: nuxt.config.ts (typescript.tsConfig.include); tests/unit/typecheck-coverage.spec.ts
    refs:
      - nuxt.config.ts:41
      - shared/expand.ts:21
      - tests/unit/typecheck-coverage.spec.ts:10
      - tests/unit/typecheck-coverage.spec.ts:51
    conflict: false
  - id: fix-in-place-vs-amend
    text: "Unclear: when may an ADR be fixed in place (a factual correction such as a renamed path) and when must a change be a new dated amendment (it reverses a decision)? Refs cannot show whether ADR-0018 states this."
    kind: decision
    refs:
