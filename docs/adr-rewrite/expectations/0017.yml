    text: How does code tell an agent's comment from a human's? A deliberate mark (header at body start, old two-line footer, or the tool's "Generated with Claude Code" line); a bare session link does not count; no mark means human.
    kind: mechanic
    home: scripts/provenance-header.ts (hasAuthorshipMarker); scripts/check-triage-drift.ts (isAiAuthored)
    refs: [scripts/check-triage-drift.ts:16, scripts/check-triage-drift.ts:111, .agents/skills/guest-intake/scripts/guest-intake-scan.ts:13, .agents/skills/guest-intake/scripts/guest-intake-scan.ts:117, .agents/skills/guest-intake/scripts/guest-intake-scan.ts:159, .agents/skills/guest-intake/scripts/guest-intake-scan.ts:191, .agents/skills/guest-intake/tests/unit/guest-intake-scan.spec.ts:79, scripts/last-comment-authors.ts:12, scripts/last-comment-authors.ts:28, .agents/skills/visitor-loop/scripts/owner-corrections.ts:16, scripts/audit-skills.ts:485, scripts/merge-pr.ts:155, docs/agents/github-integration.md:129, .agents/skills/guest-intake/SKILL.md:55, .agents/skills/guest-intake/SKILL.md:58, tests/unit/check-triage-drift.spec.ts:2, tests/unit/check-triage-drift.spec.ts:43, tests/unit/provenance-header.spec.ts:1]
    conflict: false
