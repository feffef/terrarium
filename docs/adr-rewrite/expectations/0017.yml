    text: 'What goes on a commit: last two lines "Co-Authored-By: <Model> <noreply@anthropic.com>" and "Claude-Session: <url>"; model from a known list; the last Claude-Session line is the commit''s own.'
    kind: mechanic
    home: scripts/provenance-footer.ts; scripts/git-helpers.ts (SESSION_TRAILER); scripts/session-trace.ts (formatModelId)
