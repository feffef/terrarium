  - id: covered-surfaces
    text: Which write paths are checked? The tool-call guard covers GitHub bodies and GitHub-API commits (create_or_update_file, push_files; merges excluded); the git hook covers local commits; log-session.ts writes its own trailer.
    kind: mechanic
