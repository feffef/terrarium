    text: 'Is the rule checked by code or left to agents? ADR-0020 says a behaviour agents keep, not enforceable by a check; the guard and guards.md say a guard enforces it and blocks writes.'
    kind: decision
    refs: [docs/adr/0020-requester-trust-tiers.md:125, scripts/github-provenance-guard.ts:1, docs/agents/guards.md:27]
    conflict: true
  - id: mark-vs-ai-notice
    text: 'Does the mark alone tell readers an AI wrote it, or is a written AI notice also needed? guest-build and guest-intake say the header alone; auto-triage keeps both the triage AI notice and the mark.'
    kind: decision
