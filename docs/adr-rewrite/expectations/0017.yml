    text: Why the header replaced a trailing footer on GitHub bodies (the footer fought the tool's own footer for the last line), and the tool's own "Generated with Claude Code" line stays and counts as an agent mark.
    kind: decision
    refs: [scripts/provenance-header.ts:1, scripts/provenance-header.ts:2, scripts/provenance-header.ts:59, scripts/github-provenance-guard.ts:27, tests/unit/provenance-header.spec.ts:1]
    conflict: false
