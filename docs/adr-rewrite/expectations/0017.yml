    kind: decision
    refs: [scripts/github-provenance-guard.ts:242, scripts/github-provenance-guard.ts:248, docs/agents/github-integration.md:60, docs/agents/issue-tracker.md:109, scripts/provenance-header.ts:26, scripts/provenance-footer.ts:186, scripts/log-session.ts:325, scripts/merge-pr.ts:155]
