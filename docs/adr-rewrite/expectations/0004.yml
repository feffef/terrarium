  - id: C11
    text: Every PR must pass the gate before it merges.
    kind: decision
    conflict: false
    refs: [.agents/skills/frictions-to-fixes/SKILL.md:13, .out-of-scope/ci-enforced-doc-invariants.md:35, CONTEXT.md:269, .github/workflows/gate.yml:1, .agents/skills/frictions-to-fixes/SKILL.md:268, README.md:41, docs/diagrams/interactive-map/terrarium-overview.md:870]
  - id: C12
    text: The gate checks only what a machine can check about the result; it can't judge a request's intent or catch harmful runtime behaviour, so a person's review at merge covers that.
    kind: decision
    conflict: false
    refs: [CONTEXT.md:269, SECURITY.md:24, docs/adr/0020-requester-trust-tiers.md:29, docs/adr/0020-requester-trust-tiers.md:115, docs/adr/0023-guest-driven-demo-pipeline.md:125, docs/adr/0026-gate-workflow-thin-shell.md:88, docs/research/public-readiness-review.md:47]
  - id: C13
    text: A PR from a Public author, a fork, or the guest pipeline needs a person to merge, whatever files it touches.
    kind: decision
    conflict: false
