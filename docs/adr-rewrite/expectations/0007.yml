    conflict: false
  - id: drift-pattern-precedent
    text: It set the pattern later checks copy. A derived file is committed and the gate checks that it still matches its source.
    kind: decision
    refs:
      - docs/adr/0024-build-time-mermaid-prerender.md:88
      - docs/adr/0012-cross-persona-pingbacks-via-authored-denormalization.md:26
