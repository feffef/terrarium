  - id: drift-check
    text: A check regenerates the output and fails if git diff shows a change (pnpm gen && git diff --exit-code, as pnpm gate:drift, the first gate step). That plain diff is the whole check.
    kind: mechanic
    home: scripts/generate.ts, package.json gate:drift, .github/workflows/gate.yml (all deleted per the refs)
    refs:
      - docs/adr/0013-dynamic-content-config-committed-routing-map.md:22
