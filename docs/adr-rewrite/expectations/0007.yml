    conflict: false
  - id: no-summary-rule
    text: Because ADR-0007 is replaced, it needs no summary rule, and the ADR rule validator skips it. It is unclear whether the skip keys on status or on number.
    kind: mechanic
    home: validator behind findAdrRuleProblems (file unclear); pinned by tests/unit/validate-adr-rules.spec.ts
    refs:
